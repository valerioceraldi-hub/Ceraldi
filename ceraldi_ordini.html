}
function prodottiSettore(){ return VIEW.settore === 'Tutti' ? CAT : CAT.filter(function(p){ return settoreDi(p) === VIEW.settore; }); }
function renderCategorie(){
  var base = prodottiSettore(), conta = {};
  base.forEach(function(p){ var c = catDi(p); conta[c] = (conta[c] || 0) + 1; });
  var nPref = base.filter(function(p){ return preferito(p.id); }).length, nCar = Object.keys(carr().righe).length, nSotto = base.filter(sottoScorta).length;
  var h = chip('Tutte', 'Tutte') + (nPref ? chip('__pref', '★ Preferiti', nPref) : '') + (nCar ? chip('__car', 'Nel carrello', nCar) : '') + (nSotto ? chip('__sotto', 'Sotto scorta', nSotto) : '');
  h += Object.keys(conta).sort(function(a, b){ return a.localeCompare(b, 'it'); }).map(function(c){ return chip(c, c.charAt(0) + c.slice(1).toLowerCase(), conta[c]); }).join('');
  document.getElementById('chipsCat').innerHTML = h;
  function chip(v, l, n){ return '<button class="chip' + (VIEW.cat === v ? ' active' : '') + '" data-c="' + esc(v) + '" onclick="VIEW.cat=this.dataset.c;VIEW.limite=60;renderCategorie();renderProdotti()">' + esc(l) + (n != null ? ' <span class="n">' + n + '</span>' : '') + '</button>'; }
}
function filtraProdotti(){
  var l = prodottiSettore(), q = VIEW.q;
  if(VIEW.cat === '__pref') l = l.filter(function(p){ return preferito(p.id); });
  else if(VIEW.cat === '__car') l = l.filter(function(p){ return inCarrello(p.id); });
  else if(VIEW.cat === '__sotto') l = l.filter(sottoScorta);
  else if(VIEW.cat !== 'Tutte') l = l.filter(function(p){ return catDi(p) === VIEW.cat; });
  if(q){
    var f = fornDi(q);
    if(f) l = l.filter(function(p){ return prezzoDi(p, f.nome) != null; });
    else if(/^\d{8,14}$/.test(q)) l = l.filter(function(p){ return barcodeHa(p, q); });
    else l = l.filter(function(p){ return cercaTutte(p.name + ' ' + (p.conf || '') + ' ' + catDi(p), q); });
    var qn = norm(q);
    l.sort(function(a, b){ var sa = norm(a.name).indexOf(qn) === 0, sb = norm(b.name).indexOf(qn) === 0; if(sa !== sb) return sa ? -1 : 1; return a.name.localeCompare(b.name, 'it'); });
  } else l = l.slice().sort(function(a, b){ var pa = preferito(a.id), pb = preferito(b.id); if(pa !== pb) return pa ? -1 : 1; return a.name.localeCompare(b.name, 'it'); });
  return l;
}
function renderProdotti(){
  var el = document.getElementById('prodotti');
  if(!CAT.length){ el.innerHTML = '<div class="loading"><span class="spinner"></span>Carico il catalogo…</div>'; return; }
  var l = filtraProdotti(), m = l.slice(0, VIEW.limite);
  var h = m.map(rigaProdotto).join('');
  if(l.length > m.length) h += '<button class="btn btn-s" style="margin-top:6px" onclick="VIEW.limite+=100;renderProdotti()">Mostra altri ' + (l.length - m.length) + '</button>';
  if(!l.length) h = '<div class="empty"><div class="ei">🔎</div><b>Nessun prodotto</b><p>' + (VIEW.q ? 'Nel catalogo non c\'è "' + esc(VIEW.q) + '".' : 'Niente in questa sezione.') + '</p>' +
    (VIEW.q && !U.lettura ? '<button class="btn btn-s" style="margin-top:14px" onclick="apriNuovoProdotto(VIEW.q)">+ Crea "' + esc(maiusc(VIEW.q)) + '"</button>' : '') + '</div>';
  el.innerHTML = h;
  cercaListini();
}
function rigaProdotto(p){
  var b = migliore(p), r = carr().righe['p' + p.id], nForn = prezziOrdinati(p).filter(function(x){ return !x.orfano; }).length;
  var meta = [p.conf, catDi(p)].filter(Boolean).join(' · ');
  var badges = (preferito(p.id) ? '<span class="bdg o">★</span>' : '') + (sottoScorta(p) ? '<span class="bdg r">sotto scorta · ne hai ' + p.giacenza + '</span>' : '') +
    (b.fisso ? '<span class="bdg b">📌 ' + esc(b.forn) + '</span>' : '') + (nForn > 1 ? '<span class="bdg n">' + nForn + ' fornitori</span>' : '') + (!b.forn ? '<span class="bdg o">senza prezzo</span>' : '');
  var dx = r ? '<span class="stp" onclick="event.stopPropagation()"><button aria-label="Meno" onclick="cambiaQ(\'p' + p.id + '\',-1)">−</button><b data-q="p' + p.id + '">' + r.qty + '</b><button aria-label="Più" onclick="cambiaQ(\'p' + p.id + '\',1)">+</button></span>'
    : (U.lettura ? '' : '<button class="add-b" aria-label="Aggiungi" onclick="event.stopPropagation();aggiungi(' + p.id + ')">+</button>');
  return '<div class="pr' + (r ? ' on' : '') + '" id="pr-' + p.id + '"><span class="pr-stripe"></span><div class="pr-main" onclick="apriProdotto(' + p.id + ')">' +
    '<div class="pr-name">' + evidenzia(p.name, VIEW.q) + '</div><div class="pr-meta">' + esc(meta) + '</div>' + (badges ? '<div class="pr-res">' + badges + '</div>' : '') + '</div>' +
    '<div class="pr-price"><div style="text-align:right"><div class="pp">' + (b.forn ? eur(b.prezzo) : '—') + '</div><div class="ps">' + esc(b.forn || 'nessun fornitore') + '</div></div>' + dx + '</div></div>';
}
function aggiornaRiga(id){ var el = document.getElementById('pr-' + id), p = CATMAP[id]; if(el && p){ var t = document.createElement('div'); t.innerHTML = rigaProdotto(p); el.replaceWith(t.firstChild); } }
function pulisciRicerca(){ var q = document.getElementById('q'); q.value = ''; VIEW.q = ''; document.getElementById('swBox').classList.remove('has'); renderProdotti(); }
function renderAvvisiOrdina(){
  var el = document.getElementById('ordinaAvvisi'); if(!el) return;
  var h = '', oggi = new Date().getDay(), daOrdinare = FORN.filter(function(f){ var g = extraForn(f.nome).giorni || []; return g.indexOf(oggi) >= 0; });

// Ricerca anche nei listini caricati dai fornitori (prodotti non ancora a catalogo)
var _listTimer = null, _listUltima = '';
function cercaListini(){
  var el = document.getElementById('listini'); if(!el) return;
  var q = VIEW.q;
  if(!q || q.length < 3 || fornDi(q) || /^\d{8,}$/.test(q)){ el.innerHTML = ''; return; }
  clearTimeout(_listTimer);
  _listTimer = setTimeout(async function(){
    if(_listUltima === q) return; _listUltima = q;
    var parole = norm(q).split(' ').filter(function(w){ return w.length >= 2; }).slice(0, 3);
    try{
      var r = await api('ceraldi_listino_locale?select=id,source,name,conf,cat,prices&name=ilike.' + encodeURIComponent('*' + parole.join('*') + '*') + '&limit=12');
      if(VIEW.q !== q) return;
      r = (r || []).filter(function(x){ return !CAT.some(function(p){ return norm(p.name) === norm(x.name); }); });
      window._listRis = r;
      el.innerHTML = r.length ? '<div class="sec-title">Nei listini dei fornitori <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">non ancora a catalogo</span></div><div class="grp">' + r.map(function(x, i){
        var pr = Object.keys(x.prices || {}).map(function(k){ return { f: k, v: num(x.prices[k]) }; }).filter(function(y){ return y.v; }).sort(function(a, b){ return a.v - b.v; })[0];
        return '<div class="row"><div class="row-main"><div class="row-t" style="font-size:14px">' + evidenzia(x.name, q) + '</div><div class="row-s">' + esc([x.conf, x.source].filter(Boolean).join(' · ')) + '</div></div><div class="row-r"><b style="color:var(--ink)">' + (pr ? eur(pr.v) : '') + '</b></div>' + (U.lettura ? '' : '<button class="add-b" onclick="daListino(' + i + ')">+</button>') + '</div>';
      }).join('') + '</div>' : '';
    }catch(e){ el.innerHTML = ''; }
  }, 350);
}
async function daListino(i){
  var x = (window._listRis || [])[i]; if(!x) return;
  var prices = {}; Object.keys(x.prices || {}).forEach(function(k){ var f = fornDi(k) || fornDi(x.source); if(f && num(x.prices[k])) prices[f.nome] = num(x.prices[k]); });
  if(!Object.keys(prices).length && fornDi(x.source)){ var v = Object.keys(x.prices || {}).map(function(k){ return num(x.prices[k]); }).filter(Boolean)[0]; if(v) prices[fornDi(x.source).nome] = v; }
  if(!(await conferma('Aggiungere al catalogo?', '<b>' + esc(x.name) + '</b> verrà creato nel catalogo' + (Object.keys(prices).length ? ' con il prezzo di ' + esc(Object.keys(prices).join(', ')) : '') + ' e messo nel carrello.', 'Crea e aggiungi'))) return;
  try{ var p = await nuovoProdotto({ name: x.name, conf: x.conf || '', cat: maiusc(x.cat || ''), prices: prices, settore: VIEW.settore !== 'Tutti' ? VIEW.settore : 'Bar' }); aggiungi(p.id); _listUltima = ''; renderOrdina(); if(p._esistente) toast('Era già in catalogo come ' + nomeBreve(p.name, 34) + ': messo nel carrello quello'); }
  catch(e){ toast('⚠️ ' + e.message); }
}

/* ── Carrello: aggiunta e quantità ───────────────────────────────── */
function aggiungi(id, qty, opz){
  if(U.lettura){ toast('Accesso in sola lettura'); return; }
  opz = opz || {};
  var p = CATMAP[id]; if(!p) return;
  var q = qty || p.qty_min || 1, k = 'p' + id;
  docModifica('or8_carrello', function(d){
    var r = d.righe[k];
    if(r){ r.qty = (r.qty || 0) + q; if(opz.da) r.da = (r.da || []).concat(opz.da); if(opz.nota) r.nota = opz.nota; if(opz.forn) r.forn = opz.forn; }
    else d.righe[k] = { id: id, nome: p.name, conf: p.conf || '', qty: q, forn: opz.forn || null, nota: opz.nota || p.nota_ordine || '', da: opz.da || [], at: new Date().toISOString() };
  });
  if(!opz.muto){ aggiornaRiga(id); aggiornaBarra(); toast(nomeBreve(p.name, 30) + ' × ' + q + ' nel carrello', { durata: 1500 }); }
}
function aggiungiProvvisorio(nome, conf, qty, opz){
  opz = opz || {};
  var k = 'x' + uid();
  docModifica('or8_carrello', function(d){ d.righe[k] = { id: null, nome: maiusc(nome), conf: conf || '', qty: qty || 1, forn: opz.forn || null, nota: opz.nota || '', da: opz.da || [], barcode: opz.barcode || null, at: new Date().toISOString() }; });
  return k;
}
function cambiaQ(k, d){
  var r = carr().righe[k]; if(!r) return;
  var nq = (r.qty || 1) + d;
  if(nq <= 0){ rimuoviRiga(k); return; }
  docModifica('or8_carrello', function(x){ if(x.righe[k]) x.righe[k].qty = Math.min(9999, nq); });
  document.querySelectorAll('[data-q="' + k + '"]').forEach(function(b){ b.textContent = nq; });
  aggiornaBarra(); if(document.getElementById('shCarr')) renderCarrello();
}
function rimuoviRiga(k, muto){
  var r = carr().righe[k]; if(!r) return;
  var copia = JSON.parse(JSON.stringify(r));
  docModifica('or8_carrello', function(d){ delete d.righe[k]; });
  if(r.id != null) aggiornaRiga(r.id);
  aggiornaBarra(); renderCategorie(); if(document.getElementById('shCarr')) renderCarrello();
  if(!muto) toast('Tolto ' + nomeBreve(r.nome, 26), { azione: 'Annulla', onAzione: function(){ docModifica('or8_carrello', function(d){ d.righe[k] = copia; }); if(copia.id != null) aggiornaRiga(copia.id); aggiornaBarra(); if(document.getElementById('shCarr')) renderCarrello(); } });
}
function aggiornaBarra(){
  var n = Object.keys(carr().righe).length, fb = document.getElementById('fbar'), vis = n > 0 && VIEW.tab === 'ordina';
  fb.classList.toggle('hidden', !vis); document.body.classList.toggle('has-fbar', vis);
  if(!n) return;
  var g = gruppiCarrello();
  document.getElementById('fbN').textContent = n;
  document.getElementById('fbT').textContent = 'Carrello · ' + eur(totaleCarrello());
  document.getElementById('fbSub').textContent = g.length === 1 ? (g[0].forn || 'Senza fornitore') : g.length + ' fornitori · rivedi e invia';
}

/* ── Scheda prodotto ─────────────────────────────────────────────── */
var _schedaId = null;
function apriProdotto(id){
  var p = CATMAP[id]; if(!p) return;
  _schedaId = id;
  apriSheet('shProd', { titolo: nomeBreve(p.name, 40), sotto: esc([p.conf, catDi(p), settoreDi(p)].filter(Boolean).join(' · ')), corpo: '<div id="prodBody"></div>', piede: '<div id="prodPiede"></div>', alto: true, onChiudi: function(){ _schedaId = null; } });
  renderScheda();
}
function renderScheda(){
  var p = CATMAP[_schedaId], b = document.getElementById('prodBody'); if(!p || !b) return;
  var m = migliore(p), lp = prezziOrdinati(p), ro = U.lettura;

  h += lp.length ? lp.map(function(x){

    rigaCampo('📝', 'Nota per il fornitore', p.nota_ordine || 'nessuna', 'nota_ordine') +
    '<label class="row"><div class="row-ico ic-o">★</div><div class="row-main"><div class="row-t">Preferito</div><div class="row-s">In cima alla lista e nel filtro Preferiti</div></div><span class="tgl"><input type="checkbox" ' + (preferito(p.id) ? 'checked' : '') + (ro ? ' disabled' : '') + ' onchange="togglePreferito(' + p.id + ',this.checked)"><span></span></span></label></div>';
  // Magazzino
  h += '<div class="sec-title">Magazzino</div><div class="grp"><div class="row"><div class="row-ico ic-b">📦</div><div class="row-main"><div class="row-t">Giacenza</div><div class="row-s">' + (p.giacenza == null ? 'mai contata' : 'ne hai ' + p.giacenza) + '</div></div><input class="num-in' + (p.giacenza != null ? ' filled' : '') + '" inputmode="numeric" value="' + (p.giacenza == null ? '' : p.giacenza) + '" placeholder="–" ' + (ro ? 'disabled' : '') + ' onchange="salvaNumero(' + p.id + ',\'giacenza\',this)"></div>' +
    '<div class="row"><div class="row-ico ic-r">⚠️</div><div class="row-main"><div class="row-t">Scorta minima</div><div class="row-s">Sotto questa quantità va riordinato · la usa anche Richieste</div></div><input class="num-in' + (p.scorta_min != null ? ' filled' : '') + '" inputmode="numeric" value="' + (p.scorta_min == null ? '' : p.scorta_min) + '" placeholder="–" ' + (ro ? 'disabled' : '') + ' onchange="salvaNumero(' + p.id + ',\'scorta_min\',this)"></div></div>';

  caricaStoricoPrezzi(p.id);

function rigaCampo(ico, t, s, campo){ return '<button class="row" ' + (U.lettura ? 'disabled' : '') + ' onclick="modificaCampo(\'' + campo + '\')"><div class="row-ico">' + ico + '</div><div class="row-main"><div class="row-t">' + t + '</div><div class="row-s">' + esc(s) + '</div></div><span class="chev">›</span></button>'; }
async function caricaStoricoPrezzi(id){

function togglePreferito(id, on){ docModifica('or8_conf', function(d){ d.preferiti = d.preferiti || {}; if(on) d.preferiti[id] = 1; else delete d.preferiti[id]; }); aggiornaRiga(id); renderCategorie(); }
async function salvaNumero(id, campo, el){
  var v = el.value.trim() === '' ? null : parseInt(el.value.replace(/\D/g, ''), 10);
  if(v != null && isNaN(v)) v = null;
  try{ var c = {}; c[campo] = v; await aggiornaProdotto(id, c); el.classList.toggle('filled', v != null); toast('Salvato ✓', { durata: 1200 }); aggiornaRiga(id); }
  catch(e){ toast('⚠️ ' + e.message); }
}
async function modificaCampo(campo){
  var p = CATMAP[_schedaId]; if(!p) return;
  var lab = { qty_min: ['Quantità di solito', 'Quanti ne ordini di solito (vuoto = 1)'], nota_ordine: ['Nota per il fornitore', 'Esce nel messaggio e nel PDF'] }[campo];
  var v = await chiediTesto(lab[0], lab[1], p[campo] == null ? '' : p[campo], campo === 'qty_min' ? 'Es. 6' : 'Es. solo bottiglie in vetro');
  if(v === null) return;
  var c = {}; c[campo] = campo === 'qty_min' ? (v === '' ? null : Math.max(1, parseInt(v, 10) || 1)) : (v || null);

function menuPrezzo(chiave){

  doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.text('Data: ' + new Date(s.id || Date.now()).toLocaleDateString('it-IT'), 195, y, { align: 'right' });
  doc.setFontSize(9); doc.setTextColor(90); doc.text('Rif. ordine: ' + codiceOrdine(s.id || Date.now()) + ' — da riportare in fattura', 15, y + 5); doc.setTextColor(0); y += 4;

    if(cp){ doc.text(String(i.conf || ''), col[1], y); doc.text(String(i.qty), col[2], y); doc.text(i.price ? i.price.toFixed(2) : '—', col[3], y, { align: 'right' }); doc.text(i.price ? (i.price * i.qty).toFixed(2) : '—', col[4], y, { align: 'right' }); }

function condividiPDF(forn, s, titolo){

/* ══════════════════════════════════════════════════════════════════
   PARTE 3b · QUALE FATTURA VA CON QUALE ORDINE
   Non mi fido del prezzo (cambia) né del totale (il fornitore può non
   consegnare tutto, o fare una fattura sola per più consegne). Guardo:
   1. riferimento esplicito (numero d'ordine o data del DDT, se Fatture
      li manda) → abbinamento certo
   2. QUALI prodotti ci sono (stesso prodotto anche scritto in modo
      diverso) e in che quantità (anche pezzi ↔ cartoni)
   3. la data: la fattura arriva il giorno dell'ordine o dopo, quasi mai
      oltre 5 settimane
   Poi "consumo" le righe: ogni riga di fattura copre al massimo la
   quantità ordinata, il resto va all'ordine successivo. Così funziona
   anche quando il fornitore manda una fattura sola per più ordini
   (fattura differita di fine mese) o divide un ordine in più fatture.
   Un abbinamento confermato o cambiato a mano vince sempre.
   ══════════════════════════════════════════════════════════════════ */
var GIORNO = 86400000;
// Righe che non sono merce: spese, trasporto, cauzioni, imballi, sconti, bolli…
function rigaServizio(desc){ return /\b(SPESE|SPESA|TRASPORTO|TRASP|CONSEGNA|CAUZION\w*|VUOT\w*|IMBALL\w*|CONAI|CONTRIBUT\w*|BOLLO|SCONTO|ABBUONO|ARROTONDAMENTO|COMMISSION\w*|NOLEGGIO|ACCISA|INCASSO)\b/i.test(String(desc || '')); }
function _giorno(s){ if(!s) return null; var t = Date.parse(String(s).length <= 10 ? s + 'T12:00:00Z' : s); return isNaN(t) ? null : t; }
// Quanto una riga d'ordine e una riga di fattura sono lo stesso prodotto: 0 = no, 3 = certo
function forzaProdotto(it, riga){
  if(it.id != null && riga.product_id != null) return it.id === riga.product_id ? 3 : 0;
  var r = DUP.confronta(it.name, riga.descrizione, {});
  if(r.livello === 'sicuro') return 3;
  if(r.livello === 'probabile') return 2;
  if(r.livello === null && /formato|pezzi|zero|contenitore|numeri|invecchiamento/.test(r.motivo || '')) return 0;
  var s = typeof somiglianza === 'function' ? somiglianza(it.name, riga.descrizione) : 0;
  return s >= 75 ? 2 : (s >= 55 ? 1 : 0);
}
// Quantità della fattura riportata nell'unità dell'ordine (pezzi ↔ cartoni)
function qtaInUnitaOrdine(it, riga){
  var q = Number(riga.qta) || 0, o = Number(it.qty) || 0; if(!q || !o) return q;
  if(Math.abs(q - o) < 0.01) return q;
  var pk = DUP.analizza(it.name).pack || DUP.analizza(riga.descrizione).pack;
  if(pk && pk > 1 && Math.abs(q / pk - Math.round(q / pk)) < 0.01 && q >= pk) return q / pk;   // fatturati a pezzi, ordinati a cartoni
  return q;
}
/* ordini: [{id, data (ms), items:[{id,name,qty,price}]}]
   fatture: [{id, numero, data (ms), importo, rifOrdine, ddtData, righe:[{id, descrizione, qta, prezzo, product_id}]}]
   manuali: { idOrdine: [idFattura, ...] | [] (= nessuna fattura) }
   → { perOrdine: { idOrdine: { fatture:[{id, quota}], righe:[...], certezza } }, extra: {idFattura: [righe non ordinate]} } */
function abbinaFattureOrdini(ordini, fatture, manuali){
  manuali = manuali || {};
  var resto = {};   // quantità di ogni riga di fattura non ancora assegnata

/* ══════════════════════════════════════════════════════════════════

var VA = { giorni: 90 };

  h += barre('Per categoria', cat, 8);

  h += '<div class="sec-title">I prodotti che pesano di più</div><div class="grp">' + top.map(function(n, i){ return '<div class="row"><div class="row-ico" style="font-weight:800;font-size:13px">' + (i + 1) + '</div><div class="row-main"><div class="row-t" style="font-size:14px">' + esc(n) + '</div><div class="row-s">' + prod[n].q + ' pezzi ordinati</div></div><b class="tnum">' + eur(prod[n].v) + '</b></div>'; }).join('') + '</div>';

function barre(titolo, mappa, max){

}
function graficoMesi(){

  var svg = '<svg viewBox="0 0 ' + w + ' ' + (hh + 26) + '" preserveAspectRatio="none" role="img" aria-label="Spesa per mese">';
  mesi.forEach(function(m, i){ var h = m.v / max * hh, x = i * bw + bw * .18; svg += '<rect x="' + x.toFixed(1) + '" y="' + (hh - h).toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + Math.max(h, m.v ? 2 : 0).toFixed(1) + '" rx="3" fill="' + (i === 11 ? '#007AFF' : '#8E8E93') + '" opacity="' + (i === 11 ? 1 : .45) + '"><title>' + m.l + ': ' + eur0(m.v) + '</title></rect><text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (hh + 16) + '" text-anchor="middle" font-size="9" fill="#8E8E93" font-family="Inter,sans-serif">' + m.l.replace('.', '') + '</text>'; });
  return '<div class="chart">' + svg + '</svg><div class="muted" style="font-size:11.5px;text-align:center;margin-top:2px">Mese più alto: ' + eur0(max) + '</div></div>';

async function eliminaFornitore(id){

  var escl = CAT.filter(function(p){ var k = Object.keys(p.prices || {}).filter(function(x){ return num(p.prices[x]); }); return k.length === 1 && chiavePrezzo(p, f.nome) != null; });

  if(!(await conferma('Eliminare ' + esc(f.nome) + '?', escl.length + ' prodotti venduti solo da lui vanno nel cestino con lui; da altri ' + cond.length + ' tolgo solo il suo prezzo. Tutto recuperabile per 30 giorni da "Fornitori eliminati".', 'Elimina', true))) return;
  try{
    await api('fornitori_cestino', { method: 'POST', prefer: 'return=minimal', body: { fornitore: f.nome, fornitore_meta: { name: f.nome, whatsapp: f.whatsapp || '', email: f.email || '', settori: f.settori, extra: extraForn(f.nome) }, prodotti_eliminati: escl, prodotti_modificati: cond.map(function(p){ return { id: p.id, prices: p.prices, best: p.best }; }) } });
  }catch(e){ toast('⚠️ Copia di recupero non salvata, non elimino nulla: ' + e.message); return; }
  toast('Elimino…', { durata: 60000 });
  var err = 0;
  for(var i = 0; i < cond.length; i++){ try{ await impostaPrezzo(cond[i].id, chiavePrezzo(cond[i], f.nome), null); }catch(e){ err++; } }
  for(var j = 0; j < escl.length; j += 60){ var ids = escl.slice(j, j + 60).map(function(p){ return p.id; }); try{ await api('catalogo_ceraldi?id=in.(' + ids.join(',') + ')', { method: 'DELETE' }); await api('prezzi_ceraldi?product_id=in.(' + ids.join(',') + ')', { method: 'DELETE' }); CAT = CAT.filter(function(p){ return ids.indexOf(p.id) < 0; }); }catch(e){ err++; } }
  try{ await api('fornitori_ordini?id=eq.' + id, { method: 'DELETE' }); FORN = FORN.filter(function(x){ return x.id !== id; }); lsSet('or8_forn', FORN); }catch(e){ err++; }
  indicizza(); salvaCatCache(); renderOrdina();
  toast(err ? '⚠️ Eliminato con ' + err + ' errori: riprova' : f.nome + ' eliminato · recuperabile per 30 giorni'); apriFornitori();
}

async function bloccaTranne(Z, bytes, col, nRighe){

async function confrontaImport(){
  apriSheet('shImpR', { titolo: 'Controlla prima di applicare', sotto: esc(IMP.forn) + ' · ' + IMP.righe.length + ' righe', alto: true, corpo: '<div class="loading"><span class="spinner"></span>Confronto con il catalogo…</div>' });
  var daRic = [], idx = [];
  IMP.esiti = IMP.righe.map(function(r, i){
    var p = r.id && CATMAP[r.id] ? CATMAP[r.id] : null;
    if(!p){ daRic.push(r.nome + (r.conf && r.nome.indexOf(r.conf.toUpperCase()) < 0 ? ' ' + r.conf : '')); idx.push(i); }
    return { r: r, p: p, tipo: p ? 'esatto' : null };
  });
  if(daRic.length){ var ris = await riconosci(daRic, idx.map(function(i){ return { forn: IMP.forn, prezzo: IMP.righe[i].prezzo * (IMP.iva === 'esclusa' ? 1.22 : 1) }; })); ris.forEach(function(m, j){ var e = IMP.esiti[idx[j]]; if(m.id && CATMAP[m.id]){ e.p = CATMAP[m.id]; e.tipo = m.tipo; } else if(m.cand && m.cand[0] && m.cand[0].s >= 45){ e.p = m.cand[0].c; e.tipo = 'probabile'; } }); }
  IMP.esiti.forEach(function(e){
    var p = e.p, prezzo = e.r.prezzo;
    if(IMP.iva === 'esclusa'){ var al = num(p && p.iva) || 22; prezzo = Math.round(prezzo * (1 + al / 100) * 10000) / 10000; }
    e.prezzo = prezzo;
    if(!p){ e.gruppo = 'nuovo'; e.sel = false; return; }
    e.att = prezzoDi(p, IMP.forn);
    if(e.tipo !== 'esatto'){ e.gruppo = 'incerto'; e.sel = false; return; }
    if(e.att == null){ e.gruppo = 'aggiunto'; e.sel = true; }
    else if(Math.abs(e.att - prezzo) < 0.005){ e.gruppo = 'uguale'; e.sel = false; }
    else { e.gruppo = 'cambiato'; e.sel = Math.abs((prezzo - e.att) / e.att) < 0.4; }
  });
  // stesso prodotto presente due volte nel file: tengo solo la prima
  var visti = {}; IMP.esiti.forEach(function(e){ if(e.p && e.gruppo !== 'nuovo'){ if(visti[e.p.id]){ e.gruppo = 'doppio'; e.sel = false; } visti[e.p.id] = 1; } });
  renderImport();
}
function renderImport(){
  var b = corpoSheet('shImpR'); if(!b) return;
  var G = [['cambiato', 'Prezzo cambiato', 'Aggiorno il prezzo di ' + IMP.forn], ['aggiunto', 'Prezzo nuovo per ' + IMP.forn, 'Il prodotto c\'è già ma non da questo fornitore'], ['incerto', 'Da verificare', 'Nome simile ma non identico: spunta solo se è lo stesso prodotto'], ['nuovo', 'Non a catalogo', 'Spunta per crearli come prodotti nuovi'], ['uguale', 'Già uguali', 'Nessuna modifica'], ['doppio', 'Ripetuti nel file', 'Già presi una volta']];
  var h = '';
  G.forEach(function(g){
    var l = IMP.esiti.map(function(e, i){ return { e: e, i: i }; }).filter(function(x){ return x.e.gruppo === g[0]; });
    if(!l.length) return;
    var chiuso = (g[0] === 'uguale' || g[0] === 'doppio');
    h += '<div class="sec-title">' + g[1] + ' · ' + l.length + (chiuso ? '' : '<button class="lnk" onclick="selImport(\'' + g[0] + '\')">Tutti / nessuno</button>') + '</div><p class="hint" style="margin:-4px 4px 8px">' + g[2] + '</p>';
    if(chiuso){ h += '<div class="grp"><div class="row"><div class="row-main row-s">' + l.slice(0, 3).map(function(x){ return esc(x.e.r.nome); }).join(', ') + (l.length > 3 ? '…' : '') + '</div></div></div>'; return; }
    h += '<div class="grp">' + l.slice(0, 300).map(function(x){
      var e = x.e, v = e.att ? (e.prezzo - e.att) / e.att * 100 : null;
      return '<label class="imp-row"><input type="checkbox" ' + (e.sel ? 'checked' : '') + ' onchange="IMP.esiti[' + x.i + '].sel=this.checked;piedeImport()"><div class="row-main"><div class="row-t" style="font-size:13.5px">' + esc(e.r.nome) + '</div>' +
        (e.p && e.gruppo !== 'cambiato' && e.gruppo !== 'aggiunto' ? '<div class="row-s">→ ' + esc(e.p.name) + '</div>' : (e.p && norm(e.p.name) !== norm(e.r.nome) ? '<div class="row-s">→ ' + esc(e.p.name) + '</div>' : '')) +
        (v != null && Math.abs(v) >= 40 ? '<div class="row-s" style="color:var(--orange-ink)">⚠️ differenza grande: controlla l\'unità</div>' : '') + '</div>' +
        '<div style="text-align:right;flex-shrink:0">' + (e.att != null ? '<span class="muted" style="font-size:12px;text-decoration:line-through">' + eur(e.att) + '</span><br>' : '') + '<b class="tnum">' + eur(e.prezzo) + '</b>' + (v != null ? '<br><span class="' + (v > 0 ? 'var-up' : 'var-dn') + '" style="font-size:11.5px">' + (v > 0 ? '+' : '') + v.toFixed(1) + '%</span>' : '') + '</div></label>';
    }).join('') + '</div>';
  });
  b.innerHTML = h || '<div class="empty"><b>Niente da importare</b></div>';
  var ft = document.querySelector('#shImpR .sheet-ft'); if(!ft){ var s = document.querySelector('#shImpR .sheet'); ft = document.createElement('div'); ft.className = 'sheet-ft'; s.appendChild(ft); }
  piedeImport();
}
function selImport(g){ var l = IMP.esiti.filter(function(e){ return e.gruppo === g; }), tutti = l.every(function(e){ return e.sel; }); l.forEach(function(e){ e.sel = !tutti; }); renderImport(); }
function piedeImport(){
  var ft = document.querySelector('#shImpR .sheet-ft'); if(!ft) return;
  var n = IMP.esiti.filter(function(e){ return e.sel; }).length;
  ft.innerHTML = '<button class="btn btn-p" ' + (n || IMP.salvaListino ? '' : 'disabled') + ' onclick="applicaImport()">' + (n ? 'Applica ' + n + ' modifiche' : 'Salva solo il listino') + '</button>';
}
async function applicaImport(){
  var sel = IMP.esiti.filter(function(e){ return e.sel; }), ok = 0, nuovi = 0, err = 0;
  var b = corpoSheet('shImpR'); b.innerHTML = '<div class="loading"><span class="spinner"></span><span id="impProg">Applico…</span></div><div class="prog"><i id="impBar" style="width:0"></i></div>';
  var ft = document.querySelector('#shImpR .sheet-ft'); if(ft) ft.innerHTML = '';
  var sett = (fornDi(IMP.forn) || {}).settori || [];
  for(var i = 0; i < sel.length; i++){
    var e = sel[i];
    try{
      if(e.gruppo === 'nuovo'){ var m = {}; m[IMP.forn] = e.prezzo; var np = await nuovoProdotto({ name: e.r.nome, conf: e.r.conf || '', prices: m, settore: sett[0] || 'Bar' }); if(np._esistente) ok++; else nuovi++; }
      else { if(e.gruppo === 'incerto') salvaAlias(e.r.nome, e.p.id); await impostaPrezzo(e.p.id, IMP.forn, e.prezzo); ok++; }
    }catch(x){ err++; _registraErrore('import', e.r.nome + ': ' + x.message); }
    var pr = document.getElementById('impProg'), bar = document.getElementById('impBar'); if(pr) pr.textContent = 'Applico… ' + (i + 1) + '/' + sel.length; if(bar) bar.style.width = Math.round((i + 1) / sel.length * 100) + '%';
  }
  if(IMP.salvaListino){
    try{
      await api('ceraldi_listino_locale?source=eq.' + encodeURIComponent(IMP.forn), { method: 'DELETE' });
      var rows = IMP.esiti.map(function(e){ var pz = {}; pz[IMP.forn] = e.prezzo; return { source: IMP.forn, name: e.r.nome, conf: e.r.conf || '', cat: e.p ? catDi(e.p) : '', prices: pz }; });
      for(var j = 0; j < rows.length; j += 300) await api('ceraldi_listino_locale', { method: 'POST', prefer: 'return=minimal', body: rows.slice(j, j + 300) });
    }catch(x){ toast('⚠️ Listino cercabile non salvato: ' + x.message); }
  }
  chiudiSheet('shImpR'); renderOrdina();
  toast(ok + ' prezzi aggiornati' + (nuovi ? ', ' + nuovi + ' prodotti nuovi' : '') + (err ? ' · ' + err + ' errori (vedi Diagnostica)' : '') + ' ✓', { durata: 5000 });
}

/* ── Assistente (funzione ordini-assistente, sola lettura) ───────── */
var CHAT = [];
function apriAssistente(){
  apriSheet('shAss', { titolo: 'Assistente', sotto: 'Chiedi di prezzi, spesa, fornitori · legge i dati, non modifica nulla', alto: true, corpo: '<div class="chat-log" id="chatLog"></div>',
    piede: '<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:8px" id="chatSug"></div><div style="display:flex;gap:8px"><input class="inp" id="chatIn" placeholder="Scrivi una domanda…" style="border-radius:99px" onkeydown="if(event.key===\'Enter\')chiediAssistente()"><button class="add-b" style="width:46px;height:46px;flex-shrink:0" onclick="chiediAssistente()" aria-label="Invia">↑</button></div>' });
  renderChat();
  document.getElementById('chatSug').innerHTML = ['Quanto ho speso questo mese?', 'Chi conviene per le birre?', 'Prezzi aumentati di recente', 'Ogni quanto ordino l\'acqua?'].map(function(q){ return '<button class="chip" style="flex:0 0 auto" onclick="document.getElementById(\'chatIn\').value=this.textContent;chiediAssistente()">' + esc(q) + '</button>'; }).join('');
}
function renderChat(){ var l = document.getElementById('chatLog'); if(!l) return; l.innerHTML = CHAT.length ? CHAT.map(function(m){ return '<div class="bub ' + (m.role === 'user' ? 'u' : 'a') + '">' + esc(m.content) + '</div>'; }).join('') : '<div class="empty"><div class="ei">✨</div><b>Chiedimi qualcosa</b><p>Rispondo usando i dati veri di catalogo, ordini e fatture.</p></div>'; var bd = corpoSheet('shAss'); if(bd) bd.scrollTop = bd.scrollHeight; }
async function chiediAssistente(){
  var i = document.getElementById('chatIn'), q = i.value.trim(); if(!q) return;
  i.value = ''; CHAT.push({ role: 'user', content: q }); CHAT.push({ role: 'assistant', content: '…' }); renderChat();
  try{
    await _authPronto();
    var r = await fetch(SB_URL + '/functions/v1/ordini-assistente', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + _authToken() }, body: JSON.stringify({ messages: CHAT.slice(0, -1).slice(-12) }) });
    var j = await r.json();
    CHAT[CHAT.length - 1].content = j.reply || ('Non sono riuscito a rispondere' + (j.error ? ': ' + j.error : '.'));
  }catch(e){ CHAT[CHAT.length - 1].content = 'Nessuna connessione con l\'assistente.'; }
  renderChat();
}

/* ══════════════════════════════════════════════════════════════════
   PARTE 8 · AVVIO, SINCRONIZZAZIONE, NAVIGAZIONE
   ══════════════════════════════════════════════════════════════════ */
async function avvia(){
  document.getElementById('appMark').style.background = APP.markBg;
  document.getElementById('appMark').innerHTML = APP.markSvg;
  U.email = (_authSess.user && _authSess.user.email) || ''; U.uid = (_authSess.user && _authSess.user.id) || '';
  U.nome = (ACC.nome || '').trim() || U.email.split('@')[0]; U.admin = !!ACC.admin; U.lettura = !!ACC.lettura;
  document.getElementById('hdrSub').innerHTML = 'Ciao ' + esc(U.nome.split(' ')[0]) + ' <span class="app-ver">v' + APP_VERSION + '</span>';
  // Dati salvati sul telefono: l'app si apre subito, anche senza rete
  CAT = lsGet('or8_cat', null) || lsGet('bp_supabase_cache', []) || []; indicizza();
  FORN = lsGet('or8_forn', []); STORICO = lsGet('or8_storico', []); RICH = lsGet('or8_rich', []);
  Object.keys(DOC_DEFAULT).forEach(docDaCache);
  misuraHeader(); renderTutto();
  document.getElementById('q').addEventListener('input', debounce(function(){ VIEW.q = this.value.trim(); VIEW.limite = 60; document.getElementById('swBox').classList.toggle('has', !!VIEW.q); renderProdotti(); }, 140));
  await sincronizza(false);
  await migraDaV7();
  window.addEventListener('online', function(){ svuotaOutbox(); docInviaTutti(); sincronizza(false); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ docInviaTutti(); return; } if(Date.now() - STATO_SYNC.ultimo > 90 * 1000) sincronizza(false); });
  setInterval(function(){ if(!document.hidden) aggiornaLeggero(); }, 120 * 1000);
  if(navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', function(ev){ var d = ev.data || {}; if(d.tipo !== 'ceraldi-notifica') return; if(ev.ports && ev.ports[0]) ev.ports[0].postMessage('ok'); if(String(d.link || '').indexOf('#da-fare') >= 0){ aggiornaLeggero().then(function(){ vaiTab('dafare'); }); } });
  if(location.hash === '#da-fare') vaiTab('dafare');
  ntfRegistra(); setTimeout(controllaVersione, 5000);
  if(U.lettura) toast('Accesso in sola lettura', { durata: 3500 });
}
var _syncInCorso = null;
async function sincronizza(manuale, completo){
  if(_syncInCorso) return _syncInCorso;
  var ico = document.getElementById('syncIco'); if(ico){ ico.classList.remove('spin'); void ico.offsetWidth; ico.classList.add('spin'); }
  _syncInCorso = (async function(){
    var errori = [];
    function prova(p, nome){ return p.catch(function(e){ errori.push({ nome: nome, e: e }); }); }
    await prova(caricaFornitori(), 'fornitori');
    await Promise.all([prova(caricaCatalogo(completo), 'catalogo'), prova(caricaStorico(), 'ordini'), prova(caricaRichieste(), 'richieste'), prova(caricaPF(), 'fatture'), prova(caricaPD(), 'contestazioni'),
      prova(caricaProfili(), 'profili'), prova(caricaAliasTabella(), 'alias')].concat(Object.keys(DOC_DEFAULT).map(function(n){ return prova(docCarica(n), n); })));
    STATO_SYNC.ultimo = Date.now();
    var rete = errori.filter(function(x){ return x.e && x.e.rete; }).length;
    if(errori.length){
      errori.forEach(function(x){ if(!x.e.rete) _registraErrore('sync', x.nome + ': ' + x.e.message); });
      if(manuale || !CAT.length) toast(rete ? 'Senza connessione: uso i dati salvati sul telefono' : '⚠️ Non aggiornato: ' + errori.map(function(x){ return x.nome; }).join(', '));
    } else if(manuale) toast('Tutto aggiornato ✓', { durata: 1400 });
    segnalaSync(rete ? 'Senza connessione' : '');
    await svuotaOutbox();
    renderTuttoSicuro();
    if(!U.lettura){ await caricaBarcode(); try{ await caricaMemoriaFatture(); }catch(e){} if(await ricontrollaAbbinamenti()) renderTuttoSicuro(); else if(MEMF.conflitti.length) renderTuttoSicuro(); }
    if(!U.lettura && PF.some(function(r){ return r.stato === 'pending'; })){
      var auto = await processaPending();
      await risolviPrezziUguali();
      if(auto) toast(auto + ' prezzi aggiornati in automatico dalle fatture (variazioni entro l\'1%)', { durata: 3500 });
      renderTuttoSicuro();
    } else if(!U.lettura) risolviPrezziUguali().then(renderTuttoSicuro);
    if(!U.lettura && conf().doppioniAuto){ var nu = await uniscitiDaSolo(); if(nu){ toast('Ho unito ' + nu + ' doppioni del catalogo (vedi Da fare)', { durata: 3500 }); renderTuttoSicuro(); } }
  })();
  try{ await _syncInCorso; } finally { _syncInCorso = null; }
}
async function aggiornaLeggero(){

}

/* ── Migrazione dalla versione 7 (una volta sola, per tutti i dispositivi) ── */
async function migraDaV7(){
  if(U.lettura || conf().migratoV7 || !DOC.or8_conf.letto) return;
  var vecchio = null;
  try{ var r = await api('ceraldi_stato_condiviso?select=data&id=eq.main'); vecchio = r && r[0] ? r[0].data : null; }catch(e){ return; }
  if(!vecchio) vecchio = lsGet('co_state_v1', null);
  var n = 0;
  if(vecchio){
    var ov = vecchio.orderSupOverride || {}, note = vecchio.cartNotes || {};
    function converti(mappa){ var out = {}; Object.keys(mappa || {}).forEach(function(k){ var it = mappa[k], pr = it && it.product; if(!pr) return; var id = parseInt(k, 10), p = CATMAP[id]; if(p) out['p' + id] = { id: id, nome: p.name, conf: p.conf || '', qty: it.qty || 1, forn: ov[k] || null, nota: note[k] || '', da: [], at: new Date().toISOString() }; else out['x' + uid()] = { id: null, nome: maiusc(pr.name), conf: pr.conf || '', qty: it.qty || 1, forn: ov[k] || null, nota: note[k] || '', da: [] }; n++; }); return out; }
    var righe = converti(vecchio.cart), sal = converti(vecchio.savedForLater);
    if(Object.keys(righe).length || Object.keys(sal).length) await docModifica('or8_carrello', function(d){ Object.keys(righe).forEach(function(k){ if(!d.righe[k]) d.righe[k] = righe[k]; }); d.salvati = d.salvati || {}; Object.keys(sal).forEach(function(k){ if(!d.salvati[k]) d.salvati[k] = sal[k]; }); }, true);
    var pref = vecchio.favorites || {}, rem = vecchio.reminder;
    await docModifica('or8_conf', function(d){
      Object.keys(pref).forEach(function(k){ if(pref[k] && CATMAP[k]) d.preferiti[k] = 1; });
      if(rem && rem.day != null && !d.promemoria) d.promemoria = { giorni: [Number(rem.day)], ora: rem.time || '10:00' };
      d.migratoV7 = new Date().toISOString();
    }, true);
  } else await docModifica('or8_conf', function(d){ d.migratoV7 = new Date().toISOString(); }, true);
  if(n){ renderTutto(); toast('Ho portato nella nuova versione il carrello della versione precedente (' + n + ' prodotti)', { durata: 4500 }); }
}

/* ── Navigazione e disegno ───────────────────────────────────────── */
function renderTutto(){ renderOrdina(); renderTab(VIEW.tab); aggiornaBadge(); }
function renderTab(t){ if(t === 'ordina') renderOrdina(); else if(t === 'ordini') renderOrdini(); else if(t === 'dafare') renderDaFare(); else if(t === 'magazzino') renderMagazzino(); else if(t === 'analisi') renderAnalisi(); }
// Non ridisegno mentre stai scrivendo (si chiuderebbe la tastiera)
var _rinviato = false;
function renderTuttoSicuro(){
  var a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && !a.closest('.mo')){
    if(!_rinviato){ _rinviato = true; a.addEventListener('blur', function f(){ a.removeEventListener('blur', f); _rinviato = false; setTimeout(renderTuttoSicuro, 50); }); }

  }
  renderTutto();
  if(_schedaId != null && document.getElementById('shProd') && !(a && a.closest && a.closest('#shProd'))) renderScheda();

}
function vaiTab(t){
  VIEW.tab = t; window._paginaCorrente = t;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id === 'view-' + t); });
  document.querySelectorAll('.tab-item').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === t); });
  aggiornaBarra(); renderTab(t); window.scrollTo(0, 0);
  if(t === 'dafare' && location.hash !== '#da-fare') try{ history.replaceState(null, '', location.pathname); }catch(e){}

function aggiornaBadge(){

}
function setBadge(id, n){ var b = document.getElementById(id); if(!b) return; b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hidden', !n); }

document.getElementById('appVer').textContent = 'v' + APP_VERSION;
