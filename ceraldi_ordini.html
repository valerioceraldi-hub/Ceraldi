<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ordini — Caffetteria Ceraldi</title>
<link rel="manifest" href="manifest-ordini.webmanifest">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ordini">
<link rel="apple-touch-icon" href="icon-ordini-192.png">
<style>
/* ══════════════════════════════════════════════════════════════════
   DESIGN SYSTEM CERALDI — identico a Ceraldi Fatture (Primanota.html):
   stessi colori di sistema iOS, stesso font Inter, stessi raggi, stessa
   intestazione con marchio disegnato e stessa barra in basso.
   ══════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#F2F2F7;--surface:#FFF;--surface2:#F2F2F7;--surface3:#E5E5EA;
  --ink:#000;--ink2:#3C3C43;--ink3:#8E8E93;--sep:#C6C6C8;--sep2:rgba(60,60,67,.12);
  --blue:#007AFF;--blue-light:#E8F0FE;
  --green:#34C759;--green-ink:#1a7a3a;--green-light:#E8F8ED;
  --red:#FF3B30;--red-light:#FFF0EF;
  --orange:#FF9500;--orange-ink:#b36a00;--orange-light:#FFF4E0;
  --purple:#5E5CE6;--purple-light:#EEEDFC;
  --radius:13px;--radius-sm:10px;
  --shadow:0 2px 8px rgba(0,0,0,.07);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-ios:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--surface3:#3A3A3C;
  --ink:#FFF;--ink2:#EBEBF5;--ink3:#8E8E93;--sep:#38383A;--sep2:rgba(255,255,255,.1);
  --blue:#0A84FF;--blue-light:#0A2540;
  --green:#30D158;--green-ink:#30D158;--green-light:#0E2E18;
  --red:#FF453A;--red-light:#3A0E0C;
  --orange:#FF9F0A;--orange-ink:#FF9F0A;--orange-light:#3A2A0A;
  --purple:#7D7AFF;--purple-light:#211F45;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + var(--safe-b));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
.hidden{display:none!important}

/* ── Intestazione ── */
.ios-header{background:linear-gradient(180deg,rgba(230,238,255,.85) 0%,rgba(242,242,247,.94) 65%);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(60,60,67,.18);padding:calc(14px + var(--safe-t)) 16px 12px;position:sticky;top:0;z-index:100;overflow:hidden}
html[data-theme="dark"] .ios-header{background:rgba(28,28,30,.92);border-bottom-color:rgba(255,255,255,.1)}
.ios-header::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,122,255,.16) 0%,transparent 70%);pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:11px;position:relative;z-index:1;padding-right:132px}
.app-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(70,90,230,.3),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.15);animation:markIn .7s var(--ease-spring) both}
@keyframes markIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
.ios-header h1{font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.05}
.ios-header .hdr-row p{font-size:12.5px;color:var(--ink3);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ver{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:99px;background:rgba(120,120,128,.14);font-size:10px;font-weight:600;letter-spacing:.2px;vertical-align:1px;font-variant-numeric:tabular-nums}
.hdr-actions{position:absolute;top:50%;right:14px;transform:translateY(-50%);display:flex;align-items:center;gap:8px;z-index:2;margin-top:calc(var(--safe-t)/2)}
.hdr-btn{width:36px;height:36px;border-radius:50%;border:.5px solid rgba(60,60,67,.12);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .2s var(--ease-spring);position:relative}
.hdr-btn:active{transform:scale(.88)}
html[data-theme="dark"] .hdr-btn{background:rgba(58,58,60,.6);border-color:rgba(255,255,255,.08)}
.hdr-btn svg.spin{animation:hdrSpin .9s var(--ease-out)}
@keyframes hdrSpin{to{transform:rotate(360deg)}}
.dot-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

/* ── Barra in basso ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(200%) blur(24px);-webkit-backdrop-filter:saturate(200%) blur(24px);border-top:1px solid rgba(0,0,0,.08);display:flex;padding:8px 4px calc(10px + var(--safe-b));z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.06)}
html[data-theme="dark"] .tab-bar{background:rgba(18,18,18,.96);border-top-color:rgba(255,255,255,.1)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border:none;background:none;position:relative;min-width:0}
.tab-ico{width:24px;height:24px;color:var(--ink3);transition:transform .18s;display:block}
.tab-ico svg{width:24px;height:24px}
.tab-lbl{font-size:10px;font-weight:500;color:var(--ink3);white-space:nowrap}
.tab-item.active .tab-ico{color:var(--blue);animation:tabPop .45s var(--ease-spring);transform:scale(1.08)}
.tab-item.active .tab-lbl{color:var(--blue);font-weight:700}
.tab-item.active::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--blue);border-radius:0 0 3px 3px}
@keyframes tabPop{0%{transform:scale(.8)}100%{transform:scale(1.08)}}
.tab-badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ── Schermate ── */
.view{display:none;padding:14px 16px 24px}
.view.active{display:block;animation:viewIn .38s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title:first-child{margin-top:4px}
.sec-title .lnk{text-transform:none;letter-spacing:0;font-size:13px;color:var(--blue);background:none;border:none;font-weight:600}
.home-sec{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.home-sec-t{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.home-sec-t::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,#0A84FF,#5E5CE6)}

/* ── Ricerca ── */
.sw{position:relative;margin-bottom:10px}
.sw input{width:100%;padding:11px 38px 11px 40px;border:none;border-radius:99px;font-size:16px;background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);-webkit-appearance:none;appearance:none}
.sw input:focus{outline:none;box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.sw .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;display:flex}
.sw .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--surface3);color:var(--ink3);font-size:13px;display:none;align-items:center;justify-content:center}
.sw.has .sx{display:flex}
.sticky-tools{position:sticky;top:var(--hdr-h,64px);z-index:50;background:var(--bg);margin:-14px -16px 0;padding:10px 16px 2px}

/* ── Selettore segmentato e chip ── */
.seg{display:flex;background:var(--surface3);border-radius:11px;padding:3px;gap:3px;margin-bottom:10px}
html[data-theme="dark"] .seg{background:var(--surface2)}
.seg-b{flex:1;min-width:0;padding:8px 4px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg-b.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
html[data-theme="dark"] .seg-b.active{background:var(--surface3)}
.seg-b .n{font-variant-numeric:tabular-nums;color:var(--blue);margin-left:4px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:6px 12px;border:1px solid var(--sep2);border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{font-size:11.5px;font-weight:700;color:var(--ink3)}
.chip.active .n{color:rgba(255,255,255,.85)}

/* ── Gruppi in stile Impostazioni iOS ── */
.grp{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--sep2);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;font-size:15px;color:var(--ink)}
.row:last-child{border-bottom:none}
button.row:active{background:var(--surface2)}
.row-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:15px;line-height:1.25}
.row-s{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.35}
.row-r{flex-shrink:0;text-align:right;font-size:14px;color:var(--ink3)}
.chev{color:var(--ink3);font-size:18px;flex-shrink:0;margin-left:2px}
.ic-b{background:var(--blue-light);color:var(--blue)}.ic-g{background:var(--green-light);color:var(--green-ink)}.ic-o{background:var(--orange-light);color:var(--orange-ink)}.ic-r{background:var(--red-light);color:var(--red)}.ic-p{background:var(--purple-light);color:var(--purple)}

/* ── Righe prodotto ── */
.pr{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;display:flex;align-items:stretch;overflow:hidden;transition:box-shadow .15s}
.pr.on{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.pr-stripe{width:4px;flex-shrink:0;background:transparent}
.pr.on .pr-stripe{background:var(--blue)}
.pr-main{flex:1;min-width:0;padding:11px 10px 11px 10px}
.pr-name{font-size:14.5px;font-weight:700;line-height:1.28;word-break:break-word}
.pr-name mark{background:rgba(0,122,255,.14);color:inherit;border-radius:3px;padding:0 1px}
.pr-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.pr-res{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:0}
.pr-side{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 8px 4px;gap:3px}
.pr-side label{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.num-in{width:66px;text-align:center;padding:9px 4px;border:1.5px solid var(--sep);border-radius:10px;background:var(--surface2);font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.num-in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.14);background:var(--surface)}
.num-in.filled{border-color:var(--blue);background:var(--blue-light)}
.num-in.err{border-color:var(--red);background:var(--red-light)}

/* ── Badge ── */
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bdg.r{background:var(--red-light);color:var(--red)}
.bdg.g{background:var(--green-light);color:var(--green-ink)}
.bdg.o{background:var(--orange-light);color:var(--orange-ink)}
.bdg.b{background:var(--blue-light);color:var(--blue)}
.bdg.p{background:var(--purple-light);color:var(--purple)}
.bdg.n{background:var(--surface2);color:var(--ink3)}

/* ── Contatore +/- ── */
.stp{display:inline-flex;align-items:center;background:var(--surface2);border-radius:99px;padding:2px;gap:2px}
.stp button{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface);color:var(--blue);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .stp button{background:var(--surface3)}
.stp button:active{transform:scale(.9)}
.stp b{min-width:30px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}

/* ── Pulsanti ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;text-align:center;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-s{background:var(--surface2);color:var(--blue)}
html[data-theme="dark"] .btn-s{background:var(--surface3)}
.btn-d{background:var(--red-light);color:var(--red)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.btn-sm{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:8px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap}
html[data-theme="dark"] .btn-sm{background:var(--surface3)}
.btn-sm.p{background:var(--blue-light);color:var(--blue)}
.btn-sm.g{background:var(--green-light);color:var(--green-ink)}
.btn-sm.o{background:var(--orange-light);color:var(--orange-ink)}
.btn-sm.r{background:var(--red-light);color:var(--red)}
.btn-sm:active{opacity:.7}
html[data-theme="dark"] .btn-sm.p{background:var(--blue-light)}html[data-theme="dark"] .btn-sm.g{background:var(--green-light)}html[data-theme="dark"] .btn-sm.o{background:var(--orange-light)}html[data-theme="dark"] .btn-sm.r{background:var(--red-light)}
.lnk-btn{background:none;border:none;color:var(--blue);font-size:14px;font-weight:600;padding:6px}

/* ── Campi ── */
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px}
.inp{width:100%;padding:12px 13px;border:1.5px solid var(--sep);border-radius:var(--radius-sm);font-size:16px;color:var(--ink);background:var(--surface);-webkit-appearance:none;appearance:none}
textarea.inp{resize:none;line-height:1.4}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.hint{font-size:12px;color:var(--ink3);line-height:1.4;margin-top:5px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0}
.tgl{position:relative;width:51px;height:31px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl span{position:absolute;inset:0;background:var(--surface3);border-radius:99px;transition:background .2s}
.tgl span::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease-spring)}
.tgl input:checked+span{background:var(--green)}
.tgl input:checked+span::after{transform:translateX(20px)}

/* ── Fogli a comparsa (bottom sheet) ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeBg .25s ease}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:sheetUp .42s var(--ease-ios);overflow:hidden}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:.5px solid var(--sep2);flex-shrink:0;background:var(--bg)}
.sheet-hd h3{font-size:18px;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet-hd .sub{font-size:12.5px;color:var(--ink3);font-weight:500;margin-top:2px}
.sheet-x{background:var(--surface3);border:none;border-radius:99px;width:30px;height:30px;font-size:16px;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="dark"] .sheet-x{background:var(--surface2)}
.sheet-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 18px;overscroll-behavior:contain}
.sheet-ft{flex-shrink:0;padding:12px 16px calc(12px + var(--safe-b));border-top:.5px solid var(--sep2);background:var(--bg)}
.sheet-back{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--blue);font-size:16px;font-weight:500;padding:0}

/* ── Notifica breve ── */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(16px);background:rgba(0,0,0,.85);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:all .25s var(--ease-out);z-index:30000;pointer-events:none;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:none;color:#5AC8FA;font-weight:700;font-size:14px;padding:0 2px;white-space:nowrap}

/* ── Stato vuoto, avvisi, varie ── */
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty .ei{font-size:44px;margin-bottom:10px;opacity:.45}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:4px}
.empty p{font-size:14px;line-height:1.45}
.banner{border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.banner.o{background:var(--orange-light);color:var(--orange-ink)}
.banner.b{background:var(--blue-light);color:var(--blue)}
.banner.r{background:var(--red-light);color:var(--red)}
.banner.g{background:var(--green-light);color:var(--green-ink)}
.banner b{font-weight:700}
.muted{color:var(--ink3)}
.tnum{font-variant-numeric:tabular-nums}
.spinner{width:22px;height:22px;border:2.5px solid var(--surface3);border-top-color:var(--blue);border-radius:50%;animation:hdrSpin .8s linear infinite;display:inline-block}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 0;color:var(--ink3);font-size:14px}

/* ── Barra flottante (lista/carrello) ── */
.fbar{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:190;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:16px;background:var(--blue);color:#fff;border:none;box-shadow:0 10px 30px -6px rgba(0,122,255,.55);animation:fbarIn .45s var(--ease-spring);max-width:560px;margin:0 auto;text-align:left}
@keyframes fbarIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.fbar:active{transform:scale(.98)}
.fbar .fb-n{min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.fbar .fb-t{flex:1;min-width:0}
.fbar .fb-t b{display:block;font-size:15px;font-weight:700}
.fbar .fb-t span{font-size:12px;opacity:.85}
.fbar .fb-go{font-size:22px;font-weight:300}
body.has-fbar{padding-bottom:calc(150px + var(--safe-b))}

/* ── Hero (riepiloghi) ── */
.hero{background:linear-gradient(160deg,#0B0B22 0%,#0E1240 48%,#13163A 100%);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px -14px rgba(14,18,64,.55)}
.hero::before{content:'';position:absolute;top:-70px;right:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.4) 0%,transparent 68%)}
.hero::after{content:'';position:absolute;bottom:-70px;left:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(94,92,230,.32) 0%,transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hero-big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-1.4px;line-height:1.05;margin-top:5px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:5px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.hero-stat{border-radius:13px;padding:9px 6px;text-align:center;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.08)}
.hero-stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.6px}

/* ── Schermata di accesso (identica a Fatture) ── */
#authGate{position:fixed;inset:0;z-index:20000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
#authGate .ag-box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:28px 22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
#authGate .ag-logo{width:56px;height:56px;border-radius:16px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center}
#authGate .ag-tit{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.5px}
#authGate .ag-sub{font-size:14px;color:var(--ink3);text-align:center;margin:-6px 0 8px}
#authGate .ag-btn{min-height:48px;border-radius:12px;border:none;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
#authGate .ag-btn:disabled{opacity:.55}
#authGate .ag-google{background:var(--surface);color:var(--ink);border:1px solid var(--sep)}
#authGate .ag-pri{background:var(--blue);color:#fff;margin-top:4px}
#authGate .ag-sec{background:var(--surface2);color:var(--ink)}
#authGate .ag-link{background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;padding:8px}
#authGate .ag-sep{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;margin:6px 0}
#authGate .ag-sep::before,#authGate .ag-sep::after{content:"";flex:1;height:1px;background:var(--sep)}
#authGate .ag-lbl{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:-4px}
#authGate .ag-in{min-height:46px;border-radius:12px;border:1px solid var(--sep);background:var(--surface2);color:var(--ink);padding:0 14px;font-size:16px;width:100%}
#authGate .ag-in:focus{outline:2px solid var(--blue);outline-offset:1px}
#authGate .ag-otp{letter-spacing:6px;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
#authGate .ag-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-top:4px}
#authGate .ag-tabs button{flex:1;min-height:36px;border:none;border-radius:8px;background:none;color:var(--ink2);font-size:14px;font-weight:600}
#authGate .ag-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#authGate .ag-nota{font-size:13px;color:var(--ink3);line-height:1.4}
#authGate .ag-msg{font-size:14px;color:var(--ink2);text-align:center;min-height:18px;line-height:1.4}
#authGate .ag-msg:empty{display:none}
#authGate .ag-neg{display:flex;flex-direction:column;gap:6px;text-align:center;font-size:14px;color:var(--ink2);line-height:1.45;margin:6px 0 8px}
#authGate .ag-neg b{color:var(--ink);font-size:16px}
#authGate .ag-attesa{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink3);font-size:14px;padding:16px 0}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:700px){.view{max-width:760px;margin:0 auto}.sticky-tools{margin-left:auto;margin-right:auto}}

/* ── Specifico Ordini ── */
.hdr-row{padding-right:132px}
.pr-price{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;padding:10px 12px 10px 4px;flex-shrink:0}
.pr-price .pp{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.pr-price .ps{font-size:11px;color:var(--ink3);font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-b{width:36px;height:36px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px -3px rgba(0,122,255,.6)}
.add-b:active{transform:scale(.9)}
.sup-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--sep2);background:var(--surface)}
.sup-av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.cr{display:flex;gap:10px;padding:11px 14px;border-bottom:.5px solid var(--sep2);align-items:flex-start}
.cr:last-child{border-bottom:none}
.cr-t{font-size:14px;font-weight:650;line-height:1.3}
.cr-s{font-size:12px;color:var(--ink3);margin-top:2px}
.cr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.more-b{border:none;background:var(--surface2);border-radius:8px;width:30px;height:30px;color:var(--ink3);font-size:17px;font-weight:800;line-height:1}
.ord-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;width:100%;border:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px}
.ord-card:active{background:var(--surface2)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi>div{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--ink3);font-weight:600}
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--sep2);font-size:13.5px}
.bar-row:last-child{border-bottom:none}
.bar-row .bl{flex:0 0 38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-row .bt{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:linear-gradient(90deg,#0A84FF,#5E5CE6);border-radius:99px}
.bar-row .bv{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.chart{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 10px 8px;margin-bottom:12px}
.chart svg{width:100%;height:150px;display:block}
.todo{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.todo-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--sep2)}
.todo-it{padding:10px 14px;border-bottom:.5px solid var(--sep2);font-size:13.5px}
.todo-it:last-child{border-bottom:none}
.todo-ft{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--surface2)}
html[data-theme="dark"] .todo-ft{background:rgba(255,255,255,.03)}
.var-up{color:var(--red);font-weight:800}.var-dn{color:var(--green-ink);font-weight:800}
.cand{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface2);border:none;border-radius:9px;padding:8px 10px;margin-top:6px;font-size:13px}
.cand b{flex:1;min-width:0;font-weight:600}
.dow{display:flex;gap:5px}
.dow button{flex:1;padding:9px 0;border-radius:9px;border:1.5px solid var(--sep);background:transparent;font-size:13px;font-weight:700;color:var(--ink3)}
.dow button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.msg-prev{white-space:pre-wrap;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:var(--shadow);max-height:240px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chat-log{display:flex;flex-direction:column;gap:8px;min-height:40vh}
.bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.map-tbl{width:100%;border-collapse:collapse;font-size:12px}
.map-tbl td,.map-tbl th{border-bottom:.5px solid var(--sep2);padding:6px 4px;text-align:left;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.imp-row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:.5px solid var(--sep2)}
.imp-row:last-child{border-bottom:none}
.prog{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s}
.inv-big{font-size:34px;font-weight:800;text-align:center;width:100%;padding:16px;border-radius:16px;border:2px solid var(--blue);background:var(--surface);color:var(--ink)}
</style>
</head>

<script>
var APP_VERSION='8.0.0';
var BUILD_VERSION=APP_VERSION, BUILD_NUM=APP_VERSION;
var APP={key:'ordini',nome:'Ordini',versione:APP_VERSION,authKey:'or_auth_v2',oldAuthKey:'ceraldi_ordini_auth_session',
  markBg:'linear-gradient(145deg,#FFC04D 0%,#FF9F0A 50%,#C2410C 100%)',

  onEntra:function(){return avvia();}};
/* ══════════════════════════════════════════════════════════════════
   NUCLEO COMUNE delle app Ceraldi (Ordini, Richieste)
   - registro errori (stesso schema di Fatture: tabella app_errori)
   - accesso unico Ceraldi (Google / password / codice email + permessi
     da ceraldi_mio_accesso) — stesso identico flusso di Fatture
   - funzione api(): ogni chiamata al database passa da qui, rinnova da
     sola la sessione scaduta e SEGNALA SEMPRE gli errori (prima molte
     scritture fallivano in silenzio)
   - fogli a comparsa, notifiche brevi, tema chiaro/scuro, push
   ══════════════════════════════════════════════════════════════════ */
var SB_URL = 'https://qaqqptpprmfjlolordaq.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhcXFwdHBwcm1mamxvbG9yZGFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ3MDgsImV4cCI6MjA5MTQyMDcwOH0.kTnxsNY3tua_ya4LCB8-vkVdQ1QBPGtLL7Gfg121d1o';
var SITE = 'https://valerioceraldi-hub.github.io/Ceraldi/';

/* ── Registro errori ─────────────────────────────────────────────── */
(function(){
  var KEY = APP.key + '_errori_log', MAX = 60, inviati = {}, nInviati = 0;
  function leggi(){ try{ var a = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function scrivi(a){ try{ localStorage.setItem(KEY, JSON.stringify(a.slice(-MAX))); }catch(e){} }
  window._registraErrore = function(tipo, msg, det){
    try{
      msg = String(msg || '').slice(0, 500); det = String(det || '').slice(0, 1500);
      var a = leggi(), ult = a[a.length - 1];
      var v = { t: new Date().toISOString(), tipo: tipo, msg: msg, det: det, ver: APP.versione, n: 1 };
      if(ult && ult.msg === msg){ ult.n = (ult.n || 1) + 1; ult.t = v.t; } else a.push(v);
      scrivi(a);
      var firma = tipo + '|' + msg;
      if(inviati[firma] || nInviati >= 25 || navigator.onLine === false) return;
      inviati[firma] = 1; nInviati++;
      fetch(SB_URL + '/rest/v1/app_errori', { method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Prefer: 'return=minimal' },
        body: JSON.stringify({ app: APP.key, versione: APP.versione, tipo: String(tipo).slice(0, 30), messaggio: msg, dettaglio: det,
          pagina: (window._paginaCorrente || '').slice(0, 200), dispositivo: (navigator.userAgent || '').slice(0, 300) })
      }).catch(function(){});
    }catch(e){}

function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function eur(n){ n = Number(n) || 0; return '€ ' + n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function eur0(n){ n = Number(n) || 0; return '€ ' + n.toLocaleString('it-IT', { maximumFractionDigits: 0 }); }
function num(v){ if(v == null || v === '') return null; var n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : n; }
function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function oggiISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataIt(iso, conOra){
  if(!iso) return '';
  var d = new Date(iso); if(isNaN(d)) return String(iso);
  var s = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  if(conOra) s += ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return s;
}
function quando(iso){
  if(!iso) return '';
  var d = new Date(iso), ora = new Date(), diff = (ora - d) / 1000, hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if(diff < 60) return 'adesso';
  if(diff < 3600) return Math.floor(diff / 60) + ' min fa';
  if(d.toDateString() === ora.toDateString()) return 'oggi ' + hm;
  var ieri = new Date(ora); ieri.setDate(ora.getDate() - 1);
  if(d.toDateString() === ieri.toDateString()) return 'ieri ' + hm;
  if(diff < 6 * 86400) return d.toLocaleDateString('it-IT', { weekday: 'long' }) + ' ' + hm;
  return dataIt(iso);
}
function debounce(fn, ms){ var t; return function(){ var a = arguments, s = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(s, a); }, ms); }; }
function evidenzia(testo, q){
  var t = String(testo || ''); if(!q) return esc(t);
  var parole = norm(q).split(' ').filter(function(p){ return p.length > 0; });
  var up = t.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  // l'indice si calcola sul testo senza accenti ma con la stessa lunghezza
  var segni = new Array(t.length).fill(false);
  parole.forEach(function(p){ var i = up.indexOf(p); while(i >= 0){ for(var k = i; k < i + p.length && k < t.length; k++) segni[k] = true; i = up.indexOf(p, i + p.length); } });
  var out = '', aperto = false;
  for(var i = 0; i < t.length; i++){
    if(segni[i] && !aperto){ out += '<mark>'; aperto = true; }
    if(!segni[i] && aperto){ out += '</mark>'; aperto = false; }
    out += esc(t[i]);
  }
  if(aperto) out += '</mark>';
  return out;
}
function cercaTutte(nome, q){ if(!q) return true; var n = norm(nome); return norm(q).split(' ').every(function(p){ return n.indexOf(p) >= 0; }); }

  return { access_token: j.access_token, refresh_token: j.refresh_token || (prec && prec.refresh_token),

async function _authPost(percorso, corpo){
  var r = await fetch(SB_URL + '/auth/v1/' + percorso, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify(corpo || {}) });
  var t = await r.text(), j = {}; try{ j = t ? JSON.parse(t) : {}; }catch(e){}
  if(!r.ok){ var e = new Error(j.error_description || j.msg || j.message || ('Errore ' + r.status)); e.status = r.status; e.codice = j.error_code || j.error || ''; throw e; }

function _authErrore(e){
  var m = (e && e.message) || '', c = (e && e.codice) || '';
  if(/invalid login credentials|invalid_credentials/i.test(m + c)) return 'Email o password non corretti.';
  if(/otp_expired|expired/i.test(c) || /token has expired|is invalid/i.test(m)) return 'Codice scaduto o sbagliato. Richiedine uno nuovo.';
  if(/signups not allowed|user not found|otp_disabled/i.test(m + c)) return 'Questa email non è registrata. Chiedi a un amministratore di aggiungerti.';
  if(/rate limit|over_email_send_rate_limit/i.test(m + c)) return 'Troppe email inviate di recente. Riprova tra qualche minuto o usa la password.';
  if(/failed to fetch|network|load failed/i.test(m)) return 'Nessuna connessione. Controlla la rete e riprova.';

async function _authRefresh(){
  if(!_authSess || !_authSess.refresh_token) return false;
  if(_authRefreshInCorso) return _authRefreshInCorso;
  _authRefreshInCorso = (async function(){
    try{ var j = await _authPost('token?grant_type=refresh_token', { refresh_token: _authSess.refresh_token }); _authApplica(_authDaRisposta(j, _authSess)); return true; }
    catch(e){ if(e && e.status >= 400 && e.status < 500){ _authApplica(null); _authMostra('login', 'Sessione scaduta: accedi di nuovo.'); } return false; }
    finally{ _authRefreshInCorso = null; }
  })();
  return _authRefreshInCorso;

/* api(percorso, opzioni) — percorso dopo /rest/v1/ (o 'rpc/...').
   Lancia SEMPRE un errore leggibile se il database rifiuta la richiesta. */
async function api(percorso, o){
  o = o || {};
  await _authPronto();
  var tentativo = 0;
  while(true){
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, o.timeout || 25000) : null;
    var h = { apikey: SB_KEY, Authorization: 'Bearer ' + _authToken() };
    if(o.body !== undefined) h['Content-Type'] = 'application/json';
    if(o.prefer) h.Prefer = o.prefer;
    var r;
    try{
      r = await fetch(SB_URL + '/rest/v1/' + percorso, { method: o.method || 'GET', headers: h,
        body: o.body === undefined ? undefined : (typeof o.body === 'string' ? o.body : JSON.stringify(o.body)), signal: ctrl ? ctrl.signal : undefined });
    }catch(err){
      if(timer) clearTimeout(timer);
      var e0 = new Error(err && err.name === 'AbortError' ? 'Il server non risponde (rete lenta?)' : 'Nessuna connessione'); e0.rete = true; throw e0;
    }
    if(timer) clearTimeout(timer);
    if((r.status === 401 || (r.status === 403 && tentativo === 0)) && _authSess && tentativo === 0){
      var txt401 = ''; try{ txt401 = await r.clone().text(); }catch(e){}
      if(r.status === 401 || /jwt|PGRST30/i.test(txt401)){ tentativo++; await _authRefresh(); continue; }
    }
    var t = await r.text(), j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = t; }
    if(!r.ok){
      var msg = (j && (j.message || j.hint || j.details)) || ('Errore ' + r.status);
      var e1 = new Error(msg); e1.status = r.status; e1.codice = j && j.code; e1.corpo = j; throw e1;
    }
    return j;
  }
}
// Tutte le righe di una tabella, a pagine (il server ne dà al massimo 1000 per volta)
async function apiTutte(percorso, pagina){
  pagina = pagina || 1000;
  var out = [], da = 0;
  while(true){
    var sep = percorso.indexOf('?') >= 0 ? '&' : '?';
    var righe = await api(percorso + sep + 'limit=' + pagina + '&offset=' + da);
    out = out.concat(righe || []);
    if(!righe || righe.length < pagina) break;
    da += pagina;
    if(da > 200000) break;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   RICONOSCIMENTO PRODOTTI (portato dalla v7, con le stesse protezioni

function _tokens(s){
  var c = String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

  var s = String(name || '').toUpperCase();
  var mCl = s.match(/CL\.?\s?(\d+(?:[.,]\d+)?)/); if(mCl) return Math.round(parseFloat(mCl[1].replace(',', '.')) * 10);
  var mCl2 = s.match(/(\d+(?:[.,]\d+)?)\s?CL\b/); if(mCl2) return Math.round(parseFloat(mCl2[1].replace(',', '.')) * 10);
  var mLt = s.match(/(\d+(?:[.,]\d+)?)\s?LT\.?|LT\.?\s?(\d+(?:[.,]\d+)?)/); if(mLt){ var v = mLt[1] || mLt[2]; return Math.round(parseFloat(v.replace(',', '.')) * 1000); }
  var mMl = s.match(/(\d+)\s?ML\b|ML\.?\s?(\d+)/); if(mMl) return parseInt(mMl[1] || mMl[2], 10);

var _GENERICHE = new Set(['whisky', 'scotch', 'liquore', 'liquori', 'vino', 'vini', 'birra', 'birre', 'acqua', 'acque', 'succo', 'succhi', 'gin', 'rum', 'vodka', 'grappa', 'amaro', 'amari', 'sciroppo', 'sciroppi', 'minerale', 'naturale', 'frizzante', 'gassata', 'gassato', 'analcolico', 'bevanda', 'bevande', 'spumante', 'cognac', 'brandy', 'the', 'caffe', 'original', 'london', 'dry', 'single', 'malt', 'blended', 'straight', 'riserva', 'reserve', 'especial', 'vetro', 'lattina', 'bottiglia', 'confezione']);
function _peso(t){

  if(/^(cl|lt|ml|kg|gr|pz|ct|bt|cf|ctx|vap)$/.test(t)) return 0;
  if(/^\d+(cl|lt|ml|kg|gr|pz|ct|bt)$|^(cl|lt|ml|kg|gr|pz|ct|bt)\d+$|^\d+(cl|lt|ml|kg|gr|pz|ct|bt)x\d+$|^(cl|lt|ml|kg|gr|pz|ct|bt)x\d+$|^x\d+$|^\d+x\d*$/.test(t)) return 0;

// Pezzi per cartone: CTX24, X 48, CL33X24 → 24 / 48 (CRODINO X48 ≠ CRODINO CTX60)
function pezziConf(name){ var m = String(name || '').toUpperCase().match(/(?:^|[^A-Z])(?:CTX|CT\.?\s?X|X)\s?(\d{1,3})(?!\d)/); return m ? parseInt(m[1], 10) : null; }

function candidati(nome, lista, n, forn){

    if(forn && prezzoDi(c, forn) != null && s > 0) s += 10;
    return { c: c, s: Math.min(100, Math.round(s * 10) / 10) };

/* Riconosce un elenco di nomi: { tipo: 'esatto'|'probabile'|'nessuno', id, s, cand[] }

async function riconosci(nomi, extra, opz){
  opz = opz || {};
  var out = new Array(nomi.length), dubbi = [];
  nomi.forEach(function(nome, i){
    var ex = (extra && extra[i]) || {};
    var a = aliasDi(nome);
    if(a){ out[i] = { tipo: 'esatto', id: a.id, s: 100, cand: [{ c: a, s: 100 }], alias: true }; return; }
    // 1. stesso prodotto scritto in modo diverso (formato, pezzi, marca, errori di battitura)
    var u = trovaUguale(nome, { lista: ex.lista, forn: ex.forn, prezzo: ex.prezzo, settore: ex.settore });

    var c = u.forse.length ? u.cand.concat(candidati(nome, ex.lista, 6, ex.forn).filter(function(x){ return !u.forse.some(function(p){ return p.id === x.c.id; }); })).slice(0, 6) : candidati(nome, ex.lista, 6, ex.forn);
    if(u.forse.length){ out[i] = { tipo: 'probabile', id: u.forse[0].id, s: 80, cand: c }; dubbi.push(i); return; }
    if(!c[0] || c[0].s < 15) out[i] = { tipo: 'nessuno', id: null, s: c[0] ? c[0].s : 0, cand: c };
    else { out[i] = { tipo: 'nessuno', id: null, s: c[0].s, cand: c }; dubbi.push(i); }
  });
  if(dubbi.length && chiaveAI() && !opz.senzaIA){
    for(var b = 0; b < dubbi.length; b += 40){
      var gruppo = dubbi.slice(b, b + 40);
      try{
        var prompt = 'Per ciascuna voce decidi se corrisponde a UNO dei prodotti candidati (stesso prodotto scritto in modo diverso) oppure a NESSUNO.\n' +
          'MARCA E FORMATO contano entrambi: marche diverse (JAGERMEISTER vs CYNAR, PERONI vs NASTRO AZZURRO) non sono lo stesso prodotto; ' +
          'la stessa marca con volume diverso (CL70 vs CL100) non è lo stesso prodotto. Match solo se marca e formato coincidono.\n\nVOCI:\n' +
          gruppo.map(function(ix, k){ return k + '. "' + nomi[ix] + '" — candidati: ' + out[ix].cand.filter(function(x){ return x.s >= 15; }).map(function(x){ return '[id:' + x.c.id + '] ' + x.c.name; }).join(' | '); }).join('\n') +
          '\n\nRispondi SOLO con un array JSON con un elemento per voce, nello stesso ordine: [{"id":123,"conf":"alta"},{"id":null,"conf":"nessuna"}]. conf: alta | bassa | nessuna.';
        var arr = jsonDaTesto(await chiamaClaude(prompt, Math.min(6000, 300 + gruppo.length * 60)));
        if(!Array.isArray(arr) || arr.length !== gruppo.length) continue; // risposta sfasata: non mi fido di nessuna
        gruppo.forEach(function(ix, k){
          var r = arr[k]; if(!r || r.id == null || r.conf === 'nessuna'){ if(r && r.conf === 'nessuna' && out[ix].tipo === 'probabile') out[ix] = Object.assign({}, out[ix], { tipo: 'nessuno', id: null }); return; }
          var c = out[ix].cand.find(function(x){ return x.c.id === r.id; });
          if(c) out[ix] = { tipo: r.conf === 'alta' ? 'esatto' : 'probabile', id: r.id, s: c.s, cand: out[ix].cand, ia: true };
        });
      }catch(e){ _registraErrore('ia', e.message); }
    }
  }
  return out;
}

/* ── Fornitori delle fatture → fornitori di Ordini ──────────────────
   Fatture scrive il nome legale ("EUROPA 23 S.R.L."), Ordini usa il
   nome breve ("Europa 23 S.r.l"). L'abbinamento si decide una volta

  if(U.lettura || !docDati('or8_conf').doppioniAuto || _autoUnioniInCorso || !CAT.length) return 0;
  _autoUnioniInCorso = true; var n = 0;
  try{
    var g = calcolaDoppioni(true).gruppi.slice(0, 15);
    for(var i = 0; i < g.length; i++){ try{ var r = await unisciGruppo(g[i].membri.map(function(p){ return p.id; }), g[i].principale, { auto: true }); if(r) n += r.eliminati; }catch(e){ _registraErrore('unione automatica', e.message); } }
    if(n) DOPPI.firma = '';
  } finally { _autoUnioniInCorso = false; }

var VIEW = { q: '', settore: 'Tutti', cat: 'Tutte', limite: 60, tab: 'ordina' };

function carr(){ return docDati('or8_carrello'); }
function conf(){ return docDati('or8_conf'); }
function inCarrello(id){ return !!carr().righe['p' + id]; }
function preferito(id){ return !!(conf().preferiti || {})[id]; }
function fornRiga(r){
  var p = r.id != null ? CATMAP[r.id] : null;
  if(r.forn && fornDi(r.forn)) return fornDi(r.forn).nome;
  return p ? migliore(p).forn : '';
}
function prezzoRiga(r){ var p = r.id != null ? CATMAP[r.id] : null; if(!p) return r.prezzo != null ? r.prezzo : null; return prezzoDi(p, fornRiga(r)); }
function gruppiCarrello(){
  var g = {}, righe = carr().righe;
  Object.keys(righe).forEach(function(k){
    var r = righe[k], f = fornRiga(r), pr = prezzoRiga(r);
    (g[f] = g[f] || []).push({ k: k, r: r, p: r.id != null ? CATMAP[r.id] : null, prezzo: pr, sub: pr != null ? r2(pr * (r.qty || 1)) : 0 });
  });
  var ord = fornNomi();
  return Object.keys(g).sort(function(a, b){ if(!a) return 1; if(!b) return -1; var ia = ord.indexOf(a), ib = ord.indexOf(b); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); })
    .map(function(f){ var l = g[f].sort(function(a, b){ return String(a.r.nome || '').localeCompare(String(b.r.nome || ''), 'it'); }); return { forn: f, righe: l, totale: r2(l.reduce(function(s, x){ return s + x.sub; }, 0)) }; });
}
function totaleCarrello(){ return r2(gruppiCarrello().reduce(function(s, g){ return s + g.totale; }, 0)); }

/* ── Schermata Ordina ────────────────────────────────────────────── */
function settoriPresenti(){ var v = {}; CAT.forEach(function(p){ v[settoreDi(p)] = 1; }); var o = SETTORI_BASE.filter(function(s){ return v[s]; }); Object.keys(v).forEach(function(s){ if(o.indexOf(s) < 0) o.push(s); }); return o; }
function sottoScorta(p){ return p.scorta_min != null && p.scorta_min > 0 && (p.giacenza == null ? false : p.giacenza < p.scorta_min); }
function renderOrdina(){ renderSettori(); renderCategorie(); renderProdotti(); aggiornaBarra(); renderAvvisiOrdina(); }
function renderSettori(){
  var el = document.getElementById('segSettori'), ss = settoriPresenti();
  if(ss.length < 2){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = ['Tutti'].concat(ss).map(function(s){ return '<button class="seg-b' + (VIEW.settore === s ? ' active' : '') + '" data-s="' + esc(s) + '" onclick="VIEW.settore=this.dataset.s;VIEW.cat=\'Tutte\';VIEW.limite=60;renderOrdina()">' + esc(s) + '</button>'; }).join('');
}
function prodottiSettore(){ return VIEW.settore === 'Tutti' ? CAT : CAT.filter(function(p){ return settoreDi(p) === VIEW.settore; }); }
function renderCategorie(){
  var base = prodottiSettore(), conta = {};
  base.forEach(function(p){ var c = catDi(p); conta[c] = (conta[c] || 0) + 1; });
  var nPref = base.filter(function(p){ return preferito(p.id); }).length, nCar = Object.keys(carr().righe).length, nSotto = base.filter(sottoScorta).length;
  var h = chip('Tutte', 'Tutte') + (nPref ? chip('__pref', '★ Preferiti', nPref) : '') + (nCar ? chip('__car', 'Nel carrello', nCar) : '') + (nSotto ? chip('__sotto', 'Sotto scorta', nSotto) : '');
  h += Object.keys(conta).sort(function(a, b){ return a.localeCompare(b, 'it'); }).map(function(c){ return chip(c, c.charAt(0) + c.slice(1).toLowerCase(), conta[c]); }).join('');
  document.getElementById('chipsCat').innerHTML = h;
  function chip(v, l, n){ return '<button class="chip' + (VIEW.cat === v ? ' active' : '') + '" data-c="' + esc(v) + '" onclick="VIEW.cat=this.dataset.c;VIEW.limite=60;renderCategorie();renderProdotti()">' + esc(l) + (n != null ? ' <span class="n">' + n + '</span>' : '') + '</button>'; }
}
function filtraProdotti(){
  var l = prodottiSettore(), q = VIEW.q;
  if(VIEW.cat === '__pref') l = l.filter(function(p){ return preferito(p.id); });
  else if(VIEW.cat === '__car') l = l.filter(function(p){ return inCarrello(p.id); });
  else if(VIEW.cat === '__sotto') l = l.filter(sottoScorta);
  else if(VIEW.cat !== 'Tutte') l = l.filter(function(p){ return catDi(p) === VIEW.cat; });
  if(q){
    var f = fornDi(q);
    if(f) l = l.filter(function(p){ return prezzoDi(p, f.nome) != null; });
    else if(/^\d{8,14}$/.test(q)) l = l.filter(function(p){ return String(p.barcode || '') === q; });
    else l = l.filter(function(p){ return cercaTutte(p.name + ' ' + (p.conf || '') + ' ' + catDi(p), q); });
    var qn = norm(q);
    l.sort(function(a, b){ var sa = norm(a.name).indexOf(qn) === 0, sb = norm(b.name).indexOf(qn) === 0; if(sa !== sb) return sa ? -1 : 1; return a.name.localeCompare(b.name, 'it'); });
  } else l = l.slice().sort(function(a, b){ var pa = preferito(a.id), pb = preferito(b.id); if(pa !== pb) return pa ? -1 : 1; return a.name.localeCompare(b.name, 'it'); });
  return l;
}
function renderProdotti(){
  var el = document.getElementById('prodotti');
  if(!CAT.length){ el.innerHTML = '<div class="loading"><span class="spinner"></span>Carico il catalogo…</div>'; return; }
  var l = filtraProdotti(), m = l.slice(0, VIEW.limite);
  var h = m.map(rigaProdotto).join('');
  if(l.length > m.length) h += '<button class="btn btn-s" style="margin-top:6px" onclick="VIEW.limite+=100;renderProdotti()">Mostra altri ' + (l.length - m.length) + '</button>';
  if(!l.length) h = '<div class="empty"><div class="ei">🔎</div><b>Nessun prodotto</b><p>' + (VIEW.q ? 'Nel catalogo non c\'è "' + esc(VIEW.q) + '".' : 'Niente in questa sezione.') + '</p>' +
    (VIEW.q && !U.lettura ? '<button class="btn btn-s" style="margin-top:14px" onclick="apriNuovoProdotto(VIEW.q)">+ Crea "' + esc(maiusc(VIEW.q)) + '"</button>' : '') + '</div>';
  el.innerHTML = h;
  cercaListini();
}
function rigaProdotto(p){
  var b = migliore(p), r = carr().righe['p' + p.id], nForn = prezziOrdinati(p).filter(function(x){ return !x.orfano; }).length;
  var meta = [p.conf, catDi(p)].filter(Boolean).join(' · ');
  var badges = (preferito(p.id) ? '<span class="bdg o">★</span>' : '') + (sottoScorta(p) ? '<span class="bdg r">sotto scorta · ne hai ' + p.giacenza + '</span>' : '') +
    (b.fisso ? '<span class="bdg b">📌 ' + esc(b.forn) + '</span>' : '') + (nForn > 1 ? '<span class="bdg n">' + nForn + ' fornitori</span>' : '') + (!b.forn ? '<span class="bdg o">senza prezzo</span>' : '');
  var dx = r ? '<span class="stp" onclick="event.stopPropagation()"><button aria-label="Meno" onclick="cambiaQ(\'p' + p.id + '\',-1)">−</button><b data-q="p' + p.id + '">' + r.qty + '</b><button aria-label="Più" onclick="cambiaQ(\'p' + p.id + '\',1)">+</button></span>'
    : (U.lettura ? '' : '<button class="add-b" aria-label="Aggiungi" onclick="event.stopPropagation();aggiungi(' + p.id + ')">+</button>');
  return '<div class="pr' + (r ? ' on' : '') + '" id="pr-' + p.id + '"><span class="pr-stripe"></span><div class="pr-main" onclick="apriProdotto(' + p.id + ')">' +
    '<div class="pr-name">' + evidenzia(p.name, VIEW.q) + '</div><div class="pr-meta">' + esc(meta) + '</div>' + (badges ? '<div class="pr-res">' + badges + '</div>' : '') + '</div>' +
    '<div class="pr-price"><div style="text-align:right"><div class="pp">' + (b.forn ? eur(b.prezzo) : '—') + '</div><div class="ps">' + esc(b.forn || 'nessun fornitore') + '</div></div>' + dx + '</div></div>';
}
function aggiornaRiga(id){ var el = document.getElementById('pr-' + id), p = CATMAP[id]; if(el && p){ var t = document.createElement('div'); t.innerHTML = rigaProdotto(p); el.replaceWith(t.firstChild); } }
function pulisciRicerca(){ var q = document.getElementById('q'); q.value = ''; VIEW.q = ''; document.getElementById('swBox').classList.remove('has'); renderProdotti(); }
function renderAvvisiOrdina(){

// Ricerca anche nei listini caricati dai fornitori (prodotti non ancora a catalogo)
var _listTimer = null, _listUltima = '';
function cercaListini(){
  var el = document.getElementById('listini'); if(!el) return;
  var q = VIEW.q;
  if(!q || q.length < 3 || fornDi(q) || /^\d{8,}$/.test(q)){ el.innerHTML = ''; return; }
  clearTimeout(_listTimer);
  _listTimer = setTimeout(async function(){
    if(_listUltima === q) return; _listUltima = q;
    var parole = norm(q).split(' ').filter(function(w){ return w.length >= 2; }).slice(0, 3);
    try{
      var r = await api('ceraldi_listino_locale?select=id,source,name,conf,cat,prices&name=ilike.' + encodeURIComponent('*' + parole.join('*') + '*') + '&limit=12');
      if(VIEW.q !== q) return;
      r = (r || []).filter(function(x){ return !CAT.some(function(p){ return norm(p.name) === norm(x.name); }); });
      window._listRis = r;
      el.innerHTML = r.length ? '<div class="sec-title">Nei listini dei fornitori <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">non ancora a catalogo</span></div><div class="grp">' + r.map(function(x, i){
        var pr = Object.keys(x.prices || {}).map(function(k){ return { f: k, v: num(x.prices[k]) }; }).filter(function(y){ return y.v; }).sort(function(a, b){ return a.v - b.v; })[0];
        return '<div class="row"><div class="row-main"><div class="row-t" style="font-size:14px">' + evidenzia(x.name, q) + '</div><div class="row-s">' + esc([x.conf, x.source].filter(Boolean).join(' · ')) + '</div></div><div class="row-r"><b style="color:var(--ink)">' + (pr ? eur(pr.v) : '') + '</b></div>' + (U.lettura ? '' : '<button class="add-b" onclick="daListino(' + i + ')">+</button>') + '</div>';
      }).join('') + '</div>' : '';
    }catch(e){ el.innerHTML = ''; }
  }, 350);
}
async function daListino(i){
  var x = (window._listRis || [])[i]; if(!x) return;
  var prices = {}; Object.keys(x.prices || {}).forEach(function(k){ var f = fornDi(k) || fornDi(x.source); if(f && num(x.prices[k])) prices[f.nome] = num(x.prices[k]); });
  if(!Object.keys(prices).length && fornDi(x.source)){ var v = Object.keys(x.prices || {}).map(function(k){ return num(x.prices[k]); }).filter(Boolean)[0]; if(v) prices[fornDi(x.source).nome] = v; }
  if(!(await conferma('Aggiungere al catalogo?', '<b>' + esc(x.name) + '</b> verrà creato nel catalogo' + (Object.keys(prices).length ? ' con il prezzo di ' + esc(Object.keys(prices).join(', ')) : '') + ' e messo nel carrello.', 'Crea e aggiungi'))) return;
  try{ var p = await nuovoProdotto({ name: x.name, conf: x.conf || '', cat: maiusc(x.cat || ''), prices: prices, settore: VIEW.settore !== 'Tutti' ? VIEW.settore : 'Bar' }); aggiungi(p.id); _listUltima = ''; renderOrdina(); if(p._esistente) toast('Era già in catalogo come ' + nomeBreve(p.name, 34) + ': messo nel carrello quello'); }
  catch(e){ toast('⚠️ ' + e.message); }
}

/* ── Carrello: aggiunta e quantità ───────────────────────────────── */
function aggiungi(id, qty, opz){
  if(U.lettura){ toast('Accesso in sola lettura'); return; }
  opz = opz || {};
  var p = CATMAP[id]; if(!p) return;
  var q = qty || p.qty_min || 1, k = 'p' + id;
  docModifica('or8_carrello', function(d){
    var r = d.righe[k];
    if(r){ r.qty = (r.qty || 0) + q; if(opz.da) r.da = (r.da || []).concat(opz.da); if(opz.nota) r.nota = opz.nota; if(opz.forn) r.forn = opz.forn; }
    else d.righe[k] = { id: id, nome: p.name, conf: p.conf || '', qty: q, forn: opz.forn || null, nota: opz.nota || p.nota_ordine || '', da: opz.da || [], at: new Date().toISOString() };
  });
  if(!opz.muto){ aggiornaRiga(id); aggiornaBarra(); toast(nomeBreve(p.name, 30) + ' × ' + q + ' nel carrello', { durata: 1500 }); }
}
function aggiungiProvvisorio(nome, conf, qty, opz){
  opz = opz || {};
  var k = 'x' + uid();
  docModifica('or8_carrello', function(d){ d.righe[k] = { id: null, nome: maiusc(nome), conf: conf || '', qty: qty || 1, forn: opz.forn || null, nota: opz.nota || '', da: opz.da || [], barcode: opz.barcode || null, at: new Date().toISOString() }; });
  return k;
}
function cambiaQ(k, d){
  var r = carr().righe[k]; if(!r) return;
  var nq = (r.qty || 1) + d;
  if(nq <= 0){ rimuoviRiga(k); return; }
  docModifica('or8_carrello', function(x){ if(x.righe[k]) x.righe[k].qty = Math.min(9999, nq); });
  document.querySelectorAll('[data-q="' + k + '"]').forEach(function(b){ b.textContent = nq; });
  aggiornaBarra(); if(document.getElementById('shCarr')) renderCarrello();
}
function rimuoviRiga(k, muto){
  var r = carr().righe[k]; if(!r) return;
  var copia = JSON.parse(JSON.stringify(r));
  docModifica('or8_carrello', function(d){ delete d.righe[k]; });
  if(r.id != null) aggiornaRiga(r.id);
  aggiornaBarra(); renderCategorie(); if(document.getElementById('shCarr')) renderCarrello();
  if(!muto) toast('Tolto ' + nomeBreve(r.nome, 26), { azione: 'Annulla', onAzione: function(){ docModifica('or8_carrello', function(d){ d.righe[k] = copia; }); if(copia.id != null) aggiornaRiga(copia.id); aggiornaBarra(); if(document.getElementById('shCarr')) renderCarrello(); } });
}
function aggiornaBarra(){
  var n = Object.keys(carr().righe).length, fb = document.getElementById('fbar'), vis = n > 0 && VIEW.tab === 'ordina';
  fb.classList.toggle('hidden', !vis); document.body.classList.toggle('has-fbar', vis);
  if(!n) return;
  var g = gruppiCarrello();
  document.getElementById('fbN').textContent = n;
  document.getElementById('fbT').textContent = 'Carrello · ' + eur(totaleCarrello());
  document.getElementById('fbSub').textContent = g.length === 1 ? (g[0].forn || 'Senza fornitore') : g.length + ' fornitori · rivedi e invia';
}

/* ══════════════════════════════════════════════════════════════════
   PARTE 4 · DA FARE — tutto ciò che aspetta una decisione, in un posto:
   richieste dei dipendenti, prezzi arrivati dalle fatture, fornitori

var DF = { mostra: {}, ris: {}, escl: {}, scorta: {} };
var STATI_APERTI_PF = ['pending', 'new_product', 'new_price', 'review', 'no_match'];

function pfForn(r){ var f = risolviFornitore(r.fornitore); return f && f.nome ? f.nome : null; }
function pfPrezzo(r){ var a = num(r.prezzo_ivato), b = num(r.prezzo_unit); return a && a > 0 ? a : (b || 0); }
async function patchPF(ids, campi){
  if(!ids.length) return;
  for(var i = 0; i < ids.length; i += 80){
    var parte = ids.slice(i, i + 80);
    await api('prezzi_da_fatture?id=in.(' + parte.join(',') + ')', { method: 'PATCH', prefer: 'return=minimal', body: campi });
  }
  PF.forEach(function(r){ if(ids.indexOf(r.id) >= 0) Object.assign(r, campi); });
  PF = PF.filter(function(r){ return STATI_APERTI_PF.indexOf(r.stato) >= 0; });
}
function gruppiPF(){
  var g = { variazioni: [], nuovi: [], fornitori: {} };
  PF.forEach(function(r){
    var f = pfForn(r);
    if(!f){ var k = String(r.fornitore || '?'); (g.fornitori[k] = g.fornitori[k] || []).push(r); return; }
    if(r.stato === 'pending') return;
    if(r.product_id && CATMAP[r.product_id] && (r.stato === 'review' || r.stato === 'new_price')) g.variazioni.push(r);
    else g.nuovi.push(r);
  });
  return g;
}
function contaDaFare(){

  if(CAT.length && DOPPI.firma !== firmaCatalogo()){ clearTimeout(contaDaFare._t); contaDaFare._t = setTimeout(function(){ calcolaDoppioni(); aggiornaBadge(); }, 1200); }
  var dop = DOPPI.gruppi.length;

}

var _procInCorso = false;
async function processaPending(){
  if(_procInCorso || U.lettura || !CAT.length) return 0;
  var pend = PF.filter(function(r){ return r.stato === 'pending'; }); if(!pend.length) return 0;
  _procInCorso = true;
  try{
    var lav = [], ignora = [];
    pend.forEach(function(r){ var f = risolviFornitore(r.fornitore); if(f && f.ignora) ignora.push(r.id); else if(f && f.nome) lav.push({ r: r, forn: f.nome }); });
    if(ignora.length) await patchPF(ignora, { stato: 'rejected', note: 'Fornitore escluso da Ordini', resolved_at: new Date().toISOString() });
    if(!lav.length) return 0;
    var ris = await riconosci(lav.map(function(x){ return x.r.descrizione; }), lav.map(function(x){ return { forn: x.forn, prezzo: pfPrezzo(x.r) }; }));
    var auto = 0;
    for(var i = 0; i < lav.length; i++){
      var x = lav[i], m = ris[i], prezzo = pfPrezzo(x.r), c;
      try{
        if(m.tipo === 'esatto' && CATMAP[m.id] && prezzo > 0){
          var p = CATMAP[m.id], att = prezzoDi(p, x.forn), v = att ? Math.round((prezzo - att) / att * 10000) / 100 : null;
          if(att == null) c = { stato: 'new_price', product_id: p.id, match_score: m.s, prezzo_attuale: null, variazione_pct: null };
          else if(Math.abs(v) <= 1){
            if(Math.abs(prezzo - att) > 0.005) await impostaPrezzo(p.id, x.forn, prezzo);
            c = { stato: 'matched_auto', product_id: p.id, match_score: m.s, prezzo_attuale: att, variazione_pct: v, resolved_at: new Date().toISOString(), note: 'Aggiornato in automatico (variazione entro l\'1%)' }; auto++;
          } else c = { stato: 'review', product_id: p.id, match_score: m.s, prezzo_attuale: att, variazione_pct: v };
          if(m.ia) c.note = 'riconosciuto con IA';
        } else c = { stato: prezzo > 0 ? 'new_product' : 'no_match', match_score: m.s || 0 };
        await patchPF([x.r.id], c);
      }catch(e){ _registraErrore('fatture', x.r.id + ': ' + e.message); }
    }
    return auto;
  } finally { _procInCorso = false; }
}

async function risolviPrezziUguali(){

  else if(VM.filtro === 'senza') l = l.filter(function(p){ return p.scorta_min == null; });

function barre(titolo, mappa, max){

}

  var svg = '<svg viewBox="0 0 ' + w + ' ' + (hh + 26) + '" preserveAspectRatio="none" role="img" aria-label="Spesa per mese">';

  return '<div class="chart">' + svg + '</svg><div class="muted" style="font-size:11.5px;text-align:center;margin-top:2px">Mese più alto: ' + eur0(max) + '</div></div>';

  var ft = document.querySelector('#shImpR .sheet-ft'); if(!ft){ var s = document.querySelector('#shImpR .sheet'); ft = document.createElement('div'); ft.className = 'sheet-ft'; s.appendChild(ft); }
  piedeImport();
}
function selImport(g){ var l = IMP.esiti.filter(function(e){ return e.gruppo === g; }), tutti = l.every(function(e){ return e.sel; }); l.forEach(function(e){ e.sel = !tutti; }); renderImport(); }
function piedeImport(){
  var ft = document.querySelector('#shImpR .sheet-ft'); if(!ft) return;
  var n = IMP.esiti.filter(function(e){ return e.sel; }).length;
  ft.innerHTML = '<button class="btn btn-p" ' + (n || IMP.salvaListino ? '' : 'disabled') + ' onclick="applicaImport()">' + (n ? 'Applica ' + n + ' modifiche' : 'Salva solo il listino') + '</button>';
}
async function applicaImport(){
  var sel = IMP.esiti.filter(function(e){ return e.sel; }), ok = 0, nuovi = 0, err = 0;
  var b = corpoSheet('shImpR'); b.innerHTML = '<div class="loading"><span class="spinner"></span><span id="impProg">Applico…</span></div><div class="prog"><i id="impBar" style="width:0"></i></div>';
  var ft = document.querySelector('#shImpR .sheet-ft'); if(ft) ft.innerHTML = '';
  var sett = (fornDi(IMP.forn) || {}).settori || [];
  for(var i = 0; i < sel.length; i++){
    var e = sel[i];
    try{
      if(e.gruppo === 'nuovo'){ var m = {}; m[IMP.forn] = e.prezzo; var np = await nuovoProdotto({ name: e.r.nome, conf: e.r.conf || '', prices: m, settore: sett[0] || 'Bar' }); if(np._esistente) ok++; else nuovi++; }
      else { if(e.gruppo === 'incerto') salvaAlias(e.r.nome, e.p.id); await impostaPrezzo(e.p.id, IMP.forn, e.prezzo); ok++; }
    }catch(x){ err++; _registraErrore('import', e.r.nome + ': ' + x.message); }
    var pr = document.getElementById('impProg'), bar = document.getElementById('impBar'); if(pr) pr.textContent = 'Applico… ' + (i + 1) + '/' + sel.length; if(bar) bar.style.width = Math.round((i + 1) / sel.length * 100) + '%';
  }
  if(IMP.salvaListino){
    try{
      await api('ceraldi_listino_locale?source=eq.' + encodeURIComponent(IMP.forn), { method: 'DELETE' });
      var rows = IMP.esiti.map(function(e){ var pz = {}; pz[IMP.forn] = e.prezzo; return { source: IMP.forn, name: e.r.nome, conf: e.r.conf || '', cat: e.p ? catDi(e.p) : '', prices: pz }; });
      for(var j = 0; j < rows.length; j += 300) await api('ceraldi_listino_locale', { method: 'POST', prefer: 'return=minimal', body: rows.slice(j, j + 300) });
    }catch(x){ toast('⚠️ Listino cercabile non salvato: ' + x.message); }
  }
  chiudiSheet('shImpR'); renderOrdina();
  toast(ok + ' prezzi aggiornati' + (nuovi ? ', ' + nuovi + ' prodotti nuovi' : '') + (err ? ' · ' + err + ' errori (vedi Diagnostica)' : '') + ' ✓', { durata: 5000 });
}

/* ── Assistente (funzione ordini-assistente, sola lettura) ───────── */
var CHAT = [];
function apriAssistente(){
  apriSheet('shAss', { titolo: 'Assistente', sotto: 'Chiedi di prezzi, spesa, fornitori · legge i dati, non modifica nulla', alto: true, corpo: '<div class="chat-log" id="chatLog"></div>',
    piede: '<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:8px" id="chatSug"></div><div style="display:flex;gap:8px"><input class="inp" id="chatIn" placeholder="Scrivi una domanda…" style="border-radius:99px" onkeydown="if(event.key===\'Enter\')chiediAssistente()"><button class="add-b" style="width:46px;height:46px;flex-shrink:0" onclick="chiediAssistente()" aria-label="Invia">↑</button></div>' });
  renderChat();
  document.getElementById('chatSug').innerHTML = ['Quanto ho speso questo mese?', 'Chi conviene per le birre?', 'Prezzi aumentati di recente', 'Ogni quanto ordino l\'acqua?'].map(function(q){ return '<button class="chip" style="flex:0 0 auto" onclick="document.getElementById(\'chatIn\').value=this.textContent;chiediAssistente()">' + esc(q) + '</button>'; }).join('');
}
function renderChat(){ var l = document.getElementById('chatLog'); if(!l) return; l.innerHTML = CHAT.length ? CHAT.map(function(m){ return '<div class="bub ' + (m.role === 'user' ? 'u' : 'a') + '">' + esc(m.content) + '</div>'; }).join('') : '<div class="empty"><div class="ei">✨</div><b>Chiedimi qualcosa</b><p>Rispondo usando i dati veri di catalogo, ordini e fatture.</p></div>'; var bd = corpoSheet('shAss'); if(bd) bd.scrollTop = bd.scrollHeight; }
async function chiediAssistente(){
  var i = document.getElementById('chatIn'), q = i.value.trim(); if(!q) return;
  i.value = ''; CHAT.push({ role: 'user', content: q }); CHAT.push({ role: 'assistant', content: '…' }); renderChat();
  try{
    await _authPronto();
    var r = await fetch(SB_URL + '/functions/v1/ordini-assistente', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + _authToken() }, body: JSON.stringify({ messages: CHAT.slice(0, -1).slice(-12) }) });
    var j = await r.json();
    CHAT[CHAT.length - 1].content = j.reply || ('Non sono riuscito a rispondere' + (j.error ? ': ' + j.error : '.'));
  }catch(e){ CHAT[CHAT.length - 1].content = 'Nessuna connessione con l\'assistente.'; }
  renderChat();
}

/* ══════════════════════════════════════════════════════════════════
   PARTE 8 · AVVIO, SINCRONIZZAZIONE, NAVIGAZIONE
   ══════════════════════════════════════════════════════════════════ */
async function avvia(){
  document.getElementById('appMark').style.background = APP.markBg;
  document.getElementById('appMark').innerHTML = APP.markSvg;
  U.email = (_authSess.user && _authSess.user.email) || ''; U.uid = (_authSess.user && _authSess.user.id) || '';
  U.nome = (ACC.nome || '').trim() || U.email.split('@')[0]; U.admin = !!ACC.admin; U.lettura = !!ACC.lettura;
  document.getElementById('hdrSub').innerHTML = 'Ciao ' + esc(U.nome.split(' ')[0]) + ' <span class="app-ver">v' + APP_VERSION + '</span>';
  // Dati salvati sul telefono: l'app si apre subito, anche senza rete
  CAT = lsGet('or8_cat', null) || lsGet('bp_supabase_cache', []) || []; indicizza();
  FORN = lsGet('or8_forn', []); STORICO = lsGet('or8_storico', []); RICH = lsGet('or8_rich', []);
  Object.keys(DOC_DEFAULT).forEach(docDaCache);
  misuraHeader(); renderTutto();
  document.getElementById('q').addEventListener('input', debounce(function(){ VIEW.q = this.value.trim(); VIEW.limite = 60; document.getElementById('swBox').classList.toggle('has', !!VIEW.q); renderProdotti(); }, 140));
  await sincronizza(false);
  await migraDaV7();
  window.addEventListener('online', function(){ svuotaOutbox(); docInviaTutti(); sincronizza(false); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ docInviaTutti(); return; } if(Date.now() - STATO_SYNC.ultimo > 90 * 1000) sincronizza(false); });
  setInterval(function(){ if(!document.hidden) aggiornaLeggero(); }, 120 * 1000);
  if(navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', function(ev){ var d = ev.data || {}; if(d.tipo !== 'ceraldi-notifica') return; if(ev.ports && ev.ports[0]) ev.ports[0].postMessage('ok'); if(String(d.link || '').indexOf('#da-fare') >= 0){ aggiornaLeggero().then(function(){ vaiTab('dafare'); }); } });
  if(location.hash === '#da-fare') vaiTab('dafare');
  ntfRegistra(); setTimeout(controllaVersione, 5000);
  if(U.lettura) toast('Accesso in sola lettura', { durata: 3500 });
}
var _syncInCorso = null;
async function sincronizza(manuale, completo){
  if(_syncInCorso) return _syncInCorso;
  var ico = document.getElementById('syncIco'); if(ico){ ico.classList.remove('spin'); void ico.offsetWidth; ico.classList.add('spin'); }
  _syncInCorso = (async function(){
    var errori = [];
    function prova(p, nome){ return p.catch(function(e){ errori.push({ nome: nome, e: e }); }); }
    await prova(caricaFornitori(), 'fornitori');
    await Promise.all([prova(caricaCatalogo(completo), 'catalogo'), prova(caricaStorico(), 'ordini'), prova(caricaRichieste(), 'richieste'), prova(caricaPF(), 'fatture'), prova(caricaPD(), 'contestazioni'),
      prova(caricaProfili(), 'profili'), prova(caricaAliasTabella(), 'alias')].concat(Object.keys(DOC_DEFAULT).map(function(n){ return prova(docCarica(n), n); })));
    STATO_SYNC.ultimo = Date.now();
    var rete = errori.filter(function(x){ return x.e && x.e.rete; }).length;
    if(errori.length){
      errori.forEach(function(x){ if(!x.e.rete) _registraErrore('sync', x.nome + ': ' + x.e.message); });
      if(manuale || !CAT.length) toast(rete ? 'Senza connessione: uso i dati salvati sul telefono' : '⚠️ Non aggiornato: ' + errori.map(function(x){ return x.nome; }).join(', '));
    } else if(manuale) toast('Tutto aggiornato ✓', { durata: 1400 });
    segnalaSync(rete ? 'Senza connessione' : '');
    await svuotaOutbox();
    renderTuttoSicuro();
    if(!U.lettura && PF.some(function(r){ return r.stato === 'pending'; })){
      var auto = await processaPending();
      await risolviPrezziUguali();
      if(auto) toast(auto + ' prezzi aggiornati in automatico dalle fatture (variazioni entro l\'1%)', { durata: 3500 });
      renderTuttoSicuro();
    } else if(!U.lettura) risolviPrezziUguali().then(renderTuttoSicuro);
    if(!U.lettura && conf().doppioniAuto){ var nu = await uniscitiDaSolo(); if(nu){ toast('Ho unito ' + nu + ' doppioni del catalogo (vedi Da fare)', { durata: 3500 }); renderTuttoSicuro(); } }
  })();
  try{ await _syncInCorso; } finally { _syncInCorso = null; }
}
async function aggiornaLeggero(){
  try{ await Promise.all([caricaRichieste(), caricaPF(), docCarica('or8_carrello'), docCarica('or8_stati')]); }catch(e){}
  if(PF.some(function(r){ return r.stato === 'pending'; })) await processaPending();
  renderTuttoSicuro();
}
function docAggiornatoDaRemoto(nome){ if(nome === 'or8_carrello'){ aggiornaBarra(); if(document.getElementById('shCarr')) renderCarrello(); } }

/* ── Migrazione dalla versione 7 (una volta sola, per tutti i dispositivi) ── */
async function migraDaV7(){
  if(U.lettura || conf().migratoV7 || !DOC.or8_conf.letto) return;
  var vecchio = null;
  try{ var r = await api('ceraldi_stato_condiviso?select=data&id=eq.main'); vecchio = r && r[0] ? r[0].data : null; }catch(e){ return; }
  if(!vecchio) vecchio = lsGet('co_state_v1', null);
  var n = 0;
  if(vecchio){
    var ov = vecchio.orderSupOverride || {}, note = vecchio.cartNotes || {};
    function converti(mappa){ var out = {}; Object.keys(mappa || {}).forEach(function(k){ var it = mappa[k], pr = it && it.product; if(!pr) return; var id = parseInt(k, 10), p = CATMAP[id]; if(p) out['p' + id] = { id: id, nome: p.name, conf: p.conf || '', qty: it.qty || 1, forn: ov[k] || null, nota: note[k] || '', da: [], at: new Date().toISOString() }; else out['x' + uid()] = { id: null, nome: maiusc(pr.name), conf: pr.conf || '', qty: it.qty || 1, forn: ov[k] || null, nota: note[k] || '', da: [] }; n++; }); return out; }
    var righe = converti(vecchio.cart), sal = converti(vecchio.savedForLater);
    if(Object.keys(righe).length || Object.keys(sal).length) await docModifica('or8_carrello', function(d){ Object.keys(righe).forEach(function(k){ if(!d.righe[k]) d.righe[k] = righe[k]; }); d.salvati = d.salvati || {}; Object.keys(sal).forEach(function(k){ if(!d.salvati[k]) d.salvati[k] = sal[k]; }); }, true);
    var pref = vecchio.favorites || {}, rem = vecchio.reminder;
    await docModifica('or8_conf', function(d){
      Object.keys(pref).forEach(function(k){ if(pref[k] && CATMAP[k]) d.preferiti[k] = 1; });
      if(rem && rem.day != null && !d.promemoria) d.promemoria = { giorni: [Number(rem.day)], ora: rem.time || '10:00' };
      d.migratoV7 = new Date().toISOString();
    }, true);
  } else await docModifica('or8_conf', function(d){ d.migratoV7 = new Date().toISOString(); }, true);
  if(n){ renderTutto(); toast('Ho portato nella nuova versione il carrello della versione precedente (' + n + ' prodotti)', { durata: 4500 }); }
}

/* ── Navigazione e disegno ───────────────────────────────────────── */
function renderTutto(){ renderOrdina(); renderTab(VIEW.tab); aggiornaBadge(); }
function renderTab(t){ if(t === 'ordina') renderOrdina(); else if(t === 'ordini') renderOrdini(); else if(t === 'dafare') renderDaFare(); else if(t === 'magazzino') renderMagazzino(); else if(t === 'analisi') renderAnalisi(); }
// Non ridisegno mentre stai scrivendo (si chiuderebbe la tastiera)
var _rinviato = false;
function renderTuttoSicuro(){
  var a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && !a.closest('.mo')){
    if(!_rinviato){ _rinviato = true; a.addEventListener('blur', function f(){ a.removeEventListener('blur', f); _rinviato = false; setTimeout(renderTuttoSicuro, 50); }); }
    aggiornaBadge(); return;
  }
  renderTutto();
  if(_schedaId != null && document.getElementById('shProd') && !(a && a.closest && a.closest('#shProd'))) renderScheda();
  if(document.getElementById('shCarr')) renderCarrello();
}
function vaiTab(t){
  VIEW.tab = t; window._paginaCorrente = t;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id === 'view-' + t); });
  document.querySelectorAll('.tab-item').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === t); });
  aggiornaBarra(); renderTab(t); window.scrollTo(0, 0);
  if(t === 'dafare' && location.hash !== '#da-fare') try{ history.replaceState(null, '', location.pathname); }catch(e){}
}
function aggiornaBadge(){
  var n = contaDaFare(), dafare = n.rich + n.var + n.forn + (conf().doppioniAuto ? 0 : n.dop), aperti = STORICO.filter(ordineAperto).length, sotto = CAT.filter(sottoScorta).length;
  setBadge('badgeDaFare', dafare); setBadge('badgeOrdini', aperti); setBadge('badgeMag', sotto);
  try{ if(navigator.setAppBadge){ if(dafare) navigator.setAppBadge(dafare); else navigator.clearAppBadge(); } }catch(e){}
}
function setBadge(id, n){ var b = document.getElementById(id); if(!b) return; b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hidden', !n); }

document.getElementById('appVer').textContent = 'v' + APP_VERSION;
_authAvvio();
