<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>__TITOLO__</title>
__FONT_LINK__
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fuori);color:var(--testo);font:400 16px/1.5 var(--f-testo);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accento-chiaro);outline-offset:2px}
.app{max-width:480px;margin:0 auto;background:var(--sfondo);min-height:100vh;position:relative;box-shadow:0 0 60px -20px rgba(30,20,16,.45);overflow-x:hidden}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ey{font:500 .7rem/1.3 var(--f-testo);letter-spacing:.18em;text-transform:uppercase}
.prz{font:500 1.0625rem/1 var(--f-testo);font-variant-numeric:tabular-nums;color:var(--prezzo)}

/* Copertina */
.cop{position:relative;background:var(--scuro);color:var(--su-scuro);overflow:hidden;padding-block:26px 26px}
.cop .sf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.26}
.cop .in{position:relative;display:grid;gap:14px}
.cop .logo{width:150px;height:auto}
.cop h1{font:italic 400 2.6rem/1 var(--f-display);color:var(--su-scuro)}
.cop .sal{font-size:1rem;color:var(--su-scuro);max-width:30ch}
.fid{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 .68rem/1.3 var(--f-testo);letter-spacing:.14em;text-transform:uppercase;color:var(--accento-chiaro)}
.fid span{display:inline-flex;gap:6px;align-items:center}
.fid span+span::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6;margin-right:10px}

/* Momento */
.mom{position:relative;margin:18px 16px 0;border-radius:4px;overflow:hidden;background:var(--scuro);color:var(--su-scuro);box-shadow:0 18px 40px -26px rgba(30,20,16,.8)}
.mom img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mom .ft{position:relative}
.mom .ft::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--scuro) 98%)}
.mom .tx{position:relative;margin-top:-34px;padding:0 20px 20px;display:grid;gap:8px}
.mom .ey{color:var(--accento-chiaro)}
.mom h2{font:400 2.2rem/1.02 var(--f-display);color:var(--su-scuro)}
.mom p{color:var(--su-scuro);font-size:.98rem}
.coppia{display:grid;gap:0;margin-top:6px;border-top:1px solid color-mix(in srgb,var(--accento-chiaro) 35%,transparent)}
.coppia button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--accento-chiaro) 20%,transparent);padding:10px 0;text-align:left;color:var(--su-scuro)}
.coppia .prz{color:var(--accento-chiaro)}
.cta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:13px 18px;font:500 .78rem/1 var(--f-testo);letter-spacing:.13em;text-transform:uppercase;min-height:44px}
.btn.oro{background:var(--accento-chiaro);color:var(--scuro)}
.vai-menu{justify-self:start;background:var(--accento-chiaro);color:var(--scuro);min-height:50px;padding:15px 24px;font-size:.88rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.28);cursor:pointer}
.btn.vuoto{background:transparent;border:1px solid currentColor}
.btn.scuro{background:var(--scuro);color:var(--su-scuro)}

/* Titoli di sezione in Home */
.tit{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}
.tit h3{font:400 1.7rem/1.05 var(--f-display)}
.tit .ey{color:var(--accento)}

/* Proposte del giorno */
.pista{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px 4px;scroll-padding:0 16px}
.pista::-webkit-scrollbar{display:none}
.pc{flex:0 0 82%;scroll-snap-align:start;background:var(--superficie);border:0;padding:0;text-align:left;border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(35,23,15,.08),0 12px 26px -20px rgba(35,23,15,.5);display:grid}
.pc img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pc .c{padding:12px 14px 14px;display:grid;gap:4px}
.pc .ey{color:var(--prezzo)}
.pc h4{font:400 1.35rem/1.12 var(--f-display)}
.pc .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc .d{font-size:.84rem;color:var(--testo-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.punti{display:flex;justify-content:center;gap:7px;margin-top:12px}
.punti i{width:6px;height:6px;border-radius:50%;background:var(--linea);transition:transform .2s,background .2s}
.punti i.on{background:var(--accento);transform:scale(1.3)}

/* Sezioni del menu (tavole) */
.tavole{display:grid;gap:10px}
.tav{position:relative;border:0;padding:0;border-radius:4px;overflow:hidden;min-height:118px;text-align:left;background:var(--scuro-2);color:var(--su-scuro);display:block;width:100%}
.tav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
.tav::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,13,10,.88) 15%,rgba(20,13,10,.15))}
.tav .t{position:relative;z-index:1;display:grid;gap:4px;padding:20px 18px}
.tav h3{font:400 1.75rem/1.05 var(--f-display)}
.tav small{font:500 .68rem/1.2 var(--f-testo);letter-spacing:.14em;text-transform:uppercase;color:var(--accento-chiaro)}
.tav .q{font-size:.82rem;color:var(--su-scuro)}
.tav.senza{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.tav.senza::after{display:none}
.tav.senza small{color:var(--accento)}.tav.senza .q{color:var(--testo-2)}

/* Storia */
.storia{margin-top:34px;background:var(--superficie);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.storia img{width:100%;aspect-ratio:3/2;object-fit:cover}
.storia .tx{padding-block:20px 24px;display:grid;gap:10px}
.storia h3{font:400 1.9rem/1.05 var(--f-display)}
.storia p{color:var(--testo-2);font-size:.98rem}
.storia .firma{font:italic 400 1.15rem/1.3 var(--f-display);color:var(--prezzo)}
.piede{padding-block:24px 120px;color:var(--testo-2);font-size:.82rem;display:grid;gap:8px}
.piede b{color:var(--testo);font-weight:500}

/* Pagina sezione */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--rev-h,0px));z-index:30;background:var(--scuro);color:var(--su-scuro)}
.bar .r{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.ind{background:color-mix(in srgb,var(--su-scuro) 14%,transparent);border:1.5px solid var(--accento-chiaro);border-radius:24px;color:var(--accento-chiaro);font:600 1.05rem/1 var(--f-testo);padding:0 20px 0 14px;min-height:48px;cursor:pointer;flex:none}
.ind:active{background:color-mix(in srgb,var(--su-scuro) 28%,transparent)}
.bar h2{font:400 1.3rem/1.1 var(--f-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid color-mix(in srgb,var(--su-scuro) 30%,var(--scuro));background:transparent;color:var(--su-scuro);border-radius:99px;padding:7px 12px;font-size:.8rem;white-space:nowrap}
.chips button.on{background:var(--accento-chiaro);border-color:var(--accento-chiaro);color:var(--scuro)}
.cat{padding-top:26px;scroll-margin-top:130px}
.cat h3{font:400 2rem/1.05 var(--f-display)}
.cat .nota{font-size:.8rem;color:var(--testo-2);margin-top:4px}
.consiglio{display:block;width:100%;margin-top:14px;border:0;padding:0;text-align:left;background:var(--superficie);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(35,23,15,.08),0 14px 28px -22px rgba(35,23,15,.6)}
.consiglio img{width:100%;aspect-ratio:16/10;object-fit:cover}
.consiglio .c{padding:14px 16px 16px;display:grid;gap:6px}
.consiglio .ey{color:var(--prezzo);display:flex;align-items:center;gap:8px}
.consiglio .ey::before{content:"";width:18px;height:1px;background:currentColor}
.consiglio .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.consiglio h4{font:400 1.55rem/1.1 var(--f-display)}
.consiglio .d{color:var(--testo-2);font-size:.92rem}
.righe{list-style:none;margin:8px 0 0;padding:0}
.righe li+li{border-top:1px solid var(--linea)}
.voce{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;width:100%;background:none;border:0;padding:14px 0;text-align:left;align-items:start}
.voce h4{font:500 1.02rem/1.25 var(--f-testo);color:var(--testo)}
.voce .d{font-size:.86rem;color:var(--testo-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.voce .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:7px}
.voce .prz{font-weight:600;font-size:1.12rem}
.voce img,.voce .vu{width:92px;height:92px;border-radius:3px;object-fit:cover;background:var(--velo)}
.tag{font:500 .62rem/1 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento);border:1px solid color-mix(in srgb,var(--accento) 45%,transparent);border-radius:2px;padding:4px 6px}
.tag.np{color:var(--prezzo);border-color:color-mix(in srgb,var(--prezzo) 40%,transparent)}
.altre{margin:6px 0 0;background:none;border:1px dashed var(--linea);border-radius:99px;padding:9px 14px;font-size:.82rem;color:var(--testo-2);width:100%}

/* Scheda prodotto */
.velo{overscroll-behavior:contain;position:fixed;inset:0;background:rgba(15,10,8,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:velo .2s ease}
@keyframes velo{from{opacity:0}}
.foglio{background:var(--superficie);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:14px 14px 0 0;animation:sale .28s cubic-bezier(.2,.8,.2,1);padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
@keyframes sale{from{transform:translateY(40px);opacity:.4}}
.foglio .ft{position:relative}
.foglio .ft img{width:100%;aspect-ratio:4/3;object-fit:cover}
.chiudi{position:absolute;top:12px;right:12px;height:46px;padding:0 18px 0 14px;border-radius:23px;border:1px solid color-mix(in srgb,var(--testo) 22%,transparent);background:var(--superficie);font:600 1rem/1 var(--f-testo);display:inline-flex;align-items:center;gap:8px;color:var(--testo);box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer}
.chiudi span{font-size:1.5rem;line-height:1;margin-top:-2px}
.foglio .c{padding:18px 20px 6px;display:grid;gap:10px}
.foglio h3{font:400 2rem/1.05 var(--f-display)}
.foglio .d{color:var(--testo-2);font-size:1rem;white-space:pre-line}
.foglio .r{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--linea);padding-top:14px;margin-top:4px}
.foglio .r .prz{font-size:1.6rem}
.all{font-size:.8rem;color:var(--testo-2);background:var(--sfondo);padding:10px 12px;border-radius:4px}
.all b{font-weight:500;color:var(--testo)}
.abb{padding:8px 20px 6px}
.abb h5{margin:10px 0 8px;font:500 .7rem/1 var(--f-testo);letter-spacing:.16em;text-transform:uppercase;color:var(--accento)}
.abb .l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;background:var(--sfondo);border:0;border-radius:4px;padding:6px;text-align:left}
.mini img,.mini .vu{width:52px;height:52px;border-radius:3px;object-fit:cover;background:var(--velo)}
.mini b{font-weight:500;font-size:.84rem;line-height:1.2;display:block}
.mini span{font-size:.78rem;color:var(--prezzo)}

/* Ordinazione */
.ord{position:fixed;z-index:50;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--scuro);color:var(--su-scuro);border:0;border-radius:99px;padding:8px 8px 8px 20px;box-shadow:0 14px 30px -12px rgba(15,10,8,.7)}
.ord .n{font-size:.88rem}
.ord .n b{color:var(--accento-chiaro);font-weight:500}
.ord .go{background:var(--accento-chiaro);color:var(--scuro);border-radius:99px;padding:10px 14px;font:500 .72rem/1 var(--f-testo);letter-spacing:.12em;text-transform:uppercase}
.lista{padding:22px 20px 8px;display:grid;gap:4px}
.lista h3{font:400 1.9rem/1.05 var(--f-display)}
.lista p.s{font-size:.86rem;color:var(--testo-2);margin-bottom:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--linea);padding:10px 0}
.qta{display:flex;align-items:center;gap:4px}
.qta button{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:var(--sfondo);font-size:1.05rem}
.qta span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.mostra{overscroll-behavior:contain;position:fixed;inset:0;z-index:70;background:var(--scuro);color:var(--su-scuro);display:flex;flex-direction:column;padding:max(28px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto}
.mostra .ey{color:var(--accento-chiaro)}
.mostra h3{font:italic 400 2.3rem/1.1 var(--f-display);margin:10px 0 20px;color:var(--su-scuro)}
.mostra ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.mostra li{font:400 1.9rem/1.15 var(--f-display);display:flex;gap:14px}
.mostra li b{font:500 1.5rem/1.3 var(--f-testo);color:var(--accento-chiaro);min-width:2.2ch}
.mostra .g{margin-top:auto;padding-top:24px;font-size:.86rem;color:color-mix(in srgb,var(--su-scuro) 70%,var(--scuro))}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}/* ── Menu per i clienti: modello senza contenuti. Colori, caratteri, testi e contenuti arrivano dal database (vedi menu_genera.py). ── */
:root{--sfondo:#F4F4F2;--superficie:#FFFFFF;--testo:#1F1F1F;--testo-2:#5C5C5C;--accento:#8A6D3B;--prezzo:#1F1F1F;--f-display:Georgia,"Times New Roman",serif;--f-testo:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
:root,[data-s],.cat,[data-p],.vh{--scuro:var(--c-scuro,var(--testo));--scuro-2:color-mix(in srgb,var(--scuro) 88%,#fff);--su-scuro:var(--c-su-scuro,var(--sfondo));--accento-chiaro:var(--c-accento-chiaro,color-mix(in srgb,var(--accento) 55%,#fff));--linea:color-mix(in srgb,var(--testo) 16%,var(--sfondo));--velo:color-mix(in srgb,var(--testo) 8%,var(--sfondo));--fuori:color-mix(in srgb,var(--sfondo) 85%,#000)}
.sezv,.pag,.vh{background:var(--sfondo);color:var(--testo)}
.cat{background:var(--sfondo);color:var(--testo)}
.cop .nome{font:500 .72rem/1.3 var(--f-testo);letter-spacing:.18em;text-transform:uppercase;color:var(--accento-chiaro)}
.cop .blk{margin:0}
.cop .blk.gut{padding-left:0;padding-right:0}
.cop .blk.t h3{font:500 .68rem/1.3 var(--f-testo);letter-spacing:.14em;text-transform:uppercase;color:var(--accento-chiaro)}
.cop .blk.t p,.cop .blk.t .ey{font-size:.8rem;color:var(--su-scuro)}
.cop .blk.f img{width:150px;height:auto}
.blk{margin-top:26px}
.blk .ey{color:var(--accento)}
.blk h3{font:400 1.8rem/1.08 var(--f-display)}
.blk p{color:var(--testo-2);font-size:.98rem;margin-top:8px;white-space:pre-line}
.blk.t{display:grid;gap:4px}
.blk.t .btn,.blk.tf .btn{margin-top:12px;justify-self:start;text-decoration:none;display:inline-block}
.blk.tf{background:var(--superficie);border-block:1px solid var(--linea);margin-top:34px}
.blk.tf img{width:100%;aspect-ratio:3/2;object-fit:cover}
.blk.tf .tx{padding-block:20px 24px;display:grid;gap:4px}
.blk.f{margin-inline:0}.blk.f img{width:100%;height:auto}
.blk.b{margin:22px 16px 0;background:var(--scuro);color:var(--su-scuro);border-radius:4px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px;text-align:left;border:0;width:calc(100% - 32px);text-decoration:none;font:inherit}
.blk.b.sf{grid-template-columns:1fr}
.blk.b img{width:96px;height:96px;object-fit:cover;border-radius:2px}
.blk.b .ey{color:var(--accento-chiaro);display:block}
.blk.b h3{font:400 1.5rem/1.05 var(--f-display);color:var(--su-scuro);margin:2px 0 4px}
.blk.b p{color:var(--su-scuro);opacity:.85;font-size:.84rem;line-height:1.35;margin:0}
.blk.b .go{display:block;margin-top:6px;font:500 .72rem/1 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento-chiaro)}
.pag{min-height:100vh;padding-bottom:130px}
/* testata delle pagine extra: foto «in alto» con ruolo logo / sfondo / motivo */
.tp{position:relative;overflow:hidden;background:var(--sfondo);padding:34px 16px 30px;display:grid;place-items:center}
.tp .mo{position:absolute;inset:0;background-repeat:repeat;background-size:150px auto;opacity:.9}
.tp .sf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tp .lg{position:relative;background:var(--superficie);padding:18px 22px;border-radius:6px;box-shadow:0 18px 40px -22px rgba(0,0,0,.55);width:min(320px,86%)}
.tp .lg img{width:100%;height:auto}
.blk.b .mo{grid-column:1/-1;height:26px;margin:-12px -12px 2px;background-color:var(--su-scuro);background-repeat:repeat-x;background-size:auto 42px;background-position:center;border-radius:4px 4px 0 0}
/* testo a righe: «Voce — spiegazione» e confronti «Voce — loro | noi» */
.dl{display:grid;gap:0;margin-top:10px;border-top:1px solid var(--linea)}
.dl div{display:grid;grid-template-columns:minmax(92px,34%) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:.95rem}
.dl dt{font:400 1.15rem/1.15 var(--f-display);color:var(--prezzo)}
.dl dd{margin:0;color:var(--testo-2)}
.cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem;table-layout:fixed}
.cmp th,.cmp td{padding:9px 6px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
.cmp th{font:500 .66rem/1.25 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento)}
.cmp td:first-child{font:400 1.05rem/1.2 var(--f-display);width:26%}
.cmp td:nth-child(2){color:var(--testo-2)}
.cmp td:last-child{color:var(--prezzo);font-weight:500;background:color-mix(in srgb,var(--prezzo) 7%,transparent)}
.cmp th:last-child{color:var(--prezzo)}
/* prodotti collegati a un blocco */
.pvs{display:grid;gap:10px;margin-top:14px}
.pv{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--superficie);border:1px solid var(--linea);border-radius:6px;padding:8px;text-align:left}
.pv.senza{grid-template-columns:1fr}
.pv img{width:76px;height:76px;object-fit:cover;border-radius:4px;background:#fff}
.pv .x{display:grid;gap:2px;min-width:0}
.pv b{font:400 1.2rem/1.15 var(--f-display);font-weight:400}
.pv small{color:var(--testo-2);font-size:.8rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.pv .prz{color:var(--prezzo);font:500 1.1rem/1 var(--f-testo)}
.pv .btn{min-height:38px;padding:10px 14px;font-size:.7rem}
.blk.b .pvs,.mom .pvs{color:var(--testo)}
.pag .bar h2{text-align:right}
.vars{margin:4px 0 0;padding:0;list-style:none;font-size:.92rem}

.lng{right:max(10px,calc((100vw - var(--lw))/2 + 10px))}

.mom:has(.ft) .ft::after{background:linear-gradient(90deg,transparent 55%,var(--scuro) 100%)}
.mom:has(.ft) .tx{margin-top:0;align-content:center;padding:28px 28px 28px 6px}

.pc{flex:0 0 46%}

.tav .t{padding:26px 24px}
.blk.tf:has(img){display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
.blk.tf:has(img) img{width:100%;height:100%;max-height:360px;aspect-ratio:auto;object-fit:cover}
.blk.tf:has(img) .tx{align-content:center;padding-block:28px}
.storia{display:grid;grid-template-columns:1fr 1fr}
.storia img{width:100%;height:100%;max-height:360px;aspect-ratio:auto;object-fit:cover}
.blk.b{margin:22px 32px 0;width:calc(100% - 64px)}
.pvs{grid-template-columns:repeat(2,minmax(0,1fr))}
.righe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px}
.righe li+li{border-top:0}
.righe li{border-bottom:1px solid var(--linea)}
.consiglio:has(img){display:grid;grid-template-columns:1fr 1fr}
.consiglio:has(img) img{width:100%;height:100%;min-height:220px;max-height:300px;aspect-ratio:auto;object-fit:cover}
.consiglio:has(img){max-height:300px;overflow:hidden}
.consiglio:has(img) .c{align-content:center;padding:22px 24px}
.velo{align-items:center;padding:24px}
.foglio{max-width:600px;max-height:90vh;border-radius:14px}
.ord{width:min(560px,calc(100% - 32px))}
}

.pc{flex:0 0 31%}
.tavole{grid-template-columns:repeat(3,minmax(0,1fr))}
.tav h3{font-size:2rem}
.cat h3{font-size:2.3rem}
}

  var cv = s.c.filter(catVis), n = cv.reduce(function(t, c){ return t + c.v.filter(dispOk).length; }, 0), f = s.f;
  if(!f) cv.some(function(c){ return c.v.some(function(v){ if(v.f && dispOk(v)){ f = v.f; return true; } }); });
  var nomi = cv.slice(0, 4).map(function(c){ return pulisci(c.n); }).join(' · ');
  return '<button type="button" class="tav' + (f ? '' : ' senza') + '" data-sez="' + s.id + '">' + (f ? '<img src="' + esc(f) + '" alt="">' : '') + '<span class="t"><small>' + n + ' ' + esc(T('voci')) + '</small><h3>' + esc(pulisci(s.n)) + '</h3><span class="q">' + esc(nomi) + (cv.length > 4 ? '…' : '') + '</span></span></button>';
}
function piede(){
  var L = D.locale, riga2 = [L.orari, L.tel ? T('tel') + ' ' + L.tel : ''].filter(Boolean).join(' · ');
  return '<footer class="piede gut">' + (L.ind ? '<b>' + esc(L.ind) + '</b>' : '') + (riga2 ? '<span>' + esc(riga2) + '</span>' : '') + (T('nota_prezzi') ? '<span>' + esc(T('nota_prezzi')) + '</span>' : '') + '</footer>';
}
function home(){
  var m = mom(), h = '<div class="vh">' + copertina(m) + momentoHtml(m) + proposte() + blocchi('home', 'dopo_proposte');
  if(D.sezioni.length) h += '<div class="gut" id="menu-sez"><div class="tit"><h3>' + esc(T('menu')) + '</h3><span class="ey">' + esc(T('sezione_invito')) + '</span></div><div class="tavole">' + D.sezioni.filter(secVis).map(tavola).join('') + '</div></div>';
  else h += '<p class="vuoto-menu">' + esc(T('menu_vuoto')) + '</p>';
  return h + blocchi('home', 'dopo_sezioni') + blocchi('home', 'piede') + piede() + '</div>';
}

/* sezione */
var _aperte = {};
function sezione(){
  var s = D.sezioni.find(function(x){ return x.id === S.sez; }); if(!s) return home();
  var h = '<div class="sezv" data-s="' + s.id + '"><div class="bar gut" id="bar"><div class="r"><button type="button" class="ind" data-home>‹ ' + esc(T('menu')) + '</button><h2>' + esc(pulisci(s.n)) + '</h2></div>' +
    '<div class="chips" id="chips">' + s.c.filter(catVis).map(function(c, i){ return '<button type="button" data-vai="c' + c.id + '"' + (i ? '' : ' class="on"') + '>' + esc(pulisci(c.n)) + '</button>'; }).join('') + '</div></div><main class="gut" style="padding-bottom:130px">';
  s.c.forEach(function(c){ h += categoria(c); });
  return h + (T('nota_prezzi') ? '<p class="piede" style="padding:26px 0 0">' + esc(T('nota_prezzi')) + '</p>' : '') + '</main></div>';
}
function categoria(c){
  var pc = proposteDi('categoria', c.id), cons = ((D.consigli || {})[c.id] || []).filter(function(id){ return VOCI[id] && dispOk(VOCI[id]) && !VOCI[id].es && pc.indexOf(VOCI[id]) < 0; });
  var mostrati = pc.map(function(v){ return v.id; }).concat(cons);
  var resto = c.v.filter(function(v){ return mostrati.indexOf(v.id) < 0 && dispOk(v); });
  if(!pc.length && !cons.length && !resto.length) return '';  /* tutta fuori orario: niente titolo vuoto */
  var lungo = resto.length > 14 && !_aperte[c.id], vis = lungo ? resto.slice(0, 10) : resto;
  var h = '<section class="cat" id="c' + c.id + '"><h3>' + esc(pulisci(c.n)) + '</h3>' + (nota(c.n) ? '<p class="nota">' + esc(nota(c.n)) + '</p>' : '') + (c.d ? '<p class="desc">' + esc(c.d) + '</p>' : '');
  h += pc.map(function(v){ return evidenza(v, T('proposta_etichetta')); }).join('') + cons.map(function(id){ return evidenza(VOCI[id], T('consiglio')); }).join('');
  h += '<ul class="righe">' + vis.map(riga).join('') + '</ul>';
  if(lungo) h += '<button type="button" class="altre" data-apri="' + c.id + '">' + esc(T('mostra_altre')) + ' ' + (resto.length - 10) + '</button>';
  return h + '</section>';
}
function colDi(v){ return (D.col && D.col['v' + v.id]) || []; }
function tags(v){ var t = (v.b || []).map(function(x){ return '<span class="tag np">' + esc(x) + '</span>'; }); if(colDi(v).some(function(x){ return x.k === 's'; })) t.push('<span class="tag sto">📖 ' + esc(T('storia_tag')) + '</span>'); if(v.es) t.push('<span class="tag fin">' + esc(T('finito')) + '</span>'); return t.join(''); }
function evidenza(v, etich){
  if(!v) return '';
  return '<button type="button" class="consiglio" data-voce="' + v.id + '">' + img(v.fg || v.f, pulisci(v.n)) + '<span class="c"><span class="ey">' + esc(etich) + '</span><span class="r"><h4>' + esc(pulisci(v.n)) + '</h4><span class="prz">' + prezzo(v.p) + '</span></span>' + (v.d ? '<span class="d">' + esc(v.d) + '</span>' : '') + (tags(v) ? '<span class="m" style="display:flex;gap:6px;margin-top:2px">' + tags(v) + '</span>' : '') + '</span></button>';
}
function riga(v){
  return '<li><button type="button" class="voce" data-voce="' + v.id + '"><span><h4>' + esc(pulisci(v.n)) + '</h4>' + (v.d ? '<span class="d">' + esc(v.d) + '</span>' : '') +
    '<span class="m"><span class="prz">' + prezzo(v.p) + '</span>' + tags(v) + '</span></span>' + (v.f ? img(v.f, '') : '') + '</button></li>';
}

/* pagine extra */
function pagina(cod){
  var p = D.pagine[cod]; if(!p) return home();
  return '<div class="pag" data-p="' + esc(cod) + '"><div class="bar gut"><div class="r"><button type="button" class="ind" data-home>‹ ' + esc(T('menu')) + '</button><h2>' + esc(p.titolo || '') + '</h2></div></div>' + testataPagina(p) + p.blocchi.map(blocco).join('') + piede() + '</div>';
}

/* scheda prodotto */
function mini(id){ var v = VOCI[id]; if(!v) return ''; return '<button type="button" class="mini" data-voce="' + id + '">' + img(v.f, '') + '<span><b>' + esc(pulisci(v.n)) + '</b><span>' + prezzo(v.p) + '</span></span></button>'; }
function apriVoce(id, zitto){
  var v = VOCI[id]; if(!v) return;
  if(!zitto) STAT('prodotto', id);
  var c = CATDI[id], ab = [], A = D.abb || { v: {}, c: {} };
  (A.v[id] || []).concat(A.c[c.id] || []).forEach(function(x){ if(x !== id && VOCI[x] && dispOk(VOCI[x]) && !VOCI[x].es && ab.indexOf(x) < 0) ab.push(x); });
  ab = ab.slice(0, 2);
  var al = v.al == null ? '' : (v.al.length ? '<b>' + esc(T('allergeni_dichiarati')) + '</b> ' + esc(v.al.join(', ')) + '. ' : esc(T('nessun_allergene')) + ' ');
  var vr = v.var && v.var.length ? '<ul class="vars">' + v.var.map(function(x, i){ var nuovo = i === 0 || v.var[i - 1].g !== x.g; return (nuovo && x.g ? '<li class="g">' + esc(x.g) + '</li>' : '') + '<li><span>' + esc(x.n) + '</span><span class="prz">' + (x.d > 0 ? '+' : '') + (x.d ? prezzo(x.d) : '') + '</span></li>'; }).join('') + '</ul>' : '';
  var fo = v.fg || v.f;
  var html = '<div class="velo" id="velo"><div class="foglio" role="dialog" aria-modal="true" aria-label="' + esc(pulisci(v.n)) + '">' +
    (fo ? '<div class="ft">' + img(fo, v.fa || pulisci(v.n)) + '<button type="button" class="chiudi" data-chiudi aria-label="' + esc(T('chiudi')) + '"><span aria-hidden="true">×</span> ' + esc(T('chiudi')) + '</button></div>' : '<div style="height:52px;position:relative"><button type="button" class="chiudi" data-chiudi aria-label="' + esc(T('chiudi')) + '"><span aria-hidden="true">×</span> ' + esc(T('chiudi')) + '</button></div>') +
    '<div class="c"><span class="ey" style="color:var(--accento)">' + esc(pulisci(c.n)) + '</span><h3>' + esc(pulisci(v.n)) + '</h3>' + (v.d ? '<p class="d">' + esc(v.d) + '</p>' : '') + (tags(v) ? '<span style="display:flex;gap:6px;flex-wrap:wrap">' + tags(v) + '</span>' : '') + vr +
    (fo && v.ft === 'illustrativa' ? '<span class="cap">' + esc(T('foto_illustrativa')) + '</span>' : '') +
    '<div class="all">' + al + esc(T('allergeni')) + '</div>' + collegamenti(colDi(v).concat((D.col && D.col['c' + c.id]) || [])) +
    '<div class="r"><span class="prz">' + prezzo(v.p) + '</span>' + (v.es ? '<button type="button" class="btn scuro" disabled>' + esc(T('finito')) + '</button>' : '<button type="button" class="btn scuro" data-aggiungi="' + id + '">' + esc(T('aggiungi')) + '</button>') + '</div></div>' +
    (ab.length ? '<div class="abb"><h5>' + esc(T('abbinamento')) + '</h5><div class="l">' + ab.map(mini).join('') + '</div></div>' : '') + '</div></div>';
  chiudiVelo(); document.body.insertAdjacentHTML('beforeend', html);
}
function collegamenti(l){
  /* «Scopri di più»: la storia sul sito (si apre a parte) o il luogo nella guida (stessa scheda). Titoli dal database. */
  if(!l.length) return '';
  return '<div class="lks"><h5>' + esc(T('scopri')) + '</h5>' + l.map(function(x){ var sito = x.k === 's';
    return '<a class="lk" href="' + esc(x.u) + '"' + (/^https?:/.test(x.u) ? ' target="_blank" rel="noopener"' : '') + '><span class="ic" aria-hidden="true">' + (sito ? '📖' : '🗺️') + '</span><span><span class="ey">' + esc(T(sito ? 'la_sua_storia' : 'nella_guida')) + '</span><b>' + esc(x.t) + '</b>' +
      (x.x ? '<small>' + esc(x.x) + '</small>' : '') + (x.it ? '<small>' + esc(T('in_italiano')) + '</small>' : '') + '</span><i aria-hidden="true">' + (sito ? '↗' : '›') + '</i></a>'; }).join('') + '</div>';
}
function chiudiVelo(){ var x = document.getElementById('velo'); if(x) x.remove(); var y = document.getElementById('mostra'); if(y) y.remove(); aggiornaBlocco(); }
/* con una finestra aperta la pagina sotto resta ferma; alla chiusura torna esattamente dov'era */
var _blocco = null;
function aggiornaBlocco(){
  var aperta = !!(document.getElementById('velo') || document.getElementById('mostra')), b = document.body;
  if(aperta && _blocco === null){ _blocco = window.scrollY; b.style.position = 'fixed'; b.style.top = -_blocco + 'px'; b.style.left = '0'; b.style.right = '0'; b.style.width = '100%'; }
  else if(!aperta && _blocco !== null){ var y = _blocco; _blocco = null; b.style.position = b.style.top = b.style.left = b.style.right = b.style.width = ''; window.scrollTo(0, y); }
}
new MutationObserver(aggiornaBlocco).observe(document.body, { childList: true });
try{ history.scrollRestoration = 'manual'; }catch(e){}

/* ordinazione (promemoria locale, non inviato) */
function aggiungi(ids){ ids.forEach(function(id){ S.ord[id] = (S.ord[id] || 0) + 1; }); salvaOrd(); pillola(true); }
function conta(){ return Object.keys(S.ord).reduce(function(t, k){ return t + S.ord[k]; }, 0); }
function pillola(lampo){
  var p = document.getElementById('ord'), n = conta();
  if(!n){ if(p) p.remove(); return; }
  var h = '<span class="n">' + esc(T('ordinazione')) + ' · <b>' + n + ' ' + esc(n === 1 ? T('prodotto') : T('prodotti')) + '</b></span><span class="go">' + esc(T('vedi')) + '</span>';
  if(!p){ document.body.insertAdjacentHTML('beforeend', '<button type="button" class="ord" id="ord" data-lista>' + h + '</button>'); p = document.getElementById('ord'); } else p.innerHTML = h;
  if(lampo && p.animate) p.animate([{ transform: 'translateX(-50%) scale(1)' }, { transform: 'translateX(-50%) scale(1.05)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 320 });
}
function lista(){
  var ids = Object.keys(S.ord).filter(function(k){ return S.ord[k] > 0 && VOCI[k]; });
  var tot = ids.reduce(function(t, k){ return t + VOCI[k].p * S.ord[k]; }, 0);
  var html = '<div class="velo" id="velo"><div class="foglio" role="dialog" aria-modal="true" aria-label="' + esc(T('ordinazione')) + '"><div style="position:relative;height:8px"><button type="button" class="chiudi" data-chiudi aria-label="' + esc(T('chiudi')) + '" style="top:12px"><span aria-hidden="true">×</span> ' + esc(T('chiudi')) + '</button></div><div class="lista">' +
    '<h3>' + esc(T('ordinazione')) + '</h3><p class="s">' + esc(T('promemoria')) + '</p>' +
    (ids.length ? ids.map(function(k){ var v = VOCI[k]; return '<div class="li"><span>' + esc(pulisci(v.n)) + '<br><span class="prz" style="font-size:.9rem">' + prezzo(v.p) + '</span></span><span class="qta"><button type="button" data-meno="' + k + '" aria-label="−">−</button><span>' + S.ord[k] + '</span><button type="button" data-piu="' + k + '" aria-label="+">+</button></span></div>'; }).join('') +
      '<div class="li" style="font-size:.86rem;color:var(--testo-2)"><span>' + esc(T('totale')) + '</span><span class="prz">' + prezzo(tot) + '</span></div>' +
      '<div class="cta"><button type="button" class="btn scuro" data-mostra style="flex:1">' + esc(T('mostra_personale')) + '</button></div>' : '<p class="s">' + esc(T('ordine_vuoto')) + '</p>') + '</div></div></div>';
  chiudiVelo(); document.body.insertAdjacentHTML('beforeend', html);
}
function mostra(){
  var ids = Object.keys(S.ord).filter(function(k){ return S.ord[k] > 0 && VOCI[k]; });
  chiudiVelo();
  document.body.insertAdjacentHTML('beforeend', '<div class="mostra" id="mostra" role="dialog" aria-modal="true" aria-label="' + esc(T('ordinazione')) + '"><span class="ey">' + esc(D.locale.nome || '') + ' · ' + esc(T('per_personale')) + '</span><h3>' + esc(T('ordinazione_intro')) + '</h3><ul>' +
    ids.map(function(k){ return '<li><b>' + S.ord[k] + '×</b><span>' + esc(pulisci(VOCI[k].n)) + '</span></li>'; }).join('') + '</ul><div class="g">' + esc(T('grazie')) + '</div><div class="cta"><button type="button" class="btn vuoto" data-chiudi style="color:var(--accento-chiaro)">' + esc(T('torna_menu')) + '</button></div></div>');
}

/* navigazione */
function daHash(avvio){ var h = location.hash, m;
  if((m = /^#v-(\d+)$/.exec(h)) && VOCI[+m[1]]){ var id = +m[1], s = D.sezioni.filter(function(x){ return x.c.some(function(c){ return c.v.some(function(v){ return v.id === id; }); }); })[0]; S.vista = 'sez'; S.sez = s.id; setTimeout(function(){ apriVoce(id, avvio && !NUOVA); }, 0); return; }  /* un prodotto per indirizzo: dalla guida o da un link */
  if((m = /^#p-([a-z0-9-]+)$/.exec(h)) && D.pagine[m[1]]){ S.vista = 'pag'; S.pag = m[1]; } else if((m = /^#s-(\d+)$/.exec(h)) && D.sezioni.some(function(s){ return s.id === +m[1]; })){ S.vista = 'sez'; S.sez = +m[1]; } }
/* torna alla posizione lasciata, anche se immagini e caratteri cambiano l'altezza subito dopo */
function ripristina(y){ document.documentElement.style.overflowAnchor = 'none'; window.scrollTo(0, y); var n = 0; (function r(){ if(Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y); if(++n < 12) setTimeout(r, 50); else document.documentElement.style.overflowAnchor = ''; })(); }
function salvaPos(){ try{ history.replaceState(Object.assign({}, history.state || {}, { vista: S.vista, sez: S.sez, pag: S.pag, y: _blocco !== null ? _blocco : window.scrollY }), ''); }catch(e){} }
function vai(st){ var prima = S.vista; salvaPos(); Object.assign(S, st); if(st.vista === 'sez') STAT('sezione', st.sez); else if(st.vista === 'pag') STAT('pagina', st.pag); disegna(true); try{ history.pushState({ vista: S.vista, sez: S.sez, pag: S.pag, da: prima, y: 0 }, ''); }catch(e){} }
window.addEventListener('popstate', function(e){ var st = e.state || { vista: 'home' }; S.vista = st.vista; S.sez = st.sez; S.pag = st.pag; chiudiVelo(); disegna(false); ripristina(st.y || 0); });
function disegna(inCima){
  document.getElementById('app').innerHTML = S.vista === 'sez' ? sezione() : S.vista === 'pag' ? pagina(S.pag) : home();
  if(inCima) window.scrollTo(0, 0);
  pillola(false); avviaPista(); spia();
}
var _pT = null;
function avviaPista(){
  clearInterval(_pT); var p = document.getElementById('pista'); if(!p) return;
  var punti = document.querySelectorAll('.punti i'), fermo = false;
  function k(){ var w = p.children[0].getBoundingClientRect().width + 12; return Math.round(p.scrollLeft / w); }
  p.addEventListener('scroll', function(){ var i = k(); punti.forEach(function(x, j){ x.className = i === j ? 'on' : ''; }); }, { passive: true });
  ['pointerdown', 'touchstart', 'wheel', 'focusin'].forEach(function(ev){ p.addEventListener(ev, function(){ fermo = true; }, { passive: true }); });
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches || p.children.length < 2) return;
  _pT = setInterval(function(){ if(fermo || !document.body.contains(p)) return; var w = p.children[0].getBoundingClientRect().width + 12, n = (k() + 1) % p.children.length; p.scrollTo({ left: n * w, behavior: 'smooth' }); }, 5000);
}
var _spia = null;
function spia(){
  if(_spia) _spia.disconnect(); var chips = document.getElementById('chips'); if(!chips || !('IntersectionObserver' in window)) return;
  _spia = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ chips.querySelectorAll('button').forEach(function(b){ var on = b.dataset.vai === e.target.id; b.classList.toggle('on', on); if(on){ var x = b.offsetLeft - (chips.clientWidth - b.offsetWidth) / 2; chips.scrollTo({ left: Math.max(0, x), behavior: 'smooth' }); } }); } }); }, { rootMargin: '-140px 0px -60% 0px' });
  document.querySelectorAll('.cat').forEach(function(c){ _spia.observe(c); });
}
document.addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-b]'))) STAT('blocco', t.dataset.b);  /* conteggio, poi il clic prosegue normalmente */
  if((t = e.target.closest('.pc[data-voce]'))) STAT('proposta', t.dataset.voce);
  if((t = e.target.closest('[data-vai]')) && /^c\d+$/.test(t.dataset.vai)) STAT('categoria', t.dataset.vai.slice(1));
  if((t = e.target.closest('[data-aggiungi]'))){ aggiungi(t.dataset.aggiungi.split(',').map(Number)); t.textContent = T('aggiunto'); return; }
  if(e.target.closest('[data-chiudi]') || e.target.id === 'velo'){ chiudiVelo(); return; }
  if((t = e.target.closest('[data-piu]'))){ S.ord[t.dataset.piu]++; salvaOrd(); lista(); pillola(false); return; }
  if((t = e.target.closest('[data-meno]'))){ S.ord[t.dataset.meno]--; if(S.ord[t.dataset.meno] <= 0) delete S.ord[t.dataset.meno]; salvaOrd(); lista(); pillola(false); return; }
  if(e.target.closest('[data-mostra]')){ mostra(); return; }
  if(e.target.closest('[data-lista]')){ lista(); return; }
  if((t = e.target.closest('[data-pag]'))){ chiudiVelo(); vai({ vista: 'pag', pag: t.dataset.pag }); return; }
  if(e.target.closest('[data-home]')){ if(history.state && history.state.da === 'home'){ history.back(); } else vai({ vista: 'home' }); return; }
  if((t = e.target.closest('[data-sez]'))){ vai({ vista: 'sez', sez: +t.dataset.sez }); return; }
  if((t = e.target.closest('[data-apri]'))){ _aperte[t.dataset.apri] = true; var y = window.scrollY; disegna(false); window.scrollTo(0, y); return; }
  if((t = e.target.closest('[data-vai]'))){ var el = document.getElementById(t.dataset.vai); if(el) el.scrollIntoView({ behavior: 'smooth' }); return; }
  if((t = e.target.closest('[data-voce]'))){ apriVoce(+t.dataset.voce); return; }
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') chiudiVelo(); });
window.addEventListener('hashchange', function(){ daHash(); disegna(true); });
/* Wi-Fi ospiti: pulsante fisso accanto alla lingua, scheda con rete, password da copiare e QR da inquadrare */
function bottoneWifi(){
  var w = D.locale && D.locale.wifi; if(!w || !w.rete) return;
  document.documentElement.classList.add('cl', 'cw');
  var b = document.createElement('button'); b.type = 'button'; b.className = 'wf'; b.setAttribute('aria-label', T('wifi_titolo'));
  if(!(D.lingue && D.lingue.length > 1)) b.style.right = '10px';
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></svg>';
  b.onclick = apriWifi; document.body.appendChild(b);
}
function apriWifi(){
  STAT('wifi');
  var w = D.locale.wifi;
  function riga(et, val, k){ return '<div class="rg"><small>' + esc(et) + '</small><b>' + esc(val) + '</b><button type="button" class="cp" data-copia="' + k + '">' + esc(T('wifi_copia')) + '</button></div>'; }
  var html = '<div class="velo" id="velo"><div class="foglio" role="dialog" aria-modal="true" aria-label="' + esc(T('wifi_titolo')) + '"><div style="position:relative;height:8px"><button type="button" class="chiudi" data-chiudi aria-label="' + esc(T('chiudi')) + '" style="top:12px"><span aria-hidden="true">×</span> ' + esc(T('chiudi')) + '</button></div><div class="wfs">' +
    '<h3>' + esc(T('wifi_titolo')) + '</h3>' + riga(T('wifi_rete'), w.rete, 'rete') + (w.pw ? riga(T('wifi_password'), w.pw, 'pw') : '') +
    (w.qr ? '<div class="qr" role="img" aria-label="QR Wi-Fi">' + w.qr + '</div><p>' + esc(T('wifi_qr')) + '</p>' : '') + '</div></div></div>';
  chiudiVelo(); document.body.insertAdjacentHTML('beforeend', html);
  document.querySelectorAll('#velo [data-copia]').forEach(function(x){ x.onclick = function(){
    var v = x.dataset.copia === 'pw' ? w.pw : w.rete, ok = function(){ x.textContent = T('wifi_copiato'); };
    try{ navigator.clipboard.writeText(v).then(ok, function(){ vecchio(v); ok(); }); }catch(e){ vecchio(v); ok(); }
  }; });
  function vecchio(v){ var a = document.createElement('textarea'); a.value = v; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(e){} a.remove(); }
}
function selettore(){
  var L = D.lingue; if(!L || L.length < 2) return;
  document.documentElement.classList.add('cl');
  var cur = L.filter(function(x){ return x.c === D.lingua; })[0] || L[0];
  var w = document.createElement('div'); w.className = 'lng';
  w.innerHTML = '<button type="button" aria-haspopup="true" aria-expanded="false" aria-label="' + esc(T('lingua')) + '">' + esc(cur.b || cur.c.toUpperCase()) + '</button><ul>' + L.map(function(x){ return '<li><a href="' + esc(x.u || './') + '" data-lng="' + esc(x.c) + '" lang="' + esc(x.c) + '"' + (x.c === D.lingua ? ' aria-current="true"' : '') + '>' + esc((x.b ? x.b + ' ' : '') + x.n) + '</a></li>'; }).join('') + '</ul>';
  document.body.appendChild(w);
  var b = w.querySelector('button');
  b.addEventListener('click', function(e){ e.stopPropagation(); var on = w.classList.toggle('on'); b.setAttribute('aria-expanded', on ? 'true' : 'false'); });
  document.addEventListener('click', function(e){ if(!w.contains(e.target)){ w.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); } });
  w.addEventListener('click', function(e){ var a = e.target.closest('a[data-lng]'); if(!a) return; try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} e.preventDefault(); location.href = (a.getAttribute('href') || './') + (S.vista === 'sez' ? '#s-' + S.sez : S.vista === 'pag' ? '#p-' + S.pag : ''); });  /* si resta dove si era */
  if(D.lingua === 'it'){ try{ var s = localStorage.getItem('menu_lingua'), t = s && s !== 'it' && L.filter(function(x){ return x.c === s; })[0]; if(t){ VIA = true; location.replace(t.u + (NUOVA ? '?nv=1' : '') + location.hash); } }catch(x){} }  /* chi ha già scelto una lingua la ritrova */
}
daHash(true); disegna(false); selettore(); bottoneWifi();
if(NUOVA && !VIA){ STAT('apertura'); if(S.vista === 'sez') STAT('sezione', S.sez); else if(S.vista === 'pag') STAT('pagina', S.pag); }
})();
</script></body></html>
