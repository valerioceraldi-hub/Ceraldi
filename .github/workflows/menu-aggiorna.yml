# Rigenera il menu per i clienti (cartella menu-nuovo/) dai dati del database.
# - Ogni 30 minuti dalle 6 alle 21 (ora italiana, circa) e su richiesta («Run workflow» nella scheda Actions).
# - Legge solo i dati pubblici del menu con la chiave pubblica «anon» (la stessa delle app): nessun segreto nuovo.
# - Scrive un commit solo se il menu è cambiato. Se il database non risponde o non c'è nessuna voce pubblicata, si ferma e il menu online resta com'è.
# Per spegnerlo: scheda Actions › «Aggiorna menu clienti» › «Disable workflow».
name: Aggiorna menu clienti
on:
  schedule:
    - cron: '7,37 4-20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: menu-aggiorna
  cancel-in-progress: false
jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Genera il menu dal database
        run: |
          KEY=$(grep -o "SB_KEY = '[^']*'" ceraldi_menu.html | cut -d"'" -f2)
          test -n "$KEY"
          MENU_SB_URL=https://qaqqptpprmfjlolordaq.supabase.co MENU_SB_KEY="$KEY" \
            python3 caffe/_build/menu_genera.py --out menu-nuovo --tutte-le-lingue --copia-foto --noindex
      - name: Pubblica se è cambiato
        run: |
          git add -A menu-nuovo
          if git diff --cached --quiet; then echo "Menu invariato"; exit 0; fi
          git -c user.name="menu-automatico" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "menu-nuovo: aggiornato dal database"
          git push
