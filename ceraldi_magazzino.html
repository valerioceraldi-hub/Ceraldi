<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magazzino Tè · Ceraldi</title>
<link rel="manifest" href="manifest-magazzino.webmanifest">
<meta name="theme-color" content="#1F3A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magazzino Tè">
<link rel="apple-touch-icon" href="icon-magazzino-192.png">
<link rel="icon" href="icon-magazzino-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B24; --ink-2:#3D4A42; --muted:#7D776A; --paper:#F3EDE2; --card:#FBF8F2;
  --line:#E3DACA; --green:#1F3A2E; --green-2:#2C5140; --cream:#F6F0E3; --copper:#B5713A;
  --red:#B8432F; --red-bg:#F6E2DC; --amber:#B97E12; --amber-bg:#F7EBCF; --ok:#3F7A52;
  --r:18px; --shadow:0 1px 0 rgba(30,43,36,.04),0 6px 18px -10px rgba(30,43,36,.25);
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,-apple-system,sans-serif;
  /* variabili della schermata di accesso (identica alle altre app Ceraldi) */
  --bg:var(--paper); --surface:var(--card); --surface2:#ECE4D5; --surface3:#D9CFBC; --ink3:var(--muted); --sep:var(--line); --blue:var(--green); --ink2:var(--ink-2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  background-image:radial-gradient(rgba(30,43,36,.035) 1px,transparent 1px);background-size:5px 5px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto}
.spinner{width:22px;height:22px;border:2.5px solid var(--surface3);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- header ---------- */
.top{background:var(--green);color:var(--cream);padding:calc(18px + env(safe-area-inset-top)) 20px 20px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(201,166,104,.22),transparent 65%);pointer-events:none}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.eyebrow{white-space:nowrap;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;font-weight:700}
h1{font-family:var(--serif);font-weight:600;font-size:34px;margin:4px 0 0;letter-spacing:-.01em;line-height:1}
h1 em{font-style:italic;font-weight:400;color:#D9B77E}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.1);padding:6px 10px 6px 7px;border-radius:99px;white-space:nowrap;margin-top:2px;max-width:150px}
.who i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#D9B77E;color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis}
.net{display:none;margin-top:12px;position:relative;z-index:1;background:rgba(229,139,115,.2);color:#F7C9BC;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700}
.net.on{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;text-align:left}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.05}
.stat span{font-size:11.5px;opacity:.75;font-weight:600}
.stat.out b{color:#F0A08A}.stat.low b{color:#EBC872}
.health{display:flex;height:6px;border-radius:9px;overflow:hidden;margin-top:14px;background:rgba(255,255,255,.08);position:relative;z-index:1}
.health i{display:block;height:100%;transition:width .5s ease}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11px;opacity:.75;position:relative;z-index:1}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ---------- controls ---------- */
.controls{padding:18px 16px 4px;display:grid;gap:12px}
.pickhead{margin:4px 0 2px}
.pickhead h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0}
.pickhead p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.search svg{flex:none;opacity:.5}
.search input{border:0;background:none;outline:none;flex:1;height:100%;font-size:16px;min-width:0}
.seg{display:inline-flex;background:#E9E1D2;border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small-muted{font-size:12.5px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.chip .d{width:9px;height:9px;border-radius:50%}
.chip small{font-weight:600;opacity:.55}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* ---------- shelf ---------- */
.group{padding:10px 16px 6px}
.g-head{display:flex;align-items:baseline;gap:10px;margin:14px 0 12px}
.g-head h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em}
.g-head .bar{width:4px;height:18px;border-radius:3px;align-self:center}
.g-head .meta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;transition:transform .15s ease,box-shadow .15s ease;min-height:178px;width:100%}
.card:active{transform:scale(.97)}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(30,43,36,.45)}}
.card .halo{position:absolute;inset:0;border-radius:var(--r);pointer-events:none;opacity:.13;background:radial-gradient(90px 70px at 50% 30%,var(--c),transparent 70%)}
.tin-box{display:flex;justify-content:center;padding-top:2px;position:relative}
.tin{width:58px;height:78px;display:block;overflow:visible}
.c-name{font-weight:700;font-size:14px;line-height:1.2;position:relative}
.c-foot{display:flex;align-items:center;justify-content:space-between;position:relative}
.c-qty{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1}
.c-qty small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:7px}
.tag.out{background:var(--red-bg);color:var(--red)}
.tag.low{background:var(--amber-bg);color:var(--amber)}
.c-cat{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--muted);position:relative}
.c-cat i{width:7px;height:7px;border-radius:50%}
.note-dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 3px rgba(181,113,58,.18)}
.takebtn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:40px;border-radius:12px;background:var(--green);color:var(--cream);font-weight:800;font-size:14px;margin-top:auto}
.card.dim{opacity:.6}.card.dim .takebtn{background:#CFC8B8;color:#6F695C}
.card.pop{animation:pop .35s ease}
@keyframes pop{30%{transform:scale(.93);box-shadow:0 0 0 4px rgba(63,122,82,.35)}}
.wave{animation:wave 4.5s linear infinite}
@keyframes wave{to{transform:translateX(-30px)}}
@media (prefers-reduced-motion:reduce){.wave{animation:none}.card.pop{animation:none}}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty h3{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:21px;margin:12px 0 6px}

/* ---------- liste ---------- */
.panel{margin:18px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-head h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;line-height:1.1}
.panel-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px}
.btn.primary{background:var(--green);color:var(--cream)}
.btn.soft{background:#ECE4D5;color:var(--ink)}
.btn.danger{color:var(--red);background:transparent;border:1px solid #E7C9C0}
.btn.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.sub-h{padding:10px 18px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:7px;background:#F6F1E7;border-top:1px solid var(--line)}
.sub-h i{width:7px;height:7px;border-radius:50%}
.li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid #EFE8DB;width:100%;text-align:left}
.li .tin{width:30px;height:40px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14.5px;font-weight:700}
.li .t span{font-size:12.5px;color:var(--muted)}
.li .r{text-align:right;font-family:var(--serif);font-size:18px;font-weight:600;white-space:nowrap}
.delta{font-family:var(--sans);font-size:12px;font-weight:800;padding:3px 7px;border-radius:7px;margin-left:6px;vertical-align:2px}
.delta.up{background:#E1EEDF;color:var(--ok)}.delta.down{background:var(--red-bg);color:var(--red)}
.time{font-size:12px;color:var(--muted);font-weight:700;width:40px;flex:none}
.kind{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}

/* ---------- tabs + FAB ---------- */
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--copper);color:#fff;box-shadow:0 10px 24px -8px rgba(181,113,58,.7);display:grid;place-items:center;z-index:20;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab[hidden]{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,248,242,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;max-width:520px;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green)}
.tab.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.tab .bdg{position:absolute;top:1px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:800}

/* ---------- scheda prodotto ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(18,28,22,.42);animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:26px;animation:fade .2s ease}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:#D6CCBA;margin:4px auto 12px}
.sh-head{display:flex;gap:14px;align-items:center}
.sh-head .tin{width:74px;height:100px;flex:none}
.sh-cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.sh-name{width:100%;border:0;background:transparent;font-family:var(--serif);font-size:26px;font-weight:600;padding:2px 0;outline:none;border-bottom:1.5px dashed var(--line);line-height:1.15}
.x{width:38px;height:38px;border-radius:12px;background:#E9E1D2;display:grid;place-items:center;flex:none;align-self:flex-start}
.block-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:10px}
.qty-row{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;gap:6px;align-items:stretch}
.qty-row button{height:54px;border-radius:13px;background:#ECE4D5;font-weight:800;font-size:16px}
.qty-row button.p{background:var(--green);color:var(--cream)}
.qty-row button:active{transform:scale(.94)}
.qty-in{width:100%;height:54px;text-align:center;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-family:var(--serif);font-size:28px;font-weight:600;outline:none}
.qty-in:focus{border-color:var(--green)}
.st-line{margin-top:10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.st-line i{width:8px;height:8px;border-radius:50%}
.mini{display:flex;align-items:center;gap:10px}
.mini button{width:42px;height:42px;border-radius:12px;background:#ECE4D5;font-size:20px;font-weight:700}
.mini b{font-family:var(--serif);font-size:24px;min-width:34px;text-align:center}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.cat-pick{display:flex;flex-wrap:wrap;gap:7px}
.note-in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none;font-size:16px}
.note-in:focus{border-color:var(--green)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1;height:50px}
textarea.copy{width:100%;height:220px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:13px/1.45 ui-monospace,Menlo,monospace;background:#fff}
.banner{margin:14px 16px 0;padding:10px 14px;border-radius:12px;background:var(--amber-bg);color:#6C4A0A;font-size:13px;font-weight:600}

/* ---------- avviso a scomparsa ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:11px 16px;border-radius:12px;
  font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 28px);line-height:1.25}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;padding:9px 9px 9px 16px}
.toast button{background:var(--copper);color:#fff;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13.5px;flex:none}
@media (min-width:700px){.top{border-radius:0 0 32px 32px;padding:28px 32px 24px}.controls,.group{padding-left:32px;padding-right:32px}.chips{margin:0 -32px;padding:2px 32px 4px}.panel{margin-left:32px;margin-right:32px}}

#authGate{position:fixed;inset:0;z-index:20000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
#authGate .ag-box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:28px 22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
#authGate .ag-logo{width:56px;height:56px;border-radius:16px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center}
#authGate .ag-tit{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.5px}
#authGate .ag-sub{font-size:14px;color:var(--ink3);text-align:center;margin:-6px 0 8px}
#authGate .ag-btn{min-height:48px;border-radius:12px;border:none;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
#authGate .ag-btn:disabled{opacity:.55}
#authGate .ag-google{background:var(--surface);color:var(--ink);border:1px solid var(--sep)}
#authGate .ag-pri{background:var(--blue);color:#fff;margin-top:4px}
#authGate .ag-sec{background:var(--surface2);color:var(--ink)}
#authGate .ag-link{background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;padding:8px}
#authGate .ag-sep{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;margin:6px 0}
#authGate .ag-sep::before,#authGate .ag-sep::after{content:"";flex:1;height:1px;background:var(--sep)}
#authGate .ag-lbl{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:-4px}
#authGate .ag-in{min-height:46px;border-radius:12px;border:1px solid var(--sep);background:var(--surface2);color:var(--ink);padding:0 14px;font-size:16px;width:100%}
#authGate .ag-in:focus{outline:2px solid var(--blue);outline-offset:1px}
#authGate .ag-otp{letter-spacing:6px;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
#authGate .ag-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-top:4px}
#authGate .ag-tabs button{flex:1;min-height:36px;border:none;border-radius:8px;background:none;color:var(--ink2);font-size:14px;font-weight:600}
#authGate .ag-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#authGate .ag-nota{font-size:13px;color:var(--ink3);line-height:1.4}
#authGate .ag-msg{font-size:14px;color:var(--ink2);text-align:center;min-height:18px;line-height:1.4}
#authGate .ag-msg:empty{display:none}
#authGate .ag-neg{display:flex;flex-direction:column;gap:6px;text-align:center;font-size:14px;color:var(--ink2);line-height:1.45;margin:6px 0 8px}
#authGate .ag-neg b{color:var(--ink);font-size:16px}
#authGate .ag-attesa{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink3);font-size:14px;padding:16px 0}
#authGate .ag-pri{background:var(--green)}
#authGate .ag-link{color:var(--green)}
#authGate .ag-in:focus{outline-color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <div>
          <div class="eyebrow">Ceraldi · Magazzino</div>
          <h1>Tè <em>&amp;</em> Tisane</h1>
        </div>
        <button class="who" id="who" data-act="esci" aria-label="Account" hidden><i id="who-i">?</i><span id="who-n"></span></button>
      </div>
      <div class="net" id="net">Senza connessione: i prelievi non vengono registrati. Riprova appena torna la rete.</div>
      <div id="stats"></div>
    </div>
  </header>
  <div class="wrap" id="banner"></div>
  <main class="wrap" id="view"></main>
  <button class="fab" id="fab" data-act="new" aria-label="Nuovo prodotto" hidden>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav class="tabs"><div class="in" id="tabs"></div></nav>
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="backdrop" data-act="close"></div>

/* ── Utilità ─────────────────────────────────────────────────────── */
function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function $(s){ return document.querySelector(s); }
function round(n){ return Math.round(n * 100) / 100; }
function fmt(n){ return Number(n).toLocaleString('it-IT', { maximumFractionDigits: 2 }); }
function byName(a, b){ return a.nome.localeCompare(b.nome, 'it'); }
function hash(s){ var h = 0; for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function parseNum(v){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 && n <= 9999 ? round(n) : null; }

var _authSess = null, _authRefreshInCorso = null, _authCfg = null, _authAppAvviata = false;

function _authLeggi(){
  var s = lsGet(APP.authKey, null);
  if(!s && APP.oldAuthKey){
    // Sessione della versione precedente dell'app: la riprendo per non far rifare il login
    var o = lsGet(APP.oldAuthKey, null);
    if(o && o.access_token) s = { access_token: o.access_token, refresh_token: o.refresh_token, expires_at: o.expires_at, user: o.user ? { id: o.user.id, email: o.user.email } : null, metodo: 'password' };
  }
  return s;
}
function _authApplica(s){ _authSess = s; if(s) lsSet(APP.authKey, s); else lsDel(APP.authKey); }
function _authToken(){ return _authSess && _authSess.access_token ? _authSess.access_token : SB_KEY; }
function _authDaRisposta(j, prec){
  var ora = Math.floor(Date.now() / 1000);
  return { access_token: j.access_token, refresh_token: j.refresh_token || (prec && prec.refresh_token),
    expires_at: j.expires_at || (ora + (parseInt(j.expires_in, 10) || 3600)),
    user: j.user ? { id: j.user.id, email: j.user.email } : (prec && prec.user) || null,
    metodo: (prec && prec.metodo) || null };
}
async function _authPost(percorso, corpo){
  var r = await fetch(SB_URL + '/auth/v1/' + percorso, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify(corpo || {}) });
  var t = await r.text(), j = {}; try{ j = t ? JSON.parse(t) : {}; }catch(e){}
  if(!r.ok){ var e = new Error(j.error_description || j.msg || j.message || ('Errore ' + r.status)); e.status = r.status; e.codice = j.error_code || j.error || ''; throw e; }
  return j;
}
function _authErrore(e){
  var m = (e && e.message) || '', c = (e && e.codice) || '';
  if(/invalid login credentials|invalid_credentials/i.test(m + c)) return 'Email o password non corretti.';
  if(/otp_expired|expired/i.test(c) || /token has expired|is invalid/i.test(m)) return 'Codice scaduto o sbagliato. Richiedine uno nuovo.';
  if(/signups not allowed|user not found|otp_disabled/i.test(m + c)) return 'Questa email non ha ancora un account: tocca «Richiedi l\'accesso» qui sotto.';
  if(/rate limit|over_email_send_rate_limit/i.test(m + c)) return 'Troppe email inviate di recente. Riprova tra qualche minuto o usa la password.';
  if(/failed to fetch|network|load failed/i.test(m)) return 'Nessuna connessione. Controlla la rete e riprova.';
  return m || 'Qualcosa non è andato. Riprova.';
}
async function _authRefresh(){
  if(!_authSess || !_authSess.refresh_token) return false;
  if(_authRefreshInCorso) return _authRefreshInCorso;
  _authRefreshInCorso = (async function(){
    try{ var j = await _authPost('token?grant_type=refresh_token', { refresh_token: _authSess.refresh_token }); _authApplica(_authDaRisposta(j, _authSess)); return true; }
    catch(e){ if(e && e.status >= 400 && e.status < 500){ _authApplica(null); _authMostra('login', 'Sessione scaduta: accedi di nuovo.'); } return false; }
    finally{ _authRefreshInCorso = null; }
  })();
  return _authRefreshInCorso;
}
async function _authPronto(){ if(_authSess && (_authSess.expires_at || 0) - Math.floor(Date.now() / 1000) < 120) await _authRefresh(); }

/* api(percorso, opzioni) — percorso dopo /rest/v1/ (o 'rpc/...').
   Lancia SEMPRE un errore leggibile se il database rifiuta la richiesta. */
async function api(percorso, o){
  o = o || {};
  await _authPronto();
  var tentativo = 0;
  while(true){
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, o.timeout || 25000) : null;
    var h = { apikey: SB_KEY, Authorization: 'Bearer ' + _authToken() };
    if(o.body !== undefined) h['Content-Type'] = 'application/json';
    if(o.prefer) h.Prefer = o.prefer;
    var r;
    try{
      r = await fetch(SB_URL + '/rest/v1/' + percorso, { method: o.method || 'GET', headers: h,
        body: o.body === undefined ? undefined : (typeof o.body === 'string' ? o.body : JSON.stringify(o.body)), signal: ctrl ? ctrl.signal : undefined });
    }catch(err){
      if(timer) clearTimeout(timer);
      var e0 = new Error(err && err.name === 'AbortError' ? 'Il server non risponde (rete lenta?)' : 'Nessuna connessione'); e0.rete = true; throw e0;
    }
    if(timer) clearTimeout(timer);
    if((r.status === 401 || (r.status === 403 && tentativo === 0)) && _authSess && tentativo === 0){
      var txt401 = ''; try{ txt401 = await r.clone().text(); }catch(e){}
      if(r.status === 401 || /jwt|PGRST30/i.test(txt401)){ tentativo++; await _authRefresh(); continue; }
    }
    var t = await r.text(), j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = t; }
    if(!r.ok){
      var msg = (j && (j.message || j.hint || j.details)) || ('Errore ' + r.status);
      var e1 = new Error(msg); e1.status = r.status; e1.codice = j && j.code; e1.corpo = j; throw e1;
    }
    return j;
  }
}
// Tutte le righe di una tabella, a pagine (il server ne dà al massimo 1000 per volta)
async function apiTutte(percorso, pagina){
  pagina = pagina || 1000;
  var out = [], da = 0;
  while(true){
    var sep = percorso.indexOf('?') >= 0 ? '&' : '?';
    var righe = await api(percorso + sep + 'limit=' + pagina + '&offset=' + da);
    out = out.concat(righe || []);
    if(!righe || righe.length < pagina) break;
    da += pagina;
    if(da > 200000) break;
  }
  return out;
}

var _authStato = { vista: 'login', modo: 'password', email: '', codiceInviato: false, msg: '', attesa: false };

  var h = '<div class="ag-box"><div class="ag-logo" style="background:' + APP.markBg + '">' + APP.markSvg.replace(/width="20" height="20"/, 'width="28" height="28"') + '</div>' +

  } else {

      '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>' +
      '<span>Continua con Google</span></button>' +
      '<div class="ag-sep"><span>oppure con la tua email</span></div>' +
      '<label class="ag-lbl" for="agEmail">Email</label>' +

      '<div class="ag-tabs" role="tablist">' +
      '<button role="tab" class="' + (S.modo === 'password' ? 'on' : '') + '" onclick="_authStato.modo=\'password\';_authStato.msg=\'\';_authRender()">Password</button>' +
      '<button role="tab" class="' + (S.modo === 'codice' ? 'on' : '') + '" onclick="_authStato.modo=\'codice\';_authStato.msg=\'\';_authRender()">Codice via email</button></div>';
    if(S.modo === 'password'){
      h += '<label class="ag-lbl" for="agPwd">Password</label><input id="agPwd" class="ag-in" type="password" autocomplete="current-password" placeholder="La stessa di Presenze" onkeydown="if(event.key===\'Enter\')_authPassword()">' +
        '<button class="ag-btn ag-pri" onclick="_authPassword()"' + (S.attesa ? ' disabled' : '') + '>' + (S.attesa ? 'Accesso…' : 'Entra') + '</button>';
    } else if(!S.codiceInviato){
      h += '<div class="ag-nota">Ti mandiamo un codice di 6 cifre via email. Niente password da ricordare.</div>' +
        '<button class="ag-btn ag-pri" onclick="_authInviaCodice()"' + (S.attesa ? ' disabled' : '') + '>' + (S.attesa ? 'Invio…' : 'Invia il codice') + '</button>';
    } else {
      h += '<label class="ag-lbl" for="agOtp">Codice ricevuto</label><input id="agOtp" class="ag-in ag-otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456" onkeydown="if(event.key===\'Enter\')_authVerificaCodice()">' +
        '<button class="ag-btn ag-pri" onclick="_authVerificaCodice()"' + (S.attesa ? ' disabled' : '') + '>' + (S.attesa ? 'Verifica…' : 'Verifica ed entra') + '</button>' +

function _authEmailValida(){
  var e = (_authStato.email || '').trim().toLowerCase(); _authStato.email = e;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ _authStato.msg = 'Scrivi un indirizzo email valido.'; _authRender(); return null; }
  return e;
}
function _authRedirect(){ return location.origin + location.pathname; }
function _authGoogle(){ _authMostra('caricamento'); location.href = SB_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(_authRedirect()); }
async function _authPassword(){
  var em = _authEmailValida(); if(!em) return;
  var pw = (document.getElementById('agPwd') || {}).value || '';
  if(!pw){ _authStato.msg = 'Scrivi la password.'; _authRender(); return; }
  _authStato.attesa = true; _authStato.msg = ''; _authRender();
  try{ var j = await _authPost('token?grant_type=password', { email: em, password: pw }); var s = _authDaRisposta(j, null); s.metodo = 'password'; _authApplica(s); await _authEntra(); }
  catch(e){ _authStato.attesa = false; _authStato.msg = _authErrore(e); _authRender(); }
}
async function _authInviaCodice(){
  var em = _authEmailValida(); if(!em) return;
  _authStato.attesa = true; _authStato.msg = ''; _authRender();
  try{ await _authPost('otp?redirect_to=' + encodeURIComponent(_authRedirect()), { email: em, create_user: false }); _authStato.codiceInviato = true; _authStato.attesa = false; _authStato.msg = 'Codice inviato a ' + em + '. Controlla anche lo spam.'; _authRender(); }
  catch(e){ _authStato.attesa = false; _authStato.msg = _authErrore(e); _authRender(); }
}
function _authTelefonoValido(t){ return String(t || '').replace(/[^0-9]/g, '').length >= 8; }
function _authRichiestaValida(){
  var S = _authStato;
  return String(S.nome || '').trim().length >= 3 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(S.email || '').trim()) && _authTelefonoValido(S.telefono) && !!S.consenso;
}
// abilita il bottone a ogni tasto senza ridisegnare (il campo non perde il focus)
function _authRichiestaAggiorna(){ var b = document.querySelector('.ag-box .ag-pri'); if(b && b.textContent.indexOf('Richied') >= 0) b.disabled = !_authRichiestaValida(); }
async function _authRichiedi(){
  if(!_authRichiestaValida()){ _authStato.msg = 'Compila tutti i campi e dai il consenso.'; _authRender(); return; }
  var em = _authEmailValida(); if(!em) return;
  _authStato.attesa = true; _authStato.msg = ''; _authRender();
  try{
    await _authPost('otp?redirect_to=' + encodeURIComponent(_authRedirect()), { email: em, create_user: true,
      data: { nome: String(_authStato.nome).trim(), origine: 'richiesta', app: 'richieste', telefono: String(_authStato.telefono).trim(), consenso_privacy: true, consenso_privacy_il: new Date().toISOString() } });
    _authStato.attesa = false; _authStato.vista = 'login'; _authStato.modo = 'codice'; _authStato.codiceInviato = true;
    _authStato.msg = 'Ti ho mandato un codice a ' + em + ' per confermare l\'indirizzo. Controlla anche lo spam.';
    _authRender();
  }catch(e){ _authStato.attesa = false; _authStato.msg = _authErrore(e); _authRender(); }
}
async function _authVerificaCodice(){
  var em = _authEmailValida(); if(!em) return;
  var c = ((document.getElementById('agOtp') || {}).value || '').replace(/\D/g, '');
  if(c.length < 6){ _authStato.msg = 'Il codice ha 6 cifre.'; _authRender(); return; }
  _authStato.attesa = true; _authStato.msg = ''; _authRender();
  try{ var j = await _authPost('verify', { type: 'email', email: em, token: c }); var s = _authDaRisposta(j, null); s.metodo = 'codice email'; _authApplica(s); await _authEntra(); }
  catch(e){ _authStato.attesa = false; _authStato.msg = _authErrore(e); _authRender(); }
}
async function _authDaIndirizzo(){
  var hs = location.hash || '';
  if(hs.indexOf('access_token=') < 0 && hs.indexOf('error=') < 0) return null;
  var p = new URLSearchParams(hs.slice(1));
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  if(p.get('error')) return { errore: p.get('error_description') || p.get('error') };
  var s = _authDaRisposta({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: p.get('expires_in'), expires_at: parseInt(p.get('expires_at'), 10) || null }, null);
  s.metodo = 'Google'; _authApplica(s);
  try{ var r = await fetch(SB_URL + '/auth/v1/user', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token } }); if(r.ok){ var u = await r.json(); s.user = { id: u.id, email: u.email }; _authApplica(s); } }catch(e){}
  return { ok: true };
}

async function _authControllaAccesso(){
  var a = await api('rpc/ceraldi_mio_accesso', { method: 'POST', body: {} });
  var admin = a.ruolo === 'admin' && a.stato === 'attivo';
  var liv = admin ? 'completo' : ((a.permessi || {})[APP.key] || '');
  if(['completo', 'proprio', 'lettura'].indexOf(liv) < 0) liv = '';
  ACC = { stato: a.stato, ruolo: a.ruolo, nome: a.nome || '', permessi: a.permessi || {}, livello: liv, admin: admin, lettura: liv === 'lettura',
    ok: a.stato === 'attivo' && !!liv };
  lsSet(APP.key + '_acc', ACC);
  return ACC;
}
async function _authEntra(){
  _authMostra('caricamento');
  try{
    var acc = await _authControllaAccesso();
    if(!acc.ok){ _authMostra('negato', acc.stato === 'in_attesa' ? 'La tua richiesta di accesso è in attesa.' : (acc.stato === 'bloccato' ? 'Questo account non è più abilitato.' : '')); return; }
  }catch(e){
    var prima = lsGet(APP.key + '_acc', null);
    if(e.rete && prima && prima.ok){ ACC = prima; }   // senza rete: entra con l'ultimo accesso verificato
    else { _authMostra('login', e.rete ? 'Nessuna connessione per controllare l\'accesso. Riprova.' : 'Accesso non verificato: ' + e.message); return; }
  }
  _authNascondi();
  if(!_authAppAvviata){ _authAppAvviata = true; try{ await APP.onEntra(); }catch(e){ _registraErrore('avvio', e.message, e.stack); toast('Errore all\'avvio: ' + e.message); } }
}
async function _authEsci(silenzioso){
  if(!silenzioso && !(await conferma('Uscire?', 'Uscirai da ' + APP.nome + ' su questo dispositivo.'))) return;
  var tok = _authSess && _authSess.access_token;
  if(tok){ try{ await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + tok } }); }catch(e){} }
  _authApplica(null); lsDel(APP.key + '_acc'); lsDel('mg_cache');
  location.reload();
}
async function _authAvvio(){
  _authMostra('caricamento');
  fetch(SB_URL + '/auth/v1/settings', { headers: { apikey: SB_KEY } }).then(function(r){ return r.ok ? r.json() : null; }).then(function(c){ _authCfg = c; if(_authStato.vista === 'login') _authRender(); }).catch(function(){});
  var d = await _authDaIndirizzo();
  if(d && d.errore){ _authMostra('login', 'Accesso non riuscito: ' + d.errore); return; }
  var s = _authSess || _authLeggi();
  if(!s || !s.access_token){ _authMostra('login'); return; }
  _authApplica(s);
  await _authPronto();
  if(!_authSess) return;
  await _authEntra();
}

var CATS = [
  { id: 'bianchi', nome: 'Tè bianchi',        short: 'Bianchi',        color: '#C9AE62' },
  { id: 'neri',    nome: 'Tè neri e scuri',   short: 'Neri',           color: '#6B3A22' },
  { id: 'verdi',   nome: 'Tè verdi e oolong', short: 'Verdi & Oolong', color: '#5E8C4A' },
  { id: 'rooibos', nome: 'Rooibos',           short: 'Rooibos',        color: '#B4532A' },
  { id: 'carcade', nome: 'Carcadè',           short: 'Carcadè',        color: '#A3285A' },
  { id: 'tisane',  nome: 'Tisane',            short: 'Tisane',         color: '#7F6FAE' }
];
function cat(id){ for(var i = 0; i < CATS.length; i++) if(CATS[i].id === id) return CATS[i]; return CATS[CATS.length - 1]; }
function status(p){ return p.qty <= 0 ? 'out' : (p.qty <= p.scorta_min ? 'low' : 'ok'); }
function daOrdinare(p){ return status(p) !== 'ok'; }
function norm(r){ return { id: r.id, nome: r.nome, cat: r.cat, qty: Number(r.qty), scorta_min: Number(r.scorta_min), nota: r.nota || '' }; }
function find(id){ for(var i = 0; i < P.length; i++) if(P[i].id === id) return P[i]; return null; }
function sostituisci(np){ for(var i = 0; i < P.length; i++) if(P[i].id === np.id){ P[i] = np; return; } P.push(np); }
function livello(){ return ACC ? ACC.livello : ''; }
function puoPrelevare(){ return livello() === 'completo' || livello() === 'proprio'; }
function puoGestire(){ return livello() === 'completo'; }

var P = [], MOV = [], OFFLINE = false, pending = 0, LASTMOV = null;
var UI = { tab: 'pick', cat: 'all', q: '' };
try{ var u0 = JSON.parse(sessionStorage.getItem('mg_ui') || '{}'); if(u0.tab) UI.tab = u0.tab; if(u0.cat) UI.cat = u0.cat; }catch(e){}
function saveUI(){ try{ sessionStorage.setItem('mg_ui', JSON.stringify({ tab: UI.tab, cat: UI.cat })); }catch(e){} }

function erroreLeggibile(e){
  if(e && e.rete) return 'Nessuna connessione: il prelievo NON è stato registrato.';
  var c = e && e.codice;
  if(c === 'P0002' || c === 'P0001' || c === '42501') return e.message;
  if(c === '23505') return 'Esiste già un prodotto con questo nome.';
  if(e && (e.status === 401 || e.status === 403)) return 'Non hai il permesso per questa operazione.';
  return 'Non riesco a salvare: ' + ((e && e.message) || 'errore sconosciuto');
}

async function caricaProdotti(silenzioso){
  try{
    var r = await apiTutte('magazzino_te_prodotti?select=id,nome,cat,qty,scorta_min,nota&attivo=eq.true&order=nome');
    P = r.map(norm); lsSet('mg_cache', { t: Date.now(), p: P }); OFFLINE = false;
  }catch(e){
    OFFLINE = !!e.rete;
    if(!P.length){ var c = lsGet('mg_cache', null); if(c && c.p) P = c.p; }
    if(!silenzioso) toast(e.rete ? 'Nessuna connessione: vedi l\'ultimo elenco salvato' : 'Non riesco a caricare il magazzino: ' + e.message, { durata: 4000 });
  }
  $('#net').classList.toggle('on', OFFLINE);
  renderTutto();
}
async function caricaMovimenti(){
  try{ MOV = await api('magazzino_te_movimenti?select=id,creato_il,prodotto_nome,tipo,qta_prima,qta_dopo,delta,utente_nome&order=id.desc&limit=150'); }
  catch(e){ toast('Non riesco a caricare il registro: ' + e.message, { durata: 4000 }); }
  if(UI.tab === 'log') renderLog();
}

/* ── Prelievo ────────────────────────────────────────────────────── */
async function take(id){
  var p = find(id); if(!p || !puoPrelevare()) return;
  if(p.qty <= 0){ toast(p.nome + ' è esaurito'); return; }
  var prima = p.qty; p.qty = round(Math.max(0, p.qty - 1));
  renderStats(); renderTabs(); renderGrid(); pop(id);
  pending++;
  try{
    var r = await api('rpc/magazzino_te_preleva', { method: 'POST', body: { p_id: id, p_qta: 1 } });
    var np = norm(r.prodotto); sostituisci(np); OFFLINE = false; $('#net').classList.remove('on');
    LASTMOV = { mov: r.movimento, nome: np.nome };
    renderStats(); renderTabs(); renderGrid();
    toast('Preso 1 · ' + np.nome + ' · ' + (np.qty <= 0 ? 'finito, da riordinare' : (np.qty === 1 ? 'ne resta ' : 'ne restano ') + fmt(np.qty)), { azione: 'Annulla', onAzione: annulla, durata: 6000 });
  }catch(e){
    p.qty = prima;
    if(e.rete){ OFFLINE = true; $('#net').classList.add('on'); }
    toast(erroreLeggibile(e), { durata: 5000 });
    renderStats(); renderTabs(); renderGrid();
    if(!e.rete) caricaProdotti(true);
  }
  pending--;
}
function pop(id){ var el = document.querySelector('.card[data-id="' + id + '"]'); if(el) el.classList.add('pop'); }
async function annulla(){
  if(!LASTMOV) return;
  var m = LASTMOV; LASTMOV = null;
  try{
    var r = await api('rpc/magazzino_te_annulla', { method: 'POST', body: { p_mov: m.mov } });
    var np = norm(r.prodotto); sostituisci(np); renderTutto();
    toast('Annullato: ' + np.nome + ' torna a ' + fmt(np.qty));
  }catch(e){ toast(erroreLeggibile(e), { durata: 4500 }); caricaProdotti(true); }
}

/* ── Disegno del barattolo ───────────────────────────────────────── */
function tin(p, ctx){
  var c = cat(p.cat).color, id = 'k' + ctx + String(p.id).replace(/\W/g, '');
  var capc = Math.max(p.scorta_min * 3, 3), lv = Math.max(0, Math.min(p.qty / capc, 1));
  var top = 15, h = 60, y = top + h - lv * h, minY = top + h - Math.min(p.scorta_min / capc, 1) * h;
  var delay = -(hash(String(p.id)) % 45) / 10;
  return '<svg class="tin" viewBox="0 0 60 80" aria-hidden="true">' +
    '<defs><clipPath id="' + id + '"><rect x="11" y="15" width="38" height="60" rx="5"/></clipPath>' +
    '<linearGradient id="' + id + 'g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".45"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".9" stop-color="#000" stop-opacity=".07"/></linearGradient></defs>' +
    '<rect x="10" y="14" width="40" height="62" rx="6" fill="#EFE7D8" stroke="#1E2B24" stroke-opacity=".16"/>' +
    '<g clip-path="url(#' + id + ')">' +
      (lv > 0 ? '<g transform="translate(0 ' + y.toFixed(2) + ')"><path class="wave" style="animation-delay:' + delay + 's" fill="' + c + '" d="M-30 0q7.5-2.6 15 0t15 0t15 0t15 0t15 0t15 0t15 0t15 0V80H-30Z"/></g>' : '') +
      (p.scorta_min > 0 ? '<line x1="11" x2="49" y1="' + minY.toFixed(2) + '" y2="' + minY.toFixed(2) + '" stroke="#1E2B24" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2.5 2"/>' : '') +
      '<rect x="11" y="15" width="38" height="60" fill="url(#' + id + 'g)"/>' +
    '</g>' +
    '<rect x="16" y="34" width="28" height="15" rx="2" fill="#FBF8F2" opacity=".86"/>' +
    '<rect x="19" y="39" width="22" height="2" rx="1" fill="' + c + '"/><rect x="22" y="43" width="16" height="1.6" rx=".8" fill="#1E2B24" opacity=".25"/>' +
    '<rect x="7" y="5" width="46" height="11" rx="3" fill="#24302A"/><rect x="7" y="13" width="46" height="3" fill="#000" opacity=".2"/>' +
    '<rect x="10" y="7" width="20" height="2" rx="1" fill="#fff" opacity=".18"/>' +
  '</svg>';
}

/* ── Schermate ───────────────────────────────────────────────────── */
function tabsDisponibili(){
  var t = [['pick', puoPrelevare() ? 'Preleva' : 'Giacenze'], ['order', 'Da ordinare']];
  if(puoGestire()){ t.splice(1, 0, ['shelf', 'Scaffale']); t.push(['log', 'Registro']); }
  return t;
}
function renderStats(){
  var n = P.length, out = 0, low = 0;
  P.forEach(function(p){ var s = status(p); if(s === 'out') out++; else if(s === 'low') low++; });
  var ok = n - out - low, pc = function(x){ return n ? (x / n * 100).toFixed(1) + '%' : '0'; };
  $('#stats').innerHTML =
    '<div class="stats">' +
      '<button class="stat" data-act="tab" data-tab="' + (puoGestire() ? 'shelf' : 'pick') + '"><b>' + n + '</b><span>Referenze</span></button>' +
      '<button class="stat low" data-act="tab" data-tab="order"><b>' + low + '</b><span>In esaurimento</span></button>' +
      '<button class="stat out" data-act="tab" data-tab="order"><b>' + out + '</b><span>Esauriti</span></button>' +
    '</div>' +
    '<div class="health"><i style="width:' + pc(ok) + ';background:#8FC79E"></i><i style="width:' + pc(low) + ';background:#E2C26E"></i><i style="width:' + pc(out) + ';background:#E58B73"></i></div>' +
    '<div class="legend"><span><i style="background:#8FC79E"></i>Scorta ok ' + ok + '</span><span><i style="background:#E2C26E"></i>Bassa ' + low + '</span><span><i style="background:#E58B73"></i>Finita ' + out + '</span></div>';
}
function renderTabs(){
  var need = P.filter(daOrdinare).length, t = tabsDisponibili();
  if(!t.some(function(x){ return x[0] === UI.tab; })) UI.tab = 'pick';
  $('#tabs').innerHTML = t.map(function(x){
    return '<button class="tab' + (UI.tab === x[0] ? ' on' : '') + '" data-act="tab" data-tab="' + x[0] + '">' + ICON[x[0]] + x[1] +
      (x[0] === 'order' && need ? '<span class="bdg">' + need + '</span>' : '') + '</button>';
  }).join('');
  $('#fab').hidden = !(UI.tab === 'shelf' && puoGestire());
}
function renderWho(){
  var n = (ACC && ACC.nome) || ''; var b = $('#who'); b.hidden = false;
  $('#who-n').textContent = n.split(' ')[0] || 'Account';
  $('#who-i').textContent = (n.trim().charAt(0) || '?').toUpperCase();
}
function renderBanner(){
  $('#banner').innerHTML = livello() === 'lettura' ? '<div class="banner">Accesso in sola consultazione: puoi vedere le giacenze ma non registrare prelievi.</div>' : '';
}

function renderShelf(){
  var pick = UI.tab === 'pick', counts = {}; P.forEach(function(p){ counts[p.cat] = (counts[p.cat] || 0) + 1; });
  var chips = '<button class="chip' + (UI.cat === 'all' ? ' on' : '') + '" data-act="cat" data-cat="all">Tutti <small>' + P.length + '</small></button>' +
    CATS.map(function(c){
      return '<button class="chip' + (UI.cat === c.id ? ' on' : '') + '" data-act="cat" data-cat="' + c.id + '"><span class="d" style="background:' + c.color + '"></span>' + c.short + ' <small>' + (counts[c.id] || 0) + '</small></button>';
    }).join('');
  var intro = pick && puoPrelevare()
    ? '<div class="pickhead"><h2>Prendi una confezione</h2><p>Premi <b>Prendo 1</b> sul prodotto che porti via dal magazzino. Sbagliato? Premi Annulla.</p></div>'
    : (pick ? '<div class="pickhead"><h2>Giacenze</h2><p>Quante confezioni ci sono di ogni prodotto.</p></div>' : '');
  $('#view').innerHTML =
    '<div class="controls">' + intro +
      '<label class="search">' + ICON.search + '<input id="q" type="search" placeholder="Cerca un tè o una tisana" value="' + esc(UI.q) + '" autocomplete="off"></label>' +
      '<div class="chips">' + chips + '</div>' +
    '</div><div id="grid"></div>';
  renderGrid();
}
function card(p){
  var s = status(p), c = cat(p.cat), pick = UI.tab === 'pick', btn = pick && puoPrelevare();
  return '<button class="card' + (btn && s === 'out' ? ' dim' : '') + '" data-act="' + (pick ? (btn ? 'take' : 'nop') : 'open') + '" data-id="' + p.id + '" style="--c:' + c.color + '">' +
    '<span class="halo"></span>' + (!pick && p.nota ? '<span class="note-dot" title="Ha una nota"></span>' : '') +
    '<div class="tin-box">' + tin(p, 'g') + '</div>' +
    '<div class="c-name">' + esc(p.nome) + '</div>' +
    '<div class="c-foot"><span class="c-qty">' + fmt(p.qty) + '<small>conf.</small></span>' +
      (s === 'out' ? '<span class="tag out">Esaurito</span>' : s === 'low' ? '<span class="tag low">Basso</span>' : '') + '</div>' +
    (btn ? '<span class="takebtn">' + (s === 'out' ? 'Non disponibile' : 'Prendo 1') + '</span>' : '') + '</button>';
}
function renderGrid(){
  var g = $('#grid'); if(!g) return;
  var q = UI.q.trim().toLowerCase();
  var list = P.filter(function(p){ return (UI.cat === 'all' || p.cat === UI.cat) && (!q || p.nome.toLowerCase().indexOf(q) > -1); });
  var html = '';
  if(!list.length){
    html = '<div class="empty">' + tin({ id: 'e', cat: UI.cat === 'all' ? 'tisane' : UI.cat, qty: 0, scorta_min: 0 }, 'e') +
      '<h3>' + (P.length ? 'Nessun risultato' : 'Scaffale vuoto') + '</h3>' +
      '<div>' + (P.length ? 'Prova con un altro nome o un’altra categoria.' : (puoGestire() ? 'Aggiungi il primo prodotto dallo Scaffale.' : 'Nessun prodotto in magazzino.')) + '</div></div>';
  } else {
    CATS.forEach(function(c){
      var gr = list.filter(function(p){ return p.cat === c.id; }).sort(byName);
      if(!gr.length) return;
      var need = gr.filter(daOrdinare).length;
      html += '<section class="group"><div class="g-head"><span class="bar" style="background:' + c.color + '"></span><h2>' + c.nome + '</h2>' +
        '<span class="meta">' + gr.length + (gr.length === 1 ? ' referenza' : ' referenze') + (need ? ' · ' + need + ' da riordinare' : '') + '</span></div>' +
        '<div class="grid">' + gr.map(card).join('') + '</div></section>';
    });
  }
  g.innerHTML = html;
}

function renderOrder(){
  var list = P.filter(daOrdinare);
  if(!list.length){
    $('#view').innerHTML = '<div class="panel"><div class="empty">' + tin({ id: 'ok', cat: 'verdi', qty: 3, scorta_min: 1 }, 'e') +
      '<h3>Tutto in ordine</h3><div>Nessun prodotto è sotto la scorta minima.</div></div></div>';
    return;
  }
  var out = list.filter(function(p){ return p.qty <= 0; }).length, body = '';
  CATS.forEach(function(c){
    var gr = list.filter(function(p){ return p.cat === c.id; }).sort(function(a, b){ return a.qty - b.qty || byName(a, b); });
    if(!gr.length) return;
    body += '<div class="sub-h"><i style="background:' + c.color + '"></i>' + c.nome + '</div>' +
      gr.map(function(p){
        return '<div class="li">' + tin(p, 'o') +
          '<span class="t"><b>' + esc(p.nome) + '</b><span>' + (p.qty <= 0 ? 'Esaurito' : 'Ne ' + (p.qty === 1 ? 'resta ' : 'restano ') + fmt(p.qty) + ' conf.') + ' · minimo ' + fmt(p.scorta_min) + '</span></span>' +
          '<span class="tag ' + status(p) + '">' + (p.qty <= 0 ? 'Finito' : 'Basso') + '</span></div>';
      }).join('');
  });
  $('#view').innerHTML = '<div class="panel">' +
    '<div class="panel-head"><div><h2>' + list.length + ' da riordinare</h2><p>' + out + ' esauriti, ' + (list.length - out) + ' alla scorta minima o sotto</p></div></div>' +
    '<div style="padding:0 18px 16px"><button class="btn primary block" data-act="copy-order">' + ICON.copy + 'Copia la lista per il fornitore</button></div>' + body + '</div>';
}

var TIPI = {
  prelievo: ['↓', '#F6E2DC', '#B8432F', 'ha preso'], annullo: ['↺', '#E1EEDF', '#3F7A52', 'ha annullato un prelievo'],
  carico: ['↑', '#E1EEDF', '#3F7A52', 'carico'], rettifica: ['≈', '#ECE4D5', '#3D4A42', 'correzione'],
  nuovo: ['+', '#ECE4D5', '#3D4A42', 'nuovo prodotto'], rimosso: ['−', '#ECE4D5', '#3D4A42', 'rimosso dallo scaffale'], import: ['⇣', '#ECE4D5', '#3D4A42', 'inventario iniziale']
};
function renderLog(){
  if(UI.tab !== 'log') return;
  var days = {}, order = [];
  MOV.forEach(function(e){ var k = new Date(e.creato_il).toDateString(); if(!days[k]){ days[k] = []; order.push(k); } days[k].push(e); });
  var today = new Date().toDateString(), yest = new Date(Date.now() - 864e5).toDateString();
  var body = order.map(function(k){
    var label = k === today ? 'Oggi' : k === yest ? 'Ieri' : new Date(days[k][0].creato_il).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    return '<div class="sub-h">' + label + '</div>' + days[k].map(logRow).join('');
  }).join('');
  $('#view').innerHTML = '<div class="panel">' +
    '<div class="panel-head"><div><h2>Registro movimenti</h2><p>Chi ha toccato cosa, con data e ora (ultimi 150).</p></div></div>' +
    '<div style="padding:0 18px 16px"><button class="btn soft block" data-act="copy-inv">' + ICON.copy + 'Copia inventario (da incollare in Excel)</button></div>' +
    (body || '<div class="empty">Ancora nessun movimento.</div>') + '</div>';
}
function logRow(e){
  var t = TIPI[e.tipo] || TIPI.rettifica, time = new Date(e.creato_il).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  var d = Number(e.delta || 0), who = e.utente_nome && e.utente_nome !== 'sconosciuto' ? e.utente_nome : '';
  var sub = (who ? esc(who) + ' · ' : '') + t[3] + (e.tipo === 'prelievo' || e.tipo === 'annullo' || e.tipo === 'carico' || e.tipo === 'rettifica' ? ' · da ' + fmt(e.qta_prima) + ' a ' + fmt(e.qta_dopo) : '');
  var right = e.qta_dopo != null ? fmt(e.qta_dopo) + (d && e.tipo !== 'import' && e.tipo !== 'nuovo' ? '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + fmt(d) + '</span>' : '') : '';
  return '<div class="li"><span class="time">' + time + '</span><span class="kind" style="background:' + t[1] + ';color:' + t[2] + '">' + t[0] + '</span>' +
    '<span class="t"><b>' + esc(e.prodotto_nome) + '</b><span>' + sub + '</span></span><span class="r">' + right + '</span></div>';
}

function renderView(){
  if(UI.tab === 'order') renderOrder();
  else if(UI.tab === 'log'){ renderLog(); caricaMovimenti(); }
  else renderShelf();
}
function renderTutto(){ renderStats(); renderTabs(); renderBanner(); if(!SH) renderViewSoft(); }
function renderViewSoft(){
  // non ridisegna la pagina mentre scrivi nella ricerca (si chiuderebbe la tastiera)
  var a = document.activeElement;
  if(a && a.id === 'q'){ renderGrid(); return; }
  if(UI.tab === 'log') return;
  renderView();
}

/* ── Scheda prodotto (solo chi ha "completo") ────────────────────── */
var SH = null;
function openSheet(id){ var p = find(id); if(!p || !puoGestire()) return; SH = { mode: 'edit', d: Object.assign({}, p), arm: false, busy: false }; showSheet(); }
function openNew(){ if(!puoGestire()) return; SH = { mode: 'new', d: { id: null, nome: '', cat: UI.cat !== 'all' ? UI.cat : 'neri', qty: 1, scorta_min: 1, nota: '' }, arm: false, busy: false }; showSheet(); setTimeout(function(){ var n = $('.sh-name'); if(n) n.focus(); }, 280); }
function showSheet(){ $('#sheet').hidden = false; document.body.style.overflow = 'hidden'; renderSheet(); }
function closeSheet(){ SH = null; $('#sheet').hidden = true; document.body.style.overflow = ''; renderTutto(); }
function renderSheet(){
  if(SH.mode === 'copy'){
    $('#sheet-body').innerHTML = '<div class="sh-head"><div style="flex:1"><div class="sh-cat" style="color:var(--copper)">Copia manuale</div>' +
      '<div style="font-family:var(--serif);font-size:24px;font-weight:600">' + esc(SH.title) + '</div></div><button class="x" data-act="close">' + ICON.x + '</button></div>' +
      '<p class="hint" style="margin:12px 0">Tieni premuto sul testo, scegli “Seleziona tutto” e poi “Copia”.</p><textarea class="copy" readonly>' + esc(SH.text) + '</textarea>';
    var ta = $('textarea.copy'); ta.focus(); ta.select(); return;
  }
  var d = SH.d, c = cat(d.cat), isNew = SH.mode === 'new';
  $('#sheet-body').innerHTML =
    '<div class="sh-head"><div id="sh-tin">' + tin(d, 's') + '</div>' +
      '<div style="flex:1;min-width:0"><div class="sh-cat" style="color:' + c.color + '">' + (isNew ? 'Nuovo prodotto · ' : '') + c.nome + '</div>' +
      '<input class="sh-name" data-f="nome" value="' + esc(d.nome) + '" placeholder="Nome del prodotto" maxlength="60"></div>' +
      '<button class="x" data-act="close" aria-label="Chiudi">' + ICON.x + '</button></div>' +
    '<div class="block-card"><div class="lbl">Giacenza · confezioni</div>' +
      '<div class="qty-row"><button data-act="step" data-d="-1">−1</button><button data-act="step" data-d="-0.5">−½</button>' +
      '<input class="qty-in" id="qty" inputmode="decimal" value="' + fmt(d.qty) + '" aria-label="Quantità">' +
      '<button class="p" data-act="step" data-d="0.5">+½</button><button class="p" data-act="step" data-d="1">+1</button></div>' +
      '<div class="st-line" id="st-line"></div>' +
      (!isNew ? '<div class="hint">I carichi e le correzioni restano nel Registro con il tuo nome.</div>' : '') + '</div>' +
    '<div class="block-card"><div class="lbl">Scorta minima</div>' +
      '<div class="mini"><button data-act="minstep" data-d="-1">−</button><b id="min-v">' + fmt(d.scorta_min) + '</b><button data-act="minstep" data-d="1">+</button></div>' +
      '<div class="hint">Sotto o alla soglia, il prodotto compare in “Da ordinare”. Sul barattolo è la linea tratteggiata.</div></div>' +
    '<div class="block-card"><div class="lbl">Categoria</div><div class="cat-pick">' +
      CATS.map(function(x){ return '<button class="chip' + (x.id === d.cat ? ' on' : '') + '" data-act="pickcat" data-cat="' + x.id + '"><span class="d" style="background:' + x.color + '"></span>' + x.short + '</button>'; }).join('') +
    '</div></div>' +
    '<div class="block-card"><div class="lbl">Nota</div><input class="note-in" data-f="nota" value="' + esc(d.nota) + '" placeholder="Es. formato, fornitore, scadenza…" maxlength="140"></div>' +
    '<div class="actions">' + (isNew ? '' : '<button class="btn danger" data-act="del" id="del">Rimuovi</button>') +
      '<button class="btn primary" data-act="save" id="save">' + (isNew ? 'Aggiungi allo scaffale' : 'Salva') + '</button></div>';
  liveSheet();
}
function liveSheet(){
  var d = SH.d, s = status(d);
  $('#sh-tin').innerHTML = tin(d, 's');
  var q = $('#qty'); if(q && document.activeElement !== q) q.value = fmt(d.qty);
  $('#min-v').textContent = fmt(d.scorta_min);
  var col = s === 'out' ? 'var(--red)' : s === 'low' ? 'var(--amber)' : 'var(--ok)';
  var txt = s === 'out' ? 'Esaurito — da riordinare' : s === 'low' ? 'Alla scorta minima o sotto — da riordinare' : 'Scorta ok';
  $('#st-line').innerHTML = '<i style="background:' + col + '"></i><span style="color:' + col + '">' + txt + '</span>';
}
async function salvaSheet(){
  var d = SH.d; d.nome = String(d.nome).trim();
  if(!d.nome){ toast('Scrivi il nome del prodotto'); var n = $('.sh-name'); if(n) n.focus(); return; }
  if(SH.busy) return; SH.busy = true; var b = $('#save'); if(b) b.disabled = true;
  try{
    if(SH.mode === 'new'){
      var r = await api('magazzino_te_prodotti', { method: 'POST', prefer: 'return=representation', body: { nome: d.nome, cat: d.cat, qty: d.qty, scorta_min: d.scorta_min, nota: d.nota } });
      sostituisci(norm(r[0])); toast(d.nome + ' aggiunto');
    } else {
      var r2 = await api('magazzino_te_prodotti?id=eq.' + d.id, { method: 'PATCH', prefer: 'return=representation', body: { nome: d.nome, cat: d.cat, qty: d.qty, scorta_min: d.scorta_min, nota: d.nota } });
      if(!r2 || !r2.length) throw new Error('Il prodotto non risulta più presente');
      sostituisci(norm(r2[0])); toast('Salvato');
    }
    closeSheet();
  }catch(e){ SH.busy = false; var b2 = $('#save'); if(b2) b2.disabled = false; toast(erroreLeggibile(e), { durata: 4500 }); }
}
async function rimuoviSheet(){
  var d = SH.d;
  try{
    await api('magazzino_te_prodotti?id=eq.' + d.id, { method: 'PATCH', prefer: 'return=minimal', body: { attivo: false } });
    P = P.filter(function(x){ return x.id !== d.id; }); closeSheet(); toast(d.nome + ' rimosso');
  }catch(e){ toast(erroreLeggibile(e), { durata: 4500 }); }
}

/* ── Copia lista / inventario ────────────────────────────────────── */
function copyText(text, title){
  var done = function(){ toast('Copiato negli appunti'); };
  var fail = function(){ SH = { mode: 'copy', text: text, title: title, d: {} }; showSheet(); };
  try{ navigator.clipboard.writeText(text).then(done, fail); }catch(e){ fail(); }
}
function orderText(){
  var list = P.filter(daOrdinare), out = ['Tè e tisane da riordinare — Caffetteria Ceraldi', new Date().toLocaleDateString('it-IT'), ''];
  CATS.forEach(function(c){
    var g = list.filter(function(p){ return p.cat === c.id; }).sort(byName); if(!g.length) return;
    out.push(c.nome.toUpperCase());
    g.forEach(function(p){ out.push('• ' + p.nome + ' — ' + (p.qty <= 0 ? 'esaurito' : 'ne ' + (p.qty === 1 ? 'resta ' : 'restano ') + fmt(p.qty) + ' conf.')); });
    out.push('');
  });
  return out.join('\n').trim();
}
function inventoryText(){
  var rows = [['Categoria', 'Prodotto', 'Giacenza (conf.)', 'Scorta minima (conf.)', 'Stato', 'Nota'].join('\t')];
  CATS.forEach(function(c){
    P.filter(function(p){ return p.cat === c.id; }).sort(byName).forEach(function(p){
      var s = status(p); rows.push([c.nome, p.nome, fmt(p.qty), fmt(p.scorta_min), s === 'out' ? 'Esaurito' : s === 'low' ? 'Da riordinare' : 'OK', p.nota || ''].join('\t'));
    });
  });
  return rows.join('\n');
}

/* ── Eventi ──────────────────────────────────────────────────────── */
function setTab(t){ UI.tab = t; saveUI(); renderTabs(); renderView(); window.scrollTo(0, 0); }
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var a = t.getAttribute('data-act');
  if(a === 'tab'){ if(UI.tab !== t.dataset.tab) setTab(t.dataset.tab); else window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if(a === 'cat'){ UI.cat = t.dataset.cat; saveUI(); renderShelf(); }
  else if(a === 'take'){ take(t.dataset.id); }
  else if(a === 'open'){ openSheet(t.dataset.id); }
  else if(a === 'new'){ openNew(); }
  else if(a === 'close'){ closeSheet(); }
  else if(a === 'esci'){ _authEsci(false); }
  else if(a === 'step'){ var q = $('#qty'); if(q) q.blur(); SH.d.qty = Math.max(0, Math.min(9999, round(SH.d.qty + parseFloat(t.dataset.d)))); liveSheet(); }
  else if(a === 'minstep'){ SH.d.scorta_min = Math.max(0, Math.min(9999, round(SH.d.scorta_min + parseFloat(t.dataset.d)))); liveSheet(); }
  else if(a === 'pickcat'){ SH.d.cat = t.dataset.cat; renderSheet(); }
  else if(a === 'save'){ salvaSheet(); }
  else if(a === 'del'){
    if(!SH.arm){ SH.arm = true; t.classList.add('arm'); t.textContent = 'Tocca per confermare';
      setTimeout(function(){ if(SH && SH.arm){ SH.arm = false; var d = $('#del'); if(d){ d.classList.remove('arm'); d.textContent = 'Rimuovi'; } } }, 3500); return; }
    rimuoviSheet();
  }
  else if(a === 'copy-order'){ copyText(orderText(), 'Lista per il fornitore'); }
  else if(a === 'copy-inv'){ copyText(inventoryText(), 'Inventario completo'); }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if(el.id === 'q'){ UI.q = el.value; renderGrid(); return; }
  if(!SH || !SH.d) return;
  var f = el.getAttribute('data-f'); if(f) SH.d[f] = el.value;
});
document.addEventListener('change', function(e){
  if(e.target.id !== 'qty' || !SH) return;
  var n = parseNum(e.target.value);
  if(n === null){ e.target.value = fmt(SH.d.qty); toast('Inserisci un numero valido'); return; }
  SH.d.qty = n; e.target.value = fmt(n); liveSheet();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && SH) closeSheet();
  if(e.key === 'Enter' && e.target.id === 'qty') e.target.blur();
});

/* ── Avvio ───────────────────────────────────────────────────────── */
async function avvia(){
  renderWho();
  var c = lsGet('mg_cache', null); if(c && c.p && c.p.length){ P = c.p; renderTutto(); }
  await caricaProdotti(false);
  // tiene la pagina allineata con chi usa il magazzino da un altro telefono
  setInterval(function(){ if(!document.hidden && !pending && !SH && _authSess) caricaProdotti(true); }, 60 * 1000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && !pending && !SH && _authSess) caricaProdotti(true); });
}
_authAvvio();
</script>
