nschaft malte. Es wurde mehrmals restauriert: 2017 malte der argentinische Künstler Francisco Bosoletti das Gesicht neu.","d":"An der Fassade in der Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Maradonas Gesicht, aufgemalt an der Fassade eines Gebäudes","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"Das Maradona-Wandbild in der Via Emanuele De Deo, dessen Gesicht 2017 von Francisco Bosoletti neu gemalt wurde."}},{"t":"Largo Maradona seit dem 25. November 2020","x":"Nach Maradonas Tod hat der Platz, der zuvor „der Künstler“ hieß, seinen Namen angenommen und ist zu einem Ort voller kleiner Altäre, Fahnen und Fotografien geworden.","d":"Auf dem freien Platz vor dem Wandbild","foto":{"u":"../img/76bca69c23a8.jpg","alt":"Der Platz vor dem Maradona-Wandbild, voller Menschen","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: Fahnen, kleine Altäre und Besucher vor dem Wandbild."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"Das Schild des Largo Maradona mit einer Büste und Fahnen","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"Das Schild des Platzes: Nach Diegos Tod im Jahr 2020 erhielt der Platz der Künstler seinen Namen."},{"u":"../img/550f6edc4b91.jpg","alt":"Ein kleiner Altar mit Fotos von Maradona und Erinnerungsstücken","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Ein kleiner Maradona gewidmeter Altar: In der Stadt gibt es viele davon, mit Fotos und Erinnerungsstücken, die Fans hinterlassen haben."},{"u":"../img/679687d3070c.jpg","alt":"Maradona mit Heiligenschein gemalt, neben einem kleinen Bildstock","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona mit Heiligenschein und seinem Votivschrein, gemalt im Viertel San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Ein Votivschrein mit einem Porträt von Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Ein Votivschrein für Maradona, wie man ihn sonst für Heilige kennt."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galleria Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Eine kreuzförmige Galerie mit einer rund 56 Meter hohen Kuppel aus Eisen und Glas, gegenüber dem Teatro di San Carlo.","rac":"Die Galleria Umberto I wurde zwischen 1887 und 1890 während des Risanamento von Neapel erbaut, des großen städtebaulichen Wiederaufbauplans nach der Choleraepidemie. Der Architekt Emanuele Rocco entwarf sie in Kreuzform und ließ sich dabei von der Galleria Vittorio Emanuele II in Mailand inspirieren. Sie ist nach Umberto I. benannt, dem König von Italien zur Zeit ihres Baus.\n\nDie vier Arme treffen sich unter einer Kuppel aus Eisen und Glas, die von sechzehn Rippen getragen wird. Unter der Kuppel besteht der Boden aus einem sternförmigen Mosaik. In der Galerie befinden sich Geschäfte, Cafés und in den oberen Stockwerken Wohnungen: Sie war dafür gedacht, Handel und gesellschaftliches Leben miteinander zu verbinden.\n\nSie liegt gegenüber dem Teatro di San Carlo, in der Nähe der Piazza del Plebiscito.","con":"Bleib unter der Kuppel stehen und schau nach oben: Das ist der beste Platz, um Eisen und Glas zu sehen. Es ist ein Durchgangsort mit freiem Eintritt.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"Ein verzierter Eingang der Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Ein Eingang der Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"Die Kuppel aus Eisen und Glas","x":"Die vier Arme der Galerie treffen sich unter einer Kuppel aus Eisen und Glas, die von sechzehn Rippen getragen wird. Tagsüber fällt das Licht von allen Seiten herein; abends hebt die Beleuchtung die Konstruktion hervor.","d":"In der Mitte der Galerie","foto":{"u":"../img/5caa008a8527.jpg","alt":"Die Kuppel aus Eisen und Glas der Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"Die Kuppel aus Eisen und Glas, unter der sich die vier Arme der Galerie treffen."}},{"t":"Das Sternmosaik","x":"Unter der Kuppel ist der Boden ein Mosaik in Form eines zwölfzackigen Sterns in Creme, Terrakotta und Grau. Man erkennt es, wenn man nach unten schaut, dort, wo die Arme der Galerie zusammentreffen.","d":"Auf dem Boden, unter der Kuppel","foto":{"u":"../img/1c072c5bce38.jpg","alt":"Ein Feld des Mosaikbodens mit einem Löwen, einer Getreidegarbe und einem Fass","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:NaplesGalleryUmbertoILeone.jpg","dida":"Eines der Mosaikfelder im Boden der Galleria Umberto I (das Sternzeichen Löwe)."}},{"t":"Die Sanierung Neapels","x":"Die Galleria entstand als Symbol einer Stadt, die sich nach der Choleraepidemie modernisieren wollte. Sie war Teil des „risanamento“ (der Stadtsanierung), des großen Projekts zum Abriss und Wiederaufbau der Stadt, und sollte mit der Galleria Vittorio Emanuele II in Mailand konkurrieren.","d":"Beim Betreten von der Via San Carlo aus","foto":{"u":"../img/df75ec70de03.jpg","alt":"Statuen und die Inschrift ANNO MDCCCXC an der Galleria","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"„Anno MDCCCXC“: das Datum der Fertigstellung, angebracht an der Galleria, dem Symbol der Stadtsanierung."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Teatro di San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"Das älteste noch aktive Opernhaus Europas: eingeweiht 1737, vor der Scala und der Fenice.","rac":"Das Teatro di San Carlo wurde auf Wunsch von Karl III. von Bourbon erbaut und am 4. November 1737, dem Namenstag des Königs, eingeweiht. Der König wünschte sich für Neapel ein größeres Theater als das alte San Bartolomeo. Es wurde 41 Jahre vor der Mailänder Scala und 55 Jahre vor der Fenice in Venedig eröffnet: Deshalb gilt es als das älteste noch aktive Opernhaus. Das Projekt wurde Giovanni Antonio Medrano und Angelo Carasale anvertraut.\n\nAuf seiner Bühne sind Komponisten wie Rossini, Donizetti, Bellini und Verdi aufgetreten. Das Theater gehört zusammen mit dem historischen Zentrum zum UNESCO-Welterbe.\n\nEs kann im Rahmen von Führungen auf Italienisch und Englisch von etwa einer halben Stunde besichtigt werden; im selben Komplex befindet sich auch das MeMus, das Museum, das die Geschichte des Theaters und der Oper erzählt.","con":"Die Besichtigungen hängen von Proben und Aufführungen ab: Informiere dich auf der offiziellen Website und buche, wenn möglich, im Voraus. Wenn du die Oper liebst, lernst du das Theater am besten bei einer Aufführung kennen.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"Die Fassade des Teatro San Carlo mit den Säulen","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"Die Fassade des Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Führungen von etwa 30 Minuten um 10:30, 11:30, 12:30, 14:30, 15:30 und 16:30 Uhr. Reservierung empfohlen."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"Der Saal und das Real Teatro","x":"Der hufeisenförmige Zuschauersaal ist das Herz des Theaters: Logen in übereinanderliegenden Rängen und eine königliche Loge. Das San Carlo ist auch für seine Akustik berühmt. Bei den Führungen darf man den Saal und das Foyer in der Regel fotografieren.","d":"Im Zuschauersaal, bei der Führung","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"Ein Kupferstich aus dem 18. Jahrhundert mit einem Ball im Theater","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Ein Ball im Real Teatro di San Carlo, auf einem Kupferstich von 1749."}},{"t":"Das MeMus","x":"Das MeMus, eröffnet im Jahr 2011, ist das Museum und historische Archiv des Theaters. Es zeichnet die Geschichte des Gebäudes und der italienischen Oper anhand von Gemälden, Fotografien, Musikinstrumenten und Kostümen nach.","d":"Im selben Gebäudekomplex wie das Theater","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Im MeMus ausgestellte Bühnenkostüme","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Bühnenkostüme aus einer Oper von Paisiello, ausgestellt im MeMus."}},{"t":"Das älteste noch in Betrieb befindliche Opernhaus Europas","x":"Eröffnet im Jahr 1737, ist es älter als die Mailänder Scala (1778) und das Teatro La Fenice in Venedig (1792). Deshalb gilt es als das älteste noch bespielte Opernhaus.","d":"Vor der Fassade, an der Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"Die Inschrift Real Teatro di S. Carlo an der Fassade","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"„Real Teatro di S. Carlo“, an der Fassade des 1737 eröffneten Theaters."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"Der größte Platz Neapels: auf der einen Seite der Königspalast, auf der anderen eine Kolonnade, die die Basilika des heiligen Franz von Paola umarmt.","rac":"Am Fuß des Hügels von Pizzofalcone liegt die Piazza del Plebiscito, einer der weitesten und monumentalsten Plätze der Stadt. Bis 1817 hieß sie Largo di Palazzo. 1809 ließ Joachim Murat die Klöster der Gegend abreißen und ein Forum mit einer halbkreisförmigen Kolonnade entwerfen. Die Arbeiten wurden mit dem Ende seiner Herrschaft unterbrochen und von Ferdinand I. wieder aufgenommen, der in Erfüllung eines dem heiligen Franz von Paola gegebenen Gelübdes eine Kirche errichten wollte: Die Basilika wurde zwischen 1817 und 1836 erbaut und vom Pantheon in Rom inspiriert.\n\nDen heutigen Namen erhielt der Platz nach der Volksabstimmung vom 21. Oktober 1860, die den Anschluss des Königreichs beider Sizilien an das Königreich Sardinien besiegelte. Vor der Basilika stehen zwei Reiterstandbilder: Karl III. von Bourbon, ein Werk von Antonio Canova, und Ferdinand I.\n\nHeute ist der Platz Schauplatz von Konzerten, Feierlichkeiten und Stadtfesten.","con":"Komm früh am Morgen: Das flache Licht beleuchtet die Kolonnaden, und der Platz ist fast leer. Danach geh in die Basilika hinein und umrunde sie in Richtung Königspalast.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito mit einem Löwen und der Kirche San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito und im Hintergrund San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"Die Kolonnade und die Basilika San Francesco di Paola","x":"Die halbkreisförmige Kolonnade entstand unter Murat. Die Basilika ist ein klassizistischer Bau mit einer 53 Meter hohen zentralen Kuppel, die vom Pantheon inspiriert ist. Im Inneren wurde der Hochaltar, reich an Edelsteinen und Lapislazuli, 1751 von Ferdinando Fuga entworfen und 1835 aus der Kirche Santi Apostoli hierher gebracht.","d":"An der Westseite des Platzes","foto":{"u":"../img/82ad7240a133.jpg","alt":"Der kreisrunde Innenraum der Basilika San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"Der Innenraum der Basilika San Francesco di Paola, die vom Pantheon inspiriert ist."}},{"t":"Die Reiterstandbilder","x":"Die beiden Bronzestatuen stellen Karl III. von Bourbon, den Stammvater des Hauses, und seinen Sohn Ferdinand I. dar. Sie stehen gegenüber der Basilika.","d":"Vor der Basilika","foto":{"u":"../img/75d762389b74.jpg","alt":"Ein bronzenes Reiterstandbild vor der Basilika","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"Eines der beiden Reiterstandbilder der Bourbonen vor der Basilika."}},{"t":"Der Name des Platzes","x":"Der Name geht auf die Volksabstimmung vom 21. Oktober 1860 zurück, mit der das Königreich beider Sizilien dem Königreich Sardinien angegliedert wurde. Zuvor hieß der Platz Largo di Palazzo.","d":"Auf dem gesamten Platz","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito in ihrer ganzen Weite","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, früher Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Königspalast","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"Der große Palast der Vizekönige und der Bourbonen: Ehrentreppe, Hoftheater, Thronsaal und ein Garten am Golf.","rac":"Der Königspalast blickt auf die Piazza del Plebiscito. Er wurde Anfang des 17. Jahrhunderts vom spanischen Vizekönig Fernando Ruiz de Castro, Graf von Lemos, in Auftrag gegeben und war über Jahrhunderte Sitz der Macht in Neapel; der Bau zog sich über Jahrhunderte hin und wurde erst 1858 von Gaetano Genovese vollendet. An der Fassade stehen in den Nischen acht Statuen von Herrschern Neapels.\n\nDas Museum nimmt die Historische Wohnung im Hauptgeschoss (Piano nobile) ein: Man erreicht sie über die Ehrentreppe, ein Werk von Francesco Antonio Picchiatti aus dem Jahr 1651, die mit rosafarbenem und weißem Marmor verkleidet ist und als eine der schönsten Europas gilt. Zu den Sälen gehören das Hoftheater, der Thronsaal, die Königliche Kapelle und der Herkulessaal. Die Historische Wohnung ist seit 1919 für die Öffentlichkeit zugänglich und wurde im Zweiten Weltkrieg schwer beschädigt.\n\nDer Romantische Garten auf der Seite zum Golf hat freien Eintritt.","con":"Achten Sie beim Hinaufgehen der Ehrentreppe auf den Marmor und das Licht. In der Regel ist der Palast von 9 bis 20 Uhr geöffnet (letzter Einlass um 19 Uhr) und mittwochs geschlossen: Prüfen Sie es aber vor Ihrem Besuch noch einmal.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"Die Fassade des Königspalasts am Platz","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"Die Fassade des Königspalasts."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Etikette-Appartement (Historisches Appartement). In der Regel mittwochs geschlossen. Zuletzt bestätigt auf den offiziellen Seiten des Kulturministeriums (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"Die Prunktreppe","x":"Die 1651 von Francesco Antonio Picchiatti entworfene Treppe wurde später mit rosafarbenem und weißem Marmor verkleidet. Sie gilt als eine der schönsten monumentalen Treppen Europas und führt zum Museum in der Beletage.","d":"Am Eingang, am Ehrenhof","foto":{"u":"../img/7533a4a26b58.jpg","alt":"Die Prunktreppe des Königspalastes","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"Die Prunktreppe des Königspalastes, mit Marmor verkleidet."}},{"t":"Das Hoftheater und der Thronsaal","x":"Das Historische Appartement beherbergt das Hoftheater, den Thronsaal mit einem großen Kristallleuchter, die Königliche Kapelle und den Herkulessaal: Es waren die Wohn- und Repräsentationsräume des Hofes.","d":"In der Beletage, im Historischen Appartement","foto":{"u":"../img/841e35a47444.jpg","alt":"Der Thron im Thronsaal des Königspalastes","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"Der Thronsaal im Historischen Appartement."}},{"t":"Der romantische Garten","x":"Auf der Seite zum Golf liegt der Garten mit freiem Eintritt, in dem man zwischen Blumenbeeten und Bäumen spazieren geht. Es ist ein ruhiger Ort mit Blick auf den Golf.","d":"Auf der meerseitigen Seite des Palastes","foto":{"u":"../img/982684065526.jpg","alt":"Der Garten des Königspalastes mit Beeten, Palmen und Laternen, im Hintergrund der Palast","aut":"Yair Haklai","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Royal_Palace_(Naples)_-_Garden.jpg","dida":"Der Garten des Königspalastes mit seinen Beeten und Bäumen."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Neues Schloss)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Das Wahrzeichen Neapels: ein Triumphbogen zwischen zwei Türmen, ein Bronzetor, das noch immer von einer Kanonenkugel getroffen ist, und der Saal, in dem ein König während eines Hochzeitsfestes die Barone verhaften ließ.","rac":"Unter den anjouinischen Königen wurde das Schloss zu einem Zentrum der Kultur: Unter Robert von Anjou weilten hier Künstler, Ärzte und Gelehrte, darunter Giotto, Petrarca und Boccaccio.\n\nAlfons I. von Aragón machte es zu seiner königlichen Residenz und baute es wieder auf. Zur Feier seines siegreichen Einzugs in die Stadt ließ er zwischen dem Mittelturm und dem Wachturm den großen Triumphbogen errichten, der noch heute als Eingang dient.\n\nHeute ist im Schloss das Städtische Museum untergebracht: Der Rundgang umfasst die Gemäldegalerie im ersten Stock, den Saal der Barone, die Palastkapelle, auch Kapelle der heiligen Barbara genannt, und einen archäologischen Rundgang in der alten Waffenkammer.","con":"Normalpreis 10 Euro; 6 Euro für Einwohner von Neapel und der Metropolstadt; frei für Personen unter 18 Jahren. Sonntags geschlossen.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Das Maschio Angioino mit den zwei Türmen und dem weißen Bogen in der Mitte","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Die zwei großen Türme und dazwischen der Triumphbogen Alfons' von Aragon: Er ist der Eingang zur Burg."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"Der Triumphbogen","x":"Es ist der Eingang der Burg, eingezwängt zwischen zwei Türmen: Alfons I. von Aragón ließ ihn errichten, um seinen siegreichen Einzug in Neapel zu feiern. Bleiben Sie davor stehen, bevor Sie eintreten, und betrachten Sie ihn von unten.","d":"Am Eingang, zwischen dem Mittelturm und dem Wachturm","foto":{"u":"../img/91d08c9a9561.jpg","alt":"Der Triumphbogen aus Marmor zwischen den beiden Türmen","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"Der Bogen aus der Nähe: Betrachten Sie ihn von unten, Stockwerk für Stockwerk."}},{"t":"Die Tür mit der Kanonenkugel","x":"Ferrante d'Aragona gab sie um 1475 bei Guglielmo Monaco in Auftrag, um an den Sieg von 1462 über Johann von Anjou und die rebellierenden Barone zu erinnern: Sechs Felder erzählen vom Krieg. Im Feld unten links steckt noch immer eine eiserne Kanonenkugel im Bronzerelief. Die am meisten anerkannte Hypothese: Die Tür gehörte zur Beute, die Karl VIII. auf Schiffe nach Frankreich verladen ließ; vor Rapallo wurde die Flotte von den Genuesen angegriffen, und der Schuss traf die Tür. Die Genuesen schickten sie 1495 nach Neapel zurück.","d":"Das Original wird im Inneren der Burg aufbewahrt","foto":{"u":"../img/50ee03911e6d.jpg","alt":"Die in der Bronzetür steckende Kanonenkugel","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"Die eiserne Kanonenkugel, die im Bronzerelief des Feldes unten links steckt."}},{"t":"Der Saal der Barone","x":"Man erreicht ihn über die Außentreppe aus Piperno des mallorquinischen Architekten Guillermo Sagrera. Blicken Sie nach oben: Das Gewölbe steigt auf etwa 28 Meter, und sechzehn Rippen aus Piperno laufen sternförmig von einer Öffnung in der Mitte aus. Der Name erinnert an das Jahr 1486, als König Ferrante I. die Barone unter einem Vorwand zu einer Hochzeitsfeier einlud und sie hier festnehmen ließ. Fünfzig Jahre lang war er der Sitz des Stadtrats.","d":"Oben an der Treppe im Innenhof","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"Das Sterngewölbe des Saals der Barone","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"Das Gewölbe des Saals der Barone: Sechzehn Rippen aus Piperno laufen sternförmig von der Öffnung in der Mitte aus."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Ein Tunnel, den ein König als Fluchtweg wollte, der später zum Luftschutzbunker und dann zum Depot wurde: eine Reise unter den Hügel von Pizzofalcone.","rac":"Die Galleria Borbonica wurde von Ferdinand II. von Bourbon mit Dekret vom 19. Februar 1853 in Auftrag gegeben und vom Architekten Errico Alvino entworfen. Sie sollte den Königspalast mit der Piazza della Vittoria und den Kasernen verbinden und unter dem Hügel von Pizzofalcone hindurchführen: ein schneller Fluchtweg für den König. Die Arbeiten wurden aus Geldmangel und dann wegen der politischen Veränderungen im Zuge der Einigung Italiens eingestellt.\n\nIm Zweiten Weltkrieg wurden einige Räume als Luftschutzbunker genutzt. Nach dem Krieg war der Tunnel bis in die 1970er-Jahre das Gerichtsdepot der Stadt Neapel: Noch heute sieht man Statuenfragmente sowie Oldtimer-Autos und -Motorräder. Die Associazione Culturale Borbonica Sotterranea hat ihn gesäubert und bietet Führungen an.\n\nDie Standardroute dauert etwa eine Stunde und kann an zwei Eingängen beginnen: via Domenico Morelli 61 und Vico del Grottone 4, etwa 100 Meter von der Piazza del Plebiscito entfernt. Es gibt auch abenteuerlichere Routen.","con":"Bitte reservieren: Die Reservierung ist Pflicht. Die Standardführung startet freitags, samstags, sonntags und an Feiertagen um 10, 12, 15 und 17 Uhr. Fotografieren ist erlaubt.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"Ein in den Tuffstein gegrabener Tunnel in der Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Ein Abschnitt der Galleria Borbonica, die in den Tuffstein gegraben wurde."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Standardroute: Touren um 10, 12, 15 und 17 Uhr (freitags, samstags, sonntags und an Feiertagen). Voranmeldung erforderlich, Dauer etwa 1 Stunde. Eingänge: via Domenico Morelli 61 und Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"Der Bourbonentunnel","x":"Dieser Abschnitt erzählt vom Ehrgeiz Ferdinands II.: ein langer Gang aus gelbem Tuffstein, der den Königspalast mit der Piazza della Vittoria verbinden sollte. Der Tuffstein erzählt auch von der Arbeit der Steinbrecher und von der Wasserbautechnik jener Zeit.","d":"Entlang der Hauptroute","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"Ein in den Tuffstein gehauener Durchgang in der Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"Der Gang der Brunnenbauer, ein in den Tuffstein gehauener Abschnitt der Galleria Borbonica."}},{"t":"Der Luftschutzbunker","x":"Zwischen 1939 und 1945 suchten hier Tausende von Menschen Schutz vor den Bombardierungen. Betten, Graffiti und Alltagsgegenstände aus jener Zeit sind erhalten geblieben. Dieser Teil beeindruckt die Besucher am meisten.","d":"In den Räumen des Schutzraums","foto":{"u":"../img/3200f06943d2.jpg","alt":"Der Luftschutzbunker in der Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"Der Luftschutzbunker aus dem Zweiten Weltkrieg."}},{"t":"Oldtimer-Autos und -Motorräder","x":"In der Nachkriegszeit wurde der Tunnel als gerichtliches Verwahrlager für beschlagnahmte Fahrzeuge genutzt: Noch heute sieht man entlang der Route Oldtimer-Autos und -Motorräder.","d":"Entlang der Route","foto":{"u":"../img/87eab52966bc.jpg","alt":"Verlassene Oldtimer im Tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Oldtimer entlang des Tunnels: die Nachkriegszeit, als der Tunnel als gerichtliches Verwahrlager diente."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Uferpromenade und Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Die Burg auf dem Inselchen, auf dem die griechischen Siedler aus Kyme landeten: Man erreicht sie von der Uferpromenade, überquert die Brücke und blickt vom Borgo Marinari auf den Golf.","rac":"Die Burg erhebt sich auf dem Inselchen Megaride, das aus zwei durch einen großen Bogen verbundenen Felsen besteht. Hier landeten Mitte des 7. Jahrhunderts v. Chr. die Siedler aus Kyme, die später auf dem nahe gelegenen Monte Echia Partenope gründeten.\n\nIm 1. Jahrhundert v. Chr. stand auf dem Inselchen und auf dem Monte Echia die Villa des Lucius Licinius Lucullus. Im Säulensaal sind noch Überreste davon erhalten: Im Frühmittelalter war der Saal das Refektorium eines der auf dem Inselchen erbauten Klöster.","con":"Das Innere des Schlosses ist bis auf Weiteres wegen Bauarbeiten geschlossen: Heute besichtigt man es von außen, bei einem Spaziergang an der Uferpromenade und rund um den Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Das Castel dell'Ovo am Meer, unter blauem Himmel","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Das Castel dell'Ovo auf der Felseninsel Megaride, durch eine Brücke mit der Uferpromenade verbunden."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Reservierung optional."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"Die Felseninsel Megaride","x":"Blicken Sie von der Uferpromenade auf die Burg: Sie ruht auf der Felseninsel Megaride, die aus zwei durch einen großen Bogen verbundenen Felsen besteht. Hier landeten um die Mitte des 7. Jahrhunderts v. Chr. die Kymäer griechischer Herkunft, die später auf dem nahen Monte Echia die Stadt Partenope gründeten.\n\nIm 1. Jahrhundert v. Chr., in römischer Zeit, entstand auf der Insel und auf dem Monte Echia die berühmte Villa des Lucius Licinius Lucullus; erhalten sind die Säulentrommeln des sogenannten „Säulensaals“.\n\nDer Name geht auf eine Legende zurück: Der Dichter Vergil soll in den unterirdischen Räumen ein Ei in einem Käfig versteckt haben, und von dessen Unversehrtheit hänge das Schicksal der Burg und ganz Neapels ab. Als zur Zeit der Königin Johanna I. der Bogen zwischen den beiden Felsen einstürzte, musste die Königin erklären, sie habe das Ei ersetzt, um die Stadt zu beruhigen.","d":"Von der Brücke, die zum Borgo Marinari führt","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Das Castel dell'Ovo und der kleine Hafen des Borgo Marinari von oben gesehen","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Von oben: die Burg auf dem Felsen und daneben der kleine Hafen des Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Stich von 1841 mit dem Castel dell'Ovo und einem Segelboot","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Das Castel dell'Ovo auf einem Stich von 1841."}],"leg":"Der Name geht auf eine Legende zurück: Der Dichter Vergil soll in den unterirdischen Räumen des Schlosses ein Ei, eingeschlossen in einem Käfig, versteckt haben.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Rione Sanità und Basilika Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Ein volkstümliches Viertel, das von unten wiedergeboren wurde: die Basilika des „Monacone“, die Katakomben, Totò und die Wandgemälde.","rac":"Der Rione Sanità ist eines der ältesten und volkstümlichsten Viertel Neapels: Jahrhundertelang war er ein Begräbnisort, heute ist er ein Vorbild für eine Erneuerung von unten, mit Genossenschaften junger Leute, die Katakomben und Führungen betreiben.\n\nIm Zentrum steht die Basilika Santa Maria della Sanità, erbaut zwischen 1602 und 1610 nach einem Entwurf von Fra Nuvolo, eines der bedeutendsten Beispiele des neapolitanischen Barocks. Sie wird San Vincenzo oder „'o Munacone“ genannt, nach der großen Statue des heiligen Vinzenz Ferrer, die sie beherbergt. Der Grundriss hat die Form eines griechischen Kreuzes, und die Kuppel ist mit Majolika verkleidet. Unter der Kirche befinden sich die Katakomben von San Gaudioso aus dem 4. Jahrhundert.\n\nIm Viertel wurde der Schauspieler Totò in der Via Santa Maria Antesaecula geboren; Wandgemälde erinnern im ganzen Viertel an ihn. Hier spielt auch die Komödie „Der Bürgermeister des Rione Sanità“ von Eduardo De Filippo.","con":"Besuchen Sie das Viertel tagsüber und in Ruhe: Die Katakomben, die Basilika und der Friedhof Fontanelle liegen nah beieinander. Sie können alles mit der sonntäglichen „Heiligen Meile“ verbinden.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"Die Basilika Santa Maria della Sanità mit ihrer Kuppel","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"Die Basilika Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilika. An einigen Terminen kann sie geschlossen sein: Bitte auf der Website nachsehen."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"Die Basilika des Monacone","x":"Die Kirche von Fra Nuvolo hat einen griechischen Kreuzgrundriss und eine mit Majolika verkleidete Kuppel. Der Chorraum liegt erhöht, und der barocke Altar hat eine doppelte Treppe. Die Statue des heiligen Vinzenz Ferrer, des „Monacone“, gibt der Basilika ihren volkstümlichen Namen.","d":"An der Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"Das erhöhte Presbyterium mit der Doppeltreppe in der Basilika","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"Das erhöhte Presbyterium der Basilika Santa Maria della Sanità mit der Doppeltreppe."}},{"t":"Die Katakomben von San Gaudioso","x":"Unter der Basilika befinden sich die Katakomben von San Gaudioso aus dem 4. Jahrhundert. Der Zugang erfolgt über die Kirche.","d":"Unter der Basilika","foto":{"u":"../img/30e6de57bd17.jpg","alt":"Die Katakomben von San Gaudioso unter der Basilika","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Die Katakomben von San Gaudioso unter der Basilika."}},{"t":"Totò und die Wandbilder","x":"In den benachbarten Straßen und in der Via Santa Maria Antesaecula, wo Totò geboren wurde, erinnern Wandbilder und kleine Darstellungen an den Schauspieler und an die Geschichten des Viertels.","d":"In den Gassen rund um den Platz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Katakomben von San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Die größten Katakomben Süditaliens: Tuffsteingänge auf zwei Ebenen und das ursprüngliche Grab von San Gennaro, dem Schutzpatron von Neapel.","rac":"Die Katakomben von San Gennaro befinden sich im Rione Sanità; der Eingang liegt in der Via Capodimonte 13, neben der Basilica del Buon Consiglio. Ihr Ursprung reicht ins 2. Jahrhundert n. Chr. zurück, als eine wohlhabende römische Familie ihre Grabstätte der christlichen Gemeinde schenkte. Die Anlage erstreckt sich über zwei in den Tuffstein gegrabene Ebenen: San Gennaro superiore (obere Ebene) und San Gennaro inferiore (untere Ebene).\n\nHier wurde San Gennaro beigesetzt, und jahrhundertelang war der Ort ein Wallfahrtsziel. Bis zum 9. Jahrhundert blieben seine Reliquien hier; dann wurden sie fortgebracht und die Stätte wurde aufgegeben. Heute ist sie nur mit Führung zu besichtigen, etwa eine Stunde lang. Seit 2009 beleuchtet eine LED-Anlage, die von Officina dei Talenti, der Genossenschaft junger Leute aus dem Viertel, realisiert wurde, die Fresken mit gedämpftem Licht.\n\nDie Stätte wird von der Sozialgenossenschaft La Paranza betrieben, die von jungen Menschen aus dem Rione Sanità gegründet wurde.","con":"Buchen Sie im Voraus: Die Besichtigungen finden nur mit Führung statt, sie starten jede Stunde, und eine Reservierung ist Pflicht. Die „Heilige Meile“, eine geführte Route durch den Rione Sanità, startet samstags, sonntags und an Feiertagen um 9:30 Uhr. Die Katakomben sind mittwochs geschlossen.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"Ein frühchristliches Fresko in den Katakomben von San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Ein frühchristliches Fresko in den Katakomben von San Gennaro."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Führungen stündlich, Voranmeldung immer erforderlich. Mittwochs und am 25. Dezember geschlossen."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"Das Grab des San Gennaro","x":"Es ist das Grab, das dem gesamten Katakombensystem seinen Namen gibt: Hier wurde der Schutzpatron Neapels beigesetzt. Seine Reliquien blieben bis zum 9. Jahrhundert hier.","d":"Auf der geführten Tour","foto":{"u":"../img/fd273aee226d.jpg","alt":"Das Grab des San Gennaro in den Katakomben","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"Das Grab des San Gennaro, der Ort, der den Katakomben ihren Namen gibt."}},{"t":"Die zwei Ebenen","x":"Die Gänge sind auf zwei Ebenen, der oberen und der unteren, in den Tuffstein gegraben und haben weite Durchgänge und frühchristliche Fresken.","d":"Während der Führung","foto":{"u":"../img/537a160d9acb.jpg","alt":"Ein in den Tuffstein gegrabener Gang mit Gräbern in den Wänden","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Die Gänge der Katakomben, in den Tuffstein gegraben."}},{"t":"Die Heilige Meile","x":"Samstags, sonntags und an Feiertagen führt eine geführte Route von etwa drei Stunden zu den Orten im Rione Sanità, die mit San Gennaro verbunden sind. Sie beginnt um 9:30 Uhr und muss auf der offiziellen Website gebucht werden.","d":"Vom Treffpunkt der Katakomben","foto":{"u":"../img/0becd922c42f.jpg","alt":"Die Fassade eines Gebäudes im Rione Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"Das Rione Sanità, wo die Heilige Meile den Orten folgt, die mit San Gennaro verbunden sind."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Friedhof Fontanelle","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"Ein Tuffsteinbruch so groß wie eine Kathedrale, Tausende namenlose Schädel und der Kult der anime pezzentelle. 2026 wiedereröffnet.","rac":"Im 16. Jahrhundert war es ein Tuffsteinbruch im Tal der Sanità. Während der Pest von 1656 wurden viele Opfer hierher gebracht, danach jene der Choleraepidemie von 1836–1837; 1872 ordnete der Kanoniker Gaetano Barbati die Gebeine in drei großen Schiffen an. Die Fläche beträgt etwa viertausend Quadratmeter.\n\nHier entstand der Kult der anime pezzentelle: Gläubige adoptierten einen Schädel, eine capuzzella, kümmerten sich um ihn und beteten zu ihm, in der Hoffnung auf Schutz, manchmal auf einen Traum mit den Lottozahlen. 1969 schloss ein Dekret des kirchlichen Gerichts das Ossarium und verbot den Kult. Seit 2020 wegen Arbeiten geschlossen, wurde es 2026 wieder für die Öffentlichkeit geöffnet; es wird von der Genossenschaft La Paranza geführt.","con":"Mittwochs geschlossen. Laden Sie die App des Friedhofs herunter, bevor Sie ankommen: Drinnen ist der Handyempfang schwach.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"Die großen Tuffsteingänge des Friedhofs Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Die Tuffsteingänge des Friedhofs Fontanelle."},"ov":false,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"An Weihnachten geschlossen. Montag und Freitag 9–10 Uhr nur für den Gottesdienst geöffnet"}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Ein Steinbruch so groß wie eine Kathedrale","x":"Der Friedhof befindet sich in einem alten Tuffsteinbruch von etwa viertausend Quadratmetern, den der Kanoniker Gaetano Barbati 1872 zu drei großen Schiffen herrichten ließ. Hierher brachte man die Toten der Pest von 1656 und der Cholera von 1836-1837.","d":"In den drei Schiffen","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"Ein Schiff des Friedhofs Fontanelle, in den Tuffstein gehauen","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"Eines der drei Schiffe des Friedhofs Fontanelle im alten Tuffsteinbruch."}},{"t":"Der Kult der anime pezzentelle","x":"Die Gläubigen adoptierten einen Schädel, die capuzzella, pflegten ihn und beteten zu ihm. Als Gegenleistung erhofften sie sich Schutz, manchmal einen Traum mit Lottozahlen. 1969 verbot das kirchliche Gericht den Kult und schloss das Beinhaus.","d":"Vor den Reihen von Schädeln","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Reihen von Schädeln mit einem Kreuz","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Die capuzzelle: namenlose Schädel, von Gläubigen adoptiert und gepflegt."}},{"t":"Die Fontanelle im MADRE","x":"Die Künstlerin Rebecca Horn hat einige capuzzelle der Fontanelle in Gusseisen nachgebildet, in dem Werk „Spirits“, das im Museum MADRE zu sehen ist: eine Möglichkeit zu verstehen, wie der Friedhof auch in die zeitgenössische Kunst Eingang gefunden hat.","d":"Im Museum MADRE (eigener Eintrag)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Kartause und Museum San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Ein Kartäuserkloster, das zum Museum wurde, auf dem Hügel Vomero: ein barocker Kreuzgang, die Krippe Cuciniello und eine der schönsten Aussichten auf den Golf.","rac":"Die Certosa di San Martino erhebt sich auf dem Hügel Vomero, neben dem Castel Sant'Elmo. Sie wurde 1325 von Karl von Kalabrien, dem Sohn König Roberts von Anjou, gegründet und Tino di Camaino anvertraut. Zwischen dem 16. und dem 18. Jahrhundert wurde sie zu einem der erlesensten Beispiele italienischer Barockkunst: Von 1623 bis 1656 erneuerte Cosimo Fanzago ihre Räume. Seit 1866, nach der Aufhebung der religiösen Orden, beherbergt sie das Museo nazionale di San Martino, das auf Giuseppe Fiorelli zurückgeht.\n\nIm Zentrum des Chiostro Grande, der ab 1581 von Giovanni Antonio Dosio erweitert und von Fanzago vollendet wurde, liegt der Friedhof der Mönche. Das Museum bewahrt die bedeutendste öffentliche Sammlung Italiens zur neapolitanischen Krippe, mit der großartigen Presepe Cuciniello: rund achthundert Figuren, Tiere und Zubehörteile, gestiftet vom Sammler Michele Cuciniello und 1879 eingeweiht. Weitere Abteilungen erzählen von der Seefahrt des Königreichs, vom Theater sowie von der Stadt und dem Königreich in Bildern und, seit Dezember 2025, vom 19. Jahrhundert in Neapel. Hier befindet sich auch die Tavola Strozzi, die als das erste Gemälde Neapels gilt.","con":"Gehen Sie hinaus auf die Terrassen und die Loggia del Priore: Von hier sieht man den ganzen Golf. Geöffnet ist täglich außer dienstags; der letzte Einlass ist um 17:30 Uhr.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"Der große Kreuzgang der Kartause San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"Der große Kreuzgang der Kartause San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Dienstags geschlossen. Einige Abteilungen (Marine, Krippen, Neapel im 19. Jahrhundert) öffnen um 9:30 Uhr; die Gärten schließen eine Stunde früher."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"Der Große Kreuzgang","x":"Er wurde ab 1581 von Giovanni Antonio Dosio erweitert und von Cosimo Fanzago vollendet und hat in der Mitte den Mönchsfriedhof. Entlang des Umgangs sieht man noch die Türen und die Essensdurchreichen der Zellen der Kartäuser.","d":"Im Herzen der Certosa","foto":{"u":"../img/e43efae68626.jpg","alt":"Der Große Kreuzgang der Certosa mit dem Mönchsfriedhof","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"Der Große Kreuzgang der Certosa di San Martino, in dessen Mitte der kleine Mönchsfriedhof liegt."}},{"t":"Die Cuciniello-Krippe","x":"Mit etwa achthundert Stücken ist sie die berühmteste Krippe Neapels. Sie wurde von Michele Cuciniello gestiftet und 1879 eingeweiht. Eine Beleuchtungsanlage simuliert die Tageszeiten.","d":"Im Krippenbereich, wo sich früher die Küchen befanden","foto":{"u":"../img/ae5327fcce50.jpg","alt":"Die große Krippe mit Hunderten von Figuren","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"Die Cuciniello-Krippe mit etwa achthundert Stücken."}},{"t":"Der Blick auf den Golf","x":"Von den Terrassen und Gärten der Certosa aus sieht man den ganzen Golf von Neapel, mit dem Vesuv im Hintergrund.","d":"Auf den Terrassen und in den Gärten","foto":{"u":"../img/81d0fb825e80.jpg","alt":"Der Golf von Neapel von einem Balkon der Certosa aus gesehen","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"Der Golf und der Vesuv von einem Balkon der Certosa di San Martino aus."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant’Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"Die sternförmige Festung auf dem Hügel Vomero: Bastionen mit 360°-Blick auf Neapel und den Golf und im Inneren das Museo Novecento.","rac":"Das Castel Sant'Elmo überragt den Vomero in etwa 250 Metern Höhe über dem Meeresspiegel und ist von fast der ganzen Stadt aus zu sehen. Die ersten Erwähnungen nennen es um 1275 als befestigte anjouinische Residenz namens Belforte; 1329 ließ Robert von Anjou es erweitern, mit der Leitung betraut wurde Tino di Camaino. Der sechszackige sternförmige Grundriss ist dagegen das Ergebnis des Wiederaufbaus im 16. Jahrhundert, den der Vizekönig Pedro de Toledo zwischen 1537 und 1547 nach einem Entwurf des Militärarchitekten Pedro Luis Escrivà veranlasste.\n\nIm Lauf der Jahrhunderte war es häufig ein Gefängnis: Hier wurden Tommaso Campanella und später Patrioten der Neapolitanischen Republik von 1799 wie Gennaro Serra, Mario Pagano und Luisa Sanfelice eingesperrt. Nachdem es bourbonischer Stützpunkt gewesen war, diente es bis 1952 als Militärgefängnis; 1976 begann eine große Restaurierung.\n\nAuf dem Exerzierplatz befindet sich seit 2010 das Museo Novecento a Napoli: über 170 Werke von rund 90 neapolitanischen oder in der Stadt zwischen 1910 und 1980 tätigen Künstlern. Einige Werke wurden eigens für das Kastell geschaffen: In der großen Zisterne ließ Gian Maria Tosatti ein Weizenfeld wachsen, und auf den Wehrgängen zeichnet sich die Aluminiumskulptur „Sant'Elmo“ von Mimmo Paladino ab.\n\nVon den Bastionen reicht die Aussicht von den Inseln bis zum Vesuv, von den Phlegräischen Feldern bis zu den Bergen des Matese.","con":"Gehen Sie gegen Sonnenuntergang hinauf, um die Aussicht zu genießen. Das Kastell liegt neben der Certosa di San Martino: Man kann beide am selben Vormittag besichtigen. Das Kastell ist dienstags geschlossen und kann bei schlechtem Wetter geschlossen bleiben.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Die hohen Tuffsteinmauern des Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Die Mauern des Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Burg 8:30–19:30 Uhr; Museo Novecento 9:30–18:30 Uhr (letzter Einlass 17:30 Uhr). Dienstags geschlossen. Bei schlechtem Wetter kann die Anlage geschlossen bleiben."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"Die Bastionen und das Panorama","x":"Die Bastionen bieten ein 360°-Panorama über die Stadt, den Golf, den Vesuv und die Küste von Posillipo, eines der umfassendsten in Neapel.","d":"Auf den Wehrmauern","foto":{"u":"../img/81edfbd30506.jpg","alt":"Neapel und der Vesuv von oben, vom Castel Sant'Elmo aus gesehen","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Von den Bastionen des Castel Sant'Elmo: die Stadt, der Hafen und der Vesuv."}},{"t":"Das Museo Novecento in Neapel","x":"Das 2010 auf dem Exerzierplatz eröffnete Museum versammelt über 170 Werke von etwa 90 neapolitanischen oder in der Stadt tätigen Künstlern, entstanden ab 1910: vom Futurismus bis zur Transavanguardia der Achtzigerjahre.","d":"Auf dem Waffenplatz der Burg","foto":{"u":"../img/d585126c2db4.jpg","alt":"Ein Saal des Museo Novecento mit Kunstwerken","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Ein Saal des Museo Novecento in Neapel, im Castel Sant'Elmo."}},{"t":"Ein Weizenfeld in der Zisterne","x":"Das Werk „My dreams, they'll never surrender“ von Gian Maria Tosatti (2014) ist ein Weizenfeld, das in der Zisterne gewachsen ist, dem dunkelsten und tiefsten Ort der Burg, die auch ein Gefängnis war.","d":"In der großen Zisterne","foto":null}],"
