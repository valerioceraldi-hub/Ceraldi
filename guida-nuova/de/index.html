<!doctype html>
<html lang="de">
<head>

<title>Neapel-Führer · Ceraldi</title>

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"de","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità und Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Der Ausgangspunkt: Piazza Carità, an der Via Toledo. Von hier aus beginnt die Altstadt nur wenige Gehminuten entfernt. Und hier ist Ceraldi.","rac":"Die Piazza Carità liegt an der Via Toledo, der großen Straße, die der spanische Vizekönig Don Pedro de Toledo im 16. Jahrhundert anlegen ließ, als er die Stadt verdoppelte und auf dem benachbarten Hügel die Viertel für die Soldaten errichtete: die Spanischen Viertel.\n\nVon hier ist die Altstadt nur wenige Minuten entfernt: Geht man hinauf Richtung Piazza del Gesù, steht man auf Spaccanapoli. Wenn man dagegen die Via Toledo hinuntergeht, gelangt man zur Piazza del Plebiscito, zum Königspalast und zum Meer.","con":"Vor dem Aufbruch ein Kaffee: Die Tour ist lang, und Neapel besichtigt man am besten mit dem richtigen Tässchen.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Die Piazza Carità heute, mit Bäumen und bunten Gebäuden","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Die Piazza Carità heute, an der Via Toledo: Von hier aus starten alle Touren. Hier ist Ceraldi."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"Der Platz vor dem Ceraldi","x":"Die Piazza Carità ist der Ausgangspunkt aller Rundgänge: Sie befinden sich in der Via Toledo, der großen Straße, die im 16. Jahrhundert vom Vizekönig Don Pedro de Toledo angelegt wurde, um die Altstadt mit der neuen Stadt und den Spanischen Vierteln zu verbinden.\n\nVon hier aus sind Sie in wenigen Minuten in Spaccanapoli, im Nordosten, oder am Meer und bei den Burgen, im Süden. Trinken Sie vor dem Aufbruch einen Kaffee: Der Rundgang ist lang, und Neapel erkundet man zu Fuß.","d":"Vor dem Café","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Die Via Toledo und der Largo della Carità auf einem Foto aus dem 19. Jahrhundert","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Die Via Toledo und der Largo Carità im 19. Jahrhundert: die von Don Pedro de Toledo angelegte große Straße, schon damals voller Leben."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Historisches Foto der Via Toledo im 19. Jahrhundert, mit Kutschen und Passanten","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Die Via Toledo im 19. Jahrhundert, als sie noch Via Roma hieß, auf einem Foto von Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità und Via Toledo: ein Spaziergang im Herzen von Neapel","x":"Die Geschichte des Platzes, erzählt von denen, die hier seit 2002 arbeiten.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, der untere Decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"Die gerade Straße, die die Altstadt in zwei Hälften teilt: der untere Decumanus der griechischen Stadt, etwa zwei Kilometer voller Kirchen, Werkstätten und Leben.","rac":"Spaccanapoli ist der unterste der drei Decumani, der parallelen Straßen, die das griechische Neapolis von Westen nach Osten durchquerten. Sie beginnt an der Piazza del Gesù Nuovo unter dem Namen Via Benedetto Croce, wird dann zur Via San Biagio dei Librai, kreuzt die Via Duomo und führt über die Altstadt hinaus: insgesamt etwa zwei Kilometer. Der Name sagt alles: Sie ist so lang und so gerade, dass sie die Stadt von oben gesehen in zwei Hälften zu teilen scheint.","con":"Gehen Sie sie zu Fuß von der Piazza del Gesù in Richtung Via Duomo: Es geht leicht bergab durch die Geschichte, nicht durch Anstrengung.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli von oben gesehen: eine gerade Linie über die Dächer der Altstadt","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli von Sant'Elmo aus gesehen: eine gerade Linie, die die Dächer der Altstadt durchschneidet."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Die Straße, die Neapel spaltet","x":"Spaccanapoli ist der volkstümliche Name des unteren Decumanus, einer der drei großen parallelen Straßen der griechischen Stadt: Er war die „plateia“ von Neapolis. Sie heißt so, weil sie die Altstadt, vollkommen gerade, in einen nördlichen und einen südlichen Teil teilt.\n\nSie wechselt mehrmals den Namen: Via Benedetto Croce, dann Via San Biagio dei Librai. Vom Hügel aus, von oben an der Via Pasquale Scura, sieht man sie in ihrer ganzen Länge.\n\nEntlang der Straße entstanden zwischen dem Mittelalter und dem 19. Jahrhundert Klöster und Paläste mächtiger Familien: Schauen Sie oben auf die Portale und Innenhöfe und unten auf die Geschäfte.","d":"Entlang der gesamten Straße, von der Piazza del Gesù bis zur Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"Die gerade Linie von Spaccanapoli von oben gesehen","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli, gesehen vom Castel Sant'Elmo: die gerade Linie, die die Altstadt in zwei Hälften teilt."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Platz und Kirche Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Fassade aus pyramidenförmig zugeschnittenen Steinen, die wie eine Festung wirkt und ein Geheimnis birgt: eingeritzte Zeichen, die bis heute niemand sicher entziffern konnte.","rac":"Bevor es eine Kirche war, war es ein Palast: der der Fürsten Sanseverino, erbaut im Jahr 1470; eine Gedenktafel an der Fassade erinnert an den Architekten, Novello da San Lucano. Die Jesuiten behielten die Struktur und die Bossenquader aus dunklem Piperno mit den pyramidenförmig zugeschnittenen Steinen bei und ergänzten sie durch Elemente aus weißem Marmor.\n\nAuf manchen Steinen sind eingeritzte Zeichen zu sehen. Der Legende nach sind sie eine geheime Botschaft; für einige Gelehrte sind es die Zeichen der verschiedenen Steinmetztrupps; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten einer Partitur namens „Enigma“ zu lesen. Betrachten Sie sie aus der Nähe und wählen Sie Ihre eigene Version.\n\nDie Fassade wurde restauriert und am 12. März 2023 vorgestellt, nachdem im Dezember 2017 einige Bruchstücke herabgefallen waren; seitdem ist der Platz für Autos gesperrt.","con":"Suchen Sie die Zeichen auf den Steinen in Augenhöhe, rechts und links vom Portal: Die Suche ist kostenlos.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"Die Fassade des Gesù Nuovo aus dunklen, spitz zugeschnittenen Steinen","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"Die Diamantquader-Fassade: Hier stand der Palast der Fürsten Sanseverino aus dem Jahr 1470. Treten Sie näher und suchen Sie die in die Steine geritzten Zeichen."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"Die Diamantquader-Fassade","x":"Bevor sie die Fassade einer Kirche war, war sie die eines Palastes: des Palastes der Sanseverino, Fürsten von Salerno, erbaut 1470. Als die Jesuiten hier ab 1584 ihre Kirche errichteten, weideten sie den Palast aus, retteten aber Fassade und Portal. In Neapel geschah das oft: In der Altstadt war der Platz knapp, und außerhalb der Mauern durfte man nicht bauen.\n\nSieh dir die Steine an: Es ist Piperno, ein harter, grauer Vulkanstein, zugeschnitten als Diamantquader (die „Bugnato“-Bossen). Das große Barockportal mit den Säulen, den Engeln auf dem Giebel und dem Monogramm der Jesuiten „IHS“ umschließt noch immer das Renaissanceportal des Palastes.\n\nJetzt tritt näher: Auf vielen Spitzen sind kleine eingeritzte Zeichen zu sehen. Für manche sind es die Zeichen der Steinmetztrupps; einer Legende nach verstanden es die Piperno-Meister, den Stein mit Energie „aufzuladen“; 2010 lasen einige Forscher sie als Noten einer Partitur, eine Deutung, die später bestritten wurde. Eine sichere Antwort gibt es nicht: Suche eines und wähle deine eigene.","d":"Draußen, auf dem Platz","foto":{"u":"../img/658e8ea49eab.jpg","alt":"Die Fassade des Gesù Nuovo, bedeckt mit Diamantquadern aus grauem Stein","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Die Diamantquader der Fassade des Gesù Nuovo mit dem Portal und dem großen Fenster."}},{"t":"Die Vertreibung des Heliodor","x":"Es ist das große Fresko über der Eingangstür: Gemalt hat es Francesco Solimena, der es signierte und mit 1725 datierte. Viele Besucher übersehen es, weil sie mit Blick auf den Altar eintreten: Drehen Sie sich um.\n\nDie Geschichte stammt aus der Bibel (zweites Buch der Makkabäer): Heliodor versucht, den Schatz des Tempels von Jerusalem zu plündern, und wird von einem himmlischen Reiter zurückgeschlagen. Suchen Sie den Reiter, die Pferde und die fliehenden Gestalten: Es ist eine theatralische, bewegungsreiche Szene, ganz so, wie es der Barock liebte.\n\nSeitlich des großen Fensters, oberhalb des Freskos, befinden sich zwei kleinere Szenen von Belisario Corenzio aus dem Jahr 1638: Die heilige Helena findet das Kreuz und die Bekehrung des heiligen Paulus.","d":"Drehen Sie sich gleich nach dem Eintreten zur Tür um: Es befindet sich über dem Eingang","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"Das große Fresko der Vertreibung des Heliodor von Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimenas Fresko über dem Eingang: Drehen Sie sich zur Tür um, um es zu sehen. In der Mitte der himmlische Reiter, der Heliodor zurückdrängt."}},{"t":"Die Kuppel und die vier Evangelisten","x":"Bleiben Sie in der Mitte der Kirche stehen, dort, wo das Hauptschiff das Querschiff kreuzt, und schauen Sie nach oben. In den vier gewölbten Dreiecken, die die Kuppel tragen (den „Pendentifs“), sind die vier Evangelisten zu sehen, die Giovanni Lanfranco im 17. Jahrhundert gemalt hat: Sie sind das, was von seinem großen Zyklus übrig geblieben ist, denn der Rest ging mit der Kuppel verloren.\n\nDie Kuppel hatte nämlich ein schwieriges Schicksal. Die ursprüngliche stürzte beim Erdbeben von 1688 ein; sie wurde wiederaufgebaut, blieb aber einsturzgefährdet und wurde Ende des 18. Jahrhunderts abgerissen. 1786 wurde sie durch eine niedrigere, schalenförmige Überdachung ersetzt, die Sie heute sehen; 1975 wurde sie mit einer Stahlbetonkonstruktion gefestigt.\n\nUm Sie herum sehen Sie den neapolitanischen Barock in seiner ganzen Fülle: eingelegte Marmore in vielen Farben („marmi commessi“), vergoldeter Stuck, Fresken von Belisario Corenzio und Paolo De Matteis an den Gewölben, Gemälde von Luca Giordano und Skulpturen von Cosimo Fanzago.","d":"In der Mitte der Kirche, schauen Sie nach oben","foto":{"u":"../img/3dd3789513c8.jpg","alt":"Das Hauptschiff des Gesù Nuovo in Richtung Kuppel","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"Das Hauptschiff des Gesù Nuovo: Wo es das Querschiff kreuzt, richten Sie den Blick nach oben zur Kuppel und zu den vier Pendentifs mit den Evangelisten."}},{"t":"Die Kapelle des heiligen Ignatius","x":"Es ist die große Kapelle am Ende des linken Querhausarms, dem heiligen Ignatius von Loyola gewidmet, dem Gründer der Jesuiten. Architektur und Marmorarbeiten stammen von Cosimo Fanzago und seinen Mitarbeitern, aus den Jahren zwischen etwa 1637 und 1645; zu beiden Seiten des Altars sind die beiden Statuen der Propheten David und Jeremia ein Werk Fanzagos selbst.\n\nDie Gemälde mit dem Leben des Heiligen stammen von Jusepe de Ribera, dem spanischen Maler, der in Neapel arbeitete und zu einem seiner Meister wurde. Am Fuß des Altars ist der Auftraggeber begraben, Carlo Gesualdo da Venosa.\n\nDurchqueren Sie dann die Kirche: gegenüber, im rechten Querhausarm, liegt die „Zwillingskapelle\" des heiligen Franz Xaver, des ersten Jesuitenmissionars in Asien, mit Skulpturen von Fanzago und, weiter oben, drei Gemälden von Luca Giordano aus den Jahren 1676-77. Betrachten Sie sie nacheinander: Es ist das neapolitanische Seicento in Höchstform.","d":"In einer der beiden großen Kapellen der Kirche","foto":{"u":"../img/835d153e2859.jpg","alt":"Ein Gemälde von Ribera mit dem heiligen Ignatius in der Glorie","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Der heilige Ignatius in der Glorie, Gemälde von Jusepe de Ribera in der Kapelle, die dem Gründer der Jesuiten gewidmet ist."}},{"t":"Der heilige Giuseppe Moscati","x":"Hier ruht der „heilige Arzt“ von Neapel: Giuseppe Moscati, Arzt und Universitätsprofessor, der die Ärmsten kostenlos behandelte und ihnen auch mit Geld half. Er starb 1927 und wurde 1987 von Papst Johannes Paul II. heiliggesprochen.\n\nSein Leichnam befindet sich im Bronzeschrein in der Mitte der Kapelle der Heimsuchung, der zweiten auf der rechten Seite, wohin er 1977 gebracht wurde. Der Schrein stammt von Amedeo Garufi: Betrachten Sie die drei Basreliefs, die ihn bei einer Vorlesung an der Universität zeigen, wie er ein Kind in den Armen seiner Mutter heilt und wie er die Kranken im Krankenhaus pflegt. Links steht seine Bronzestatue von 1990.\n\nVon der großen Kapelle des heiligen Franz Xaver führt eine Tür zu den Räumen des heiligen Giuseppe Moscati: Fotos, Manuskripte, seine Kleidung und seine medizinischen Instrumente sowie das Arbeitszimmer und das Schlafzimmer seines Hauses, die hier nachgebaut wurden. In denselben Räumen ist eine Bombe aus dem Zweiten Weltkrieg ausgestellt, die auf die Decke der Kirche fiel, ohne zu explodieren.","d":"In der Kapelle der Heimsuchung, unter dem Altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"Das rekonstruierte Zimmer des heiligen Giuseppe Moscati: weißer Kittel und medizinische Instrumente in einer Vitrine","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Im rekonstruierten Zimmer: der weiße Kittel, die medizinischen Instrumente und die Fotografien des heiligen Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"Der Platz des Gesù Nuovo vor der Kirche","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"Der Platz des Gesù Nuovo, vor der Kirche."},{"u":"../img/6d1ae4837518.jpg","alt":"Das Innere des Gesù Nuovo mit farbigen Marmorarbeiten und dem Hochaltar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Im Inneren der Kontrast zur strengen Fassade: farbiger Marmor, Fresken und feines Gold bis hin zum Hauptaltar."},{"u":"../img/3dd3789513c8.jpg","alt":"Das Hauptschiff des Gesù Nuovo, vom Eingang aus gesehen","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"Das Hauptschiff vom Eingang aus gesehen: ganz hinten, weit oben, die Kuppel, an deren Basis Lanfrancos Evangelisten zu sehen sind."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Kloster und Komplex Santa Chiara (Majolika-Kreuzgang)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Der mit Majolika verkleidete Kreuzgang ist einer der ruhigsten Orte der Altstadt: nur wenige Schritte vom Chaos von Spaccanapoli entfernt, die Stille.","rac":"Santa Chiara entstand 1310 auf Wunsch von König Robert von Anjou und Königin Sancia von Mallorca. Die Bauarbeiten leiteten zunächst Gagliardo Primario und dann Lionardo di Vito, und 1340 wurde die Kirche für den Gottesdienst geöffnet. Die Anlage war doppelt: ein Kloster für die Klarissen und eines für die Minderbrüder, nah beieinander, aber getrennt.\n\nVier Jahrhunderte später wurde auf Anregung von Königin Maria Amalia von Sachsen, der Frau Karls von Bourbon, der Kreuzgang der Klarissen erneuert. Der Architekt Domenico Antonio Vaccaro behielt die gotischen Bögen aus dem 14. Jahrhundert und verwandelte die Mitte in einen Barockgarten, verkleidet mit Majolikafliesen aus der Werkstatt von Donato und Giuseppe Massa. Das Ergebnis ist einer der überraschendsten Orte Neapels: ein Keramikgarten nur wenige Schritte von Spaccanapoli entfernt.\n\nDie Kirche ist gotisch, mit einer Fassade mit breitem Giebel, der die alte Fensterrose einrahmt, und im Inneren hat sie ein einziges Schiff mit zehn Kapellen auf jeder Seite. Die Bombardierung vom 4. August 1943 traf sie schwer: Sie zerstörte auch einen Teil der Fresken des Kreuzgangs, und der Wiederaufbau gab ihr die gotischen Formen zurück, die die Stuckarbeiten des 18. Jahrhunderts verdeckt hatten.\n\nUnter der Anlage gibt es eine weitere Überraschung: die Überreste einer römischen Thermenanlage, die bei den Restaurierungen der Nachkriegszeit entdeckt wurde. Sie hatte eine Palästra, ein überdachtes Schwimmbecken und Räume für Heißluftbäder: Sie sind das vollständigste Zeugnis der antiken Thermen von Neapolis.","con":"Sonntags schließt der Kreuzgang um 14 Uhr: Wenn es Sonntagnachmittag ist, tauschen Sie die Reihenfolge und kommen Sie zuerst hierher.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"Der Eingang zum Kreuzgang von Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"Der Eingang zum Majolika-Kreuzgang von Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Kreuzgang und Museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Kreuzgang und Museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Die Majolika-Pfeiler","x":"Der Garten ist durch zwei sich kreuzende Alleen in vier Teile gegliedert, und entlang der Alleen verlaufen 64 achteckige Pfeiler, alle mit Majolika verkleidet. Die Verzierungen sind Girlanden aus Blättern, Blüten und Früchten; die am häufigsten verwendeten Farben sind Gelb, Orange und Blau, gewählt in Anlehnung an die Zitrusfrüchte und den Wein der Pergola, die über dir wächst.\n\nDie Majolika stammt aus der Werkstatt von Donato und Giuseppe Massa, die dem Entwurf des neapolitanischen Architekten Domenico Antonio Vaccaro folgten: Er wollte, dass Glasuren, Architektur und Pflanzen eine Einheit bilden. Die Pfeiler enden in Kapitellen aus Piperno und sind durch Sitzbänke verbunden, ebenfalls vollständig aus Majolika.\n\nDer Kreuzgang wurde in den Jahren um 1742 auf diese Weise umgestaltet, als Äbtissin Schwester Ippolita Carmignano war: Es war Königin Maria Amalia von Sachsen, die Frau Karls von Bourbon, die die Nonnen mehrmals drängte, ihn zu „modernisieren“.","d":"Im Garten des Kreuzgangs","foto":{"u":"../img/924627d30fda.jpg","alt":"Mit gelben und grünen Majolikafliesen verkleidete Pfeiler im Kreuzgang","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Die mit Majolika verkleideten Pfeiler mit Girlanden aus Blättern, Blüten und Früchten unter der Pergola."}},{"t":"Die Szenen auf den Sitzbänken","x":"Nehmen Sie Platz: Die Sitzbänke, die die Pfeiler verbinden, sind alle aus Majolika, und auf den Rückenlehnen sind kleine Szenen aus dem 18. Jahrhundert gemalt. Es gibt Szenen vom Land, vom Meer, Volksfeste und mythologische Geschichten: eine Erzählung in Bildern über das Leben von damals.\n\nDie Szenen setzen sich auch auf der Mauer fort, die die Beete umgibt: Gehen Sie in aller Ruhe durch die Alleen und schauen Sie nach unten, nicht nur zu den Seiten.\n\nEin Tipp: Mit Kindern ist es ein wunderbares Spiel. Sucht euch jeder eine Szene aus und erzählt einander, was gerade passiert: wer angeln geht, wer tanzt, wer auf den Feldern arbeitet.","d":"Auf den Rückenlehnen der Sitzbänke zwischen den Pfeilern","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Eine Sitzbank aus Majolika mit einer aufgemalten Szene auf der Rückenlehne","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Eine Sitzbank aus Majolika im Kreuzgang: Auf der Rückenlehne ist eine Szene aufgemalt."}},{"t":"Die Klarissin mit den Katzen","x":"Unter all den Szenen auf den Rückenlehnen gibt es eine, die vom Kloster selbst erzählt: eine Klarissin, die die Katzen füttert, die im Kreuzgang lebten. Es ist ein kleiner Moment des Alltags, im 18. Jahrhundert von der Werkstatt der Massa in Majolika gemalt.\n\nDie Klarissen sind die Nonnen des Ordens von Santa Chiara: Die Anlage entstand nämlich aus zwei benachbarten, aber getrennten Klöstern, einem für die Klarissen und einem für die Minderbrüder.\n\nSie zu finden ist eine perfekte Schatzsuche, auch für Kinder: Gehen Sie die Sitzbänke eine nach der anderen ab. Wenn Sie sie nicht finden, fragen Sie das Personal des Kreuzgangs.","d":"Auf einer der Rückenlehnen der Sitzbänke: Suchen Sie sie","foto":{"u":"../img/009a5af8811f.jpg","alt":"Eine Szene aus dem Landleben, in Majolika gemalt, auf einer Rückenlehne im Kreuzgang","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Chiostro_di_Santa_Chiara_WLM24_(34).jpg","dida":"Eine der Majolika-Szenen auf den Rückenlehnen im Kreuzgang der Klarissen."}},{"t":"Die Bögen aus dem 14. Jahrhundert","x":"Der Garten ist barock, der Rahmen jedoch mittelalterlich. Die Anlage wurde 1310 von König Robert von Anjou und Königin Sancia von Mallorca in Auftrag gegeben; die Arbeiten leiteten zunächst Gagliardo Primario und dann Lionardo di Vito, und die Kirche wurde 1340 für den Gottesdienst geöffnet.\n\nAls Vaccaro im 18. Jahrhundert den Garten neu gestaltete, bewahrte er den Grundriss aus dem 14. Jahrhundert: die Spitzbögen auf Pfeilern aus Piperno. Achten Sie auf den Kontrast zwischen dem strengen Stein der Bögen und den fröhlichen Farben der Majoliken: vier Jahrhunderte auf einen Blick.\n\nAn den Wänden aller vier Seiten verlaufen Fresken aus der ersten Hälfte des 17. Jahrhunderts, von einem unbekannten Künstler, vielleicht aus der Schule von Belisario Corenzio, mit Szenen aus dem Alten Testament. Gleich nach dem Eingang ist das erste Wandstück rechts leer: Diese Fresken wurden durch die Bombardierung vom 4. August 1943 zerstört.","d":"Entlang der vier Seiten des Kreuzgangs","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Die Bögen des Kreuzgangs von Santa Chiara im Gegenlicht, im Hintergrund die Kirche","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Die gotischen Bögen des Kreuzgangs von Santa Chiara im Gegenlicht: im Hintergrund die Fassade der Kirche."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolika-Fliesen mit einer Wildschweinjagd-Szene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Aus der Nähe: eine Wildschweinjagd, zwischen 1739 und 1742 von der Werkstatt der Massa auf die Majolika-Fliesen gemalt."},{"u":"../img/f13f406e9a70.jpg","alt":"Der Kreuzgang mit den Majolika-Pfeilern, den Sitzbänken und dem Garten","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Der gesamte Kreuzgang: die Majolika-Pfeiler, die Sitzbänke und der Garten."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero-Kapelle","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Der Verhüllte Christus, eine der berühmtesten Skulpturen der Welt, und die anatomischen Maschinen des alchemistischen Fürsten Raimondo di Sangro.","rac":"Die Kapelle der Familie di Sangro ist das Reich von Raimondo, Fürst von Sansevero: ein Mann der Wissenschaft und der Geheimnisse, Großmeister der Freimaurerei, um den sich der Mythos schon zu Lebzeiten bildete – und er selbst nährte ihn.\n\nIm Zentrum steht der Verhüllte Christus von Giuseppe Sanmartino, vom Fürsten in Auftrag gegeben: ein ausgestreckter Körper, bedeckt von einem so dünnen Leichentuch, dass es wie nasser Stoff wirkt, und doch aus demselben Marmorblock wie die Statue gemeißelt. Im unterirdischen Raum befinden sich die beiden „anatomischen Maschinen“, Skelette eines Mannes und einer Frau mit nachgebildetem Blutgefäßsystem, ein Werk des Palermitaner Arztes Giuseppe Salerno aus der Zeit um 1756–1764. Die schwarze Legende erzählt von geopferten Dienern und geheimnisvollen Injektionen; das Museum selbst trennt sorgfältig den Mythos von der belegten Geschichte.","con":"Dienstags ist sie geschlossen: Wenn heute Dienstag ist, liegt die Statue des Nils zwei Minuten entfernt und ist immer zu sehen.","acc":"Das Kirchenschiff und die Sakristei können auch im Rollstuhl besichtigt werden. Der unterirdische Raum mit den anatomischen Maschinen ist nur über eine enge Wendeltreppe aus dem 19. Jahrhundert erreichbar.","foto":{"u":"../img/65421f883be6.jpg","alt":"Das Äußere der Sansevero-Kapelle","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"Die Sansevero-Kapelle von außen gesehen."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Der verschleierte Christus","x":"In der Mitte der Kapelle liegt ein Körper auf einer Matratze, Kopf und Oberkörper von einem Kissen angehoben, bedeckt von einem so dünnen Leichentuch, dass sich darunter Gesicht, Wunden und Venen abzeichnen. Der Schleier ist keine Zutat: Giuseppe Sanmartino hat ihn 1753 im Auftrag von Fürst Raimondo di Sangro aus demselben Marmorblock gemeißelt wie die Statue.\n\nDas besagt ein vom Fürsten unterzeichnetes Dokument zur Bezahlung des Bildhauers: «eine lebensgroß gemeißelte Marmorstatue, die unseren toten Herrn Jesus Christus darstellt, bedeckt von einem durchsichtigen Leichentuch, das aus demselben Block wie die Statue gearbeitet ist». Jahrhundertelang hieß es, der Schleier sei ein echter Stoff, der durch ein alchemistisches Verfahren des Fürsten in Marmor verwandelt wurde: Das ist nur eine Legende.\n\nSuchen Sie die Details: die Seitenwunde, das Nagelmal an der Hand und, zu Füßen, die Dornenkrone und die Nägel der Passion. Gehen Sie dann langsam um die Figur herum: Von jeder Seite scheint sich der Schleier zu verändern.","d":"In der Mitte des Kirchenschiffs","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Das Gesicht des verschleierten Christus unter dem Marmorschleier","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Das Gesicht unter dem Schleier: Das Leichentuch ist aus demselben Marmorblock gemeißelt wie die Statue und wirkt dennoch wie nasser Stoff."}},{"t":"Die Schamhaftigkeit","x":"Eine junge Frau, eingehüllt in einen Schleier, der sich an ihre Haut schmiegt, als wäre er nass, mit einem Rosenkranz im Haar. Geschaffen wurde sie 1752 vom Venezianer Antonio Corradini, einem in ganz Europa berühmten Bildhauer, der auch für den Kaiser in Wien gearbeitet hatte: Er starb im selben Jahr, während er die übrigen Dekorationen der Kapelle entwarf, wie eine Gedenktafel am Pfeiler in Erinnerung ruft.\n\nPrinz Raimondo widmete sie seiner Mutter, Cecilia Gaetani dell'Aquila d'Aragona, die am 26. Dezember 1710 starb, als er noch nicht einmal ein Jahr alt war. Suchen Sie die Symbole eines zu früh unterbrochenen Lebens: den verlorenen Blick, den Baum, der aus dem Stein wächst, und die zerbrochene Grabplatte zu ihren Füßen.\n\nAuf dem Sockel befindet sich ein Basrelief mit dem „Noli me tangere“, dem auferstandenen Christus, der Maria Magdalena erscheint. Das Museum weist darauf hin, dass die verschleierte Frau auch als Bild der Weisheit gelesen werden kann, und erinnert an die verschleierte Göttin Isis.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"Die Statue der Schamhaftigkeit, eine von einem Schleier bedeckte Frau","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Die Schamhaftigkeit von Antonio Corradini: Der Schleier schmiegt sich an den Körper, als wäre er nass. Zu ihren Füßen die zerbrochene Grabplatte."}},{"t":"Die Enttäuschung","x":"Ein Mann befreit sich aus einem großen Netz, unterstützt von einem kleinen geflügelten Genius mit einem Flämmchen auf der Stirn, dem Symbol des menschlichen Verstandes. Zu seinen Füßen liegt die Weltkugel, die Leidenschaften der Welt, darauf eine aufgeschlagene Bibel. Geschaffen wurde sie zwischen 1753 und 1754 vom Genueser Francesco Queirolo.\n\nDer Fürst widmete sie seinem Vater Antonio: Dieser war Witwer geworden, hatte seinen Sohn beim Großvater zurückgelassen und war durch Europa gereist, wo er ein ausschweifendes Leben führte; im Alter kehrte er reumütig nach Neapel zurück und wurde Priester. Das Netz ist die Sünde, von der sich der Mensch befreit.\n\nBetrachte das Netz aus der Nähe: Es besteht ganz aus Marmor und ist Masche für Masche durchbrochen. Man erzählt, dass die mit der Feinbearbeitung beauftragten Handwerker sich weigerten, es zu berühren, aus Angst, es zu zerbrechen, und dass Queirolo es allein glätten musste. Schon 1753 nannte es ein Zeitgenosse „den letzten kühnen Beweis, den die Bildhauerkunst in Marmor wagen kann“.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/921cf7f91318.jpg","alt":"Die Statue der Enttäuschung, ein Mann, der sich aus einem Netz befreit","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Die Enttäuschung von Francesco Queirolo: Das Netz besteht ganz aus Marmor und ist von Hand durchbrochen."}},{"t":"Der Labyrinthboden","x":"Der Boden, auf dem Sie gehen, ist nicht der ursprüngliche. Der Fürst hatte einen labyrinthartigen Boden entworfen: farbige Marmorsorten, von Blau bis Weiß, durchzogen von einer fugenlosen, ununterbrochenen Linie aus weißem Marmor, die Kreuze mit hakenförmigen Armen im Wechsel mit konzentrischen Quadraten in perspektivischer Darstellung zeichnete. Ausgeführt wurde er von Francesco Celebrano ab der Mitte der 1760er-Jahre; der Fürst selbst schrieb, die Arbeit sei „schwierig und behindert“ gewesen.\n\n1889 erfasste ein schwerer Einsturz den Palast und die Kapelle und beschädigte den Boden: Statt ihn zu restaurieren, erneuerte man ihn in neapolitanischem Terrakotta, mit gelber und blauer Glasur im Bereich des Wappens der di Sangro.\n\nSuchen Sie die originalen Platten im Durchgang vor dem Grab von Raimondo di Sangro; weitere befinden sich in der unterirdischen Cavea und in der Sakristei. Für den Fürsten war das Labyrinth das Sinnbild des schwierigen Weges, der zur Erkenntnis führt.","d":"Im Durchgang vor dem Grab des Fürsten","foto":{"u":"../img/e29e7dc7e976.jpg","alt":"Das Kirchenschiff der Cappella Sansevero mit den Statuen und, unten, den Linien des Bodens","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2,_Cappella_Sansevero.jpg","dida":"Die Cappella Sansevero: unten sieht man die farbigen Linien des Labyrinthbodens."}},{"t":"Die anatomischen Maschinen","x":"Steigen Sie die enge Treppe hinab zur unterirdischen Cavea: In zwei Vitrinen stehen die Skelette eines Mannes und einer Frau, mit dem System der Arterien und Venen fast vollständig erhalten, bis hin zu den feinsten Gefäßen.\n\nAngefertigt hat sie der aus Palermo stammende Arzt Giuseppe Salerno. Der Fürst kaufte das männliche 1756, nachdem er es bei einer öffentlichen Vorführung in Neapel gesehen hatte, nahm Salerno in seine Dienste und ließ ihn das zweite anfertigen. Sie standen im Palast, in einem Raum namens „Appartamento della Fenice“ (Gemach des Phönix); die Frau stand auf einem Podest, das man drehen konnte, um sie von allen Seiten zu betrachten.\n\nUm sie entstand die „schwarze Legende“: Man sagte, der Fürst habe zwei Diener töten und ihren Körpern eine geheimnisvolle Substanz einspritzen lassen. In Wirklichkeit sind die Gefäße eine Nachbildung aus verschiedenen Materialien, darunter Bienenwachs und Farbstoffe; erstaunlich bleibt das anatomische Wissen, das sie für die damalige Zeit beweisen.","d":"In der unterirdischen Cavea, über eine enge Wendeltreppe hinab","foto":{"u":"../img/a3a047434411.jpg","alt":"Ein Skelett mit dem System der Blutgefäße in der Vitrine der Cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"Eine der beiden anatomischen Maschinen von Giuseppe Salerno in der unterirdischen Cavea: Skelett und Blutkreislaufsystem."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"Das Innere der Cappella Sansevero mit den Statuen","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"Die gesamte Kapelle: in der Mitte der Verhüllte Christus, ringsum die Statuen der Familie di Sangro."}],"leg":"Über Raimondo di Sangro erzählte man sich schon zu Lebzeiten alles Mögliche: geheimnisvolle Experimente, alchemistische Geheimnisse, sogar Diener, die in die anatomischen Maschinen verwandelt worden seien. Das Museum trennt sorgfältig die schwarze Legende von den belegten Tatsachen: Es lohnt sich, beide Versionen zu hören und zu entscheiden, auf welcher Seite man steht.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"Die Kirche, in der der heilige Thomas von Aquin lebte und lehrte und in der, der Überlieferung nach, ein Kruzifix zu ihm sprach.","rac":"Der Dominikanerkomplex liegt an dem gleichnamigen Platz, entlang der Spaccanapoli. Die gotisch-anjouvinische Kirche wurde zwischen 1283 und 1324 erbaut und später in der Barockzeit umgestaltet. Im Kloster lebte und lehrte Thomas von Aquin zwischen 1272 und 1274; auch Giordano Bruno und Tommaso Campanella waren mit diesem Ort verbunden.\n\nIn der Sakristei, deren Gewölbe 1709 von Francesco Solimena freskiert wurde, befinden sich die Särge der aragonesischen Herrscher. Jahrhundertelang bewahrte die Basilika außerdem ein Meisterwerk von Caravaggio, die Geißelung Christi, die heute im Museum Capodimonte zu sehen ist.\n\nHeute kann der Komplex auch als DOMA-Museum besichtigt werden: Sakristei, aragonesische Särge und die Zelle des heiligen Thomas.","con":"Wenn du Zeit hast, geh auch in den Museumsrundgang: Sakristei, aragonesische Grabstätten und Zelle des heiligen Thomas. Die Öffnungszeiten ändern sich und einige Bereiche können wegen Bauarbeiten geschlossen sein: Prüfe vor deinem Besuch die offizielle Website.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"Die Spitzsäule von San Domenico und die Apsis der Kirche am Platz","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"Die Spitzsäule von San Domenico und dahinter die Apsis der Kirche."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Führungen."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"Das Kruzifix, das zum heiligen Thomas sprach","x":"Es ist eine bemalte Tafel, die in der Basilika aufbewahrt wird. Der Überlieferung nach wandte sich Christus an Thomas von Aquin, der nach dem Verfassen seiner theologischen Schriften betete: Er soll ihm gesagt haben, er habe gut über ihn geschrieben, und ihn gefragt haben, welchen Lohn er sich wünsche. Das Kulturministerium führt die Tafel als jene an, die zum Heiligen „sprach“ und 1437 in eine neue Kapelle versetzt wurde.","d":"In der Basilika, in der Kreuzigungskapelle","foto":{"u":"../img/4b0972ad805f.jpg","alt":"Die große Kreuzkapelle in San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"Die große Kreuzkapelle in San Domenico Maggiore, in der die Tafel des Wunders aufbewahrt wird."}},{"t":"Solimenas Sakristei und die aragonesischen Sarkophage","x":"Das Gewölbe der Sakristei wurde 1709 von Francesco Solimena mit dem Triumph des Dominikanerordens freskiert. Entlang der Wände sieht man die Grabladen der aragonesischen Herrscher und anderer Hofwürdenträger.","d":"In der Sakristei, beim Besuch des Museums DOMA","foto":{"u":"../img/07519e21f0fa.jpg","alt":"Die Sakristei von San Domenico Maggiore mit dem freskierten Gewölbe","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"Die Sakristei von San Domenico Maggiore mit dem Gewölbe von Francesco Solimena und den aragonesischen Sarkophagen."}},{"t":"Die Zelle des heiligen Thomas","x":"Hier lebte und studierte Thomas von Aquin. Die Zelle wurde restauriert und ist zusammen mit dem Museum DOMA zu besichtigen.","d":"Auf dem Rundgang durch das Museum","foto":{"u":"../img/f68192e11f82.jpg","alt":"Die Zelle des heiligen Thomas von Aquin mit Reliquiar und Einrichtung","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"Die Zelle des heiligen Thomas von Aquin im Kloster von San Domenico Maggiore."}}],"gal":[],"leg":"Man erzählt, dass das auf Holz gemalte Kruzifix, das in der Basilika aufbewahrt wird, zum heiligen Thomas von Aquin gesprochen habe, als dieser betete: Es habe ihm gesagt, dass er gut über ihn geschrieben habe, und ihn gefragt, welche Belohnung er sich wünsche.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli und die Statue des Nil","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Eine römische Statue des Gottes Nil, jahrhundertelang für eine stillende Frau gehalten: das «Corpo di Napoli».","rac":"Auf der Piazzetta Nilo, entlang der Via San Biagio dei Librai, also der Spaccanapoli, steht eine Marmorstatue aus dem 2.–3. Jahrhundert n. Chr., die den Flussgott Nil darstellt: ein bärtiger, halb liegender Mann mit einem Füllhorn, umgeben von Putten, die die Flussarme symbolisieren. Errichtet wurde sie von den alexandrinischen Kaufleuten, die in dieser Gegend lebten, der sogenannten Regio Nilensis.\n\nSie wurde 1476 ohne Kopf aufgefunden. Deshalb hielten die Neapolitaner sie für eine weibliche Figur, die Kinder stillt, ein Symbol der Stadt, die ihre Bewohner nährt: daher der Name «Corpo di Napoli», der noch heute dem kleinen Platz seinen Namen gibt. 1657 wurde sie auf einen neuen Sockel gestellt, und im selben Jahrhundert wurde ihr ein bärtiger Kopf gemeißelt.\n\nHeute steht die Statue noch immer an ihrem Platz, als Erinnerung an die multikulturellen Wurzeln Neapels.","con":"Schauen Sie in Ruhe vorbei: Es ist ein Halt von fünf Minuten auf dem Weg entlang der Spaccanapoli. Suchen Sie die Putten auf dem Körper des Gottes: Sie lassen verstehen, warum die Statue für eine Frau gehalten wurde.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"Die antike Statue des Gottes Nil, liegend","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"Die Statue des Gottes Nil, liegend, auf dem kleinen Platz, der seinen Namen trägt."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"Der Gott Nil und die Putten","x":"Der Flussgott liegt auf der Seite und hält ein Füllhorn. Die Putten um ihn herum symbolisieren die Nilarme. Wer sie lange ohne Kopf betrachtet hat, sah darin eine stillende Frau.","d":"In der Mitte des kleinen Platzes","foto":{"u":"../img/83dce4234fd4.jpg","alt":"Die Statue des liegenden Gottes Nil mit den Putten","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"Der liegende Gott Nil mit dem Füllhorn und den Putten."}},{"t":"Warum „Corpo di Napoli“","x":"Die Statue wurde 1476 ohne Kopf aufgefunden. Deshalb hielt man sie für eine weibliche Figur, die ihre Kinder nährt: die Stadt selbst. Der Name ist dem Platz geblieben, auch nachdem die Statue einen neuen Kopf erhalten hatte.","d":"Auf dem Sockel und im Namen des Platzes","foto":{"u":"../img/c0e842c87218.jpg","alt":"Die Statue des Nil auf ihrem Sockel auf dem Platz","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"Die Statue auf dem Sockel am Largo Corpo di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Die Via San Biagio dei Librai und ihre Werkstätten","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Der Abschnitt von Spaccanapoli der Buchhändler und Handwerker: Werkstätten, Kirchen und das Ospedale delle Bambole.","rac":"Es ist der Abschnitt von Spaccanapoli, der von der Piazzetta Nilo bis zur Via Duomo reicht, am unteren Decumanus. Der Name stammt von den Buchläden, die hier seit jeher zu finden waren: Eine Inschrift am nahen Palazzo Marigliano erinnert genau an die Kunst der Meister-Buchhändler. Die Verehrung des heiligen Blasius reicht bis ins 8. Jahrhundert zurück, als Nonnen aus Armenien eine Reliquie des Heiligen nach Neapel brachten. Entlang der Straße befindet sich auch das Ospedale delle Bambole, eine Handwerkswerkstatt, die von Generation zu Generation weitergegeben wurde.","con":"Der Dezember ist der Monat der Krippenwerkstätten: Am Wochenende muss man mit Andrang rechnen.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Die Via San Biagio dei Librai in ihrer ganzen Länge: eine schmale Kopfsteinpflasterstraße zwischen hohen Häusern, mit Balkonen, aufgehängter Wäsche, Geschäften und Passanten, und im Hintergrund der Hügel des Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Die Via San Biagio dei Librai, der Abschnitt von Spaccanapoli, der am lebendigsten von Werkstätten und Stimmen erfüllt ist."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"Die Straße der Buchhändler","x":"San Biagio dei Librai verbindet die Piazzetta Nilo mit der Via Duomo und gehört zum unteren Decumanus. Der Name erinnert an die vielen Buchläden, die es hier seit jeher gibt, und an die Kirche San Biagio Maggiore, die dem Schutzheiligen derer geweiht ist, die Halsschmerzen haben: Die Verehrung kam im 8. Jahrhundert mit Nonnen aus Armenien hierher, die eine Reliquie des Heiligen mitbrachten.\n\nIn dieser Straße wurde der Philosoph und Historiker Giambattista Vico geboren.\n\nGehen Sie langsam: Es ist eine der lebendigsten Straßen Neapels, immer voller Menschen.","d":"Entlang der Straße","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: die enge Gasse, die Geschäfte und ein hoch oben aufgehängtes Banner","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: die schmale, gerade Straße des unteren Decumanus mit ihren Geschäften und den Spaziergängern."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai und der Schädel mit den Ohren","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Eine winzige Kirche der Steinmetze, der Heiligen der Augen geweiht, und ein weltweit einzigartiger Schädel: der mit den Ohren.","rac":"Kurz vor 1327 von Bartolomeo di Capua, einem Juristen der angiovinischen Könige, gegründet, wurde die Kirche später den Pipernieri, den Steinmetzen, anvertraut: Sie wählten die heilige Lucia, die Schutzpatronin des Augenlichts, weil die Splitter ihres Handwerks ihre Augen gefährdeten.\n\nMehr als dreißig Jahre lang verlassen, wurde sie am 5. April 2019 dank des Vereins Respiriamo Arte wiedereröffnet. In ihrem Hypogäum hat der Kult der Anime Pezzentelle einen Schädel hinterlassen, der seinesgleichen sucht: Er hat Ohren.","con":"Sie ist klein und in wenigen Minuten besichtigt: perfekt als Pause zwischen Sansevero und der Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Das Portal von Santa Luciella in der Gasse","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Das Portal von Santa Luciella. Blick nach oben: Darüber befindet sich das Fresko mit dem Wappen der Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Das Wappen der Pipernieri","x":"Bevor du eintrittst, hebe den Blick: Über dem Portal aus Piperno ist noch immer das Fresko mit dem Wappen der Zunft der Pipernieri zu sehen, der Steinmetze, denen die Kirche gehörte.\n\nSie bearbeiteten den Piperno, einen extrem harten Stein, mit Meißel und Hammer und fürchteten, dass ihnen Splitter ins Auge fliegen könnten: Deshalb wählten sie die heilige Lucia, die Schutzpatronin des Augenlichts. Es war eine mächtige Zunft; man sagte sogar, sie verstünden es, den Steinen gute oder schlechte Energien einzuhauchen.\n\nDie Kirche ist uralt: Sie wurde kurz vor 1327 von Bartolomeo di Capua gegründet, einem Berater der anjou-neapolitanischen Könige. Auf Barattas Ansicht von Neapel aus dem Jahr 1629 ist sie als Kapelle der Müller verzeichnet; im 18. Jahrhundert wurde sie umgebaut. Über dreißig Jahre blieb sie geschlossen und verlassen, bis der Verein Respiriamo Arte sie am 5. April 2019 wieder eröffnete.","d":"Über dem Eingangsportal","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"Das Fresko über dem Portal von Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"Das Fresko über dem Portal von Santa Luciella mit dem Wappen der Zunft der Piperno-Steinmetze."}},{"t":"Der Schädel mit Ohren","x":"Unter der Kirche, im Hypogäum, liegt ein Schädel, der die mumifizierten Ohrknorpel bewahrt hat: Deshalb gilt er als einzigartig. Der Volksglaube sagt, dass er gerade deshalb, weil er Ohren hat, die Gebete derer besser erhört, die ihn um eine Gnade bitten.\n\nDas Hypogäum kann nur bei einer Führung besichtigt werden. Dank des Projekts «Percorsi di luce», das vom FAI und von Intesa Sanpaolo unterstützt wird, gehen die Lichter Detail für Detail an und lassen beleuchtete Bereiche und Schattenzonen einander abwechseln: Lass dich leiten.\n\nDenk daran, dass dies ein Ort ist, der mit den Verstorbenen und mit der Frömmigkeit verbunden ist: Man betrachtet ihn mit Respekt und mit gedämpfter Stimme.","d":"Im Hypogäum, bei der Führung","foto":{"u":"../img/7a5a070c0866.jpg","alt":"Der Schädel mit Ohren im Hypogäum von Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"Der Schädel mit Ohren: An den Seiten des Schädels sind die mumifizierten Knorpel zu sehen."}},{"t":"Die anime pezzentelle","x":"Im 17. Jahrhundert tötete die Pest in Neapel Tausende von Menschen: Die Toten wurden in Massengräbern beigesetzt, und ihre Namen gingen verloren. So entstand der Kult der „anime pezzentelle“, der armen Seelen, die namenlos, ohne Begräbnis und ohne Gebete gestorben waren.\n\nWer um eine Gnade bat (eine Heilung, eine Schwangerschaft, eine Hilfe), „adoptierte“ einen dieser Schädel, die „capuzzelle“: Er reinigte ihn, stellte ihn in eine Nische und betete für ihn, damit die Seele ins Paradies gelange und sich dort oben an den erinnere, der ihr geholfen hatte.\n\nIn Santa Luciella war der Kult tief verwurzelt. Du wirst ihm im Purgatorio ad Arco in der Via dei Tribunali wiederbegegnen, und sein Symbolort ist der Friedhof Fontanelle im Viertel Sanità.","d":"Im Hypogäum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Von Kerzenlicht beleuchtete Schädel, mit einer Tafel „für empfangene Gnade“","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Schädel in Vitrinen: Auf einer Tafel steht der Name dessen, der die Gnade erhalten hat – eine Art, den „pezzentelle“-Seelen zu danken."}}],"gal":[],"leg":"Man sagt, der Schädel mit den Ohren höre Gebete gerade deshalb besser, weil er Ohren hat: Deshalb vertraute man ihm über Generationen hinweg die schwierigsten Bitten an.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Puppenkrankenhaus","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Werkstatt, die seit Generationen Puppen und Spielzeug „heilt“: ein Schaufenster, an das sich Kinder – und nicht nur sie – ein Leben lang erinnern.","rac":"Ende des 19. Jahrhunderts arbeitete Luigi Grassi als Bühnenbildner für Theater und Krippen. Die Nachbarn begannen, ihm kaputte Puppen und Spielzeuge zu bringen, und seine Werkstatt wurde fast zufällig zum ersten „Krankenhaus“ für Spielzeug in Neapel.\n\nHeute führt es Tiziana, eine Urenkelin des Gründers, im Hof des Palazzo Marigliano in der Via San Biagio dei Librai weiter. Drinnen geht es zu wie in einem echten Krankenhaus: weiße Kittel, Stationen und eine Krankenakte für jeden Patienten. Für viele Neapolitaner ist es der Ort, an den sie als Kinder ihr liebstes Spielzeug gebracht haben.","con":"Schon allein das Schaufenster ist einen Halt wert: Es liegt auf dem Rückweg.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"Das Schaufenster des Ospedale delle Bambole voller Puppen","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"Das Schaufenster des Ospedale delle Bambole: Puppen und Spielzeug, die darauf warten, „geheilt“ zu werden."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Öffnungszeiten für Oktober und November: In anderen Zeiträumen können sie abweichen."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Öffnungszeiten für Oktober und November: In anderen Zeiträumen können sie abweichen."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Ein echtes Krankenhaus für Spielzeug","x":"Es ist kein Laden, sondern eine Werkstatt, die wie ein Krankenhaus organisiert ist: Die Patienten sind Puppen, Teddybären und Kuscheltiere, jedes mit seiner eigenen Geschichte.\n\nDie „Ärzte“ arbeiten in weißen Kitteln und sind wie in einem echten Krankenhaus in Abteilungen unterteilt: Orthopädie, Augenheilkunde, Schneiderei. Jeder Patient hat seine eigene Krankenakte und seine eigene Diagnose.\n\nEs ist ein Ort, der Kindern sehr gefällt, aber auch Erwachsenen, die hier die Spielsachen ihrer Kindheit wiederfinden.","d":"In der Werkstatt","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Puppenköpfe, die auf ihre Reparatur warten","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Puppenköpfe, -arme und -augen, die auf Pflege warten: In der Werkstatt hat jedes Teil seine eigene „Abteilung“."}},{"t":"Der Gründer, ein Bühnenbildner","x":"Alles begann Ende des 19. Jahrhunderts mit Luigi Grassi, der Bühnenbilder für Theater und Krippen baute. Die Nachbarn begannen, ihm ihr kaputtes Spielzeug zu bringen, und er verwandelte seine Werkstatt in das erste „Krankenhaus“ für Puppen.\n\nSeitdem wird die Werkstatt in der Familie von Generation zu Generation weitergegeben: Heute kümmert sich Tiziana, seine Urenkelin, um die Patienten.\n\nDenken Sie an die Verbindung zur Stadt: Neapel ist die Stadt der Krippen, und die via San Gregorio Armeno, die Straße der Krippenfiguren-Werkstätten, ist nur wenige Schritte von hier entfernt.","d":"In der Geschichte der Werkstatt","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"Die Tür der Werkstatt des Ospedale delle Bambole mit den Schaufenstern","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"Der Eingang des Ospedale delle Bambole in der via San Biagio dei Librai: die Werkstatt, die von der Familie Grassi eröffnet wurde."}},{"t":"Der Innenhof des Palazzo Marigliano","x":"Das Puppenkrankenhaus (Ospedale delle Bambole) befindet sich im Innenhof des Palazzo Marigliano, in der Via San Biagio dei Librai Nr. 39: einer der Paläste der neapolitanischen Renaissance, die mit den Namen der Architekten Giovanni Francesco Mormando und Giovanni Francesco di Palma verbunden sind.\n\nWer durch das Tor eintritt, lässt den Lärm der Straße hinter sich: Es ist einer der vielen versteckten Innenhöfe der Altstadt, die es zu entdecken lohnt. Am Palast erinnert außerdem eine Inschrift daran, dass in der Antike ganz in der Nähe eine Augustus-Basilika stand.\n\nDie ganze Straße verdient es, in Ruhe betrachtet zu werden: Sie ist der „untere Decumanus“ der griechischen Stadt, die Straße der Buchhändler, und hier wurde der Philosoph Giambattista Vico geboren.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"Der gelbe Innenhof des Palazzo Marigliano mit dem Eingangsbogen","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Der Innenhof des Palazzo Marigliano mit dem Eingangsbogen und den ockerfarbenen Fassaden."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, die Straße der Krippen","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Eine enge Gasse, in der Weihnachten das ganze Jahr dauert: Handwerksbetriebe, Terrakottafiguren und Krippen.","rac":"Die Via San Gregorio Armeno verbindet die Via dei Tribunali mit der Via San Biagio dei Librai, also mit Spaccanapoli. Sie ist die Straße der Krippen: Die Handwerksbetriebe stellen das ganze Jahr über Figuren und Krippen aus, auch im Sommer. Einigen Quellen zufolge reicht die Tradition, in diesem Viertel Terrakottafiguren herzustellen, bis in die römische Zeit zurück; der Ruf der neapolitanischen Krippe wurde ab dem 18. Jahrhundert international.\n\nZu den historischen Werkstätten gehören Gambardella, seit 1800 tätig, und die Fratelli Capuano, gegründet 1840. Entlang der Straße befindet sich auch das Kloster San Gregorio Armeno, nach dem die Straße benannt ist, mit der Kirche der heiligen Patrizia, Mitpatronin von Neapel.\n\nDie lebhafteste Zeit reicht von Ende November bis zum Dreikönigstag, wenn die Straße überfüllt ist.","con":"Kommen Sie früh am Morgen und an Werktagen: Im Dezember herrscht großes Gedränge. Suchen Sie die Krippenfiguren, die das aktuelle Geschehen erzählen: Jedes Jahr schaffen die Handwerker neue.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"Die Straße der Krippen, eng und voller Werkstätten","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, die Straße der Krippen."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Die Krippenwerkstätten","x":"Die Werkstätten stellen Krippenfiguren und Krippen aus Terrakotta und Kork her, oft von Hand bemalt. Neben den traditionellen Figuren gibt es Persönlichkeiten aus dem aktuellen Zeitgeschehen: Jedes Jahr erfinden die Handwerker neue. Sie können auch nur schauen, ohne zu kaufen: Viele Handwerker arbeiten vor aller Augen.","d":"Entlang der ganzen Straße","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"Ein Stand voller Krippenfiguren","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Ein Stand in der Straße der Krippenfiguren, zwischen traditionellen Figuren und Persönlichkeiten von heute."}},{"t":"Das Kloster San Gregorio Armeno","x":"Das Kloster gibt der Straße ihren Namen. Die Kirche bewahrt eine Kassettendecke von Teodoro d'Errico und Fresken von Luca Giordano, wie die Glorie des heiligen Gregor. Zum Komplex gehört auch die der heiligen Patrizia geweihte Kirche, Mitpatronin von Neapel.","d":"Im Inneren des Klosters, entlang der Straße","foto":{"u":"../img/30ec6bba5546.jpg","alt":"Das Hauptschiff der Kirche San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"Die Kirche San Gregorio Armeno mit der Kassettendecke und den Fresken."}},{"t":"Wann man hingehen sollte","x":"Die Werkstätten sind das ganze Jahr über geöffnet. Am lebhaftesten ist es von Ende November bis zum Dreikönigstag, wenn die Straße voller Menschen ist: am besten werktags und früh am Morgen.","d":"Entlang der ganzen Straße","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Die überfüllte Via San Gregorio Armeno","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno: am besten werktags und früh
