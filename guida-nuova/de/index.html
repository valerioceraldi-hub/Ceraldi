 von der Legende bis zur Stadt von heute. Jedes Mal, wenn die Erzählung auf einen Ort des Führers trifft, finden Sie eine Schaltfläche, um dorthin zu gelangen.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"Castel dell'Ovo auf einer Ansicht von 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo auf einer Ansicht von 1841: das Inselchen, auf dem Partenope geboren wurde."},"cap":[{"p":"Die Legende","t":"Die Sirene Partenope","x":"Alles beginnt mit einer Sirene. In der griechischen Mythologie waren Sirenen Wesen mit dem Körper eines Vogels und dem Kopf einer Frau, Herrinnen eines magischen Gesangs. Eine von ihnen hieß Partenope.\n\nDie berühmteste Erzählung berichtet, dass die Sirenen sich vor Schmerz ins Meer stürzten, als Odysseus an ihrem Felsen vorbeifuhr, ohne ihrem Gesang zu erliegen. Die Wellen trugen Partenopes Leib an die Küste, an die Mündung eines kleinen Flusses, des Sebeto: genau dorthin, wo die Stadt entstehen sollte.\n\nDort wurde ihr ein Grab errichtet, und die Griechen von Neapel widmeten ihr jedes Jahr Opfer und einen Fackellauf. Noch heute nennen sich die Neapolitaner «partenopei».","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"Der Brunnen mit der Sirene Partenope an der Piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"Der Sirenenbrunnen an der Piazza Sannazaro: Partenope mit der Lyra."}},{"p":"8.–7. Jahrhundert v. Chr.","t":"Partenope, die erste Stadt","x":"Die Legende hat einen wahren Kern. Zwischen dem 8. und 7. Jahrhundert v. Chr. gründeten die Griechen von Kyme, der ältesten griechischen Kolonie der Gegend, einen kleinen Hafenplatz am Meer und nannten ihn nach der Sirene: Partenope.\n\nEr lag auf dem Hügel von Pizzofalcone, dem Monte Echia, auf einem vom Meer umgebenen Felsvorsprung, und hatte seinen Anlegeplatz auf dem Inselchen Megaride, wo heute das Castel dell'Ovo steht. Der Hafen befand sich an der heutigen Piazza Municipio. Die Nekropole von Partenope wurde 1949 in der Via Nicotera entdeckt.\n\nDie kleine Stadt wuchs so schnell, dass Kyme aus Angst, die Vorherrschaft zu verlieren, ihre Rolle beschnitt.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Das Castel dell'Ovo am Meer unter blauem Himmel","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Das Castel dell'Ovo auf dem Inselchen Megaride, durch eine Brücke mit der Uferpromenade verbunden."}},{"p":"5. Jahrhundert v. Chr.","t":"Neapolis, die neue Stadt","x":"Neben Partenope, etwas weiter östlich, gründeten die Kymäer eine neue Stadt: Neapolis, die „neue Stadt“. Die UNESCO datiert die Gründung auf etwa 470 v. Chr., in der Zeit, als die Griechen die Etrusker auf See besiegt hatten.\n\nNeapolis wurde nach einem regelmäßigen Plan angelegt: drei parallele Hauptstraßen (die „plateiai“, später Decumani genannt), die von kleineren Straßen im rechten Winkel gekreuzt wurden. Die Agora, der Hauptplatz, lag dort, wo sich heute die Piazza San Gaetano befindet.\n\nDieses Raster ist noch immer da: Spaccanapoli, die Via dei Tribunali und die Via Anticaglia sind die drei griechischen Straßen. Wenn du sie entlanggehst, wanderst du durch den Stadtplan von vor 2.500 Jahren.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"Die großen Tuffblöcke der griechischen Mauern, unterhalb des Straßenniveaus freigelegt","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"Die Tuffblöcke der griechischen Mauern von Neapolis auf der Piazza Bellini, sichtbar in einer Ausgrabung unterhalb des Straßenniveaus."}},{"p":"326 v. Chr. – 5. Jahrhundert n. Chr.","t":"Griechisch unter Rom","x":"Im Jahr 326 v. Chr. verbündete sich Neapolis mit Rom und blieb jahrhundertelang eine griechische Stadt innerhalb der römischen Welt: Sie gehörte zu den wenigen, die griechische Sprache und Kultur bewahrten. Sie wurde zu einem beliebten Ort der gebildeten und wohlhabenden Römer, die am Golf ihre Villen bauten: Auf der kleinen Insel Megaride entstand die Villa des Lucius Licinius Lucullus.\n\nIm Jahr 79 n. Chr. zerstörte der Ausbruch des Vesuvs das nahe gelegene Pompeji und Herculaneum. Im Jahr 476 wurde ausgerechnet in der befestigten Villa des Lucullus Romulus Augustus, der letzte römische Kaiser des Westens, gefangen gehalten: Mit ihm endete das Reich.\n\nUnter der griechisch-römischen Stadt floss bereits das Wasser der Zisternen, die man heute in Napoli Sotterranea besichtigen kann, und im Theater von Neapolis trat Kaiser Nero auf.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Eine große unterirdische Zisterne, in den Tuff gegraben und schwach beleuchtet","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Eine der großen in den Tuff gegrabenen Zisternen, etwa 40 Meter unter der Via dei Tribunali."}},{"p":"6.–12. Jahrhundert","t":"Das Herzogtum Neapel","x":"Nach dem Ende des Reiches ging Neapel im 6. Jahrhundert an die Byzantiner, die Römer des Ostens. Nach und nach wurde es zu einem beinahe unabhängigen Herzogtum: Im 8. Jahrhundert machte sich Herzog Stephan II. faktisch zu dessen Herrn.\n\nFünf Jahrhunderte lang widerstand das Herzogtum den Langobarden und den Sarazenen. Im Jahr 1030 übergab Herzog Sergius IV. die Grafschaft Aversa an eine Gruppe normannischer Söldner: Es war der Beginn ihres Aufstiegs im Süden. Im Jahr 1137 unterwarf sich Neapel den Normannen und wurde Teil des neuen Königreichs Sizilien.\n\nAus jenen fernen Jahren sind die ältesten Kirchen erhalten, wie Santa Restituta und das Baptisterium San Giovanni in Fonte im Dom, das als das älteste des Abendlandes gilt.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"Das Innere der Basilika Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, die frühchristliche Basilika, die in den Dom einbezogen wurde: das Neapel vor dem Herzogtum."}},{"p":"1194–1266","t":"Normannen und Staufer: Die Universität entsteht","x":"Nach den Normannen kamen die Staufer. Im Jahr 1194 besetzte Kaiser Heinrich VI. die Stadt und ließ ihre Mauern niederreißen.\n\nSein Sohn Friedrich II. war ein Herrscher mit großer Leidenschaft für Kultur und Recht. Im Jahr 1224 gründete er in Neapel das «Studio», eine der ersten staatlichen Universitäten Europas: Es ist die heutige Universität Federico II, die noch immer seinen Namen trägt.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"Die Statue Friedrichs II. von Schwaben an der Fassade des Königspalastes","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"Die Statue Friedrichs II. von Schwaben, eine von denen an der Fassade des Königspalastes."}},{"p":"1266–1442","t":"Die Anjou: Neapel wird Hauptstadt","x":"Im Jahr 1266 übertrug der Papst das Königreich Karl I. von Anjou, dem Bruder des französischen Königs, der im Triumph in die Stadt einzog. Nach dem Aufstand der Sizilianischen Vesper im Jahr 1282 löste sich Sizilien ab, und Neapel wurde zur Hauptstadt des Königreichs: Das sollte es jahrhundertelang bleiben.\n\nDie Anjou errichteten das Castel Nuovo, den Dom (ab 1294) und die Klosterstadt Santa Chiara (ab 1310), und die Stadt wuchs. Am Hof von Robert von Anjou im Castel Nuovo weilten Giotto, Petrarca und Boccaccio.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"Der Eingang zum Kreuzgang von Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"Der Eingang zum Majolika-Kreuzgang von Santa Chiara."}},{"p":"1442–1503","t":"Die Aragonesen","x":"Im Jahr 1442 eroberte Alfons von Aragón Neapel: Der Überlieferung nach drangen seine Männer durch einen Aquädukt in die Stadt ein. Er machte das Castel Nuovo zu seiner Residenz, baute es wieder auf und fügte zur Feier seines Sieges den großen Triumphbogen zwischen zwei Türmen hinzu.\n\nDie Aragonesen verwandelten die mittelalterliche Burg in eine moderne Festung und erneuerten die Verteidigungsanlagen und Straßen der Stadt. Sein Sohn Ferrante besiegte die aufständischen Barone: Die Bronzetür der Burg erzählt von diesem Krieg, und im Saal der Barone vollzog sich seine Rache.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"Die Tavola Strozzi: das aragonesische Neapel vom Meer aus gesehen, mit dem Maschio Angioino und dem Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"Die Tavola Strozzi (15. Jahrhundert): Neapel vom Meer aus gesehen, mit dem Hafen, dem Castel Nuovo und, weiter oben, dem Hügel Sant'Elmo."}},{"p":"1503–1707","t":"Das spanische Vizekönigreich","x":"Ab 1503 fiel Neapel an Spanien und wurde von einem Vizekönig regiert. Auch ohne einen anwesenden König war es dennoch eine kaiserliche Hauptstadt mit einem der prächtigsten Höfe der spanischen Herrschaftsgebiete. Der Vizekönig Don Pedro de Toledo verdoppelte die Stadt, legte die Via Toledo an und baute die Viertel für die Soldaten, die Quartieri Spagnoli. In diesen Jahren entstand auch der Königspalast.\n\n1606 kam Caravaggio auf der Flucht aus Rom nach Neapel: Seine Malerei veränderte die Kunst der Stadt, die im 17. Jahrhundert zu einer der Hauptstädte des europäischen Barock wurde.\n\nEs waren auch sehr harte Jahre: extrem hohe Steuern, der Ausbruch des Vesuvs im Jahr 1631 und 1656 eine Pest, die mehr als die Hälfte der Einwohner tötete.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello während der Pest von 1656: aufgehäufte Leichen auf dem Platz und himmlische Gestalten am Himmel","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello während der Pest von 1656, gemalt von Micco Spadaro: Der Platz ist voller Toter und Sterbender."}},{"p":"1647","t":"Masaniello","x":"Am 7. Juli 1647, nach einer weiteren Steuer, diesmal auf Obst, die Nahrung der Ärmsten, führte ein 27-jähriger Fischer, Masaniello, das Volk mit dem Ruf «Es lebe der König von Spanien, nieder mit der Misswirtschaft» in den Aufstand.\n\nInnerhalb von zehn Tagen mussten die Spanier die Forderungen des Volkes akzeptieren. Doch Masaniello, des Wahnsinns beschuldigt und von einem Teil der Aufständischen selbst verraten, wurde ermordet. Der Aufstand gegen Spanien ging monatelang weiter, bevor er 1648 niedergeschlagen wurde.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"Ein Gemälde aus dem 17. Jahrhundert mit der aufständischen Menge auf der Piazza Mercato","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Die Piazza del Mercato während des Aufstands von Masaniello, Gemälde von Domenico Gargiulo, genannt Micco Spadaro."}},{"p":"1734–1799","t":"Die Bourbonen und die Republik","x":"1734 brachte Karl von Bourbon Neapel wieder einen ganz eigenen König und wollte aus der Stadt eine große europäische Hauptstadt machen. 1737 ließ er in nur sieben Monaten das Teatro di San Carlo bauen, danach die Schlösser von Portici und Capodimonte. In jenen Jahren begannen auch die Ausgrabungen von Herculaneum und Pompeji.\n\nNeapel war eine der Hauptstädte der Aufklärung. Im Januar 1799 riefen die Patrioten mit dem Einmarsch der französischen Armee die Neapolitanische Republik aus: Sie dauerte nur bis Juni. Nach der Rückkehr der Bourbonen wurden viele ihrer Protagonisten hingerichtet.\n\nNach den Jahren der Franzosen (Joseph Bonaparte und Joachim Murat) kehrten 1815 die Bourbonen zurück, und 1816 entstand das Königreich beider Sizilien.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Porträt von Karl von Bourbon in Rüstung","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Karl von Bourbon, porträtiert von Anton Raphael Mengs."}},{"p":"1860–1945","t":"Das geeinte Italien und der Krieg","x":"Am 7. September 1860 zog Giuseppe Garibaldi, von der Menge umjubelt, in Neapel ein; eine Volksabstimmung besiegelte den Anschluss an das Königreich Italien. Neapel hörte auf, eine Hauptstadt zu sein, und der Verlust wog schwer.\n\nIm Zweiten Weltkrieg erlitt die Stadt mehr als 120 Luftangriffe, vor allem wegen ihres Hafens; die Menschen suchten Zuflucht in den unterirdischen Zisternen. Nach dem Waffenstillstand besetzten die Deutschen die Stadt. Ende September 1943 erhoben sich die Neapolitaner: In den „Vier Tagen von Neapel“ zwang das Volk die deutsche Besatzung zur Kapitulation. Am 1. Oktober trafen die Alliierten ein.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Ein zeitgenössischer Stich: Garibaldi wird in Neapel von der Menge bejubelt","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Zeitgenössischer Stich von Garibaldis Einzug in Neapel im Jahr 1860: Die Menge jubelt ihm in der Via Toledo zu."}},{"p":"Von 1945 bis heute","t":"Das Neapel von heute","x":"Nach dem Krieg wurde die Stadt unter großen Schwierigkeiten wieder aufgebaut. 1995 wurde das historische Zentrum von der UNESCO in die Liste des Welterbes aufgenommen: Es ist das größte Italiens und eines der weitläufigsten Europas.\n\nSeit 2001 hat die U-Bahn ihre „Kunststationen“ eröffnet, mit Werken zeitgenössischer Künstler. Die Stadt zählt etwa 950.000 Einwohner, mit dem Großraum mehr als drei Millionen.\n\nUnd dann gibt es das Neapel, das du beim Spazierengehen sehen wirst: die Wandbilder, wie das von Maradona in den Spanischen Vierteln, und die Madonna von Banksy, das Leben in den Gassen, den Kaffee. Dreitausend Jahre Geschichte, eine Schicht über der anderen, auf wenigen Kilometern.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Das historische Zentrum von Neapel von oben gesehen","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Das historische Zentrum von oben gesehen: seit 1995 UNESCO-Weltkulturerbe."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio in Neapel","sub":"Ein Maler auf der Flucht und drei Meisterwerke, die man sehen sollte","som":"Auf der Flucht aus Rom fand Caravaggio zweimal Zuflucht in Neapel. Hier malte er die Sieben Werke der Barmherzigkeit, die Geißelung Christi und sein letztes Gemälde.","txt":"Michelangelo Merisi, genannt Caravaggio, war in Rom ein berühmter und umstrittener Maler. In den letzten Maitagen des Jahres 1606 verletzte er Ranuccio Tomassoni bei einer Schlägerei, die während eines Ballspiels mit Schlägern entstanden war, tödlich; verurteilt, musste er fliehen.\n\nNeapel, damals eine der größten Städte Europas, war zweimal sein Zufluchtsort: vom Herbst 1606 bis zum Sommer 1607 und dann vom Herbst 1609 bis zum Sommer 1610. Hier fand er den Schutz der Familie Colonna und wohlhabende Auftraggeber, und hier veränderte seine Malerei die Kunst der Stadt für immer.\n\nDrei seiner Werke kann man heute in Neapel sehen, zwei davon auf unserer Route.","foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggios Sieben Werke der Barmherzigkeit","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Die Sieben Werke der Barmherzigkeit, von Caravaggio in Neapel gemalt."},"cap":[{"p":"1606–1607","t":"Der erste Aufenthalt und die Sieben Werke","x":"Der erste dokumentierte Auftrag in Neapel stammt vom Oktober 1606. Wenige Monate später, bis zum 9. Januar 1607, lieferte Caravaggio dem Pio Monte della Misericordia das große Gemälde der Sieben Werke der Barmherzigkeit, bezahlt mit 400 Dukaten.\n\nEs hängt noch immer dort, auf dem Altar, für den es gemalt wurde, in der Via dei Tribunali: eine Nacht in einer Gasse Neapels, in der sich die Menschen unter dem Blick der Madonna gegenseitig helfen.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggios Sieben Werke der Barmherzigkeit: Straßenszenen in einer dunklen Nacht","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Caravaggios Sieben Werke der Barmherzigkeit (1607): die gesamte Szene, unten die Menschen, oben die Madonna mit dem Kind."}},{"p":"1607","t":"Die Geißelung","x":"Für die Familie de Franchis, Juristen und Richter, malte Caravaggio 1607 die Geißelung Christi für ihre Kapelle in der Kirche San Domenico Maggiore: eine fast drei Meter hohe Leinwand, eines der Meisterwerke des neapolitanischen Barock.\n\nHeute befindet sich das Original im Museum von Capodimonte, wohin es aus Sicherheitsgründen gebracht wurde; in San Domenico Maggiore ist eine Kopie geblieben. Capodimonte liegt außerhalb unserer Spaziergänge.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"Caravaggios Geißelung Christi: Jesus an die Säule gebunden, umgeben von den Peinigern","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"Die Geißelung Christi (1607), heute im Museum von Capodimonte: Das Licht fällt auf den Körper Jesu, der an die Säule gebunden ist."}},{"p":"1607–1609","t":"Malta und Sizilien","x":"Am 12./13. Juli 1607 erreichte Caravaggio Malta, vermutlich auf einer Galeere der Ritter, die von Neapel aus abgelegt hatte. Doch auch dort geriet er in Schwierigkeiten: Nach einer Schlägerei wurde er im August 1608 verhaftet, floh aus der Festung, in der er eingesperrt war, und fand Zuflucht auf Sizilien, in Syrakus.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"Caravaggios Enthauptung des heiligen Johannes des Täufers","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"Die Enthauptung des heiligen Johannes des Täufers, von Caravaggio auf Malta gemalt und in Valletta aufbewahrt."}},{"p":"Oktober 1609","t":"Der Hinterhalt am Cerriglio","x":"Im Herbst 1609 kehrte er nach Neapel zurück, noch immer unter dem Schutz der Colonna, in der Hoffnung auf die Vergebung des Papstes, um nach Rom zurückkehren zu können.\n\nIm Oktober wurde er von vier Männern vor der Osteria del Cerriglio, einem damals berühmten Gasthaus, überfallen und im Gesicht entstellt: Die Verletzung war so schwer, dass sich in Rom das Gerücht von seinem Tod verbreitete.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Kreideporträt von Caravaggio","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio im Porträt von Ottavio Leoni – das Gesicht des Mannes, der am Cerriglio überfallen wurde."}},{"p":"1610","t":"Das letzte Gemälde","x":"Im Frühjahr 1610 malte er für den genuesischen Fürsten Marcantonio Doria das Martyrium der heiligen Ursula: Die Leinwand wurde im Mai fertiggestellt, noch frisch vom Firnis übergeben und nach Genua geschickt. Es ist das späteste Gemälde Caravaggios, das wir kennen, und heute in den Gallerie d'Italia in der Via Toledo zu sehen, sechs Minuten von Ceraldi entfernt. Unter den Gesichtern, hinter der Heiligen, ist auch sein eigenes.\n\nIm Sommer fuhr er mit einigen Gemälden per Boot nach Rom, in der Hoffnung auf Begnadigung. In Palo wurde er irrtümlich verhaftet, und das Boot fuhr mit den Gemälden weiter. Er starb am 18. Juli 1610 in Porto Ercole (oder vielleicht am Tag darauf), im Alter von 38 Jahren.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Caravaggios Martyrium der heiligen Ursula: die Heilige und der König im Moment des Pfeilschusses","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Das Martyrium der heiligen Ursula (1610): Der König trifft die Heilige aus nächster Nähe mit dem Pfeil."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Neapel in fünf Minuten: von der Sirene zur neuen Stadt","sub":"","som":"Erst Partenope, dann Neapolis: warum das historische Zentrum noch immer wie eine griechische Stadt angelegt ist.","txt":"Neapel wurde zweimal geboren. Das erste Mal heißt es Partenope, wie die Sirene der Sage: Im 7. Jahrhundert v. Chr. wird es von Siedlern griechischer Herkunft aus Cumae gegründet, die auf der kleinen Insel Megaride landen, wo heute das Castel dell'Ovo steht, und sich auf dem nahen Monte Echia niederlassen.\n\nDas zweite Mal, um 470 v. Chr., entsteht neben der alten Stadt eine neue: Neapolis, auf Griechisch „neue Stadt“. Durch diese gehen Sie gerade. Ihre Straßen bilden ein regelmäßiges Raster, das man nach fünfundzwanzig Jahrhunderten noch immer lesen kann: Das historische Zentrum von Neapel ist UNESCO-Welterbe, eben weil der Grundriss der griechischen Stadt bis heute ihr Gerüst geblieben ist.\n\nDrei parallele Straßen, die Decumani, durchschneiden die Stadt von West nach Ost. Die unterste ist Spaccanapoli: etwa zwei Kilometer lang und so gerade, dass sie von oben gesehen die Stadt in zwei Hälften zu teilen scheint, daher der Name. In der Mitte verläuft die Via dei Tribunali, der Decumanus maximus; weiter oben die Via dell'Anticaglia und die Via della Sapienza, der obere Decumanus.\n\nVon der Piazza Carità, wo wir seit 2002 zu Hause sind, beginnt Spaccanapoli nur wenige Gehminuten entfernt, an der Piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Das historische Zentrum von Neapel von oben gesehen","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Das historische Zentrum von oben: Die geraden Straßen sind noch immer die der griechischen Stadt."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro und das Blut, das sich verflüssigt","sub":"","som":"Dreimal im Jahr hält Neapel vor einer Ampulle den Atem an. Was geschieht, wo, und was Kirche und Wissenschaft dazu sagen.","txt":"Im Dom von Neapel wird in einer Nische der Schatzkapelle eine Ampulle mit einer dunklen Substanz aufbewahrt, die der Überlieferung nach das Blut des San Gennaro ist, des Schutzpatrons der Stadt. Dreimal im Jahr, am Samstag vor dem ersten Sonntag im Mai, am 19. September (dem Festtag) und am 16. Dezember, wird die Ampulle den Gläubigen gezeigt: Wenn sich der Inhalt, der normalerweise fest ist, verflüssigt, wird gefeiert; bleibt er fest, gilt das für viele Neapolitaner als schlechtes Omen.\n\nDie erste bekannte Erwähnung der Verflüssigung stammt aus dem Jahr 1389. Die Reliquien werden nicht vom Klerus gehütet, sondern von der Deputation der Schatzkapelle des San Gennaro, einer 1601 gegründeten weltlichen Einrichtung, der auch der Bürgermeister von Neapel angehört.\n\nDie Kirche nimmt eine vorsichtige Haltung ein: Sie spricht von einem „wundersamen Ereignis“, erlaubt die Volksfrömmigkeit, schreibt es aber nicht als Glaubenswahrheit vor. Zu den Erklärungen der Skeptiker zählt die Thixotropie, die Eigenschaft bestimmter Stoffe, in Ruhe fest zu sein und flüssig zu werden, wenn man sie bewegt oder schüttelt.\n\nHeiliges und Profanes existieren hier seit jeher nebeneinander: In der via Duomo, nur wenige Schritte vom Dom entfernt, hat der Street-Art-Künstler Jorit einen San Gennaro mit dem Gesicht eines Arbeiters gemalt.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"Die Kuppel der Schatzkapelle des San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Die Schatzkapelle des San Gennaro im Duomo, in der die Ampulle aufbewahrt wird."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Neapel in sieben Traditionen: vom Panaro bis zum Wunder des San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Die anime pezzentelle: als Neapel einen Totenschädel adoptierte","sub":"","som":"Ossarien, capuzzelle und Gebete, die gegen Lottozahlen getauscht werden: der Kult der namenlosen Toten.","txt":"Jahrhundertelang blieben in Neapel die namenlosen Toten nicht allein. Man nannte sie anime pezzentelle: die armen Seelen, die ohne Begräbnis gestorben waren und für die niemand betete. Der Name hängt mit „pezzente“, dem Armen, zusammen, aber auch mit dem lateinischen „petere“, bitten, um zu empfangen: Wer für sie betete, hoffte, dafür Schutz und Gnaden zu erhalten.\n\nDer symbolträchtige Ort ist der Friedhof Fontanelle im Rione Sanità: ein Tuffsteinbruch aus dem 16. Jahrhundert von rund viertausend Quadratmetern, in dem die Opfer der Pest von 1656 und später die der Cholera von 1836-1837 beigesetzt wurden. 1872 ordnete der Kanonikus Gaetano Barbati die Gebeine in drei Schiffen an. Die Gläubigen „adoptierten“ einen Schädel, eine capuzzella: Sie reinigten ihn, stellten ihn in einen kleinen Schrein, schmückten ihn mit Rosenkränzen und Münzen und beteten zu ihm, in der Hoffnung auf ein Zeichen im Traum, manchmal auf eine Zahl zum Lottospielen. Einige Schädel wurden berühmt: der Hauptmann mit einer geschwärzten Augenhöhle, Hauptfigur einer Legende von Hochzeit und Eifersucht; donna Concetta, die angeblich „schwitzt“, wenn eine Gnade gewährt wird.\n\n1969 ließ ein Dekret des kirchlichen Gerichts das Ossarium schließen und verbot den Kult. Seit 2020 wegen Bauarbeiten geschlossen, wurde der Friedhof 2026 wieder für die Öffentlichkeit geöffnet; er wird von der Genossenschaft La Paranza betrieben.\n\nDer Kult lebt auch unter der via dei Tribunali weiter, im Hypogäum von Santa Maria delle Anime del Purgatorio ad Arco, der Kirche, die die Neapolitaner „'e cape 'e morte“ nennen: Dort wird der Schädel von Lucia aufbewahrt, einer jungen Seele, die besonders geliebt wird. Und in der via San Biagio dei Librai, in der kleinen Kirche Santa Luciella, befindet sich ein einzigartiger Schädel: der mit den Ohren.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Schädel der anime pezzentelle","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Die capuzzelle der anime pezzentelle."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoterisches Neapel: ein alchemistischer Fürst, eine Fassade im Code und ein magisches Ei","sub":"","som":"Raimondo di Sangro, die Quaderung des Gesù Nuovo, das Ei des Vergil, der munaciello: wo die Geschichte endet und die Legende beginnt.","txt":"Neapel liebt Geheimnisse, und es hat wunderbare. Das berühmteste hat einen Namen: Raimondo di Sangro, Fürst von Sansevero, ein Mann des 18. Jahrhunderts, Großmeister der neapolitanischen Freimaurerei, ein Erfinder, der seine Geheimnisse eifersüchtig hütete. Der Mythos begleitete ihn schon zu Lebzeiten, und er selbst nährte ihn. Benedetto Croce bezeichnete ihn als die neapolitanische Verkörperung des Doktor Faust. Die schwarze Legende schreibt ihm alles Mögliche zu: Diener, die getötet wurden, um ihre Körper zu studieren, sogar die Blendung des Bildhauers des Verhüllten Christus, damit dieser keinen weiteren schaffen konnte. Das sind Legenden, und das Museum selbst unterscheidet sie von der belegten Geschichte.\n\nDer Verhüllte Christus ist das Werk von Giuseppe Sanmartino, im Auftrag des Fürsten geschaffen: Der durchsichtige Schleier, der den Körper bedeckt, ist aus demselben Marmorblock gemeißelt wie die Statue. In der unterirdischen Kammer der Kapelle befinden sich die „anatomischen Maschinen“, zwei Skelette mit rekonstruiertem Blutkreislaufsystem, angefertigt vom palermitanischen Arzt Giuseppe Salerno um 1756–1764: Die Legende spricht von geheimnisvollen Injektionen, die Studien von Bienenwachs und Farbstoffen.\n\nNicht weit entfernt ist die Fassade des Gesù Nuovo, die 1470 als Palast der Sanseverino entstand, mit einer Quaderung in Pyramidenspitzen aus dunklem Piperno bedeckt. Auf einigen Steinen sind eingeritzte Zeichen zu sehen: Für die Legende sind es eine geheime Botschaft, für manche Forscher die Zeichen der Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Musiknoten zu lesen, als eine Partitur von etwa drei Viertelstunden Dauer mit dem Namen „Enigma“. Eine reizvolle Hypothese, keine Gewissheit.\n\nUnd dann ist da das Meer: Der Legende nach versteckte der Dichter Vergil in den Kellergewölben von Castel dell'Ovo das Ei der Sirene Partenope. Solange das Ei unversehrt bleibt, bleibt die Burg bestehen.\n\nIn den Häusern hingegen wohnen die Geister der Volkstradition: der munaciello, ein Kobold mit Kapuze, der je nach Behandlung Glück oder Streiche bringt, und die bella 'mbriana, der gute Geist des Hauses, der als Schmetterling oder Gecko erscheinen kann.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"Die Diamantquader-Fassade des Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Die Diamantquaderung des Gesù Nuovo, die „Fassade im Code“."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Neapel heute: Was es Neues gibt","sub":"","som":"Der Platz, der Maradona gewidmet ist, Street-Art, der letzte Caravaggio in der Via Toledo, wiedereröffnete Kirchen und Beinhäuser: die Stadt im Wandel.","txt":"Wer nach einigen Jahren nach Neapel zurückkehrt, findet eine Stadt vor, die gelernt hat, sich selbst zu erzählen.\n\nIn den Quartieri Spagnoli, neun Minuten von uns entfernt, liegt Largo Maradona. Das Wandbild von Diego wurde 1990 von Mario Filardi gemalt; im Laufe der Jahre verblasste es fast bis zum Verschwinden, dann wurde es dank Salvatore Iodice restauriert, und im Herbst 2017 malte der Argentinier Francisco Bosoletti sein Gesicht neu. Nach Maradonas Tod am 25. November 2020 wurde der Platz, der zuvor Platz der Künstler hieß, zu einem weltlichen Schrein aus kleinen Altären, argentinischen Fahnen und Fotografien – so stark besucht, dass die Stadtverwaltung den Fußgängerstrom regeln musste.\n\nDie Street-Art hat das historische Zentrum erobert: Auf der Piazzetta dei Girolamini, durch eine Glasscheibe geschützt, befindet sich Banksys Madonna mit der Pistole; in der Via Duomo Jorits San Gennaro als Arbeiter. Das offizielle Tourismusportal der Stadt widmet ihnen eine Route.\n\nIn der Via Toledo, sechs Minuten von uns entfernt, bewahren die Gallerie d'Italia das Martyrium der heiligen Ursula auf, das letzte von Caravaggio gemalte Bild, zusammen mit mehr als fünfhundert attischen und großgriechischen Vasen.\n\nUnd lange geschlossene Orte öffnen wieder: Die Kirche Santa Luciella ai Librai, mehr als dreißig Jahre verlassen, ist seit dem 5. April 2019 wieder zu besichtigen; der Cimitero delle Fontanelle wurde 2026 wieder eröffnet.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Das Maradona-Wandbild in den Spanischen Vierteln","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, eines der Gesichter des heutigen Neapel."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true},{"id":8,"s":"caffe-sospeso","t":"Der Caffè sospeso: ein bezahlter Kaffee für einen Unbekannten","sub":"","som":"Man bezahlt einen Kaffee mehr für den, der später kommt: die neapolitanische Geste, die um die Welt gegangen ist, und die Kanne, die sie an unserer Theke bewahrt.","txt":"In Neapel gibt es einen Kaffee, den man bezahlt, aber nicht trinkt. Wer die Bar betritt, bezahlt zwei, trinkt einen und lässt den anderen „in der Schwebe“ – für jemanden, der später kommt und ihn sich nicht leisten könnte. Wer ihn spendiert, bleibt anonym; wer ihn erhält, muss sich bei niemandem bedanken.\n\nDie genauen Ursprünge sind nicht dokumentiert. Der Schriftsteller Riccardo Pazzaglia erzählte von Freunden, die an der Theke im Durcheinander der Rechnung einen Kaffee mehr bezahlten und ihn, statt ihn einzufordern, einem Unbekannten überließen. Luciano De Crescenzo widmete dem Thema 2008 das Buch „Il caffè sospeso“: Für ihn war es die Geste eines Menschen, der glücklich ist und dem Rest der Welt einen Kaffee spendiert.\n\n2010 gründeten einige italienische Kulturfestivals das Netzwerk des Caffè sospeso (Rete del caffè sospeso), das den 10. Dezember, den Internationalen Tag der Menschenrechte, zum Tag des Caffè sospeso gewählt hat. Seitdem ist die Idee in viele Länder gereist: Auf Englisch heißt er suspended coffee, in den spanischsprachigen Ländern café pendiente.\n\nBei uns in der Piazza Carità 14 hat der Caffè sospeso ein Zuhause: eine große Kupferkanne mit der Aufschrift „Caffè sospeso“ auf der Theke. Wer einen Kaffee spendieren möchte, bezahlt ihn und legt den Kassenbon in die Kanne; wer einen braucht, nimmt sich einen Bon und erhält einen bereits bezahlten Kaffee. Auch Sie können einen hinterlassen, bevor Sie wieder in die Stadt aufbrechen.","foto":{"u":"../img/d45e6800235d.webp","alt":"Die Kupferkanne mit der Aufschrift „Caffè sospeso“ auf der Theke des Ceraldi Caffè","aut":"Ceraldi Caffè","lic":"Tutti i diritti riservati","src":"https://www.ceraldicaffe.it/storie/caffe-sospeso/","dida":"Die Kanne des Caffè sospeso auf der Theke des Ceraldi Caffè in der Piazza Carità 14."},"cap":[],"ap":false,"col":{"x":"An der Theke ein Espresso. Und wenn Sie möchten, einen weiteren, den Sie in der Kaffeekanne für den Nächsten zurücklassen.","v":[{"v":177,"n":"Espresso (Kimbo, Mischung Extreme)","p":250,"foto":{"u":"../img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}}],"l":[{"u":"https://www.ceraldicaffe.it/storie/caffe-sospeso/","t":"Der „Caffè sospeso“ in Neapel: was er ist, wie er funktioniert und woher er stammt","x":"","it":true}]},"fonti":[{"t":"Wikipedia – Caffè sospeso","u":"https://it.wikipedia.org/wiki/Caff%C3%A8_sospeso"},{"t":"L'Espresso – Solidarietà in tazzina (21/11/2011)","u":"https://lespresso.it/c/attualita/2011/11/21/solidarieta-in-tazzina/5118"},{"t":"Meer – Il ritorno della Rete del caffè sospeso (27/4/2021)","u":"https://www.meer.com/it/65610-il-ritorno-della-rete-del-caffe-sospeso"},{"t":"Avvenire – Lasciamo un «caffè sospeso» (9/12/2011)","u":"https://www.avvenire.it/idee-e-commenti/lasciamo-un-caffe-sospeso-la-solidarieta-parte-dalle-piccole-cose_8571"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-12T13:48Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":""},{"c":"es","n":"Español","b":"🇪🇸","u":"../es/"}],"pre":"../","menu":"https://www.ceraldicaffe.it/menu/de/"}, T = {"titolo":"Neapel-Führer","sottotitolo":"Die Altstadt zu Fuß ab Piazza Carità","anteprima":"Testversion: Texte und Öffnungszeiten werden überprüft.","oggi":"Heute in Neapel","sciopero":"Heute Streik im   h += '<div class="stack-s"><span class="etichetta">' + e(l.dv ? T.visita + ' ' + durata(l.dv) : T.luoghi) + '</span><h1>' + e(l.n) + '</h1><span>' + etichetta(stato(l, ora, ora.min)) + '</span></div>';
  if(l.som) h += '<div class="stack-s"><h3>' + e(T.perche_speciale) + '</h3><p style="font-size:1.08rem">' + e(l.som) + '</p></div>';
  if(l.som || l.rac) h += '<button class="btn sec" onclick="ascolta(LU[' + l.id + '], this)">▶ ' + e(T.ascolta) + '</button>';
  if(l.dett && l.dett.length) h += '<div class="stack-s"><h3>' + e(T.cosa_guardare) + '</h3><p class="piccolo">' + e(f(T.cosa_guardare_sotto, {n: l.dett.length})) + '</p>' + l.dett.map(function(x, n){
      return '<article class="guarda' + (x.foto ? ' con-foto' : '') + '">' +
        (x.foto ? '<figure class="gf"><div class="ft"><img src="' + e(x.foto.u) + '" alt="' + e(x.foto.alt) + '" loading="lazy"></div>' +
          '<figcaption>' + (x.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(x.foto.dida) + '</span>' : '') + '<span class="cr">' + e(x.foto.aut) + ' · ' + e(x.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="corpo"><div class="tit"><span class="n">' + (n + 1) + '</span><b>' + e(x.t) + '</b></div>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<div class="testo">' + par(x.x) + '</div></div></article>'; }).join('') + '</div>';
  if(l.rac) h += '<details class="apri"' + (l.dett && l.dett.length ? '' : ' open') + '><summary>' + e(T.storia) + '</summary><div class="testo">' + par(l.rac) + '</div></details>';
  if(l.leg) h += '<details class="apri"><summary>' + e(T.leggende) + '</summary><div class="testo">' + par(l.leg) + '</div></details>';
  h += assaggio(l.col, T.da_ceraldi_et) + daLeggere(l.col);
  if(l.con) h += '<details class="apri" open><summary>' + e(T.consiglio) + '</summary><div><p>' + e(l.con) + '</p></div></details>';
  var info = '';
  if(!l.sa && verificati(l, ora) && l.or.length){
    info += '<table class="orari">';
    for(var g = 1; g <= 7; g++){ var fs = fasce(l, ora.data, g), ap = fs.filter(function(o){ return !o.x && o.da; });
      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  } else if(!l.sa) info += '<p>' + etichetta({k: 'verifica'}) + '</p>';
  var pr = [];
  if(l.dv) pr.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) pr.push(e(T.gratuito)); else if(l.gr === false) pr.push(e(T.pagamento));
  if(l.mp) pr.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';
  if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';
  if(l.fc) info += '<p>' + e({si: T.foto_si, no: T.foto_no, senza_flash: T.foto_senza_flash}[l.fc] || '') + '</p>';
  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(r.ap ? T.prima_di_partire : T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.sub ? '<p class="piccolo">' + e(r.sub) + '</p>' : '') + (r.foto ? '<div class="galleria uno">' + figura(r.foto) + '</div>' : '') + '<div class="testo">' + par(r.txt) + '</div>';
  if(r.cap.length){
    h += '<nav class="indice" aria-label="' + e(T.indice) + '"><b style="font-weight:500">' + e(T.indice) + '</b><ol>' + r.cap.map(function(c, n){ return '<li><button onclick="document.getElementById(\'cap-' + n + '\').scrollIntoView({behavior:\'smooth\'})">' + (c.p ? '<span class="per">' + e(c.p) + '</span>' : '') + '<span>' + e(c.t) + '</span></button></li>'; }).join('') + '</ol></nav>';
    h += r.cap.map(function(c, n){ var l = c.l && LU[c.l];
      return '<section class="capitolo" id="cap-' + n + '">' + (c.p ? '<span class="etichetta">' + e(c.p) + '</span>' : '') + '<h2>' + e(c.t) + '</h2>' +
        (c.foto ? '<figure><div class="ft"><img src="' + e(c.foto.u) + '" alt="' + e(c.foto.alt) + '" loading="lazy"></div><figcaption>' + (c.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(c.foto.dida) + '</span>' : '') + '<span class="cr">' + e(c.foto.aut) + ' · ' + e(c.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="testo">' + par(c.x) + '</div>' + (l ? '<a class="btn sec" href="#/l/' + e(l.s) + '">' + e(f(T.lo_vedi, {n: l.n})) + ' →</a>' : '') + '</section>'; }).join('');
  }
  return h + assaggio(r.col, T.da_ceraldi_et) + daLeggere(r.col) + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
