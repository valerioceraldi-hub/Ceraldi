.24886,40.84243],[14.24887,40.8425],[14.24887,40.84253],[14.24889,40.8427],[14.2489,40.84277],[14.24891,40.84281],[14.24894,40.84307],[14.24894,40.8431],[14.24899,40.84349],[14.249,40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Neapel in fünf Minuten: Von der Sirene zur Neustadt","som":"Erst Partenope, dann Neapolis: weil das historische Zentrum noch immer wie eine griechische Stadt gestaltet ist.","txt":"Neapel wurde zweimal gegründet. Das erste Mal hieß die Partenope, wie die mythische Sirene: Sie wurde im 7. Jahrhundert v. Chr. von Kolonisten griechischer Herkunft aus Cumae gegründet, die auf der Insel Megaride landeten, wo heute Castel dell'Ovo steht, und sich auf dem nahegelegenen Berg Echia niederließen.\n\nDas zweite Mal, um 470 v. Chr., entstand neben der alten Stadt eine neue: Neapolis, was auf Griechisch „neue Stadt“ bedeutet. Durch diese Stadt befinden Sie sich gerade. Ihre Straßen bilden ein regelmäßiges Raster, das auch nach fünfundzwanzig Jahrhunderten noch erkennbar ist: Das historische Zentrum von Neapel gehört zum UNESCO-Weltkulturerbe, gerade weil der Grundriss der griechischen Stadt bis heute erhalten geblieben ist.\n\nDrei parallel verlaufende Straßen, die Decumani, durchschneiden die Stadt von West nach Ost. Die unterste ist Spaccanapoli: etwa zwei Kilometer lang und so gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint – daher ihr Name. Im Zentrum verläuft die Via dei Tribunali, die Hauptdecumanus; weiter oben liegen die Via dell'Anticaglia und die Via della Sapienza, die obere Decumanus.\n\nVon Piazza Carità, wo wir seit 2002 sind, beginnt Spaccanapoli nur wenige Gehminuten entfernt, an der Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro und das schmelzende Blut","som":"Dreimal im Jahr hält Neapel den Atem an über einer Phiole. Was geschieht dort, und was sagen Kirche und Wissenschaft dazu?","txt":"Im Dom von Neapel wird in einer Nische der Schatzkammer ein Fläschchen mit einer dunklen Substanz aufbewahrt, die der Überlieferung nach das Blut des heiligen Gennaro, des Schutzpatrons der Stadt, ist. Dreimal im Jahr – am Samstag vor dem ersten Sonntag im Mai, am 19. September (dem Festtag) und am 16. Dezember – wird das Fläschchen den Gläubigen gezeigt: Löst sich der Inhalt, der meist fest ist, auf, ist dies ein Grund zum Feiern; bleibt er fest, gilt dies für viele Neapolitaner als schlechtes Omen.\n\nDie erste bekannte Aufzeichnung der Verflüssigung stammt aus dem Jahr 1389. Die Reliquien werden nicht vom Klerus, sondern von der Deputation der Kapelle des Schatzes von San Gennaro bewacht, einer säkularen Institution, die 1601 gegründet wurde und der auch der Bürgermeister von Neapel angehört.\n\nDie Kirche vertritt eine vorsichtige Haltung: Sie spricht von einem „wunderbaren Ereignis“, erlaubt die Volksfrömmigkeit, erhebt sie aber nicht zum Glaubensinhalt. Zu den von Skeptikern vorgeschlagenen Erklärungen gehört die Thixotropie, die Eigenschaft bestimmter Substanzen, im Ruhezustand fest zu sein und bei Bewegung oder Schütteln flüssig zu werden.\n\nDas Heilige und das Profane existierten hier schon immer nebeneinander: In der Via Duomo, nur wenige Schritte vom Dom entfernt, malte der Straßenkünstler Jorit einen San Gennaro mit dem Gesicht eines Arbeiters.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Die armen Seelen: Als Neapel einen Totenkopf adoptierte","som":"Ossuarien, capuzzelle und Gebete im Tausch gegen Lottozahlen: der Kult der namenlosen Toten.","txt":"Jahrhundertelang wurden die namenlosen Toten in Neapel nicht allein gelassen. Man nannte sie „anime pezzentelle“: die armen Seelen, die ohne Begräbnis und ohne Fürbitter starben. Der Name leitet sich von „pezzente“, dem armen Mann, ab, aber auch vom lateinischen „petere“, bitten, um zu empfangen: Wer für sie betete, hoffte im Gegenzug Schutz und Gnade zu erlangen.\n\nDer symbolträchtige Ort ist der Friedhof Fontanelle im Stadtteil Sanità: ein Tuffsteinbruch aus dem 16. Jahrhundert, der sich über etwa viertausend Quadratmeter erstreckt und die Opfer der Pest von 1656 und später der Cholera von 1836/37 aufnahm. 1872 ordnete Kanonikus Gaetano Barbati die Gebeine in drei Schiffen an. Gläubige „adoptierten“ einen Schädel, eine sogenannte Capuzzella: Sie reinigten ihn, stellten ihn in einen kleinen Schrein, schmückten ihn mit Rosenkränzen und Münzen und beteten zu ihm, in der Hoffnung auf ein Zeichen im Traum, manchmal auch auf eine Lottozahl. Einige Schädel erlangten Berühmtheit: der des Kapitäns mit der geschwärzten Augenhöhle, um den sich eine Legende von Ehe und Eifersucht rankt; Donna Concetta, die der Legende nach „schwitzt“, wenn ihr Gnade zuteilwird.\n\n1969 schloss ein Dekret des Kirchengerichts das Beinhaus und verbot die dort stattfindenden Gottesdienste. Nach Renovierungsarbeiten, die seit 2020 andauerten, wurde der Friedhof 2026 wiedereröffnet und wird von der Genossenschaft La Paranza verwaltet.\n\nDer Kult lebt auch unterhalb der Via dei Tribunali fort, im Hypogäum von Santa Maria delle Anime del Purgatorio ad Arco, der Kirche, die die Neapolitaner „'e cape 'e morte“ nennen: Dort wird der Schädel der Lucia, einer besonders verehrten jungen Seele, aufbewahrt. Und in der kleinen Kirche Santa Luciella an der Via San Biagio dei Librai befindet sich ein einzigartiger Schädel: der mit den Ohren.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoterisches Neapel: Ein Alchemistenprinz, eine verschlüsselte Fassade und ein magisches Ei","som":"Raimondo di Sangro, die Rustizierung des Gesù Nuovo, Virgils Ei, das munaciello: Wo die Geschichte endet und die Legende beginnt.","txt":"Neapel liebt Geheimnisse, und es birgt einige besonders faszinierende. Das berühmteste hat einen Namen: Raimondo di Sangro, Fürst von Sansevero, ein Mann des 18. Jahrhunderts, Großmeister der neapolitanischen Freimaurerei und ein eifersüchtiger Erfinder seiner eigenen Geheimnisse. Schon zu Lebzeiten umgab ihn ein Mythos, den er selbst weiter befeuerte. Benedetto Croce nannte ihn die neapolitanische Reinkarnation von Doktor Faustus. Die düstere Legende schreibt ihm alles zu: Diener, die getötet wurden, um ihre Leichen zu studieren, sogar die Blendung des Bildhauers des Verschleierten Christus, damit dieser keinen weiteren schuf. Dies sind Legenden, und das Museum selbst unterscheidet sie von der belegten Geschichte.\n\nDer Verschleierte Christus ist ein Werk von Giuseppe Sanmartino, im Auftrag des Fürsten: Der transparente Schleier, der den Körper bedeckt, ist aus demselben Marmorblock gefertigt wie die Statue. In der unterirdischen Höhle der Kapelle befinden sich die „anatomischen Maschinen“, zwei Skelette mit rekonstruierten Kreislaufsystemen, die der Palermer Arzt Giuseppe Salerno um 1756–1764 schuf. Der Legende nach beinhalteten sie geheimnisvolle Injektionen und Studien mit Bienenwachs und Farbstoffen.\n\nUnweit davon ist die Fassade des Gesù Nuovo, ursprünglich 1470 als Palazzo Sanseverino erbaut, mit einem pyramidenförmigen Mauerwerk aus dunklem Piperno-Stein verkleidet. Einige Steine tragen eingravierte Markierungen: Der Legende nach eine geheime Botschaft; manche Gelehrte halten sie für die Zeichen der Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten zu lesen, eine etwa dreiviertelstündige Partitur namens „Enigma“. Eine verlockende Hypothese, aber keine Gewissheit.\n\nUnd dann ist da noch das Meer: Der Legende nach versteckte der Dichter Vergil das Ei der Sirene Partenope in den Kellern von Castel dell'Ovo. Solange das Ei unversehrt bleibt, steht auch die Burg.\n\nIn den Häusern hingegen wohnen die Geister der Volkstradition: der munaciello, ein vermummter Elf, der je nachdem, wie man ihn behandelt, Glück oder Unheil bringt, und die bella 'mbriana, ein guter Hausgeist, der als Schmetterling oder Gecko erscheinen kann.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Neapel heute: Was gibt es Neues?","som":"Der Maradona gewidmete Platz, die Straßenkunst, das letzte Caravaggio-Gemälde in der Via Toledo, wiedereröffnete Kirchen und Beinhäuser: die Stadt im Wandel.","txt":"Wer nach einigen Jahren nach Neapel zurückkehrt, findet eine Stadt vor, die gelernt hat, ihre Geschichte zu erzählen.\n\nIm spanischen Viertel, nur neun Minuten von uns entfernt, liegt Largo Maradona. Das Wandgemälde von Diego Maradona wurde 1990 von Mario Filardi geschaffen; im Laufe der Jahre verblasste es fast vollständig, wurde dann aber von Salvatore Iodice restauriert, und im Herbst 2017 übermalte der Argentinier Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 entwickelte sich der Platz, der zuvor Künstlerplatz genannt wurde, zu einem säkularen Wallfahrtsort mit kleinen Altären, argentinischen Flaggen und Fotografien. Er war so beliebt, dass die Stadtverwaltung den Fußgängerverkehr regeln musste.\n\nDie Streetart hat Einzug in die Altstadt gehalten: Auf der Piazzetta dei Girolamini prangt, geschützt durch Glas, Banksys „Madonna mit Pistole“; in der Via Duomo findet sich Jorits „San Gennaro der Arbeiter“. Die offizielle Tourismuswebsite der Stadt hat ihnen eine eigene Route gewidmet.\n\nIn der Via Toledo, nur sechs Minuten von uns entfernt, beherbergt die Gallerie d'Italia das Martyrium der Heiligen Ursula, Caravaggios letztes Gemälde, sowie über fünfhundert attische und Magna-Graecia-Vasen.\n\nUnd Orte, die lange Zeit geschlossen waren, werden wiedereröffnet: Die Kirche Santa Luciella ai Librai, die über dreißig Jahre lang verlassen war, wurde am 5. April 2019 wieder für die Öffentlichkeit zugänglich gemacht; der Friedhof Fontanelle wurde 2026 wiedereröffnet.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T20:56Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":""},{"c":"es","n /* ---------- copertina dell'itinerario: una mappa vera (stessi tasselli della guida, senza rete esterna) fotografata una volta,

var COPERTINE = {}, codaCopertine = [], copertinaInCorso = false, inCoda = {};
function copertina(i){ return '<span class="copertina-giro" data-giro="' + e(i.s) + '">' + schizzo(i) + '</span>'; }
function preparaCopertine(){ document.querySelectorAll('.copertina-giro[data-giro]').forEach(function(el){ var i = IT[el.getAttribute('data-giro')]; if(!i) return;
  var w = Math.round(el.clientWidth); if(!w) return; var k = i.s + '@' + w;
  if(COPERTINE[k]) return mettiCopertina(el, COPERTINE[k], true);
  if(!inCoda[k]){ inCoda[k] = 1; codaCopertine.push({i: i, w: w, k: k}); } }); prossimaCopertina(); }
function mettiCopertina(el, c, subito){ if(el.querySelector('img.fondo')) return; if(subito) el.classList.add('pronta');
  var h = '<img class="fondo" alt="" src="' + c.img + '">' + c.pin.map(function(p){ return '<span class="pin ' + p.cl + '" style="left:' + p.x + '%;top:' + p.y + '%">' + p.h + '</span>'; }).join('') + '<span class="osm">© OpenStreetMap</span>';
  el.insertAdjacentHTML('beforeend', h); requestAnimationFrame(function(){ el.classList.add('pronta'); }); }
function prossimaCopertina(){ if(copertinaInCorso || !codaCopertine.length) return; var job = codaCopertine.shift(); copertinaInCorso = true;
  var fine = function(){ delete inCoda[job.k]; copertinaInCorso = false; prossimaCopertina(); };
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var H = 220, box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-12000px;top:0;width:' + job.w + 'px;height:' + H + 'px';
    document.body.appendChild(box);
    var m = new maplibregl.Map({container: box, style: r[1], interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: {preserveDrawingBuffer: true}, preserveDrawingBuffer: true, center: [14.2532, 40.8475], zoom: 14});
    var b = new maplibregl.LngLatBounds(), linee = [];
    job.i.tappe.forEach(function(t){ var l = LU[t.l]; b.extend([l.lon, l.lat]); if(t.geo){ linee.push(t.geo); t.geo.forEach(function(c){ b.extend(c); }); } });
    m.fitBounds(b, {padding: {top: 46, bottom: 40, left: 44, right: 44}, maxZoom: 16, duration: 0});
    var chiuso = false, chiudi = function(){ if(chiuso) return; chiuso = true; try{ m.remove(); }catch(x){} box.remove(); fine(); };
    var timer = setTimeout(chiudi, 15000);
    m.on('load', function(){
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addSource('p', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(c){ return {type: 'Feature', properties: {}, geometry: {type: 'LineString', coordinates: c}}; })}});
      m.addLayer({id: 'pb', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': 7}});
      m.addLayer({id: 'pl', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': scuro, 'line-width': 4}});
      m.once('idle', function(){
        try{
          var img = m.getCanvas().toDataURL('image/jpeg', 0.82), pin = [], k = 0, conFoto = [];
          /* foto piccole solo dove c'è spazio (almeno 50 px dalle altre foto): nei vicoli fitti le tappe vicine restano un pallino numerato */
          job.i.tappe.forEach(function(t, n){ var l = LU[t.l], c = casa(l); if(n === job.i.tappe.length - 1 && c) return;
            var q = m.project([l.lon, l.lat]), x = Math.round(q.x / job.w * 1000) / 10, y = Math.round(q.y / H * 1000) / 10;
            if(c){ pin.push({cl: 'punto casa', x: x, y: y, h: 'C'}); return; }
            k++;
            var libero = conFoto.every(function(o){ return Math.hypot(o[0] - q.x, o[1] - q.y) >= 50; });
            if(l.foto && libero){ conFoto.push([q.x, q.y]); pin.push({cl: '', x: x, y: y, h: '<img alt="" src="' + e(l.foto.u) + '"><b>' + k + '</b>'}); }
            else pin.push({cl: 'punto', x: x, y: y, h: String(k)}); });
          pin.sort(function(a, b){ return (a.cl === '' ? 1 : 0) - (b.cl === '' ? 1 : 0); }); /* le foto sopra i pallini */
          COPERTINE[job.k] = {img: img, pin: pin};
          document.querySelectorAll('.copertina-giro[data-giro="' + job.i.s + '"]').forEach(function(el){ if(Math.round(el.clientWidth) === job.w) mettiCopertina(el, COPERTINE[job.k]); });
        }catch(x){}
        clearTimeout(timer); chiudi(); });
    });
    m.on('error', function(){});
  }).catch(fine);
}

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null, GEO = {}; window.MAPPE = {};

  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"')); }); }
/* opz: punti [{t,n,lat,lon,h,casa,spento}], linee [{c:coordinate, s:'fatto'|'ora'|'poi'|''}], geo (controllo «tu sei qui»), dopo(m) */
function mappa(id, opz){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18, maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}});
    MAPPE[id] = m;
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    if(opz.geo){
      var g = new maplibregl.GeolocateControl({positionOptions: {enableHighAccuracy: true, timeout: 15000}, trackUserLocation: true, fitBoundsOptions: {maxZoom: 17}});
      m.addControl(g, 'top-right'); GEO[id] = g;
      var msg = document.getElementById(id + '-msg');
      g.on('error', function(){ if(msg){ msg.textContent = T.pos_negata; msg.hidden = false; } });
      g.on('outofmaxbounds', function(){ if(msg){ msg.textContent = T.fuori_zona; msg.hidden = false; } });
      g.on('geolocate', function(){ if(msg) msg.hidden = true; });
    }
    var b = new maplibregl.LngLatBounds(), linee = opz.linee || [];
    if(linee.length) m.on('load', function(){
      m.addSource('percorso', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(x){ return {type: 'Feature', properties: {s: x.s || ''}, geometry: {type: 'LineString', coordinates: x.c}}; })}});
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addLayer({id: 'percorso-bordo', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': ['match', ['get', 's'], 'ora', 12, 9]}});
      m.addLayer({id: 'percorso', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'},
        paint: {'line-color': ['match', ['get', 's'], 'fatto', '#9a958c', scuro], 'line-width': ['match', ['get', 's'], 'ora', 7, 5], 'line-opacity': ['match', ['get', 's'], 'poi', 0.45, 1]}});
    });
    linee.forEach(function(x){ x.c.forEach(function(p){ b.extend(p); }); });
    (opz.punti || []).forEach(function(p){
      var d = document.createElement('a'); d.className = 'pin' + (p.casa ? ' casa' : '') + (p.spento ? ' spento' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(!b.isEmpty() && ((opz.punti || []).length > 1 || linee.length)) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0});
    else if(!b.isEmpty()) m.jumpTo({center: b.getCenter(), zoom: 16});
    if(opz.dopo) opz.dopo(m);
  }).catch(function(){ el.innerHTML = ''; });
}

function portami(l){ return /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'https://maps.apple.com/?daddr=' + l.lat + ',' + l.lon + '&dirflg=w' : 'https://www.google.com/maps/dir/?api=1&destination=' + l.lat + ',' + l.lon + '&travelmode=walking'; }

/* ---------- audio: voce del telefono (gratuita, senza rete) ---------- */
function ascolta(l, btn){
  try{
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn) btn.textContent = '▶ ' + T.ascolta; return; }
    var parti = [l.n, l.som].concat((l.dett || []).map(function(x){ return x.t + '. ' + (x.d ? x.d + '. ' : '') + x.x; }), [l.rac, l.leg]);

    u.lang = VOCE[D.lingua] || D.lingua; u.onend = function(){ if(btn) btn.textContent = '▶ ' + T.ascolta; };

/* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;
function xy(c){ return [(c[0] - 14.25) * KXm, (c[1] - 40.85) * KYm]; }
function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */
  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;
}
function salvaGiro(){ try{ localStorage.setItem('guida_giro', JSON.stringify({s: G.s, k: G.k, t: Date.now()})); }catch(x){} }
function giroSalvato(){ try{ var g = JSON.parse(localStorage.getItem('guida_giro') || 'null'); return g && Date.now() - g.t < 12 * 3600e3 ? g : null; }catch(x){ return null; } }
var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!G) return;
    G.pos = [p.coords.longitude, p.coords.latitude]; G.acc = p.coords.accuracy; G.negata = false;
    var i = IT[G.s], tp = i.tappe[G.k], l = LU[tp.l];
    if(tp.geo){ var r = suLinea(G.pos, tp.geo); G.lungo = r.lungo; G.fuori = G.acc < 40 && r.off > 60; }
    var dest = xy([l.lon, l.lat]), io = xy(G.pos), dist = Math.hypot(dest[0] - io[0], dest[1] - io[1]);
    G.vicino = (G.acc <= 40 && dist < 35) ? (G.vicino || 0) + 1 : 0;
    if(G.vicino >= 2 && !G.arrivato) G.arrivato = true;   /* due posizioni precise di seguito entro 35 m dalla tappa */
    aggiornaCammino();
  }, function(){ if(G){ G.negata = true; aggiornaCammino(); } }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); }catch(x){}
}
function fermaPosizione(){ if(watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(watchId); watchId = null; try{ if(wake) wake.release(); }catch(x){} wake = null; marcaIo = null; }

  if(f === 'ora') return (i.dur || 0) <= 90;
  return (i.dur || 0) > 90 && (i.dur || 0) <= 300;
}

         '<span class="piccolo">' + (arrivo < 1440 ? '≈ ' + fmt(arrivo) : '') + (tp.so ? ' · ' + e(T.visita) + ' ' + tp.so + ' ' + e(T.min) : '') + '</span><span>' + etichetta(sa) + '</span></div></a>';

V.cammino = function(s){
  var i = IT[s]; if(!i) return V.home();

function lineeCammino(i){ return i.tappe.map(function(tp, n){ return tp.geo ? {c: tp.geo, s: n < G.k ? 'fatto' : n === G.k ? 'ora' : 'poi'} : null; }).filter(Boolean); }

    var tp = i.tappe[G.k]; if(tp.geo){ var b = new maplibregl.LngLatBounds(); tp.geo.forEach(function(c){ b.extend(c); }); m.fitBounds(b, {padding: 50, maxZoom: 17, duration: 0}); }

function aggiornaCammino(){
  if(!G || location.hash.indexOf('#/c/') !== 0) return;
  var i = IT[G.s], n = i.tappe.length - 1, tp = i.tappe[G.k], l = LU[tp.l], fine = G.k === n, pan = document.getElementById('c-pannello'); if(!pan) return;
  document.getElementById('c-tratto').textContent = f(T.tratto, {i: G.k, n: n});

      '<button class="btn sec" onclick="prosegui()">' + e(T.prosegui) + ' · ' + e(nomeTappa(i, G.k + 1)) + ' · ' + i.tappe[G.k + 1].m + ' ' + e(T.min) + '</button>';
    h += '</section>';

    var aMv = Math.max(0, Math.round(mv.a - lungo)), resto = Math.max(0, Math.round((tp.mt || 0) - lungo));

    h += '<section class="foglio"><div class="manovra"><div class="freccia">' + freccia(mv) + '</div><div style="min-width:0"><p class="piccolo">' + e(f(T.tra, {d: aMv})) + '</p><p style="font-size:1.15rem;font-weight:500;line-height:1.3" id="c-frase">' + frase(mv, l.n) + '</p></div></div>' +
      '<div style="border-top:1px solid var(--linea);padding-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center"><div style="min-width:0"><p class="piccolo">' + e(T.prossima) + ' · ' + e(f(T.tappa_di, {i: G.k, n: n})) + '</p><p style="font-weight:500">' + e(nomeTappa(i, G.k)) + '</p></div>' +
      '<p style="text-align:right;white-space:nowrap"><b style="font-weight:500">' + resto + ' m</b><br><span class="piccolo">' + Math.max(1, Math.round(resto / 75)) + ' ' + e(T.min) + '</span></p></div>' +
      (sv.length ? '<details class="come"><summary>' + e(T.tutte_indicazioni) + '</summary><ol>' + sv.map(function(x){ return '<li>' + indicazione(x, l.n) + '</li>'; }).join('') + '</ol></details>' : '') +
      '<div class="due"><a class="btn sec" href="#/l/' + e(l.s) + '">' + e(T.apri_scheda) + '</a><button class="btn sec" id="c-qui" onclick="G.arrivato=true;aggiornaCammino()">' + e(T.sono_qui) + '</button></div></section>';

function prosegui(){ var i = IT[G.s]; if(G.k < i.tappe.length - 1){ G.k++; G.arrivato = false; G.vicino = 0; G.lungo = 0; salvaGiro(); marcaIo = null; disegnaCammino(); aggiornaCammino(); window.scrollTo(0, 0); } }
function esciGiro(){ try{ localStorage.removeItem('guida_giro'); }catch(x){} fermaPosizione(); var s = G && G.s; G = null; vai(s ? '#/i/' + s : '#/'); }
V.luogo = function(s){

  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="' + (inGiro ? 'vai(\'#/c/' + G.s + '\')' : 'history.length > 1 ? history.back() : vai(\'#/\')') + '">← ' + e(T.indietro) + '</button>' + lingue() + '</div>';

  if(l.som || l.rac) h += '<button class="btn sec" onclick="ascolta(LU[' + l.id + '], this)">▶ ' + e(T.ascolta) + '</button>';
  if(l.dett && l.dett.length) h += '<div class="stack-s"><h3>' + e(T.cosa_guardare) + '</h3>' + l.dett.map(function(x, n){
      return '<article class="guarda' + (x.foto ? ' con-foto' : '') + '"><div class="mini">' + (x.foto ? '<img src="' + e(x.foto.u) + '" alt="' + e(x.foto.alt) + '" loading="lazy" style="width:100%;height:100%;object-fit:cover">' : '') + '<span class="n">' + (n + 1) + '</span></div>' +
        '<div style="min-width:0;display:grid;gap:4px"><b>' + e(x.t) + '</b>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<p>' + e(x.x) + '</p>' +
        (x.foto && x.foto.dida ? '<span class="dida">' + e(x.foto.dida) + '</span>' : '') + (x.foto ? '<span class="cr">' + e(x.foto.aut) + ' · ' + e(x.foto.lic) + '</span>' : '') + '</div></article>'; }).join('') + '</div>';
  if(l.rac) h += '<details class="apri"' + (l.dett && l.dett.length ? '' : ' open') + '><summary>' + e(T.storia) + '</summary><div class="testo">' + par(l.rac) + '</div></details>';
  if(l.leg) h += '<details class="apri"><summary>' + e(T.leggende) + '</summary><div class="testo">' + par(l.leg) + '</div></details>';

      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  } else if(!l.sa) info += '<p>' + etichetta({k: 'verifica'}) + '</p>';

V.racconto = function(s){

V.mappa = function(){

};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };

function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;

  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();

  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else h = V.home();

document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }

});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }

mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
