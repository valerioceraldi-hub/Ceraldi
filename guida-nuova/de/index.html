cora le porte e i passavivande delle celle dei certosini.","d":"Nel cuore della Certosa","foto":null},{"t":"Il Presepe Cuciniello","x":"Con circa ottocento pezzi è il presepe più famoso di Napoli. Fu donato da Michele Cuciniello e inaugurato nel 1879. Un impianto luminoso simula le ore del giorno.","d":"Nella sezione presepiale, dove erano le cucine","foto":null},{"t":"La vista sul golfo","x":"Dalle terrazze e dai giardini della Certosa si vede tutto il golfo di Napoli, con il Vesuvio sullo sfondo.","d":"Sulle terrazze e nei giardini","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant'Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La fortezza a stella sulla collina del Vomero: bastioni con vista a 360° su Napoli e sul golfo, e dentro il Museo Novecento.","rac":"Castel Sant'Elmo domina il Vomero a circa 250 metri sul livello del mare ed è visibile da quasi tutta la città. Le prime notizie lo indicano, intorno al 1275, come una residenza fortificata angioina chiamata Belforte; nel 1329 Roberto d'Angiò ne volle l'ampliamento, affidato a Tino di Camaino. La pianta a stella a sei punte è invece il risultato della ricostruzione cinquecentesca voluta tra il 1537 e il 1547 dal viceré Pedro de Toledo, su progetto dell'architetto militare Pedro Luis Escrivà.\n\nNel corso dei secoli fu spesso un carcere: vi furono rinchiusi Tommaso Campanella e, più tardi, patrioti della Repubblica napoletana del 1799 come Gennaro Serra, Mario Pagano e Luisa Sanfelice. Dopo essere stato presidio borbonico fu carcere militare fino al 1952; un grande restauro è iniziato nel 1976.\n\nSulla piazza d'armi, dal 2010, c'è il Museo Novecento a Napoli: oltre 170 opere di circa 90 artisti napoletani o attivi in città tra il 1910 e il 1980. Alcune opere sono state create apposta per il castello: nella grande cisterna Gian Maria Tosatti ha fatto crescere un campo di grano, e sugli spalti si staglia la scultura in alluminio «Sant'Elmo» di Mimmo Paladino.\n\nDai bastioni il panorama arriva dalle isole al Vesuvio, dai Campi Flegrei ai monti del Matese.","con":"Sali verso il tramonto per il panorama. Il castello è accanto alla Certosa di San Martino: si possono visitare nella stessa mattinata. Il castello è chiuso il martedì e, con il maltempo, può restare chiuso.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Le alte mura in tufo di Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Le mura di Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castello 8:30-19:30; Museo Novecento 9:30-18:30 (ultimo ingresso 17:30). Chiuso il martedì. Con maltempo il sito può restare chiuso."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"I bastioni e il panorama","x":"I bastioni offrono un panorama a 360° sulla città, sul golfo, sul Vesuvio e sulla costa di Posillipo, tra i più completi di Napoli.","d":"Sugli spalti","foto":null},{"t":"Il Museo Novecento a Napoli","x":"Aperto nel 2010 sulla piazza d'armi, raccoglie oltre 170 opere di circa 90 artisti napoletani o attivi in città, realizzate dal 1910 in poi: dal Futurismo alla Transavanguardia degli anni Ottanta.","d":"Sulla piazza d'armi del castello","foto":null},{"t":"Un campo di grano nella cisterna","x":"L'opera «My dreams, they'll never surrender» di Gian Maria Tosatti (2014) è un campo di grano cresciuto nella cisterna, il luogo più buio e profondo del castello, che fu anche carcere.","d":"Nella grande cisterna","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Der erste Rundgang","sub":"Spaccanapoli in einem halben Tag, Start in Ceraldi","desc":"Das Herz der Altstadt auf einem Rundgang: die Basilika Gesù Nuovo mit ihrem geheimnisvollen Flair, der Kreuzgang von Santa Chiara, der Verschleierte Christus, die Schädel- und Ohrenkirche, die Geschäfte der Via San Biagio dei Librai. Und dann kehren wir zu uns zurück.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli von oben gesehen: eine gerade Straße, die das historische Zentrum durchschneidet","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli von oben gesehen: die lange, gerade Straße, die das historische Zentrum durchquert. Die erste Tour findet zu Fuß statt."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Einen Kaffee bei Ceraldi und dann geht's los.","q":null,"alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","q":null,"alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25008,40.84665],[14.25047,40.84678],[14.25086,40.84691],[14.25124,40.84703],[14.25122,40.84707],[14.25144,40.84714],[14.2517,40.84724],[14.252,40.84733]],"sv":[{"k":"parti","n":"Piazza Carità","d":242,"a":0},{"k":"gira","m":"right","n":"Via Maddaloni","d":176,"a":242},{"k":"gira","m":"slight left","n":"Piazza del Gesù Nuovo","d":76,"a":418},{"k":"arrivo","a":494}]},{"l":9,"m":4,"mt":263,"so":45,"nota":"" olazione da noi: un caffè e una sfogliatella.","v":[{"v":177,"n":"Espresso (Kimbo, Extreme Blend)","p":250,"foto":{"u":"../img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}},{"v":110,"n":"Krause Sfogliatella","p":300,"foto":{"u":"../img/bd4714cc3e5b.webp","alt":"Sfogliatella Riccia"}}],"l":[]},"fi":{"x":"","v":[{"v":83,"n":"Ceraldi Kaffee","p":500,"foto":{"u":"../img/7bef03b87815.webp","alt":"Caffè Ceraldi"}},{"v":356,"n":"Aspritz","p":800,"foto":{"u":"../img/a3e1bd8ea3d9.webp","alt":"Aspritz"}}],"l":[]}}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"La storia di Napoli","sub":"Dalla sirena Partenope a oggi, in tredici capitoli","som":"Prima di partire, ventotto secoli in dieci minuti: la leggenda della sirena, i Greci, Roma, i re, la rivolta, la guerra e la città di oggi.","txt":"Napoli è una delle città più antiche d'Europa: la sua storia si estende per circa tremila anni, e il centro storico che stai per attraversare conserva ancora la pianta delle strade disegnata dai Greci. Per oltre mezzo millennio è stata la capitale dell'Italia del Sud.\n\nQuesti tredici capitoli ti accompagnano dalla leggenda alla città di oggi. Ogni volta che il racconto incontra un luogo della guida, trovi un pulsante per andarci.","foto":null,"cap":[{"p":"La leggenda","t":"La sirena Partenope","x":"Tutto comincia con una sirena. Nel mito greco le sirene erano creature con il corpo di uccello e la testa di donna, padrone di un canto magico. Una di loro si chiamava Partenope.\n\nIl racconto più famoso dice che, quando Ulisse passò davanti al loro scoglio senza cedere al canto, le sirene per il dolore si gettarono in mare. Le onde portarono il corpo di Partenope sulla costa, alla foce di un piccolo fiume, il Sebeto: proprio dove sarebbe nata la città.\n\nLì le fu costruita una tomba e i Greci di Napoli le dedicavano ogni anno sacrifici e una corsa con le fiaccole. Ancora oggi i napoletani si chiamano «partenopei».","l":null,"foto":null},{"p":"VIII–VII secolo a.C.","t":"Partenope, la prima città","x":"La leggenda ha un fondo di verità. Tra l'VIII e il VII secolo a.C. i Greci di Cuma, la più antica colonia greca della zona, fondarono un piccolo scalo sul mare e lo chiamarono come la sirena: Partenope.\n\nSorgeva sulla collina di Pizzofalcone, il Monte Echia, su uno sperone circondato dal mare, e aveva il suo approdo sull'isolotto di Megaride, dove oggi c'è Castel dell'Ovo. Il porto era nell'attuale piazza Municipio. La necropoli di Partenope è stata scoperta nel 1949 in via Nicotera.\n\nLa piccola città crebbe così in fretta che Cuma, per paura di perdere il comando, ne ridusse il ruolo.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."}},{"p":"V secolo a.C.","t":"Neapolis, la città nuova","x":"Accanto a Partenope, poco più a est, i Cumani fondarono una città nuova: Neapolis, la «città nuova». L'UNESCO data la fondazione al 470 a.C. circa, nel periodo in cui i Greci avevano sconfitto gli Etruschi sul mare.\n\nNeapolis fu costruita secondo un disegno regolare: tre strade principali parallele (le «plateiai», poi chiamate decumani), incrociate ad angolo retto da strade più piccole. L'agorà, la piazza principale, era dov'è oggi piazza San Gaetano.\n\nQuel reticolo è ancora lì: Spaccanapoli, via dei Tribunali e via Anticaglia sono le tre strade greche. Camminandoci, cammini nella pianta della città di 2.500 anni fa.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"I grandi blocchi di tufo delle mura greche, scavate sotto il livello della strada","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"I blocchi di tufo delle mura greche di Neapolis, in piazza Bellini, visibili in uno scavo sotto il livello della strada."}},{"p":"326 a.C. – V secolo d.C.","t":"Greca sotto Roma","x":"Nel 326 a.C. Neapolis si alleò con Roma e restò per secoli una città greca dentro il mondo romano: fu tra le poche a conservare la lingua e la cultura greca. Diventò un luogo amato dai Romani colti e ricchi, che costruivano ville sul golfo: sull'isolotto di Megaride sorse quella di Lucio Licinio Lucullo.\n\nNel 79 d.C. l'eruzione del Vesuvio distrusse Pompei ed Ercolano, poco lontano. Nel 476, proprio nella villa di Lucullo, fortificata, fu rinchiuso Romolo Augusto, l'ultimo imperatore romano d'Occidente: con lui finiva l'Impero.\n\nSotto la città greco-romana scorreva già l'acqua delle cisterne che oggi visiti a Napoli Sotterranea, e nel teatro di Neapolis si esibì l'imperatore Nerone.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."}},{"p":"VI–XII secolo","t":"Il ducato di Napoli","x":"Dopo la fine dell'Impero, nel VI secolo, Napoli passò ai Bizantini, i Romani d'Oriente. Poco a poco diventò un ducato quasi indipendente: nell'VIII secolo il duca Stefano II se ne fece signore di fatto.\n\nPer cinque secoli il ducato resistette a Longobardi e Saraceni. Nel 1030 il duca Sergio IV diede la contea di Aversa a un gruppo di mercenari normanni: fu l'inizio della loro ascesa nel Sud. Nel 1137 Napoli si sottomise ai Normanni ed entrò nel nuovo Regno di Sicilia.\n\nDi quegli anni lontani restano le chiese più antiche, come Santa Restituta e il battistero di San Giovanni in Fonte dentro il Duomo, considerato il più antico d'Occidente.","l":18,"foto":null},{"p":"1194–1266","t":"Normanni e Svevi: nasce l'Università","x":"Dopo i Normanni arrivarono gli Svevi. Nel 1194 l'imperatore Enrico VI occupò la città e ne fece abbattere le mura.\n\nSuo figlio, Federico II, era un sovrano appassionato di cultura e di diritto. Nel 1224 fondò a Napoli lo «Studio», una delle prime università statali d'Europa: è l'attuale Università Federico II, che porta ancora il suo nome.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La statua di Federico II di Svevia nella facciata del Palazzo Reale","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statua di Federico II di Svevia, tra quelle della facciata del Palazzo Reale."}},{"p":"1266–1442","t":"Gli Angioini: Napoli capitale","x":"Nel 1266 il papa affidò il regno a Carlo I d'Angiò, fratello del re di Francia, che entrò in città in trionfo. Dopo la rivolta dei Vespri siciliani del 1282, la Sicilia si staccò e Napoli diventò la capitale del regno: lo resterà per secoli.\n\nGli Angioini costruirono il Castel Nuovo, il Duomo (dal 1294) e la cittadella di Santa Chiara (dal 1310), e la città si allargò. Alla corte di Roberto d'Angiò, nel Castel Nuovo, soggiornarono Giotto, Petrarca e Boccaccio.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."}},{"p":"1442–1503","t":"Gli Aragonesi","x":"Nel 1442 Alfonso d'Aragona conquistò Napoli: secondo la tradizione i suoi uomini entrarono in città passando per un acquedotto. Fece del Castel Nuovo la sua reggia, lo ricostruì e per celebrare la vittoria vi aggiunse il grande Arco di Trionfo tra due torri.\n\nGli Aragonesi trasformarono il castello medievale in una fortezza moderna e rinnovarono le difese e le strade della città. Il figlio Ferrante sconfisse i baroni ribelli: la porta di bronzo del castello racconta quella guerra, e nella Sala dei Baroni si consumò la sua vendetta.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi: Napoli aragonese vista dal mare, con il Maschio Angioino e Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (XV secolo): Napoli vista dal mare, con il porto, il Castel Nuovo e, in alto, il colle di Sant'Elmo."}},{"p":"1503–1707","t":"Il viceregno spagnolo","x":"Dal 1503 Napoli passò alla Spagna e fu governata da un viceré. Senza un re presente, era comunque una capitale imperiale, con una delle corti più grandiose dei domini spagnoli. Il viceré don Pedro di Toledo raddoppiò la città, aprì via Toledo e costruì i quartieri per i soldati, i Quartieri Spagnoli. In questi anni fu costruito anche il Palazzo Reale.\n\nNel 1606 arrivò a Napoli, in fuga da Roma, Caravaggio: la sua pittura cambiò l'arte della città, che nel Seicento diventò una delle capitali del barocco europeo.\n\nFurono anche anni durissimi: tasse altissime, l'eruzione del Vesuvio del 1631 e, nel 1656, una peste che uccise più della metà degli abitanti.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste del 1656: corpi ammassati nella piazza e figure celesti in cielo","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste del 1656, dipinto da Micco Spadaro: la piazza è piena di morti e di moribondi."}},{"p":"1647","t":"Masaniello","x":"Il 7 luglio 1647, dopo l'ennesima tassa, questa volta sulla frutta, il cibo dei più poveri, un pescatore di 27 anni, Masaniello, guidò il popolo in rivolta al grido di «Viva il re di Spagna, mora il malgoverno».\n\nIn dieci giorni gli spagnoli dovettero accettare le richieste del popolo. Ma Masaniello, accusato di pazzia e tradito da una parte degli stessi rivoltosi, fu assassinato. La rivolta continuò per mesi contro la Spagna, prima di essere domata nel 1648.","l":null,"foto":null},{"p":"1734–1799","t":"I Borbone e la Repubblica","x":"Nel 1734 Carlo di Borbone riportò a Napoli un re tutto suo e volle farne una grande capitale europea. Nel 1737 fece costruire in soli sette mesi il Teatro di San Carlo; poi le regge di Portici e di Capodimonte. In quegli anni cominciarono anche gli scavi di Ercolano e di Pompei.\n\nNapoli era una delle capitali dell'Illuminismo. Nel gennaio 1799, con l'arrivo dell'esercito francese, i patrioti proclamarono la Repubblica Napoletana: durò solo fino a giugno. Al ritorno dei Borbone molti dei suoi protagonisti furono giustiziati.\n\nDopo gli anni dei Francesi (Giuseppe Bonaparte e Gioacchino Murat), nel 1815 tornarono i Borbone, e nel 1816 nacque il Regno delle Due Sicilie.","l":null,"foto":null},{"p":"1860–1945","t":"L'Italia unita e la guerra","x":"Il 7 settembre 1860 Giuseppe Garibaldi entrò a Napoli acclamato dalla folla; un plebiscito sancì l'unione al Regno d'Italia. Napoli smise di essere una capitale, e la perdita fu pesante.\n\nNella Seconda guerra mondiale la città subì più di 120 bombardamenti aerei, soprattutto per il suo porto; la gente si rifugiava nelle cisterne sotterranee. Dopo l'armistizio, i tedeschi occuparono la città. Alla fine di settembre 1943 i napoletani insorsero: nelle «Quattro giornate di Napoli» il popolo costrinse alla resa il presidio tedesco. Il 1° ottobre arrivarono gli Alleati.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Un'incisione d'epoca: Garibaldi acclamato dalla folla a Napoli","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Incisione d'epoca dell'ingresso di Garibaldi a Napoli, nel 1860: la folla lo acclama in via Toledo."}},{"p":"Dal 1945 a oggi","t":"La Napoli di oggi","x":"Dopo la guerra la città si ricostruì tra grandi difficoltà. Nel 1995 il centro storico è stato iscritto dall'UNESCO tra i Patrimoni dell'Umanità: è il più grande d'Italia e uno dei più vasti d'Europa.\n\nDal 2001 la metropolitana ha aperto le sue «stazioni dell'arte», con opere di artisti contemporanei. La città conta circa 950.000 abitanti, più di tre milioni con l'area metropolitana.\n\nE poi c'è la Napoli che vedrai camminando: i murales, come quello di Maradona nei Quartieri Spagnoli, e la Madonna di Banksy, la vita dei vicoli, il caffè. Tremila anni di storia, uno sopra l'altro, in pochi chilometri.","l":44,"foto":null}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio a Napoli","sub":"Un pittore in fuga e tre capolavori da vedere","som":"In fuga da Roma, Caravaggio trovò rifugio a Napoli due volte. Qui dipinse le Sette opere di Misericordia, la Flagellazione e il suo ultimo quadro.","txt":"Michelangelo Merisi, detto Caravaggio, era a Roma un pittore famoso e discusso. Negli ultimi giorni di maggio del 1606 ferì a morte Ranuccio Tomassoni in una rissa nata durante una partita a racchetta: condannato, dovette fuggire.\n\nNapoli, allora una delle città più grandi d'Europa, fu il suo rifugio due volte: dall'autunno 1606 all'estate 1607, e poi dall'autunno 1609 all'estate 1610. Qui trovò la protezione della famiglia Colonna e committenti ricchi, e qui la sua pittura cambiò per sempre l'arte della città.\n\nTre delle sue opere si possono vedere oggi a Napoli, due delle quali sul nostro percorso.","foto":null,"cap":[{"p":"1606–1607","t":"Il primo soggiorno e le Sette opere","x":"Il primo incarico napoletano documentato è dell'ottobre 1606. Pochi mesi dopo, entro il 9 gennaio 1607, Caravaggio consegnò al Pio Monte della Misericordia la grande tela delle Sette opere di Misericordia, pagata 400 ducati.\n\nÈ ancora lì, sull'altare per cui fu dipinta, in via dei Tribunali: una notte in un vicolo di Napoli, dove gli uomini si aiutano tra loro sotto lo sguardo della Madonna.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"p":"1607","t":"La Flagellazione","x":"Per la famiglia de Franchis, giuristi e magistrati, Caravaggio dipinse nel 1607 la Flagellazione di Cristo, per la loro cappella nella chiesa di San Domenico Maggiore: una tela alta quasi tre metri, uno dei capolavori del barocco napoletano.\n\nOggi l'originale è al Museo di Capodimonte, dove fu trasferito per motivi di sicurezza; in San Domenico Maggiore è rimasta una copia. Capodimonte è fuori dai nostri giri a piedi.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La Flagellazione di Cristo di Caravaggio: Gesù legato alla colonna tra i carnefici","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellazione di Cristo (1607), oggi al Museo di Capodimonte: la luce cade sul corpo di Gesù, legato alla colonna."}},{"p":"1607–1609","t":"Malta e la Sicilia","x":"Il 12-13 luglio 1607 Caravaggio arrivò a Malta, probabilmente su una galea dei Cavalieri partita da Napoli. Ma anche lì finì nei guai: dopo una rissa fu arrestato nell'agosto 1608, fuggì dal forte in cui era rinchiuso e riparò in Sicilia, a Siracusa.","l":null,"foto":null},{"p":"Ottobre 1609","t":"L'agguato del Cerriglio","x":"Nell'autunno 1609 tornò a Napoli, ancora sotto la protezione dei Colonna, sperando nel perdono del papa per poter rientrare a Roma.\n\nIn ottobre fu aggredito da quattro uomini davanti all'osteria del Cerriglio, una locanda famosa del tempo, e sfregiato al volto: la ferita fu così grave che a Roma si sparse la voce della sua morte.","l":null,"foto":null},{"p":"1610","t":"L'ultimo quadro","x":"Nella primavera del 1610 dipinse per il principe genovese Marcantonio Doria il Martirio di sant'Orsola: la tela fu finita in maggio, consegnata ancora fresca di vernice e spedita a Genova. È il quadro più tardo di Caravaggio che conosciamo, e si vede oggi alle Gallerie d'Italia in via Toledo, a sei minuti da Ceraldi. Tra i volti, alle spalle della santa, c'è il suo.\n\nNell'estate partì in barca verso Roma con alcuni quadri, sperando nel perdono. Fu arrestato per errore a Palo, e la barca ripartì con i dipinti. Morì a Porto Ercole il 18 luglio 1610 (o forse il giorno dopo), a 38 anni.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Neapel in fünf Minuten: Von der Sirene zur Neustadt","sub":"","som":"Erst Partenope, dann Neapolis: weil das historische Zentrum noch immer wie eine griechische Stadt gestaltet ist.","txt":"Neapel wurde zweimal gegründet. Das erste Mal hieß die Partenope, wie die mythische Sirene: Sie wurde im 7. Jahrhundert v. Chr. von Kolonisten griechischer Herkunft aus Cumae gegründet, die auf der Insel Megaride landeten, wo heute Castel dell'Ovo steht, und sich auf dem nahegelegenen Berg Echia niederließen.\n\nDas zweite Mal, um 470 v. Chr., entstand neben der alten Stadt eine neue: Neapolis, was auf Griechisch „neue Stadt“ bedeutet. Durch diese Stadt befinden Sie sich gerade. Ihre Straßen bilden ein regelmäßiges Raster, das auch nach fünfundzwanzig Jahrhunderten noch erkennbar ist: Das historische Zentrum von Neapel gehört zum UNESCO-Weltkulturerbe, gerade weil der Grundriss der griechischen Stadt bis heute erhalten geblieben ist.\n\nDrei parallel verlaufende Straßen, die Decumani, durchschneiden die Stadt von West nach Ost. Die unterste ist Spaccanapoli: etwa zwei Kilometer lang und so gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint – daher ihr Name. Im Zentrum verläuft die Via dei Tribunali, die Hauptdecumanus; weiter oben liegen die Via dell'Anticaglia und die Via della Sapienza, die obere Decumanus.\n\nVon Piazza Carità, wo wir seit 2002 sind, beginnt Spaccanapoli nur wenige Gehminuten entfernt, an der Piazza del Gesù Nuovo.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro und das schmelzende Blut","sub":"","som":"Dreimal im Jahr hält Neapel den Atem an über einer Phiole. Was geschieht dort, und was sagen Kirche und Wissenschaft dazu?","txt":"Im Dom von Neapel wird in einer Nische der Schatzkammer ein Fläschchen mit einer dunklen Substanz aufbewahrt, die der Überlieferung nach das Blut des heiligen Gennaro, des Schutzpatrons der Stadt, ist. Dreimal im Jahr – am Samstag vor dem ersten Sonntag im Mai, am 19. September (dem Festtag) und am 16. Dezember – wird das Fläschchen den Gläubigen gezeigt: Löst sich der Inhalt, der meist fest ist, auf, ist dies ein Grund zum Feiern; bleibt er fest, gilt dies für viele Neapolitaner als schlechtes Omen.\n\nDie erste bekannte Aufzeichnung der Verflüssigung stammt aus dem Jahr 1389. Die Reliquien werden nicht vom Klerus, sondern von der Deputation der Kapelle des Schatzes von San Gennaro bewacht, einer säkularen Institution, die 1601 gegründet wurde und der auch der Bürgermeister von Neapel angehört.\n\nDie Kirche vertritt eine vorsichtige Haltung: Sie spricht von einem „wunderbaren Ereignis“, erlaubt die Volksfrömmigkeit, erhebt sie aber nicht zum Glaubensinhalt. Zu den von Skeptikern vorgeschlagenen Erklärungen gehört die Thixotropie, die Eigenschaft bestimmter Substanzen, im Ruhezustand fest zu sein und bei Bewegung oder Schütteln flüssig zu werden.\n\nDas Heilige und das Profane existierten hier schon immer nebeneinander: In der Via Duomo, nur wenige Schritte vom Dom entfernt, malte der Straßenkünstler Jorit einen San Gennaro mit dem Gesicht eines Arbeiters.","foto":null,"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Napoli in sette tradizioni: dal panaro al miracolo di San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Die armen Seelen: Als Neapel einen Totenkopf adoptierte","sub":"","som":"Ossuarien, capuzzelle und Gebete im Tausch gegen Lottozahlen: der Kult der namenlosen Toten.","txt":"Jahrhundertelang wurden die namenlosen Toten in Neapel nicht allein gelassen. Man nannte sie „anime pezzentelle“: die armen Seelen, die ohne Begräbnis und ohne Fürbitter starben. Der Name leitet sich von „pezzente“, dem armen Mann, ab, aber auch vom lateinischen „petere“, bitten, um zu empfangen: Wer für sie betete, hoffte im Gegenzug Schutz und Gnade zu erlangen.\n\nDer symbolträchtige Ort ist der Friedhof Fontanelle im Stadtteil Sanità: ein Tuffsteinbruch aus dem 16. Jahrhundert, der sich über etwa viertausend Quadratmeter erstreckt und die Opfer der Pest von 1656 und später der Cholera von 1836/37 aufnahm. 1872 ordnete Kanonikus Gaetano Barbati die Gebeine in drei Schiffen an. Gläubige „adoptierten“ einen Schädel, eine sogenannte Capuzzella: Sie reinigten ihn, stellten ihn in einen kleinen Schrein, schmückten ihn mit Rosenkränzen und Münzen und beteten zu ihm, in der Hoffnung auf ein Zeichen im Traum, manchmal auch auf eine Lottozahl. Einige Schädel erlangten Berühmtheit: der des Kapitäns mit der geschwärzten Augenhöhle, um den sich eine Legende von Ehe und Eifersucht rankt; Donna Concetta, die der Legende nach „schwitzt“, wenn ihr Gnade zuteilwird.\n\n1969 schloss ein Dekret des Kirchengerichts das Beinhaus und verbot die dort stattfindenden Gottesdienste. Nach Renovierungsarbeiten, die seit 2020 andauerten, wurde der Friedhof 2026 wiedereröffnet und wird von der Genossenschaft La Paranza verwaltet.\n\nDer Kult lebt auch unterhalb der Via dei Tribunali fort, im Hypogäum von Santa Maria delle Anime del Purgatorio ad Arco, der Kirche, die die Neapolitaner „'e cape 'e morte“ nennen: Dort wird der Schädel der Lucia, einer besonders verehrten jungen Seele, aufbewahrt. Und in der kleinen Kirche Santa Luciella an der Via San Biagio dei Librai befindet sich ein einzigartiger Schädel: der mit den Ohren.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoterisches Neapel: Ein Alchemistenprinz, eine verschlüsselte Fassade und ein magisches Ei","sub":"","som":"Raimondo di Sangro, die Rustizierung des Gesù Nuovo, Virgils Ei, das munaciello: Wo die Geschichte endet und die Legende beginnt.","txt":"Neapel liebt Geheimnisse, und es birgt einige besonders faszinierende. Das berühmteste hat einen Namen: Raimondo di Sangro, Fürst von Sansevero, ein Mann des 18. Jahrhunderts, Großmeister der neapolitanischen Freimaurerei und ein eifersüchtiger Erfinder seiner eigenen Geheimnisse. Schon zu Lebzeiten umgab ihn ein Mythos, den er selbst weiter befeuerte. Benedetto Croce nannte ihn die neapolitanische Reinkarnation von Doktor Faustus. Die düstere Legende schreibt ihm alles zu: Diener, die getötet wurden, um ihre Leichen zu studieren, sogar die Blendung des Bildhauers des Verschleierten Christus, damit dieser keinen weiteren schuf. Dies sind Legenden, und das Museum selbst unterscheidet sie von der belegten Geschichte.\n\nDer Verschleierte Christus ist ein Werk von Giuseppe Sanmartino, im Auftrag des Fürsten: Der transparente Schleier, der den Körper bedeckt, ist aus demselben Marmorblock gefertigt wie die Statue. In der unterirdischen Höhle der Kapelle befinden sich die „anatomischen Maschinen“, zwei Skelette mit rekonstruierten Kreislaufsystemen, die der Palermer Arzt Giuseppe Salerno um 1756–1764 schuf. Der Legende nach beinhalteten sie geheimnisvolle Injektionen und Studien mit Bienenwachs und Farbstoffen.\n\nUnweit davon ist die Fassade des Gesù Nuovo, ursprünglich 1470 als Palazzo Sanseverino erbaut, mit einem pyramidenförmigen Mauerwerk aus dunklem Piperno-Stein verkleidet. Einige Steine tragen eingravierte Markierungen: Der Legende nach eine geheime Botschaft; manche Gelehrte halten sie für die Zeichen der Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten zu lesen, eine etwa dreiviertelstündige Partitur namens „Enigma“. Eine verlockende Hypothese, aber keine Gewissheit.\n\nUnd dann ist da noch das Meer: Der Legende nach versteckte der Dichter Vergil das Ei der Sirene Partenope in den Kellern von Castel dell'Ovo. Solange das Ei unversehrt bleibt, steht auch die Burg.\n\nIn den Häusern hingegen wohnen die Geister der Volkstradition: der munaciello, ein vermummter Elf, der je nachdem, wie man ihn behandelt, Glück oder Unheil bringt, und die bella 'mbriana, ein guter Hausgeist, der als Schmetterling oder Gecko erscheinen kann.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Neapel heute: Was gibt es Neues?","sub":"","som":"Der Maradona gewidmete Platz, die Straßenkunst, das letzte Caravaggio-Gemälde in der Via Toledo, wiedereröffnete Kirchen und Beinhäuser: die Stadt im Wandel.","txt":"Wer nach einigen Jahren nach Neapel zurückkehrt, findet eine Stadt vor, die gelernt hat, ihre Geschichte zu erzählen.\n\nIm spanischen Viertel, nur neun Minuten von uns entfernt, liegt Largo Maradona. Das Wandgemälde von Diego Maradona wurde 1990 von Mario Filardi geschaffen; im Laufe der Jahre verblasste es fast vollständig, wurde dann aber von Salvatore Iodice restauriert, und im Herbst 2017 übermalte der Argentinier Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 entwickelte sich der Platz, der zuvor Künstlerplatz genannt wurde, zu einem säkularen Wallfahrtsort mit kleinen Altären, argentinischen Flaggen und Fotografien. Er war so beliebt, dass die Stadtverwaltung den Fußgängerverkehr regeln musste.\n\nDie Streetart hat Einzug in die Altstadt gehalten: Auf der Piazzetta dei Girolamini prangt, geschützt durch Glas, Banksys „Madonna mit Pistole“; in der Via Duomo findet sich Jorits „San Gennaro der Arbeiter“. Die offizielle Tourismuswebsite der Stadt hat ihnen eine eigene Route gewidmet.\n\nIn der Via Toledo, nur sechs Minuten von uns entfernt, beherbergt die Gallerie d'Italia das Martyrium der Heiligen Ursula, Caravaggios letztes Gemälde, sowie über fünfhundert attische und Magna-Graecia-Vasen.\n\nUnd Orte, die lange Zeit geschlossen waren, werden wiedereröffnet: Die Kirche Santa Luciella ai Librai, die über dreißig Jahre lang verlassen war, wurde am 5. April 2019 wieder für die Öffentlichkeit zugänglich gemacht; der Friedhof Fontanelle wurde 2026 wiedereröffnet.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-04T20:26Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":""},{"c":"es","n":"Español","b":"🇪🇸","u":"../es/"}],"pre":"../","menu":"../../menu-nuovo/de/"}, T = {"titolo":"Neapel-Führer","sottotitolo":"Die Altstadt zu Fuß ab Piazza Carità","anteprima":"Testversion: Texte und Öffnungszeiten werden überprüft.","oggi":"Heute in Neapel","sciopero":"Heute Streik im Nahverkehr","chiusi_oggi":"Heute geschlossen","tutti_aperti":"Heute kei V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
