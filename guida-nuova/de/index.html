am Morgen."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore und die Ausgrabungen von Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Eine gotische Kirche aus dem 13. Jahrhundert, die zehn Meter unter dem Kirchenschiff den Markt des antiken Neapolis verbirgt: Straßen, Läden und Räume von vor zweitausend Jahren.","rac":"Die Piazza San Gaetano ist das Herz des antiken Neapolis. Im 13. Jahrhundert entstand über den Resten des griechisch-römischen Marktes die gotische Basilika San Lorenzo Maggiore, eine der ältesten Kirchen der Stadt. Zum Komplex gehören außerdem das Kloster, das Museo dell'Opera und die Ausgrabungen.\n\nDie 1976 begonnenen Ausgrabungen haben das macellum, den Markt, freigelegt, der am antiken Decumanus Maximus lag. Man steigt etwa zehn Meter unter die Kirche hinab und geht durch Straßen, Läden und Räume aus der Kaiserzeit. Unter der Kirche sind auch die Reste einer christlichen Basilika aus dem 6. Jahrhundert zum Vorschein gekommen.\n\nDas Museo dell'Opera in den Räumen des Klosters und im Stadtturm erzählt die Geschichte Neapels von der Antike bis ins 19. Jahrhundert.","con":"Steigen Sie in die Ausgrabungen hinab: Das ist der Teil, mit dem man nicht rechnet. Planen Sie etwa eine Dreiviertelstunde ein und prüfen Sie vor Ihrem Besuch die Öffnungszeiten auf der offiziellen Website.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"Die Fassade von San Lorenzo Maggiore an der Piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore mit Blick auf die Piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Richtwert für die Öffnungszeiten; bitte vor dem Besuch auf der offiziellen Website bestätigen."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"Der Markt unter der Kirche","x":"Die Ausgrabungen zeigen das Macellum der griechisch-römischen Neapolis, den Markt, der am antiken Decumanus Maximus lag. Sie befinden sich etwa zehn Meter unter der Kirche. Beim Gang durch die Anlagen erkennt man die Straße und die Räume, in denen verkauft und Handel getrieben wurde: Es ist ein Stück antike Stadt, das noch an seinem Platz liegt und über dem Neapel weitergebaut hat.","d":"Unter dem Kirchenschiff, in den Ausgrabungen","foto":{"u":"../img/ab890c42a731.jpg","alt":"Eine römische Straße in den Ausgrabungen unter San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Die Ausgrabungen unter San Lorenzo Maggiore: die Straße und die Werkstätten der antiken Stadt."}},{"t":"Der Hochaltar von Giovanni da Nola","x":"Der Hochaltar ist ein Renaissancewerk des neapolitanischen Bildhauers Giovanni da Nola und gehört zu den schönsten in Neapel. Die Apsis, in der er steht, ist der älteste Teil der Kirche.","d":"Am Ende der Kirche, in der Apsis","foto":{"u":"../img/3692771c5f21.jpg","alt":"Die gotische Apsis von San Lorenzo Maggiore mit dem Hochaltar","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Lorenzo_Maggiore._(6146).jpg","dida":"Die Apsis von San Lorenzo Maggiore mit dem Hochaltar."}},{"t":"Das Museo dell'Opera","x":"Das Museum belegt die Räume des Klosters und den Stadtturm neben der Basilika. Es zeigt Einrichtungsgegenstände, Kostüme und Sammlungen und stellt die Geschichte Neapels von der Antike bis zum 19. Jahrhundert dar.","d":"Im Kloster, neben der Basilika","foto":{"u":"../img/591ff764e679.jpg","alt":"Ein Museumssaal im Komplex von San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Die Räume des Klosters von San Lorenzo Maggiore, in denen das Museo dell'Opera untergebracht ist."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, die Kirche der capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"Die Kirche der capuzzelle: unter dem Boden das Hypogäum, in dem Neapel für die namenlosen Seelen betete. Und der Schädel von Lucia.","rac":"Die Neapolitaner nennen sie „'e cape 'e morte“, die Kirche der Totenköpfe. Es ist eine kleine Kirche aus dem 17. Jahrhundert am Decumano Maggiore, verbunden mit der Verehrung der Seelen im Fegefeuer, die durch die Gegenreformation verbreitet wurde. Eine steile Treppe führt hinunter ins Hypogäum, die unterirdische Kirche, die im 18. Jahrhundert erweitert und mit Majolikafliesen geschmückt wurde: Hier kümmerten sich die Gläubigen um anonyme Gebeine und baten sie um Fürsprache. Am Ende eines kleinen Gangs wird der Schädel von Lucia aufbewahrt, einer jungen, besonders geliebten Seele.","con":"Suchen Sie hinter dem Altar den geflügelten Marmorschädel von Dionisio Lazzari: Er ist das Symbol der Kirche.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"Die Fassade von Purgatorio ad Arco an der Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"Die Fassade von Purgatorio ad Arco am Decumano Maggiore."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Oberkirche, Hypogäum und Museum. Führungen im Ticket inbegriffen, nach Voranmeldung."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Oberkirche, Hypogäum und Museum."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Die Gemälde des 17. Jahrhunderts","x":"Bevor Sie hinabsteigen, betrachten Sie die obere Kirche genau. Sie wurde 1616 von der Laienbruderschaft „Opera Pia Purgatorio ad Arco“ beim Architekten Giovan Cola di Franco in Auftrag gegeben und 1638 geweiht.\n\nSie wurde auf zwei Ebenen konzipiert: die Oberkirche, die die irdische Dimension darstellt, und darunter das Hypogäum, der Friedhof, der ganz konkret das Fegefeuer darstellt. Die gesamte Ausschmückung erinnert jeden Eintretenden daran, dass die Seelen auf ein Gebet warten, um ins Paradies aufzusteigen.\n\nHier finden sich kostbare Marmorarbeiten und Gemälde von drei großen Meistern des neapolitanischen 17. Jahrhunderts: Massimo Stanzione, Luca Giordano und Andrea Vaccaro. In der Sakristei und im Oratorium gibt es außerdem ein kleines Museum mit Silberarbeiten, liturgischen Gewändern, Handschriften und Gemälden, die zwischen dem 17. und dem 19. Jahrhundert für die Bruderschaft geschaffen wurden.","d":"In der Oberkirche","foto":{"u":"../img/a8b34654121a.jpg","alt":"Ein Marmorgrabmal aus dem 17. Jahrhundert in der Oberkirche","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"In der Oberkirche: das Grabmal des Pietro Antonio Mastrilli (1607), inmitten der Marmorarbeiten und Gemälde des 17. Jahrhunderts."}},{"t":"Der geflügelte Totenschädel","x":"Unter den Marmorarbeiten der Oberkirche befindet sich der berühmte geflügelte Totenschädel von Dionisio Lazzari: ein Totenschädel mit Flügeln, der den Geist des Ortes zusammenfasst. Hier macht der Tod keine Angst: Er wird zum Anlass für das Gebet und für die Verbundenheit mit denen, die nicht mehr da sind.\n\nNicht zufällig nennen die Neapolitaner diese Kirche «'e cape 'e morte», die Kirche der Totenschädel.\n\nDie Botschaft war gewollt: In der Kirche, die im Zeichen der Gegenreformation entstand, sollte alles Passanten und Gläubige daran erinnern, dass die Seelen im Fegefeuer auf ein Gebet warteten, um ins Paradies aufzusteigen.","d":"In der Oberkirche","foto":{"u":"../img/63d1e885c193.jpg","alt":"Ein Marmorrelief mit einem geflügelten, gekrönten Totenschädel","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"Der geflügelte, gekrönte Totenschädel als Marmorrelief, erste Hälfte des 17. Jahrhunderts: das Symbol der Kirche."}},{"t":"Das Hypogäum der Seelen","x":"Die eigentliche Kirche ist die untere. Durch eine Öffnung im Boden der Oberkirche führen hohe Stufen hinab in einen großen, schmucklosen Raum – eine richtige Unterkirche.\n\nIn der Mitte des Bodens befindet sich ein großes anonymes Grab, umgeben von schwarzen Ketten und von nur wenigen Glühbirnen beleuchtet. Entlang der Wände gibt es Nischen, kleine Altäre und Vitrinen: Sie sind die Zeichen eines Kults, der hier schon im 17. Jahrhundert spontan entstand, als die Gläubigen sich um namenlose menschliche Überreste kümmerten und sie um Schutz baten. Im hinteren Teil steht der alte Altar aus dem 17. Jahrhundert mit großen schwarzen Kreuzen.\n\nGeh langsam hinunter: Es ist ein Ort lebendiger Frömmigkeit, nicht nur der Neugier. Führung auf Italienisch im Ticketpreis inbegriffen, nur mit Reservierung.","d":"Unter der Kirche, über eine steile Treppe hinab","foto":{"u":"../img/7fc480d05134.jpg","alt":"Das Hypogäum von Purgatorio ad Arco mit Altären und Grablichtern","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"Das Hypogäum, die Kirche unten: Altäre, Grablichter und die Zeugnisse des Seelenkults."}},{"t":"Der Schädel von Lucia","x":"Unter allen Schädeln des Hypogäums gibt es einen besonders geliebten: den von Lucia, die als die Seele eines jungen Mädchens gilt. Er wird am Ende eines kleinen Korridors aufbewahrt.\n\nEr ist das berührendste Zeugnis des Kults der Seelen im Fegefeuer, der hier schon im 17. Jahrhundert spontan entstand: Die Gläubigen wählen einen namenlosen Überrest aus, kümmern sich um ihn und bitten ihn um Schutz.\n\nBetrachte sie mit Respekt: Für viele Neapolitaner ist sie noch heute eine Gegenwart, an die man sich wenden kann.","d":"Im Hypogäum, am Ende eines kleinen Korridors","foto":{"u":"../img/d51d785835b3.jpg","alt":"Ein Bronzeschädel zwischen den Stäben des Eisengitters der Kirche","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_01.jpg","dida":"Ein Bronzeschädel auf dem Eisengitter der Kirche Purgatorio ad Arco."}}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Ein Bild der Seelen im Fegefeuer inmitten der Flammen in der Kirche","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"In der Kirche: die Seelen im Fegefeuer inmitten der Flammen, das Thema des gesamten Ortes."},{"u":"../img/de63b1b83fa8.jpg","alt":"Ein Bronzeschädel auf einer kleinen Säule","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Ein Bronzeschädel: das Symbol der Kirche der „capuzzelle“."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Vierzig Meter unter der Via dei Tribunali: die Zisternen, die Neapel über Jahrhunderte mit Wasser versorgten, die Luftschutzbunker des Krieges und ein römisches Theater, versteckt unter dem Bett eines Hauses.","rac":"Unter der Altstadt liegt eine weitere Stadt. Von der Piazza San Gaetano aus steigt man über hundert Stufen hinab, bis in etwa 40 Meter Tiefe, auf einem Weg, der durch das griechisch-römische Aquädukt und durch Gänge aus dem Mittelalter, der Bourbonenzeit und der Moderne führt.\n\nDie Hohlräume aus griechischer Zeit dienten etwa 23 Jahrhunderte lang als Zisternen für das Wasser der Stadt. Im Zweiten Weltkrieg wurden dieselben Räume zu Luftschutzbunkern.\n\nDie Besichtigung unter der Erde ist geführt und dauert etwa eine Stunde. Danach geht es zurück an die Oberfläche, zur letzten Überraschung: den Überresten des griechisch-römischen Theaters von Neapolis, die seit dem 15. Jahrhundert in die Häuser des Viertels eingebaut sind. Man betritt ein „basso“, eine Wohnung im Erdgeschoss, schiebt ein Bett beiseite und steigt durch eine Falltür zwischen die Mauern des Theaters hinab.","con":"Flache Schuhe und ein Sweatshirt, auch im Sommer: Unter der Erde ist es feucht. Der kurze, enge Durchgang mit der Kerze ist freiwillig. Für Gruppen ab 10 Personen ist eine Reservierung erforderlich.","acc":"Nicht geeignet für Rollstühle und Rollatoren: Es gibt Treppen mit Handlauf und enge Durchgänge.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Eine große unterirdische Zisterne, in den Tuffstein gegraben und schwach beleuchtet","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Eine der großen, in den Tuffstein gegrabenen Zisternen, etwa 40 Meter unter der Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Führungen starten stündlich von 10 bis 18 Uhr, auf Italienisch und Englisch. Donnerstags auch um 21 Uhr, nur nach Voranmeldung und mit mindestens 10 Personen."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Die griechisch-römischen Zisternen","x":"Man steigt 136 niedrige, bequeme Stufen hinab, bis etwa 40 Meter unter die Straßen. Schon im 3. Jahrhundert v. Chr. legten die Griechen hier die ersten unterirdischen Steinbrüche an, um die Tuffblöcke zu gewinnen, mit denen sie die Mauern und Tempel von Neapolis bauten.\n\nDie großen, in den Tuff gegrabenen Räume wurden später zu den Wasserzisternen der Stadt, verbunden durch das griechisch-römische Aquädukt, und blieben es etwa 23 Jahrhunderte lang. Unter der Altstadt liegt ein noch nicht vollständig erforschtes Netz aus Zisternen, Steinbrüchen, Gängen und Brunnen, mit griechischen, spanischen und bourbonischen Spuren.\n\nAuf dem Weg sehen Sie auch Überraschendes: das Labor der seismischen Station „Arianna“ und die unterirdischen Gärten, kleine Anpflanzungen in 35 Metern Tiefe, beleuchtet von Speziallampen und auch von Forschern untersucht.","d":"Im ersten Teil der Besichtigung, in etwa 40 Metern Tiefe","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Die Tuffsteinwände einer unterirdischen Zisterne","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Die Tuffsteinwände einer Zisterne: Etwa 23 Jahrhunderte lang wurde hier das Wasser der Stadt gesammelt."}},{"t":"Der Durchgang mit der Kerze","x":"Die Räume entlang des Rundgangs sind alle groß und beleuchtet, bis auf einen sehr kurzen, engen Abschnitt: Er wird bei Kerzenlicht durchquert, einzeln und mit etwas Abstand zum Vordermann.\n\nAm Ende des Gangs erreichen Sie die römische Zisterne, die noch immer voller Wasser ist: Es ist der stimmungsvollste Moment der Besichtigung.\n\nDer Durchgang ist freiwillig: Wer Probleme mit engen Räumen hat, kann draußen auf die Gruppe warten, wo es Sitzbänke gibt. Die Kerze ist nicht Pflicht: Auch die Taschenlampe des Handys genügt.","d":"Entlang des unterirdischen Rundgangs","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Ein sehr enger, beleuchteter Gang im Tuffstein","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Einer der sehr engen, in den Tuffstein gegrabenen Gänge."}},{"t":"Die Luftschutzbunker des Krieges","x":"Im Zweiten Weltkrieg dienten die antiken Zisternen als Luftschutzbunker: Hier stiegen die Neapolitaner hinab, um sich vor den Bombenangriffen in Sicherheit zu bringen.\n\nEntlang des Rundgangs befindet sich das Kriegsmuseum mit Gegenständen aus jenen Jahren.\n\nNeapel wurde mehr als hundertmal aus der Luft bombardiert, vor allem wegen seines Hafens: Wenn man bedenkt, wie viele Menschen hier unten Zuflucht suchten, versteht man besser, was die Stadt durchgemacht hat.","d":"Entlang des unterirdischen Rundgangs","foto":{"u":"../img/0f4490838101.jpg","alt":"Gegenstände aus dem Zweiten Weltkrieg, unterirdisch ausgestellt","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Erinnerungen an den Krieg: Gegenstände aus der Zeit, als diese Räume Luftschutzkeller waren."}},{"t":"Das Theater unter dem Bett","x":"Der zweite Teil des Besuchs findet oberirdisch statt, zwischen der Via Anticaglia, dem Vico Cinquesanti und der Via San Paolo. Hier stand das griechisch-römische Theater von Neapolis, auch Neros Theater genannt, weil der Kaiser dort auftrat.\n\nSeit dem 15. Jahrhundert wurden die Häuser auf und in den Mauern des Theaters gebaut, die auf diese Weise bis heute erhalten geblieben sind. Man betritt einen «basso», ein typisches Haus auf Straßenniveau, schiebt das Bett beiseite und steigt durch eine Falltür in die Räume hinab, in denen sich Nero der Überlieferung nach auf seine Auftritte vorbereitete.\n\nVor Kurzem kam in einer alten Tischlerei ein weiteres Stück des Theaters wieder zum Vorschein: Heute beherbergt sie eine Ausstellung alter dunkler Holzvitrinen für Krippen, und unter dem Boden sind Abflüsse aus der Zeit der Bourbonen aufgetaucht, die aus Fliesen (riggiole) mit blauen Mustern gebaut sind.","d":"Zweiter Teil des Besuchs, oberirdisch zwischen der Via Anticaglia und dem Vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"Die Backsteinbögen, die sich über die Via Anticaglia spannen","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Die Bögen der Via Anticaglia: Sie sind Überreste des römischen Theaters von Neapolis, das in die Häuser eingebaut wurde."}}],"gal":[],"leg":"Der Erzählung der Führung zufolge hatte Nero in den versteckten Räumen unter dem basso (einer ebenerdigen Wohnung) seine Garderoben, wenn er nach Neapel kam, um im Theater aufzutreten.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Zwei elf Meter hohe römische Säulen tragen noch immer die Fassade: Sie sind das, was vom Dioskurentempel übrig ist.","rac":"An der Piazza San Gaetano, im Herzen der Altstadt, führt eine Freitreppe zu einer Fassade, die von zwei etwa elf Meter hohen korinthischen Säulen getragen wird. Sie sind das, was vom Dioskurentempel übrig ist, der zwischen dem 1. und 2. Jahrhundert n. Chr. erbaut wurde und als bedeutendstes antikes Bauwerk Neapels gilt.\n\nEine erste Kirche San Paolo wurde hier zwischen dem 8. und 9. Jahrhundert errichtet; die Theatiner bauten sie ab der zweiten Hälfte des 16. Jahrhunderts neu auf. Das Erdbeben von 1688 zerstörte einen großen Teil des antiken Tempels; der Architekt Arcangelo Guglielmelli band die verbliebenen Säulen in die neue Fassade ein. Die Bombardierungen von 1943 beschädigten das Innere, doch der Großteil der Dekorationen blieb erhalten.\n\nHier ist der heilige Kajetan von Thiene begraben, der Gründer der Theatiner.","con":"Betrachte die Säulen aus der Nähe, dann tritt ein: Die von Solimena freskierte Sakristei gehört zu den schönsten Teilen. Die Öffnungszeiten ändern sich: Informiere dich vorher.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Die korinthischen Säulen des römischen Tempels an der Fassade von San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Die korinthischen Säulen des Dioskurentempels an der Fassade von San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Die Säulen des Dioskurentempels","x":"Die beiden korinthischen Säulen an der Fassade, etwa elf Meter hoch, sind alles, was vom Tempel der Dioskuren übrig geblieben ist. Nach dem Erdbeben von 1688 band der Architekt Arcangelo Guglielmelli sie in die neue Fassade ein. Oberhalb der Freitreppe wurden die Statuen des heiligen Petrus und des heiligen Paulus 1671 von Andrea Falcone geschaffen.","d":"An der Fassade, oben auf der Freitreppe","foto":{"u":"../img/951355b4bf10.jpg","alt":"Die Fassade von San Paolo Maggiore mit den antiken Säulen","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"Die Fassade von San Paolo Maggiore mit den Säulen des Dioskurentempels."}},{"t":"Das Grab des heiligen Kajetan","x":"In dieser Basilika ist der heilige Kajetan von Thiene begraben, der Gründer der Theatiner, des Ordens, der die Kirche ab der zweiten Hälfte des 16. Jahrhunderts wieder aufbaute. Das ihm gewidmete Heiligtum ist Teil des Grundrisses der Kirche.","d":"Im Inneren der Basilika","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"Das Heiligtum des heiligen Kajetan von Thiene in der Basilika","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"Das Heiligtum des heiligen Kajetan von Thiene in der Basilika San Paolo Maggiore."}},{"t":"Die Sakristei von Solimena","x":"Die Sakristei der Basilika wurde von Francesco Solimena ausgestaltet, einem der bedeutendsten neapolitanischen Maler des 18. Jahrhunderts. Sie gehört zu den schönsten Teilen der Kirche.","d":"Hinter dem Hauptschiff, in der Sakristei","foto":{"u":"../img/4782e44ae33e.jpg","alt":"Die von Francesco Solimena freskierte Sakristei","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"Die Sakristei von San Paolo Maggiore mit den Fresken von Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Das Meisterwerk, das Caravaggio gleich nach seiner Ankunft in Neapel malte: die „Sieben Werke der Barmherzigkeit“, noch immer auf dem Altar, für den sie geschaffen wurden, nur wenige Schritte vom Duomo entfernt.","rac":"Der Pio Monte della Misericordia wurde 1602 von sieben jungen neapolitanischen Adligen gegründet, um Menschen in Not zu helfen. Es gibt ihn bis heute, im selben Palast aus dem 17. Jahrhundert an der Via dei Tribunali, und er setzt seine karitative Tätigkeit fort.\n\nDie achteckige Kirche wurde zwischen 1656 und 1671 nach einem Entwurf von Francesco Antonio Picchiatti erbaut. Auf dem Hauptaltar hängt das Gemälde, das sie weltberühmt gemacht hat: Caravaggios „Die sieben Werke der Barmherzigkeit“, gemalt zwischen 1606 und 1607 und mit 400 Dukaten bezahlt, einer enormen Summe. Caravaggio war erst seit wenigen Monaten in Neapel, auf der Flucht aus Rom nach einer Verurteilung wegen Mordes.\n\nDas Bild gefiel so sehr, dass die Bruderschaft 1613 beschloss, es dürfe „zu keinem Preis“ verkauft werden und müsse für immer in der Kirche bleiben. Ringsum, auf den anderen sechs Altären, hängen Gemälde weiterer Meister des neapolitanischen Seicento, jedes einem Werk der Barmherzigkeit gewidmet. Im Obergeschoss befindet sich die Gemäldegalerie des Pio Monte.","con":"Normalpreis 10 Euro, ermäßigt 8 Euro. Im Palast gibt es auch die kleine Empore, von der aus die Gouverneure des Pio Monte das Gemälde von oben betrachten konnten: Frag nach, ob sie im Besuch enthalten ist.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"Die achteckige Kuppel der Kirche des Pio Monte della Misericordia von unten gesehen","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"Die Kuppel der achteckigen Kirche des Pio Monte della Misericordia, der Blick nach oben."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Geschlossen am 25. Dezember und zu Ostern; am 24. und 31. Dezember und am 15. August schließt es um 14:30 Uhr."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Die sieben Werke der Barmherzigkeit","x":"Es ist eine riesige Leinwand, fast vier Meter hoch, und sie wirkt wie eine Nacht in einer Gasse von Neapel: eine Kreuzung voller Menschen, beleuchtet von einem seitlich einfallenden Licht, das die Körper aus der Dunkelheit herausmeißelt. Oben blickt die Madonna mit dem Kind, von zwei Engeln getragen, auf das herab, was die Menschen tun.\n\nDer Pio Monte wollte ein Werk, das alle sieben Werke der Barmherzigkeit vereint: die Hungrigen speisen, die Durstigen tränken, die Nackten kleiden, die Pilger beherbergen, die Kranken besuchen, die Gefangenen besuchen, die Toten begraben. Caravaggio malte sie alle in einer einzigen Szene, ohne Wunder: Es ist der Mensch, der dem Menschen hilft.\n\nEs war Caravaggios erstes Werk in Neapel und es veränderte die Malerei der Stadt: Die neapolitanischen Maler des 17. Jahrhunderts übernahmen sein Licht, seine von der Straße genommenen Figuren und sogar einige Details, wie den Mann von hinten im Vordergrund.","d":"Auf dem Hochaltar","foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggios Sieben Werke der Barmherzigkeit: Straßenszenen in einer dunklen Nacht","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Caravaggios Sieben Werke der Barmherzigkeit (1607): die gesamte Szene, unten die Menschen, oben die Madonna mit dem Kind."}},{"t":"So erkennst du die sieben Werke","x":"Suche die Szenen eine nach der anderen.\n\nRechts stillt eine junge Frau an ihrer Brust einen alten Mann hinter Gittern: Es sind Pero und ihr Vater Cimon, der im Gefängnis zum Hungertod verurteilt ist. Sie stehen für zwei Werke: die Hungrigen speisen und die Gefangenen besuchen. Achte auf den Milchtropfen im Bart des Alten.\n\nHinter ihnen trägt ein Mann einen Toten (man sieht nur die Füße) und ein Priester mit einer Fackel leuchtet ihm: die Toten begraben. Im Vordergrund links schneidet ein junger Ritter seinen Mantel für einen nackten Mann am Boden entzwei: Es ist der heilige Martin, die Nackten kleiden; daneben, in der dunkelsten Ecke, betet ein Gelähmter: die Kranken besuchen.\n\nGanz links zeigt ein Wirt einem Pilger mit einer Muschel am Hut, dem heiligen Jakobus, den Weg: die Pilger beherbergen. Im Hintergrund trinkt ein Mann aus einem Eselskinnbacken: Es ist Simson, die Durstigen tränken.","d":"Vor dem Gemälde, von links nach rechts","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"Caravaggios Gemälde über dem Hauptaltar des Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"Caravaggios Gemälde, wie du es in der Kirche siehst: über dem Altar, in der Kapelle des Pio Monte."}},{"t":"Die Madonna und die Engel","x":"Schau nach oben: Die Madonna mit dem Kind lehnt sich wie aus einem Fenster, vor zwei aufgehängten Laken, und zwei Engel umarmen sich im Flug. Sie scheinen weit entfernt von dem, was unten geschieht.\n\nAber beachte den Schatten, den sie auf die Gefängnismauer werfen: Caravaggio macht sie gegenwärtig, fast greifbar, in derselben Nacht wie die Menschen.\n\nDer Kunsthistoriker Roberto Longhi wählte genau dieses Detail für das Plakat der großen Ausstellung von 1951, die Caravaggio wiederentdeckte: schön, schrieb er, wie ein Raffael, aber genommen «aus der nackten Wahrheit von Forcella oder Pizzofalcone».","d":"Oben im Gemälde","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Detail: die Madonna mit dem Kind und die zwei fliegenden Engel","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Das Detail oben: die Madonna mit dem Kind, die sich hinauslehnt, und die zwei Engel, die sich im Flug umarmen."}},{"t":"Die anderen Altäre","x":"Rund um den Caravaggio hat die achteckige Kirche sechs weitere Altäre mit Gemälden neapolitanischer Maler des 17. Jahrhunderts: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino und Forlì.\n\nSuchen Sie die „Befreiung des heiligen Petrus“ von Battistello Caracciolo aus dem Jahr 1615: Er ist einer der Maler, die am meisten von Caravaggio gelernt haben, und das sieht man am Licht und am Dunkel. Dann „Der heilige Petrus erweckt Tabita“ von Fabrizio Santafede aus dem Jahr 1611.\n\nBetrachten Sie sie nach dem Caravaggio: Sie werden sofort verstehen, wie neu seine Leinwand für Neapel war.","d":"In den umliegenden Kapellen","foto":{"u":"../img/b58919c38c63.jpg","alt":"Ein Gemälde des 17. Jahrhunderts mit dem barmherzigen Samariter","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"Der barmherzige Samariter von Giovan Vincenzo Forlì auf einem der Altäre rund um Caravaggios Sieben Werke."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo und Schatz des San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Die Kathedrale von Neapel und die Schatzkapelle, in der die Ampulle mit dem Blut des San Gennaro aufbewahrt wird.","rac":"Die Kathedrale, Santa Maria Assunta geweiht, wurde 1294 von Karl von Anjou an der Stelle in Auftrag gegeben, an der zwei antike Basiliken standen: die Stefania, die abgerissen wurde, und Santa Restituta, die als Kapelle erhalten blieb. Man entdeckt sie ganz unvermittelt an der Via Duomo, der Straße, die in den ersten Jahrzehnten nach der Einigung Italiens angelegt wurde.\n\nSie ist gotisch, mit lateinischem Kreuzgrundriss und drei Schiffen, und hat eine Kassettendecke aus geschnitztem und vergoldetem Holz. Im Inneren überlagern sich die Jahrhunderte: die frühchristliche Basilika Santa Restituta, das älteste Baptisterium des Abendlandes, die Renaissance-Krypta des Succorpo, die barocke Schatzkapelle und unter allem die Überreste der griechisch-römischen Stadt.\n\nIm Duomo, in einer Nische der Schatzkapelle, wird die Ampulle mit dem Blut aufbewahrt, das die Überlieferung San Gennaro zuschreibt. Dreimal im Jahr (am Samstag vor dem ersten Sonntag im Mai, am 19. September und am 16. Dezember) wartet man auf die Verflüssigung. Die Reliquien sind seit 1601 einer weltlichen Einrichtung anvertraut, der Deputazione der Schatzkapelle des San Gennaro.","con":"An den Tagen der Verflüssigung ist der Duomo schon am frühen Morgen voll: Wenn du dabei sein möchtest, komm früh.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"Die Fassade des Duomo von Neapel","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"Die Fassade des Duomo an der Via Duomo. Die Schatzkapelle ist die dritte auf der rechten Seite."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Eintritt frei, Reservierung erforderlich. Die Führungen beginnen jede Stunde."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Das Portal des San Gennaro","x":"Bleiben Sie vor der Fassade stehen: Sie ist etwa fünfzig Meter hoch und hat drei Portale. Sie wurde im gotischen Stil wiederaufgebaut, nachdem das Erdbeben von 1349 die angiovinische Fassade und den Glockenturm zerstört hatte.\n\nDas rechte Portal bleibt fast das ganze Jahr über geschlossen: Es öffnet sich nur zu den Festen des San Gennaro und bei außergewöhnlichen Anlässen. Wenn Sie es geöffnet vorfinden, sind Sie an einem besonderen Tag gekommen.\n\nDie Kathedrale, geweiht der Santa Maria Assunta, wurde 1294 von Karl von Anjou an der Stelle zweier antiker Basiliken in Auftrag gegeben. Im Inneren hat sie einen lateinischen Kreuzgrundriss mit drei Schiffen und eine Kassettendecke aus geschnitztem, vergoldetem Holz.","d":"An der Fassade, rechts","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"Das gotische Portal des Doms von Neapel","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Das gotische Portal des Doms an der Fassade."}},{"t":"Die Schatzkapelle","x":"Mehr als eine Kapelle ist sie eine Kirche in der Kirche: die dritte Kapelle rechts, barock, aus der ersten Hälfte des 17. Jahrhunderts, mit griechischem Kreuzgrundriss und einer doppelschaligen Kuppel. Man betritt sie durch das große Bronzetor von Cosimo Fanzago.\n\nHier werden die Silberbüste des San Gennaro und die Ampullen mit seinem Blut aufbewahrt: Jedes Jahr erwartet die Stadt das „Wunder“ der Verflüssigung, und die Menschenmenge füllt die Kathedrale.\n\nDer Schatz, der dem Heiligen im Lauf der Jahrhunderte geschenkt wurde (Juwelen, Silberarbeiten, Kunstwerke), kann im Museo del Tesoro di San Gennaro besichtigt werden, dessen Eingang außerhalb des Doms liegt.","d":"Dritte Kapelle rechts","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"Die Kuppel der Schatzkapelle, mit dem Paradies ausgemalt","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Blicken Sie nach oben: In der Kuppel der Schatzkapelle ist das Paradies zu sehen, das Giovanni Lanfranco gemalt hat."}},{"t":"Santa Restituta","x":"Als Karl von Anjou den Dom errichten ließ, wurde eine der beiden antiken Basiliken, die hier standen, abgerissen, die andere blieb als Seitenkapelle erhalten: Es ist Santa Restituta im linken Seitenschiff.\n\nDer Überlieferung nach wurde sie von Kaiser Konstantin in Auftrag gegeben: Sie ist eines der wichtigsten Zeugnisse der frühchristlichen Kunst in Neapel. Sie hat drei Schiffe und beherbergt Werke von Luca Giordano sowie Skulpturen aus dem 14. Jahrhundert.\n\nVon hier steigt man hinab in den archäologischen Bereich unter der Kathedrale, wo man Schichten der Geschichte übereinander sieht: griechisch-römische und frühchristliche Überreste.","d":"Im linken Seitenschiff","foto":{"u":"../img/5abf53aec271.jpg","alt":"Ein Mosaik der thronenden Madonna in der Basilika Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Ein Mosaik der thronenden Madonna in Santa Restituta: der ältesten Basilika, die als Kapelle des Doms erhalten blieb."}},{"t":"Das Baptisterium San Giovanni in Fonte","x":"Rechts der Apsis liegt ein kleiner Raum mit einer gewaltigen Geschichte: das Baptisterium San Giovanni in Fonte, das als das älteste des Abendlandes gilt.\n\nVerweilen Sie ein paar Minuten in Stille: Sie befinden sich an einem der ältesten christlichen Orte Europas, die noch stehen, aus der Zeit, als das römische Neapel christlich wurde.\n\nDas Baptisterium und der archäologische Bereich unter dem Dom erzählen gemeinsam von den ersten Jahrhunderten der christlichen Stadt.","d":"Rechts der Apsis","foto":{"u":"../img/994ed22c6902.jpg","alt":"Das Innere des Baptisteriums San Giovanni in Fonte mit dem Taufbecken in der Mitte","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Das Baptisterium San Giovanni in Fonte: in der Mitte des Fußbodens das Taufbecken."}},{"t":"Das Succorpo","x":"Unter dem Hauptaltar befindet sich die Krypta des Doms, die Cappella del Succorpo, auch Carafa-Kapelle genannt: Kardinal Oliviero Carafa ließ sie errichten, um dort die Reliquien des San Gennaro zusammen mit denen von 51 weiteren Heiligen aufzubewahren.\n\nDer Architekt Giovan Tommaso Malvito entwarf sie als kleine Basilika: drei Schiffe, getrennt durch antike Säulen mit ionischen Kapitellen, seitliche Nischen und eine Kapelle am Ende.\n\nWeißer Marmor, gedämpftes Licht und Stille: Es ist die Renaissance im Inneren der gotischen Kathedrale.","d":"Unter dem Hauptaltar","foto":{"u":"../img/876cd614ab8d.jpg","alt":"Das Innere des Succorpo di San Gennaro mit Marmorsäulen und Intarsienboden","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Das Succorpo unter dem Presbyterium des Doms: Säulen und Boden aus Marmor und im Hintergrund der Altar mit den Reliquien des San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Komplex der Girolamini","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Gegenüber der Kathedrale: eine Barockkirche namens «Domus Aurea», zwei Kreuzgänge, eine Gemäldegalerie und die älteste öffentliche Bibliothek Neapels.","rac":"An der via Duomo, gegenüber der Kathedrale, entstand im 16. Jahrhundert der Komplex der Girolamini für die Väter des Oratoriums des heiligen Philipp Neri, die sogenannten Girolamini. Seit 1866 ist er ein Nationaldenkmal und vereint die Kirche, die Kreuzgänge, die Gemäldegalerie und die Bibliothek.\n\nDie Kirche, die dem heiligen Philipp Neri geweiht ist, ist wegen ihres goldenen Barockschmucks als «Domus Aurea» bekannt. Die Gemäldegalerie gilt als die erste öffentliche Pinakothek der Stadt und bewahrt Werke von Meistern wie Battistello Caracciolo, Jusepe de Ribera und Luca Giordano. Die Bibliothek, die in der zweiten Hälfte des 16. Jahrhunderts für die Öffentlichkeit geöffnet wurde, ist die älteste öffentliche Bibliothek Neapels.\n\nDer Komplex hat eine lange Zeit der Restaurierungen hinter sich: Die Kirche wurde am 21. März 2024 wiedereröffnet, und laut Presseberichten wurden 2026 auch die Sala Camino und die Sala Vico der Bibliothek wiedereröffnet. Die Wiedereröffnungen erfolgen schrittweise: Nicht alle Räume sind gleichzeitig zu besichtigen.","con":"Prüfe vor deinem Besuch auf der offiziellen Website, was geöffnet ist: Kirche, Kreuzgänge, Gemäldegalerie und Bibliothek haben unterschiedliche Öffnungszeiten, die sich ändern können.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"Die abendlich beleuchtete Fassade der Girolamini","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"Die Fassade der Kirche der Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Kirche. Montags geschlossen."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Kirche. Samstags, sonntags und an Feiertagen."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"Die Kirche „Domus Aurea“","x":"Die Kirche San Filippo Neri wird wegen ihres reichen Barockschmucks Domus Aurea genannt, das „goldene Haus“. Sie ist einer der bedeutendsten Andachtsorte der Stadt.","d":"In der Kirche, Eingang von der Via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"Das Kirchenschiff der Girolamini-Kirche mit den goldenen Verzierungen","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"Die Girolamini-Kirche, wegen ihres reichen Schmucks die „Domus Aurea“."}},{"t":"Die Gemäldegalerie","x":"Sie gilt als die erste öffentliche Gemäldegalerie Neapels. Sie vereint Gemälde von Meistern des 17. Jahrhunderts wie Battistello Caracciolo, Jusepe de Ribera und Luca Giordano. Man erreicht sie vom Orangenkreuzgang aus, im ersten Stock des Klosters.","d":"Erster Stock des Klosters, vom Orangenkreuzgang aus","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Kopf einer Heiligen, gemalt von Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Ein Gemälde aus der Quadreria dei Girolamini: Kopf einer Heiligen von Massimo Stanzione (17. Jahrhundert)."}},{"t":"Die älteste Bibliothek Neapels","x":"Die Bibliothek ist die älteste öffentliche Bibliothek der Stadt und nach der Malatestiana in Cesena die zweitälteste Italiens. Sie ist auf Theologie, Philosophie, Kirchengeschichte und Kirchenmusik spezialisiert und besitzt rund 159.700 alte und moderne Bände. Zu den historischen Sälen gehört der Giambattista Vico gewidmete, der hier studierte.","d":"Eingang Via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"Der Saal der Girolamini-Bibliothek mit den Holzregalen","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"Der Saal der Girolamini-Bibliothek, der ältesten öffentlichen Bibliothek Neapels."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"Banksys Madonna mit der Pistole","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Eine Madonna von Banksy mit einer Pistole anstelle des Heiligenscheins, durch Glas geschützt, im Herzen des Decumano Maggiore.","rac":"Banksy kam 2010 nach Neapel: Es war das erste Mal, dass er in Italien arbeitete. Mit Schablonen hinterließ er, wahrscheinlich in derselben Nacht, zwei Werke an sehr belebten Orten der Altstadt, beide mit einem religiösen Bild und einer direkten Botschaft. Eines, in der Via Benedetto Croce, wurde von einem anderen Künstler übermalt; dieses hier hat überlebt, und deshalb gilt es als das einzige Wandbild von Banksy in Italien.\n\nNeben dem Werk befindet sich ein alter Bildstock mit der Madonna mit Kind: Die beiden Bilder so nah beieinander scheinen miteinander zu sprechen.\n\nAn der Piazzetta dei Girolamini hat Banksy an einer Fassade am Decumano Maggiore eine Madonna mit einer Pistole anstelle des Heiligenscheins hinterlassen. Heute ist sie durch eine Glasscheibe geschützt. Das offizielle Tourismusportal der Stadt nimmt sie in seine Route zur Street Art der Altstadt auf.","con":"Schauen Sie nach oben: Das Werk befindet sich oberhalb des Straßenniveaus, hinter Glas.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Das Gesicht von Banksys Madonna als weiße Schablonengrafik auf dunklem Grund","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Das Gesicht von Banksys Madonna: die weiße Schablonengrafik auf dunklem Grund, aus der Nähe."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"Die Madonna mit der Pistole","x":"Sieh dir die Mauer an: Weiß auf schwarzem Grund, mit Schablone gemacht, eine Madonna mit gen Himmel geöffneten Armen. Doch anstelle des Heiligenscheins ist über ihrem Kopf eine Pistole.\n\nBanksy, der englische Straßenkünstler aus Bristol, malte sie 2010 in Neapel, wahrscheinlich nachts und in wenigen Sekunden, mit seinen Schablonen. Es war Banksys erstes Werk in Italien.\n\nDie Botschaft wird nicht erklärt: Bei einem flüchtigen Blick wirkt es wie ein Heiligenbild, ist es aber nicht. Heiliges und Gewalt, Glaube und Waffen: Jeder liest es auf seine Weise.","d":"An der Mauer des kleinen Platzes","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"Banksys Madonna als Schablonenbild an der Mauer der Piazza Gerolomini, aus der Nähe betrachtet","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"Banksys Madonna, als Schwarz-Weiß-Schablonenbild an einer Ecke der Mauer der Piazza Gerolomini."}},{"t":"Der Schrein nebenan","x":"Schauen Sie nun neben das Werk: Dort befindet sich ein kleiner Heiligenschrein mit der Madonna mit Kind, wie man ihn in vielen Straßen Neapels findet, gemalt vor wer weiß wie vielen Jahrhunderten.\n\nDie beiden Madonnen, nebeneinander, scheinen sich anzusehen: Die alte scheint die von Banksy ratlos zu betrachten. Dieser Dialog macht das Werk so neapolitanisch.\n\nGehen Sie einen Schritt zurück und betrachten Sie beide zusammen: Es ist das schönste Foto, das Sie mit nach Hause nehmen können.","d":"Direkt neben dem Werk","foto":{"u":"../img/3a7788eec560.jpg","alt":"Banksys Madonna an der Mauer und daneben der Votivschrein mit der Madonna mit Kind","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"Links Banksys Madonna, rechts, an der Mauer befestigt, der Schrein mit der Madonna mit Kind: die beiden heiligen Bilder nebeneinander."}},{"t":"Ein Banksy unter Glas","x":"Im Jahr 2010 hinterließ Banksy in Neapel zwei Werke, wahrscheinlich in derselben Nacht. Das andere, in der Via Benedetto Croce, nahm den Konsumismus auf die Schippe: Es griff Berninis „Verzückung der seligen Ludovica Albertoni“ auf, doch die Heilige erschien in Verzückung nach einer Fast-Food-Mahlzeit.\n\nDieses Werk wurde von einem anderen neapolitanischen Straßenkünstler übermalt, der nicht wusste, was er da auslöschte. Deshalb nennt der FAI dieses an der Piazza Gerolomini als das einzige Banksy-Wandbild in Italien.\n\nHeute ist es durch eine Plexiglasvitrine geschützt, die es wenigstens vor Vandalen bewahrt.","d":"Vor dem Werk","foto":{"u":"../img/98a6548f2f8d.jpg","alt":"Banksys Madonna, mit Schablone an die Wand einer Gasse gemalt","aut":"ho visto nina volare","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"Banksys Madonna an der Gassenwand, auf einem Foto von 2012 (vor der Schutzvitrine)."}},{"t":"Anfahrt und Fotomotive","x":"Das Werk befindet sich an einer Mauer der kleinen Piazza Gerolomini, die auf die Via dei Tribunali blickt.\n\nDie Vitrine schützt das Werk, kann aber das Licht spiegeln: Für ein Foto ohne Reflexe stell dich am besten leicht seitlich. Der Ort ist immer zugänglich und kostenlos.\n\nVon hier aus ist die Madonna der Via Benedetto Croce, das verlorene Werk, neun Gehminuten entfernt, entlang der Route, die an Sansevero, Napoli Sotterranea und San Gregorio Armeno vorbeiführt.","d":"Piazza Gerolomini, an der Via dei Tribunali","foto":{"u":"../img/f2e6151db7a7.jpg","alt":"Die Piazza Girolamini in Schwarzweiß mit der Fassade der Kirche","aut":"Rodrigo Silva","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Girolamini_-_Naples_-_Italy_(15036436065).jpg","dida":"Die Piazza Girolamini mit der Fassade der Kirche der Girolamini."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini und die griechischen Mauern","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Ein Platz voller Cafés und Studenten mit Blick in die Vergangenheit: hinter einer Balustrade sieht man die griechischen Mauern von Neapolis.","rac":"Die Piazza Bellini liegt am großen Decumanus und ist einer der belebtesten Plätze der Altstadt, dank der vielen Lokale, die sich zu ihr öffnen. Man muss nur nach unten blicken, hinter die Balustrade, um in einem tiefer gelegenen Bereich einen Abschnitt der Mauern des griechischen Neapolis zu sehen, die aus dem 4. Jahrhundert v. Chr. stammen. Sie wurden 1954 entdeckt.\n\nWenige Schritte entfernt liegt das Conservatorio di San Pietro a Majella.","con":"Zehn Minuten genügen: Betrachte die Mauern von oben und gönn dir dann eine Pause in einem der Lokale am Platz.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"Piazza Bellini mit ihren Tischen und dem Grün","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, der Treffpunkt der Altstadt."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Die griechischen Mauern","x":"Unterhalb des Platzniveaus sieht man die Reste der Verteidigungsmauern des griechischen Neapolis aus Tuffblöcken. Sie wurden 1954 entdeckt und gehören zum Befestigungssystem der antiken Stadt. Es ist keine Rekonstruktion: Es sind originale Steine.","d":"Hinter der Balustrade, im tiefer gelegenen Bereich","foto":{"u":"../img/4801d5111d9f.jpg","alt":"Die Tuffblöcke der griechischen Mauern unterhalb des Platzniveaus","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Die griechischen Mauern von Neapolis an der Piazza Bellini: originale Tuffblöcke."}},{"t":"Der Platz heute","x":"Rund um die Mauern gibt es Cafés, Buchhandlungen und Lokale, die von Studenten und Einheimischen besucht werden. Es ist einer der Orte der Altstadt, an denen das Antike und der Alltag am nächsten beieinander liegen.","d":"Rund um den Platz","foto":{"u":"../img/133ed975e61b.jpg","alt":"Die Piazza Bellini mit Bäumen, Gebäuden und Tischchen","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"Die Piazza Bellini heute, zwischen Cafés und Buchhandlungen."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port’Alba und die Straße der Buchhändler","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Ein Tor von 1625 und, jenseits des Bogens, eine Gasse mit Buchhändlern und Musikgeschäften, die zur Piazza Bellini führt.","rac":"Port'Alba ist eines der alten Stadttore. Es öffnet sich an einer Ecke der Piazza Dante und trägt den Namen des spanischen Vizekönigs Antonio Álvarez de Toledo, Herzog von Alba, der es 1625 anstelle einer provisorischen Öffnung errichten ließ, um den Durchgang von einer Seite der Stadt zur anderen zu erleichtern. Sein heutiges Aussehen verdankt es den Arbeiten Ende des 18. Jahrhunderts, die Ferdinand IV. von Bourbon in Auftrag gab.\n\nJenseits des Tores liegt die via Port'Alba, eine Fußgängergasse, die für ihre Buchhandlungen und Musikgeschäfte bekannt ist und bis zur Piazza Bellini führt.","con":"Geh unter dem Bogen hindurch und stöbere an den Bücherständen: So kommst du am einfachsten von der Piazza Dante zur Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"Der Bogen von Port'Alba, historischer Eingang zur Altstadt","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, das Stadttor aus dem 16. Jahrhundert zur Altstadt."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"Das Tor von 1625","x":"Das Tor wurde 1625 auf Wunsch des Herzogs von Alba, des spanischen Vizekönigs, errichtet. Auf dem Wappen erkennt man die Wappen von König Philipp III., der Stadt Neapel und des Vizekönigs. Heute wird das Tor teilweise von der Kolonnade der Piazza Dante verdeckt.","d":"In einer Ecke der Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"Das Tor Port'Alba mit dem Wappen","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, das Tor von 1625, das der Herzog von Alba in Auftrag gab."}},{"t":"Die Straße der Buchhändler","x":"Die Gasse, die durch das Tor führt, ist berühmt für ihren Büchermarkt: Buchhandlungen, Stände und Musikinstrumentengeschäfte, bis hin zur Piazza Bellini.","d":"Hinter dem Tor, in Richtung Piazza Bellini","foto":{"u":"../img/60d6526dd441.jpg","alt":"Das Tor Port'Alba mit den Geschäften und Ständen an seinem Fuß","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Port%27Alba,_Naples_01.jpg","dida":"Port'Alba, das Tor, an dem die Via dei Librai (die Straße der Buchhändler) beginnt."}}],"gal":[],"leg":"Eine Legende erzählt von einer jungen Frau namens Maria, die zur Zeit der spanischen Inquisition der Hexerei beschuldigt und in einem am Tor aufgehängten Käfig dem Tod überlassen wurde.","fc":null,"col":null},{"id":22,"s":"mann","n":"Archäologisches Nationalmuseum (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"Eines der größten archäologischen Museen der Welt: die Schätze von Pompeji und Herculaneum, die Sammlung Farnese und das berühmte Alexandermosaik.","rac":"Das Archäologische Nationalmuseum befindet sich im Palazzo degli Studi, der 1585 erbaut wurde. 1777 brachte König Ferdinand IV. von Bourbon die Sammlung Farnese dorthin, die er von seiner Mutter Elisabeth Farnese geerbt hatte. Mit der Rückkehr der Bourbonen im Jahr 1816 wurde es zum Real Museo Borbonico (Königlich-Bourbonisches Museum); nach der Einigung Italiens wurde es Nationalmuseum. Die Gemälde wurden 1957 nach Capodimonte gebracht, und seitdem ist es ein reines Antikenmuseum.\n\nEs zeigt rund 18.000 Fundstücke: die vesuvianischen Sammlungen (Fresken, Mosaike, Gegenstände des Alltagslebens, das Modell von Pompeji, die Villa der Papyri), die Skulpturen und Gemmen der Farnese, das Geheimkabinett, die Münzsammlung und eine der bedeutendsten ägyptischen Sammlungen der Welt.\n\nDas berühmteste Stück ist das Alexandermosaik, das 1831 im Haus des Fauns in Pompeji gefunden wurde: Es zeigt die Schlacht bei Issos zwischen Alexander dem Großen und Dareios III. und besteht aus etwa anderthalb Millionen Mosaiksteinchen.","con":"Wenn Sie wenig Zeit haben, wählen Sie drei Dinge: das Alexandermosaik, den Farnesischen Herkules und das Geheimkabinett. Um alles zu sehen, brauchen Sie mindestens zwei bis drei Stunden. Prüfen Sie die Öffnungszeiten, bevor Sie kommen.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Pompejanisches Fresko im Archäologischen Nationalmuseum","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Ein pompejanisches Fresko im MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Kasse bis 18:30 Uhr"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"Das Alexandermosaik","x":"Das große Mosaik wurde 1831 im Haus des Fauns in Pompeji gefunden, misst etwa 5,82 mal 3,13 Meter und besteht aus rund anderthalb Millionen Steinchen. Es zeigt die Schlacht bei Issos (333 v. Chr.) zwischen Alexander dem Großen und Dareios III. von Persien.","d":"Im Zwischengeschoss, in der Abteilung der Mosaiken von Pompeji","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"Das große Mosaik der Schlacht zwischen Alexander und Dareios","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"Das Alexandermosaik aus dem Haus des Fauns in Pompeji."}},{"t":"Die Sammlung Farnese","x":"Die Sammlung wurde von der Familie Farnese für ihren Palast in Rom zusammengetragen und umfasst monumentale Statuen wie den Farnesischen Herkules, etwa drei Meter hoch und in den Caracalla-Thermen gefunden, sowie den Farnesischen Stier.","d":"Im Erdgeschoss","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"Die Statue des Farnesischen Herkules, auf die Keule gestützt","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"Der Farnesische Herkules, gefunden in den Caracalla-Thermen."}},{"t":"Das Geheimkabinett","x":"Hier sind erotische Kunstwerke aus Pompeji und Herculaneum zu sehen. Es hat einen separaten Eingang und erfordert oft eine Reservierung für ein bestimmtes Zeitfenster: Fragen Sie an der Kasse.","d":"Im Zwischengeschoss","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, Museum für zeitgenössische Kunst","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Ein vom Architekten Álvaro Siza umgebauter Palast, der Werke von Clemente, Kapoor, Serra, Horn und anderen Meistern der zeitgenössischen Kunst beherbergt.","rac":"Das MADRE, das Museum für zeitgenössische Kunst Donnaregina, befindet sich im Palazzo Donnaregina, nur wenige Schritte vom Dom und vom Schatz des San Gennaro entfernt. Das Gebäude wurde vom portugiesischen Architekten Álvaro Siza umgebaut, und das Museum, das von der Stiftung Donnaregina für zeitgenössische Kunst geführt wird, wurde 2005 eröffnet.\n\nDas erste Obergeschoss ist Werken gewidmet, die eigens für die Räume geschaffen wurden, von Künstlern wie Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long und Mimmo Paladino. Zur Sammlung gehören außerdem Richard Serra, Sol LeWitt und Jeff Koons, und das Museum veranstaltet Wechselausstellungen. Es ist ein bewusster Kontrast zum antiken Neapel, das es umgibt.","con":"Suchen Sie «Spirits» von Rebecca Horn: Es sind Gusseisenkopien der Schädel vom Friedhof Fontanelle. Das Museum ist dienstags geschlossen, und wegen Bauarbeiten sind einige Säle im zweiten Stock vorübergehend gesperrt: Informieren Sie sich vor Ihrem Besuch auf der Website.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"Der weiße Innenhof des Museums Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"Das Museum Madre, zeitgenössische Kunst in Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Dienstags geschlossen. Letzter Einlass ist eine Stunde vor Schließung."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Sonntag. Letzter Einlass ist eine Stunde vor Schließung."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"„Ave Ovo“ von Francesco Clemente","x":"Ein Majolikaboden und ein monumentales Fresko, 2005 für das Museum geschaffen, füllen zwei Säle auf zwei Etagen.","d":"In den Clemente gewidmeten Sälen","foto":null},{"t":"„Spirits“ von Rebecca Horn","x":"Die Künstlerin hat die Schädel des Friedhofs der Fontanelle, die neapolitanischen „capuzzelle“, in Gusseisen nachgebildet. Eine Verbindung zwischen zeitgenössischer Kunst und dem Neapel des einfachen Volkes.","d":"Im Saal von Rebecca Horn","foto":null},{"t":"Sizas Architektur","x":"Siza hat die drei Etagen des Palazzo saniert, dabei die historische Anlage bewahrt und moderne Räume für große Installationen eingefügt.","d":"Im ganzen Museum","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"U-Bahn-Station Toledo","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Haltestelle der Linie 1, die als eine der schönsten Europas gilt: Mosaike, blaue Keramik und der „Lichtkrater“ von Robert Wilson.","rac":"Die Station Toledo gehört zu den „Stationen der Kunst“ („Stazioni dell'Arte“), dem Projekt, bei dem Architekten und Künstler mit der Gestaltung der Haltestellen der Linie 1 betraut wurden – mit über 250 Kunstwerken. Sie wurde vom katalanischen Architekten Oscar Tusquets Blanca entworfen und am 17. September 2012 eingeweiht. Der Eingang in der Via Diaz besteht aus drei sechseckigen Bauten, die mit blauen und ockerfarbenen Fliesen verkleidet sind und Licht in die Eingangshalle bringen.\n\nBeim Hinabgehen begegnet man von Tusquets entworfenen Reliefwellen, Werken von Robert Wilson (darunter „Crater de luz“, ein Lichtkrater) und den Mosaiken von William Kentridge. Die Station wurde schon mehrfach zu den schönsten Europas gezählt.\n\nUm sie zu sehen, genügt es, die U-Bahn zu nehmen: Für den Weg hinunter zu den Bahnsteigen braucht man einen Fahrschein.","con":"Fahren Sie bis zur tiefsten Ebene hinunter und blicken Sie nach oben: Dort wirkt das Licht des Kraters am schönsten. Zum Eintritt benötigen Sie ein Ticket; die Betriebszeiten finden Sie auf der Website der ANM.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"Der Bahnsteig der Station Toledo im Untergrund","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"Der Bahnsteig der Station Toledo."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Betriebszeiten der Linie 1: vom ersten bis zum letzten Zug."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Betriebszeiten der Linie 1: vom ersten bis zum letzten Zug."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Robert Wilsons „Crater de luz“","x":"Ein Lichtkrater von Robert Wilson prägt die Identität der Station. Das Werk verändert sich mit dem Licht und verleiht dem Abstieg eine fast theatralische Wirkung.","d":"In den unterirdischen Ebenen des Bahnhofs","foto":null},{"t":"Die Mosaike von William Kentridge","x":"Entlang des Weges sind Mosaike des südafrikanischen Künstlers William Kentridge zu sehen, die Teil des Programms der Kunststationen sind.","d":"Auf dem Weg zu den Gleisen","foto":null},{"t":"Der blaue Eingang an der Via Diaz","x":"Drei sechseckige Strukturen, verkleidet mit blauen und ockerfarbenen Fliesen, die Licht in das Atrium lassen. Die beiden Farben sind der rote Faden der gesamten Station.","d":"Am Eingang an der Via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, der letzte Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"Sechs Minuten von Ceraldi entfernt, in der Via Toledo, das letzte Gemälde, das Caravaggio malte, wenige Wochen vor seinem Tod: das Martyrium der heiligen Ursula.","rac":"Die Gallerie d'Italia von Intesa Sanpaolo befinden sich in der Via Toledo 177, in dem Gebäude, das einst Sitz des Banco di Napoli war und Ende der Dreißigerjahre des 20. Jahrhunderts von Marcello Piacentini entworfen wurde; die neue Gestaltung stammt vom Architekten Michele De Lucchi. Das Museum wurde hier 2022 eröffnet und trat an die Stelle des nahe gelegenen Palazzo Zevallos Stigliano.\n\nDas Meisterwerk der Sammlung ist das Martyrium der heiligen Ursula von Caravaggio aus dem Jahr 1610, das als das letzte Gemälde des Malers gilt. Drumherum gibt es drei Rundgänge: neapolitanische Kunst vom 17. bis zum 20. Jahrhundert, eine Sammlung attischer und großgriechischer Keramik und eine Auswahl von Werken des 20. Jahrhunderts.","con":"Normalpreis 8 Euro, ermäßigt 4 Euro; kostenlos für Personen unter 26 Jahren und für alle am ersten Sonntag im Monat. Montags geschlossen; letzter Einlass eine Stunde vor Schließung.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Ein Saal der Gallerie d'Italia mit Gemälden an gelben Wänden","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Ein Saal der Gallerie d'Italia in Neapel mit Gemälden aus dem 17. Jahrhundert."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Das Martyrium der heiligen Ursula","x":"Es ist eine enge, dunkle Szene, fast ohne Hintergrund: Wir befinden uns im Zelt von Attila, dem König der Hunnen. Ursula, eine Prinzessin, hat ihn zurückgewiesen, und er hat ihr soeben einen Pfeil in die Brust geschossen. Sie neigt den Kopf zum Pfeil; drei Männer eilen herbei, um sie zu stützen. Der König scheint seine Tat schon zu bereuen.\n\nSuchen Sie das Gesicht hinter der Heiligen: Es ist Caravaggio selbst, der sich unter den Zeugen gemalt hat. Und beachten Sie die Hand, die sich zwischen der Heiligen und dem König ausstreckt, als wolle sie den Pfeil aufhalten: Sie ist bei der Restaurierung 2003-2004 wieder zum Vorschein gekommen.\n\nIn Auftrag gegeben hat es der genuesische Fürst Marcantonio Doria, dessen Familie die heilige Ursula als Schutzpatronin hatte. Es ist das späteste Gemälde Caravaggios, das wir kennen: Es wurde im Mai 1610 vollendet, gut einen Monat vor seinem Tod.","d":"Im Raum, der Caravaggio gewidmet ist","foto":{"u":"../img/62ba7427c200.jpg","alt":"Caravaggios Martyrium der heiligen Ursula: die Heilige und der König im Moment des Pfeilschusses","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Das Martyrium der heiligen Ursula (1610): Der König trifft die Heilige aus nächster Nähe mit dem Pfeil."}},{"t":"Das Bild in der Sonne","x":"Caravaggio malte das Bild in Eile, vielleicht weil er kurz davorstand, nach Rom aufzubrechen, um die Begnadigung des Papstes zu erlangen. Der Beauftragte der Doria in Neapel, Lanfranco Massa, ließ die Leinwand liefern, als der Firnis noch nicht trocken war, und stellte sie in die Sonne, damit sie schneller trocknete: Der sehr dick aufgetragene Firnis wurde beschädigt. Massa selbst berichtete davon in einem Brief vom Mai 1610.\n\nDas Gemälde gelangte nach Genua, ging dann von Erbe zu Erbe, landete in einer Villa in Eboli und wurde anderen Malern zugeschrieben. Erst in den 1980er-Jahren bestätigte die Entdeckung von Massas Brief mit Sicherheit, dass es von Caravaggio stammt.\n\n2025 hat eine neue Restaurierung drei Köpfe wieder zum Vorschein gebracht, die die Zeit hatte verschwinden lassen.","d":"Vor dem Gemälde","foto":{"u":"../img/6a999eeecae6.jpg","alt":"Caravaggios Gemälde in einem Saal des Palazzo Zevallos, mit verzierter Decke","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Das Martyrium der heiligen Ursula, ausgestellt in einem Saal des Palazzo Zevallos Stigliano, dem Sitz der Gallerie d’Italia."}},{"t":"Der Palast des Banco di Napoli","x":"Bevor Sie zu den Sälen hinaufgehen, sehen Sie sich um: Sie befinden sich in dem Palast, der einst der Sitz des Banco di Napoli war und Ende der 1930er-Jahre von Marcello Piacentini entworfen wurde.\n\nDer Architekt Michele De Lucchi hat ihn mit einer modernen Ausstattung in ein Museum verwandelt: Die großen Säle der Bank beherbergen heute drei Rundgänge, von der neapolitanischen Kunst des 17. Jahrhunderts bis zum 20. Jahrhundert, darunter eine reiche Sammlung griechischer Vasen und Vasen aus Magna Graecia.\n\nDas Museum wurde 2022 eröffnet und setzt die Tätigkeit des Palazzo Zevallos Stigliano fort, der von 1999 bis 2022 nur wenige Schritte von hier entfernt geöffnet war.","d":"Beim Eintreten, in der großen Halle","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"Die Steinfassade des Palazzo del Banco di Napoli an der Via Toledo mit der Europaflagge","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Der Palazzo del Banco di Napoli an der Via Toledo, Sitz der Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Spanische Viertel","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Ein Netz enger Gassen, das im 16. Jahrhundert für die spanischen Soldaten entstand und heute eines der lebendigsten und meistfotografierten Viertel Neapels ist.","rac":"Die Spanischen Viertel entstanden 1536 auf Wunsch des spanischen Vizekönigs Pedro de Toledo, um die Garnisonen unterzubringen, die für Ordnung sorgen sollten. Die Hauptstraße, die Via Toledo, trägt seinen Namen. Das Viertel ist ein Raster enger Gassen zwischen der Via Toledo, dem Corso Vittorio Emanuele und dem Monte Echia und umfasst die Gebiete Avvocata, Montecalvario und San Ferdinando.\n\nDer spanische Ursprung lebt noch in den Straßennamen fort, etwa in der Via della Trinità degli Spagnoli, wo die Kirche Santa Maria del Pilar steht. In den Gassen gibt es Werkstätten, aufgehängte Wäsche, kleine Altäre und viele Wandbilder.\n\nDas berühmteste ist das Maradona-Wandbild am Largo Maradona in der Via Emanuele De Deo: Es wurde 1990 von Mario Filardi geschaffen und im Laufe der Jahre mehrmals restauriert. Es ist eine Station der Tour „Das Meer und die Burgen“, die ein eigenes Infoblatt hat.","con":"Starte an der Piazza Carità und wage dich tagsüber in die Gassen. Wie in jedem belebten Viertel solltest du Tasche und Handy gut bei dir behalten. Geh langsam: Die Details verstecken sich in den Hauseingängen und auf den Wandbildern.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"Eine Gasse der Spanischen Viertel mit dem Maradona-Wandbild und Fahnen","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"In den Spanischen Vierteln: das Maradona-Wandbild zwischen den Fahnen."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"Das Raster der Gassen","x":"Der Stadtplan ist ein regelmäßiges Raster aus engen Gassen, das zur Unterbringung der spanischen Soldaten entstand. Beim Spazieren sieht man aufgehängte Wäsche, kleine Straßenaltäre und Werkstätten: Das Viertelleben spielt sich auf der Straße ab.","d":"In den Gassen westlich der Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"Eine enge Gasse in den Spanischen Vierteln","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"Eine der geraden, schmalen Gassen im Raster der Spanischen Viertel."}},{"t":"Das Maradona-Wandbild und Largo Maradona","x":"In der Via Emanuele De Deo wurde ein alter Parkplatz zum Largo Maradona. Das Wandbild von Mario Filardi aus dem Jahr 1990 wurde später vom argentinischen Künstler Bosoletti restauriert, der daneben die Verhüllte Isis geschaffen hat.","d":"In der Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Maradonas Gesicht, auf die Fassade eines Gebäudes gemalt","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"Das Maradona-Wandbild in der Via Emanuele De Deo, dessen Gesicht 2017 von Francisco Bosoletti neu gemalt wurde."}},{"t":"Die Kirche Santa Maria del Pilar","x":"In der Via della Trinità degli Spagnoli steht die Kirche, die die Spanier Santa Maria del Pilar geweiht haben: eine Spur des spanischen Ursprungs des Viertels.","d":"In der Via della Trinità degli Spagnoli","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"Das Maradona-Wandbild","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"Das heiß geliebte Wandbild der Spanischen Viertel und der Platz, der seit 2020 zu einem weltlichen Heiligtum für Diego geworden ist.","rac":"Das Wandbild zeigt Maradona im Trikot mit der Nummer 10 des Napoli der Achtzigerjahre, mit dem Scudetto auf der Brust und der Kapitänsbinde am Arm. Es wurde gemalt, um den zweiten Scudetto zu feiern, den von 1989-90, zu dem Maradona mit 16 Toren in 28 Spielen beitrug. Er war 1984 aus Barcelona gekommen und blieb bis 1991 in Neapel.\n\nDer Künstler, Mario Filardi, war erst 23 Jahre alt: Er malte aus Leidenschaft und arbeitete von Beruf als Kellner, wobei er durch die Welt reiste.\n\nDas Maradona-Wandbild wurde 1990 von Mario Filardi gemalt. In den Neunzigerjahren löschte der Einbau eines Fensters in der Wand das Gesicht aus, und das Gemälde verblasste fast vollständig; es wurde dank Salvatore Iodice restauriert, und im Herbst 2017 malte der argentinische Künstler Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 hat der Platz, der zuvor „Platz der Künstler“ hieß, seinen Namen erhalten und sich mit kleinen Altären, Fahnen und Fotografien gefüllt.","con":"Zu Stoßzeiten ist es sehr voll: Am frühen Morgen kann man es leichter in Ruhe ansehen.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Das große Maradona-Wandbild an der Fassade eines Gebäudes, darunter die Menschenmenge","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Das Wandbild, 1990 von Mario Filardi gemalt. Das heutige Gesicht wurde 2017 vom argentinischen Künstler Francisco Bosoletti neu gemalt."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"Das Wandbild und sein Schöpfer","x":"Das Wandbild von 1990 stammt von Mario Filardi, der aus Leide
