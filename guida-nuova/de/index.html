<script>
var D = {"lingua":"de","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità und Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Ausgangspunkt: Piazza Carità an der Via Toledo. Von hier aus beginnt die Altstadt in wenigen Gehminuten. Und dort befindet sich Ceraldi.","rac":"","con":"Bevor es losgeht, noch ein Kaffee: Die Tour ist lang und Neapel lässt sich am besten mit der richtigen Tasse Kaffee erkunden.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, der untere Decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"Die schnurgerade Straße, die das historische Zentrum in zwei Hälften teilt: der untere Decumanus der griechischen Stadt, etwa zwei Kilometer Kirchen, Geschäfte und Leben.","rac":"Spaccanapoli ist die unterste der drei Decumani, jener parallel verlaufenden Straßen, die das griechische Neapolis von West nach Ost durchquerten. Sie beginnt an der Piazza del Gesù Nuovo als Via Benedetto Croce, geht dann in die Via San Biagio dei Librai über, kreuzt die Via Duomo und führt über die Altstadt hinaus: insgesamt etwa zwei Kilometer. Der Name ist Programm: Sie ist so lang und gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint.","con":"Gehen Sie die Straße entlang von der Piazza del Gesù in Richtung Via Duomo: Es ist ein leichter Abstieg durch die Geschichte, nicht durch Anstrengung.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true},{"id":8,"s":"gesu-nuovo","n":"Platz und Kirche von Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Fassade aus pyramidenförmigen Steinen, die wie eine Festung aussieht und ein Geheimnis birgt: eingravierte Zeichen, die noch niemand mit Sicherheit entziffern konnte.","rac":"Bevor es zur Kirche wurde, war es ein Palast: der Palast der Fürsten von Sanseverino, erbaut 1470; eine Gedenktafel an der Fassade erinnert an den Architekten Novello da San Lucano. Die Jesuiten bewahrten die Struktur und den dunklen Piperno-Quader, dessen Steine in Pyramidenform geschnitten wurden, und ergänzten sie mit Elementen aus weißem Marmor.\n\nManche Steine weisen eingravierte Zeichen auf. Der Legende nach handelt es sich um eine geheime Botschaft; einige Gelehrte glauben, es seien die Spuren verschiedener Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten einer Partitur namens „Enigma“ zu lesen. Betrachten Sie sie genau und bilden Sie sich Ihre eigene Meinung.\n\nDie Fassade wurde restauriert und am 12. März 2023 wiedereröffnet, nachdem im Dezember 2017 einige Fragmente herabgefallen waren; der Platz ist seitdem für Autos gesperrt.","con":"Halten Sie Ausschau nach den Markierungen auf den Steinen in Augenhöhe, rechts und links vom Portal: Die Suche ist kostenlos.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"}],"ant":true},{"id":9,"s":"santa-chiara","n":"Kloster und Komplex Santa Chiara (Majolika-Kreuzgang)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Der mit Majolika verkleidete Kreuzgang ist einer der ruhigsten Orte im Zentrum: nur einen Steinwurf vom Chaos von Spaccanapoli entfernt, Stille.","rac":"","con":"Sonntags schließt der Kreuzgang um 14 Uhr: Wenn es Sonntagnachmittag ist, tauschen Sie die Reihenfolge und kommen Sie zuerst hierher.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Kloster und Museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Kloster und Museum"}],"fonti":[],"ant":true},{"id":10,"s":"cappella-sansevero","n":"Sansevero Kapelle","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Der Verschleierte Christus, eine der berühmtesten Skulpturen der Welt, und die anatomischen Maschinen des Alchemistenfürsten Raimondo di Sangro.","rac":"Die Kapelle der Familie di Sangro ist das Reich von Raimondo, Prinz von Sansevero: ein Mann der Wissenschaft und der Geheimnisse, Großmeister der Freimaurerei, um den sich der Mythos bereits zu seinen Lebzeiten rankte, und er selbst befeuerte ihn.\n\nIm Zentrum steht Giuseppe Sanmartinos Verschleierter Christus, ein Auftragswerk des Fürsten: ein liegender Körper, bedeckt mit einem so dünnen Leichentuch, dass es an ein nasses Tuch erinnert, und doch aus demselben Marmorblock gehauen wie die Statue. In der unterirdischen Höhle befinden sich zwei „anatomische Maschinen“, die Skelette eines Mannes und einer Frau mit rekonstruierten Blutgefäßen, ein Werk des Palermer Arztes Giuseppe Salerno aus den Jahren 1756–1764. Die Legende erzählt von geopferten Dienern und mysteriösen Injektionen; das Museum selbst trennt sorgfältig Mythos und belegte Geschichte.","con":"Dienstags ist es geschlossen: Wenn heute Dienstag ist, ist die Statue des Nils zwei Minuten entfernt und kann jederzeit besichtigt werden.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli und Nilstatue","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai und seine Geschäfte","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Das Viertel der Buchhändler und Kunsthandwerker von Spaccanapoli: Läden, Kirchen und das Puppenkrankenhaus.","rac":"Dies ist der Abschnitt der Spaccanapoli, der sich von der Piazzetta Nilo bis zur Via Duomo auf dem unteren Decumanus erstreckt. Seinen Namen verdankt er den dort seit jeher ansässigen Buchhandlungen: Eine Inschrift am nahegelegenen Palazzo Marigliano erinnert an die Kunst der Buchhändlermeister. Die Verehrung des Heiligen Blasius reicht bis ins 8. Jahrhundert zurück, als armenische Nonnen eine Reliquie des Heiligen nach Neapel brachten. Ebenfalls an dieser Straße befindet sich das Ospedale delle Bambole, eine Handwerkswerkstatt, die seit Generationen in Familienbesitz ist.","con":"Im Dezember eröffnen die Krippengeschäfte: An den Wochenenden muss man mit großem Andrang rechnen.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true},{"id":40,"s":"santa-luciella","n":"Santa Luciella beim Buchhändler und der Schädel mit Ohren","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine winzige Steinmetzkirche, die dem Heiligen der Augen gewidmet ist, und ein einzigartiger Schädel: der mit Ohren.","rac":"Die Kirche wurde kurz vor 1327 von Bartolomeo di Capua, einem Juristen der angevinischen Könige, gegründet und anschließend den Pipernieri, den Steinmetzen, anvertraut: Sie wählten die heilige Lucia, die Beschützerin des Augenlichts, weil die Splitter ihres Handwerks ihre Augen gefährdeten.\n\nNach über dreißig Jahren des Leerstands wurde es am 5. April 2019 dank des Vereins Respiriamo Arte wiedereröffnet. In seinem unterirdischen Gewölbe hinterließ der Kult der „anime pezzentelle“ (kranken Seelen) einen Schädel, der einzigartig ist: Er hat Ohren.","con":"Es ist klein und kann in wenigen Minuten besichtigt werden: perfekt als Zwischenstopp zwischen Sansevero und Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"}],"ant":true},{"id":41,"s":"ospedale-bambole","n":"Puppenkrankenhaus","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Ein Geschäft, das seit Generationen Puppen und Spielzeug sammelt: ein Schaufenster, das Kinder und Erwachsene gleichermaßen in Erinnerung behalten werden.","rac":"","con":"Allein schon das Schaufenster ist einen Stopp wert: Es liegt auf dem Rückweg.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, die Kirche der capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"Die Kirche der capuzzelle: unter dem Fußboden das Hypogäum, wo Neapel für namenlose Seelen betete. Und Lucias Schädel.","rac":"Die Neapolitaner nennen sie „’e cape ’e morte“, die Totenkopfkirche. Es handelt sich um eine kleine Kirche aus dem 17. Jahrhundert am Hauptdekumanus, die mit der Verehrung der Seelen im Fegefeuer verbunden ist, welche sich während der Gegenreformation verbreitete. Eine steile Treppe führt zum Hypogäum, der unterirdischen Kirche, die im 18. Jahrhundert erweitert und mit Majolika verziert wurde: Hier kümmerten sich die Gläubigen um die sterblichen Überreste anonymer Verstorbener und baten um deren Fürsprache. Am Ende eines kleinen Ganges wird der Schädel der Lucia aufbewahrt, einer besonders verehrten jungen Seele.","con":"Hinter dem Altar befindet sich der geflügelte Marmorschädel von Dionisio Lazzari: Er ist das Symbol der Kirche.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true},{"id":18,"s":"duomo-san-gennaro","n":"Kathedrale und Schatz von San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Die Kathedrale von Neapel und die Schatzkammerkapelle, in der die Phiole mit dem Blut des heiligen Gennaro aufbewahrt wird.","rac":"In der Kathedrale, in einer Nische der Schatzkapelle, wird die Ampulle mit dem Blut aufbewahrt, das traditionell dem Heiligen Gennaro zugeschrieben wird. Dreimal im Jahr (am Samstag vor dem ersten Sonntag im Mai, am 19. September und am 16. Dezember) wartet man auf die Verflüssigung des Blutes. Seit 1601 werden die Reliquien von einer weltlichen Institution, der Deputation der Schatzkapelle des Heiligen Gennaro, verwahrt.","con":"An Tagen, an denen Boden verflüssigt wird, ist der Dom schon morgens überfüllt: Wenn Sie dort sein möchten, kommen Sie früh.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":43,"s":"banksy-madonna","n":"Banksys Madonna mit einer Pistole","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Eine Madonna von Banksy mit einer Pistole anstelle eines Heiligenscheins, geschützt durch Glas, im Herzen des Hauptdekumanus.","rac":"Auf der Piazzetta dei Girolamini, an der Fassade des Hauptdecumanus, hinterließ Banksy eine Madonna mit einer Pistole anstelle ihres Heiligenscheins. Heute ist sie durch Glas geschützt. Die offizielle Tourismuswebsite der Stadt führt sie in ihrer Route zu Streetart im historischen Zentrum auf.","con":"Schauen Sie nach oben: Das Werk befindet sich oberhalb des Straßenniveaus, hinter Glas.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Die erste Runde","sub":"Spaccanapoli in einem halben Tag, Start in Ceraldi","desc":"Das Herz der Altstadt auf einem Rundgang: die Basilika Gesù Nuovo mit ihrem geheimnisvollen Flair, der Kreuzgang von Santa Chiara, der Verschleierte Christus, die Schädel- und Ohrenkirche, die Geschäfte der Via San Biagio dei Librai. Und dann kehren wir zu uns zurück.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Einen Kaffee bei Ceraldi und dann geht's los.","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38},{"l":10,"m":9,"mt":682,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":39},{"l":41,"m":2,"mt":161,"so":10,"nota":"","alt":null},{"l":7,"m":15,"mt":1128,"so":0,"nota":"Von Ceraldi kehren wir über Spaccanapoli zurück.","alt":null}],"fonti":[],"ant":true},{"id":2,"s":"napoli-sacra-e-profana","n":"Heiliges und profanes Neapel","sub":"Heilige, Totenköpfe, Alchemisten und eine Madonna von Banksy","desc":"Die geheimnisvolle Seite Neapels entlang der Decumani: die verschlüsselte Fassade der Kirche Gesù Nuovo, der Prinz von Sansevero, die Schädel der Santa Luciella und Purgatorio ad Arco, Banksys Streetart und das Blut des Heiligen Gennaro. Wer noch Zeit hat, kann jenseits der Stadtmauern den Friedhof Fontanelle besuchen.","dur":210,"dist":3837,"et":["mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":10,"m":6,"mt":448,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":null},{"l":42,"m":4,"mt":328,"so":40,"nota":"","alt":null},{"l":43,"m":4,"mt":333,"so":5,"nota":"","alt":null},{"l":18,"m":4,"mt":303,"so":45,"nota":"","alt":null},{"l":7,"m":21,"mt":1597,"so":0,"nota":"Rückkehr von Ceraldi.","alt":null}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Neapel in fünf Minuten: Von der Sirene zur Neustadt","som":"Erst Partenope, dann Neapolis: weil das historische Zentrum noch immer wie eine griechische Stadt gestaltet ist.","txt":"Neapel wurde zweimal gegründet. Das erste Mal hieß die Partenope, wie die mythische Sirene: Sie wurde im 7. Jahrhundert v. Chr. von Kolonisten griechischer Herkunft aus Cumae gegründet, die auf der Insel Megaride landeten, wo heute Castel dell'Ovo steht, und sich auf dem nahegelegenen Berg Echia niederließen.\n\nDas zweite Mal, um 470 v. Chr., entstand neben der alten Stadt eine neue: Neapolis, was auf Griechisch „neue Stadt“ bedeutet. Durch diese Stadt befinden Sie sich gerade. Ihre Straßen bilden ein regelmäßiges Raster, das auch nach fünfundzwanzig Jahrhunderten noch erkennbar ist: Das historische Zentrum von Neapel gehört zum UNESCO-Weltkulturerbe, gerade weil der Grundriss der griechischen Stadt bis heute erhalten geblieben ist.\n\nDrei parallel verlaufende Straßen, die Decumani, durchschneiden die Stadt von West nach Ost. Die unterste ist Spaccanapoli: etwa zwei Kilometer lang und so gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint – daher ihr Name. Im Zentrum verläuft die Via dei Tribunali, die Hauptdecumanus; weiter oben liegen die Via dell'Anticaglia und die Via della Sapienza, die obere Decumanus.\n\nVon Piazza Carità, wo wir seit 2002 sind, beginnt Spaccanapoli nur wenige Gehminuten entfernt, an der Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro und das schmelzende Blut","som":"Dreimal im Jahr hält Neapel den Atem an über einer Phiole. Was geschieht dort, und was sagen Kirche und Wissenschaft dazu?","txt":"Im Dom von Neapel wird in einer Nische der Schatzkammer ein Fläschchen mit einer dunklen Substanz aufbewahrt, die der Überlieferung nach das Blut des heiligen Gennaro, des Schutzpatrons der Stadt, ist. Dreimal im Jahr – am Samstag vor dem ersten Sonntag im Mai, am 19. September (dem Festtag) und am 16. Dezember – wird das Fläschchen den Gläubigen gezeigt: Löst sich der Inhalt, der meist fest ist, auf, ist dies ein Grund zum Feiern; bleibt er fest, gilt dies für viele Neapolitaner als schlechtes Omen.\n\nDie erste bekannte Aufzeichnung der Verflüssigung stammt aus dem Jahr 1389. Die Reliquien werden nicht vom Klerus, sondern von der Deputation der Kapelle des Schatzes von San Gennaro bewacht, einer säkularen Institution, die 1601 gegründet wurde und der auch der Bürgermeister von Neapel angehört.\n\nDie Kirche vertritt eine vorsichtige Haltung: Sie spricht von einem „wunderbaren Ereignis“, erlaubt die Volksfrömmigkeit, erhebt sie aber nicht zum Glaubensinhalt. Zu den von Skeptikern vorgeschlagenen Erklärungen gehört die Thixotropie, die Eigenschaft bestimmter Substanzen, im Ruhezustand fest zu sein und bei Bewegung oder Schütteln flüssig zu werden.\n\nDas Heilige und das Profane existierten hier schon immer nebeneinander: In der Via Duomo, nur wenige Schritte vom Dom entfernt, malte der Straßenkünstler Jorit einen San Gennaro mit dem Gesicht eines Arbeiters.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Die armen Seelen: Als Neapel einen Totenkopf adoptierte","som":"Ossuarien, capuzzelle und Gebete im Tausch gegen Lottozahlen: der Kult der namenlosen Toten.","txt":"Jahrhundertelang wurden die namenlosen Toten in Neapel nicht allein gelassen. Man nannte sie „anime pezzentelle“: die armen Seelen, die ohne Begräbnis und ohne Fürbitter starben. Der Name leitet sich von „pezzente“, dem armen Mann, ab, aber auch vom lateinischen „petere“, bitten, um zu empfangen: Wer für sie betete, hoffte im Gegenzug Schutz und Gnade zu erlangen.\n\nDer symbolträchtige Ort ist der Friedhof Fontanelle im Stadtteil Sanità: ein Tuffsteinbruch aus dem 16. Jahrhundert, der sich über etwa viertausend Quadratmeter erstreckt und die Opfer der Pest von 1656 und später der Cholera von 1836/37 aufnahm. 1872 ordnete Kanonikus Gaetano Barbati die Gebeine in drei Schiffen an. Gläubige „adoptierten“ einen Schädel, eine sogenannte Capuzzella: Sie reinigten ihn, stellten ihn in einen kleinen Schrein, schmückten ihn mit Rosenkränzen und Münzen und beteten zu ihm, in der Hoffnung auf ein Zeichen im Traum, manchmal auch auf eine Lottozahl. Einige Schädel erlangten Berühmtheit: der des Kapitäns mit der geschwärzten Augenhöhle, um den sich eine Legende von Ehe und Eifersucht rankt; Donna Concetta, die der Legende nach „schwitzt“, wenn ihr Gnade zuteilwird.\n\n1969 schloss ein Dekret des Kirchengerichts das Beinhaus und verbot die dort stattfindenden Gottesdienste. Nach Renovierungsarbeiten, die seit 2020 andauerten, wurde der Friedhof 2026 wiedereröffnet und wird von der Genossenschaft La Paranza verwaltet.\n\nDer Kult lebt auch unterhalb der Via dei Tribunali fort, im Hypogäum von Santa Maria delle Anime del Purgatorio ad Arco, der Kirche, die die Neapolitaner „'e cape 'e morte“ nennen: Dort wird der Schädel der Lucia, einer besonders verehrten jungen Seele, aufbewahrt. Und in der kleinen Kirche Santa Luciella an der Via San Biagio dei Librai befindet sich ein einzigartiger Schädel: der mit den Ohren.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoterisches Neapel: Ein Alchemistenprinz, eine verschlüsselte Fassade und ein magisches Ei","som":"Raimondo di Sangro, die Rustizierung des Gesù Nuovo, Virgils Ei, das munaciello: Wo die Geschichte endet und die Legende beginnt.","txt":"Neapel liebt Geheimnisse, und es birgt einige besonders faszinierende. Das berühmteste hat einen Namen: Raimondo di Sangro, Fürst von Sansevero, ein Mann des 18. Jahrhunderts, Großmeister der neapolitanischen Freimaurerei und ein eifersüchtiger Erfinder seiner eigenen Geheimnisse. Schon zu Lebzeiten umgab ihn ein Mythos, den er selbst weiter befeuerte. Benedetto Croce nannte ihn die neapolitanische Reinkarnation von Doktor Faustus. Die düstere Legende schreibt ihm alles zu: Diener, die getötet wurden, um ihre Leichen zu studieren, sogar die Blendung des Bildhauers des Verschleierten Christus, damit dieser keinen weiteren schuf. Dies sind Legenden, und das Museum selbst unterscheidet sie von der belegten Geschichte.\n\nDer Verschleierte Christus ist ein Werk von Giuseppe Sanmartino, im Auftrag des Fürsten: Der transparente Schleier, der den Körper bedeckt, ist aus demselben Marmorblock gefertigt wie die Statue. In der unterirdischen Höhle der Kapelle befinden sich die „anatomischen Maschinen“, zwei Skelette mit rekonstruierten Kreislaufsystemen, die der Palermer Arzt Giuseppe Salerno um 1756–1764 schuf. Der Legende nach beinhalteten sie geheimnisvolle Injektionen und Studien mit Bienenwachs und Farbstoffen.\n\nUnweit davon ist die Fassade des Gesù Nuovo, ursprünglich 1470 als Palazzo Sanseverino erbaut, mit einem pyramidenförmigen Mauerwerk aus dunklem Piperno-Stein verkleidet. Einige Steine tragen eingravierte Markierungen: Der Legende nach eine geheime Botschaft; manche Gelehrte halten sie für die Zeichen der Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten zu lesen, eine etwa dreiviertelstündige Partitur namens „Enigma“. Eine verlockende Hypothese, aber keine Gewissheit.\n\nUnd dann ist da noch das Meer: Der Legende nach versteckte der Dichter Vergil das Ei der Sirene Partenope in den Kellern von Castel dell'Ovo. Solange das Ei unversehrt bleibt, steht auch die Burg.\n\nIn den Häusern hingegen wohnen die Geister der Volkstradition: der munaciello, ein vermummter Elf, der je nachdem, wie man ihn behandelt, Glück oder Unheil bringt, und die bella 'mbriana, ein guter Hausgeist, der als Schmetterling oder Gecko erscheinen kann.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Neapel heute: Was gibt es Neues?","som":"Der Maradona gewidmete Platz, die Straßenkunst, das letzte Caravaggio-Gemälde in der Via Toledo, wiedereröffnete Kirchen und Beinhäuser: die Stadt im Wandel.","txt":"Wer nach einigen Jahren nach Neapel zurückkehrt, findet eine Stadt vor, die gelernt hat, ihre Geschichte zu erzählen.\n\nIm spanischen Viertel, nur neun Minuten von uns entfernt, liegt Largo Maradona. Das Wandgemälde von Diego Maradona wurde 1990 von Mario Filardi geschaffen; im Laufe der Jahre verblasste es fast vollständig, wurde dann aber von Salvatore Iodice restauriert, und im Herbst 2017 übermalte der Argentinier Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 entwickelte sich der Platz, der zuvor Künstlerplatz genannt wurde, zu einem säkularen Wallfahrtsort mit kleinen Altären, argentinischen Flaggen und Fotografien. Er war so beliebt, dass die Stadtverwaltung den Fußgängerverkehr regeln musste.\n\nDie Streetart hat Einzug in die Altstadt gehalten: Auf der Piazzetta dei Girolamini prangt, geschützt durch Glas, Banksys „Madonna mit Pistole“; in der Via Duomo findet sich Jorits „San Gennaro der Arbeiter“. Die offizielle Tourismuswebsite der Stadt hat ihnen eine eigene Route gewidmet.\n\nIn der Via Toledo, nur sechs Minuten von uns entfernt, beherbergt die Gallerie d'Italia das Martyrium der Heiligen Ursula, Caravaggios letztes Gemälde, sowie über fünfhundert attische und Magna-Graecia-Vasen.\n\nUnd Orte, die lange Zeit geschlossen waren, werden wiedereröffnet: Die Kirche Santa Luciella ai Librai, die über dreißig Jahre lang verlassen war, wurde am 5. April 2019 wieder für die Öffentlichkeit zugänglich gemacht; der Friedhof Fontanelle wurde 2026 wiedereröffnet.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metr function verificati(l, ora){
  if(!l.ov || !l.ovi) return false;
  return (Date.parse(ora.data) - Date.parse(l.ovi)) / 864e5 <= SCADENZA_GIORNI;
}
function fasceDelGiorno(l, data, gs){
  return l.or.filter(function(o){ return o.g && o.g.indexOf(gs) >= 0 && (!o.dal || o.dal <= data) && (!o.al || o.al >= data); });
}
/* stato di un luogo a un certo minuto di oggi: sempre | verifica | aperto | apre | chiuso_ora | chiuso_oggi */
function stato(l, ora, minuto){
  if(l.sa) return {k: 'sempre'};
  if(!verificati(l, ora)) return {k: 'verifica'};
  var f = fasceDelGiorno(l, ora.data, ora.gs);
  if(f.some(function(o){ return o.x; })) return {k: 'chiuso_oggi'};
  f = f.filter(function(o){ return o.da && o.a; }).sort(function(a, b){ return hm(a.da) - hm(b.da); });
  if(!f.length) return {k: 'chiuso_oggi'};
  for(var i = 0; i < f.length; i++){
    var da = hm(f[i].da), a = hm(f[i].a), ui = f[i].ui ? hm(f[i].ui) : a;
    if(minuto < da) return {k: 'apre', da: f[i].da};
    if(minuto < a) return minuto <= ui ? {k: 'aperto', a: f[i].a, ui: f[i].ui} : {k: 'chiuso_ora', motivo: 'ui', ui: f[i].ui};
  }
  return {k: 'chiuso_ora'};
}
function etichetta(s){
  switch(s.k){
    case 'sempre': return '<span class="stato ok">' + e(T.sempre) + '</span>';
    case 'verifica': return '<span class="stato att">' + e(T.in_verifica) + '</span>';
    case 'aperto': return '<span class="stato ok">' + e(T.aperto) + '</span> <span class="piccolo">· ' + e(T.chiude_alle) + ' ' + e(s.a) + (s.ui ? ' · ' + e(T.ultimo_ingresso) + ' ' + e(s.ui) : '') + '</span>';
    case 'apre': return '<span class="stato att">' + e(T.apre_alle) + ' ' + e(s.da) + '</span>';
    case 'chiuso_ora': return '<span class="stato ko">' + e(T.chiuso_ora) + '</span>';
    default: return '<span class="stato ko">' + e(T.chiuso_oggi) + '</span>';
  }
}
function fotoHtml(f){ if(!f) return ''; return '<figure class="foto"><img src="' + e(f.u) + '" alt="' + e(f.alt) + '" loading="lazy"><figcaption>' + e(f.aut) + ' · ' + e(f.lic) + (f.src ? ' · <a href="' + e(f.src) + '" rel="noopener">fonte</a>' : '') + '</figcaption></figure>'; }
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="scheda fonti"><summary><b>' + e(T.fonti) + '</b> (' + fs.length + ')</summary><ul>' + fs.map(function(f){ return '<li><a href="' + e(f.u) + '" rel="noopener">' + e(f.t) + '</a></li>'; }).join('') + '</ul></details>'; }
function indietro(){ return '<button class="indietro" onclick="history.length > 1 ? history.back() : (location.hash = \'#/\')">← ' + e(T.indietro) + '</button>'; }
function durata(m){ if(!m) return ''; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : m + ' ' + T.min; }
function km(m){ return m ? (m / 1000).toLocaleString(D.lingua, {maximumFractionDigits: 1}) + ' ' + T.km : ''; }

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null;
function caricaMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return mlPromessa || (mlPromessa = new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = PRE + 'mappa/maplibre-gl.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }));
}
function stile(){
  var base = new URL(PRE + 'mappa/', location.href).href;
  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"'));
  });
}
function mappa(id, punti, inQuadro){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18,
      maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}, cooperativeGestures: false});
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    var b = new maplibregl.LngLatBounds();
    punti.forEach(function(p){
      var d = document.createElement('a'); d.className = 'num' + (p.casa ? ' casa' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(inQuadro && punti.length > 1) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0}); /* a destra c'e' lo zoom */
  }).catch(function(){ el.innerHTML = '<p class="piccolo" style="padding:16px">—</p>'; });
}

/* ---------- schermate ---------- */
var V = {};
V.home = function(){
  var ora = adesso(), h = '';
  var sc = D.scioperi.filter(function(s){ return s.d === ora.data; });
  if(sc.length) h += '<div class="avviso ko"><b>' + e(T.sciopero) + '</b>' + sc.map(function(s){ return '<br>' + e([s.l, s.x].filter(Boolean).join(' — ')); }).join('') + '</div>';
  var chiusi = D.luoghi.filter(function(l){ return !l.sa && verificati(l, ora) && stato(l, ora, ora.min).k === 'chiuso_oggi'; });
  h += '<section class="scheda"><h3>' + e(T.oggi) + ' · ' + e(nomeGiorno(ora.gs, true)) + ' ' + e(dataLunga(ora.data)) + '</h3>';
  h += chiusi.length ? '<p class="piccolo" style="margin:0"><b>' + e(T.chiusi_oggi) + ':</b> ' + chiusi.map(function(l){ return '<a href="#/l/' + e(l.s) + '">' + e(l.n) + '</a>'; }).join(', ') + '</p>'
                     : '<p class="piccolo" style="margin:0">' + e(T.tutti_aperti) + '</p>';
  h += '</section>';
  h += '<div class="bottoni"><a class="bottone pieno" href="#/mappa">' + e(T.mappa) + '</a><a class="bottone" href="#/piove">☂ ' + e(T.piove) + '</a></div>';
  if(D.itinerari.length){
    h += '<h2>' + e(T.itinerari) + '</h2><p class="piccolo" style="margin:0">' + e(T.partenza) + '</p><ul class="lista">';
    D.itinerari.forEach(function(i){
      h += '<li><a class="voce" href="#/i/' + e(i.s) + '"><div class="titolo">' + e(i.n) + '</div>' + (i.sub ? '<div class="piccolo">' + e(i.sub) + '</div>' : '') +
           '<div class="meta piccolo"><span>' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span><span>' + i.tappe.filter(function(t){ return !LU[t.l] || LU[t.l].s !== 'piazza-carita'; }).length + ' ' + e(T.tappe) + '</span></div></a></li>';
    });
    h += '</ul>';
  }
  if(D.racconti.length){
    h += '<h2>' + e(T.racconti) + '</h2><ul class="lista">';
    D.racconti.forEach(function(r){ h += '<li><a class="voce" href="#/r/' + e(r.s) + '"><div class="titolo">' + e(r.t) + '</div>' + (r.som ? '<div class="piccolo">' + e(r.som) + '</div>' : '') + '</a></li>'; });
    h += '</ul>';
  }
  var altri = D.luoghi.filter(function(l){ return l.s !== 'piazza-carita'; });
  if(altri.length){
    h += '<h2>' + e(T.luoghi) + '</h2><ul class="lista">';
    altri.forEach(function(l){ h += voceLuogo(l, ora); });
    h += '</ul>';
  }
  return h;
};
function voceLuogo(l, ora){
  return '<li><a class="voce" href="#/l/' + e(l.s) + '"><div class="titolo">' + e(l.n) + '</div><div class="meta">' + etichetta(stato(l, ora, ora.min)) +
         (l.mp ? '<span class="piccolo">' + l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi) + '</span>' : '') + '</div></a></li>';
}
V.itinerario = function(s){
  var i = IT[s]; if(!i) return V.home();
  var ora = adesso(), h = indietro(), t = ora.min, punti = [], k = 0;
  h += '<h2>' + e(i.n) + '</h2>' + (i.sub ? '<p class="piccolo" style="margin:0">' + e(i.sub) + '</p>' : '');
  h += '<div class="meta piccolo" style="display:flex;gap:12px;margin-top:6px"><span>' + e(T.durata) + ' ' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span></div>';
  h += fotoHtml(i.foto);
  h += '<div class="mappa" id="m-itin"></div><p class="piccolo">' + e(T.nota_mappa) + '</p>';
  if(i.desc) h += '<div class="testo">' + par(i.desc) + '</div>';
  h += '<p class="piccolo"><b>' + e(T.arrivo) + '</b></p>';
  i.tappe.forEach(function(tp, n){
    var l = LU[tp.l], casa = l.s === 'piazza-carita';
    t += tp.m;
    var arrivo = t, sa = stato(l, ora, arrivo), num = casa ? '★' : String(++k);
    if(!punti.some(function(p){ return p.id === l.id; }) && l.lat != null) punti.push({id: l.id, t: num, n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa});
    h += (tp.m ? '<div class="tra">↓ ' + tp.m + ' ' + e(T.min) + ' ' + e(T.a_piedi) + (tp.mt ? ' · ' + tp.mt + ' m' : '') + '</div>' : '');
    h += '<div class="tappa"><div class="n"' + (casa ? ' style="background:var(--accento)"' : '') + '>' + num + '</div><div><a href="#/l/' + e(l.s) + '" style="color:inherit;text-decoration:none"><h3>' + e(l.n) + '</h3></a>' +
         '<div class="piccolo">' + (arrivo < 1440 ? '≈ ' + fmt(arrivo) : '') + (tp.so ? ' · ' + tp.so + ' ' + e(T.min) : '') + '</div>' +
         '<div class="meta" style="margin-top:4px">' + etichetta(sa) + '</div>' + (tp.nota ? '<p style="margin:6px 0 0">' + e(tp.nota) + '</p>' : '');
    var chiusoArrivo = (sa.k === 'chiuso_oggi' || sa.k === 'chiuso_ora' || (sa.k === 'apre' && hm(sa.da) - arrivo > 30));
    if(chiusoArrivo){
      h += '<div class="alt"><b>' + e(T.chiuso_arrivo) + '.</b>';
      if(tp.alt && LU[tp.alt]) h += ' ' + e(T.alternativa) + ': <a href="#/l/' + e(LU[tp.alt].s) + '">' + e(LU[tp.alt].n) + '</a> ' + etichetta(stato(LU[tp.alt], ora, arrivo));
      h += '</div>';
    }
    h += '</div></div>';
    t += tp.so;
  });
  h += fontiHtml(i.fonti);
  setTimeout(function(){ mappa('m-itin', punti, true); });
  return h;
};
V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), h = indietro() + '<h2>' + e(l.n) + '</h2>';
  h += fotoHtml(l.foto);
  if(l.som) h += '<p style="font-size:1.05rem">' + e(l.som) + '</p>';
  h += '<section class="scheda"><div class="meta">' + etichetta(stato(l, ora, ora.min)) + '</div>';
  if(!l.sa && verificati(l, ora) && l.or.length){
    h += '<table class="orari" style="margin-top:10px">';
    for(var g = 1; g <= 7; g++){
      var f = fasceDelGiorno(l, ora.data, g), aperte = f.filter(function(o){ return !o.x && o.da; });
      var txt = f.some(function(o){ return o.x; }) || !aperte.length ? T.giorni_chiusura : aperte.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      h += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>';
    }
    h += '</table><p class="piccolo" style="margin:8px 0 0">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  }
  if(l.po || l.sito) h += '<p style="margin:10px 0 0">' + (l.po ? '<a href="' + e(l.po) + '" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  var info = [];
  if(l.dv) info.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) info.push(e(T.gratuito)); else if(l.gr === false) info.push(e(T.pagamento));
  if(l.mp) info.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(info.length) h += '<p class="piccolo" style="margin:10px 0 0">' + info.join(' · ') + '</p>';
  h += '</section>';
  if(l.rac) h += '<div class="testo">' + par(l.rac) + '</div>';
  if(l.con) h += '<section class="scheda"><h3>' + e(T.consiglio) + '</h3><p style="margin:0">' + e(l.con) + '</p></section>';
  if(l.acc) h += '<section class="scheda"><h3>' + e(T.accessibilita) + '</h3><p style="margin:0">' + e(l.acc) + '</p></section>';
  if(l.lat != null){
    h += '<div class="mappa" id="m-luogo" style="height:240px"></div>';
    h += '<p><a class="bottone" href="https://www.openstreetmap.org/?mlat=' + l.lat + '&amp;mlon=' + l.lon + '#map=18/' + l.lat + '/' + l.lon + '" rel="noopener">' + e(T.apri_mappa) + '</a></p>';
    setTimeout(function(){ mappa('m-luogo', [{id: l.id, t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}], false); });
  }
  h += fontiHtml(l.fonti);
  return h;
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return indietro() + '<h2>' + e(r.t) + '</h2>' + fotoHtml(r.foto) + '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti);
};
V.mappa = function(){
  var ora = adesso(), punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l, n){ return {id: l.id, t: l.s === 'piazza-carita' ? '★' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: l.s === 'piazza-carita'}; });
  setTimeout(function(){ mappa('m-tutti', punti, true); });
  return indietro() + '<h2>' + e(T.mappa) + '</h2><div class="mappa" id="m-tutti" style="height:60vh"></div>';
};
V.piove = function(){
  var ora = adesso(), cop = D.luoghi.filter(function(l){ return D.coperto.indexOf(l.tipo) >= 0 && !l.sa; });
  var h = indietro() + '<h2>☂ ' + e(T.piove) + '</h2><p class="piccolo">' + e(T.piove_testo) + '</p>';
  if(!cop.length) return h + '<p>' + e(T.piove_vuoto) + '</p>';
  var peso = {aperto: 0, apre: 1, verifica: 2, chiuso_ora: 3, chiuso_oggi: 4};
  cop.sort(function(a, b){ return (peso[stato(a, ora, ora.min).k] || 0) - (peso[stato(b, ora, ora.min).k] || 0); });
  return h + '<ul class="lista">' + cop.map(function(l){ return voceLuogo(l, ora); }).join('') + '</ul>';
};
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h;
  if(p[0] === 'i') h = V.itinerario(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'l') h = V.luogo(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'r') h = V.racconto(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'mappa') h = V.mappa();
  else if(p[0] === 'piove') h = V.piove();
  else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<div class="avviso prova">' + e(T.anteprima) + '</div>' : '') + h +
    '<footer><p><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a></p><p>' + e(T.editoriale) + '<br>' + e(T.senza_rete) + '</p></footer>';
  if(p[0]) window.scrollTo(0, 0);
}
document.getElementById('t-titolo').textContent = T.titolo;
document.getElementById('t-sotto').textContent = T.sottotitolo;
if(D.lingue.length){
  document.getElementById('lingue').innerHTML = '<details class="lingue"><summary aria-label="' + e(T.lingua) + '">' + e((D.lingue.filter(function(x){ return x.c === D.lingua; })[0] || {}).b || '') + ' ' + e(D.lingua.toUpperCase()) + ' ▾</summary><ul>' +
    D.lingue.map(function(x){ return '<li><a data-lng="' + e(x.c) + '" href="' + e(x.u || './') + '"' + (x.c === D.lingua ? ' aria-current="true"' : '') + '>' + e(x.b + ' ' + x.n) + '</a></li>'; }).join('') + '</ul></details>';
  document.getElementById('lingue').addEventListener('click', function(ev){ var a = ev.target.closest('a[data-lng]'); if(!a) return; try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; });
  /* stessa scelta di lingua del menu: chi l'ha gia' scelta la ritrova */
  if(D.lingua === 'it'){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
}
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
