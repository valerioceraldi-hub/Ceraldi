io è stata la capitale dell'Italia del Sud.\n\nQuesti tredici capitoli ti accompagnano dalla leggenda alla città di oggi. Ogni volta che il racconto incontra un luogo della guida, trovi un pulsante per andarci.","foto":null,"cap":[{"p":"La leggenda","t":"La sirena Partenope","x":"Tutto comincia con una sirena. Nel mito greco le sirene erano creature con il corpo di uccello e la testa di donna, padrone di un canto magico. Una di loro si chiamava Partenope.\n\nIl racconto più famoso dice che, quando Ulisse passò davanti al loro scoglio senza cedere al canto, le sirene per il dolore si gettarono in mare. Le onde portarono il corpo di Partenope sulla costa, alla foce di un piccolo fiume, il Sebeto: proprio dove sarebbe nata la città.\n\nLì le fu costruita una tomba e i Greci di Napoli le dedicavano ogni anno sacrifici e una corsa con le fiaccole. Ancora oggi i napoletani si chiamano «partenopei».","l":null,"foto":null},{"p":"VIII–VII secolo a.C.","t":"Partenope, la prima città","x":"La leggenda ha un fondo di verità. Tra l'VIII e il VII secolo a.C. i Greci di Cuma, la più antica colonia greca della zona, fondarono un piccolo scalo sul mare e lo chiamarono come la sirena: Partenope.\n\nSorgeva sulla collina di Pizzofalcone, il Monte Echia, su uno sperone circondato dal mare, e aveva il suo approdo sull'isolotto di Megaride, dove oggi c'è Castel dell'Ovo. Il porto era nell'attuale piazza Municipio. La necropoli di Partenope è stata scoperta nel 1949 in via Nicotera.\n\nLa piccola città crebbe così in fretta che Cuma, per paura di perdere il comando, ne ridusse il ruolo.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."}},{"p":"V secolo a.C.","t":"Neapolis, la città nuova","x":"Accanto a Partenope, poco più a est, i Cumani fondarono una città nuova: Neapolis, la «città nuova». L'UNESCO data la fondazione al 470 a.C. circa, nel periodo in cui i Greci avevano sconfitto gli Etruschi sul mare.\n\nNeapolis fu costruita secondo un disegno regolare: tre strade principali parallele (le «plateiai», poi chiamate decumani), incrociate ad angolo retto da strade più piccole. L'agorà, la piazza principale, era dov'è oggi piazza San Gaetano.\n\nQuel reticolo è ancora lì: Spaccanapoli, via dei Tribunali e via Anticaglia sono le tre strade greche. Camminandoci, cammini nella pianta della città di 2.500 anni fa.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"I grandi blocchi di tufo delle mura greche, scavate sotto il livello della strada","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"I blocchi di tufo delle mura greche di Neapolis, in piazza Bellini, visibili in uno scavo sotto il livello della strada."}},{"p":"326 a.C. – V secolo d.C.","t":"Greca sotto Roma","x":"Nel 326 a.C. Neapolis si alleò con Roma e restò per secoli una città greca dentro il mondo romano: fu tra le poche a conservare la lingua e la cultura greca. Diventò un luogo amato dai Romani colti e ricchi, che costruivano ville sul golfo: sull'isolotto di Megaride sorse quella di Lucio Licinio Lucullo.\n\nNel 79 d.C. l'eruzione del Vesuvio distrusse Pompei ed Ercolano, poco lontano. Nel 476, proprio nella villa di Lucullo, fortificata, fu rinchiuso Romolo Augusto, l'ultimo imperatore romano d'Occidente: con lui finiva l'Impero.\n\nSotto la città greco-romana scorreva già l'acqua delle cisterne che oggi visiti a Napoli Sotterranea, e nel teatro di Neapolis si esibì l'imperatore Nerone.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."}},{"p":"VI–XII secolo","t":"Il ducato di Napoli","x":"Dopo la fine dell'Impero, nel VI secolo, Napoli passò ai Bizantini, i Romani d'Oriente. Poco a poco diventò un ducato quasi indipendente: nell'VIII secolo il duca Stefano II se ne fece signore di fatto.\n\nPer cinque secoli il ducato resistette a Longobardi e Saraceni. Nel 1030 il duca Sergio IV diede la contea di Aversa a un gruppo di mercenari normanni: fu l'inizio della loro ascesa nel Sud. Nel 1137 Napoli si sottomise ai Normanni ed entrò nel nuovo Regno di Sicilia.\n\nDi quegli anni lontani restano le chiese più antiche, come Santa Restituta e il battistero di San Giovanni in Fonte dentro il Duomo, considerato il più antico d'Occidente.","l":18,"foto":null},{"p":"1194–1266","t":"Normanni e Svevi: nasce l'Università","x":"Dopo i Normanni arrivarono gli Svevi. Nel 1194 l'imperatore Enrico VI occupò la città e ne fece abbattere le mura.\n\nSuo figlio, Federico II, era un sovrano appassionato di cultura e di diritto. Nel 1224 fondò a Napoli lo «Studio», una delle prime università statali d'Europa: è l'attuale Università Federico II, che porta ancora il suo nome.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La statua di Federico II di Svevia nella facciata del Palazzo Reale","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statua di Federico II di Svevia, tra quelle della facciata del Palazzo Reale."}},{"p":"1266–1442","t":"Gli Angioini: Napoli capitale","x":"Nel 1266 il papa affidò il regno a Carlo I d'Angiò, fratello del re di Francia, che entrò in città in trionfo. Dopo la rivolta dei Vespri siciliani del 1282, la Sicilia si staccò e Napoli diventò la capitale del regno: lo resterà per secoli.\n\nGli Angioini costruirono il Castel Nuovo, il Duomo (dal 1294) e la cittadella di Santa Chiara (dal 1310), e la città si allargò. Alla corte di Roberto d'Angiò, nel Castel Nuovo, soggiornarono Giotto, Petrarca e Boccaccio.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."}},{"p":"1442–1503","t":"Gli Aragonesi","x":"Nel 1442 Alfonso d'Aragona conquistò Napoli: secondo la tradizione i suoi uomini entrarono in città passando per un acquedotto. Fece del Castel Nuovo la sua reggia, lo ricostruì e per celebrare la vittoria vi aggiunse il grande Arco di Trionfo tra due torri.\n\nGli Aragonesi trasformarono il castello medievale in una fortezza moderna e rinnovarono le difese e le strade della città. Il figlio Ferrante sconfisse i baroni ribelli: la porta di bronzo del castello racconta quella guerra, e nella Sala dei Baroni si consumò la sua vendetta.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi: Napoli aragonese vista dal mare, con il Maschio Angioino e Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (XV secolo): Napoli vista dal mare, con il porto, il Castel Nuovo e, in alto, il colle di Sant'Elmo."}},{"p":"1503–1707","t":"Il viceregno spagnolo","x":"Dal 1503 Napoli passò alla Spagna e fu governata da un viceré. Senza un re presente, era comunque una capitale imperiale, con una delle corti più grandiose dei domini spagnoli. Il viceré don Pedro di Toledo raddoppiò la città, aprì via Toledo e costruì i quartieri per i soldati, i Quartieri Spagnoli. In questi anni fu costruito anche il Palazzo Reale.\n\nNel 1606 arrivò a Napoli, in fuga da Roma, Caravaggio: la sua pittura cambiò l'arte della città, che nel Seicento diventò una delle capitali del barocco europeo.\n\nFurono anche anni durissimi: tasse altissime, l'eruzione del Vesuvio del 1631 e, nel 1656, una peste che uccise più della metà degli abitanti.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste del 1656: corpi ammassati nella piazza e figure celesti in cielo","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste del 1656, dipinto da Micco Spadaro: la piazza è piena di morti e di moribondi."}},{"p":"1647","t":"Masaniello","x":"Il 7 luglio 1647, dopo l'ennesima tassa, questa volta sulla frutta, il cibo dei più poveri, un pescatore di 27 anni, Masaniello, guidò il popolo in rivolta al grido di «Viva il re di Spagna, mora il malgoverno».\n\nIn dieci giorni gli spagnoli dovettero accettare le richieste del popolo. Ma Masaniello, accusato di pazzia e tradito da una parte degli stessi rivoltosi, fu assassinato. La rivolta continuò per mesi contro la Spagna, prima di essere domata nel 1648.","l":null,"foto":null},{"p":"1734–1799","t":"I Borbone e la Repubblica","x":"Nel 1734 Carlo di Borbone riportò a Napoli un re tutto suo e volle farne una grande capitale europea. Nel 1737 fece costruire in soli sette mesi il Teatro di San Carlo; poi le regge di Portici e di Capodimonte. In quegli anni cominciarono anche gli scavi di Ercolano e di Pompei.\n\nNapoli era una delle capitali dell'Illuminismo. Nel gennaio 1799, con l'arrivo dell'esercito francese, i patrioti proclamarono la Repubblica Napoletana: durò solo fino a giugno. Al ritorno dei Borbone molti dei suoi protagonisti furono giustiziati.\n\nDopo gli anni dei Francesi (Giuseppe Bonaparte e Gioacchino Murat), nel 1815 tornarono i Borbone, e nel 1816 nacque il Regno delle Due Sicilie.","l":null,"foto":null},{"p":"1860–1945","t":"L'Italia unita e la guerra","x":"Il 7 settembre 1860 Giuseppe Garibaldi entrò a Napoli acclamato dalla folla; un plebiscito sancì l'unione al Regno d'Italia. Napoli smise di essere una capitale, e la perdita fu pesante.\n\nNella Seconda guerra mondiale la città subì più di 120 bombardamenti aerei, soprattutto per il suo porto; la gente si rifugiava nelle cisterne sotterranee. Dopo l'armistizio, i tedeschi occuparono la città. Alla fine di settembre 1943 i napoletani insorsero: nelle «Quattro giornate di Napoli» il popolo costrinse alla resa il presidio tedesco. Il 1° ottobre arrivarono gli Alleati.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Un'incisione d'epoca: Garibaldi acclamato dalla folla a Napoli","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Incisione d'epoca dell'ingresso di Garibaldi a Napoli, nel 1860: la folla lo acclama in via Toledo."}},{"p":"Dal 1945 a oggi","t":"La Napoli di oggi","x":"Dopo la guerra la città si ricostruì tra grandi difficoltà. Nel 1995 il centro storico è stato iscritto dall'UNESCO tra i Patrimoni dell'Umanità: è il più grande d'Italia e uno dei più vasti d'Europa.\n\nDal 2001 la metropolitana ha aperto le sue «stazioni dell'arte», con opere di artisti contemporanei. La città conta circa 950.000 abitanti, più di tre milioni con l'area metropolitana.\n\nE poi c'è la Napoli che vedrai camminando: i murales, come quello di Maradona nei Quartieri Spagnoli, e la Madonna di Banksy, la vita dei vicoli, il caffè. Tremila anni di storia, uno sopra l'altro, in pochi chilometri.","l":44,"foto":null}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio a Napoli","sub":"Un pittore in fuga e tre capolavori da vedere","som":"In fuga da Roma, Caravaggio trovò rifugio a Napoli due volte. Qui dipinse le Sette opere di Misericordia, la Flagellazione e il suo ultimo quadro.","txt":"Michelangelo Merisi, detto Caravaggio, era a Roma un pittore famoso e discusso. Negli ultimi giorni di maggio del 1606 ferì a morte Ranuccio Tomassoni in una rissa nata durante una partita a racchetta: condannato, dovette fuggire.\n\nNapoli, allora una delle città più grandi d'Europa, fu il suo rifugio due volte: dall'autunno 1606 all'estate 1607, e poi dall'autunno 1609 all'estate 1610. Qui trovò la protezione della famiglia Colonna e committenti ricchi, e qui la sua pittura cambiò per sempre l'arte della città.\n\nTre delle sue opere si possono vedere oggi a Napoli, due delle quali sul nostro percorso.","foto":null,"cap":[{"p":"1606–1607","t":"Il primo soggiorno e le Sette opere","x":"Il primo incarico napoletano documentato è dell'ottobre 1606. Pochi mesi dopo, entro il 9 gennaio 1607, Caravaggio consegnò al Pio Monte della Misericordia la grande tela delle Sette opere di Misericordia, pagata 400 ducati.\n\nÈ ancora lì, sull'altare per cui fu dipinta, in via dei Tribunali: una notte in un vicolo di Napoli, dove gli uomini si aiutano tra loro sotto lo sguardo della Madonna.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"p":"1607","t":"La Flagellazione","x":"Per la famiglia de Franchis, giuristi e magistrati, Caravaggio dipinse nel 1607 la Flagellazione di Cristo, per la loro cappella nella chiesa di San Domenico Maggiore: una tela alta quasi tre metri, uno dei capolavori del barocco napoletano.\n\nOggi l'originale è al Museo di Capodimonte, dove fu trasferito per motivi di sicurezza; in San Domenico Maggiore è rimasta una copia. Capodimonte è fuori dai nostri giri a piedi.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La Flagellazione di Cristo di Caravaggio: Gesù legato alla colonna tra i carnefici","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellazione di Cristo (1607), oggi al Museo di Capodimonte: la luce cade sul corpo di Gesù, legato alla colonna."}},{"p":"1607–1609","t":"Malta e la Sicilia","x":"Il 12-13 luglio 1607 Caravaggio arrivò a Malta, probabilmente su una galea dei Cavalieri partita da Napoli. Ma anche lì finì nei guai: dopo una rissa fu arrestato nell'agosto 1608, fuggì dal forte in cui era rinchiuso e riparò in Sicilia, a Siracusa.","l":null,"foto":null},{"p":"Ottobre 1609","t":"L'agguato del Cerriglio","x":"Nell'autunno 1609 tornò a Napoli, ancora sotto la protezione dei Colonna, sperando nel perdono del papa per poter rientrare a Roma.\n\nIn ottobre fu aggredito da quattro uomini davanti all'osteria del Cerriglio, una locanda famosa del tempo, e sfregiato al volto: la ferita fu così grave che a Roma si sparse la voce della sua morte.","l":null,"foto":null},{"p":"1610","t":"L'ultimo quadro","x":"Nella primavera del 1610 dipinse per il principe genovese Marcantonio Doria il Martirio di sant'Orsola: la tela fu finita in maggio, consegnata ancora fresca di vernice e spedita a Genova. È il quadro più tardo di Caravaggio che conosciamo, e si vede oggi alle Gallerie d'Italia in via Toledo, a sei minuti da Ceraldi. Tra i volti, alle spalle della santa, c'è il suo.\n\nNell'estate partì in barca verso Roma con alcuni quadri, sperando nel perdono. Fu arrestato per errore a Palo, e la barca ripartì con i dipinti. Morì a Porto Ercole il 18 luglio 1610 (o forse il giorno dopo), a 38 anni.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Neapel in fünf Minuten: Von der Sirene zur Neustadt","sub":"","som":"Erst Partenope, dann Neapolis: weil das historische Zentrum noch immer wie eine griechische Stadt gestaltet ist.","txt":"Neapel wurde zweimal gegründet. Das erste Mal hieß die Partenope, wie die mythische Sirene: Sie wurde im 7. Jahrhundert v. Chr. von Kolonisten griechischer Herkunft aus Cumae gegründet, die auf der Insel Megaride landeten, wo heute Castel dell'Ovo steht, und sich auf dem nahegelegenen Berg Echia niederließen.\n\nDas zweite Mal, um 470 v. Chr., entstand neben der alten Stadt eine neue: Neapolis, was auf Griechisch „neue Stadt“ bedeutet. Durch diese Stadt befinden Sie sich gerade. Ihre Straßen bilden ein regelmäßiges Raster, das auch nach fünfundzwanzig Jahrhunderten noch erkennbar ist: Das historische Zentrum von Neapel gehört zum UNESCO-Weltkulturerbe, gerade weil der Grundriss der griechischen Stadt bis heute erhalten geblieben ist.\n\nDrei parallel verlaufende Straßen, die Decumani, durchschneiden die Stadt von West nach Ost. Die unterste ist Spaccanapoli: etwa zwei Kilometer lang und so gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint – daher ihr Name. Im Zentrum verläuft die Via dei Tribunali, die Hauptdecumanus; weiter oben liegen die Via dell'Anticaglia und die Via della Sapienza, die obere Decumanus.\n\nVon Piazza Carità, wo wir seit 2002 sind, beginnt Spaccanapoli nur wenige Gehminuten entfernt, an der Piazza del Gesù Nuovo.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro und das schmelzende Blut","sub":"","som":"Dreimal im Jahr hält Neapel den Atem an über einer Phiole. Was geschieht dort, und was sagen Kirche und Wissenschaft dazu?","txt":"Im Dom von Neapel wird in einer Nische der Schatzkammer ein Fläschchen mit einer dunklen Substanz aufbewahrt, die der Überlieferung nach das Blut des heiligen Gennaro, des Schutzpatrons der Stadt, ist. Dreimal im Jahr – am Samstag vor dem ersten Sonntag im Mai, am 19. September (dem Festtag) und am 16. Dezember – wird das Fläschchen den Gläubigen gezeigt: Löst sich der Inhalt, der meist fest ist, auf, ist dies ein Grund zum Feiern; bleibt er fest, gilt dies für viele Neapolitaner als schlechtes Omen.\n\nDie erste bekannte Aufzeichnung der Verflüssigung stammt aus dem Jahr 1389. Die Reliquien werden nicht vom Klerus, sondern von der Deputation der Kapelle des Schatzes von San Gennaro bewacht, einer säkularen Institution, die 1601 gegründet wurde und der auch der Bürgermeister von Neapel angehört.\n\nDie Kirche vertritt eine vorsichtige Haltung: Sie spricht von einem „wunderbaren Ereignis“, erlaubt die Volksfrömmigkeit, erhebt sie aber nicht zum Glaubensinhalt. Zu den von Skeptikern vorgeschlagenen Erklärungen gehört die Thixotropie, die Eigenschaft bestimmter Substanzen, im Ruhezustand fest zu sein und bei Bewegung oder Schütteln flüssig zu werden.\n\nDas Heilige und das Profane existierten hier schon immer nebeneinander: In der Via Duomo, nur wenige Schritte vom Dom entfernt, malte der Straßenkünstler Jorit einen San Gennaro mit dem Gesicht eines Arbeiters.","foto":null,"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Napoli in sette tradizioni: dal panaro al miracolo di San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Die armen Seelen: Als Neapel einen Totenkopf adoptierte","sub":"","som":"Ossuarien, capuzzelle und Gebete im Tausch gegen Lottozahlen: der Kult der namenlosen Toten.","txt":"Jahrhundertelang wurden die namenlosen Toten in Neapel nicht allein gelassen. Man nannte sie „anime pezzentelle“: die armen Seelen, die ohne Begräbnis und ohne Fürbitter starben. Der Name leitet sich von „pezzente“, dem armen Mann, ab, aber auch vom lateinischen „petere“, bitten, um zu empfangen: Wer für sie betete, hoffte im Gegenzug Schutz und Gnade zu erlangen.\n\nDer symbolträchtige Ort ist der Friedhof Fontanelle im Stadtteil Sanità: ein Tuffsteinbruch aus dem 16. Jahrhundert, der sich über etwa viertausend Quadratmeter erstreckt und die Opfer der Pest von 1656 und später der Cholera von 1836/37 aufnahm. 1872 ordnete Kanonikus Gaetano Barbati die Gebeine in drei Schiffen an. Gläubige „adoptierten“ einen Schädel, eine sogenannte Capuzzella: Sie reinigten ihn, stellten ihn in einen kleinen Schrein, schmückten ihn mit Rosenkränzen und Münzen und beteten zu ihm, in der Hoffnung auf ein Zeichen im Traum, manchmal auch auf eine Lottozahl. Einige Schädel erlangten Berühmtheit: der des Kapitäns mit der geschwärzten Augenhöhle, um den sich eine Legende von Ehe und Eifersucht rankt; Donna Concetta, die der Legende nach „schwitzt“, wenn ihr Gnade zuteilwird.\n\n1969 schloss ein Dekret des Kirchengerichts das Beinhaus und verbot die dort stattfindenden Gottesdienste. Nach Renovierungsarbeiten, die seit 2020 andauerten, wurde der Friedhof 2026 wiedereröffnet und wird von der Genossenschaft La Paranza verwaltet.\n\nDer Kult lebt auch unterhalb der Via dei Tribunali fort, im Hypogäum von Santa Maria delle Anime del Purgatorio ad Arco, der Kirche, die die Neapolitaner „'e cape 'e morte“ nennen: Dort wird der Schädel der Lucia, einer besonders verehrten jungen Seele, aufbewahrt. Und in der kleinen Kirche Santa Luciella an der Via San Biagio dei Librai befindet sich ein einzigartiger Schädel: der mit den Ohren.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoterisches Neapel: Ein Alchemistenprinz, eine verschlüsselte Fassade und ein magisches Ei","sub":"","som":"Raimondo di Sangro, die Rustizierung des Gesù Nuovo, Virgils Ei, das munaciello: Wo die Geschichte endet und die Legende beginnt.","txt":"Neapel liebt Geheimnisse, und es birgt einige besonders faszinierende. Das berühmteste hat einen Namen: Raimondo di Sangro, Fürst von Sansevero, ein Mann des 18. Jahrhunderts, Großmeister der neapolitanischen Freimaurerei und ein eifersüchtiger Erfinder seiner eigenen Geheimnisse. Schon zu Lebzeiten umgab ihn ein Mythos, den er selbst weiter befeuerte. Benedetto Croce nannte ihn die neapolitanische Reinkarnation von Doktor Faustus. Die düstere Legende schreibt ihm alles zu: Diener, die getötet wurden, um ihre Leichen zu studieren, sogar die Blendung des Bildhauers des Verschleierten Christus, damit dieser keinen weiteren schuf. Dies sind Legenden, und das Museum selbst unterscheidet sie von der belegten Geschichte.\n\nDer Verschleierte Christus ist ein Werk von Giuseppe Sanmartino, im Auftrag des Fürsten: Der transparente Schleier, der den Körper bedeckt, ist aus demselben Marmorblock gefertigt wie die Statue. In der unterirdischen Höhle der Kapelle befinden sich die „anatomischen Maschinen“, zwei Skelette mit rekonstruierten Kreislaufsystemen, die der Palermer Arzt Giuseppe Salerno um 1756–1764 schuf. Der Legende nach beinhalteten sie geheimnisvolle Injektionen und Studien mit Bienenwachs und Farbstoffen.\n\nUnweit davon ist die Fassade des Gesù Nuovo, ursprünglich 1470 als Palazzo Sanseverino erbaut, mit einem pyramidenförmigen Mauerwerk aus dunklem Piperno-Stein verkleidet. Einige Steine tragen eingravierte Markierungen: Der Legende nach eine geheime Botschaft; manche Gelehrte halten sie für die Zeichen der Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten zu lesen, eine etwa dreiviertelstündige Partitur namens „Enigma“. Eine verlockende Hypothese, aber keine Gewissheit.\n\nUnd dann ist da noch das Meer: Der Legende nach versteckte der Dichter Vergil das Ei der Sirene Partenope in den Kellern von Castel dell'Ovo. Solange das Ei unversehrt bleibt, steht auch die Burg.\n\nIn den Häusern hingegen wohnen die Geister der Volkstradition: der munaciello, ein vermummter Elf, der je nachdem, wie man ihn behandelt, Glück oder Unheil bringt, und die bella 'mbriana, ein guter Hausgeist, der als Schmetterling oder Gecko erscheinen kann.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Neapel heute: Was gibt es Neues?","sub":"","som":"Der Maradona gewidmete Platz, die Straßenkunst, das letzte Caravaggio-Gemälde in der Via Toledo, wiedereröffnete Kirchen und Beinhäuser: die Stadt im Wandel.","txt":"Wer nach einigen Jahren nach Neapel zurückkehrt, findet eine Stadt vor, die gelernt hat, ihre Geschichte zu erzählen.\n\nIm spanischen Viertel, nur neun Minuten von uns entfernt, liegt Largo Maradona. Das Wandgemälde von Diego Maradona wurde 1990 von Mario Filardi geschaffen; im Laufe der Jahre verblasste es fast vollständig, wurde dann aber von Salvatore Iodice restauriert, und im Herbst 2017 übermalte der Argentinier Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 entwickelte sich der Platz, der zuvor Künstlerplatz genannt wurde, zu einem säkularen Wallfahrtsort mit kleinen Altären, argentinischen Flaggen und Fotografien. Er war so beliebt, dass die Stadtverwaltung den Fußgängerverkehr regeln musste.\n\nDie Streetart hat Einzug in die Altstadt gehalten: Auf der Piazzetta dei Girolamini prangt, geschützt durch Glas, Banksys „Madonna mit Pistole“; in der Via Duomo findet sich Jorits „San Gennaro der Arbeiter“. Die offizielle Tourismuswebsite der Stadt hat ihnen eine eigene Route gewidmet.\n\nIn der Via Toledo, nur sechs Minuten von uns entfernt, beherbergt die Gallerie d'Italia das Martyrium der Heiligen Ursula, Caravaggios letztes Gemälde, sowie über fünfhundert attische und Magna-Graecia-Vasen.\n\nUnd Orte, die lange Zeit geschlossen waren, werden wiedereröffnet: Die Kirche Santa Luciella ai Librai, die über dreißig Jahre lang verlassen war, wurde am 5. April 2019 wieder für die Öffentlichkeit zugänglich gemacht; der Friedhof Fontanelle wurde 2026 wiedereröffnet.","foto":null,"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artis function dataLunga(s){ return new Intl.DateTimeFormat(D.lingua, {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'}).format(new Date(s + 'T12:00:00Z')); }
function verificati(l, ora){ return !!(l.ov && l.ovi) && (Date.parse(ora.data) - Date.parse(l.ovi)) / 864e5 <= SCADENZA_GIORNI; }
function fasce(l, data, gs){ return l.or.filter(function(o){ return o.g && o.g.indexOf(gs) >= 0 && (!o.dal || o.dal <= data) && (!o.al || o.al >= data); }); }
function stato(l, ora, minuto){
  if(l.sa) return {k: 'sempre'};
  if(!verificati(l, ora)) return {k: 'verifica'};
  var fs = fasce(l, ora.data, ora.gs);
  if(fs.some(function(o){ return o.x; })) return {k: 'chiuso_oggi'};
  fs = fs.filter(function(o){ return o.da && o.a; }).sort(function(a, b){ return hm(a.da) - hm(b.da); });
  if(!fs.length) return {k: 'chiuso_oggi'};
  for(var i = 0; i < fs.length; i++){
    var da = hm(fs[i].da), a = hm(fs[i].a), ui = fs[i].ui ? hm(fs[i].ui) : a;
    if(minuto < da) return {k: 'apre', da: fs[i].da};
    if(minuto < a) return minuto <= ui ? {k: 'aperto', a: fs[i].a, ui: fs[i].ui} : {k: 'chiuso_ora'};
  }
  return {k: 'chiuso_ora'};
}
function chiusoA(s, minuto){ return s.k === 'chiuso_oggi' || s.k === 'chiuso_ora' || (s.k === 'apre' && hm(s.da) - minuto > 30); }
function etichetta(s){
  switch(s.k){
    case 'sempre': return '<span class="stato ok">' + e(T.sempre) + '</span>';
    case 'verifica': return '<span class="stato att">' + e(T.in_verifica) + '</span>';
    case 'aperto': return '<span class="stato ok">' + e(T.aperto) + ' · ' + e(T.chiude_alle) + ' ' + e(s.a) + '</span>' + (s.ui ? ' <span class="piccolo">' + e(T.ultimo_ingresso) + ' ' + e(s.ui) + '</span>' : '');
    case 'apre': return '<span class="stato att">' + e(T.apre_alle) + ' ' + e(s.da) + '</span>';
    case 'chiuso_ora': return '<span class="stato ko">' + e(T.chiuso_ora) + '</span>';
    default: return '<span class="stato ko">' + e(T.chiuso_oggi) + '</span>';
  }
}
function durata(m){ if(!m) return ''; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : m + ' ' + T.min; }
function km(m){ return m ? (m / 1000).toLocaleString(D.lingua, {maximumFractionDigits: 1}) + ' ' + T.km : ''; }

function schizzo(i){ /* disegno del percorso reale per la scheda dell'itinerario (leggero, senza mappa) */
  var pts = [], KX = 84300, KY = 111000;
  i.tappe.forEach(function(t){ (t.geo || []).forEach(function(c){ pts.push([(c[0] - 14.24) * KX, (40.86 - c[1]) * KY]); }); });
  if(pts.length < 2) return '';
  var x0 = Math.min.apply(0, pts.map(function(p){ return p[0]; })), x1 = Math.max.apply(0, pts.map(function(p){ return p[0]; }));
  var y0 = Math.min.apply(0, pts.map(function(p){ return p[1]; })), y1 = Math.max.apply(0, pts.map(function(p){ return p[1]; }));
  var pad = 60, w = x1 - x0 + 2 * pad, h = Math.max(y1 - y0 + 2 * pad, w * 0.45);
  var h2 = '<svg viewBox="' + [x0 - pad, y0 - pad - (h - (y1 - y0 + 2 * pad)) / 2, w, h].map(Math.round).join(' ') + '" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:220px;background:var(--accento-chiaro)" aria-hidden="true">';
  i.tappe.forEach(function(t){ if(t.geo) h2 += '<polyline points="' + t.geo.map(function(c){ return ((c[0] - 14.24) * KX).toFixed(0) + ',' + ((40.86 - c[1]) * KY).toFixed(0); }).join(' ') + '" fill="none" stroke="var(--scuro)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'; });
  var k = 0; i.tappe.forEach(function(t, n){ var l = LU[t.l]; if(n === i.tappe.length - 1 && casa(l)) return; var x = (l.lon - 14.24) * KX, y = (40.86 - l.lat) * KY, c = casa(l);
    h2 += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="30" fill="' + (c ? 'var(--accento)' : 'var(--scuro)') + '" stroke="var(--superficie)" stroke-width="8"/><text x="' + x.toFixed(0) + '" y="' + (y + 11).toFixed(0) + '" text-anchor="middle" font-size="32" font-family="Jost,system-ui,sans-serif" font-weight="500" fill="var(--su-scuro)">' + (c ? 'C' : ++k) + '</text>'; });

/* ---------- copertina dell'itinerario: una mappa vera (stessi tasselli della guida, senza rete esterna) fotografata una volta,
   con il percorso e le foto piccole dei luoghi sopra. Il disegno leggero resta sotto finché la mappa non è pronta (e se la mappa non si carica). */
var COPERTINE = {}, codaCopertine = [], copertinaInCorso = false, inCoda = {};
function copertina(i){ return '<span class="copertina-giro" data-giro="' + e(i.s) + '">' + schizzo(i) + '</span>'; }
function preparaCopertine(){ document.querySelectorAll('.copertina-giro[data-giro]').forEach(function(el){ var i = IT[el.getAttribute('data-giro')]; if(!i) return;
  var w = Math.round(el.clientWidth); if(!w) return; var k = i.s + '@' + w;
  if(COPERTINE[k]) return mettiCopertina(el, COPERTINE[k], true);
  if(!inCoda[k]){ inCoda[k] = 1; codaCopertine.push({i: i, w: w, k: k}); } }); prossimaCopertina(); }
function mettiCopertina(el, c, subito){ if(el.querySelector('img.fondo')) return; if(subito) el.classList.add('pronta');
  var h = '<img class="fondo" alt="" src="' + c.img + '">' + c.pin.map(function(p){ return '<span class="pin ' + p.cl + '" style="left:' + p.x + '%;top:' + p.y + '%">' + p.h + '</span>'; }).join('') + '<span class="osm">© OpenStreetMap</span>';
  el.insertAdjacentHTML('beforeend', h); requestAnimationFrame(function(){ el.classList.add('pronta'); }); }
function prossimaCopertina(){ if(copertinaInCorso || !codaCopertine.length) return; var job = codaCopertine.shift(); copertinaInCorso = true;
  var fine = function(){ delete inCoda[job.k]; copertinaInCorso = false; prossimaCopertina(); };
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var H = 220, box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-12000px;top:0;width:' + job.w + 'px;height:' + H + 'px';
    document.body.appendChild(box);
    var m = new maplibregl.Map({container: box, style: r[1], interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: {preserveDrawingBuffer: true}, preserveDrawingBuffer: true, center: [14.2532, 40.8475], zoom: 14});
    var b = new maplibregl.LngLatBounds(), linee = [];
    job.i.tappe.forEach(function(t){ var l = LU[t.l]; b.extend([l.lon, l.lat]); if(t.geo){ linee.push(t.geo); t.geo.forEach(function(c){ b.extend(c); }); } });
    m.fitBounds(b, {padding: {top: 46, bottom: 40, left: 44, right: 44}, maxZoom: 16, duration: 0});
    var chiuso = false, chiudi = function(){ if(chiuso) return; chiuso = true; try{ m.remove(); }catch(x){} box.remove(); fine(); };
    var timer = setTimeout(chiudi, 15000);
    m.on('load', function(){
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addSource('p', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(c){ return {type: 'Feature', properties: {}, geometry: {type: 'LineString', coordinates: c}}; })}});
      m.addLayer({id: 'pb', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': 7}});
      m.addLayer({id: 'pl', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': scuro, 'line-width': 4}});
      m.once('idle', function(){
        try{
          var img = m.getCanvas().toDataURL('image/jpeg', 0.82), pin = [], k = 0, conFoto = [];
          /* foto piccole solo dove c'è spazio (almeno 50 px dalle altre foto): nei vicoli fitti le tappe vicine restano un pallino numerato */
          job.i.tappe.forEach(function(t, n){ var l = LU[t.l], c = casa(l); if(n === job.i.tappe.length - 1 && c) return;
            var q = m.project([l.lon, l.lat]), x = Math.round(q.x / job.w * 1000) / 10, y = Math.round(q.y / H * 1000) / 10;
            if(c){ pin.push({cl: 'punto casa', x: x, y: y, h: 'C'}); return; }
            k++;
            var libero = conFoto.every(function(o){ return Math.hypot(o[0] - q.x, o[1] - q.y) >= 50; });
            if(l.foto && libero){ conFoto.push([q.x, q.y]); pin.push({cl: '', x: x, y: y, h: '<img alt="" src="' + e(l.foto.u) + '"><b>' + k + '</b>'}); }
            else pin.push({cl: 'punto', x: x, y: y, h: String(k)}); });
          pin.sort(function(a, b){ return (a.cl === '' ? 1 : 0) - (b.cl === '' ? 1 : 0); }); /* le foto sopra i pallini */
          COPERTINE[job.k] = {img: img, pin: pin};
          document.querySelectorAll('.copertina-giro[data-giro="' + job.i.s + '"]').forEach(function(el){ if(Math.round(el.clientWidth) === job.w) mettiCopertina(el, COPERTINE[job.k]); });
        }catch(x){}
        clearTimeout(timer); chiudi(); });
    });
    m.on('error', function(){});
  }).catch(fine);
}

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null, GEO = {}; window.MAPPE = {};
function caricaMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return mlPromessa || (mlPromessa = new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = PRE + 'mappa/maplibre-gl.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }));
}
function stile(){ var base = new URL(PRE + 'mappa/', location.href).href;
  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"')); }); }
/* opz: punti [{t,n,lat,lon,h,casa,spento}], linee [{c:coordinate, s:'fatto'|'ora'|'poi'|''}], geo (controllo «tu sei qui»), dopo(m) */
function mappa(id, opz){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18, maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}});
    MAPPE[id] = m;
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    if(opz.geo){
      var g = new maplibregl.GeolocateControl({positionOptions: {enableHighAccuracy: true, timeout: 15000}, trackUserLocation: true, fitBoundsOptions: {maxZoom: 17}});
      m.addControl(g, 'top-right'); GEO[id] = g;
      var msg = document.getElementById(id + '-msg');
      g.on('error', function(){ if(msg){ msg.textContent = T.pos_negata; msg.hidden = false; } });
      g.on('outofmaxbounds', function(){ if(msg){ msg.textContent = T.fuori_zona; msg.hidden = false; } });
      g.on('geolocate', function(){ if(msg) msg.hidden = true; });
    }
    var b = new maplibregl.LngLatBounds(), linee = opz.linee || [];
    if(linee.length) m.on('load', function(){
      m.addSource('percorso', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(x){ return {type: 'Feature', properties: {s: x.s || ''}, geometry: {type: 'LineString', coordinates: x.c}}; })}});
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addLayer({id: 'percorso-bordo', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': ['match', ['get', 's'], 'ora', 12, 9]}});
      m.addLayer({id: 'percorso', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'},
        paint: {'line-color': ['match', ['get', 's'], 'fatto', '#9a958c', scuro], 'line-width': ['match', ['get', 's'], 'ora', 7, 5], 'line-opacity': ['match', ['get', 's'], 'poi', 0.45, 1]}});
    });
    linee.forEach(function(x){ x.c.forEach(function(p){ b.extend(p); }); });
    (opz.punti || []).forEach(function(p){
      var d = document.createElement('a'); d.className = 'pin' + (p.casa ? ' casa' : '') + (p.spento ? ' spento' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(!b.isEmpty() && ((opz.punti || []).length > 1 || linee.length)) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0});
    else if(!b.isEmpty()) m.jumpTo({center: b.getCenter(), zoom: 16});
    if(opz.dopo) opz.dopo(m);
  }).catch(function(){ el.innerHTML = ''; });
}

/* ---------- audio: voce del telefono (gratuita, senza rete) ---------- */
function ascolta(l, btn){
  try{
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn) btn.textContent = '▶ ' + T.ascolta; return; }
    var parti = [l.n, l.som].concat((l.dett || []).map(function(x){ return x.t + '. ' + (x.d ? x.d + '. ' : '') + x.x; }), [l.rac, l.leg]);
    var u = new SpeechSynthesisUtterance(parti.filter(Boolean).join('. '));
    u.lang = VOCE[D.lingua] || D.lingua; u.onend = function(){ if(btn) btn.textContent = '▶ ' + T.ascolta; };
    speechSynthesis.speak(u); if(btn) btn.textContent = '■ ' + T.ferma;

/* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;
function xy(c){ return [(c[0] - 14.25) * KXm, (c[1] - 40.85) * KYm]; }
function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */
  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;
}
function salvaGiro(){ try{ localStorage.setItem('guida_giro', JSON.stringify({s: G.s, k: G.k, t: Date.now()})); }catch(x){} }
function giroSalvato(){ try{ var g = JSON.parse(localStorage.getItem('guida_giro') || 'null'); return g && Date.now() - g.t < 12 * 3600e3 ? g : null; }catch(x){ return null; } }
var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!G) return;

      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  } else if(!l.sa) info += '<p>' + etichetta({k: 'verifica'}) + '</p>';
  var pr = [];
  if(l.dv) pr.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) pr.push(e(T.gratuito)); else if(l.gr === false) pr.push(e(T.pagamento));
  if(l.mp) pr.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';
  if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';
  if(l.fc) info += '<p>' + e({si: T.foto_si, no: T.foto_no, senza_flash: T.foto_senza_flash}[l.fc] || '') + '</p>';
  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(r.ap ? T.prima_di_partire : T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.sub ? '<p class="piccolo">' + e(r.sub) + '</p>' : '') + (r.foto ? '<div class="galleria uno">' + figura(r.foto) + '</div>' : '') + '<div class="testo">' + par(r.txt) + '</div>';
  if(r.cap.length){
    h += '<nav class="indice" aria-label="' + e(T.indice) + '"><b style="font-weight:500">' + e(T.indice) + '</b><ol>' + r.cap.map(function(c, n){ return '<li><button onclick="document.getElementById(\'cap-' + n + '\').scrollIntoView({behavior:\'smooth\'})">' + (c.p ? '<span class="per">' + e(c.p) + '</span>' : '') + '<span>' + e(c.t) + '</span></button></li>'; }).join('') + '</ol></nav>';
    h += r.cap.map(function(c, n){ var l = c.l && LU[c.l];
      return '<section class="capitolo" id="cap-' + n + '">' + (c.p ? '<span class="etichetta">' + e(c.p) + '</span>' : '') + '<h2>' + e(c.t) + '</h2>' +
        (c.foto ? '<figure><div class="ft"><img src="' + e(c.foto.u) + '" alt="' + e(c.foto.alt) + '" loading="lazy"></div><figcaption>' + (c.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(c.foto.dida) + '</span>' : '') + '<span class="cr">' + e(c.foto.aut) + ' · ' + e(c.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="testo">' + par(c.x) + '</div>' + (l ? '<a class="btn sec" href="#/l/' + e(l.s) + '">' + e(f(T.lo_vedi, {n: l.n})) + ' →</a>' : '') + '</section>'; }).join('');
  }
  return h + assaggio(r.col, T.da_ceraldi_et) + daLeggere(r.col) + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
