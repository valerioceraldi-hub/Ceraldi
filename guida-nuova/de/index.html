<title>Neapel-Führer · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="../caratteri/caratteri.css">

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:var(--superficie);border-radius:14px;padding:14px}
.guarda .mini{width:32px;height:32px;position:relative}
.guarda.con-foto{grid-template-columns:minmax(0,1fr);padding:0 0 14px;overflow:hidden}
.guarda.con-foto .mini{width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.guarda.con-foto>div:last-child{padding:0 14px}
.guarda .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.02rem}
.guarda .dove{font-size:.82rem;color:var(--accento);font-weight:500}
.guarda p{font-size:.95rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"de","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità und Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Ausgangspunkt: Piazza Carità an der Via Toledo. Von hier aus beginnt die Altstadt in wenigen Gehminuten. Und dort befindet sich Ceraldi.","rac":"","con":"Bevor es losgeht, noch ein Kaffee: Die Tour ist lang und Neapel lässt sich am besten mit der richtigen Tasse Kaffee erkunden.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità oggi, con gli alberi e i palazzi colorati","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità oggi, sulla via Toledo: da qui partono tutti i giri. Ceraldi è qui."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Foto d'epoca di via Toledo nell'Ottocento, con carrozze e passanti","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo nell'Ottocento, quando si chiamava via Roma, in una foto di Giacomo Brogi."}],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, der untere Decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"Die schnurgerade Straße, die das historische Zentrum in zwei Hälften teilt: der untere Decumanus der griechischen Stadt, etwa zwei Kilometer Kirchen, Geschäfte und Leben.","rac":"Spaccanapoli ist die unterste der drei Decumani, jener parallel verlaufenden Straßen, die das griechische Neapolis von West nach Ost durchquerten. Sie beginnt an der Piazza del Gesù Nuovo als Via Benedetto Croce, geht dann in die Via San Biagio dei Librai über, kreuzt die Via Duomo und führt über die Altstadt hinaus: insgesamt etwa zwei Kilometer. Der Name ist Programm: Sie ist so lang und gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint.","con":"Gehen Sie die Straße entlang von der Piazza del Gesù in Richtung Via Duomo: Es ist ein leichter Abstieg durch die Geschichte, nicht durch Anstrengung.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Platz und Kirche von Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Fassade aus pyramidenförmigen Steinen, die wie eine Festung aussieht und ein Geheimnis birgt: eingravierte Zeichen, die noch niemand mit Sicherheit entziffern konnte.","rac":"Bevor es zur Kirche wurde, war es ein Palast: der Palast der Fürsten von Sanseverino, erbaut 1470; eine Gedenktafel an der Fassade erinnert an den Architekten Novello da San Lucano. Die Jesuiten bewahrten die Struktur und den dunklen Piperno-Quader, dessen Steine in Pyramidenform geschnitten wurden, und ergänzten sie mit Elementen aus weißem Marmor.\n\nManche Steine weisen eingravierte Zeichen auf. Der Legende nach handelt es sich um eine geheime Botschaft; einige Gelehrte glauben, es seien die Spuren verschiedener Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten einer Partitur namens „Enigma“ zu lesen. Betrachten Sie sie genau und bilden Sie sich Ihre eigene Meinung.\n\nDie Fassade wurde restauriert und am 12. März 2023 wiedereröffnet, nachdem im Dezember 2017 einige Fragmente herabgefallen waren; der Platz ist seitdem für Autos gesperrt.","con":"Halten Sie Ausschau nach den Markierungen auf den Steinen in Augenhöhe, rechts und links vom Portal: Die Suche ist kostenlos.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La facciata del Gesù Nuovo, di pietre scure tagliate a punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La facciata a punte di diamante: era il palazzo dei principi Sanseverino, del 1470. Avvicinati e cerca i segni incisi sulle pietre."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"Die rautenförmige Fassade","x":"Bevor es eine Kirche wurde, war es die Fassade des Palastes der Fürsten von Sanseverino aus dem Jahr 1470. Die Jesuiten bewahrten sie im Originalzustand mit ihren dunklen, pyramidenförmig behauenen Steinen und fügten das große Barockportal hinzu. Kommen Sie näher: Viele der Steine tragen eingravierte Zeichen, deren Bedeutung bis heute nicht eindeutig geklärt ist.","d":"Draußen, auf dem Platz","foto":null},{"t":"Die Vertreibung des Heliodorus","x":"Das große Fresko an der Gegenfassade stammt von Francesco Solimena aus dem Jahr 1725. Es zeigt Heliodorus, der versucht, den Tempel von Jerusalem zu plündern und von einem himmlischen Ritter zurückgeschlagen wird: eine Szene voller Bewegung, Pferde und fliehender Gestalten. Viele Besucher übersehen es, weil sie den Eingang mit Blick auf den Altar betreten.","d":"Sobald Sie eintreten, wenden Sie sich zur Tür: Sie befindet sich über dem Eingang.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"Il grande affresco della Cacciata di Eliodoro di Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"L'affresco di Solimena sopra l'ingresso: girati verso la porta per vederlo. Al centro il cavaliere celeste che respinge Eliodoro."}},{"t":"Die Kuppel und die vier Evangelisten","x":"Die vier Dreiecke am Fuß der Kuppel stellen die Evangelisten dar und wurden von Giovanni Lanfranco gemalt. Die Kuppel, die Sie sehen, ist jedoch nicht die ursprüngliche: Sie stürzte beim Erdbeben von 1688 ein und wurde 1786 durch einen niedrigeren, schalenförmigen Bau ersetzt.","d":"Im Zentrum der Kirche, schau nach oben","foto":null},{"t":"Die Kapelle Sant'Ignazio","x":"Das dem Gründer des Jesuitenordens gewidmete Gotteshaus vereint zwei bedeutende Namen der neapolitanischen Kunst des 17. Jahrhunderts: Cosimo Fanzago, Schöpfer der Architektur und der Statuen der Propheten David und Jeremia, und Jusepe de Ribera, der Gemälde mit Darstellungen aus dem Leben des Heiligen schuf. Farbiger Marmor, Statuen und Gemälde verschmelzen zu einem harmonischen Ganzen: Neapolitanischer Barock in seiner schönsten Form.","d":"In einer der beiden großen Kapellen der Kirche","foto":null},{"t":"Heiliger Josef Moscati","x":"Hier befindet sich die Ruhestätte des „heiligen Arztes“ von Neapel: Giuseppe Moscati, ein Forscher und Universitätsprofessor, der sich unentgeltlich um die Armen kümmerte. Er starb 1927 und wurde 1987 heiliggesprochen. Seine Gebeine ruhen in einer Bronzeurne des Bildhauers Amedeo Garufi unter dem Altar der Kapelle Mariä Heimsuchung.","d":"In der Kapelle der Heimsuchung, unter dem Altar","foto":null}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La piazza del Gesù Nuovo davanti alla chiesa","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La piazza del Gesù Nuovo, davanti alla chiesa."},{"u":"../img/6d1ae4837518.jpg","alt":"L'interno del Gesù Nuovo, con marmi colorati e l'altare maggiore","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, il contrasto con la facciata severa: marmi colorati, affreschi e oro fino all'altare maggiore."},{"u":"../img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo vista dall'ingresso","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata vista dall'ingresso: in fondo, in alto, la cupola con gli evangelisti di Lanfranco alla base."}],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Kloster und Komplex Santa Chiara (Majolika-Kreuzgang)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Der mit Majolika verkleidete Kreuzgang ist einer der ruhigsten Orte im Zentrum: nur einen Steinwurf vom Chaos von Spaccanapoli entfernt, Stille.","rac":"Santa Chiara wurde 1310 im Auftrag von König Robert von Anjou und Königin Sancha von Mallorca erbaut. Die Bauleitung übernahm zunächst Gagliardo Primario, später Lionardo di Vito. 1340 wurde die Kirche für den Gottesdienst eröffnet. Der Komplex bestand aus zwei Teilen: einem benachbarten, aber separaten Kloster der Klarissen und einem der Franziskaner.\n\nVier Jahrhunderte später wurde auf Anregung von Königin Maria Amalia von Sachsen, der Gemahlin Karls von Bourbon, das Klarissenkloster renoviert. Der Architekt Domenico Antonio Vaccaro bewahrte die gotischen Bögen aus dem 14. Jahrhundert und verwandelte das Zentrum in einen barocken Garten, dessen Wände mit Majolikafliesen aus der Werkstatt von Donato und Giuseppe Massa gesäumt sind. Das Ergebnis ist einer der überraschendsten Orte Neapels: ein Keramikgarten nur wenige Schritte von Spaccanapoli entfernt.","con":"Sonntags schließt der Kreuzgang um 14 Uhr: Wenn es Sonntagnachmittag ist, tauschen Sie die Reihenfolge und kommen Sie zuerst hierher.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Kloster und Museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Kloster und Museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"}],"ant":true,"dett":[{"t":"Die Majolikasäulen","x":"Vierundsechzig Säulen, bedeckt mit Majolikafliesen und Girlanden aus Blättern, Blüten und Früchten, stehen unter einer Pergola. Die gelben, orangen und blauen Farbtöne erinnern an die Zitrusbäume und Weinreben, die sie umgeben. Die Majolikafliesen stammen aus der Werkstatt von Donato und Giuseppe Massa und befinden sich in dem von Domenico Antonio Vaccaro entworfenen Barockgarten.","d":"Im Klostergarten","foto":{"u":"../img/924627d30fda.jpg","alt":"Pilastri rivestiti di maioliche gialle e verdi nel chiostro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"I pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto il pergolato."}},{"t":"Die Szenen auf den Sitzen","x":"Die Sitzbänke zwischen den Säulen sind alle aus Majolika, und die Rückenlehnen sind mit kleinen Szenen bemalt: ländliches Leben, Küstenleben, Volksfeste, Mythen. Sie stellen das neapolitanische Leben des 18. Jahrhunderts in Bildern dar. Setzen Sie sich und betrachten Sie die Sitzbank hinter Ihnen genauer.","d":"Auf den Rückenlehnen zwischen den Säulen","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un sedile di maiolica con una scena dipinta sullo schienale","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un sedile di maiolica del chiostro: sullo schienale c'è una scena dipinta."}},{"t":"Clarissa mit den Katzen","x":"Unter den Szenen ist eine Klarissenschwester zu sehen, die die Klosterkatzen füttert: ein kleiner Einblick in den Klosteralltag, gemalt auf Majolika. Sie zu entdecken ist eine perfekte Schatzsuche, auch für Kinder.","d":"An einer der Sitzlehnen: Suchen Sie danach.","foto":null},{"t":"Die Bögen des vierzehnten Jahrhunderts","x":"Der Garten ist barock, das Ambiente jedoch mittelalterlich: Vaccaro bewahrte die Umfassungsmauer aus dem 14. Jahrhundert mit den Spitzbögen des angevinischen Klosters. Beachten Sie den Kontrast zwischen dem schlichten Stein der Bögen und den leuchtenden Farben der Majolikafliesen: vier Jahrhunderte auf einen Blick.","d":"Entlang der vier Seiten des Kreuzgangs","foto":null}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Maioliche con una scena di caccia al cinghiale","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Da vicino: una caccia al cinghiale dipinta sulle maioliche dalla bottega dei Massa, tra il 1739 e il 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"Il chiostro con i pilastri di maiolica, i sedili e il giardino","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Il chiostro intero: i pilastri di maiolica, i sedili e il giardino."}],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Kapelle","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Der Verschleierte Christus, eine der berühmtesten Skulpturen der Welt, und die anatomischen Maschinen des Alchemistenfürsten Raimondo di Sangro.","rac":"Die Kapelle der Familie di Sangro ist das Reich von Raimondo, Prinz von Sansevero: ein Mann der Wissenschaft und der Geheimnisse, Großmeister der Freimaurerei, um den sich der Mythos bereits zu seinen Lebzeiten rankte, und er selbst befeuerte ihn.\n\nIm Zentrum steht Giuseppe Sanmartinos Verschleierter Christus, ein Auftragswerk des Fürsten: ein liegender Körper, bedeckt mit einem so dünnen Leichentuch, dass es an ein nasses Tuch erinnert, und doch aus demselben Marmorblock gehauen wie die Statue. In der unterirdischen Höhle befinden sich zwei „anatomische Maschinen“, die Skelette eines Mannes und einer Frau mit rekonstruierten Blutgefäßen, ein Werk des Palermer Arztes Giuseppe Salerno aus den Jahren 1756–1764. Die Legende erzählt von geopferten Dienern und mysteriösen Injektionen; das Museum selbst trennt sorgfältig Mythos und belegte Geschichte.","con":"Dienstags ist es geschlossen: Wenn heute Dienstag ist, ist die Statue des Nils zwei Minuten entfernt und kann jederzeit besichtigt werden.","acc":"Das Kirchenschiff und die Sakristei sind rollstuhlgerecht. Das unterirdische Auditorium mit seinen anatomischen Apparaturen ist nur über eine schmale Wendeltreppe aus dem 19. Jahrhundert erreichbar.","foto":{"u":"../img/65421f883be6.jpg","alt":"L'esterno della Cappella Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Cappella Sansevero vista da fuori."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Der verschleierte Christus","x":"Ein Körper, ausgestreckt auf einer Matratze, bedeckt mit einem so dünnen Leichentuch, dass Gesicht, Wunden und Adern darunter durchscheinen. Der Schleier ist nicht nachträglich hinzugefügt: Giuseppe Sanmartino schuf ihn aus demselben Marmorblock wie die Statue, im Auftrag von Fürst Raimondo di Sangro. Gehen Sie langsam um die Statue herum: Der Schleier scheint sich auf jeder Seite zu verändern.","d":"Im Zentrum des Kirchenschiffs","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Il volto del Cristo velato sotto il velo di marmo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Il volto sotto il velo: il sudario è scolpito nello stesso blocco di marmo della statua, eppure sembra stoffa bagnata."}},{"t":"Bescheidenheit","x":"Eine Frau, in einen Schleier gehüllt, der wie nass an ihrer Haut klebt, mit einem Rosenkranz. Die Skulptur wurde 1752, im Todesjahr von Antonio Corradini, geschaffen. Der Prinz widmete sie seiner Mutter Cecilia Gaetani, die starb, als er noch nicht einmal ein Jahr alt war. Achten Sie auf den zerbrochenen Grabstein zu ihren Füßen: Er zeugt von einem viel zu früh beendeten Leben.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La statua della Pudicizia, una donna coperta da un velo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La Pudicizia di Antonio Corradini: il velo aderisce al corpo come se fosse bagnato. Ai suoi piedi la lapide spezzata."}},{"t":"Die Ernüchterung","x":"Ein Mann befreit sich mithilfe eines kleinen geflügelten Dschinns mit einer Flamme auf der Stirn – einem Symbol der Intelligenz – aus einem großen Netz. Francesco Queirolo schuf die Skulptur 1753/54 zum Gedenken an den Vater des Prinzen. Das Netz besteht vollständig aus durchbrochenem Marmor: Der Überlieferung nach weigerten sich die Gehilfen, es zu bearbeiten, aus Angst, es zu zerbrechen, sodass der Bildhauer es selbst glättete.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/921cf7f91318.jpg","alt":"La statua del Disinganno, un uomo che si libera da una rete","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Il Disinganno di Francesco Queirolo: la rete è tutta di marmo, traforata a mano."}},{"t":"Der labyrinthische Boden","x":"Der ursprüngliche Fußboden war ein Labyrinth aus farbigem Marmor, durchzogen von einer durchgehenden weißen Linie – vom Fürsten als Symbol für den beschwerlichen Weg zum Wissen konzipiert. Francesco Celebrano erbaute ihn bis etwa 1771. Ein Einsturz im Jahr 1889 zerstörte ihn fast vollständig; einige wenige Platten sind im Durchgang vor Raimondos Grabmal, im Cavea und in der Sakristei erhalten geblieben.","d":"Im Durchgang vor dem Grab des Prinzen","foto":null},{"t":"Die anatomischen Maschinen","x":"Zwei Skelette, ein Mann und eine Frau, deren Blutgefäße mit einer noch heute verblüffenden Präzision rekonstruiert wurden. Sie wurden zwischen 1756 und 1764 von dem Arzt Giuseppe Salerno aus Palermo geschaffen. Um sie herum entstand die düstere Legende des Prinzen: Das Museum erklärt sorgfältig, wo die Geschichte endet und der Mythos beginnt.","d":"Im unterirdischen Cavea, über eine schmale Wendeltreppe hinunter","foto":null}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"L'interno della Cappella Sansevero con le statue","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La cappella intera: al centro il Cristo velato, intorno le statue della famiglia di Sangro."}],"leg":"Zu Lebzeiten Raimondo di Sangros wurde viel über ihn erzählt: geheimnisvolle Experimente, alchemistische Geheimnisse, sogar Diener, die in anatomische Maschinen verwandelt wurden. Das Museum unterscheidet sorgfältig zwischen der Legende und den belegten Fakten: Es lohnt sich, beide Versionen anzuhören und sich für eine zu entscheiden.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli und Nilstatue","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"La statua antica del dio Nilo, sdraiato","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statua del dio Nilo, sdraiato, nella piccola piazza che porta il suo nome."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai und seine Geschäfte","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Das Viertel der Buchhändler und Kunsthandwerker von Spaccanapoli: Läden, Kirchen und das Puppenkrankenhaus.","rac":"Dies ist der Abschnitt der Spaccanapoli, der sich von der Piazzetta Nilo bis zur Via Duomo auf dem unteren Decumanus erstreckt. Seinen Namen verdankt er den dort seit jeher ansässigen Buchhandlungen: Eine Inschrift am nahegelegenen Palazzo Marigliano erinnert an die Kunst der Buchhändlermeister. Die Verehrung des Heiligen Blasius reicht bis ins 8. Jahrhundert zurück, als armenische Nonnen eine Reliquie des Heiligen nach Neapel brachten. Ebenfalls an dieser Straße befindet sich das Ospedale delle Bambole, eine Handwerkswerkstatt, die seit Generationen in Familienbesitz ist.","con":"Im Dezember eröffnen die Krippengeschäfte: An den Wochenenden muss man mit großem Andrang rechnen.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella beim Buchhändler und der Schädel mit Ohren","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine winzige Steinmetzkirche, die dem Heiligen der Augen gewidmet ist, und ein einzigartiger Schädel: der mit Ohren.","rac":"Die Kirche wurde kurz vor 1327 von Bartolomeo di Capua, einem Juristen der angevinischen Könige, gegründet und anschließend den Pipernieri, den Steinmetzen, anvertraut: Sie wählten die heilige Lucia, die Beschützerin des Augenlichts, weil die Splitter ihres Handwerks ihre Augen gefährdeten.\n\nNach über dreißig Jahren des Leerstands wurde es am 5. April 2019 dank des Vereins Respiriamo Arte wiedereröffnet. In seinem unterirdischen Gewölbe hinterließ der Kult der „anime pezzentelle“ (kranken Seelen) einen Schädel, der einzigartig ist: Er hat Ohren.","con":"Es ist klein und kann in wenigen Minuten besichtigt werden: perfekt als Zwischenstopp zwischen Sansevero und Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Il portale di Santa Luciella nel vicolo","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Il portale di Santa Luciella. Alza gli occhi: sopra c'è l'affresco con lo stemma dei pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"}],"ant":true,"dett":[{"t":"Das Wappen der Pipernieri","x":"Bevor Sie eintreten, schauen Sie nach oben: Über dem Portal aus Piperno-Stein befindet sich noch immer ein Fresko mit dem Wappen der Piperno-Steinmetzgilde, jener Steinmetze, denen die Kirche gehörte. Sie arbeiteten zwischen den Steinsplittern und wählten deshalb die heilige Lucia, die Schutzpatronin des Augenlichts.","d":"Über dem Eingangsportal","foto":null},{"t":"Der Schädel mit Ohren","x":"Unter der Kirche, im Hypogäum, befindet sich ein Schädel mit erhaltenem Ohrknorpel: Das macht ihn einzigartig. Der Volksglaube besagt, dass er gerade deshalb, weil er Ohren hat, die Gebete derer, die um einen Gefallen bitten, besser hört.","d":"Im Hypogäum, mit einer Führung","foto":null},{"t":"Die armen Seelen","x":"Im 17. Jahrhundert, nach der Pest, nahmen die Neapolitaner die Schädel der namenlosen Toten in ihre Obhut: Sie reinigten sie, beteten für sie und baten im Gegenzug um Hilfe. Es war der Kult der „anime pezzentelle“, der armen Seelen. Hierin befindet sich eines der bekanntesten Zeugnisse der Stadt.","d":"Im Hypogäum","foto":null}],"gal":[],"leg":"Man sagt, der Schädel mit Ohren höre Gebete besser, gerade weil er Ohren habe: Aus diesem Grund wurde ihm seit Generationen die schwierigsten Bitten anvertraut.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Puppenkrankenhaus","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Ein Geschäft, das seit Generationen Puppen und Spielzeug sammelt: ein Schaufenster, das Kinder und Erwachsene gleichermaßen in Erinnerung behalten werden.","rac":"Ende des 19. Jahrhunderts arbeitete Luigi Grassi als Bühnenbildner für Theater und Krippen. Nachbarn brachten ihm kaputte Puppen und Spielzeug, und seine Werkstatt wurde beinahe zufällig zum ersten Spielzeugkrankenhaus in Neapel.\n\nHeute wird es von Tiziana, der Urenkelin des Gründers, im Innenhof des Palazzo Marigliano in der Via San Biagio dei Librai geleitet. Drinnen gleicht es einem richtigen Krankenhaus: weiße Kittel, Krankenzimmer und eine Patientenakte für jeden Patienten. Für viele Neapolitaner ist es der Ort, an den sie als Kinder ihr Lieblingsspielzeug brachten.","con":"Allein schon das Schaufenster ist einen Stopp wert: Es liegt auf dem Rückweg.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"La vetrina dell'Ospedale delle Bambole piena di bambole","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vetrina dell'Ospedale delle Bambole: bambole e giocattoli in attesa di essere «curati»."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"}],"ant":true,"dett":[{"t":"Ein echtes Krankenhaus für Spielzeug","x":"Es handelt sich nicht um ein Geschäft, sondern um ein Labor, das wie ein Krankenhaus organisiert ist: die „Ärzte“ in weißen Kitteln, die Abteilungen für Orthopädie, Augenheilkunde und Schneiderei sowie die Patienten, Puppen, Teddybären und Stofftiere, von denen jedes seine eigene Krankenakte und Diagnose hat.","d":"Im Laden","foto":null},{"t":"Der Gründer Bühnenbildner","x":"Alles begann im späten 19. Jahrhundert mit Luigi Grassi, einem Bühnenbildner für Theater und Krippen. Nachbarn brachten ihm kaputtes Spielzeug, und er wandelte die Werkstatt in das erste „Krankenhaus“ um. Heute behandelt seine Urenkelin Tiziana die Patienten.","d":"In der Geschichte des Ladens","foto":null},{"t":"Der Innenhof des Palazzo Marigliano","x":"Das Krankenhaus befindet sich im Innenhof des Palazzo Marigliano an Spaccanapoli. Sobald man den Haupteingang betritt, verstummt der Straßenlärm: Es ist einer der vielen versteckten Innenhöfe im historischen Zentrum, die es zu entdecken gilt.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, die Kirche der capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"Die Kirche der capuzzelle: unter dem Fußboden das Hypogäum, wo Neapel für namenlose Seelen betete. Und Lucias Schädel.","rac":"Die Neapolitaner nennen sie „’e cape ’e morte“, die Totenkopfkirche. Es handelt sich um eine kleine Kirche aus dem 17. Jahrhundert am Hauptdekumanus, die mit der Verehrung der Seelen im Fegefeuer verbunden ist, welche sich während der Gegenreformation verbreitete. Eine steile Treppe führt zum Hypogäum, der unterirdischen Kirche, die im 18. Jahrhundert erweitert und mit Majolika verziert wurde: Hier kümmerten sich die Gläubigen um die sterblichen Überreste anonymer Verstorbener und baten um deren Fürsprache. Am Ende eines kleinen Ganges wird der Schädel der Lucia aufbewahrt, einer besonders verehrten jungen Seele.","con":"Hinter dem Altar befindet sich der geflügelte Marmorschädel von Dionisio Lazzari: Er ist das Symbol der Kirche.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La facciata del Purgatorio ad Arco su via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La facciata del Purgatorio ad Arco, sul decumano maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true,"dett":[{"t":"Die Gemälde des siebzehnten Jahrhunderts","x":"Bevor Sie hinabsteigen, werfen Sie einen Blick auf die Kirche darüber: Sie beherbergt kostbare Marmorarbeiten und Gemälde dreier neapolitanischer Meister des 17. Jahrhunderts: Massimo Stanzione, Luca Giordano und Andrea Vaccaro. Sie bildet den „oberen“ Teil eines Ortes, dessen Lebendigkeit vor allem von dem lebt, was sich darunter befindet.","d":"In der Oberkirche","foto":null},{"t":"Der geflügelte Schädel","x":"Zu den Dekorationen der Kirche gehört ein geflügelter Totenkopf, ein Werk von Dionisio Lazzari: ein Bild, das den Geist des Ortes verkörpert, wo der Tod nicht gefürchtet wird, sondern zu einer Gelegenheit für Gebet und Verbindung mit denen wird, die nicht mehr unter uns sind.","d":"In der Oberkirche","foto":null},{"t":"Das Hypogäum der Seelen","x":"Die wahre Kirche ist die unterirdische: ein großer Raum, in dem Gläubige noch heute die namenlosen Gebeine pflegen und um ihren Schutz bitten. Er wurde im 18. Jahrhundert erweitert und mit Majolikafliesen verziert. Steigen Sie langsam hinab: Es ist ein Ort lebendiger Andacht, nicht bloßer Neugier.","d":"Unterhalb der Kirche, eine steile Treppe hinunter","foto":null},{"t":"Lucias Schädel","x":"Unter all den Schädeln im Hypogäum ist einer besonders verehrt: der der Lucia, die als Seele einer jungen Frau gilt. Er wird am Ende eines kleinen Ganges aufbewahrt und ist das ergreifendste Zeugnis des Seelenkults im Fegefeuer.","d":"Im Hypogäum, am Ende eines kleinen Ganges","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Un'immagine delle anime del Purgatorio tra le fiamme dentro la chiesa","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro la chiesa: le anime del Purgatorio tra le fiamme, il tema di tutto il luogo."},{"u":"../img/de63b1b83fa8.jpg","alt":"Un teschio di bronzo su una colonnina","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un teschio di bronzo: il simbolo della chiesa delle «capuzzelle»."}],"leg":"","fc":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Vierzig Meter unterhalb der Via dei Tribunali: die Zisternen, die jahrhundertelang Neapel mit Wasser versorgten, Kriegsbunker beherbergten und ein römisches Theater beherbergten, das unter einem Bett verborgen war.","rac":"Unterhalb des historischen Zentrums liegt eine andere Stadt. Von der Piazza San Gaetano führt ein Weg über hundert Stufen hinab in eine Tiefe von etwa 40 Metern, vorbei an einem griechisch-römischen Aquädukt und Tunneln aus dem Mittelalter, der Bourbonenzeit und der Neuzeit.\n\nDie Höhlen aus der griechischen Antike dienten etwa 23 Jahrhunderte lang als Zisternen für die Wasserversorgung der Stadt. Während des Zweiten Weltkriegs wurden dieselben Räumlichkeiten zu Luftschutzbunkern umfunktioniert.\n\nDie unterirdische Tour ist geführt und dauert etwa eine Stunde. Anschließend geht es wieder an die Oberfläche, wo die letzte Überraschung wartet: die Überreste des griechisch-römischen Theaters von Neapolis, das seit dem 15. Jahrhundert in die Häuser des Viertels integriert ist. Man betritt ein „Basso“, ein ebenerdiges Haus, rückt ein Bett beiseite und steigt durch eine Falltür in die Mauern des Theaters hinab.","con":"Flache Schuhe und ein Sweatshirt werden empfohlen, auch im Sommer: Unterirdisch ist es feucht. Der kurze, enge Durchgang mit der Kerze ist optional. Für Gruppen ab 10 Personen ist eine Reservierung erforderlich.","acc":"Nicht geeignet für Rollstühle oder Gehhilfen: Es gibt Treppen mit Handläufen und enge Durchgänge.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Führungen finden stündlich von 10:00 bis 18:00 Uhr auf Italienisch und Englisch statt. Zusätzlich werden donnerstags um 21:00 Uhr Führungen angeboten, jedoch nur nach vorheriger Reservierung und für Gruppen ab 10 Personen."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Die griechisch-römischen Zisternen","x":"Die in den Tuffstein gehauenen Räume aus der griechischen Antike dienten rund 23 Jahrhunderte lang als Wasserzisternen Neapels und waren durch das griechisch-römische Aquädukt miteinander verbunden.","d":"Im ersten Teil des Besuchs, in etwa 40 Metern Tiefe","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Le pareti di tufo di una cisterna sotterranea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Le pareti di tufo di una cisterna: per circa 23 secoli qui si raccoglieva l'acqua della città."}},{"t":"Die Passage mit der Kerze","x":"Ein sehr kurzes, schmales Stück wird mit einer Kerze in der Hand begangen. Dies ist optional: Wer möchte, kann diesen Schritt auslassen und stattdessen die Taschenlampe seines Handys benutzen.","d":"Entlang des unterirdischen Weges","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Un cunicolo strettissimo illuminato nel tufo","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Uno dei cunicoli strettissimi scavati nel tufo."}},{"t":"Die Schutzräume des Krieges","x":"Während des Zweiten Weltkriegs wurden diese unterirdischen Räume als Luftschutzbunker genutzt: Hier suchte die Stadt Schutz vor den Bombenangriffen.","d":"Entlang des unterirdischen Weges","foto":{"u":"../img/0f4490838101.jpg","alt":"Oggetti della Seconda guerra mondiale esposti sottoterra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"I ricordi della guerra: oggetti di quando queste stanze erano rifugi antiaerei."}},{"t":"Das Theater unter dem Bett","x":"Die Überreste des griechisch-römischen Theaters von Neapolis wurden im 15. Jahrhundert in moderne Wohnhäuser integriert. Man betritt einen Keller, rückt das Bett beiseite und gelangt durch eine Falltür in die Mauern des Theaters.","d":"Zweiter Teil des Besuchs, auf der Oberfläche zwischen Via Anticaglia und Vico Cinquesanti","foto":null}],"gal":[],"leg":"Der Überlieferung nach befanden sich Neros Garderoben in den versteckten Räumen unter dem Erdgeschoss, wenn er nach Neapel kam, um im Theater aufzutreten.","fc":"si"},{"id":18,"s":"duomo-san-gennaro","n":"Kathedrale und Schatz von San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Die Kathedrale von Neapel und die Schatzkammerkapelle, in der die Phiole mit dem Blut des heiligen Gennaro aufbewahrt wird.","rac":"In der Kathedrale, in einer Nische der Schatzkapelle, wird die Ampulle mit dem Blut aufbewahrt, das traditionell dem Heiligen Gennaro zugeschrieben wird. Dreimal im Jahr (am Samstag vor dem ersten Sonntag im Mai, am 19. September und am 16. Dezember) wartet man auf die Verflüssigung des Blutes. Seit 1601 werden die Reliquien von einer weltlichen Institution, der Deputation der Schatzkapelle des Heiligen Gennaro, verwahrt.","con":"An Tagen, an denen Boden verflüssigt wird, ist der Dom schon morgens überfüllt: Wenn Sie dort sein möchten, kommen Sie früh.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La facciata del Duomo di Napoli","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La facciata del Duomo, su via Duomo. La Cappella del Tesoro è la terza a destra."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Das Portal von San Gennaro","x":"Die etwa fünfzig Meter hohe Fassade besitzt drei Portale. Das rechte bleibt fast das ganze Jahr über geschlossen: Es öffnet sich nur zum Fest des Heiligen Gennaro und zu besonderen Anlässen. Sollten Sie es geöffnet vorfinden, sind Sie an einem besonderen Tag hier.","d":"Vorne, rechts","foto":null},{"t":"Die Schatzkapelle","x":"Mehr als eine Kapelle, ist es eine Kirche in der Kirche: barock, mit einem Grundriss in Form eines griechischen Kreuzes, einer Doppelkuppel und einem großen Bronzetor von Cosimo Fanzago. Sie beherbergt die silberne Büste des Heiligen Januarius und die Phiolen mit seinem Blut, dessen Verflüssigung die Stadt erwartet.","d":"Dritte Kapelle rechts","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro affrescata con il Paradiso","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Alza gli occhi: nella cupola della Cappella del Tesoro c'è il Paradiso dipinto da Giovanni Lanfranco."}},{"t":"Heilige Restituta","x":"Als Karl von Anjou 1294 die Kathedrale erbauen ließ, wurde eine der ältesten Basiliken als Kapelle erhalten: Santa Restituta. Sie beherbergt Werke von Luca Giordano und Skulpturen aus dem 14. Jahrhundert. Von hier aus gelangt man hinab in die archäologische Stätte unterhalb der Kathedrale, wo sich griechisch-römische und frühchristliche Überreste befinden.","d":"Im linken Gang","foto":{"u":"../img/5abf53aec271.jpg","alt":"Un mosaico con la Madonna in trono nella basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico con la Madonna in trono, dentro Santa Restituta: la basilica più antica, conservata come cappella del Duomo."}},{"t":"Das Baptisterium von San Giovanni in Fonte","x":"Ein kleiner Raum mit immenser Geschichte: Er gilt als das älteste Baptisterium der westlichen Welt. Verweilen Sie einen Moment: Sie befinden sich an einer der ältesten noch erhaltenen christlichen Stätten Europas.","d":"Rechts von der Apsis","foto":null},{"t":"Die Succorpo","x":"Unterhalb des Altars befindet sich eine dreischiffige Renaissance-Krypta, die von Kardinal Oliviero Carafa in Auftrag gegeben wurde, um die Reliquien des Heiligen Gennaro und anderer Heiliger zu beherbergen. Entworfen wurde sie von Giovan Tommaso Malvito. Antike Säulen und weißer Marmor: eine stille Renaissance im Inneren der gotischen Kathedrale.","d":"Unter dem Hauptaltar","foto":null}],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"Banksys Madonna mit einer Pistole","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Eine Madonna von Banksy mit einer Pistole anstelle eines Heiligenscheins, geschützt durch Glas, im Herzen des Hauptdekumanus.","rac":"Auf der Piazzetta dei Girolamini, an der Fassade des Hauptdecumanus, hinterließ Banksy eine Madonna mit einer Pistole anstelle ihres Heiligenscheins. Heute ist sie durch Glas geschützt. Die offizielle Tourismuswebsite der Stadt führt sie in ihrer Route zu Streetart im historischen Zentrum auf.","con":"Schauen Sie nach oben: Das Werk befindet sich oberhalb des Straßenniveaus, hinter Glas.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"Die Madonna mit der Pistole","x":"Weiß auf schwarzem Grund, schabloniert: eine Madonna mit zum Himmel ausgestreckten Armen und anstelle eines Heiligenscheins eine Pistole. Banksy malte das Bild 2010 in Neapel. Die Botschaft bleibt unerklärt: Jeder interpretiert sie auf seine Weise, irgendwo zwischen Sakralem und Profanem.","d":"An der Mauer des kleinen Platzes","foto":null},{"t":"Der Zeitungskiosk nebenan","x":"Neben dem Wandgemälde befindet sich ein kleiner Votivschrein mit der Madonna mit Kind, wie man ihn in vielen Straßen Neapels findet. Die beiden nebeneinander stehenden Figuren scheinen einander anzusehen: Es ist dieser Dialog, der das Werk so typisch neapolitanisch macht.","d":"Unmittelbar neben dem Werk","foto":null},{"t":"Ein Banksy unter Glas","x":"Im Jahr 2010 hinterließ Banksy zwei Werke in Neapel, vermutlich in derselben Nacht: Das andere, in der Via Benedetto Croce, wurde später von einem anderen Künstler übermalt. Aus diesem Grund führt der italienische National Trust (FAI) dieses Werk als Banksys einziges Wandgemälde in Italien, das nun durch eine Plexiglasvitrine vor Vandalismus geschützt ist.","d":"vor dem Werk","foto":null}],"gal":[],"leg":"","fc":null},{"id":44,"s":"murale-maradona","n":"Maradonas Wandgemälde","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"Das beliebte Wandgemälde im spanischen Viertel und der Platz, der seit 2020 zu einem säkularen Zufluchtsort für Diego geworden ist.","rac":"Das Maradona-Wandgemälde wurde 1990 von Mario Filardi geschaffen. In den 1990er-Jahren wurde sein Gesicht durch ein Fenster in der Wand verdeckt, und das Gemälde verblasste fast vollständig. Es wurde von Salvatore Iodice restauriert, und im Herbst 2017 übermalte der argentinische Künstler Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 wurde der Platz, der zuvor als Künstlerplatz bekannt war, nach ihm benannt und mit Gedenkstätten, Flaggen und Fotografien geschmückt.","con":"Zur Hauptverkehrszeit ist es sehr voll; früh am Morgen lässt es sich leichter und in Ruhe besichtigen.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Il grande murale di Maradona sulla facciata di un palazzo, con la folla sotto","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Il murale dipinto nel 1990 da Mario Filardi. Il volto di oggi è quello ridipinto nel 2017 dall'artista argentino Francisco Bosoletti."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La targa di Largo Maradona con un busto e le bandiere","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La targa del largo: dopo la morte di Diego, nel 2020, il largo degli artisti ha preso il suo nome."},{"u":"../img/550f6edc4b91.jpg","alt":"Un altarino con foto di Maradona e ricordi","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un altarino dedicato a Maradona: in città ce ne sono tanti, con foto e ricordi lasciati dai tifosi."},{"u":"../img/679687d3070c.jpg","alt":"Maradona dipinto con l'aureola accanto a una piccola edicola","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con l'aureola e la sua edicola votiva, dipinto in zona San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Un'edicola votiva con il ritratto di Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un'edicola votiva per Maradona, come quelle dei santi."}],"leg":"","fc":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Neues Schloss)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Das Schloss, das das Symbol von Neapel ist: ein Triumphbogen zwischen zwei Türmen, eine Bronzetür, die noch immer von einer Kanonenkugel getroffen wurde, und der Saal, in dem ein König während einer Hochzeitsfeier die Barone verhaften ließ.","rac":"Unter den angevinischen Königen wurde die Burg zu einem Zentrum der Kultur: Unter Robert von Anjou hielten sich dort Künstler, Ärzte und Literaten auf, darunter Giotto, Petrarca und Boccaccio.\n\nAlfons I. von Aragon machte es zu seiner königlichen Residenz und ließ es wiederaufbauen. Um seinen siegreichen Einzug in die Stadt zu feiern, errichtete er den großen Triumphbogen zwischen dem Mittelturm und dem Wachturm, der noch heute als Eingang dient.\n\nHeute beherbergt das Schloss das Stadtmuseum: Die Tour umfasst die Kunstgalerie im ersten Stock, den Baronssaal, die Pfalzkapelle, auch bekannt als Kapelle Santa Barbara, und eine archäologische Führung in der alten Rüstkammer.","con":"Eintrittspreis: 10 €; 6 € für Einwohner von Neapel und Umgebung; Eintritt frei für Kinder unter 18 Jahren. Sonntags geschlossen.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Il Maschio Angioino con le due torri e l'arco bianco in mezzo","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Le due grandi torri e, in mezzo, l'Arco di Trionfo di Alfonso d'Aragona: è l'ingresso del castello."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"Der Arc de Triomphe","x":"Dies ist der Eingang zur Burg, eingebettet zwischen zwei Türmen: Alfons I. von Aragon ließ ihn anlässlich seines siegreichen Einzugs in Neapel errichten. Halten Sie davor inne, bevor Sie eintreten, und bewundern Sie ihn von unten.","d":"Am Eingang, zwischen dem mittleren Turm und dem Wachturm","foto":{"u":"../img/91d08c9a9561.jpg","alt":"L'Arco di Trionfo di marmo tra le due torri","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arco da vicino: guardalo dal basso, piano per piano."}},{"t":"Die Tür mit der Kanonenkugel","x":"Ferrante von Aragon gab das Tor um 1475 bei Guglielmo Monaco in Auftrag, um den Sieg über Johann von Anjou und die rebellischen Barone im Jahr 1462 zu feiern: Sechs Tafeln erzählen die Geschichte des Krieges. In der unteren linken Tafel ist noch immer eine eiserne Kanonenkugel in der Bronze eingelassen. Die gängigste Theorie besagt, dass das Tor Teil der Beute war, die Karl VIII. auf Schiffe nach Frankreich verladen hatte. Vor der Küste von Rapallo wurde die Flotte von den Genuesen angegriffen und getroffen. Die Genuesen schickten das Tor 1495 nach Neapel zurück.","d":"Das Original wird im Inneren der Burg aufbewahrt.","foto":{"u":"../img/50ee03911e6d.jpg","alt":"La palla di cannone conficcata nella porta di bronzo","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La palla di cannone di ferro conficcata nel bronzo, nel pannello in basso a sinistra."}},{"t":"Die Baronshalle","x":"Man erreicht es über die von dem mallorquinischen Architekten Guglielmo Sagrera entworfene Außentreppe aus Rippengewölben. Blicken Sie nach oben: Das Gewölbe erhebt sich etwa 28 Meter hoch, und sechzehn Rippengewölbe erstrecken sich sternförmig von einer zentralen Öffnung. Der Name erinnert an das Jahr 1486, als König Ferrante I. die Barone unter dem Vorwand einer Hochzeit täuschte und sie hier verhaften ließ. Fünfzig Jahre lang diente es als Sitz des Stadtrats.","d":"Oben an der Hoftreppe","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La volta a stella della Sala dei Baroni","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La volta della Sala dei Baroni: sedici costoloni di piperno partono a stella dall'apertura al centro."}}],"gal":[],"leg":"","fc":null},{"id":32,"s":"castel-dell-ovo","n":"Strandpromenade und Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Die Burg auf der kleinen Insel, auf der die griechischen Kolonisten aus Cumae landeten: Man kommt von der Küste her, überquert die Brücke und blickt von Borgo Marinari aus über den Golf.","rac":"Die Burg steht auf der Insel Megaride, die aus zwei durch einen großen Bogen verbundenen Felsen besteht. Hier landeten Mitte des 7. Jahrhunderts v. Chr. Kolonisten aus Cumae, die später Partenope auf dem nahegelegenen Berg Echia gründeten.\n\nIm 1. Jahrhundert v. Chr. stand auf der Insel und dem Berg Echia die Villa des Lucius Licinius Lucullus. Überreste dieser Villa befinden sich noch heute in der Säulenhalle; im frühen Mittelalter diente diese Halle als Refektorium eines der auf der Insel errichteten Klöster.","con":"Das Innere der Burg ist wegen Renovierungsarbeiten bis auf Weiteres geschlossen. Besucher können die Burg heute von außen besichtigen und entlang der Strandpromenade und durch Borgo Marinari spazieren.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"}],"ant":true,"dett":[{"t":"Die Insel von Megaride","x":"Betrachten Sie die Burg von der Küste aus: Sie ruht auf zwei Felsen, die durch einen großen Bogen verbunden sind. Laut der Gemeinde landeten hier die ersten Siedler aus Cumae.","d":"Von der Brücke, die nach Borgo Marinari führt","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo e il porticciolo del Borgo Marinari visti dall'alto","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Dall'alto: il castello sullo scoglio e, accanto, il porticciolo del Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Incisione del 1841 con Castel dell'Ovo e una barca a vela","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in un'incisione del 1841."}],"leg":"Der Name stammt aus einer Legende: Der Dichter Vergil soll ein Ei, eingeschlossen in einem Käfig, in den Kellern des Schlosses versteckt haben.","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Der erste Rundgang","sub":"Spaccanapoli in einem halben Tag, Start in Ceraldi","desc":"Das Herz der Altstadt auf einem Rundgang: die Basilika Gesù Nuovo mit ihrem geheimnisvollen Flair, der Kreuzgang von Santa Chiara, der Verschleierte Christus, die Schädel- und Ohrenkirche, die Geschäfte der Via San Biagio dei Librai. Und dann kehren wir zu uns zurück.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista dall'alto: una strada dritta che taglia il centro storico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spac
