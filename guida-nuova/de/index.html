<script>
var D = {"lingua":"de","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità und Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Ausgangspunkt: Piazza Carità an der Via Toledo. Von hier aus beginnt die Altstadt in wenigen Gehminuten. Und dort befindet sich Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Bevor es losgeht, noch ein Kaffee: Die Tour ist lang und Neapel lässt sich am besten mit der richtigen Tasse Kaffee erkunden.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità heute, mit ihren Bäumen und farbenfrohen Gebäuden","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità heute, an der Via Toledo: Alle Stadtführungen starten von hier. Ceraldi ist hier."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":null}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Historisches Foto der Via Toledo im 19. Jahrhundert mit Kutschen und Passanten.","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Die Via Toledo im 19. Jahrhundert, als sie noch Via Roma hieß, auf einem Foto von Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità e via Toledo: una passeggiata nel cuore di Napoli","x":"La storia della piazza, raccontata da chi ci lavora dal 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, der untere Decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"Die schnurgerade Straße, die das historische Zentrum in zwei Hälften teilt: der untere Decumanus der griechischen Stadt, etwa zwei Kilometer Kirchen, Geschäfte und Leben.","rac":"Spaccanapoli ist die unterste der drei Decumani, jener parallel verlaufenden Straßen, die das griechische Neapolis von West nach Ost durchquerten. Sie beginnt an der Piazza del Gesù Nuovo als Via Benedetto Croce, geht dann in die Via San Biagio dei Librai über, kreuzt die Via Duomo und führt über die Altstadt hinaus: insgesamt etwa zwei Kilometer. Der Name ist Programm: Sie ist so lang und gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint.","con":"Gehen Sie die Straße entlang von der Piazza del Gesù in Richtung Via Duomo: Es ist ein leichter Abstieg durch die Geschichte, nicht durch Anstrengung.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Platz und Kirche von Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Fassade aus pyramidenförmigen Steinen, die wie eine Festung aussieht und ein Geheimnis birgt: eingravierte Zeichen, die noch niemand mit Sicherheit entziffern konnte.","rac":"Bevor es zur Kirche wurde, war es ein Palast: der Palast der Fürsten von Sanseverino, erbaut 1470; eine Gedenktafel an der Fassade erinnert an den Architekten Novello da San Lucano. Die Jesuiten bewahrten die Struktur und den dunklen Piperno-Quader, dessen Steine in Pyramidenform geschnitten wurden, und ergänzten sie mit Elementen aus weißem Marmor.\n\nManche Steine weisen eingravierte Zeichen auf. Der Legende nach handelt es sich um eine geheime Botschaft; einige Gelehrte glauben, es seien die Spuren verschiedener Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten einer Partitur namens „Enigma“ zu lesen. Betrachten Sie sie genau und bilden Sie sich Ihre eigene Meinung.\n\nDie Fassade wurde restauriert und am 12. März 2023 wiedereröffnet, nachdem im Dezember 2017 einige Fragmente herabgefallen waren; der Platz ist seitdem für Autos gesperrt.","con":"Halten Sie Ausschau nach den Markierungen auf den Steinen in Augenhöhe, rechts und links vom Portal: Die Suche ist kostenlos.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"Die Fassade des Gesù Nuovo, aus dunklen, spitz zulaufenden Steinen.","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"Die rautenförmige Fassade: Sie war ab 1470 der Palast der Sanseverino-Fürsten. Kommen Sie näher und achten Sie auf die in die Steine eingravierten Zeichen."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"Die rautenförmige Fassade","x":"Bevor es eine Kirche wurde, war es die Fassade des Palastes der Fürsten von Sanseverino aus dem Jahr 1470. Die Jesuiten bewahrten sie im Originalzustand mit ihren dunklen, pyramidenförmig behauenen Steinen und fügten das große Barockportal hinzu. Kommen Sie näher: Viele der Steine tragen eingravierte Zeichen, deren Bedeutung bis heute nicht eindeutig geklärt ist.","d":"Draußen, auf dem Platz","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo coperta di punte di diamante in pietra grigia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante della facciata del Gesù Nuovo, con il portale e la grande finestra."}},{"t":"Die Vertreibung des Heliodorus","x":"Das große Fresko an der Gegenfassade stammt von Francesco Solimena aus dem Jahr 1725. Es zeigt Heliodorus, der versucht, den Tempel von Jerusalem zu plündern und von einem himmlischen Ritter zurückgeschlagen wird: eine Szene voller Bewegung, Pferde und fliehender Gestalten. Viele Besucher übersehen es, weil sie den Eingang mit Blick auf den Altar betreten.","d":"Sobald Sie eintreten, wenden Sie sich zur Tür: Sie befindet sich über dem Eingang.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"Das große Fresko der Vertreibung des Heliodorus von Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimenas Fresko über dem Eingang: Wenden Sie sich zur Tür, um es zu sehen. In der Mitte ist der himmlische Ritter zu sehen, der Heliodorus abwehrt."}},{"t":"Die Kuppel und die vier Evangelisten","x":"Die vier Dreiecke am Fuß der Kuppel stellen die Evangelisten dar und wurden von Giovanni Lanfranco gemalt. Die Kuppel, die Sie sehen, ist jedoch nicht die ursprüngliche: Sie stürzte beim Erdbeben von 1688 ein und wurde 1786 durch einen niedrigeren, schalenförmigen Bau ersetzt.","d":"Im Zentrum der Kirche, schau nach oben","foto":null},{"t":"Die Kapelle Sant'Ignazio","x":"Das dem Gründer des Jesuitenordens gewidmete Gotteshaus vereint zwei bedeutende Namen der neapolitanischen Kunst des 17. Jahrhunderts: Cosimo Fanzago, Schöpfer der Architektur und der Statuen der Propheten David und Jeremia, und Jusepe de Ribera, der Gemälde mit Darstellungen aus dem Leben des Heiligen schuf. Farbiger Marmor, Statuen und Gemälde verschmelzen zu einem harmonischen Ganzen: Neapolitanischer Barock in seiner schönsten Form.","d":"In einer der beiden großen Kapellen der Kirche","foto":null},{"t":"Heiliger Josef Moscati","x":"Hier befindet sich die Ruhestätte des „heiligen Arztes“ von Neapel: Giuseppe Moscati, ein Forscher und Universitätsprofessor, der sich unentgeltlich um die Armen kümmerte. Er starb 1927 und wurde 1987 heiliggesprochen. Seine Gebeine ruhen in einer Bronzeurne des Bildhauers Amedeo Garufi unter dem Altar der Kapelle Mariä Heimsuchung.","d":"In der Kapelle der Heimsuchung, unter dem Altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La stanza di san Giuseppe Moscati ricostruita: camice bianco e strumenti medici in una teca","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Nella stanza ricostruita: il camice bianco, gli strumenti medici e le fotografie di san Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"Der Gesù Nuovo-Platz vor der Kirche","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"Der Platz Gesù Nuovo, vor der Kirche."},{"u":"../img/6d1ae4837518.jpg","alt":"Das Innere des Gesù Nuovo mit farbigem Marmor und dem Hauptaltar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Im Inneren der Kontrast zur strengen Fassade: farbiger Marmor, Fresken und Gold bis hinauf zum Hochaltar."},{"u":"../img/3dd3789513c8.jpg","alt":"Das Kirchenschiff der Kirche Gesù Nuovo, vom Eingang aus gesehen","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"Das Kirchenschiff vom Eingang aus gesehen: unten, oben, die Kuppel mit Lanfrancos Evangelisten am Sockel."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Kloster und Komplex Santa Chiara (Majolika-Kreuzgang)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Der mit Majolika verkleidete Kreuzgang ist einer der ruhigsten Orte im Zentrum: nur einen Steinwurf vom Chaos von Spaccanapoli entfernt, Stille.","rac":"Santa Chiara wurde 1310 im Auftrag von König Robert von Anjou und Königin Sancha von Mallorca erbaut. Die Bauleitung übernahm zunächst Gagliardo Primario, später Lionardo di Vito. 1340 wurde die Kirche für den Gottesdienst eröffnet. Der Komplex bestand aus zwei Teilen: einem benachbarten, aber separaten Kloster der Klarissen und einem der Franziskaner.\n\nVier Jahrhunderte später wurde auf Anregung von Königin Maria Amalia von Sachsen, der Gemahlin Karls von Bourbon, das Klarissenkloster renoviert. Der Architekt Domenico Antonio Vaccaro bewahrte die gotischen Bögen aus dem 14. Jahrhundert und verwandelte das Zentrum in einen barocken Garten, dessen Wände mit Majolikafliesen aus der Werkstatt von Donato und Giuseppe Massa gesäumt sind. Das Ergebnis ist einer der überraschendsten Orte Neapels: ein Keramikgarten nur wenige Schritte von Spaccanapoli entfernt.","con":"Sonntags schließt der Kreuzgang um 14 Uhr: Wenn es Sonntagnachmittag ist, tauschen Sie die Reihenfolge und kommen Sie zuerst hierher.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"Der Eingang zum Kreuzgang von Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"Der Eingang zum Majolika-Kreuzgang von Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Kloster und Museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Kloster und Museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Die Majolikasäulen","x":"Vierundsechzig Säulen, bedeckt mit Majolikafliesen und Girlanden aus Blättern, Blüten und Früchten, stehen unter einer Pergola. Die gelben, orangen und blauen Farbtöne erinnern an die Zitrusbäume und Weinreben, die sie umgeben. Die Majolikafliesen stammen aus der Werkstatt von Donato und Giuseppe Massa und befinden sich in dem von Domenico Antonio Vaccaro entworfenen Barockgarten.","d":"Im Klostergarten","foto":{"u":"../img/924627d30fda.jpg","alt":"Säulen, die im Kreuzgang mit gelben und grünen Majolika-Fliesen bedeckt sind","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Die Säulen unter der Pergola waren mit Majolika und Girlanden aus Blättern, Blumen und Früchten verziert."}},{"t":"Die Szenen auf den Sitzen","x":"Die Sitzbänke zwischen den Säulen sind alle aus Majolika, und die Rückenlehnen sind mit kleinen Szenen bemalt: ländliches Leben, Küstenleben, Volksfeste, Mythen. Sie stellen das neapolitanische Leben des 18. Jahrhunderts in Bildern dar. Setzen Sie sich und betrachten Sie die Sitzbank hinter Ihnen genauer.","d":"Auf den Rückenlehnen zwischen den Säulen","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Ein Majolika-Sitz mit einer auf die Rückenlehne gemalten Szene","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Ein Majolika-Sitz aus dem Kreuzgang: Auf der Rückseite befindet sich eine gemalte Szene."}},{"t":"Clarissa mit den Katzen","x":"Unter den Szenen ist eine Klarissenschwester zu sehen, die die Klosterkatzen füttert: ein kleiner Einblick in den Klosteralltag, gemalt auf Majolika. Sie zu entdecken ist eine perfekte Schatzsuche, auch für Kinder.","d":"An einer der Sitzlehnen: Suchen Sie danach.","foto":null},{"t":"Die Bögen des vierzehnten Jahrhunderts","x":"Der Garten ist barock, das Ambiente jedoch mittelalterlich: Vaccaro bewahrte die Umfassungsmauer aus dem 14. Jahrhundert mit den Spitzbögen des angevinischen Klosters. Beachten Sie den Kontrast zwischen dem schlichten Stein der Bögen und den leuchtenden Farben der Majolikafliesen: vier Jahrhunderte auf einen Blick.","d":"Entlang der vier Seiten des Kreuzgangs","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Gli archi del chiostro di Santa Chiara visti in controluce, con la chiesa sullo sfondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Gli archi gotici del chiostro di Santa Chiara, visti in controluce: sullo sfondo la facciata della chiesa."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolika mit einer Wildschweinjagdszene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Aus nächster Nähe: eine Wildschweinjagd, gemalt auf Majolika in der Werkstatt von Massa zwischen 1739 und 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"Der Kreuzgang mit Majolikasäulen, Sitzbänken und Garten","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Der gesamte Kreuzgang: die Majolikasäulen, die Sitzbänke und der Garten."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Kapelle","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Der Verschleierte Christus, eine der berühmtesten Skulpturen der Welt, und die anatomischen Maschinen des Alchemistenfürsten Raimondo di Sangro.","rac":"Die Kapelle der Familie di Sangro ist das Reich von Raimondo, Prinz von Sansevero: ein Mann der Wissenschaft und der Geheimnisse, Großmeister der Freimaurerei, um den sich der Mythos bereits zu seinen Lebzeiten rankte, und er selbst befeuerte ihn.\n\nIm Zentrum steht Giuseppe Sanmartinos Verschleierter Christus, ein Auftragswerk des Fürsten: ein liegender Körper, bedeckt mit einem so dünnen Leichentuch, dass es an ein nasses Tuch erinnert, und doch aus demselben Marmorblock gehauen wie die Statue. In der unterirdischen Höhle befinden sich zwei „anatomische Maschinen“, die Skelette eines Mannes und einer Frau mit rekonstruierten Blutgefäßen, ein Werk des Palermer Arztes Giuseppe Salerno aus den Jahren 1756–1764. Die Legende erzählt von geopferten Dienern und mysteriösen Injektionen; das Museum selbst trennt sorgfältig Mythos und belegte Geschichte.","con":"Dienstags ist es geschlossen: Wenn heute Dienstag ist, ist die Statue des Nils zwei Minuten entfernt und kann jederzeit besichtigt werden.","acc":"Das Kirchenschiff und die Sakristei sind rollstuhlgerecht. Das unterirdische Auditorium mit seinen anatomischen Apparaturen ist nur über eine schmale Wendeltreppe aus dem 19. Jahrhundert erreichbar.","foto":{"u":"../img/65421f883be6.jpg","alt":"Die Außenansicht der Sansevero -Kapelle","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"Die Sansevero Kapelle von außen gesehen."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Der verschleierte Christus","x":"Ein Körper, ausgestreckt auf einer Matratze, bedeckt mit einem so dünnen Leichentuch, dass Gesicht, Wunden und Adern darunter durchscheinen. Der Schleier ist nicht nachträglich hinzugefügt: Giuseppe Sanmartino schuf ihn aus demselben Marmorblock wie die Statue, im Auftrag von Fürst Raimondo di Sangro. Gehen Sie langsam um die Statue herum: Der Schleier scheint sich auf jeder Seite zu verändern.","d":"Im Zentrum des Kirchenschiffs","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Das Antlitz Christi, verhüllt unter dem Marmorschleier","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Das Gesicht unter dem Schleier: Das Leichentuch ist aus demselben Marmorblock gefertigt wie die Statue, sieht aber aus wie ein nasses Tuch."}},{"t":"Bescheidenheit","x":"Eine Frau, in einen Schleier gehüllt, der wie nass an ihrer Haut klebt, mit einem Rosenkranz. Die Skulptur wurde 1752, im Todesjahr von Antonio Corradini, geschaffen. Der Prinz widmete sie seiner Mutter Cecilia Gaetani, die starb, als er noch nicht einmal ein Jahr alt war. Achten Sie auf den zerbrochenen Grabstein zu ihren Füßen: Er zeugt von einem viel zu früh beendeten Leben.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"Die Statue der Bescheidenheit, eine mit einem Schleier bedeckte Frau","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Schamhaftigkeit von Antonio Corradini: Der Schleier schmiegt sich an ihren Körper, als wäre er nass. Zu ihren Füßen ein zerbrochener Grabstein."}},{"t":"Die Ernüchterung","x":"Ein Mann befreit sich mithilfe eines kleinen geflügelten Dschinns mit einer Flamme auf der Stirn – einem Symbol der Intelligenz – aus einem großen Netz. Francesco Queirolo schuf die Skulptur 1753/54 zum Gedenken an den Vater des Prinzen. Das Netz besteht vollständig aus durchbrochenem Marmor: Der Überlieferung nach weigerten sich die Gehilfen, es zu bearbeiten, aus Angst, es zu zerbrechen, sodass der Bildhauer es selbst glättete.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/921cf7f91318.jpg","alt":"Die Statue der Desillusionierung, ein Mann, der sich aus einem Netz befreit.","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Francesco Queirolos Desillusionierung: Das Netz besteht vollständig aus Marmor und ist von Hand perforiert."}},{"t":"Der labyrinthische Boden","x":"Der ursprüngliche Fußboden war ein Labyrinth aus farbigem Marmor, durchzogen von einer durchgehenden weißen Linie – vom Fürsten als Symbol für den beschwerlichen Weg zum Wissen konzipiert. Francesco Celebrano erbaute ihn bis etwa 1771. Ein Einsturz im Jahr 1889 zerstörte ihn fast vollständig; einige wenige Platten sind im Durchgang vor Raimondos Grabmal, im Cavea und in der Sakristei erhalten geblieben.","d":"Im Durchgang vor dem Grab des Prinzen","foto":null},{"t":"Die anatomischen Maschinen","x":"Zwei Skelette, ein Mann und eine Frau, deren Blutgefäße mit einer noch heute verblüffenden Präzision rekonstruiert wurden. Sie wurden zwischen 1756 und 1764 von dem Arzt Giuseppe Salerno aus Palermo geschaffen. Um sie herum entstand die düstere Legende des Prinzen: Das Museum erklärt sorgfältig, wo die Geschichte endet und der Mythos beginnt.","d":"Im unterirdischen Cavea, über eine schmale Wendeltreppe hinunter","foto":null}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"Das Innere der Sansevero -Kapelle mit den Statuen","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"Die gesamte Kapelle: im Zentrum der Verschleierte Christus, umgeben von den Statuen der Familie di Sangro."}],"leg":"Zu Lebzeiten Raimondo di Sangros wurde viel über ihn erzählt: geheimnisvolle Experimente, alchemistische Geheimnisse, sogar Diener, die in anatomische Maschinen verwandelt wurden. Das Museum unterscheidet sorgfältig zwischen der Legende und den belegten Fakten: Es lohnt sich, beide Versionen anzuhören und sich für eine zu entscheiden.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli und Nilstatue","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"Die antike Statue des Gottes Nil, liegend","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"Die Statue des liegenden Gottes Nil auf dem kleinen Platz, der seinen Namen trägt."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai und seine Geschäfte","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Das Viertel der Buchhändler und Kunsthandwerker von Spaccanapoli: Läden, Kirchen und das Puppenkrankenhaus.","rac":"Dies ist der Abschnitt der Spaccanapoli, der sich von der Piazzetta Nilo bis zur Via Duomo auf dem unteren Decumanus erstreckt. Seinen Namen verdankt er den dort seit jeher ansässigen Buchhandlungen: Eine Inschrift am nahegelegenen Palazzo Marigliano erinnert an die Kunst der Buchhändlermeister. Die Verehrung des Heiligen Blasius reicht bis ins 8. Jahrhundert zurück, als armenische Nonnen eine Reliquie des Heiligen nach Neapel brachten. Ebenfalls an dieser Straße befindet sich das Ospedale delle Bambole, eine Handwerkswerkstatt, die seit Generationen in Familienbesitz ist.","con":"Im Dezember eröffnen die Krippengeschäfte: An den Wochenenden muss man mit großem Andrang rechnen.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: il vicolo stretto, i negozi e uno stendardo appeso in alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la strada stretta e dritta del decumano inferiore, con i negozi e la gente a passeggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella beim Buchhändler und der Schädel mit Ohren","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine winzige Steinmetzkirche, die dem Heiligen der Augen gewidmet ist, und ein einzigartiger Schädel: der mit Ohren.","rac":"Die Kirche wurde kurz vor 1327 von Bartolomeo di Capua, einem Juristen der angevinischen Könige, gegründet und anschließend den Pipernieri, den Steinmetzen, anvertraut: Sie wählten die heilige Lucia, die Beschützerin des Augenlichts, weil die Splitter ihres Handwerks ihre Augen gefährdeten.\n\nNach über dreißig Jahren des Leerstands wurde es am 5. April 2019 dank des Vereins Respiriamo Arte wiedereröffnet. In seinem unterirdischen Gewölbe hinterließ der Kult der „anime pezzentelle“ (kranken Seelen) einen Schädel, der einzigartig ist: Er hat Ohren.","con":"Es ist klein und kann in wenigen Minuten besichtigt werden: perfekt als Zwischenstopp zwischen Sansevero und Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Das Portal der Santa Luciella in der Gasse","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Das Portal von Santa Luciella. Schauen Sie nach oben: Darüber befindet sich das Fresko mit dem Wappen der Familie Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Das Wappen der Pipernieri","x":"Bevor Sie eintreten, schauen Sie nach oben: Über dem Portal aus Piperno-Stein befindet sich noch immer ein Fresko mit dem Wappen der Piperno-Steinmetzgilde, jener Steinmetze, denen die Kirche gehörte. Sie arbeiteten zwischen den Steinsplittern und wählten deshalb die heilige Lucia, die Schutzpatronin des Augenlichts.","d":"Über dem Eingangsportal","foto":null},{"t":"Der Schädel mit Ohren","x":"Unter der Kirche, im Hypogäum, befindet sich ein Schädel mit erhaltenem Ohrknorpel: Das macht ihn einzigartig. Der Volksglaube besagt, dass er gerade deshalb, weil er Ohren hat, die Gebete derer, die um einen Gefallen bitten, besser hört.","d":"Im Hypogäum, mit einer Führung","foto":null},{"t":"Die armen Seelen","x":"Im 17. Jahrhundert, nach der Pest, nahmen die Neapolitaner die Schädel der namenlosen Toten in ihre Obhut: Sie reinigten sie, beteten für sie und baten im Gegenzug um Hilfe. Es war der Kult der „anime pezzentelle“, der armen Seelen. Hierin befindet sich eines der bekanntesten Zeugnisse der Stadt.","d":"Im Hypogäum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Teschi illuminati dalla luce di una candela, con una targa «per grazia ricevuta»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Teschi nelle teche: su una targa si legge il nome di chi ha fatto la grazia, un modo di ringraziare le anime «pezzentelle»."}}],"gal":[],"leg":"Man sagt, der Schädel mit Ohren höre Gebete besser, gerade weil er Ohren habe: Aus diesem Grund wurde ihm seit Generationen die schwierigsten Bitten anvertraut.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Puppenkrankenhaus","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Ein Geschäft, das seit Generationen Puppen und Spielzeug sammelt: ein Schaufenster, das Kinder und Erwachsene gleichermaßen in Erinnerung behalten werden.","rac":"Ende des 19. Jahrhunderts arbeitete Luigi Grassi als Bühnenbildner für Theater und Krippen. Nachbarn brachten ihm kaputte Puppen und Spielzeug, und seine Werkstatt wurde beinahe zufällig zum ersten Spielzeugkrankenhaus in Neapel.\n\nHeute wird es von Tiziana, der Urenkelin des Gründers, im Innenhof des Palazzo Marigliano in der Via San Biagio dei Librai geleitet. Drinnen gleicht es einem richtigen Krankenhaus: weiße Kittel, Krankenzimmer und eine Patientenakte für jeden Patienten. Für viele Neapolitaner ist es der Ort, an den sie als Kinder ihr Lieblingsspielzeug brachten.","con":"Allein schon das Schaufenster ist einen Stopp wert: Es liegt auf dem Rückweg.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"Das Schaufenster des Puppenkrankenhauses ist voller Puppen.","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"Das Schaufenster des Puppenkrankenhauses: Puppen und Spielzeuge, die darauf warten, „geheilt“ zu werden."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Ein echtes Krankenhaus für Spielzeug","x":"Es handelt sich nicht um ein Geschäft, sondern um ein Labor, das wie ein Krankenhaus organisiert ist: die „Ärzte“ in weißen Kitteln, die Abteilungen für Orthopädie, Augenheilkunde und Schneiderei sowie die Patienten, Puppen, Teddybären und Stofftiere, von denen jedes seine eigene Krankenakte und Diagnose hat.","d":"Im Laden","foto":null},{"t":"Der Gründer Bühnenbildner","x":"Alles begann im späten 19. Jahrhundert mit Luigi Grassi, einem Bühnenbildner für Theater und Krippen. Nachbarn brachten ihm kaputtes Spielzeug, und er wandelte die Werkstatt in das erste „Krankenhaus“ um. Heute behandelt seine Urenkelin Tiziana die Patienten.","d":"In der Geschichte des Ladens","foto":null},{"t":"Der Innenhof des Palazzo Marigliano","x":"Das Krankenhaus befindet sich im Innenhof des Palazzo Marigliano an Spaccanapoli. Sobald man den Haupteingang betritt, verstummt der Straßenlärm: Es ist einer der vielen versteckten Innenhöfe im historischen Zentrum, die es zu entdecken gilt.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"Il cortile giallo di Palazzo Marigliano con l'arco d'ingresso","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Il cortile di Palazzo Marigliano, con l'arco d'ingresso e le facciate color ocra."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, die Kirche der capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"Die Kirche der capuzzelle: unter dem Fußboden das Hypogäum, wo Neapel für namenlose Seelen betete. Und Lucias Schädel.","rac":"Die Neapolitaner nennen sie „’e cape ’e morte“, die Totenkopfkirche. Es handelt sich um eine kleine Kirche aus dem 17. Jahrhundert am Hauptdekumanus, die mit der Verehrung der Seelen im Fegefeuer verbunden ist, welche sich während der Gegenreformation verbreitete. Eine steile Treppe führt zum Hypogäum, der unterirdischen Kirche, die im 18. Jahrhundert erweitert und mit Majolika verziert wurde: Hier kümmerten sich die Gläubigen um die sterblichen Überreste anonymer Verstorbener und baten um deren Fürsprache. Am Ende eines kleinen Ganges wird der Schädel der Lucia aufbewahrt, einer besonders verehrten jungen Seele.","con":"Hinter dem Altar befindet sich der geflügelte Marmorschädel von Dionisio Lazzari: Er ist das Symbol der Kirche.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"Die Fassade des Purgatorio ad Arco an der Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"Die Fassade des Purgatorio ad Arco, auf dem Hauptdecumanus."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Die Gemälde des siebzehnten Jahrhunderts","x":"Bevor Sie hinabsteigen, werfen Sie einen Blick auf die Kirche darüber: Sie beherbergt kostbare Marmorarbeiten und Gemälde dreier neapolitanischer Meister des 17. Jahrhunderts: Massimo Stanzione, Luca Giordano und Andrea Vaccaro. Sie bildet den „oberen“ Teil eines Ortes, dessen Lebendigkeit vor allem von dem lebt, was sich darunter befindet.","d":"In der Oberkirche","foto":null},{"t":"Der geflügelte Schädel","x":"Zu den Dekorationen der Kirche gehört ein geflügelter Totenkopf, ein Werk von Dionisio Lazzari: ein Bild, das den Geist des Ortes verkörpert, wo der Tod nicht gefürchtet wird, sondern zu einer Gelegenheit für Gebet und Verbindung mit denen wird, die nicht mehr unter uns sind.","d":"In der Oberkirche","foto":null},{"t":"Das Hypogäum der Seelen","x":"Die wahre Kirche ist die unterirdische: ein großer Raum, in dem Gläubige noch heute die namenlosen Gebeine pflegen und um ihren Schutz bitten. Er wurde im 18. Jahrhundert erweitert und mit Majolikafliesen verziert. Steigen Sie langsam hinab: Es ist ein Ort lebendiger Andacht, nicht bloßer Neugier.","d":"Unterhalb der Kirche, eine steile Treppe hinunter","foto":null},{"t":"Lucias Schädel","x":"Unter all den Schädeln im Hypogäum ist einer besonders verehrt: der der Lucia, die als Seele einer jungen Frau gilt. Er wird am Ende eines kleinen Ganges aufbewahrt und ist das ergreifendste Zeugnis des Seelenkults im Fegefeuer.","d":"Im Hypogäum, am Ende eines kleinen Ganges","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Ein Bild der Seelen im Fegefeuer inmitten der Flammen im Inneren der Kirche","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Im Inneren der Kirche: die Seelen des Fegefeuers in den Flammen, das Thema des gesamten Ortes."},{"u":"../img/de63b1b83fa8.jpg","alt":"Ein bronzener Schädel auf einer kleinen Säule","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Ein bronzener Totenkopf: das Symbol der „capuzzelle“-Kirche."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Vierzig Meter unterhalb der Via dei Tribunali: die Zisternen, die jahrhundertelang Neapel mit Wasser versorgten, Kriegsbunker beherbergten und ein römisches Theater beherbergten, das unter einem Bett verborgen war.","rac":"Unterhalb des historischen Zentrums liegt eine andere Stadt. Von der Piazza San Gaetano führt ein Weg über hundert Stufen hinab in eine Tiefe von etwa 40 Metern, vorbei an einem griechisch-römischen Aquädukt und Tunneln aus dem Mittelalter, der Bourbonenzeit und der Neuzeit.\n\nDie Höhlen aus der griechischen Antike dienten etwa 23 Jahrhunderte lang als Zisternen für die Wasserversorgung der Stadt. Während des Zweiten Weltkriegs wurden dieselben Räumlichkeiten zu Luftschutzbunkern umfunktioniert.\n\nDie unterirdische Tour ist geführt und dauert etwa eine Stunde. Anschließend geht es wieder an die Oberfläche, wo die letzte Überraschung wartet: die Überreste des griechisch-römischen Theaters von Neapolis, das seit dem 15. Jahrhundert in die Häuser des Viertels integriert ist. Man betritt ein „Basso“, ein ebenerdiges Haus, rückt ein Bett beiseite und steigt durch eine Falltür in die Mauern des Theaters hinab.","con":"Flache Schuhe und ein Sweatshirt werden empfohlen, auch im Sommer: Unterirdisch ist es feucht. Der kurze, enge Durchgang mit der Kerze ist optional. Für Gruppen ab 10 Personen ist eine Reservierung erforderlich.","acc":"Nicht geeignet für Rollstühle oder Gehhilfen: Es gibt Treppen mit Handläufen und enge Durchgänge.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Eine große, in den Tuffstein gegrabene unterirdische Zisterne, schwach beleuchtet","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Eine der großen Zisternen, die in den Tuffstein gegraben wurden, etwa 40 Meter unterhalb der Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Führungen finden stündlich von 10:00 bis 18:00 Uhr auf Italienisch und Englisch statt. Zusätzlich werden donnerstags um 21:00 Uhr Führungen angeboten, jedoch nur nach vorheriger Reservierung und für Gruppen ab 10 Personen."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Die griechisch-römischen Zisternen","x":"Die in den Tuffstein gehauenen Räume aus der griechischen Antike dienten rund 23 Jahrhunderte lang als Wasserzisternen Neapels und waren durch das griechisch-römische Aquädukt miteinander verbunden.","d":"Im ersten Teil des Besuchs, in etwa 40 Metern Tiefe","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Die Tuffsteinwände einer unterirdischen Zisterne","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Die Tuffsteinwände einer Zisterne: Rund 23 Jahrhunderte lang wurde hier das Wasser der Stadt gesammelt."}},{"t":"Die Passage mit der Kerze","x":"Ein sehr kurzes, schmales Stück wird mit einer Kerze in der Hand begangen. Dies ist optional: Wer möchte, kann diesen Schritt auslassen und stattdessen die Taschenlampe seines Handys benutzen.","d":"Entlang des unterirdischen Weges","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Ein sehr schmaler, im Tuffstein erleuchteter Tunnel","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Einer der sehr schmalen Tunnel, die in den Tuffstein gegraben wurden."}},{"t":"Die Schutzräume des Krieges","x":"Während des Zweiten Weltkriegs wurden diese unterirdischen Räume als Luftschutzbunker genutzt: Hier suchte die Stadt Schutz vor den Bombenangriffen.","d":"Entlang des unterirdischen Weges","foto":{"u":"../img/0f4490838101.jpg","alt":"Unterirdisch ausgestellte Artefakte aus dem Zweiten Weltkrieg","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Erinnerungen an den Krieg: Gegenstände aus der Zeit, als diese Räume Luftschutzbunker waren."}},{"t":"Das Theater unter dem Bett","x":"Die Überreste des griechisch-römischen Theaters von Neapolis wurden im 15. Jahrhundert in moderne Wohnhäuser integriert. Man betritt einen Keller, rückt das Bett beiseite und gelangt durch eine Falltür in die Mauern des Theaters.","d":"Zweiter Teil des Besuchs, auf der Oberfläche zwischen Via Anticaglia und Vico Cinquesanti","foto":null}],"gal":[],"leg":"Der Überlieferung nach befanden sich Neros Garderoben in den versteckten Räumen unter dem Erdgeschoss, wenn er nach Neapel kam, um im Theater aufzutreten.","fc":"si","col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La cupola ottagonale della chiesa del Pio Monte della Misericordia vista dal basso","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cupola della chiesa ottagonale del Pio Monte della Misericordia, guardando in alto."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Le Sette opere di Misericordia","x":"È una tela enorme, quasi quattro metri d'altezza, e sembra una notte in un vicolo di Napoli: un incrocio pieno di gente, illuminato da una luce che arriva di lato e scolpisce i corpi nel buio. In alto, la Madonna con il Bambino, portata da due angeli, guarda giù su quello che fanno gli uomini.\n\nIl Pio Monte voleva un'opera che mettesse insieme tutte e sette le opere di misericordia: dar da mangiare agli affamati, dar da bere agli assetati, vestire gli ignudi, ospitare i pellegrini, visitare gli infermi, visitare i carcerati, seppellire i morti. Caravaggio le dipinse tutte in una sola scena, senza miracoli: è l'uomo che aiuta l'uomo.\n\nFu la prima opera di Caravaggio a Napoli e cambiò la pittura della città: i pittori napoletani del Seicento ripresero la sua luce, i suoi personaggi presi dalla strada e perfino alcuni dettagli, come l'uomo di spalle in primo piano.","d":"Sull'altare maggiore","foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"t":"Come riconoscere le sette opere","x":"Cerca le scene una per una.\n\nA destra, una giovane donna allatta dal seno un vecchio dietro le sbarre: sono Pero e suo padre Cimone, condannato a morire di fame in carcere. Valgono per due opere: dar da mangiare agli affamati e visitare i carcerati. Guarda la goccia di latte sulla barba del vecchio.\n\nDietro di loro, un uomo trasporta un morto (se ne vedono solo i piedi) e un sacerdote con la torcia gli fa luce: seppellire i morti. In primo piano, a sinistra, un giovane cavaliere taglia il mantello per un uomo nudo a terra: è San Martino, vestire gli ignudi; accanto, nell'angolo più buio, uno storpio prega: visitare gli infermi.\n\nAll'estrema sinistra un oste indica la strada a un pellegrino con la conchiglia sul cappello, San Giacomo: ospitare i pellegrini. Sullo sfondo, un uomo beve da una mascella d'asino: è Sansone, dar da bere agli assetati.","d":"Davanti alla tela, da sinistra a destra","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"La tela di Caravaggio sopra l'altare maggiore del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La tela di Caravaggio come la vedi in chiesa: sopra l'altare, nella cappella del Pio Monte."}},{"t":"La Madonna e gli angeli","x":"Guarda in alto: la Madonna con il Bambino si affaccia come da una finestra, davanti a due lenzuoli stesi, e due angeli si abbracciano in volo. Sembrano lontani da quello che succede in basso.\n\nMa osserva l'ombra che proiettano sul muro del carcere: Caravaggio li rende presenti, quasi concreti, dentro la stessa notte degli uomini.\n\nLo storico dell'arte Roberto Longhi scelse proprio questo dettaglio per la locandina della grande mostra del 1951 che riscoprì Caravaggio: belli, scrisse, come un Raffaello, ma presi «dalla verità nuda di Forcella o di Pizzofalcone».","d":"In alto, nella tela","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Dettaglio: la Madonna con il Bambino e i due angeli in volo","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Il dettaglio in alto: la Madonna con il Bambino che si affaccia e i due angeli che si abbracciano in volo."}},{"t":"Gli altri altari","x":"Intorno al Caravaggio la chiesa ottagonale ha altri sei altari, con tele di pittori del Seicento napoletano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino e Forlì.\n\nCerca la «Liberazione di San Pietro» di Battistello Caracciolo, del 1615: è uno dei pittori che più impararono da Caravaggio, e si vede dalla luce e dal buio. Poi «San Pietro che resuscita Tabità» di Fabrizio Santafede, del 1611.\n\nGuardale dopo il Caravaggio: capirai subito quanto la sua tela fosse nuova per Napoli.","d":"Nelle cappelle intorno","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Kathedrale und Schatz von San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Die Kathedrale von Neapel und die Schatzkammerkapelle, in der die Phiole mit dem Blut des heiligen Gennaro aufbewahrt wird.","rac":"In der Kathedrale, in einer Nische der Schatzkapelle, wird die Ampulle mit dem Blut aufbewahrt, das traditionell dem Heiligen Gennaro zugeschrieben wird. Dreimal im Jahr (am Samstag vor dem ersten Sonntag im Mai, am 19. September und am 16. Dezember) wartet man auf die Verflüssigung des Blutes. Seit 1601 werden die Reliquien von einer weltlichen Institution, der Deputation der Schatzkapelle des Heiligen Gennaro, verwahrt.","con":"An Tagen, an denen Boden verflüssigt wird, ist der Dom schon morgens überfüllt: Wenn Sie dort sein möchten, kommen Sie früh.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"Die Fassade der Kathedrale von Neapel","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"Die Fassade des Doms an der Via Duomo. Die Schatzkammerkapelle ist die dritte von rechts."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Das Portal von San Gennaro","x":"Die etwa fünfzig Meter hohe Fassade besitzt drei Portale. Das rechte bleibt fast das ganze Jahr über geschlossen: Es öffnet sich nur zum Fest des Heiligen Gennaro und zu besonderen Anlässen. Sollten Sie es geöffnet vorfinden, sind Sie an einem besonderen Tag hier.","d":"Vorne, rechts","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"Il portale gotico del Duomo di Napoli","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Il portale gotico del Duomo, in facciata."}},{"t":"Die Schatzkapelle","x":"Mehr als eine Kapelle, ist es eine Kirche in der Kirche: barock, mit einem Grundriss in Form eines griechischen Kreuzes, einer Doppelkuppel und einem großen Bronzetor von Cosimo Fanzago. Sie beherbergt die silberne Büste des Heiligen Januarius und die Phiolen mit seinem Blut, dessen Verflüssigung die Stadt erwartet.","d":"Dritte Kapelle rechts","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"Die Kuppel der Schatzkammerkapelle ist mit einem Fresko aus dem Paradies verziert.","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Schauen Sie nach oben: In der Kuppel der Schatzkammerkapelle befindet sich das von Giovanni Lanfranco gemalte Paradies."}},{"t":"Heilige Restituta","x":"Als Karl von Anjou 1294 die Kathedrale erbauen ließ, wurde eine der ältesten Basiliken als Kapelle erhalten: Santa Restituta. Sie beherbergt Werke von Luca Giordano und Skulpturen aus dem 14. Jahrhundert. Von hier aus gelangt man hinab in die archäologische Stätte unterhalb der Kathedrale, wo sich griechisch-römische und frühchristliche Überreste befinden.","d":"Im linken Gang","foto":{"u":"../img/5abf53aec271.jpg","alt":"Ein Mosaik mit der thronenden Madonna in der Basilika Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Ein Mosaik der thronenden Madonna im Inneren von Santa Restituta: der ältesten Basilika, die als Kapelle der Kathedrale erhalten geblieben ist."}},{"t":"Das Baptisterium von San Giovanni in Fonte","x":"Ein kleiner Raum mit immenser Geschichte: Er gilt als das älteste Baptisterium der westlichen Welt. Verweilen Sie einen Moment: Sie befinden sich an einer der ältesten noch erhaltenen christlichen Stätten Europas.","d":"Rechts von der Apsis","foto":{"u":"../img/994ed22c6902.jpg","alt":"L'interno del Battistero di San Giovanni in Fonte con la vasca battesimale al centro","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Il Battistero di San Giovanni in Fonte: al centro del pavimento, la vasca battesimale."}},{"t":"Die Succorpo","x":"Unterhalb des Altars befindet sich eine dreischiffige Renaissance-Krypta, die von Kardinal Oliviero Carafa in Auftrag gegeben wurde, um die Reliquien des Heiligen Gennaro und anderer Heiliger zu beherbergen. Entworfen wurde sie von Giovan Tommaso Malvito. Antike Säulen und weißer Marmor: eine stille Renaissance im Inneren der gotischen Kathedrale.","d":"Unter dem Hauptaltar","foto":{"u":"../img/876cd614ab8d.jpg","alt":"L'interno del Succorpo di San Gennaro con colonne di marmo e pavimento a intarsi","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Il Succorpo, sotto il presbiterio del Duomo: colonne e pavimento di marmo, e in fondo l'altare con le reliquie di San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"Banksys Madonna mit einer Pistole","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Eine Madonna von Banksy mit einer Pistole anstelle eines Heiligenscheins, geschützt durch Glas, im Herzen des Hauptdekumanus.","rac":"Auf der Piazzetta dei Girolamini, an der Fassade des Hauptdecumanus, hinterließ Banksy eine Madonna mit einer Pistole anstelle ihres Heiligenscheins. Heute ist sie durch Glas geschützt. Die offizielle Tourismuswebsite der Stadt führt sie in ihrer Route zu Streetart im historischen Zentrum auf.","con":"Schauen Sie nach oben: Das Werk befindet sich oberhalb des Straßenniveaus, hinter Glas.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Il volto della Madonna di Banksy in stencil bianco su fondo scuro","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Il volto della Madonna di Banksy: lo stencil bianco su fondo scuro, da vicino."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"Die Madonna mit der Pistole","x":"Weiß auf schwarzem Grund, schabloniert: eine Madonna mit zum Himmel ausgestreckten Armen und anstelle eines Heiligenscheins eine Pistole. Banksy malte das Bild 2010 in Neapel. Die Botschaft bleibt unerklärt: Jeder interpretiert sie auf seine Weise, irgendwo zwischen Sakralem und Profanem.","d":"An der Mauer des kleinen Platzes","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"La Madonna in stencil di Banksy sul muro di piazza Gerolomini, vista da vicino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Madonna di Banksy, in stencil bianco e nero su un angolo del muro di piazza Gerolomini."}},{"t":"Der Zeitungskiosk nebenan","x":"Neben dem Wandgemälde befindet sich ein kleiner Votivschrein mit der Madonna mit Kind, wie man ihn in vielen Straßen Neapels findet. Die beiden nebeneinander stehenden Figuren scheinen einander anzusehen: Es ist dieser Dialog, der das Werk so typisch neapolitanisch macht.","d":"Unmittelbar neben dem Werk","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Madonna di Banksy sul muro e, accanto, l'edicola votiva con la Madonna col Bambino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A sinistra la Madonna di Banksy, a destra, appesa al muro, l'edicola con la Madonna col Bambino: le due immagini sacre una accanto all'altra."}},{"t":"Ein Banksy unter Glas","x":"Im Jahr 2010 hinterließ Banksy zwei Werke in Neapel, vermutlich in derselben Nacht: Das andere, in der Via Benedetto Croce, wurde später von einem anderen Künstler übermalt. Aus diesem Grund führt der italienische National Trust (FAI) dieses Werk als Banksys einziges Wandgemälde in Italien, das nun durch eine Plexiglasvitrine vor Vandalismus geschützt ist.","d":"vor dem Werk","foto":null},{"t":"Come arrivarci e cosa fotografare","x":"L'opera è su un muro della piccola piazza Gerolomini, affacciata su via dei Tribunali.\n\nLa teca protegge l'opera ma può riflettere la luce: per una foto senza riflessi prova a metterti leggermente di lato. Il posto è sempre accessibile e gratuito.\n\nDa qui la Madonna di via Benedetto Croce, l'opera perduta, era a nove minuti a piedi, lungo il percorso che passa da Sansevero, Napoli Sotterranea e San Gregorio Armeno.","d":"Piazza Gerolomini, su via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, der letzte Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"Sechs Minuten von Ceraldi entfernt, in der Via Toledo, steht das letzte Gemälde, das Caravaggio malte: das Martyrium der Heiligen Ursula.","rac":"Die Gallerie d’Italia von Intesa Sanpaolo in der Via Toledo 177 beherbergt Caravaggios letztes Gemälde, das Martyrium der Heiligen Ursula. Daneben werden drei Ausstellungen gezeigt: neapolitanische und süditalienische Malerei vom 17. bis zum frühen 20. Jahrhundert, Malerei des 20. Jahrhunderts sowie über fünfhundert attische und Magna-Graecia-Keramiken aus der Sammlung Caputi.","con":"Am ersten Sonntag im Monat ist der Eintritt für alle frei. Montags ist geschlossen.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Una sala delle Gallerie d'Italia con quadri alle pareti gialle","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala delle Gallerie d'Italia a Napoli, con le tele del Seicento."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Il Martirio di sant'Orsola","x":"È una scena stretta e buia, quasi senza sfondo: siamo nella tenda di Attila, re degli Unni. Orsola, una principessa, lo ha rifiutato, e lui le ha appena scoccato una freccia nel petto. Lei piega la testa verso la freccia; tre uomini accorrono a sorreggerla. Il re sembra già pentito del suo gesto.\n\nCerca il volto alle spalle della santa: è lo stesso Caravaggio, che si è dipinto tra i testimoni. E osserva la mano che si allunga tra la santa e il re, come per fermare la freccia: è riapparsa durante il restauro del 2003-2004.\n\nLo commissionò il principe genovese Marcantonio Doria, la cui famiglia aveva sant'Orsola come protettrice. È il quadro più tardo di Caravaggio che conosciamo: fu finito nel maggio 1610, poco più di un mese prima della sua morte.","d":"Nella sala dedicata a Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}},{"t":"Il quadro messo al sole","x":"Caravaggio dipinse il quadro in fretta, forse perché stava per partire verso Roma per ottenere il perdono del papa. L'incaricato dei Doria a Napoli, Lanfranco Massa, fece consegnare la tela quando la vernice non era ancora asciutta e, per farla asciugare prima, la mise al sole: la vernice, stesa molto spessa, si rovinò. Lo raccontò lui stesso in una lettera di maggio 1610.\n\nIl quadro arrivò a Genova, poi passò di erede in erede, finì in una villa di Eboli e fu attribuito ad altri pittori. Solo negli anni Ottanta del Novecento il ritrovamento della lettera di Massa ha confermato con certezza che è di Caravaggio.\n\nNel 2025 un nuovo intervento di restauro ha riportato alla luce tre teste che il tempo aveva fatto sparire.","d":"Davanti alla tela","foto":{"u":"../img/6a999eeecae6.jpg","alt":"La tela di Caravaggio esposta in una sala di Palazzo Zevallos, con il soffitto decorato","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Il Martirio di sant'Orsola esposto in una sala di Palazzo Zevallos Stigliano, la sede delle Gallerie d'Italia."}},{"t":"Il palazzo del Banco di Napoli","x":"Prima di salire alle sale, guardati intorno: sei nel palazzo che fu la sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento.\n\nL'architetto Michele De Lucchi lo ha trasformato in museo con un allestimento moderno: le grandi sale della banca oggi ospitano tre percorsi, dall'arte napoletana del Seicento al Novecento, passando per una ricca collezione di vasi greci e della Magna Grecia.\n\nIl museo ha aperto nel 2022 e continua l'attività di Palazzo Zevallos Stigliano, aperto dal 1999 al 2022 a pochi passi da qui.","d":"Entrando, nel salone","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La facciata in pietra del Palazzo del Banco di Napoli su via Toledo, con la bandiera europea","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Il Palazzo del Banco di Napoli su via Toledo, dove hanno sede le Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"Maradonas Wandgemälde","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"Das beliebte Wandgemälde im spanischen Viertel und der Platz, der seit 2020 zu einem säkularen Zufluchtsort für Diego geworden ist.","rac":"Das Maradona-Wandgemälde wurde 1990 von Mario Filardi geschaffen. In den 1990er-Jahren wurde sein Gesicht durch ein Fenster in der Wand verdeckt, und das Gemälde verblasste fast vollständig. Es wurde von Salvatore Iodice restauriert, und im Herbst 2017 übermalte der argentinische Künstler Francisco Bosoletti das Gesicht neu. Nach Maradonas Tod am 25. November 2020 wurde der Platz, der zuvor als Künstlerplatz bekannt war, nach ihm benannt und mit Gedenkstätten, Flaggen und Fotografien geschmückt.","con":"Zur Hauptverkehrszeit ist es sehr voll; früh am Morgen lässt es sich leichter und in Ruhe besichtigen.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Das große Wandgemälde von Maradona an der Fassade eines Gebäudes, darunter die Menschenmenge.","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Das Wandgemälde wurde 1990 von Mario Filardi gemalt. Das heutige Gesicht wurde 2017 vom argentinischen Künstler Francisco Bosoletti neu gemalt."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"Die Gedenktafel in Largo Maradona mit einer Büste und Flaggen","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"Die Gedenktafel auf dem Platz: Nach Diegos Tod im Jahr 2020 wurde der Künstlerplatz nach ihm benannt."},{"u":"../img/550f6edc4b91.jpg","alt":"Ein kleiner Altar mit Fotos von Maradona und Erinnerungen","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Ein kleiner Schrein, der Maradona gewidmet ist: Davon gibt es viele in der Stadt, mit Fotos und Erinnerungsstücken, die von Fans hinterlassen wurden."},{"u":"../img/679687d3070c.jpg","alt":"Maradona, gemalt mit Heiligenschein neben einem kleinen Schrein","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona mit seinem Heiligenschein und seinem Votivschrein, gemalt in der Gegend von San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Ein Votivschrein mit einem Porträt von Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Ein Votivschrein für Maradona, ähnlich denen der Heiligen."}],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Neues Schloss)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Das Schloss, das das Symbol von Neapel ist: ein Triumphbogen zwischen zwei Türmen, eine Bronzetür, die noch immer von einer Kanonenkugel getroffen wurde, und der Saal, in dem ein König während einer Hochzeitsfeier die Barone verhaften ließ.","rac":"Unter den angevinischen Königen wurde die Burg zu einem Zentrum der Kultur: Unter Robert von Anjou hielten sich dort Künstler, Ärzte und Literaten auf, darunter Giotto, Petrarca und Boccaccio.\n\nAlfons I. von Aragon machte es zu seiner königlichen Residenz und ließ es wiederaufbauen. Um seinen siegreichen Einzug in die Stadt zu feiern, errichtete er den großen Triumphbogen zwischen dem Mittelturm und dem Wachturm, der noch heute als Eingang dient.\n\nHeute beherbergt das Schloss das Stadtmuseum: Die Tour umfasst die Kunstgalerie im ersten Stock, den Baronssaal, die Pfalzkapelle, auch bekannt als Kapelle Santa Barbara, und eine archäologische Führung in der alten Rüstkammer.","con":"Eintrittspreis: 10 €; 6 € für Einwohner von Neapel und Umgebung; Eintritt frei für Kinder unter 18 Jahren. Sonntags geschlossen.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Der Maschio Angioino mit seinen zwei Türmen und dem weißen Bogen in der Mitte","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Die beiden großen Türme und in der Mitte der Triumphbogen von Alfons von Aragon: Dies ist der Eingang zur Burg."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"Der Arc de Triomphe","x":"Dies ist der Eingang zur Burg, eingebettet zwischen zwei Türmen: Alfons I. von Aragon ließ ihn anlässlich seines siegreichen Einzugs in Neapel errichten. Halten Sie davor inne, bevor Sie eintreten, und bewundern Sie ihn von unten.","d":"Am Eingang, zwischen dem mittleren Turm und dem Wachturm","foto":{"u":"../img/91d08c9a9561.jpg","alt":"Der Triumphbogen aus Marmor zwischen den beiden Türmen","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"Der Bogen aus der Nähe: Betrachten Sie ihn von unten, Etage für Etage."}},{"t":"Die Tür mit der Kanonenkugel","x":"Ferrante von Aragon gab das Tor um 1475 bei Guglielmo Monaco in Auftrag, um den Sieg über Johann von Anjou und die rebellischen Barone im Jahr 1462 zu feiern: Sechs Tafeln erzählen die Geschichte des Krieges. In der unteren linken Tafel ist noch immer eine eiserne Kanonenkugel in der Bronze eingelassen. Die gängigste Theorie besagt, dass das Tor Teil der Beute war, die Karl VIII. auf Schiffe nach Frankreich verladen hatte. Vor der Küste von Rapallo wurde die Flotte von den Genuesen angegriffen und getroffen. Die Genuesen schickten das Tor 1495 nach Neapel zurück.","d":"Das Original wird im Inneren der Burg aufbewahrt.","foto":{"u":"../img/50ee03911e6d.jpg","alt":"Die Kanonenkugel steckte in der Bronzetür.","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"Die eiserne Kanonenkugel ist in die Bronze eingelassen, im unteren linken Feld."}},{"t":"Die Baronshalle","x":"Man erreicht es über die von dem mallorquinischen Architekten Guglielmo Sagrera entworfene Außentreppe aus Rippengewölben. Blicken Sie nach oben: Das Gewölbe erhebt sich etwa 28 Meter hoch, und sechzehn Rippengewölbe erstrecken sich sternförmig von einer zentralen Öffnung. Der Name erinnert an das Jahr 1486, als König Ferrante I. die Barone unter dem Vorwand einer Hochzeit täuschte und sie hier verhaften ließ. Fünfzig Jahre lang diente es als Sitz des Stadtrats.","d":"Oben an der Hoftreppe","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"Das Sternengewölbe der Baronshalle","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"Das Gewölbe der Baronshalle: sechzehn Piperno-Rippen beginnen sternförmig von der Öffnung in der Mitte."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Strandpromenade und Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Die Burg auf der kleinen Insel, auf der die griechischen Kolonisten aus Cumae landeten: Man kommt von der Küste her, überquert die Brücke und blickt von Borgo Marinari aus über den Golf.","rac":"Die Burg steht auf der Insel Megaride, die aus zwei durch einen großen Bogen verbundenen Felsen besteht. Hier landeten Mitte des 7. Jahrhunderts v. Chr. Kolonisten aus Cumae, die später Partenope auf dem nahegelegenen Berg Echia gründeten.\n\nIm 1. Jahrhundert v. Chr. stand auf der Insel und dem Berg Echia die Villa des Lucius Licinius Lucullus. Überreste dieser Villa befinden sich noch heute in der Säulenhalle; im frühen Mittelalter diente diese Halle als Refektorium eines der auf der Insel errichteten Klöster.","con":"Das Innere der Burg ist wegen Renovierungsarbeiten bis auf Weiteres geschlossen. Besucher können die Burg heute von außen besichtigen und entlang der Strandpromenade und durch Borgo Marinari spazieren.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo am Meer, mit blauem Himmel","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo auf der Insel Megaride, die über eine Brücke mit der Küste verbunden ist."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"Die Insel von Megaride","x":"Betrachten Sie die Burg von der Küste aus: Sie ruht auf zwei Felsen, die durch einen großen Bogen verbunden sind. Laut der Gemeinde landeten hier die ersten Siedler aus Cumae.","d":"Von der Brücke, die nach Borgo Marinari führt","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo und der Yachthafen Borgo Marinari von oben gesehen","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Von oben: die Burg auf dem Felsen und daneben der kleine Hafen von Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Kupferstich von 1841 mit Castel dell'Ovo und einem Segelboot","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in einem Kupferstich von 1841."}],"leg":"Der Name stammt aus einer Legende: Der Dichter Vergil soll ein Ei, eingeschlossen in einem Käfig, in den Kellern des Schlosses versteckt haben.","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Der erste Rundgang","sub":"Spaccanapoli in einem halben Tag, Start in Ceraldi","desc":"Das Herz der Altstadt auf einem Rundgang: die Basilika Gesù Nuovo mit ihrem geheim
