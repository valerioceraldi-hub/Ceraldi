<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">

<title>Neapel-Führer · Ceraldi</title>

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"de","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità und Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Ausgangspunkt: Piazza Carità an der Via Toledo. Von hier aus beginnt die Altstadt in wenigen Gehminuten. Und dort befindet sich Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Bevor es losgeht, noch ein Kaffee: Die Tour ist lang und Neapel lässt sich am besten mit der richtigen Tasse Kaffee erkunden.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità heute, mit ihren Bäumen und farbenfrohen Gebäuden","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità heute, an der Via Toledo: Alle Stadtführungen starten von hier. Ceraldi ist hier."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":null}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Historisches Foto der Via Toledo im 19. Jahrhundert mit Kutschen und Passanten.","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Die Via Toledo im 19. Jahrhundert, als sie noch Via Roma hieß, auf einem Foto von Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità e via Toledo: una passeggiata nel cuore di Napoli","x":"La storia della piazza, raccontata da chi ci lavora dal 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, der untere Decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"Die schnurgerade Straße, die das historische Zentrum in zwei Hälften teilt: der untere Decumanus der griechischen Stadt, etwa zwei Kilometer Kirchen, Geschäfte und Leben.","rac":"Spaccanapoli ist die unterste der drei Decumani, jener parallel verlaufenden Straßen, die das griechische Neapolis von West nach Ost durchquerten. Sie beginnt an der Piazza del Gesù Nuovo als Via Benedetto Croce, geht dann in die Via San Biagio dei Librai über, kreuzt die Via Duomo und führt über die Altstadt hinaus: insgesamt etwa zwei Kilometer. Der Name ist Programm: Sie ist so lang und gerade, dass sie, von oben betrachtet, die Stadt in zwei Hälften zu teilen scheint.","con":"Gehen Sie die Straße entlang von der Piazza del Gesù in Richtung Via Duomo: Es ist ein leichter Abstieg durch die Geschichte, nicht durch Anstrengung.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista dall'alto, una linea dritta attraverso i tetti del centro storico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista da Sant'Elmo: una linea dritta che taglia i tetti del centro storico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Platz und Kirche von Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Eine Fassade aus pyramidenförmigen Steinen, die wie eine Festung aussieht und ein Geheimnis birgt: eingravierte Zeichen, die noch niemand mit Sicherheit entziffern konnte.","rac":"Bevor es zur Kirche wurde, war es ein Palast: der Palast der Fürsten von Sanseverino, erbaut 1470; eine Gedenktafel an der Fassade erinnert an den Architekten Novello da San Lucano. Die Jesuiten bewahrten die Struktur und den dunklen Piperno-Quader, dessen Steine in Pyramidenform geschnitten wurden, und ergänzten sie mit Elementen aus weißem Marmor.\n\nManche Steine weisen eingravierte Zeichen auf. Der Legende nach handelt es sich um eine geheime Botschaft; einige Gelehrte glauben, es seien die Spuren verschiedener Steinmetze; 2011 schlug der Kunsthistoriker Vincenzo De Pasquale vor, sie als Noten einer Partitur namens „Enigma“ zu lesen. Betrachten Sie sie genau und bilden Sie sich Ihre eigene Meinung.\n\nDie Fassade wurde restauriert und am 12. März 2023 wiedereröffnet, nachdem im Dezember 2017 einige Fragmente herabgefallen waren; der Platz ist seitdem für Autos gesperrt.","con":"Halten Sie Ausschau nach den Markierungen auf den Steinen in Augenhöhe, rechts und links vom Portal: Die Suche ist kostenlos.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"Die Fassade des Gesù Nuovo, aus dunklen, spitz zulaufenden Steinen.","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"Die rautenförmige Fassade: Sie war ab 1470 der Palast der Sanseverino-Fürsten. Kommen Sie näher und achten Sie auf die in die Steine eingravierten Zeichen."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"Die rautenförmige Fassade","x":"Bevor es eine Kirche wurde, war es die Fassade des Palastes der Fürsten von Sanseverino aus dem Jahr 1470. Die Jesuiten bewahrten sie im Originalzustand mit ihren dunklen, pyramidenförmig behauenen Steinen und fügten das große Barockportal hinzu. Kommen Sie näher: Viele der Steine tragen eingravierte Zeichen, deren Bedeutung bis heute nicht eindeutig geklärt ist.","d":"Draußen, auf dem Platz","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo coperta di punte di diamante in pietra grigia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante della facciata del Gesù Nuovo, con il portale e la grande finestra."}},{"t":"Die Vertreibung des Heliodorus","x":"Das große Fresko an der Gegenfassade stammt von Francesco Solimena aus dem Jahr 1725. Es zeigt Heliodorus, der versucht, den Tempel von Jerusalem zu plündern und von einem himmlischen Ritter zurückgeschlagen wird: eine Szene voller Bewegung, Pferde und fliehender Gestalten. Viele Besucher übersehen es, weil sie den Eingang mit Blick auf den Altar betreten.","d":"Sobald Sie eintreten, wenden Sie sich zur Tür: Sie befindet sich über dem Eingang.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"Das große Fresko der Vertreibung des Heliodorus von Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimenas Fresko über dem Eingang: Wenden Sie sich zur Tür, um es zu sehen. In der Mitte ist der himmlische Ritter zu sehen, der Heliodorus abwehrt."}},{"t":"Die Kuppel und die vier Evangelisten","x":"Die vier Dreiecke am Fuß der Kuppel stellen die Evangelisten dar und wurden von Giovanni Lanfranco gemalt. Die Kuppel, die Sie sehen, ist jedoch nicht die ursprüngliche: Sie stürzte beim Erdbeben von 1688 ein und wurde 1786 durch einen niedrigeren, schalenförmigen Bau ersetzt.","d":"Im Zentrum der Kirche, schau nach oben","foto":null},{"t":"Die Kapelle Sant'Ignazio","x":"Das dem Gründer des Jesuitenordens gewidmete Gotteshaus vereint zwei bedeutende Namen der neapolitanischen Kunst des 17. Jahrhunderts: Cosimo Fanzago, Schöpfer der Architektur und der Statuen der Propheten David und Jeremia, und Jusepe de Ribera, der Gemälde mit Darstellungen aus dem Leben des Heiligen schuf. Farbiger Marmor, Statuen und Gemälde verschmelzen zu einem harmonischen Ganzen: Neapolitanischer Barock in seiner schönsten Form.","d":"In einer der beiden großen Kapellen der Kirche","foto":null},{"t":"Heiliger Josef Moscati","x":"Hier befindet sich die Ruhestätte des „heiligen Arztes“ von Neapel: Giuseppe Moscati, ein Forscher und Universitätsprofessor, der sich unentgeltlich um die Armen kümmerte. Er starb 1927 und wurde 1987 heiliggesprochen. Seine Gebeine ruhen in einer Bronzeurne des Bildhauers Amedeo Garufi unter dem Altar der Kapelle Mariä Heimsuchung.","d":"In der Kapelle der Heimsuchung, unter dem Altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La stanza di san Giuseppe Moscati ricostruita: camice bianco e strumenti medici in una teca","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Nella stanza ricostruita: il camice bianco, gli strumenti medici e le fotografie di san Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"Der Gesù Nuovo-Platz vor der Kirche","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"Der Platz Gesù Nuovo, vor der Kirche."},{"u":"../img/6d1ae4837518.jpg","alt":"Das Innere des Gesù Nuovo mit farbigem Marmor und dem Hauptaltar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Im Inneren der Kontrast zur strengen Fassade: farbiger Marmor, Fresken und Gold bis hinauf zum Hochaltar."},{"u":"../img/3dd3789513c8.jpg","alt":"Das Kirchenschiff der Kirche Gesù Nuovo, vom Eingang aus gesehen","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"Das Kirchenschiff vom Eingang aus gesehen: unten, oben, die Kuppel mit Lanfrancos Evangelisten am Sockel."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Kloster und Komplex Santa Chiara (Majolika-Kreuzgang)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Der mit Majolika verkleidete Kreuzgang ist einer der ruhigsten Orte im Zentrum: nur einen Steinwurf vom Chaos von Spaccanapoli entfernt, Stille.","rac":"Santa Chiara wurde 1310 im Auftrag von König Robert von Anjou und Königin Sancha von Mallorca erbaut. Die Bauleitung übernahm zunächst Gagliardo Primario, später Lionardo di Vito. 1340 wurde die Kirche für den Gottesdienst eröffnet. Der Komplex bestand aus zwei Teilen: einem benachbarten, aber separaten Kloster der Klarissen und einem der Franziskaner.\n\nVier Jahrhunderte später wurde auf Anregung von Königin Maria Amalia von Sachsen, der Gemahlin Karls von Bourbon, das Klarissenkloster renoviert. Der Architekt Domenico Antonio Vaccaro bewahrte die gotischen Bögen aus dem 14. Jahrhundert und verwandelte das Zentrum in einen barocken Garten, dessen Wände mit Majolikafliesen aus der Werkstatt von Donato und Giuseppe Massa gesäumt sind. Das Ergebnis ist einer der überraschendsten Orte Neapels: ein Keramikgarten nur wenige Schritte von Spaccanapoli entfernt.","con":"Sonntags schließt der Kreuzgang um 14 Uhr: Wenn es Sonntagnachmittag ist, tauschen Sie die Reihenfolge und kommen Sie zuerst hierher.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"Der Eingang zum Kreuzgang von Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"Der Eingang zum Majolika-Kreuzgang von Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Kloster und Museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Kloster und Museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Die Majolikasäulen","x":"Vierundsechzig Säulen, bedeckt mit Majolikafliesen und Girlanden aus Blättern, Blüten und Früchten, stehen unter einer Pergola. Die gelben, orangen und blauen Farbtöne erinnern an die Zitrusbäume und Weinreben, die sie umgeben. Die Majolikafliesen stammen aus der Werkstatt von Donato und Giuseppe Massa und befinden sich in dem von Domenico Antonio Vaccaro entworfenen Barockgarten.","d":"Im Klostergarten","foto":{"u":"../img/924627d30fda.jpg","alt":"Säulen, die im Kreuzgang mit gelben und grünen Majolika-Fliesen bedeckt sind","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Die Säulen unter der Pergola waren mit Majolika und Girlanden aus Blättern, Blumen und Früchten verziert."}},{"t":"Die Szenen auf den Sitzen","x":"Die Sitzbänke zwischen den Säulen sind alle aus Majolika, und die Rückenlehnen sind mit kleinen Szenen bemalt: ländliches Leben, Küstenleben, Volksfeste, Mythen. Sie stellen das neapolitanische Leben des 18. Jahrhunderts in Bildern dar. Setzen Sie sich und betrachten Sie die Sitzbank hinter Ihnen genauer.","d":"Auf den Rückenlehnen zwischen den Säulen","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Ein Majolika-Sitz mit einer auf die Rückenlehne gemalten Szene","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Ein Majolika-Sitz aus dem Kreuzgang: Auf der Rückseite befindet sich eine gemalte Szene."}},{"t":"Clarissa mit den Katzen","x":"Unter den Szenen ist eine Klarissenschwester zu sehen, die die Klosterkatzen füttert: ein kleiner Einblick in den Klosteralltag, gemalt auf Majolika. Sie zu entdecken ist eine perfekte Schatzsuche, auch für Kinder.","d":"An einer der Sitzlehnen: Suchen Sie danach.","foto":null},{"t":"Die Bögen des vierzehnten Jahrhunderts","x":"Der Garten ist barock, das Ambiente jedoch mittelalterlich: Vaccaro bewahrte die Umfassungsmauer aus dem 14. Jahrhundert mit den Spitzbögen des angevinischen Klosters. Beachten Sie den Kontrast zwischen dem schlichten Stein der Bögen und den leuchtenden Farben der Majolikafliesen: vier Jahrhunderte auf einen Blick.","d":"Entlang der vier Seiten des Kreuzgangs","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Gli archi del chiostro di Santa Chiara visti in controluce, con la chiesa sullo sfondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Gli archi gotici del chiostro di Santa Chiara, visti in controluce: sullo sfondo la facciata della chiesa."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolika mit einer Wildschweinjagdszene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Aus nächster Nähe: eine Wildschweinjagd, gemalt auf Majolika in der Werkstatt von Massa zwischen 1739 und 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"Der Kreuzgang mit Majolikasäulen, Sitzbänken und Garten","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Der gesamte Kreuzgang: die Majolikasäulen, die Sitzbänke und der Garten."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Kapelle","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Der Verschleierte Christus, eine der berühmtesten Skulpturen der Welt, und die anatomischen Maschinen des Alchemistenfürsten Raimondo di Sangro.","rac":"Die Kapelle der Familie di Sangro ist das Reich von Raimondo, Prinz von Sansevero: ein Mann der Wissenschaft und der Geheimnisse, Großmeister der Freimaurerei, um den sich der Mythos bereits zu seinen Lebzeiten rankte, und er selbst befeuerte ihn.\n\nIm Zentrum steht Giuseppe Sanmartinos Verschleierter Christus, ein Auftragswerk des Fürsten: ein liegender Körper, bedeckt mit einem so dünnen Leichentuch, dass es an ein nasses Tuch erinnert, und doch aus demselben Marmorblock gehauen wie die Statue. In der unterirdischen Höhle befinden sich zwei „anatomische Maschinen“, die Skelette eines Mannes und einer Frau mit rekonstruierten Blutgefäßen, ein Werk des Palermer Arztes Giuseppe Salerno aus den Jahren 1756–1764. Die Legende erzählt von geopferten Dienern und mysteriösen Injektionen; das Museum selbst trennt sorgfältig Mythos und belegte Geschichte.","con":"Dienstags ist es geschlossen: Wenn heute Dienstag ist, ist die Statue des Nils zwei Minuten entfernt und kann jederzeit besichtigt werden.","acc":"Das Kirchenschiff und die Sakristei sind rollstuhlgerecht. Das unterirdische Auditorium mit seinen anatomischen Apparaturen ist nur über eine schmale Wendeltreppe aus dem 19. Jahrhundert erreichbar.","foto":{"u":"../img/65421f883be6.jpg","alt":"Die Außenansicht der Sansevero -Kapelle","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"Die Sansevero Kapelle von außen gesehen."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Der verschleierte Christus","x":"Ein Körper, ausgestreckt auf einer Matratze, bedeckt mit einem so dünnen Leichentuch, dass Gesicht, Wunden und Adern darunter durchscheinen. Der Schleier ist nicht nachträglich hinzugefügt: Giuseppe Sanmartino schuf ihn aus demselben Marmorblock wie die Statue, im Auftrag von Fürst Raimondo di Sangro. Gehen Sie langsam um die Statue herum: Der Schleier scheint sich auf jeder Seite zu verändern.","d":"Im Zentrum des Kirchenschiffs","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Das Antlitz Christi, verhüllt unter dem Marmorschleier","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Das Gesicht unter dem Schleier: Das Leichentuch ist aus demselben Marmorblock gefertigt wie die Statue, sieht aber aus wie ein nasses Tuch."}},{"t":"Bescheidenheit","x":"Eine Frau, in einen Schleier gehüllt, der wie nass an ihrer Haut klebt, mit einem Rosenkranz. Die Skulptur wurde 1752, im Todesjahr von Antonio Corradini, geschaffen. Der Prinz widmete sie seiner Mutter Cecilia Gaetani, die starb, als er noch nicht einmal ein Jahr alt war. Achten Sie auf den zerbrochenen Grabstein zu ihren Füßen: Er zeugt von einem viel zu früh beendeten Leben.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"Die Statue der Bescheidenheit, eine mit einem Schleier bedeckte Frau","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Schamhaftigkeit von Antonio Corradini: Der Schleier schmiegt sich an ihren Körper, als wäre er nass. Zu ihren Füßen ein zerbrochener Grabstein."}},{"t":"Die Ernüchterung","x":"Ein Mann befreit sich mithilfe eines kleinen geflügelten Dschinns mit einer Flamme auf der Stirn – einem Symbol der Intelligenz – aus einem großen Netz. Francesco Queirolo schuf die Skulptur 1753/54 zum Gedenken an den Vater des Prinzen. Das Netz besteht vollständig aus durchbrochenem Marmor: Der Überlieferung nach weigerten sich die Gehilfen, es zu bearbeiten, aus Angst, es zu zerbrechen, sodass der Bildhauer es selbst glättete.","d":"In der Nähe des Hauptaltars","foto":{"u":"../img/921cf7f91318.jpg","alt":"Die Statue der Desillusionierung, ein Mann, der sich aus einem Netz befreit.","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Francesco Queirolos Desillusionierung: Das Netz besteht vollständig aus Marmor und ist von Hand perforiert."}},{"t":"Der labyrinthische Boden","x":"Der ursprüngliche Fußboden war ein Labyrinth aus farbigem Marmor, durchzogen von einer durchgehenden weißen Linie – vom Fürsten als Symbol für den beschwerlichen Weg zum Wissen konzipiert. Francesco Celebrano erbaute ihn bis etwa 1771. Ein Einsturz im Jahr 1889 zerstörte ihn fast vollständig; einige wenige Platten sind im Durchgang vor Raimondos Grabmal, im Cavea und in der Sakristei erhalten geblieben.","d":"Im Durchgang vor dem Grab des Prinzen","foto":null},{"t":"Die anatomischen Maschinen","x":"Zwei Skelette, ein Mann und eine Frau, deren Blutgefäße mit einer noch heute verblüffenden Präzision rekonstruiert wurden. Sie wurden zwischen 1756 und 1764 von dem Arzt Giuseppe Salerno aus Palermo geschaffen. Um sie herum entstand die düstere Legende des Prinzen: Das Museum erklärt sorgfältig, wo die Geschichte endet und der Mythos beginnt.","d":"Im unterirdischen Cavea, über eine schmale Wendeltreppe hinunter","foto":null}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"Das Innere der Sansevero -Kapelle mit den Statuen","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"Die gesamte Kapelle: im Zentrum der Verschleierte Christus, umgeben von den Statuen der Familie di Sangro."}],"leg":"Zu Lebzeiten Raimondo di Sangros wurde viel über ihn erzählt: geheimnisvolle Experimente, alchemistische Geheimnisse, sogar Diener, die in anatomische Maschinen verwandelt wurden. Das Museum unterscheidet sorgfältig zwischen der Legende und den belegten Fakten: Es lohnt sich, beide Versionen anzuhören und sich für eine zu entscheiden.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"La chiesa dove visse e insegnò san Tommaso d'Aquino e dove, secondo la tradizione, un Crocifisso gli rivolse la parola.","rac":"Il complesso domenicano si affaccia sull'omonima piazza, lungo Spaccanapoli. La chiesa gotico-angioina fu costruita tra il 1283 e il 1324 e in seguito trasformata in epoca barocca. Nel convento visse e insegnò Tommaso d'Aquino, tra il 1272 e il 1274; furono legati a questo luogo anche Giordano Bruno e Tommaso Campanella.\n\nNella sagrestia, con la volta affrescata da Francesco Solimena nel 1709, si trovano le arche dei sovrani aragonesi. Per secoli la basilica ha custodito anche un capolavoro di Caravaggio, la Flagellazione di Cristo, oggi al Museo di Capodimonte.\n\nOggi il complesso si visita anche come museo DOMA: sagrestia, arche aragonesi e cella di San Tommaso.","con":"Se hai tempo, entra anche nel percorso del museo: sagrestia, arche aragonesi e cella di San Tommaso. Gli orari cambiano e alcune sezioni possono essere chiuse per lavori: controlla il sito ufficiale prima di venire.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"La guglia di San Domenico e l'abside della chiesa nella piazza","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"La guglia di San Domenico e, dietro, l'abside della chiesa."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visite guidate."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"Il Crocifisso che parlò a san Tommaso","x":"È una tavola dipinta, custodita nella basilica. La tradizione dice che il Cristo si rivolse a Tommaso d'Aquino, che pregava dopo aver scritto di teologia: gli avrebbe detto che aveva scritto bene di lui e gli avrebbe chiesto quale ricompensa desiderasse. Il Ministero della Cultura ricorda la tavola come quella che «parlò» al santo e che fu spostata nel 1437 in una nuova cappella.","d":"Dentro la basilica, nella cappella del Crocifisso","foto":null},{"t":"La sagrestia di Solimena e le arche aragonesi","x":"La volta della sagrestia fu affrescata da Francesco Solimena nel 1709 con il Trionfo dell'Ordine domenicano. Lungo le pareti si vedono le arche sepolcrali dei sovrani aragonesi e di altri dignitari di corte.","d":"Nella sagrestia, visita del museo DOMA","foto":null},{"t":"La cella di San Tommaso","x":"Qui Tommaso d'Aquino visse e studiò. La cella è stata restaurata ed è visitabile insieme al museo DOMA.","d":"Nel percorso del museo","foto":null}],"gal":[],"leg":"Si racconta che il Crocifisso dipinto su tavola, conservato nella basilica, abbia parlato a san Tommaso d'Aquino mentre pregava: gli avrebbe detto che aveva scritto bene di lui e gli avrebbe chiesto quale ricompensa desiderasse.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli und Nilstatue","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una statua romana del dio Nilo, scambiata per secoli per una donna che allatta: il «Corpo di Napoli».","rac":"In piazzetta Nilo, lungo via San Biagio dei Librai, cioè Spaccanapoli, c'è una statua di marmo del II-III secolo d.C. che raffigura il dio del fiume Nilo: un uomo barbuto semisdraiato con una cornucopia, circondato da putti che simboleggiano i rami del fiume. La eressero i mercanti alessandrini che vivevano in questa zona, chiamata Regio Nilensis.\n\nFu ritrovata senza testa nel 1476. Così i napoletani la scambiarono per una figura femminile che allatta dei bambini, simbolo della città che nutre i suoi abitanti: da qui il nome «Corpo di Napoli», che ancora oggi dà il nome al largo. Nel 1657 fu collocata su un nuovo basamento e nello stesso secolo le fu scolpita una testa barbuta.\n\nOggi la statua è ancora al suo posto, a ricordo delle radici multiculturali di Napoli.","con":"Passaci con calma: è una tappa da cinque minuti sulla strada di Spaccanapoli. Cerca i putti sul corpo del dio: fanno capire perché fu scambiata per una donna.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"Die antike Statue des Gottes Nil, liegend","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"Die Statue des liegenden Gottes Nil auf dem kleinen Platz, der seinen Namen trägt."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"Il dio Nilo e i putti","x":"Il dio del fiume è disteso su un fianco e tiene una cornucopia. I putti che lo circondano simboleggiano i rami del Nilo. Per chi l'ha guardata a lungo senza testa, sembrava una donna che allatta.","d":"Al centro della piazzetta","foto":null},{"t":"Perché «Corpo di Napoli»","x":"La statua fu ritrovata senza testa nel 1476. Per questo si pensò a una figura femminile che nutre i suoi figli: la città stessa. Il nome è rimasto al largo, anche dopo che la statua ebbe una testa nuova.","d":"Sul basamento e nel nome del largo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai und seine Geschäfte","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Das Viertel der Buchhändler und Kunsthandwerker von Spaccanapoli: Läden, Kirchen und das Puppenkrankenhaus.","rac":"Dies ist der Abschnitt der Spaccanapoli, der sich von der Piazzetta Nilo bis zur Via Duomo auf dem unteren Decumanus erstreckt. Seinen Namen verdankt er den dort seit jeher ansässigen Buchhandlungen: Eine Inschrift am nahegelegenen Palazzo Marigliano erinnert an die Kunst der Buchhändlermeister. Die Verehrung des Heiligen Blasius reicht bis ins 8. Jahrhundert zurück, als armenische Nonnen eine Reliquie des Heiligen nach Neapel brachten. Ebenfalls an dieser Straße befindet sich das Ospedale delle Bambole, eine Handwerkswerkstatt, die seit Generationen in Familienbesitz ist.","con":"Im Dezember eröffnen die Krippengeschäfte: An den Wochenenden muss man mit großem Andrang rechnen.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai vista in lunghezza: una stretta strada acciottolata tra palazzi alti, con balconi, panni stesi, negozi e passanti, e in fondo la collina del Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, il tratto di Spaccanapoli più vivo di botteghe e voci."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: il vicolo stretto, i negozi e uno stendardo appeso in alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la strada stretta e dritta del decumano inferiore, con i negozi e la gente a passeggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella beim Buchhändler und der Schädel mit Ohren","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Eine winzige Steinmetzkirche, die dem Heiligen der Augen gewidmet ist, und ein einzigartiger Schädel: der mit Ohren.","rac":"Die Kirche wurde kurz vor 1327 von Bartolomeo di Capua, einem Juristen der angevinischen Könige, gegründet und anschließend den Pipernieri, den Steinmetzen, anvertraut: Sie wählten die heilige Lucia, die Beschützerin des Augenlichts, weil die Splitter ihres Handwerks ihre Augen gefährdeten.\n\nNach über dreißig Jahren des Leerstands wurde es am 5. April 2019 dank des Vereins Respiriamo Arte wiedereröffnet. In seinem unterirdischen Gewölbe hinterließ der Kult der „anime pezzentelle“ (kranken Seelen) einen Schädel, der einzigartig ist: Er hat Ohren.","con":"Es ist klein und kann in wenigen Minuten besichtigt werden: perfekt als Zwischenstopp zwischen Sansevero und Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Das Portal der Santa Luciella in der Gasse","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Das Portal von Santa Luciella. Schauen Sie nach oben: Darüber befindet sich das Fresko mit dem Wappen der Familie Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Das Wappen der Pipernieri","x":"Bevor Sie eintreten, schauen Sie nach oben: Über dem Portal aus Piperno-Stein befindet sich noch immer ein Fresko mit dem Wappen der Piperno-Steinmetzgilde, jener Steinmetze, denen die Kirche gehörte. Sie arbeiteten zwischen den Steinsplittern und wählten deshalb die heilige Lucia, die Schutzpatronin des Augenlichts.","d":"Über dem Eingangsportal","foto":null},{"t":"Der Schädel mit Ohren","x":"Unter der Kirche, im Hypogäum, befindet sich ein Schädel mit erhaltenem Ohrknorpel: Das macht ihn einzigartig. Der Volksglaube besagt, dass er gerade deshalb, weil er Ohren hat, die Gebete derer, die um einen Gefallen bitten, besser hört.","d":"Im Hypogäum, mit einer Führung","foto":null},{"t":"Die armen Seelen","x":"Im 17. Jahrhundert, nach der Pest, nahmen die Neapolitaner die Schädel der namenlosen Toten in ihre Obhut: Sie reinigten sie, beteten für sie und baten im Gegenzug um Hilfe. Es war der Kult der „anime pezzentelle“, der armen Seelen. Hierin befindet sich eines der bekanntesten Zeugnisse der Stadt.","d":"Im Hypogäum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Teschi illuminati dalla luce di una candela, con una targa «per grazia ricevuta»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Teschi nelle teche: su una targa si legge il nome di chi ha fatto la grazia, un modo di ringraziare le anime «pezzentelle»."}}],"gal":[],"leg":"Man sagt, der Schädel mit Ohren höre Gebete besser, gerade weil er Ohren habe: Aus diesem Grund wurde ihm seit Generationen die schwierigsten Bitten anvertraut.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Puppenkrankenhaus","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Ein Geschäft, das seit Generationen Puppen und Spielzeug sammelt: ein Schaufenster, das Kinder und Erwachsene gleichermaßen in Erinnerung behalten werden.","rac":"Ende des 19. Jahrhunderts arbeitete Luigi Grassi als Bühnenbildner für Theater und Krippen. Nachbarn brachten ihm kaputte Puppen und Spielzeug, und seine Werkstatt wurde beinahe zufällig zum ersten Spielzeugkrankenhaus in Neapel.\n\nHeute wird es von Tiziana, der Urenkelin des Gründers, im Innenhof des Palazzo Marigliano in der Via San Biagio dei Librai geleitet. Drinnen gleicht es einem richtigen Krankenhaus: weiße Kittel, Krankenzimmer und eine Patientenakte für jeden Patienten. Für viele Neapolitaner ist es der Ort, an den sie als Kinder ihr Lieblingsspielzeug brachten.","con":"Allein schon das Schaufenster ist einen Stopp wert: Es liegt auf dem Rückweg.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"Das Schaufenster des Puppenkrankenhauses ist voller Puppen.","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"Das Schaufenster des Puppenkrankenhauses: Puppen und Spielzeuge, die darauf warten, „geheilt“ zu werden."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Orari di ottobre e novembre: in altri periodi possono cambiare."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Orari di ottobre e novembre: in altri periodi possono cambiare."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Ein echtes Krankenhaus für Spielzeug","x":"Es handelt sich nicht um ein Geschäft, sondern um ein Labor, das wie ein Krankenhaus organisiert ist: die „Ärzte“ in weißen Kitteln, die Abteilungen für Orthopädie, Augenheilkunde und Schneiderei sowie die Patienten, Puppen, Teddybären und Stofftiere, von denen jedes seine eigene Krankenakte und Diagnose hat.","d":"Im Laden","foto":null},{"t":"Der Gründer Bühnenbildner","x":"Alles begann im späten 19. Jahrhundert mit Luigi Grassi, einem Bühnenbildner für Theater und Krippen. Nachbarn brachten ihm kaputtes Spielzeug, und er wandelte die Werkstatt in das erste „Krankenhaus“ um. Heute behandelt seine Urenkelin Tiziana die Patienten.","d":"In der Geschichte des Ladens","foto":null},{"t":"Der Innenhof des Palazzo Marigliano","x":"Das Krankenhaus befindet sich im Innenhof des Palazzo Marigliano an Spaccanapoli. Sobald man den Haupteingang betritt, verstummt der Straßenlärm: Es ist einer der vielen versteckten Innenhöfe im historischen Zentrum, die es zu entdecken gilt.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"Il cortile giallo di Palazzo Marigliano con l'arco d'ingresso","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Il cortile di Palazzo Marigliano, con l'arco d'ingresso e le facciate color ocra."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, die Straße der Krippen","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Un vicolo stretto dove il Natale dura tutto l'anno: botteghe di artigiani, pastori di terracotta e presepi.","rac":"Via San Gregorio Armeno collega via dei Tribunali con via San Biagio dei Librai, cioè Spaccanapoli. È la via dei presepi: le botteghe artigiane espongono statuine e presepi tutto l'anno, anche d'estate. Secondo alcune fonti la tradizione di produrre statuette di terracotta in questa zona risale all'epoca romana; la fama del presepe napoletano divenne internazionale dal Settecento.\n\nTra le botteghe storiche ci sono Gambardella, attiva dal 1800, e i Fratelli Capuano, fondata nel 1840. Lungo la via si trova anche il monastero di San Gregorio Armeno, da cui la strada prende il nome, con la chiesa dedicata a santa Patrizia, compatrona di Napoli.\n\nIl periodo più animato va da fine novembre all'Epifania, quando la via è affollatissima.","con":"Vieni la mattina presto e nei giorni feriali: a dicembre la ressa è tanta. Cerca i pastori che raccontano l'attualità: ogni anno gli artigiani ne creano di nuovi.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"La via dei presepi, stretta e piena di botteghe","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, la strada dei presepi."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Le botteghe dei presepi","x":"Le botteghe producono pastori e presepi in terracotta e sughero, spesso dipinti a mano. Accanto alle figure tradizionali ci sono personaggi dell'attualità: ogni anno gli artigiani ne inventano di nuovi. Puoi guardare anche senza comprare: molti artigiani lavorano a vista.","d":"Lungo tutta la via","foto":null},{"t":"Il monastero di San Gregorio Armeno","x":"Il monastero dà il nome alla via. La chiesa conserva un soffitto a cassettoni di Teodoro d'Errico e affreschi di Luca Giordano, come la Gloria di San Gregorio. Nel complesso c'è anche la chiesa dedicata a santa Patrizia, compatrona di Napoli.","d":"Dentro il monastero, lungo la via","foto":null},{"t":"Quando andare","x":"Le botteghe sono aperte tutto l'anno. Il periodo più vivo va da fine novembre all'Epifania, quando la via è piena di gente: meglio i giorni feriali e la mattina presto.","d":"Lungo tutta la via","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore und die Ausgrabungen Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Una chiesa gotica del Duecento che nasconde, dieci metri sotto la navata, il mercato dell'antica Neapolis: strade, botteghe e ambienti di duemila anni fa.","rac":"Piazza San Gaetano è il cuore dell'antica Neapolis. Sopra i resti del mercato greco-romano, nel Duecento, sorse la basilica gotica di San Lorenzo Maggiore, una delle chiese più antiche della città. Il complesso comprende anche il convento, il museo dell'Opera e gli scavi.\n\nGli scavi, iniziati nel 1976, hanno riportato alla luce il macellum, il mercato, che sorgeva lungo l'antico decumano maggiore. Si scende a circa dieci metri sotto la chiesa e si cammina tra strade, botteghe e ambienti di età imperiale. Sotto la chiesa sono emersi anche i resti di una basilica cristiana del VI secolo.\n\nIl museo dell'Opera, negli ambienti del convento e nella torre civica, racconta la storia di Napoli dall'età classica all'Ottocento.","con":"Scendi negli scavi: è la parte che non ti aspetti. Calcola circa tre quarti d'ora e controlla gli orari sul sito ufficiale prima di venire.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"La facciata di San Lorenzo Maggiore su piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, affacciata su piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Orario indicato dalla scheda del Ministero della Cultura e da fonti turistiche; il sito ufficiale non è stato leggibile: controllare prima di scrivere come certo."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"Il mercato sotto la chiesa","x":"Gli scavi mostrano il macellum della Neapolis greco-romana, il mercato che sorgeva lungo l'antico decumano maggiore. Si trovano a circa dieci metri sotto la chiesa. Camminando tra le strutture si riconoscono la strada e gli ambienti dove si vendeva e si commerciava: è un pezzo di città antica ancora al suo posto, sopra cui Napoli ha continuato a costruire.","d":"Sotto la navata, negli scavi","foto":null},{"t":"L'altare maggiore di Giovanni da Nola","x":"L'altare maggiore è un'opera rinascimentale dello scultore napoletano Giovanni da Nola, tra le più belle di Napoli. L'abside che lo ospita è la parte più antica della chiesa.","d":"In fondo alla chiesa, nell'abside","foto":null},{"t":"Il museo dell'Opera","x":"Il museo occupa gli ambienti del convento e la torre civica accanto alla basilica. Espone arredi, costumi e collezioni e presenta la storia di Napoli dall'età classica all'Ottocento.","d":"Nel convento, accanto alla basilica","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, die Kirche der capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"Die Kirche der capuzzelle: unter dem Fußboden das Hypogäum, wo Neapel für namenlose Seelen betete. Und Lucias Schädel.","rac":"Die Neapolitaner nennen sie „’e cape ’e morte“, die Totenkopfkirche. Es handelt sich um eine kleine Kirche aus dem 17. Jahrhundert am Hauptdekumanus, die mit der Verehrung der Seelen im Fegefeuer verbunden ist, welche sich während der Gegenreformation verbreitete. Eine steile Treppe führt zum Hypogäum, der unterirdischen Kirche, die im 18. Jahrhundert erweitert und mit Majolika verziert wurde: Hier kümmerten sich die Gläubigen um die sterblichen Überreste anonymer Verstorbener und baten um deren Fürsprache. Am Ende eines kleinen Ganges wird der Schädel der Lucia aufbewahrt, einer besonders verehrten jungen Seele.","con":"Hinter dem Altar befindet sich der geflügelte Marmorschädel von Dionisio Lazzari: Er ist das Symbol der Kirche.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"Die Fassade des Purgatorio ad Arco an der Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"Die Fassade des Purgatorio ad Arco, auf dem Hauptdecumanus."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Chiesa alta, ipogeo e museo. Visite guidate incluse nel biglietto, con prenotazione."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Chiesa alta, ipogeo e museo."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Die Gemälde des siebzehnten Jahrhunderts","x":"Bevor Sie hinabsteigen, werfen Sie einen Blick auf die Kirche darüber: Sie beherbergt kostbare Marmorarbeiten und Gemälde dreier neapolitanischer Meister des 17. Jahrhunderts: Massimo Stanzione, Luca Giordano und Andrea Vaccaro. Sie bildet den „oberen“ Teil eines Ortes, dessen Lebendigkeit vor allem von dem lebt, was sich darunter befindet.","d":"In der Oberkirche","foto":null},{"t":"Der geflügelte Schädel","x":"Zu den Dekorationen der Kirche gehört ein geflügelter Totenkopf, ein Werk von Dionisio Lazzari: ein Bild, das den Geist des Ortes verkörpert, wo der Tod nicht gefürchtet wird, sondern zu einer Gelegenheit für Gebet und Verbindung mit denen wird, die nicht mehr unter uns sind.","d":"In der Oberkirche","foto":null},{"t":"Das Hypogäum der Seelen","x":"Die wahre Kirche ist die unterirdische: ein großer Raum, in dem Gläubige noch heute die namenlosen Gebeine pflegen und um ihren Schutz bitten. Er wurde im 18. Jahrhundert erweitert und mit Majolikafliesen verziert. Steigen Sie langsam hinab: Es ist ein Ort lebendiger Andacht, nicht bloßer Neugier.","d":"Unterhalb der Kirche, eine steile Treppe hinunter","foto":null},{"t":"Lucias Schädel","x":"Unter all den Schädeln im Hypogäum ist einer besonders verehrt: der der Lucia, die als Seele einer jungen Frau gilt. Er wird am Ende eines kleinen Ganges aufbewahrt und ist das ergreifendste Zeugnis des Seelenkults im Fegefeuer.","d":"Im Hypogäum, am Ende eines kleinen Ganges","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Ein Bild der Seelen im Fegefeuer inmitten der Flammen im Inneren der Kirche","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Im Inneren der Kirche: die Seelen des Fegefeuers in den Flammen, das Thema des gesamten Ortes."},{"u":"../img/de63b1b83fa8.jpg","alt":"Ein bronzener Schädel auf einer kleinen Säule","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Ein bronzener Totenkopf: das Symbol der „capuzzelle“-Kirche."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Vierzig Meter unterhalb der Via dei Tribunali: die Zisternen, die jahrhundertelang Neapel mit Wasser versorgten, Kriegsbunker beherbergten und ein römisches Theater beherbergten, das unter einem Bett verborgen war.","rac":"Unterhalb des historischen Zentrums liegt eine andere Stadt. Von der Piazza San Gaetano führt ein Weg über hundert Stufen hinab in eine Tiefe von etwa 40 Metern, vorbei an einem griechisch-römischen Aquädukt und Tunneln aus dem Mittelalter, der Bourbonenzeit und der Neuzeit.\n\nDie Höhlen aus der griechischen Antike dienten etwa 23 Jahrhunderte lang als Zisternen für die Wasserversorgung der Stadt. Während des Zweiten Weltkriegs wurden dieselben Räumlichkeiten zu Luftschutzbunkern umfunktioniert.\n\nDie unterirdische Tour ist geführt und dauert etwa eine Stunde. Anschließend geht es wieder an die Oberfläche, wo die letzte Überraschung wartet: die Überreste des griechisch-römischen Theaters von Neapolis, das seit dem 15. Jahrhundert in die Häuser des Viertels integriert ist. Man betritt ein „Basso“, ein ebenerdiges Haus, rückt ein Bett beiseite und steigt durch eine Falltür in die Mauern des Theaters hinab.","con":"Flache Schuhe und ein Sweatshirt werden empfohlen, auch im Sommer: Unterirdisch ist es feucht. Der kurze, enge Durchgang mit der Kerze ist optional. Für Gruppen ab 10 Personen ist eine Reservierung erforderlich.","acc":"Nicht geeignet für Rollstühle oder Gehhilfen: Es gibt Treppen mit Handläufen und enge Durchgänge.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Eine große, in den Tuffstein gegrabene unterirdische Zisterne, schwach beleuchtet","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Eine der großen Zisternen, die in den Tuffstein gegraben wurden, etwa 40 Meter unterhalb der Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Führungen finden stündlich von 10:00 bis 18:00 Uhr auf Italienisch und Englisch statt. Zusätzlich werden donnerstags um 21:00 Uhr Führungen angeboten, jedoch nur nach vorheriger Reservierung und für Gruppen ab 10 Personen."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Die griechisch-römischen Zisternen","x":"Die in den Tuffstein gehauenen Räume aus der griechischen Antike dienten rund 23 Jahrhunderte lang als Wasserzisternen Neapels und waren durch das griechisch-römische Aquädukt miteinander verbunden.","d":"Im ersten Teil des Besuchs, in etwa 40 Metern Tiefe","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Die Tuffsteinwände einer unterirdischen Zisterne","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Die Tuffsteinwände einer Zisterne: Rund 23 Jahrhunderte lang wurde hier das Wasser der Stadt gesammelt."}},{"t":"Die Passage mit der Kerze","x":"Ein sehr kurzes, schmales Stück wird mit einer Kerze in der Hand begangen. Dies ist optional: Wer möchte, kann diesen Schritt auslassen und stattdessen die Taschenlampe seines Handys benutzen.","d":"Entlang des unterirdischen Weges","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Ein sehr schmaler, im Tuffstein erleuchteter Tunnel","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Einer der sehr schmalen Tunnel, die in den Tuffstein gegraben wurden."}},{"t":"Die Schutzräume des Krieges","x":"Während des Zweiten Weltkriegs wurden diese unterirdischen Räume als Luftschutzbunker genutzt: Hier suchte die Stadt Schutz vor den Bombenangriffen.","d":"Entlang des unterirdischen Weges","foto":{"u":"../img/0f4490838101.jpg","alt":"Unterirdisch ausgestellte Artefakte aus dem Zweiten Weltkrieg","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Erinnerungen an den Krieg: Gegenstände aus der Zeit, als diese Räume Luftschutzbunker waren."}},{"t":"Das Theater unter dem Bett","x":"Die Überreste des griechisch-römischen Theaters von Neapolis wurden im 15. Jahrhundert in moderne Wohnhäuser integriert. Man betritt einen Keller, rückt das Bett beiseite und gelangt durch eine Falltür in die Mauern des Theaters.","d":"Zweiter Teil des Besuchs, auf der Oberfläche zwischen Via Anticaglia und Vico Cinquesanti","foto":null}],"gal":[],"leg":"Der Überlieferung nach befanden sich Neros Garderoben in den versteckten Räumen unter dem Erdgeschoss, wenn er nach Neapel kam, um im Theater aufzutreten.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Due colonne romane alte undici metri sorreggono ancora la facciata: sono ciò che resta del tempio dei Dioscuri.","rac":"Su piazza San Gaetano, nel cuore del centro antico, una scalinata porta a una facciata sostenuta da due colonne corinzie alte circa undici metri. Sono ciò che resta del tempio dei Dioscuri, costruito tra il I e il II secolo d.C. e considerato l'edificio antico più importante di Napoli.\n\nUna prima chiesa di San Paolo fu costruita qui tra l'VIII e il IX secolo; poi i Teatini la ricostruirono, dal secondo Cinquecento. Il terremoto del 1688 abbatté gran parte del tempio antico; l'architetto Arcangelo Guglielmelli inglobò le colonne rimaste nella nuova facciata. I bombardamenti del 1943 danneggiarono l'interno, ma gran parte delle decorazioni si salvò.\n\nQui è sepolto san Gaetano Thiene, fondatore dei Teatini.","con":"Guarda le colonne da vicino, poi entra: la sagrestia affrescata da Solimena è tra le parti più belle. Gli orari di apertura cambiano: controlla prima.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Le colonne corinzie del tempio romano sulla facciata di San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Le colonne corinzie del tempio dei Dioscuri sulla facciata di San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Le colonne del tempio dei Dioscuri","x":"Le due colonne corinzie in facciata, alte circa undici metri, sono ciò che resta del tempio dei Dioscuri. Dopo il terremoto del 1688 l'architetto Arcangelo Guglielmelli le inglobò nella nuova facciata. Sopra la scalinata, le statue di San Pietro e San Paolo furono scolpite da Andrea Falcone nel 1671.","d":"Sulla facciata, in cima alla scalinata","foto":null},{"t":"La tomba di san Gaetano","x":"In questa basilica è sepolto san Gaetano Thiene, fondatore dei Teatini, l'ordine che ricostruì la chiesa dal secondo Cinquecento. Il santuario a lui dedicato fa parte della pianta della chiesa.","d":"Dentro la basilica","foto":null},{"t":"La sagrestia di Solimena","x":"La sagrestia della basilica è decorata da Francesco Solimena, uno dei maggiori pittori napoletani del Settecento. È una delle parti più belle della chiesa.","d":"Dietro la navata, nella sagrestia","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La cupola ottagonale della chiesa del Pio Monte della Misericordia vista dal basso","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cupola della chiesa ottagonale del Pio Monte della Misericordia, guardando in alto."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia
