si chiamava Largo di Palazzo.","d":"In tutta la piazza","foto":{"u":"img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito vista nella sua ampiezza","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, un tempo Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Palazzo Reale","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"La grande reggia dei viceré e dei Borbone: scalone d'onore, Teatro di Corte, Sala del Trono e un giardino sul golfo.","rac":"Il Palazzo Reale si affaccia su Piazza del Plebiscito. Fu fatto costruire all'inizio del Seicento dal viceré spagnolo Fernando Ruiz de Castro, conte di Lemos, e per secoli fu sede del potere a Napoli; la costruzione si protrasse per secoli e fu completata solo nel 1858 da Gaetano Genovese. Sulla facciata, nelle nicchie, ci sono otto statue di sovrani di Napoli.\n\nIl museo occupa l'Appartamento storico, al piano nobile: ci si arriva dallo Scalone d'onore, opera di Francesco Antonio Picchiatti del 1651, rivestito di marmo rosa e bianco e considerato tra i più belli d'Europa. Tra le sale ci sono il Teatrino di Corte, la Sala del Trono, la Cappella Reale e il Salone d'Ercole. L'Appartamento storico è aperto al pubblico dal 1919 e fu gravemente danneggiato durante la Seconda guerra mondiale.\n\nIl Giardino romantico, sul lato verso il golfo, ha un ingresso gratuito.","con":"Salendo lo Scalone d'onore fai caso al marmo e alla luce. Di norma è aperto dalle 9 alle 20 (ultimo ingresso alle 19) ed è chiuso il mercoledì: controlla comunque prima di venire.","acc":"","foto":{"u":"img/1baab5d71869.jpg","alt":"La facciata del Palazzo Reale sulla piazza","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"La facciata del Palazzo Reale."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Appartamento di Etichetta (Appartamento Storico). Di norma chiuso il mercoledì. Ultima conferma dalle pagine ufficiali del Ministero della Cultura (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"Lo Scalone d'onore","x":"Disegnato da Francesco Antonio Picchiatti nel 1651, fu rivestito più tardi in marmo rosa e bianco. È considerato uno degli scaloni monumentali più belli d'Europa e porta al museo del piano nobile.","d":"All'ingresso, sul cortile d'onore","foto":{"u":"img/7533a4a26b58.jpg","alt":"Lo Scalone d'onore di Palazzo Reale","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"Lo Scalone d'onore di Palazzo Reale, rivestito di marmi."}},{"t":"Il Teatrino di Corte e la Sala del Trono","x":"L'Appartamento storico ospita il Teatrino di Corte, la Sala del Trono con un grande lampadario di cristallo, la Cappella Reale e il Salone d'Ercole: erano gli ambienti di vita e di rappresentanza della corte.","d":"Al piano nobile, nell'Appartamento storico","foto":{"u":"img/841e35a47444.jpg","alt":"Il trono nella Sala del Trono di Palazzo Reale","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"La Sala del Trono nell'Appartamento storico."}},{"t":"Il Giardino romantico","x":"Sul lato verso il golfo c'è il giardino, con ingresso gratuito, dove si cammina tra aiuole e alberi. È un luogo tranquillo con vista sul golfo.","d":"Sul lato del palazzo verso il mare","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Castel Nuovo)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Il castello simbolo di Napoli: un arco di trionfo tra due torri, una porta di bronzo ancora colpita da una palla di cannone e la sala dove un re fece arrestare i baroni durante una festa di nozze.","rac":"Con i re angioini il castello diventò un centro di cultura: sotto Roberto d'Angiò vi soggiornarono artisti, medici e letterati, tra cui Giotto, Petrarca e Boccaccio.\n\nAlfonso I d'Aragona ne fece la sua residenza reale e lo ricostruì. Per celebrare il suo ingresso vittorioso in città fece costruire, tra la Torre di Mezzo e la Torre di Guardia, il grande Arco di Trionfo che ancora oggi fa da ingresso.\n\nOggi il castello è la sede del Museo Civico: il percorso comprende la pinacoteca al primo piano, la Sala dei Baroni, la Cappella Palatina, detta anche di Santa Barbara, e un percorso archeologico nell'antica Armeria.","con":"Biglietto intero 10 euro; 6 euro per chi risiede a Napoli e nella città metropolitana; gratis sotto i 18 anni. Chiuso la domenica.","acc":"","foto":{"u":"img/01914a520eb7.jpg","alt":"Il Maschio Angioino con le due torri e l'arco bianco in mezzo","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Le due grandi torri e, in mezzo, l'Arco di Trionfo di Alfonso d'Aragona: è l'ingresso del castello."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"L'Arco di Trionfo","x":"È l'ingresso del castello, stretto tra due torri: Alfonso I d'Aragona lo volle per celebrare il suo ingresso vittorioso a Napoli. Fermati davanti prima di entrare e guardalo dal basso.","d":"All'ingresso, tra la Torre di Mezzo e la Torre di Guardia","foto":{"u":"img/91d08c9a9561.jpg","alt":"L'Arco di Trionfo di marmo tra le due torri","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arco da vicino: guardalo dal basso, piano per piano."}},{"t":"La porta con la palla di cannone","x":"Ferrante d'Aragona la commissionò a Guglielmo Monaco verso il 1475, per ricordare la vittoria del 1462 su Giovanni d'Angiò e i baroni ribelli: sei riquadri raccontano la guerra. Nel pannello in basso a sinistra c'è ancora una palla di cannone di ferro conficcata nel bronzo. L'ipotesi più accreditata: la porta faceva parte del bottino che Carlo VIII caricò sulle navi per la Francia; al largo di Rapallo la flotta fu attaccata dai genovesi e il colpo la raggiunse. I genovesi la rimandarono a Napoli nel 1495.","d":"L'originale è conservato all'interno del castello","foto":{"u":"img/50ee03911e6d.jpg","alt":"La palla di cannone conficcata nella porta di bronzo","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La palla di cannone di ferro conficcata nel bronzo, nel pannello in basso a sinistra."}},{"t":"La Sala dei Baroni","x":"Ci si arriva dalla scala esterna di piperno dell'architetto maiorchino Guglielmo Sagrera. Alza gli occhi: la volta sale a circa 28 metri e sedici costoloni di piperno partono a stella da un'apertura al centro. Il nome ricorda il 1486, quando re Ferrante I invitò con l'inganno i baroni a festeggiare un matrimonio e qui li fece arrestare. Per cinquant'anni è stata la sede del Consiglio Comunale.","d":"In cima alla scala del cortile","foto":{"u":"img/2761d90bc4e9.jpg","alt":"La volta a stella della Sala dei Baroni","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La volta della Sala dei Baroni: sedici costoloni di piperno partono a stella dall'apertura al centro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Un tunnel voluto da un re come via di fuga, diventato rifugio antiaereo e poi deposito: un viaggio sotto la collina di Pizzofalcone.","rac":"La Galleria Borbonica fu ordinata da Ferdinando II di Borbone con decreto del 19 febbraio 1853, e progettata dall'architetto Errico Alvino. Doveva collegare il Palazzo Reale con Piazza della Vittoria e le caserme, passando sotto la collina di Pizzofalcone: una via di fuga rapida per il re. I lavori si interruppero per mancanza di fondi e poi per i cambiamenti politici dell'Unità d'Italia.\n\nDurante la Seconda guerra mondiale alcuni ambienti furono usati come rifugio antiaereo. Nel dopoguerra, fino agli anni Settanta, la galleria fu il deposito giudiziale del Comune di Napoli: ancora oggi si vedono frammenti di statue, auto e moto d'epoca. L'Associazione Culturale Borbonica Sotterranea l'ha ripulita e la fa visitare con una guida.\n\nIl Percorso Standard dura circa un'ora e si può iniziare da due ingressi: via Domenico Morelli 61 e Vico del Grottone 4, a circa 100 metri da Piazza del Plebiscito. Ci sono anche percorsi più avventurosi.","con":"Prenota: la prenotazione è obbligatoria. Il tour standard parte alle 10, 12, 15 e 17 il venerdì, il sabato, la domenica e nei festivi. Si può fotografare.","acc":"","foto":{"u":"img/7d1481f1dbd9.jpg","alt":"Un tunnel scavato nel tufo nella Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Un tratto della Galleria Borbonica, scavata nel tufo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Percorso Standard: tour alle 10, 12, 15 e 17 (venerdì, sabato, domenica e festivi). Prenotazione obbligatoria, durata circa 1 ora. Ingressi: via Domenico Morelli 61 e Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"Il tunnel borbonico","x":"È la parte che racconta l'ambizione di Ferdinando II: un lungo passaggio in tufo giallo, progettato per collegare il Palazzo Reale con Piazza della Vittoria. Il tufo racconta anche il lavoro dei cavatori e l'ingegneria idraulica dell'epoca.","d":"Lungo il percorso principale","foto":{"u":"img/1dec7e77dfa5.jpg","alt":"Un passaggio scavato nel tufo nella Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"Il passaggio dei pozzari, un tratto della Galleria Borbonica scavato nel tufo."}},{"t":"Il rifugio antiaereo","x":"Tra il 1939 e il 1945 migliaia di persone si riparò qui dai bombardamenti. Restano letti, graffiti e oggetti di vita quotidiana dell'epoca. È la parte che colpisce di più chi visita.","d":"Nelle sale del rifugio","foto":{"u":"img/3200f06943d2.jpg","alt":"Il rifugio antiaereo nella Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"Il rifugio antiaereo della Seconda guerra mondiale."}},{"t":"Auto e moto d'epoca","x":"Nel dopoguerra la galleria fu usata come deposito giudiziario per veicoli sequestrati: ancora oggi si vedono auto e moto d'epoca lungo il percorso.","d":"Lungo il percorso","foto":{"u":"img/87eab52966bc.jpg","alt":"Auto d'epoca abbandonate nel tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Auto d'epoca lungo il tunnel: il dopoguerra, quando la galleria era un deposito giudiziario."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Lungomare e Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Il castello sull'isolotto dove sbarcarono i coloni greci venuti da Cuma: si arriva dal lungomare, si attraversa il ponte e si guarda il golfo dal Borgo Marinari.","rac":"Il castello sorge sull'isolotto di Megaride, fatto di due scogli uniti da un grande arco. Qui, a metà del VII secolo a.C., sbarcarono i coloni venuti da Cuma, che poi fondarono Partenope sul vicino Monte Echia.\n\nNel I secolo a.C. sull'isolotto e sul Monte Echia sorgeva la villa di Lucio Licinio Lucullo. Nella Sala delle Colonne ne restano dei resti: nell'alto Medioevo la sala fu il refettorio di uno dei conventi costruiti sull'isolotto.","con":"L'interno del castello è chiuso per lavori fino a nuovo avviso: oggi si visita da fuori, passeggiando sul lungomare e intorno al Borgo Marinari.","acc":"","foto":{"u":"img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Prenotazione facoltativa."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"L'isolotto di Megaride","x":"Dal lungomare guarda il castello: poggia sull'isolotto di Megaride, fatto di due scogli uniti da un grande arco. Qui, verso la metà del VII secolo a.C., sbarcarono i Cumani, di origine greca, che poi fondarono sul vicino Monte Echia la città di Partenope.\n\nNel I secolo a.C., in epoca romana, sull'isolotto e sul Monte Echia sorse la celebre villa di Lucio Licinio Lucullo; ne restano i rocchi di colonne della cosiddetta «Sala delle Colonne».\n\nIl nome viene da una leggenda: il poeta Virgilio avrebbe nascosto un uovo in una gabbia nei sotterranei, e dalla sua integrità dipenderebbe il destino del castello e di tutta Napoli. Quando, al tempo della regina Giovanna I, crollò l'arco tra i due scogli, la regina dovette dichiarare di aver sostituito l'uovo per calmare la città.","d":"Dal ponte che porta al Borgo Marinari","foto":{"u":"img/2fa4aa093660.jpg","alt":"Castel dell'Ovo e il porticciolo del Borgo Marinari visti dall'alto","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Dall'alto: il castello sullo scoglio e, accanto, il porticciolo del Borgo Marinari."}}],"gal":[{"u":"img/5fa7bf9a4065.jpg","alt":"Incisione del 1841 con Castel dell'Ovo e una barca a vela","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in un'incisione del 1841."}],"leg":"Il nome viene da una leggenda: il poeta Virgilio avrebbe nascosto un uovo, chiuso in una gabbia, nei sotterranei del castello.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Rione Sanità e Basilica di Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Un quartiere popolare rinato dal basso: la basilica del «Monacone», le catacombe, Totò e i murales.","rac":"Il Rione Sanità è uno dei quartieri più antichi e popolari di Napoli: per secoli è stato luogo di sepolture, ed è oggi un modello di rinascita nato dal basso, con cooperative di giovani che gestiscono catacombe e visite.\n\nAl centro c'è la basilica di Santa Maria della Sanità, costruita tra il 1602 e il 1610 su progetto di Fra Nuvolo, uno dei maggiori esempi del barocco napoletano. È detta San Vincenzo o «'o Munacone», dalla grande statua di san Vincenzo Ferrer che custodisce. La pianta è a croce greca e la cupola è rivestita di maioliche. Sotto la chiesa si trovano le catacombe di San Gaudioso, del IV secolo.\n\nNel rione nacque l'attore Totò, in via Santa Maria Antesaecula, ricordato da murales in tutto il quartiere. Qui è ambientata anche la commedia «Il sindaco del rione Sanità» di Eduardo De Filippo.","con":"Visita il rione di giorno e con calma: le catacombe, la basilica e il Cimitero delle Fontanelle sono vicini. Puoi unire il tutto al Miglio Sacro della domenica.","acc":"","foto":{"u":"img/1a0ac18fd711.jpg","alt":"La basilica di Santa Maria della Sanità, a cupola","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"La basilica di Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilica. Può chiudere in alcune date: controlla il sito."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"La basilica del Monacone","x":"La chiesa di Fra Nuvolo ha pianta a croce greca e una cupola rivestita di maioliche. Il presbiterio è rialzato e il barocco altare ha una doppia scala. La statua di san Vincenzo Ferrer, il «Monacone», dà il nome popolare alla basilica.","d":"In piazza Sanità","foto":{"u":"img/d7599dd94bbc.jpg","alt":"Il presbiterio rialzato con la doppia scala nella basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"Il presbiterio rialzato della basilica di Santa Maria della Sanità, con la doppia scala."}},{"t":"Le catacombe di San Gaudioso","x":"Sotto la basilica si trovano le catacombe di San Gaudioso, del IV secolo. Vi si accede dalla chiesa.","d":"Sotto la basilica","foto":{"u":"img/30e6de57bd17.jpg","alt":"Le catacombe di San Gaudioso sotto la basilica","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Le catacombe di San Gaudioso, sotto la basilica."}},{"t":"Totò e i murales","x":"Nelle vie vicine, e in via Santa Maria Antesaecula dove nacque Totò, murales e piccole immagini ricordano l'attore e le storie del rione.","d":"Nei vicoli attorno alla piazza","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacombe di San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Le catacombe più vaste del Sud Italia: gallerie nel tufo su due livelli e la tomba originaria di san Gennaro, patrono di Napoli.","rac":"Le Catacombe di San Gennaro si trovano nel Rione Sanità, con ingresso in via Capodimonte 13, accanto alla basilica del Buon Consiglio. L'origine risale al II secolo d.C., quando una ricca famiglia romana donò il proprio sepolcro alla comunità cristiana. Il complesso si sviluppa su due livelli, scavati nel tufo: San Gennaro superiore e San Gennaro inferiore.\n\nQui fu sepolto san Gennaro, e per secoli il luogo fu meta di pellegrinaggio. Fino al IX secolo le sue reliquie restarono qui; poi furono portate via e il sito fu abbandonato. Oggi si visita solo con una guida, per circa un'ora. Dal 2009 un impianto a LED, realizzato dalla cooperativa di giovani del rione Officina dei Talenti, illumina gli affreschi con una luce soffusa.\n\nIl sito è gestito dalla cooperativa sociale La Paranza, nata da giovani del Rione Sanità.","con":"Prenota in anticipo: le visite sono solo guidate, partono ogni ora e la prenotazione è obbligatoria. Il Miglio Sacro, un percorso guidato nel Rione Sanità, parte alle 9:30 il sabato, la domenica e i festivi. Le catacombe sono chiuse il mercoledì.","acc":"","foto":{"u":"img/0e69b61ea42f.jpg","alt":"Un affresco paleocristiano nelle Catacombe di San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Un affresco paleocristiano nelle Catacombe di San Gennaro."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Visite guidate ogni ora, prenotazione sempre obbligatoria. Chiuso il mercoledì e il 25 dicembre."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"La tomba di san Gennaro","x":"È la tomba che dà il nome a tutto il sistema di catacombe: qui fu sepolto il patrono di Napoli. Le sue reliquie vi restarono fino al IX secolo.","d":"Nel percorso guidato","foto":{"u":"img/fd273aee226d.jpg","alt":"La tomba di san Gennaro nelle catacombe","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"La tomba di san Gennaro, il luogo che dà il nome alle catacombe."}},{"t":"I due livelli","x":"Le gallerie sono scavate nel tufo su due piani, il superiore e l'inferiore, con grandi passaggi e affreschi paleocristiani.","d":"Lungo la visita guidata","foto":{"u":"img/537a160d9acb.jpg","alt":"Una galleria scavata nel tufo con le tombe nelle pareti","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Le gallerie delle catacombe, scavate nel tufo."}},{"t":"Il Miglio Sacro","x":"Il sabato, la domenica e i festivi un percorso guidato di circa tre ore tocca i luoghi legati a san Gennaro nel Rione Sanità. Parte alle 9:30 e va prenotato sul sito ufficiale.","d":"Dal punto di ritrovo delle catacombe","foto":{"u":"img/0becd922c42f.jpg","alt":"La facciata di un palazzo del Rione Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"Il Rione Sanità, dove il Miglio Sacro segue i luoghi legati a san Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Cimitero delle Fontanelle","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"Una cava di tufo grande come una cattedrale, migliaia di teschi senza nome e il culto delle anime pezzentelle. Riaperto nel 2026.","rac":"Nel Cinquecento era una cava di tufo, nella valle della Sanità. Durante la peste del 1656 vi furono portate molte vittime, poi quelle del colera del 1836-1837; nel 1872 il canonico Gaetano Barbati sistemò i resti in tre grandi navate. Lo spazio è di circa quattromila metri quadrati.\n\nQui nacque il culto delle anime pezzentelle: i devoti adottavano un teschio, una capuzzella, lo curavano e lo pregavano, aspettando in cambio protezione, a volte un sogno con i numeri del lotto. Nel 1969 un decreto del tribunale ecclesiastico chiuse l'ossario e vietò il culto. Chiuso per lavori dal 2020, ha riaperto al pubblico nel 2026, gestito dalla cooperativa La Paranza.","con":"È chiuso il mercoledì. Scarica l'app del cimitero prima di arrivare: dentro il segnale del telefono è debole.","acc":"","foto":{"u":"img/196eeb77c16a.jpg","alt":"Le grandi gallerie in tufo del Cimitero delle Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Le gallerie in tufo del Cimitero delle Fontanelle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Chiuso a Natale. Lunedì e venerdì 9–10 aperto solo per il culto"}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Una cava grande come una cattedrale","x":"Il cimitero occupa una vecchia cava di tufo di circa quattromila metri quadrati, sistemata in tre grandi navate nel 1872 dal canonico Gaetano Barbati. Vi furono portati i morti della peste del 1656 e del colera del 1836-1837.","d":"Nelle tre navate","foto":{"u":"img/1d00e1d52ca0.jpg","alt":"Una navata del Cimitero delle Fontanelle scavata nel tufo","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"Una delle tre navate del Cimitero delle Fontanelle, nella vecchia cava di tufo."}},{"t":"Il culto delle anime pezzentelle","x":"I devoti adottavano un teschio, la capuzzella, lo curavano e lo pregavano, aspettando in cambio protezione, a volte un sogno con i numeri del lotto. Nel 1969 il tribunale ecclesiastico vietò il culto e chiuse l'ossario.","d":"Davanti alle file di teschi","foto":{"u":"img/c27db73ea8b7.jpg","alt":"File di teschi con una croce","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Le capuzzelle: teschi senza nome, adottati e curati dai devoti."}},{"t":"Le Fontanelle al MADRE","x":"L'artista Rebecca Horn ha riprodotto in ghisa alcune capuzzelle delle Fontanelle nell'opera «Spirits», che si vede al museo MADRE: un modo per capire come il cimitero sia entrato anche nell'arte contemporanea.","d":"Al museo MADRE (scheda separata)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Certosa e Museo di San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Un monastero certosino diventato museo, sulla collina del Vomero: chiostro barocco, presepe Cuciniello e uno dei panorami più belli sul golfo.","rac":"La Certosa di San Martino sorge sulla collina del Vomero, accanto a Castel Sant'Elmo. Fu fondata nel 1325 da Carlo di Calabria, figlio del re Roberto d'Angiò, e affidata a Tino di Camaino. Tra il Cinquecento e il Settecento divenne uno dei più raffinati esempi di arte barocca italiana: dal 1623 al 1656 Cosimo Fanzago ne rinnovò gli ambienti. Dal 1866, dopo la soppressione degli ordini religiosi, ospita il Museo nazionale di San Martino, voluto da Giuseppe Fiorelli.\n\nIl Chiostro Grande, ampliato dal 1581 da Giovanni Antonio Dosio e completato da Fanzago, ha al centro il cimitero dei monaci. Il museo custodisce la principale raccolta pubblica italiana dedicata al presepe napoletano, con il grandioso Presepe Cuciniello: circa ottocento pastori, animali e accessori donati dal collezionista Michele Cuciniello, inaugurato nel 1879. Altre sezioni raccontano la marineria del Regno, il teatro, la città e il Regno nelle immagini e, dal dicembre 2025, l'Ottocento a Napoli. Qui si trova anche la Tavola Strozzi, considerata il primo dipinto di Napoli.","con":"Esci sulle terrazze e sulla Loggia del Priore: da qui si vede tutto il golfo. È aperta tutti i giorni tranne il martedì; l'ultimo ingresso è alle 17:30.","acc":"","foto":{"u":"img/c86a6db6ab67.jpg","alt":"Il chiostro grande della Certosa di San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"Il chiostro grande della Certosa di San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Chiuso il martedì. Alcune sezioni (navale, presepiale, Ottocento a Napoli) aprono alle 9:30; i giardini chiudono un'ora prima."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"Il Chiostro Grande","x":"Ampliato dal 1581 da Giovanni Antonio Dosio e completato da Cosimo Fanzago, ha al centro il cimitero dei monaci. Lungo il perimetro si vedono ancora le porte e i passavivande delle celle dei certosini.","d":"Nel cuore della Certosa","foto":{"u":"img/e43efae68626.jpg","alt":"Il Chiostro Grande della Certosa con il cimitero dei monaci","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"Il Chiostro Grande della Certosa di San Martino, con al centro il piccolo cimitero dei monaci."}},{"t":"Il Presepe Cuciniello","x":"Con circa ottocento pezzi è il presepe più famoso di Napoli. Fu donato da Michele Cuciniello e inaugurato nel 1879. Un impianto luminoso simula le ore del giorno.","d":"Nella sezione presepiale, dove erano le cucine","foto":{"u":"img/ae5327fcce50.jpg","alt":"Il grande presepe con centinaia di figure","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"Il Presepe Cuciniello, con circa ottocento pezzi."}},{"t":"La vista sul golfo","x":"Dalle terrazze e dai giardini della Certosa si vede tutto il golfo di Napoli, con il Vesuvio sullo sfondo.","d":"Sulle terrazze e nei giardini","foto":{"u":"img/81d0fb825e80.jpg","alt":"Il golfo di Napoli visto da un balcone della Certosa","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"Il golfo e il Vesuvio da un balcone della Certosa di San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant’Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La fortezza a stella sulla collina del Vomero: bastioni con vista a 360° su Napoli e sul golfo, e dentro il Museo Novecento.","rac":"Castel Sant'Elmo domina il Vomero a circa 250 metri sul livello del mare ed è visibile da quasi tutta la città. Le prime notizie lo indicano, intorno al 1275, come una residenza fortificata angioina chiamata Belforte; nel 1329 Roberto d'Angiò ne volle l'ampliamento, affidato a Tino di Camaino. La pianta a stella a sei punte è invece il risultato della ricostruzione cinquecentesca voluta tra il 1537 e il 1547 dal viceré Pedro de Toledo, su progetto dell'architetto militare Pedro Luis Escrivà.\n\nNel corso dei secoli fu spesso un carcere: vi furono rinchiusi Tommaso Campanella e, più tardi, patrioti della Repubblica napoletana del 1799 come Gennaro Serra, Mario Pagano e Luisa Sanfelice. Dopo essere stato presidio borbonico fu carcere militare fino al 1952; un grande restauro è iniziato nel 1976.\n\nSulla piazza d'armi, dal 2010, c'è il Museo Novecento a Napoli: oltre 170 opere di circa 90 artisti napoletani o attivi in città tra il 1910 e il 1980. Alcune opere sono state create apposta per il castello: nella grande cisterna Gian Maria Tosatti ha fatto crescere un campo di grano, e sugli spalti si staglia la scultura in alluminio «Sant'Elmo» di Mimmo Paladino.\n\nDai bastioni il panorama arriva dalle isole al Vesuvio, dai Campi Flegrei ai monti del Matese.","con":"Sali verso il tramonto per il panorama. Il castello è accanto alla Certosa di San Martino: si possono visitare nella stessa mattinata. Il castello è chiuso il martedì e, con il maltempo, può restare chiuso.","acc":"","foto":{"u":"img/602a2b4c5ba8.jpg","alt":"Le alte mura in tufo di Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Le mura di Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castello 8:30-19:30; Museo Novecento 9:30-18:30 (ultimo ingresso 17:30). Chiuso il martedì. Con maltempo il sito può restare chiuso."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"I bastioni e il panorama","x":"I bastioni offrono un panorama a 360° sulla città, sul golfo, sul Vesuvio e sulla costa di Posillipo, tra i più completi di Napoli.","d":"Sugli spalti","foto":{"u":"img/81edfbd30506.jpg","alt":"Napoli e il Vesuvio visti dall'alto di Castel Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Dai bastioni di Castel Sant'Elmo: la città, il porto e il Vesuvio."}},{"t":"Il Museo Novecento a Napoli","x":"Aperto nel 2010 sulla piazza d'armi, raccoglie oltre 170 opere di circa 90 artisti napoletani o attivi in città, realizzate dal 1910 in poi: dal Futurismo alla Transavanguardia degli anni Ottanta.","d":"Sulla piazza d'armi del castello","foto":{"u":"img/d585126c2db4.jpg","alt":"Una sala del Museo Novecento con opere d'arte","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Una sala 9,40.8427],[14.2489,40.84277],[14.24891,40.84281],[14.24894,40.84307],[14.24894,40.8431],[14.24899,40.84349],[14.249,40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true,"pr":{"x":"Prima di partire, fai colazione da noi: un caffè e una sfogliatella.","v":[{"v":177,"n":"Espresso (Kimbo, Miscela Extreme)","p":250,"foto":{"u":"img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}},{"v":110,"n":"Sfogliatella Riccia","p":300,"foto":{"u":"img/bd4714cc3e5b.webp","alt":"Sfogliatella Riccia"}}],"l":[]},"fi":{"x":"","v":[{"v":83,"n":"Caffè Ceraldi","p":500,"foto":{"u":"img/7bef03b87815.webp","alt":"Caffè Ceraldi"}},{"v":356,"n":"Aspritz","p":800,"foto":{"u":"img/a3e1bd8ea3d9.webp","alt":"Aspritz"}}],"l":[]}}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"La storia di Napoli","sub":"Dalla sirena Partenope a oggi, in tredici capitoli","som":"Prima di partire, ventotto secoli in dieci minuti: la leggenda della sirena, i Greci, Roma, i re, la rivolta, la guerra e la città di oggi.","txt":"Napoli è una delle città più antiche d'Europa: la sua storia si estende per circa tremila anni, e il centro storico che stai per attraversare conserva ancora la pianta delle strade disegnata dai Greci. Per oltre mezzo millennio è stata la capitale dell'Italia del Sud.\n\nQuesti tredici capitoli ti accompagnano dalla leggenda alla città di oggi. Ogni volta che il racconto incontra un luogo della guida, trovi un pulsante per andarci.","foto":{"u":"img/5fa7bf9a4065.jpg","alt":"Castel dell'Ovo in una veduta del 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in una veduta del 1841: l'isolotto dove nacque Partenope."},"cap":[{"p":"La leggenda","t":"La sirena Partenope","x":"Tutto comincia con una sirena. Nel mito greco le sirene erano creature con il corpo di uccello e la testa di donna, padrone di un canto magico. Una di loro si chiamava Partenope.\n\nIl racconto più famoso dice che, quando Ulisse passò davanti al loro scoglio senza cedere al canto, le sirene per il dolore si gettarono in mare. Le onde portarono il corpo di Partenope sulla costa, alla foce di un piccolo fiume, il Sebeto: proprio dove sarebbe nata la città.\n\nLì le fu costruita una tomba e i Greci di Napoli le dedicavano ogni anno sacrifici e una corsa con le fiaccole. Ancora oggi i napoletani si chiamano «partenopei».","l":null,"foto":{"u":"img/2785ce7243de.jpg","alt":"La fontana con la sirena Partenope in piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"La fontana della Sirena in piazza Sannazaro: Partenope con la lira."}},{"p":"VIII–VII secolo a.C.","t":"Partenope, la prima città","x":"La leggenda ha un fondo di verità. Tra l'VIII e il VII secolo a.C. i Greci di Cuma, la più antica colonia greca della zona, fondarono un piccolo scalo sul mare e lo chiamarono come la sirena: Partenope.\n\nSorgeva sulla collina di Pizzofalcone, il Monte Echia, su uno sperone circondato dal mare, e aveva il suo approdo sull'isolotto di Megaride, dove oggi c'è Castel dell'Ovo. Il porto era nell'attuale piazza Municipio. La necropoli di Partenope è stata scoperta nel 1949 in via Nicotera.\n\nLa piccola città crebbe così in fretta che Cuma, per paura di perdere il comando, ne ridusse il ruolo.","l":32,"foto":{"u":"img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."}},{"p":"V secolo a.C.","t":"Neapolis, la città nuova","x":"Accanto a Partenope, poco più a est, i Cumani fondarono una città nuova: Neapolis, la «città nuova». L'UNESCO data la fondazione al 470 a.C. circa, nel periodo in cui i Greci avevano sconfitto gli Etruschi sul mare.\n\nNeapolis fu costruita secondo un disegno regolare: tre strade principali parallele (le «plateiai», poi chiamate decumani), incrociate ad angolo retto da strade più piccole. L'agorà, la piazza principale, era dov'è oggi piazza San Gaetano.\n\nQuel reticolo è ancora lì: Spaccanapoli, via dei Tribunali e via Anticaglia sono le tre strade greche. Camminandoci, cammini nella pianta della città di 2.500 anni fa.","l":38,"foto":{"u":"img/8bcba9e208ec.jpg","alt":"I grandi blocchi di tufo delle mura greche, scavate sotto il livello della strada","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"I blocchi di tufo delle mura greche di Neapolis, in piazza Bellini, visibili in uno scavo sotto il livello della strada."}},{"p":"326 a.C. – V secolo d.C.","t":"Greca sotto Roma","x":"Nel 326 a.C. Neapolis si alleò con Roma e restò per secoli una città greca dentro il mondo romano: fu tra le poche a conservare la lingua e la cultura greca. Diventò un luogo amato dai Romani colti e ricchi, che costruivano ville sul golfo: sull'isolotto di Megaride sorse quella di Lucio Licinio Lucullo.\n\nNel 79 d.C. l'eruzione del Vesuvio distrusse Pompei ed Ercolano, poco lontano. Nel 476, proprio nella villa di Lucullo, fortificata, fu rinchiuso Romolo Augusto, l'ultimo imperatore romano d'Occidente: con lui finiva l'Impero.\n\nSotto la città greco-romana scorreva già l'acqua delle cisterne che oggi visiti a Napoli Sotterranea, e nel teatro di Neapolis si esibì l'imperatore Nerone.","l":15,"foto":{"u":"img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."}},{"p":"VI–XII secolo","t":"Il ducato di Napoli","x":"Dopo la fine dell'Impero, nel VI secolo, Napoli passò ai Bizantini, i Romani d'Oriente. Poco a poco diventò un ducato quasi indipendente: nell'VIII secolo il duca Stefano II se ne fece signore di fatto.\n\nPer cinque secoli il ducato resistette a Longobardi e Saraceni. Nel 1030 il duca Sergio IV diede la contea di Aversa a un gruppo di mercenari normanni: fu l'inizio della loro ascesa nel Sud. Nel 1137 Napoli si sottomise ai Normanni ed entrò nel nuovo Regno di Sicilia.\n\nDi quegli anni lontani restano le chiese più antiche, come Santa Restituta e il battistero di San Giovanni in Fonte dentro il Duomo, considerato il più antico d'Occidente.","l":18,"foto":{"u":"img/5abf53aec271.jpg","alt":"L'interno della basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, la basilica paleocristiana inglobata nel Duomo: la Napoli prima del ducato."}},{"p":"1194–1266","t":"Normanni e Svevi: nasce l'Università","x":"Dopo i Normanni arrivarono gli Svevi. Nel 1194 l'imperatore Enrico VI occupò la città e ne fece abbattere le mura.\n\nSuo figlio, Federico II, era un sovrano appassionato di cultura e di diritto. Nel 1224 fondò a Napoli lo «Studio», una delle prime università statali d'Europa: è l'attuale Università Federico II, che porta ancora il suo nome.","l":null,"foto":{"u":"img/ee9a50cab016.jpg","alt":"La statua di Federico II di Svevia nella facciata del Palazzo Reale","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statua di Federico II di Svevia, tra quelle della facciata del Palazzo Reale."}},{"p":"1266–1442","t":"Gli Angioini: Napoli capitale","x":"Nel 1266 il papa affidò il regno a Carlo I d'Angiò, fratello del re di Francia, che entrò in città in trionfo. Dopo la rivolta dei Vespri siciliani del 1282, la Sicilia si staccò e Napoli diventò la capitale del regno: lo resterà per secoli.\n\nGli Angioini costruirono il Castel Nuovo, il Duomo (dal 1294) e la cittadella di Santa Chiara (dal 1310), e la città si allargò. Alla corte di Roberto d'Angiò, nel Castel Nuovo, soggiornarono Giotto, Petrarca e Boccaccio.","l":9,"foto":{"u":"img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."}},{"p":"1442–1503","t":"Gli Aragonesi","x":"Nel 1442 Alfonso d'Aragona conquistò Napoli: secondo la tradizione i suoi uomini entrarono in città passando per un acquedotto. Fece del Castel Nuovo la sua reggia, lo ricostruì e per celebrare la vittoria vi aggiunse il grande Arco di Trionfo tra due torri.\n\nGli Aragonesi trasformarono il castello medievale in una fortezza moderna e rinnovarono le difese e le strade della città. Il figlio Ferrante sconfisse i baroni ribelli: la porta di bronzo del castello racconta quella guerra, e nella Sala dei Baroni si consumò la sua vendetta.","l":30,"foto":{"u":"img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi: Napoli aragonese vista dal mare, con il Maschio Angioino e Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (XV secolo): Napoli vista dal mare, con il porto, il Castel Nuovo e, in alto, il colle di Sant'Elmo."}},{"p":"1503–1707","t":"Il viceregno spagnolo","x":"Dal 1503 Napoli passò alla Spagna e fu governata da un viceré. Senza un re presente, era comunque una capitale imperiale, con una delle corti più grandiose dei domini spagnoli. Il viceré don Pedro di Toledo raddoppiò la città, aprì via Toledo e costruì i quartieri per i soldati, i Quartieri Spagnoli. In questi anni fu costruito anche il Palazzo Reale.\n\nNel 1606 arrivò a Napoli, in fuga da Roma, Caravaggio: la sua pittura cambiò l'arte della città, che nel Seicento diventò una delle capitali del barocco europeo.\n\nFurono anche anni durissimi: tasse altissime, l'eruzione del Vesuvio del 1631 e, nel 1656, una peste che uccise più della metà degli abitanti.","l":45,"foto":{"u":"img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste del 1656: corpi ammassati nella piazza e figure celesti in cielo","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste del 1656, dipinto da Micco Spadaro: la piazza è piena di morti e di moribondi."}},{"p":"1647","t":"Masaniello","x":"Il 7 luglio 1647, dopo l'ennesima tassa, questa volta sulla frutta, il cibo dei più poveri, un pescatore di 27 anni, Masaniello, guidò il popolo in rivolta al grido di «Viva il re di Spagna, mora il malgoverno».\n\nIn dieci giorni gli spagnoli dovettero accettare le richieste del popolo. Ma Masaniello, accusato di pazzia e tradito da una parte degli stessi rivoltosi, fu assassinato. La rivolta continuò per mesi contro la Spagna, prima di essere domata nel 1648.","l":null,"foto":{"u":"img/dd3b68152a7d.jpg","alt":"Un dipinto del Seicento con la folla in rivolta in piazza Mercato","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Piazza del Mercato durante la rivolta di Masaniello, dipinto di Domenico Gargiulo detto Micco Spadaro."}},{"p":"1734–1799","t":"I Borbone e la Repubblica","x":"Nel 1734 Carlo di Borbone riportò a Napoli un re tutto suo e volle farne una grande capitale europea. Nel 1737 fece costruire in soli sette mesi il Teatro di San Carlo; poi le regge di Portici e di Capodimonte. In quegli anni cominciarono anche gli scavi di Ercolano e di Pompei.\n\nNapoli era una delle capitali dell'Illuminismo. Nel gennaio 1799, con l'arrivo dell'esercito francese, i patrioti proclamarono la Repubblica Napoletana: durò solo fino a giugno. Al ritorno dei Borbone molti dei suoi protagonisti furono giustiziati.\n\nDopo gli anni dei Francesi (Giuseppe Bonaparte e Gioacchino Murat), nel 1815 tornarono i Borbone, e nel 1816 nacque il Regno delle Due Sicilie.","l":null,"foto":{"u":"img/7650d4034f8f.jpg","alt":"Ritratto di Carlo di Borbone in armatura","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Carlo di Borbone ritratto da Anton Raphael Mengs."}},{"p":"1860–1945","t":"L'Italia unita e la guerra","x":"Il 7 settembre 1860 Giuseppe Garibaldi entrò a Napoli acclamato dalla folla; un plebiscito sancì l'unione al Regno d'Italia. Napoli smise di essere una capitale, e la perdita fu pesante.\n\nNella Seconda guerra mondiale la città subì più di 120 bombardamenti aerei, soprattutto per il suo porto; la gente si rifugiava nelle cisterne sotterranee. Dopo l'armistizio, i tedeschi occuparono la città. Alla fine di settembre 1943 i napoletani insorsero: nelle «Quattro giornate di Napoli» il popolo costrinse alla resa il presidio tedesco. Il 1° ottobre arrivarono gli Alleati.","l":15,"foto":{"u":"img/5ded47a7684b.jpg","alt":"Un'incisione d'epoca: Garibaldi acclamato dalla folla a Napoli","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Incisione d'epoca dell'ingresso di Garibaldi a Napoli, nel 1860: la folla lo acclama in via Toledo."}},{"p":"Dal 1945 a oggi","t":"La Napoli di oggi","x":"Dopo la guerra la città si ricostruì tra grandi difficoltà. Nel 1995 il centro storico è stato iscritto dall'UNESCO tra i Patrimoni dell'Umanità: è il più grande d'Italia e uno dei più vasti d'Europa.\n\nDal 2001 la metropolitana ha aperto le sue «stazioni dell'arte», con opere di artisti contemporanei. La città conta circa 950.000 abitanti, più di tre milioni con l'area metropolitana.\n\nE poi c'è la Napoli che vedrai camminando: i murales, come quello di Maradona nei Quartieri Spagnoli, e la Madonna di Banksy, la vita dei vicoli, il caffè. Tremila anni di storia, uno sopra l'altro, in pochi chilometri.","l":44,"foto":{"u":"img/c9bd165a6d1a.jpg","alt":"Il centro storico di Napoli visto dall'alto","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Il centro storico visto dall'alto: dal 1995 Patrimonio dell'Umanità UNESCO."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio a Napoli","sub":"Un pittore in fuga e tre capolavori da vedere","som":"In fuga da Roma, Caravaggio trovò rifugio a Napoli due volte. Qui dipinse le Sette opere di Misericordia, la Flagellazione e il suo ultimo quadro.","txt":"Michelangelo Merisi, detto Caravaggio, era a Roma un pittore famoso e discusso. Negli ultimi giorni di maggio del 1606 ferì a morte Ranuccio Tomassoni in una rissa nata durante una partita a racchetta: condannato, dovette fuggire.\n\nNapoli, allora una delle città più grandi d'Europa, fu il suo rifugio due volte: dall'autunno 1606 all'estate 1607, e poi dall'autunno 1609 all'estate 1610. Qui trovò la protezione della famiglia Colonna e committenti ricchi, e qui la sua pittura cambiò per sempre l'arte della città.\n\nTre delle sue opere si possono vedere oggi a Napoli, due delle quali sul nostro percorso.","foto":{"u":"img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia, dipinte da Caravaggio a Napoli."},"cap":[{"p":"1606–1607","t":"Il primo soggiorno e le Sette opere","x":"Il primo incarico napoletano documentato è dell'ottobre 1606. Pochi mesi dopo, entro il 9 gennaio 1607, Caravaggio consegnò al Pio Monte della Misericordia la grande tela delle Sette opere di Misericordia, pagata 400 ducati.\n\nÈ ancora lì, sull'altare per cui fu dipinta, in via dei Tribunali: una notte in un vicolo di Napoli, dove gli uomini si aiutano tra loro sotto lo sguardo della Madonna.","l":17,"foto":{"u":"img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"p":"1607","t":"La Flagellazione","x":"Per la famiglia de Franchis, giuristi e magistrati, Caravaggio dipinse nel 1607 la Flagellazione di Cristo, per la loro cappella nella chiesa di San Domenico Maggiore: una tela alta quasi tre metri, uno dei capolavori del barocco napoletano.\n\nOggi l'originale è al Museo di Capodimonte, dove fu trasferito per motivi di sicurezza; in San Domenico Maggiore è rimasta una copia. Capodimonte è fuori dai nostri giri a piedi.","l":null,"foto":{"u":"img/286a53bb4961.jpg","alt":"La Flagellazione di Cristo di Caravaggio: Gesù legato alla colonna tra i carnefici","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellazione di Cristo (1607), oggi al Museo di Capodimonte: la luce cade sul corpo di Gesù, legato alla colonna."}},{"p":"1607–1609","t":"Malta e la Sicilia","x":"Il 12-13 luglio 1607 Caravaggio arrivò a Malta, probabilmente su una galea dei Cavalieri partita da Napoli. Ma anche lì finì nei guai: dopo una rissa fu arrestato nell'agosto 1608, fuggì dal forte in cui era rinchiuso e riparò in Sicilia, a Siracusa.","l":null,"foto":{"u":"img/ce578eb1c957.jpg","alt":"La Decollazione di san Giovanni Battista di Caravaggio","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"La Decollazione di san Giovanni Battista, dipinta da Caravaggio a Malta e conservata a La Valletta."}},{"p":"Ottobre 1609","t":"L'agguato del Cerriglio","x":"Nell'autunno 1609 tornò a Napoli, ancora sotto la protezione dei Colonna, sperando nel perdono del papa per poter rientrare a Roma.\n\nIn ottobre fu aggredito da quattro uomini davanti all'osteria del Cerriglio, una locanda famosa del tempo, e sfregiato al volto: la ferita fu così grave che a Roma si sparse la voce della sua morte.","l":null,"foto":{"u":"img/6aebce1517e8.jpg","alt":"Ritratto a gessetto di Caravaggio","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio nel ritratto di Ottavio Leoni, il volto dell'uomo aggredito al Cerriglio."}},{"p":"1610","t":"L'ultimo quadro","x":"Nella primavera del 1610 dipinse per il principe genovese Marcantonio Doria il Martirio di sant'Orsola: la tela fu finita in maggio, consegnata ancora fresca di vernice e spedita a Genova. È il quadro più tardo di Caravaggio che conosciamo, e si vede oggi alle Gallerie d'Italia in via Toledo, a sei minuti da Ceraldi. Tra i volti, alle spalle della santa, c'è il suo.\n\nNell'estate partì in barca verso Roma con alcuni quadri, sperando nel perdono. Fu arrestato per errore a Palo, e la barca ripartì con i dipinti. Morì a Porto Ercole il 18 luglio 1610 (o forse il giorno dopo), a 38 anni.","l":45,"foto":{"u":"img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Napoli in cinque minuti: dalla sirena alla città nuova","sub":"","som":"Prima Partenope, poi Neapolis: perché il centro storico è ancora disegnato come una città greca.","txt":"Napoli nasce due volte. La prima volta si chiama Partenope, come la sirena del mito: la fondano nel VII secolo avanti Cristo coloni di origine greca venuti da Cuma, che approdano sull'isolotto di Megaride, dove oggi sorge Castel dell'Ovo, e si stabiliscono sul vicino Monte Echia.\n\nLa seconda volta, intorno al 470 avanti Cristo, accanto alla città vecchia ne sorge una nuova: Neapolis, «città nuova» in greco. È questa che state attraversando. Le sue strade formano una griglia regolare che, dopo venticinque secoli, si legge ancora: il centro storico di Napoli è patrimonio mondiale dell'UNESCO proprio perché il disegno della città greca è rimasto la sua ossatura.\n\nTre strade parallele, i decumani, tagliano la città da ovest a est. Quella più in basso è Spaccanapoli: lunga circa due chilometri, così dritta che vista dall'alto sembra dividere la città in due, da cui il nome. Al centro corre via dei Tribunali, il decumano maggiore; più in alto via dell'Anticaglia e via della Sapienza, il decumano superiore.\n\nDa Piazza Carità, dove siamo noi dal 2002, Spaccanapoli comincia a pochi minuti a piedi, in piazza del Gesù Nuovo.","foto":{"u":"img/c9bd165a6d1a.jpg","alt":"Il centro storico di Napoli visto dall'alto","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Il centro storico dall'alto: le strade dritte sono ancora quelle della città greca."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro e il sangue che si scioglie","sub":"","som":"Tre volte l'anno Napoli trattiene il fiato davanti a un'ampolla. Cosa succede, dove, e cosa ne dicono Chiesa e scienza.","txt":"Nel Duomo di Napoli, in una nicchia della Cappella del Tesoro, è custodita un'ampolla con una sostanza scura che la tradizione indica come il sangue di San Gennaro, patrono della città. Tre volte l'anno, il sabato che precede la prima domenica di maggio, il 19 settembre (giorno della festa) e il 16 dicembre, l'ampolla viene mostrata ai fedeli: se il contenuto, di solito solido, si scioglie, è festa; se resta solido, per molti napoletani è un cattivo presagio.\n\nLa prima notizia conosciuta della liquefazione risale al 1389. A custodire le reliquie non è il clero ma la Deputazione della Cappella del Tesoro di San Gennaro, un'istituzione laica nata nel 1601, di cui fa parte anche il sindaco di Napoli.\n\nLa Chiesa mantiene un atteggiamento prudente: parla di «fatto prodigioso», ne consente la devozione popolare ma non lo impone come verità di fede. Tra le spiegazioni proposte dagli scettici c'è la tissotropia, la proprietà di alcune sostanze che sono solide a riposo e diventano liquide se mosse o scosse.\n\nSacro e profano, qui, convivono da sempre: in via Duomo, a pochi passi dalla cattedrale, lo street artist Jorit ha dipinto un San Gennaro con il volto di un operaio.","foto":{"u":"img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro di San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"La Cappella del Tesoro di San Gennaro nel Duomo, dove si custodisce l'ampolla."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Napoli in sette tradizioni: dal panaro al miracolo di San Gennaro","x":"","it":false}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Le anime pezzentelle: quando Napoli adottava un teschio","sub":"","som":"Ossari, capuzzelle e preghiere scambiate con i numeri del lotto: il culto dei morti senza nome.","txt":"Per secoli, a Napoli, i morti senza nome non sono rimasti soli. Li chiamavano anime pezzentelle: le anime povere, morte senza funerale e senza nessuno a pregare per loro. Il nome si lega a «pezzente», il povero, ma anche al latino «petere», chiedere per ricevere: chi pregava per loro sperava di ricevere in cambio protezione e grazie.\n\nIl luogo simbolo è il Cimitero delle Fontanelle, nel Rione Sanità: una cava di tufo del Cinquecento, di circa quattromila metri quadrati, che accolse le vittime della peste del 1656 e poi quelle del colera del 1836-1837. Nel 1872 il canonico Gaetano Barbati sistemò le ossa in tre navate. I devoti «adottavano» un teschio, una capuzzella: lo pulivano, lo mettevano in una piccola teca, lo ornavano di rosari e monete e lo pregavano, aspettando un segno in sogno, a volte un numero da giocare al lotto. Alcuni teschi diventarono famosi: il Capitano, con un'orbita annerita, protagonista di una leggenda di nozze e gelosia; donna Concetta, che si dice «sudi» quando la grazia è concessa.\n\nNel 1969 un decreto del tribunale ecclesiastico chiuse l'ossario e vietò il culto. Chiuso per lavori dal 2020, il cimitero ha riaperto al pubblico nel 2026, gestito dalla cooperativa La Paranza.\n\nIl culto vive anche sotto via dei Tribunali, nell'ipogeo di Santa Maria delle Anime del Purgatorio ad Arco, la chiesa che i napoletani chiamano «'e cape 'e morte»: lì è custodito il teschio di Lucia, un'anima giovane particolarmente amata. E in via San Biagio dei Librai, nella piccola chiesa di Santa Luciella, c'è un teschio unico: quello con le orecchie.","foto":{"u":"img/8110a7061c73.jpg","alt":"Teschi delle anime pezzentelle","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Le capuzzelle delle anime pezzentelle."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Napoli esoterica: un principe alchimista, una facciata in codice e un uovo magico","sub":"","som":"Raimondo di Sangro, il bugnato del Gesù Nuovo, l'uovo di Virgilio, il munaciello: dove finisce la storia e comincia la leggenda.","txt":"Napoli ama i misteri, e ne ha di bellissimi. Il più celebre ha un nome: Raimondo di Sangro, principe di Sansevero, uomo del Settecento, Gran Maestro della Massoneria napoletana, inventore geloso dei propri segreti. Il mito lo accompagnava già in vita, e fu lui stesso ad alimentarlo. Benedetto Croce lo definì l'incarnazione napoletana del dottor Faust. La leggenda nera gli attribuisce di tutto: servi uccisi per studiarne i corpi, persino l'accecamento dello scultore del Cristo velato perché non ne scolpisse un altro. Sono leggende, e lo stesso museo le distingue dalla storia documentata.\n\nIl Cristo velato è opera di Giuseppe Sanmartino, su commissione del principe: il velo trasparente che copre il corpo è scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea della cappella si trovano le «macchine anatomiche», due scheletri con il sistema circolatorio ricostruito, realizzate dal medico palermitano Giuseppe Salerno intorno al 1756-1764: la leggenda parla di iniezioni misteriose, gli studi di cera d'api e coloranti.\n\nPoco lontano, la facciata del Gesù Nuovo, nata come palazzo dei Sanseverino nel 1470, è coperta da un bugnato a punta di piramide in piperno scuro. Su alcune pietre si vedono segni incisi: per la leggenda un messaggio segreto; per alcuni studiosi i marchi dei tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali, uno spartito di circa tre quarti d'ora chiamato «Enigma». Un'ipotesi suggestiva, non una certezza.\n\nE poi c'è il mare: secondo la leggenda il poeta Virgilio nascose nei sotterranei di Castel dell'Ovo l'uovo della sirena Partenope. Finché l'uovo resta intatto, il castello resta in piedi.\n\nNelle case, invece, abitano gli spiriti della tradizione popolare: il munaciello, folletto incappucciato che porta fortuna o dispetti a seconda di come lo tratti, e la bella 'mbriana, spirito buono della casa, che può apparire come una farfalla o un geco.","foto":{"u":"img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo a punte di diamante","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante del Gesù Nuovo, la «facciata in codice»."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Napoli oggi: cosa c'è di nuovo","sub":"","som":"Il largo dedicato a Maradona, la street art, l'ultimo Caravaggio in via Toledo, chiese e ossari riaperti: la città che cambia.","txt":"Chi torna a Napoli dopo qualche anno trova una città che ha imparato a raccontarsi.\n\nNei Quartieri Spagnoli, a nove minuti da noi, c'è Largo Maradona. Il murale di Diego fu dipinto nel 1990 da Mario Filardi; negli anni sbiadì fino quasi a scomparire, poi fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, è diventato un santuario laico di altarini, bandiere argentine e fotografie, tanto visitato che il Comune ha dovuto organizzare il flusso dei pedoni.\n\nLa street art è entrata nel centro storico: in piazzetta dei Girolamini, protetta da un vetro, c'è la Madonna con la pistola di Banksy; in via Duomo il San Gennaro operaio di Jorit. Il portale turistico ufficiale della città dedica loro un itinerario.\n\nIn via Toledo, a sei minuti da noi, le Gallerie d'Italia custodiscono il Martirio di sant'Orsola, l'ultima tela dipinta da Caravaggio, insieme a oltre cinquecento vasi attici e della Magna Grecia.\n\nE riaprono luoghi rimasti chiusi a lungo: la chiesa di Santa Luciella ai Librai, abbandonata per più di trent'anni, è tornata visitabile il 5 aprile 2019; il Cimitero delle Fontanelle ha riaperto nel 2026.","foto":{"u":"img/a2c6b2a82ec4.jpg","alt":"Il murale di Maradona nei Quartieri Spagnoli","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, uno dei volti della N   if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(r.ap ? T.prima_di_partire : T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.sub ? '<p class="piccolo">' + e(r.sub) + '</p>' : '') + (r.foto ? '<div class="galleria uno">' + figura(r.foto) + '</div>' : '') + '<div class="testo">' + par(r.txt) + '</div>';
  if(r.cap.length){
    h += '<nav class="indice" aria-label="' + e(T.indice) + '"><b style="font-weight:500">' + e(T.indice) + '</b><ol>' + r.cap.map(function(c, n){ return '<li><button onclick="document.getElementById(\'cap-' + n + '\').scrollIntoView({behavior:\'smooth\'})">' + (c.p ? '<span class="per">' + e(c.p) + '</span>' : '') + '<span>' + e(c.t) + '</span></button></li>'; }).join('') + '</ol></nav>';
    h += r.cap.map(function(c, n){ var l = c.l && LU[c.l];
      return '<section class="capitolo" id="cap-' + n + '">' + (c.p ? '<span class="etichetta">' + e(c.p) + '</span>' : '') + '<h2>' + e(c.t) + '</h2>' +
        (c.foto ? '<figure><div class="ft"><img src="' + e(c.foto.u) + '" alt="' + e(c.foto.alt) + '" loading="lazy"></div><figcaption>' + (c.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(c.foto.dida) + '</span>' : '') + '<span class="cr">' + e(c.foto.aut) + ' · ' + e(c.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="testo">' + par(c.x) + '</div>' + (l ? '<a class="btn sec" href="#/l/' + e(l.s) + '">' + e(f(T.lo_vedi, {n: l.n})) + ' →</a>' : '') + '</section>'; }).join('');
  }
  return h + assaggio(r.col, T.da_ceraldi_et) + daLeggere(r.col) + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
