ù importanti dell'arte paleocristiana a Napoli. Ha tre navate e ospita opere di Luca Giordano e sculture del Trecento.\n\nDa qui si scende all'area archeologica sotto la cattedrale, dove si vedono strati di storia uno sopra l'altro: resti greco-romani e paleocristiani.","d":"Nella navata sinistra","foto":{"u":"img/5abf53aec271.jpg","alt":"Un mosaico con la Madonna in trono nella basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico con la Madonna in trono, dentro Santa Restituta: la basilica più antica, conservata come cappella del Duomo."}},{"t":"Il battistero di San Giovanni in Fonte","x":"A destra dell'abside, un piccolo ambiente con una storia immensa: il Battistero di San Giovanni in Fonte, considerato il più antico d'Occidente.\n\nFermati qualche minuto in silenzio: sei in uno dei luoghi cristiani più antichi d'Europa ancora in piedi, dai tempi in cui la Napoli romana diventava cristiana.\n\nIl battistero e l'area archeologica sotto il Duomo raccontano insieme i primi secoli della città cristiana.","d":"A destra dell'abside","foto":{"u":"img/994ed22c6902.jpg","alt":"L'interno del Battistero di San Giovanni in Fonte con la vasca battesimale al centro","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Il Battistero di San Giovanni in Fonte: al centro del pavimento, la vasca battesimale."}},{"t":"Il Succorpo","x":"Sotto l'altare maggiore c'è la cripta del Duomo, la Cappella del Succorpo, detta anche Cappella Carafa: la volle il cardinale Oliviero Carafa per custodirvi le reliquie di San Gennaro insieme a quelle di altri 51 santi.\n\nL'architetto Giovan Tommaso Malvito la pensò come una piccola basilica: tre navate divise da colonne antiche con capitelli ionici, nicchie ai lati e una cappella in fondo.\n\nMarmi bianchi, luce tenue e silenzio: è il Rinascimento dentro la cattedrale gotica.","d":"Sotto l'altare maggiore","foto":{"u":"img/876cd614ab8d.jpg","alt":"L'interno del Succorpo di San Gennaro con colonne di marmo e pavimento a intarsi","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Il Succorpo, sotto il presbiterio del Duomo: colonne e pavimento di marmo, e in fondo l'altare con le reliquie di San Gennaro."}}],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"La Madonna con la pistola di Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Madonna di Banksy con una pistola al posto dell'aureola, protetta da un vetro, nel cuore del decumano maggiore.","rac":"Banksy arrivò a Napoli nel 2010: era la prima volta che lavorava in Italia. Con gli stencil, probabilmente nella stessa notte, lasciò due opere in punti molto frequentati del centro, entrambe con un'immagine religiosa e un messaggio diretto. Una, in via Benedetto Croce, è stata coperta da un altro artista; questa è sopravvissuta, ed è per questo indicata come l'unico murale di Banksy in Italia.\n\nAccanto all'opera c'è un'antica edicola votiva con la Madonna col Bambino: le due immagini, vicine, sembrano parlarsi.\n\nIn piazzetta dei Girolamini, su una facciata del decumano maggiore, Banksy ha lasciato una Madonna con una pistola al posto dell'aureola. Oggi è protetta da un vetro. Il portale turistico ufficiale della città la include nel suo itinerario dedicato alla street art del centro storico.","con":"Alza gli occhi: l'opera è sopra il livello della strada, dietro un vetro.","acc":"","foto":{"u":"img/f88e2da6bb84.jpg","alt":"Il volto della Madonna di Banksy in stencil bianco su fondo scuro","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Il volto della Madonna di Banksy: lo stencil bianco su fondo scuro, da vicino."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Madonna con la pistola","x":"Guarda il muro: bianco su fondo nero, fatto con lo stencil, una Madonna con le braccia aperte verso il cielo. Ma al posto dell'aureola, sopra la sua testa, c'è una pistola.\n\nBanksy, l'artista di strada inglese di Bristol, la dipinse a Napoli nel 2010, probabilmente di notte e in pochi secondi, con i suoi stencil. È stata la prima opera di Banksy in Italia.\n\nIl messaggio non è spiegato: a uno sguardo distratto sembra un'immagine sacra, ma non lo è. Sacro e violenza, fede e armi: ognuno la legge a modo suo.","d":"Sul muro della piazzetta","foto":{"u":"img/07dcd96f1c5b.jpg","alt":"La Madonna in stencil di Banksy sul muro di piazza Gerolomini, vista da vicino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Madonna di Banksy, in stencil bianco e nero su un angolo del muro di piazza Gerolomini."}},{"t":"L'edicola accanto","x":"Ora guarda accanto all'opera: c'è una piccola edicola votiva con la Madonna col Bambino, una di quelle che si trovano in tante strade di Napoli, dipinta chissà quanti secoli prima.\n\nLe due Madonne, una vicina all'altra, sembrano guardarsi: quella antica sembra osservare perplessa quella di Banksy. È questo dialogo a rendere l'opera così napoletana.\n\nFai un passo indietro e guardale insieme: è la foto più bella da portare a casa.","d":"Subito accanto all'opera","foto":{"u":"img/3a7788eec560.jpg","alt":"La Madonna di Banksy sul muro e, accanto, l'edicola votiva con la Madonna col Bambino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A sinistra la Madonna di Banksy, a destra, appesa al muro, l'edicola con la Madonna col Bambino: le due immagini sacre una accanto all'altra."}},{"t":"Un Banksy sotto vetro","x":"Nel 2010 Banksy lasciò a Napoli due opere, probabilmente nella stessa notte. L'altra, in via Benedetto Croce, prendeva in giro il consumismo: rifaceva l'«Estasi della beata Ludovica Albertoni» di Bernini, ma la santa appariva in estasi dopo un pasto da fast food.\n\nQuell'opera è stata coperta da un altro artista di strada napoletano, che non sapeva che cosa stesse cancellando. Per questo il FAI indica questa di piazza Gerolomini come l'unico murale di Banksy in Italia.\n\nOggi è protetta da una teca di plexiglass, che la difende almeno dai vandali.","d":"Davanti all'opera","foto":null},{"t":"Come arrivarci e cosa fotografare","x":"L'opera è su un muro della piccola piazza Gerolomini, affacciata su via dei Tribunali.\n\nLa teca protegge l'opera ma può riflettere la luce: per una foto senza riflessi prova a metterti leggermente di lato. Il posto è sempre accessibile e gratuito.\n\nDa qui la Madonna di via Benedetto Croce, l'opera perduta, era a nove minuti a piedi, lungo il percorso che passa da Sansevero, Napoli Sotterranea e San Gregorio Armeno.","d":"Piazza Gerolomini, su via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d’Italia, l’ultimo Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"A sei minuti da Ceraldi, in via Toledo, l'ultimo quadro dipinto da Caravaggio, poche settimane prima di morire: il Martirio di sant'Orsola.","rac":"Le Gallerie d'Italia di Intesa Sanpaolo sono in via Toledo 177, nel palazzo che fu sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento; il nuovo allestimento è dell'architetto Michele De Lucchi. Il museo ha aperto qui nel 2022 e ha preso il posto del vicino Palazzo Zevallos Stigliano.\n\nIl capolavoro della collezione è il Martirio di sant'Orsola di Caravaggio, del 1610, considerato l'ultimo quadro del pittore. Intorno ci sono tre percorsi: l'arte napoletana dal Seicento al Novecento, una raccolta di ceramiche attiche e della Magna Grecia e una selezione di opere del Novecento.","con":"Biglietto intero 8 euro, ridotto 4 euro; gratis per gli under 26 e per tutti la prima domenica del mese. Chiuso il lunedì; ultimo ingresso un'ora prima della chiusura.","acc":"","foto":{"u":"img/830ac6c4ce8e.jpg","alt":"Una sala delle Gallerie d'Italia con quadri alle pareti gialle","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala delle Gallerie d'Italia a Napoli, con le tele del Seicento."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Il Martirio di sant'Orsola","x":"È una scena stretta e buia, quasi senza sfondo: siamo nella tenda di Attila, re degli Unni. Orsola, una principessa, lo ha rifiutato, e lui le ha appena scoccato una freccia nel petto. Lei piega la testa verso la freccia; tre uomini accorrono a sorreggerla. Il re sembra già pentito del suo gesto.\n\nCerca il volto alle spalle della santa: è lo stesso Caravaggio, che si è dipinto tra i testimoni. E osserva la mano che si allunga tra la santa e il re, come per fermare la freccia: è riapparsa durante il restauro del 2003-2004.\n\nLo commissionò il principe genovese Marcantonio Doria, la cui famiglia aveva sant'Orsola come protettrice. È il quadro più tardo di Caravaggio che conosciamo: fu finito nel maggio 1610, poco più di un mese prima della sua morte.","d":"Nella sala dedicata a Caravaggio","foto":{"u":"img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}},{"t":"Il quadro messo al sole","x":"Caravaggio dipinse il quadro in fretta, forse perché stava per partire verso Roma per ottenere il perdono del papa. L'incaricato dei Doria a Napoli, Lanfranco Massa, fece consegnare la tela quando la vernice non era ancora asciutta e, per farla asciugare prima, la mise al sole: la vernice, stesa molto spessa, si rovinò. Lo raccontò lui stesso in una lettera di maggio 1610.\n\nIl quadro arrivò a Genova, poi passò di erede in erede, finì in una villa di Eboli e fu attribuito ad altri pittori. Solo negli anni Ottanta del Novecento il ritrovamento della lettera di Massa ha confermato con certezza che è di Caravaggio.\n\nNel 2025 un nuovo intervento di restauro ha riportato alla luce tre teste che il tempo aveva fatto sparire.","d":"Davanti alla tela","foto":{"u":"img/6a999eeecae6.jpg","alt":"La tela di Caravaggio esposta in una sala di Palazzo Zevallos, con il soffitto decorato","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Il Martirio di sant'Orsola esposto in una sala di Palazzo Zevallos Stigliano, la sede delle Gallerie d'Italia."}},{"t":"Il palazzo del Banco di Napoli","x":"Prima di salire alle sale, guardati intorno: sei nel palazzo che fu la sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento.\n\nL'architetto Michele De Lucchi lo ha trasformato in museo con un allestimento moderno: le grandi sale della banca oggi ospitano tre percorsi, dall'arte napoletana del Seicento al Novecento, passando per una ricca collezione di vasi greci e della Magna Grecia.\n\nIl museo ha aperto nel 2022 e continua l'attività di Palazzo Zevallos Stigliano, aperto dal 1999 al 2022 a pochi passi da qui.","d":"Entrando, nel salone","foto":{"u":"img/caeaa6cb359b.jpg","alt":"La facciata in pietra del Palazzo del Banco di Napoli su via Toledo, con la bandiera europea","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Il Palazzo del Banco di Napoli su via Toledo, dove hanno sede le Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null},{"id":44,"s":"murale-maradona","n":"Il murale di Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"Il murale amatissimo dei Quartieri Spagnoli e il largo che dal 2020 è diventato un santuario laico per Diego.","rac":"Il murale ritrae Maradona con la maglia numero 10 del Napoli degli anni Ottanta, lo scudetto sul petto e la fascia di capitano al braccio: fu dipinto per festeggiare il secondo scudetto, quello del 1989-90, a cui Maradona contribuì con 16 gol in 28 partite. Era arrivato dal Barcellona nel 1984 e rimase a Napoli fino al 1991.\n\nL'autore, Mario Filardi, aveva solo 23 anni: dipingeva per passione e di mestiere faceva il cameriere, viaggiando per il mondo.\n\nIl murale di Maradona fu dipinto nel 1990 da Mario Filardi. Negli anni Novanta l'apertura di una finestra nel muro ne cancellò il volto e il dipinto sbiadì quasi del tutto; fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'artista argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, ha preso il suo nome e si è riempito di altarini, bandiere e fotografie.","con":"Nelle ore di punta è affollatissimo: la mattina presto è più facile vederlo con calma.","acc":"","foto":{"u":"img/a2c6b2a82ec4.jpg","alt":"Il grande murale di Maradona sulla facciata di un palazzo, con la folla sotto","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Il murale dipinto nel 1990 da Mario Filardi. Il volto di oggi è quello ridipinto nel 2017 dall'artista argentino Francisco Bosoletti."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"img/0094144dd2dd.jpg","alt":"La targa di Largo Maradona con un busto e le bandiere","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La targa del largo: dopo la morte di Diego, nel 2020, il largo degli artisti ha preso il suo nome."},{"u":"img/550f6edc4b91.jpg","alt":"Un altarino con foto di Maradona e ricordi","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un altarino dedicato a Maradona: in città ce ne sono tanti, con foto e ricordi lasciati dai tifosi."},{"u":"img/679687d3070c.jpg","alt":"Maradona dipinto con l'aureola accanto a una piccola edicola","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con l'aureola e la sua edicola votiva, dipinto in zona San Lorenzo."},{"u":"img/80d74e92279d.jpg","alt":"Un'edicola votiva con il ritratto di Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un'edicola votiva per Maradona, come quelle dei santi."}],"leg":"","fc":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Castel Nuovo)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Il castello simbolo di Napoli: un arco di trionfo tra due torri, una porta di bronzo ancora colpita da una palla di cannone e la sala dove un re fece arrestare i baroni durante una festa di nozze.","rac":"Con i re angioini il castello diventò un centro di cultura: sotto Roberto d'Angiò vi soggiornarono artisti, medici e letterati, tra cui Giotto, Petrarca e Boccaccio.\n\nAlfonso I d'Aragona ne fece la sua residenza reale e lo ricostruì. Per celebrare il suo ingresso vittorioso in città fece costruire, tra la Torre di Mezzo e la Torre di Guardia, il grande Arco di Trionfo che ancora oggi fa da ingresso.\n\nOggi il castello è la sede del Museo Civico: il percorso comprende la pinacoteca al primo piano, la Sala dei Baroni, la Cappella Palatina, detta anche di Santa Barbara, e un percorso archeologico nell'antica Armeria.","con":"Biglietto intero 10 euro; 6 euro per chi risiede a Napoli e nella città metropolitana; gratis sotto i 18 anni. Chiuso la domenica.","acc":"","foto":{"u":"img/01914a520eb7.jpg","alt":"Il Maschio Angioino con le due torri e l'arco bianco in mezzo","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Le due grandi torri e, in mezzo, l'Arco di Trionfo di Alfonso d'Aragona: è l'ingresso del castello."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"L'Arco di Trionfo","x":"È l'ingresso del castello, stretto tra due torri: Alfonso I d'Aragona lo volle per celebrare il suo ingresso vittorioso a Napoli. Fermati davanti prima di entrare e guardalo dal basso.","d":"All'ingresso, tra la Torre di Mezzo e la Torre di Guardia","foto":{"u":"img/91d08c9a9561.jpg","alt":"L'Arco di Trionfo di marmo tra le due torri","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arco da vicino: guardalo dal basso, piano per piano."}},{"t":"La porta con la palla di cannone","x":"Ferrante d'Aragona la commissionò a Guglielmo Monaco verso il 1475, per ricordare la vittoria del 1462 su Giovanni d'Angiò e i baroni ribelli: sei riquadri raccontano la guerra. Nel pannello in basso a sinistra c'è ancora una palla di cannone di ferro conficcata nel bronzo. L'ipotesi più accreditata: la porta faceva parte del bottino che Carlo VIII caricò sulle navi per la Francia; al largo di Rapallo la flotta fu attaccata dai genovesi e il colpo la raggiunse. I genovesi la rimandarono a Napoli nel 1495.","d":"L'originale è conservato all'interno del castello","foto":{"u":"img/50ee03911e6d.jpg","alt":"La palla di cannone conficcata nella porta di bronzo","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La palla di cannone di ferro conficcata nel bronzo, nel pannello in basso a sinistra."}},{"t":"La Sala dei Baroni","x":"Ci si arriva dalla scala esterna di piperno dell'architetto maiorchino Guglielmo Sagrera. Alza gli occhi: la volta sale a circa 28 metri e sedici costoloni di piperno partono a stella da un'apertura al centro. Il nome ricorda il 1486, quando re Ferrante I invitò con l'inganno i baroni a festeggiare un matrimonio e qui li fece arrestare. Per cinquant'anni è stata la sede del Consiglio Comunale.","d":"In cima alla scala del cortile","foto":{"u":"img/2761d90bc4e9.jpg","alt":"La volta a stella della Sala dei Baroni","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La volta della Sala dei Baroni: sedici costoloni di piperno partono a stella dall'apertura al centro."}}],"gal":[],"leg":"","fc":null},{"id":32,"s":"castel-dell-ovo","n":"Lungomare e Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Il castello sull'isolotto dove sbarcarono i coloni greci venuti da Cuma: si arriva dal lungomare, si attraversa il ponte e si guarda il golfo dal Borgo Marinari.","rac":"Il castello sorge sull'isolotto di Megaride, fatto di due scogli uniti da un grande arco. Qui, a metà del VII secolo a.C., sbarcarono i coloni venuti da Cuma, che poi fondarono Partenope sul vicino Monte Echia.\n\nNel I secolo a.C. sull'isolotto e sul Monte Echia sorgeva la villa di Lucio Licinio Lucullo. Nella Sala delle Colonne ne restano dei resti: nell'alto Medioevo la sala fu il refettorio di uno dei conventi costruiti sull'isolotto.","con":"L'interno del castello è chiuso per lavori fino a nuovo avviso: oggi si visita da fuori, passeggiando sul lungomare e intorno al Borgo Marinari.","acc":"","foto":{"u":"img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"L'isolotto di Megaride","x":"Dal lungomare guarda il castello: poggia sull'isolotto di Megaride, fatto di due scogli uniti da un grande arco. Qui, verso la metà del VII secolo a.C., sbarcarono i Cumani, di origine greca, che poi fondarono sul vicino Monte Echia la città di Partenope.\n\nNel I secolo a.C., in epoca romana, sull'isolotto e sul Monte Echia sorse la celebre villa di Lucio Licinio Lucullo; ne restano i rocchi di colonne della cosiddetta «Sala delle Colonne».\n\nIl nome viene da una leggenda: il poeta Virgilio avrebbe nascosto un uovo in una gabbia nei sotterranei, e dalla sua integrità dipenderebbe il destino del castello e di tutta Napoli. Quando, al tempo 4.24889,40.8427],[14.2489,40.84277],[14.24891,40.84281],[14.24894,40.84307],[14.24894,40.8431],[14.24899,40.84349],[14.249,40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"La storia di Napoli","sub":"Dalla sirena Partenope a oggi, in tredici capitoli","som":"Prima di partire, ventotto secoli in dieci minuti: la leggenda della sirena, i Greci, Roma, i re, la rivolta, la guerra e la città di oggi.","txt":"Napoli è una delle città più antiche d'Europa: la sua storia si estende per circa tremila anni, e il centro storico che stai per attraversare conserva ancora la pianta delle strade disegnata dai Greci. Per oltre mezzo millennio è stata la capitale dell'Italia del Sud.\n\nQuesti tredici capitoli ti accompagnano dalla leggenda alla città di oggi. Ogni volta che il racconto incontra un luogo della guida, trovi un pulsante per andarci.","foto":null,"cap":[{"p":"La leggenda","t":"La sirena Partenope","x":"Tutto comincia con una sirena. Nel mito greco le sirene erano creature con il corpo di uccello e la testa di donna, padrone di un canto magico. Una di loro si chiamava Partenope.\n\nIl racconto più famoso dice che, quando Ulisse passò davanti al loro scoglio senza cedere al canto, le sirene per il dolore si gettarono in mare. Le onde portarono il corpo di Partenope sulla costa, alla foce di un piccolo fiume, il Sebeto: proprio dove sarebbe nata la città.\n\nLì le fu costruita una tomba e i Greci di Napoli le dedicavano ogni anno sacrifici e una corsa con le fiaccole. Ancora oggi i napoletani si chiamano «partenopei».","l":null,"foto":null},{"p":"VIII–VII secolo a.C.","t":"Partenope, la prima città","x":"La leggenda ha un fondo di verità. Tra l'VIII e il VII secolo a.C. i Greci di Cuma, la più antica colonia greca della zona, fondarono un piccolo scalo sul mare e lo chiamarono come la sirena: Partenope.\n\nSorgeva sulla collina di Pizzofalcone, il Monte Echia, su uno sperone circondato dal mare, e aveva il suo approdo sull'isolotto di Megaride, dove oggi c'è Castel dell'Ovo. Il porto era nell'attuale piazza Municipio. La necropoli di Partenope è stata scoperta nel 1949 in via Nicotera.\n\nLa piccola città crebbe così in fretta che Cuma, per paura di perdere il comando, ne ridusse il ruolo.","l":32,"foto":{"u":"img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."}},{"p":"V secolo a.C.","t":"Neapolis, la città nuova","x":"Accanto a Partenope, poco più a est, i Cumani fondarono una città nuova: Neapolis, la «città nuova». L'UNESCO data la fondazione al 470 a.C. circa, nel periodo in cui i Greci avevano sconfitto gli Etruschi sul mare.\n\nNeapolis fu costruita secondo un disegno regolare: tre strade principali parallele (le «plateiai», poi chiamate decumani), incrociate ad angolo retto da strade più piccole. L'agorà, la piazza principale, era dov'è oggi piazza San Gaetano.\n\nQuel reticolo è ancora lì: Spaccanapoli, via dei Tribunali e via Anticaglia sono le tre strade greche. Camminandoci, cammini nella pianta della città di 2.500 anni fa.","l":38,"foto":{"u":"img/8bcba9e208ec.jpg","alt":"I grandi blocchi di tufo delle mura greche, scavate sotto il livello della strada","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"I blocchi di tufo delle mura greche di Neapolis, in piazza Bellini, visibili in uno scavo sotto il livello della strada."}},{"p":"326 a.C. – V secolo d.C.","t":"Greca sotto Roma","x":"Nel 326 a.C. Neapolis si alleò con Roma e restò per secoli una città greca dentro il mondo romano: fu tra le poche a conservare la lingua e la cultura greca. Diventò un luogo amato dai Romani colti e ricchi, che costruivano ville sul golfo: sull'isolotto di Megaride sorse quella di Lucio Licinio Lucullo.\n\nNel 79 d.C. l'eruzione del Vesuvio distrusse Pompei ed Ercolano, poco lontano. Nel 476, proprio nella villa di Lucullo, fortificata, fu rinchiuso Romolo Augusto, l'ultimo imperatore romano d'Occidente: con lui finiva l'Impero.\n\nSotto la città greco-romana scorreva già l'acqua delle cisterne che oggi visiti a Napoli Sotterranea, e nel teatro di Neapolis si esibì l'imperatore Nerone.","l":15,"foto":{"u":"img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."}},{"p":"VI–XII secolo","t":"Il ducato di Napoli","x":"Dopo la fine dell'Impero, nel VI secolo, Napoli passò ai Bizantini, i Romani d'Oriente. Poco a poco diventò un ducato quasi indipendente: nell'VIII secolo il duca Stefano II se ne fece signore di fatto.\n\nPer cinque secoli il ducato resistette a Longobardi e Saraceni. Nel 1030 il duca Sergio IV diede la contea di Aversa a un gruppo di mercenari normanni: fu l'inizio della loro ascesa nel Sud. Nel 1137 Napoli si sottomise ai Normanni ed entrò nel nuovo Regno di Sicilia.\n\nDi quegli anni lontani restano le chiese più antiche, come Santa Restituta e il battistero di San Giovanni in Fonte dentro il Duomo, considerato il più antico d'Occidente.","l":18,"foto":null},{"p":"1194–1266","t":"Normanni e Svevi: nasce l'Università","x":"Dopo i Normanni arrivarono gli Svevi. Nel 1194 l'imperatore Enrico VI occupò la città e ne fece abbattere le mura.\n\nSuo figlio, Federico II, era un sovrano appassionato di cultura e di diritto. Nel 1224 fondò a Napoli lo «Studio», una delle prime università statali d'Europa: è l'attuale Università Federico II, che porta ancora il suo nome.","l":null,"foto":{"u":"img/ee9a50cab016.jpg","alt":"La statua di Federico II di Svevia nella facciata del Palazzo Reale","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statua di Federico II di Svevia, tra quelle della facciata del Palazzo Reale."}},{"p":"1266–1442","t":"Gli Angioini: Napoli capitale","x":"Nel 1266 il papa affidò il regno a Carlo I d'Angiò, fratello del re di Francia, che entrò in città in trionfo. Dopo la rivolta dei Vespri siciliani del 1282, la Sicilia si staccò e Napoli diventò la capitale del regno: lo resterà per secoli.\n\nGli Angioini costruirono il Castel Nuovo, il Duomo (dal 1294) e la cittadella di Santa Chiara (dal 1310), e la città si allargò. Alla corte di Roberto d'Angiò, nel Castel Nuovo, soggiornarono Giotto, Petrarca e Boccaccio.","l":9,"foto":{"u":"img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."}},{"p":"1442–1503","t":"Gli Aragonesi","x":"Nel 1442 Alfonso d'Aragona conquistò Napoli: secondo la tradizione i suoi uomini entrarono in città passando per un acquedotto. Fece del Castel Nuovo la sua reggia, lo ricostruì e per celebrare la vittoria vi aggiunse il grande Arco di Trionfo tra due torri.\n\nGli Aragonesi trasformarono il castello medievale in una fortezza moderna e rinnovarono le difese e le strade della città. Il figlio Ferrante sconfisse i baroni ribelli: la porta di bronzo del castello racconta quella guerra, e nella Sala dei Baroni si consumò la sua vendetta.","l":30,"foto":{"u":"img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi: Napoli aragonese vista dal mare, con il Maschio Angioino e Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (XV secolo): Napoli vista dal mare, con il porto, il Castel Nuovo e, in alto, il colle di Sant'Elmo."}},{"p":"1503–1707","t":"Il viceregno spagnolo","x":"Dal 1503 Napoli passò alla Spagna e fu governata da un viceré. Senza un re presente, era comunque una capitale imperiale, con una delle corti più grandiose dei domini spagnoli. Il viceré don Pedro di Toledo raddoppiò la città, aprì via Toledo e costruì i quartieri per i soldati, i Quartieri Spagnoli. In questi anni fu costruito anche il Palazzo Reale.\n\nNel 1606 arrivò a Napoli, in fuga da Roma, Caravaggio: la sua pittura cambiò l'arte della città, che nel Seicento diventò una delle capitali del barocco europeo.\n\nFurono anche anni durissimi: tasse altissime, l'eruzione del Vesuvio del 1631 e, nel 1656, una peste che uccise più della metà degli abitanti.","l":45,"foto":{"u":"img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste del 1656: corpi ammassati nella piazza e figure celesti in cielo","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste del 1656, dipinto da Micco Spadaro: la piazza è piena di morti e di moribondi."}},{"p":"1647","t":"Masaniello","x":"Il 7 luglio 1647, dopo l'ennesima tassa, questa volta sulla frutta, il cibo dei più poveri, un pescatore di 27 anni, Masaniello, guidò il popolo in rivolta al grido di «Viva il re di Spagna, mora il malgoverno».\n\nIn dieci giorni gli spagnoli dovettero accettare le richieste del popolo. Ma Masaniello, accusato di pazzia e tradito da una parte degli stessi rivoltosi, fu assassinato. La rivolta continuò per mesi contro la Spagna, prima di essere domata nel 1648.","l":null,"foto":null},{"p":"1734–1799","t":"I Borbone e la Repubblica","x":"Nel 1734 Carlo di Borbone riportò a Napoli un re tutto suo e volle farne una grande capitale europea. Nel 1737 fece costruire in soli sette mesi il Teatro di San Carlo; poi le regge di Portici e di Capodimonte. In quegli anni cominciarono anche gli scavi di Ercolano e di Pompei.\n\nNapoli era una delle capitali dell'Illuminismo. Nel gennaio 1799, con l'arrivo dell'esercito francese, i patrioti proclamarono la Repubblica Napoletana: durò solo fino a giugno. Al ritorno dei Borbone molti dei suoi protagonisti furono giustiziati.\n\nDopo gli anni dei Francesi (Giuseppe Bonaparte e Gioacchino Murat), nel 1815 tornarono i Borbone, e nel 1816 nacque il Regno delle Due Sicilie.","l":null,"foto":null},{"p":"1860–1945","t":"L'Italia unita e la guerra","x":"Il 7 settembre 1860 Giuseppe Garibaldi entrò a Napoli acclamato dalla folla; un plebiscito sancì l'unione al Regno d'Italia. Napoli smise di essere una capitale, e la perdita fu pesante.\n\nNella Seconda guerra mondiale la città subì più di 120 bombardamenti aerei, soprattutto per il suo porto; la gente si rifugiava nelle cisterne sotterranee. Dopo l'armistizio, i tedeschi occuparono la città. Alla fine di settembre 1943 i napoletani insorsero: nelle «Quattro giornate di Napoli» il popolo costrinse alla resa il presidio tedesco. Il 1° ottobre arrivarono gli Alleati.","l":15,"foto":{"u":"img/5ded47a7684b.jpg","alt":"Un'incisione d'epoca: Garibaldi acclamato dalla folla a Napoli","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Incisione d'epoca dell'ingresso di Garibaldi a Napoli, nel 1860: la folla lo acclama in via Toledo."}},{"p":"Dal 1945 a oggi","t":"La Napoli di oggi","x":"Dopo la guerra la città si ricostruì tra grandi difficoltà. Nel 1995 il centro storico è stato iscritto dall'UNESCO tra i Patrimoni dell'Umanità: è il più grande d'Italia e uno dei più vasti d'Europa.\n\nDal 2001 la metropolitana ha aperto le sue «stazioni dell'arte», con opere di artisti contemporanei. La città conta circa 950.000 abitanti, più di tre milioni con l'area metropolitana.\n\nE poi c'è la Napoli che vedrai camminando: i murales, come quello di Maradona nei Quartieri Spagnoli, e la Madonna di Banksy, la vita dei vicoli, il caffè. Tremila anni di storia, uno sopra l'altro, in pochi chilometri.","l":44,"foto":null}],"ap":true,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio a Napoli","sub":"Un pittore in fuga e tre capolavori da vedere","som":"In fuga da Roma, Caravaggio trovò rifugio a Napoli due volte. Qui dipinse le Sette opere di Misericordia, la Flagellazione e il suo ultimo quadro.","txt":"Michelangelo Merisi, detto Caravaggio, era a Roma un pittore famoso e discusso. Negli ultimi giorni di maggio del 1606 ferì a morte Ranuccio Tomassoni in una rissa nata durante una partita a racchetta: condannato, dovette fuggire.\n\nNapoli, allora una delle città più grandi d'Europa, fu il suo rifugio due volte: dall'autunno 1606 all'estate 1607, e poi dall'autunno 1609 all'estate 1610. Qui trovò la protezione della famiglia Colonna e committenti ricchi, e qui la sua pittura cambiò per sempre l'arte della città.\n\nTre delle sue opere si possono vedere oggi a Napoli, due delle quali sul nostro percorso.","foto":null,"cap":[{"p":"1606–1607","t":"Il primo soggiorno e le Sette opere","x":"Il primo incarico napoletano documentato è dell'ottobre 1606. Pochi mesi dopo, entro il 9 gennaio 1607, Caravaggio consegnò al Pio Monte della Misericordia la grande tela delle Sette opere di Misericordia, pagata 400 ducati.\n\nÈ ancora lì, sull'altare per cui fu dipinta, in via dei Tribunali: una notte in un vicolo di Napoli, dove gli uomini si aiutano tra loro sotto lo sguardo della Madonna.","l":17,"foto":{"u":"img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"p":"1607","t":"La Flagellazione","x":"Per la famiglia de Franchis, giuristi e magistrati, Caravaggio dipinse nel 1607 la Flagellazione di Cristo, per la loro cappella nella chiesa di San Domenico Maggiore: una tela alta quasi tre metri, uno dei capolavori del barocco napoletano.\n\nOggi l'originale è al Museo di Capodimonte, dove fu trasferito per motivi di sicurezza; in San Domenico Maggiore è rimasta una copia. Capodimonte è fuori dai nostri giri a piedi.","l":null,"foto":{"u":"img/286a53bb4961.jpg","alt":"La Flagellazione di Cristo di Caravaggio: Gesù legato alla colonna tra i carnefici","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellazione di Cristo (1607), oggi al Museo di Capodimonte: la luce cade sul corpo di Gesù, legato alla colonna."}},{"p":"1607–1609","t":"Malta e la Sicilia","x":"Il 12-13 luglio 1607 Caravaggio arrivò a Malta, probabilmente su una galea dei Cavalieri partita da Napoli. Ma anche lì finì nei guai: dopo una rissa fu arrestato nell'agosto 1608, fuggì dal forte in cui era rinchiuso e riparò in Sicilia, a Siracusa.","l":null,"foto":null},{"p":"Ottobre 1609","t":"L'agguato del Cerriglio","x":"Nell'autunno 1609 tornò a Napoli, ancora sotto la protezione dei Colonna, sperando nel perdono del papa per poter rientrare a Roma.\n\nIn ottobre fu aggredito da quattro uomini davanti all'osteria del Cerriglio, una locanda famosa del tempo, e sfregiato al volto: la ferita fu così grave che a Roma si sparse la voce della sua morte.","l":null,"foto":null},{"p":"1610","t":"L'ultimo quadro","x":"Nella primavera del 1610 dipinse per il principe genovese Marcantonio Doria il Martirio di sant'Orsola: la tela fu finita in maggio, consegnata ancora fresca di vernice e spedita a Genova. È il quadro più tardo di Caravaggio che conosciamo, e si vede oggi alle Gallerie d'Italia in via Toledo, a sei minuti da Ceraldi. Tra i volti, alle spalle della santa, c'è il suo.\n\nNell'estate partì in barca verso Roma con alcuni quadri, sperando nel perdono. Fu arrestato per errore a Palo, e la barca ripartì con i dipinti. Morì a Porto Ercole il 18 luglio 1610 (o forse il giorno dopo), a 38 anni.","l":45,"foto":{"u":"img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}}],"ap":false,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Napoli in cinque minuti: dalla sirena alla città nuova","sub":"","som":"Prima Partenope, poi Neapolis: perché il centro storico è ancora disegnato come una città greca.","txt":"Napoli nasce due volte. La prima volta si chiama Partenope, come la sirena del mito: la fondano nel VII secolo avanti Cristo coloni di origine greca venuti da Cuma, che approdano sull'isolotto di Megaride, dove oggi sorge Castel dell'Ovo, e si stabiliscono sul vicino Monte Echia.\n\nLa seconda volta, intorno al 470 avanti Cristo, accanto alla città vecchia ne sorge una nuova: Neapolis, «città nuova» in greco. È questa che state attraversando. Le sue strade formano una griglia regolare che, dopo venticinque secoli, si legge ancora: il centro storico di Napoli è patrimonio mondiale dell'UNESCO proprio perché il disegno della città greca è rimasto la sua ossatura.\n\nTre strade parallele, i decumani, tagliano la città da ovest a est. Quella più in basso è Spaccanapoli: lunga circa due chilometri, così dritta che vista dall'alto sembra dividere la città in due, da cui il nome. Al centro corre via dei Tribunali, il decumano maggiore; più in alto via dell'Anticaglia e via della Sapienza, il decumano superiore.\n\nDa Piazza Carità, dove siamo noi dal 2002, Spaccanapoli comincia a pochi minuti a piedi, in piazza del Gesù Nuovo.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro e il sangue che si scioglie","sub":"","som":"Tre volte l'anno Napoli trattiene il fiato davanti a un'ampolla. Cosa succede, dove, e cosa ne dicono Chiesa e scienza.","txt":"Nel Duomo di Napoli, in una nicchia della Cappella del Tesoro, è custodita un'ampolla con una sostanza scura che la tradizione indica come il sangue di San Gennaro, patrono della città. Tre volte l'anno, il sabato che precede la prima domenica di maggio, il 19 settembre (giorno della festa) e il 16 dicembre, l'ampolla viene mostrata ai fedeli: se il contenuto, di solito solido, si scioglie, è festa; se resta solido, per molti napoletani è un cattivo presagio.\n\nLa prima notizia conosciuta della liquefazione risale al 1389. A custodire le reliquie non è il clero ma la Deputazione della Cappella del Tesoro di San Gennaro, un'istituzione laica nata nel 1601, di cui fa parte anche il sindaco di Napoli.\n\nLa Chiesa mantiene un atteggiamento prudente: parla di «fatto prodigioso», ne consente la devozione popolare ma non lo impone come verità di fede. Tra le spiegazioni proposte dagli scettici c'è la tissotropia, la proprietà di alcune sostanze che sono solide a riposo e diventano liquide se mosse o scosse.\n\nSacro e profano, qui, convivono da sempre: in via Duomo, a pochi passi dalla cattedrale, lo street artist Jorit ha dipinto un San Gennaro con il volto di un operaio.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Le anime pezzentelle: quando Napoli adottava un teschio","sub":"","som":"Ossari, capuzzelle e preghiere scambiate con i numeri del lotto: il culto dei morti senza nome.","txt":"Per secoli, a Napoli, i morti senza nome non sono rimasti soli. Li chiamavano anime pezzentelle: le anime povere, morte senza funerale e senza nessuno a pregare per loro. Il nome si lega a «pezzente», il povero, ma anche al latino «petere», chiedere per ricevere: chi pregava per loro sperava di ricevere in cambio protezione e grazie.\n\nIl luogo simbolo è il Cimitero delle Fontanelle, nel Rione Sanità: una cava di tufo del Cinquecento, di circa quattromila metri quadrati, che accolse le vittime della peste del 1656 e poi quelle del colera del 1836-1837. Nel 1872 il canonico Gaetano Barbati sistemò le ossa in tre navate. I devoti «adottavano» un teschio, una capuzzella: lo pulivano, lo mettevano in una piccola teca, lo ornavano di rosari e monete e lo pregavano, aspettando un segno in sogno, a volte un numero da giocare al lotto. Alcuni teschi diventarono famosi: il Capitano, con un'orbita annerita, protagonista di una leggenda di nozze e gelosia; donna Concetta, che si dice «sudi» quando la grazia è concessa.\n\nNel 1969 un decreto del tribunale ecclesiastico chiuse l'ossario e vietò il culto. Chiuso per lavori dal 2020, il cimitero ha riaperto al pubblico nel 2026, gestito dalla cooperativa La Paranza.\n\nIl culto vive anche sotto via dei Tribunali, nell'ipogeo di Santa Maria delle Anime del Purgatorio ad Arco, la chiesa che i napoletani chiamano «'e cape 'e morte»: lì è custodito il teschio di Lucia, un'anima giovane particolarmente amata. E in via San Biagio dei Librai, nella piccola chiesa di Santa Luciella, c'è un teschio unico: quello con le orecchie.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Napoli esoterica: un principe alchimista, una facciata in codice e un uovo magico","sub":"","som":"Raimondo di Sangro, il bugnato del Gesù Nuovo, l'uovo di Virgilio, il munaciello: dove finisce la storia e comincia la leggenda.","txt":"Napoli ama i misteri, e ne ha di bellissimi. Il più celebre ha un nome: Raimondo di Sangro, principe di Sansevero, uomo del Settecento, Gran Maestro della Massoneria napoletana, inventore geloso dei propri segreti. Il mito lo accompagnava già in vita, e fu lui stesso ad alimentarlo. Benedetto Croce lo definì l'incarnazione napoletana del dottor Faust. La leggenda nera gli attribuisce di tutto: servi uccisi per studiarne i corpi, persino l'accecamento dello scultore del Cristo velato perché non ne scolpisse un altro. Sono leggende, e lo stesso museo le distingue dalla storia documentata.\n\nIl Cristo velato è opera di Giuseppe Sanmartino, su commissione del principe: il velo trasparente che copre il corpo è scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea della cappella si trovano le «macchine anatomiche», due scheletri con il sistema circolatorio ricostruito, realizzate dal medico palermitano Giuseppe Salerno intorno al 1756-1764: la leggenda parla di iniezioni misteriose, gli studi di cera d'api e coloranti.\n\nPoco lontano, la facciata del Gesù Nuovo, nata come palazzo dei Sanseverino nel 1470, è coperta da un bugnato a punta di piramide in piperno scuro. Su alcune pietre si vedono segni incisi: per la leggenda un messaggio segreto; per alcuni studiosi i marchi dei tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali, uno spartito di circa tre quarti d'ora chiamato «Enigma». Un'ipotesi suggestiva, non una certezza.\n\nE poi c'è il mare: secondo la leggenda il poeta Virgilio nascose nei sotterranei di Castel dell'Ovo l'uovo della sirena Partenope. Finché l'uovo resta intatto, il castello resta in piedi.\n\nNelle case, invece, abitano gli spiriti della tradizione popolare: il munaciello, folletto incappucciato che porta fortuna o dispetti a seconda di come lo tratti, e la bella 'mbriana, spirito buono della casa, che può apparire come una farfalla o un geco.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Napoli oggi: cosa c'è di nuovo","sub":"","som":"Il largo dedicato a Maradona, la street art, l'ultimo Caravaggio in via Toledo, chiese e ossari riaperti: la città che cambia.","txt":"Chi torna a Napoli dopo qualche anno trova una città che ha imparato a raccontarsi.\n\nNei Quartieri Spagnoli, a nove minuti da noi, c'è Largo Maradona. Il murale di Diego fu dipinto nel 1990 da Mario Filardi; negli anni sbiadì fino quasi a scomparire, poi fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, è diventato un santuario laico di altarini, bandiere argentine e fotografie, tanto visitato che il Comune ha dovuto organizzare il flusso dei pedoni.\n\nLa street art è entrata nel centro storico: in piazzetta dei Girolamini, protetta da un vetro, c'è la Madonna con la pistola di Banksy; in via Duomo il San Gennaro operaio di Jorit. Il portale turistico ufficiale della città dedica loro un itinerario.\n\nIn via Toledo, a sei minuti da noi, le Gallerie d'Italia custodiscono il Martirio di sant'Orsola, l'ultima tela dipinta da Caravaggio, insieme a oltre cinquecento vasi attici e della Magna Grecia.\n\nE riaprono luoghi rimasti chiusi a lungo: la chiesa di Santa Luciella ai Librai, abbandonata per più di trent'anni, è tornata visitabile il 5 aprile 2019; il Cimitero delle Fontanelle ha riaperto nel 2026.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"an
