 del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"I dipinti del Seicento","x":"Prima di scendere, guarda bene la chiesa di sopra. Fu commissionata nel 1616 dalla congregazione laica «Opera Pia Purgatorio ad Arco» all'architetto Giovan Cola di Franco e consacrata nel 1638.\n\nFu pensata su due livelli: la chiesa superiore, che rappresenta la dimensione terrena, e sotto l'ipogeo, il cimitero, che rappresenta concretamente il Purgatorio. Tutta la decorazione ricorda a chi entra che le anime aspettano una preghiera per salire in Paradiso.\n\nQui ci sono marmi preziosi e dipinti di tre grandi maestri del Seicento napoletano: Massimo Stanzione, Luca Giordano e Andrea Vaccaro. Nella sagrestia e nell'oratorio c'è anche un piccolo museo con argenti, paramenti, manoscritti e quadri realizzati per la congregazione tra il Seicento e l'Ottocento.","d":"Nella chiesa superiore","foto":{"u":"img/a8b34654121a.jpg","alt":"Un sepolcro di marmo del Seicento nella chiesa superiore","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"Nella chiesa superiore: il sepolcro di Pietro Antonio Mastrilli (1607), tra i marmi e i dipinti del Seicento."}},{"t":"Il teschio alato","x":"Tra i marmi della chiesa superiore c'è il celebre teschio alato di Dionisio Lazzari: un teschio con le ali, che riassume lo spirito del luogo. Qui la morte non fa paura: diventa occasione di preghiera e di legame con chi non c'è più.\n\nNon a caso i napoletani chiamano questa chiesa «'e cape 'e morte», quella dei teschi.\n\nIl messaggio era voluto: nella chiesa nata con la Controriforma, tutto doveva ricordare a passanti e fedeli che le anime del Purgatorio aspettavano una preghiera per salire in Paradiso.","d":"Nella chiesa superiore","foto":{"u":"img/63d1e885c193.jpg","alt":"Un bassorilievo di marmo con un teschio alato e coronato","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"Il teschio alato e coronato in bassorilievo di marmo, prima metà del Seicento: il simbolo della chiesa."}},{"t":"L'ipogeo delle anime","x":"La vera chiesa è quella di sotto. Da un'apertura nel pavimento della chiesa superiore si scendono gradini alti e si arriva in un grande ambiente spoglio, una vera chiesa inferiore.\n\nAl centro del pavimento c'è una grande tomba anonima circondata da catene nere e illuminata da poche lampadine. Lungo le pareti ci sono nicchie, piccoli altari e teche: sono i segni del culto nato qui spontaneamente fin dal Seicento, quando i fedeli si prendevano cura di resti umani senza nome e chiedevano loro protezione. Sul fondo c'è l'antico altare del Seicento con grandi croci nere.\n\nScendi piano: è un luogo di devozione ancora viva, non solo di curiosità. Visita guidata in italiano inclusa nel biglietto, su prenotazione.","d":"Sotto la chiesa, scendendo una scala ripida","foto":{"u":"img/7fc480d05134.jpg","alt":"L'ipogeo del Purgatorio ad Arco con altari e lumini","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"L'ipogeo, la chiesa di sotto: altari, lumini e le testimonianze del culto delle anime."}},{"t":"Il teschio di Lucia","x":"Tra tutti i teschi dell'ipogeo ce n'è uno particolarmente amato: quello di Lucia, ritenuto l'anima di una giovane. È custodito in fondo a un piccolo corridoio.\n\nÈ la testimonianza più toccante del culto delle anime del Purgatorio, nato qui spontaneamente fin dal Seicento: i devoti scelgono un resto senza nome, se ne prendono cura e gli chiedono protezione.\n\nGuardala con rispetto: per molti napoletani è ancora oggi una presenza a cui rivolgersi.","d":"Nell'ipogeo, in fondo a un piccolo corridoio","foto":null}],"gal":[{"u":"img/36b3b8212bd1.jpg","alt":"Un'immagine delle anime del Purgatorio tra le fiamme dentro la chiesa","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro la chiesa: le anime del Purgatorio tra le fiamme, il tema di tutto il luogo."},{"u":"img/de63b1b83fa8.jpg","alt":"Un teschio di bronzo su una colonnina","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un teschio di bronzo: il simbolo della chiesa delle «capuzzelle»."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Quaranta metri sotto via dei Tribunali: le cisterne che per secoli hanno dato l'acqua a Napoli, i rifugi della guerra e un teatro romano nascosto sotto il letto di una casa.","rac":"Sotto il centro storico c'è un'altra città. Da Piazza San Gaetano si scendono oltre cento gradini fino a circa 40 metri di profondità, lungo un percorso che attraversa l'acquedotto greco-romano e cunicoli di epoca medievale, borbonica e moderna.\n\nLe cavità di epoca greca furono usate come cisterne per l'acqua della città per circa 23 secoli. Durante la Seconda guerra mondiale gli stessi spazi diventarono rifugi antiaerei.\n\nLa visita sottoterra è guidata e dura circa un'ora. Poi si torna in superficie per l'ultima sorpresa: i resti del teatro greco-romano di Neapolis, inglobati dal Quattrocento nelle case del quartiere. Si entra in un «basso», una casa al piano terra, si sposta un letto e da una botola si scende tra le mura del teatro.","con":"Scarpe basse e una felpa anche d'estate: sottoterra è umido. Il breve passaggio stretto con la candela è facoltativo. Per i gruppi da 10 persone in su serve la prenotazione.","acc":"Non adatto a sedie a rotelle e deambulatori: ci sono scale, con corrimano, e passaggi stretti.","foto":{"u":"img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Visite guidate in partenza ogni ora dalle 10 alle 18, in italiano e in inglese. Giovedì anche alle 21, solo su prenotazione e con almeno 10 persone."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Le cisterne greco-romane","x":"Si scendono 136 gradini, bassi e comodi, fino a circa 40 metri sotto le strade. Già nel III secolo a.C. i Greci aprirono qui le prime cave sotterranee, per estrarre i blocchi di tufo con cui costruivano le mura e i templi di Neapolis.\n\nLe grandi stanze scavate nel tufo diventarono poi le cisterne dell'acqua della città, collegate dall'acquedotto greco-romano, e lo rimasero per circa 23 secoli. Sotto il centro storico c'è una rete ancora non del tutto conosciuta di cisterne, cave, cunicoli e pozzi, con tracce greche, spagnole e borboniche.\n\nLungo il percorso vedrai anche cose sorprendenti: il laboratorio della stazione sismica «Arianna» e gli orti ipogei, piccole coltivazioni a 35 metri di profondità, illuminate da lampade speciali, studiate anche dai ricercatori.","d":"Nella prima parte della visita, a circa 40 metri di profondità","foto":{"u":"img/bd8239fed0ef.jpg","alt":"Le pareti di tufo di una cisterna sotterranea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Le pareti di tufo di una cisterna: per circa 23 secoli qui si raccoglieva l'acqua della città."}},{"t":"Il passaggio con la candela","x":"Le stanze del percorso sono tutte grandi e illuminate, tranne un tratto brevissimo e stretto: si percorre alla luce delle candele, uno alla volta, mantenendo un po' di distanza da chi ti precede.\n\nAlla fine del cunicolo arrivi alla cisterna romana ancora piena d'acqua: è il momento più suggestivo della visita.\n\nIl passaggio è facoltativo: chi soffre di spazi stretti può aspettare il gruppo fuori, dove ci sono delle panche. La candela non è obbligatoria: va bene anche la torcia del telefono.","d":"Lungo il percorso sotterraneo","foto":{"u":"img/a874f33cc5df.jpg","alt":"Un cunicolo strettissimo illuminato nel tufo","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Uno dei cunicoli strettissimi scavati nel tufo."}},{"t":"I rifugi della guerra","x":"Durante la Seconda guerra mondiale le antiche cisterne furono usate come rifugi antiaerei: qui la gente di Napoli scendeva a ripararsi dai bombardamenti.\n\nLungo il percorso c'è il Museo della Guerra, con gli oggetti di quegli anni.\n\nNapoli subì più di cento bombardamenti aerei, soprattutto per il suo porto: pensare a quante persone si rifugiarono qui sotto aiuta a capire quello che la città ha passato.","d":"Lungo il percorso sotterraneo","foto":{"u":"img/0f4490838101.jpg","alt":"Oggetti della Seconda guerra mondiale esposti sottoterra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"I ricordi della guerra: oggetti di quando queste stanze erano rifugi antiaerei."}},{"t":"Il teatro sotto il letto","x":"La seconda parte della visita è in superficie, tra via Anticaglia, vico Cinquesanti e via San Paolo. Qui sorgeva il teatro greco-romano di Neapolis, detto anche teatro di Nerone, perché l'imperatore vi si esibì.\n\nDal Quattrocento le case sono state costruite sopra e dentro le mura del teatro, che così sono arrivate fino a noi. Si entra in un «basso», una tipica casa a piano strada, si sposta il letto e da una botola si scende nelle stanze dove, secondo la tradizione, Nerone si preparava per i suoi spettacoli.\n\nDi recente un altro pezzo del teatro è riemerso in un'antica falegnameria: oggi ospita una mostra di vecchie teche di legno scuro per i presepi, e sotto il pavimento sono riapparsi scarichi d'epoca borbonica fatti con riggiole dai disegni blu.","d":"Seconda parte della visita, in superficie tra via Anticaglia e vico Cinquesanti","foto":{"u":"img/33425512f471.jpg","alt":"Gli archi in mattoni che scavalcano via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Gli archi di via Anticaglia: sono resti del teatro romano di Neapolis, inglobato nelle case."}}],"gal":[],"leg":"Secondo il racconto della visita, nelle stanze nascoste sotto il basso Nerone aveva i suoi camerini, quando veniva a Napoli a esibirsi nel teatro.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Due colonne romane alte undici metri sorreggono ancora la facciata: sono ciò che resta del tempio dei Dioscuri.","rac":"Su piazza San Gaetano, nel cuore del centro antico, una scalinata porta a una facciata sostenuta da due colonne corinzie alte circa undici metri. Sono ciò che resta del tempio dei Dioscuri, costruito tra il I e il II secolo d.C. e considerato l'edificio antico più importante di Napoli.\n\nUna prima chiesa di San Paolo fu costruita qui tra l'VIII e il IX secolo; poi i Teatini la ricostruirono, dal secondo Cinquecento. Il terremoto del 1688 abbatté gran parte del tempio antico; l'architetto Arcangelo Guglielmelli inglobò le colonne rimaste nella nuova facciata. I bombardamenti del 1943 danneggiarono l'interno, ma gran parte delle decorazioni si salvò.\n\nQui è sepolto san Gaetano Thiene, fondatore dei Teatini.","con":"Guarda le colonne da vicino, poi entra: la sagrestia affrescata da Solimena è tra le parti più belle. Gli orari di apertura cambiano: controlla prima.","acc":"","foto":{"u":"img/42ca45a7f6f8.jpg","alt":"Le colonne corinzie del tempio romano sulla facciata di San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Le colonne corinzie del tempio dei Dioscuri sulla facciata di San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Le colonne del tempio dei Dioscuri","x":"Le due colonne corinzie in facciata, alte circa undici metri, sono ciò che resta del tempio dei Dioscuri. Dopo il terremoto del 1688 l'architetto Arcangelo Guglielmelli le inglobò nella nuova facciata. Sopra la scalinata, le statue di San Pietro e San Paolo furono scolpite da Andrea Falcone nel 1671.","d":"Sulla facciata, in cima alla scalinata","foto":{"u":"img/951355b4bf10.jpg","alt":"La facciata di San Paolo Maggiore con le colonne antiche","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"La facciata di San Paolo Maggiore, con le colonne del tempio dei Dioscuri."}},{"t":"La tomba di san Gaetano","x":"In questa basilica è sepolto san Gaetano Thiene, fondatore dei Teatini, l'ordine che ricostruì la chiesa dal secondo Cinquecento. Il santuario a lui dedicato fa parte della pianta della chiesa.","d":"Dentro la basilica","foto":{"u":"img/bf17baf7ec59.jpg","alt":"Il santuario di San Gaetano Thiene nella basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"Il santuario di San Gaetano Thiene nella basilica di San Paolo Maggiore."}},{"t":"La sagrestia di Solimena","x":"La sagrestia della basilica è decorata da Francesco Solimena, uno dei maggiori pittori napoletani del Settecento. È una delle parti più belle della chiesa.","d":"Dietro la navata, nella sagrestia","foto":{"u":"img/4782e44ae33e.jpg","alt":"La sagrestia affrescata da Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"La sagrestia di San Paolo Maggiore, con gli affreschi di Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":{"u":"img/9f5b0456685f.jpg","alt":"La cupola ottagonale della chiesa del Pio Monte della Misericordia vista dal basso","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cupola della chiesa ottagonale del Pio Monte della Misericordia, guardando in alto."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Le Sette opere di Misericordia","x":"È una tela enorme, quasi quattro metri d'altezza, e sembra una notte in un vicolo di Napoli: un incrocio pieno di gente, illuminato da una luce che arriva di lato e scolpisce i corpi nel buio. In alto, la Madonna con il Bambino, portata da due angeli, guarda giù su quello che fanno gli uomini.\n\nIl Pio Monte voleva un'opera che mettesse insieme tutte e sette le opere di misericordia: dar da mangiare agli affamati, dar da bere agli assetati, vestire gli ignudi, ospitare i pellegrini, visitare gli infermi, visitare i carcerati, seppellire i morti. Caravaggio le dipinse tutte in una sola scena, senza miracoli: è l'uomo che aiuta l'uomo.\n\nFu la prima opera di Caravaggio a Napoli e cambiò la pittura della città: i pittori napoletani del Seicento ripresero la sua luce, i suoi personaggi presi dalla strada e perfino alcuni dettagli, come l'uomo di spalle in primo piano.","d":"Sull'altare maggiore","foto":{"u":"img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"t":"Come riconoscere le sette opere","x":"Cerca le scene una per una.\n\nA destra, una giovane donna allatta dal seno un vecchio dietro le sbarre: sono Pero e suo padre Cimone, condannato a morire di fame in carcere. Valgono per due opere: dar da mangiare agli affamati e visitare i carcerati. Guarda la goccia di latte sulla barba del vecchio.\n\nDietro di loro, un uomo trasporta un morto (se ne vedono solo i piedi) e un sacerdote con la torcia gli fa luce: seppellire i morti. In primo piano, a sinistra, un giovane cavaliere taglia il mantello per un uomo nudo a terra: è San Martino, vestire gli ignudi; accanto, nell'angolo più buio, uno storpio prega: visitare gli infermi.\n\nAll'estrema sinistra un oste indica la strada a un pellegrino con la conchiglia sul cappello, San Giacomo: ospitare i pellegrini. Sullo sfondo, un uomo beve da una mascella d'asino: è Sansone, dar da bere agli assetati.","d":"Davanti alla tela, da sinistra a destra","foto":{"u":"img/61f82ae7d5c6.jpg","alt":"La tela di Caravaggio sopra l'altare maggiore del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La tela di Caravaggio come la vedi in chiesa: sopra l'altare, nella cappella del Pio Monte."}},{"t":"La Madonna e gli angeli","x":"Guarda in alto: la Madonna con il Bambino si affaccia come da una finestra, davanti a due lenzuoli stesi, e due angeli si abbracciano in volo. Sembrano lontani da quello che succede in basso.\n\nMa osserva l'ombra che proiettano sul muro del carcere: Caravaggio li rende presenti, quasi concreti, dentro la stessa notte degli uomini.\n\nLo storico dell'arte Roberto Longhi scelse proprio questo dettaglio per la locandina della grande mostra del 1951 che riscoprì Caravaggio: belli, scrisse, come un Raffaello, ma presi «dalla verità nuda di Forcella o di Pizzofalcone».","d":"In alto, nella tela","foto":{"u":"img/e426fcddaa4a.jpg","alt":"Dettaglio: la Madonna con il Bambino e i due angeli in volo","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Il dettaglio in alto: la Madonna con il Bambino che si affaccia e i due angeli che si abbracciano in volo."}},{"t":"Gli altri altari","x":"Intorno al Caravaggio la chiesa ottagonale ha altri sei altari, con tele di pittori del Seicento napoletano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino e Forlì.\n\nCerca la «Liberazione di San Pietro» di Battistello Caracciolo, del 1615: è uno dei pittori che più impararono da Caravaggio, e si vede dalla luce e dal buio. Poi «San Pietro che resuscita Tabità» di Fabrizio Santafede, del 1611.\n\nGuardale dopo il Caravaggio: capirai subito quanto la sua tela fosse nuova per Napoli.","d":"Nelle cappelle intorno","foto":{"u":"img/b58919c38c63.jpg","alt":"Una tela del Seicento con il Buon Samaritano","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"Il Buon Samaritano di Giovan Vincenzo Forlì, su uno degli altari intorno alle Sette opere di Caravaggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo e Tesoro di San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cattedrale di Napoli e la Cappella del Tesoro, dove si custodisce l'ampolla del sangue di San Gennaro.","rac":"La cattedrale, dedicata a Santa Maria Assunta, fu voluta da Carlo d'Angiò nel 1294 nel luogo dove sorgevano due basiliche antiche: la Stefania, demolita, e Santa Restituta, conservata come cappella. La si scopre all'improvviso lungo via Duomo, la strada aperta nei primi decenni dopo l'Unità d'Italia.\n\nÈ gotica, a croce latina e tre navate, con un soffitto a cassettoni di legno intagliato e dorato. Dentro, i secoli si sommano: la basilica paleocristiana di Santa Restituta, il battistero più antico d'Occidente, la cripta rinascimentale del Succorpo, la cappella barocca del Tesoro, e sotto tutto i resti della città greco-romana.\n\nNel Duomo, in una nicchia della Cappella del Tesoro, è custodita l'ampolla con il sangue che la tradizione attribuisce a San Gennaro. Tre volte l'anno (il sabato prima della prima domenica di maggio, il 19 settembre e il 16 dicembre) se ne attende la liquefazione. Le reliquie sono affidate dal 1601 a un'istituzione laica, la Deputazione della Cappella del Tesoro di San Gennaro.","con":"Nei giorni della liquefazione il Duomo è pieno fin dal mattino: se vuoi esserci, arriva presto.","acc":"","foto":{"u":"img/bbfb14ecb434.jpg","alt":"La facciata del Duomo di Napoli","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La facciata del Duomo, su via Duomo. La Cappella del Tesoro è la terza a destra."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Ingresso libero con prenotazione obbligatoria. Le visite partono ogni ora."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Il portale di San Gennaro","x":"Fermati davanti alla facciata: è alta circa cinquanta metri e ha tre portali. Fu ricostruita in stile gotico dopo che il terremoto del 1349 aveva distrutto la facciata angioina e il campanile.\n\nIl portale di destra resta chiuso quasi tutto l'anno: si apre solo per le feste di San Gennaro e in occasioni straordinarie. Se lo trovi aperto, sei capitato in un giorno speciale.\n\nLa cattedrale, dedicata a Santa Maria Assunta, fu voluta da Carlo d'Angiò nel 1294 dove sorgevano due antiche basiliche. Dentro è a croce latina, a tre navate, con un soffitto a cassettoni di legno intagliato e dorato.","d":"In facciata, a destra","foto":{"u":"img/9e227b1ac73b.jpg","alt":"Il portale gotico del Duomo di Napoli","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Il portale gotico del Duomo, in facciata."}},{"t":"La Cappella del Tesoro","x":"Più che una cappella è una chiesa nella chiesa: la terza cappella a destra, barocca, della prima metà del Seicento, a croce greca, con una cupola a doppia calotta. Si entra superando il grande cancello di bronzo di Cosimo Fanzago.\n\nQui sono custoditi il busto d'argento di San Gennaro e le ampolle con il suo sangue: ogni anno la città attende il «miracolo» della liquefazione, e la folla riempie la cattedrale.\n\nIl tesoro donato al santo nei secoli (gioielli, argenti, opere d'arte) si visita nel Museo del Tesoro di San Gennaro, con ingresso dall'esterno del Duomo.","d":"Terza cappella a destra","foto":{"u":"img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro affrescata con il Paradiso","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Alza gli occhi: nella cupola della Cappella del Tesoro c'è il Paradiso dipinto da Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Quando Carlo d'Angiò fece costruire il Duomo, una delle due basiliche antiche che sorgevano qui fu demolita, l'altra fu conservata come cappella laterale: è Santa Restituta, nella navata sinistra.\n\nLa tradizione la vuole voluta dall'imperatore Costantino: è una delle testimonianze più importanti dell'arte paleocristiana a Napoli. Ha tre navate e ospita opere di Luca Giordano e sculture del Trecento.\n\nDa qui si scende all'area archeologica sotto la cattedrale, dove si vedono strati di storia uno sopra l'altro: resti greco-romani e paleocristiani.","d":"Nella navata sinistra","foto":{"u":"img/5abf53aec271.jpg","alt":"Un mosaico con la Madonna in trono nella basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico con la Madonna in trono, dentro Santa Restituta: la basilica più antica, conservata come cappella del Duomo."}},{"t":"Il battistero di San Giovanni in Fonte","x":"A destra dell'abside, un piccolo ambiente con una storia immensa: il Battistero di San Giovanni in Fonte, considerato il più antico d'Occidente.\n\nFermati qualche minuto in silenzio: sei in uno dei luoghi cristiani più antichi d'Europa ancora in piedi, dai tempi in cui la Napoli romana diventava cristiana.\n\nIl battistero e l'area archeologica sotto il Duomo raccontano insieme i primi secoli della città cristiana.","d":"A destra dell'abside","foto":{"u":"img/994ed22c6902.jpg","alt":"L'interno del Battistero di San Giovanni in Fonte con la vasca battesimale al centro","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Il Battistero di San Giovanni in Fonte: al centro del pavimento, la vasca battesimale."}},{"t":"Il Succorpo","x":"Sotto l'altare maggiore c'è la cripta del Duomo, la Cappella del Succorpo, detta anche Cappella Carafa: la volle il cardinale Oliviero Carafa per custodirvi le reliquie di San Gennaro insieme a quelle di altri 51 santi.\n\nL'architetto Giovan Tommaso Malvito la pensò come una piccola basilica: tre navate divise da colonne antiche con capitelli ionici, nicchie ai lati e una cappella in fondo.\n\nMarmi bianchi, luce tenue e silenzio: è il Rinascimento dentro la cattedrale gotica.","d":"Sotto l'altare maggiore","foto":{"u":"img/876cd614ab8d.jpg","alt":"L'interno del Succorpo di San Gennaro con colonne di marmo e pavimento a intarsi","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Il Succorpo, sotto il presbiterio del Duomo: colonne e pavimento di marmo, e in fondo l'altare con le reliquie di San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Complesso dei Girolamini","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Davanti al Duomo, una chiesa barocca detta «Domus Aurea», due chiostri, una quadreria e la più antica biblioteca pubblica di Napoli.","rac":"Su via Duomo, di fronte alla cattedrale, il complesso dei Girolamini nacque nel Cinquecento per i padri dell'Oratorio di san Filippo Neri, detti Girolamini. È monumento nazionale dal 1866 e riunisce la chiesa, i chiostri, la quadreria e la biblioteca.\n\nLa chiesa, dedicata a san Filippo Neri, è nota come «Domus Aurea» per la decorazione barocca in oro. La quadreria è considerata la prima pinacoteca pubblica della città e conserva opere di maestri come Battistello Caracciolo, Jusepe de Ribera e Luca Giordano. La biblioteca, aperta al pubblico nella seconda metà del Cinquecento, è la più antica biblioteca pubblica di Napoli.\n\nIl complesso è stato interessato da una lunga stagione di restauri: la chiesa è stata riaperta il 21 marzo 2024 e, secondo fonti giornalistiche, nel 2026 sono state riaperte anche la Sala Camino e la Sala Vico della biblioteca. Le riaperture sono progressive: non tutti gli ambienti sono visitabili nello stesso periodo.","con":"Prima di venire controlla sul sito ufficiale cosa è aperto: chiesa, chiostri, quadreria e biblioteca hanno orari diversi e possono cambiare.","acc":"","foto":{"u":"img/196f89f190a5.jpg","alt":"La facciata dei Girolamini illuminata di sera","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"La facciata della chiesa dei Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Chiesa. Lunedì chiuso."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Chiesa e festivi."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"La chiesa «Domus Aurea»","x":"La chiesa di San Filippo Neri è detta Domus Aurea, la «casa d'oro», per la ricca decorazione barocca. È uno dei luoghi di culto più importanti della città.","d":"Nella chiesa, con ingresso da via Duomo","foto":{"u":"img/82e6e36bce0c.jpg","alt":"La navata della chiesa dei Girolamini con le decorazioni dorate","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"La chiesa dei Girolamini, la «Domus Aurea» per la ricca decorazione."}},{"t":"La quadreria","x":"È considerata la prima pinacoteca pubblica di Napoli. Raccoglie dipinti di maestri del Seicento come Battistello Caracciolo, Jusepe de Ribera e Luca Giordano. Si raggiunge dal chiostro degli Aranci, al primo piano del convento.","d":"Primo piano del convento, dal chiostro degli Aranci","foto":{"u":"img/ca542321bfc6.jpg","alt":"Testa di santa dipinta da Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Una tela della Quadreria dei Girolamini: testa di santa di Massimo Stanzione (Seicento)."}},{"t":"La biblioteca più antica di Napoli","x":"La biblioteca è la più antica biblioteca pubblica della città e la seconda d'Italia dopo la Malatestiana di Cesena. Specializzata in teologia, filosofia, storia della Chiesa e musica sacra, custodisce circa 159.700 volumi antichi e moderni. Tra le sale storiche c'è quella dedicata a Giambattista Vico, che qui studiò.","d":"Ingresso da via Duomo 114","foto":{"u":"img/33028b7b5461.jpg","alt":"La sala della Biblioteca dei Girolamini con gli scaffali di legno","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"La sala della Biblioteca dei Girolamini, la più antica biblioteca pubblica di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"La Madonna con la pistola di Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Madonna di Banksy con una pistola al posto dell'aureola, protetta da un vetro, nel cuore del decumano maggiore.","rac":"Banksy arrivò a Napoli nel 2010: era la prima volta che lavorava in Italia. Con gli stencil, probabilmente nella stessa notte, lasciò due opere in punti molto frequentati del centro, entrambe con un'immagine religiosa e un messaggio diretto. Una, in via Benedetto Croce, è stata coperta da un altro artista; questa è sopravvissuta, ed è per questo indicata come l'unico murale di Banksy in Italia.\n\nAccanto all'opera c'è un'antica edicola votiva con la Madonna col Bambino: le due immagini, vicine, sembrano parlarsi.\n\nIn piazzetta dei Girolamini, su una facciata del decumano maggiore, Banksy ha lasciato una Madonna con una pistola al posto dell'aureola. Oggi è protetta da un vetro. Il portale turistico ufficiale della città la include nel suo itinerario dedicato alla street art del centro storico.","con":"Alza gli occhi: l'opera è sopra il livello della strada, dietro un vetro.","acc":"","foto":{"u":"img/f88e2da6bb84.jpg","alt":"Il volto della Madonna di Banksy in stencil bianco su fondo scuro","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Il volto della Madonna di Banksy: lo stencil bianco su fondo scuro, da vicino."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Madonna con la pistola","x":"Guarda il muro: bianco su fondo nero, fatto con lo stencil, una Madonna con le braccia aperte verso il cielo. Ma al posto dell'aureola, sopra la sua testa, c'è una pistola.\n\nBanksy, l'artista di strada inglese di Bristol, la dipinse a Napoli nel 2010, probabilmente di notte e in pochi secondi, con i suoi stencil. È stata la prima opera di Banksy in Italia.\n\nIl messaggio non è spiegato: a uno sguardo distratto sembra un'immagine sacra, ma non lo è. Sacro e violenza, fede e armi: ognuno la legge a modo suo.","d":"Sul muro della piazzetta","foto":{"u":"img/07dcd96f1c5b.jpg","alt":"La Madonna in stencil di Banksy sul muro di piazza Gerolomini, vista da vicino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Madonna di Banksy, in stencil bianco e nero su un angolo del muro di piazza Gerolomini."}},{"t":"L'edicola accanto","x":"Ora guarda accanto all'opera: c'è una piccola edicola votiva con la Madonna col Bambino, una di quelle che si trovano in tante strade di Napoli, dipinta chissà quanti secoli prima.\n\nLe due Madonne, una vicina all'altra, sembrano guardarsi: quella antica sembra osservare perplessa quella di Banksy. È questo dialogo a rendere l'opera così napoletana.\n\nFai un passo indietro e guardale insieme: è la foto più bella da portare a casa.","d":"Subito accanto all'opera","foto":{"u":"img/3a7788eec560.jpg","alt":"La Madonna di Banksy sul muro e, accanto, l'edicola votiva con la Madonna col Bambino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A sinistra la Madonna di Banksy, a destra, appesa al muro, l'edicola con la Madonna col Bambino: le due immagini sacre una accanto all'altra."}},{"t":"Un Banksy sotto vetro","x":"Nel 2010 Banksy lasciò a Napoli due opere, probabilmente nella stessa notte. L'altra, in via Benedetto Croce, prendeva in giro il consumismo: rifaceva l'«Estasi della beata Ludovica Albertoni» di Bernini, ma la santa appariva in estasi dopo un pasto da fast food.\n\nQuell'opera è stata coperta da un altro artista di strada napoletano, che non sapeva che cosa stesse cancellando. Per questo il FAI indica questa di piazza Gerolomini come l'unico murale di Banksy in Italia.\n\nOggi è protetta da una teca di plexiglass, che la difende almeno dai vandali.","d":"Davanti all'opera","foto":null},{"t":"Come arrivarci e cosa fotografare","x":"L'opera è su un muro della piccola piazza Gerolomini, affacciata su via dei Tribunali.\n\nLa teca protegge l'opera ma può riflettere la luce: per una foto senza riflessi prova a metterti leggermente di lato. Il posto è sempre accessibile e gratuito.\n\nDa qui la Madonna di via Benedetto Croce, l'opera perduta, era a nove minuti a piedi, lungo il percorso che passa da Sansevero, Napoli Sotterranea e San Gregorio Armeno.","d":"Piazza Gerolomini, su via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini e le mura greche","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una piazza di caffè e studenti con un affaccio sul passato: dietro una balaustra si vedono le mura greche di Neapolis.","rac":"Piazza Bellini si trova sul decumano maggiore ed è una delle più frequentate del centro storico, per i tanti locali che vi si affacciano. Basta guardare in basso, oltre la balaustra, per vedere in un'area ribassata un tratto delle mura della Neapolis greca, risalenti al IV secolo a.C. Furono scoperte nel 1954.\n\nA pochi passi c'è il Conservatorio di San Pietro a Majella.","con":"Dieci minuti bastano: guarda le mura dall'alto e poi concediti una pausa in uno dei locali della piazza.","acc":"","foto":{"u":"img/f745cf0fb0f8.jpg","alt":"Piazza Bellini con i suoi tavolini e il verde","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, il ritrovo del centro storico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Le mura greche","x":"Sotto il livello della piazza si vedono i resti delle mura difensive della Neapolis greca, in blocchi di tufo. Furono scoperte nel 1954 e fanno parte del sistema di fortificazioni della città antica. Non sono una ricostruzione: sono pietre originali.","d":"Oltre la balaustra, nell'area ribassata","foto":{"u":"img/4801d5111d9f.jpg","alt":"I blocchi di tufo delle mura greche sotto il livello della piazza","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Le mura greche di Neapolis in Piazza Bellini: blocchi di tufo originali."}},{"t":"La piazza oggi","x":"Intorno alle mura ci sono caffè, librerie e locali frequentati da studenti e abitanti. È uno dei luoghi del centro storico dove l'antico e la vita di tutti i giorni stanno più vicini.","d":"Intorno alla piazza","foto":{"u":"img/133ed975e61b.jpg","alt":"Piazza Bellini con alberi, palazzi e tavolini","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"Piazza Bellini oggi, tra caffè e librerie."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port’Alba e la via dei librai","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una porta del 1625 e, oltre l'arco, un vicolo di librai e negozi di musica che porta a Piazza Bellini.","rac":"Port'Alba è una delle antiche porte della città. Si apre in un angolo di Piazza Dante e prende il nome dal viceré spagnolo Antonio Álvarez de Toledo, duca d'Alba, che la fece erigere nel 1625 al posto di un'apertura provvisoria, per facilitare il passaggio da un lato all'altro della città. L'aspetto attuale si deve ai lavori di fine Settecento voluti da Ferdinando IV di Borbone.\n\nOltre la porta c'è via Port'Alba, un vicolo pedonale noto per le librerie e i negozi di musica, che porta fino a Piazza Bellini.","con":"Passa sotto l'arco e curiosa tra le bancarelle dei libri: è il modo più semplice per andare da Piazza Dante a Piazza Bellini.","acc":"","foto":{"u":"img/a93f8fe0f583.jpg","alt":"L'arco di Port'Alba, ingresso storico al centro antico","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, la porta cinquecentesca sul centro antico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"La porta del 1625","x":"La porta fu eretta nel 1625 per volere del duca d'Alba, viceré spagnolo. Sullo stemma si riconoscono quelli del re Filippo III, della città di Napoli e del viceré. Oggi la porta è in parte nascosta dal colonnato di Piazza Dante.","d":"In un angolo di Piazza Dante","foto":{"u":"img/1da787571261.jpg","alt":"La porta di Port'Alba con lo stemma","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, la porta del 1625 voluta dal duca d'Alba."}},{"t":"La via dei librai","x":"Il vicolo che attraversa la porta è famoso per il mercato dei libri: librerie, bancarelle e negozi di strumenti musicali, fino a Piazza Bellini.","d":"Oltre la porta, verso Piazza Bellini","foto":null}],"gal":[],"leg":"Una leggenda racconta di una giovane di nome Maria, accusata di stregoneria ai tempi dell'Inquisizione spagnola e lasciata morire in una gabbia appesa alla porta.","fc":null,"col":null},{"id":22,"s":"mann","n":"Museo Archeologico Nazionale (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"Uno dei più grandi musei archeologici del mondo: i tesori di Pompei ed Ercolano, la collezione Farnese e il celebre Mosaico di Alessandro.","rac":"Il Museo Archeologico Nazionale ha sede nel Palazzo degli Studi, costruito nel 1585. Nel 1777 re Ferdinando IV di Borbone vi trasferì la collezione Farnese, ereditata dalla madre Elisabetta Farnese. Con il ritorno dei Borbone nel 1816 divenne Real Museo Borbonico; dopo l'Unità d'Italia diventò Museo Nazionale. I dipinti furono trasferiti a Capodimonte nel 1957, e da allora è un museo solo di antichità.\n\nEspone circa 18.000 reperti: le collezioni vesuviane (affreschi, mosaici, oggetti di vita quotidiana, il plastico di Pompei, la Villa dei Papiri), le sculture e le gemme Farnese, il Gabinetto Segreto, la numismatica e una delle più importanti collezioni egizie al mondo.\n\nIl pezzo più celebre è il Mosaico di Alessandro, trovato nel 1831 nella Casa del Fauno a Pompei: raffigura la battaglia di Isso, tra Alessandro Magno e Dario III, ed è composto da circa un milione e mezzo di tessere.","con":"Se hai poco tempo, scegli tre cose: il Mosaico di Alessandro, l'Ercole Farnese e il Gabinetto Segreto. Per vedere tutto servono almeno due o tre ore. Controlla gli orari prima di venire.","acc":"","foto":{"u":"img/fee0195f3cee.jpg","alt":"Affresco pompeiano esposto al Museo Archeologico Nazionale","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Un affresco pompeiano esposto al MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Biglietteria fino alle 18:30"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"Il Mosaico di Alessandro","x":"Trovato nel 1831 nella Casa del Fauno a Pompei, il grande mosaico misura circa 5,82 per 3,13 metri e ha circa un milione e mezzo di tessere. Mostra la battaglia di Isso (333 a.C.) tra Alessandro Magno e Dario III di Persia.","d":"Al piano ammezzato, nella sezione dei mosaici di Pompei","foto":{"u":"img/3f4dd11ad219.jpg","alt":"Il grande mosaico della battaglia tra Alessandro e Dario","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"Il Mosaico di Alessandro, dalla Casa del Fauno di Pompei."}},{"t":"La collezione Farnese","x":"Raccolta dalla famiglia Farnese per il suo palazzo di Roma, comprende statue monumentali come l'Ercole Farnese, alto circa tre metri e trovato alle Terme di Caracalla, e il Toro Farnese.","d":"Al piano terra","foto":{"u":"img/714ee8ec5fd4.jpg","alt":"La statua dell'Ercole Farnese appoggiato alla clava","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"L'Ercole Farnese, trovato alle Terme di Caracalla."}},{"t":"Il Gabinetto Segreto","x":"Raccoglie opere di arte erotica trovate a Pompei ed Ercolano. Ha un ingresso separato e spesso richiede una prenotazione oraria: chiedi in biglietteria.","d":"Al piano ammezzato","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, museo d’arte contemporanea","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Un palazzo ristrutturato dall'architetto Álvaro Siza che ospita opere di Clemente, Kapoor, Serra, Horn e altri maestri dell'arte contemporanea.","rac":"Il MADRE, museo d'arte contemporanea Donnaregina, è nel Palazzo Donnaregina, a pochi passi dal Duomo e dal Tesoro di San Gennaro. L'edificio fu ristrutturato dall'architetto portoghese Álvaro Siza e il museo, gestito dalla Fondazione Donnaregina per le arti contemporanee, è stato inaugurato nel 2005.\n\nIl primo piano è dedicato a opere realizzate apposta per le sale da artisti come Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long e Mimmo Paladino. La collezione comprende anche Richard Serra, Sol LeWitt e Jeff Koons, e il museo organizza mostre temporanee. È un contrasto voluto con la Napoli antica che lo circonda.","con":"Cerca «Spirits» di Rebecca Horn: sono copie in ghisa dei teschi del Cimitero delle Fontanelle. Il museo è chiuso il martedì e, per lavori, alcune sale del secondo piano sono temporaneamente chiuse: controlla sul sito prima di venire.","acc":"","foto":{"u":"img/58482274a167.jpg","alt":"Il cortile bianco del museo Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"Il museo Madre, arte contemporanea a Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Chiuso il martedì. L'ultimo ingresso è un'ora prima della chiusura."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Domenica. L'ultimo ingresso è un'ora prima della chiusura."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"«Ave Ovo» di Francesco Clemente","x":"Un pavimento in maiolica e un affresco monumentale, creati nel 2005 per il museo, occupano due sale su due piani.","d":"Nelle sale dedicate a Clemente","foto":null},{"t":"«Spirits» di Rebecca Horn","x":"L'artista ha riprodotto in ghisa i teschi del Cimitero delle Fontanelle, le «capuzzelle» napoletane. Un legame tra arte contemporanea e Napoli popolare.","d":"Nella sala di Rebecca Horn","foto":null},{"t":"L'architettura di Siza","x":"Siza ha ristrutturato i tre piani del palazzo, mantenendo l'impianto storico e inserendo spazi moderni per le grandi installazioni.","d":"In tutto il museo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Stazione Toledo della metropolitana","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fermata della Linea 1 considerata una delle più belle d'Europa: mosaici, ceramiche blu e il «Cratere di luce» di Robert Wilson.","rac":"La stazione Toledo fa parte delle «Stazioni dell'Arte», il progetto che ha affidato ad architetti e artisti la progettazione delle fermate della Linea 1, con oltre 250 opere. Fu progettata dall'architetto catalano Oscar Tusquets Blanca e inaugurata il 17 settembre 2012. L'ingresso, in via Diaz, ha tre strutture esagonali rivestite di piastrelle blu e ocra, che portano la luce nell'atrio.\n\nScendendo si incontrano onde in rilievo disegnate da Tusquets, le opere di Robert Wilson (tra cui «Crater de luz», un cratere di luce) e i mosaici di William Kentridge. La stazione è stata più volte indicata tra le più belle d'Europa.\n\nPer vederla basta prendere la metropolitana: serve un biglietto per scendere ai binari.","con":"Scendi fino al piano più profondo e guarda in alto: è lì che la luce del Cratere fa l'effetto migliore. Per entrare serve il biglietto; controlla gli orari del servizio sul sito ANM.","acc":"","foto":{"u":"img/818cc292e648.jpg","alt":"La banchina della stazione Toledo, nel sottosuolo","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"La banchina della stazione Toledo."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Orario di servizio della Linea 1: dal primo all'ultimo treno."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Orario di servizio della Linea 1: dal primo all'ultimo treno."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Il «Crater de luz» di Robert Wilson","x":"Un cratere di luce, opera di Robert Wilson, firma l'identità della stazione. L'opera cambia con la luce e dà alla discesa un effetto quasi teatrale.","d":"Nei piani sotterranei della stazione","foto":null},{"t":"I mosaici di William Kentridge","x":"Lungo il percorso si vedono mosaici dell'artista sudafricano William Kentridge, che fanno parte del programma delle Stazioni dell'Arte.","d":"Sul percorso verso i binari","foto":null},{"t":"L'ingresso blu di via Diaz","x":"Tre strutture esagonali rivestite di piastrelle blu e ocra, che lasciano entrare la luce nell'atrio. I due colori sono il filo conduttore di tutta la stazione.","d":"All'ingresso di via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d’Italia, l’ultimo Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"A sei minuti da Ceraldi, in via Toledo, l'ultimo quadro dipinto da Caravaggio, poche settimane prima di morire: il Martirio di sant'Orsola.","rac":"Le Gallerie d'Italia di Intesa Sanpaolo sono in via Toledo 177, nel palazzo che fu sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento; il nuovo allestimento è dell'architetto Michele De Lucchi. Il museo ha aperto qui nel 2022 e ha preso il posto del vicino Palazzo Zevallos Stigliano.\n\nIl capolavoro della collezione è il Martirio di sant'Orsola di Caravaggio, del 1610, considerato l'ultimo quadro del pittore. Intorno ci sono tre percorsi: l'arte napoletana dal Seicento al Novecento, una raccolta di ceramiche attiche e della Magna Grecia e una selezione di opere del Novecento.","con":"Biglietto intero 8 euro, ridotto 4 euro; gratis per gli under 26 e per tutti la prima domenica del mese. Chiuso il lunedì; ultimo ingresso un'ora prima della chiusura.","acc":"","foto":{"u":"img/830ac6c4ce8e.jpg","alt":"Una sala delle Gallerie d'Italia con quadri alle pareti gialle","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala delle Gallerie d'Italia a Napoli, con le tele del Seicento."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Il Martirio di sant'Orsola","x":"È una scena stretta e buia, quasi senza sfondo: siamo nella tenda di Attila, re degli Unni. Orsola, una principessa, lo ha rifiutato, e lui le ha appena scoccato una freccia nel petto. Lei piega la testa verso la freccia; tre uomini accorrono a sorreggerla. Il re sembra già pentito del suo gesto.\n\nCerca il volto alle spalle della santa: è lo stesso Caravaggio, che si è dipinto tra i testimoni. E osserva la mano che si allunga tra la santa e il re, come per fermare la freccia: è riapparsa durante il restauro del 2003-2004.\n\nLo commissionò il principe genovese Marcantonio Doria, la cui famiglia aveva sant'Orsola come protettrice. È il quadro più tardo di Caravaggio che conosciamo: fu finito nel maggio 1610, poco più di un mese prima della sua morte.","d":"Nella sala dedicata a Caravaggio","foto":{"u":"img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}},{"t":"Il quadro messo al sole","x":"Caravaggio dipinse il quadro in fretta, forse perché stava per partire verso Roma per ottenere il perdono del papa. L'incaricato dei Doria a Napoli, Lanfranco Massa, fece consegnare la tela quando la vernice non era ancora asciutta e, per farla asciugare prima, la mise al sole: la vernice, stesa molto spessa, si rovinò. Lo raccontò lui stesso in una lettera di maggio 1610.\n\nIl quadro arrivò a Genova, poi passò di erede in erede, finì in una villa di Eboli e fu attribuito ad altri pittori. Solo negli anni Ottanta del Novecento il ritrovamento della lettera di Massa ha confermato con certezza che è di Caravaggio.\n\nNel 2025 un nuovo intervento di restauro ha riportato alla luce tre teste che il tempo aveva fatto sparire.","d":"Davanti alla tela","foto":{"u":"img/6a999eeecae6.jpg","alt":"La tela di Caravaggio esposta in una sala di Palazzo Zevallos, con il soffitto decorato","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Il Martirio di sant'Orsola esposto in una sala di Palazzo Zevallos Stigliano, la sede delle Gallerie d'Italia."}},{"t":"Il palazzo del Banco di Napoli","x":"Prima di salire alle sale, guardati intorno: sei nel palazzo che fu la sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento.\n\nL'architetto Michele De Lucchi lo ha trasformato in museo con un allestimento moderno: le grandi sale della banca oggi ospitano tre percorsi, dall'arte napoletana del Seicento al Novecento, passando per una ricca collezione di vasi greci e della Magna Grecia.\n\nIl museo ha aperto nel 2022 e continua l'attività di Palazzo Zevallos Stigliano, aperto dal 1999 al 2022 a pochi passi da qui.","d":"Entrando, nel salone","foto":{"u":"img/caeaa6cb359b.jpg","alt":"La facciata in pietra del Palazzo del Banco di Napoli su via Toledo, con la bandiera europea","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Il Palazzo del Banco di Napoli su via Toledo, dove hanno sede le Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Quartieri Spagnoli","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Un reticolo di vicoli stretti nato nel Cinquecento per i soldati spagnoli, oggi uno dei quartieri più vivi e fotografati di Napoli.","rac":"I Quartieri Spagnoli nacquero nel 1536 per volere del viceré spagnolo Pedro de Toledo, per ospitare le guarnigioni destinate a mantenere l'ordine. La strada principale, via Toledo, porta il suo nome. Il quartiere è una griglia di vicoli stretti tra via Toledo, il corso Vittorio Emanuele e Monte Echia, e comprende le zone di Avvocata, Montecalvario e San Ferdinando.\n\nL'origine spagnola vive ancora nei nomi delle strade, come via della Trinità degli Spagnoli, dove si trova la chiesa di Santa Maria del Pilar. Nei vicoli ci sono botteghe, panni stesi, altarini e molti murales.\n\nIl più famoso è il murale di Maradona in Largo Maradona, in via Emanuele De Deo: lo realizzò nel 1990 Mario Filardi e negli anni è stato restaurato più volte. È una tappa del giro «Il mare e i castelli», con una scheda propria.","con":"Parti da Piazza Carità e addentrati nei vicoli di giorno. Come in ogni zona affollata, tieni borsa e telefono a portata di mano. Cammina piano: i dettagli stanno nei portoni e nei murales.","acc":"","foto":{"u":"img/61b008cbd17c.jpg","alt":"Un vicolo dei Quartieri Spagnoli con il murale di Maradona e le bandiere","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"Nei Quartieri Spagnoli, il murale di Maradona tra le bandiere."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"La griglia dei vicoli","x":"Il piano urbanistico è una griglia regolare di vicoli stretti, nata per alloggiare i soldati spagnoli. Camminando si vedono panni stesi, altarini e botteghe: la vita di quartiere si svolge in strada.","d":"Nei vicoli a ovest di via Toledo","foto":{"u":"img/488b6354ea64.jpg","alt":"Un vicolo stretto dei Quartieri Spagnoli","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"Uno dei vicoli dritti e stretti della griglia dei Quartieri Spagnoli."}},{"t":"Il murale di Maradona e Largo Maradona","x":"In via Emanuele De Deo, un vecchio parcheggio è diventato Largo Maradona. Il murale del 1990 di Mario Filardi è stato poi restaurato dall'artista argentino Bosoletti, che ha realizzato accanto l'Iside velata.","d":"In via Emanuele De Deo","foto":null},{"t":"La chiesa di Santa Maria del Pilar","x":"In via della Trinità degli Spagnoli si trova la chiesa dedicata dagli spagnoli a Santa Maria del Pilar: una traccia dell'origine spagnola del quartiere.","d":"In via della Trinità degli Spagnoli","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"Il murale di Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"Il murale amatissimo dei Quartieri Spagnoli e il largo che dal 2020 è diventato un santuario laico per Diego.","rac":"Il murale ritrae Maradona con la maglia numero 10 del Napoli degli anni Ottanta, lo scudetto sul petto e la fascia di capitano al braccio: fu dipinto per festeggiare il secondo scudetto, quello del 1989-90, a cui Maradona contribuì con 16 gol in 28 partite. Era arrivato dal Barcellona nel 1984 e rimase a Napoli fino al 1991.\n\nL'autore, Mario Filardi, aveva solo 23 anni: dipingeva per passione e di mestiere faceva il cameriere, viaggiando per il mondo.\n\nIl murale di Maradona fu dipinto nel 1990 da Mario Filardi. Negli anni Novanta l'apertura di una finestra nel muro ne cancellò il volto e il dipinto sbiadì quasi del tutto; fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'artista argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, ha preso il suo nome e si è riempito di altarini, bandiere e fotografie.","con":"Nelle ore di punta è affollatissimo: la mattina presto è più facile vederlo con calma.","acc":"","foto":{"u":"img/a2c6b2a82ec4.jpg","alt":"Il grande murale di Maradona sulla facciata di un palazzo, con la folla sotto","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Il murale dipinto nel 1990 da Mario Filardi. Il volto di oggi è quello ridipinto nel 2017 dall'artista argentino Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"Il murale e il suo autore","x":"Il murale del 1990 è opera di Mario Filardi, che dipingeva per passione. Fu restaurato più volte: nel 2017 l'artista argentino Francisco Bosoletti ne ridipinse il volto.","d":"Sulla facciata in via Emanuele De Deo","foto":{"u":"img/3a0eadc61dcc.jpg","alt":"Il volto di Maradona dipinto sulla facciata di un palazzo","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"Il murale di Maradona in via Emanuele De Deo, con il volto ridipinto nel 2017 da Francisco Bosoletti."}},{"t":"Il largo dal 25 novembre 2020","x":"Dopo la morte di Maradona il largo, prima detto «degli artisti», ha preso il suo nome ed è diventato un luogo di altarini, bandiere e fotografie.","d":"Nello spiazzo davanti al murale","foto":{"u":"img/76bca69c23a8.jpg","alt":"Il largo davanti al murale di Maradona pieno di persone","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: bandiere, altarini e visitatori davanti al murale."}}],"gal":[{"u":"img/0094144dd2dd.jpg","alt":"La targa di Largo Maradona con un busto e le bandiere","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La targa del largo: dopo la morte di Diego, nel 2020, il largo degli artisti ha preso il suo nome."},{"u":"img/550f6edc4b91.jpg","alt":"Un altarino con foto di Maradona e ricordi","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un altarino dedicato a Maradona: in città ce ne sono tanti, con foto e ricordi lasciati dai tifosi."},{"u":"img/679687d3070c.jpg","alt":"Maradona dipinto con l'aureola accanto a una piccola edicola","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con l'aureola e la sua edicola votiva, dipinto in zona San Lorenzo."},{"u":"img/80d74e92279d.jpg","alt":"Un'edicola votiva con il ritratto di Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un'edicola votiva per Maradona, come quelle dei santi."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galleria Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una galleria a croce con una cupola di ferro e vetro alta circa 56 metri, di fronte al Teatro di San Carlo.","rac":"La Galleria Umberto I fu costruita tra il 1887 e il 1890 durante il risanamento di Napoli, il grande piano di ricostruzione urbana seguito all'epidemia di colera. L'architetto Emanuele Rocco la progettò a croce, ispirandosi alla Galleria Vittorio Emanuele II di Milano. Prende il nome da Umberto I, re d'Italia all'epoca della costruzione.\n\nLe quattro braccia si incontrano sotto una cupola di ferro e vetro, sorretta da sedici costoloni. Sotto la cupola il pavimento è un mosaico a stella. Nella galleria si trovano negozi, caffè e, ai piani superiori, appartamenti: era pensata per unire attività commerciali e vita sociale.\n\nSi trova di fronte al Teatro di San Carlo, vicino a Piazza del Plebiscito.","con":"Fermati sotto la cupola e alza lo sguardo: è il punto migliore per vedere il ferro e il vetro. È un luogo di passaggio, con ingresso libero.","acc":"","foto":{"u":"img/aa17d08c5d1f.jpg","alt":"Un ingresso decorato della Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Un ingresso della Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"La cupola di ferro e vetro","x":"Le quattro braccia della galleria si incontrano sotto una cupola di ferro e vetro, sorretta da sedici costoloni. Di giorno la luce entra da ogni lato; la sera l'illuminazione fa risaltare la struttura.","d":"Al centro della galleria","foto":{"u":"img/5caa008a8527.jpg","alt":"La cupola di ferro e vetro della Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"La cupola di ferro e vetro, dove si incontrano le quattro braccia della galleria."}},{"t":"Il mosaico a stella","x":"Sotto la cupola il pavimento è un mosaico a stella a dodici punte, nei colori crema, terracotta e grigio. Si riconosce guardando in basso, nel punto d'incontro delle braccia.","d":"Sul pavimento, sotto la cupola","foto":null},{"t":"Il risanamento di Napoli","x":"La galleria nacque come simbolo di una città che voleva modernizzarsi dopo l'epidemia di colera. Faceva parte del risanamento, il grande progetto di demolizione e ricostruzione della città, e voleva competere con la Galleria Vittorio Emanuele II di Milano.","d":"Entrando da via San Carlo","foto":{"u":"img/df75ec70de03.jpg","alt":"Statue e la scritta ANNO MDCCCXC sulla galleria","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Anno MDCCCXC»: la data di completamento, scritta sulla galleria simbolo del risanamento."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Teatro di San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"Il più antico teatro d'opera ancora in attività in Europa: inaugurato nel 1737, prima della Scala e della Fenice.","rac":"Il Teatro di San Carlo fu costruito per volere di Carlo III di Borbone e inaugurato il 4 novembre 1737, giorno dell'onomastico del re. Il re voleva per Napoli un teatro più grande del vecchio San Bartolomeo. Fu aperto 41 anni prima della Scala di Milano e 55 prima della Fenice di Venezia: per questo è considerato il più antico teatro d'opera ancora attivo. Il progetto fu affidato a Giovanni Antonio Medrano e Angelo Carasale.\n\nSul suo palcoscenico sono passati compositori come Rossini, Donizetti, Bellini e Verdi. Il teatro è inserito nel Patrimonio UNESCO insieme al centro storico.\n\nSi visita con tour guidati in italiano e in inglese, di circa mezz'ora; nello stesso complesso c'è anche il MeMus, il museo che racconta la storia del teatro e dell'opera.","con":"Le visite dipendono dalle prove e dagli spettacoli: controlla il sito ufficiale e, se puoi, prenota. Se ami l'opera, il modo migliore per conoscerlo è assistere a uno spettacolo.","acc":"","foto":{"u":"img/abc91c247fbf.jpg","alt":"La facciata del Teatro San Carlo con le colonne","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"La facciata del Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Visite guidate di circa 30 minuti alle 10:30, 11:30, 12:30, 14:30, 15:30 e 16:30. Prenotazione consigliata."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"La sala e il Real Teatro","x":"La sala a ferro di cavallo è il cuore del teatro: palchi in file sovrapposte e un palco reale. Il San Carlo è famoso anche per l'acustica. Nelle visite guidate in genere si può fotografare la sala e il foyer.","d":"Nella sala, con la visita guidata","foto":{"u":"img/61fb4f2a6ee4.jpg","alt":"Un'incisione del Settecento con una festa da ballo nel teatro","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Una festa da ballo nel Real Teatro di San Carlo, in un'incisione del 1749."}},{"t":"Il MeMus","x":"Il MeMus, inaugurato nel 2011, è il museo e archivio storico del teatro. Ripercorre la storia dell'edificio e dell'opera italiana con quadri, fotografie, strumenti musicali e costumi.","d":"Nello stesso complesso del teatro","foto":{"u":"img/44d70b37ca4d.jpg","alt":"Costumi di scena esposti al MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Costumi di scena di un'opera di Paisiello esposti al MeMus."}},{"t":"Il primo teatro d'opera d'Europa","x":"Inaugurato nel 1737, è più antico della Scala di Milano (1778) e della Fenice di Venezia (1792). Per questo è considerato il teatro d'opera più antico ancora in attività.","d":"Davanti alla facciata, su via San Carlo","foto":{"u":"img/5458a9109987.jpg","alt":"La scritta Real Teatro di S. Carlo sulla facciata","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"«Real Teatro di S. Carlo», sulla facciata del teatro inaugurato nel 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"La piazza più grande di Napoli: da un lato il Palazzo Reale, dall'altro un colonnato che abbraccia la basilica di San Francesco di Paola.","rac":"Ai piedi della collina di Pizzofalcone, Piazza del Plebiscito è una delle piazze più ampie e monumentali della città. Fino al 1817 si chiamava Largo di Palazzo. Nel 1809 Gioacchino Murat fece demolire i conventi della zona e progettare un foro con un colonnato semicircolare. I lavori si interruppero con la fine del suo regno e furono ripresi da Ferdinando I, che volle costruire una chiesa in adempimento a un voto a san Francesco di Paola: la basilica fu eretta tra il 1817 e il 1836, ispirata al Pantheon di Roma.\n\nLa piazza prese il nome attuale dopo il plebiscito del 21 ottobre 1860, che sancì l'annessione del Regno delle Due Sicilie al Regno di Sardegna. Davanti alla basilica ci sono due statue equestri: Carlo III di Borbone, opera di Antonio Canova, e Ferdinando I.\n\nOggi è il luogo di concerti, cerimonie e feste cittadine.","con":"Arriva la mattina presto: la luce radente illumina il colonnato e la piazza è quasi vuota. Dopo, entra nella basilica e fai il giro verso il Palazzo Reale.","acc":"","foto":{"u":"img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito con un leone e la chiesa di San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito e, sullo sfondo, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"Il colonnato e la basilica di San Francesco di Paola","x":"Il colonnato semicircolare nacque con Murat. La basilica è un edificio neoclassico con una cupola centrale alta 53 metri, ispirata al Pantheon. All'interno l'altare maggiore, ricco di pietre preziose e lapislazzuli, fu disegnato da Ferdinando Fuga nel 1751 e portato qui nel 1835 dalla chiesa dei Santi Apostoli.","d":"Sul lato ovest della piazza","foto":{"u":"img/82ad7240a133.jpg","alt":"L'interno circolare della basilica di San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"L'interno della basilica di San Francesco di Paola, ispirata al Pantheon."}},{"t":"Le statue equestri","x":"Le due statue di bronzo raffigurano Carlo III di Borbone, capostipite della casata, e suo figlio Ferdinando I. Si trovano di fronte alla basilica.","d":"Davanti alla basilica","foto":{"u":"img/75d762389b74.jpg","alt":"Una statua equestre di bronzo davanti alla basilica","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"Una delle due statue equestri dei Borbone davanti alla basilica."}},{"t":"Il nome della piazza","x":"Il nome si deve al plebiscito del 21 ottobre 1860, con cui il Regno delle Due Sicilie fu annesso al Regno di Sardegna. Prima la piazza
