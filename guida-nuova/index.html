<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guida di Napoli · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="caratteri/caratteri.css">
<link rel="stylesheet" href="mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"it","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità e via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Il punto di partenza: Piazza Carità, sulla via Toledo. Da qui il centro storico comincia a pochi minuti a piedi. E qui c'è Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Prima di partire, un caffè: il giro è lungo e Napoli si visita meglio con la tazzina giusta.","acc":"","foto":{"u":"img/15021c80962d.jpg","alt":"Piazza Carità oggi, con gli alberi e i palazzi colorati","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità oggi, sulla via Toledo: da qui partono tutti i giri. Ceraldi è qui."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":null}],"gal":[{"u":"img/6f4c11148f21.jpg","alt":"Foto d'epoca di via Toledo nell'Ottocento, con carrozze e passanti","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo nell'Ottocento, quando si chiamava via Roma, in una foto di Giacomo Brogi."}],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, il decumano inferiore","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La strada dritta che taglia in due il centro storico: il decumano inferiore della città greca, circa due chilometri di chiese, botteghe e vita.","rac":"Spaccanapoli è il più basso dei tre decumani, le strade parallele che attraversavano da ovest a est la Neapolis greca. Comincia in piazza del Gesù Nuovo con il nome di via Benedetto Croce, poi diventa via San Biagio dei Librai, attraversa via Duomo e prosegue oltre il centro antico: in tutto circa due chilometri. Il nome dice tutto: è così lunga e dritta che, vista dall'alto, sembra spaccare la città in due.","con":"Percorrila a piedi da piazza del Gesù verso via Duomo: è in leggera discesa di storia, non di fatica.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":null}],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Piazza e Chiesa del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una facciata di pietre a punta di piramide che sembra una fortezza e nasconde un mistero: segni incisi che nessuno ha ancora decifrato con certezza.","rac":"Prima di essere una chiesa era un palazzo: quello dei principi Sanseverino, costruito nel 1470; una lapide sulla facciata ricorda l'architetto, Novello da San Lucano. I gesuiti ne conservarono la struttura e il bugnato in piperno scuro, con le pietre tagliate a punta di piramide, aggiungendo elementi in marmo bianco.\n\nSu alcune pietre si vedono segni incisi. Per la leggenda sono un messaggio segreto; per alcuni studiosi sono i marchi lasciati dalle diverse squadre di tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali di uno spartito chiamato «Enigma». Guardali da vicino e scegli tu la tua versione.\n\nLa facciata è stata restaurata e presentata il 12 marzo 2023, dopo la caduta di alcuni frammenti nel dicembre 2017; da allora la piazza è chiusa alle auto.","con":"Cerca i segni sulle pietre all'altezza degli occhi, a destra e a sinistra del portale: la caccia è gratuita.","acc":"","foto":{"u":"img/96d5545e33d7.jpg","alt":"La facciata del Gesù Nuovo, di pietre scure tagliate a punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La facciata a punte di diamante: era il palazzo dei principi Sanseverino, del 1470. Avvicinati e cerca i segni incisi sulle pietre."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La facciata a punte di diamante","x":"Prima di essere la facciata di una chiesa era quella di un palazzo: il palazzo dei Sanseverino, principi di Salerno, costruito nel 1470. Quando i gesuiti costruirono qui la loro chiesa, dal 1584, sventrarono il palazzo ma ne salvarono la facciata e il portale. A Napoli si faceva spesso: nel centro antico lo spazio era poco e fuori dalle mura non si poteva costruire.\n\nGuarda le pietre: sono di piperno, una pietra vulcanica grigia e durissima, tagliate a punta di diamante (il «bugnato»). Il grande portale barocco, con le colonne, gli angeli sul timpano e il monogramma dei gesuiti «IHS», racchiude ancora il portale rinascimentale del palazzo.\n\nOra avvicinati: su molte punte ci sono piccoli segni incisi. Per alcuni sono i marchi delle squadre di tagliapietre; una leggenda dice che i maestri pipernieri sapessero «caricare» la pietra di energia; nel 2010 alcuni studiosi li hanno letti come note di uno spartito, lettura poi contestata. Una risposta certa non c'è: cercane uno e scegli la tua.","d":"Fuori, sulla piazza","foto":{"u":"img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo coperta di punte di diamante in pietra grigia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante della facciata del Gesù Nuovo, con il portale e la grande finestra."}},{"t":"La cacciata di Eliodoro","x":"È il grande affresco sopra la porta d'ingresso: lo dipinse Francesco Solimena, che lo firmò e datò 1725. Molti visitatori non lo vedono, perché entrano guardando l'altare: girati.\n\nLa storia viene dalla Bibbia (secondo libro dei Maccabei): Eliodoro tenta di saccheggiare il tesoro del tempio di Gerusalemme e viene respinto da un cavaliere celeste. Cerca il cavaliere, i cavalli e le figure in fuga: è una scena teatrale, piena di movimento, come il barocco amava.\n\nAi lati del finestrone, sopra l'affresco, ci sono due scene più piccole di Belisario Corenzio, del 1638: Sant'Elena che ritrova la Croce e la Conversione di San Paolo.","d":"Appena entrato, girati verso la porta: è sopra l'ingresso","foto":{"u":"img/7a0dd25a648c.jpg","alt":"Il grande affresco della Cacciata di Eliodoro di Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"L'affresco di Solimena sopra l'ingresso: girati verso la porta per vederlo. Al centro il cavaliere celeste che respinge Eliodoro."}},{"t":"La cupola e i quattro evangelisti","x":"Fermati al centro della chiesa, dove la navata incrocia il transetto, e alza gli occhi. Nei quattro triangoli curvi che reggono la cupola (i «pennacchi») ci sono i quattro evangelisti dipinti da Giovanni Lanfranco nel Seicento: sono quello che resta del suo grande ciclo, perché il resto andò perduto con la cupola.\n\nLa cupola infatti ha avuto una vita difficile. Quella originale crollò con il terremoto del 1688; fu rifatta, ma restò pericolante e alla fine del Settecento fu abbattuta. Nel 1786 la sostituì una copertura più bassa, a forma di scodella, che è quella che vedi oggi; nel 1975 è stata consolidata con una struttura in cemento armato.\n\nIntorno a te c'è il barocco napoletano al completo: marmi intarsiati di molti colori («marmi commessi»), stucchi dorati, affreschi di Belisario Corenzio e Paolo De Matteis sulle volte, tele di Luca Giordano e sculture di Cosimo Fanzago.","d":"Al centro della chiesa, guarda in alto","foto":null},{"t":"Il cappellone di Sant'Ignazio","x":"È la grande cappella in fondo al braccio sinistro del transetto, dedicata a Sant'Ignazio di Loyola, fondatore dei gesuiti. Architettura e marmi sono di Cosimo Fanzago e dei suoi collaboratori, negli anni tra il 1637 e il 1645 circa; ai lati dell'altare le due statue dei profeti Davide e Geremia sono opera dello stesso Fanzago.\n\nLe tele con la vita del santo sono di Jusepe de Ribera, il pittore spagnolo che lavorò a Napoli e ne divenne uno dei maestri. Ai piedi dell'altare è sepolto il committente, Carlo Gesualdo da Venosa.\n\nPoi attraversa la chiesa: di fronte, nel braccio destro, c'è il cappellone «gemello» di San Francesco Saverio, il primo missionario gesuita in Asia, con le sculture di Fanzago e, in alto, tre tele di Luca Giordano del 1676-77. Guardale una dopo l'altra: sono il Seicento napoletano al suo massimo.","d":"In uno dei due grandi cappelloni della chiesa","foto":null},{"t":"San Giuseppe Moscati","x":"Qui riposa il «medico santo» di Napoli: Giuseppe Moscati, medico e professore universitario, che curava gratis i più poveri e li aiutava anche con il denaro. Morì nel 1927 e fu proclamato santo da papa Giovanni Paolo II nel 1987.\n\nIl suo corpo è nell'urna di bronzo al centro della cappella della Visitazione, la seconda a destra, dove fu portato nel 1977. L'urna è di Amedeo Garufi: guarda i tre bassorilievi, che lo mostrano mentre fa lezione all'università, mentre guarisce un bambino in braccio alla madre e mentre cura i malati in ospedale. A sinistra c'è la sua statua in bronzo, del 1990.\n\nDal cappellone di San Francesco Saverio una porta porta alle Sale di San Giuseppe Moscati: foto, manoscritti, i suoi abiti e strumenti medici, e lo studio e la camera da letto della sua casa, ricostruiti qui. Nelle stesse sale è esposta una bomba della Seconda guerra mondiale che cadde sul soffitto della chiesa senza esplodere.","d":"Nella cappella della Visitazione, sotto l'altare","foto":{"u":"img/c9deda186fa3.jpg","alt":"La stanza di san Giuseppe Moscati ricostruita: camice bianco e strumenti medici in una teca","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Nella stanza ricostruita: il camice bianco, gli strumenti medici e le fotografie di san Giuseppe Moscati."}}],"gal":[{"u":"img/4a574d8f9faf.jpg","alt":"La piazza del Gesù Nuovo davanti alla chiesa","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La piazza del Gesù Nuovo, davanti alla chiesa."},{"u":"img/6d1ae4837518.jpg","alt":"L'interno del Gesù Nuovo, con marmi colorati e l'altare maggiore","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, il contrasto con la facciata severa: marmi colorati, affreschi e oro fino all'altare maggiore."},{"u":"img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo vista dall'ingresso","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata vista dall'ingresso: in fondo, in alto, la cupola con gli evangelisti di Lanfranco alla base."}],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monastero e Complesso di Santa Chiara (chiostro maiolicato)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Il chiostro rivestito di maioliche è uno dei luoghi più quieti del centro: a due passi dal caos di Spaccanapoli, il silenzio.","rac":"Santa Chiara nasce nel 1310 per volere del re Roberto d'Angiò e della regina Sancia di Maiorca. I lavori furono guidati prima da Gagliardo Primario e poi da Lionardo di Vito, e nel 1340 la chiesa fu aperta al culto. Il complesso era doppio: un convento per le monache clarisse e uno per i frati minori, vicini ma separati.\n\nQuattro secoli dopo, su suggerimento della regina Maria Amalia di Sassonia, moglie di Carlo di Borbone, il chiostro delle clarisse fu rinnovato. L'architetto Domenico Antonio Vaccaro tenne gli archi gotici del Trecento e trasformò il centro in un giardino barocco, rivestito dalle maioliche della bottega di Donato e Giuseppe Massa. Il risultato è uno dei luoghi più sorprendenti di Napoli: un giardino di ceramica a due passi da Spaccanapoli.\n\nLa chiesa è gotica, con una facciata a larga cuspide che incornicia l'antico rosone, e dentro ha un'unica navata con dieci cappelle per lato. Il bombardamento del 4 agosto 1943 la colpì duramente: distrusse anche parte degli affreschi del chiostro, e la ricostruzione le ha restituito le forme gotiche che gli stucchi del Settecento avevano nascosto.\n\nSotto il complesso c'è un'altra sorpresa: i resti di uno stabilimento termale romano, scoperto durante i restauri del dopoguerra. Aveva una palestra, una piscina coperta e le sale per i bagni di aria calda: sono la testimonianza più completa delle antiche terme di Neapolis.","con":"La domenica il chiostro chiude alle 14: se è domenica pomeriggio, scambia l'ordine e vieni qui per primo.","acc":"","foto":{"u":"img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Chiostro e museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Chiostro e museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"I pilastri di maiolica","x":"Il giardino è diviso in quattro parti da due viali che si incrociano, e lungo i viali corrono 64 pilastri a otto lati, tutti rivestiti di maiolica. Le decorazioni sono festoni di foglie, fiori e frutti; i colori più usati sono il giallo, l'arancio e il blu, scelti per richiamare gli agrumi e la vite del pergolato che cresce sopra di te.\n\nLe maioliche sono della bottega di Donato e Giuseppe Massa, che seguirono il progetto dell'architetto napoletano Domenico Antonio Vaccaro: lui volle che smalti, architettura e piante fossero un'unica cosa. I pilastri finiscono in capitelli di piperno e sono collegati da sedili, anche questi interamente di maiolica.\n\nIl chiostro fu trasformato così negli anni intorno al 1742, quando la badessa era suor Ippolita Carmignano: fu la regina Maria Amalia di Sassonia, moglie di Carlo di Borbone, a spingere più volte le monache a «modernizzarlo».","d":"Nel giardino del chiostro","foto":{"u":"img/924627d30fda.jpg","alt":"Pilastri rivestiti di maioliche gialle e verdi nel chiostro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"I pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto il pergolato."}},{"t":"Le scene sui sedili","x":"Siediti: i sedili che collegano i pilastri sono tutti di maiolica, e sugli schienali sono dipinte piccole scene del Settecento. Ci sono scene di campagna, di mare, feste popolari e storie mitologiche: un racconto per figure della vita di allora.\n\nLe scene continuano anche sul muretto che circonda le aiuole: percorri i viali con calma e guarda in basso, oltre che ai lati.\n\nUn consiglio: è un gioco bellissimo con i bambini. Scegliete una scena a testa e raccontatevi che cosa sta succedendo: chi va a pesca, chi balla, chi lavora nei campi.","d":"Sugli schienali dei sedili tra i pilastri","foto":{"u":"img/79ec1acbab17.jpg","alt":"Un sedile di maiolica con una scena dipinta sullo schienale","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un sedile di maiolica del chiostro: sullo schienale c'è una scena dipinta."}},{"t":"La clarissa con i gatti","x":"Tra tutte le scene sugli schienali ce n'è una che parla del monastero stesso: una monaca clarissa che dà da mangiare ai gatti che vivevano nel chiostro. È un piccolo momento di vita quotidiana, dipinto in maiolica nel Settecento dalla bottega dei Massa.\n\nLe clarisse sono le monache dell'ordine di Santa Chiara: il complesso nacque infatti con due conventi vicini ma separati, uno per le clarisse e uno per i frati minori.\n\nTrovarla è una caccia al tesoro perfetta, anche per i bambini: percorri i sedili uno per uno. Se non la trovi, chiedi al personale del chiostro.","d":"Su uno degli schienali dei sedili: cercala","foto":null},{"t":"Gli archi del Trecento","x":"Il giardino è barocco, ma la cornice è medievale. Il complesso fu voluto nel 1310 dal re Roberto d'Angiò e dalla regina Sancia di Maiorca; i lavori furono diretti da Gagliardo Primario e poi da Lionardo di Vito, e la chiesa fu aperta al culto nel 1340.\n\nQuando nel Settecento Vaccaro rifece il giardino, conservò il perimetro trecentesco: gli archi a sesto acuto sui pilastri di piperno. Guarda il contrasto tra la pietra severa degli archi e i colori allegri delle maioliche: quattro secoli in un solo sguardo.\n\nSulle pareti dei quattro lati corrono affreschi della prima metà del Seicento, di un autore sconosciuto, forse della scuola di Belisario Corenzio, con scene dell'Antico Testamento. Appena entri, il primo tratto di parete a destra è vuoto: quegli affreschi furono distrutti dal bombardamento del 4 agosto 1943.","d":"Lungo i quattro lati del chiostro","foto":{"u":"img/fc6ac3ae6c14.jpg","alt":"Gli archi del chiostro di Santa Chiara visti in controluce, con la chiesa sullo sfondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Gli archi gotici del chiostro di Santa Chiara, visti in controluce: sullo sfondo la facciata della chiesa."}}],"gal":[{"u":"img/f5b30f6df9dc.jpg","alt":"Maioliche con una scena di caccia al cinghiale","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Da vicino: una caccia al cinghiale dipinta sulle maioliche dalla bottega dei Massa, tra il 1739 e il 1742."},{"u":"img/f13f406e9a70.jpg","alt":"Il chiostro con i pilastri di maiolica, i sedili e il giardino","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Il chiostro intero: i pilastri di maiolica, i sedili e il giardino."}],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Cappella Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Il Cristo velato, una delle sculture più famose al mondo, e le macchine anatomiche del principe alchimista Raimondo di Sangro.","rac":"La cappella della famiglia di Sangro è il regno di Raimondo, principe di Sansevero: uomo di scienza e di segreti, Gran Maestro della Massoneria, attorno al quale il mito nacque quando era ancora vivo, e fu lui stesso ad alimentarlo.\n\nAl centro c'è il Cristo velato di Giuseppe Sanmartino, commissionato dal principe: un corpo disteso coperto da un sudario così sottile da sembrare stoffa bagnata, ma scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea si trovano le due «macchine anatomiche», scheletri di un uomo e di una donna con il sistema dei vasi sanguigni ricostruito, opera del medico palermitano Giuseppe Salerno intorno al 1756-1764. La leggenda nera racconta di servi sacrificati e di iniezioni misteriose; il museo stesso separa con cura il mito dalla storia documentata.","con":"Il martedì è chiusa: se oggi è martedì, la statua del Nilo è a due minuti e si vede sempre.","acc":"La navata e la sagrestia sono visitabili anche in carrozzina. La cavea sotterranea con le macchine anatomiche si raggiunge solo da una stretta scala a chiocciola dell'Ottocento.","foto":{"u":"img/65421f883be6.jpg","alt":"L'esterno della Cappella Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Cappella Sansevero vista da fuori."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Il Cristo velato","x":"Al centro della cappella c'è un corpo disteso su un materasso, la testa e il busto sollevati da un cuscino, coperto da un sudario così sottile che sotto si leggono il volto, le ferite e le vene. Il velo non è un'aggiunta: Giuseppe Sanmartino l'ha scolpito dallo stesso blocco di marmo della statua, nel 1753, su commissione del principe Raimondo di Sangro.\n\nLo dice un documento firmato dal principe per pagare lo scultore: «una statua di marmo scolpita a grandezza naturale, rappresentante Nostro Signore Gesù Cristo morto, coperto da un sudario trasparente realizzato dallo stesso blocco della statua». Per secoli si è raccontato che il velo fosse un tessuto vero trasformato in marmo con un procedimento alchemico del principe: è solo una leggenda.\n\nCerca i dettagli: la ferita del costato, il segno dei chiodi sulla mano e, ai piedi, la corona di spine e i chiodi della Passione. Poi giragli intorno lentamente: da ogni lato il velo sembra cambiare.","d":"Al centro della navata","foto":{"u":"img/625d7cbbb2af.jpg","alt":"Il volto del Cristo velato sotto il velo di marmo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Il volto sotto il velo: il sudario è scolpito nello stesso blocco di marmo della statua, eppure sembra stoffa bagnata."}},{"t":"La Pudicizia","x":"Una giovane donna avvolta in un velo che aderisce alla pelle come se fosse bagnato, con una ghirlanda di rose sui capelli. La scolpì nel 1752 il veneto Antonio Corradini, scultore famoso in tutta Europa che aveva lavorato anche per l'imperatore a Vienna: morì nello stesso anno, mentre progettava le altre decorazioni della cappella, come ricorda una lapide sul pilastro.\n\nIl principe Raimondo la dedicò alla madre, Cecilia Gaetani dell'Aquila d'Aragona, morta il 26 dicembre 1710, quando lui non aveva ancora un anno. Cerca i simboli di una vita interrotta troppo presto: lo sguardo perso, l'albero che nasce dalla pietra e la lapide spezzata ai suoi piedi.\n\nSul basamento c'è un bassorilievo con il «Noli me tangere», Cristo risorto che appare alla Maddalena. Il museo ricorda che la donna velata può essere letta anche come immagine della Sapienza, e richiama la dea Iside velata.","d":"Vicino all'altare maggiore","foto":{"u":"img/caa3cd3d9215.jpg","alt":"La statua della Pudicizia, una donna coperta da un velo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La Pudicizia di Antonio Corradini: il velo aderisce al corpo come se fosse bagnato. Ai suoi piedi la lapide spezzata."}},{"t":"Il Disinganno","x":"Un uomo si libera da una grande rete, aiutato da un piccolo genio alato con una fiammella sulla fronte, simbolo dell'intelletto umano. Ai suoi piedi c'è il globo terrestre, le passioni del mondo, con sopra una Bibbia aperta. Lo scolpì il genovese Francesco Queirolo tra il 1753 e il 1754.\n\nIl principe lo dedicò al padre, Antonio: rimasto vedovo, aveva lasciato il figlio al nonno e viaggiato per l'Europa vivendo in modo disordinato, poi da anziano, pentito, era tornato a Napoli e si era fatto sacerdote. La rete è il peccato da cui l'uomo si libera.\n\nGuarda la rete da vicino: è tutta di marmo, traforata maglia per maglia. Si racconta che gli artigiani incaricati della rifinitura si rifiutarono di toccarla per paura di romperla, e che Queirolo dovette levigarla da solo. Già nel 1753 un contemporaneo la definì «l'ultima pruova ardita, a cui può la scultura in marmo azzardarsi».","d":"Vicino all'altare maggiore","foto":{"u":"img/921cf7f91318.jpg","alt":"La statua del Disinganno, un uomo che si libera da una rete","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Il Disinganno di Francesco Queirolo: la rete è tutta di marmo, traforata a mano."}},{"t":"Il pavimento labirintico","x":"Il pavimento che calpesti non è quello originale. Il principe ne aveva ideato uno a labirinto: marmi colorati, dal blu al bianco, attraversati da una linea continua di marmo bianco senza giunture, che disegnava croci uncinate alternate a quadrati concentrici in prospettiva. Lo eseguì Francesco Celebrano a partire dalla metà degli anni Sessanta del Settecento; il principe stesso scrisse che il lavoro fu «difficile e intralciato».\n\nNel 1889 un grave crollo coinvolse il palazzo e la cappella e danneggiò il pavimento: invece di restaurarlo, lo si rifece in cotto napoletano, con smalto giallo e azzurro in corrispondenza dello stemma dei di Sangro.\n\nCerca le lastre originali nel passaggio davanti alla tomba di Raimondo di Sangro; altre sono nella cavea sotterranea e in sagrestia. Per il principe il labirinto era l'immagine del cammino difficile che porta alla conoscenza.","d":"Nel passaggio davanti alla tomba del principe","foto":null},{"t":"Le macchine anatomiche","x":"Scendi la stretta scala fino alla cavea sotterranea: dentro due vetrine ci sono gli scheletri in piedi di un uomo e di una donna, con il sistema delle arterie e delle vene quasi intatto, fino ai vasi più sottili.\n\nLe realizzò il medico palermitano Giuseppe Salerno. Il principe comprò quella maschile nel 1756, dopo averla vista in una dimostrazione pubblica a Napoli, prese Salerno al suo servizio e gli fece realizzare la seconda. Stavano nel palazzo, in una stanza chiamata «Appartamento della Fenice»; la donna era su una pedana che si faceva girare per osservarla da ogni lato.\n\nIntorno a loro è nata la «leggenda nera»: si diceva che il principe avesse fatto uccidere due servi e iniettato nei loro corpi una sostanza misteriosa. In realtà i vasi sono una ricostruzione fatta con diversi materiali, tra cui cera d'api e coloranti; resta sorprendente la conoscenza dell'anatomia che dimostrano, per l'epoca.","d":"Nella cavea sotterranea, scendendo una stretta scala a chiocciola","foto":null}],"gal":[{"u":"img/13d7137edcd0.jpg","alt":"L'interno della Cappella Sansevero con le statue","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La cappella intera: al centro il Cristo velato, intorno le statue della famiglia di Sangro."}],"leg":"Su Raimondo di Sangro si raccontava già in vita di tutto: esperimenti misteriosi, segreti alchemici, persino servi trasformati nelle macchine anatomiche. Il museo distingue con cura la leggenda nera dai fatti documentati: vale la pena ascoltare entrambe le versioni e scegliere da che parte stare.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli e statua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"img/223832909fbe.jpg","alt":"La statua antica del dio Nilo, sdraiato","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statua del dio Nilo, sdraiato, nella piccola piazza che porta il suo nome."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai e le sue botteghe","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La parte di Spaccanapoli dei librai e degli artigiani: botteghe, chiese e l'Ospedale delle Bambole.","rac":"È il tratto di Spaccanapoli che va da piazzetta Nilo a via Duomo, sul decumano inferiore. Il nome viene dalle botteghe di libri che vi si trovavano da sempre: un'iscrizione sul vicino Palazzo Marigliano ricorda proprio l'arte dei maestri librai. La devozione a san Biagio risale all'VIII secolo, quando monache venute dall'Armenia portarono a Napoli una reliquia del santo. Lungo la strada c'è anche l'Ospedale delle Bambole, bottega artigiana tramandata di generazione in generazione.","con":"Dicembre è il mese delle botteghe dei presepi: preparati alla folla nei fine settimana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":{"u":"img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: il vicolo stretto, i negozi e uno stendardo appeso in alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la strada stretta e dritta del decumano inferiore, con i negozi e la gente a passeggio."}}],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai e il teschio con le orecchie","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una piccolissima chiesa dei tagliapietre dedicata alla santa degli occhi, e un teschio unico al mondo: quello con le orecchie.","rac":"Fondata poco prima del 1327 da Bartolomeo di Capua, giurista dei re angioini, la chiesa fu poi affidata ai pipernieri, i tagliatori di pietra: scelsero santa Lucia, protettrice della vista, perché le schegge del loro mestiere mettevano a rischio gli occhi.\n\nAbbandonata per più di trent'anni, è stata riaperta il 5 aprile 2019 grazie all'associazione Respiriamo Arte. Nel suo ipogeo il culto delle anime pezzentelle ha lasciato un teschio che non ha eguali: ha le orecchie.","con":"È piccola e si visita in pochi minuti: perfetta come pausa tra Sansevero e via dei Tribunali.","acc":"","foto":{"u":"img/fff63e79f1d9.jpg","alt":"Il portale di Santa Luciella nel vicolo","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Il portale di Santa Luciella. Alza gli occhi: sopra c'è l'affresco con lo stemma dei pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Lo stemma dei pipernieri","x":"Prima di entrare alza gli occhi: sopra il portale di piperno c'è ancora l'affresco con lo stemma della corporazione dei pipernieri, i tagliatori di pietra a cui la chiesa apparteneva.\n\nLavoravano con scalpello e martello il piperno, una pietra durissima, e temevano che le schegge finissero negli occhi: per questo scelsero santa Lucia, protettrice della vista. Era una corporazione potente; si diceva perfino che sapessero infondere nelle pietre energie buone o cattive.\n\nLa chiesa è antichissima: fu fondata poco prima del 1327 da Bartolomeo di Capua, consigliere dei re angioini. Nella veduta di Napoli del Baratta del 1629 è indicata come cappella dei mugnai; fu rifatta nel Settecento. Rimase chiusa e abbandonata per oltre trent'anni, finché l'associazione Respiriamo Arte l'ha riaperta il 5 aprile 2019.","d":"Sopra il portale d'ingresso","foto":null},{"t":"Il teschio con le orecchie","x":"Sotto la chiesa, nell'ipogeo, c'è un teschio che ha conservato le cartilagini mummificate delle orecchie: per questo è considerato unico. La tradizione popolare dice che, proprio perché ha le orecchie, ascolta meglio le preghiere di chi gli chiede una grazia.\n\nL'ipogeo si visita solo con la visita guidata. Grazie al progetto «Percorsi di luce», sostenuto da FAI e Intesa Sanpaolo, le luci si accendono un dettaglio alla volta, alternando zone illuminate e zone in ombra: lasciati guidare.\n\nRicorda che è un luogo legato ai defunti e alla devozione: si guarda con rispetto, a voce bassa.","d":"Nell'ipogeo, con la visita guidata","foto":null},{"t":"Le anime pezzentelle","x":"Nel Seicento la peste uccise migliaia di persone a Napoli: i morti furono sepolti in fosse comuni e se ne perse il nome. Nacque così il culto delle «anime pezzentelle», le anime povere, morte senza nome, senza funerale e senza preghiere.\n\nChi chiedeva una grazia (una guarigione, una gravidanza, un aiuto) «adottava» uno di quei teschi, le «capuzzelle»: lo puliva, lo sistemava in una nicchia e pregava per lui, perché l'anima arrivasse in Paradiso e lassù si ricordasse di chi l'aveva aiutata.\n\nIl culto era molto radicato a Santa Luciella. Lo ritroverai al Purgatorio ad Arco, in via dei Tribunali, e il suo luogo simbolo è il Cimitero delle Fontanelle, nel rione Sanità.","d":"Nell'ipogeo","foto":{"u":"img/8110a7061c73.jpg","alt":"Teschi illuminati dalla luce di una candela, con una targa «per grazia ricevuta»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Teschi nelle teche: su una targa si legge il nome di chi ha fatto la grazia, un modo di ringraziare le anime «pezzentelle»."}}],"gal":[],"leg":"Si dice che il teschio con le orecchie, proprio perché ha le orecchie, ascolti meglio le preghiere: per questo per generazioni gli sono state affidate le richieste più difficili.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Ospedale delle Bambole","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una bottega che da generazioni «cura» bambole e giocattoli: una vetrina che i bambini, e non solo, ricordano per sempre.","rac":"Alla fine dell'Ottocento Luigi Grassi lavorava come scenografo per teatri e presepi. I vicini cominciarono a portargli bambole e giocattoli rotti, e la sua bottega diventò, quasi per caso, il primo «ospedale» per giocattoli di Napoli.\n\nOggi lo porta avanti Tiziana, pronipote del fondatore, nel cortile di Palazzo Marigliano in via San Biagio dei Librai. Dentro funziona come un ospedale vero: camici bianchi, reparti e una cartella clinica per ogni paziente. Per molti napoletani è il luogo dove da bambini hanno portato il loro giocattolo preferito.","con":"Anche solo la vetrina vale la sosta: è sulla strada del ritorno.","acc":"","foto":{"u":"img/fb7ec54d1f19.jpg","alt":"La vetrina dell'Ospedale delle Bambole piena di bambole","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vetrina dell'Ospedale delle Bambole: bambole e giocattoli in attesa di essere «curati»."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un ospedale vero, per giocattoli","x":"Non è un negozio ma un laboratorio organizzato come un ospedale: i pazienti sono bambole, orsacchiotti e peluche, ognuno con la sua storia.\n\nI «medici» lavorano in camice bianco, divisi in reparti come in un ospedale vero: ortopedia, oculistica, sartoria. Ogni paziente ha la sua cartella clinica e la sua diagnosi.\n\nÈ un posto che piace molto ai bambini, ma anche agli adulti che ci ritrovano i giocattoli della loro infanzia.","d":"Nella bottega","foto":null},{"t":"Il fondatore scenografo","x":"Tutto cominciò alla fine dell'Ottocento con Luigi Grassi, che costruiva scenografie per i teatri e i presepi. I vicini iniziarono a portargli i giocattoli rotti, e lui trasformò il suo laboratorio nel primo «ospedale» per bambole.\n\nDa allora la bottega è passata di generazione in generazione nella stessa famiglia: oggi a curare i pazienti è Tiziana, sua pronipote.\n\nPensa al legame con la città: Napoli è la città dei presepi, e via San Gregorio Armeno, la strada delle botteghe dei pastori, è a due passi da qui.","d":"Nella storia della bottega","foto":null},{"t":"Il cortile di Palazzo Marigliano","x":"L'ospedale si trova nel cortile di Palazzo Marigliano, al numero 39 di via San Biagio dei Librai: uno dei palazzi del Rinascimento napoletano legati ai nomi degli architetti Giovanni Francesco Mormando e Giovanni Francesco di Palma.\n\nEntrando dal portone il rumore della strada si spegne: è uno dei tanti cortili nascosti del centro storico che vale la pena scoprire. Sul palazzo c'è anche un'iscrizione che ricorda come qui vicino sorgesse in antico una basilica augustale.\n\nTutta la via è da guardare con calma: è il «decumano inferiore» della città greca, la strada dei librai, e qui nacque il filosofo Giambattista Vico.","d":"Via San Biagio dei Librai 39","foto":{"u":"img/89c281423b4c.jpg","alt":"Il cortile giallo di Palazzo Marigliano con l'arco d'ingresso","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Il cortile di Palazzo Marigliano, con l'arco d'ingresso e le facciate color ocra."}}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la chiesa delle capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La chiesa delle capuzzelle: sotto il pavimento, l'ipogeo dove Napoli pregava per le anime senza nome. E il teschio di Lucia.","rac":"I napoletani la chiamano «'e cape 'e morte», la chiesa delle teste di morto. È una piccola chiesa del Seicento sul decumano maggiore, legata alla devozione per le anime del Purgatorio diffusa dalla Controriforma. Una scala ripida porta all'ipogeo, la chiesa sotterranea, ampliato e decorato con maioliche nel Settecento: qui i devoti si prendevano cura di resti anonimi e chiedevano loro intercessione. In fondo a un piccolo corridoio è custodito il teschio di Lucia, un'anima giovane particolarmente amata.","con":"Dietro l'altare cerca il teschio alato in marmo di Dionisio Lazzari: è il simbolo della chiesa.","acc":"","foto":{"u":"img/66f88d49a737.jpg","alt":"La facciata del Purgatorio ad Arco su via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La facciata del Purgatorio ad Arco, sul decumano maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"I dipinti del Seicento","x":"Prima di scendere, guarda bene la chiesa di sopra. Fu commissionata nel 1616 dalla congregazione laica «Opera Pia Purgatorio ad Arco» all'architetto Giovan Cola di Franco e consacrata nel 1638.\n\nFu pensata su due livelli: la chiesa superiore, che rappresenta la dimensione terrena, e sotto l'ipogeo, il cimitero, che rappresenta concretamente il Purgatorio. Tutta la decorazione ricorda a chi entra che le anime aspettano una preghiera per salire in Paradiso.\n\nQui ci sono marmi preziosi e dipinti di tre grandi maestri del Seicento napoletano: Massimo Stanzione, Luca Giordano e Andrea Vaccaro. Nella sagrestia e nell'oratorio c'è anche un piccolo museo con argenti, paramenti, manoscritti e quadri realizzati per la congregazione tra il Seicento e l'Ottocento.","d":"Nella chiesa superiore","foto":null},{"t":"Il teschio alato","x":"Tra i marmi della chiesa superiore c'è il celebre teschio alato di Dionisio Lazzari: un teschio con le ali, che riassume lo spirito del luogo. Qui la morte non fa paura: diventa occasione di preghiera e di legame con chi non c'è più.\n\nNon a caso i napoletani chiamano questa chiesa «'e cape 'e morte», quella dei teschi.\n\nIl messaggio era voluto: nella chiesa nata con la Controriforma, tutto doveva ricordare a passanti e fedeli che le anime del Purgatorio aspettavano una preghiera per salire in Paradiso.","d":"Nella chiesa superiore","foto":null},{"t":"L'ipogeo delle anime","x":"La vera chiesa è quella di sotto. Da un'apertura nel pavimento della chiesa superiore si scendono gradini alti e si arriva in un grande ambiente spoglio, una vera chiesa inferiore.\n\nAl centro del pavimento c'è una grande tomba anonima circondata da catene nere e illuminata da poche lampadine. Lungo le pareti ci sono nicchie, piccoli altari e teche: sono i segni del culto nato qui spontaneamente fin dal Seicento, quando i fedeli si prendevano cura di resti umani senza nome e chiedevano loro protezione. Sul fondo c'è l'antico altare del Seicento con grandi croci nere.\n\nScendi piano: è un luogo di devozione ancora viva, non solo di curiosità. Visita guidata in italiano inclusa nel biglietto, su prenotazione.","d":"Sotto la chiesa, scendendo una scala ripida","foto":null},{"t":"Il teschio di Lucia","x":"Tra tutti i teschi dell'ipogeo ce n'è uno particolarmente amato: quello di Lucia, ritenuto l'anima di una giovane. È custodito in fondo a un piccolo corridoio.\n\nÈ la testimonianza più toccante del culto delle anime del Purgatorio, nato qui spontaneamente fin dal Seicento: i devoti scelgono un resto senza nome, se ne prendono cura e gli chiedono protezione.\n\nGuardala con rispetto: per molti napoletani è ancora oggi una presenza a cui rivolgersi.","d":"Nell'ipogeo, in fondo a un piccolo corridoio","foto":null}],"gal":[{"u":"img/36b3b8212bd1.jpg","alt":"Un'immagine delle anime del Purgatorio tra le fiamme dentro la chiesa","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro la chiesa: le anime del Purgatorio tra le fiamme, il tema di tutto il luogo."},{"u":"img/de63b1b83fa8.jpg","alt":"Un teschio di bronzo su una colonnina","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un teschio di bronzo: il simbolo della chiesa delle «capuzzelle»."}],"leg":"","fc":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Quaranta metri sotto via dei Tribunali: le cisterne che per secoli hanno dato l'acqua a Napoli, i rifugi della guerra e un teatro romano nascosto sotto il letto di una casa.","rac":"Sotto il centro storico c'è un'altra città. Da Piazza San Gaetano si scendono oltre cento gradini fino a circa 40 metri di profondità, lungo un percorso che attraversa l'acquedotto greco-romano e cunicoli di epoca medievale, borbonica e moderna.\n\nLe cavità di epoca greca furono usate come cisterne per l'acqua della città per circa 23 secoli. Durante la Seconda guerra mondiale gli stessi spazi diventarono rifugi antiaerei.\n\nLa visita sottoterra è guidata e dura circa un'ora. Poi si torna in superficie per l'ultima sorpresa: i resti del teatro greco-romano di Neapolis, inglobati dal Quattrocento nelle case del quartiere. Si entra in un «basso», una casa al piano terra, si sposta un letto e da una botola si scende tra le mura del teatro.","con":"Scarpe basse e una felpa anche d'estate: sottoterra è umido. Il breve passaggio stretto con la candela è facoltativo. Per i gruppi da 10 persone in su serve la prenotazione.","acc":"Non adatto a sedie a rotelle e deambulatori: ci sono scale, con corrimano, e passaggi stretti.","foto":{"u":"img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Visite guidate in partenza ogni ora dalle 10 alle 18, in italiano e in inglese. Giovedì anche alle 21, solo su prenotazione e con almeno 10 persone."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Le cisterne greco-romane","x":"Si scendono 136 gradini, bassi e comodi, fino a circa 40 metri sotto le strade. Già nel III secolo a.C. i Greci aprirono qui le prime cave sotterranee, per estrarre i blocchi di tufo con cui costruivano le mura e i templi di Neapolis.\n\nLe grandi stanze scavate nel tufo diventarono poi le cisterne dell'acqua della città, collegate dall'acquedotto greco-romano, e lo rimasero per circa 23 secoli. Sotto il centro storico c'è una rete ancora non del tutto conosciuta di cisterne, cave, cunicoli e pozzi, con tracce greche, spagnole e borboniche.\n\nLungo il percorso vedrai anche cose sorprendenti: il laboratorio della stazione sismica «Arianna» e gli orti ipogei, piccole coltivazioni a 35 metri di profondità, illuminate da lampade speciali, studiate anche dai ricercatori.","d":"Nella prima parte della visita, a circa 40 metri di profondità","foto":{"u":"img/bd8239fed0ef.jpg","alt":"Le pareti di tufo di una cisterna sotterranea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Le pareti di tufo di una cisterna: per circa 23 secoli qui si raccoglieva l'acqua della città."}},{"t":"Il passaggio con la candela","x":"Le stanze del percorso sono tutte grandi e illuminate, tranne un tratto brevissimo e stretto: si percorre alla luce delle candele, uno alla volta, mantenendo un po' di distanza da chi ti precede.\n\nAlla fine del cunicolo arrivi alla cisterna romana ancora piena d'acqua: è il momento più suggestivo della visita.\n\nIl passaggio è facoltativo: chi soffre di spazi stretti può aspettare il gruppo fuori, dove ci sono delle panche. La candela non è obbligatoria: va bene anche la torcia del telefono.","d":"Lungo il percorso sotterraneo","foto":{"u":"img/a874f33cc5df.jpg","alt":"Un cunicolo strettissimo illuminato nel tufo","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Uno dei cunicoli strettissimi scavati nel tufo."}},{"t":"I rifugi della guerra","x":"Durante la Seconda guerra mondiale le antiche cisterne furono usate come rifugi antiaerei: qui la gente di Napoli scendeva a ripararsi dai bombardamenti.\n\nLungo il percorso c'è il Museo della Guerra, con gli oggetti di quegli anni.\n\nNapoli subì più di cento bombardamenti aerei, soprattutto per il suo porto: pensare a quante persone si rifugiarono qui sotto aiuta a capire quello che la città ha passato.","d":"Lungo il percorso sotterraneo","foto":{"u":"img/0f4490838101.jpg","alt":"Oggetti della Seconda guerra mondiale esposti sottoterra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"I ricordi della guerra: oggetti di quando queste stanze erano rifugi antiaerei."}},{"t":"Il teatro sotto il letto","x":"La seconda parte della visita è in superficie, tra via Anticaglia, vico Cinquesanti e via San Paolo. Qui sorgeva il teatro greco-romano di Neapolis, detto anche teatro di Nerone, perché l'imperatore vi si esibì.\n\nDal Quattrocento le case sono state costruite sopra e dentro le mura del teatro, che così sono arrivate fino a noi. Si entra in un «basso», una tipica casa a piano strada, si sposta il letto e da una botola si scende nelle stanze dove, secondo la tradizione, Nerone si preparava per i suoi spettacoli.\n\nDi recente un altro pezzo del teatro è riemerso in un'antica falegnameria: oggi ospita una mostra di vecchie teche di legno scuro per i presepi, e sotto il pavimento sono riapparsi scarichi d'epoca borbonica fatti con riggiole dai disegni blu.","d":"Seconda parte della visita, in superficie tra via Anticaglia e vico Cinquesanti","foto":null}],"gal":[],"leg":"Secondo il racconto della visita, nelle stanze nascoste sotto il basso Nerone aveva i suoi camerini, quando veniva a Napoli a esibirsi nel teatro.","fc":"si"},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":{"u":"img/9f5b0456685f.jpg","alt":"La cupola ottagonale della chiesa del Pio Monte della Misericordia vista dal basso","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cupola della chiesa ottagonale del Pio Monte della Misericordia, guardando in alto."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Le Sette opere di Misericordia","x":"È una tela enorme, quasi quattro metri d'altezza, e sembra una notte in un vicolo di Napoli: un incrocio pieno di gente, illuminato da una luce che arriva di lato e scolpisce i corpi nel buio. In alto, la Madonna con il Bambino, portata da due angeli, guarda giù su quello che fanno gli uomini.\n\nIl Pio Monte voleva un'opera che mettesse insieme tutte e sette le opere di misericordia: dar da mangiare agli affamati, dar da bere agli assetati, vestire gli ignudi, ospitare i pellegrini, visitare gli infermi, visitare i carcerati, seppellire i morti. Caravaggio le dipinse tutte in una sola scena, senza miracoli: è l'uomo che aiuta l'uomo.\n\nFu la prima opera di Caravaggio a Napoli e cambiò la pittura della città: i pittori napoletani del Seicento ripresero la sua luce, i suoi personaggi presi dalla strada e perfino alcuni dettagli, come l'uomo di spalle in primo piano.","d":"Sull'altare maggiore","foto":{"u":"img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"t":"Come riconoscere le sette opere","x":"Cerca le scene una per una.\n\nA destra, una giovane donna allatta dal seno un vecchio dietro le sbarre: sono Pero e suo padre Cimone, condannato a morire di fame in carcere. Valgono per due opere: dar da mangiare agli affamati e visitare i carcerati. Guarda la goccia di latte sulla barba del vecchio.\n\nDietro di loro, un uomo trasporta un morto (se ne vedono solo i piedi) e un sacerdote con la torcia gli fa luce: seppellire i morti. In primo piano, a sinistra, un giovane cavaliere taglia il mantello per un uomo nudo a terra: è San Martino, vestire gli ignudi; accanto, nell'angolo più buio, uno storpio prega: visitare gli infermi.\n\nAll'estrema sinistra un oste indica la strada a un pellegrino con la conchiglia sul cappello, San Giacomo: ospitare i pellegrini. Sullo sfondo, un uomo beve da una mascella d'asino: è Sansone, dar da bere agli assetati.","d":"Davanti alla tela, da sinistra a destra","foto":{"u":"img/61f82ae7d5c6.jpg","alt":"La tela di Caravaggio sopra l'altare maggiore del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La tela di Caravaggio come la vedi in chiesa: sopra l'altare, nella cappella del Pio Monte."}},{"t":"La Madonna e gli angeli","x":"Guarda in alto: la Madonna con il Bambino si affaccia come da una finestra, davanti a due lenzuoli stesi, e due angeli si abbracciano in volo. Sembrano lontani da quello che succede in basso.\n\nMa osserva l'ombra che proiettano sul muro del carcere: Caravaggio li rende presenti, quasi concreti, dentro la stessa notte degli uomini.\n\nLo storico dell'arte Roberto Longhi scelse proprio questo dettaglio per la locandina della grande mostra del 1951 che riscoprì Caravaggio: belli, scrisse, come un Raffaello, ma presi «dalla verità nuda di Forcella o di Pizzofalcone».","d":"In alto, nella tela","foto":{"u":"img/e426fcddaa4a.jpg","alt":"Dettaglio: la Madonna con il Bambino e i due angeli in volo","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Il dettaglio in alto: la Madonna con il Bambino che si affaccia e i due angeli che si abbracciano in volo."}},{"t":"Gli altri altari","x":"Intorno al Caravaggio la chiesa ottagonale ha altri sei altari, con tele di pittori del Seicento napoletano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino e Forlì.\n\nCerca la «Liberazione di San Pietro» di Battistello Caracciolo, del 1615: è uno dei pittori che più impararono da Caravaggio, e si vede dalla luce e dal buio. Poi «San Pietro che resuscita Tabità» di Fabrizio Santafede, del 1611.\n\nGuardale dopo il Caravaggio: capirai subito quanto la sua tela fosse nuova per Napoli.","d":"Nelle cappelle intorno","foto":null}],"gal":[],"leg":"","fc":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo e Tesoro di San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cattedrale di Napoli e la Cappella del Tesoro, dove si custodisce l'ampolla del sangue di San Gennaro.","rac":"La cattedrale, dedicata a Santa Maria Assunta, fu voluta da Carlo d'Angiò nel 1294 nel luogo dove sorgevano due basiliche antiche: la Stefania, demolita, e Santa Restituta, conservata come cappella. La si scopre all'improvviso lungo via Duomo, la strada aperta nei primi decenni dopo l'Unità d'Italia.\n\nÈ gotica, a croce latina e tre navate, con un soffitto a cassettoni di legno intagliato e dorato. Dentro, i secoli si sommano: la basilica paleocristiana di Santa Restituta, il battistero più antico d'Occidente, la cripta rinascimentale del Succorpo, la cappella barocca del Tesoro, e sotto tutto i resti della città greco-romana.\n\nNel Duomo, in una nicchia della Cappella del Tesoro, è custodita l'ampolla con il sangue che la tradizione attribuisce a San Gennaro. Tre volte l'anno (il sabato prima della prima domenica di maggio, il 19 settembre e il 16 dicembre) se ne attende la liquefazione. Le reliquie sono affidate dal 1601 a un'istituzione laica, la Deputazione della Cappella del Tesoro di San Gennaro.","con":"Nei giorni della liquefazione il Duomo è pieno fin dal mattino: se vuoi esserci, arriva presto.","acc":"","foto":{"u":"img/bbfb14ecb434.jpg","alt":"La facciata del Duomo di Napoli","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La facciata del Duomo, su via Duomo. La Cappella del Tesoro è la terza a destra."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Il portale di San Gennaro","x":"Fermati davanti alla facciata: è alta circa cinquanta metri e ha tre portali. Fu ricostruita in stile gotico dopo che il terremoto del 1349 aveva distrutto la facciata angioina e il campanile.\n\nIl portale di destra resta chiuso quasi tutto l'anno: si apre solo per le feste di San Gennaro e in occasioni straordinarie. Se lo trovi aperto, sei capitato in un giorno speciale.\n\nLa cattedrale, dedicata a Santa Maria Assunta, fu voluta da Carlo d'Angiò nel 1294 dove sorgevano due antiche basiliche. Dentro è a croce latina, a tre navate, con un soffitto a cassettoni di legno intagliato e dorato.","d":"In facciata, a destra","foto":{"u":"img/9e227b1ac73b.jpg","alt":"Il portale gotico del Duomo di Napoli","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Il portale gotico del Duomo, in facciata."}},{"t":"La Cappella del Tesoro","x":"Più che una cappella è una chiesa nella chiesa: la terza cappella a destra, barocca, della prima metà del Seicento, a croce greca, con una cupola a doppia calotta. Si entra superando il grande cancello di bronzo di Cosimo Fanzago.\n\nQui sono custoditi il busto d'argento di San Gennaro e le ampolle con il suo sangue: ogni anno la città attende il «miracolo» della liquefazione, e la folla riempie la cattedrale.\n\nIl tesoro donato al santo nei secoli (gioielli, argenti, opere d'arte) si visita nel Museo del Tesoro di San Gennaro, con ingresso dall'esterno del Duomo.","d":"Terza cappella a destra","foto":{"u":"img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro affrescata con il Paradiso","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Alza gli occhi: nella cupola della Cappella del Tesoro c'è il Paradiso dipinto da Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Quando Carlo d'Angiò fece costruire il Duomo, una delle due basiliche antiche che sorgevano qui fu demolita, l'altra fu conservata come cappella laterale: è Santa Restituta, nella navata sinistra.\n\nLa tradizione la vuole voluta dall'imperatore Costantino: è una delle testimonianze pi
