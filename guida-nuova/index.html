<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guida di Napoli · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="caratteri/caratteri.css">
<link rel="stylesheet" href="mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:var(--superficie);border-radius:14px;padding:14px}
.guarda .mini{width:32px;height:32px;position:relative}
.guarda.con-foto{grid-template-columns:minmax(0,1fr);padding:0 0 14px;overflow:hidden}
.guarda.con-foto .mini{width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.guarda.con-foto>div:last-child{padding:0 14px}
.guarda .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.02rem}
.guarda .dove{font-size:.82rem;color:var(--accento);font-weight:500}
.guarda p{font-size:.95rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;position:relative}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"it","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità e via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Il punto di partenza: Piazza Carità, sulla via Toledo. Da qui il centro storico comincia a pochi minuti a piedi. E qui c'è Ceraldi.","rac":"","con":"Prima di partire, un caffè: il giro è lungo e Napoli si visita meglio con la tazzina giusta.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, il decumano inferiore","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La strada dritta che taglia in due il centro storico: il decumano inferiore della città greca, circa due chilometri di chiese, botteghe e vita.","rac":"Spaccanapoli è il più basso dei tre decumani, le strade parallele che attraversavano da ovest a est la Neapolis greca. Comincia in piazza del Gesù Nuovo con il nome di via Benedetto Croce, poi diventa via San Biagio dei Librai, attraversa via Duomo e prosegue oltre il centro antico: in tutto circa due chilometri. Il nome dice tutto: è così lunga e dritta che, vista dall'alto, sembra spaccare la città in due.","con":"Percorrila a piedi da piazza del Gesù verso via Duomo: è in leggera discesa di storia, non di fatica.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Piazza e Chiesa del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una facciata di pietre a punta di piramide che sembra una fortezza e nasconde un mistero: segni incisi che nessuno ha ancora decifrato con certezza.","rac":"Prima di essere una chiesa era un palazzo: quello dei principi Sanseverino, costruito nel 1470; una lapide sulla facciata ricorda l'architetto, Novello da San Lucano. I gesuiti ne conservarono la struttura e il bugnato in piperno scuro, con le pietre tagliate a punta di piramide, aggiungendo elementi in marmo bianco.\n\nSu alcune pietre si vedono segni incisi. Per la leggenda sono un messaggio segreto; per alcuni studiosi sono i marchi lasciati dalle diverse squadre di tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali di uno spartito chiamato «Enigma». Guardali da vicino e scegli tu la tua versione.\n\nLa facciata è stata restaurata e presentata il 12 marzo 2023, dopo la caduta di alcuni frammenti nel dicembre 2017; da allora la piazza è chiusa alle auto.","con":"Cerca i segni sulle pietre all'altezza degli occhi, a destra e a sinistra del portale: la caccia è gratuita.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La facciata a punte di diamante","x":"Prima di essere una chiesa era la facciata del palazzo dei principi Sanseverino, del 1470. I gesuiti la tennero com'era, con le pietre di piperno scuro tagliate a punta di piramide, e vi inserirono il grande portale barocco. Avvicinati: su molte pietre ci sono segni incisi, e ancora oggi non c'è accordo su cosa significhino.","d":"Fuori, sulla piazza","foto":null},{"t":"La cacciata di Eliodoro","x":"Il grande affresco della controfacciata è di Francesco Solimena, del 1725. Racconta Eliodoro che tenta di saccheggiare il tempio di Gerusalemme e viene respinto da un cavaliere celeste: una scena piena di movimento, di cavalli e di figure in fuga. Molti visitatori non lo vedono perché entrano guardando l'altare.","d":"Appena entrato, girati verso la porta: è sopra l'ingresso","foto":null},{"t":"La cupola e i quattro evangelisti","x":"Nei quattro triangoli alla base della cupola ci sono gli evangelisti dipinti da Giovanni Lanfranco. La cupola che vedi però non è quella originale: crollò con il terremoto del 1688 e fu sostituita nel 1786 da una struttura più bassa, a forma di scodella.","d":"Al centro della chiesa, guarda in alto","foto":null},{"t":"Il cappellone di Sant'Ignazio","x":"Dedicato al fondatore dei gesuiti, unisce due grandi nomi del Seicento napoletano: Cosimo Fanzago, autore delle architetture e delle statue dei profeti Davide e Geremia, e Jusepe de Ribera, che dipinse le tele con la vita del santo. Marmi colorati, statue e pittura insieme: il barocco napoletano al suo massimo.","d":"In uno dei due grandi cappelloni della chiesa","foto":null},{"t":"San Giuseppe Moscati","x":"Qui riposa il «medico santo» di Napoli: Giuseppe Moscati, ricercatore e professore universitario, che curava gratis i poveri. Morì nel 1927 e fu proclamato santo nel 1987. Le sue spoglie sono in un'urna di bronzo dello scultore Amedeo Garufi, sotto l'altare della cappella della Visitazione.","d":"Nella cappella della Visitazione, sotto l'altare","foto":null}],"gal":[],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monastero e Complesso di Santa Chiara (chiostro maiolicato)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Il chiostro rivestito di maioliche è uno dei luoghi più quieti del centro: a due passi dal caos di Spaccanapoli, il silenzio.","rac":"Santa Chiara nasce nel 1310 per volere del re Roberto d'Angiò e della regina Sancia di Maiorca. I lavori furono guidati prima da Gagliardo Primario e poi da Lionardo di Vito, e nel 1340 la chiesa fu aperta al culto. Il complesso era doppio: un convento per le monache clarisse e uno per i frati minori, vicini ma separati.\n\nQuattro secoli dopo, su suggerimento della regina Maria Amalia di Sassonia, moglie di Carlo di Borbone, il chiostro delle clarisse fu rinnovato. L'architetto Domenico Antonio Vaccaro tenne gli archi gotici del Trecento e trasformò il centro in un giardino barocco, rivestito dalle maioliche della bottega di Donato e Giuseppe Massa. Il risultato è uno dei luoghi più sorprendenti di Napoli: un giardino di ceramica a due passi da Spaccanapoli.","con":"La domenica il chiostro chiude alle 14: se è domenica pomeriggio, scambia l'ordine e vieni qui per primo.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Chiostro e museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Chiostro e museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"}],"ant":true,"dett":[{"t":"I pilastri di maiolica","x":"Sessantaquattro pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto un pergolato. Il giallo, l'arancio e il blu richiamano gli agrumi e la vite che crescono intorno. Le maioliche sono della bottega di Donato e Giuseppe Massa, nel giardino barocco disegnato da Domenico Antonio Vaccaro.","d":"Nel giardino del chiostro","foto":null},{"t":"Le scene sui sedili","x":"I sedili che uniscono i pilastri sono tutti di maiolica e sugli schienali sono dipinte piccole scene: vita di campagna, di mare, feste popolari, miti. Sono il Settecento napoletano raccontato in figure. Siediti e guarda da vicino quello alle tue spalle.","d":"Sugli schienali dei sedili tra i pilastri","foto":null},{"t":"La clarissa con i gatti","x":"Tra le scene c'è una monaca clarissa che dà da mangiare ai gatti del chiostro: un piccolo momento di vita quotidiana del monastero, dipinto sulla maiolica. Trovarla è una caccia al tesoro perfetta, anche per i bambini.","d":"Su uno degli schienali dei sedili: cercala","foto":null},{"t":"Gli archi del Trecento","x":"Il giardino è barocco, ma la cornice è medievale: Vaccaro conservò il perimetro trecentesco con gli archi a sesto acuto del monastero angioino. Guarda il contrasto tra la pietra severa degli archi e i colori allegri delle maioliche: quattro secoli in un solo sguardo.","d":"Lungo i quattro lati del chiostro","foto":null}],"gal":[],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Cappella Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Il Cristo velato, una delle sculture più famose al mondo, e le macchine anatomiche del principe alchimista Raimondo di Sangro.","rac":"La cappella della famiglia di Sangro è il regno di Raimondo, principe di Sansevero: uomo di scienza e di segreti, Gran Maestro della Massoneria, attorno al quale il mito nacque quando era ancora vivo, e fu lui stesso ad alimentarlo.\n\nAl centro c'è il Cristo velato di Giuseppe Sanmartino, commissionato dal principe: un corpo disteso coperto da un sudario così sottile da sembrare stoffa bagnata, ma scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea si trovano le due «macchine anatomiche», scheletri di un uomo e di una donna con il sistema dei vasi sanguigni ricostruito, opera del medico palermitano Giuseppe Salerno intorno al 1756-1764. La leggenda nera racconta di servi sacrificati e di iniezioni misteriose; il museo stesso separa con cura il mito dalla storia documentata.","con":"Il martedì è chiusa: se oggi è martedì, la statua del Nilo è a due minuti e si vede sempre.","acc":"La navata e la sagrestia sono visitabili anche in carrozzina. La cavea sotterranea con le macchine anatomiche si raggiunge solo da una stretta scala a chiocciola dell'Ottocento.","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Il Cristo velato","x":"Un corpo disteso su un materasso, coperto da un sudario così sottile che sotto si leggono il volto, le ferite e le vene. Il velo non è aggiunto: Giuseppe Sanmartino lo ha ricavato dallo stesso blocco di marmo della statua, su commissione del principe Raimondo di Sangro. Giragli intorno lentamente: da ogni lato il velo sembra cambiare.","d":"Al centro della navata","foto":null},{"t":"La Pudicizia","x":"Una donna avvolta da un velo che aderisce alla pelle come se fosse bagnato, con una ghirlanda di rose. La scolpì Antonio Corradini nel 1752, l'anno della sua morte, e il principe la dedicò alla madre, Cecilia Gaetani, scomparsa quando lui non aveva ancora un anno. Cerca la lapide spezzata ai suoi piedi: è il segno di una vita interrotta troppo presto.","d":"Vicino all'altare maggiore","foto":null},{"t":"Il Disinganno","x":"Un uomo si libera da una grande rete con l'aiuto di un piccolo genio alato che ha una fiamma sulla fronte, simbolo dell'intelletto. Francesco Queirolo la scolpì nel 1753-54 per ricordare il padre del principe. La rete è tutta in marmo, traforata: secondo la tradizione gli aiutanti si rifiutarono di rifinirla per paura di spezzarla, e lo scultore la levigò da solo.","d":"Vicino all'altare maggiore","foto":null},{"t":"Il pavimento labirintico","x":"Il pavimento originale era un labirinto di marmi colorati attraversato da una linea bianca continua, ideato dal principe come immagine del difficile cammino verso la conoscenza. Lo realizzò Francesco Celebrano fino al 1771 circa. Un crollo nel 1889 lo distrusse quasi tutto: ne restano alcune lastre nel passaggio davanti alla tomba di Raimondo, nella cavea e in sagrestia.","d":"Nel passaggio davanti alla tomba del principe","foto":null},{"t":"Le macchine anatomiche","x":"Due scheletri, di un uomo e di una donna, con il sistema dei vasi sanguigni ricostruito con una precisione che ancora sorprende. Le realizzò il medico palermitano Giuseppe Salerno tra il 1756 e il 1764 circa. Intorno a loro è nata la leggenda nera del principe: il museo racconta con cura dove finisce la storia e dove comincia il mito.","d":"Nella cavea sotterranea, scendendo una stretta scala a chiocciola","foto":null}],"gal":[],"leg":"Su Raimondo di Sangro si raccontava già in vita di tutto: esperimenti misteriosi, segreti alchemici, persino servi trasformati nelle macchine anatomiche. Il museo distingue con cura la leggenda nera dai fatti documentati: vale la pena ascoltare entrambe le versioni e scegliere da che parte stare.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli e statua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai e le sue botteghe","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La parte di Spaccanapoli dei librai e degli artigiani: botteghe, chiese e l'Ospedale delle Bambole.","rac":"È il tratto di Spaccanapoli che va da piazzetta Nilo a via Duomo, sul decumano inferiore. Il nome viene dalle botteghe di libri che vi si trovavano da sempre: un'iscrizione sul vicino Palazzo Marigliano ricorda proprio l'arte dei maestri librai. La devozione a san Biagio risale all'VIII secolo, quando monache venute dall'Armenia portarono a Napoli una reliquia del santo. Lungo la strada c'è anche l'Ospedale delle Bambole, bottega artigiana tramandata di generazione in generazione.","con":"Dicembre è il mese delle botteghe dei presepi: preparati alla folla nei fine settimana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai e il teschio con le orecchie","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una piccolissima chiesa dei tagliapietre dedicata alla santa degli occhi, e un teschio unico al mondo: quello con le orecchie.","rac":"Fondata poco prima del 1327 da Bartolomeo di Capua, giurista dei re angioini, la chiesa fu poi affidata ai pipernieri, i tagliatori di pietra: scelsero santa Lucia, protettrice della vista, perché le schegge del loro mestiere mettevano a rischio gli occhi.\n\nAbbandonata per più di trent'anni, è stata riaperta il 5 aprile 2019 grazie all'associazione Respiriamo Arte. Nel suo ipogeo il culto delle anime pezzentelle ha lasciato un teschio che non ha eguali: ha le orecchie.","con":"È piccola e si visita in pochi minuti: perfetta come pausa tra Sansevero e via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"}],"ant":true,"dett":[{"t":"Lo stemma dei pipernieri","x":"Prima di entrare alza gli occhi: sopra il portale in piperno c'è ancora l'affresco con lo stemma della corporazione dei pipernieri, i tagliatori di pietra a cui la chiesa apparteneva. Lavoravano tra le schegge e per questo scelsero santa Lucia, protettrice della vista.","d":"Sopra il portale d'ingresso","foto":null},{"t":"Il teschio con le orecchie","x":"Sotto la chiesa, nell'ipogeo, c'è un teschio che ha conservato le cartilagini delle orecchie: per questo è unico. La tradizione popolare dice che, proprio perché ha le orecchie, ascolta meglio le preghiere di chi gli chiede una grazia.","d":"Nell'ipogeo, con la visita guidata","foto":null},{"t":"Le anime pezzentelle","x":"Nel Seicento, dopo la peste, i napoletani «adottavano» i teschi dei morti senza nome: li pulivano, pregavano per loro e in cambio chiedevano un aiuto. È il culto delle anime pezzentelle, le anime povere. Qui ne resta una delle testimonianze più famose della città.","d":"Nell'ipogeo","foto":null}],"gal":[],"leg":"Si dice che il teschio con le orecchie, proprio perché ha le orecchie, ascolti meglio le preghiere: per questo per generazioni gli sono state affidate le richieste più difficili.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Ospedale delle Bambole","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una bottega che da generazioni «cura» bambole e giocattoli: una vetrina che i bambini, e non solo, ricordano per sempre.","rac":"Alla fine dell'Ottocento Luigi Grassi lavorava come scenografo per teatri e presepi. I vicini cominciarono a portargli bambole e giocattoli rotti, e la sua bottega diventò, quasi per caso, il primo «ospedale» per giocattoli di Napoli.\n\nOggi lo porta avanti Tiziana, pronipote del fondatore, nel cortile di Palazzo Marigliano in via San Biagio dei Librai. Dentro funziona come un ospedale vero: camici bianchi, reparti e una cartella clinica per ogni paziente. Per molti napoletani è il luogo dove da bambini hanno portato il loro giocattolo preferito.","con":"Anche solo la vetrina vale la sosta: è sulla strada del ritorno.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"}],"ant":true,"dett":[{"t":"Un ospedale vero, per giocattoli","x":"Non è un negozio ma un laboratorio organizzato come un ospedale: i «medici» in camice bianco, i reparti di ortopedia, oculistica e sartoria, e i pazienti, bambole, orsacchiotti e peluche, ognuno con la sua cartella clinica e la sua diagnosi.","d":"Nella bottega","foto":null},{"t":"Il fondatore scenografo","x":"Tutto cominciò alla fine dell'Ottocento con Luigi Grassi, scenografo per teatri e presepi: i vicini iniziarono a portargli i giocattoli rotti e lui trasformò il laboratorio nel primo «ospedale». Oggi a curare i pazienti è Tiziana, sua pronipote.","d":"Nella storia della bottega","foto":null},{"t":"Il cortile di Palazzo Marigliano","x":"L'ospedale si trova nel cortile di Palazzo Marigliano, lungo Spaccanapoli. Entrando dal portone, il rumore della strada si spegne: è uno dei tanti cortili nascosti del centro storico che vale la pena scoprire.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la chiesa delle capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La chiesa delle capuzzelle: sotto il pavimento, l'ipogeo dove Napoli pregava per le anime senza nome. E il teschio di Lucia.","rac":"I napoletani la chiamano «'e cape 'e morte», la chiesa delle teste di morto. È una piccola chiesa del Seicento sul decumano maggiore, legata alla devozione per le anime del Purgatorio diffusa dalla Controriforma. Una scala ripida porta all'ipogeo, la chiesa sotterranea, ampliato e decorato con maioliche nel Settecento: qui i devoti si prendevano cura di resti anonimi e chiedevano loro intercessione. In fondo a un piccolo corridoio è custodito il teschio di Lucia, un'anima giovane particolarmente amata.","con":"Dietro l'altare cerca il teschio alato in marmo di Dionisio Lazzari: è il simbolo della chiesa.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo e Tesoro di San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cattedrale di Napoli e la Cappella del Tesoro, dove si custodisce l'ampolla del sangue di San Gennaro.","rac":"Nel Duomo, in una nicchia della Cappella del Tesoro, è custodita l'ampolla con il sangue che la tradizione attribuisce a San Gennaro. Tre volte l'anno (il sabato prima della prima domenica di maggio, il 19 settembre e il 16 dicembre) se ne attende la liquefazione. Le reliquie sono affidate dal 1601 a un'istituzione laica, la Deputazione della Cappella del Tesoro di San Gennaro.","con":"Nei giorni della liquefazione il Duomo è pieno fin dal mattino: se vuoi esserci, arriva presto.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"La Madonna con la pistola di Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Madonna di Banksy con una pistola al posto dell'aureola, protetta da un vetro, nel cuore del decumano maggiore.","rac":"In piazzetta dei Girolamini, su una facciata del decumano maggiore, Banksy ha lasciato una Madonna con una pistola al posto dell'aureola. Oggi è protetta da un vetro. Il portale turistico ufficiale della città la include nel suo itinerario dedicato alla street art del centro storico.","con":"Alza gli occhi: l'opera è sopra il livello della strada, dietro un vetro.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Il primo giro","sub":"Spaccanapoli in mezza giornata, partendo da Ceraldi","desc":"Il cuore del centro storico in un anello a piedi: il Gesù Nuovo e il suo mistero, il chiostro di Santa Chiara, il Cristo velato, la chiesa del teschio con le orecchie, le botteghe di via San Biagio dei Librai. E si torna da noi.","dur":180,"dist":3062,"et":["primo_giro", ],[14.25574,40.84855],[14.25533,40.84841],[14.25531,40.8484],[14.25475,40.84822],[14.25433,40.84807],[14.25388,40.84792],[14.25305,40.84764],[14.25244,40.84744],[14.25214,40.84734],[14.25195,40.84727],[14.25135,40.84707],[14.25124,40.84703],[14.25086,40.84691],[14.25047,40.84678],[14.25008,40.84665],[14.25005,40.84665],[14.25004,40.84666],[14.25,40.84665],[14.24938,40.84644],[14.24934,40.84643],[14.24933,40.84638],[14.24928,40.84638],[14.24927,40.84634],[14.24918,40.84554],[14.24918,40.84553],[14.2491,40.84484],[14.2491,40.84478],[14.24909,40.84468],[14.24908,40.84464],[14.24911,40.84463],[14.24908,40.84433]],"sv":[{"k":"parti","n":"","d":65,"a":0},{"k":"gira","m":"right","n":"Via dei Tribunali","d":165,"a":65},{"k":"gira","m":"left","n":"Vico dei Maiorani","d":196,"a":230},{"k":"gira","m":"right","n":"Via San Biagio dei Librai","d":940,"a":426},{"k":"gira","m":"left","n":"","d":232,"a":1366},{"k":"arrivo","a":1598}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Napoli in cinque minuti: dalla sirena alla città nuova","som":"Prima Partenope, poi Neapolis: perché il centro storico è ancora disegnato come una città greca.","txt":"Napoli nasce due volte. La prima volta si chiama Partenope, come la sirena del mito: la fondano nel VII secolo avanti Cristo coloni di origine greca venuti da Cuma, che approdano sull'isolotto di Megaride, dove oggi sorge Castel dell'Ovo, e si stabiliscono sul vicino Monte Echia.\n\nLa seconda volta, intorno al 470 avanti Cristo, accanto alla città vecchia ne sorge una nuova: Neapolis, «città nuova» in greco. È questa che state attraversando. Le sue strade formano una griglia regolare che, dopo venticinque secoli, si legge ancora: il centro storico di Napoli è patrimonio mondiale dell'UNESCO proprio perché il disegno della città greca è rimasto la sua ossatura.\n\nTre strade parallele, i decumani, tagliano la città da ovest a est. Quella più in basso è Spaccanapoli: lunga circa due chilometri, così dritta che vista dall'alto sembra dividere la città in due, da cui il nome. Al centro corre via dei Tribunali, il decumano maggiore; più in alto via dell'Anticaglia e via della Sapienza, il decumano superiore.\n\nDa Piazza Carità, dove siamo noi dal 2002, Spaccanapoli comincia a pochi minuti a piedi, in piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro e il sangue che si scioglie","som":"Tre volte l'anno Napoli trattiene il fiato davanti a un'ampolla. Cosa succede, dove, e cosa ne dicono Chiesa e scienza.","txt":"Nel Duomo di Napoli, in una nicchia della Cappella del Tesoro, è custodita un'ampolla con una sostanza scura che la tradizione indica come il sangue di San Gennaro, patrono della città. Tre volte l'anno, il sabato che precede la prima domenica di maggio, il 19 settembre (giorno della festa) e il 16 dicembre, l'ampolla viene mostrata ai fedeli: se il contenuto, di solito solido, si scioglie, è festa; se resta solido, per molti napoletani è un cattivo presagio.\n\nLa prima notizia conosciuta della liquefazione risale al 1389. A custodire le reliquie non è il clero ma la Deputazione della Cappella del Tesoro di San Gennaro, un'istituzione laica nata nel 1601, di cui fa parte anche il sindaco di Napoli.\n\nLa Chiesa mantiene un atteggiamento prudente: parla di «fatto prodigioso», ne consente la devozione popolare ma non lo impone come verità di fede. Tra le spiegazioni proposte dagli scettici c'è la tissotropia, la proprietà di alcune sostanze che sono solide a riposo e diventano liquide se mosse o scosse.\n\nSacro e profano, qui, convivono da sempre: in via Duomo, a pochi passi dalla cattedrale, lo street artist Jorit ha dipinto un San Gennaro con il volto di un operaio.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Le anime pezzentelle: quando Napoli adottava un teschio","som":"Ossari, capuzzelle e preghiere scambiate con i numeri del lotto: il culto dei morti senza nome.","txt":"Per secoli, a Napoli, i morti senza nome non sono rimasti soli. Li chiamavano anime pezzentelle: le anime povere, morte senza funerale e senza nessuno a pregare per loro. Il nome si lega a «pezzente», il povero, ma anche al latino «petere», chiedere per ricevere: chi pregava per loro sperava di ricevere in cambio protezione e grazie.\n\nIl luogo simbolo è il Cimitero delle Fontanelle, nel Rione Sanità: una cava di tufo del Cinquecento, di circa quattromila metri quadrati, che accolse le vittime della peste del 1656 e poi quelle del colera del 1836-1837. Nel 1872 il canonico Gaetano Barbati sistemò le ossa in tre navate. I devoti «adottavano» un teschio, una capuzzella: lo pulivano, lo mettevano in una piccola teca, lo ornavano di rosari e monete e lo pregavano, aspettando un segno in sogno, a volte un numero da giocare al lotto. Alcuni teschi diventarono famosi: il Capitano, con un'orbita annerita, protagonista di una leggenda di nozze e gelosia; donna Concetta, che si dice «sudi» quando la grazia è concessa.\n\nNel 1969 un decreto del tribunale ecclesiastico chiuse l'ossario e vietò il culto. Chiuso per lavori dal 2020, il cimitero ha riaperto al pubblico nel 2026, gestito dalla cooperativa La Paranza.\n\nIl culto vive anche sotto via dei Tribunali, nell'ipogeo di Santa Maria delle Anime del Purgatorio ad Arco, la chiesa che i napoletani chiamano «'e cape 'e morte»: lì è custodito il teschio di Lucia, un'anima giovane particolarmente amata. E in via San Biagio dei Librai, nella piccola chiesa di Santa Luciella, c'è un teschio unico: quello con le orecchie.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Napoli esoterica: un principe alchimista, una facciata in codice e un uovo magico","som":"Raimondo di Sangro, il bugnato del Gesù Nuovo, l'uovo di Virgilio, il munaciello: dove finisce la storia e comincia la leggenda.","txt":"Napoli ama i misteri, e ne ha di bellissimi. Il più celebre ha un nome: Raimondo di Sangro, principe di Sansevero, uomo del Settecento, Gran Maestro della Massoneria napoletana, inventore geloso dei propri segreti. Il mito lo accompagnava già in vita, e fu lui stesso ad alimentarlo. Benedetto Croce lo definì l'incarnazione napoletana del dottor Faust. La leggenda nera gli attribuisce di tutto: servi uccisi per studiarne i corpi, persino l'accecamento dello scultore del Cristo velato perché non ne scolpisse un altro. Sono leggende, e lo stesso museo le distingue dalla storia documentata.\n\nIl Cristo velato è opera di Giuseppe Sanmartino, su commissione del principe: il velo trasparente che copre il corpo è scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea della cappella si trovano le «macchine anatomiche», due scheletri con il sistema circolatorio ricostruito, realizzate dal medico palermitano Giuseppe Salerno intorno al 1756-1764: la leggenda parla di iniezioni misteriose, gli studi di cera d'api e coloranti.\n\nPoco lontano, la facciata del Gesù Nuovo, nata come palazzo dei Sanseverino nel 1470, è coperta da un bugnato a punta di piramide in piperno scuro. Su alcune pietre si vedono segni incisi: per la leggenda un messaggio segreto; per alcuni studiosi i marchi dei tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali, uno spartito di circa tre quarti d'ora chiamato «Enigma». Un'ipotesi suggestiva, non una certezza.\n\nE poi c'è il mare: secondo la leggenda il poeta Virgilio nascose nei sotterranei di Castel dell'Ovo l'uovo della sirena Partenope. Finché l'uovo resta intatto, il castello resta in piedi.\n\nNelle case, invece, abitano gli spiriti della tradizione popolare: il munaciello, folletto incappucciato che porta fortuna o dispetti a seconda di come lo tratti, e la bella 'mbriana, spirito buono della casa, che può apparire come una farfalla o un geco.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Napoli oggi: cosa c'è di nuovo","som":"Il largo dedicato a Maradona, la street art, l'ultimo Caravaggio in via Toledo, chiese e ossari riaperti: la città che cambia.","txt":"Chi torna a Napoli dopo qualche anno trova una città che ha imparato a raccontarsi.\n\nNei Quartieri Spagnoli, a nove minuti da noi, c'è Largo Maradona. Il murale di Diego fu dipinto nel 1990 da Mario Filardi; negli anni sbiadì fino quasi a scomparire, poi fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, è diventato un santuario laico di altarini, bandiere argentine e fotografie, tanto visitato che il Comune ha dovuto organizzare il flusso dei pedoni.\n\nLa street art è entrata nel centro storico: in piazzetta dei Girolamini, protetta da un vetro, c'è la Madonna con la pistola di Banksy; in via Duomo il San Gennaro operaio di Jorit. Il portale turistico ufficiale della città dedica loro un itinerario.\n\nIn via Toledo, a sei minuti da noi, le Gallerie d'Italia custodiscono il Martirio di sant'Orsola, l'ultima tela dipinta da Caravaggio, insieme a oltre cinquecento vasi attici e della Magna Grecia.\n\nE riaprono luoghi rimasti chiusi a lungo: la chiesa di Santa Luciella ai Librai, abbandonata per più di trent'anni, è tornata visitabile il 5 aprile 2019; il Cimitero delle Fontanelle ha riaperto nel 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T16:42Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":""},{"c":"en","n":"English","b":"🇬🇧","u":"en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"de/"},{"c":"es","n":"Español","b":"🇪🇸","u":"es/"}],"pre":"","menu":"../menu-nuovo/"}, T = {"titolo":"Guida di Napoli","sottotitolo":"Il centro storico a piedi da Piazza Carità","anteprima":"Versione di prova: testi e orari in revisione.","oggi":"Oggi a Napoli","sciopero":"Sciopero dei trasporti oggi","chiusi_oggi":"Chiusi oggi","tutti_aperti":"Nessuna chiusura nota per oggi tra i luoghi con orari verificati.","itinerari":"Itinerari","luoghi":"Luoghi","racconti":"Napoli raccontata","mappa":"Mappa","piove":"Piove?","piove_testo":"Luoghi al coperto, con gli orari di oggi.","piove_vuoto":"Nessun luogo al coperto disponibile in questa versione.","min":"min","km":"km","a_piedi":"a piedi","da_ceraldi":"da Ceraldi","tappe":"tappe","durata":"Durata","aperto":"Aperto ora","chiude_alle":"chiude alle","ultimo_ingresso":"ultimo ingresso","apre_alle":"Apre alle","chiuso_ora":"Chiuso ora","chiuso_oggi":"Chiuso oggi","sempre":"Sempre accessibile","in_verifica":"Orari in verifica: controlla il sito ufficiale","verificato_il":"Orari V.cammino = function(s){

function aggiornaCammino(){
  if(!G || location.hash.indexOf('#/c/') !== 0) return;

    h += '</section>';

      '<div class="due"><a class="btn sec" href="#/l/' + e(l.s) + '">' + e(T.apri_scheda) + '</a><button class="btn sec" id="c-qui" onclick="G.arrivato=true;aggiornaCammino()">' + e(T.sono_qui) + '</button></div></section>';

function prosegui(){ var i = IT[G.s]; if(G.k < i.tappe.length - 1){ G.k++; G.arrivato = false; G.vicino = 0; G.lungo = 0; salvaGiro(); marcaIo = null; disegnaCammino(); aggiornaCammino(); window.scrollTo(0, 0); } }

function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
