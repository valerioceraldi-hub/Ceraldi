<style>
*{box-sizing:border-box}

.lista{list-style:none;margin:0;padding:0}

.num.casa{background:var(--accento)}
.tappa{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--superficie);border-radius:14px;padding:14px;margin:10px 0}
.tappa .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.tappa .tra{grid-column:1/-1;font-size:.88rem;color:var(--testo-2);margin:-4px 0 0 46px}
.alt{margin-top:8px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--attenzione) 9%,var(--superficie));font-size:.92rem}
.testo p{margin:0 0 12px}

.orari tr.oggi td{font-weight:700}
.foto{margin:12px 0 0}.foto img{width:100%;border-radius:14px;display:block}.foto figcaption{font-size:.78rem;color:var(--testo-2);margin-top:4px}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}

.visuale[hidden]{display:none}

<script>
var D = {"lingua":"it","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità e via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Il punto di partenza: Piazza Carità, sulla via Toledo. Da qui il centro storico comincia a pochi minuti a piedi. E qui c'è Ceraldi.","rac":"","con":"Prima di partire, un caffè: il giro è lungo e Napoli si visita meglio con la tazzina giusta.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, il decumano inferiore","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La strada dritta che taglia in due il centro storico: il decumano inferiore della città greca, circa due chilometri di chiese, botteghe e vita.","rac":"Spaccanapoli è il più basso dei tre decumani, le strade parallele che attraversavano da ovest a est la Neapolis greca. Comincia in piazza del Gesù Nuovo con il nome di via Benedetto Croce, poi diventa via San Biagio dei Librai, attraversa via Duomo e prosegue oltre il centro antico: in tutto circa due chilometri. Il nome dice tutto: è così lunga e dritta che, vista dall'alto, sembra spaccare la città in due.","con":"Percorrila a piedi da piazza del Gesù verso via Duomo: è in leggera discesa di storia, non di fatica.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true},{"id":8,"s":"gesu-nuovo","n":"Piazza e Chiesa del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una facciata di pietre a punta di piramide che sembra una fortezza e nasconde un mistero: segni incisi che nessuno ha ancora decifrato con certezza.","rac":"Prima di essere una chiesa era un palazzo: quello dei principi Sanseverino, costruito nel 1470; una lapide sulla facciata ricorda l'architetto, Novello da San Lucano. I gesuiti ne conservarono la struttura e il bugnato in piperno scuro, con le pietre tagliate a punta di piramide, aggiungendo elementi in marmo bianco.\n\nSu alcune pietre si vedono segni incisi. Per la leggenda sono un messaggio segreto; per alcuni studiosi sono i marchi lasciati dalle diverse squadre di tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali di uno spartito chiamato «Enigma». Guardali da vicino e scegli tu la tua versione.\n\nLa facciata è stata restaurata e presentata il 12 marzo 2023, dopo la caduta di alcuni frammenti nel dicembre 2017; da allora la piazza è chiusa alle auto.","con":"Cerca i segni sulle pietre all'altezza degli occhi, a destra e a sinistra del portale: la caccia è gratuita.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"}],"ant":true},{"id":9,"s":"santa-chiara","n":"Monastero e Complesso di Santa Chiara (chiostro maiolicato)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Il chiostro rivestito di maioliche è uno dei luoghi più quieti del centro: a due passi dal caos di Spaccanapoli, il silenzio.","rac":"","con":"La domenica il chiostro chiude alle 14: se è domenica pomeriggio, scambia l'ordine e vieni qui per primo.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Chiostro e museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Chiostro e museo"}],"fonti":[],"ant":true},{"id":10,"s":"cappella-sansevero","n":"Cappella Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Il Cristo velato, una delle sculture più famose al mondo, e le macchine anatomiche del principe alchimista Raimondo di Sangro.","rac":"La cappella della famiglia di Sangro è il regno di Raimondo, principe di Sansevero: uomo di scienza e di segreti, Gran Maestro della Massoneria, attorno al quale il mito nacque quando era ancora vivo, e fu lui stesso ad alimentarlo.\n\nAl centro c'è il Cristo velato di Giuseppe Sanmartino, commissionato dal principe: un corpo disteso coperto da un sudario così sottile da sembrare stoffa bagnata, ma scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea si trovano le due «macchine anatomiche», scheletri di un uomo e di una donna con il sistema dei vasi sanguigni ricostruito, opera del medico palermitano Giuseppe Salerno intorno al 1756-1764. La leggenda nera racconta di servi sacrificati e di iniezioni misteriose; il museo stesso separa con cura il mito dalla storia documentata.","con":"Il martedì è chiusa: se oggi è martedì, la statua del Nilo è a due minuti e si vede sempre.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli e statua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai e le sue botteghe","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La parte di Spaccanapoli dei librai e degli artigiani: botteghe, chiese e l'Ospedale delle Bambole.","rac":"È il tratto di Spaccanapoli che va da piazzetta Nilo a via Duomo, sul decumano inferiore. Il nome viene dalle botteghe di libri che vi si trovavano da sempre: un'iscrizione sul vicino Palazzo Marigliano ricorda proprio l'arte dei maestri librai. La devozione a san Biagio risale all'VIII secolo, quando monache venute dall'Armenia portarono a Napoli una reliquia del santo. Lungo la strada c'è anche l'Ospedale delle Bambole, bottega artigiana tramandata di generazione in generazione.","con":"Dicembre è il mese delle botteghe dei presepi: preparati alla folla nei fine settimana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai e il teschio con le orecchie","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una piccolissima chiesa dei tagliapietre dedicata alla santa degli occhi, e un teschio unico al mondo: quello con le orecchie.","rac":"Fondata poco prima del 1327 da Bartolomeo di Capua, giurista dei re angioini, la chiesa fu poi affidata ai pipernieri, i tagliatori di pietra: scelsero santa Lucia, protettrice della vista, perché le schegge del loro mestiere mettevano a rischio gli occhi.\n\nAbbandonata per più di trent'anni, è stata riaperta il 5 aprile 2019 grazie all'associazione Respiriamo Arte. Nel suo ipogeo il culto delle anime pezzentelle ha lasciato un teschio che non ha eguali: ha le orecchie.","con":"È piccola e si visita in pochi minuti: perfetta come pausa tra Sansevero e via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"}],"ant":true},{"id":41,"s":"ospedale-bambole","n":"Ospedale delle Bambole","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una bottega che da generazioni «cura» bambole e giocattoli: una vetrina che i bambini, e non solo, ricordano per sempre.","rac":"","con":"Anche solo la vetrina vale la sosta: è sulla strada del ritorno.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la chiesa delle capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La chiesa delle capuzzelle: sotto il pavimento, l'ipogeo dove Napoli pregava per le anime senza nome. E il teschio di Lucia.","rac":"I napoletani la chiamano «'e cape 'e morte», la chiesa delle teste di morto. È una piccola chiesa del Seicento sul decumano maggiore, legata alla devozione per le anime del Purgatorio diffusa dalla Controriforma. Una scala ripida porta all'ipogeo, la chiesa sotterranea, ampliato e decorato con maioliche nel Settecento: qui i devoti si prendevano cura di resti anonimi e chiedevano loro intercessione. In fondo a un piccolo corridoio è custodito il teschio di Lucia, un'anima giovane particolarmente amata.","con":"Dietro l'altare cerca il teschio alato in marmo di Dionisio Lazzari: è il simbolo della chiesa.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true},{"id":18,"s":"duomo-san-gennaro","n":"Duomo e Tesoro di San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cattedrale di Napoli e la Cappella del Tesoro, dove si custodisce l'ampolla del sangue di San Gennaro.","rac":"Nel Duomo, in una nicchia della Cappella del Tesoro, è custodita l'ampolla con il sangue che la tradizione attribuisce a San Gennaro. Tre volte l'anno (il sabato prima della prima domenica di maggio, il 19 settembre e il 16 dicembre) se ne attende la liquefazione. Le reliquie sono affidate dal 1601 a un'istituzione laica, la Deputazione della Cappella del Tesoro di San Gennaro.","con":"Nei giorni della liquefazione il Duomo è pieno fin dal mattino: se vuoi esserci, arriva presto.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":43,"s":"banksy-madonna","n":"La Madonna con la pistola di Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Madonna di Banksy con una pistola al posto dell'aureola, protetta da un vetro, nel cuore del decumano maggiore.","rac":"In piazzetta dei Girolamini, su una facciata del decumano maggiore, Banksy ha lasciato una Madonna con una pistola al posto dell'aureola. Oggi è protetta da un vetro. Il portale turistico ufficiale della città la include nel suo itinerario dedicato alla street art del centro storico.","con":"Alza gli occhi: l'opera è sopra il livello della strada, dietro un vetro.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Il primo giro","sub":"Spaccanapoli in mezza giornata, partendo da Ceraldi","desc":"Il cuore del centro storico in un anello a piedi: il Gesù Nuovo e il suo mistero, il chiostro di Santa Chiara, il Cristo velato, la chiesa del teschio con le orecchie, le botteghe di via San Biagio dei Librai. E si torna da noi.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un caffè da Ceraldi e si parte.","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38},{"l":10,"m":9,"mt":682,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":39},{"l":41,"m":2,"mt":161,"so":10,"nota":"","alt":null},{"l":7,"m":15,"mt":1128,"so":0,"nota":"Si torna da Ceraldi lungo Spaccanapoli.","alt":null}],"fonti":[],"ant":true},{"id":2,"s":"napoli-sacra-e-profana","n":"Napoli sacra e profana","sub":"Santi, teschi, alchimisti e una Madonna di Banksy","desc":"Il lato misterioso di Napoli lungo i decumani: la facciata in codice del Gesù Nuovo, il principe di Sansevero, i teschi di Santa Luciella e del Purgatorio ad Arco, la street art di Banksy e il sangue di San Gennaro. Per chi ha ancora tempo, il Cimitero delle Fontanelle è oltre le mura.","dur":210,"dist":3837,"et":["mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":10,"m":6,"mt":448,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":null},{"l":42,"m":4,"mt":328,"so":40,"nota":"","alt":null},{"l":43,"m":4,"mt":333,"so":5,"nota":"","alt":null},{"l":18,"m":4,"mt":303,"so":45,"nota":"","alt":null},{"l":7,"m":21,"mt":1597,"so":0,"nota":"Ritorno da Ceraldi.","alt":null}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Napoli in cinque minuti: dalla sirena alla città nuova","som":"Prima Partenope, poi Neapolis: perché il centro storico è ancora disegnato come una città greca.","txt":"Napoli nasce due volte. La prima volta si chiama Partenope, come la sirena del mito: la fondano nel VII secolo avanti Cristo coloni di origine greca venuti da Cuma, che approdano sull'isolotto di Megaride, dove oggi sorge Castel dell'Ovo, e si stabiliscono sul vicino Monte Echia.\n\nLa seconda volta, intorno al 470 avanti Cristo, accanto alla città vecchia ne sorge una nuova: Neapolis, «città nuova» in greco. È questa che state attraversando. Le sue strade formano una griglia regolare che, dopo venticinque secoli, si legge ancora: il centro storico di Napoli è patrimonio mondiale dell'UNESCO proprio perché il disegno della città greca è rimasto la sua ossatura.\n\nTre strade parallele, i decumani, tagliano la città da ovest a est. Quella più in basso è Spaccanapoli: lunga circa due chilometri, così dritta che vista dall'alto sembra dividere la città in due, da cui il nome. Al centro corre via dei Tribunali, il decumano maggiore; più in alto via dell'Anticaglia e via della Sapienza, il decumano superiore.\n\nDa Piazza Carità, dove siamo noi dal 2002, Spaccanapoli comincia a pochi minuti a piedi, in piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro e il sangue che si scioglie","som":"Tre volte l'anno Napoli trattiene il fiato davanti a un'ampolla. Cosa succede, dove, e cosa ne dicono Chiesa e scienza.","txt":"Nel Duomo di Napoli, in una nicchia della Cappella del Tesoro, è custodita un'ampolla con una sostanza scura che la tradizione indica come il sangue di San Gennaro, patrono della città. Tre volte l'anno, il sabato che precede la prima domenica di maggio, il 19 settembre (giorno della festa) e il 16 dicembre, l'ampolla viene mostrata ai fedeli: se il contenuto, di solito solido, si scioglie, è festa; se resta solido, per molti napoletani è un cattivo presagio.\n\nLa prima notizia conosciuta della liquefazione risale al 1389. A custodire le reliquie non è il clero ma la Deputazione della Cappella del Tesoro di San Gennaro, un'istituzione laica nata nel 1601, di cui fa parte anche il sindaco di Napoli.\n\nLa Chiesa mantiene un atteggiamento prudente: parla di «fatto prodigioso», ne consente la devozione popolare ma non lo impone come verità di fede. Tra le spiegazioni proposte dagli scettici c'è la tissotropia, la proprietà di alcune sostanze che sono solide a riposo e diventano liquide se mosse o scosse.\n\nSacro e profano, qui, convivono da sempre: in via Duomo, a pochi passi dalla cattedrale, lo street artist Jorit ha dipinto un San Gennaro con il volto di un operaio.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Le anime pezzentelle: quando Napoli adottava un teschio","som":"Ossari, capuzzelle e preghiere scambiate con i numeri del lotto: il culto dei morti senza nome.","txt":"Per secoli, a Napoli, i morti senza nome non sono rimasti soli. Li chiamavano anime pezzentelle: le anime povere, morte senza funerale e senza nessuno a pregare per loro. Il nome si lega a «pezzente», il povero, ma anche al latino «petere», chiedere per ricevere: chi pregava per loro sperava di ricevere in cambio protezione e grazie.\n\nIl luogo simbolo è il Cimitero delle Fontanelle, nel Rione Sanità: una cava di tufo del Cinquecento, di circa quattromila metri quadrati, che accolse le vittime della peste del 1656 e poi quelle del colera del 1836-1837. Nel 1872 il canonico Gaetano Barbati sistemò le ossa in tre navate. I devoti «adottavano» un teschio, una capuzzella: lo pulivano, lo mettevano in una piccola teca, lo ornavano di rosari e monete e lo pregavano, aspettando un segno in sogno, a volte un numero da giocare al lotto. Alcuni teschi diventarono famosi: il Capitano, con un'orbita annerita, protagonista di una leggenda di nozze e gelosia; donna Concetta, che si dice «sudi» quando la grazia è concessa.\n\nNel 1969 un decreto del tribunale ecclesiastico chiuse l'ossario e vietò il culto. Chiuso per lavori dal 2020, il cimitero ha riaperto al pubblico nel 2026, gestito dalla cooperativa La Paranza.\n\nIl culto vive anche sotto via dei Tribunali, nell'ipogeo di Santa Maria delle Anime del Purgatorio ad Arco, la chiesa che i napoletani chiamano «'e cape 'e morte»: lì è custodito il teschio di Lucia, un'anima giovane particolarmente amata. E in via San Biagio dei Librai, nella piccola chiesa di Santa Luciella, c'è un teschio unico: quello con le orecchie.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Napoli esoterica: un principe alchimista, una facciata in codice e un uovo magico","som":"Raimondo di Sangro, il bugnato del Gesù Nuovo, l'uovo di Virgilio, il munaciello: dove finisce la storia e comincia la leggenda.","txt":"Napoli ama i misteri, e ne ha di bellissimi. Il più celebre ha un nome: Raimondo di Sangro, principe di Sansevero, uomo del Settecento, Gran Maestro della Massoneria napoletana, inventore geloso dei propri segreti. Il mito lo accompagnava già in vita, e fu lui stesso ad alimentarlo. Benedetto Croce lo definì l'incarnazione napoletana del dottor Faust. La leggenda nera gli attribuisce di tutto: servi uccisi per studiarne i corpi, persino l'accecamento dello scultore del Cristo velato perché non ne scolpisse un altro. Sono leggende, e lo stesso museo le distingue dalla storia documentata.\n\nIl Cristo velato è opera di Giuseppe Sanmartino, su commissione del principe: il velo trasparente che copre il corpo è scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea della cappella si trovano le «macchine anatomiche», due scheletri con il sistema circolatorio ricostruito, realizzate dal medico palermitano Giuseppe Salerno intorno al 1756-1764: la leggenda parla di iniezioni misteriose, gli studi di cera d'api e coloranti.\n\nPoco lontano, la facciata del Gesù Nuovo, nata come palazzo dei Sanseverino nel 1470, è coperta da un bugnato a punta di piramide in piperno scuro. Su alcune pietre si vedono segni incisi: per la leggenda un messaggio segreto; per alcuni studiosi i marchi dei tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali, uno spartito di circa tre quarti d'ora chiamato «Enigma». Un'ipotesi suggestiva, non una certezza.\n\nE poi c'è il mare: secondo la leggenda il poeta Virgilio nascose nei sotterranei di Castel dell'Ovo l'uovo della sirena Partenope. Finché l'uovo resta intatto, il castello resta in piedi.\n\nNelle case, invece, abitano gli spiriti della tradizione popolare: il munaciello, folletto incappucciato che porta fortuna o dispetti a seconda di come lo tratti, e la bella 'mbriana, spirito buono della casa, che può apparire come una farfalla o un geco.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Napoli oggi: cosa c'è di nuovo","som":"Il largo dedicato a Maradona, la street art, l'ultimo Caravaggio in via Toledo, chiese e ossari riaperti: la città che cambia.","txt":"Chi torna a Napoli dopo qualche anno trova una città che ha imparato a raccontarsi.\n\nNei Quartieri Spagnoli, a nove minuti da noi, c'è Largo Maradona. Il murale di Diego fu dipinto nel 1990 da Mario Filardi; negli anni sbiadì fino quasi a scomparire, poi fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, è diventato un santuario laico di altarini, bandiere argentine e fotografie, tanto visitato che il Comune ha dovuto organizzare il flusso dei pedoni.\n\nLa street art è entrata nel centro storico: in piazzetta dei Girolamini, protetta da un vetro, c'è la Madonna con la pistola di Banksy; in via Duomo il San Gennaro operaio di Jorit. Il portale turistico ufficiale della città dedica loro un itinerario.\n\nIn via Toledo, a sei minuti da noi, le Gallerie d'Italia custodiscono il Martirio di sant'Orsola, l'ultima tela dipinta da Caravaggio, insieme a oltre cinquecento vasi attici e della Magna Grecia.\n\nE riaprono luoghi rimasti chiusi a lungo: la chiesa di Santa Luciella ai Librai, abbandonata per più di trent'anni, è tornata visitabile il 5 aprile 2019; il Cimitero delle Fontanelle ha riaperto nel 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T14:15Z","lingue":[{"c":"it","n":"Italia     case 'aperto': return '<span class="stato ok">' + e(T.aperto) + '</span> <span class="piccolo">· ' + e(T.chiude_alle) + ' ' + e(s.a) + (s.ui ? ' · ' + e(T.ultimo_ingresso) + ' ' + e(s.ui) : '') + '</span>';
    case 'apre': return '<span class="stato att">' + e(T.apre_alle) + ' ' + e(s.da) + '</span>';
    case 'chiuso_ora': return '<span class="stato ko">' + e(T.chiuso_ora) + '</span>';
    default: return '<span class="stato ko">' + e(T.chiuso_oggi) + '</span>';
  }
}
function fotoHtml(f){ if(!f) return ''; return '<figure class="foto"><img src="' + e(f.u) + '" alt="' + e(f.alt) + '" loading="lazy"><figcaption>' + e(f.aut) + ' · ' + e(f.lic) + (f.src ? ' · <a href="' + e(f.src) + '" rel="noopener">fonte</a>' : '') + '</figcaption></figure>'; }
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="scheda fonti"><summary><b>' + e(T.fonti) + '</b> (' + fs.length + ')</summary><ul>' + fs.map(function(f){ return '<li><a href="' + e(f.u) + '" rel="noopener">' + e(f.t) + '</a></li>'; }).join('') + '</ul></details>'; }
function indietro(){ return '<button class="indietro" onclick="history.length > 1 ? history.back() : (location.hash = \'#/\')">← ' + e(T.indietro) + '</button>'; }
function durata(m){ if(!m) return ''; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : m + ' ' + T.min; }
function km(m){ return m ? (m / 1000).toLocaleString(D.lingua, {maximumFractionDigits: 1}) + ' ' + T.km : ''; }

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null;
function caricaMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return mlPromessa || (mlPromessa = new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = PRE + 'mappa/maplibre-gl.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }));
}
function stile(){
  var base = new URL(PRE + 'mappa/', location.href).href;
  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"'));
  });
}
function mappa(id, punti, inQuadro){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18,
      maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}, cooperativeGestures: false});
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    var b = new maplibregl.LngLatBounds();
    punti.forEach(function(p){
      var d = document.createElement('a'); d.className = 'num' + (p.casa ? ' casa' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(inQuadro && punti.length > 1) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0}); /* a destra c'e' lo zoom */
  }).catch(function(){ el.innerHTML = '<p class="piccolo" style="padding:16px">—</p>'; });
}

/* ---------- schermate ---------- */
var V = {};
V.home = function(){
  var ora = adesso(), h = '';
  var sc = D.scioperi.filter(function(s){ return s.d === ora.data; });
  if(sc.length) h += '<div class="avviso ko"><b>' + e(T.sciopero) + '</b>' + sc.map(function(s){ return '<br>' + e([s.l, s.x].filter(Boolean).join(' — ')); }).join('') + '</div>';
  var chiusi = D.luoghi.filter(function(l){ return !l.sa && verificati(l, ora) && stato(l, ora, ora.min).k === 'chiuso_oggi'; });
  h += '<section class="scheda"><h3>' + e(T.oggi) + ' · ' + e(nomeGiorno(ora.gs, true)) + ' ' + e(dataLunga(ora.data)) + '</h3>';
  h += chiusi.length ? '<p class="piccolo" style="margin:0"><b>' + e(T.chiusi_oggi) + ':</b> ' + chiusi.map(function(l){ return '<a href="#/l/' + e(l.s) + '">' + e(l.n) + '</a>'; }).join(', ') + '</p>'
                     : '<p class="piccolo" style="margin:0">' + e(T.tutti_aperti) + '</p>';
  h += '</section>';
  h += '<div class="bottoni"><a class="bottone pieno" href="#/mappa">' + e(T.mappa) + '</a><a class="bottone" href="#/piove">☂ ' + e(T.piove) + '</a></div>';
  if(D.itinerari.length){
    h += '<h2>' + e(T.itinerari) + '</h2><p class="piccolo" style="margin:0">' + e(T.partenza) + '</p><ul class="lista">';
    D.itinerari.forEach(function(i){
      h += '<li><a class="voce" href="#/i/' + e(i.s) + '"><div class="titolo">' + e(i.n) + '</div>' + (i.sub ? '<div class="piccolo">' + e(i.sub) + '</div>' : '') +
           '<div class="meta piccolo"><span>' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span><span>' + i.tappe.filter(function(t){ return !LU[t.l] || LU[t.l].s !== 'piazza-carita'; }).length + ' ' + e(T.tappe) + '</span></div></a></li>';
    });
    h += '</ul>';
  }
  if(D.racconti.length){
    h += '<h2>' + e(T.racconti) + '</h2><ul class="lista">';
    D.racconti.forEach(function(r){ h += '<li><a class="voce" href="#/r/' + e(r.s) + '"><div class="titolo">' + e(r.t) + '</div>' + (r.som ? '<div class="piccolo">' + e(r.som) + '</div>' : '') + '</a></li>'; });
    h += '</ul>';
  }
  var altri = D.luoghi.filter(function(l){ return l.s !== 'piazza-carita'; });
  if(altri.length){
    h += '<h2>' + e(T.luoghi) + '</h2><ul class="lista">';
    altri.forEach(function(l){ h += voceLuogo(l, ora); });
    h += '</ul>';
  }
  return h;
};
function voceLuogo(l, ora){
  return '<li><a class="voce" href="#/l/' + e(l.s) + '"><div class="titolo">' + e(l.n) + '</div><div class="meta">' + etichetta(stato(l, ora, ora.min)) +
         (l.mp ? '<span class="piccolo">' + l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi) + '</span>' : '') + '</div></a></li>';
}
V.itinerario = function(s){
  var i = IT[s]; if(!i) return V.home();
  var ora = adesso(), h = indietro(), t = ora.min, punti = [], k = 0;
  h += '<h2>' + e(i.n) + '</h2>' + (i.sub ? '<p class="piccolo" style="margin:0">' + e(i.sub) + '</p>' : '');
  h += '<div class="meta piccolo" style="display:flex;gap:12px;margin-top:6px"><span>' + e(T.durata) + ' ' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span></div>';
  h += fotoHtml(i.foto);
  h += '<div class="mappa" id="m-itin"></div><p class="piccolo">' + e(T.nota_mappa) + '</p>';
  if(i.desc) h += '<div class="testo">' + par(i.desc) + '</div>';
  h += '<p class="piccolo"><b>' + e(T.arrivo) + '</b></p>';
  i.tappe.forEach(function(tp, n){
    var l = LU[tp.l], casa = l.s === 'piazza-carita';
    t += tp.m;
    var arrivo = t, sa = stato(l, ora, arrivo), num = casa ? '★' : String(++k);
    if(!punti.some(function(p){ return p.id === l.id; }) && l.lat != null) punti.push({id: l.id, t: num, n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa});
    h += (tp.m ? '<div class="tra">↓ ' + tp.m + ' ' + e(T.min) + ' ' + e(T.a_piedi) + (tp.mt ? ' · ' + tp.mt + ' m' : '') + '</div>' : '');
    h += '<div class="tappa"><div class="n"' + (casa ? ' style="background:var(--accento)"' : '') + '>' + num + '</div><div><a href="#/l/' + e(l.s) + '" style="color:inherit;text-decoration:none"><h3>' + e(l.n) + '</h3></a>' +
         '<div class="piccolo">' + (arrivo < 1440 ? '≈ ' + fmt(arrivo) : '') + (tp.so ? ' · ' + tp.so + ' ' + e(T.min) : '') + '</div>' +
         '<div class="meta" style="margin-top:4px">' + etichetta(sa) + '</div>' + (tp.nota ? '<p style="margin:6px 0 0">' + e(tp.nota) + '</p>' : '');
    var chiusoArrivo = (sa.k === 'chiuso_oggi' || sa.k === 'chiuso_ora' || (sa.k === 'apre' && hm(sa.da) - arrivo > 30));
    if(chiusoArrivo){
      h += '<div class="alt"><b>' + e(T.chiuso_arrivo) + '.</b>';
      if(tp.alt && LU[tp.alt]) h += ' ' + e(T.alternativa) + ': <a href="#/l/' + e(LU[tp.alt].s) + '">' + e(LU[tp.alt].n) + '</a> ' + etichetta(stato(LU[tp.alt], ora, arrivo));
      h += '</div>';
    }
    h += '</div></div>';
    t += tp.so;
  });
  h += fontiHtml(i.fonti);
  setTimeout(function(){ mappa('m-itin', punti, true); });
  return h;
};
V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), h = indietro() + '<h2>' + e(l.n) + '</h2>';
  h += fotoHtml(l.foto);
  if(l.som) h += '<p style="font-size:1.05rem">' + e(l.som) + '</p>';
  h += '<section class="scheda"><div class="meta">' + etichetta(stato(l, ora, ora.min)) + '</div>';
  if(!l.sa && verificati(l, ora) && l.or.length){
    h += '<table class="orari" style="margin-top:10px">';
    for(var g = 1; g <= 7; g++){
      var f = fasceDelGiorno(l, ora.data, g), aperte = f.filter(function(o){ return !o.x && o.da; });
      var txt = f.some(function(o){ return o.x; }) || !aperte.length ? T.giorni_chiusura : aperte.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      h += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>';
    }
    h += '</table><p class="piccolo" style="margin:8px 0 0">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  }
  if(l.po || l.sito) h += '<p style="margin:10px 0 0">' + (l.po ? '<a href="' + e(l.po) + '" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  var info = [];
  if(l.dv) info.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) info.push(e(T.gratuito)); else if(l.gr === false) info.push(e(T.pagamento));
  if(l.mp) info.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(info.length) h += '<p class="piccolo" style="margin:10px 0 0">' + info.join(' · ') + '</p>';
  h += '</section>';
  if(l.rac) h += '<div class="testo">' + par(l.rac) + '</div>';
  if(l.con) h += '<section class="scheda"><h3>' + e(T.consiglio) + '</h3><p style="margin:0">' + e(l.con) + '</p></section>';
  if(l.acc) h += '<section class="scheda"><h3>' + e(T.accessibilita) + '</h3><p style="margin:0">' + e(l.acc) + '</p></section>';
  if(l.lat != null){
    h += '<div class="mappa" id="m-luogo" style="height:240px"></div>';
    h += '<p><a class="bottone" href="https://www.openstreetmap.org/?mlat=' + l.lat + '&amp;mlon=' + l.lon + '#map=18/' + l.lat + '/' + l.lon + '" rel="noopener">' + e(T.apri_mappa) + '</a></p>';
    setTimeout(function(){ mappa('m-luogo', [{id: l.id, t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}], false); });
  }
  h += fontiHtml(l.fonti);
  return h;
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return indietro() + '<h2>' + e(r.t) + '</h2>' + fotoHtml(r.foto) + '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti);
};
V.mappa = function(){
  var ora = adesso(), punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l, n){ return {id: l.id, t: l.s === 'piazza-carita' ? '★' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: l.s === 'piazza-carita'}; });
  setTimeout(function(){ mappa('m-tutti', punti, true); });
  return indietro() + '<h2>' + e(T.mappa) + '</h2><div class="mappa" id="m-tutti" style="height:60vh"></div>';
};
V.piove = function(){
  var ora = adesso(), cop = D.luoghi.filter(function(l){ return D.coperto.indexOf(l.tipo) >= 0 && !l.sa; });
  var h = indietro() + '<h2>☂ ' + e(T.piove) + '</h2><p class="piccolo">' + e(T.piove_testo) + '</p>';
  if(!cop.length) return h + '<p>' + e(T.piove_vuoto) + '</p>';
  var peso = {aperto: 0, apre: 1, verifica: 2, chiuso_ora: 3, chiuso_oggi: 4};
  cop.sort(function(a, b){ return (peso[stato(a, ora, ora.min).k] || 0) - (peso[stato(b, ora, ora.min).k] || 0); });
  return h + '<ul class="lista">' + cop.map(function(l){ return voceLuogo(l, ora); }).join('') + '</ul>';
};
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h;
  if(p[0] === 'i') h = V.itinerario(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'l') h = V.luogo(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'r') h = V.racconto(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'mappa') h = V.mappa();
  else if(p[0] === 'piove') h = V.piove();
  else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<div class="avviso prova">' + e(T.anteprima) + '</div>' : '') + h +
    '<footer><p><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a></p><p>' + e(T.editoriale) + '<br>' + e(T.senza_rete) + '</p></footer>';
  if(p[0]) window.scrollTo(0, 0);
}
document.getElementById('t-titolo').textContent = T.titolo;
document.getElementById('t-sotto').textContent = T.sottotitolo;
if(D.lingue.length){
  document.getElementById('lingue').innerHTML = '<details class="lingue"><summary aria-label="' + e(T.lingua) + '">' + e((D.lingue.filter(function(x){ return x.c === D.lingua; })[0] || {}).b || '') + ' ' + e(D.lingua.toUpperCase()) + ' ▾</summary><ul>' +
    D.lingue.map(function(x){ return '<li><a data-lng="' + e(x.c) + '" href="' + e(x.u || './') + '"' + (x.c === D.lingua ? ' aria-current="true"' : '') + '>' + e(x.b + ' ' + x.n) + '</a></li>'; }).join('') + '</ul></details>';
  document.getElementById('lingue').addEventListener('click', function(ev){ var a = ev.target.closest('a[data-lng]'); if(!a) return; try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; });
  /* stessa scelta di lingua del menu: chi l'ha gia' scelta la ritrova */
  if(D.lingua === 'it'){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
}
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
