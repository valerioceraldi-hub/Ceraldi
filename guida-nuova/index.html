<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guida di Napoli · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="caratteri/caratteri.css">
<link rel="stylesheet" href="mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:var(--superficie);border-radius:14px;padding:14px}
.guarda .mini{width:32px;height:32px;position:relative}
.guarda.con-foto{grid-template-columns:minmax(0,1fr);padding:0 0 14px;overflow:hidden}
.guarda.con-foto .mini{width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.guarda.con-foto>div:last-child{padding:0 14px}
.guarda .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.02rem}
.guarda .dove{font-size:.82rem;color:var(--accento);font-weight:500}
.guarda p{font-size:.95rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="pagina" id="app" aria-live="polite"></main>
<script>
var D = {"lingua":"it","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità e via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Il punto di partenza: Piazza Carità, sulla via Toledo. Da qui il centro storico comincia a pochi minuti a piedi. E qui c'è Ceraldi.","rac":"","con":"Prima di partire, un caffè: il giro è lungo e Napoli si visita meglio con la tazzina giusta.","acc":"","foto":{"u":"img/15021c80962d.jpg","alt":"Piazza Carità oggi, con gli alberi e i palazzi colorati","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità oggi, sulla via Toledo: da qui partono tutti i giri. Ceraldi è qui."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[{"u":"img/6f4c11148f21.jpg","alt":"Foto d'epoca di via Toledo nell'Ottocento, con carrozze e passanti","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo nell'Ottocento, quando si chiamava via Roma, in una foto di Giacomo Brogi."}],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, il decumano inferiore","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La strada dritta che taglia in due il centro storico: il decumano inferiore della città greca, circa due chilometri di chiese, botteghe e vita.","rac":"Spaccanapoli è il più basso dei tre decumani, le strade parallele che attraversavano da ovest a est la Neapolis greca. Comincia in piazza del Gesù Nuovo con il nome di via Benedetto Croce, poi diventa via San Biagio dei Librai, attraversa via Duomo e prosegue oltre il centro antico: in tutto circa due chilometri. Il nome dice tutto: è così lunga e dritta che, vista dall'alto, sembra spaccare la città in due.","con":"Percorrila a piedi da piazza del Gesù verso via Duomo: è in leggera discesa di storia, non di fatica.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Piazza e Chiesa del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una facciata di pietre a punta di piramide che sembra una fortezza e nasconde un mistero: segni incisi che nessuno ha ancora decifrato con certezza.","rac":"Prima di essere una chiesa era un palazzo: quello dei principi Sanseverino, costruito nel 1470; una lapide sulla facciata ricorda l'architetto, Novello da San Lucano. I gesuiti ne conservarono la struttura e il bugnato in piperno scuro, con le pietre tagliate a punta di piramide, aggiungendo elementi in marmo bianco.\n\nSu alcune pietre si vedono segni incisi. Per la leggenda sono un messaggio segreto; per alcuni studiosi sono i marchi lasciati dalle diverse squadre di tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali di uno spartito chiamato «Enigma». Guardali da vicino e scegli tu la tua versione.\n\nLa facciata è stata restaurata e presentata il 12 marzo 2023, dopo la caduta di alcuni frammenti nel dicembre 2017; da allora la piazza è chiusa alle auto.","con":"Cerca i segni sulle pietre all'altezza degli occhi, a destra e a sinistra del portale: la caccia è gratuita.","acc":"","foto":{"u":"img/96d5545e33d7.jpg","alt":"La facciata del Gesù Nuovo, di pietre scure tagliate a punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La facciata a punte di diamante: era il palazzo dei principi Sanseverino, del 1470. Avvicinati e cerca i segni incisi sulle pietre."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La facciata a punte di diamante","x":"Prima di essere una chiesa era la facciata del palazzo dei principi Sanseverino, del 1470. I gesuiti la tennero com'era, con le pietre di piperno scuro tagliate a punta di piramide, e vi inserirono il grande portale barocco. Avvicinati: su molte pietre ci sono segni incisi, e ancora oggi non c'è accordo su cosa significhino.","d":"Fuori, sulla piazza","foto":null},{"t":"La cacciata di Eliodoro","x":"Il grande affresco della controfacciata è di Francesco Solimena, del 1725. Racconta Eliodoro che tenta di saccheggiare il tempio di Gerusalemme e viene respinto da un cavaliere celeste: una scena piena di movimento, di cavalli e di figure in fuga. Molti visitatori non lo vedono perché entrano guardando l'altare.","d":"Appena entrato, girati verso la porta: è sopra l'ingresso","foto":{"u":"img/7a0dd25a648c.jpg","alt":"Il grande affresco della Cacciata di Eliodoro di Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"L'affresco di Solimena sopra l'ingresso: girati verso la porta per vederlo. Al centro il cavaliere celeste che respinge Eliodoro."}},{"t":"La cupola e i quattro evangelisti","x":"Nei quattro triangoli alla base della cupola ci sono gli evangelisti dipinti da Giovanni Lanfranco. La cupola che vedi però non è quella originale: crollò con il terremoto del 1688 e fu sostituita nel 1786 da una struttura più bassa, a forma di scodella.","d":"Al centro della chiesa, guarda in alto","foto":null},{"t":"Il cappellone di Sant'Ignazio","x":"Dedicato al fondatore dei gesuiti, unisce due grandi nomi del Seicento napoletano: Cosimo Fanzago, autore delle architetture e delle statue dei profeti Davide e Geremia, e Jusepe de Ribera, che dipinse le tele con la vita del santo. Marmi colorati, statue e pittura insieme: il barocco napoletano al suo massimo.","d":"In uno dei due grandi cappelloni della chiesa","foto":null},{"t":"San Giuseppe Moscati","x":"Qui riposa il «medico santo» di Napoli: Giuseppe Moscati, ricercatore e professore universitario, che curava gratis i poveri. Morì nel 1927 e fu proclamato santo nel 1987. Le sue spoglie sono in un'urna di bronzo dello scultore Amedeo Garufi, sotto l'altare della cappella della Visitazione.","d":"Nella cappella della Visitazione, sotto l'altare","foto":null}],"gal":[{"u":"img/4a574d8f9faf.jpg","alt":"La piazza del Gesù Nuovo davanti alla chiesa","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La piazza del Gesù Nuovo, davanti alla chiesa."},{"u":"img/6d1ae4837518.jpg","alt":"L'interno del Gesù Nuovo, con marmi colorati e l'altare maggiore","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, il contrasto con la facciata severa: marmi colorati, affreschi e oro fino all'altare maggiore."},{"u":"img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo vista dall'ingresso","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata vista dall'ingresso: in fondo, in alto, la cupola con gli evangelisti di Lanfranco alla base."}],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monastero e Complesso di Santa Chiara (chiostro maiolicato)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Il chiostro rivestito di maioliche è uno dei luoghi più quieti del centro: a due passi dal caos di Spaccanapoli, il silenzio.","rac":"Santa Chiara nasce nel 1310 per volere del re Roberto d'Angiò e della regina Sancia di Maiorca. I lavori furono guidati prima da Gagliardo Primario e poi da Lionardo di Vito, e nel 1340 la chiesa fu aperta al culto. Il complesso era doppio: un convento per le monache clarisse e uno per i frati minori, vicini ma separati.\n\nQuattro secoli dopo, su suggerimento della regina Maria Amalia di Sassonia, moglie di Carlo di Borbone, il chiostro delle clarisse fu rinnovato. L'architetto Domenico Antonio Vaccaro tenne gli archi gotici del Trecento e trasformò il centro in un giardino barocco, rivestito dalle maioliche della bottega di Donato e Giuseppe Massa. Il risultato è uno dei luoghi più sorprendenti di Napoli: un giardino di ceramica a due passi da Spaccanapoli.","con":"La domenica il chiostro chiude alle 14: se è domenica pomeriggio, scambia l'ordine e vieni qui per primo.","acc":"","foto":{"u":"img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Chiostro e museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Chiostro e museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"}],"ant":true,"dett":[{"t":"I pilastri di maiolica","x":"Sessantaquattro pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto un pergolato. Il giallo, l'arancio e il blu richiamano gli agrumi e la vite che crescono intorno. Le maioliche sono della bottega di Donato e Giuseppe Massa, nel giardino barocco disegnato da Domenico Antonio Vaccaro.","d":"Nel giardino del chiostro","foto":{"u":"img/924627d30fda.jpg","alt":"Pilastri rivestiti di maioliche gialle e verdi nel chiostro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"I pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto il pergolato."}},{"t":"Le scene sui sedili","x":"I sedili che uniscono i pilastri sono tutti di maiolica e sugli schienali sono dipinte piccole scene: vita di campagna, di mare, feste popolari, miti. Sono il Settecento napoletano raccontato in figure. Siediti e guarda da vicino quello alle tue spalle.","d":"Sugli schienali dei sedili tra i pilastri","foto":{"u":"img/79ec1acbab17.jpg","alt":"Un sedile di maiolica con una scena dipinta sullo schienale","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un sedile di maiolica del chiostro: sullo schienale c'è una scena dipinta."}},{"t":"La clarissa con i gatti","x":"Tra le scene c'è una monaca clarissa che dà da mangiare ai gatti del chiostro: un piccolo momento di vita quotidiana del monastero, dipinto sulla maiolica. Trovarla è una caccia al tesoro perfetta, anche per i bambini.","d":"Su uno degli schienali dei sedili: cercala","foto":null},{"t":"Gli archi del Trecento","x":"Il giardino è barocco, ma la cornice è medievale: Vaccaro conservò il perimetro trecentesco con gli archi a sesto acuto del monastero angioino. Guarda il contrasto tra la pietra severa degli archi e i colori allegri delle maioliche: quattro secoli in un solo sguardo.","d":"Lungo i quattro lati del chiostro","foto":null}],"gal":[{"u":"img/f5b30f6df9dc.jpg","alt":"Maioliche con una scena di caccia al cinghiale","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Da vicino: una caccia al cinghiale dipinta sulle maioliche dalla bottega dei Massa, tra il 1739 e il 1742."},{"u":"img/f13f406e9a70.jpg","alt":"Il chiostro con i pilastri di maiolica, i sedili e il giardino","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Il chiostro intero: i pilastri di maiolica, i sedili e il giardino."}],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Cappella Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Il Cristo velato, una delle sculture più famose al mondo, e le macchine anatomiche del principe alchimista Raimondo di Sangro.","rac":"La cappella della famiglia di Sangro è il regno di Raimondo, principe di Sansevero: uomo di scienza e di segreti, Gran Maestro della Massoneria, attorno al quale il mito nacque quando era ancora vivo, e fu lui stesso ad alimentarlo.\n\nAl centro c'è il Cristo velato di Giuseppe Sanmartino, commissionato dal principe: un corpo disteso coperto da un sudario così sottile da sembrare stoffa bagnata, ma scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea si trovano le due «macchine anatomiche», scheletri di un uomo e di una donna con il sistema dei vasi sanguigni ricostruito, opera del medico palermitano Giuseppe Salerno intorno al 1756-1764. La leggenda nera racconta di servi sacrificati e di iniezioni misteriose; il museo stesso separa con cura il mito dalla storia documentata.","con":"Il martedì è chiusa: se oggi è martedì, la statua del Nilo è a due minuti e si vede sempre.","acc":"La navata e la sagrestia sono visitabili anche in carrozzina. La cavea sotterranea con le macchine anatomiche si raggiunge solo da una stretta scala a chiocciola dell'Ottocento.","foto":{"u":"img/65421f883be6.jpg","alt":"L'esterno della Cappella Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Cappella Sansevero vista da fuori."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Il Cristo velato","x":"Un corpo disteso su un materasso, coperto da un sudario così sottile che sotto si leggono il volto, le ferite e le vene. Il velo non è aggiunto: Giuseppe Sanmartino lo ha ricavato dallo stesso blocco di marmo della statua, su commissione del principe Raimondo di Sangro. Giragli intorno lentamente: da ogni lato il velo sembra cambiare.","d":"Al centro della navata","foto":{"u":"img/625d7cbbb2af.jpg","alt":"Il volto del Cristo velato sotto il velo di marmo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Il volto sotto il velo: il sudario è scolpito nello stesso blocco di marmo della statua, eppure sembra stoffa bagnata."}},{"t":"La Pudicizia","x":"Una donna avvolta da un velo che aderisce alla pelle come se fosse bagnato, con una ghirlanda di rose. La scolpì Antonio Corradini nel 1752, l'anno della sua morte, e il principe la dedicò alla madre, Cecilia Gaetani, scomparsa quando lui non aveva ancora un anno. Cerca la lapide spezzata ai suoi piedi: è il segno di una vita interrotta troppo presto.","d":"Vicino all'altare maggiore","foto":{"u":"img/caa3cd3d9215.jpg","alt":"La statua della Pudicizia, una donna coperta da un velo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La Pudicizia di Antonio Corradini: il velo aderisce al corpo come se fosse bagnato. Ai suoi piedi la lapide spezzata."}},{"t":"Il Disinganno","x":"Un uomo si libera da una grande rete con l'aiuto di un piccolo genio alato che ha una fiamma sulla fronte, simbolo dell'intelletto. Francesco Queirolo la scolpì nel 1753-54 per ricordare il padre del principe. La rete è tutta in marmo, traforata: secondo la tradizione gli aiutanti si rifiutarono di rifinirla per paura di spezzarla, e lo scultore la levigò da solo.","d":"Vicino all'altare maggiore","foto":{"u":"img/921cf7f91318.jpg","alt":"La statua del Disinganno, un uomo che si libera da una rete","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Il Disinganno di Francesco Queirolo: la rete è tutta di marmo, traforata a mano."}},{"t":"Il pavimento labirintico","x":"Il pavimento originale era un labirinto di marmi colorati attraversato da una linea bianca continua, ideato dal principe come immagine del difficile cammino verso la conoscenza. Lo realizzò Francesco Celebrano fino al 1771 circa. Un crollo nel 1889 lo distrusse quasi tutto: ne restano alcune lastre nel passaggio davanti alla tomba di Raimondo, nella cavea e in sagrestia.","d":"Nel passaggio davanti alla tomba del principe","foto":null},{"t":"Le macchine anatomiche","x":"Due scheletri, di un uomo e di una donna, con il sistema dei vasi sanguigni ricostruito con una precisione che ancora sorprende. Le realizzò il medico palermitano Giuseppe Salerno tra il 1756 e il 1764 circa. Intorno a loro è nata la leggenda nera del principe: il museo racconta con cura dove finisce la storia e dove comincia il mito.","d":"Nella cavea sotterranea, scendendo una stretta scala a chiocciola","foto":null}],"gal":[{"u":"img/13d7137edcd0.jpg","alt":"L'interno della Cappella Sansevero con le statue","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La cappella intera: al centro il Cristo velato, intorno le statue della famiglia di Sangro."}],"leg":"Su Raimondo di Sangro si raccontava già in vita di tutto: esperimenti misteriosi, segreti alchemici, persino servi trasformati nelle macchine anatomiche. Il museo distingue con cura la leggenda nera dai fatti documentati: vale la pena ascoltare entrambe le versioni e scegliere da che parte stare.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli e statua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"img/223832909fbe.jpg","alt":"La statua antica del dio Nilo, sdraiato","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statua del dio Nilo, sdraiato, nella piccola piazza che porta il suo nome."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai e le sue botteghe","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La parte di Spaccanapoli dei librai e degli artigiani: botteghe, chiese e l'Ospedale delle Bambole.","rac":"È il tratto di Spaccanapoli che va da piazzetta Nilo a via Duomo, sul decumano inferiore. Il nome viene dalle botteghe di libri che vi si trovavano da sempre: un'iscrizione sul vicino Palazzo Marigliano ricorda proprio l'arte dei maestri librai. La devozione a san Biagio risale all'VIII secolo, quando monache venute dall'Armenia portarono a Napoli una reliquia del santo. Lungo la strada c'è anche l'Ospedale delle Bambole, bottega artigiana tramandata di generazione in generazione.","con":"Dicembre è il mese delle botteghe dei presepi: preparati alla folla nei fine settimana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai e il teschio con le orecchie","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una piccolissima chiesa dei tagliapietre dedicata alla santa degli occhi, e un teschio unico al mondo: quello con le orecchie.","rac":"Fondata poco prima del 1327 da Bartolomeo di Capua, giurista dei re angioini, la chiesa fu poi affidata ai pipernieri, i tagliatori di pietra: scelsero santa Lucia, protettrice della vista, perché le schegge del loro mestiere mettevano a rischio gli occhi.\n\nAbbandonata per più di trent'anni, è stata riaperta il 5 aprile 2019 grazie all'associazione Respiriamo Arte. Nel suo ipogeo il culto delle anime pezzentelle ha lasciato un teschio che non ha eguali: ha le orecchie.","con":"È piccola e si visita in pochi minuti: perfetta come pausa tra Sansevero e via dei Tribunali.","acc":"","foto":{"u":"img/fff63e79f1d9.jpg","alt":"Il portale di Santa Luciella nel vicolo","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Il portale di Santa Luciella. Alza gli occhi: sopra c'è l'affresco con lo stemma dei pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"}],"ant":true,"dett":[{"t":"Lo stemma dei pipernieri","x":"Prima di entrare alza gli occhi: sopra il portale in piperno c'è ancora l'affresco con lo stemma della corporazione dei pipernieri, i tagliatori di pietra a cui la chiesa apparteneva. Lavoravano tra le schegge e per questo scelsero santa Lucia, protettrice della vista.","d":"Sopra il portale d'ingresso","foto":null},{"t":"Il teschio con le orecchie","x":"Sotto la chiesa, nell'ipogeo, c'è un teschio che ha conservato le cartilagini delle orecchie: per questo è unico. La tradizione popolare dice che, proprio perché ha le orecchie, ascolta meglio le preghiere di chi gli chiede una grazia.","d":"Nell'ipogeo, con la visita guidata","foto":null},{"t":"Le anime pezzentelle","x":"Nel Seicento, dopo la peste, i napoletani «adottavano» i teschi dei morti senza nome: li pulivano, pregavano per loro e in cambio chiedevano un aiuto. È il culto delle anime pezzentelle, le anime povere. Qui ne resta una delle testimonianze più famose della città.","d":"Nell'ipogeo","foto":null}],"gal":[],"leg":"Si dice che il teschio con le orecchie, proprio perché ha le orecchie, ascolti meglio le preghiere: per questo per generazioni gli sono state affidate le richieste più difficili.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Ospedale delle Bambole","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una bottega che da generazioni «cura» bambole e giocattoli: una vetrina che i bambini, e non solo, ricordano per sempre.","rac":"Alla fine dell'Ottocento Luigi Grassi lavorava come scenografo per teatri e presepi. I vicini cominciarono a portargli bambole e giocattoli rotti, e la sua bottega diventò, quasi per caso, il primo «ospedale» per giocattoli di Napoli.\n\nOggi lo porta avanti Tiziana, pronipote del fondatore, nel cortile di Palazzo Marigliano in via San Biagio dei Librai. Dentro funziona come un ospedale vero: camici bianchi, reparti e una cartella clinica per ogni paziente. Per molti napoletani è il luogo dove da bambini hanno portato il loro giocattolo preferito.","con":"Anche solo la vetrina vale la sosta: è sulla strada del ritorno.","acc":"","foto":{"u":"img/fb7ec54d1f19.jpg","alt":"La vetrina dell'Ospedale delle Bambole piena di bambole","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vetrina dell'Ospedale delle Bambole: bambole e giocattoli in attesa di essere «curati»."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"}],"ant":true,"dett":[{"t":"Un ospedale vero, per giocattoli","x":"Non è un negozio ma un laboratorio organizzato come un ospedale: i «medici» in camice bianco, i reparti di ortopedia, oculistica e sartoria, e i pazienti, bambole, orsacchiotti e peluche, ognuno con la sua cartella clinica e la sua diagnosi.","d":"Nella bottega","foto":null},{"t":"Il fondatore scenografo","x":"Tutto cominciò alla fine dell'Ottocento con Luigi Grassi, scenografo per teatri e presepi: i vicini iniziarono a portargli i giocattoli rotti e lui trasformò il laboratorio nel primo «ospedale». Oggi a curare i pazienti è Tiziana, sua pronipote.","d":"Nella storia della bottega","foto":null},{"t":"Il cortile di Palazzo Marigliano","x":"L'ospedale si trova nel cortile di Palazzo Marigliano, lungo Spaccanapoli. Entrando dal portone, il rumore della strada si spegne: è uno dei tanti cortili nascosti del centro storico che vale la pena scoprire.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la chiesa delle capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La chiesa delle capuzzelle: sotto il pavimento, l'ipogeo dove Napoli pregava per le anime senza nome. E il teschio di Lucia.","rac":"I napoletani la chiamano «'e cape 'e morte», la chiesa delle teste di morto. È una piccola chiesa del Seicento sul decumano maggiore, legata alla devozione per le anime del Purgatorio diffusa dalla Controriforma. Una scala ripida porta all'ipogeo, la chiesa sotterranea, ampliato e decorato con maioliche nel Settecento: qui i devoti si prendevano cura di resti anonimi e chiedevano loro intercessione. In fondo a un piccolo corridoio è custodito il teschio di Lucia, un'anima giovane particolarmente amata.","con":"Dietro l'altare cerca il teschio alato in marmo di Dionisio Lazzari: è il simbolo della chiesa.","acc":"","foto":{"u":"img/66f88d49a737.jpg","alt":"La facciata del Purgatorio ad Arco su via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La facciata del Purgatorio ad Arco, sul decumano maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true,"dett":[{"t":"I dipinti del Seicento","x":"Prima di scendere, guarda la chiesa di sopra: custodisce marmi preziosi e dipinti di tre maestri del Seicento napoletano, Massimo Stanzione, Luca Giordano e Andrea Vaccaro. È la parte «di sopra» di un luogo che vive soprattutto di quello che c'è sotto.","d":"Nella chiesa superiore","foto":null},{"t":"Il teschio alato","x":"Tra le decorazioni della chiesa c'è un teschio con le ali, opera di Dionisio Lazzari: un'immagine che riassume lo spirito del luogo, dove la morte non fa paura ma diventa occasione di preghiera e di legame con chi non c'è più.","d":"Nella chiesa superiore","foto":null},{"t":"L'ipogeo delle anime","x":"La vera chiesa è quella sotterranea: un grande ambiente dove ancora oggi i devoti si prendono cura di resti umani senza nome e chiedono loro protezione. Fu ampliato e decorato con maioliche nel Settecento. Scendi piano: è un luogo di devozione viva, non solo di curiosità.","d":"Sotto la chiesa, scendendo una scala ripida","foto":null},{"t":"Il teschio di Lucia","x":"Tra tutti i teschi dell'ipogeo ce n'è uno particolarmente amato: quello di Lucia, ritenuto l'anima di una giovane. È custodito in fondo a un piccolo corridoio ed è la testimonianza più toccante del culto delle anime del Purgatorio.","d":"Nell'ipogeo, in fondo a un piccolo corridoio","foto":null}],"gal":[{"u":"img/36b3b8212bd1.jpg","alt":"Un'immagine delle anime del Purgatorio tra le fiamme dentro la chiesa","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro la chiesa: le anime del Purgatorio tra le fiamme, il tema di tutto il luogo."},{"u":"img/de63b1b83fa8.jpg","alt":"Un teschio di bronzo su una colonnina","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un teschio di bronzo: il simbolo della chiesa delle «capuzzelle»."}],"leg":"","fc":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Quaranta metri sotto via dei Tribunali: le cisterne che per secoli hanno dato l'acqua a Napoli, i rifugi della guerra e un teatro romano nascosto sotto il letto di una casa.","rac":"Sotto il centro storico c'è un'altra città. Da Piazza San Gaetano si scendono oltre cento gradini fino a circa 40 metri di profondità, lungo un percorso che attraversa l'acquedotto greco-romano e cunicoli di epoca medievale, borbonica e moderna.\n\nLe cavità di epoca greca furono usate come cisterne per l'acqua della città per circa 23 secoli. Durante la Seconda guerra mondiale gli stessi spazi diventarono rifugi antiaerei.\n\nLa visita sottoterra è guidata e dura circa un'ora. Poi si torna in superficie per l'ultima sorpresa: i resti del teatro greco-romano di Neapolis, inglobati dal Quattrocento nelle case del quartiere. Si entra in un «basso», una casa al piano terra, si sposta un letto e da una botola si scende tra le mura del teatro.","con":"Scarpe basse e una felpa anche d'estate: sottoterra è umido. Il breve passaggio stretto con la candela è facoltativo. Per i gruppi da 10 persone in su serve la prenotazione.","acc":"Non adatto a sedie a rotelle e deambulatori: ci sono scale, con corrimano, e passaggi stretti.","foto":{"u":"img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Visite guidate in partenza ogni ora dalle 10 alle 18, in italiano e in inglese. Giovedì anche alle 21, solo su prenotazione e con almeno 10 persone."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Le cisterne greco-romane","x":"Le stanze di epoca greca, scavate nel tufo, furono per circa 23 secoli le cisterne dell'acqua di Napoli, collegate dall'acquedotto greco-romano.","d":"Nella prima parte della visita, a circa 40 metri di profondità","foto":{"u":"img/bd8239fed0ef.jpg","alt":"Le pareti di tufo di una cisterna sotterranea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Le pareti di tufo di una cisterna: per circa 23 secoli qui si raccoglieva l'acqua della città."}},{"t":"Il passaggio con la candela","x":"Un tratto brevissimo e stretto si percorre con una candela in mano. È facoltativo: chi preferisce lo salta, e al posto della candela si può usare la torcia del telefono.","d":"Lungo il percorso sotterraneo","foto":{"u":"img/a874f33cc5df.jpg","alt":"Un cunicolo strettissimo illuminato nel tufo","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Uno dei cunicoli strettissimi scavati nel tufo."}},{"t":"I rifugi della guerra","x":"Durante la Seconda guerra mondiale queste stanze sotterranee furono usate come rifugi antiaerei: qui la città si riparava dai bombardamenti.","d":"Lungo il percorso sotterraneo","foto":{"u":"img/0f4490838101.jpg","alt":"Oggetti della Seconda guerra mondiale esposti sottoterra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"I ricordi della guerra: oggetti di quando queste stanze erano rifugi antiaerei."}},{"t":"Il teatro sotto il letto","x":"I resti del teatro greco-romano di Neapolis sono stati inglobati dal Quattrocento nelle case di oggi. Si entra in un basso, si sposta il letto e da una botola si scende tra le mura del teatro.","d":"Seconda parte della visita, in superficie tra via Anticaglia e vico Cinquesanti","foto":null}],"gal":[],"leg":"Secondo il racconto della visita, nelle stanze nascoste sotto il basso Nerone aveva i suoi camerini, quando veniva a Napoli a esibirsi nel teatro.","fc":"si"},{"id":18,"s":"duomo-san-gennaro","n":"Duomo e Tesoro di San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cattedrale di Napoli e la Cappella del Tesoro, dove si custodisce l'ampolla del sangue di San Gennaro.","rac":"Nel Duomo, in una nicchia della Cappella del Tesoro, è custodita l'ampolla con il sangue che la tradizione attribuisce a San Gennaro. Tre volte l'anno (il sabato prima della prima domenica di maggio, il 19 settembre e il 16 dicembre) se ne attende la liquefazione. Le reliquie sono affidate dal 1601 a un'istituzione laica, la Deputazione della Cappella del Tesoro di San Gennaro.","con":"Nei giorni della liquefazione il Duomo è pieno fin dal mattino: se vuoi esserci, arriva presto.","acc":"","foto":{"u":"img/bbfb14ecb434.jpg","alt":"La facciata del Duomo di Napoli","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La facciata del Duomo, su via Duomo. La Cappella del Tesoro è la terza a destra."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Il portale di San Gennaro","x":"La facciata, alta circa cinquanta metri, ha tre portali. Quello di destra resta chiuso quasi tutto l'anno: si apre solo per le feste di San Gennaro e in occasioni straordinarie. Se lo trovi aperto, sei capitato in un giorno speciale.","d":"In facciata, a destra","foto":null},{"t":"La Cappella del Tesoro","x":"Più che una cappella è una chiesa nella chiesa: barocca, a croce greca, con una cupola a doppia calotta e un grande cancello di bronzo di Cosimo Fanzago. Qui sono custoditi il busto d'argento di San Gennaro e le ampolle con il suo sangue, di cui la città attende la liquefazione.","d":"Terza cappella a destra","foto":{"u":"img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro affrescata con il Paradiso","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Alza gli occhi: nella cupola della Cappella del Tesoro c'è il Paradiso dipinto da Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Quando Carlo d'Angiò fece costruire il Duomo, nel 1294, una delle basiliche più antiche fu conservata come cappella: è Santa Restituta. Ospita opere di Luca Giordano e sculture del Trecento, e da qui si scende all'area archeologica con i resti greco-romani e paleocristiani sotto la cattedrale.","d":"Nella navata sinistra","foto":{"u":"img/5abf53aec271.jpg","alt":"Un mosaico con la Madonna in trono nella basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico con la Madonna in trono, dentro Santa Restituta: la basilica più antica, conservata come cappella del Duomo."}},{"t":"Il battistero di San Giovanni in Fonte","x":"Un piccolo ambiente con una storia immensa: è considerato il battistero più antico d'Occidente. Fermati qualche minuto: sei in uno dei luoghi cristiani più antichi d'Europa ancora in piedi.","d":"A destra dell'abside","foto":null},{"t":"Il Succorpo","x":"Sotto l'altare c'è una cripta rinascimentale a tre navate, voluta dal cardinale Oliviero Carafa per custodire le reliquie di San Gennaro e di altri santi, su progetto di Giovan Tommaso Malvito. Colonne antiche e marmi bianchi: un Rinascimento silenzioso dentro la cattedrale gotica.","d":"Sotto l'altare maggiore","foto":null}],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"La Madonna con la pistola di Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Madonna di Banksy con una pistola al posto dell'aureola, protetta da un vetro, nel cuore del decumano maggiore.","rac":"In piazzetta dei Girolamini, su una facciata del decumano maggiore, Banksy ha lasciato una Madonna con una pistola al posto dell'aureola. Oggi è protetta da un vetro. Il portale turistico ufficiale della città la include nel suo itinerario dedicato alla street art del centro storico.","con":"Alza gli occhi: l'opera è sopra il livello della strada, dietro un vetro.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Madonna con la pistola","x":"Bianco su fondo nero, a stencil: una Madonna con le braccia aperte verso il cielo e, al posto dell'aureola, una pistola. Banksy la dipinse a Napoli nel 2010. Il messaggio non è spiegato: ognuno la legge a modo suo, tra sacro e profano.","d":"Sul muro della piazzetta","foto":null},{"t":"L'edicola accanto","x":"Accanto al murale c'è una piccola edicola votiva con la Madonna col Bambino, di quelle che si trovano in tante strade di Napoli. Le due immagini, una vicina all'altra, sembrano guardarsi: è questo dialogo a rendere l'opera così napoletana.","d":"Subito accanto all'opera","foto":null},{"t":"Un Banksy sotto vetro","x":"Nel 2010 Banksy lasciò a Napoli due opere, probabilmente nella stessa notte: l'altra, in via Benedetto Croce, è stata poi coperta da un altro artista. Per questo il FAI indica questa come l'unico murale di Banksy in Italia, oggi protetto da una teca di plexiglass contro i vandali.","d":"Davanti all'opera","foto":null}],"gal":[],"leg":"","fc":null},{"id":44,"s":"murale-maradona","n":"Il murale di Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"Il murale amatissimo dei Quartieri Spagnoli e il largo che dal 2020 è diventato un santuario laico per Diego.","rac":"Il murale di Maradona fu dipinto nel 1990 da Mario Filardi. Negli anni Novanta l'apertura di una finestra nel muro ne cancellò il volto e il dipinto sbiadì quasi del tutto; fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'artista argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, ha preso il suo nome e si è riempito di altarini, bandiere e fotografie.","con":"Nelle ore di punta è affollatissimo: la mattina presto è più facile vederlo con calma.","acc":"","foto":{"u":"img/a2c6b2a82ec4.jpg","alt":"Il grande murale di Maradona sulla facciata di un palazzo, con la folla sotto","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Il murale dipinto nel 1990 da Mario Filardi. Il volto di oggi è quello ridipinto nel 2017 dall'artista argentino Francisco Bosoletti."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"img/0094144dd2dd.jpg","alt":"La targa di Largo Maradona con un busto e le bandiere","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La targa del largo: dopo la morte di Diego, nel 2020, il largo degli artisti ha preso il suo nome."},{"u":"img/550f6edc4b91.jpg","alt":"Un altarino con foto di Maradona e ricordi","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un altarino dedicato a Maradona: in città ce ne sono tanti, con foto e ricordi lasciati dai tifosi."},{"u":"img/679687d3070c.jpg","alt":"Maradona dipinto con l'aureola accanto a una piccola edicola","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con l'aureola e la sua edicola votiva, dipinto in zona San Lorenzo."},{"u":"img/80d74e92279d.jpg","alt":"Un'edicola votiva con il ritratto di Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un'edicola votiva per Maradona, come quelle dei santi."}],"leg":"","fc":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Castel Nuovo)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Il castello simbolo di Napoli: un arco di trionfo tra due torri, una porta di bronzo ancora colpita da una palla di cannone e la sala dove un re fece arrestare i baroni durante una festa di nozze.","rac":"Con i re angioini il castello diventò un centro di cultura: sotto Roberto d'Angiò vi soggiornarono artisti, medici e letterati, tra cui Giotto, Petrarca e Boccaccio.\n\nAlfonso I d'Aragona ne fece la sua residenza reale e lo ricostruì. Per celebrare il suo ingresso vittorioso in città fece costruire, tra la Torre di Mezzo e la Torre di Guardia, il grande Arco di Trionfo che ancora oggi fa da ingresso.\n\nOggi il castello è la sede del Museo Civico: il percorso comprende la pinacoteca al primo piano, la Sala dei Baroni, la Cappella Palatina, detta anche di Santa Barbara, e un percorso archeologico nell'antica Armeria.","con":"Biglietto intero 10 euro; 6 euro per chi risiede a Napoli e nella città metropolitana; gratis sotto i 18 anni. Chiuso la domenica.","acc":"","foto":{"u":"img/01914a520eb7.jpg","alt":"Il Maschio Angioino con le due torri e l'arco bianco in mezzo","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Le due grandi torri e, in mezzo, l'Arco di Trionfo di Alfonso d'Aragona: è l'ingresso del castello."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"L'Arco di Trionfo","x":"È l'ingresso del castello, stretto tra due torri: Alfonso I d'Aragona lo volle per celebrare il suo ingresso vittorioso a Napoli. Fermati davanti prima di entrare e guardalo dal basso.","d":"All'ingresso, tra la Torre di Mezzo e la Torre di Guardia","foto":{"u":"img/91d08c9a9561.jpg","alt":"L'Arco di Trionfo di marmo tra le due torri","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arco da vicino: guardalo dal basso, piano per piano."}},{"t":"La porta con la palla di cannone","x":"Ferrante d'Aragona la commissionò a Guglielmo Monaco verso il 1475, per ricordare la vittoria del 1462 su Giovanni d'Angiò e i baroni ribelli: sei riquadri raccontano la guerra. Nel pannello in basso a sinistra c'è ancora una palla di cannone di ferro conficcata nel bronzo. L'ipotesi più accreditata: la porta faceva parte del bottino che Carlo VIII caricò sulle navi per la Francia; al largo di Rapallo la flotta fu attaccata dai genovesi e il colpo la raggiunse. I genovesi la rimandarono a Napoli nel 1495.","d":"L'originale è conservato all'interno del castello","foto":{"u":"img/50ee03911e6d.jpg","alt":"La palla di cannone conficcata nella porta di bronzo","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La palla di cannone di ferro conficcata nel bronzo, nel pannello in basso a sinistra."}},{"t":"La Sala dei Baroni","x":"Ci si arriva dalla scala esterna di piperno dell'architetto maiorchino Guglielmo Sagrera. Alza gli occhi: la volta sale a circa 28 metri e sedici costoloni di piperno partono a stella da un'apertura al centro. Il nome ricorda il 1486, quando re Ferrante I invitò con l'inganno i baroni a festeggiare un matrimonio e qui li fece arrestare. Per cinquant'anni è stata la sede del Consiglio Comunale.","d":"In cima alla scala del cortile","foto":{"u":"img/2761d90bc4e9.jpg","alt":"La volta a stella della Sala dei Baroni","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La volta della Sala dei Baroni: sedici costoloni di piperno partono a stella dall'apertura al centro."}}],"gal":[],"leg":"","fc":null},{"id":32,"s":"castel-dell-ovo","n":"Lungomare e Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Il castello sull'isolotto dove sbarcarono i coloni greci venuti da Cuma: si arriva dal lungomare, si attraversa il ponte e si guarda il golfo dal Borgo Marinari.","rac":"Il castello sorge sull'isolotto di Megaride, fatto di due scogli uniti da un grande arco. Qui, a metà del VII secolo a.C., sbarcarono i coloni venuti da Cuma, che poi fondarono Partenope sul vicino Monte Echia.\n\nNel I secolo a.C. sull'isolotto e sul Monte Echia sorgeva la villa di Lucio Licinio Lucullo. Nella Sala delle Colonne ne restano dei resti: nell'alto Medioevo la sala fu il refettorio di uno dei conventi costruiti sull'isolotto.","con":"L'interno del castello è chiuso per lavori fino a nuovo avviso: oggi si visita da fuori, passeggiando sul lungomare e intorno al Borgo Marinari.","acc":"","foto":{"u":"img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"}],"ant":true,"dett":[{"t":"L'isolotto di Megaride","x":"Guarda il castello dal lungomare: poggia su due scogli uniti da un grande arco. È qui, secondo il Comune, che sbarcarono i primi coloni venuti da Cuma.","d":"Dal ponte che porta al Borgo Marinari","foto":{"u":"img/2fa4aa093660.jpg","alt":"Castel dell'Ovo e il porticciolo del Borgo Marinari visti dall'alto","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Dall'alto: il castello sullo scoglio e, accanto, il porticciolo del Borgo Marinari."}}],"gal":[{"u":"img/5fa7bf9a4065.jpg","alt":"Incisione del 1841 con Castel dell'Ovo e una barca a vela","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in un'incisione del 1841."}],"leg":"Il nome viene da una leggenda: il poeta Virgilio avrebbe nascosto un uovo, chiuso in una gabbia, nei sotterranei del castello.","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Il primo giro","sub":"Spaccanapoli in mezza giornata, partendo da Ceraldi","desc":"Il cuore del centro storico in un anello a piedi: il Gesù Nuovo e il suo mistero, il chiostro di Santa Chiara, il Cristo velato, la chiesa del teschio con le orecchie, le botteghe di via San Biagio dei Librai. E si torna da noi.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"img/c9bd165a6d1a.jpg","alt 2,40.84216],[14.24883,40.8422],[14.24883,40.84224],[14.24884,40.84232],[14.24885,40.84235],[14.24886,40.84243],[14.24887,40.8425],[14.24887,40.84253],[14.24889,40.8427],[14.2489,40.84277],[14.24891,40.84281],[14.24894,40.84307],[14.24894,40.8431],[14.24899,40.84349],[14.249,40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Napoli in cinque minuti: dalla sirena alla città nuova","som":"Prima Partenope, poi Neapolis: perché il centro storico è ancora disegnato come una città greca.","txt":"Napoli nasce due volte. La prima volta si chiama Partenope, come la sirena del mito: la fondano nel VII secolo avanti Cristo coloni di origine greca venuti da Cuma, che approdano sull'isolotto di Megaride, dove oggi sorge Castel dell'Ovo, e si stabiliscono sul vicino Monte Echia.\n\nLa seconda volta, intorno al 470 avanti Cristo, accanto alla città vecchia ne sorge una nuova: Neapolis, «città nuova» in greco. È questa che state attraversando. Le sue strade formano una griglia regolare che, dopo venticinque secoli, si legge ancora: il centro storico di Napoli è patrimonio mondiale dell'UNESCO proprio perché il disegno della città greca è rimasto la sua ossatura.\n\nTre strade parallele, i decumani, tagliano la città da ovest a est. Quella più in basso è Spaccanapoli: lunga circa due chilometri, così dritta che vista dall'alto sembra dividere la città in due, da cui il nome. Al centro corre via dei Tribunali, il decumano maggiore; più in alto via dell'Anticaglia e via della Sapienza, il decumano superiore.\n\nDa Piazza Carità, dove siamo noi dal 2002, Spaccanapoli comincia a pochi minuti a piedi, in piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro e il sangue che si scioglie","som":"Tre volte l'anno Napoli trattiene il fiato davanti a un'ampolla. Cosa succede, dove, e cosa ne dicono Chiesa e scienza.","txt":"Nel Duomo di Napoli, in una nicchia della Cappella del Tesoro, è custodita un'ampolla con una sostanza scura che la tradizione indica come il sangue di San Gennaro, patrono della città. Tre volte l'anno, il sabato che precede la prima domenica di maggio, il 19 settembre (giorno della festa) e il 16 dicembre, l'ampolla viene mostrata ai fedeli: se il contenuto, di solito solido, si scioglie, è festa; se resta solido, per molti napoletani è un cattivo presagio.\n\nLa prima notizia conosciuta della liquefazione risale al 1389. A custodire le reliquie non è il clero ma la Deputazione della Cappella del Tesoro di San Gennaro, un'istituzione laica nata nel 1601, di cui fa parte anche il sindaco di Napoli.\n\nLa Chiesa mantiene un atteggiamento prudente: parla di «fatto prodigioso», ne consente la devozione popolare ma non lo impone come verità di fede. Tra le spiegazioni proposte dagli scettici c'è la tissotropia, la proprietà di alcune sostanze che sono solide a riposo e diventano liquide se mosse o scosse.\n\nSacro e profano, qui, convivono da sempre: in via Duomo, a pochi passi dalla cattedrale, lo street artist Jorit ha dipinto un San Gennaro con il volto di un operaio.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Le anime pezzentelle: quando Napoli adottava un teschio","som":"Ossari, capuzzelle e preghiere scambiate con i numeri del lotto: il culto dei morti senza nome.","txt":"Per secoli, a Napoli, i morti senza nome non sono rimasti soli. Li chiamavano anime pezzentelle: le anime povere, morte senza funerale e senza nessuno a pregare per loro. Il nome si lega a «pezzente», il povero, ma anche al latino «petere», chiedere per ricevere: chi pregava per loro sperava di ricevere in cambio protezione e grazie.\n\nIl luogo simbolo è il Cimitero delle Fontanelle, nel Rione Sanità: una cava di tufo del Cinquecento, di circa quattromila metri quadrati, che accolse le vittime della peste del 1656 e poi quelle del colera del 1836-1837. Nel 1872 il canonico Gaetano Barbati sistemò le ossa in tre navate. I devoti «adottavano» un teschio, una capuzzella: lo pulivano, lo mettevano in una piccola teca, lo ornavano di rosari e monete e lo pregavano, aspettando un segno in sogno, a volte un numero da giocare al lotto. Alcuni teschi diventarono famosi: il Capitano, con un'orbita annerita, protagonista di una leggenda di nozze e gelosia; donna Concetta, che si dice «sudi» quando la grazia è concessa.\n\nNel 1969 un decreto del tribunale ecclesiastico chiuse l'ossario e vietò il culto. Chiuso per lavori dal 2020, il cimitero ha riaperto al pubblico nel 2026, gestito dalla cooperativa La Paranza.\n\nIl culto vive anche sotto via dei Tribunali, nell'ipogeo di Santa Maria delle Anime del Purgatorio ad Arco, la chiesa che i napoletani chiamano «'e cape 'e morte»: lì è custodito il teschio di Lucia, un'anima giovane particolarmente amata. E in via San Biagio dei Librai, nella piccola chiesa di Santa Luciella, c'è un teschio unico: quello con le orecchie.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Napoli esoterica: un principe alchimista, una facciata in codice e un uovo magico","som":"Raimondo di Sangro, il bugnato del Gesù Nuovo, l'uovo di Virgilio, il munaciello: dove finisce la storia e comincia la leggenda.","txt":"Napoli ama i misteri, e ne ha di bellissimi. Il più celebre ha un nome: Raimondo di Sangro, principe di Sansevero, uomo del Settecento, Gran Maestro della Massoneria napoletana, inventore geloso dei propri segreti. Il mito lo accompagnava già in vita, e fu lui stesso ad alimentarlo. Benedetto Croce lo definì l'incarnazione napoletana del dottor Faust. La leggenda nera gli attribuisce di tutto: servi uccisi per studiarne i corpi, persino l'accecamento dello scultore del Cristo velato perché non ne scolpisse un altro. Sono leggende, e lo stesso museo le distingue dalla storia documentata.\n\nIl Cristo velato è opera di Giuseppe Sanmartino, su commissione del principe: il velo trasparente che copre il corpo è scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea della cappella si trovano le «macchine anatomiche», due scheletri con il sistema circolatorio ricostruito, realizzate dal medico palermitano Giuseppe Salerno intorno al 1756-1764: la leggenda parla di iniezioni misteriose, gli studi di cera d'api e coloranti.\n\nPoco lontano, la facciata del Gesù Nuovo, nata come palazzo dei Sanseverino nel 1470, è coperta da un bugnato a punta di piramide in piperno scuro. Su alcune pietre si vedono segni incisi: per la leggenda un messaggio segreto; per alcuni studiosi i marchi dei tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali, uno spartito di circa tre quarti d'ora chiamato «Enigma». Un'ipotesi suggestiva, non una certezza.\n\nE poi c'è il mare: secondo la leggenda il poeta Virgilio nascose nei sotterranei di Castel dell'Ovo l'uovo della sirena Partenope. Finché l'uovo resta intatto, il castello resta in piedi.\n\nNelle case, invece, abitano gli spiriti della tradizione popolare: il munaciello, folletto incappucciato che porta fortuna o dispetti a seconda di come lo tratti, e la bella 'mbriana, spirito buono della casa, che può apparire come una farfalla o un geco.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Napoli oggi: cosa c'è di nuovo","som":"Il largo dedicato a Maradona, la street art, l'ultimo Caravaggio in via Toledo, chiese e ossari riaperti: la città che cambia.","txt":"Chi torna a Napoli dopo qualche anno trova una città che ha imparato a raccontarsi.\n\nNei Quartieri Spagnoli, a nove minuti da noi, c'è Largo Maradona. Il murale di Diego fu dipinto nel 1990 da Mario Filardi; negli anni sbiadì fino quasi a scomparire, poi fu restaurato grazie a Salvatore Iodice e, nell'autunno del 2017, l'argentino Francisco Bosoletti ne ridipinse il volto. Dopo la morte di Maradona, il 25 novembre 2020, il largo, prima chiamato degli artisti, è diventato un santuario laico di altarini, bandiere argentine e fotografie, tanto visitato che il Comune ha dovuto organizzare il flusso dei pedoni.\n\nLa street art è entrata nel centro storico: in piazzetta dei Girolamini, protetta da un vetro, c'è la Madonna con la pistola di Banksy; in via Duomo il San Gennaro operaio di Jorit. Il portale turistico ufficiale della città dedica loro un itinerario.\n\nIn via Toledo, a sei minuti da noi, le Gallerie d'Italia custodiscono il Martirio di sant'Orsola, l'ultima tela dipinta da Caravaggio, insieme a oltre cinquecento vasi attici e della Magna Grecia.\n\nE riaprono luoghi rimasti chiusi a lungo: la chiesa di Santa Luciella ai Librai, abbandonata per più di trent'anni, è tornata visitabile il 5 aprile 2019; il Cimitero delle Fontanelle ha riaperto nel 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"}
