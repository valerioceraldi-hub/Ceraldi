<title>Guida di Napoli · Ceraldi</title>

<link rel="stylesheet" href="caratteri/caratteri.css">

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

var D = {"lingua":"it","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità e via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Il punto di partenza: Piazza Carità, sulla via Toledo. Da qui il centro storico comincia a pochi minuti a piedi. E qui c'è Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Prima di partire, un caffè: il giro è lungo e Napoli si visita meglio con la tazzina giusta.","acc":"","foto":{"u":"img/15021c80962d.jpg","alt":"Piazza Carità oggi, con gli alberi e i palazzi colorati","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità oggi, sulla via Toledo: da qui partono tutti i giri. Ceraldi è qui."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":{"u":"img/6f4c11148f21.jpg","alt":"Via Toledo e il largo della Carità in una foto dell'Ottocento","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo e Largo Carità nell'Ottocento: la grande strada voluta da don Pedro di Toledo, già allora piena di vita."}}],"gal":[{"u":"img/6f4c11148f21.jpg","alt":"Foto d'epoca di via Toledo nell'Ottocento, con carrozze e passanti","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo nell'Ottocento, quando si chiamava via Roma, in una foto di Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità e via Toledo: una passeggiata nel cuore di Napoli","x":"La storia della piazza, raccontata da chi ci lavora dal 2002.","it":false}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, il decumano inferiore","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La strada dritta che taglia in due il centro storico: il decumano inferiore della città greca, circa due chilometri di chiese, botteghe e vita.","rac":"Spaccanapoli è il più basso dei tre decumani, le strade parallele che attraversavano da ovest a est la Neapolis greca. Comincia in piazza del Gesù Nuovo con il nome di via Benedetto Croce, poi diventa via San Biagio dei Librai, attraversa via Duomo e prosegue oltre il centro antico: in tutto circa due chilometri. Il nome dice tutto: è così lunga e dritta che, vista dall'alto, sembra spaccare la città in due.","con":"Percorrila a piedi da piazza del Gesù verso via Duomo: è in leggera discesa di storia, non di fatica.","acc":"","foto":{"u":"img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista dall'alto, una linea dritta attraverso i tetti del centro storico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista da Sant'Elmo: una linea dritta che taglia i tetti del centro storico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":{"u":"img/f0498399a45a.jpg","alt":"La linea dritta di Spaccanapoli vista dall'alto","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli vista da Castel Sant'Elmo: la linea dritta che divide in due il centro antico."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Piazza e Chiesa del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una facciata di pietre a punta di piramide che sembra una fortezza e nasconde un mistero: segni incisi che nessuno ha ancora decifrato con certezza.","rac":"Prima di essere una chiesa era un palazzo: quello dei principi Sanseverino, costruito nel 1470; una lapide sulla facciata ricorda l'architetto, Novello da San Lucano. I gesuiti ne conservarono la struttura e il bugnato in piperno scuro, con le pietre tagliate a punta di piramide, aggiungendo elementi in marmo bianco.\n\nSu alcune pietre si vedono segni incisi. Per la leggenda sono un messaggio segreto; per alcuni studiosi sono i marchi lasciati dalle diverse squadre di tagliapietre; nel 2011 lo storico dell'arte Vincenzo De Pasquale propose di leggerli come note musicali di uno spartito chiamato «Enigma». Guardali da vicino e scegli tu la tua versione.\n\nLa facciata è stata restaurata e presentata il 12 marzo 2023, dopo la caduta di alcuni frammenti nel dicembre 2017; da allora la piazza è chiusa alle auto.","con":"Cerca i segni sulle pietre all'altezza degli occhi, a destra e a sinistra del portale: la caccia è gratuita.","acc":"","foto":{"u":"img/96d5545e33d7.jpg","alt":"La facciata del Gesù Nuovo, di pietre scure tagliate a punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La facciata a punte di diamante: era il palazzo dei principi Sanseverino, del 1470. Avvicinati e cerca i segni incisi sulle pietre."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La facciata a punte di diamante","x":"Prima di essere la facciata di una chiesa era quella di un palazzo: il palazzo dei Sanseverino, principi di Salerno, costruito nel 1470. Quando i gesuiti costruirono qui la loro chiesa, dal 1584, sventrarono il palazzo ma ne salvarono la facciata e il portale. A Napoli si faceva spesso: nel centro antico lo spazio era poco e fuori dalle mura non si poteva costruire.\n\nGuarda le pietre: sono di piperno, una pietra vulcanica grigia e durissima, tagliate a punta di diamante (il «bugnato»). Il grande portale barocco, con le colonne, gli angeli sul timpano e il monogramma dei gesuiti «IHS», racchiude ancora il portale rinascimentale del palazzo.\n\nOra avvicinati: su molte punte ci sono piccoli segni incisi. Per alcuni sono i marchi delle squadre di tagliapietre; una leggenda dice che i maestri pipernieri sapessero «caricare» la pietra di energia; nel 2010 alcuni studiosi li hanno letti come note di uno spartito, lettura poi contestata. Una risposta certa non c'è: cercane uno e scegli la tua.","d":"Fuori, sulla piazza","foto":{"u":"img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo coperta di punte di diamante in pietra grigia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante della facciata del Gesù Nuovo, con il portale e la grande finestra."}},{"t":"La cacciata di Eliodoro","x":"È il grande affresco sopra la porta d'ingresso: lo dipinse Francesco Solimena, che lo firmò e datò 1725. Molti visitatori non lo vedono, perché entrano guardando l'altare: girati.\n\nLa storia viene dalla Bibbia (secondo libro dei Maccabei): Eliodoro tenta di saccheggiare il tesoro del tempio di Gerusalemme e viene respinto da un cavaliere celeste. Cerca il cavaliere, i cavalli e le figure in fuga: è una scena teatrale, piena di movimento, come il barocco amava.\n\nAi lati del finestrone, sopra l'affresco, ci sono due scene più piccole di Belisario Corenzio, del 1638: Sant'Elena che ritrova la Croce e la Conversione di San Paolo.","d":"Appena entrato, girati verso la porta: è sopra l'ingresso","foto":{"u":"img/7a0dd25a648c.jpg","alt":"Il grande affresco della Cacciata di Eliodoro di Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"L'affresco di Solimena sopra l'ingresso: girati verso la porta per vederlo. Al centro il cavaliere celeste che respinge Eliodoro."}},{"t":"La cupola e i quattro evangelisti","x":"Fermati al centro della chiesa, dove la navata incrocia il transetto, e alza gli occhi. Nei quattro triangoli curvi che reggono la cupola (i «pennacchi») ci sono i quattro evangelisti dipinti da Giovanni Lanfranco nel Seicento: sono quello che resta del suo grande ciclo, perché il resto andò perduto con la cupola.\n\nLa cupola infatti ha avuto una vita difficile. Quella originale crollò con il terremoto del 1688; fu rifatta, ma restò pericolante e alla fine del Settecento fu abbattuta. Nel 1786 la sostituì una copertura più bassa, a forma di scodella, che è quella che vedi oggi; nel 1975 è stata consolidata con una struttura in cemento armato.\n\nIntorno a te c'è il barocco napoletano al completo: marmi intarsiati di molti colori («marmi commessi»), stucchi dorati, affreschi di Belisario Corenzio e Paolo De Matteis sulle volte, tele di Luca Giordano e sculture di Cosimo Fanzago.","d":"Al centro della chiesa, guarda in alto","foto":{"u":"img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo verso la cupola","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata del Gesù Nuovo: dove incrocia il transetto alza gli occhi verso la cupola e i quattro pennacchi con gli evangelisti."}},{"t":"Il cappellone di Sant'Ignazio","x":"È la grande cappella in fondo al braccio sinistro del transetto, dedicata a Sant'Ignazio di Loyola, fondatore dei gesuiti. Architettura e marmi sono di Cosimo Fanzago e dei suoi collaboratori, negli anni tra il 1637 e il 1645 circa; ai lati dell'altare le due statue dei profeti Davide e Geremia sono opera dello stesso Fanzago.\n\nLe tele con la vita del santo sono di Jusepe de Ribera, il pittore spagnolo che lavorò a Napoli e ne divenne uno dei maestri. Ai piedi dell'altare è sepolto il committente, Carlo Gesualdo da Venosa.\n\nPoi attraversa la chiesa: di fronte, nel braccio destro, c'è il cappellone «gemello» di San Francesco Saverio, il primo missionario gesuita in Asia, con le sculture di Fanzago e, in alto, tre tele di Luca Giordano del 1676-77. Guardale una dopo l'altra: sono il Seicento napoletano al suo massimo.","d":"In uno dei due grandi cappelloni della chiesa","foto":{"u":"img/835d153e2859.jpg","alt":"Una tela di Ribera con Sant'Ignazio in gloria","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Sant'Ignazio in gloria, tela di Jusepe de Ribera nel cappellone dedicato al fondatore dei gesuiti."}},{"t":"San Giuseppe Moscati","x":"Qui riposa il «medico santo» di Napoli: Giuseppe Moscati, medico e professore universitario, che curava gratis i più poveri e li aiutava anche con il denaro. Morì nel 1927 e fu proclamato santo da papa Giovanni Paolo II nel 1987.\n\nIl suo corpo è nell'urna di bronzo al centro della cappella della Visitazione, la seconda a destra, dove fu portato nel 1977. L'urna è di Amedeo Garufi: guarda i tre bassorilievi, che lo mostrano mentre fa lezione all'università, mentre guarisce un bambino in braccio alla madre e mentre cura i malati in ospedale. A sinistra c'è la sua statua in bronzo, del 1990.\n\nDal cappellone di San Francesco Saverio una porta porta alle Sale di San Giuseppe Moscati: foto, manoscritti, i suoi abiti e strumenti medici, e lo studio e la camera da letto della sua casa, ricostruiti qui. Nelle stesse sale è esposta una bomba della Seconda guerra mondiale che cadde sul soffitto della chiesa senza esplodere.","d":"Nella cappella della Visitazione, sotto l'altare","foto":{"u":"img/c9deda186fa3.jpg","alt":"La stanza di san Giuseppe Moscati ricostruita: camice bianco e strumenti medici in una teca","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Nella stanza ricostruita: il camice bianco, gli strumenti medici e le fotografie di san Giuseppe Moscati."}}],"gal":[{"u":"img/4a574d8f9faf.jpg","alt":"La piazza del Gesù Nuovo davanti alla chiesa","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La piazza del Gesù Nuovo, davanti alla chiesa."},{"u":"img/6d1ae4837518.jpg","alt":"L'interno del Gesù Nuovo, con marmi colorati e l'altare maggiore","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, il contrasto con la facciata severa: marmi colorati, affreschi e oro fino all'altare maggiore."},{"u":"img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo vista dall'ingresso","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata vista dall'ingresso: in fondo, in alto, la cupola con gli evangelisti di Lanfranco alla base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastero e Complesso di Santa Chiara (chiostro maiolicato)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Il chiostro rivestito di maioliche è uno dei luoghi più quieti del centro: a due passi dal caos di Spaccanapoli, il silenzio.","rac":"Santa Chiara nasce nel 1310 per volere del re Roberto d'Angiò e della regina Sancia di Maiorca. I lavori furono guidati prima da Gagliardo Primario e poi da Lionardo di Vito, e nel 1340 la chiesa fu aperta al culto. Il complesso era doppio: un convento per le monache clarisse e uno per i frati minori, vicini ma separati.\n\nQuattro secoli dopo, su suggerimento della regina Maria Amalia di Sassonia, moglie di Carlo di Borbone, il chiostro delle clarisse fu rinnovato. L'architetto Domenico Antonio Vaccaro tenne gli archi gotici del Trecento e trasformò il centro in un giardino barocco, rivestito dalle maioliche della bottega di Donato e Giuseppe Massa. Il risultato è uno dei luoghi più sorprendenti di Napoli: un giardino di ceramica a due passi da Spaccanapoli.\n\nLa chiesa è gotica, con una facciata a larga cuspide che incornicia l'antico rosone, e dentro ha un'unica navata con dieci cappelle per lato. Il bombardamento del 4 agosto 1943 la colpì duramente: distrusse anche parte degli affreschi del chiostro, e la ricostruzione le ha restituito le forme gotiche che gli stucchi del Settecento avevano nascosto.\n\nSotto il complesso c'è un'altra sorpresa: i resti di uno stabilimento termale romano, scoperto durante i restauri del dopoguerra. Aveva una palestra, una piscina coperta e le sale per i bagni di aria calda: sono la testimonianza più completa delle antiche terme di Neapolis.","con":"La domenica il chiostro chiude alle 14: se è domenica pomeriggio, scambia l'ordine e vieni qui per primo.","acc":"","foto":{"u":"img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Chiostro e museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Chiostro e museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"I pilastri di maiolica","x":"Il giardino è diviso in quattro parti da due viali che si incrociano, e lungo i viali corrono 64 pilastri a otto lati, tutti rivestiti di maiolica. Le decorazioni sono festoni di foglie, fiori e frutti; i colori più usati sono il giallo, l'arancio e il blu, scelti per richiamare gli agrumi e la vite del pergolato che cresce sopra di te.\n\nLe maioliche sono della bottega di Donato e Giuseppe Massa, che seguirono il progetto dell'architetto napoletano Domenico Antonio Vaccaro: lui volle che smalti, architettura e piante fossero un'unica cosa. I pilastri finiscono in capitelli di piperno e sono collegati da sedili, anche questi interamente di maiolica.\n\nIl chiostro fu trasformato così negli anni intorno al 1742, quando la badessa era suor Ippolita Carmignano: fu la regina Maria Amalia di Sassonia, moglie di Carlo di Borbone, a spingere più volte le monache a «modernizzarlo».","d":"Nel giardino del chiostro","foto":{"u":"img/924627d30fda.jpg","alt":"Pilastri rivestiti di maioliche gialle e verdi nel chiostro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"I pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto il pergolato."}},{"t":"Le scene sui sedili","x":"Siediti: i sedili che collegano i pilastri sono tutti di maiolica, e sugli schienali sono dipinte piccole scene del Settecento. Ci sono scene di campagna, di mare, feste popolari e storie mitologiche: un racconto per figure della vita di allora.\n\nLe scene continuano anche sul muretto che circonda le aiuole: percorri i viali con calma e guarda in basso, oltre che ai lati.\n\nUn consiglio: è un gioco bellissimo con i bambini. Scegliete una scena a testa e raccontatevi che cosa sta succedendo: chi va a pesca, chi balla, chi lavora nei campi.","d":"Sugli schienali dei sedili tra i pilastri","foto":{"u":"img/79ec1acbab17.jpg","alt":"Un sedile di maiolica con una scena dipinta sullo schienale","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un sedile di maiolica del chiostro: sullo schienale c'è una scena dipinta."}},{"t":"La clarissa con i gatti","x":"Tra tutte le scene sugli schienali ce n'è una che parla del monastero stesso: una monaca clarissa che dà da mangiare ai gatti che vivevano nel chiostro. È un piccolo momento di vita quotidiana, dipinto in maiolica nel Settecento dalla bottega dei Massa.\n\nLe clarisse sono le monache dell'ordine di Santa Chiara: il complesso nacque infatti con due conventi vicini ma separati, uno per le clarisse e uno per i frati minori.\n\nTrovarla è una caccia al tesoro perfetta, anche per i bambini: percorri i sedili uno per uno. Se non la trovi, chiedi al personale del chiostro.","d":"Su uno degli schienali dei sedili: cercala","foto":null},{"t":"Gli archi del Trecento","x":"Il giardino è barocco, ma la cornice è medievale. Il complesso fu voluto nel 1310 dal re Roberto d'Angiò e dalla regina Sancia di Maiorca; i lavori furono diretti da Gagliardo Primario e poi da Lionardo di Vito, e la chiesa fu aperta al culto nel 1340.\n\nQuando nel Settecento Vaccaro rifece il giardino, conservò il perimetro trecentesco: gli archi a sesto acuto sui pilastri di piperno. Guarda il contrasto tra la pietra severa degli archi e i colori allegri delle maioliche: quattro secoli in un solo sguardo.\n\nSulle pareti dei quattro lati corrono affreschi della prima metà del Seicento, di un autore sconosciuto, forse della scuola di Belisario Corenzio, con scene dell'Antico Testamento. Appena entri, il primo tratto di parete a destra è vuoto: quegli affreschi furono distrutti dal bombardamento del 4 agosto 1943.","d":"Lungo i quattro lati del chiostro","foto":{"u":"img/fc6ac3ae6c14.jpg","alt":"Gli archi del chiostro di Santa Chiara visti in controluce, con la chiesa sullo sfondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Gli archi gotici del chiostro di Santa Chiara, visti in controluce: sullo sfondo la facciata della chiesa."}}],"gal":[{"u":"img/f5b30f6df9dc.jpg","alt":"Maioliche con una scena di caccia al cinghiale","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Da vicino: una caccia al cinghiale dipinta sulle maioliche dalla bottega dei Massa, tra il 1739 e il 1742."},{"u":"img/f13f406e9a70.jpg","alt":"Il chiostro con i pilastri di maiolica, i sedili e il giardino","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Il chiostro intero: i pilastri di maiolica, i sedili e il giardino."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Cappella Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Il Cristo velato, una delle sculture più famose al mondo, e le macchine anatomiche del principe alchimista Raimondo di Sangro.","rac":"La cappella della famiglia di Sangro è il regno di Raimondo, principe di Sansevero: uomo di scienza e di segreti, Gran Maestro della Massoneria, attorno al quale il mito nacque quando era ancora vivo, e fu lui stesso ad alimentarlo.\n\nAl centro c'è il Cristo velato di Giuseppe Sanmartino, commissionato dal principe: un corpo disteso coperto da un sudario così sottile da sembrare stoffa bagnata, ma scolpito nello stesso blocco di marmo della statua. Nella cavea sotterranea si trovano le due «macchine anatomiche», scheletri di un uomo e di una donna con il sistema dei vasi sanguigni ricostruito, opera del medico palermitano Giuseppe Salerno intorno al 1756-1764. La leggenda nera racconta di servi sacrificati e di iniezioni misteriose; il museo stesso separa con cura il mito dalla storia documentata.","con":"Il martedì è chiusa: se oggi è martedì, la statua del Nilo è a due minuti e si vede sempre.","acc":"La navata e la sagrestia sono visitabili anche in carrozzina. La cavea sotterranea con le macchine anatomiche si raggiunge solo da una stretta scala a chiocciola dell'Ottocento.","foto":{"u":"img/65421f883be6.jpg","alt":"L'esterno della Cappella Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Cappella Sansevero vista da fuori."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Il Cristo velato","x":"Al centro della cappella c'è un corpo disteso su un materasso, la testa e il busto sollevati da un cuscino, coperto da un sudario così sottile che sotto si leggono il volto, le ferite e le vene. Il velo non è un'aggiunta: Giuseppe Sanmartino l'ha scolpito dallo stesso blocco di marmo della statua, nel 1753, su commissione del principe Raimondo di Sangro.\n\nLo dice un documento firmato dal principe per pagare lo scultore: «una statua di marmo scolpita a grandezza naturale, rappresentante Nostro Signore Gesù Cristo morto, coperto da un sudario trasparente realizzato dallo stesso blocco della statua». Per secoli si è raccontato che il velo fosse un tessuto vero trasformato in marmo con un procedimento alchemico del principe: è solo una leggenda.\n\nCerca i dettagli: la ferita del costato, il segno dei chiodi sulla mano e, ai piedi, la corona di spine e i chiodi della Passione. Poi giragli intorno lentamente: da ogni lato il velo sembra cambiare.","d":"Al centro della navata","foto":{"u":"img/625d7cbbb2af.jpg","alt":"Il volto del Cristo velato sotto il velo di marmo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Il volto sotto il velo: il sudario è scolpito nello stesso blocco di marmo della statua, eppure sembra stoffa bagnata."}},{"t":"La Pudicizia","x":"Una giovane donna avvolta in un velo che aderisce alla pelle come se fosse bagnato, con una ghirlanda di rose sui capelli. La scolpì nel 1752 il veneto Antonio Corradini, scultore famoso in tutta Europa che aveva lavorato anche per l'imperatore a Vienna: morì nello stesso anno, mentre progettava le altre decorazioni della cappella, come ricorda una lapide sul pilastro.\n\nIl principe Raimondo la dedicò alla madre, Cecilia Gaetani dell'Aquila d'Aragona, morta il 26 dicembre 1710, quando lui non aveva ancora un anno. Cerca i simboli di una vita interrotta troppo presto: lo sguardo perso, l'albero che nasce dalla pietra e la lapide spezzata ai suoi piedi.\n\nSul basamento c'è un bassorilievo con il «Noli me tangere», Cristo risorto che appare alla Maddalena. Il museo ricorda che la donna velata può essere letta anche come immagine della Sapienza, e richiama la dea Iside velata.","d":"Vicino all'altare maggiore","foto":{"u":"img/caa3cd3d9215.jpg","alt":"La statua della Pudicizia, una donna coperta da un velo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La Pudicizia di Antonio Corradini: il velo aderisce al corpo come se fosse bagnato. Ai suoi piedi la lapide spezzata."}},{"t":"Il Disinganno","x":"Un uomo si libera da una grande rete, aiutato da un piccolo genio alato con una fiammella sulla fronte, simbolo dell'intelletto umano. Ai suoi piedi c'è il globo terrestre, le passioni del mondo, con sopra una Bibbia aperta. Lo scolpì il genovese Francesco Queirolo tra il 1753 e il 1754.\n\nIl principe lo dedicò al padre, Antonio: rimasto vedovo, aveva lasciato il figlio al nonno e viaggiato per l'Europa vivendo in modo disordinato, poi da anziano, pentito, era tornato a Napoli e si era fatto sacerdote. La rete è il peccato da cui l'uomo si libera.\n\nGuarda la rete da vicino: è tutta di marmo, traforata maglia per maglia. Si racconta che gli artigiani incaricati della rifinitura si rifiutarono di toccarla per paura di romperla, e che Queirolo dovette levigarla da solo. Già nel 1753 un contemporaneo la definì «l'ultima pruova ardita, a cui può la scultura in marmo azzardarsi».","d":"Vicino all'altare maggiore","foto":{"u":"img/921cf7f91318.jpg","alt":"La statua del Disinganno, un uomo che si libera da una rete","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Il Disinganno di Francesco Queirolo: la rete è tutta di marmo, traforata a mano."}},{"t":"Il pavimento labirintico","x":"Il pavimento che calpesti non è quello originale. Il principe ne aveva ideato uno a labirinto: marmi colorati, dal blu al bianco, attraversati da una linea continua di marmo bianco senza giunture, che disegnava croci uncinate alternate a quadrati concentrici in prospettiva. Lo eseguì Francesco Celebrano a partire dalla metà degli anni Sessanta del Settecento; il principe stesso scrisse che il lavoro fu «difficile e intralciato».\n\nNel 1889 un grave crollo coinvolse il palazzo e la cappella e danneggiò il pavimento: invece di restaurarlo, lo si rifece in cotto napoletano, con smalto giallo e azzurro in corrispondenza dello stemma dei di Sangro.\n\nCerca le lastre originali nel passaggio davanti alla tomba di Raimondo di Sangro; altre sono nella cavea sotterranea e in sagrestia. Per il principe il labirinto era l'immagine del cammino difficile che porta alla conoscenza.","d":"Nel passaggio davanti alla tomba del principe","foto":null},{"t":"Le macchine anatomiche","x":"Scendi la stretta scala fino alla cavea sotterranea: dentro due vetrine ci sono gli scheletri in piedi di un uomo e di una donna, con il sistema delle arterie e delle vene quasi intatto, fino ai vasi più sottili.\n\nLe realizzò il medico palermitano Giuseppe Salerno. Il principe comprò quella maschile nel 1756, dopo averla vista in una dimostrazione pubblica a Napoli, prese Salerno al suo servizio e gli fece realizzare la seconda. Stavano nel palazzo, in una stanza chiamata «Appartamento della Fenice»; la donna era su una pedana che si faceva girare per osservarla da ogni lato.\n\nIntorno a loro è nata la «leggenda nera»: si diceva che il principe avesse fatto uccidere due servi e iniettato nei loro corpi una sostanza misteriosa. In realtà i vasi sono una ricostruzione fatta con diversi materiali, tra cui cera d'api e coloranti; resta sorprendente la conoscenza dell'anatomia che dimostrano, per l'epoca.","d":"Nella cavea sotterranea, scendendo una stretta scala a chiocciola","foto":{"u":"img/a3a047434411.jpg","alt":"Uno scheletro con il sistema dei vasi sanguigni nella vetrina della cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"Una delle due macchine anatomiche di Giuseppe Salerno nella cavea sotterranea: scheletro e sistema circolatorio."}}],"gal":[{"u":"img/13d7137edcd0.jpg","alt":"L'interno della Cappella Sansevero con le statue","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La cappella intera: al centro il Cristo velato, intorno le statue della famiglia di Sangro."}],"leg":"Su Raimondo di Sangro si raccontava già in vita di tutto: esperimenti misteriosi, segreti alchemici, persino servi trasformati nelle macchine anatomiche. Il museo distingue con cura la leggenda nera dai fatti documentati: vale la pena ascoltare entrambe le versioni e scegliere da che parte stare.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"La chiesa dove visse e insegnò san Tommaso d'Aquino e dove, secondo la tradizione, un Crocifisso gli rivolse la parola.","rac":"Il complesso domenicano si affaccia sull'omonima piazza, lungo Spaccanapoli. La chiesa gotico-angioina fu costruita tra il 1283 e il 1324 e in seguito trasformata in epoca barocca. Nel convento visse e insegnò Tommaso d'Aquino, tra il 1272 e il 1274; furono legati a questo luogo anche Giordano Bruno e Tommaso Campanella.\n\nNella sagrestia, con la volta affrescata da Francesco Solimena nel 1709, si trovano le arche dei sovrani aragonesi. Per secoli la basilica ha custodito anche un capolavoro di Caravaggio, la Flagellazione di Cristo, oggi al Museo di Capodimonte.\n\nOggi il complesso si visita anche come museo DOMA: sagrestia, arche aragonesi e cella di San Tommaso.","con":"Se hai tempo, entra anche nel percorso del museo: sagrestia, arche aragonesi e cella di San Tommaso. Gli orari cambiano e alcune sezioni possono essere chiuse per lavori: controlla il sito ufficiale prima di venire.","acc":"","foto":{"u":"img/dfba11028a9c.jpg","alt":"La guglia di San Domenico e l'abside della chiesa nella piazza","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"La guglia di San Domenico e, dietro, l'abside della chiesa."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visite guidate."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"Il Crocifisso che parlò a san Tommaso","x":"È una tavola dipinta, custodita nella basilica. La tradizione dice che il Cristo si rivolse a Tommaso d'Aquino, che pregava dopo aver scritto di teologia: gli avrebbe detto che aveva scritto bene di lui e gli avrebbe chiesto quale ricompensa desiderasse. Il Ministero della Cultura ricorda la tavola come quella che «parlò» al santo e che fu spostata nel 1437 in una nuova cappella.","d":"Dentro la basilica, nella cappella del Crocifisso","foto":{"u":"img/4b0972ad805f.jpg","alt":"Il cappellone del Crocifisso in San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"Il cappellone del Crocifisso in San Domenico Maggiore, dove si custodisce la tavola del miracolo."}},{"t":"La sagrestia di Solimena e le arche aragonesi","x":"La volta della sagrestia fu affrescata da Francesco Solimena nel 1709 con il Trionfo dell'Ordine domenicano. Lungo le pareti si vedono le arche sepolcrali dei sovrani aragonesi e di altri dignitari di corte.","d":"Nella sagrestia, visita del museo DOMA","foto":{"u":"img/07519e21f0fa.jpg","alt":"La sagrestia di San Domenico Maggiore con la volta affrescata","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"La sagrestia di San Domenico Maggiore, con la volta di Francesco Solimena e le arche aragonesi."}},{"t":"La cella di San Tommaso","x":"Qui Tommaso d'Aquino visse e studiò. La cella è stata restaurata ed è visitabile insieme al museo DOMA.","d":"Nel percorso del museo","foto":{"u":"img/f68192e11f82.jpg","alt":"La cella di San Tommaso d'Aquino con reliquiario e arredi","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"La cella di San Tommaso d'Aquino nel convento di San Domenico Maggiore."}}],"gal":[],"leg":"Si racconta che il Crocifisso dipinto su tavola, conservato nella basilica, abbia parlato a san Tommaso d'Aquino mentre pregava: gli avrebbe detto che aveva scritto bene di lui e gli avrebbe chiesto quale ricompensa desiderasse.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli e statua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una statua romana del dio Nilo, scambiata per secoli per una donna che allatta: il «Corpo di Napoli».","rac":"In piazzetta Nilo, lungo via San Biagio dei Librai, cioè Spaccanapoli, c'è una statua di marmo del II-III secolo d.C. che raffigura il dio del fiume Nilo: un uomo barbuto semisdraiato con una cornucopia, circondato da putti che simboleggiano i rami del fiume. La eressero i mercanti alessandrini che vivevano in questa zona, chiamata Regio Nilensis.\n\nFu ritrovata senza testa nel 1476. Così i napoletani la scambiarono per una figura femminile che allatta dei bambini, simbolo della città che nutre i suoi abitanti: da qui il nome «Corpo di Napoli», che ancora oggi dà il nome al largo. Nel 1657 fu collocata su un nuovo basamento e nello stesso secolo le fu scolpita una testa barbuta.\n\nOggi la statua è ancora al suo posto, a ricordo delle radici multiculturali di Napoli.","con":"Passaci con calma: è una tappa da cinque minuti sulla strada di Spaccanapoli. Cerca i putti sul corpo del dio: fanno capire perché fu scambiata per una donna.","acc":"","foto":{"u":"img/223832909fbe.jpg","alt":"La statua antica del dio Nilo, sdraiato","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statua del dio Nilo, sdraiato, nella piccola piazza che porta il suo nome."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"Il dio Nilo e i putti","x":"Il dio del fiume è disteso su un fianco e tiene una cornucopia. I putti che lo circondano simboleggiano i rami del Nilo. Per chi l'ha guardata a lungo senza testa, sembrava una donna che allatta.","d":"Al centro della piazzetta","foto":{"u":"img/83dce4234fd4.jpg","alt":"La statua del dio Nilo disteso con i putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"Il dio Nilo disteso con la cornucopia e i putti."}},{"t":"Perché «Corpo di Napoli»","x":"La statua fu ritrovata senza testa nel 1476. Per questo si pensò a una figura femminile che nutre i suoi figli: la città stessa. Il nome è rimasto al largo, anche dopo che la statua ebbe una testa nuova.","d":"Sul basamento e nel nome del largo","foto":{"u":"img/c0e842c87218.jpg","alt":"La statua del Nilo sul suo basamento nel largo","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"La statua sul basamento di Largo Corpo di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai e le sue botteghe","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La parte di Spaccanapoli dei librai e degli artigiani: botteghe, chiese e l'Ospedale delle Bambole.","rac":"È il tratto di Spaccanapoli che va da piazzetta Nilo a via Duomo, sul decumano inferiore. Il nome viene dalle botteghe di libri che vi si trovavano da sempre: un'iscrizione sul vicino Palazzo Marigliano ricorda proprio l'arte dei maestri librai. La devozione a san Biagio risale all'VIII secolo, quando monache venute dall'Armenia portarono a Napoli una reliquia del santo. Lungo la strada c'è anche l'Ospedale delle Bambole, bottega artigiana tramandata di generazione in generazione.","con":"Dicembre è il mese delle botteghe dei presepi: preparati alla folla nei fine settimana.","acc":"","foto":{"u":"img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai vista in lunghezza: una stretta strada acciottolata tra palazzi alti, con balconi, panni stesi, negozi e passanti, e in fondo la collina del Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, il tratto di Spaccanapoli più vivo di botteghe e voci."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":{"u":"img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: il vicolo stretto, i negozi e uno stendardo appeso in alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la strada stretta e dritta del decumano inferiore, con i negozi e la gente a passeggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai e il teschio con le orecchie","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Una piccolissima chiesa dei tagliapietre dedicata alla santa degli occhi, e un teschio unico al mondo: quello con le orecchie.","rac":"Fondata poco prima del 1327 da Bartolomeo di Capua, giurista dei re angioini, la chiesa fu poi affidata ai pipernieri, i tagliatori di pietra: scelsero santa Lucia, protettrice della vista, perché le schegge del loro mestiere mettevano a rischio gli occhi.\n\nAbbandonata per più di trent'anni, è stata riaperta il 5 aprile 2019 grazie all'associazione Respiriamo Arte. Nel suo ipogeo il culto delle anime pezzentelle ha lasciato un teschio che non ha eguali: ha le orecchie.","con":"È piccola e si visita in pochi minuti: perfetta come pausa tra Sansevero e via dei Tribunali.","acc":"","foto":{"u":"img/fff63e79f1d9.jpg","alt":"Il portale di Santa Luciella nel vicolo","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Il portale di Santa Luciella. Alza gli occhi: sopra c'è l'affresco con lo stemma dei pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Lo stemma dei pipernieri","x":"Prima di entrare alza gli occhi: sopra il portale di piperno c'è ancora l'affresco con lo stemma della corporazione dei pipernieri, i tagliatori di pietra a cui la chiesa apparteneva.\n\nLavoravano con scalpello e martello il piperno, una pietra durissima, e temevano che le schegge finissero negli occhi: per questo scelsero santa Lucia, protettrice della vista. Era una corporazione potente; si diceva perfino che sapessero infondere nelle pietre energie buone o cattive.\n\nLa chiesa è antichissima: fu fondata poco prima del 1327 da Bartolomeo di Capua, consigliere dei re angioini. Nella veduta di Napoli del Baratta del 1629 è indicata come cappella dei mugnai; fu rifatta nel Settecento. Rimase chiusa e abbandonata per oltre trent'anni, finché l'associazione Respiriamo Arte l'ha riaperta il 5 aprile 2019.","d":"Sopra il portale d'ingresso","foto":{"u":"img/3e0b66b49ec6.jpg","alt":"L'affresco sopra il portale di Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"L'affresco sopra il portale di Santa Luciella, con lo stemma della corporazione dei pipernieri."}},{"t":"Il teschio con le orecchie","x":"Sotto la chiesa, nell'ipogeo, c'è un teschio che ha conservato le cartilagini mummificate delle orecchie: per questo è considerato unico. La tradizione popolare dice che, proprio perché ha le orecchie, ascolta meglio le preghiere di chi gli chiede una grazia.\n\nL'ipogeo si visita solo con la visita guidata. Grazie al progetto «Percorsi di luce», sostenuto da FAI e Intesa Sanpaolo, le luci si accendono un dettaglio alla volta, alternando zone illuminate e zone in ombra: lasciati guidare.\n\nRicorda che è un luogo legato ai defunti e alla devozione: si guarda con rispetto, a voce bassa.","d":"Nell'ipogeo, con la visita guidata","foto":{"u":"img/7a5a070c0866.jpg","alt":"Il teschio con le orecchie nell'ipogeo di Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"Il teschio con le orecchie: si vedono le cartilagini mummificate ai lati del cranio."}},{"t":"Le anime pezzentelle","x":"Nel Seicento la peste uccise migliaia di persone a Napoli: i morti furono sepolti in fosse comuni e se ne perse il nome. Nacque così il culto delle «anime pezzentelle», le anime povere, morte senza nome, senza funerale e senza preghiere.\n\nChi chiedeva una grazia (una guarigione, una gravidanza, un aiuto) «adottava» uno di quei teschi, le «capuzzelle»: lo puliva, lo sistemava in una nicchia e pregava per lui, perché l'anima arrivasse in Paradiso e lassù si ricordasse di chi l'aveva aiutata.\n\nIl culto era molto radicato a Santa Luciella. Lo ritroverai al Purgatorio ad Arco, in via dei Tribunali, e il suo luogo simbolo è il Cimitero delle Fontanelle, nel rione Sanità.","d":"Nell'ipogeo","foto":{"u":"img/8110a7061c73.jpg","alt":"Teschi illuminati dalla luce di una candela, con una targa «per grazia ricevuta»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Teschi nelle teche: su una targa si legge il nome di chi ha fatto la grazia, un modo di ringraziare le anime «pezzentelle»."}}],"gal":[],"leg":"Si dice che il teschio con le orecchie, proprio perché ha le orecchie, ascolti meglio le preghiere: per questo per generazioni gli sono state affidate le richieste più difficili.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Ospedale delle Bambole","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una bottega che da generazioni «cura» bambole e giocattoli: una vetrina che i bambini, e non solo, ricordano per sempre.","rac":"Alla fine dell'Ottocento Luigi Grassi lavorava come scenografo per teatri e presepi. I vicini cominciarono a portargli bambole e giocattoli rotti, e la sua bottega diventò, quasi per caso, il primo «ospedale» per giocattoli di Napoli.\n\nOggi lo porta avanti Tiziana, pronipote del fondatore, nel cortile di Palazzo Marigliano in via San Biagio dei Librai. Dentro funziona come un ospedale vero: camici bianchi, reparti e una cartella clinica per ogni paziente. Per molti napoletani è il luogo dove da bambini hanno portato il loro giocattolo preferito.","con":"Anche solo la vetrina vale la sosta: è sulla strada del ritorno.","acc":"","foto":{"u":"img/fb7ec54d1f19.jpg","alt":"La vetrina dell'Ospedale delle Bambole piena di bambole","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vetrina dell'Ospedale delle Bambole: bambole e giocattoli in attesa di essere «curati»."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Orari di ottobre e novembre: in altri periodi possono cambiare."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Orari di ottobre e novembre: in altri periodi possono cambiare."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un ospedale vero, per giocattoli","x":"Non è un negozio ma un laboratorio organizzato come un ospedale: i pazienti sono bambole, orsacchiotti e peluche, ognuno con la sua storia.\n\nI «medici» lavorano in camice bianco, divisi in reparti come in un ospedale vero: ortopedia, oculistica, sartoria. Ogni paziente ha la sua cartella clinica e la sua diagnosi.\n\nÈ un posto che piace molto ai bambini, ma anche agli adulti che ci ritrovano i giocattoli della loro infanzia.","d":"Nella bottega","foto":{"u":"img/d3916758e5c0.jpg","alt":"Teste di bambola in attesa di riparazione","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Teste, braccia e occhi di bambola in attesa di cura: nella bottega ogni pezzo ha il suo «reparto»."}},{"t":"Il fondatore scenografo","x":"Tutto cominciò alla fine dell'Ottocento con Luigi Grassi, che costruiva scenografie per i teatri e i presepi. I vicini iniziarono a portargli i giocattoli rotti, e lui trasformò il suo laboratorio nel primo «ospedale» per bambole.\n\nDa allora la bottega è passata di generazione in generazione nella stessa famiglia: oggi a curare i pazienti è Tiziana, sua pronipote.\n\nPensa al legame con la città: Napoli è la città dei presepi, e via San Gregorio Armeno, la strada delle botteghe dei pastori, è a due passi da qui.","d":"Nella storia della bottega","foto":{"u":"img/b8f43c4866ee.jpg","alt":"La porta della bottega dell'Ospedale delle Bambole con le vetrine","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"L'ingresso dell'Ospedale delle Bambole su via San Biagio dei Librai: la bottega aperta dalla famiglia Grassi."}},{"t":"Il cortile di Palazzo Marigliano","x":"L'ospedale si trova nel cortile di Palazzo Marigliano, al numero 39 di via San Biagio dei Librai: uno dei palazzi del Rinascimento napoletano legati ai nomi degli architetti Giovanni Francesco Mormando e Giovanni Francesco di Palma.\n\nEntrando dal portone il rumore della strada si spegne: è uno dei tanti cortili nascosti del centro storico che vale la pena scoprire. Sul palazzo c'è anche un'iscrizione che ricorda come qui vicino sorgesse in antico una basilica augustale.\n\nTutta la via è da guardare con calma: è il «decumano inferiore» della città greca, la strada dei librai, e qui nacque il filosofo Giambattista Vico.","d":"Via San Biagio dei Librai 39","foto":{"u":"img/89c281423b4c.jpg","alt":"Il cortile giallo di Palazzo Marigliano con l'arco d'ingresso","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Il cortile di Palazzo Marigliano, con l'arco d'ingresso e le facciate color ocra."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, la via dei presepi","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Un vicolo stretto dove il Natale dura tutto l'anno: botteghe di artigiani, pastori di terracotta e presepi.","rac":"Via San Gregorio Armeno collega via dei Tribunali con via San Biagio dei Librai, cioè Spaccanapoli. È la via dei presepi: le botteghe artigiane espongono statuine e presepi tutto l'anno, anche d'estate. Secondo alcune fonti la tradizione di produrre statuette di terracotta in questa zona risale all'epoca romana; la fama del presepe napoletano divenne internazionale dal Settecento.\n\nTra le botteghe storiche ci sono Gambardella, attiva dal 1800, e i Fratelli Capuano, fondata nel 1840. Lungo la via si trova anche il monastero di San Gregorio Armeno, da cui la strada prende il nome, con la chiesa dedicata a santa Patrizia, compatrona di Napoli.\n\nIl periodo più animato va da fine novembre all'Epifania, quando la via è affollatissima.","con":"Vieni la mattina presto e nei giorni feriali: a dicembre la ressa è tanta. Cerca i pastori che raccontano l'attualità: ogni anno gli artigiani ne creano di nuovi.","acc":"","foto":{"u":"img/e9db2e257e2c.jpg","alt":"La via dei presepi, stretta e piena di botteghe","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, la strada dei presepi."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Le botteghe dei presepi","x":"Le botteghe producono pastori e presepi in terracotta e sughero, spesso dipinti a mano. Accanto alle figure tradizionali ci sono personaggi dell'attualità: ogni anno gli artigiani ne inventano di nuovi. Puoi guardare anche senza comprare: molti artigiani lavorano a vista.","d":"Lungo tutta la via","foto":{"u":"img/03e3b2aafd76.jpg","alt":"Un banco pieno di pastori del presepe","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Un banco della via dei pastori, tra figure tradizionali e personaggi di oggi."}},{"t":"Il monastero di San Gregorio Armeno","x":"Il monastero dà il nome alla via. La chiesa conserva un soffitto a cassettoni di Teodoro d'Errico e affreschi di Luca Giordano, come la Gloria di San Gregorio. Nel complesso c'è anche la chiesa dedicata a santa Patrizia, compatrona di Napoli.","d":"Dentro il monastero, lungo la via","foto":{"u":"img/30ec6bba5546.jpg","alt":"La navata della chiesa di San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"La chiesa di San Gregorio Armeno, con il soffitto a cassettoni e gli affreschi."}},{"t":"Quando andare","x":"Le botteghe sono aperte tutto l'anno. Il periodo più vivo va da fine novembre all'Epifania, quando la via è piena di gente: meglio i giorni feriali e la mattina presto.","d":"Lungo tutta la via","foto":{"u":"img/2aae9d17a8cd.jpg","alt":"Via San Gregorio Armeno affollata","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno: meglio i giorni feriali e la mattina presto."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore e scavi della Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Una chiesa gotica del Duecento che nasconde, dieci metri sotto la navata, il mercato dell'antica Neapolis: strade, botteghe e ambienti di duemila anni fa.","rac":"Piazza San Gaetano è il cuore dell'antica Neapolis. Sopra i resti del mercato greco-romano, nel Duecento, sorse la basilica gotica di San Lorenzo Maggiore, una delle chiese più antiche della città. Il complesso comprende anche il convento, il museo dell'Opera e gli scavi.\n\nGli scavi, iniziati nel 1976, hanno riportato alla luce il macellum, il mercato, che sorgeva lungo l'antico decumano maggiore. Si scende a circa dieci metri sotto la chiesa e si cammina tra strade, botteghe e ambienti di età imperiale. Sotto la chiesa sono emersi anche i resti di una basilica cristiana del VI secolo.\n\nIl museo dell'Opera, negli ambienti del convento e nella torre civica, racconta la storia di Napoli dall'età classica all'Ottocento.","con":"Scendi negli scavi: è la parte che non ti aspetti. Calcola circa tre quarti d'ora e controlla gli orari sul sito ufficiale prima di venire.","acc":"","foto":{"u":"img/c44587f32365.jpg","alt":"La facciata di San Lorenzo Maggiore su piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, affacciata su piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Orario indicato dalla scheda del Ministero della Cultura e da fonti turistiche; il sito ufficiale non è stato leggibile: controllare prima di scrivere come certo."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"Il mercato sotto la chiesa","x":"Gli scavi mostrano il macellum della Neapolis greco-romana, il mercato che sorgeva lungo l'antico decumano maggiore. Si trovano a circa dieci metri sotto la chiesa. Camminando tra le strutture si riconoscono la strada e gli ambienti dove si vendeva e si commerciava: è un pezzo di città antica ancora al suo posto, sopra cui Napoli ha continuato a costruire.","d":"Sotto la navata, negli scavi","foto":{"u":"img/ab890c42a731.jpg","alt":"Una strada romana negli scavi sotto San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Gli scavi sotto San Lorenzo Maggiore: la strada e le botteghe della città antica."}},{"t":"L'altare maggiore di Giovanni da Nola","x":"L'altare maggiore è un'opera rinascimentale dello scultore napoletano Giovanni da Nola, tra le più belle di Napoli. L'abside che lo ospita è la parte più antica della chiesa.","d":"In fondo alla chiesa, nell'abside","foto":null},{"t":"Il museo dell'Opera","x":"Il museo occupa gli ambienti del convento e la torre civica accanto alla basilica. Espone arredi, costumi e collezioni e presenta la storia di Napoli dall'età classica all'Ottocento.","d":"Nel convento, accanto alla basilica","foto":{"u":"img/591ff764e679.jpg","alt":"Una sala del museo nel complesso di San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Gli ambienti del convento di San Lorenzo Maggiore che ospitano il museo dell'Opera."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la chiesa delle capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La chiesa delle capuzzelle: sotto il pavimento, l'ipogeo dove Napoli pregava per le anime senza nome. E il teschio di Lucia.","rac":"I napoletani la chiamano «'e cape 'e morte», la chiesa delle teste di morto. È una piccola chiesa del Seicento sul decumano maggiore, legata alla devozione per le anime del Purgatorio diffusa dalla Controriforma. Una scala ripida porta all'ipogeo, la chiesa sotterranea, ampliato e decorato con maioliche nel Settecento: qui i devoti si prendevano cura di resti anonimi e chiedevano loro intercessione. In fondo a un piccolo corridoio è custodito il teschio di Lucia, un'anima giovane particolarmente amata.","con":"Dietro l'altare cerca il teschio alato in marmo di Dionisio Lazzari: è il simbolo della chiesa.","acc":"","foto":{"u":"img/66f88d49a737.jpg","alt":"La facciata del Purgatorio ad Arco su via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La facciata del Purgatorio ad Arco, sul decumano maggiore."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Chiesa alta, ipogeo e museo. Visite guidate incluse nel biglietto, con prenotazione."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Chiesa alta, ipogeo e museo."}],"fonti":[{"t":"Santa Maria delle Anime
