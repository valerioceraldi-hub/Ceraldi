l":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"The castle that is the symbol of Naples: a triumphal arch between two towers, a bronze door still struck by a cannonball, and the hall where a king had the barons arrested during a wedding celebration.","rac":"Under the Angevin kings, the castle became a centre of culture: under Robert of Anjou, artists, doctors and men of letters stayed there, including Giotto, Petrarch and Boccaccio.\n\nAlfonso I of Aragon made it his royal residence and rebuilt it. To celebrate his victorious entry into the city, he built the great Triumphal Arch between the Middle Tower and the Watchtower, which still serves as the entrance today.\n\nToday the castle is home to the Civic Museum: the tour includes the art gallery on the first floor, the Barons' Hall, the Palatine Chapel, also known as the Chapel of Santa Barbara, and an archaeological tour in the ancient Armoury.","con":"Full price ticket: €10; €6 for residents of Naples and the metropolitan area; free for children under 18. Closed on Sundays.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"The Maschio Angioino with its two towers and the white arch in the middle","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"The two large towers and, in the middle, the Triumphal Arch of Alfonso of Aragon: this is the entrance to the castle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"The Arc de Triomphe","x":"This is the castle's entrance, nestled between two towers: Alfonso I of Aragon commissioned it to celebrate his victorious entry into Naples. Stop in front of it before entering and admire it from below.","d":"At the entrance, between the Middle Tower and the Watchtower","foto":{"u":"../img/91d08c9a9561.jpg","alt":"The marble Triumphal Arch between the two towers","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"The arch up close: look at it from below, floor by floor."}},{"t":"The door with the cannonball","x":"Ferrante of Aragon commissioned it from Guglielmo Monaco around 1475, to commemorate the 1462 victory over John of Anjou and the rebel barons: six panels recount the war. In the lower left panel, an iron cannonball still embedded in the bronze. The most widely accepted theory is that the door was part of the booty that Charles VIII loaded onto ships bound for France; off the coast of Rapallo, the fleet was attacked by the Genoese and hit. The Genoese sent it back to Naples in 1495.","d":"The original is preserved inside the castle","foto":{"u":"../img/50ee03911e6d.jpg","alt":"The cannonball stuck in the bronze door","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"The iron cannonball embedded in the bronze, in the lower left panel."}},{"t":"The Barons' Hall","x":"It is reached by the external piperno staircase designed by Majorcan architect Guglielmo Sagrera. Look up: the vault rises to about 28 meters, and sixteen piperno ribs extend in a star-shaped pattern from a central opening. The name recalls 1486, when King Ferrante I deceived the barons to celebrate a wedding and had them arrested here. For fifty years, it served as the seat of the City Council.","d":"At the top of the courtyard stairs","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"The star vault of the Barons' Hall","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"The vault of the Barons' Hall: sixteen piperno ribs start in a star shape from the opening in the centre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"A tunnel commissioned by a king as an escape route, which later became an air-raid shelter and then a storage facility: a journey beneath Pizzofalcone hill.","rac":"The Galleria Borbonica was commissioned by Ferdinand II of Bourbon with a decree dated February 19, 1853, and designed by architect Errico Alvino. It was intended to connect the Royal Palace with Piazza della Vittoria and the barracks, passing under Pizzofalcone hill: a quick escape route for the king. Construction was halted due to lack of funding and then the political changes of Italian unification.\n\nDuring World War II, some rooms were used as air raid shelters. After the war, until the 1970s, the tunnel served as a judicial warehouse for the City of Naples: fragments of statues, vintage cars, and motorcycles can still be seen today. The Borbonica Sotterranea Cultural Association has cleaned it and offers guided tours.\n\nThe Standard Route lasts about an hour and can be started from two entrances: Via Domenico Morelli 61 and Vico del Grottone 4, about 100 meters from Piazza del Plebiscito. More adventurous routes are also available.","con":"Booking: Reservations are required. The standard tour departs at 10:00 AM, 12:00 PM, 3:00 PM, and 5:00 PM on Fridays, Saturdays, Sundays, and holidays. Photography is permitted.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"A tunnel dug into the tuff in the Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"A section of the Galleria Borbonica, dug into the tuff."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Standard Tour: Tours at 10:00 am, 12:00 pm, 3:00 pm, and 5:00 pm (Friday, Saturday, Sunday, and holidays). Reservations required; tour lasts approximately 1 hour. Entrances: Via Domenico Morelli 61 and Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"The Bourbon tunnel","x":"This is the part that tells the story of Ferdinand II's ambition: a long passageway of yellow tuff, designed to connect the Royal Palace with Piazza della Vittoria. The tuff also tells the story of the quarrymen's work and the hydraulic engineering of the time.","d":"Along the main route","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"A passage dug into the tuff in the Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"The passage of the well-drainers, a section of the Galleria Borbonica dug into the tuff."}},{"t":"The air raid shelter","x":"Between 1939 and 1945, thousands of people took shelter here from the bombings. Beds, graffiti, and everyday objects from the era remain. This is the part that most strikes visitors.","d":"In the rooms of the refuge","foto":{"u":"../img/3200f06943d2.jpg","alt":"The air-raid shelter in the Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"The World War II air raid shelter."}},{"t":"Vintage cars and motorcycles","x":"After the war, the tunnel was used as a judicial depot for seized vehicles: even today, vintage cars and motorcycles can be seen along the route.","d":"Along the way","foto":{"u":"../img/87eab52966bc.jpg","alt":"Vintage cars abandoned in the tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Vintage cars along the tunnel: the post-war period, when the tunnel was a judicial warehouse."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Seafront and Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"The castle on the islet where the Greek colonists from Cumae landed: you arrive from the seafront, cross the bridge and look out over the gulf from Borgo Marinari.","rac":"The castle stands on the islet of Megaride, made up of two rocks joined by a large arch. Here, in the mid-7th century BC, colonists from Cumae landed, who later founded Partenope on nearby Mount Echia.\n\nIn the 1st century BC, the villa of Lucius Licinius Lucullus stood on the islet and Mount Echia. Remains of this villa remain in the Hall of Columns: in the early Middle Ages, the hall served as the refectory of one of the convents built on the islet.","con":"The castle's interior is closed for renovations until further notice. Today, visitors can visit the castle from the outside, strolling along the seafront and around Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo on the sea, with the blue sky","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo on the islet of Megaride, connected to the seafront by a bridge."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Reservation optional."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"The islet of Megaride","x":"From the seafront, look at the castle: it rests on the islet of Megaride, made of two rocks joined by a large arch. Here, towards the middle of the 7th century BC, the Cumaeans, of Greek origin, landed, who then founded the city of Partenope on nearby Mount Echia.\n\nIn the 1st century BC, during the Roman era, the famous villa of Lucius Licinius Lucullus was built on the islet and on Mount Echia; the column drums of the so-called \"Hall of Columns\" remain.\n\nThe name comes from a legend: the poet Virgil hid an egg in a cage in the cellars, and the fate of the castle and all of Naples depended on its integrity. When, during the reign of Queen Joanna I, the arch collapsed between the two rocks, the queen had to declare that she had replaced the egg to calm the city.","d":"From the bridge leading to Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo and the Borgo Marinari marina seen from above","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"From above: the castle on the rock and, next to it, the small port of Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"1841 engraving with Castel dell'Ovo and a sailing boat","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in an 1841 engraving."}],"leg":"The name comes from a legend: the poet Virgil is said to have hidden an egg, locked in a cage, in the castle's cellars.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Sanità District and the Basilica of Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"A popular neighborhood reborn from below: the \"Monacone\" basilica, the catacombs, Totò and the murals.","rac":"The Rione Sanità is one of Naples' oldest and most popular neighborhoods: for centuries it was a burial site, and today it is a model of grassroots rebirth, with youth cooperatives managing catacombs and visiting them.\n\nAt the center is the Basilica of Santa Maria della Sanità, built between 1602 and 1610 to a design by Fra Nuvolo, one of the finest examples of Neapolitan Baroque. It is known as San Vincenzo or \"'o Munacone,\" after the large statue of Saint Vincent Ferrer it houses. The church has a Greek cross plan, and the dome is covered in majolica. Beneath the church are the 4th-century Catacombs of San Gaudioso.\n\nThe actor Totò was born in this neighborhood, on Via Santa Maria Antesaecula, and is remembered by murals throughout the neighborhood. Eduardo De Filippo's comedy \"The Mayor of the Sanità District\" is also set here.","con":"Visit the neighborhood during the day and at your leisure: the catacombs, the basilica, and the Fontanelle Cemetery are nearby. You can combine it all with the Miglio Sacro on Sunday.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"The domed Basilica of Santa Maria della Sanità","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"The Basilica of Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilica. May be closed on certain dates: check the website."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"The Basilica of Monacone","x":"The church of Fra Nuvolo has a Greek cross plan and a majolica-covered dome. The presbytery is raised, and the baroque altar features a double staircase. The statue of Saint Vincent Ferrer, the \"Monacone,\" gives the basilica its popular name.","d":"In Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"The raised presbytery with the double staircase in the basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"The raised presbytery of the Basilica of Santa Maria della Sanità, with the double staircase."}},{"t":"The Catacombs of San Gaudioso","x":"Beneath the basilica are the 4th-century catacombs of San Gaudioso. They are accessed from the church.","d":"Under the basilica","foto":{"u":"../img/30e6de57bd17.jpg","alt":"The catacombs of San Gaudioso under the basilica","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"The catacombs of San Gaudioso, under the basilica."}},{"t":"Totò and the murals","x":"In the nearby streets, and in Via Santa Maria Antesaecula where Totò was born, murals and small images commemorate the actor and the stories of the neighborhood.","d":"In the alleys around the square","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacombs of San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"The largest catacombs in Southern Italy: two-level tunnels in the tuff rock and the original tomb of San Gennaro, patron saint of Naples.","rac":"The Catacombs of San Gennaro are located in the Sanità district, with entrance at Via Capodimonte 13, next to the Basilica of Buon Consiglio. Their origins date back to the 2nd century AD, when a wealthy Roman family donated their tomb to the Christian community. The complex extends over two levels, carved into the tuff: San Gennaro Superiore and San Gennaro Inferiore.\n\nSaint Januarius was buried here, and for centuries the site was a place of pilgrimage. His relics remained here until the 9th century; then they were removed and the site was abandoned. Today, visits are only possible with a guide, lasting about an hour. Since 2009, an LED system, installed by the Officina dei Talenti neighborhood youth cooperative, has illuminated the frescoes with a soft light.\n\nThe site is managed by the social cooperative La Paranza, founded by young people from the Rione Sanità.","con":"Book in advance: tours are guided only, depart every hour, and reservations are required. The Miglio Sacro, a guided tour of the Rione Sanità, departs at 9:30 am on Saturdays, Sundays, and holidays. The catacombs are closed on Wednesdays.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"An early Christian fresco in the Catacombs of San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"An early Christian fresco in the Catacombs of San Gennaro."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Guided tours are available every hour; reservations are always required. Closed on Wednesdays and December 25th."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"The tomb of San Gennaro","x":"It is the tomb that gives its name to the entire catacomb system: the patron saint of Naples was buried here. His relics remained there until the 9th century.","d":"On the guided tour","foto":{"u":"../img/fd273aee226d.jpg","alt":"The tomb of San Gennaro in the catacombs","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"The tomb of San Gennaro, the place that gives the catacombs their name."}},{"t":"The two levels","x":"The galleries are dug into the tuff on two levels, the upper and the lower, with large passages and early Christian frescoes.","d":"Along the guided tour","foto":{"u":"../img/537a160d9acb.jpg","alt":"A tunnel dug into the tuff with tombs in the walls","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"The galleries of the catacombs, dug into the tuff."}},{"t":"The Sacred Mile","x":"On Saturdays, Sundays, and holidays, a three-hour guided tour visits the sites associated with San Gennaro in the Rione Sanità district. It departs at 9:30 a.m. and must be booked on the official website.","d":"From the meeting point in the catacombs","foto":{"u":"../img/0becd922c42f.jpg","alt":"The facade of a building in the Sanità district","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"The Sanità district, where the Miglio Sacro follows the places linked to San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Fontanelle Cemetery","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"A tuff quarry as large as a cathedral, thousands of nameless skulls, and the cult of the \"souls pezzentelle.\" Reopened in 2026.","rac":"In the 16th century, it was a tuff quarry in the Sanità Valley. Many victims of the plague of 1656 were brought there, followed by those of the cholera epidemic of 1836-1837. In 1872, Canon Gaetano Barbati arranged the remains in three large naves. The space is approximately four thousand square meters.\n\nThe cult of the \"anime pezzentelle\" (peaceful souls) was born here: devotees would adopt a skull, a capuzzella, care for it, and pray to it, hoping for protection in return, sometimes a dream involving lottery numbers. In 1969, a decree from the ecclesiastical court closed the ossuary and banned the cult. Closed for renovations since 2020, it reopened to the public in 2026, managed by the La Paranza cooperative.","con":"It's closed on Wednesdays. Download the cemetery app before you arrive: the phone signal inside is weak.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"The large tuff galleries of the Fontanelle Cemetery","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"The tuff galleries of the Fontanelle Cemetery."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Closed on Christmas Day. Monday and Friday 9–10 a.m. open only for worship."}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"A quarry as big as a cathedral","x":"The cemetery occupies an old tuff quarry of approximately four thousand square meters, arranged into three large naves in 1872 by Canon Gaetano Barbati. The dead of the plague of 1656 and the cholera of 1836-1837 were brought there.","d":"In the three naves","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"A nave of the Fontanelle Cemetery dug into the tuff","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"One of the three naves of the Fontanelle Cemetery, in the old tuff quarry."}},{"t":"The cult of the poor souls","x":"Devotees adopted a skull, the capuzzella, cared for it and prayed to it, hoping for protection in return, sometimes a dream involving lottery numbers. In 1969, the ecclesiastical court banned the cult and closed the ossuary.","d":"In front of the rows of skulls","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Rows of skulls with a cross","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"The capuzzelle: nameless skulls, adopted and cared for by devotees."}},{"t":"The Fontanelle at the MADRE","x":"Artist Rebecca Horn has reproduced some of the Fontanelle 's capuzzelle in cast iron in her work \"Spirits,\" which can be seen at the MADRE museum: a way to understand how the cemetery has also entered contemporary art.","d":"At the MADRE museum (separate page)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Charterhouse and Museum of San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"A Carthusian monastery turned museum on the Vomero hill: a Baroque cloister, a Cuciniello nativity scene, and one of the most beautiful views of the gulf.","rac":"The Certosa di San Martino stands on the Vomero hill, next to Castel Sant'Elmo. It was founded in 1325 by Charles of Calabria, son of King Robert of Anjou, and entrusted to Tino di Camaino. Between the 16th and 18th centuries, it became one of the finest examples of Italian Baroque art: from 1623 to 1656, Cosimo Fanzago renovated its interior. Since 1866, after the suppression of religious orders, it has housed the National Museum of San Martino, commissioned by Giuseppe Fiorelli.\n\nThe Great Cloister, enlarged in 1581 by Giovanni Antonio Dosio and completed by Fanzago, has the monks' cemetery at its center. The museum houses the principal Italian public collection dedicated to the Neapolitan nativity scene, including the grandiose Cuciniello Nativity Scene: approximately eight hundred shepherds, animals, and accessories donated by the collector Michele Cuciniello, inaugurated in 1879. Other sections recount the Kingdom's navy, the theater, the city and the Kingdom through images, and, from December 2025, 19th-century Naples. The Strozzi Table, considered the first painting of Naples, is also housed here.","con":"Step out onto the terraces and the Prior's Loggia: from here you can see the entire gulf. It's open every day except Tuesdays; last admission is at 5:30 PM.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"The large cloister of the Certosa di San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"The large cloister of the Certosa di San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Closed on Tuesdays. Some sections (naval, nativity scene, 19th-century Naples) open at 9:30; the gardens close an hour earlier."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"The Great Cloister","x":"Enlarged in 1581 by Giovanni Antonio Dosio and completed by Cosimo Fanzago, it has the monks' cemetery at its center. Along the perimeter, the doors and hatches of the Carthusians' cells can still be seen.","d":"In the heart of the Certosa","foto":{"u":"../img/e43efae68626.jpg","alt":"The Great Cloister of the Certosa with the monks' cemetery","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"The Great Cloister of the Certosa di San Martino, with the monks' small cemetery in the center."}},{"t":"The Cuciniello Nativity Scene","x":"With approximately eight hundred pieces, it is the most famous nativity scene in Naples. It was donated by Michele Cuciniello and inaugurated in 1879. A lighting system simulates the hours of the day.","d":"In the nativity scene section, where the kitchens were","foto":{"u":"../img/ae5327fcce50.jpg","alt":"The large nativity scene with hundreds of figures","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"The Cuciniello Nativity Scene, with approximately eight hundred pieces."}},{"t":"The view of the gulf","x":"From the terraces and gardens of the Certosa you can see the entire Gulf of Naples, with Vesuvius in the background.","d":"On the terraces and in the gardens","foto":{"u":"../img/81d0fb825e80.jpg","alt":"The Gulf of Naples seen from a balcony of the Certosa","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"The gulf and Vesuvius from a balcony of the Certosa di San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant'Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"The star-shaped fortress on Vomero hill: bastions with a 360° view of Naples and the gulf, and inside the Novecento Museum.","rac":"Castel Sant'Elmo dominates the Vomero district, about 250 meters above sea level, and is visible from almost the entire city. The earliest records date back to around 1275 as an Angevin fortified residence called Belforte; in 1329, Robert of Anjou commissioned its expansion, which was entrusted to Tino di Camaino. The six-pointed star-shaped layout is the result of the sixteenth-century reconstruction commissioned between 1537 and 1547 by Viceroy Pedro de Toledo, based on a design by military architect Pedro Luis Escrivà.\n\nOver the centuries, it was often used as a prison: Tommaso Campanella was imprisoned there, as were patriots of the Neapolitan Republic of 1799, such as Gennaro Serra, Mario Pagano, and Luisa Sanfelice. After serving as a Bourbon garrison, it served as a military prison until 1952; extensive restoration work began in 1976.\n\nSince 2010, the Museo Novecento a Napoli has been located on the parade ground: over 170 works by approximately 90 Neapolitan artists or those active in the city between 1910 and 1980. Some works were created specifically for the castle: Gian Maria Tosatti created a wheat field in the large cistern, and the aluminum sculpture \"Sant'Elmo\" by Mimmo Paladino stands out on the battlements.\n\nFrom the ramparts the view reaches from the islands to Vesuvius, from the Phlegraean Fields to the Matese mountains.","con":"Climb up at sunset for the view. The castle is next to the Certosa di San Martino: both can be visited on the same morning. The castle is closed on Tuesdays and, in bad weather, may remain closed.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"The high tuff walls of Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"The walls of Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castle 8:30 AM - 7:30 PM; Museo Novecento 9:30 AM - 6:30 PM (last admission 5:30 PM). Closed on Tuesdays. In bad weather, the site may be closed."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"The bastions and the panorama","x":"The bastions offer a 360° panorama of the city, the gulf, Vesuvius, and the Posillipo coast, among the most complete in Naples.","d":"In the stands","foto":{"u":"../img/81edfbd30506.jpg","alt":"Naples and Vesuvius seen from the top of Castel Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"From the ramparts of Castel Sant'Elmo: the city, the port and Vesuvius."}},{"t":"The Novecento Museum in Naples","x":"Opened in 2010 on the parade ground, it houses over 170 works by around 90 Neapolitan artists or those active in the city, created from 1910 onwards: from Futurism to the Transavanguardia of the 1980s.","d":"On the castle parade ground","foto":{"u":"../img/d585126c2db4.jpg","alt":"A room in the Novecento Museum with works of art","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"A room in the Museo Novecento in Naples, inside Castel Sant'Elmo."}},{"t":"A wheat field in the cistern","x":"The work «My dreams, they'll never surrender» by Gian Maria Tosatti (2014) is a field of wheat grown in the cistern, the darkest and deepest place in the castle, which was also a prison.","d":"In the large cistern","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Your first walk","sub":"Spaccanapoli in half a day, starting from Ceraldi","desc":"The heart of the historic center in a circular walk: the Gesù Nuovo and its mystery, the cloister of Santa Chiara, the Veiled Christ, the Church of the Skull and Ears, the shops of Via San Biagio dei Librai. And then we return to us.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli seen from above: a straight street that cuts through the historic center","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli seen from above: the long, straight street that bisects the historic center. The first tour is on foot."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"A coffee at Ceraldi and off we go.","q":n webp","alt":"Caffè Ceraldi"}},{"v":356,"n":"Aspritz","p":800,"foto":{"u":"../img/a3e1bd8ea3d9.webp","alt":"Aspritz"}}],"l":[]}}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"The history of Naples","sub":"From the siren Partenope to today, in thirteen chapters","som":"Before leaving, twenty-eight centuries in ten minutes: the legend of the siren, the Greeks, Rome, the kings, the revolt, the war, and the city of today.","txt":"Naples is one of the oldest cities in Europe: its history spans nearly three thousand years, and the historic center you are about to walk through still retains the street plan drawn by the Greeks. For over half a millennium, it was the capital of Southern Italy.\n\nThese thirteen chapters take you from the legend to the city of today. Each time the story reaches a location in the guide, you'll find a button to go there.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"Castel dell'Ovo in a view from 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in a view from 1841: the islet where Partenope was born."},"cap":[{"p":"The legend","t":"The siren Partenope","x":"It all begins with a siren. In Greek myth, sirens were creatures with the body of a bird and the head of a woman, masters of a magical song. One of them was named Partenope.\n\nThe most famous tale says that, when Ulysses passed their rock without yielding to their song, the sirens threw themselves into the sea in grief. The waves carried Partenope 's body to the coast, at the mouth of a small river, the Sebeto: precisely where the city would be founded.\n\nA tomb was built there, and the Greeks of Naples dedicated annual sacrifices and a torchlight race to her. Even today, Neapolitans call themselves \"Parthenopeans.\"","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"The fountain with the siren Partenope in Piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"The Siren Fountain in Piazza Sannazaro: Partenope with the lyre."}},{"p":"8th–7th century BC","t":"Partenope, the first city","x":"The legend has some truth. Between the 8th and 7th centuries BC, the Greeks of Cumae, the oldest Greek colony in the area, founded a small port on the sea and named it after the siren: Partenope.\n\nIt stood on the Pizzofalcone hill, Mount Echia, on a spur surrounded by the sea, and had its landing place on the islet of Megaride, where Castel dell'Ovo stands today. The port was located where today's Piazza Municipio is located. The necropolis of Partenope was discovered in 1949 on Via Nicotera.\n\nThe small city grew so quickly that Cumae, fearing loss of command, reduced its role.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo on the sea, with the blue sky","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo on the islet of Megaride, connected to the seafront by a bridge."}},{"p":"5th century BC","t":"Neapolis, the new city","x":"Next to Partenope, a little further east, the Cumaeans founded a new city: Neapolis, the \"new city.\" UNESCO dates its foundation to around 470 BC, around the time the Greeks had defeated the Etruscans at sea.\n\nNeapolis was built according to a regular plan: three main parallel streets (the \"plateiai,\" later called decumani), intersected at right angles by smaller streets. The agora, the main square, was located where Piazza San Gaetano stands today.\n\nThat grid is still there: Spaccanapoli, Via dei Tribunali, and Via Anticaglia are the three Greek streets. Walking along them, you're walking through the city plan of 2,500 years ago.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"The large tuff blocks of the Greek walls, dug below street level","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"The tuff blocks of the Greek walls of Neapolis, in Piazza Bellini, visible in an excavation below street level."}},{"p":"326 BC – 5th century AD","t":"Greek under Rome","x":"In 326 BC, Neapolis allied itself with Rome and remained a Greek city within the Roman world for centuries: it was among the few to preserve the Greek language and culture. It became a favorite destination for cultured and wealthy Romans, who built villas on the gulf: that of Lucius Licinius Lucullus was built on the islet of Megaride.\n\nIn 79 AD, the eruption of Vesuvius destroyed Pompeii and nearby Herculaneum. In 476, Romulus Augustulus, the last Western Roman emperor, was imprisoned in Lucullus's fortified villa: with him, the Empire ended.\n\nWater already flowed beneath the Greco-Roman city from the cisterns you can visit today in Napoli Sotterranea, and the emperor Nero performed in the theatre of Neapolis.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"A large underground cistern dug into the tuff, dimly lit","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"One of the large cisterns dug into the tuff, about 40 meters below Via dei Tribunali."}},{"p":"6th–12th century","t":"The Duchy of Naples","x":"After the fall of the Empire in the 6th century, Naples passed to the Byzantines, the Eastern Romans. It gradually became a quasi-independent duchy: in the 8th century, Duke Stephen II became its de facto lord.\n\nFor five centuries, the duchy resisted the Lombards and Saracens. In 1030, Duke Sergius IV granted the county of Aversa to a group of Norman mercenaries: this marked the beginning of their rise in the South. In 1137, Naples submitted to the Normans and became part of the new Kingdom of Sicily.\n\nFrom those distant years remain the oldest churches, such as Santa Restituta and the baptistery of San Giovanni in Fonte inside the Cathedral, considered the oldest in the West.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"The interior of the Basilica of Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, the early Christian basilica incorporated into the Cathedral: Naples before the Duchy."}},{"p":"1194–1266","t":"Normans and Swabians: the University is born","x":"After the Normans came the Swabians. In 1194, Emperor Henry VI occupied the city and demolished its walls.\n\nHis son, Frederick II, was a ruler passionate about culture and law. In 1224, he founded the \"Studio\" in Naples, one of the first state universities in Europe: it is the current Federico II University, which still bears his name.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"The statue of Frederick II of Swabia on the facade of the Royal Palace","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"The statue of Frederick II of Swabia, among those on the facade of the Royal Palace."}},{"p":"1266–1442","t":"The Angevins: Naples as capital","x":"In 1266, the Pope entrusted the kingdom to Charles I of Anjou, brother of the King of France, who entered the city in triumph. After the Sicilian Vespers revolt of 1282, Sicily seceded and Naples became the capital of the kingdom, a position it would remain for centuries.\n\nThe Angevins built the Castel Nuovo, the Cathedral (from 1294), and the citadel of Santa Chiara (from 1310), and the city expanded. Giotto, Petrarch, and Boccaccio stayed at the court of Robert of Anjou in the Castel Nuovo.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"The entrance to the cloister of Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"The entrance to the majolica cloister of Santa Chiara."}},{"p":"1442–1503","t":"The Aragonese","x":"In 1442, Alfonso of Aragon conquered Naples: according to tradition, his men entered the city through an aqueduct. He made the Castel Nuovo his palace, rebuilt it, and to celebrate the victory, added the great Triumphal Arch between two towers.\n\nThe Aragonese transformed the medieval castle into a modern fortress and renovated the city's defenses and streets. Their son Ferrante defeated the rebel barons: the castle's bronze door recounts that war, and his vengeance was exacted in the Barons' Hall.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"The Strozzi Table: Aragonese Naples seen from the sea, with the Maschio Angioino and Castel Sant'Elmo.","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"The Strozzi Table (15th century): Naples seen from the sea, with the port, the Castel Nuovo and, above, the Sant'Elmo hill."}},{"p":"1503–1707","t":"The Spanish Viceroyalty","x":"In 1503, Naples passed to Spain and was governed by a viceroy. Without a king present, it was still an imperial capital, with one of the grandest courts in the Spanish dominions. Viceroy Don Pedro of Toledo doubled the size of the city, opened Via Toledo, and built the soldiers' quarters, the Spanish Quarters. The Royal Palace was also built during these years.\n\nIn 1606, Caravaggio arrived in Naples, fleeing from Rome: his painting changed the art of the city, which in the 17th century became one of the capitals of the European Baroque.\n\nThey were also very hard years: very high taxes, the eruption of Vesuvius in 1631 and, in 1656, a plague that killed more than half the inhabitants.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello during the plague of 1656: bodies piled up in the square and celestial figures in the sky","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello during the plague of 1656, painted by Micco Spadaro: the square is full of dead and dying."}},{"p":"1647","t":"Masaniello","x":"On July 7, 1647, after yet another tax, this time on fruit, the food of the poorest, a 27-year-old fisherman, Masaniello, led the people in revolt shouting \"Long live the King of Spain, down with bad government!\"\n\nWithin ten days, the Spanish had to comply with the people's demands. But Masaniello, accused of madness and betrayed by a section of the rebels themselves, was assassinated. The revolt continued for months against Spain before being crushed in 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"A 17th-century painting of a rioting crowd in Piazza Mercato","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Market Square during Masaniello's revolt, painting by Domenico Gargiulo known as Micco Spadaro."}},{"p":"1734–1799","t":"The Bourbons and the Republic","x":"In 1734, Charles of Bourbon brought a king of his own back to Naples and sought to make it a great European capital. In 1737, he built the Teatro di San Carlo in just seven months, followed by the royal palaces of Portici and Capodimonte. The excavations of Herculaneum and Pompeii also began in those years.\n\nNaples was one of the capitals of the Enlightenment. In January 1799, with the arrival of the French army, the patriots proclaimed the Neapolitan Republic: it lasted only until June. Upon the return of the Bourbons, many of its protagonists were executed.\n\nAfter the years of the French (Joseph Bonaparte and Joachim Murat), the Bourbons returned in 1815, and in 1816 the Kingdom of the Two Sicilies was born.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Portrait of Charles of Bourbon in armour","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Charles of Bourbon portrayed by Anton Raphael Mengs."}},{"p":"1860–1945","t":"United Italy and the war","x":"On September 7, 1860, Giuseppe Garibaldi entered Naples to a cheering crowd; a plebiscite sanctioned the union with the Kingdom of Italy. Naples ceased to be a capital, and the loss was heavy.\n\nDuring World War II, the city suffered more than 120 aerial bombardments, mostly due to its port; people took refuge in underground cisterns. After the armistice, the Germans occupied the city. At the end of September 1943, the Neapolitans revolted: in the \"Four Days of Naples,\" the people forced the German garrison to surrender. On October 1st, the Allies arrived.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"A vintage engraving: Garibaldi cheered by the crowd in Naples","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Vintage engraving of Garibaldi's entry into Naples in 1860: the crowd cheers him on Via Toledo."}},{"p":"From 1945 to today","t":"Naples today","x":"After the war, the city was rebuilt despite great difficulty. In 1995, the historic center was inscribed as a UNESCO World Heritage Site: it is the largest in Italy and one of the largest in Europe.\n\nSince 2001, the subway has opened its \"art stations,\" featuring works by contemporary artists. The city has approximately 950,000 inhabitants, more than three million including the metropolitan area.\n\nAnd then there's the Naples you'll see as you walk: the murals, like the one of Maradona in the Spanish Quarter, and Banksy's Madonna, the life in the alleys, the cafés. Three thousand years of history, one on top of the other, in just a few kilometers.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"The historic center of Naples seen from above","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"The historic center seen from above: a UNESCO World Heritage Site since 1995."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio in Naples","sub":"A painter on the run and three masterpieces to see","som":"Fleeing Rome, Caravaggio twice found refuge in Naples. Here he painted the Seven Works of Mercy, the Flagellation, and his last painting.","txt":"Michelangelo Merisi, known as Caravaggio, was a famous and controversial painter in Rome. In late May 1606, he fatally wounded Ranuccio Tomassoni in a brawl that broke out during a racket game. He was convicted and forced to flee.\n\nNaples, then one of the largest cities in Europe, was his refuge twice: from autumn 1606 to summer 1607, and then from autumn 1609 to summer 1610. Here he found the protection of the Colonna family and wealthy patrons, and here his painting changed the art of the city forever.\n\nThree of his works can be seen today in Naples, two of which are on our route.","foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggio's Seven Works of Mercy","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"The Seven Works of Mercy, painted by Caravaggio in Naples."},"cap":[{"p":"1606–1607","t":"The first stay and the Seven Works","x":"The first documented Neapolitan commission dates back to October 1606. A few months later, by 9 January 1607, Caravaggio delivered the large canvas of the Seven Works of Mercy to the Pio Monte della Misericordia, paid for 400 ducats.\n\nIt is still there, on the altar for which it was painted, in Via dei Tribunali: a night in an alley in Naples, where men help each other under the gaze of the Madonna.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggio's Seven Works of Mercy: Street Scenes on a Dark Night","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Caravaggio's Seven Works of Mercy (1607): the whole scene, with the people at the bottom and the Madonna and Child at the top."}},{"p":"1607","t":"The Flagellation","x":"For the de Franchis family, jurists and magistrates, Caravaggio painted the Flagellation of Christ in 1607, for their chapel in the church of San Domenico Maggiore: a canvas almost three metres high, one of the masterpieces of Neapolitan Baroque.\n\nToday, the original is in the Capodimonte Museum, where it was moved for safety reasons; a copy remains in San Domenico Maggiore. Capodimonte is outside our walking tours.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"Caravaggio's The Flagellation of Christ: Jesus tied to the column among the executioners","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"The Flagellation of Christ (1607), now in the Capodimonte Museum: the light falls on the body of Jesus, tied to the column."}},{"p":"1607–1609","t":"Malta and Sicily","x":"On July 12-13, 1607, Caravaggio arrived in Malta, likely on a Knights' galley departing from Naples. But there too he ran into trouble: after a brawl, he was arrested in August 1608, escaped from the fort where he was being held, and took refuge in Syracuse, Sicily.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"The Beheading of St. John the Baptist by Caravaggio","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"The Beheading of St. John the Baptist, painted by Caravaggio in Malta and preserved in Valletta."}},{"p":"October 1609","t":"The Cerriglio Ambush","x":"In the autumn of 1609 he returned to Naples, still under the protection of the Colonna family, hoping for the Pope's forgiveness so he could return to Rome.\n\nIn October he was attacked by four men in front of the Cerriglio tavern, a famous inn of the time, and disfigured in the face: the wound was so serious that word of his death spread in Rome.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Chalk portrait of Caravaggio","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio in the portrait of Ottavio Leoni, the face of the man attacked at Cerriglio."}},{"p":"1610","t":"The last painting","x":"In the spring of 1610, he painted the Martyrdom of Saint Ursula for the Genoese prince Marcantonio Doria: the canvas was finished in May, delivered still fresh with the varnish, and shipped to Genoa. It is the latest painting by Caravaggio that we know of, and is now on display at the Gallerie d'Italia on Via Toledo, six minutes from Ceraldi. Among the faces behind the saint is his own.\n\nThat summer, he sailed to Rome with some paintings, hoping for pardon. He was mistakenly arrested in Palo, and the boat departed with the paintings. He died in Porto Ercole on July 18, 1610 (or perhaps the next day), at the age of 38.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"The Martyrdom of Saint Ursula by Caravaggio: the saint and the king at the moment of the arrow","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"The Martyrdom of Saint Ursula (1610): the king hits the saint with the arrow, at close range."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Naples in Five Minutes: From the Siren to the New City","sub":"","som":"First Partenope, then Neapolis: because the historic center is still designed like a Greek city.","txt":"Naples was founded twice. The first time it was called Partenope, like the mythical siren: it was founded in the 7th century BC by colonists of Greek origin from Cumae, who landed on the islet of Megaride, where Castel dell'Ovo stands today, and settled on nearby Mount Echia.\n\nThe second time, around 470 BC, a new city arose next to the old one: Neapolis, meaning \"new city\" in Greek. This is the one you are now passing through. Its streets form a regular grid that, after twenty-five centuries, is still legible: the historic center of Naples is a UNESCO World Heritage Site precisely because the design of the Greek city has remained its backbone.\n\nThree parallel streets, the decumani, cut the city from west to east. The lowest one is Spaccanapoli: about two kilometers long, so straight that, seen from above, it appears to divide the city in two, hence its name. In the center runs Via dei Tribunali, the main decumanus; higher up are Via dell'Anticaglia and Via della Sapienza, the upper decumanus.\n\nFrom Piazza Carità, where we have been since 2002, Spaccanapoli begins a few minutes' walk away, in Piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"The historic center of Naples seen from above","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"The historic center from above: the straight streets are still those of the Greek city."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro and the Melting Blood","sub":"","som":"Three times a year, Naples holds its breath over a vial. What happens, where, and what the Church and science say about it.","txt":"In Naples Cathedral, in a niche in the Treasury Chapel, a vial containing a dark substance is kept, which tradition holds to be the blood of San Gennaro, the city's patron saint. Three times a year—on the Saturday before the first Sunday in May, on September 19th (the feast day), and on December 16th—the vial is shown to the faithful: if the contents, usually solid, dissolve, it's a celebration; if they remain solid, for many Neapolitans, it's a bad omen.\n\nThe first known record of the liquefaction dates back to 1389. The relics are not guarded by the clergy but by the Deputation of the Chapel of the Treasure of San Gennaro, a secular institution founded in 1601, which also includes the mayor of Naples.\n\nThe Church maintains a cautious stance: it speaks of a \"miraculous event,\" allows popular devotion, but does not impose it as a truth of faith. Among the explanations proposed by skeptics is thixotropy, the property of certain substances that are solid at rest and become liquid when moved or shaken.\n\nThe sacred and the profane have always coexisted here: in Via Duomo, a few steps from the cathedral, the street artist Jorit painted a San Gennaro with the face of a worker.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"The dome of the Chapel of the Treasure of San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"The Chapel of the Treasure of San Gennaro in the Cathedral, where the ampoule is kept."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Naples in Seven Traditions: From the Panaro to the Miracle of San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"The Poor Souls: When Naples Adopted a Skull","sub":"","som":"Ossuaries, capuzzelle, and prayers exchanged for lottery numbers: the cult of the nameless dead.","txt":"For centuries, in Naples, the nameless dead were not left alone. They were called anime pezzentelle: the poor souls who died without a funeral and without anyone to pray for them. The name is linked to \"pezzente,\" the poor man, but also to the Latin \"petere,\" to ask in order to receive: those who prayed for them hoped to receive protection and grace in return.\n\nThe symbolic site is the Fontanelle Cemetery, in the Sanità district: a sixteenth-century tuff quarry covering approximately four thousand square meters, which welcomed victims of the plague of 1656 and then those of cholera in 1836-1837. In 1872, Canon Gaetano Barbati arranged the bones in three naves. Devotees \"adopted\" a skull, a capuzzella: they cleaned it, placed it in a small shrine, adorned it with rosaries and coins, and prayed to it, waiting for a sign in a dream, sometimes a lottery number. Some skulls became famous: the Captain, with a blackened eye socket, the subject of a legend of marriage and jealousy; Donna Concetta, who is said to \"sweat\" when grace is granted.\n\nIn 1969, a decree from the ecclesiastical court closed the ossuary and banned worship. Closed for renovations since 2020, the cemetery reopened to the public in 2026, managed by the La Paranza cooperative.\n\nThe cult also lives on beneath Via dei Tribunali, in the hypogeum of Santa Maria delle Anime del Purgatorio ad Arco, the church Neapolitans call \"'e cape 'e morte\": there, the skull of Lucia, a particularly beloved young soul, is kept. And on Via San Biagio dei Librai, in the small church of Santa Luciella, there is a unique skull: the one with ears.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Skulls of the poor souls","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"The capuzzelle of poor souls."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoteric Naples: An alchemist prince, a coded facade, and a magic egg","sub":"","som":"Raimondo di Sangro, the rustication of the Gesù Nuovo, Virgil's egg, the munaciello: where history ends and legend begins.","txt":"Naples loves mysteries, and it has some very beautiful ones. The most famous has a name: Raimondo di Sangro, Prince of Sansevero, an eighteenth-century man, Grand Master of Neapolitan Freemasonry, a jealous inventor of his own secrets. The myth surrounded him even in his lifetime, and he himself fueled it. Benedetto Croce called him the Neapolitan incarnation of Doctor Faustus. The black legend attributes everything to him: servants killed to study their bodies, even the blinding of the sculptor of the Veiled Christ so he wouldn't sculpt another. These are legends, and the museum itself distinguishes them from documented history.\n\nThe Veiled Christ is the work of Giuseppe Sanmartino, commissioned by the prince: the transparent veil covering the body is carved from the same block of marble as the statue. In the chapel's underground cavea are the \"anatomical machines,\" two skeletons with reconstructed circulatory systems, created by the Palermo physician Giuseppe Salerno around 1756-1764. Legend has it that they involved mysterious injections and studies of beeswax and dyes.\n\nNot far away, the façade of the Gesù Nuovo, originally the Sanseverino palace in 1470, is covered with a pyramid-shaped ashlar of dark piperno stone. Some stones bear engraved markings: legend has it, a secret message; some scholars say they are the stonecutters' marks; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes, a score lasting about three-quarters of an hour called \"Enigma.\" A tempting hypothesis, not a certainty.\n\nAnd then there's the sea: according to legend, the poet Virgil hid the egg of the siren Partenope in the cellars of Castel dell'Ovo. As long as the egg remains intact, the castle remains standing.\n\nIn the houses, however, live the spirits of popular tradition: the munaciello, a hooded elf who brings good luck or mischief depending on how you treat him, and the bella 'mbriana, a good spirit of the house, who can appear as a butterfly or a gecko.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"The diamond-pointed facade of the Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"The diamond-pointed ashlar of the Gesù Nuovo, the \"coded facade\"."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples today: what's new?","sub":"","som":"The square dedicated to Maradona, the street art, the last Caravaggio on Via Toledo, reopened churches and ossuaries: the changing city.","txt":"Those who return to Naples after a few years find a city that has learned to tell its story.\n\nIn the Spanish Quarter, nine minutes from us, is Largo Maradona. The mural of Diego was painted in 1990 by Mario Filardi; over the years, it faded to the point of almost disappearing, then was restored thanks to Salvatore Iodice, and in the fall of 2017, the Argentine Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, previously called the artists' square, became a secular sanctuary of small altars, Argentine flags, and photographs, so popular that the municipality had to manage pedestrian traffic.\n\nStreet art has entered the historic center: in Piazzetta dei Girolamini, protected by glass, stands Banksy's Madonna with a Gun; on Via Duomo, Jorit's San Gennaro the Worker. The city's official tourist website has dedicated a dedicated itinerary to them.\n\nOn Via Toledo, six minutes from us, the Gallerie d'Italia houses the Martyrdom of Saint Ursula, Caravaggio's last canvas, along with over five hundred Attic and Magna Graecia vases.\n\nAnd places that had been closed for a long time are reopening: the church of Santa Luciella ai Librai, abandoned for over thirty years, was reopened to the public on April 5, 2019; the Fontanelle Cemetery reopened in 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"The Maradona mural in the Spanish Quarters","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, one of the faces of today's Naples."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagno   if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
