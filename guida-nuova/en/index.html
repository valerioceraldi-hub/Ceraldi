e altar, look for the winged marble skull by Dionisio Lazzari: it is the symbol of the church.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"The façade of Purgatorio ad Arco on Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"The façade of Purgatorio ad Arco, on the Decumano Maggiore."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Upper church, hypogeum and museum. Guided tours included in the ticket, by reservation."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Upper church, hypogeum and museum."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"The seventeenth-century paintings","x":"Before going down, take a good look at the church above. It was commissioned in 1616 by the lay confraternity \"Opera Pia Purgatorio ad Arco\" from the architect Giovan Cola di Franco and consecrated in 1638.\n\nIt was designed on two levels: the upper church, which represents the earthly dimension, and below it the hypogeum, the cemetery, which concretely represents Purgatory. All of the decoration reminds those who enter that the souls are waiting for a prayer to rise to Paradise.\n\nHere you will find precious marbles and paintings by three great masters of the Neapolitan seventeenth century: Massimo Stanzione, Luca Giordano and Andrea Vaccaro. In the sacristy and the oratory there is also a small museum with silverwork, vestments, manuscripts and paintings made for the confraternity between the seventeenth and nineteenth centuries.","d":"In the upper church","foto":{"u":"../img/a8b34654121a.jpg","alt":"A seventeenth-century marble tomb in the upper church","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"In the upper church: the tomb of Pietro Antonio Mastrilli (1607), among the seventeenth-century marbles and paintings."}},{"t":"The winged skull","x":"Among the marbles of the upper church is the famous winged skull by Dionisio Lazzari: a skull with wings, which sums up the spirit of the place. Here death is not frightening: it becomes an occasion for prayer and for a bond with those who are no longer with us.\n\nIt is no coincidence that Neapolitans call this church «'e cape 'e morte», the church of the skulls.\n\nThe message was deliberate: in a church born of the Counter-Reformation, everything had to remind passers-by and worshippers that the souls in Purgatory were waiting for a prayer to rise to Paradise.","d":"In the upper church","foto":{"u":"../img/63d1e885c193.jpg","alt":"A marble bas-relief of a winged, crowned skull","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"The winged, crowned skull in marble bas-relief, first half of the seventeenth century: the symbol of the church."}},{"t":"The hypogeum of the souls","x":"The real church is the one below. Through an opening in the floor of the upper church, steep steps lead down into a large, bare space: a true lower church.\n\nIn the middle of the floor stands a large anonymous tomb, surrounded by black chains and lit by just a few light bulbs. Along the walls there are niches, small altars and display cases: they are the signs of a cult that arose spontaneously here as early as the 17th century, when the faithful cared for nameless human remains and asked them for protection. At the far end is the ancient 17th-century altar with large black crosses.\n\nDescend slowly: this is a place of devotion that is still alive, not just a curiosity. Guided tour in Italian included in the ticket, by reservation.","d":"Beneath the church, down a steep staircase","foto":{"u":"../img/7fc480d05134.jpg","alt":"The hypogeum of Purgatorio ad Arco with altars and votive candles","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"The hypogeum, the church below: altars, votive candles and the testimonies of the cult of the souls."}},{"t":"Lucia's skull","x":"Among all the skulls in the hypogeum, one is particularly beloved: that of Lucia, believed to be the soul of a young girl. It is kept at the end of a small corridor.\n\nIt is the most touching testimony to the cult of the souls in Purgatory, which arose spontaneously here as early as the 17th century: devotees choose a nameless remain, care for it and ask it for protection.\n\nLook at her with respect: for many Neapolitans she is still today a presence to turn to.","d":"In the hypogeum, at the end of a small corridor","foto":{"u":"../img/d51d785835b3.jpg","alt":"A bronze skull between the bars of the church's iron railing","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_01.jpg","dida":"A bronze skull on the iron railing of the church of Purgatorio ad Arco."}}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"An image of the souls in Purgatory amid the flames inside the church","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Inside the church: the souls in Purgatory amid the flames, the theme of the whole place."},{"u":"../img/de63b1b83fa8.jpg","alt":"A bronze skull on a small column","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"A bronze skull: the symbol of the church of the “capuzzelle”."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Forty metres beneath Via dei Tribunali: the cisterns that supplied Naples with water for centuries, the wartime shelters and a Roman theatre hidden under the bed of a house.","rac":"Beneath the historic centre lies another city. From Piazza San Gaetano you go down more than a hundred steps to a depth of about 40 metres, along a route that passes through the Greek-Roman aqueduct and tunnels from the medieval, Bourbon and modern eras.\n\nThe Greek-era cavities were used as cisterns for the city's water for about 23 centuries. During the Second World War, the same spaces became air-raid shelters.\n\nThe underground visit is guided and lasts about an hour. Then you return to the surface for the final surprise: the remains of the Greek-Roman theatre of Neapolis, incorporated since the 15th century into the houses of the neighbourhood. You enter a “basso”, a ground-floor home, move a bed aside, and through a trapdoor you descend among the walls of the theatre.","con":"Wear flat shoes and bring a sweatshirt, even in summer: it is damp underground. The short, narrow passage with the candle is optional. Groups of 10 people or more must book.","acc":"Not suitable for wheelchairs and walkers: there are stairs, with handrails, and narrow passages.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"A large underground cistern carved into the tuff, dimly lit","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"One of the large cisterns carved into the tuff, about 40 metres below Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Guided tours depart every hour from 10:00 to 18:00, in Italian and English. On Thursdays also at 21:00, by reservation only and with at least 10 people."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"The Greco-Roman cisterns","x":"You go down 136 steps, low and comfortable, to about 40 meters below the streets. As early as the 3rd century BC the Greeks opened the first underground quarries here, to extract the tuff blocks with which they built the walls and temples of Neapolis.\n\nThe large rooms carved into the tuff later became the city's water cisterns, connected by the Greco-Roman aqueduct, and they remained so for about 23 centuries. Beneath the historic center lies a network, still not fully explored, of cisterns, quarries, tunnels and wells, with Greek, Spanish and Bourbon traces.\n\nAlong the route you will also see surprising things: the laboratory of the “Arianna” seismic station and the underground gardens, small crops growing at a depth of 35 meters, lit by special lamps and studied by researchers as well.","d":"In the first part of the visit, about 40 meters deep","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"The tuff walls of an underground cistern","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"The tuff walls of a cistern: for about 23 centuries, the city's water was collected here."}},{"t":"The candlelit passage","x":"The rooms along the route are all large and lit, except for one very short, narrow stretch: you walk it by candlelight, one at a time, keeping a little distance from the person ahead of you.\n\nAt the end of the tunnel you reach the Roman cistern, still full of water: it is the most evocative moment of the visit.\n\nThe passage is optional: anyone uncomfortable in tight spaces can wait for the group outside, where there are benches. The candle is not compulsory: your phone's flashlight works too.","d":"Along the underground route","foto":{"u":"../img/a874f33cc5df.jpg","alt":"A very narrow lit tunnel in the tuff","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"One of the very narrow tunnels carved into the tuff."}},{"t":"The war shelters","x":"During the Second World War the ancient cisterns were used as air-raid shelters: this is where the people of Naples came down to take cover from the bombings.\n\nAlong the route you will find the War Museum, with objects from those years.\n\nNaples suffered more than a hundred air raids, above all because of its port: thinking of how many people took refuge down here helps us understand what the city went through.","d":"Along the underground route","foto":{"u":"../img/0f4490838101.jpg","alt":"Objects from the Second World War displayed underground","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Memories of the war: objects from when these rooms were air-raid shelters."}},{"t":"The theatre under the bed","x":"The second part of the visit is above ground, between via Anticaglia, vico Cinquesanti and via San Paolo. This is where the Greco-Roman theatre of Neapolis stood, also known as Nero's theatre, because the emperor performed there.\n\nFrom the fifteenth century onwards, houses were built on top of and inside the walls of the theatre, which is how they have come down to us. You enter a «basso», a typical street-level home, move the bed aside and go down through a trapdoor into the rooms where, according to tradition, Nero prepared for his shows.\n\nRecently another part of the theatre has come to light in an old carpentry workshop: today it hosts an exhibition of old dark wooden display cases for nativity scenes, and under the floor, Bourbon-era drains made with blue-patterned tiles (riggiole) have reappeared.","d":"Second part of the visit, above ground between via Anticaglia and vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"The brick arches spanning via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"The arches of via Anticaglia: they are the remains of the Roman theatre of Neapolis, now built into the houses."}}],"gal":[],"leg":"According to the account given on the tour, in the hidden rooms beneath the basso (a ground-floor dwelling) Nero had his dressing rooms when he came to Naples to perform in the theatre.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Two Roman columns eleven metres high still support the façade: they are what remains of the Temple of the Dioscuri.","rac":"On Piazza San Gaetano, in the heart of the ancient centre, a flight of steps leads to a façade supported by two Corinthian columns about eleven metres high. They are what remains of the Temple of the Dioscuri, built between the 1st and 2nd century AD and considered the most important ancient building in Naples.\n\nA first church of San Paolo was built here between the 8th and 9th century; the Theatines then rebuilt it, from the second half of the 16th century. The earthquake of 1688 brought down much of the ancient temple; the architect Arcangelo Guglielmelli incorporated the surviving columns into the new façade. The bombings of 1943 damaged the interior, but most of the decorations were saved.\n\nSaint Cajetan of Thiene, founder of the Theatines, is buried here.","con":"Look at the columns up close, then go inside: the sacristy frescoed by Solimena is among the most beautiful parts. Opening hours change: check beforehand.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"The Corinthian columns of the Roman temple on the façade of San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"The Corinthian columns of the Temple of the Dioscuri on the façade of San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"The columns of the Temple of the Dioscuri","x":"The two Corinthian columns on the façade, about eleven metres high, are all that remains of the Temple of the Dioscuri. After the earthquake of 1688, the architect Arcangelo Guglielmelli incorporated them into the new façade. Above the steps, the statues of Saint Peter and Saint Paul were sculpted by Andrea Falcone in 1671.","d":"On the façade, at the top of the steps","foto":{"u":"../img/951355b4bf10.jpg","alt":"The façade of San Paolo Maggiore with its ancient columns","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"The façade of San Paolo Maggiore, with the columns of the Temple of the Dioscuri."}},{"t":"The tomb of Saint Cajetan","x":"Saint Cajetan of Thiene is buried in this basilica. He was the founder of the Theatines, the order that rebuilt the church from the late sixteenth century. The shrine dedicated to him is part of the church's layout.","d":"Inside the basilica","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"The shrine of Saint Cajetan of Thiene in the basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"The shrine of Saint Cajetan of Thiene in the basilica of San Paolo Maggiore."}},{"t":"Solimena's sacristy","x":"The basilica's sacristy is decorated by Francesco Solimena, one of the greatest Neapolitan painters of the eighteenth century. It is one of the loveliest parts of the church.","d":"Behind the nave, in the sacristy","foto":{"u":"../img/4782e44ae33e.jpg","alt":"The sacristy frescoed by Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"The sacristy of San Paolo Maggiore, with frescoes by Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"The masterpiece Caravaggio painted just after arriving in Naples: the Seven Works of Mercy, still on the altar for which it was made, a few steps from the Duomo.","rac":"The Pio Monte della Misericordia was founded in 1602 by seven young Neapolitan noblemen to help people in need. It still exists today, in the same seventeenth-century palazzo on Via dei Tribunali, and continues its charitable work.\n\nThe octagonal church was built between 1656 and 1671 to a design by Francesco Antonio Picchiatti. On the high altar hangs the canvas that has made it famous around the world: Caravaggio's Seven Works of Mercy, painted between 1606 and 1607 and paid for with 400 ducats, an enormous sum. Caravaggio had been in Naples for only a few months, having fled Rome after a conviction for murder.\n\nThe painting was so admired that in 1613 the congregation decreed that it could not be sold \"at any price\" and must remain in the church forever. Around it, on the other six altars, hang canvases by other masters of the Neapolitan Seicento, each dedicated to a work of mercy. Upstairs is the Pio Monte's picture gallery.","con":"Full-price ticket 10 euros, reduced 8 euros. The building also has the small choir gallery from which the governors of the Pio Monte could look down on the painting from above: ask whether it is included in the visit.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"The octagonal dome of the church of the Pio Monte della Misericordia seen from below","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"The dome of the octagonal church of the Pio Monte della Misericordia, looking up."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Closed on 25 December and at Easter; on 24 and 31 December and on 15 August it closes at 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"The Seven Works of Mercy","x":"It is an enormous canvas, almost four metres high, and it looks like a night in an alley of Naples: a crossroads full of people, lit by a light that comes from the side and carves the bodies out of the darkness. At the top, the Madonna and Child, carried by two angels, look down on what the men are doing.\n\nThe Pio Monte wanted a work that would bring together all seven works of mercy: feeding the hungry, giving drink to the thirsty, clothing the naked, sheltering pilgrims, visiting the sick, visiting prisoners, burying the dead. Caravaggio painted them all in a single scene, without miracles: it is man helping man.\n\nIt was Caravaggio's first work in Naples and it changed the painting of the city: the Neapolitan painters of the 17th century took up his light, his characters taken from the street and even some details, such as the man seen from behind in the foreground.","d":"On the high altar","foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggio's Seven Works of Mercy: street scenes on a dark night","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Caravaggio's Seven Works of Mercy (1607): the whole scene, with the people below and the Madonna and Child above."}},{"t":"How to recognise the seven works","x":"Look for the scenes one by one.\n\nOn the right, a young woman breastfeeds an old man behind bars: they are Pero and her father Cimon, condemned to die of hunger in prison. They stand for two works: feeding the hungry and visiting prisoners. Look at the drop of milk on the old man's beard.\n\nBehind them, a man carries a dead body (only the feet can be seen) and a priest with a torch lights his way: burying the dead. In the foreground, on the left, a young knight cuts his cloak for a naked man on the ground: he is Saint Martin, clothing the naked; beside him, in the darkest corner, a crippled man prays: visiting the sick.\n\nOn the far left an innkeeper points the way to a pilgrim with a shell on his hat, Saint James: sheltering pilgrims. In the background, a man drinks from the jawbone of a donkey: he is Samson, giving drink to the thirsty.","d":"In front of the canvas, from left to right","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"Caravaggio's canvas above the high altar of the Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"Caravaggio's canvas as you see it in the church: above the altar, in the chapel of the Pio Monte."}},{"t":"The Madonna and the angels","x":"Look up: the Madonna and Child lean out as if from a window, in front of two hanging sheets, and two angels embrace in flight. They seem far from what is happening below.\n\nBut notice the shadow they cast on the prison wall: Caravaggio makes them present, almost tangible, inside the same night as the men.\n\nThe art historian Roberto Longhi chose this very detail for the poster of the great 1951 exhibition that rediscovered Caravaggio: beautiful, he wrote, like a Raphael, but taken «from the naked truth of Forcella or Pizzofalcone».","d":"At the top of the canvas","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Detail: the Madonna and Child and the two angels in flight","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"The detail at the top: the Madonna and Child leaning out and the two angels embracing in flight."}},{"t":"The other altars","x":"Around the Caravaggio, the octagonal church has six other altars, with canvases by 17th-century Neapolitan painters: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino and Forlì.\n\nLook for the “Liberation of Saint Peter” by Battistello Caracciolo, from 1615: he is one of the painters who learned the most from Caravaggio, and you can see it in the light and the darkness. Then “Saint Peter Raising Tabitha” by Fabrizio Santafede, from 1611.\n\nLook at them after the Caravaggio: you will immediately understand how new his canvas was for Naples.","d":"In the surrounding chapels","foto":{"u":"../img/b58919c38c63.jpg","alt":"A 17th-century canvas of the Good Samaritan","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"The Good Samaritan by Giovan Vincenzo Forlì, on one of the altars around Caravaggio's Seven Works."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo and Treasure of San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"The cathedral of Naples and the Chapel of the Treasure, where the ampoule of San Gennaro's blood is kept.","rac":"The cathedral, dedicated to Santa Maria Assunta, was commissioned by Charles of Anjou in 1294 on the site where two ancient basilicas once stood: the Stefania, now demolished, and Santa Restituta, preserved as a chapel. You come upon it suddenly along Via Duomo, the street opened in the first decades after the Unification of Italy.\n\nIt is Gothic, with a Latin-cross plan and three naves, and a coffered ceiling of carved and gilded wood. Inside, the centuries pile up: the early Christian basilica of Santa Restituta, the oldest baptistery in the West, the Renaissance crypt of the Succorpo, the Baroque Chapel of the Treasure, and beneath it all the remains of the Greco-Roman city.\n\nIn the Duomo, in a niche of the Chapel of the Treasure, is kept the ampoule containing the blood that tradition attributes to San Gennaro. Three times a year (the Saturday before the first Sunday of May, 19 September and 16 December) the liquefaction is awaited. Since 1601 the relics have been entrusted to a lay institution, the Deputation of the Chapel of the Treasure of San Gennaro.","con":"On the days of the liquefaction the Duomo is packed from early morning: if you want to be there, arrive early.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"The façade of the Duomo of Naples","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"The façade of the Duomo, on Via Duomo. The Chapel of the Treasure is the third on the right."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Free admission, booking required. Tours start every hour."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"The Portal of San Gennaro","x":"Stop in front of the façade: it is about fifty metres high and has three portals. It was rebuilt in the Gothic style after the earthquake of 1349 had destroyed the Angevin façade and the bell tower.\n\nThe right-hand portal stays closed almost all year round: it opens only for the feasts of San Gennaro and on extraordinary occasions. If you find it open, you have come on a special day.\n\nThe cathedral, dedicated to Santa Maria Assunta, was commissioned by Charles of Anjou in 1294 on the site of two ancient basilicas. Inside, it has a Latin-cross plan with three naves and a coffered ceiling of carved, gilded wood.","d":"On the façade, on the right","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"The Gothic portal of the Naples Cathedral","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"The Gothic portal of the Cathedral, on the façade."}},{"t":"The Treasury Chapel","x":"More than a chapel, it is a church within the church: the third chapel on the right, Baroque, from the first half of the 17th century, built on a Greek-cross plan with a double-shell dome. You enter through the great bronze gate by Cosimo Fanzago.\n\nHere are kept the silver bust of San Gennaro and the phials containing his blood: every year the city awaits the \"miracle\" of the liquefaction, and the crowd fills the cathedral.\n\nThe treasure donated to the saint over the centuries (jewels, silverware, works of art) can be seen in the Museo del Tesoro di San Gennaro, with its entrance outside the Duomo.","d":"Third chapel on the right","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"The dome of the Treasury Chapel, frescoed with Paradise","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Look up: in the dome of the Treasury Chapel is the Paradise painted by Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"When Charles of Anjou had the Duomo built, one of the two ancient basilicas that stood here was demolished, while the other was preserved as a side chapel: this is Santa Restituta, in the left aisle.\n\nTradition holds that it was commissioned by the Emperor Constantine: it is one of the most important examples of early Christian art in Naples. It has three naves and houses works by Luca Giordano and 14th-century sculptures.\n\nFrom here you descend to the archaeological area beneath the cathedral, where you can see layers of history one on top of the other: Greco-Roman and early Christian remains.","d":"In the left aisle","foto":{"u":"../img/5abf53aec271.jpg","alt":"A mosaic of the Madonna enthroned in the basilica of Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"A mosaic of the Madonna enthroned, inside Santa Restituta: the oldest basilica, preserved as a chapel of the Duomo."}},{"t":"The Baptistery of San Giovanni in Fonte","x":"To the right of the apse, a small room with an immense history: the Baptistery of San Giovanni in Fonte, considered the oldest in the West.\n\nStay a few minutes in silence: you are in one of the oldest Christian places in Europe still standing, from the days when Roman Naples was becoming Christian.\n\nTogether, the baptistery and the archaeological area beneath the Duomo tell the story of the first centuries of the Christian city.","d":"To the right of the apse","foto":{"u":"../img/994ed22c6902.jpg","alt":"The interior of the Baptistery of San Giovanni in Fonte with the baptismal font in the centre","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"The Baptistery of San Giovanni in Fonte: in the centre of the floor, the baptismal font."}},{"t":"The Succorpo","x":"Beneath the high altar lies the crypt of the Cathedral, the Succorpo Chapel, also known as the Carafa Chapel: Cardinal Oliviero Carafa had it built to house the relics of San Gennaro together with those of 51 other saints.\n\nThe architect Giovan Tommaso Malvito conceived it as a small basilica: three aisles divided by ancient columns with Ionic capitals, niches along the sides and a chapel at the far end.\n\nWhite marble, soft light and silence: it is the Renaissance inside the Gothic cathedral.","d":"Beneath the high altar","foto":{"u":"../img/876cd614ab8d.jpg","alt":"The interior of the Succorpo di San Gennaro with marble columns and an inlaid floor","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"The Succorpo, beneath the presbytery of the Cathedral: marble columns and floor, and at the far end the altar with the relics of San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Girolamini Complex","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Opposite the cathedral, a Baroque church known as the «Domus Aurea», two cloisters, a picture gallery and the oldest public library in Naples.","rac":"On via Duomo, opposite the cathedral, the Girolamini complex was founded in the 16th century for the Fathers of the Oratory of Saint Philip Neri, known as the Girolamini. It has been a national monument since 1866 and brings together the church, the cloisters, the picture gallery and the library.\n\nThe church, dedicated to Saint Philip Neri, is known as the «Domus Aurea» for its golden Baroque decoration. The picture gallery is considered the city's first public art gallery and houses works by masters such as Battistello Caracciolo, Jusepe de Ribera and Luca Giordano. The library, open to the public since the second half of the 16th century, is the oldest public library in Naples.\n\nThe complex has gone through a long period of restoration: the church reopened on 21 March 2024 and, according to press reports, in 2026 the Sala Camino and the Sala Vico of the library also reopened. The reopenings are gradual: not all areas can be visited at the same time.","con":"Before you come, check the official website to see what is open: the church, cloisters, picture gallery and library have different opening hours, which may change.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"The façade of the Girolamini illuminated at night","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"The façade of the Girolamini church."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Church. Closed on Mondays."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Church. Saturdays, Sundays and public holidays."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"The «Domus Aurea» church","x":"The church of San Filippo Neri is called Domus Aurea, the «house of gold», for its rich Baroque decoration. It is one of the most important places of worship in the city.","d":"In the church, with entrance from Via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"The nave of the Girolamini church with its gilded decorations","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"The Girolamini church, the «Domus Aurea» for its rich decoration."}},{"t":"The picture gallery","x":"It is considered the first public art gallery in Naples. It houses paintings by 17th-century masters such as Battistello Caracciolo, Jusepe de Ribera and Luca Giordano. It is reached from the Cloister of the Oranges, on the first floor of the convent.","d":"First floor of the convent, from the Cloister of the Oranges","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Head of a female saint painted by Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"A canvas from the Quadreria dei Girolamini: head of a female saint by Massimo Stanzione (17th century)."}},{"t":"The oldest library in Naples","x":"The library is the oldest public library in the city and the second in Italy after the Malatestiana in Cesena. Specialising in theology, philosophy, Church history and sacred music, it holds about 159,700 ancient and modern volumes. Among the historic rooms is the one dedicated to Giambattista Vico, who studied here.","d":"Entrance at Via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"The hall of the Girolamini Library with its wooden shelves","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"The hall of the Girolamini Library, the oldest public library in Naples."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"Banksy's Madonna with a Pistol","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"A Banksy Madonna with a pistol in place of the halo, protected by glass, in the heart of the Decumano Maggiore.","rac":"Banksy came to Naples in 2010: it was the first time he had worked in Italy. Using stencils, probably in the same night, he left two works in very busy spots in the centre, both with a religious image and a direct message. One, on Via Benedetto Croce, was covered over by another artist; this one survived, which is why it is described as Banksy's only mural in Italy.\n\nNext to the work there is an ancient votive shrine with the Madonna and Child: the two images, side by side, seem to talk to each other.\n\nIn Piazzetta dei Girolamini, on a façade on the Decumano Maggiore, Banksy left a Madonna with a pistol in place of the halo. Today it is protected by a pane of glass. The city's official tourist portal includes it in its itinerary dedicated to the street art of the historic centre.","con":"Look up: the artwork is above street level, behind glass.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"The face of Banksy's Madonna in white stencil on a dark background","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"The face of Banksy's Madonna: the white stencil on a dark background, up close."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"The Madonna with the Pistol","x":"Look at the wall: white on a black background, made with a stencil, a Madonna with her arms open towards the sky. But instead of a halo, above her head, there is a pistol.\n\nBanksy, the English street artist from Bristol, painted it in Naples in 2010, probably at night and in a few seconds, with his stencils. It was Banksy's first work in Italy.\n\nThe message is not explained: at a distracted glance it looks like a sacred image, but it is not. Sacred and violence, faith and weapons: everyone reads it in their own way.","d":"On the wall of the little square","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"Banksy's stencil Madonna on the wall of Piazza Gerolomini, seen up close","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"Banksy's Madonna, in black-and-white stencil on a corner of the wall in Piazza Gerolomini."}},{"t":"The shrine next door","x":"Now look next to the artwork: there is a small votive shrine with the Madonna and Child, like the ones found on so many streets of Naples, painted who knows how many centuries earlier.\n\nThe two Madonnas, side by side, seem to be looking at each other: the ancient one seems to gaze in bewilderment at Banksy's. It is this dialogue that makes the work so Neapolitan.\n\nTake a step back and look at them together: it is the most beautiful photo to take home.","d":"Right next to the artwork","foto":{"u":"../img/3a7788eec560.jpg","alt":"Banksy's Madonna on the wall and, beside it, the votive shrine with the Madonna and Child","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"On the left Banksy's Madonna, on the right, hanging on the wall, the shrine with the Madonna and Child: the two sacred images side by side."}},{"t":"A Banksy under glass","x":"In 2010 Banksy left two works in Naples, probably on the same night. The other, on Via Benedetto Croce, poked fun at consumerism: it recreated Bernini's “Ecstasy of Blessed Ludovica Albertoni”, but the saint appeared in ecstasy after a fast-food meal.\n\nThat work was covered over by another Neapolitan street artist, who did not know what he was erasing. That is why the FAI names this one in Piazza Gerolomini as the only Banksy mural in Italy.\n\nToday it is protected by a plexiglass case, which at least shields it from vandals.","d":"In front of the artwork","foto":{"u":"../img/98a6548f2f8d.jpg","alt":"Banksy's Madonna, painted with a stencil on the wall of an alley","aut":"ho visto nina volare","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"Banksy's Madonna on the alley wall, in a photo from 2012 (before the protective case)."}},{"t":"How to get there and what to photograph","x":"The artwork is on a wall of the little Piazza Gerolomini, facing Via dei Tribunali.\n\nThe display case protects the work but can reflect the light: for a photo without glare, try standing slightly to one side. The spot is always accessible and free of charge.\n\nFrom here, the Madonna of Via Benedetto Croce, the lost artwork, is a nine-minute walk away, along the route that passes by Sansevero, Napoli Sotterranea and San Gregorio Armeno.","d":"Piazza Gerolomini, on Via dei Tribunali","foto":{"u":"../img/f2e6151db7a7.jpg","alt":"Piazza Girolamini in black and white, with the church façade","aut":"Rodrigo Silva","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Girolamini_-_Naples_-_Italy_(15036436065).jpg","dida":"Piazza Girolamini, with the façade of the church of the Girolamini."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini and the Greek walls","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"A square of cafés and students with a window onto the past: behind a balustrade you can see the Greek walls of Neapolis.","rac":"Piazza Bellini lies on the main decumanus and is one of the busiest squares in the historic centre, thanks to the many venues that look onto it. Just look down, beyond the balustrade, to see in a lowered area a stretch of the walls of Greek Neapolis, dating back to the 4th century BC. They were discovered in 1954.\n\nA few steps away is the Conservatorio di San Pietro a Majella.","con":"Ten minutes are enough: look at the walls from above, then treat yourself to a break at one of the venues on the square.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"Piazza Bellini with its tables and greenery","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, the meeting place of the historic centre."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"The Greek Walls","x":"Below the level of the square you can see the remains of the defensive walls of Greek Neapolis, made of tuff blocks. They were discovered in 1954 and are part of the fortification system of the ancient city. They are not a reconstruction: they are original stones.","d":"Beyond the balustrade, in the sunken area","foto":{"u":"../img/4801d5111d9f.jpg","alt":"The tuff blocks of the Greek walls below the level of the square","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"The Greek walls of Neapolis in Piazza Bellini: original tuff blocks."}},{"t":"The square today","x":"Around the walls there are cafés, bookshops and places frequented by students and locals. It is one of the spots in the historic centre where the ancient and everyday life sit closest together.","d":"Around the square","foto":{"u":"../img/133ed975e61b.jpg","alt":"Piazza Bellini with trees, buildings and café tables","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"Piazza Bellini today, among cafés and bookshops."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port’Alba and the booksellers' street","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"A gate from 1625 and, beyond the arch, a lane of booksellers and music shops leading to Piazza Bellini.","rac":"Port'Alba is one of the city's ancient gates. It opens in a corner of Piazza Dante and takes its name from the Spanish viceroy Antonio Álvarez de Toledo, Duke of Alba, who had it built in 1625 in place of a temporary opening, to make it easier to pass from one side of the city to the other. Its present appearance is due to the works of the late 18th century commissioned by Ferdinand IV of Bourbon.\n\nBeyond the gate lies via Port'Alba, a pedestrian lane known for its bookshops and music shops, which leads to Piazza Bellini.","con":"Walk under the arch and browse the book stalls: it's the easiest way to get from Piazza Dante to Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"The arch of Port'Alba, historic entrance to the old centre","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, the 16th-century gate to the old centre."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"The gate of 1625","x":"The gate was built in 1625 at the behest of the Duke of Alba, the Spanish viceroy. On the coat of arms you can make out those of King Philip III, the city of Naples and the viceroy. Today the gate is partly hidden by the colonnade of Piazza Dante.","d":"In a corner of Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"The Port'Alba gate with the coat of arms","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, the gate of 1625 commissioned by the Duke of Alba."}},{"t":"The booksellers' street","x":"The lane that runs through the gate is famous for its book market: bookshops, stalls and musical instrument shops, as far as Piazza Bellini.","d":"Beyond the gate, towards Piazza Bellini","foto":{"u":"../img/60d6526dd441.jpg","alt":"The gate of Port'Alba with the shops and stalls at its foot","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Port%27Alba,_Naples_01.jpg","dida":"Port'Alba, the gate where Via dei Librai (the booksellers' street) begins."}}],"gal":[],"leg":"A legend tells of a young woman named Maria, accused of witchcraft in the days of the Spanish Inquisition and left to die in a cage hanging from the gate.","fc":null,"col":null},{"id":22,"s":"mann","n":"National Archaeological Museum (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"One of the largest archaeological museums in the world: the treasures of Pompeii and Herculaneum, the Farnese collection and the famous Alexander Mosaic.","rac":"The National Archaeological Museum is housed in the Palazzo degli Studi, built in 1585. In 1777 King Ferdinand IV of Bourbon moved the Farnese collection there, which he had inherited from his mother Elisabeth Farnese. With the return of the Bourbons in 1816 it became the Royal Bourbon Museum; after the Unification of Italy it became the National Museum. The paintings were transferred to Capodimonte in 1957, and since then it has been a museum of antiquities only.\n\nIt displays about 18,000 artefacts: the Vesuvian collections (frescoes, mosaics, everyday objects, the model of Pompeii, the Villa of the Papyri), the Farnese sculptures and gems, the Secret Cabinet, the numismatic collection and one of the most important Egyptian collections in the world.\n\nThe most famous piece is the Alexander Mosaic, found in 1831 in the House of the Faun in Pompeii: it depicts the Battle of Issus, between Alexander the Great and Darius III, and is made up of about a million and a half tesserae.","con":"If you are short on time, pick three things: the Alexander Mosaic, the Farnese Hercules and the Secret Cabinet. To see everything you need at least two or three hours. Check the opening hours before you come.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Pompeian fresco on display at the National Archaeological Museum","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"A Pompeian fresco on display at the MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Ticket office open until 6:30 pm"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"The Alexander Mosaic","x":"Found in 1831 in the House of the Faun in Pompeii, the great mosaic measures about 5.82 by 3.13 meters and has about a million and a half tesserae. It shows the Battle of Issus (333 BC) between Alexander the Great and Darius III of Persia.","d":"On the mezzanine floor, in the Pompeii mosaics section","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"The great mosaic of the battle between Alexander and Darius","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"The Alexander Mosaic, from the House of the Faun in Pompeii."}},{"t":"The Farnese Collection","x":"Gathered by the Farnese family for their palace in Rome, the collection includes monumental statues such as the Farnese Hercules, about three metres tall and found at the Baths of Caracalla, and the Farnese Bull.","d":"On the ground floor","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"The statue of the Farnese Hercules leaning on his club","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"The Farnese Hercules, found at the Baths of Caracalla."}},{"t":"The Secret Cabinet","x":"It houses erotic art found at Pompeii and Herculaneum. It has a separate entrance and often requires a timed reservation: ask at the ticket office.","d":"On the mezzanine floor","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, Museum of Contemporary Art","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"A palace renovated by the architect Álvaro Siza, housing works by Clemente, Kapoor, Serra, Horn and other masters of contemporary art.","rac":"The MADRE, the Donnaregina museum of contemporary art, is housed in Palazzo Donnaregina, a few steps from the Duomo and the Treasure of San Gennaro. The building was renovated by the Portuguese architect Álvaro Siza, and the museum, run by the Donnaregina Foundation for Contemporary Arts, opened in 2005.\n\nThe first floor is devoted to works created specifically for the rooms by artists such as Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long and Mimmo Paladino. The collection also includes Richard Serra, Sol LeWitt and Jeff Koons, and the museum organises temporary exhibitions. It is a deliberate contrast with the ancient Naples that surrounds it.","con":"Look for «Spirits» by Rebecca Horn: they are cast-iron copies of the skulls of the Fontanelle Cemetery. The museum is closed on Tuesdays and, because of works, some rooms on the second floor are temporarily closed: check the website before you come.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"The white courtyard of the Madre museum","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"The Madre museum, contemporary art in Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Closed on Tuesdays. Last entry is one hour before closing."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Sunday. Last entry is one hour before closing."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"“Ave Ovo” by Francesco Clemente","x":"A majolica floor and a monumental fresco, created in 2005 for the museum, fill two rooms on two floors.","d":"In the rooms dedicated to Clemente","foto":null},{"t":"“Spirits” by Rebecca Horn","x":"The artist reproduced in cast iron the skulls of the Fontanelle Cemetery, the Neapolitan “capuzzelle”. A link between contemporary art and the Naples of the people.","d":"In Rebecca Horn's room","foto":null},{"t":"Siza's architecture","x":"Siza renovated the three floors of the building, keeping the historic layout and adding modern spaces for large installations.","d":"Throughout the museum","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Toledo metro station","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A Line 1 stop considered one of the most beautiful in Europe: mosaics, blue ceramics and Robert Wilson's “Crater of Light”.","rac":"Toledo station is part of the “Art Stations”, the project that entrusted architects and artists with designing the stops of Line 1, with over 250 artworks. It was designed by the Catalan architect Oscar Tusquets Blanca and opened on 17 September 2012. The entrance, on Via Diaz, has three hexagonal structures clad in blue and ochre tiles, which bring light into the atrium.\n\nAs you go down, you come across relief waves designed by Tusquets, works by Robert Wilson (including “Crater de luz”, a crater of light) and mosaics by William Kentridge. The station has been named several times among the most beautiful in Europe.\n\nTo see it, all you need to do is take the metro: you need a ticket to go down to the platforms.","con":"Go down to the deepest level and look up: that is where the light of the Crater looks its best. You need a ticket to enter; check the service times on the ANM website.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"The platform of Toledo station, underground","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"The platform of Toledo station."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Line 1 service hours: from the first to the last train."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Line 1 service hours: from the first to the last train."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Robert Wilson's “Crater de luz”","x":"A crater of light, a work by Robert Wilson, defines the station's identity. The work changes with the light and gives the descent an almost theatrical effect.","d":"On the underground levels of the station","foto":null},{"t":"The mosaics of William Kentridge","x":"Along the way you can see mosaics by the South African artist William Kentridge, part of the Art Stations programme.","d":"On the way to the platforms","foto":null},{"t":"The blue entrance on Via Diaz","x":"Three hexagonal structures clad in blue and ochre tiles, which let light into the atrium. The two colours are the common thread running through the whole station.","d":"At the Via Diaz entrance","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, the Last Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"Six minutes from Ceraldi, on Via Toledo, the last painting Caravaggio painted, a few weeks before he died: the Martyrdom of Saint Ursula.","rac":"The Gallerie d'Italia of Intesa Sanpaolo are at Via Toledo 177, in the building that was the seat of the Banco di Napoli, designed by Marcello Piacentini in the late 1930s; the new layout is by the architect Michele De Lucchi. The museum opened here in 2022 and took the place of the nearby Palazzo Zevallos Stigliano.\n\nThe masterpiece of the collection is the Martyrdom of Saint Ursula by Caravaggio, from 1610, considered the painter's last work. Around it there are three itineraries: Neapolitan art from the seventeenth to the twentieth century, a collection of Attic and Magna Graecia ceramics, and a selection of twentieth-century works.","con":"Full-price ticket 8 euros, reduced 4 euros; free for under-26s and for everyone on the first Sunday of the month. Closed on Mondays; last entry one hour before closing.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"A room in the Gallerie d'Italia with paintings on yellow walls","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"A room in the Gallerie d'Italia in Naples, with seventeenth-century canvases."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"The Martyrdom of Saint Ursula","x":"It is a narrow, dark scene, almost without a background: we are in the tent of Attila, king of the Huns. Ursula, a princess, has refused him, and he has just shot an arrow into her chest. She bows her head toward the arrow; three men rush to support her. The king already seems to regret his act.\n\nLook for the face behind the saint: it is Caravaggio himself, who painted himself among the witnesses. And notice the hand reaching out between the saint and the king, as if to stop the arrow: it reappeared during the restoration of 2003-2004.\n\nIt was commissioned by the Genoese prince Marcantonio Doria, whose family had Saint Ursula as their protector. It is the latest painting by Caravaggio that we know of: it was finished in May 1610, little more than a month before his death.","d":"In the room dedicated to Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"Caravaggio’s Martyrdom of Saint Ursula: the saint and the king at the moment of the arrow","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"The Martyrdom of Saint Ursula (1610): the king strikes the saint with an arrow, at point-blank range."}},{"t":"The painting put out in the sun","x":"Caravaggio painted the picture in a hurry, perhaps because he was about to leave for Rome to obtain the Pope's pardon. The Dorias' representative in Naples, Lanfranco Massa, had the canvas delivered while the varnish was still wet and, to make it dry sooner, put it out in the sun: the varnish, applied very thickly, was ruined. Massa himself recounted this in a letter of May 1610.\n\nThe painting reached Genoa, then passed from heir to heir, ended up in a villa in Eboli and was attributed to other painters. Only in the 1980s did the discovery of Massa's letter confirm with certainty that it is by Caravaggio.\n\nIn 2025 a new restoration brought back to light three heads that time had made disappear.","d":"In front of the canvas","foto":{"u":"../img/6a999eeecae6.jpg","alt":"Caravaggio’s canvas displayed in a room of Palazzo Zevallos, with its decorated ceiling","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"The Martyrdom of Saint Ursula displayed in a room of Palazzo Zevallos Stigliano, home of the Gallerie d’Italia."}},{"t":"The Banco di Napoli building","x":"Before going up to the galleries, look around: you are in the building that was the headquarters of the Banco di Napoli, designed by Marcello Piacentini in the late 1930s.\n\nThe architect Michele De Lucchi transformed it into a museum with a modern layout: the bank's great halls now host three itineraries, from seventeenth-century Neapolitan art to the twentieth century, including a rich collection of Greek and Magna Graecia vases.\n\nThe museum opened in 2022 and continues the activity of Palazzo Zevallos Stigliano, which was open from 1999 to 2022 just a few steps from here.","d":"On entering, in the main hall","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"The stone façade of the Palazzo del Banco di Napoli on Via Toledo, with the European flag","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"The Palazzo del Banco di Napoli on Via Toledo, home of the Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Spanish Quarters","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"A network of narrow alleys born in the 16th century for Spanish soldiers, today one of the liveliest and most photographed neighbourhoods in Naples.","rac":"The Spanish Quarters were born in 1536 at the will of the Spanish viceroy Pedro de Toledo, to house the garrisons meant to keep order. The main street, Via Toledo, bears his name. The district is a grid of narrow alleys between Via Toledo, Corso Vittorio Emanuele and Monte Echia, and includes the areas of Avvocata, Montecalvario and San Ferdinando.\n\nThe Spanish origin still lives on in the street names, such as Via della Trinità degli Spagnoli, where the church of Santa Maria del Pilar stands. In the alleys you will find workshops, hanging laundry, street shrines and many murals.\n\nThe most famous is the Maradona mural in Largo Maradona, on Via Emanuele De Deo: it was created in 1990 by Mario Filardi and has been restored several times over the years. It is a stop on the “The Sea and the Castles” tour, which has its own page.","con":"Start from Piazza Carità and venture into the alleys by day. As in any crowded area, keep your bag and phone close. Walk slowly: the details are in the doorways and the murals.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"An alley in the Spanish Quarters with the Maradona mural and flags","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"In the Spanish Quarters, the Maradona mural among the flags."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"The grid of alleys","x":"The urban plan is a regular grid of narrow alleys, created to house the Spanish soldiers. As you walk, you see laundry hanging out to dry, little street shrines and workshops: neighborhood life takes place in the street.","d":"In the alleys west of Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"A narrow alley in the Spanish Quarters","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"One of the straight, narrow alleys of the Spanish Quarters grid."}},{"t":"The Maradona mural and Largo Maradona","x":"On Via Emanuele De Deo, an old parking lot has become Largo Maradona. The 1990 mural by Mario Filardi was later restored by the Argentine artist Bosoletti, who created the Veiled Isis next to it.","d":"On Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Maradona's face painted on the façade of a building","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"The Maradona mural on Via Emanuele De Deo, with the face repainted in 2017 by Francisco Bosoletti."}},{"t":"The Church of Santa Maria del Pilar","x":"On Via della Trinità degli Spagnoli stands the church the Spanish dedicated to Santa Maria del Pilar: a trace of the quarter's Spanish origins.","d":"On Via della Trinità degli Spagnoli","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"The Maradona Mural","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"The much-loved mural of the Spanish Quarter and the square that since 2020 has become a secular shrine to Diego.","rac":"The mural portrays Maradona in the number 10 shirt of the Napoli of the 1980s, with the scudetto on his chest and the captain's armband on his arm. It was painted to celebrate the second scudetto, that of 1989-90, to which Maradona contributed 16 goals in 28 matches. He had arrived from Barcelona in 1984 and stayed in Naples until 1991.\n\nThe artist, Mario Filardi, was only 23 years old: he painted out of passion and worked as a waiter, travelling the world.\n\nThe Maradona mural was painted in 1990 by Mario Filardi. In the 1990s a window opened in the wall erased its face, and the painting faded almost completely; it was restored thanks to Salvatore Iodice and, in the autumn of 2017, the Argentine artist Francisco Bosoletti repainted the face. After Maradona's death, on 25 November 2020, the square, previously called the artists' square, took his name and filled up with little shrines, flags and photographs.","con":"At peak times it is very crowded: early in the morning it is easier to see it in peace.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"The large Maradona mural on the façade of a building, with the crowd below","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"The mural painted in 1990 by Mario Filardi. The face you see today is the one repainted in 2017 by the Argentine artist Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"The mural and its creator","x":"The 1990 mural is the work of Mario Filardi, who painted out of passion. It was restored several times: in 2017 the Argentine artist Francisco Bosoletti repainted the face.","d":"On the façade in via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Maradona's face painted on the façade of a building","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"The Maradona mural in via Emanuele De Deo, with the face repainted in 2017 by Francisco Bosoletti."}},{"t":"Largo Maradona since 25 November 2020","x":"After Maradona's death the square, previously called “of the artists”, took his name and became a place of little shrines, flags and photographs.","d":"In the open space in front of the mural","foto":{"u":"../img/76bca69c23a8.jpg","alt":"The square in front of the Maradona mural, full of people","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: flags, little shrines and visitors in front of the mural."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"The Largo Maradona plaque with a bust and flags","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"The plaque of the square: after Diego's death in 2020, the artists' square took his name."},{"u":"../img/550f6edc4b91.jpg","alt":"A small shrine with photos of Maradona and mementos","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"A small shrine dedicated to Maradona: there are many in the city, with photos and mementos left by fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona painted with a halo next to a small shrine","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona with a halo and his votive shrine, painted in the San Lorenzo area."},{"u":"../img/80d74e92279d.jpg","alt":"A votive shrine with a portrait of Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"A votive shrine for Maradona, like those dedicated to the saints."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galleria Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"A cross-shaped gallery with an iron and glass dome about 56 metres high, opposite the Teatro di San Carlo.","rac":"The Galleria Umberto I was built between 1887 and 1890 during the Risanamento of Naples, the great urban reconstruction plan that followed the cholera epidemic. The architect Emanuele Rocco designed it in the shape of a cross, taking inspiration from the Galleria Vittorio Emanuele II in Milan. It is named after Umberto I, King of Italy at the time of its construction.\n\nThe four arms meet beneath a dome of iron and glass, supported by sixteen ribs. Beneath the dome, the floor is a star-shaped mosaic. The gallery is home to shops, cafés and, on the upper floors, apartments: it was designed to combine commerce and social life.\n\nIt stands opposite the Teatro di San Carlo, close to Piazza del Plebiscito.","con":"Stop under the dome and look up: it is the best spot to see the iron and glass. It is a place of passage, with free entry.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"A decorated entrance of the Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"An entrance of the Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"The iron and glass dome","x":"The four arms of the gallery meet beneath a dome of iron and glass, supported by sixteen ribs. By day the light enters from every side; in the evening the lighting brings out the structure.","d":"In the centre of the gallery","foto":{"u":"../img/5caa008a8527.jpg","alt":"The iron and glass dome of the Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"The iron and glass dome, where the four arms of the gallery meet."}},{"t":"The star mosaic","x":"Beneath the dome the floor is a mosaic in the shape of a twelve-pointed star, in cream, terracotta and grey. You can spot it by looking down, at the point where the arms meet.","d":"On the floor, beneath the dome","foto":{"u":"../img/1c072c5bce38.jpg","alt":"A panel of the mosaic floor with a lion, a sheaf of wheat and a barrel","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:NaplesGalleryUmbertoILeone.jpg","dida":"One of the mosaic panels of the floor of the Galleria Umberto I (the sign of Leo)."}},{"t":"The Urban Renewal of Naples","x":"The gallery was born as a symbol of a city that wanted to modernize after the cholera epidemic. It was part of the “risanamento” (urban renewal), the great project of demolition and reconstruction of the city, and was meant to compete with the Galleria Vittorio Emanuele II in Milan.","d":"Entering from Via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Statues and the inscription ANNO MDCCCXC on the gallery","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"“Anno MDCCCXC”: the date of completion, inscribed on the gallery that symbolizes the urban renewal."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Teatro di San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"The oldest opera house still in operation in Europe: inaugurated in 1737, before La Scala and La Fenice.","rac":"The Teatro di San Carlo was built at the wish of Charles III of Bourbon and inaugurated on 4 November 1737, the king's name day. The king wanted a theatre for Naples that was larger than the old San Bartolomeo. It opened 41 years before La Scala in Milan and 55 before La Fenice in Venice, which is why it is considered the oldest opera house still in operation. The project was entrusted to Giovanni Antonio Medrano and Angelo Carasale.\n\nComposers such as Rossini, Donizetti, Bellini and Verdi have all graced its stage. The theatre is part of the UNESCO World Heritage Site together with the historic centre.\n\nIt can be visited on guided tours in Italian and English, lasting about half an hour; in the same complex you will also find the MeMus, the museum that tells the story of the theatre and of opera.","con":"Visits depend on rehearsals and performances: check the official website and, if you can, book. If you love opera, the best way to get to know the theatre is to attend a performance.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"The façade of the Teatro San Carlo with its columns","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"The façade of the Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Guided tours of about 30 minutes at 10:30, 11:30, 12:30, 14:30, 15:30 and 16:30. Reservation recommended."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"The Auditorium and the Real Teatro","x":"The horseshoe-shaped auditorium is the heart of the theatre: boxes in superimposed tiers and a royal box. The San Carlo is also famous for its acoustics. On guided tours you can generally photograph the auditorium and the foyer.","d":"In the auditorium, on the guided tour","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"An eighteenth-century engraving of a ball in the theatre","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"A ball in the Real Teatro di San Carlo, in an engraving from 1749."}},{"t":"The MeMus","x":"The MeMus, opened in 2011, is the theatre's museum and historical archive. It traces the history of the building and of Italian opera through paintings, photographs, musical instruments and costumes.","d":"In the same complex as the theatre","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Stage costumes on display at the MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Stage costumes from an opera by Paisiello on display at the MeMus."}},{"t":"The oldest opera house in Europe still in operation","x":"Inaugurated in 1737, it is older than La Scala in Milan (1778) and La Fenice in Venice (1792). For this reason it is considered the oldest opera house still in operation.","d":"In fron
