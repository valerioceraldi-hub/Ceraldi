ea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Forty meters below Via dei Tribunali: the cisterns that for centuries provided water to Naples, war shelters, and a Roman theater hidden under a bed.","rac":"Beneath the historic center lies another city. From Piazza San Gaetano, you descend over one hundred steps to a depth of about 40 meters, along a path that passes through a Greco-Roman aqueduct and tunnels from the medieval, Bourbon, and modern eras.\n\nThe Greek-era caves were used as cisterns for the city's water supply for approximately 23 centuries. During the Second World War, the same spaces became air raid shelters.\n\nThe underground tour is guided and lasts about an hour. Then you return to the surface for the final surprise: the remains of the Greco-Roman theater of Neapolis, incorporated into the neighborhood's houses since the 15th century. You enter a \"basso,\" a ground-floor house, move a bed, and descend through a trapdoor into the theater's walls.","con":"Low shoes and a sweatshirt are recommended, even in summer: it's humid underground. The short, narrow passage with the candle is optional. Reservations are required for groups of 10 or more.","acc":"Not suitable for wheelchairs or walkers: there are stairs, with handrails, and narrow passages.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"A large underground cistern dug into the tuff, dimly lit","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"One of the large cisterns dug into the tuff, about 40 meters below Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Guided tours depart every hour from 10:00 am to 6:00 pm, in Italian and English. Also available on Thursdays at 9:00 pm, by reservation only and for groups of at least 10 people."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"The Greco-Roman cisterns","x":"You descend 136 low, comfortable steps to about 40 meters below the streets. As early as the 3rd century BC, the Greeks opened the first underground quarries here to extract the tuff blocks with which they built the walls and temples of Neapolis.\n\nThe large chambers carved into the tuff later became the city's water cisterns, connected by the Greco-Roman aqueduct, and remained so for approximately 23 centuries. Beneath the historic center lies a still-unexplored network of cisterns, quarries, tunnels, and wells, with Greek, Spanish, and Bourbon traces.\n\nAlong the way, you'll also see surprising things: the Arianna seismic station laboratory and the underground gardens, small cultivations 35 meters underground, illuminated by special lamps, also studied by researchers.","d":"In the first part of the visit, at about 40 meters depth","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"The tuff walls of an underground cistern","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"The tuff walls of a cistern: for approximately 23 centuries, the city's water was collected here."}},{"t":"The passage with the candle","x":"The rooms along the route are all large and brightly lit, except for a very short, narrow section: you walk by candlelight, one at a time, keeping a small distance from the person in front of you.\n\nAt the end of the tunnel you reach the Roman cistern still full of water: this is the most evocative moment of the visit.\n\nPassing is optional: those who struggle with tight spaces can wait for the group outside, where there are benches. A candle is not required; a phone flashlight will do.","d":"Along the underground path","foto":{"u":"../img/a874f33cc5df.jpg","alt":"A very narrow tunnel illuminated in the tuff","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"One of the very narrow tunnels dug into the tuff."}},{"t":"The shelters of war","x":"During the Second World War, the ancient cisterns were used as air-raid shelters: the people of Naples would come down here to take shelter from the bombings.\n\nAlong the route there is the War Museum, with objects from those years.\n\nNaples suffered more than a hundred aerial bombardments, especially on its port: thinking about how many people took refuge here helps us understand what the city went through.","d":"Along the underground path","foto":{"u":"../img/0f4490838101.jpg","alt":"World War II artifacts displayed underground","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Memories of the war: objects from when these rooms were air-raid shelters."}},{"t":"The theater under the bed","x":"The second part of the tour is above ground, between Via Anticaglia, Vico Cinquesanti, and Via San Paolo. This is where the Greco-Roman theater of Neapolis stood, also known as Nero's theater because the emperor performed there.\n\nSince the 15th century, houses have been built above and within the theater's walls, which have thus survived to this day. You enter a \"basso,\" a typical ground-floor house, move the bed, and through a trapdoor, descend into the rooms where, according to tradition, Nero prepared for his performances.\n\nAnother piece of the theater recently resurfaced in an old carpentry shop: today it houses an exhibition of old dark wooden display cases for nativity scenes, and under the floor, drains from the Bourbon era made with blue-patterned tiles have reappeared.","d":"Second part of the visit, on the surface between Via Anticaglia and Vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"The brick arches that span Via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"The arches of Via Anticaglia: they are remains of the Roman theatre of Neapolis, incorporated into the houses."}}],"gal":[],"leg":"According to the story of the visit, Nero had his dressing rooms in the hidden rooms under the lower floor when he came to Naples to perform in the theatre.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Two eleven-meter-high Roman columns still support the facade: they are all that remains of the Temple of the Dioscuri.","rac":"In Piazza San Gaetano, in the heart of the old town, a staircase leads to a façade supported by two Corinthian columns approximately eleven meters high. These are the remains of the Temple of the Dioscuri, built between the 1st and 2nd centuries AD and considered the most important ancient building in Naples.\n\nAn initial church of San Paolo was built here between the 8th and 9th centuries; the Theatines then rebuilt it in the late 16th century. The 1688 earthquake destroyed much of the ancient temple; architect Arcangelo Guglielmelli incorporated the remaining columns into the new façade. Bombings in 1943 damaged the interior, but much of the decorations survived.\n\nSaint Cajetan of Thiene, founder of the Theatines, is buried here.","con":"Look at the columns up close, then go inside: the sacristy, frescoed by Solimena, is among the most beautiful parts. Opening hours vary: check first.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"The Corinthian columns of the Roman temple on the facade of San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"The Corinthian columns of the Temple of the Dioscuri on the facade of San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"The columns of the Temple of the Dioscuri","x":"The two Corinthian columns on the façade, approximately eleven meters high, are all that remains of the Temple of the Dioscuri. After the 1688 earthquake, architect Arcangelo Guglielmelli incorporated them into the new façade. Above the steps, the statues of Saints Peter and Paul were sculpted by Andrea Falcone in 1671.","d":"On the facade, at the top of the stairs","foto":{"u":"../img/951355b4bf10.jpg","alt":"The facade of San Paolo Maggiore with its ancient columns","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"The facade of San Paolo Maggiore, with the columns of the Temple of the Dioscuri."}},{"t":"The tomb of Saint Cajetan","x":"Saint Cajetan of Thiene, founder of the Theatines, the order that rebuilt the church in the late 16th century, is buried in this basilica. The sanctuary dedicated to him is part of the church's layout.","d":"Inside the basilica","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"The sanctuary of San Gaetano Thiene in the basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"The sanctuary of San Gaetano Thiene in the basilica of San Paolo Maggiore."}},{"t":"The sacristy of Solimena","x":"The basilica's sacristy is decorated by Francesco Solimena, one of the greatest Neapolitan painters of the eighteenth century. It is one of the most beautiful parts of the church.","d":"Behind the nave, in the sacristy","foto":{"u":"../img/4782e44ae33e.jpg","alt":"The sacristy frescoed by Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"The sacristy of San Paolo Maggiore, with frescoes by Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"The masterpiece that Caravaggio painted as soon as he arrived in Naples: the Seven Works of Mercy, still on the altar for which they were made, a few steps from the Duomo.","rac":"The Pio Monte della Misericordia was founded in 1602 by seven young Neapolitan nobles to help those in need. It still exists today, in the same 17th-century building on Via dei Tribunali, and continues its charitable work.\n\nThe octagonal church was built between 1656 and 1671 based on a design by Francesco Antonio Picchiatti. The high altar features the canvas that made it world-famous: Caravaggio's Seven Works of Mercy, painted between 1606 and 1607 and costing 400 ducats, a staggering sum. Caravaggio had been in Naples for a few months, fleeing Rome after a murder conviction.\n\nThe painting was so well received that in 1613 the congregation decreed that it could not be sold \"at any price\" and that it should remain in the church forever. Around it, on the other six altars, are paintings by other 17th-century Neapolitan masters, each dedicated to a work of mercy. Upstairs is the Pio Monte art gallery.","con":"Full ticket price is €10, reduced price €8. The palace also houses the choir stalls, where the governors of Pio Monte could view the canvas from above: ask if this is included in the tour.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"The octagonal dome of the church of Pio Monte della Misericordia seen from below","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"The dome of the octagonal church of Pio Monte della Misericordia, looking up."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Closed on December 25th and Easter; on December 24th and 31st and on August 15th it closes at 2.30pm."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"The Seven Works of Mercy","x":"It's a huge canvas, almost four meters high, and it resembles a nighttime alley in Naples: a crowded intersection, illuminated by a light that comes from the side and sculpts the bodies in the darkness. Above, the Madonna and Child, carried by two angels, gaze down on the people.\n\nThe Pio Monte wanted a work that combined all seven works of mercy: feeding the hungry, giving drink to the thirsty, clothing the naked, sheltering pilgrims, visiting the sick, visiting the imprisoned, and burying the dead. Caravaggio painted them all in a single scene, without miracles: it is man who helps man.\n\nIt was Caravaggio's first work in Naples and changed the painting of the city: the Neapolitan painters of the seventeenth century took up his light, his characters taken from the street and even some details, such as the man seen from behind in the foreground.","d":"On the main altar","foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggio's Seven Works of Mercy: Street Scenes on a Dark Night","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Caravaggio's Seven Works of Mercy (1607): the whole scene, with the people at the bottom and the Madonna and Child at the top."}},{"t":"How to recognize the seven works","x":"Search for the scenes one by one.\n\nOn the right, a young woman breastfeeds an old man behind bars: Pero and his father Cimone, condemned to starvation in prison. They are serving two purposes: feeding the hungry and visiting prisoners. She looks at the drop of milk on the old man's beard.\n\nBehind them, a man carries a dead man (only his feet are visible), and a priest with a torch lights his way: bury the dead. In the foreground, on the left, a young knight cuts the cloak for a naked man on the ground: it is Saint Martin, clothing the naked; nearby, in the darkest corner, a cripple prays: visit the sick.\n\nOn the far left, an innkeeper points the way to a pilgrim with a scallop shell on his hat, representing Saint James: welcoming pilgrims. In the background, a man drinks from a donkey's jawbone: Samson, giving drink to the thirsty.","d":"In front of the canvas, from left to right","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"Caravaggio's canvas above the high altar of the Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"Caravaggio's canvas as you see it in church: above the altar, in the chapel of Pio Monte."}},{"t":"The Madonna and the angels","x":"Look up: the Madonna and Child appear as if from a window, in front of two draped sheets, and two angels embrace in flight. They seem distant from what is happening below.\n\nBut observe the shadow they cast on the prison wall: Caravaggio makes them present, almost concrete, within the same night as men.\n\nArt historian Roberto Longhi chose this very detail for the poster of the major 1951 exhibition that rediscovered Caravaggio: beautiful, he wrote, like a Raphael, but taken \"by the naked truth of Forcella or Pizzofalcone.\"","d":"Up in the canvas","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Detail: the Madonna with Child and two angels in flight","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"The detail above: the Madonna with Child looking out and the two angels embracing in flight."}},{"t":"The other altars","x":"Around the Caravaggio, the octagonal church has six other altars, with paintings by seventeenth-century Neapolitan painters: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino and Forlì.\n\nLook for Battistello Caracciolo's \"Liberation of Saint Peter,\" from 1615: he is one of the painters who learned most from Caravaggio, and this is evident in the light and darkness. Then there's Fabrizio Santafede's \"Saint Peter Raising Tabitha from the Dead,\" from 1611.\n\nLook at them after Caravaggio: you will immediately understand how new his canvas was for Naples.","d":"In the chapels around","foto":{"u":"../img/b58919c38c63.jpg","alt":"A 17th-century canvas depicting the Good Samaritan","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"The Good Samaritan by Giovan Vincenzo Forlì, on one of the altars around the Seven Works of Caravaggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Cathedral and Treasure of San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Naples Cathedral and the Treasury Chapel, where the vial of San Gennaro's blood is kept.","rac":"The cathedral, dedicated to Santa Maria Assunta, was commissioned by Charles of Anjou in 1294 on the site of two ancient basilicas: the demolished Basilica of St. Stefania and the Basilica of Santa Restituta, preserved as a chapel. It suddenly appears along Via Duomo, the street opened in the first decades after the unification of Italy.\n\nIt is Gothic, with a Latin cross plan and three naves, and a coffered ceiling of carved and gilded wood. Inside, the centuries unfold: the early Christian basilica of Santa Restituta, the oldest baptistery in the West, the Renaissance crypt of the Succorpo, the Baroque chapel of the Treasury, and underneath it all, the remains of the Greco-Roman city.\n\nIn the Cathedral, in a niche in the Treasury Chapel, the ampoule containing the blood traditionally attributed to San Gennaro is kept. Three times a year (the Saturday before the first Sunday in May, September 19th, and December 16th) its liquefaction is awaited. Since 1601, the relics have been entrusted to a secular institution, the Deputation of the Treasury Chapel of San Gennaro.","con":"On liquefaction days, the Duomo is packed from morning: if you want to be there, arrive early.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"The facade of the Naples Cathedral","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"The facade of the Duomo, on Via Duomo. The Treasury Chapel is the third on the right."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Free admission with reservations required. Tours depart every hour."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"The portal of San Gennaro","x":"Stop in front of the façade: it's about fifty meters high and has three portals. It was rebuilt in Gothic style after the 1349 earthquake destroyed the Angevin façade and bell tower.\n\nThe right-hand gate remains closed almost year-round: it opens only for the feast of San Gennaro and on special occasions. If it's open, you've come to a special day.\n\nThe cathedral, dedicated to Santa Maria Assunta, was commissioned by Charles of Anjou in 1294 on the site of two ancient basilicas. Inside, it has a Latin cross plan, three naves, and a coffered ceiling of carved and gilded wood.","d":"On the front, on the right","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"The Gothic portal of Naples Cathedral","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"The Gothic portal of the Cathedral, on the facade."}},{"t":"The Treasure Chapel","x":"More than a chapel, it's a church within a church: the third chapel on the right, a Baroque chapel from the first half of the 17th century, has a Greek cross plan and a double-domed dome. You enter through the large bronze gate by Cosimo Fanzago.\n\nThe silver bust of San Gennaro and the vials containing his blood are kept here: every year the city awaits the \"miracle\" of the liquefaction, and crowds fill the cathedral.\n\nThe treasure donated to the saint over the centuries (jewels, silver, works of art) can be visited in the Museum of the Treasure of San Gennaro, with entrance from outside the Cathedral.","d":"Third chapel on the right","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"The dome of the Treasury Chapel frescoed with Paradise","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Look up: in the dome of the Treasury Chapel there is Paradise painted by Giovanni Lanfranco."}},{"t":"Saint Restituta","x":"When Charles of Anjou had the Cathedral built, one of the two ancient basilicas that once stood here was demolished, the other was preserved as a side chapel: it is Santa Restituta, in the left nave.\n\nTradition holds that it was commissioned by Emperor Constantine: it is one of the most important testimonies of early Christian art in Naples. It has three naves and houses works by Luca Giordano and 14th-century sculptures.\n\nFrom here you descend to the archaeological area beneath the cathedral, where you can see layers of history stacked on top of each other: Greco-Roman and early Christian remains.","d":"In the left aisle","foto":{"u":"../img/5abf53aec271.jpg","alt":"A mosaic with the Madonna enthroned in the Basilica of Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"A mosaic of the Madonna enthroned inside Santa Restituta: the oldest basilica, preserved as a chapel of the Cathedral."}},{"t":"The Baptistery of San Giovanni in Fonte","x":"To the right of the apse, a small room with an immense history: the Baptistery of San Giovanni in Fonte, considered the oldest in the West.\n\nStop for a few minutes in silence: you are in one of the oldest Christian sites in Europe still standing, from the time when Roman Naples became Christian.\n\nThe baptistery and the archaeological area beneath the cathedral together tell the story of the first centuries of the Christian city.","d":"To the right of the apse","foto":{"u":"../img/994ed22c6902.jpg","alt":"The interior of the Baptistery of San Giovanni in Fonte with the baptismal font in the center","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"The Baptistery of San Giovanni in Fonte: in the centre of the floor, the baptismal font."}},{"t":"The Succorpo","x":"Beneath the high altar is the Cathedral's crypt, the Cappella del Succorpo, also known as the Carafa Chapel: Cardinal Oliviero Carafa commissioned it to house the relics of San Gennaro along with those of 51 other saints.\n\nThe architect Giovan Tommaso Malvito conceived it as a small basilica: three naves divided by ancient columns with Ionic capitals, niches at the sides and a chapel at the end.\n\nWhite marble, soft light, and silence: the Renaissance inside the Gothic cathedral.","d":"Under the main altar","foto":{"u":"../img/876cd614ab8d.jpg","alt":"The interior of the Succorpo di San Gennaro with marble columns and inlaid floor","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"The Succorpo, under the presbytery of the Cathedral: marble columns and floor, and at the back the altar with the relics of San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Girolamini Complex","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"In front of the Cathedral, a baroque church called the \"Domus Aurea\", two cloisters, a picture gallery and the oldest public library in Naples.","rac":"On Via Duomo, opposite the cathedral, the Girolamini complex was built in the 16th century by the fathers of the Oratory of San Filippo Neri, known as the Girolamini. It has been a national monument since 1866 and comprises the church, cloisters, art gallery, and library.\n\nThe church, dedicated to Saint Philip Neri, is known as the \"Domus Aurea\" for its Baroque gold decoration. The art gallery is considered the city's first public art gallery and houses works by masters such as Battistello Caracciolo, Jusepe de Ribera, and Luca Giordano. The library, opened to the public in the second half of the 16th century, is the oldest public library in Naples.\n\nThe complex has undergone a lengthy restoration project: the church reopened on March 21, 2024, and, according to press sources, the library's Sala Camino and Sala Vico rooms were also reopened in 2026. The reopenings are progressive; not all rooms can be visited at the same time.","con":"Before coming, check the official website to see what's open: the church, cloisters, art gallery, and library have different opening hours and are subject to change.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"The Girolamini façade illuminated in the evening","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"The facade of the Girolamini church."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Church. Closed on Mondays."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Church and holidays."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"The \"Domus Aurea\" church","x":"The Church of San Filippo Neri is known as the Domus Aurea, the \"Golden House,\" for its rich Baroque decoration. It is one of the city's most important places of worship.","d":"In the church, with entrance from Via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"The nave of the Girolamini church with its golden decorations","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"The church of the Girolamini, the \"Domus Aurea\" for its rich decoration."}},{"t":"The picture gallery","x":"It is considered the first public art gallery in Naples. It contains paintings by 17th-century masters such as Battistello Caracciolo, Jusepe de Ribera, and Luca Giordano. It can be reached from the Cloister of the Oranges, on the first floor of the convent.","d":"Close-up of the convent, from the Orange Cloister","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Head of a saint painted by Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"A canvas from the Quadreria dei Girolamini: head of a saint by Massimo Stanzione (17th century)."}},{"t":"The oldest library in Naples","x":"The library is the oldest public library in the city and the second in Italy after the Malatestiana in Cesena. Specializing in theology, philosophy, church history, and sacred music, it houses approximately 159,700 ancient and modern volumes. Among the historic rooms is one dedicated to Giambattista Vico, who studied here.","d":"Entrance from Via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"The hall of the Girolamini Library with its wooden shelves","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"The hall of the Biblioteca dei Girolamini, the oldest public library in Naples."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"Banksy's Madonna with a Gun","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"A Madonna by Banksy with a gun instead of a halo, protected by glass, in the heart of the main decumanus.","rac":"Banksy arrived in Naples in 2010: it was his first time working in Italy. Using stencils, likely on the same night, he left two works in busy spots in the city center, both with a religious image and a direct message. One, on Via Benedetto Croce, was covered over by another artist; this one survived and is therefore considered Banksy's only mural in Italy.\n\nNext to the work there is an ancient votive shrine with the Madonna and Child: the two images, close together, seem to be talking to each other.\n\nIn Piazzetta dei Girolamini, on a façade of the main decumanus, Banksy left a Madonna with a gun in place of her halo. Today, it's protected by glass. The city's official tourist website includes it in its itinerary dedicated to street art in the historic center.","con":"Look up: the work is above street level, behind glass.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Banksy's Madonna face in white stencil on a dark background","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"The face of Banksy's Madonna: the white stencil on a dark background, close up."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"The Madonna with the gun","x":"Look at the wall: white on a black background, stenciled, a Madonna with her arms outstretched toward the sky. But instead of a halo, above her head is a gun.\n\nBanksy, the Bristol-based English street artist, painted it in Naples in 2010, likely at night and in a matter of seconds, using his stencils. It was Banksy's first work in Italy.\n\nThe message isn't explained: at a casual glance, it looks like a sacred image, but it isn't. Sacred and violence, faith and weapons: everyone interprets it in their own way.","d":"On the wall of the little square","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"Banksy's Madonna stencil on the wall of Piazza Gerolomini, seen up close.","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"Banksy's Madonna, a black and white stencil on a corner of the wall in Piazza Gerolomini."}},{"t":"The newsstand next door","x":"Now look next to the work: there is a small votive shrine with the Madonna and Child, one of those found in many streets of Naples, painted who knows how many centuries ago.\n\nThe two Madonnas, side by side, seem to be gazing at each other: the older one seems to be gazing perplexedly at Banksy's. It's this dialogue that makes the work so Neapolitan.\n\nTake a step back and look at them together: it's the most beautiful photo to take home.","d":"Immediately next to the work","foto":{"u":"../img/3a7788eec560.jpg","alt":"Banksy's Madonna on the wall and, next to it, the votive shrine with the Madonna and Child","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"On the left, Banksy's Madonna; on the right, hanging on the wall, the shrine with the Madonna and Child: the two sacred images next to each other."}},{"t":"A Banksy under glass","x":"In 2010, Banksy left two works in Naples, likely on the same night. The other, on Via Benedetto Croce, mocked consumerism: it was a recreation of Bernini's \"Ecstasy of Blessed Ludovica Albertoni,\" but the saint was depicted in ecstasy after a fast food meal.\n\nThat work was covered over by another Neapolitan street artist, who didn't know what he was erasing. For this reason, the FAI (Italian National Trust) lists this one in Piazza Gerolomini as Banksy's only mural in Italy.\n\nToday it is protected by a plexiglass case, which at least protects it from vandals.","d":"In front of the work","foto":null},{"t":"How to get there and what to photograph","x":"The work is on a wall in the small Piazza Gerolomini, overlooking Via dei Tribunali.\n\nThe display case protects the artwork but can reflect light: for a glare-free photo, try standing slightly to the side. The space is always accessible and free.\n\nFrom here the Madonna of Via Benedetto Croce, the lost work, was a nine-minute walk away, along the route that passes by Sansevero, Napoli Sotterranea and San Gregorio Armeno.","d":"Gerolomini Square, on Via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini and the Greek walls","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"A square of cafes and students with a view of the past: behind a balustrade you can see the Greek walls of Neapolis.","rac":"Piazza Bellini is located on the main decumanus and is one of the busiest squares in the historic center, due to the many bars and restaurants that line it. Just look down, beyond the balustrade, to see, in a sunken area, a section of the walls of Greek Neapolis, dating back to the 4th century BC. They were discovered in 1954.\n\nThe Conservatory of San Pietro a Majella is just a few steps away.","con":"Ten minutes is enough: look at the walls from above and then take a break in one of the bars in the square.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"Piazza Bellini with its tables and greenery","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, the meeting place of the historic center."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"The Greek walls","x":"Below the level of the square are the remains of the defensive walls of Greek Neapolis, made of tuff blocks. They were discovered in 1954 and are part of the ancient city's fortification system. They are not a reconstruction: they are original stones.","d":"Beyond the balustrade, in the lowered area","foto":{"u":"../img/4801d5111d9f.jpg","alt":"The tuff blocks of the Greek walls below the level of the square","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"The Greek walls of Neapolis in Piazza Bellini: original tuff blocks."}},{"t":"The square today","x":"Around the walls are cafes, bookstores, and bars frequented by students and residents. It's one of the places in the historic center where the ancient and everyday life are closest.","d":"Around the square","foto":{"u":"../img/133ed975e61b.jpg","alt":"Piazza Bellini with trees, buildings and tables","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"Piazza Bellini today, among cafes and bookstores."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port'Alba and the street of the booksellers","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"A gate from 1625 and, beyond the arch, an alley of booksellers and music shops leading to Piazza Bellini.","rac":"Port'Alba is one of the city's ancient gates. It opens onto a corner of Piazza Dante and takes its name from the Spanish viceroy Antonio Álvarez de Toledo, Duke of Alba, who had it built in 1625 to replace a temporary opening, to facilitate passage from one side of the city to the other. Its current appearance is the result of late 18th-century works commissioned by Ferdinand IV of Bourbon.\n\nBeyond the gate is Via Port'Alba, a pedestrian alley known for its bookshops and music shops, which leads to Piazza Bellini.","con":"Pass under the arch and browse the book stalls: it's the easiest way to get from Piazza Dante to Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"The Port'Alba Arch, a historic entrance to the old town","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, the sixteenth-century gate to the old town."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"The door of 1625","x":"The gate was erected in 1625 at the behest of the Duke of Alba, the Spanish viceroy. The coat of arms features those of King Philip III, the city of Naples, and the viceroy. Today, the gate is partially obscured by the colonnade of Piazza Dante.","d":"In a corner of Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"The Port'Alba gate with the coat of arms","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, the 1625 gate commissioned by the Duke of Alba."}},{"t":"The Street of the Booksellers","x":"The alleyway that passes through the gate is famous for its book market: bookshops, stalls, and musical instrument shops, all the way to Piazza Bellini.","d":"Beyond the gate, towards Piazza Bellini","foto":null}],"gal":[],"leg":"Legend has it that a young woman named Maria was accused of witchcraft during the Spanish Inquisition and left to die in a cage hanging from a door.","fc":null,"col":null},{"id":22,"s":"mann","n":"National Archaeological Museum (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"One of the world's largest archaeological museums: the treasures of Pompeii and Herculaneum, the Farnese Collection, and the famous Alexander Mosaic.","rac":"The National Archaeological Museum is housed in the Palazzo degli Studi, built in 1585. In 1777, King Ferdinand IV of Bourbon transferred the Farnese collection, inherited from his mother Elisabetta Farnese, there. With the return of the Bourbons in 1816, it became the Royal Bourbon Museum; after the unification of Italy, it became the National Museum. The paintings were transferred to Capodimonte in 1957, and since then it has been a museum exclusively for antiquities.\n\nIt exhibits approximately 18,000 artefacts: the Vesuvian collections (frescoes, mosaics, everyday objects, the model of Pompeii, the Villa of the Papyri), the Farnese sculptures and gems, the Secret Cabinet, numismatics and one of the most important Egyptian collections in the world.\n\nThe most famous piece is the Alexander Mosaic, found in 1831 in the House of the Faun in Pompeii: it depicts the Battle of Issus, between Alexander the Great and Darius III, and is made up of around one and a half million tiles.","con":"If you're short on time, choose three: the Alexander Mosaic, the Farnese Hercules, and the Secret Cabinet. It takes at least two or three hours to see everything. Check the opening hours before coming.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Pompeian fresco exhibited at the National Archaeological Museum","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"A Pompeian fresco exhibited at the MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Ticket office until 6:30 pm"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"The Alexander Mosaic","x":"Found in 1831 in the House of the Faun in Pompeii, the large mosaic measures approximately 5.82 by 3.13 meters and contains approximately 1.5 million tiles. It depicts the Battle of Issus (333 BC) between Alexander the Great and Darius III of Persia.","d":"On the mezzanine floor, in the Pompeii mosaics section","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"The great mosaic of the battle between Alexander and Darius","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"The Alexander Mosaic, from the House of the Faun in Pompeii."}},{"t":"The Farnese Collection","x":"Collected by the Farnese family for their palace in Rome, it includes monumental statues such as the Farnese Hercules, approximately three metres tall and found in the Baths of Caracalla, and the Farnese Bull.","d":"On the ground floor","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"The statue of the Farnese Hercules leaning on his club","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"The Farnese Hercules, found in the Baths of Caracalla."}},{"t":"The Secret Cabinet","x":"It houses erotic art found in Pompeii and Herculaneum. It has a separate entrance and often requires a timed reservation: ask at the ticket office.","d":"On the mezzanine floor","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, museum of contemporary art","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"A building renovated by architect Álvaro Siza that houses works by Clemente, Kapoor, Serra, Horn and other masters of contemporary art.","rac":"The MADRE, Donnaregina Museum of Contemporary Art, is located in Palazzo Donnaregina, a short walk from the Duomo and the Treasury of San Gennaro. The building was renovated by Portuguese architect Álvaro Siza, and the museum, managed by the Donnaregina Foundation for Contemporary Arts, opened in 2005.\n\nThe first floor is dedicated to works created specifically for the rooms by artists such as Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long, and Mimmo Paladino. The collection also includes Richard Serra, Sol LeWitt, and Jeff Koons, and the museum organizes temporary exhibitions. It's a deliberate contrast with the ancient Naples that surrounds it.","con":"Look for Rebecca Horn's \"Spirits\": they are cast iron replicas of the skulls from the Fontanelle Cemetery. The museum is closed on Tuesdays, and some rooms on the second floor are temporarily closed for renovations: check the website before coming.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"The white courtyard of the Madre museum","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"The Madre Museum, contemporary art in Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Closed on Tuesdays. Last admission is one hour before closing."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Sunday. Last admission is one hour before closing."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"\"Ave Ovo\" by Francesco Clemente","x":"A majolica floor and a monumental fresco, created in 2005 for the museum, occupy two rooms on two floors.","d":"In the rooms dedicated to Clement","foto":null},{"t":"«Spirits» by Rebecca Horn","x":"The artist reproduced in cast iron the skulls from the Fontanelle Cemetery, the Neapolitan \" capuzzelle.\" A link between contemporary art and popular Naples.","d":"In Rebecca Horn's Room","foto":null},{"t":"Siza's architecture","x":"Siza renovated the three floors of the building, maintaining the historic layout and adding modern spaces for large installations.","d":"Throughout the museum","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Toledo Metro Station","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A stop on Line 1 considered one of the most beautiful in Europe: mosaics, blue ceramics, and Robert Wilson's \"Crater of Light.\"","rac":"Toledo Station is part of the \"Art Stations\" project, which commissioned architects and artists to design the Line 1 stations, featuring over 250 works. It was designed by Catalan architect Oscar Tusquets Blanca and inaugurated on September 17, 2012. The entrance, on Via Diaz, features three hexagonal structures covered in blue and ochre tiles, which bring light into the atrium.\n\nDescending, you encounter waves in relief designed by Tusquets, works by Robert Wilson (including \"Crater de luz,\" a crater of light), and mosaics by William Kentridge. The station has been repeatedly named among the most beautiful in Europe.\n\nTo see it, just take the subway: you need a ticket to get off at the platforms.","con":"Descend to the deepest level and look up: that's where the Crater's light is at its most effective. A ticket is required to enter; check the service schedule on the ANM website.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"The Toledo station platform, underground","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"The platform of Toledo station."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Line 1 operating hours: from first to last train."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Line 1 operating hours: from first to last train."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Robert Wilson's \"Crater de luz\"","x":"A crater of light, designed by Robert Wilson, defines the station's identity. The artwork changes with the light, giving the descent an almost theatrical effect.","d":"In the underground floors of the station","foto":null},{"t":"The mosaics of William Kentridge","x":"Along the way you can see mosaics by the South African artist William Kentridge, which are part of the Art Stations programme.","d":"On the way to the tracks","foto":null},{"t":"The blue entrance on Via Diaz","x":"Three hexagonal structures clad in blue and ochre tiles, which let light into the atrium, are the underlying theme throughout the station.","d":"At the entrance to Via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, the last Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"Six minutes from Ceraldi, in Via Toledo, is the last painting by Caravaggio, a few weeks before he died: the Martyrdom of Saint Ursula.","rac":"Intesa Sanpaolo's Gallerie d'Italia are located at Via Toledo 177, in the building that was once the headquarters of the Banco di Napoli, designed by Marcello Piacentini in the late 1930s. The new layout is by architect Michele De Lucchi. The museum opened here in 2022, replacing the nearby Palazzo Zevallos Stigliano.\n\nThe collection's masterpiece is Caravaggio's Martyrdom of Saint Ursula, from 1610, considered the artist's last painting. It is surrounded by three sections: Neapolitan art from the 17th to the 20th century, a collection of Attic and Magna Graecia ceramics, and a selection of 20th-century works.","con":"Full price ticket €8, reduced €4; free for under 26s and everyone on the first Sunday of the month. Closed on Mondays; last admission one hour before closing.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"A room in the Gallerie d'Italia with paintings on the yellow walls","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"A room at the Gallerie d'Italia in Naples, with 17th-century paintings."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"The Martyrdom of Saint Ursula","x":"It's a cramped, dark scene, with almost no background: we're in the tent of Attila, king of the Huns. Ursula, a princess, has rejected him, and he has just shot an arrow into her chest. She bends her head toward the arrow; three men rush to support her. The king already seems to regret his action.\n\nLook for the face behind the saint: it's Caravaggio himself, who painted himself among the witnesses. And notice the hand reaching between the saint and the king, as if to stop the arrow: it reappeared during the 2003-2004 restoration.\n\nIt was commissioned by the Genoese prince Marcantonio Doria, whose family had Saint Ursula as its patron saint. It is Caravaggio's latest known painting: it was finished in May 1610, just over a month before his death.","d":"In the room dedicated to Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"The Martyrdom of Saint Ursula by Caravaggio: the saint and the king at the moment of the arrow","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"The Martyrdom of Saint Ursula (1610): the king hits the saint with the arrow, at close range."}},{"t":"The painting placed in the sun","x":"Caravaggio painted the picture in haste, perhaps because he was about to leave for Rome to seek the Pope's pardon. The Dorias' representative in Naples, Lanfranco Massa, had the canvas delivered before the varnish was dry, and to speed up the drying process, he placed it in the sun. The varnish, applied very thickly, was ruined. He himself recounted this in a letter dated May 1610.\n\nThe painting arrived in Genoa, then passed from heir to heir, ending up in a villa in Eboli and attributed to other painters. Only in the 1980s did the discovery of the Massa letter confirm with certainty that it was by Caravaggio.\n\nIn 2025, a new restoration project brought to light three heads that had disappeared over time.","d":"In front of the canvas","foto":{"u":"../img/6a999eeecae6.jpg","alt":"Caravaggio's canvas exhibited in a room of Palazzo Zevallos, with the decorated ceiling","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"The Martyrdom of Saint Ursula on display in a room of Palazzo Zevallos Stigliano, home of the Gallerie d'Italia."}},{"t":"The Bank of Naples building","x":"Before going up to the rooms, look around: you are in the building that was the headquarters of the Banco di Napoli, designed by Marcello Piacentini in the late 1930s.\n\nArchitect Michele De Lucchi transformed it into a museum with a modern layout: the bank's large rooms now host three exhibitions, from 17th- to 20th-century Neapolitan art, including a rich collection of Greek and Magna Graecia vases.\n\nThe museum opened in 2022 and continues the activities of Palazzo Zevallos Stigliano, which was open from 1999 to 2022, just a few steps away.","d":"Entering, in the hall","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"The stone facade of the Palazzo del Banco di Napoli on Via Toledo, with the European flag","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"The Palazzo del Banco di Napoli on Via Toledo, home to the Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Spanish Quarters","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"A network of narrow alleys built in the 16th century for Spanish soldiers, today one of the liveliest and most photographed neighborhoods in Naples.","rac":"The Spanish Quarters were established in 1536 by order of the Spanish viceroy Pedro de Toledo, to house the garrisons responsible for maintaining order. The main street, Via Toledo, bears his name. The neighborhood is a grid of narrow alleys between Via Toledo, Corso Vittorio Emanuele, and Monte Echia, and includes the areas of Avvocata, Montecalvario, and San Ferdinando.\n\nThe Spanish origins still live on in the street names, such as Via della Trinita degli Spagnoli, where the church of Santa María del Pilar is located. The alleys are lined with shops, laundry lines, small altars, and numerous murals.\n\nThe most famous is the Maradona mural in Largo Maradona, on Via Emanuele De Deo: it was created in 1990 by Mario Filardi and has been restored several times over the years. It is a stop on the \"The Sea and the Castles\" tour, with its own page.","con":"Start from Piazza Carità and wander through the alleys during the day. As in any crowded area, keep your bag and phone handy. Walk slowly: the details are in the doorways and murals.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"An alley in the Spanish Quarter with a mural of Maradona and flags","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"In the Spanish Quarter, the Maradona mural among the flags."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"The grid of alleys","x":"The urban plan is a regular grid of narrow alleys, built to house Spanish soldiers. Walking through, you'll see clothes hanging out to dry, small shrines, and shops: neighborhood life unfolds on the streets.","d":"In the alleys west of Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"A narrow alley in the Spanish Quarter","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"One of the straight, narrow alleys of the Spanish Quarter grid."}},{"t":"The Maradona mural and Largo Maradona","x":"On Via Emanuele De Deo, an old parking lot has become Largo Maradona. The 1990 mural by Mario Filardi was later restored by the Argentine artist Bosoletti, who created the Veiled Isis next to it.","d":"In Emanuele De Deo Street","foto":null},{"t":"The Church of Santa Maria del Pilar","x":"On Via della Trinità degli Spagnoli is the church dedicated by the Spanish to Santa Maria del Pilar: a trace of the Spanish origins of the neighborhood.","d":"On Spanish Trinity Street","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"Maradona's mural","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"The beloved mural in the Spanish Quarter and the square that since 2020 has become a secular sanctuary for Diego.","rac":"The mural depicts Maradona wearing the number 10 Napoli jersey of the 1980s, with the Scudetto on his chest and the captain's armband. It was painted to celebrate the club's second Scudetto, in 1989-90, to which Maradona contributed 16 goals in 28 games. He arrived from Barcelona in 1984 and remained in Naples until 1991.\n\nThe author, Mario Filardi, was only 23 years old: he painted out of passion and worked as a waiter, traveling the world.\n\nThe Maradona mural was painted in 1990 by Mario Filardi. In the 1990s, a window in the wall obliterated his face, and the painting almost completely faded. It was restored by Salvatore Iodice, and in the fall of 2017, Argentine artist Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, formerly known as the Artists' Square, was named after him and filled with shrines, flags, and photographs.","con":"It's very crowded during rush hour: early in the morning it's easier to see it calmly.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"The large mural of Maradona on the facade of a building, with the crowd below","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"The mural was painted in 1990 by Mario Filardi. Today's face was repainted in 2017 by Argentine artist Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"The mural and its author","x":"The 1990 mural is the work of Mario Filardi, who painted for pleasure. It has been restored several times: in 2017, Argentine artist Francisco Bosoletti repainted the face.","d":"On the facade in Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Maradona's face painted on the facade of a building","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"The Maradona mural on Via Emanuele De Deo, with his face repainted in 2017 by Francisco Bosoletti."}},{"t":"The open sea from November 25, 2020","x":"After Maradona's death, the square, previously known as \"artists' square\", took his name and became a place of shrines, flags and photographs.","d":"In the clearing in front of the mural","foto":{"u":"../img/76bca69c23a8.jpg","alt":"The square in front of the Maradona mural is full of people","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: flags, small altars and visitors in front of the mural."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"The plaque in Largo Maradona with a bust and flags","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"The plaque on the square: after Diego's death in 2020, the artists' square was named after him."},{"u":"../img/550f6edc4b91.jpg","alt":"A small altar with photos of Maradona and memories","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"A small shrine dedicated to Maradona: there are many in the city, with photos and mementos left by fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona painted with a halo next to a small shrine","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona with his halo and his votive shrine, painted in the San Lorenzo area."},{"u":"../img/80d74e92279d.jpg","alt":"A votive shrine with a portrait of Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"A votive shrine for Maradona, like those of the saints."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Umberto I Gallery","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"A cross-shaped gallery with an iron and glass dome approximately 56 metres high, facing the Teatro di San Carlo.","rac":"The Galleria Umberto I was built between 1887 and 1890 during the Naples redevelopment project, the major urban reconstruction project following the cholera epidemic. Architect Emanuele Rocco designed it in the shape of a cross, inspired by the Galleria Vittorio Emanuele II in Milan. It is named after Umberto I, King of Italy at the time of its construction.\n\nThe four arms meet under an iron and glass dome, supported by sixteen ribs. Beneath the dome, the floor is a star-shaped mosaic. The arcade houses shops, cafes, and, on the upper floors, apartments: it was designed to unite commercial activities and social life.\n\nIt is located in front of the Teatro di San Carlo, near Piazza del Plebiscito.","con":"Stop under the dome and look up: it's the best spot to see the iron and glass. It's a passageway, with free admission.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"A decorated entrance to the Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"An entrance to the Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"The iron and glass dome","x":"The gallery's four arms meet under an iron and glass dome, supported by sixteen ribs. During the day, light enters from all sides; at night, the lighting highlights the structure.","d":"In the center of the gallery","foto":{"u":"../img/5caa008a8527.jpg","alt":"The iron and glass dome of the Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"The iron and glass dome, where the four arms of the gallery meet."}},{"t":"The star mosaic","x":"Under the dome, the floor is a twelve-pointed star mosaic in cream, terracotta, and gray. It can be recognized by looking down, where the arms meet.","d":"On the floor, under the dome","foto":null},{"t":"The redevelopment of Naples","x":"The gallery was born as a symbol of a city striving to modernize after the cholera epidemic. It was part of the redevelopment project, the city's major demolition and reconstruction project, and was intended to compete with Milan's Galleria Vittorio Emanuele II.","d":"Entering from Via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Statues and the writing ANNO MDCCCXC on the gallery","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Year MDCCCXC»: the completion date, written on the tunnel symbolizing the renovation."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"San Carlo Theater","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"The oldest opera house still in operation in Europe: inaugurated in 1737, before La Scala and La Fenice.","rac":"The Teatro di San Carlo was built by order of Charles III of Bourbon and inaugurated on November 4, 1737, the king's name day. The king wanted a theater for Naples larger than the old San Bartolomeo. It opened 41 years before La Scala in Milan and 55 before La Fenice in Venice, making it considered the oldest opera house still in operation. The project was entrusted to Giovanni Antonio Medrano and Angelo Carasale.\n\nComposers such as Rossini, Donizetti, Bellini, and Verdi have graced its stage. The theater, along with the historic center, is a UNESCO World Heritage Site.\n\nGuided tours in Italian and English last about half an hour. The same complex also houses the MeMus, a museum that chronicles the history of the theater and opera.","con":"Visits depend on rehearsals and performances: check the official website and, if possible, book. If you love opera, the best way to experience it is to attend a performance.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"The facade of the San Carlo Theatre with its columns","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"The facade of the San Carlo Theatre."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Guided tours lasting approximately 30 minutes are available at 10:30, 11:30, 12:30, 2:30, 3:30, and 4:30. Reservations recommended."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"The hall and the Royal Theatre","x":"The horseshoe-shaped auditorium is the heart of the theater: tiered boxes and a royal box. The San Carlo is also famous for its acoustics. Guided tours usually allow photographs of the auditorium and foyer.","d":"In the hall, with the guided tour","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"An eighteenth-century engraving of a dance party in the theatre","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"A ball at the Royal Theatre of San Carlo, in an engraving from 1749."}},{"t":"The MeMus","x":"The MeMus, inaugurated in 2011, is the theater's museum and historical archive. It traces the history of the building and Italian opera with paintings, photographs, musical instruments, and costumes.","d":"In the same complex as the theater","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Stage costumes on display at MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Stage costumes from an opera by Paisiello on display at MeMus."}},{"t":"The first opera house in Europe","x":"Inaugurated in 1737, it is older than La Scala in Milan (1778) and La Fenice in Venice (1792). For this reason, it is considered the oldest opera house still in operation.","d":"In front of the facade, on Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"The writing Real Teatro di S. Carlo on the facade","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"«Royal Theatre of S. Carlo», on the facade of the theatre inaugurated in 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"The largest square in Naples: on one side the Royal Palace, on the other a colonnade embracing the Basilica of San Francesco di Paola.","rac":"At the foot of Pizzofalcone Hill, Piazza del Plebiscito is one of the city's largest and most monumental squares. Until 1817, it was called Largo di Palazzo. In 1809, Joachim Murat demolished the area's convents and designed a forum with a semicircular colonnade. Work stopped at the end of his reign and was resumed by Ferdinand I, who wanted to build a church in fulfillment of a vow to Saint Francis of Paola. The basilica was erected between 1817 and 1836, inspired by the Pantheon in Rome.\n\nThe square took its current name after the plebiscite of October 21, 1860, which sanctioned the annexation of the Kingdom of the Two Sicilies to the Kingdom of Sardinia. In front of the basilica are two equestrian statues: Charles III of Bourbon, by Antonio Canova, and Ferdinand I.\n\nToday it is the venue for concerts, ceremonies and city festivals.","con":"Arrive early in the morning: the grazing light illuminates the colonnade and the square is almost empty. Afterward, enter the basilica and walk around to the Royal Palace.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito with a lion and the church of San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito and, in the background, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"The colonnade and the basilica of San Francesco di Paola","x":"The semicircular colonnade was created by Murat. The basilica is a neoclassical building with a 53-meter-high central dome, inspired by the Pantheon. Inside, the high altar, adorned with precious stones and lapis lazuli, was designed by Ferdinando Fuga in 1751 and brought here in 1835 from the Church of the Holy Apostles.","d":"On the west side of the square","foto":{"u":"../img/82ad7240a133.jpg","alt":"The circular interior of the Basilica of San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"The interior of the Basilica of San Francesco di Paola, inspired by the Pantheon."}},{"t":"The equestrian statues","x":"The two bronze statues depict Charles III of Bourbon, founder of the house, and his son Ferdinand I. They are located in front of the basilica.","d":"In front of the basilica","foto":{"u":"../img/75d762389b74.jpg","alt":"A bronze equestrian statue in front of the basilica","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"One of the two equestrian statues of the Bourbons in front of the basilica."}},{"t":"The name of the square","x":"The name derives from the plebiscite of October 21, 1860, which annexed the Kingdom of the Two Sicilies to the Kingdom of Sardinia. Previously, the square was called Largo di Palazzo.","d":"Throughout the square","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito seen in its entirety","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, once Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Royal Palace","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"The great palace of the viceroys and the Bourbons: grand staircase, Court Theatre, Throne Room and a garden overlooking the gulf.","rac":"The Royal Palace overlooks Piazza del Plebiscito. It was built in the early 17th century by the Spanish viceroy Fernando Ruiz de Castro, Count of Lemos, and for centuries served as the seat of power in Naples. Construction dragged on for centuries and was only completed in 1858 by Gaetano Genovese. On the façade, in the niches, are eight statues of Neapolitan rulers.\n\nThe museum occupies the Historic Apartment on the main floor: it is accessed via the Grand Staircase, designed by Francesco Antonio Picchiatti in 1651, clad in pink and white marble and considered among the most beautiful in Europe. The rooms include the Court Theatre, the Throne Room, the Royal Chapel, and the Hall of Hercules. The Historic Apartment has been open to the public since 1919 and was severely damaged during World War II.\n\nThe Romantic Garden, on the gulf side, has free admission.","con":"As you ascend the Grand Staircase, notice the marble and the light. It's usually open from 9:00 am to 8:00 pm (last admission at 7:00 pm) and is closed on Wednesdays: check before coming.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"The facade of the Royal Palace on the square","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"The facade of the Royal Palace."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Label Apartment (Historical Apartment). Usually closed on Wednesdays. Last confirmed on the official pages of the Ministry of Culture (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"The Grand Staircase","x":"Designed by Francesco Antonio Picchiatti in 1651, it was later clad in pink and white marble. It is considered one of the most beautiful monumental staircases in Europe and leads to the museum on the main floor.","d":"At the entrance, in the courtyard of honor","foto":{"u":"../img/7533a4a26b58.jpg","alt":"The Grand Staircase of Honour of the Royal Palace","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"The marble-clad Grand Staircase of the Royal Palace."}},{"t":"The Court Theatre and the Throne Room","x":"The Historic Apartment houses the Court Theatre, the Throne Room with a large crystal chandelier, the Royal Chapel and the Hall of Hercules: these were the living and reception rooms of the court.","d":"On the main floor, in the historic apartment","foto":{"u":"../img/841e35a47444.jpg","alt":"The throne in the Throne Room of the Royal Palace","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"The Throne Room in the Historic Apartment."}},{"t":"The Romantic Garden","x":"On the gulf side, there's a garden, with free admission, where you can stroll among flowerbeds and trees. It's a peaceful spot overlooking the gulf.","d":"On the side of the building facing the sea","foto":null}],"ga
