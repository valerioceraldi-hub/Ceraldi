<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.

:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;

</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
var D = {"lingua":"en","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità and Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"The starting point: Piazza Carità, on Via Toledo. From here, the historic center begins just a few minutes' walk away. And here is Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Before leaving, a coffee: the tour is long and Naples is best explored with the right cup.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità today, with its trees and colorful buildings","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità today, on Via Toledo: all the tours start from here. Ceraldi is here."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Via Toledo e il largo della Carità in una foto dell'Ottocento","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo e Largo Carità nell'Ottocento: la grande strada voluta da don Pedro di Toledo, già allora piena di vita."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Vintage photo of Via Toledo in the 19th century, with carriages and passers-by","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo in the 19th century, when it was called Via Roma, in a photo by Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità e via Toledo: una passeggiata nel cuore di Napoli","x":"La storia della piazza, raccontata da chi ci lavora dal 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, the lower decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"The straight road that cuts the historic center in two: the lower decumanus of the Greek city, about two kilometers of churches, shops and life.","rac":"Spaccanapoli is the lowest of the three decumani, the parallel streets that crossed Greek Neapolis from west to east. It begins in Piazza del Gesù Nuovo as Via Benedetto Croce, then becomes Via San Biagio dei Librai, crosses Via Duomo, and continues beyond the old town: about two kilometers in total. The name says it all: it is so long and straight that, seen from above, it seems to split the city in two.","con":"Walk along it from Piazza del Gesù towards Via Duomo: it's a slight downhill ride of history, not of effort.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista dall'alto, una linea dritta attraverso i tetti del centro storico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista da Sant'Elmo: una linea dritta che taglia i tetti del centro storico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"La linea dritta di Spaccanapoli vista dall'alto","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli vista da Castel Sant'Elmo: la linea dritta che divide in due il centro antico."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Square and Church of Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A facade of pyramid-shaped stones that looks like a fortress and hides a mystery: engraved signs that no one has yet deciphered with certainty.","rac":"Before being a church, it was a palace: that of the Sanseverino princes, built in 1470; a plaque on the façade commemorates the architect, Novello da San Lucano. The Jesuits preserved the structure and the dark piperno ashlar, with the stones cut into pyramidal shapes, adding white marble elements.\n\nSome stones have engraved markings. Legend has it they're a secret message; some scholars believe they're the marks left by different stonecutters; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes from a score called \"Enigma.\" Look closely and decide for yourself.\n\nThe façade was restored and unveiled on March 12, 2023, after some fragments fell in December 2017; the square has been closed to cars since then.","con":"Look for the markings on the stones at eye level, to the right and left of the portal: the hunt is free.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"The facade of the Gesù Nuovo, made of dark stones cut into points","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"The diamond-pointed façade: it was the palace of the Sanseverino princes, from 1470. Come closer and look for the signs engraved on the stones."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"The diamond-pointed facade","x":"Before it was a church, it was the façade of the palace of the Sanseverino princes, dating back to 1470. The Jesuits kept it as it was, with its dark piperno stones cut into pyramidal shapes, and added the large Baroque portal. Come closer: many of the stones have engraved signs, and even today there is no consensus on their meaning.","d":"Outside, in the square","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo coperta di punte di diamante in pietra grigia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante della facciata del Gesù Nuovo, con il portale e la grande finestra."}},{"t":"The Expulsion of Heliodorus","x":"The large fresco on the counterfaçade is by Francesco Solimena, from 1725. It depicts Heliodorus attempting to sack the Temple of Jerusalem and being repelled by a celestial knight: a scene full of movement, horses, and fleeing figures. Many visitors miss it because they enter facing the altar.","d":"As soon as you enter, turn towards the door: it is above the entrance","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"The large fresco of the Expulsion of Heliodorus by Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimena's fresco above the entrance: turn toward the door to see it. In the center is the celestial knight repelling Heliodorus."}},{"t":"The dome and the four evangelists","x":"The four triangles at the base of the dome depict the evangelists, painted by Giovanni Lanfranco. The dome you see, however, is not the original: it collapsed in the 1688 earthquake and was replaced in 1786 by a lower, bowl-shaped structure.","d":"In the center of the church, look up","foto":{"u":"../img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo verso la cupola","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata del Gesù Nuovo: dove incrocia il transetto alza gli occhi verso la cupola e i quattro pennacchi con gli evangelisti."}},{"t":"The chapel of Sant'Ignazio","x":"Dedicated to the founder of the Jesuits, it unites two great names of 17th-century Neapolitan art: Cosimo Fanzago, author of the architecture and statues of the prophets David and Jeremiah, and Jusepe de Ribera, who painted the canvases depicting the life of the saint. Colored marble, statues, and paintings come together: Neapolitan Baroque at its finest.","d":"In one of the two large chapels of the church","foto":{"u":"../img/835d153e2859.jpg","alt":"Una tela di Ribera con Sant'Ignazio in gloria","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Sant'Ignazio in gloria, tela di Jusepe de Ribera nel cappellone dedicato al fondatore dei gesuiti."}},{"t":"Saint Joseph Moscati","x":"Here lies the resting place of Naples' \"holy doctor\": Giuseppe Moscati, a researcher and university professor who cared for the poor free of charge. He died in 1927 and was proclaimed a saint in 1987. His remains are in a bronze urn by sculptor Amedeo Garufi, beneath the altar of the Chapel of the Visitation.","d":"In the chapel of the Visitation, under the altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La stanza di san Giuseppe Moscati ricostruita: camice bianco e strumenti medici in una teca","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Nella stanza ricostruita: il camice bianco, gli strumenti medici e le fotografie di san Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"The Gesù Nuovo square in front of the church","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"The square of Gesù Nuovo, in front of the church."},{"u":"../img/6d1ae4837518.jpg","alt":"The interior of the Gesù Nuovo, with coloured marbles and the main altar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Inside, the contrast with the severe façade: colored marble, frescoes and gold up to the high altar."},{"u":"../img/3dd3789513c8.jpg","alt":"The nave of the Gesù Nuovo seen from the entrance","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"The nave seen from the entrance: at the bottom, above, the dome with Lanfranco's evangelists at the base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastery and Complex of Santa Chiara (majolica cloister)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"The majolica-clad cloister is one of the quietest places in the center: a stone's throw from the chaos of Spaccanapoli, silence.","rac":"Santa Chiara was built in 1310 by order of King Robert of Anjou and Queen Sancha of Majorca. The construction was led first by Gagliardo Primario and then by Lionardo di Vito, and in 1340 the church was opened for worship. The complex consisted of two parts: a convent for the Poor Clares and one for the Friars Minor, adjacent but separate.\n\nFour centuries later, at the suggestion of Queen Maria Amalia of Saxony, wife of Charles of Bourbon, the Poor Clare cloister was renovated. Architect Domenico Antonio Vaccaro retained the 14th-century Gothic arches and transformed the center into a Baroque garden, lined with majolica tiles from the workshop of Donato and Giuseppe Massa. The result is one of the most surprising places in Naples: a ceramic garden just steps from Spaccanapoli.","con":"On Sundays the cloister closes at 2 pm: if it's Sunday afternoon, swap orders and come here first.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"The entrance to the cloister of Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"The entrance to the majolica cloister of Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloister and museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloister and museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"The majolica pillars","x":"Sixty-four pillars covered in majolica tiles with festoons of leaves, flowers, and fruit, under a pergola. The yellow, orange, and blue colors recall the citrus trees and vines growing around them. The majolica tiles are from the workshop of Donato and Giuseppe Massa, in the Baroque garden designed by Domenico Antonio Vaccaro.","d":"In the cloister garden","foto":{"u":"../img/924627d30fda.jpg","alt":"Pillars covered with yellow and green majolica tiles in the cloister","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"The pillars covered in majolica with festoons of leaves, flowers and fruit, under the pergola."}},{"t":"The scenes on the seats","x":"The seats connecting the pillars are all majolica, and the backrests are painted with small scenes: country life, seaside life, folk festivals, myths. They represent eighteenth-century Neapolitan life told through images. Sit down and take a closer look at the one behind you.","d":"On the backs of the seats between the pillars","foto":{"u":"../img/79ec1acbab17.jpg","alt":"A majolica seat with a scene painted on the backrest","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"A majolica seat from the cloister: on the back there is a painted scene."}},{"t":"The Clarissa with the cats","x":"Among the scenes is a Poor Clare nun feeding the cloister cats: a small glimpse of daily life in the monastery, painted on the majolica. Finding it is a perfect treasure hunt, even for children.","d":"On one of the seat backs: look for it","foto":null},{"t":"The arches of the fourteenth century","x":"The garden is Baroque, but the setting is medieval: Vaccaro preserved the 14th-century perimeter with the pointed arches of the Angevin monastery. Notice the contrast between the austere stone of the arches and the bright colors of the majolica tiles: four centuries in a single glance.","d":"Along the four sides of the cloister","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Gli archi del chiostro di Santa Chiara visti in controluce, con la chiesa sullo sfondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Gli archi gotici del chiostro di Santa Chiara, visti in controluce: sullo sfondo la facciata della chiesa."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolica with a wild boar hunting scene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Up close: a wild boar hunt painted on majolica by the Massa workshop, between 1739 and 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"The cloister with majolica pillars, seats and garden","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"The entire cloister: the majolica pillars, the seats and the garden."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Chapel","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"The Veiled Christ, one of the most famous sculptures in the world, and the anatomical machines of the alchemist prince Raimondo di Sangro.","rac":"The di Sangro family chapel is the kingdom of Raimondo, Prince of Sansevero: a man of science and secrets, Grand Master of Freemasonry, around whom the myth was born when he was still alive, and it was he himself who fueled it.\n\nAt the center is Giuseppe Sanmartino's Veiled Christ, commissioned by the prince: a reclining body covered by a shroud so thin it resembles wet cloth, yet carved from the same block of marble as the statue. In the underground cavea are two \"anatomical machines,\" skeletons of a man and a woman with reconstructed blood vessels, the work of the Palermo physician Giuseppe Salerno around 1756-1764. The black legend tells of sacrificed servants and mysterious injections; the museum itself carefully separates myth from documented history.","con":"It is closed on Tuesdays: if today is Tuesday, the statue of the Nile is two minutes away and can always be seen.","acc":"The nave and sacristy are wheelchair accessible. The underground auditorium with its anatomical machines is accessible only by a narrow 19th-century spiral staircase.","foto":{"u":"../img/65421f883be6.jpg","alt":"The exterior of the Sansevero Chapel","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"The Sansevero Chapel seen from outside."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"The Veiled Christ","x":"A body stretched out on a mattress, covered by a shroud so thin that the face, wounds, and veins can be seen beneath. The veil is not added: Giuseppe Sanmartino carved it from the same block of marble as the statue, commissioned by Prince Raimondo di Sangro. Walk around it slowly: the veil seems to change on each side.","d":"In the center of the nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"The face of Christ veiled under the marble veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"The face under the veil: the shroud is carved from the same block of marble as the statue, yet it looks like wet cloth."}},{"t":"Modesty","x":"A woman wrapped in a veil that clings to her skin as if wet, with a garland of roses. It was sculpted by Antonio Corradini in 1752, the year of his death, and the prince dedicated it to his mother, Cecilia Gaetani, who passed away when he was not yet a year old. Look for the broken tombstone at her feet: it is the sign of a life cut short too soon.","d":"Near the main altar","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"The statue of Modesty, a woman covered by a veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Modesty by Antonio Corradini: the veil clings to her body as if it were wet. At her feet, a broken tombstone."}},{"t":"The Disillusionment","x":"A man frees himself from a large net with the help of a small winged genie with a flame on his forehead, a symbol of intellect. Francesco Queirolo sculpted it in 1753-54 to commemorate the prince's father. The net is entirely made of perforated marble: according to tradition, the assistants refused to refine it for fear of breaking it, so the sculptor smoothed it himself.","d":"Near the main altar","foto":{"u":"../img/921cf7f91318.jpg","alt":"The statue of Disillusionment, a man freeing himself from a net","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Francesco Queirolo's Disillusionment: the net is entirely made of marble, perforated by hand."}},{"t":"The labyrinthine floor","x":"The original floor was a labyrinth of colored marbles traversed by a continuous white line, conceived by the prince as a symbol of the arduous path to knowledge. Francesco Celebrano built it until around 1771. A collapse in 1889 destroyed almost all of it: a few slabs remain in the passage in front of Raimondo's tomb, in the cavea, and in the sacristy.","d":"In the passage in front of the prince's tomb","foto":null},{"t":"The anatomical machines","x":"Two skeletons, a man and a woman, with their blood vessels reconstructed with a precision that still amazes. They were created by the Palermo physician Giuseppe Salerno between 1756 and 1764. The dark legend of the prince was born around them: the museum carefully explains where the story ends and the myth begins.","d":"In the underground cavea, going down a narrow spiral staircase","foto":{"u":"../img/a3a047434411.jpg","alt":"Uno scheletro con il sistema dei vasi sanguigni nella vetrina della cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"Una delle due macchine anatomiche di Giuseppe Salerno nella cavea sotterranea: scheletro e sistema circolatorio."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"The interior of the Sansevero Chapel with the statues","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"The entire chapel: in the centre the Veiled Christ, surrounded by the statues of the di Sangro family."}],"leg":"Much was said about Raimondo di Sangro during his lifetime: mysterious experiments, alchemical secrets, even servants transformed into anatomical machines. The museum carefully distinguishes the black legend from the documented facts: it's worth hearing both versions and choosing a side.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"La chiesa dove visse e insegnò san Tommaso d'Aquino e dove, secondo la tradizione, un Crocifisso gli rivolse la parola.","rac":"Il complesso domenicano si affaccia sull'omonima piazza, lungo Spaccanapoli. La chiesa gotico-angioina fu costruita tra il 1283 e il 1324 e in seguito trasformata in epoca barocca. Nel convento visse e insegnò Tommaso d'Aquino, tra il 1272 e il 1274; furono legati a questo luogo anche Giordano Bruno e Tommaso Campanella.\n\nNella sagrestia, con la volta affrescata da Francesco Solimena nel 1709, si trovano le arche dei sovrani aragonesi. Per secoli la basilica ha custodito anche un capolavoro di Caravaggio, la Flagellazione di Cristo, oggi al Museo di Capodimonte.\n\nOggi il complesso si visita anche come museo DOMA: sagrestia, arche aragonesi e cella di San Tommaso.","con":"Se hai tempo, entra anche nel percorso del museo: sagrestia, arche aragonesi e cella di San Tommaso. Gli orari cambiano e alcune sezioni possono essere chiuse per lavori: controlla il sito ufficiale prima di venire.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"La guglia di San Domenico e l'abside della chiesa nella piazza","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"La guglia di San Domenico e, dietro, l'abside della chiesa."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visite guidate."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"Il Crocifisso che parlò a san Tommaso","x":"È una tavola dipinta, custodita nella basilica. La tradizione dice che il Cristo si rivolse a Tommaso d'Aquino, che pregava dopo aver scritto di teologia: gli avrebbe detto che aveva scritto bene di lui e gli avrebbe chiesto quale ricompensa desiderasse. Il Ministero della Cultura ricorda la tavola come quella che «parlò» al santo e che fu spostata nel 1437 in una nuova cappella.","d":"Dentro la basilica, nella cappella del Crocifisso","foto":{"u":"../img/4b0972ad805f.jpg","alt":"Il cappellone del Crocifisso in San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"Il cappellone del Crocifisso in San Domenico Maggiore, dove si custodisce la tavola del miracolo."}},{"t":"La sagrestia di Solimena e le arche aragonesi","x":"La volta della sagrestia fu affrescata da Francesco Solimena nel 1709 con il Trionfo dell'Ordine domenicano. Lungo le pareti si vedono le arche sepolcrali dei sovrani aragonesi e di altri dignitari di corte.","d":"Nella sagrestia, visita del museo DOMA","foto":{"u":"../img/07519e21f0fa.jpg","alt":"La sagrestia di San Domenico Maggiore con la volta affrescata","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"La sagrestia di San Domenico Maggiore, con la volta di Francesco Solimena e le arche aragonesi."}},{"t":"La cella di San Tommaso","x":"Qui Tommaso d'Aquino visse e studiò. La cella è stata restaurata ed è visitabile insieme al museo DOMA.","d":"Nel percorso del museo","foto":{"u":"../img/f68192e11f82.jpg","alt":"La cella di San Tommaso d'Aquino con reliquiario e arredi","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"La cella di San Tommaso d'Aquino nel convento di San Domenico Maggiore."}}],"gal":[],"leg":"Si racconta che il Crocifisso dipinto su tavola, conservato nella basilica, abbia parlato a san Tommaso d'Aquino mentre pregava: gli avrebbe detto che aveva scritto bene di lui e gli avrebbe chiesto quale ricompensa desiderasse.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli and statue of the Nile","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una statua romana del dio Nilo, scambiata per secoli per una donna che allatta: il «Corpo di Napoli».","rac":"In piazzetta Nilo, lungo via San Biagio dei Librai, cioè Spaccanapoli, c'è una statua di marmo del II-III secolo d.C. che raffigura il dio del fiume Nilo: un uomo barbuto semisdraiato con una cornucopia, circondato da putti che simboleggiano i rami del fiume. La eressero i mercanti alessandrini che vivevano in questa zona, chiamata Regio Nilensis.\n\nFu ritrovata senza testa nel 1476. Così i napoletani la scambiarono per una figura femminile che allatta dei bambini, simbolo della città che nutre i suoi abitanti: da qui il nome «Corpo di Napoli», che ancora oggi dà il nome al largo. Nel 1657 fu collocata su un nuovo basamento e nello stesso secolo le fu scolpita una testa barbuta.\n\nOggi la statua è ancora al suo posto, a ricordo delle radici multiculturali di Napoli.","con":"Passaci con calma: è una tappa da cinque minuti sulla strada di Spaccanapoli. Cerca i putti sul corpo del dio: fanno capire perché fu scambiata per una donna.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"The ancient statue of the god Nile, lying down","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"The statue of the god Nile, reclining, in the small square that bears his name."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"Il dio Nilo e i putti","x":"Il dio del fiume è disteso su un fianco e tiene una cornucopia. I putti che lo circondano simboleggiano i rami del Nilo. Per chi l'ha guardata a lungo senza testa, sembrava una donna che allatta.","d":"Al centro della piazzetta","foto":{"u":"../img/83dce4234fd4.jpg","alt":"La statua del dio Nilo disteso con i putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"Il dio Nilo disteso con la cornucopia e i putti."}},{"t":"Perché «Corpo di Napoli»","x":"La statua fu ritrovata senza testa nel 1476. Per questo si pensò a una figura femminile che nutre i suoi figli: la città stessa. Il nome è rimasto al largo, anche dopo che la statua ebbe una testa nuova.","d":"Sul basamento e nel nome del largo","foto":{"u":"../img/c0e842c87218.jpg","alt":"La statua del Nilo sul suo basamento nel largo","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"La statua sul basamento di Largo Corpo di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai and its shops","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"The booksellers' and artisans' section of Spaccanapoli: shops, churches, and the Doll Hospital.","rac":"This is the stretch of Spaccanapoli that runs from Piazzetta Nilo to Via Duomo, on the lower decumanus. Its name comes from the bookshops that have always been located there: an inscription on the nearby Palazzo Marigliano commemorates the art of the master booksellers. Devotion to Saint Blaise dates back to the 8th century, when nuns from Armenia brought a relic of the saint to Naples. Also along the street is the Ospedale delle Bambole, an artisan workshop passed down from generation to generation.","con":"December is the month of nativity scene shops: be prepared for crowds on weekends.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai vista in lunghezza: una stretta strada acciottolata tra palazzi alti, con balconi, panni stesi, negozi e passanti, e in fondo la collina del Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, il tratto di Spaccanapoli più vivo di botteghe e voci."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: il vicolo stretto, i negozi e uno stendardo appeso in alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la strada stretta e dritta del decumano inferiore, con i negozi e la gente a passeggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella at the Booksellers' and the skull with ears","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"A tiny stonemason's church dedicated to the saint of eyes, and a unique skull: the one with ears.","rac":"Founded shortly before 1327 by Bartolomeo di Capua, a jurist to the Angevin kings, the church was then entrusted to the pipernieri, the stone cutters: they chose Saint Lucia, protector of sight, because the splinters from their trade put their eyes at risk.\n\nAbandoned for over thirty years, it was reopened on April 5, 2019, thanks to the Respiriamo Arte association. In its underground vault, the cult of the \"anime pezzentelle\" (sick souls) left a skull unlike any other: it has ears.","con":"It's small and can be visited in just a few minutes: perfect as a break between Sansevero and Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"The portal of Santa Luciella in the alley","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"The portal of Santa Luciella. Look up: above is the fresco with the coat of arms of the Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"The coat of arms of the Pipernieri","x":"Before entering, look up: above the piperno stone portal, there's still a fresco with the coat of arms of the piperno stone guild, the stonecutters to whom the church belonged. They worked among the chips, and for this reason, they chose Saint Lucy, the protector of sight.","d":"Above the entrance portal","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"L'affresco sopra il portale di Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"L'affresco sopra il portale di Santa Luciella, con lo stemma della corporazione dei pipernieri."}},{"t":"The skull with ears","x":"Beneath the church, in the hypogeum, there's a skull with preserved ear cartilage: this makes it unique. Popular tradition holds that, precisely because it has ears, it better hears the prayers of those who ask for a favor.","d":"In the hypogeum, with a guided tour","foto":{"u":"../img/7a5a070c0866.jpg","alt":"Il teschio con le orecchie nell'ipogeo di Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"Il teschio con le orecchie: si vedono le cartilagini mummificate ai lati del cranio."}},{"t":"The poor souls","x":"In the 17th century, after the plague, Neapolitans \"adopted\" the skulls of the nameless dead: they cleaned them, prayed for them, and asked for help in return. It was the cult of the anime pezzentelle, the poor souls. Here remains one of the city's most famous testimonies.","d":"In the hypogeum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Teschi illuminati dalla luce di una candela, con una targa «per grazia ricevuta»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Teschi nelle teche: su una targa si legge il nome di chi ha fatto la grazia, un modo di ringraziare le anime «pezzentelle»."}}],"gal":[],"leg":"It is said that the skull with ears, precisely because it has ears, listens better to prayers: for this reason, for generations, the most difficult requests have been entrusted to it.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Doll Hospital","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"A shop that has been curating dolls and toys for generations: a shop window that children, and adults, will always remember.","rac":"At the end of the 19th century, Luigi Grassi worked as a set designer for theaters and nativity scenes. Neighbors began bringing him broken dolls and toys, and his workshop became, almost by accident, the first toy \"hospital\" in Naples.\n\nToday, it's run by Tiziana, the founder's great-granddaughter, in the courtyard of Palazzo Marigliano on Via San Biagio dei Librai. Inside, it functions like a real hospital: white coats, wards, and a medical record for each patient. For many Neapolitans, it's the place where they took their favorite toy as children.","con":"The window display alone is worth the stop: it's on the way back.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"The Doll Hospital window full of dolls","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"The Doll Hospital window display: dolls and toys waiting to be \"cured.\""},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Orari di ottobre e novembre: in altri periodi possono cambiare."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Orari di ottobre e novembre: in altri periodi possono cambiare."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"A real hospital, for toys","x":"It is not a shop but a laboratory organized like a hospital: the \"doctors\" in white coats, the orthopedics, ophthalmology and tailoring departments, and the patients, dolls, teddy bears and soft toys, each with their own medical records and diagnosis.","d":"In the shop","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Teste di bambola in attesa di riparazione","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Teste, braccia e occhi di bambola in attesa di cura: nella bottega ogni pezzo ha il suo «reparto»."}},{"t":"The founder set designer","x":"It all began in the late 19th century with Luigi Grassi, a set designer for theaters and nativity scenes. Neighbors began bringing him broken toys, and he transformed the workshop into the first \"hospital.\" Today, his great-granddaughter, Tiziana, treats the patients.","d":"In the history of the shop","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"La porta della bottega dell'Ospedale delle Bambole con le vetrine","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"L'ingresso dell'Ospedale delle Bambole su via San Biagio dei Librai: la bottega aperta dalla famiglia Grassi."}},{"t":"The courtyard of Palazzo Marigliano","x":"The hospital is located in the courtyard of Palazzo Marigliano, along Spaccanapoli. As you enter the main door, the street noise fades: it's one of the many hidden courtyards in the historic center worth discovering.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"Il cortile giallo di Palazzo Marigliano con l'arco d'ingresso","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Il cortile di Palazzo Marigliano, con l'arco d'ingresso e le facciate color ocra."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, the street of nativity scenes","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Un vicolo stretto dove il Natale dura tutto l'anno: botteghe di artigiani, pastori di terracotta e presepi.","rac":"Via San Gregorio Armeno collega via dei Tribunali con via San Biagio dei Librai, cioè Spaccanapoli. È la via dei presepi: le botteghe artigiane espongono statuine e presepi tutto l'anno, anche d'estate. Secondo alcune fonti la tradizione di produrre statuette di terracotta in questa zona risale all'epoca romana; la fama del presepe napoletano divenne internazionale dal Settecento.\n\nTra le botteghe storiche ci sono Gambardella, attiva dal 1800, e i Fratelli Capuano, fondata nel 1840. Lungo la via si trova anche il monastero di San Gregorio Armeno, da cui la strada prende il nome, con la chiesa dedicata a santa Patrizia, compatrona di Napoli.\n\nIl periodo più animato va da fine novembre all'Epifania, quando la via è affollatissima.","con":"Vieni la mattina presto e nei giorni feriali: a dicembre la ressa è tanta. Cerca i pastori che raccontano l'attualità: ogni anno gli artigiani ne creano di nuovi.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"La via dei presepi, stretta e piena di botteghe","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, la strada dei presepi."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Le botteghe dei presepi","x":"Le botteghe producono pastori e presepi in terracotta e sughero, spesso dipinti a mano. Accanto alle figure tradizionali ci sono personaggi dell'attualità: ogni anno gli artigiani ne inventano di nuovi. Puoi guardare anche senza comprare: molti artigiani lavorano a vista.","d":"Lungo tutta la via","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"Un banco pieno di pastori del presepe","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Un banco della via dei pastori, tra figure tradizionali e personaggi di oggi."}},{"t":"Il monastero di San Gregorio Armeno","x":"Il monastero dà il nome alla via. La chiesa conserva un soffitto a cassettoni di Teodoro d'Errico e affreschi di Luca Giordano, come la Gloria di San Gregorio. Nel complesso c'è anche la chiesa dedicata a santa Patrizia, compatrona di Napoli.","d":"Dentro il monastero, lungo la via","foto":{"u":"../img/30ec6bba5546.jpg","alt":"La navata della chiesa di San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"La chiesa di San Gregorio Armeno, con il soffitto a cassettoni e gli affreschi."}},{"t":"Quando andare","x":"Le botteghe sono aperte tutto l'anno. Il periodo più vivo va da fine novembre all'Epifania, quando la via è piena di gente: meglio i giorni feriali e la mattina presto.","d":"Lungo tutta la via","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Via San Gregorio Armeno affollata","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno: meglio i giorni feriali e la mattina presto."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore and the Neapolis excavations","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Una chiesa gotica del Duecento che nasconde, dieci metri sotto la navata, il mercato dell'antica Neapolis: strade, botteghe e ambienti di duemila anni fa.","rac":"Piazza San Gaetano è il cuore dell'antica Neapolis. Sopra i resti del mercato greco-romano, nel Duecento, sorse la basilica gotica di San Lorenzo Maggiore, una delle chiese più antiche della città. Il complesso comprende anche il convento, il museo dell'Opera e gli scavi.\n\nGli scavi, iniziati nel 1976, hanno riportato alla luce il macellum, il mercato, che sorgeva lungo l'antico decumano maggiore. Si scende a circa dieci metri sotto la chiesa e si cammina tra strade, botteghe e ambienti di età imperiale. Sotto la chiesa sono emersi anche i resti di una basilica cristiana del VI secolo.\n\nIl museo dell'Opera, negli ambienti del convento e nella torre civica, racconta la storia di Napoli dall'età classica all'Ottocento.","con":"Scendi negli scavi: è la parte che non ti aspetti. Calcola circa tre quarti d'ora e controlla gli orari sul sito ufficiale prima di venire.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"La facciata di San Lorenzo Maggiore su piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, affacciata su piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Orario indicato dalla scheda del Ministero della Cultura e da fonti turistiche; il sito ufficiale non è stato leggibile: controllare prima di scrivere come certo."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"Il mercato sotto la chiesa","x":"Gli scavi mostrano il macellum della Neapolis greco-romana, il mercato che sorgeva lungo l'antico decumano maggiore. Si trovano a circa dieci metri sotto la chiesa. Camminando tra le strutture si riconoscono la strada e gli ambienti dove si vendeva e si commerciava: è un pezzo di città antica ancora al suo posto, sopra cui Napoli ha continuato a costruire.","d":"Sotto la navata, negli scavi","foto":{"u":"../img/ab890c42a731.jpg","alt":"Una strada romana negli scavi sotto San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Gli scavi sotto San Lorenzo Maggiore: la strada e le botteghe della città antica."}},{"t":"L'altare maggiore di Giovanni da Nola","x":"L'altare maggiore è un'opera rinascimentale dello scultore napoletano Giovanni da Nola, tra le più belle di Napoli. L'abside che lo ospita è la parte più antica della chiesa.","d":"In fondo alla chiesa, nell'abside","foto":null},{"t":"Il museo dell'Opera","x":"Il museo occupa gli ambienti del convento e la torre civica accanto alla basilica. Espone arredi, costumi e collezioni e presenta la storia di Napoli dall'età classica all'Ottocento.","d":"Nel convento, accanto alla basilica","foto":{"u":"../img/591ff764e679.jpg","alt":"Una sala del museo nel complesso di San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Gli ambienti del convento di San Lorenzo Maggiore che ospitano il museo dell'Opera."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, the church of the capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"The Church of the capuzzelle: beneath the floor, the hypogeum where Naples prayed for nameless souls. And Lucia's skull.","rac":"Neapolitans call it \"'e cape 'e morte,\" the church of the death's heads. It's a small 17th-century church on the main decumanus, linked to the devotion to the souls in Purgatory spread by the Counter-Reformation. A steep staircase leads to the hypogeum, the underground church, expanded and decorated with majolica in the 18th century: here, devotees cared for anonymous remains and sought their intercession. At the end of a small corridor, the skull of Lucia, a particularly beloved young soul, is kept.","con":"Behind the altar, look for the marble winged skull by Dionisio Lazzari: it is the symbol of the church.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"The facade of the Purgatorio ad Arco on Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"The facade of the Purgatorio ad Arco, on the main decumanus."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Chiesa alta, ipogeo e museo. Visite guidate incluse nel biglietto, con prenotazione."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Chiesa alta, ipogeo e museo."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"The paintings of the seventeenth century","x":"Before descending, take a look at the church above: it houses precious marbles and paintings by three 17th-century Neapolitan masters: Massimo Stanzione, Luca Giordano, and Andrea Vaccaro. It's the \"upper\" part of a place that thrives primarily on what lies beneath.","d":"In the upper church","foto":{"u":"../img/a8b34654121a.jpg","alt":"Un sepolcro di marmo del Seicento nella chiesa superiore","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"Nella chiesa superiore: il sepolcro di Pietro Antonio Mastrilli (1607), tra i marmi e i dipinti del Seicento."}},{"t":"The Winged Skull","x":"Among the church's decorations is a skull with wings, the work of Dionisio Lazzari: an image that sums up the spirit of the place, where death is not feared but becomes an opportunity for prayer and connection with those who are no longer with us.","d":"In the upper church","foto":{"u":"../img/63d1e885c193.jpg","alt":"Un bassorilievo di marmo con un teschio alato e coronato","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"Il teschio alato e coronato in bassorilievo di marmo, prima metà del Seicento: il simbolo della chiesa."}},{"t":"The Hypogeum of Souls","x":"The true church is the underground one: a large space where even today devotees care for nameless human remains and ask for their protection. It was enlarged and decorated with majolica tiles in the 18th century. Descend slowly: it is a place of living devotion, not just curiosity.","d":"Under the church, going down a steep staircase","foto":{"u":"../img/7fc480d05134.jpg","alt":"L'ipogeo del Purgatorio ad Arco con altari e lumini","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"L'ipogeo, la chiesa di sotto: altari, lumini e le testimonianze del culto delle anime."}},{"t":"Lucia's skull","x":"Among all the skulls in the hypogeum, one is particularly beloved: that of Lucia, believed to be the soul of a young woman. It is kept at the end of a small corridor and is the most touching testimony to the cult of the souls in Purgatory.","d":"In the hypogeum, at the end of a small corridor","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"An image of the souls in Purgatory among the flames inside the church","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Inside the church: the souls of Purgatory in the flames, the theme of the entire place."},{"u":"../img/de63b1b83fa8.jpg","alt":"A bronze skull on a small column","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"A bronze skull: the symbol of the \" capuzzelle \" church."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Forty meters below Via dei Tribunali: the cisterns that for centuries provided water to Naples, war shelters, and a Roman theater hidden under a bed.","rac":"Beneath the historic center lies another city. From Piazza San Gaetano, you descend over one hundred steps to a depth of about 40 meters, along a path that passes through a Greco-Roman aqueduct and tunnels from the medieval, Bourbon, and modern eras.\n\nThe Greek-era caves were used as cisterns for the city's water supply for approximately 23 centuries. During the Second World War, the same spaces became air raid shelters.\n\nThe underground tour is guided and lasts about an hour. Then you return to the surface for the final surprise: the remains of the Greco-Roman theater of Neapolis, incorporated into the neighborhood's houses since the 15th century. You enter a \"basso,\" a ground-floor house, move a bed, and descend through a trapdoor into the theater's walls.","con":"Low shoes and a sweatshirt are recommended, even in summer: it's humid underground. The short, narrow passage with the candle is optional. Reservations are required for groups of 10 or more.","acc":"Not suitable for wheelchairs or walkers: there are stairs, with handrails, and narrow passages.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"A large underground cistern dug into the tuff, dimly lit","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"One of the large cisterns dug into the tuff, about 40 meters below Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Guided tours depart every hour from 10:00 am to 6:00 pm, in Italian and English. Also available on Thursdays at 9:00 pm, by reservation only and for groups of at least 10 people."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"The Greco-Roman cisterns","x":"The Greek-era rooms, dug into the tuff, were Naples' water cisterns for approximately 23 centuries, connected by the Greco-Roman aqueduct.","d":"In the first part of the visit, at about 40 meters depth","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"The tuff walls of an underground cistern","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"The tuff walls of a cistern: for approximately 23 centuries, the city's water was collected here."}},{"t":"The passage with the candle","x":"A very short, narrow section is walked with a candle in hand. This is optional: those who prefer can skip it, and instead use a phone flashlight.","d":"Along the underground path","foto":{"u":"../img/a874f33cc5df.jpg","alt":"A very narrow tunnel illuminated in the tuff","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"One of the very narrow tunnels dug into the tuff."}},{"t":"The shelters of war","x":"During the Second World War these underground rooms were used as air-raid shelters: here the city took shelter from bombings.","d":"Along the underground path","foto":{"u":"../img/0f4490838101.jpg","alt":"World War II artifacts displayed underground","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Memories of the war: objects from when these rooms were air-raid shelters."}},{"t":"The theater under the bed","x":"The remains of the Greco-Roman theater of Neapolis were incorporated into modern-day homes in the 15th century. You enter a basement, move the bed, and through a trapdoor, descend into the theater's walls.","d":"Second part of the visit, on the surface between Via Anticaglia and Vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"Gli archi in mattoni che scavalcano via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Gli archi di via Anticaglia: sono resti del teatro romano di Neapolis, inglobato nelle case."}}],"gal":[],"leg":"According to the story of the visit, Nero had his dressing rooms in the hidden rooms under the lower floor when he came to Naples to perform in the theatre.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Due colonne romane alte undici metri sorreggono ancora la facciata: sono ciò che resta del tempio dei Dioscuri.","rac":"Su piazza San Gaetano, nel cuore del centro antico, una scalinata porta a una facciata sostenuta da due colonne corinzie alte circa undici metri. Sono ciò che resta del tempio dei Dioscuri, costruito tra il I e il II secolo d.C. e considerato l'edificio antico più importante di Napoli.\n\nUna prima chiesa di San Paolo fu costruita qui tra l'VIII e il IX secolo; poi i Teatini la ricostruirono, dal secondo Cinquecento. Il terremoto del 1688 abbatté gran parte del tempio antico; l'architetto Arcangelo Guglielmelli inglobò le colonne rimaste nella nuova facciata. I bombardamenti del 1943 danneggiarono l'interno, ma gran parte delle decorazioni si salvò.\n\nQui è sepolto san Gaetano Thiene, fondatore dei Teatini.","con":"Guarda le colonne da vicino, poi entra: la sagrestia affrescata da Solimena è tra le parti più belle. Gli orari di apertura cambiano: controlla prima.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Le colonne corinzie del tempio romano sulla facciata di San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Le colonne corinzie del tempio dei Dioscuri sulla facciata di San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Le colonne del tempio dei Dioscuri","x":"Le due colonne corinzie in facciata, alte circa undici metri, sono ciò che resta del tempio dei Dioscuri. Dopo il terremoto del 1688 l'architetto Arcangelo Guglielmelli le inglobò nella nuova facciata. Sopra la scalinata, le statue di San Pietro e San Paolo furono scolpite da Andrea Falcone nel 1671.","d":"Sulla facciata, in cima alla scalinata","foto":{"u":"../img/951355b4bf10.jpg","alt":"La facciata di San Paolo Maggiore con le colonne antiche","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"La facciata di San Paolo Maggiore, con le colonne del tempio dei Dioscuri."}},{"t":"La tomba di san Gaetano","x":"In questa basilica è sepolto san Gaetano Thiene, fondatore dei Teatini, l'ordine che ricostruì la chiesa dal secondo Cinquecento. Il santuario a lui dedicato fa parte della pianta della chiesa.","d":"Dentro la basilica","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"Il santuario di San Gaetano Thiene nella basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr
