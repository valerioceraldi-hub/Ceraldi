o","x":"Sotto la basilica si trovano le catacombe di San Gaudioso, del IV secolo. Vi si accede dalla chiesa.","d":"Sotto la basilica","foto":{"u":"../img/30e6de57bd17.jpg","alt":"Le catacombe di San Gaudioso sotto la basilica","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Le catacombe di San Gaudioso, sotto la basilica."}},{"t":"Totò e i murales","x":"Nelle vie vicine, e in via Santa Maria Antesaecula dove nacque Totò, murales e piccole immagini ricordano l'attore e le storie del rione.","d":"Nei vicoli attorno alla piazza","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacombs of San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Le catacombe più vaste del Sud Italia: gallerie nel tufo su due livelli e la tomba originaria di san Gennaro, patrono di Napoli.","rac":"Le Catacombe di San Gennaro si trovano nel Rione Sanità, con ingresso in via Capodimonte 13, accanto alla basilica del Buon Consiglio. L'origine risale al II secolo d.C., quando una ricca famiglia romana donò il proprio sepolcro alla comunità cristiana. Il complesso si sviluppa su due livelli, scavati nel tufo: San Gennaro superiore e San Gennaro inferiore.\n\nQui fu sepolto san Gennaro, e per secoli il luogo fu meta di pellegrinaggio. Fino al IX secolo le sue reliquie restarono qui; poi furono portate via e il sito fu abbandonato. Oggi si visita solo con una guida, per circa un'ora. Dal 2009 un impianto a LED, realizzato dalla cooperativa di giovani del rione Officina dei Talenti, illumina gli affreschi con una luce soffusa.\n\nIl sito è gestito dalla cooperativa sociale La Paranza, nata da giovani del Rione Sanità.","con":"Prenota in anticipo: le visite sono solo guidate, partono ogni ora e la prenotazione è obbligatoria. Il Miglio Sacro, un percorso guidato nel Rione Sanità, parte alle 9:30 il sabato, la domenica e i festivi. Le catacombe sono chiuse il mercoledì.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"Un affresco paleocristiano nelle Catacombe di San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Un affresco paleocristiano nelle Catacombe di San Gennaro."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Visite guidate ogni ora, prenotazione sempre obbligatoria. Chiuso il mercoledì e il 25 dicembre."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"La tomba di san Gennaro","x":"È la tomba che dà il nome a tutto il sistema di catacombe: qui fu sepolto il patrono di Napoli. Le sue reliquie vi restarono fino al IX secolo.","d":"Nel percorso guidato","foto":{"u":"../img/fd273aee226d.jpg","alt":"La tomba di san Gennaro nelle catacombe","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"La tomba di san Gennaro, il luogo che dà il nome alle catacombe."}},{"t":"I due livelli","x":"Le gallerie sono scavate nel tufo su due piani, il superiore e l'inferiore, con grandi passaggi e affreschi paleocristiani.","d":"Lungo la visita guidata","foto":{"u":"../img/537a160d9acb.jpg","alt":"Una galleria scavata nel tufo con le tombe nelle pareti","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Le gallerie delle catacombe, scavate nel tufo."}},{"t":"Il Miglio Sacro","x":"Il sabato, la domenica e i festivi un percorso guidato di circa tre ore tocca i luoghi legati a san Gennaro nel Rione Sanità. Parte alle 9:30 e va prenotato sul sito ufficiale.","d":"Dal punto di ritrovo delle catacombe","foto":{"u":"../img/0becd922c42f.jpg","alt":"La facciata di un palazzo del Rione Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"Il Rione Sanità, dove il Miglio Sacro segue i luoghi legati a san Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Fontanelle Cemetery","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"A tuff quarry as large as a cathedral, thousands of nameless skulls, and the cult of the \"souls pezzentelle.\" Reopened in 2026.","rac":"In the 16th century, it was a tuff quarry in the Sanità Valley. Many victims of the plague of 1656 were brought there, followed by those of the cholera epidemic of 1836-1837. In 1872, Canon Gaetano Barbati arranged the remains in three large naves. The space is approximately four thousand square meters.\n\nThe cult of the \"anime pezzentelle\" (peaceful souls) was born here: devotees would adopt a skull, a capuzzella, care for it, and pray to it, hoping for protection in return, sometimes a dream involving lottery numbers. In 1969, a decree from the ecclesiastical court closed the ossuary and banned the cult. Closed for renovations since 2020, it reopened to the public in 2026, managed by the La Paranza cooperative.","con":"It's closed on Wednesdays. Download the cemetery app before you arrive: the phone signal inside is weak.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"Le grandi gallerie in tufo del Cimitero delle Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Le gallerie in tufo del Cimitero delle Fontanelle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Closed on Christmas Day. Monday and Friday 9–10 a.m. open only for worship."}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Una cava grande come una cattedrale","x":"Il cimitero occupa una vecchia cava di tufo di circa quattromila metri quadrati, sistemata in tre grandi navate nel 1872 dal canonico Gaetano Barbati. Vi furono portati i morti della peste del 1656 e del colera del 1836-1837.","d":"Nelle tre navate","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"Una navata del Cimitero delle Fontanelle scavata nel tufo","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"Una delle tre navate del Cimitero delle Fontanelle, nella vecchia cava di tufo."}},{"t":"Il culto delle anime pezzentelle","x":"I devoti adottavano un teschio, la capuzzella, lo curavano e lo pregavano, aspettando in cambio protezione, a volte un sogno con i numeri del lotto. Nel 1969 il tribunale ecclesiastico vietò il culto e chiuse l'ossario.","d":"Davanti alle file di teschi","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"File di teschi con una croce","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Le capuzzelle: teschi senza nome, adottati e curati dai devoti."}},{"t":"Le Fontanelle al MADRE","x":"L'artista Rebecca Horn ha riprodotto in ghisa alcune capuzzelle delle Fontanelle nell'opera «Spirits», che si vede al museo MADRE: un modo per capire come il cimitero sia entrato anche nell'arte contemporanea.","d":"Al museo MADRE (scheda separata)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Charterhouse and Museum of San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Un monastero certosino diventato museo, sulla collina del Vomero: chiostro barocco, presepe Cuciniello e uno dei panorami più belli sul golfo.","rac":"La Certosa di San Martino sorge sulla collina del Vomero, accanto a Castel Sant'Elmo. Fu fondata nel 1325 da Carlo di Calabria, figlio del re Roberto d'Angiò, e affidata a Tino di Camaino. Tra il Cinquecento e il Settecento divenne uno dei più raffinati esempi di arte barocca italiana: dal 1623 al 1656 Cosimo Fanzago ne rinnovò gli ambienti. Dal 1866, dopo la soppressione degli ordini religiosi, ospita il Museo nazionale di San Martino, voluto da Giuseppe Fiorelli.\n\nIl Chiostro Grande, ampliato dal 1581 da Giovanni Antonio Dosio e completato da Fanzago, ha al centro il cimitero dei monaci. Il museo custodisce la principale raccolta pubblica italiana dedicata al presepe napoletano, con il grandioso Presepe Cuciniello: circa ottocento pastori, animali e accessori donati dal collezionista Michele Cuciniello, inaugurato nel 1879. Altre sezioni raccontano la marineria del Regno, il teatro, la città e il Regno nelle immagini e, dal dicembre 2025, l'Ottocento a Napoli. Qui si trova anche la Tavola Strozzi, considerata il primo dipinto di Napoli.","con":"Esci sulle terrazze e sulla Loggia del Priore: da qui si vede tutto il golfo. È aperta tutti i giorni tranne il martedì; l'ultimo ingresso è alle 17:30.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"Il chiostro grande della Certosa di San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"Il chiostro grande della Certosa di San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Chiuso il martedì. Alcune sezioni (navale, presepiale, Ottocento a Napoli) aprono alle 9:30; i giardini chiudono un'ora prima."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"Il Chiostro Grande","x":"Ampliato dal 1581 da Giovanni Antonio Dosio e completato da Cosimo Fanzago, ha al centro il cimitero dei monaci. Lungo il perimetro si vedono ancora le porte e i passavivande delle celle dei certosini.","d":"Nel cuore della Certosa","foto":{"u":"../img/e43efae68626.jpg","alt":"Il Chiostro Grande della Certosa con il cimitero dei monaci","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"Il Chiostro Grande della Certosa di San Martino, con al centro il piccolo cimitero dei monaci."}},{"t":"Il Presepe Cuciniello","x":"Con circa ottocento pezzi è il presepe più famoso di Napoli. Fu donato da Michele Cuciniello e inaugurato nel 1879. Un impianto luminoso simula le ore del giorno.","d":"Nella sezione presepiale, dove erano le cucine","foto":{"u":"../img/ae5327fcce50.jpg","alt":"Il grande presepe con centinaia di figure","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"Il Presepe Cuciniello, con circa ottocento pezzi."}},{"t":"La vista sul golfo","x":"Dalle terrazze e dai giardini della Certosa si vede tutto il golfo di Napoli, con il Vesuvio sullo sfondo.","d":"Sulle terrazze e nei giardini","foto":{"u":"../img/81d0fb825e80.jpg","alt":"Il golfo di Napoli visto da un balcone della Certosa","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"Il golfo e il Vesuvio da un balcone della Certosa di San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant'Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La fortezza a stella sulla collina del Vomero: bastioni con vista a 360° su Napoli e sul golfo, e dentro il Museo Novecento.","rac":"Castel Sant'Elmo domina il Vomero a circa 250 metri sul livello del mare ed è visibile da quasi tutta la città. Le prime notizie lo indicano, intorno al 1275, come una residenza fortificata angioina chiamata Belforte; nel 1329 Roberto d'Angiò ne volle l'ampliamento, affidato a Tino di Camaino. La pianta a stella a sei punte è invece il risultato della ricostruzione cinquecentesca voluta tra il 1537 e il 1547 dal viceré Pedro de Toledo, su progetto dell'architetto militare Pedro Luis Escrivà.\n\nNel corso dei secoli fu spesso un carcere: vi furono rinchiusi Tommaso Campanella e, più tardi, patrioti della Repubblica napoletana del 1799 come Gennaro Serra, Mario Pagano e Luisa Sanfelice. Dopo essere stato presidio borbonico fu carcere militare fino al 1952; un grande restauro è iniziato nel 1976.\n\nSulla piazza d'armi, dal 2010, c'è il Museo Novecento a Napoli: oltre 170 opere di circa 90 artisti napoletani o attivi in città tra il 1910 e il 1980. Alcune opere sono state create apposta per il castello: nella grande cisterna Gian Maria Tosatti ha fatto crescere un campo di grano, e sugli spalti si staglia la scultura in alluminio «Sant'Elmo» di Mimmo Paladino.\n\nDai bastioni il panorama arriva dalle isole al Vesuvio, dai Campi Flegrei ai monti del Matese.","con":"Sali verso il tramonto per il panorama. Il castello è accanto alla Certosa di San Martino: si possono visitare nella stessa mattinata. Il castello è chiuso il martedì e, con il maltempo, può restare chiuso.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Le alte mura in tufo di Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Le mura di Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castello 8:30-19:30; Museo Novecento 9:30-18:30 (ultimo ingresso 17:30). Chiuso il martedì. Con maltempo il sito può restare chiuso."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"I bastioni e il panorama","x":"I bastioni offrono un panorama a 360° sulla città, sul golfo, sul Vesuvio e sulla costa di Posillipo, tra i più completi di Napoli.","d":"Sugli spalti","foto":{"u":"../img/81edfbd30506.jpg","alt":"Napoli e il Vesuvio visti dall'alto di Castel Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Dai bastioni di Castel Sant'Elmo: la città, il porto e il Vesuvio."}},{"t":"Il Museo Novecento a Napoli","x":"Aperto nel 2010 sulla piazza d'armi, raccoglie oltre 170 opere di circa 90 artisti napoletani o attivi in città, realizzate dal 1910 in poi: dal Futurismo alla Transavanguardia degli anni Ottanta.","d":"Sulla piazza d'armi del castello","foto":{"u":"../img/d585126c2db4.jpg","alt":"Una sala del Museo Novecento con opere d'arte","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Una sala del Museo Novecento a Napoli, dentro Castel Sant'Elmo."}},{"t":"Un campo di grano nella cisterna","x":"L'opera «My dreams, they'll never surrender» di Gian Maria Tosatti (2014) è un campo di grano cresciuto nella cisterna, il luogo più buio e profondo del castello, che fu anche carcere.","d":"Nella grande cisterna","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Your first walk","sub":"Spaccanapoli in half a day, starting from Ceraldi","desc":"The heart of the historic center in a circular walk: the Gesù Nuovo and its mystery, the cloister of Santa Chiara, the Veiled Christ, the Church of the Skull and Ears, the shops of Via San Biagio dei Librai. And then we return to us.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli seen from above: a straight street that cuts through the historic center","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli seen from above: the long, straight street that bisects the historic center. The first tour is on foot."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"A coffee at Ceraldi and off we go.","q":null,"alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","q":null,"alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14 pe a oggi, in tredici capitoli","som":"Prima di partire, ventotto secoli in dieci minuti: la leggenda della sirena, i Greci, Roma, i re, la rivolta, la guerra e la città di oggi.","txt":"Napoli è una delle città più antiche d'Europa: la sua storia si estende per circa tremila anni, e il centro storico che stai per attraversare conserva ancora la pianta delle strade disegnata dai Greci. Per oltre mezzo millennio è stata la capitale dell'Italia del Sud.\n\nQuesti tredici capitoli ti accompagnano dalla leggenda alla città di oggi. Ogni volta che il racconto incontra un luogo della guida, trovi un pulsante per andarci.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"Castel dell'Ovo in una veduta del 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in una veduta del 1841: l'isolotto dove nacque Partenope."},"cap":[{"p":"La leggenda","t":"La sirena Partenope","x":"Tutto comincia con una sirena. Nel mito greco le sirene erano creature con il corpo di uccello e la testa di donna, padrone di un canto magico. Una di loro si chiamava Partenope.\n\nIl racconto più famoso dice che, quando Ulisse passò davanti al loro scoglio senza cedere al canto, le sirene per il dolore si gettarono in mare. Le onde portarono il corpo di Partenope sulla costa, alla foce di un piccolo fiume, il Sebeto: proprio dove sarebbe nata la città.\n\nLì le fu costruita una tomba e i Greci di Napoli le dedicavano ogni anno sacrifici e una corsa con le fiaccole. Ancora oggi i napoletani si chiamano «partenopei».","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"La fontana con la sirena Partenope in piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"La fontana della Sirena in piazza Sannazaro: Partenope con la lira."}},{"p":"VIII–VII secolo a.C.","t":"Partenope, la prima città","x":"La leggenda ha un fondo di verità. Tra l'VIII e il VII secolo a.C. i Greci di Cuma, la più antica colonia greca della zona, fondarono un piccolo scalo sul mare e lo chiamarono come la sirena: Partenope.\n\nSorgeva sulla collina di Pizzofalcone, il Monte Echia, su uno sperone circondato dal mare, e aveva il suo approdo sull'isolotto di Megaride, dove oggi c'è Castel dell'Ovo. Il porto era nell'attuale piazza Municipio. La necropoli di Partenope è stata scoperta nel 1949 in via Nicotera.\n\nLa piccola città crebbe così in fretta che Cuma, per paura di perdere il comando, ne ridusse il ruolo.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."}},{"p":"V secolo a.C.","t":"Neapolis, la città nuova","x":"Accanto a Partenope, poco più a est, i Cumani fondarono una città nuova: Neapolis, la «città nuova». L'UNESCO data la fondazione al 470 a.C. circa, nel periodo in cui i Greci avevano sconfitto gli Etruschi sul mare.\n\nNeapolis fu costruita secondo un disegno regolare: tre strade principali parallele (le «plateiai», poi chiamate decumani), incrociate ad angolo retto da strade più piccole. L'agorà, la piazza principale, era dov'è oggi piazza San Gaetano.\n\nQuel reticolo è ancora lì: Spaccanapoli, via dei Tribunali e via Anticaglia sono le tre strade greche. Camminandoci, cammini nella pianta della città di 2.500 anni fa.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"I grandi blocchi di tufo delle mura greche, scavate sotto il livello della strada","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"I blocchi di tufo delle mura greche di Neapolis, in piazza Bellini, visibili in uno scavo sotto il livello della strada."}},{"p":"326 a.C. – V secolo d.C.","t":"Greca sotto Roma","x":"Nel 326 a.C. Neapolis si alleò con Roma e restò per secoli una città greca dentro il mondo romano: fu tra le poche a conservare la lingua e la cultura greca. Diventò un luogo amato dai Romani colti e ricchi, che costruivano ville sul golfo: sull'isolotto di Megaride sorse quella di Lucio Licinio Lucullo.\n\nNel 79 d.C. l'eruzione del Vesuvio distrusse Pompei ed Ercolano, poco lontano. Nel 476, proprio nella villa di Lucullo, fortificata, fu rinchiuso Romolo Augusto, l'ultimo imperatore romano d'Occidente: con lui finiva l'Impero.\n\nSotto la città greco-romana scorreva già l'acqua delle cisterne che oggi visiti a Napoli Sotterranea, e nel teatro di Neapolis si esibì l'imperatore Nerone.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."}},{"p":"VI–XII secolo","t":"Il ducato di Napoli","x":"Dopo la fine dell'Impero, nel VI secolo, Napoli passò ai Bizantini, i Romani d'Oriente. Poco a poco diventò un ducato quasi indipendente: nell'VIII secolo il duca Stefano II se ne fece signore di fatto.\n\nPer cinque secoli il ducato resistette a Longobardi e Saraceni. Nel 1030 il duca Sergio IV diede la contea di Aversa a un gruppo di mercenari normanni: fu l'inizio della loro ascesa nel Sud. Nel 1137 Napoli si sottomise ai Normanni ed entrò nel nuovo Regno di Sicilia.\n\nDi quegli anni lontani restano le chiese più antiche, come Santa Restituta e il battistero di San Giovanni in Fonte dentro il Duomo, considerato il più antico d'Occidente.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"L'interno della basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, la basilica paleocristiana inglobata nel Duomo: la Napoli prima del ducato."}},{"p":"1194–1266","t":"Normanni e Svevi: nasce l'Università","x":"Dopo i Normanni arrivarono gli Svevi. Nel 1194 l'imperatore Enrico VI occupò la città e ne fece abbattere le mura.\n\nSuo figlio, Federico II, era un sovrano appassionato di cultura e di diritto. Nel 1224 fondò a Napoli lo «Studio», una delle prime università statali d'Europa: è l'attuale Università Federico II, che porta ancora il suo nome.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La statua di Federico II di Svevia nella facciata del Palazzo Reale","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statua di Federico II di Svevia, tra quelle della facciata del Palazzo Reale."}},{"p":"1266–1442","t":"Gli Angioini: Napoli capitale","x":"Nel 1266 il papa affidò il regno a Carlo I d'Angiò, fratello del re di Francia, che entrò in città in trionfo. Dopo la rivolta dei Vespri siciliani del 1282, la Sicilia si staccò e Napoli diventò la capitale del regno: lo resterà per secoli.\n\nGli Angioini costruirono il Castel Nuovo, il Duomo (dal 1294) e la cittadella di Santa Chiara (dal 1310), e la città si allargò. Alla corte di Roberto d'Angiò, nel Castel Nuovo, soggiornarono Giotto, Petrarca e Boccaccio.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."}},{"p":"1442–1503","t":"Gli Aragonesi","x":"Nel 1442 Alfonso d'Aragona conquistò Napoli: secondo la tradizione i suoi uomini entrarono in città passando per un acquedotto. Fece del Castel Nuovo la sua reggia, lo ricostruì e per celebrare la vittoria vi aggiunse il grande Arco di Trionfo tra due torri.\n\nGli Aragonesi trasformarono il castello medievale in una fortezza moderna e rinnovarono le difese e le strade della città. Il figlio Ferrante sconfisse i baroni ribelli: la porta di bronzo del castello racconta quella guerra, e nella Sala dei Baroni si consumò la sua vendetta.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi: Napoli aragonese vista dal mare, con il Maschio Angioino e Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (XV secolo): Napoli vista dal mare, con il porto, il Castel Nuovo e, in alto, il colle di Sant'Elmo."}},{"p":"1503–1707","t":"Il viceregno spagnolo","x":"Dal 1503 Napoli passò alla Spagna e fu governata da un viceré. Senza un re presente, era comunque una capitale imperiale, con una delle corti più grandiose dei domini spagnoli. Il viceré don Pedro di Toledo raddoppiò la città, aprì via Toledo e costruì i quartieri per i soldati, i Quartieri Spagnoli. In questi anni fu costruito anche il Palazzo Reale.\n\nNel 1606 arrivò a Napoli, in fuga da Roma, Caravaggio: la sua pittura cambiò l'arte della città, che nel Seicento diventò una delle capitali del barocco europeo.\n\nFurono anche anni durissimi: tasse altissime, l'eruzione del Vesuvio del 1631 e, nel 1656, una peste che uccise più della metà degli abitanti.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste del 1656: corpi ammassati nella piazza e figure celesti in cielo","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste del 1656, dipinto da Micco Spadaro: la piazza è piena di morti e di moribondi."}},{"p":"1647","t":"Masaniello","x":"Il 7 luglio 1647, dopo l'ennesima tassa, questa volta sulla frutta, il cibo dei più poveri, un pescatore di 27 anni, Masaniello, guidò il popolo in rivolta al grido di «Viva il re di Spagna, mora il malgoverno».\n\nIn dieci giorni gli spagnoli dovettero accettare le richieste del popolo. Ma Masaniello, accusato di pazzia e tradito da una parte degli stessi rivoltosi, fu assassinato. La rivolta continuò per mesi contro la Spagna, prima di essere domata nel 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"Un dipinto del Seicento con la folla in rivolta in piazza Mercato","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Piazza del Mercato durante la rivolta di Masaniello, dipinto di Domenico Gargiulo detto Micco Spadaro."}},{"p":"1734–1799","t":"I Borbone e la Repubblica","x":"Nel 1734 Carlo di Borbone riportò a Napoli un re tutto suo e volle farne una grande capitale europea. Nel 1737 fece costruire in soli sette mesi il Teatro di San Carlo; poi le regge di Portici e di Capodimonte. In quegli anni cominciarono anche gli scavi di Ercolano e di Pompei.\n\nNapoli era una delle capitali dell'Illuminismo. Nel gennaio 1799, con l'arrivo dell'esercito francese, i patrioti proclamarono la Repubblica Napoletana: durò solo fino a giugno. Al ritorno dei Borbone molti dei suoi protagonisti furono giustiziati.\n\nDopo gli anni dei Francesi (Giuseppe Bonaparte e Gioacchino Murat), nel 1815 tornarono i Borbone, e nel 1816 nacque il Regno delle Due Sicilie.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Ritratto di Carlo di Borbone in armatura","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Carlo di Borbone ritratto da Anton Raphael Mengs."}},{"p":"1860–1945","t":"L'Italia unita e la guerra","x":"Il 7 settembre 1860 Giuseppe Garibaldi entrò a Napoli acclamato dalla folla; un plebiscito sancì l'unione al Regno d'Italia. Napoli smise di essere una capitale, e la perdita fu pesante.\n\nNella Seconda guerra mondiale la città subì più di 120 bombardamenti aerei, soprattutto per il suo porto; la gente si rifugiava nelle cisterne sotterranee. Dopo l'armistizio, i tedeschi occuparono la città. Alla fine di settembre 1943 i napoletani insorsero: nelle «Quattro giornate di Napoli» il popolo costrinse alla resa il presidio tedesco. Il 1° ottobre arrivarono gli Alleati.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Un'incisione d'epoca: Garibaldi acclamato dalla folla a Napoli","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Incisione d'epoca dell'ingresso di Garibaldi a Napoli, nel 1860: la folla lo acclama in via Toledo."}},{"p":"Dal 1945 a oggi","t":"La Napoli di oggi","x":"Dopo la guerra la città si ricostruì tra grandi difficoltà. Nel 1995 il centro storico è stato iscritto dall'UNESCO tra i Patrimoni dell'Umanità: è il più grande d'Italia e uno dei più vasti d'Europa.\n\nDal 2001 la metropolitana ha aperto le sue «stazioni dell'arte», con opere di artisti contemporanei. La città conta circa 950.000 abitanti, più di tre milioni con l'area metropolitana.\n\nE poi c'è la Napoli che vedrai camminando: i murales, come quello di Maradona nei Quartieri Spagnoli, e la Madonna di Banksy, la vita dei vicoli, il caffè. Tremila anni di storia, uno sopra l'altro, in pochi chilometri.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Il centro storico di Napoli visto dall'alto","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Il centro storico visto dall'alto: dal 1995 Patrimonio dell'Umanità UNESCO."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio a Napoli","sub":"Un pittore in fuga e tre capolavori da vedere","som":"In fuga da Roma, Caravaggio trovò rifugio a Napoli due volte. Qui dipinse le Sette opere di Misericordia, la Flagellazione e il suo ultimo quadro.","txt":"Michelangelo Merisi, detto Caravaggio, era a Roma un pittore famoso e discusso. Negli ultimi giorni di maggio del 1606 ferì a morte Ranuccio Tomassoni in una rissa nata durante una partita a racchetta: condannato, dovette fuggire.\n\nNapoli, allora una delle città più grandi d'Europa, fu il suo rifugio due volte: dall'autunno 1606 all'estate 1607, e poi dall'autunno 1609 all'estate 1610. Qui trovò la protezione della famiglia Colonna e committenti ricchi, e qui la sua pittura cambiò per sempre l'arte della città.\n\nTre delle sue opere si possono vedere oggi a Napoli, due delle quali sul nostro percorso.","foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia, dipinte da Caravaggio a Napoli."},"cap":[{"p":"1606–1607","t":"Il primo soggiorno e le Sette opere","x":"Il primo incarico napoletano documentato è dell'ottobre 1606. Pochi mesi dopo, entro il 9 gennaio 1607, Caravaggio consegnò al Pio Monte della Misericordia la grande tela delle Sette opere di Misericordia, pagata 400 ducati.\n\nÈ ancora lì, sull'altare per cui fu dipinta, in via dei Tribunali: una notte in un vicolo di Napoli, dove gli uomini si aiutano tra loro sotto lo sguardo della Madonna.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"p":"1607","t":"La Flagellazione","x":"Per la famiglia de Franchis, giuristi e magistrati, Caravaggio dipinse nel 1607 la Flagellazione di Cristo, per la loro cappella nella chiesa di San Domenico Maggiore: una tela alta quasi tre metri, uno dei capolavori del barocco napoletano.\n\nOggi l'originale è al Museo di Capodimonte, dove fu trasferito per motivi di sicurezza; in San Domenico Maggiore è rimasta una copia. Capodimonte è fuori dai nostri giri a piedi.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La Flagellazione di Cristo di Caravaggio: Gesù legato alla colonna tra i carnefici","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellazione di Cristo (1607), oggi al Museo di Capodimonte: la luce cade sul corpo di Gesù, legato alla colonna."}},{"p":"1607–1609","t":"Malta e la Sicilia","x":"Il 12-13 luglio 1607 Caravaggio arrivò a Malta, probabilmente su una galea dei Cavalieri partita da Napoli. Ma anche lì finì nei guai: dopo una rissa fu arrestato nell'agosto 1608, fuggì dal forte in cui era rinchiuso e riparò in Sicilia, a Siracusa.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"La Decollazione di san Giovanni Battista di Caravaggio","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"La Decollazione di san Giovanni Battista, dipinta da Caravaggio a Malta e conservata a La Valletta."}},{"p":"Ottobre 1609","t":"L'agguato del Cerriglio","x":"Nell'autunno 1609 tornò a Napoli, ancora sotto la protezione dei Colonna, sperando nel perdono del papa per poter rientrare a Roma.\n\nIn ottobre fu aggredito da quattro uomini davanti all'osteria del Cerriglio, una locanda famosa del tempo, e sfregiato al volto: la ferita fu così grave che a Roma si sparse la voce della sua morte.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Ritratto a gessetto di Caravaggio","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio nel ritratto di Ottavio Leoni, il volto dell'uomo aggredito al Cerriglio."}},{"p":"1610","t":"L'ultimo quadro","x":"Nella primavera del 1610 dipinse per il principe genovese Marcantonio Doria il Martirio di sant'Orsola: la tela fu finita in maggio, consegnata ancora fresca di vernice e spedita a Genova. È il quadro più tardo di Caravaggio che conosciamo, e si vede oggi alle Gallerie d'Italia in via Toledo, a sei minuti da Ceraldi. Tra i volti, alle spalle della santa, c'è il suo.\n\nNell'estate partì in barca verso Roma con alcuni quadri, sperando nel perdono. Fu arrestato per errore a Palo, e la barca ripartì con i dipinti. Morì a Porto Ercole il 18 luglio 1610 (o forse il giorno dopo), a 38 anni.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Naples in Five Minutes: From the Siren to the New City","sub":"","som":"First Partenope, then Neapolis: because the historic center is still designed like a Greek city.","txt":"Naples was founded twice. The first time it was called Partenope, like the mythical siren: it was founded in the 7th century BC by colonists of Greek origin from Cumae, who landed on the islet of Megaride, where Castel dell'Ovo stands today, and settled on nearby Mount Echia.\n\nThe second time, around 470 BC, a new city arose next to the old one: Neapolis, meaning \"new city\" in Greek. This is the one you are now passing through. Its streets form a regular grid that, after twenty-five centuries, is still legible: the historic center of Naples is a UNESCO World Heritage Site precisely because the design of the Greek city has remained its backbone.\n\nThree parallel streets, the decumani, cut the city from west to east. The lowest one is Spaccanapoli: about two kilometers long, so straight that, seen from above, it appears to divide the city in two, hence its name. In the center runs Via dei Tribunali, the main decumanus; higher up are Via dell'Anticaglia and Via della Sapienza, the upper decumanus.\n\nFrom Piazza Carità, where we have been since 2002, Spaccanapoli begins a few minutes' walk away, in Piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Il centro storico di Napoli visto dall'alto","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Il centro storico dall'alto: le strade dritte sono ancora quelle della città greca."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro and the Melting Blood","sub":"","som":"Three times a year, Naples holds its breath over a vial. What happens, where, and what the Church and science say about it.","txt":"In Naples Cathedral, in a niche in the Treasury Chapel, a vial containing a dark substance is kept, which tradition holds to be the blood of San Gennaro, the city's patron saint. Three times a year—on the Saturday before the first Sunday in May, on September 19th (the feast day), and on December 16th—the vial is shown to the faithful: if the contents, usually solid, dissolve, it's a celebration; if they remain solid, for many Neapolitans, it's a bad omen.\n\nThe first known record of the liquefaction dates back to 1389. The relics are not guarded by the clergy but by the Deputation of the Chapel of the Treasure of San Gennaro, a secular institution founded in 1601, which also includes the mayor of Naples.\n\nThe Church maintains a cautious stance: it speaks of a \"miraculous event,\" allows popular devotion, but does not impose it as a truth of faith. Among the explanations proposed by skeptics is thixotropy, the property of certain substances that are solid at rest and become liquid when moved or shaken.\n\nThe sacred and the profane have always coexisted here: in Via Duomo, a few steps from the cathedral, the street artist Jorit painted a San Gennaro with the face of a worker.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro di San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"La Cappella del Tesoro di San Gennaro nel Duomo, dove si custodisce l'ampolla."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Napoli in sette tradizioni: dal panaro al miracolo di San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"The Poor Souls: When Naples Adopted a Skull","sub":"","som":"Ossuaries, capuzzelle, and prayers exchanged for lottery numbers: the cult of the nameless dead.","txt":"For centuries, in Naples, the nameless dead were not left alone. They were called anime pezzentelle: the poor souls who died without a funeral and without anyone to pray for them. The name is linked to \"pezzente,\" the poor man, but also to the Latin \"petere,\" to ask in order to receive: those who prayed for them hoped to receive protection and grace in return.\n\nThe symbolic site is the Fontanelle Cemetery, in the Sanità district: a sixteenth-century tuff quarry covering approximately four thousand square meters, which welcomed victims of the plague of 1656 and then those of cholera in 1836-1837. In 1872, Canon Gaetano Barbati arranged the bones in three naves. Devotees \"adopted\" a skull, a capuzzella: they cleaned it, placed it in a small shrine, adorned it with rosaries and coins, and prayed to it, waiting for a sign in a dream, sometimes a lottery number. Some skulls became famous: the Captain, with a blackened eye socket, the subject of a legend of marriage and jealousy; Donna Concetta, who is said to \"sweat\" when grace is granted.\n\nIn 1969, a decree from the ecclesiastical court closed the ossuary and banned worship. Closed for renovations since 2020, the cemetery reopened to the public in 2026, managed by the La Paranza cooperative.\n\nThe cult also lives on beneath Via dei Tribunali, in the hypogeum of Santa Maria delle Anime del Purgatorio ad Arco, the church Neapolitans call \"'e cape 'e morte\": there, the skull of Lucia, a particularly beloved young soul, is kept. And on Via San Biagio dei Librai, in the small church of Santa Luciella, there is a unique skull: the one with ears.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Teschi delle anime pezzentelle","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Le capuzzelle delle anime pezzentelle."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoteric Naples: An alchemist prince, a coded facade, and a magic egg","sub":"","som":"Raimondo di Sangro, the rustication of the Gesù Nuovo, Virgil's egg, the munaciello: where history ends and legend begins.","txt":"Naples loves mysteries, and it has some very beautiful ones. The most famous has a name: Raimondo di Sangro, Prince of Sansevero, an eighteenth-century man, Grand Master of Neapolitan Freemasonry, a jealous inventor of his own secrets. The myth surrounded him even in his lifetime, and he himself fueled it. Benedetto Croce called him the Neapolitan incarnation of Doctor Faustus. The black legend attributes everything to him: servants killed to study their bodies, even the blinding of the sculptor of the Veiled Christ so he wouldn't sculpt another. These are legends, and the museum itself distinguishes them from documented history.\n\nThe Veiled Christ is the work of Giuseppe Sanmartino, commissioned by the prince: the transparent veil covering the body is carved from the same block of marble as the statue. In the chapel's underground cavea are the \"anatomical machines,\" two skeletons with reconstructed circulatory systems, created by the Palermo physician Giuseppe Salerno around 1756-1764. Legend has it that they involved mysterious injections and studies of beeswax and dyes.\n\nNot far away, the façade of the Gesù Nuovo, originally the Sanseverino palace in 1470, is covered with a pyramid-shaped ashlar of dark piperno stone. Some stones bear engraved markings: legend has it, a secret message; some scholars say they are the stonecutters' marks; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes, a score lasting about three-quarters of an hour called \"Enigma.\" A tempting hypothesis, not a certainty.\n\nAnd then there's the sea: according to legend, the poet Virgil hid the egg of the siren Partenope in the cellars of Castel dell'Ovo. As long as the egg remains intact, the castle remains standing.\n\nIn the houses, however, live the spirits of popular tradition: the munaciello, a hooded elf who brings good luck or mischief depending on how you treat him, and the bella 'mbriana, a good spirit of the house, who can appear as a butterfly or a gecko.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo a punte di diamante","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante del Gesù Nuovo, la «facciata in codice»."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples today: what's new?","sub":"","som":"The square dedicated to Maradona, the street art, the last Caravaggio on Via Toledo, reopened churches and ossuaries: the changing city.","txt":"Those who return to Naples after a few years find a city that has learned to tell its story.\n\nIn the Spanish Quarter, nine minutes from us, is Largo Maradona. The mural of Diego was painted in 1990 by Mario Filardi; over the years, it faded to the point of almost disappearing, then was restored thanks to Salvatore Iodice, and in the fall of 2017, the Argentine Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, previously called the artists' square, became a secular sanctuary of small altars, Argentine flags, and photographs, so popular that the municipality had to manage pedestrian traffic.\n\nStreet art has entered the historic center: in Piazzetta dei Girolamini, protected by glass, stands Banksy's Madonna with a Gun; on Via Duomo, Jorit's San Gennaro the Worker. The city's official tourist website has dedicated a dedicated itinerary to them.\n\nOn Via Toledo, six minutes from us, the Gallerie d'Italia houses the Martyrdom of Saint Ursula, Caravaggio's last canvas, along with over five hundred Attic and Magna Graecia vases.\n\nAnd places that had been closed for a long time are reopening: the church of Santa Luciella ai Librai, abandoned for over thirty years, was reopened to the public on April 5, 2019; the Fontanelle Cemetery reopened in 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Il murale di Maradona nei Quartieri Spagnoli","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, uno dei volti della Napoli di oggi."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM function schizzo(i){ /* disegno del percorso reale per la scheda dell'itinerario (leggero, senza mappa) */
  var pts = [], KX = 84300, KY = 111000;
  i.tappe.forEach(function(t){ (t.geo || []).forEach(function(c){ pts.push([(c[0] - 14.24) * KX, (40.86 - c[1]) * KY]); }); });
  if(pts.length < 2) return '';
  var x0 = Math.min.apply(0, pts.map(function(p){ return p[0]; })), x1 = Math.max.apply(0, pts.map(function(p){ return p[0]; }));
  var y0 = Math.min.apply(0, pts.map(function(p){ return p[1]; })), y1 = Math.max.apply(0, pts.map(function(p){ return p[1]; }));
  var pad = 60, w = x1 - x0 + 2 * pad, h = Math.max(y1 - y0 + 2 * pad, w * 0.45);
  var h2 = '<svg viewBox="' + [x0 - pad, y0 - pad - (h - (y1 - y0 + 2 * pad)) / 2, w, h].map(Math.round).join(' ') + '" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:220px;background:var(--accento-chiaro)" aria-hidden="true">';
  i.tappe.forEach(function(t){ if(t.geo) h2 += '<polyline points="' + t.geo.map(function(c){ return ((c[0] - 14.24) * KX).toFixed(0) + ',' + ((40.86 - c[1]) * KY).toFixed(0); }).join(' ') + '" fill="none" stroke="var(--scuro)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'; });
  var k = 0; i.tappe.forEach(function(t, n){ var l = LU[t.l]; if(n === i.tappe.length - 1 && casa(l)) return; var x = (l.lon - 14.24) * KX, y = (40.86 - l.lat) * KY, c = casa(l);
    h2 += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="30" fill="' + (c ? 'var(--accento)' : 'var(--scuro)') + '" stroke="var(--superficie)" stroke-width="8"/><text x="' + x.toFixed(0) + '" y="' + (y + 11).toFixed(0) + '" text-anchor="middle" font-size="32" font-family="Jost,system-ui,sans-serif" font-weight="500" fill="var(--su-scuro)">' + (c ? 'C' : ++k) + '</text>'; });
  return h2 + '</svg>';
}

/* ---------- copertina dell'itinerario: una mappa vera (stessi tasselli della guida, senza rete esterna) fotografata una volta,
   con il percorso e le foto piccole dei luoghi sopra. Il disegno leggero resta sotto finché la mappa non è pronta (e se la mappa non si carica). */
var COPERTINE = {}, codaCopertine = [], copertinaInCorso = false, inCoda = {};
function copertina(i){ return '<span class="copertina-giro" data-giro="' + e(i.s) + '">' + schizzo(i) + '</span>'; }
function preparaCopertine(){ document.querySelectorAll('.copertina-giro[data-giro]').forEach(function(el){ var i = IT[el.getAttribute('data-giro')]; if(!i) return;
  var w = Math.round(el.clientWidth); if(!w) return; var k = i.s + '@' + w;
  if(COPERTINE[k]) return mettiCopertina(el, COPERTINE[k], true);
  if(!inCoda[k]){ inCoda[k] = 1; codaCopertine.push({i: i, w: w, k: k}); } }); prossimaCopertina(); }
function mettiCopertina(el, c, subito){ if(el.querySelector('img.fondo')) return; if(subito) el.classList.add('pronta');
  var h = '<img class="fondo" alt="" src="' + c.img + '">' + c.pin.map(function(p){ return '<span class="pin ' + p.cl + '" style="left:' + p.x + '%;top:' + p.y + '%">' + p.h + '</span>'; }).join('') + '<span class="osm">© OpenStreetMap</span>';
  el.insertAdjacentHTML('beforeend', h); requestAnimationFrame(function(){ el.classList.add('pronta'); }); }
function prossimaCopertina(){ if(copertinaInCorso || !codaCopertine.length) return; var job = codaCopertine.shift(); copertinaInCorso = true;
  var fine = function(){ delete inCoda[job.k]; copertinaInCorso = false; prossimaCopertina(); };
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var H = 220, box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-12000px;top:0;width:' + job.w + 'px;height:' + H + 'px';
    document.body.appendChild(box);
    var m = new maplibregl.Map({container: box, style: r[1], interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: {preserveDrawingBuffer: true}, preserveDrawingBuffer: true, center: [14.2532, 40.8475], zoom: 14});
    var b = new maplibregl.LngLatBounds(), linee = [];
    job.i.tappe.forEach(function(t){ var l = LU[t.l]; b.extend([l.lon, l.lat]); if(t.geo){ linee.push(t.geo); t.geo.forEach(function(c){ b.extend(c); }); } });
    m.fitBounds(b, {padding: {top: 46, bottom: 40, left: 44, right: 44}, maxZoom: 16, duration: 0});
    var chiuso = false, chiudi = function(){ if(chiuso) return; chiuso = true; try{ m.remove(); }catch(x){} box.remove(); fine(); };
    var timer = setTimeout(chiudi, 15000);
    m.on('load', function(){
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addSource('p', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(c){ return {type: 'Feature', properties: {}, geometry: {type: 'LineString', coordinates: c}}; })}});
      m.addLayer({id: 'pb', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': 7}});
      m.addLayer({id: 'pl', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': scuro, 'line-width': 4}});
      m.once('idle', function(){
        try{
          var img = m.getCanvas().toDataURL('image/jpeg', 0.82), pin = [], k = 0, conFoto = [];
          /* foto piccole solo dove c'è spazio (almeno 50 px dalle altre foto): nei vicoli fitti le tappe vicine restano un pallino numerato */
          job.i.tappe.forEach(function(t, n){ var l = LU[t.l], c = casa(l); if(n === job.i.tappe.length - 1 && c) return;
            var q = m.project([l.lon, l.lat]), x = Math.round(q.x / job.w * 1000) / 10, y = Math.round(q.y / H * 1000) / 10;
            if(c){ pin.push({cl: 'punto casa', x: x, y: y, h: 'C'}); return; }
            k++;
            var libero = conFoto.every(function(o){ return Math.hypot(o[0] - q.x, o[1] - q.y) >= 50; });
            if(l.foto && libero){ conFoto.push([q.x, q.y]); pin.push({cl: '', x: x, y: y, h: '<img alt="" src="' + e(l.foto.u) + '"><b>' + k + '</b>'}); }
            else pin.push({cl: 'punto', x: x, y: y, h: String(k)}); });
          pin.sort(function(a, b){ return (a.cl === '' ? 1 : 0) - (b.cl === '' ? 1 : 0); }); /* le foto sopra i pallini */
          COPERTINE[job.k] = {img: img, pin: pin};
          document.querySelectorAll('.copertina-giro[data-giro="' + job.i.s + '"]').forEach(function(el){ if(Math.round(el.clientWidth) === job.w) mettiCopertina(el, COPERTINE[job.k]); });
        }catch(x){}
        clearTimeout(timer); chiudi(); });
    });
    m.on('error', function(){});
  }).catch(fine);
}

    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"')); }); }
/* opz: punti [{t,n,lat,lon,h,casa,spento}], linee [{c:coordinate, s:'fatto'|'ora'|'poi'|''}], geo (controllo «tu sei qui»), dopo(m) */

    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18, maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}});

      g.on('outofmaxbounds', function(){ if(msg){ msg.textContent = T.fuori_zona; msg.hidden = false; } });
      g.on('geolocate', function(){ if(msg) msg.hidden = true; });

      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';

      m.addLayer({id: 'percorso', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'},

/* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;
function xy(c){ return [(c[0] - 14.25) * KXm, (c[1] - 40.85) * KYm]; }
function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */
  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;
}
function salvaGiro(){ try{ localStorage.setItem('guida_giro', JSON.stringify({s: G.s, k: G.k, t: Date.now()})); }catch(x){} }
function giroSalvato(){ try{ var g = JSON.parse(localStorage.getItem('guida_giro') || 'null'); return g && Date.now() - g.t < 12 * 3600e3 ? g : null; }catch(x){ return null; } }
var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!G) return;
    G.pos = [p.coords.longitude, p.coords.latitude]; G.acc = p.coords.accuracy; G.negata = false;
    var i = IT[G.s], tp = i.tappe[G.k], l = LU[tp.l];
    if(tp.geo){ var r = suLinea(G.pos, tp.geo); G.lungo = r.lungo; G.fuori = G.acc < 40 && r.off > 60; }
    var dest = xy([l.lon, l.lat]), io = xy(G.pos), dist = Math.hypot(dest[0] - io[0], dest[1] - io[1]);
    G.vicino = (G.acc <= 40 && dist < 35) ? (G.vicino || 0) + 1 : 0;
    if(G.vicino >= 2 && !G.arrivato) G.arrivato = true;   /* due posizioni precise di seguito entro 35 m dalla tappa */
    aggiornaCammino();
  }, function(){ if(G){ G.negata = true; aggiornaCammino(); } }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); }catch(x){}
}

V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), inGiro = G && IT[G.s] && LU[IT[G.s].tappe[G.k].l] === l;
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="' + (inGiro ? 'vai(\'#/c/' + G.s + '\')' : 'history.length > 1 ? history.back() : vai(\'#/\')') + '">← ' + e(T.indietro) + '</button>' + lingue() + '</div>';
  var gal = (l.foto ? [l.foto] : []).concat(l.gal || []);
  h += '<div class="galleria">' + (gal.length ? gal.map(figura).join('') : '<figure><div class="ft">' + illustrazione(l.tipo, l.n) + '</div></figure>') + '</div>' + (gal.length > 1 ? '<p class="scorri">' + e(T.scorri_foto.replace('{n}', gal.length)) + '</p>' : '');
  h += '<div class="stack-s"><span class="etichetta">' + e(l.dv ? T.visita + ' ' + durata(l.dv) : T.luoghi) + '</span><h1>' + e(l.n) + '</h1><span>' + etichetta(stato(l, ora, ora.min)) + '</span></div>';
  if(l.som) h += '<div class="stack-s"><h3>' + e(T.perche_speciale) + '</h3><p style="font-size:1.08rem">' + e(l.som) + '</p></div>';
  if(l.som || l.rac) h += '<button class="btn sec" onclick="ascolta(LU[' + l.id + '], this)">▶ ' + e(T.ascolta) + '</button>';
  if(l.dett && l.dett.length) h += '<div class="stack-s"><h3>' + e(T.cosa_guardare) + '</h3><p class="piccolo">' + e(f(T.cosa_guardare_sotto, {n: l.dett.length})) + '</p>' + l.dett.map(function(x, n){
      return '<article class="guarda' + (x.foto ? ' con-foto' : '') + '">' +
        (x.foto ? '<figure class="gf"><div class="ft"><img src="' + e(x.foto.u) + '" alt="' + e(x.foto.alt) + '" loading="lazy"></div>' +
          '<figcaption>' + (x.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(x.foto.dida) + '</span>' : '') + '<span class="cr">' + e(x.foto.aut) + ' · ' + e(x.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="corpo"><div class="tit"><span class="n">' + (n + 1) + '</span><b>' + e(x.t) + '</b></div>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<div class="testo">' + par(x.x) + '</div></div></article>'; }).join('') + '</div>';
  if(l.rac) h += '<details class="apri"' + (l.dett && l.dett.length ? '' : ' open') + '><summary>' + e(T.storia) + '</summary><div class="testo">' + par(l.rac) + '</div></details>';
  if(l.leg) h += '<details class="apri"><summary>' + e(T.leggende) + '</summary><div class="testo">' + par(l.leg) + '</div></details>';
  h += assaggio(l.col, T.da_ceraldi_et) + daLeggere(l.col);
  if(l.con) h += '<details class="apri" open><summary>' + e(T.consiglio) + '</summary><div><p>' + e(l.con) + '</p></div></details>';
  var info = '';
  if(!l.sa && verificati(l, ora) && l.or.length){
    info += '<table class="orari">';
    for(var g = 1; g <= 7; g++){ var fs = fasce(l, ora.data, g), ap = fs.filter(function(o){ return !o.x && o.da; });
      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  } else if(!l.sa) info += '<p>' + etichetta({k: 'verifica'}) + '</p>';
  var pr = [];
  if(l.dv) pr.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) pr.push(e(T.gratuito)); else if(l.gr === false) pr.push(e(T.pagamento));
  if(l.mp) pr.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';
  if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';
  if(l.fc) info += '<p>' + e({si: T.foto_si, no: T.foto_no, senza_flash: T.foto_senza_flash}[l.fc] || '') + '</p>';
  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(r.ap ? T.prima_di_partire : T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.sub ? '<p class="piccolo">' + e(r.sub) + '</p>' : '') + (r.foto ? '<div class="galleria uno">' + figura(r.foto) + '</div>' : '') + '<div class="testo">' + par(r.txt) + '</div>';
  if(r.cap.length){
    h += '<nav class="indice" aria-label="' + e(T.indice) + '"><b style="font-weight:500">' + e(T.indice) + '</b><ol>' + r.cap.map(function(c, n){ return '<li><button onclick="document.getElementById(\'cap-' + n + '\').scrollIntoView({behavior:\'smooth\'})">' + (c.p ? '<span class="per">' + e(c.p) + '</span>' : '') + '<span>' + e(c.t) + '</span></button></li>'; }).join('') + '</ol></nav>';
    h += r.cap.map(function(c, n){ var l = c.l && LU[c.l];
      return '<section class="capitolo" id="cap-' + n + '">' + (c.p ? '<span class="etichetta">' + e(c.p) + '</span>' : '') + '<h2>' + e(c.t) + '</h2>' +
        (c.foto ? '<figure><div class="ft"><img src="' + e(c.foto.u) + '" alt="' + e(c.foto.alt) + '" loading="lazy"></div><figcaption>' + (c.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(c.foto.dida) + '</span>' : '') + '<span class="cr">' + e(c.foto.aut) + ' · ' + e(c.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="testo">' + par(c.x) + '</div>' + (l ? '<a class="btn sec" href="#/l/' + e(l.s) + '">' + e(f(T.lo_vedi, {n: l.n})) + ' →</a>' : '') + '</section>'; }).join('');
  }
  return h + assaggio(r.col, T.da_ceraldi_et) + daLeggere(r.col) + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
