:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;

<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
var D = {"lingua":"en","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità and Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"The starting point: Piazza Carità, on Via Toledo. From here the historic centre is just a few minutes' walk away. And right here is Ceraldi.","rac":"Piazza Carità opens onto Via Toledo, the great street that the Spanish viceroy Don Pedro de Toledo had built in the sixteenth century, when he doubled the size of the city and built, on the hill next to it, the quarters for the soldiers: the Spanish Quarter.\n\nFrom here the old centre is a few minutes away: walk up towards Piazza del Gesù and you are on Spaccanapoli. Heading down Via Toledo instead, you reach Piazza del Plebiscito, the Royal Palace and the sea.","con":"Before setting off, have a coffee: the tour is a long one, and Naples is best visited with the right little cup in hand.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità today, with trees and colourful buildings","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità today, on Via Toledo: all the tours start from here. Ceraldi is here."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"The square in front of Ceraldi","x":"Piazza Carità is the starting point of every tour: you are on Via Toledo, the great street opened in the sixteenth century by the viceroy Don Pedro de Toledo to connect the old centre with the new city and the Spanish Quarter.\n\nFrom here, in a few minutes you reach Spaccanapoli, to the north-east, or the sea and the castles, to the south. Before setting off, have a coffee: the tour is long, and Naples is explored on foot.","d":"In front of the café","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Via Toledo and Largo della Carità in a nineteenth-century photograph","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo and Largo Carità in the nineteenth century: the great street created by Don Pedro de Toledo, already full of life back then."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Period photo of Via Toledo in the nineteenth century, with carriages and passers-by","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo in the nineteenth century, when it was called Via Roma, in a photo by Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità and Via Toledo: a stroll through the heart of Naples","x":"The story of the square, told by those who have worked here since 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, the lower decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"The straight street that cuts the historic centre in two: the lower decumanus of the Greek city, about two kilometres of churches, shops and life.","rac":"Spaccanapoli is the lowest of the three decumani, the parallel streets that ran from west to east across Greek Neapolis. It begins in piazza del Gesù Nuovo under the name of via Benedetto Croce, then becomes via San Biagio dei Librai, crosses via Duomo and continues beyond the ancient centre: about two kilometres in all. The name says it all: it is so long and straight that, seen from above, it seems to split the city in two.","con":"Walk it from Piazza del Gesù towards Via Duomo: it is a gentle downhill stroll through history, not effort.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli seen from above, a straight line across the rooftops of the historic centre","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli seen from Sant'Elmo: a straight line cutting across the rooftops of the historic centre."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"The street that splits Naples","x":"Spaccanapoli is the popular name of the lower decumanus, one of the three great parallel streets of the Greek city: it was the “plateia” of Neapolis. It is called this because, perfectly straight, it divides the old town in two, between north and south.\n\nIt changes name several times: Via Benedetto Croce, then Via San Biagio dei Librai. From the hill, from the top of Via Pasquale Scura, you can see it stretching out in a single line.\n\nAlong the street, between the Middle Ages and the nineteenth century, convents and palaces of powerful families were built: look up at the portals and courtyards, and down at the workshops.","d":"Along the whole street, from Piazza del Gesù to Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"The straight line of Spaccanapoli seen from above","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli seen from Castel Sant'Elmo: the straight line that divides the old town in two."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Piazza and Church of Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A façade of pyramid-pointed stones that looks like a fortress and hides a mystery: carved marks that no one has yet deciphered with certainty.","rac":"Before it was a church, it was a palace: that of the Sanseverino princes, built in 1470; a plaque on the façade recalls the architect, Novello da San Lucano. The Jesuits kept its structure and the dark piperno rustication, with stones cut to a pyramid point, adding elements in white marble.\n\nSome of the stones bear carved marks. According to legend they are a secret message; some scholars see them as the marks left by the different teams of stonecutters; in 2011 the art historian Vincenzo De Pasquale suggested reading them as the musical notes of a score called \"Enigma\". Look at them up close and choose your own version.\n\nThe façade was restored and unveiled on 12 March 2023, after some fragments fell in December 2017; since then the square has been closed to cars.","con":"Look for the marks on the stones at eye level, to the right and left of the portal: the hunt is free.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"The façade of the Gesù Nuovo, made of dark stones cut to a point","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"The diamond-point façade: this was the palace of the Sanseverino princes, built in 1470. Step closer and look for the marks carved into the stones."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"The Diamond-Point Façade","x":"Before it was the façade of a church, it was that of a palace: the palace of the Sanseverino, Princes of Salerno, built in 1470. When the Jesuits built their church here, starting in 1584, they gutted the palace but saved its façade and portal. This was often done in Naples: in the old centre there was little space, and building outside the walls was not possible.\n\nLook at the stones: they are piperno, a hard, grey volcanic stone, cut into diamond points (the “rustication”). The great Baroque portal, with its columns, the angels on the pediment and the Jesuit monogram “IHS”, still encloses the palace's Renaissance portal.\n\nNow come closer: on many of the points there are small incised marks. Some say they are the marks of the stonecutters' teams; a legend says that the master piperno cutters knew how to “charge” the stone with energy; in 2010 some scholars read them as the notes of a musical score, a reading later disputed. There is no certain answer: look for one and choose your own.","d":"Outside, on the square","foto":{"u":"../img/658e8ea49eab.jpg","alt":"The façade of the Gesù Nuovo covered in diamond points of grey stone","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"The diamond-point rustication of the Gesù Nuovo façade, with the portal and the large window."}},{"t":"The Expulsion of Heliodorus","x":"It is the great fresco above the entrance door: it was painted by Francesco Solimena, who signed it and dated it 1725. Many visitors miss it, because they walk in looking at the altar: turn around.\n\nThe story comes from the Bible (the second book of Maccabees): Heliodorus tries to plunder the treasure of the Temple of Jerusalem and is driven back by a heavenly horseman. Look for the horseman, the horses and the fleeing figures: it is a theatrical scene, full of movement, just as the Baroque loved.\n\nOn either side of the large window, above the fresco, there are two smaller scenes by Belisario Corenzio, from 1638: Saint Helena Finding the Cross and the Conversion of Saint Paul.","d":"As soon as you enter, turn towards the door: it is above the entrance","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"The great fresco of the Expulsion of Heliodorus by Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimena's fresco above the entrance: turn towards the door to see it. In the centre, the heavenly horseman driving Heliodorus back."}},{"t":"The Dome and the Four Evangelists","x":"Stop in the center of the church, where the nave meets the transept, and look up. In the four curved triangles that support the dome (the “pendentives”) are the four Evangelists painted by Giovanni Lanfranco in the seventeenth century: they are what remains of his great cycle, because the rest was lost along with the dome.\n\nThe dome, in fact, has had a difficult life. The original one collapsed in the earthquake of 1688; it was rebuilt, but remained unstable and was pulled down at the end of the eighteenth century. In 1786 it was replaced by a lower, bowl-shaped covering, which is the one you see today; in 1975 it was reinforced with a reinforced-concrete structure.\n\nAround you is Neapolitan Baroque in all its fullness: inlaid marbles in many colors (“marmi commessi”), gilded stuccoes, frescoes by Belisario Corenzio and Paolo De Matteis on the vaults, canvases by Luca Giordano and sculptures by Cosimo Fanzago.","d":"In the center of the church, look up","foto":{"u":"../img/3dd3789513c8.jpg","alt":"The nave of the Gesù Nuovo toward the dome","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"The nave of the Gesù Nuovo: where it meets the transept, look up toward the dome and the four pendentives with the Evangelists."}},{"t":"The Chapel of Saint Ignatius","x":"This is the large chapel at the end of the left arm of the transept, dedicated to Saint Ignatius of Loyola, founder of the Jesuits. The architecture and marbles are by Cosimo Fanzago and his collaborators, in the years between about 1637 and 1645; on either side of the altar, the two statues of the prophets David and Jeremiah are by Fanzago himself.\n\nThe canvases with the life of the saint are by Jusepe de Ribera, the Spanish painter who worked in Naples and became one of its masters. At the foot of the altar lies the patron who commissioned the work, Carlo Gesualdo da Venosa.\n\nThen cross the church: opposite, in the right arm, is the \"twin\" chapel of Saint Francis Xavier, the first Jesuit missionary in Asia, with sculptures by Fanzago and, above, three canvases by Luca Giordano from 1676-77. Look at them one after the other: they are the Neapolitan Seicento at its peak.","d":"In one of the two great side chapels of the church","foto":{"u":"../img/835d153e2859.jpg","alt":"A canvas by Ribera showing Saint Ignatius in glory","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Saint Ignatius in Glory, a canvas by Jusepe de Ribera in the chapel dedicated to the founder of the Jesuits."}},{"t":"Saint Giuseppe Moscati","x":"Here rests the «holy doctor» of Naples: Giuseppe Moscati, a physician and university professor who treated the poorest for free and also helped them with money. He died in 1927 and was proclaimed a saint by Pope John Paul II in 1987.\n\nHis body lies in the bronze urn at the centre of the Chapel of the Visitation, the second on the right, where it was brought in 1977. The urn is by Amedeo Garufi: look at the three bas-reliefs, which show him giving a lecture at the university, healing a child in its mother's arms and caring for the sick in hospital. On the left is his bronze statue, from 1990.\n\nFrom the large chapel of Saint Francis Xavier, a door leads to the Rooms of Saint Giuseppe Moscati: photos, manuscripts, his clothes and medical instruments, and the study and bedroom of his home, reconstructed here. In the same rooms is displayed a bomb from the Second World War that fell on the church ceiling without exploding.","d":"In the Chapel of the Visitation, beneath the altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"The reconstructed room of Saint Giuseppe Moscati: white coat and medical instruments in a display case","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"In the reconstructed room: the white coat, the medical instruments and the photographs of Saint Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"The square of the Gesù Nuovo in front of the church","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"The square of the Gesù Nuovo, in front of the church."},{"u":"../img/6d1ae4837518.jpg","alt":"The interior of the Gesù Nuovo, with coloured marbles and the high altar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Inside, a contrast with the austere façade: coloured marbles, frescoes and fine gold all the way to the high altar."},{"u":"../img/3dd3789513c8.jpg","alt":"The nave of the Gesù Nuovo seen from the entrance","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"The nave seen from the entrance: at the far end, high up, the dome with Lanfranco's evangelists at its base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastery and Complex of Santa Chiara (majolica-tiled cloister)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"The majolica-tiled cloister is one of the quietest places in the centre: a stone's throw from the chaos of Spaccanapoli, silence.","rac":"Santa Chiara was founded in 1310 at the wish of King Robert of Anjou and Queen Sancia of Majorca. The works were directed first by Gagliardo Primario and then by Lionardo di Vito, and in 1340 the church was opened for worship. The complex was a double one: a convent for the Poor Clare nuns and one for the Friars Minor, close to each other but separate.\n\nFour centuries later, at the suggestion of Queen Maria Amalia of Saxony, wife of Charles of Bourbon, the Poor Clares' cloister was renovated. The architect Domenico Antonio Vaccaro kept the 14th-century Gothic arches and transformed the centre into a Baroque garden, covered with majolica tiles from the workshop of Donato and Giuseppe Massa. The result is one of the most surprising places in Naples: a ceramic garden a stone's throw from Spaccanapoli.\n\nThe church is Gothic, with a façade with a broad gable framing the ancient rose window, and inside it has a single nave with ten chapels on each side. The bombing of 4 August 1943 hit it hard: it also destroyed part of the cloister's frescoes, and the reconstruction gave back to the church the Gothic forms that the 18th-century stuccoes had hidden.\n\nBeneath the complex there is another surprise: the remains of a Roman bathing establishment, discovered during the post-war restoration. It had a gymnasium, an indoor swimming pool and rooms for hot-air baths: they are the most complete testimony of the ancient baths of Neapolis.","con":"On Sundays the cloister closes at 2 pm: if it's a Sunday afternoon, swap the order and come here first.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"The entrance to the Santa Chiara cloister","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"The entrance to the majolica-tiled cloister of Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloister and museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloister and museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"The majolica pillars","x":"The garden is divided into four parts by two paths that cross, and along the paths run 64 octagonal pillars, all covered in majolica. The decorations are garlands of leaves, flowers and fruit; the colours most used are yellow, orange and blue, chosen to evoke the citrus fruits and the vine of the pergola growing above you.\n\nThe majolica tiles come from the workshop of Donato and Giuseppe Massa, who followed the design of the Neapolitan architect Domenico Antonio Vaccaro: he wanted glazes, architecture and plants to be a single whole. The pillars end in piperno capitals and are linked by benches, these too made entirely of majolica.\n\nThe cloister was transformed in this way in the years around 1742, when the abbess was Sister Ippolita Carmignano: it was Queen Maria Amalia of Saxony, wife of Charles of Bourbon, who repeatedly urged the nuns to \"modernise\" it.","d":"In the cloister garden","foto":{"u":"../img/924627d30fda.jpg","alt":"Pillars covered with yellow and green majolica tiles in the cloister","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"The pillars covered in majolica tiles with garlands of leaves, flowers and fruit, beneath the pergola."}},{"t":"The scenes on the benches","x":"Take a seat: the benches linking the pillars are all made of majolica, and their backrests are painted with small 18th-century scenes. There are scenes of the countryside, the sea, popular festivals and mythological tales: a story told in pictures about life back then.\n\nThe scenes continue on the low wall surrounding the flowerbeds: stroll along the avenues at your leisure and look down as well as to the sides.\n\nA tip: it's a wonderful game to play with children. Each of you pick a scene and tell one another what is happening: who is going fishing, who is dancing, who is working in the fields.","d":"On the backrests of the benches between the pillars","foto":{"u":"../img/79ec1acbab17.jpg","alt":"A majolica bench with a scene painted on the backrest","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"A majolica bench in the cloister: on the backrest there is a painted scene."}},{"t":"The Poor Clare with the cats","x":"Among all the scenes on the backrests there is one about the monastery itself: a Poor Clare nun feeding the cats that lived in the cloister. It is a small moment of everyday life, painted in majolica in the 18th century by the Massa workshop.\n\nThe Poor Clares are the nuns of the order of Santa Chiara: the complex was in fact built as two neighbouring but separate convents, one for the Poor Clares and one for the Friars Minor.\n\nFinding it is a perfect treasure hunt, children included: go along the benches one by one. If you can't find it, ask the cloister staff.","d":"On one of the bench backrests: go and find it","foto":{"u":"../img/009a5af8811f.jpg","alt":"A scene of country life painted in majolica on a bench back in the cloister","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Chiostro_di_Santa_Chiara_WLM24_(34).jpg","dida":"One of the majolica scenes on the bench backs of the Poor Clares' cloister."}},{"t":"The 14th-century arches","x":"The garden is Baroque, but the setting is medieval. The complex was commissioned in 1310 by King Robert of Anjou and Queen Sancia of Majorca; the works were directed by Gagliardo Primario and then by Lionardo di Vito, and the church was opened for worship in 1340.\n\nWhen Vaccaro remade the garden in the 18th century, he kept the 14th-century perimeter: the pointed arches on piperno pillars. Notice the contrast between the austere stone of the arches and the cheerful colours of the majolica tiles: four centuries in a single glance.\n\nOn the walls of the four sides run frescoes from the first half of the 17th century, by an unknown artist, perhaps from the school of Belisario Corenzio, with scenes from the Old Testament. As soon as you enter, the first stretch of wall on the right is empty: those frescoes were destroyed by the bombing of 4 August 1943.","d":"Along the four sides of the cloister","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"The arches of the Santa Chiara cloister seen against the light, with the church in the background","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"The Gothic arches of the Santa Chiara cloister, seen against the light: in the background, the façade of the church."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolica tiles with a wild boar hunting scene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Up close: a wild boar hunt painted on the majolica tiles by the Massa workshop, between 1739 and 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"The cloister with its majolica pillars, benches and garden","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"The whole cloister: the majolica pillars, the benches and the garden."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Chapel","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"The Veiled Christ, one of the most famous sculptures in the world, and the anatomical machines of the alchemist prince Raimondo di Sangro.","rac":"The chapel of the di Sangro family is the realm of Raimondo, Prince of Sansevero: a man of science and secrets, Grand Master of Freemasonry, around whom the myth arose while he was still alive, and he himself helped to feed it.\n\nAt the centre stands the Veiled Christ by Giuseppe Sanmartino, commissioned by the prince: a reclining body covered by a shroud so thin it looks like wet cloth, yet carved from the same block of marble as the statue. In the underground chamber are the two “anatomical machines”, skeletons of a man and a woman with the system of blood vessels reconstructed, the work of the Palermo physician Giuseppe Salerno around 1756-1764. The black legend tells of sacrificed servants and mysterious injections; the museum itself carefully separates myth from documented history.","con":"It is closed on Tuesdays: if today is Tuesday, the statue of the Nile is two minutes away and can always be seen.","acc":"The nave and the sacristy can also be visited in a wheelchair. The underground chamber with the anatomical machines can only be reached by a narrow nineteenth-century spiral staircase.","foto":{"u":"../img/65421f883be6.jpg","alt":"The exterior of the Sansevero Chapel","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"The Sansevero Chapel seen from outside."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"The Veiled Christ","x":"At the centre of the chapel lies a body stretched out on a mattress, its head and chest raised on a pillow, covered by a shroud so thin that the face, the wounds and the veins can be made out beneath it. The veil is not an addition: Giuseppe Sanmartino carved it from the same block of marble as the statue, in 1753, commissioned by Prince Raimondo di Sangro.\n\nA document signed by the prince to pay the sculptor says so: «a marble statue carved at life size, representing Our Lord Jesus Christ dead, covered by a transparent shroud made from the same block as the statue». For centuries it was said that the veil was a real cloth turned into marble by an alchemical process devised by the prince: it is only a legend.\n\nLook for the details: the wound in the side, the mark of the nails on the hand and, at the feet, the crown of thorns and the nails of the Passion. Then walk slowly around it: from every side the veil seems to change.","d":"In the centre of the nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"The face of the Veiled Christ beneath the marble veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"The face beneath the veil: the shroud is carved from the same block of marble as the statue, yet it looks like wet cloth."}},{"t":"Modesty","x":"A young woman wrapped in a veil that clings to her skin as if it were wet, with a garland of roses in her hair. It was sculpted in 1752 by the Venetian Antonio Corradini, a sculptor famous throughout Europe who had also worked for the emperor in Vienna: he died the same year, while designing the other decorations of the chapel, as a plaque on the pillar recalls.\n\nPrince Raimondo dedicated it to his mother, Cecilia Gaetani dell'Aquila d'Aragona, who died on 26 December 1710, when he was not yet a year old. Look for the symbols of a life cut short too soon: the lost gaze, the tree growing out of the stone and the broken tombstone at her feet.\n\nOn the base there is a bas-relief of the “Noli me tangere”, the risen Christ appearing to Mary Magdalene. The museum points out that the veiled woman can also be read as an image of Wisdom, and recalls the veiled goddess Isis.","d":"Near the main altar","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"The statue of Modesty, a woman covered by a veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Modesty by Antonio Corradini: the veil clings to the body as if it were wet. At her feet, the broken tombstone."}},{"t":"Disillusion","x":"A man frees himself from a large net, helped by a small winged genius with a little flame on his forehead, the symbol of human intellect. At his feet lies the terrestrial globe, the passions of the world, with an open Bible on top. It was sculpted by the Genoese Francesco Queirolo between 1753 and 1754.\n\nThe prince dedicated it to his father, Antonio: left a widower, he had left his son with his grandfather and travelled around Europe living a dissolute life; then, in old age, repentant, he returned to Naples and became a priest. The net is the sin from which man frees himself.\n\nLook at the net up close: it is entirely made of marble, pierced mesh by mesh. The story goes that the craftsmen in charge of the finishing refused to touch it for fear of breaking it, and that Queirolo had to polish it alone. As early as 1753 a contemporary described it as \"the last daring proof that marble sculpture can venture upon\".","d":"Near the high altar","foto":{"u":"../img/921cf7f91318.jpg","alt":"The statue of Disillusion, a man freeing himself from a net","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Disillusion by Francesco Queirolo: the net is made entirely of marble, pierced by hand."}},{"t":"The labyrinth floor","x":"The floor you are walking on is not the original one. The prince had designed a labyrinth floor: coloured marbles, from blue to white, crossed by a continuous line of seamless white marble that traced hooked crosses alternating with concentric squares in perspective. It was executed by Francesco Celebrano starting in the mid-1760s; the prince himself wrote that the work was \"difficult and hindered\".\n\nIn 1889 a serious collapse affected the palace and the chapel and damaged the floor: instead of restoring it, it was rebuilt in Neapolitan terracotta, with yellow and blue glaze around the di Sangro coat of arms.\n\nLook for the original slabs in the passage in front of the tomb of Raimondo di Sangro; others are in the underground cavea and in the sacristy. For the prince, the labyrinth was the image of the difficult path that leads to knowledge.","d":"In the passage in front of the prince's tomb","foto":{"u":"../img/e29e7dc7e976.jpg","alt":"The nave of the Sansevero Chapel with the statues and, below, the lines of the floor","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2,_Cappella_Sansevero.jpg","dida":"The Sansevero Chapel: below, you can see the colored lines of the labyrinth floor."}},{"t":"The anatomical machines","x":"Go down the narrow staircase to the underground cavea: inside two display cases stand the skeletons of a man and a woman, with the system of arteries and veins almost intact, down to the finest vessels.\n\nThey were made by the Palermo-born physician Giuseppe Salerno. The prince bought the male one in 1756, after seeing it in a public demonstration in Naples, took Salerno into his service and had him make the second. They were kept in the palace, in a room called the “Apartment of the Phoenix”; the woman stood on a platform that could be turned to observe her from every side.\n\nAround them arose the “black legend”: it was said that the prince had had two servants killed and had injected a mysterious substance into their bodies. In reality the vessels are a reconstruction made with various materials, including beeswax and dyes; the knowledge of anatomy they show remains surprising for the time.","d":"In the underground cavea, down a narrow spiral staircase","foto":{"u":"../img/a3a047434411.jpg","alt":"A skeleton with the system of blood vessels in the display case of the cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"One of the two anatomical machines by Giuseppe Salerno in the underground cavea: skeleton and circulatory system."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"The interior of the Sansevero Chapel with its statues","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"The whole chapel: in the centre the Veiled Christ, around it the statues of the di Sangro family."}],"leg":"Even during his lifetime, people told all sorts of tales about Raimondo di Sangro: mysterious experiments, alchemical secrets, even servants turned into the anatomical machines. The museum carefully distinguishes the black legend from documented facts: it is worth listening to both versions and choosing which side you are on.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"The church where Saint Thomas Aquinas lived and taught and where, according to tradition, a Crucifix spoke to him.","rac":"The Dominican complex overlooks the square of the same name, along Spaccanapoli. The Gothic-Angevin church was built between 1283 and 1324 and later transformed in the Baroque period. Thomas Aquinas lived and taught in the convent between 1272 and 1274; Giordano Bruno and Tommaso Campanella were also connected to this place.\n\nIn the sacristy, whose vault was frescoed by Francesco Solimena in 1709, are the coffins of the Aragonese kings. For centuries the basilica also housed a masterpiece by Caravaggio, the Flagellation of Christ, now in the Capodimonte Museum.\n\nToday the complex can also be visited as the DOMA museum: sacristy, Aragonese coffins and the cell of Saint Thomas.","con":"If you have time, also go into the museum itinerary: sacristy, Aragonese tombs and Saint Thomas's cell. Opening hours change and some sections may be closed for works: check the official website before you come.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"The spire of San Domenico and the apse of the church in the square","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"The spire of San Domenico and, behind it, the apse of the church."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Guided tours."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"The Crucifix That Spoke to Saint Thomas","x":"It is a painted panel, kept in the basilica. Tradition says that Christ spoke to Thomas Aquinas, who was praying after writing about theology: he is said to have told him that he had written well of him and to have asked him what reward he desired. The Ministry of Culture remembers the panel as the one that “spoke” to the saint and that was moved in 1437 to a new chapel.","d":"Inside the basilica, in the Chapel of the Crucifix","foto":{"u":"../img/4b0972ad805f.jpg","alt":"The great Chapel of the Crucifix in San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"The great Chapel of the Crucifix in San Domenico Maggiore, where the panel of the miracle is kept."}},{"t":"Solimena's Sacristy and the Aragonese Tombs","x":"The sacristy vault was frescoed by Francesco Solimena in 1709 with the Triumph of the Dominican Order. Along the walls you can see the burial chests of the Aragonese sovereigns and of other court dignitaries.","d":"In the sacristy, as part of the DOMA museum visit","foto":{"u":"../img/07519e21f0fa.jpg","alt":"The sacristy of San Domenico Maggiore with its frescoed vault","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"The sacristy of San Domenico Maggiore, with the vault by Francesco Solimena and the Aragonese tombs."}},{"t":"The Cell of Saint Thomas","x":"Here Thomas Aquinas lived and studied. The cell has been restored and can be visited together with the DOMA museum.","d":"Along the museum route","foto":{"u":"../img/f68192e11f82.jpg","alt":"The cell of Saint Thomas Aquinas with reliquary and furnishings","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"The cell of Saint Thomas Aquinas in the convent of San Domenico Maggiore."}}],"gal":[],"leg":"It is said that the Crucifix painted on wood, kept in the basilica, spoke to Saint Thomas Aquinas while he was praying: it is said to have told him that he had written well of Him and to have asked him what reward he wished for.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli and the Statue of the Nile","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"A Roman statue of the god Nile, mistaken for centuries for a nursing woman: the «Corpo di Napoli».","rac":"In Piazzetta Nilo, along Via San Biagio dei Librai, that is, Spaccanapoli, stands a marble statue from the 2nd–3rd century AD depicting the river god Nile: a bearded man half-reclining with a cornucopia, surrounded by putti symbolizing the branches of the river. It was erected by the Alexandrian merchants who lived in this area, called Regio Nilensis.\n\nIt was found without its head in 1476. So the Neapolitans mistook it for a female figure nursing children, a symbol of the city that nourishes its inhabitants: hence the name «Corpo di Napoli», which still gives its name to the square today. In 1657 it was placed on a new base and in the same century a bearded head was sculpted for it.\n\nToday the statue is still in its place, a reminder of the multicultural roots of Naples.","con":"Stop by without rushing: it is a five-minute stop on the way along Spaccanapoli. Look for the putti on the body of the god: they explain why it was mistaken for a woman.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"The ancient statue of the god Nile, reclining","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"The statue of the god Nile, reclining, in the small square that bears his name."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"The god Nile and the putti","x":"The river god lies on his side, holding a cornucopia. The putti around him symbolize the branches of the Nile. To those who looked at it for a long time without its head, it seemed to be a woman nursing a child.","d":"In the middle of the little square","foto":{"u":"../img/83dce4234fd4.jpg","alt":"The statue of the reclining god Nile with the putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"The reclining god Nile with the cornucopia and the putti."}},{"t":"Why “Corpo di Napoli”","x":"The statue was found headless in 1476. For this reason it was thought to be a female figure nourishing her children: the city itself. The name has stayed with the square, even after the statue was given a new head.","d":"On the base and in the name of the square","foto":{"u":"../img/c0e842c87218.jpg","alt":"The statue of the Nile on its base in the square","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"The statue on the base in Largo Corpo di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai and its workshops","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"The part of Spaccanapoli of booksellers and artisans: workshops, churches and the Ospedale delle Bambole.","rac":"This is the stretch of Spaccanapoli that runs from piazzetta Nilo to via Duomo, on the lower decumanus. The name comes from the bookshops that have always stood here: an inscription on nearby Palazzo Marigliano recalls the art of the master booksellers. Devotion to Saint Blaise dates back to the 8th century, when nuns from Armenia brought a relic of the saint to Naples. Along the street you will also find the Ospedale delle Bambole, an artisan workshop handed down from generation to generation.","con":"December is the month of the nativity scene workshops: expect crowds at the weekend.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"A long view of via San Biagio dei Librai: a narrow cobbled street between tall buildings, with balconies, hanging laundry, shops and passers-by, and the Vomero hill in the distance.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, the stretch of Spaccanapoli most alive with workshops and voices."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"The street of the booksellers","x":"San Biagio dei Librai links Piazzetta Nilo and Via Duomo and is part of the lower decumanus. The name recalls the many bookshops that have always been found here, and the church of San Biagio Maggiore, dedicated to the patron saint of those with a sore throat: the devotion arrived in the 8th century with nuns who came from Armenia and brought a relic of the saint.\n\nThe philosopher and historian Giambattista Vico was born on this street.\n\nWalk slowly: it is one of the liveliest streets in Naples, always full of people.","d":"Along the street","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: the narrow alley, the shops and a banner hanging up high","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: the narrow, straight street of the lower decumanus, with its shops and people strolling."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai and the skull with ears","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"A tiny stonecutters' church dedicated to the saint of the eyes, and a skull unique in the world: the one with ears.","rac":"Founded shortly before 1327 by Bartolomeo di Capua, jurist to the Angevin kings, the church was later entrusted to the pipernieri, the stone cutters: they chose Saint Lucy, protector of sight, because the splinters from their trade put their eyes at risk.\n\nAbandoned for more than thirty years, it was reopened on 5 April 2019 thanks to the Respiriamo Arte association. In its hypogeum the cult of the anime pezzentelle has left a skull that has no equal: it has ears.","con":"It is small and can be visited in a few minutes: perfect as a break between Sansevero and via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"The portal of Santa Luciella in the alley","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"The portal of Santa Luciella. Look up: above it is the fresco with the coat of arms of the pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"The coat of arms of the pipernieri","x":"Before you go in, look up: above the piperno stone portal there is still the fresco with the coat of arms of the guild of the pipernieri, the stonecutters to whom the church belonged.\n\nThey worked piperno, an extremely hard stone, with chisel and hammer, and they feared that splinters might get into their eyes: that is why they chose Saint Lucy, protector of eyesight. It was a powerful guild; it was even said that they knew how to infuse stones with good or bad energies.\n\nThe church is very ancient: it was founded shortly before 1327 by Bartolomeo di Capua, counsellor to the Angevin kings. In Baratta's 1629 view of Naples it is marked as the millers' chapel; it was rebuilt in the 18th century. It remained closed and abandoned for over thirty years, until the association Respiriamo Arte reopened it on 5 April 2019.","d":"Above the entrance portal","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"The fresco above the portal of Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"The fresco above the portal of Santa Luciella, with the coat of arms of the guild of piperno stonecutters."}},{"t":"The skull with ears","x":"Beneath the church, in the hypogeum, there is a skull that has preserved the mummified cartilage of its ears: this is why it is considered unique. Popular tradition says that, precisely because it has ears, it listens better to the prayers of those who ask it for a favour.\n\nThe hypogeum can only be visited on the guided tour. Thanks to the project «Percorsi di luce», supported by FAI and Intesa Sanpaolo, the lights come on one detail at a time, alternating illuminated areas and areas in shadow: let yourself be guided.\n\nRemember that this is a place linked to the dead and to devotion: look with respect, and keep your voice low.","d":"In the hypogeum, on the guided tour","foto":{"u":"../img/7a5a070c0866.jpg","alt":"The skull with ears in the hypogeum of Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"The skull with ears: the mummified cartilage can be seen on either side of the cranium."}},{"t":"The anime pezzentelle","x":"In the 17th century the plague killed thousands of people in Naples: the dead were buried in mass graves and their names were lost. This is how the cult of the «anime pezzentelle» was born, the poor souls, who died nameless, without a funeral and without prayers.\n\nWhoever asked for a favour (a recovery, a pregnancy, some help) «adopted» one of those skulls, the capuzzelle: they cleaned it, placed it in a niche and prayed for it, so that the soul would reach Paradise and, up there, remember the person who had helped it.\n\nThe cult was deeply rooted at Santa Luciella. You will find it again at Purgatorio ad Arco, in Via dei Tribunali, and its symbolic place is the Fontanelle Cemetery, in the Sanità district.","d":"In the hypogeum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Skulls lit by candlelight, with a plaque reading “for grace received”","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Skulls in display cases: a plaque bears the name of the person who received the favour, a way of thanking the “pezzentelle” souls."}}],"gal":[],"leg":"It is said that the skull with ears, precisely because it has ears, hears prayers better: for this reason, for generations the most difficult requests have been entrusted to it.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Doll Hospital","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"A workshop that has “cared for” dolls and toys for generations: a shop window that children, and not only children, remember forever.","rac":"At the end of the 19th century, Luigi Grassi worked as a set designer for theatres and nativity scenes. His neighbours began bringing him broken dolls and toys, and his workshop became, almost by accident, the first toy “hospital” in Naples.\n\nToday it is run by Tiziana, the founder's great-granddaughter, in the courtyard of Palazzo Marigliano on Via San Biagio dei Librai. Inside, it works just like a real hospital: white coats, wards and a medical chart for every patient. For many Neapolitans, it is the place where, as children, they brought their favourite toy.","con":"Even just the shop window is worth a stop: it is on your way back.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"The window of the Ospedale delle Bambole full of dolls","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"The window of the Ospedale delle Bambole: dolls and toys waiting to be “cured”."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Hours for October and November: they may change at other times of the year."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Hours for October and November: they may change at other times of the year."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"A real hospital, for toys","x":"It isn't a shop but a workshop organised like a hospital: the patients are dolls, teddy bears and soft toys, each with its own story.\n\nThe “doctors” work in white coats, divided into departments just like in a real hospital: orthopaedics, ophthalmology, tailoring. Every patient has its own medical chart and its own diagnosis.\n\nIt is a place that children love, but also adults, who find the toys of their childhood here.","d":"In the workshop","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Doll heads awaiting repair","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Doll heads, arms and eyes awaiting care: in the workshop every piece has its own “ward”."}},{"t":"The founder, a set designer","x":"It all began at the end of the 19th century with Luigi Grassi, who built stage sets for theatres and nativity scenes. The neighbours began bringing him their broken toys, and he turned his workshop into the first “hospital” for dolls.\n\nSince then the workshop has been passed down from generation to generation within the same family: today it is Tiziana, his great-granddaughter, who looks after the patients.\n\nThink of the link with the city: Naples is the city of nativity scenes, and via San Gregorio Armeno, the street of the shepherd-figure workshops, is just a few steps from here.","d":"In the history of the workshop","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"The door of the Ospedale delle Bambole workshop with its shop windows","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"The entrance of the Ospedale delle Bambole on via San Biagio dei Librai: the workshop opened by the Grassi family."}},{"t":"The courtyard of Palazzo Marigliano","x":"The Doll Hospital (Ospedale delle Bambole) is in the courtyard of Palazzo Marigliano, at number 39 Via San Biagio dei Librai: one of the Neapolitan Renaissance palaces linked to the names of the architects Giovanni Francesco Mormando and Giovanni Francesco di Palma.\n\nAs you step through the doorway, the noise of the street fades away: it is one of the many hidden courtyards of the historic centre well worth discovering. On the palace there is also an inscription recalling that an Augustan basilica once stood nearby in ancient times.\n\nThe whole street deserves to be taken in slowly: it is the «lower decumanus» of the Greek city, the street of the booksellers, and the philosopher Giambattista Vico was born here.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"The yellow courtyard of Palazzo Marigliano with the entrance arch","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"The courtyard of Palazzo Marigliano, with the entrance arch and the ochre-coloured façades."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, the Street of the Nativity Scenes","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"A narrow alley where Christmas lasts all year: artisan workshops, terracotta figurines and nativity scenes.","rac":"Via San Gregorio Armeno links Via dei Tribunali with Via San Biagio dei Librai, that is, Spaccanapoli. It is the street of the nativity scenes: the artisan workshops display figurines and nativity scenes all year round, even in summer. According to some sources, the tradition of making terracotta figurines in this area dates back to Roman times; the fame of the Neapolitan nativity scene became international from the 18th century.\n\nAmong the historic workshops are Gambardella, active since 1800, and Fratelli Capuano, founded in 1840. Along the street you will also find the monastery of San Gregorio Armeno, which gives the street its name, with the church dedicated to Saint Patricia, co-patron saint of Naples.\n\nThe liveliest period runs from the end of November to Epiphany, when the street is extremely crowded.","con":"Come early in the morning and on weekdays: in December the crowds are huge. Look for the figurines that tell the news of the day: every year the artisans create new ones.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"The street of the nativity scenes, narrow and full of workshops","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, the street of the nativity scenes."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"The nativity scene workshops","x":"The workshops make nativity figurines and cribs in terracotta and cork, often hand-painted. Alongside the traditional figures there are characters from current events: every year the artisans invent new ones. You can look without buying: many artisans work in plain view.","d":"All along the street","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"A stall full of nativity scene figurines","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"A stall on the street of the nativity figurines, with traditional figures and characters of today."}},{"t":"The Monastery of San Gregorio Armeno","x":"The monastery gives the street its name. The church preserves a coffered ceiling by Teodoro d'Errico and frescoes by Luca Giordano, such as the Glory of Saint Gregory. The complex also includes the church dedicated to Saint Patricia, co-patron saint of Naples.","d":"Inside the monastery, along the street","foto":{"u":"../img/30ec6bba5546.jpg","alt":"The nave of the church of San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"The church of San Gregorio Armeno, with its coffered ceiling and frescoes."}},{"t":"When to go","x":"The workshops are open all year round. The liveliest period runs from late November to Epiphany, when the street is full of people: it is best to go on weekdays and early in the morning.","d":"Along the whole street","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Crowded Via San Gregorio Armeno","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno: best on weekdays and early in the morning."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore and the Neapolis excavations","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"A 13th-century Gothic church that hides, ten metres below the nave, the market of ancient Neapolis: streets, shops and rooms from two thousand years ago.","rac":"Piazza San Gaetano is the heart of ancient Neapolis. In the 13th century, on top of the remains of the Greco-Roman market, the Gothic basilica of San Lorenzo Maggiore was built, one of the oldest churches in the city. The complex also includes the convent, the Museo dell'Opera and the excavations.\n\nThe excavations, begun in 1976, brought to light the macellum, the market, which stood along the ancient decumanus maximus. You descend about ten metres below the church and walk among streets, shops and rooms from the imperial age. Beneath the church, the remains of a Christian basilica from the 6th century have also emerged.\n\nThe Museo dell'Opera, housed in the convent rooms and the civic tower, tells the history of Naples from the classical age to the 19th century.","con":"Go down into the excavations: it's the part you don't expect. Allow about three quarters of an hour and check the opening hours on the official website before you come.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"The façade of San Lorenzo Maggiore on Piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, overlooking Piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Indicative hours, to be confirmed on the official website before your visit."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"The market beneath the church","x":"The excavations reveal the macellum of Greek-Roman Neapolis, the market that stood along the ancient Decumanus Maximus. They lie about ten metres beneath the church. Walking among the structures, you can make out the street and the rooms where goods were sold and traded: it is a piece of the ancient city still in its place, over which Naples has continued to build.","d":"Beneath the nave, in the excavations","foto":{"u":"../img/ab890c42a731.jpg","alt":"A Roman street in the excavations beneath San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"The excavations beneath San Lorenzo Maggiore: the street and the shops of the ancient city."}},{"t":"The high altar by Giovanni da Nola","x":"The high altar is a Renaissance work by the Neapolitan sculptor Giovanni da Nola, among the most beautiful in Naples. The apse that houses it is the oldest part of the church.","d":"At the far end of the church, in the apse","foto":{"u":"../img/3692771c5f21.jpg","alt":"The Gothic apse of San Lorenzo Maggiore with the high altar","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Lorenzo_Maggiore._(6146).jpg","dida":"The apse of San Lorenzo Maggiore with the high altar."}},{"t":"The Museo dell'Opera","x":"The museum occupies the rooms of the convent and the civic tower next to the basilica. It displays furnishings, costumes and collections, and presents the history of Naples from the classical age to the nineteenth century.","d":"In the convent, next to the basilica","foto":{"u":"../img/591ff764e679.jpg","alt":"A museum room in the San Lorenzo Maggiore complex","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"The rooms of the convent of San Lorenzo Maggiore that house the Museo dell'Opera."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, the church of the capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"The church of the capuzzelle: beneath the floor, the hypogeum where Naples prayed for nameless souls. And the skull of Lucia.","rac":"Neapolitans call it “'e cape 'e morte”, the church of the skulls. It is a small 17th-century church on the Decumano Maggiore, linked to the devotion to the souls of Purgatory spread by the Counter-Reformation. A steep staircase leads down to the hypogeum, the underground church, enlarged and decorated with majolica tiles in the 18th century: here the faithful cared for anonymous remains and asked for their intercession. At the end of a small corridor lies the skull of Lucia, a young soul who is particularly beloved.","con":"Behind th
