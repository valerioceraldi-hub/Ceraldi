.com/photos/81227945@N00/6981308402","dida":"Il santuario di San Gaetano Thiene nella basilica di San Paolo Maggiore."}},{"t":"La sagrestia di Solimena","x":"La sagrestia della basilica è decorata da Francesco Solimena, uno dei maggiori pittori napoletani del Settecento. È una delle parti più belle della chiesa.","d":"Dietro la navata, nella sagrestia","foto":{"u":"../img/4782e44ae33e.jpg","alt":"La sagrestia affrescata da Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"La sagrestia di San Paolo Maggiore, con gli affreschi di Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La cupola ottagonale della chiesa del Pio Monte della Misericordia vista dal basso","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cupola della chiesa ottagonale del Pio Monte della Misericordia, guardando in alto."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Le Sette opere di Misericordia","x":"È una tela enorme, quasi quattro metri d'altezza, e sembra una notte in un vicolo di Napoli: un incrocio pieno di gente, illuminato da una luce che arriva di lato e scolpisce i corpi nel buio. In alto, la Madonna con il Bambino, portata da due angeli, guarda giù su quello che fanno gli uomini.\n\nIl Pio Monte voleva un'opera che mettesse insieme tutte e sette le opere di misericordia: dar da mangiare agli affamati, dar da bere agli assetati, vestire gli ignudi, ospitare i pellegrini, visitare gli infermi, visitare i carcerati, seppellire i morti. Caravaggio le dipinse tutte in una sola scena, senza miracoli: è l'uomo che aiuta l'uomo.\n\nFu la prima opera di Caravaggio a Napoli e cambiò la pittura della città: i pittori napoletani del Seicento ripresero la sua luce, i suoi personaggi presi dalla strada e perfino alcuni dettagli, come l'uomo di spalle in primo piano.","d":"Sull'altare maggiore","foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"t":"Come riconoscere le sette opere","x":"Cerca le scene una per una.\n\nA destra, una giovane donna allatta dal seno un vecchio dietro le sbarre: sono Pero e suo padre Cimone, condannato a morire di fame in carcere. Valgono per due opere: dar da mangiare agli affamati e visitare i carcerati. Guarda la goccia di latte sulla barba del vecchio.\n\nDietro di loro, un uomo trasporta un morto (se ne vedono solo i piedi) e un sacerdote con la torcia gli fa luce: seppellire i morti. In primo piano, a sinistra, un giovane cavaliere taglia il mantello per un uomo nudo a terra: è San Martino, vestire gli ignudi; accanto, nell'angolo più buio, uno storpio prega: visitare gli infermi.\n\nAll'estrema sinistra un oste indica la strada a un pellegrino con la conchiglia sul cappello, San Giacomo: ospitare i pellegrini. Sullo sfondo, un uomo beve da una mascella d'asino: è Sansone, dar da bere agli assetati.","d":"Davanti alla tela, da sinistra a destra","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"La tela di Caravaggio sopra l'altare maggiore del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La tela di Caravaggio come la vedi in chiesa: sopra l'altare, nella cappella del Pio Monte."}},{"t":"La Madonna e gli angeli","x":"Guarda in alto: la Madonna con il Bambino si affaccia come da una finestra, davanti a due lenzuoli stesi, e due angeli si abbracciano in volo. Sembrano lontani da quello che succede in basso.\n\nMa osserva l'ombra che proiettano sul muro del carcere: Caravaggio li rende presenti, quasi concreti, dentro la stessa notte degli uomini.\n\nLo storico dell'arte Roberto Longhi scelse proprio questo dettaglio per la locandina della grande mostra del 1951 che riscoprì Caravaggio: belli, scrisse, come un Raffaello, ma presi «dalla verità nuda di Forcella o di Pizzofalcone».","d":"In alto, nella tela","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Dettaglio: la Madonna con il Bambino e i due angeli in volo","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Il dettaglio in alto: la Madonna con il Bambino che si affaccia e i due angeli che si abbracciano in volo."}},{"t":"Gli altri altari","x":"Intorno al Caravaggio la chiesa ottagonale ha altri sei altari, con tele di pittori del Seicento napoletano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino e Forlì.\n\nCerca la «Liberazione di San Pietro» di Battistello Caracciolo, del 1615: è uno dei pittori che più impararono da Caravaggio, e si vede dalla luce e dal buio. Poi «San Pietro che resuscita Tabità» di Fabrizio Santafede, del 1611.\n\nGuardale dopo il Caravaggio: capirai subito quanto la sua tela fosse nuova per Napoli.","d":"Nelle cappelle intorno","foto":{"u":"../img/b58919c38c63.jpg","alt":"Una tela del Seicento con il Buon Samaritano","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"Il Buon Samaritano di Giovan Vincenzo Forlì, su uno degli altari intorno alle Sette opere di Caravaggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Cathedral and Treasure of San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Naples Cathedral and the Treasury Chapel, where the vial of San Gennaro's blood is kept.","rac":"In the Cathedral, in a niche in the Treasury Chapel, the ampoule containing the blood traditionally attributed to San Gennaro is kept. Three times a year (the Saturday before the first Sunday in May, September 19th, and December 16th) its liquefaction is awaited. Since 1601, the relics have been entrusted to a secular institution, the Deputation of the Treasury Chapel of San Gennaro.","con":"On liquefaction days, the Duomo is packed from morning: if you want to be there, arrive early.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"The facade of the Naples Cathedral","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"The facade of the Duomo, on Via Duomo. The Treasury Chapel is the third on the right."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Ingresso libero con prenotazione obbligatoria. Le visite partono ogni ora."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"The portal of San Gennaro","x":"The façade, about fifty meters high, has three portals. The one on the right remains closed almost all year round: it opens only for the feast of San Gennaro and on special occasions. If you find it open, you've come to a special day.","d":"On the front, on the right","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"Il portale gotico del Duomo di Napoli","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Il portale gotico del Duomo, in facciata."}},{"t":"The Treasure Chapel","x":"More than a chapel, it's a church within a church: baroque, with a Greek cross plan, a double-domed dome, and a large bronze gate by Cosimo Fanzago. It houses the silver bust of Saint Januarius and the vials containing his blood, whose liquefaction the city awaits.","d":"Third chapel on the right","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"The dome of the Treasury Chapel frescoed with Paradise","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Look up: in the dome of the Treasury Chapel there is Paradise painted by Giovanni Lanfranco."}},{"t":"Saint Restituta","x":"When Charles of Anjou had the Cathedral built in 1294, one of the oldest basilicas was preserved as a chapel: Santa Restituta. It houses works by Luca Giordano and 14th-century sculptures, and from here you descend to the archaeological area with Greco-Roman and early Christian remains beneath the cathedral.","d":"In the left aisle","foto":{"u":"../img/5abf53aec271.jpg","alt":"A mosaic with the Madonna enthroned in the Basilica of Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"A mosaic of the Madonna enthroned inside Santa Restituta: the oldest basilica, preserved as a chapel of the Cathedral."}},{"t":"The Baptistery of San Giovanni in Fonte","x":"A small space with an immense history: it's considered the oldest baptistery in the Western world. Stop for a few minutes: you're in one of the oldest Christian sites still standing in Europe.","d":"To the right of the apse","foto":{"u":"../img/994ed22c6902.jpg","alt":"L'interno del Battistero di San Giovanni in Fonte con la vasca battesimale al centro","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Il Battistero di San Giovanni in Fonte: al centro del pavimento, la vasca battesimale."}},{"t":"The Succorpo","x":"Beneath the altar is a three-aisled Renaissance crypt, commissioned by Cardinal Oliviero Carafa to house the relics of San Gennaro and other saints, designed by Giovan Tommaso Malvito. Ancient columns and white marble: a silent Renaissance within the Gothic cathedral.","d":"Under the main altar","foto":{"u":"../img/876cd614ab8d.jpg","alt":"L'interno del Succorpo di San Gennaro con colonne di marmo e pavimento a intarsi","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Il Succorpo, sotto il presbiterio del Duomo: colonne e pavimento di marmo, e in fondo l'altare con le reliquie di San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Girolamini Complex","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Davanti al Duomo, una chiesa barocca detta «Domus Aurea», due chiostri, una quadreria e la più antica biblioteca pubblica di Napoli.","rac":"Su via Duomo, di fronte alla cattedrale, il complesso dei Girolamini nacque nel Cinquecento per i padri dell'Oratorio di san Filippo Neri, detti Girolamini. È monumento nazionale dal 1866 e riunisce la chiesa, i chiostri, la quadreria e la biblioteca.\n\nLa chiesa, dedicata a san Filippo Neri, è nota come «Domus Aurea» per la decorazione barocca in oro. La quadreria è considerata la prima pinacoteca pubblica della città e conserva opere di maestri come Battistello Caracciolo, Jusepe de Ribera e Luca Giordano. La biblioteca, aperta al pubblico nella seconda metà del Cinquecento, è la più antica biblioteca pubblica di Napoli.\n\nIl complesso è stato interessato da una lunga stagione di restauri: la chiesa è stata riaperta il 21 marzo 2024 e, secondo fonti giornalistiche, nel 2026 sono state riaperte anche la Sala Camino e la Sala Vico della biblioteca. Le riaperture sono progressive: non tutti gli ambienti sono visitabili nello stesso periodo.","con":"Prima di venire controlla sul sito ufficiale cosa è aperto: chiesa, chiostri, quadreria e biblioteca hanno orari diversi e possono cambiare.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"La facciata dei Girolamini illuminata di sera","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"La facciata della chiesa dei Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Chiesa. Lunedì chiuso."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Chiesa e festivi."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"La chiesa «Domus Aurea»","x":"La chiesa di San Filippo Neri è detta Domus Aurea, la «casa d'oro», per la ricca decorazione barocca. È uno dei luoghi di culto più importanti della città.","d":"Nella chiesa, con ingresso da via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"La navata della chiesa dei Girolamini con le decorazioni dorate","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"La chiesa dei Girolamini, la «Domus Aurea» per la ricca decorazione."}},{"t":"La quadreria","x":"È considerata la prima pinacoteca pubblica di Napoli. Raccoglie dipinti di maestri del Seicento come Battistello Caracciolo, Jusepe de Ribera e Luca Giordano. Si raggiunge dal chiostro degli Aranci, al primo piano del convento.","d":"Primo piano del convento, dal chiostro degli Aranci","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Testa di santa dipinta da Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Una tela della Quadreria dei Girolamini: testa di santa di Massimo Stanzione (Seicento)."}},{"t":"La biblioteca più antica di Napoli","x":"La biblioteca è la più antica biblioteca pubblica della città e la seconda d'Italia dopo la Malatestiana di Cesena. Specializzata in teologia, filosofia, storia della Chiesa e musica sacra, custodisce circa 159.700 volumi antichi e moderni. Tra le sale storiche c'è quella dedicata a Giambattista Vico, che qui studiò.","d":"Ingresso da via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"La sala della Biblioteca dei Girolamini con gli scaffali di legno","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"La sala della Biblioteca dei Girolamini, la più antica biblioteca pubblica di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"Banksy's Madonna with a Gun","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"A Madonna by Banksy with a gun instead of a halo, protected by glass, in the heart of the main decumanus.","rac":"In Piazzetta dei Girolamini, on a façade of the main decumanus, Banksy left a Madonna with a gun in place of her halo. Today, it's protected by glass. The city's official tourist website includes it in its itinerary dedicated to street art in the historic center.","con":"Look up: the work is above street level, behind glass.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Il volto della Madonna di Banksy in stencil bianco su fondo scuro","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Il volto della Madonna di Banksy: lo stencil bianco su fondo scuro, da vicino."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"The Madonna with the gun","x":"White on a black background, stenciled: a Madonna with her arms outstretched toward the sky and, in place of a halo, a gun. Banksy painted it in Naples in 2010. The message is unexplained: everyone interprets it in their own way, somewhere between the sacred and the profane.","d":"On the wall of the little square","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"La Madonna in stencil di Banksy sul muro di piazza Gerolomini, vista da vicino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Madonna di Banksy, in stencil bianco e nero su un angolo del muro di piazza Gerolomini."}},{"t":"The newsstand next door","x":"Next to the mural is a small votive shrine with the Madonna and Child, the kind found in many streets of Naples. The two images, side by side, seem to gaze at each other: it is this dialogue that makes the work so Neapolitan.","d":"Immediately next to the work","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Madonna di Banksy sul muro e, accanto, l'edicola votiva con la Madonna col Bambino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A sinistra la Madonna di Banksy, a destra, appesa al muro, l'edicola con la Madonna col Bambino: le due immagini sacre una accanto all'altra."}},{"t":"A Banksy under glass","x":"In 2010, Banksy left two works in Naples, likely on the same night: the other, on Via Benedetto Croce, was later covered by another artist. For this reason, the FAI (Italian National Trust) lists this as Banksy's only mural in Italy, now protected by a plexiglass case to prevent vandalism.","d":"In front of the work","foto":null},{"t":"Come arrivarci e cosa fotografare","x":"L'opera è su un muro della piccola piazza Gerolomini, affacciata su via dei Tribunali.\n\nLa teca protegge l'opera ma può riflettere la luce: per una foto senza riflessi prova a metterti leggermente di lato. Il posto è sempre accessibile e gratuito.\n\nDa qui la Madonna di via Benedetto Croce, l'opera perduta, era a nove minuti a piedi, lungo il percorso che passa da Sansevero, Napoli Sotterranea e San Gregorio Armeno.","d":"Piazza Gerolomini, su via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini and the Greek walls","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una piazza di caffè e studenti con un affaccio sul passato: dietro una balaustra si vedono le mura greche di Neapolis.","rac":"Piazza Bellini si trova sul decumano maggiore ed è una delle più frequentate del centro storico, per i tanti locali che vi si affacciano. Basta guardare in basso, oltre la balaustra, per vedere in un'area ribassata un tratto delle mura della Neapolis greca, risalenti al IV secolo a.C. Furono scoperte nel 1954.\n\nA pochi passi c'è il Conservatorio di San Pietro a Majella.","con":"Dieci minuti bastano: guarda le mura dall'alto e poi concediti una pausa in uno dei locali della piazza.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"Piazza Bellini con i suoi tavolini e il verde","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, il ritrovo del centro storico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Le mura greche","x":"Sotto il livello della piazza si vedono i resti delle mura difensive della Neapolis greca, in blocchi di tufo. Furono scoperte nel 1954 e fanno parte del sistema di fortificazioni della città antica. Non sono una ricostruzione: sono pietre originali.","d":"Oltre la balaustra, nell'area ribassata","foto":{"u":"../img/4801d5111d9f.jpg","alt":"I blocchi di tufo delle mura greche sotto il livello della piazza","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Le mura greche di Neapolis in Piazza Bellini: blocchi di tufo originali."}},{"t":"La piazza oggi","x":"Intorno alle mura ci sono caffè, librerie e locali frequentati da studenti e abitanti. È uno dei luoghi del centro storico dove l'antico e la vita di tutti i giorni stanno più vicini.","d":"Intorno alla piazza","foto":{"u":"../img/133ed975e61b.jpg","alt":"Piazza Bellini con alberi, palazzi e tavolini","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"Piazza Bellini oggi, tra caffè e librerie."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port'Alba and the street of the booksellers","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una porta del 1625 e, oltre l'arco, un vicolo di librai e negozi di musica che porta a Piazza Bellini.","rac":"Port'Alba è una delle antiche porte della città. Si apre in un angolo di Piazza Dante e prende il nome dal viceré spagnolo Antonio Álvarez de Toledo, duca d'Alba, che la fece erigere nel 1625 al posto di un'apertura provvisoria, per facilitare il passaggio da un lato all'altro della città. L'aspetto attuale si deve ai lavori di fine Settecento voluti da Ferdinando IV di Borbone.\n\nOltre la porta c'è via Port'Alba, un vicolo pedonale noto per le librerie e i negozi di musica, che porta fino a Piazza Bellini.","con":"Passa sotto l'arco e curiosa tra le bancarelle dei libri: è il modo più semplice per andare da Piazza Dante a Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"L'arco di Port'Alba, ingresso storico al centro antico","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, la porta cinquecentesca sul centro antico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"La porta del 1625","x":"La porta fu eretta nel 1625 per volere del duca d'Alba, viceré spagnolo. Sullo stemma si riconoscono quelli del re Filippo III, della città di Napoli e del viceré. Oggi la porta è in parte nascosta dal colonnato di Piazza Dante.","d":"In un angolo di Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"La porta di Port'Alba con lo stemma","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, la porta del 1625 voluta dal duca d'Alba."}},{"t":"La via dei librai","x":"Il vicolo che attraversa la porta è famoso per il mercato dei libri: librerie, bancarelle e negozi di strumenti musicali, fino a Piazza Bellini.","d":"Oltre la porta, verso Piazza Bellini","foto":null}],"gal":[],"leg":"Una leggenda racconta di una giovane di nome Maria, accusata di stregoneria ai tempi dell'Inquisizione spagnola e lasciata morire in una gabbia appesa alla porta.","fc":null,"col":null},{"id":22,"s":"mann","n":"National Archaeological Museum (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"Uno dei più grandi musei archeologici del mondo: i tesori di Pompei ed Ercolano, la collezione Farnese e il celebre Mosaico di Alessandro.","rac":"Il Museo Archeologico Nazionale ha sede nel Palazzo degli Studi, costruito nel 1585. Nel 1777 re Ferdinando IV di Borbone vi trasferì la collezione Farnese, ereditata dalla madre Elisabetta Farnese. Con il ritorno dei Borbone nel 1816 divenne Real Museo Borbonico; dopo l'Unità d'Italia diventò Museo Nazionale. I dipinti furono trasferiti a Capodimonte nel 1957, e da allora è un museo solo di antichità.\n\nEspone circa 18.000 reperti: le collezioni vesuviane (affreschi, mosaici, oggetti di vita quotidiana, il plastico di Pompei, la Villa dei Papiri), le sculture e le gemme Farnese, il Gabinetto Segreto, la numismatica e una delle più importanti collezioni egizie al mondo.\n\nIl pezzo più celebre è il Mosaico di Alessandro, trovato nel 1831 nella Casa del Fauno a Pompei: raffigura la battaglia di Isso, tra Alessandro Magno e Dario III, ed è composto da circa un milione e mezzo di tessere.","con":"Se hai poco tempo, scegli tre cose: il Mosaico di Alessandro, l'Ercole Farnese e il Gabinetto Segreto. Per vedere tutto servono almeno due o tre ore. Controlla gli orari prima di venire.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Affresco pompeiano esposto al Museo Archeologico Nazionale","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Un affresco pompeiano esposto al MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Ticket office until 6:30 pm"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"Il Mosaico di Alessandro","x":"Trovato nel 1831 nella Casa del Fauno a Pompei, il grande mosaico misura circa 5,82 per 3,13 metri e ha circa un milione e mezzo di tessere. Mostra la battaglia di Isso (333 a.C.) tra Alessandro Magno e Dario III di Persia.","d":"Al piano ammezzato, nella sezione dei mosaici di Pompei","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"Il grande mosaico della battaglia tra Alessandro e Dario","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"Il Mosaico di Alessandro, dalla Casa del Fauno di Pompei."}},{"t":"La collezione Farnese","x":"Raccolta dalla famiglia Farnese per il suo palazzo di Roma, comprende statue monumentali come l'Ercole Farnese, alto circa tre metri e trovato alle Terme di Caracalla, e il Toro Farnese.","d":"Al piano terra","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"La statua dell'Ercole Farnese appoggiato alla clava","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"L'Ercole Farnese, trovato alle Terme di Caracalla."}},{"t":"Il Gabinetto Segreto","x":"Raccoglie opere di arte erotica trovate a Pompei ed Ercolano. Ha un ingresso separato e spesso richiede una prenotazione oraria: chiedi in biglietteria.","d":"Al piano ammezzato","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, museum of contemporary art","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Un palazzo ristrutturato dall'architetto Álvaro Siza che ospita opere di Clemente, Kapoor, Serra, Horn e altri maestri dell'arte contemporanea.","rac":"Il MADRE, museo d'arte contemporanea Donnaregina, è nel Palazzo Donnaregina, a pochi passi dal Duomo e dal Tesoro di San Gennaro. L'edificio fu ristrutturato dall'architetto portoghese Álvaro Siza e il museo, gestito dalla Fondazione Donnaregina per le arti contemporanee, è stato inaugurato nel 2005.\n\nIl primo piano è dedicato a opere realizzate apposta per le sale da artisti come Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long e Mimmo Paladino. La collezione comprende anche Richard Serra, Sol LeWitt e Jeff Koons, e il museo organizza mostre temporanee. È un contrasto voluto con la Napoli antica che lo circonda.","con":"Cerca «Spirits» di Rebecca Horn: sono copie in ghisa dei teschi del Cimitero delle Fontanelle. Il museo è chiuso il martedì e, per lavori, alcune sale del secondo piano sono temporaneamente chiuse: controlla sul sito prima di venire.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"Il cortile bianco del museo Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"Il museo Madre, arte contemporanea a Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Chiuso il martedì. L'ultimo ingresso è un'ora prima della chiusura."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Domenica. L'ultimo ingresso è un'ora prima della chiusura."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"«Ave Ovo» di Francesco Clemente","x":"Un pavimento in maiolica e un affresco monumentale, creati nel 2005 per il museo, occupano due sale su due piani.","d":"Nelle sale dedicate a Clemente","foto":null},{"t":"«Spirits» di Rebecca Horn","x":"L'artista ha riprodotto in ghisa i teschi del Cimitero delle Fontanelle, le «capuzzelle» napoletane. Un legame tra arte contemporanea e Napoli popolare.","d":"Nella sala di Rebecca Horn","foto":null},{"t":"L'architettura di Siza","x":"Siza ha ristrutturato i tre piani del palazzo, mantenendo l'impianto storico e inserendo spazi moderni per le grandi installazioni.","d":"In tutto il museo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Toledo Metro Station","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fermata della Linea 1 considerata una delle più belle d'Europa: mosaici, ceramiche blu e il «Cratere di luce» di Robert Wilson.","rac":"La stazione Toledo fa parte delle «Stazioni dell'Arte», il progetto che ha affidato ad architetti e artisti la progettazione delle fermate della Linea 1, con oltre 250 opere. Fu progettata dall'architetto catalano Oscar Tusquets Blanca e inaugurata il 17 settembre 2012. L'ingresso, in via Diaz, ha tre strutture esagonali rivestite di piastrelle blu e ocra, che portano la luce nell'atrio.\n\nScendendo si incontrano onde in rilievo disegnate da Tusquets, le opere di Robert Wilson (tra cui «Crater de luz», un cratere di luce) e i mosaici di William Kentridge. La stazione è stata più volte indicata tra le più belle d'Europa.\n\nPer vederla basta prendere la metropolitana: serve un biglietto per scendere ai binari.","con":"Scendi fino al piano più profondo e guarda in alto: è lì che la luce del Cratere fa l'effetto migliore. Per entrare serve il biglietto; controlla gli orari del servizio sul sito ANM.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"La banchina della stazione Toledo, nel sottosuolo","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"La banchina della stazione Toledo."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Orario di servizio della Linea 1: dal primo all'ultimo treno."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Orario di servizio della Linea 1: dal primo all'ultimo treno."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Il «Crater de luz» di Robert Wilson","x":"Un cratere di luce, opera di Robert Wilson, firma l'identità della stazione. L'opera cambia con la luce e dà alla discesa un effetto quasi teatrale.","d":"Nei piani sotterranei della stazione","foto":null},{"t":"I mosaici di William Kentridge","x":"Lungo il percorso si vedono mosaici dell'artista sudafricano William Kentridge, che fanno parte del programma delle Stazioni dell'Arte.","d":"Sul percorso verso i binari","foto":null},{"t":"L'ingresso blu di via Diaz","x":"Tre strutture esagonali rivestite di piastrelle blu e ocra, che lasciano entrare la luce nell'atrio. I due colori sono il filo conduttore di tutta la stazione.","d":"All'ingresso di via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, the last Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"Six minutes from Ceraldi, in Via Toledo, the last canvas painted by Caravaggio: the Martyrdom of Saint Ursula.","rac":"Intesa Sanpaolo's Gallerie d'Italia, at Via Toledo 177, houses the Martyrdom of Saint Ursula, Caravaggio's last canvas. Alongside it, three exhibitions are on display: Neapolitan and Southern Italian painting from the 17th to the early 20th century, the 20th century, and over five hundred Attic and Magna Graecia ceramics from the Caputi collection.","con":"Admission is free for everyone on the first Sunday of the month. It's closed on Mondays.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Una sala delle Gallerie d'Italia con quadri alle pareti gialle","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala delle Gallerie d'Italia a Napoli, con le tele del Seicento."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Il Martirio di sant'Orsola","x":"È una scena stretta e buia, quasi senza sfondo: siamo nella tenda di Attila, re degli Unni. Orsola, una principessa, lo ha rifiutato, e lui le ha appena scoccato una freccia nel petto. Lei piega la testa verso la freccia; tre uomini accorrono a sorreggerla. Il re sembra già pentito del suo gesto.\n\nCerca il volto alle spalle della santa: è lo stesso Caravaggio, che si è dipinto tra i testimoni. E osserva la mano che si allunga tra la santa e il re, come per fermare la freccia: è riapparsa durante il restauro del 2003-2004.\n\nLo commissionò il principe genovese Marcantonio Doria, la cui famiglia aveva sant'Orsola come protettrice. È il quadro più tardo di Caravaggio che conosciamo: fu finito nel maggio 1610, poco più di un mese prima della sua morte.","d":"Nella sala dedicata a Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}},{"t":"Il quadro messo al sole","x":"Caravaggio dipinse il quadro in fretta, forse perché stava per partire verso Roma per ottenere il perdono del papa. L'incaricato dei Doria a Napoli, Lanfranco Massa, fece consegnare la tela quando la vernice non era ancora asciutta e, per farla asciugare prima, la mise al sole: la vernice, stesa molto spessa, si rovinò. Lo raccontò lui stesso in una lettera di maggio 1610.\n\nIl quadro arrivò a Genova, poi passò di erede in erede, finì in una villa di Eboli e fu attribuito ad altri pittori. Solo negli anni Ottanta del Novecento il ritrovamento della lettera di Massa ha confermato con certezza che è di Caravaggio.\n\nNel 2025 un nuovo intervento di restauro ha riportato alla luce tre teste che il tempo aveva fatto sparire.","d":"Davanti alla tela","foto":{"u":"../img/6a999eeecae6.jpg","alt":"La tela di Caravaggio esposta in una sala di Palazzo Zevallos, con il soffitto decorato","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Il Martirio di sant'Orsola esposto in una sala di Palazzo Zevallos Stigliano, la sede delle Gallerie d'Italia."}},{"t":"Il palazzo del Banco di Napoli","x":"Prima di salire alle sale, guardati intorno: sei nel palazzo che fu la sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento.\n\nL'architetto Michele De Lucchi lo ha trasformato in museo con un allestimento moderno: le grandi sale della banca oggi ospitano tre percorsi, dall'arte napoletana del Seicento al Novecento, passando per una ricca collezione di vasi greci e della Magna Grecia.\n\nIl museo ha aperto nel 2022 e continua l'attività di Palazzo Zevallos Stigliano, aperto dal 1999 al 2022 a pochi passi da qui.","d":"Entrando, nel salone","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La facciata in pietra del Palazzo del Banco di Napoli su via Toledo, con la bandiera europea","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Il Palazzo del Banco di Napoli su via Toledo, dove hanno sede le Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Spanish Quarters","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Un reticolo di vicoli stretti nato nel Cinquecento per i soldati spagnoli, oggi uno dei quartieri più vivi e fotografati di Napoli.","rac":"I Quartieri Spagnoli nacquero nel 1536 per volere del viceré spagnolo Pedro de Toledo, per ospitare le guarnigioni destinate a mantenere l'ordine. La strada principale, via Toledo, porta il suo nome. Il quartiere è una griglia di vicoli stretti tra via Toledo, il corso Vittorio Emanuele e Monte Echia, e comprende le zone di Avvocata, Montecalvario e San Ferdinando.\n\nL'origine spagnola vive ancora nei nomi delle strade, come via della Trinità degli Spagnoli, dove si trova la chiesa di Santa Maria del Pilar. Nei vicoli ci sono botteghe, panni stesi, altarini e molti murales.\n\nIl più famoso è il murale di Maradona in Largo Maradona, in via Emanuele De Deo: lo realizzò nel 1990 Mario Filardi e negli anni è stato restaurato più volte. È una tappa del giro «Il mare e i castelli», con una scheda propria.","con":"Parti da Piazza Carità e addentrati nei vicoli di giorno. Come in ogni zona affollata, tieni borsa e telefono a portata di mano. Cammina piano: i dettagli stanno nei portoni e nei murales.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"Un vicolo dei Quartieri Spagnoli con il murale di Maradona e le bandiere","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"Nei Quartieri Spagnoli, il murale di Maradona tra le bandiere."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"La griglia dei vicoli","x":"Il piano urbanistico è una griglia regolare di vicoli stretti, nata per alloggiare i soldati spagnoli. Camminando si vedono panni stesi, altarini e botteghe: la vita di quartiere si svolge in strada.","d":"Nei vicoli a ovest di via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"Un vicolo stretto dei Quartieri Spagnoli","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"Uno dei vicoli dritti e stretti della griglia dei Quartieri Spagnoli."}},{"t":"Il murale di Maradona e Largo Maradona","x":"In via Emanuele De Deo, un vecchio parcheggio è diventato Largo Maradona. Il murale del 1990 di Mario Filardi è stato poi restaurato dall'artista argentino Bosoletti, che ha realizzato accanto l'Iside velata.","d":"In via Emanuele De Deo","foto":null},{"t":"La chiesa di Santa Maria del Pilar","x":"In via della Trinità degli Spagnoli si trova la chiesa dedicata dagli spagnoli a Santa Maria del Pilar: una traccia dell'origine spagnola del quartiere.","d":"In via della Trinità degli Spagnoli","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"Maradona's mural","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"The beloved mural in the Spanish Quarter and the square that since 2020 has become a secular sanctuary for Diego.","rac":"The Maradona mural was painted in 1990 by Mario Filardi. In the 1990s, a window in the wall obliterated his face, and the painting almost completely faded. It was restored by Salvatore Iodice, and in the fall of 2017, Argentine artist Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, formerly known as the Artists' Square, was named after him and filled with shrines, flags, and photographs.","con":"It's very crowded during rush hour: early in the morning it's easier to see it calmly.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"The large mural of Maradona on the facade of a building, with the crowd below","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"The mural was painted in 1990 by Mario Filardi. Today's face was repainted in 2017 by Argentine artist Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"Il murale e il suo autore","x":"Il murale del 1990 è opera di Mario Filardi, che dipingeva per passione. Fu restaurato più volte: nel 2017 l'artista argentino Francisco Bosoletti ne ridipinse il volto.","d":"Sulla facciata in via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Il volto di Maradona dipinto sulla facciata di un palazzo","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"Il murale di Maradona in via Emanuele De Deo, con il volto ridipinto nel 2017 da Francisco Bosoletti."}},{"t":"Il largo dal 25 novembre 2020","x":"Dopo la morte di Maradona il largo, prima detto «degli artisti», ha preso il suo nome ed è diventato un luogo di altarini, bandiere e fotografie.","d":"Nello spiazzo davanti al murale","foto":{"u":"../img/76bca69c23a8.jpg","alt":"Il largo davanti al murale di Maradona pieno di persone","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: bandiere, altarini e visitatori davanti al murale."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"The plaque in Largo Maradona with a bust and flags","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"The plaque on the square: after Diego's death in 2020, the artists' square was named after him."},{"u":"../img/550f6edc4b91.jpg","alt":"A small altar with photos of Maradona and memories","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"A small shrine dedicated to Maradona: there are many in the city, with photos and mementos left by fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona painted with a halo next to a small shrine","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona with his halo and his votive shrine, painted in the San Lorenzo area."},{"u":"../img/80d74e92279d.jpg","alt":"A votive shrine with a portrait of Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"A votive shrine for Maradona, like those of the saints."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Umberto I Gallery","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una galleria a croce con una cupola di ferro e vetro alta circa 56 metri, di fronte al Teatro di San Carlo.","rac":"La Galleria Umberto I fu costruita tra il 1887 e il 1890 durante il risanamento di Napoli, il grande piano di ricostruzione urbana seguito all'epidemia di colera. L'architetto Emanuele Rocco la progettò a croce, ispirandosi alla Galleria Vittorio Emanuele II di Milano. Prende il nome da Umberto I, re d'Italia all'epoca della costruzione.\n\nLe quattro braccia si incontrano sotto una cupola di ferro e vetro, sorretta da sedici costoloni. Sotto la cupola il pavimento è un mosaico a stella. Nella galleria si trovano negozi, caffè e, ai piani superiori, appartamenti: era pensata per unire attività commerciali e vita sociale.\n\nSi trova di fronte al Teatro di San Carlo, vicino a Piazza del Plebiscito.","con":"Fermati sotto la cupola e alza lo sguardo: è il punto migliore per vedere il ferro e il vetro. È un luogo di passaggio, con ingresso libero.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"Un ingresso decorato della Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Un ingresso della Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"La cupola di ferro e vetro","x":"Le quattro braccia della galleria si incontrano sotto una cupola di ferro e vetro, sorretta da sedici costoloni. Di giorno la luce entra da ogni lato; la sera l'illuminazione fa risaltare la struttura.","d":"Al centro della galleria","foto":{"u":"../img/5caa008a8527.jpg","alt":"La cupola di ferro e vetro della Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"La cupola di ferro e vetro, dove si incontrano le quattro braccia della galleria."}},{"t":"Il mosaico a stella","x":"Sotto la cupola il pavimento è un mosaico a stella a dodici punte, nei colori crema, terracotta e grigio. Si riconosce guardando in basso, nel punto d'incontro delle braccia.","d":"Sul pavimento, sotto la cupola","foto":null},{"t":"Il risanamento di Napoli","x":"La galleria nacque come simbolo di una città che voleva modernizzarsi dopo l'epidemia di colera. Faceva parte del risanamento, il grande progetto di demolizione e ricostruzione della città, e voleva competere con la Galleria Vittorio Emanuele II di Milano.","d":"Entrando da via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Statue e la scritta ANNO MDCCCXC sulla galleria","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Anno MDCCCXC»: la data di completamento, scritta sulla galleria simbolo del risanamento."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"San Carlo Theater","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"Il più antico teatro d'opera ancora in attività in Europa: inaugurato nel 1737, prima della Scala e della Fenice.","rac":"Il Teatro di San Carlo fu costruito per volere di Carlo III di Borbone e inaugurato il 4 novembre 1737, giorno dell'onomastico del re. Il re voleva per Napoli un teatro più grande del vecchio San Bartolomeo. Fu aperto 41 anni prima della Scala di Milano e 55 prima della Fenice di Venezia: per questo è considerato il più antico teatro d'opera ancora attivo. Il progetto fu affidato a Giovanni Antonio Medrano e Angelo Carasale.\n\nSul suo palcoscenico sono passati compositori come Rossini, Donizetti, Bellini e Verdi. Il teatro è inserito nel Patrimonio UNESCO insieme al centro storico.\n\nSi visita con tour guidati in italiano e in inglese, di circa mezz'ora; nello stesso complesso c'è anche il MeMus, il museo che racconta la storia del teatro e dell'opera.","con":"Le visite dipendono dalle prove e dagli spettacoli: controlla il sito ufficiale e, se puoi, prenota. Se ami l'opera, il modo migliore per conoscerlo è assistere a uno spettacolo.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"La facciata del Teatro San Carlo con le colonne","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"La facciata del Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Visite guidate di circa 30 minuti alle 10:30, 11:30, 12:30, 14:30, 15:30 e 16:30. Prenotazione consigliata."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"La sala e il Real Teatro","x":"La sala a ferro di cavallo è il cuore del teatro: palchi in file sovrapposte e un palco reale. Il San Carlo è famoso anche per l'acustica. Nelle visite guidate in genere si può fotografare la sala e il foyer.","d":"Nella sala, con la visita guidata","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"Un'incisione del Settecento con una festa da ballo nel teatro","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Una festa da ballo nel Real Teatro di San Carlo, in un'incisione del 1749."}},{"t":"Il MeMus","x":"Il MeMus, inaugurato nel 2011, è il museo e archivio storico del teatro. Ripercorre la storia dell'edificio e dell'opera italiana con quadri, fotografie, strumenti musicali e costumi.","d":"Nello stesso complesso del teatro","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Costumi di scena esposti al MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Costumi di scena di un'opera di Paisiello esposti al MeMus."}},{"t":"Il primo teatro d'opera d'Europa","x":"Inaugurato nel 1737, è più antico della Scala di Milano (1778) e della Fenice di Venezia (1792). Per questo è considerato il teatro d'opera più antico ancora in attività.","d":"Davanti alla facciata, su via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"La scritta Real Teatro di S. Carlo sulla facciata","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"«Real Teatro di S. Carlo», sulla facciata del teatro inaugurato nel 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"La piazza più grande di Napoli: da un lato il Palazzo Reale, dall'altro un colonnato che abbraccia la basilica di San Francesco di Paola.","rac":"Ai piedi della collina di Pizzofalcone, Piazza del Plebiscito è una delle piazze più ampie e monumentali della città. Fino al 1817 si chiamava Largo di Palazzo. Nel 1809 Gioacchino Murat fece demolire i conventi della zona e progettare un foro con un colonnato semicircolare. I lavori si interruppero con la fine del suo regno e furono ripresi da Ferdinando I, che volle costruire una chiesa in adempimento a un voto a san Francesco di Paola: la basilica fu eretta tra il 1817 e il 1836, ispirata al Pantheon di Roma.\n\nLa piazza prese il nome attuale dopo il plebiscito del 21 ottobre 1860, che sancì l'annessione del Regno delle Due Sicilie al Regno di Sardegna. Davanti alla basilica ci sono due statue equestri: Carlo III di Borbone, opera di Antonio Canova, e Ferdinando I.\n\nOggi è il luogo di concerti, cerimonie e feste cittadine.","con":"Arriva la mattina presto: la luce radente illumina il colonnato e la piazza è quasi vuota. Dopo, entra nella basilica e fai il giro verso il Palazzo Reale.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito con un leone e la chiesa di San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito e, sullo sfondo, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"Il colonnato e la basilica di San Francesco di Paola","x":"Il colonnato semicircolare nacque con Murat. La basilica è un edificio neoclassico con una cupola centrale alta 53 metri, ispirata al Pantheon. All'interno l'altare maggiore, ricco di pietre preziose e lapislazzuli, fu disegnato da Ferdinando Fuga nel 1751 e portato qui nel 1835 dalla chiesa dei Santi Apostoli.","d":"Sul lato ovest della piazza","foto":{"u":"../img/82ad7240a133.jpg","alt":"L'interno circolare della basilica di San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"L'interno della basilica di San Francesco di Paola, ispirata al Pantheon."}},{"t":"Le statue equestri","x":"Le due statue di bronzo raffigurano Carlo III di Borbone, capostipite della casata, e suo figlio Ferdinando I. Si trovano di fronte alla basilica.","d":"Davanti alla basilica","foto":{"u":"../img/75d762389b74.jpg","alt":"Una statua equestre di bronzo davanti alla basilica","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"Una delle due statue equestri dei Borbone davanti alla basilica."}},{"t":"Il nome della piazza","x":"Il nome si deve al plebiscito del 21 ottobre 1860, con cui il Regno delle Due Sicilie fu annesso al Regno di Sardegna. Prima la piazza si chiamava Largo di Palazzo.","d":"In tutta la piazza","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito vista nella sua ampiezza","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, un tempo Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Royal Palace","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"La grande reggia dei viceré e dei Borbone: scalone d'onore, Teatro di Corte, Sala del Trono e un giardino sul golfo.","rac":"Il Palazzo Reale si affaccia su Piazza del Plebiscito. Fu fatto costruire all'inizio del Seicento dal viceré spagnolo Fernando Ruiz de Castro, conte di Lemos, e per secoli fu sede del potere a Napoli; la costruzione si protrasse per secoli e fu completata solo nel 1858 da Gaetano Genovese. Sulla facciata, nelle nicchie, ci sono otto statue di sovrani di Napoli.\n\nIl museo occupa l'Appartamento storico, al piano nobile: ci si arriva dallo Scalone d'onore, opera di Francesco Antonio Picchiatti del 1651, rivestito di marmo rosa e bianco e considerato tra i più belli d'Europa. Tra le sale ci sono il Teatrino di Corte, la Sala del Trono, la Cappella Reale e il Salone d'Ercole. L'Appartamento storico è aperto al pubblico dal 1919 e fu gravemente danneggiato durante la Seconda guerra mondiale.\n\nIl Giardino romantico, sul lato verso il golfo, ha un ingresso gratuito.","con":"Salendo lo Scalone d'onore fai caso al marmo e alla luce. Di norma è aperto dalle 9 alle 20 (ultimo ingresso alle 19) ed è chiuso il mercoledì: controlla comunque prima di venire.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"La facciata del Palazzo Reale sulla piazza","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"La facciata del Palazzo Reale."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Appartamento di Etichetta (Appartamento Storico). Di norma chiuso il mercoledì. Ultima conferma dalle pagine ufficiali del Ministero della Cultura (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"Lo Scalone d'onore","x":"Disegnato da Francesco Antonio Picchiatti nel 1651, fu rivestito più tardi in marmo rosa e bianco. È considerato uno degli scaloni monumentali più belli d'Europa e porta al museo del piano nobile.","d":"All'ingresso, sul cortile d'onore","foto":{"u":"../img/7533a4a26b58.jpg","alt":"Lo Scalone d'onore di Palazzo Reale","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"Lo Scalone d'onore di Palazzo Reale, rivestito di marmi."}},{"t":"Il Teatrino di Corte e la Sala del Trono","x":"L'Appartamento storico ospita il Teatrino di Corte, la Sala del Trono con un grande lampadario di cristallo, la Cappella Reale e il Salone d'Ercole: erano gli ambienti di vita e di rappresentanza della corte.","d":"Al piano nobile, nell'Appartamento storico","foto":{"u":"../img/841e35a47444.jpg","alt":"Il trono nella Sala del Trono di Palazzo Reale","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"La Sala del Trono nell'Appartamento storico."}},{"t":"Il Giardino romantico","x":"Sul lato verso il golfo c'è il giardino, con ingresso gratuito, dove si cammina tra aiuole e alberi. È un luogo tranquillo con vista sul golfo.","d":"Sul lato del palazzo verso il mare","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"The castle that is the symbol of Naples: a triumphal arch between two towers, a bronze door still struck by a cannonball, and the hall where a king had the barons arrested during a wedding celebration.","rac":"Under the Angevin kings, the castle became a centre of culture: under Robert of Anjou, artists, doctors and men of letters stayed there, including Giotto, Petrarch and Boccaccio.\n\nAlfonso I of Aragon made it his royal residence and rebuilt it. To celebrate his victorious entry into the city, he built the great Triumphal Arch between the Middle Tower and the Watchtower, which still serves as the entrance today.\n\nToday the castle is home to the Civic Museum: the tour includes the art gallery on the first floor, the Barons' Hall, the Palatine Chapel, also known as the Chapel of Santa Barbara, and an archaeological tour in the ancient Armoury.","con":"Full price ticket: €10; €6 for residents of Naples and the metropolitan area; free for children under 18. Closed on Sundays.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"The Maschio Angioino with its two towers and the white arch in the middle","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"The two large towers and, in the middle, the Triumphal Arch of Alfonso of Aragon: this is the entrance to the castle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"The Arc de Triomphe","x":"This is the castle's entrance, nestled between two towers: Alfonso I of Aragon commissioned it to celebrate his victorious entry into Naples. Stop in front of it before entering and admire it from below.","d":"At the entrance, between the Middle Tower and the Watchtower","foto":{"u":"../img/91d08c9a9561.jpg","alt":"The marble Triumphal Arch between the two towers","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"The arch up close: look at it from below, floor by floor."}},{"t":"The door with the cannonball","x":"Ferrante of Aragon commissioned it from Guglielmo Monaco around 1475, to commemorate the 1462 victory over John of Anjou and the rebel barons: six panels recount the war. In the lower left panel, an iron cannonball still embedded in the bronze. The most widely accepted theory is that the door was part of the booty that Charles VIII loaded onto ships bound for France; off the coast of Rapallo, the fleet was attacked by the Genoese and hit. The Genoese sent it back to Naples in 1495.","d":"The original is preserved inside the castle","foto":{"u":"../img/50ee03911e6d.jpg","alt":"The cannonball stuck in the bronze door","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"The iron cannonball embedded in the bronze, in the lower left panel."}},{"t":"The Barons' Hall","x":"It is reached by the external piperno staircase designed by Majorcan architect Guglielmo Sagrera. Look up: the vault rises to about 28 meters, and sixteen piperno ribs extend in a star-shaped pattern from a central opening. The name recalls 1486, when King Ferrante I deceived the barons to celebrate a wedding and had them arrested here. For fifty years, it served as the seat of the City Council.","d":"At the top of the courtyard stairs","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"The star vault of the Barons' Hall","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"The vault of the Barons' Hall: sixteen piperno ribs start in a star shape from the opening in the centre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Un tunnel voluto da un re come via di fuga, diventato rifugio antiaereo e poi deposito: un viaggio sotto la collina di Pizzofalcone.","rac":"La Galleria Borbonica fu ordinata da Ferdinando II di Borbone con decreto del 19 febbraio 1853, e progettata dall'architetto Errico Alvino. Doveva collegare il Palazzo Reale con Piazza della Vittoria e le caserme, passando sotto la collina di Pizzofalcone: una via di fuga rapida per il re. I lavori si interruppero per mancanza di fondi e poi per i cambiamenti politici dell'Unità d'Italia.\n\nDurante la Seconda guerra mondiale alcuni ambienti furono usati come rifugio antiaereo. Nel dopoguerra, fino agli anni Settanta, la galleria fu il deposito giudiziale del Comune di Napoli: ancora oggi si vedono frammenti di statue, auto e moto d'epoca. L'Associazione Culturale Borbonica Sotterranea l'ha ripulita e la fa visitare con una guida.\n\nIl Percorso Standard dura circa un'ora e si può iniziare da due ingressi: via Domenico Morelli 61 e Vico del Grottone 4, a circa 100 metri da Piazza del Plebiscito. Ci sono anche percorsi più avventurosi.","con":"Prenota: la prenotazione è obbligatoria. Il tour standard parte alle 10, 12, 15 e 17 il venerdì, il sabato, la domenica e nei festivi. Si può fotografare.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"Un tunnel scavato nel tufo nella Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Un tratto della Galleria Borbonica, scavata nel tufo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Percorso Standard: tour alle 10, 12, 15 e 17 (venerdì, sabato, domenica e festivi). Prenotazione obbligatoria, durata circa 1 ora. Ingressi: via Domenico Morelli 61 e Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"Il tunnel borbonico","x":"È la parte che racconta l'ambizione di Ferdinando II: un lungo passaggio in tufo giallo, progettato per collegare il Palazzo Reale con Piazza della Vittoria. Il tufo racconta anche il lavoro dei cavatori e l'ingegneria idraulica dell'epoca.","d":"Lungo il percorso principale","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"Un passaggio scavato nel tufo nella Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"Il passaggio dei pozzari, un tratto della Galleria Borbonica scavato nel tufo."}},{"t":"Il rifugio antiaereo","x":"Tra il 1939 e il 1945 migliaia di persone si riparò qui dai bombardamenti. Restano letti, graffiti e oggetti di vita quotidiana dell'epoca. È la parte che colpisce di più chi visita.","d":"Nelle sale del rifugio","foto":{"u":"../img/3200f06943d2.jpg","alt":"Il rifugio antiaereo nella Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"Il rifugio antiaereo della Seconda guerra mondiale."}},{"t":"Auto e moto d'epoca","x":"Nel dopoguerra la galleria fu usata come deposito giudiziario per veicoli sequestrati: ancora oggi si vedono auto e moto d'epoca lungo il percorso.","d":"Lungo il percorso","foto":{"u":"../img/87eab52966bc.jpg","alt":"Auto d'epoca abbandonate nel tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Auto d'epoca lungo il tunnel: il dopoguerra, quando la galleria era un deposito giudiziario."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Seafront and Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"The castle on the islet where the Greek colonists from Cumae landed: you arrive from the seafront, cross the bridge and look out over the gulf from Borgo Marinari.","rac":"The castle stands on the islet of Megaride, made up of two rocks joined by a large arch. Here, in the mid-7th century BC, colonists from Cumae landed, who later founded Partenope on nearby Mount Echia.\n\nIn the 1st century BC, the villa of Lucius Licinius Lucullus stood on the islet and Mount Echia. Remains of this villa remain in the Hall of Columns: in the early Middle Ages, the hall served as the refectory of one of the convents built on the islet.","con":"The castle's interior is closed for renovations until further notice. Today, visitors can visit the castle from the outside, strolling along the seafront and around Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo on the sea, with the blue sky","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo on the islet of Megaride, connected to the seafront by a bridge."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Prenotazione facoltativa."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"The islet of Megaride","x":"View the castle from the seafront: it rests on two rocks joined by a large arch. According to the municipality, it was here that the first settlers from Cumae landed.","d":"From the bridge leading to Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo and the Borgo Marinari marina seen from above","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"From above: the castle on the rock and, next to it, the small port of Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"1841 engraving with Castel dell'Ovo and a sailing boat","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in an 1841 engraving."}],"leg":"The name comes from a legend: the poet Virgil is said to have hidden an egg, locked in a cage, in the castle's cellars.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Sanità District and the Basilica of Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Un quartiere popolare rinato dal basso: la basilica del «Monacone», le catacombe, Totò e i murales.","rac":"Il Rione Sanità è uno dei quartieri più antichi e popolari di Napoli: per secoli è stato luogo di sepolture, ed è oggi un modello di rinascita nato dal basso, con cooperative di giovani che gestiscono catacombe e visite.\n\nAl centro c'è la basilica di Santa Maria della Sanità, costruita tra il 1602 e il 1610 su progetto di Fra Nuvolo, uno dei maggiori esempi del barocco napoletano. È detta San Vincenzo o «'o Munacone», dalla grande statua di san Vincenzo Ferrer che custodisce. La pianta è a croce greca e la cupola è rivestita di maioliche. Sotto la chiesa si trovano le catacombe di San Gaudioso, del IV secolo.\n\nNel rione nacque l'attore Totò, in via Santa Maria Antesaecula, ricordato da murales in tutto il quartiere. Qui è ambientata anche la commedia «Il sindaco del rione Sanità» di Eduardo De Filippo.","con":"Visita il rione di giorno e con calma: le catacombe, la basilica e il Cimitero delle Fontanelle sono vicini. Puoi unire il tutto al Miglio Sacro della domenica.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"La basilica di Santa Maria della Sanità, a cupola","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"La basilica di Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilica. Può chiudere in alcune date: controlla il sito."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"La basilica del Monacone","x":"La chiesa di Fra Nuvolo ha pianta a croce greca e una cupola rivestita di maioliche. Il presbiterio è rialzato e il barocco altare ha una doppia scala. La statua di san Vincenzo Ferrer, il «Monacone», dà il nome popolare alla basilica.","d":"In piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"Il presbiterio rialzato con la doppia scala nella basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"Il presbiterio rialzato della basilica di Santa Maria della Sanità, con la doppia scala."}},{"t":"Le catacombe di San Gaudios
