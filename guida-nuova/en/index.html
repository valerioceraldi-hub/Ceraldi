<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naples Guide · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="../caratteri/caratteri.css">
<link rel="stylesheet" href="../mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:var(--superficie);border-radius:14px;padding:14px}
.guarda .mini{width:32px;height:32px;position:relative}
.guarda.con-foto{grid-template-columns:minmax(0,1fr);padding:0 0 14px;overflow:hidden}
.guarda.con-foto .mini{width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.guarda.con-foto>div:last-child{padding:0 14px}
.guarda .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.02rem}
.guarda .dove{font-size:.82rem;color:var(--accento);font-weight:500}
.guarda p{font-size:.95rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;position:relative}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<main class="pagina" id="app" aria-live="polite"></main>
<script>
var D = {"lingua":"en","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità and Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"The starting point: Piazza Carità, on Via Toledo. From here, the historic center begins just a few minutes' walk away. And here is Ceraldi.","rac":"","con":"Before leaving, a coffee: the tour is long and Naples is best explored with the right cup.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, the lower decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"The straight road that cuts the historic center in two: the lower decumanus of the Greek city, about two kilometers of churches, shops and life.","rac":"Spaccanapoli is the lowest of the three decumani, the parallel streets that crossed Greek Neapolis from west to east. It begins in Piazza del Gesù Nuovo as Via Benedetto Croce, then becomes Via San Biagio dei Librai, crosses Via Duomo, and continues beyond the old town: about two kilometers in total. The name says it all: it is so long and straight that, seen from above, it seems to split the city in two.","con":"Walk along it from Piazza del Gesù towards Via Duomo: it's a slight downhill ride of history, not of effort.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Square and Church of Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A facade of pyramid-shaped stones that looks like a fortress and hides a mystery: engraved signs that no one has yet deciphered with certainty.","rac":"Before being a church, it was a palace: that of the Sanseverino princes, built in 1470; a plaque on the façade commemorates the architect, Novello da San Lucano. The Jesuits preserved the structure and the dark piperno ashlar, with the stones cut into pyramidal shapes, adding white marble elements.\n\nSome stones have engraved markings. Legend has it they're a secret message; some scholars believe they're the marks left by different stonecutters; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes from a score called \"Enigma.\" Look closely and decide for yourself.\n\nThe façade was restored and unveiled on March 12, 2023, after some fragments fell in December 2017; the square has been closed to cars since then.","con":"Look for the markings on the stones at eye level, to the right and left of the portal: the hunt is free.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"The diamond-pointed facade","x":"Before it was a church, it was the façade of the palace of the Sanseverino princes, dating back to 1470. The Jesuits kept it as it was, with its dark piperno stones cut into pyramidal shapes, and added the large Baroque portal. Come closer: many of the stones have engraved signs, and even today there is no consensus on their meaning.","d":"Outside, in the square","foto":null},{"t":"The Expulsion of Heliodorus","x":"The large fresco on the counterfaçade is by Francesco Solimena, from 1725. It depicts Heliodorus attempting to sack the Temple of Jerusalem and being repelled by a celestial knight: a scene full of movement, horses, and fleeing figures. Many visitors miss it because they enter facing the altar.","d":"As soon as you enter, turn towards the door: it is above the entrance","foto":null},{"t":"The dome and the four evangelists","x":"The four triangles at the base of the dome depict the evangelists, painted by Giovanni Lanfranco. The dome you see, however, is not the original: it collapsed in the 1688 earthquake and was replaced in 1786 by a lower, bowl-shaped structure.","d":"In the center of the church, look up","foto":null},{"t":"The chapel of Sant'Ignazio","x":"Dedicated to the founder of the Jesuits, it unites two great names of 17th-century Neapolitan art: Cosimo Fanzago, author of the architecture and statues of the prophets David and Jeremiah, and Jusepe de Ribera, who painted the canvases depicting the life of the saint. Colored marble, statues, and paintings come together: Neapolitan Baroque at its finest.","d":"In one of the two large chapels of the church","foto":null},{"t":"Saint Joseph Moscati","x":"Here lies the resting place of Naples' \"holy doctor\": Giuseppe Moscati, a researcher and university professor who cared for the poor free of charge. He died in 1927 and was proclaimed a saint in 1987. His remains are in a bronze urn by sculptor Amedeo Garufi, beneath the altar of the Chapel of the Visitation.","d":"In the chapel of the Visitation, under the altar","foto":null}],"gal":[],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monastery and Complex of Santa Chiara (majolica cloister)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"The majolica-clad cloister is one of the quietest places in the center: a stone's throw from the chaos of Spaccanapoli, silence.","rac":"Santa Chiara was built in 1310 by order of King Robert of Anjou and Queen Sancha of Majorca. The construction was led first by Gagliardo Primario and then by Lionardo di Vito, and in 1340 the church was opened for worship. The complex consisted of two parts: a convent for the Poor Clares and one for the Friars Minor, adjacent but separate.\n\nFour centuries later, at the suggestion of Queen Maria Amalia of Saxony, wife of Charles of Bourbon, the Poor Clare cloister was renovated. Architect Domenico Antonio Vaccaro retained the 14th-century Gothic arches and transformed the center into a Baroque garden, lined with majolica tiles from the workshop of Donato and Giuseppe Massa. The result is one of the most surprising places in Naples: a ceramic garden just steps from Spaccanapoli.","con":"On Sundays the cloister closes at 2 pm: if it's Sunday afternoon, swap orders and come here first.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloister and museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloister and museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"}],"ant":true,"dett":[{"t":"The majolica pillars","x":"Sixty-four pillars covered in majolica tiles with festoons of leaves, flowers, and fruit, under a pergola. The yellow, orange, and blue colors recall the citrus trees and vines growing around them. The majolica tiles are from the workshop of Donato and Giuseppe Massa, in the Baroque garden designed by Domenico Antonio Vaccaro.","d":"In the cloister garden","foto":null},{"t":"The scenes on the seats","x":"The seats connecting the pillars are all majolica, and the backrests are painted with small scenes: country life, seaside life, folk festivals, myths. They represent eighteenth-century Neapolitan life told through images. Sit down and take a closer look at the one behind you.","d":"On the backs of the seats between the pillars","foto":null},{"t":"The Clarissa with the cats","x":"Among the scenes is a Poor Clare nun feeding the cloister cats: a small glimpse of daily life in the monastery, painted on the majolica. Finding it is a perfect treasure hunt, even for children.","d":"On one of the seat backs: look for it","foto":null},{"t":"The arches of the fourteenth century","x":"The garden is Baroque, but the setting is medieval: Vaccaro preserved the 14th-century perimeter with the pointed arches of the Angevin monastery. Notice the contrast between the austere stone of the arches and the bright colors of the majolica tiles: four centuries in a single glance.","d":"Along the four sides of the cloister","foto":null}],"gal":[],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Chapel","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"The Veiled Christ, one of the most famous sculptures in the world, and the anatomical machines of the alchemist prince Raimondo di Sangro.","rac":"The di Sangro family chapel is the kingdom of Raimondo, Prince of Sansevero: a man of science and secrets, Grand Master of Freemasonry, around whom the myth was born when he was still alive, and it was he himself who fueled it.\n\nAt the center is Giuseppe Sanmartino's Veiled Christ, commissioned by the prince: a reclining body covered by a shroud so thin it resembles wet cloth, yet carved from the same block of marble as the statue. In the underground cavea are two \"anatomical machines,\" skeletons of a man and a woman with reconstructed blood vessels, the work of the Palermo physician Giuseppe Salerno around 1756-1764. The black legend tells of sacrificed servants and mysterious injections; the museum itself carefully separates myth from documented history.","con":"It is closed on Tuesdays: if today is Tuesday, the statue of the Nile is two minutes away and can always be seen.","acc":"The nave and sacristy are wheelchair accessible. The underground auditorium with its anatomical machines is accessible only by a narrow 19th-century spiral staircase.","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"The Veiled Christ","x":"A body stretched out on a mattress, covered by a shroud so thin that the face, wounds, and veins can be seen beneath. The veil is not added: Giuseppe Sanmartino carved it from the same block of marble as the statue, commissioned by Prince Raimondo di Sangro. Walk around it slowly: the veil seems to change on each side.","d":"In the center of the nave","foto":null},{"t":"Modesty","x":"A woman wrapped in a veil that clings to her skin as if wet, with a garland of roses. It was sculpted by Antonio Corradini in 1752, the year of his death, and the prince dedicated it to his mother, Cecilia Gaetani, who passed away when he was not yet a year old. Look for the broken tombstone at her feet: it is the sign of a life cut short too soon.","d":"Near the main altar","foto":null},{"t":"The Disillusionment","x":"A man frees himself from a large net with the help of a small winged genie with a flame on his forehead, a symbol of intellect. Francesco Queirolo sculpted it in 1753-54 to commemorate the prince's father. The net is entirely made of perforated marble: according to tradition, the assistants refused to refine it for fear of breaking it, so the sculptor smoothed it himself.","d":"Near the main altar","foto":null},{"t":"The labyrinthine floor","x":"The original floor was a labyrinth of colored marbles traversed by a continuous white line, conceived by the prince as a symbol of the arduous path to knowledge. Francesco Celebrano built it until around 1771. A collapse in 1889 destroyed almost all of it: a few slabs remain in the passage in front of Raimondo's tomb, in the cavea, and in the sacristy.","d":"In the passage in front of the prince's tomb","foto":null},{"t":"The anatomical machines","x":"Two skeletons, a man and a woman, with their blood vessels reconstructed with a precision that still amazes. They were created by the Palermo physician Giuseppe Salerno between 1756 and 1764. The dark legend of the prince was born around them: the museum carefully explains where the story ends and the myth begins.","d":"In the underground cavea, going down a narrow spiral staircase","foto":null}],"gal":[],"leg":"Much was said about Raimondo di Sangro during his lifetime: mysterious experiments, alchemical secrets, even servants transformed into anatomical machines. The museum carefully distinguishes the black legend from the documented facts: it's worth hearing both versions and choosing a side.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli and statue of the Nile","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai and its shops","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"The booksellers' and artisans' section of Spaccanapoli: shops, churches, and the Doll Hospital.","rac":"This is the stretch of Spaccanapoli that runs from Piazzetta Nilo to Via Duomo, on the lower decumanus. Its name comes from the bookshops that have always been located there: an inscription on the nearby Palazzo Marigliano commemorates the art of the master booksellers. Devotion to Saint Blaise dates back to the 8th century, when nuns from Armenia brought a relic of the saint to Naples. Also along the street is the Ospedale delle Bambole, an artisan workshop passed down from generation to generation.","con":"December is the month of nativity scene shops: be prepared for crowds on weekends.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella at the Booksellers' and the skull with ears","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A tiny stonemason's church dedicated to the saint of eyes, and a unique skull: the one with ears.","rac":"Founded shortly before 1327 by Bartolomeo di Capua, a jurist to the Angevin kings, the church was then entrusted to the pipernieri, the stone cutters: they chose Saint Lucia, protector of sight, because the splinters from their trade put their eyes at risk.\n\nAbandoned for over thirty years, it was reopened on April 5, 2019, thanks to the Respiriamo Arte association. In its underground vault, the cult of the \"anime pezzentelle\" (sick souls) left a skull unlike any other: it has ears.","con":"It's small and can be visited in just a few minutes: perfect as a break between Sansevero and Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"}],"ant":true,"dett":[{"t":"The coat of arms of the Pipernieri","x":"Before entering, look up: above the piperno stone portal, there's still a fresco with the coat of arms of the piperno stone guild, the stonecutters to whom the church belonged. They worked among the chips, and for this reason, they chose Saint Lucy, the protector of sight.","d":"Above the entrance portal","foto":null},{"t":"The skull with ears","x":"Beneath the church, in the hypogeum, there's a skull with preserved ear cartilage: this makes it unique. Popular tradition holds that, precisely because it has ears, it better hears the prayers of those who ask for a favor.","d":"In the hypogeum, with a guided tour","foto":null},{"t":"The poor souls","x":"In the 17th century, after the plague, Neapolitans \"adopted\" the skulls of the nameless dead: they cleaned them, prayed for them, and asked for help in return. It was the cult of the anime pezzentelle, the poor souls. Here remains one of the city's most famous testimonies.","d":"In the hypogeum","foto":null}],"gal":[],"leg":"It is said that the skull with ears, precisely because it has ears, listens better to prayers: for this reason, for generations, the most difficult requests have been entrusted to it.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Doll Hospital","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"A shop that has been curating dolls and toys for generations: a shop window that children, and adults, will always remember.","rac":"At the end of the 19th century, Luigi Grassi worked as a set designer for theaters and nativity scenes. Neighbors began bringing him broken dolls and toys, and his workshop became, almost by accident, the first toy \"hospital\" in Naples.\n\nToday, it's run by Tiziana, the founder's great-granddaughter, in the courtyard of Palazzo Marigliano on Via San Biagio dei Librai. Inside, it functions like a real hospital: white coats, wards, and a medical record for each patient. For many Neapolitans, it's the place where they took their favorite toy as children.","con":"The window display alone is worth the stop: it's on the way back.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"}],"ant":true,"dett":[{"t":"A real hospital, for toys","x":"It is not a shop but a laboratory organized like a hospital: the \"doctors\" in white coats, the orthopedics, ophthalmology and tailoring departments, and the patients, dolls, teddy bears and soft toys, each with their own medical records and diagnosis.","d":"In the shop","foto":null},{"t":"The founder set designer","x":"It all began in the late 19th century with Luigi Grassi, a set designer for theaters and nativity scenes. Neighbors began bringing him broken toys, and he transformed the workshop into the first \"hospital.\" Today, his great-granddaughter, Tiziana, treats the patients.","d":"In the history of the shop","foto":null},{"t":"The courtyard of Palazzo Marigliano","x":"The hospital is located in the courtyard of Palazzo Marigliano, along Spaccanapoli. As you enter the main door, the street noise fades: it's one of the many hidden courtyards in the historic center worth discovering.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, the church of the capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"The Church of the capuzzelle: beneath the floor, the hypogeum where Naples prayed for nameless souls. And Lucia's skull.","rac":"Neapolitans call it \"'e cape 'e morte,\" the church of the death's heads. It's a small 17th-century church on the main decumanus, linked to the devotion to the souls in Purgatory spread by the Counter-Reformation. A steep staircase leads to the hypogeum, the underground church, expanded and decorated with majolica in the 18th century: here, devotees cared for anonymous remains and sought their intercession. At the end of a small corridor, the skull of Lucia, a particularly beloved young soul, is kept.","con":"Behind the altar, look for the marble winged skull by Dionisio Lazzari: it is the symbol of the church.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":18,"s":"duomo-san-gennaro","n":"Cathedral and Treasure of San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Naples Cathedral and the Treasury Chapel, where the vial of San Gennaro's blood is kept.","rac":"In the Cathedral, in a niche in the Treasury Chapel, the ampoule containing the blood traditionally attributed to San Gennaro is kept. Three times a year (the Saturday before the first Sunday in May, September 19th, and December 16th) its liquefaction is awaited. Since 1601, the relics have been entrusted to a secular institution, the Deputation of the Treasury Chapel of San Gennaro.","con":"On liquefaction days, the Duomo is packed from morning: if you want to be there, arrive early.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"Banksy's Madonna with a Gun","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"A Madonna by Banksy with a gun instead of a halo, protected by glass, in the heart of the main decumanus.","rac":"In Piazzetta dei Girolamini, on a façade of the main decumanus, Banksy left a Madonna with a gun in place of her halo. Today, it's protected by glass. The city's official tourist website includes it in its itinerary dedicated to street art in the historic center.","con":"Look up: the work is above street level, behind glass.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Your first walk","sub":"Spaccanapoli in half a day, starting from Ceraldi","desc":"The heart of the historic center in a circular walk: the Gesù Nuovo and its mystery, the cloister of Santa Chiara, the Veiled Christ, the Church of the Skull and Ears, the shops of Via San Biagio dei Librai. And then we return to us.","dur":180,"dist":3062,"et":["primo_giro","mezza 07,40.84866],[14.25574,40.84855],[14.25533,40.84841],[14.25531,40.8484],[14.25475,40.84822],[14.25433,40.84807],[14.25388,40.84792],[14.25305,40.84764],[14.25244,40.84744],[14.25214,40.84734],[14.25195,40.84727],[14.25135,40.84707],[14.25124,40.84703],[14.25086,40.84691],[14.25047,40.84678],[14.25008,40.84665],[14.25005,40.84665],[14.25004,40.84666],[14.25,40.84665],[14.24938,40.84644],[14.24934,40.84643],[14.24933,40.84638],[14.24928,40.84638],[14.24927,40.84634],[14.24918,40.84554],[14.24918,40.84553],[14.2491,40.84484],[14.2491,40.84478],[14.24909,40.84468],[14.24908,40.84464],[14.24911,40.84463],[14.24908,40.84433]],"sv":[{"k":"parti","n":"","d":65,"a":0},{"k":"gira","m":"right","n":"Via dei Tribunali","d":165,"a":65},{"k":"gira","m":"left","n":"Vico dei Maiorani","d":196,"a":230},{"k":"gira","m":"right","n":"Via San Biagio dei Librai","d":940,"a":426},{"k":"gira","m":"left","n":"","d":232,"a":1366},{"k":"arrivo","a":1598}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Naples in Five Minutes: From the Siren to the New City","som":"First Partenope, then Neapolis: because the historic center is still designed like a Greek city.","txt":"Naples was founded twice. The first time it was called Partenope, like the mythical siren: it was founded in the 7th century BC by colonists of Greek origin from Cumae, who landed on the islet of Megaride, where Castel dell'Ovo stands today, and settled on nearby Mount Echia.\n\nThe second time, around 470 BC, a new city arose next to the old one: Neapolis, meaning \"new city\" in Greek. This is the one you are now passing through. Its streets form a regular grid that, after twenty-five centuries, is still legible: the historic center of Naples is a UNESCO World Heritage Site precisely because the design of the Greek city has remained its backbone.\n\nThree parallel streets, the decumani, cut the city from west to east. The lowest one is Spaccanapoli: about two kilometers long, so straight that, seen from above, it appears to divide the city in two, hence its name. In the center runs Via dei Tribunali, the main decumanus; higher up are Via dell'Anticaglia and Via della Sapienza, the upper decumanus.\n\nFrom Piazza Carità, where we have been since 2002, Spaccanapoli begins a few minutes' walk away, in Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro and the Melting Blood","som":"Three times a year, Naples holds its breath over a vial. What happens, where, and what the Church and science say about it.","txt":"In Naples Cathedral, in a niche in the Treasury Chapel, a vial containing a dark substance is kept, which tradition holds to be the blood of San Gennaro, the city's patron saint. Three times a year—on the Saturday before the first Sunday in May, on September 19th (the feast day), and on December 16th—the vial is shown to the faithful: if the contents, usually solid, dissolve, it's a celebration; if they remain solid, for many Neapolitans, it's a bad omen.\n\nThe first known record of the liquefaction dates back to 1389. The relics are not guarded by the clergy but by the Deputation of the Chapel of the Treasure of San Gennaro, a secular institution founded in 1601, which also includes the mayor of Naples.\n\nThe Church maintains a cautious stance: it speaks of a \"miraculous event,\" allows popular devotion, but does not impose it as a truth of faith. Among the explanations proposed by skeptics is thixotropy, the property of certain substances that are solid at rest and become liquid when moved or shaken.\n\nThe sacred and the profane have always coexisted here: in Via Duomo, a few steps from the cathedral, the street artist Jorit painted a San Gennaro with the face of a worker.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"The Poor Souls: When Naples Adopted a Skull","som":"Ossuaries, capuzzelle, and prayers exchanged for lottery numbers: the cult of the nameless dead.","txt":"For centuries, in Naples, the nameless dead were not left alone. They were called anime pezzentelle: the poor souls who died without a funeral and without anyone to pray for them. The name is linked to \"pezzente,\" the poor man, but also to the Latin \"petere,\" to ask in order to receive: those who prayed for them hoped to receive protection and grace in return.\n\nThe symbolic site is the Fontanelle Cemetery, in the Sanità district: a sixteenth-century tuff quarry covering approximately four thousand square meters, which welcomed victims of the plague of 1656 and then those of cholera in 1836-1837. In 1872, Canon Gaetano Barbati arranged the bones in three naves. Devotees \"adopted\" a skull, a capuzzella: they cleaned it, placed it in a small shrine, adorned it with rosaries and coins, and prayed to it, waiting for a sign in a dream, sometimes a lottery number. Some skulls became famous: the Captain, with a blackened eye socket, the subject of a legend of marriage and jealousy; Donna Concetta, who is said to \"sweat\" when grace is granted.\n\nIn 1969, a decree from the ecclesiastical court closed the ossuary and banned worship. Closed for renovations since 2020, the cemetery reopened to the public in 2026, managed by the La Paranza cooperative.\n\nThe cult also lives on beneath Via dei Tribunali, in the hypogeum of Santa Maria delle Anime del Purgatorio ad Arco, the church Neapolitans call \"'e cape 'e morte\": there, the skull of Lucia, a particularly beloved young soul, is kept. And on Via San Biagio dei Librai, in the small church of Santa Luciella, there is a unique skull: the one with ears.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoteric Naples: An alchemist prince, a coded facade, and a magic egg","som":"Raimondo di Sangro, the rustication of the Gesù Nuovo, Virgil's egg, the munaciello: where history ends and legend begins.","txt":"Naples loves mysteries, and it has some very beautiful ones. The most famous has a name: Raimondo di Sangro, Prince of Sansevero, an eighteenth-century man, Grand Master of Neapolitan Freemasonry, a jealous inventor of his own secrets. The myth surrounded him even in his lifetime, and he himself fueled it. Benedetto Croce called him the Neapolitan incarnation of Doctor Faustus. The black legend attributes everything to him: servants killed to study their bodies, even the blinding of the sculptor of the Veiled Christ so he wouldn't sculpt another. These are legends, and the museum itself distinguishes them from documented history.\n\nThe Veiled Christ is the work of Giuseppe Sanmartino, commissioned by the prince: the transparent veil covering the body is carved from the same block of marble as the statue. In the chapel's underground cavea are the \"anatomical machines,\" two skeletons with reconstructed circulatory systems, created by the Palermo physician Giuseppe Salerno around 1756-1764. Legend has it that they involved mysterious injections and studies of beeswax and dyes.\n\nNot far away, the façade of the Gesù Nuovo, originally the Sanseverino palace in 1470, is covered with a pyramid-shaped ashlar of dark piperno stone. Some stones bear engraved markings: legend has it, a secret message; some scholars say they are the stonecutters' marks; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes, a score lasting about three-quarters of an hour called \"Enigma.\" A tempting hypothesis, not a certainty.\n\nAnd then there's the sea: according to legend, the poet Virgil hid the egg of the siren Partenope in the cellars of Castel dell'Ovo. As long as the egg remains intact, the castle remains standing.\n\nIn the houses, however, live the spirits of popular tradition: the munaciello, a hooded elf who brings good luck or mischief depending on how you treat him, and the bella 'mbriana, a good spirit of the house, who can appear as a butterfly or a gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples today: what's new?","som":"The square dedicated to Maradona, the street art, the last Caravaggio on Via Toledo, reopened churches and ossuaries: the changing city.","txt":"Those who return to Naples after a few years find a city that has learned to tell its story.\n\nIn the Spanish Quarter, nine minutes from us, is Largo Maradona. The mural of Diego was painted in 1990 by Mario Filardi; over the years, it faded to the point of almost disappearing, then was restored thanks to Salvatore Iodice, and in the fall of 2017, the Argentine Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, previously called the artists' square, became a secular sanctuary of small altars, Argentine flags, and photographs, so popular that the municipality had to manage pedestrian traffic.\n\nStreet art has entered the historic center: in Piazzetta dei Girolamini, protected by glass, stands Banksy's Madonna with a Gun; on Via Duomo, Jorit's San Gennaro the Worker. The city's official tourist website has dedicated a dedicated itinerary to them.\n\nOn Via Toledo, six minutes from us, the Gallerie d'Italia houses the Martyrdom of Saint Ursula, Caravaggio's last canvas, along with over five hundred Attic and Magna Graecia vases.\n\nAnd places that had been closed for a long time are reopening: the church of Santa Luciella ai Librai, abandoned for over thirty years, was reopened to the public on April 5, 2019; the Fontanelle Cemetery reopened in 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permane /* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;

function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */

    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }

}

var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){

    if(!G) return;

    var i = IT[G.s], tp = i.tappe[G.k], l = LU[tp.l];
    if(tp.geo){ var r = suLinea(G.pos, tp.geo); G.lungo = r.lungo; G.fuori = G.acc < 40 && r.off > 60; }
    var dest = xy([l.lon, l.lat]), io = xy(G.pos), dist = Math.hypot(dest[0] - io[0], dest[1] - io[1]);
    G.vicino = (G.acc <= 40 && dist < 35) ? (G.vicino || 0) + 1 : 0;
    if(G.vicino >= 2 && !G.arrivato) G.arrivato = true;   /* due posizioni precise di seguito entro 35 m dalla tappa */
    aggiornaCammino();
  }, function(){ if(G){ G.negata = true; aggiornaCammino(); } }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});

}

  var gal = (l.foto ? [l.foto] : []).concat(l.gal || []);
  h += '<div class="galleria">' + (gal.length ? gal.map(function(g){ return '<figure><img src="' + e(g.u) + '" alt="' + e(g.alt) + '" loading="lazy"><figcaption>' + e(g.aut) + ' · ' + e(g.lic) + '</figcaption></figure>'; }).join('') : '<figure>' + illustrazione(l.tipo, l.n) + '</figure>') + '</div>';
  h += '<div class="stack-s"><span class="etichetta">' + e(l.dv ? T.visita + ' ' + durata(l.dv) : T.luoghi) + '</span><h1>' + e(l.n) + '</h1><span>' + etichetta(stato(l, ora, ora.min)) + '</span></div>';
  if(l.som) h += '<div class="stack-s"><h3>' + e(T.perche_speciale) + '</h3><p style="font-size:1.08rem">' + e(l.som) + '</p></div>';
  if(l.som || l.rac) h += '<button class="btn sec" onclick="ascolta(LU[' + l.id + '], this)">▶ ' + e(T.ascolta) + '</button>';
  if(l.dett && l.dett.length) h += '<div class="stack-s"><h3>' + e(T.cosa_guardare) + '</h3>' + l.dett.map(function(x, n){
      return '<article class="guarda' + (x.foto ? ' con-foto' : '') + '"><div class="mini">' + (x.foto ? '<img src="' + e(x.foto.u) + '" alt="' + e(x.foto.alt) + '" loading="lazy" style="width:100%;height:100%;object-fit:cover">' : '') + '<span class="n">' + (n + 1) + '</span></div>' +
        '<div style="min-width:0;display:grid;gap:4px"><b>' + e(x.t) + '</b>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<p>' + e(x.x) + '</p>' +
        (x.foto ? '<span class="piccolo" style="font-size:.72rem">' + e(x.foto.aut) + ' · ' + e(x.foto.lic) + '</span>' : '') + '</div></article>'; }).join('') + '</div>';
  if(l.rac) h += '<details class="apri"' + (l.dett && l.dett.length ? '' : ' open') + '><summary>' + e(T.storia) + '</summary><div class="testo">' + par(l.rac) + '</div></details>';
  if(l.leg) h += '<details class="apri"><summary>' + e(T.leggende) + '</summary><div class="testo">' + par(l.leg) + '</div></details>';
  if(l.con) h += '<details class="apri" open><summary>' + e(T.consiglio) + '</summary><div><p>' + e(l.con) + '</p></div></details>';
  var info = '';
  if(!l.sa && verificati(l, ora) && l.or.length){
    info += '<table class="orari">';
    for(var g = 1; g <= 7; g++){ var fs = fasce(l, ora.data, g), ap = fs.filter(function(o){ return !o.x && o.da; });
      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  } else if(!l.sa) info += '<p>' + etichetta({k: 'verifica'}) + '</p>';
  var pr = [];
  if(l.dv) pr.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) pr.push(e(T.gratuito)); else if(l.gr === false) pr.push(e(T.pagamento));
  if(l.mp) pr.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';
  if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';
  if(l.fc) info += '<p>' + e({si: T.foto_si, no: T.foto_no, senza_flash: T.foto_senza_flash}[l.fc] || '') + '</p>';
  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.foto ? '<div class="galleria"><figure><img src="' + e(r.foto.u) + '" alt="' + e(r.foto.alt) + '"><figcaption>' + e(r.foto.aut) + ' · ' + e(r.foto.lic) + '</figcaption></figure></div>' : '') +
    '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
