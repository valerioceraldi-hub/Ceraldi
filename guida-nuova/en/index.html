t of the façade, on Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"The inscription Real Teatro di S. Carlo on the façade","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"“Real Teatro di S. Carlo”, on the façade of the theatre inaugurated in 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"The largest square in Naples: on one side the Royal Palace, on the other a colonnade embracing the basilica of Saint Francis of Paola.","rac":"At the foot of the Pizzofalcone hill, Piazza del Plebiscito is one of the largest and most monumental squares in the city. Until 1817 it was called Largo di Palazzo. In 1809 Joachim Murat had the convents in the area demolished and a forum with a semicircular colonnade designed. Work stopped with the end of his reign and was resumed by Ferdinand I, who wished to build a church in fulfilment of a vow made to Saint Francis of Paola: the basilica was built between 1817 and 1836, inspired by the Pantheon in Rome.\n\nThe square took its present name after the plebiscite of 21 October 1860, which sanctioned the annexation of the Kingdom of the Two Sicilies to the Kingdom of Sardinia. In front of the basilica stand two equestrian statues: Charles III of Bourbon, the work of Antonio Canova, and Ferdinand I.\n\nToday it is the venue for concerts, ceremonies and city festivities.","con":"Arrive early in the morning: the low, raking light illuminates the colonnade and the square is almost empty. Afterwards, step inside the basilica and walk around towards the Royal Palace.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito with a lion and the church of San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito and, in the background, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"The Colonnade and the Basilica of San Francesco di Paola","x":"The semicircular colonnade came into being under Murat. The basilica is a neoclassical building with a central dome 53 metres high, inspired by the Pantheon. Inside, the high altar, rich in precious stones and lapis lazuli, was designed by Ferdinando Fuga in 1751 and brought here in 1835 from the church of Santi Apostoli.","d":"On the west side of the square","foto":{"u":"../img/82ad7240a133.jpg","alt":"The circular interior of the Basilica of San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"The interior of the Basilica of San Francesco di Paola, inspired by the Pantheon."}},{"t":"The Equestrian Statues","x":"The two bronze statues depict Charles III of Bourbon, founder of the dynasty, and his son Ferdinand I. They stand in front of the basilica.","d":"In front of the basilica","foto":{"u":"../img/75d762389b74.jpg","alt":"A bronze equestrian statue in front of the basilica","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"One of the two equestrian statues of the Bourbons in front of the basilica."}},{"t":"The Name of the Square","x":"The name comes from the plebiscite of 21 October 1860, by which the Kingdom of the Two Sicilies was annexed to the Kingdom of Sardinia. Before that, the square was called Largo di Palazzo.","d":"Throughout the square","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito seen in its full breadth","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, formerly Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Royal Palace","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"The great palace of the viceroys and the Bourbons: Grand Staircase, Court Theatre, Throne Room and a garden over the gulf.","rac":"The Royal Palace overlooks Piazza del Plebiscito. It was commissioned at the beginning of the 17th century by the Spanish viceroy Fernando Ruiz de Castro, Count of Lemos, and for centuries it was the seat of power in Naples; construction dragged on for centuries and was completed only in 1858 by Gaetano Genovese. On the façade, in the niches, stand eight statues of rulers of Naples.\n\nThe museum occupies the Historic Apartment, on the piano nobile: you reach it by the Grand Staircase, designed by Francesco Antonio Picchiatti in 1651, faced in pink and white marble and considered among the most beautiful in Europe. Among the rooms are the Court Theatre, the Throne Room, the Royal Chapel and the Hercules Hall. The Historic Apartment has been open to the public since 1919 and was severely damaged during the Second World War.\n\nThe Romantic Garden, on the side facing the gulf, has free admission.","con":"As you climb the Grand Staircase, notice the marble and the light. It is usually open from 9 am to 8 pm (last entry at 7 pm) and closed on Wednesdays: check before you come, just in case.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"The façade of the Royal Palace on the square","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"The façade of the Royal Palace."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Apartment of Etiquette (Historic Apartment). Usually closed on Wednesdays. Last confirmed from the official pages of the Ministry of Culture (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"The Grand Staircase","x":"Designed by Francesco Antonio Picchiatti in 1651, it was later clad in pink and white marble. It is considered one of the most beautiful monumental staircases in Europe and leads to the museum on the piano nobile.","d":"At the entrance, on the Courtyard of Honour","foto":{"u":"../img/7533a4a26b58.jpg","alt":"The Grand Staircase of the Royal Palace","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"The Grand Staircase of the Royal Palace, clad in marble."}},{"t":"The Court Theatre and the Throne Room","x":"The Historic Apartment houses the Court Theatre, the Throne Room with a large crystal chandelier, the Royal Chapel and the Hercules Hall: these were the rooms where the court lived and held its official functions.","d":"On the piano nobile, in the Historic Apartment","foto":{"u":"../img/841e35a47444.jpg","alt":"The throne in the Throne Room of the Royal Palace","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"The Throne Room in the Historic Apartment."}},{"t":"The Romantic Garden","x":"On the side facing the gulf is the garden, with free entrance, where you can stroll among flowerbeds and trees. It is a peaceful spot with a view of the gulf.","d":"On the side of the building facing the sea","foto":{"u":"../img/982684065526.jpg","alt":"The garden of the Royal Palace with flower beds, palm trees and street lamps, and the palace in the background","aut":"Yair Haklai","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Royal_Palace_(Naples)_-_Garden.jpg","dida":"The garden of the Royal Palace, with its flower beds and trees."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"The castle that symbolises Naples: a triumphal arch between two towers, a bronze door still hit by a cannonball, and the hall where a king had the barons arrested during a wedding feast.","rac":"Under the Angevin kings the castle became a centre of culture: under Robert of Anjou it hosted artists, physicians and men of letters, including Giotto, Petrarch and Boccaccio.\n\nAlfonso I of Aragon made it his royal residence and rebuilt it. To celebrate his victorious entry into the city, he had the great Triumphal Arch built between the Middle Tower and the Guard Tower; it still serves as the entrance today.\n\nToday the castle houses the Civic Museum: the visit includes the picture gallery on the first floor, the Hall of the Barons, the Palatine Chapel, also known as the Chapel of Saint Barbara, and an archaeological route through the ancient Armoury.","con":"Full-price ticket 10 euros; 6 euros for residents of Naples and the metropolitan city; free for under-18s. Closed on Sundays.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"The Maschio Angioino with its two towers and the white arch in between","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"The two great towers and, in between, the Triumphal Arch of Alfonso of Aragon: it is the entrance to the castle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"The Triumphal Arch","x":"This is the entrance to the castle, squeezed between two towers: Alfonso I of Aragon wanted it to celebrate his victorious entry into Naples. Stop in front of it before going in and look at it from below.","d":"At the entrance, between the Middle Tower and the Guard Tower","foto":{"u":"../img/91d08c9a9561.jpg","alt":"The marble Triumphal Arch between the two towers","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"The arch up close: look at it from below, level by level."}},{"t":"The door with the cannonball","x":"Ferrante d'Aragona commissioned it from Guglielmo Monaco around 1475, to commemorate the 1462 victory over John of Anjou and the rebel barons: six panels tell the story of the war. In the lower left panel there is still an iron cannonball embedded in the bronze. The most widely accepted theory: the door was part of the loot that Charles VIII loaded onto ships bound for France; off Rapallo the fleet was attacked by the Genoese and the shot struck it. The Genoese sent it back to Naples in 1495.","d":"The original is kept inside the castle","foto":{"u":"../img/50ee03911e6d.jpg","alt":"The cannonball embedded in the bronze door","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"The iron cannonball embedded in the bronze, in the lower left panel."}},{"t":"The Hall of the Barons","x":"You reach it by the outer piperno staircase designed by the Majorcan architect Guillermo Sagrera. Look up: the vault rises to about 28 metres, and sixteen piperno ribs spread out like a star from an opening at the centre. The name recalls 1486, when King Ferrante I tricked the barons into coming to celebrate a wedding and had them arrested here. For fifty years it was the seat of the City Council.","d":"At the top of the courtyard staircase","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"The star-shaped vault of the Hall of the Barons","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"The vault of the Hall of the Barons: sixteen piperno ribs radiate like a star from the opening at the centre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"A tunnel commissioned by a king as an escape route, later turned into an air-raid shelter and then a depot: a journey beneath the hill of Pizzofalcone.","rac":"The Galleria Borbonica was commissioned by Ferdinand II of Bourbon by decree of 19 February 1853 and designed by the architect Errico Alvino. It was meant to link the Royal Palace with Piazza della Vittoria and the barracks, passing under the hill of Pizzofalcone: a quick escape route for the king. Work stopped for lack of funds and then because of the political changes brought by the Unification of Italy.\n\nDuring the Second World War some of its chambers were used as an air-raid shelter. After the war, until the 1970s, the tunnel served as the judicial depot of the City of Naples: even today you can see fragments of statues, and vintage cars and motorbikes. The Associazione Culturale Borbonica Sotterranea has cleaned it up and offers guided visits.\n\nThe Standard Route lasts about an hour and can be started from two entrances: via Domenico Morelli 61 and Vico del Grottone 4, about 100 metres from Piazza del Plebiscito. More adventurous routes are also available.","con":"Book ahead: reservation is mandatory. The standard tour departs at 10 am, 12 noon, 3 pm and 5 pm on Fridays, Saturdays, Sundays and public holidays. Photography is allowed.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"A tunnel carved into the tuff in the Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"A stretch of the Galleria Borbonica, carved into the tuff."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Standard Route: tours at 10:00, 12:00, 15:00 and 17:00 (Friday, Saturday, Sunday and public holidays). Reservation required, duration about 1 hour. Entrances: via Domenico Morelli 61 and Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"The Bourbon tunnel","x":"This is the part that tells of Ferdinand II's ambition: a long passage in yellow tuff, designed to link the Royal Palace with Piazza della Vittoria. The tuff also tells the story of the quarrymen's work and the hydraulic engineering of the time.","d":"Along the main route","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"A passage carved into the tuff in the Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"The well-diggers' passage, a stretch of the Galleria Borbonica carved into the tuff."}},{"t":"The air-raid shelter","x":"Between 1939 and 1945, thousands of people sheltered here from the bombings. Beds, graffiti and everyday objects from the period remain. It is the part that moves visitors the most.","d":"In the rooms of the shelter","foto":{"u":"../img/3200f06943d2.jpg","alt":"The air-raid shelter in the Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"The air-raid shelter of the Second World War."}},{"t":"Vintage cars and motorbikes","x":"In the post-war years the tunnel was used as a judicial impound lot for seized vehicles: even today you can see vintage cars and motorbikes along the route.","d":"Along the route","foto":{"u":"../img/87eab52966bc.jpg","alt":"Vintage cars abandoned in the tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Vintage cars along the tunnel: the post-war years, when the tunnel was a judicial impound lot."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Seafront and Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"The castle on the islet where the Greek settlers from Cumae landed: you reach it from the seafront, cross the bridge and look out over the gulf from Borgo Marinari.","rac":"The castle stands on the islet of Megaride, made up of two rocks joined by a great arch. Here, in the mid-7th century BC, settlers from Cumae landed and went on to found Partenope on nearby Monte Echia.\n\nIn the 1st century BC, the villa of Lucius Licinius Lucullus stood on the islet and on Monte Echia. Some remains of it can still be seen in the Hall of the Columns: in the early Middle Ages the hall was the refectory of one of the convents built on the islet.","con":"The interior of the castle is closed for works until further notice: today it can be visited from the outside, strolling along the seafront and around the Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo on the sea, with a blue sky","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo on the islet of Megaride, linked to the seafront by a bridge."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Booking optional."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"The islet of Megaride","x":"From the seafront, look at the castle: it rests on the islet of Megaride, made up of two rocks joined by a great arch. Here, around the middle of the 7th century BC, the Cumaeans, of Greek origin, landed, and later founded the city of Partenope on nearby Monte Echia.\n\nIn the 1st century BC, in Roman times, the famous villa of Lucius Licinius Lucullus rose on the islet and on Monte Echia; what remains are the column drums of the so-called \"Hall of the Columns\".\n\nThe name comes from a legend: the poet Virgil is said to have hidden an egg in a cage in the underground chambers, and the fate of the castle and of all Naples would depend on its remaining intact. When, in the time of Queen Joan I, the arch between the two rocks collapsed, the queen had to declare that she had replaced the egg in order to calm the city.","d":"From the bridge leading to Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo and the little harbour of Borgo Marinari seen from above","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"From above: the castle on the rock and, beside it, the little harbour of Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Engraving from 1841 showing Castel dell'Ovo and a sailing boat","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in an engraving from 1841."}],"leg":"The name comes from a legend: the poet Virgil is said to have hidden an egg, enclosed in a cage, in the castle's underground chambers.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Rione Sanità and the Basilica of Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"A working-class district reborn from the grassroots: the basilica of the «Monacone», the catacombs, Totò and the murals.","rac":"The Rione Sanità is one of the oldest and most working-class districts of Naples: for centuries it was a place of burial, and today it is a model of grassroots renewal, with cooperatives of young people running the catacombs and the tours.\n\nAt its heart stands the basilica of Santa Maria della Sanità, built between 1602 and 1610 to a design by Fra Nuvolo, one of the greatest examples of Neapolitan Baroque. It is known as San Vincenzo or «'o Munacone», after the large statue of Saint Vincent Ferrer that it houses. It has a Greek-cross plan and its dome is covered in majolica tiles. Beneath the church lie the catacombs of San Gaudioso, dating from the 4th century.\n\nThe actor Totò was born in the district, in Via Santa Maria Antesaecula, and is remembered by murals throughout the neighbourhood. The play «The Mayor of the Rione Sanità» by Eduardo De Filippo is also set here.","con":"Visit the district by day and take your time: the catacombs, the basilica and the Fontanelle Cemetery are all close by. You can combine everything with the Sunday Sacred Mile.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"The domed basilica of Santa Maria della Sanità","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"The basilica of Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilica. It may close on certain dates: check the website."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"The Basilica of the Monacone","x":"Fra Nuvolo's church has a Greek-cross plan and a dome covered with majolica tiles. The presbytery is raised and the Baroque altar has a double staircase. The statue of Saint Vincent Ferrer, the “Monacone”, gives the basilica its popular name.","d":"In Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"The raised presbytery with the double staircase in the basilica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"The raised presbytery of the Basilica of Santa Maria della Sanità, with the double staircase."}},{"t":"The Catacombs of San Gaudioso","x":"Beneath the basilica lie the Catacombs of San Gaudioso, dating from the 4th century. They are entered through the church.","d":"Beneath the basilica","foto":{"u":"../img/30e6de57bd17.jpg","alt":"The Catacombs of San Gaudioso beneath the basilica","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"The Catacombs of San Gaudioso, beneath the basilica."}},{"t":"Totò and the murals","x":"In the nearby streets, and in Via Santa Maria Antesaecula, where Totò was born, murals and small images recall the actor and the stories of the neighbourhood.","d":"In the alleys around the square","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacombs of San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"The largest catacombs in Southern Italy: tuff galleries on two levels and the original tomb of San Gennaro, patron saint of Naples.","rac":"The Catacombs of San Gennaro are located in the Rione Sanità, with the entrance at Via Capodimonte 13, next to the Basilica del Buon Consiglio. Their origins date back to the 2nd century AD, when a wealthy Roman family donated its burial place to the Christian community. The complex spreads over two levels carved into the tuff: Upper San Gennaro and Lower San Gennaro.\n\nSan Gennaro was buried here, and for centuries the place was a pilgrimage destination. Until the 9th century his relics remained here; then they were taken away and the site was abandoned. Today it can only be visited with a guide, for about an hour. Since 2009 an LED system, created by Officina dei Talenti, the cooperative of young people from the neighbourhood, has lit the frescoes with a soft light.\n\nThe site is run by the social cooperative La Paranza, founded by young people from the Rione Sanità.","con":"Book in advance: visits are guided only, they depart every hour and booking is compulsory. The Sacred Mile, a guided route through the Rione Sanità, departs at 9:30 a.m. on Saturdays, Sundays and public holidays. The catacombs are closed on Wednesdays.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"An early Christian fresco in the Catacombs of San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"An early Christian fresco in the Catacombs of San Gennaro."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Guided tours every hour, reservation always required. Closed on Wednesdays and on 25 December."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"The tomb of San Gennaro","x":"This is the tomb that gives its name to the whole catacomb system: the patron saint of Naples was buried here. His relics remained here until the 9th century.","d":"On the guided tour","foto":{"u":"../img/fd273aee226d.jpg","alt":"The tomb of San Gennaro in the catacombs","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"The tomb of San Gennaro, the place that gives the catacombs their name."}},{"t":"The two levels","x":"The galleries are carved into the tuff on two levels, upper and lower, with large passageways and early Christian frescoes.","d":"During the guided visit","foto":{"u":"../img/537a160d9acb.jpg","alt":"A gallery carved into the tuff with tombs in the walls","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"The catacomb galleries, carved into the tuff."}},{"t":"The Sacred Mile","x":"On Saturdays, Sundays and public holidays, a guided route of about three hours takes in the places linked to San Gennaro in the Rione Sanità. It starts at 9:30 and must be booked on the official website.","d":"From the catacombs' meeting point","foto":{"u":"../img/0becd922c42f.jpg","alt":"The façade of a building in the Rione Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"The Rione Sanità, where the Sacred Mile follows the places linked to San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Fontanelle Cemetery","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"A tuff quarry as big as a cathedral, thousands of nameless skulls and the cult of the anime pezzentelle. Reopened in 2026.","rac":"In the 16th century it was a tuff quarry, in the Sanità valley. During the plague of 1656 many victims were brought here, then those of the cholera epidemic of 1836-1837; in 1872 Canon Gaetano Barbati arranged the remains in three great naves. The space measures about four thousand square metres.\n\nThe cult of the anime pezzentelle was born here: devotees adopted a skull, a capuzzella, cared for it and prayed to it, hoping in return for protection, sometimes a dream with the lottery numbers. In 1969 a decree of the ecclesiastical court closed the ossuary and banned the cult. Closed for works since 2020, it reopened to the public in 2026, run by the cooperative La Paranza.","con":"It is closed on Wednesdays. Download the cemetery's app before you arrive: inside, the phone signal is weak.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"The great tuff galleries of the Fontanelle Cemetery","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"The tuff galleries of the Fontanelle Cemetery."},"ov":false,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Closed at Christmas. Monday and Friday 9–10 open for worship only"}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"A quarry as big as a cathedral","x":"The cemetery occupies an old tuff quarry of about four thousand square metres, arranged into three large naves in 1872 by Canon Gaetano Barbati. The dead of the plague of 1656 and of the cholera epidemic of 1836-1837 were brought here.","d":"In the three naves","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"A nave of the Fontanelle Cemetery carved into the tuff","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"One of the three naves of the Fontanelle Cemetery, in the old tuff quarry."}},{"t":"The cult of the anime pezzentelle","x":"Devotees would adopt a skull, the capuzzella, look after it and pray to it, hoping in return for protection, sometimes a dream with lottery numbers. In 1969 the ecclesiastical court banned the cult and closed the ossuary.","d":"In front of the rows of skulls","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Rows of skulls with a cross","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"The capuzzelle: nameless skulls, adopted and cared for by devotees."}},{"t":"The Fontanelle at the MADRE","x":"The artist Rebecca Horn reproduced some of the Fontanelle capuzzelle in cast iron in her work “Spirits”, which can be seen at the MADRE museum: a way to understand how the cemetery has also entered contemporary art.","d":"At the MADRE museum (separate entry)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Certosa and Museum of San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"A Carthusian monastery turned museum, on the Vomero hill: a Baroque cloister, the Cuciniello nativity scene and one of the most beautiful views over the gulf.","rac":"The Certosa di San Martino stands on the Vomero hill, next to Castel Sant'Elmo. It was founded in 1325 by Charles of Calabria, son of King Robert of Anjou, and entrusted to Tino di Camaino. Between the 16th and 18th centuries it became one of the most refined examples of Italian Baroque art: from 1623 to 1656 Cosimo Fanzago renovated its interiors. Since 1866, after the suppression of the religious orders, it has housed the Museo nazionale di San Martino, founded at the wish of Giuseppe Fiorelli.\n\nThe Chiostro Grande, enlarged from 1581 by Giovanni Antonio Dosio and completed by Fanzago, has the monks' cemetery at its centre. The museum holds Italy's foremost public collection devoted to the Neapolitan nativity scene, with the magnificent Presepe Cuciniello: around eight hundred figurines, animals and accessories donated by the collector Michele Cuciniello, inaugurated in 1879. Other sections tell the story of the Kingdom's seafaring, the theatre, the city and the Kingdom in images and, since December 2025, the nineteenth century in Naples. Here you will also find the Tavola Strozzi, considered the first painting of Naples.","con":"Step out onto the terraces and the Loggia del Priore: from here you can see the whole gulf. It is open every day except Tuesday; last entry is at 5:30 pm.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"The large cloister of the Certosa di San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"The large cloister of the Certosa di San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Closed on Tuesdays. Some sections (naval, nativity scenes, 19th-century Naples) open at 9:30; the gardens close one hour earlier."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"The Great Cloister","x":"Enlarged from 1581 by Giovanni Antonio Dosio and completed by Cosimo Fanzago, it has the monks' cemetery at its centre. Along the perimeter you can still see the doors and the meal hatches of the Carthusians' cells.","d":"In the heart of the Certosa","foto":{"u":"../img/e43efae68626.jpg","alt":"The Great Cloister of the Certosa with the monks' cemetery","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"The Great Cloister of the Certosa di San Martino, with the small monks' cemetery at its centre."}},{"t":"The Cuciniello Nativity Scene","x":"With about eight hundred pieces, it is the most famous nativity scene in Naples. It was donated by Michele Cuciniello and inaugurated in 1879. A lighting system simulates the hours of the day.","d":"In the nativity scene section, where the kitchens used to be","foto":{"u":"../img/ae5327fcce50.jpg","alt":"The large nativity scene with hundreds of figures","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"The Cuciniello Nativity Scene, with about eight hundred pieces."}},{"t":"The view over the gulf","x":"From the terraces and gardens of the Certosa you can see the whole Gulf of Naples, with Vesuvius in the background.","d":"On the terraces and in the gardens","foto":{"u":"../img/81d0fb825e80.jpg","alt":"The Gulf of Naples seen from a balcony of the Certosa","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"The gulf and Vesuvius from a balcony of the Certosa di San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant’Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"The star-shaped fortress on the Vomero hill: bastions with a 360° view over Naples and the gulf, and the Museo Novecento inside.","rac":"Castel Sant'Elmo overlooks the Vomero at about 250 metres above sea level and is visible from almost the whole city. The earliest records, around 1275, describe it as a fortified Angevin residence called Belforte; in 1329 Robert of Anjou ordered its enlargement, entrusted to Tino di Camaino. The six-pointed star-shaped plan, however, is the result of the 16th-century reconstruction ordered between 1537 and 1547 by the viceroy Pedro de Toledo, to a design by the military architect Pedro Luis Escrivà.\n\nOver the centuries it was often a prison: Tommaso Campanella was held here and, later, patriots of the 1799 Neapolitan Republic such as Gennaro Serra, Mario Pagano and Luisa Sanfelice. After serving as a Bourbon garrison it was a military prison until 1952; a major restoration began in 1976.\n\nOn the parade ground, since 2010, stands the Museo Novecento a Napoli: over 170 works by about 90 artists who were Neapolitan or active in the city between 1910 and 1980. Some works were created especially for the castle: in the great cistern Gian Maria Tosatti made a wheat field grow, and on the ramparts stands the aluminium sculpture \"Sant'Elmo\" by Mimmo Paladino.\n\nFrom the bastions the view stretches from the islands to Vesuvius, from the Phlegraean Fields to the Matese mountains.","con":"Go up towards sunset for the view. The castle is next to the Certosa di San Martino: you can visit both in the same morning. The castle is closed on Tuesdays and, in bad weather, it may stay closed.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"The high tuff walls of Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"The walls of Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castle 8:30–19:30; Museo Novecento 9:30–18:30 (last entry 17:30). Closed on Tuesdays. In bad weather the site may stay closed."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"The bastions and the panorama","x":"The bastions offer a 360° panorama over the city, the gulf, Vesuvius and the Posillipo coast, among the most complete in Naples.","d":"On the ramparts","foto":{"u":"../img/81edfbd30506.jpg","alt":"Naples and Vesuvius seen from the top of Castel Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"From the bastions of Castel Sant'Elmo: the city, the port and Vesuvius."}},{"t":"The Museo Novecento in Naples","x":"Opened in 2010 on the parade ground, it houses over 170 works by about 90 artists who are Neapolitan or were active in the city, created from 1910 onwards: from Futurism to the Transavanguardia of the 1980s.","d":"On the castle's parade ground","foto":{"u":"../img/d585126c2db4.jpg","alt":"A room of the Museo Novecento with works of art","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"A room of the Museo Novecento in Naples, inside Castel Sant'Elmo."}},{"t":"A wheat field in the cistern","x":"The work “My dreams, they'll never surrender” by Gian Maria Tosatti (2014) is a wheat field grown in
