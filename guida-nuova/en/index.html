40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true,"pr":{"x":"Before you leave, have breakfast with us: a coffee and a Sfogliatella.","v":[{"v":177,"n":"Espresso (Kimbo, Extreme Blend)","p":250,"foto":{"u":"../img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}},{"v":110,"n":"Sfogliatella Riccia","p":300,"foto":{"u":"../img/bd4714cc3e5b.webp","alt":"Sfogliatella Riccia"}}],"l":[]},"fi":{"x":"","v":[{"v":83,"n":"Caffè Ceraldi","p":500,"foto":{"u":"../img/7bef03b87815.webp","alt":"Caffè Ceraldi"}},{"v":356,"n":"Aspritz","p":800,"foto":{"u":"../img/a3e1bd8ea3d9.webp","alt":"Aspritz"}}],"l":[]}}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"The history of Naples","sub":"From the siren Partenope to today, in thirteen chapters","som":"Before you set off, twenty-eight centuries in ten minutes: the legend of the siren, the Greeks, Rome, the kings, the revolt, the war and the city of today.","txt":"Naples is one of the oldest cities in Europe: its history stretches back about three thousand years, and the historic centre you are about to walk through still preserves the street plan drawn by the Greeks. For over half a millennium it was the capital of Southern Italy.\n\nThese thirteen chapters accompany you from legend to the city of today. Whenever the story meets a place in the guide, you will find a button to go there.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"Castel dell'Ovo in a view from 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in a view from 1841: the islet where Partenope was born."},"cap":[{"p":"The legend","t":"The siren Partenope","x":"It all begins with a siren. In Greek myth, sirens were creatures with the body of a bird and the head of a woman, masters of a magical song. One of them was called Partenope.\n\nThe most famous tale says that when Ulysses sailed past their rock without yielding to their song, the sirens, out of grief, threw themselves into the sea. The waves carried Partenope's body to the coast, at the mouth of a small river, the Sebeto: right where the city would be born.\n\nThere a tomb was built for her, and the Greeks of Naples dedicated sacrifices and a torch race to her every year. Even today Neapolitans call themselves «partenopei».","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"The fountain with the siren Partenope in Piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"The Fountain of the Siren in Piazza Sannazaro: Partenope with her lyre."}},{"p":"8th–7th century BC","t":"Partenope, the First City","x":"The legend has a grain of truth. Between the 8th and 7th centuries BC, the Greeks of Cumae, the oldest Greek colony in the area, founded a small trading port on the sea and named it after the siren: Partenope.\n\nIt stood on the hill of Pizzofalcone, Monte Echia, on a spur surrounded by the sea, and had its landing place on the islet of Megaride, where Castel dell'Ovo stands today. The harbour was in what is now Piazza Municipio. The necropolis of Partenope was discovered in 1949 in Via Nicotera.\n\nThe little city grew so fast that Cumae, fearing it would lose control, reduced its role.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo on the sea, under a blue sky","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo on the islet of Megaride, linked to the seafront by a bridge."}},{"p":"5th century BC","t":"Neapolis, the New City","x":"Next to Partenope, a little further east, the Cumaeans founded a new city: Neapolis, the \"new city\". UNESCO dates the foundation to around 470 BC, at the time when the Greeks had defeated the Etruscans at sea.\n\nNeapolis was built to a regular plan: three main parallel streets (the \"plateiai\", later called decumani), crossed at right angles by smaller streets. The agora, the main square, stood where Piazza San Gaetano is today.\n\nThat grid is still there: Spaccanapoli, Via dei Tribunali and Via Anticaglia are the three Greek streets. Walking along them, you walk through the plan of the city of 2,500 years ago.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"The great tuff blocks of the Greek walls, excavated below street level","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"The tuff blocks of the Greek walls of Neapolis, in Piazza Bellini, visible in an excavation below street level."}},{"p":"326 BC – 5th century AD","t":"Greek under Rome","x":"In 326 BC Neapolis allied itself with Rome and for centuries remained a Greek city within the Roman world: it was one of the few to preserve Greek language and culture. It became a favourite of cultured, wealthy Romans, who built villas on the gulf: on the islet of Megaride stood the villa of Lucius Licinius Lucullus.\n\nIn 79 AD the eruption of Vesuvius destroyed Pompeii and Herculaneum, not far away. In 476, in Lucullus's villa itself, by then fortified, Romulus Augustus, the last Roman emperor of the West, was held prisoner: with him the Empire came to an end.\n\nBeneath the Greek-Roman city the water of the cisterns you can visit today in Napoli Sotterranea was already flowing, and the emperor Nero performed in the theatre of Neapolis.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"A large underground cistern carved into the tuff, dimly lit","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"One of the great cisterns carved into the tuff, about 40 metres below Via dei Tribunali."}},{"p":"6th–12th century","t":"The Duchy of Naples","x":"After the end of the Empire, in the 6th century, Naples passed to the Byzantines, the Romans of the East. Little by little it became a nearly independent duchy: in the 8th century Duke Stephen II made himself its de facto lord.\n\nFor five centuries the duchy held out against the Lombards and the Saracens. In 1030 Duke Sergius IV gave the County of Aversa to a band of Norman mercenaries: it was the beginning of their rise in the South. In 1137 Naples submitted to the Normans and became part of the new Kingdom of Sicily.\n\nFrom those distant years the oldest churches remain, such as Santa Restituta and the baptistery of San Giovanni in Fonte inside the Cathedral, considered the oldest in the West.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"The interior of the Basilica of Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, the early Christian basilica incorporated into the Cathedral: Naples before the duchy."}},{"p":"1194–1266","t":"Normans and Swabians: the University is born","x":"After the Normans came the Swabians. In 1194 the emperor Henry VI occupied the city and had its walls torn down.\n\nHis son, Frederick II, was a ruler passionate about culture and law. In 1224 he founded the «Studio» in Naples, one of the first state universities in Europe: it is today's Federico II University, which still bears his name.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"The statue of Frederick II of Swabia on the façade of the Royal Palace","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"The statue of Frederick II of Swabia, among those on the façade of the Royal Palace."}},{"p":"1266–1442","t":"The Angevins: Naples becomes a capital","x":"In 1266 the Pope entrusted the kingdom to Charles I of Anjou, brother of the King of France, who entered the city in triumph. After the revolt of the Sicilian Vespers in 1282, Sicily broke away and Naples became the capital of the kingdom: it would remain so for centuries.\n\nThe Angevins built Castel Nuovo, the Cathedral (from 1294) and the citadel of Santa Chiara (from 1310), and the city grew. At the court of Robert of Anjou, in Castel Nuovo, Giotto, Petrarch and Boccaccio stayed.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"The entrance to the Santa Chiara cloister","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"The entrance to the majolica-tiled cloister of Santa Chiara."}},{"p":"1442–1503","t":"The Aragonese","x":"In 1442 Alfonso of Aragon conquered Naples: according to tradition, his men entered the city through an aqueduct. He made Castel Nuovo his royal palace, rebuilt it and, to celebrate his victory, added the great Triumphal Arch between two towers.\n\nThe Aragonese turned the medieval castle into a modern fortress and renewed the city's defences and streets. His son Ferrante defeated the rebellious barons: the castle's bronze door tells the story of that war, and in the Hall of the Barons his revenge was carried out.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"The Tavola Strozzi: Aragonese Naples seen from the sea, with the Maschio Angioino and Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"The Tavola Strozzi (15th century): Naples seen from the sea, with the port, Castel Nuovo and, up above, the hill of Sant'Elmo."}},{"p":"1503–1707","t":"The Spanish Viceroyalty","x":"From 1503 Naples passed to Spain and was governed by a viceroy. Without a king in residence, it was nonetheless an imperial capital, with one of the most magnificent courts in the Spanish dominions. The viceroy Don Pedro de Toledo doubled the size of the city, opened Via Toledo and built the districts for the soldiers, the Quartieri Spagnoli. The Royal Palace was also built in these years.\n\nIn 1606 Caravaggio arrived in Naples, fleeing from Rome: his painting changed the city's art, which in the 17th century became one of the capitals of European Baroque.\n\nThey were also very hard years: very high taxes, the eruption of Vesuvius in 1631 and, in 1656, a plague that killed more than half of the inhabitants.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello during the plague of 1656: bodies piled up in the square and heavenly figures in the sky","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello during the plague of 1656, painted by Micco Spadaro: the square is full of the dead and the dying."}},{"p":"1647","t":"Masaniello","x":"On 7 July 1647, after yet another tax, this time on fruit, the food of the poorest, a 27-year-old fisherman, Masaniello, led the people in revolt with the cry «Long live the King of Spain, death to bad government».\n\nWithin ten days the Spanish had to accept the people's demands. But Masaniello, accused of madness and betrayed by some of the rebels themselves, was assassinated. The revolt against Spain continued for months before being crushed in 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"A 17th-century painting of the crowd in revolt in Piazza Mercato","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Piazza del Mercato during Masaniello's revolt, painting by Domenico Gargiulo, known as Micco Spadaro."}},{"p":"1734–1799","t":"The Bourbons and the Republic","x":"In 1734 Charles of Bourbon gave Naples a king of its very own once more, and wanted to make it a great European capital. In 1737 he had the Teatro di San Carlo built in just seven months; then the royal palaces of Portici and Capodimonte. In those years the excavations of Herculaneum and Pompeii also began.\n\nNaples was one of the capitals of the Enlightenment. In January 1799, with the arrival of the French army, the patriots proclaimed the Neapolitan Republic: it lasted only until June. When the Bourbons returned, many of its leading figures were executed.\n\nAfter the years of the French (Joseph Bonaparte and Joachim Murat), the Bourbons returned in 1815, and in 1816 the Kingdom of the Two Sicilies was born.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Portrait of Charles of Bourbon in armour","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Charles of Bourbon portrayed by Anton Raphael Mengs."}},{"p":"1860–1945","t":"United Italy and the War","x":"On 7 September 1860 Giuseppe Garibaldi entered Naples to the acclaim of the crowd; a plebiscite sealed the union with the Kingdom of Italy. Naples ceased to be a capital, and the loss was a heavy one.\n\nIn the Second World War the city suffered more than 120 air raids, above all because of its port; people took shelter in the underground cisterns. After the armistice, the Germans occupied the city. At the end of September 1943 the Neapolitans rose up: in the «Four Days of Naples» the people forced the German garrison to surrender. On 1 October the Allies arrived.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"A period engraving: Garibaldi acclaimed by the crowd in Naples","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Period engraving of Garibaldi's entry into Naples in 1860: the crowd acclaims him on Via Toledo."}},{"p":"From 1945 to today","t":"Naples Today","x":"After the war the city rebuilt itself amid great difficulties. In 1995 UNESCO inscribed the historic centre on the World Heritage List: it is the largest in Italy and one of the most extensive in Europe.\n\nSince 2001 the metro has opened its “art stations”, with works by contemporary artists. The city has about 950,000 inhabitants, more than three million including the metropolitan area.\n\nAnd then there is the Naples you will see as you walk: the murals, like the one of Maradona in the Spanish Quarters, and Banksy's Madonna, life in the alleyways, the coffee. Three thousand years of history, layered one on top of another, within a few kilometres.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"The historic centre of Naples seen from above","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"The historic centre seen from above: a UNESCO World Heritage Site since 1995."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio in Naples","sub":"A painter on the run and three masterpieces to see","som":"Fleeing Rome, Caravaggio found refuge in Naples twice. Here he painted the Seven Works of Mercy, the Flagellation and his last painting.","txt":"Michelangelo Merisi, known as Caravaggio, was a famous and controversial painter in Rome. In the last days of May 1606 he mortally wounded Ranuccio Tomassoni in a brawl that broke out during a game of racket; sentenced, he had to flee.\n\nNaples, then one of the largest cities in Europe, was his refuge twice: from the autumn of 1606 to the summer of 1607, and then from the autumn of 1609 to the summer of 1610. Here he found the protection of the Colonna family and wealthy patrons, and here his painting changed the city's art forever.\n\nThree of his works can be seen in Naples today, two of them on our route.","foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggio's Seven Works of Mercy","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"The Seven Works of Mercy, painted by Caravaggio in Naples."},"cap":[{"p":"1606–1607","t":"The First Stay and the Seven Works","x":"His first documented commission in Naples dates from October 1606. A few months later, by 9 January 1607, Caravaggio delivered to the Pio Monte della Misericordia the great canvas of the Seven Works of Mercy, paid 400 ducats.\n\nIt is still there, on the altar for which it was painted, in Via dei Tribunali: a night in an alley of Naples, where men help one another under the gaze of the Madonna.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Caravaggio's Seven Works of Mercy: street scenes on a dark night","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Caravaggio's Seven Works of Mercy (1607): the whole scene, with the people below and the Madonna and Child above."}},{"p":"1607","t":"The Flagellation","x":"For the de Franchis family, jurists and magistrates, Caravaggio painted the Flagellation of Christ in 1607 for their chapel in the church of San Domenico Maggiore: a canvas almost three metres high, one of the masterpieces of Neapolitan Baroque.\n\nToday the original is in the Capodimonte Museum, where it was moved for security reasons; a copy remains in San Domenico Maggiore. Capodimonte lies outside our walking routes.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"Caravaggio's Flagellation of Christ: Jesus tied to the column among his tormentors","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"The Flagellation of Christ (1607), now in the Capodimonte Museum: the light falls on the body of Jesus, tied to the column."}},{"p":"1607–1609","t":"Malta and Sicily","x":"On 12–13 July 1607 Caravaggio arrived in Malta, probably aboard a galley of the Knights that had sailed from Naples. But there too he got into trouble: after a brawl he was arrested in August 1608, escaped from the fort where he was imprisoned and took refuge in Sicily, in Syracuse.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"Caravaggio's Beheading of Saint John the Baptist","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"The Beheading of Saint John the Baptist, painted by Caravaggio in Malta and kept in Valletta."}},{"p":"October 1609","t":"The Ambush at the Cerriglio","x":"In the autumn of 1609 he returned to Naples, still under the protection of the Colonna family, hoping for the Pope's pardon so that he could go back to Rome.\n\nIn October he was attacked by four men in front of the Osteria del Cerriglio, a famous inn of the time, and slashed across the face: the wound was so serious that word of his death spread in Rome.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Chalk portrait of Caravaggio","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio in the portrait by Ottavio Leoni, the face of the man attacked at the Cerriglio."}},{"p":"1610","t":"The Last Painting","x":"In the spring of 1610 he painted the Martyrdom of Saint Ursula for the Genoese prince Marcantonio Doria: the canvas was finished in May, delivered while the paint was still fresh, and shipped to Genoa. It is the latest painting by Caravaggio that we know of, and today it can be seen at the Gallerie d'Italia in Via Toledo, six minutes from Ceraldi. Among the faces, behind the saint, is his own.\n\nIn the summer he set off by boat for Rome with a few paintings, hoping for a pardon. He was arrested by mistake at Palo, and the boat sailed on with the paintings. He died at Porto Ercole on 18 July 1610 (or perhaps the day after), aged 38.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Caravaggio's Martyrdom of Saint Ursula: the saint and the king at the moment of the arrow","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"The Martyrdom of Saint Ursula (1610): the king strikes the saint with an arrow, at close range."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Naples in five minutes: from the siren to the new city","sub":"","som":"First Partenope, then Neapolis: why the historic centre is still laid out like a Greek city.","txt":"Naples was born twice. The first time it was called Partenope, like the siren of myth: it was founded in the 7th century BC by settlers of Greek origin from Cumae, who landed on the islet of Megaride, where Castel dell'Ovo stands today, and settled on nearby Monte Echia.\n\nThe second time, around 470 BC, a new city rose beside the old one: Neapolis, “new city” in Greek. This is the one you are walking through. Its streets form a regular grid that, after twenty-five centuries, can still be read: the historic centre of Naples is a UNESCO World Heritage Site precisely because the design of the Greek city has remained its backbone.\n\nThree parallel streets, the decumani, cut across the city from west to east. The lowest one is Spaccanapoli: about two kilometres long, so straight that seen from above it seems to divide the city in two, hence its name. In the middle runs via dei Tribunali, the main decumanus; higher up, via dell'Anticaglia and via della Sapienza, the upper decumanus.\n\nFrom Piazza Carità, where we have been since 2002, Spaccanapoli begins a few minutes' walk away, in piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"The historic centre of Naples seen from above","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"The historic centre from above: the straight streets are still those of the Greek city."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro and the blood that melts","sub":"","som":"Three times a year Naples holds its breath before a vial. What happens, where, and what the Church and science say about it.","txt":"In Naples Cathedral, in a niche of the Chapel of the Treasure, is kept an ampoule containing a dark substance that tradition holds to be the blood of San Gennaro, the patron saint of the city. Three times a year, on the Saturday before the first Sunday of May, on 19 September (the feast day) and on 16 December, the ampoule is shown to the faithful: if the contents, usually solid, liquefy, it is a day of celebration; if they stay solid, many Neapolitans see it as a bad omen.\n\nThe first known record of the liquefaction dates back to 1389. The relics are looked after not by the clergy but by the Deputation of the Chapel of the Treasure of San Gennaro, a lay institution founded in 1601, of which the mayor of Naples is also a member.\n\nThe Church maintains a cautious attitude: it speaks of a “prodigious event”, allows popular devotion to it but does not impose it as a truth of faith. Among the explanations put forward by sceptics is thixotropy, the property of certain substances that are solid at rest and become liquid when moved or shaken.\n\nSacred and profane have always lived side by side here: on via Duomo, a few steps from the cathedral, the street artist Jorit painted a San Gennaro with the face of a factory worker.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"The dome of the Chapel of the Treasure of San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"The Chapel of the Treasure of San Gennaro in the Duomo, where the vial is kept."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Naples in seven traditions: from the panaro to the miracle of San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"The anime pezzentelle: when Naples adopted a skull","sub":"","som":"Ossuaries, capuzzelle and prayers exchanged for lottery numbers: the cult of the nameless dead.","txt":"For centuries in Naples, the nameless dead were never left alone. They called them anime pezzentelle: the poor souls, who died without a funeral and with no one to pray for them. The name is linked to “pezzente”, a poor person, but also to the Latin “petere”, to ask in order to receive: those who prayed for them hoped to receive protection and favours in return.\n\nThe emblematic place is the Fontanelle Cemetery, in the Rione Sanità: a sixteenth-century tuff quarry of about four thousand square metres, which received the victims of the plague of 1656 and then those of the cholera epidemic of 1836-1837. In 1872 Canon Gaetano Barbati arranged the bones in three naves. Devotees “adopted” a skull, a capuzzella: they cleaned it, placed it in a small case, adorned it with rosaries and coins and prayed to it, waiting for a sign in a dream, sometimes a number to play in the lottery. Some skulls became famous: the Captain, with a blackened eye socket, the protagonist of a legend of marriage and jealousy; donna Concetta, who is said to “sweat” when a favour is granted.\n\nIn 1969 a decree of the ecclesiastical court closed the ossuary and banned the cult. Closed for works since 2020, the cemetery reopened to the public in 2026, run by the cooperative La Paranza.\n\nThe cult lives on also beneath via dei Tribunali, in the hypogeum of Santa Maria delle Anime del Purgatorio ad Arco, the church that Neapolitans call “'e cape 'e morte”: there is kept the skull of Lucia, a young soul who is particularly beloved. And on via San Biagio dei Librai, in the small church of Santa Luciella, there is a unique skull: the one with ears.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Skulls of the anime pezzentelle","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"The capuzzelle of the anime pezzentelle."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoteric Naples: an alchemist prince, a façade in code and a magic egg","sub":"","som":"Raimondo di Sangro, the rustication of the Gesù Nuovo, Virgil's egg, the munaciello: where history ends and legend begins.","txt":"Naples loves mysteries, and it has some wonderful ones. The most famous has a name: Raimondo di Sangro, Prince of Sansevero, a man of the eighteenth century, Grand Master of Neapolitan Freemasonry, an inventor jealous of his own secrets. The myth followed him even in his lifetime, and he himself helped to feed it. Benedetto Croce described him as the Neapolitan incarnation of Doctor Faust. The black legend attributes everything to him: servants killed so that he could study their bodies, even the blinding of the sculptor of the Veiled Christ so that he would not carve another. These are legends, and the museum itself distinguishes them from documented history.\n\nThe Veiled Christ is the work of Giuseppe Sanmartino, commissioned by the prince: the transparent veil covering the body is carved from the same block of marble as the statue. In the underground chamber of the chapel are the “anatomical machines,” two skeletons with a reconstructed circulatory system, made by the Palermo physician Giuseppe Salerno around 1756–1764: legend speaks of mysterious injections, while studies point to beeswax and dyes.\n\nNot far away, the façade of the Gesù Nuovo, which began as the Sanseverino palace in 1470, is covered with pyramid-point rustication in dark piperno stone. Some of the stones bear carved marks: according to legend, a secret message; according to some scholars, the marks of the stonecutters; in 2011 the art historian Vincenzo De Pasquale proposed reading them as musical notes, a score lasting about three quarters of an hour called “Enigma.” A fascinating hypothesis, not a certainty.\n\nAnd then there is the sea: according to legend, the poet Virgil hid the egg of the siren Partenope in the underground chambers of Castel dell'Ovo. As long as the egg remains intact, the castle will stand.\n\nIn the homes, meanwhile, live the spirits of popular tradition: the munaciello, a hooded sprite who brings luck or mischief depending on how you treat him, and the bella 'mbriana, the good spirit of the house, who may appear as a butterfly or a gecko.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"The diamond-point façade of the Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"The diamond-point rustication of the Gesù Nuovo, the “façade in code.”"},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples today: what's new","sub":"","som":"The square dedicated to Maradona, street art, the last Caravaggio on Via Toledo, reopened churches and ossuaries: the city that is changing.","txt":"Anyone who comes back to Naples after a few years finds a city that has learned to tell its own story.\n\nIn the Quartieri Spagnoli, nine minutes from us, you will find Largo Maradona. The mural of Diego was painted in 1990 by Mario Filardi; over the years it faded until it almost disappeared, then it was restored thanks to Salvatore Iodice and, in the autumn of 2017, the Argentine artist Francisco Bosoletti repainted his face. After Maradona's death on 25 November 2020, the square, previously called the artists' square, became a secular shrine of little altars, Argentine flags and photographs, so heavily visited that the city council has had to manage the flow of pedestrians.\n\nStreet art has entered the historic centre: in Piazzetta dei Girolamini, protected by a pane of glass, is Banksy's Madonna with a Pistol; in Via Duomo, Jorit's San Gennaro the Worker. The city's official tourism portal dedicates an itinerary to them.\n\nIn Via Toledo, six minutes from us, the Gallerie d'Italia house the Martyrdom of Saint Ursula, the last canvas painted by Caravaggio, together with more than five hundred Attic and Magna Graecia vases.\n\nAnd places that had long been closed are reopening: the church of Santa Luciella ai Librai, abandoned for more than thirty years, became open to visitors again on 5 April 2019; the Cimitero delle Fontanelle reopened in 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"The Maradona mural in the Spanish Quarters","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, one of the faces of today's Naples."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true},{"id":8,"s":"caffe-sospeso","t":"The suspended coffee: a coffee paid for a stranger","sub":"","som":"You pay for one extra coffee for whoever comes next: the Neapolitan gesture that has gone around the world, and the coffee pot that keeps it safe at our counter.","txt":"In Naples there is a coffee that you pay for but don't drink. Whoever comes into the bar pays for two, drinks one and leaves the other “suspended” for someone who will come later and couldn't afford it. The person who offers it remains anonymous; the person who receives it doesn't have to thank anyone.\n\nThe exact origins are not documented. The writer Riccardo Pazzaglia told of friends who, at the counter, in the confusion of settling the bill, would pay for an extra coffee and, instead of claiming it, leave it for a stranger. Luciano De Crescenzo, in 2008, dedicated a book to the subject, “Il caffè sospeso”: for him it was the gesture of someone who is happy and offers a coffee to the rest of the world.\n\nIn 2010 a number of Italian cultural festivals founded the Suspended Coffee Network (Rete del caffè sospeso), which chose 10 December, International Human Rights Day, as the day of the suspended coffee. Since then the idea has travelled to many countries: in English it is called suspended coffee, in Spanish-speaking countries café pendiente.\n\nAt our place, in Piazza Carità 14, the suspended coffee has a home: a large copper coffee pot with the words “Caffè sospeso” on the counter. Whoever wants to offer a coffee pays for it and puts the receipt in the coffee pot; whoever needs one takes a receipt and receives a coffee that has already been paid for. You can leave one too, before heading back out into the city.","foto":{"u":"../img/d45e6800235d.webp","alt":"The copper coffee pot with the words “Caffè sospeso” on the counter at Ceraldi Caffè","aut":"Ceraldi Caffè","lic":"Tutti i diritti riservati","src":"https://www.ceraldicaffe.it/storie/caffe-sospeso/","dida":"The suspended coffee pot on the counter at Ceraldi Caffè, in Piazza Carità 14."},"cap":[],"ap":false,"col":{"x":"At the counter, an espresso. And if you like, one more to leave in the coffee pot for whoever comes after.","v":[{"v":177,"n":"Espresso (Kimbo, Extreme Blend)","p":250,"foto":{"u":"../img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}}],"l":[{"u":"https://www.ceraldicaffe.it/storie/caffe-sospeso/","t":"The suspended coffee in Naples: what it is, how it works and where it comes from","x":"","it":true}]},"fonti":[{"t":"Wikipedia – Caffè sospeso","u":"https://it.wikipedia.org/wiki/Caff%C3%A8_sospeso"},{"t":"L'Espresso – Solidarietà in tazzina (21/11/2011)","u":"https://lespresso.it/c/attualita/2011/11/21/solidarieta-in-tazzina/5118"},{"t":"Meer – Il ritorno della Rete del caffè sospeso (27/4/2021)","u":"https://www.meer.com/it/65610-il-ritorno-della-rete-del-caffe-sospeso"},{"t":"Avvenire – Lasciamo un «caffè sospeso» (9/12/2011)","u":"https://www.avvenire.it/idee-e-commenti/lasciamo-un-caffe-sospeso-la-solidarieta-parte-dalle-piccole-cose_8571"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-13T13:08Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":""},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":"../es/"}],"pre":"../","menu":"https://www.ceraldicaffe.it/menu/en/"}, T = {"titolo":"Naples Guide","sottotitolo":"The historic centre on foot from Piazza Carità","anteprima":"Preview version: texts and opening hours under review.","oggi":"Today in Naples","sciopero":"Public transport strike today","chiusi_oggi":"Closed today","tutti_aperti":"No known closures today among places with verified hours.","itinerari":"Walks","luoghi":"Places","racconti":"Stories of Naples","mappa":"Map","piove":"Raining?","piove_testo":"Indoor places, with today's opening hours.","piove_vuo function schizzo(i){ /* disegno del percorso reale per la scheda dell'itinerario (leggero, senza mappa) */
  var pts = [], KX = 84300, KY = 111000;
  i.tappe.forEach(function(t){ (t.geo || []).forEach(function(c){ pts.push([(c[0] - 14.24) * KX, (40.86 - c[1]) * KY]); }); });
  if(pts.length < 2) return '';
  var x0 = Math.min.apply(0, pts.map(function(p){ return p[0]; })), x1 = Math.max.apply(0, pts.map(function(p){ return p[0]; }));
  var y0 = Math.min.apply(0, pts.map(function(p){ return p[1]; })), y1 = Math.max.apply(0, pts.map(function(p){ return p[1]; }));
  var pad = 60, w = x1 - x0 + 2 * pad, h = Math.max(y1 - y0 + 2 * pad, w * 0.45);
  var h2 = '<svg viewBox="' + [x0 - pad, y0 - pad - (h - (y1 - y0 + 2 * pad)) / 2, w, h].map(Math.round).join(' ') + '" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:220px;background:var(--accento-chiaro)" aria-hidden="true">';
  i.tappe.forEach(function(t){ if(t.geo) h2 += '<polyline points="' + t.geo.map(function(c){ return ((c[0] - 14.24) * KX).toFixed(0) + ',' + ((40.86 - c[1]) * KY).toFixed(0); }).join(' ') + '" fill="none" stroke="var(--scuro)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'; });
  var k = 0; i.tappe.forEach(function(t, n){ var l = LU[t.l]; if(n === i.tappe.length - 1 && casa(l)) return; var x = (l.lon - 14.24) * KX, y = (40.86 - l.lat) * KY, c = casa(l);
    h2 += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="30" fill="' + (c ? 'var(--accento)' : 'var(--scuro)') + '" stroke="var(--superficie)" stroke-width="8"/><text x="' + x.toFixed(0) + '" y="' + (y + 11).toFixed(0) + '" text-anchor="middle" font-size="32" font-family="Jost,system-ui,sans-serif" font-weight="500" fill="var(--su-scuro)">' + (c ? 'C' : ++k) + '</text>'; });
  return h2 + '</svg>';
}

/* ---------- copertina dell'itinerario: una mappa vera (stessi tasselli della guida, senza rete esterna) fotografata una volta,
   con il percorso e le foto piccole dei luoghi sopra. Il disegno leggero resta sotto finché la mappa non è pronta (e se la mappa non si carica). */
var COPERTINE = {}, codaCopertine = [], copertinaInCorso = false, inCoda = {};
function copertina(i){ return '<span class="copertina-giro" data-giro="' + e(i.s) + '">' + schizzo(i) + '</span>'; }
function preparaCopertine(){ document.querySelectorAll('.copertina-giro[data-giro]').forEach(function(el){ var i = IT[el.getAttribute('data-giro')]; if(!i) return;
  var w = Math.round(el.clientWidth); if(!w) return; var k = i.s + '@' + w;
  if(COPERTINE[k]) return mettiCopertina(el, COPERTINE[k], true);
  if(!inCoda[k]){ inCoda[k] = 1; codaCopertine.push({i: i, w: w, k: k}); } }); prossimaCopertina(); }
function mettiCopertina(el, c, subito){ if(el.querySelector('img.fondo')) return; if(subito) el.classList.add('pronta');
  var h = '<img class="fondo" alt="" src="' + c.img + '">' + c.pin.map(function(p){ return '<span class="pin ' + p.cl + '" style="left:' + p.x + '%;top:' + p.y + '%">' + p.h + '</span>'; }).join('') + '<span class="osm">© OpenStreetMap</span>';
  el.insertAdjacentHTML('beforeend', h); requestAnimationFrame(function(){ el.classList.add('pronta'); }); }
function prossimaCopertina(){ if(copertinaInCorso || !codaCopertine.length) return; var job = codaCopertine.shift(); copertinaInCorso = true;
  var fine = function(){ delete inCoda[job.k]; copertinaInCorso = false; prossimaCopertina(); };
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var H = 220, box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-12000px;top:0;width:' + job.w + 'px;height:' + H + 'px';
    document.body.appendChild(box);
    var m = new maplibregl.Map({container: box, style: r[1], interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: {preserveDrawingBuffer: true}, preserveDrawingBuffer: true, center: [14.2532, 40.8475], zoom: 14});
    var b = new maplibregl.LngLatBounds(), linee = [];
    job.i.tappe.forEach(function(t){ var l = LU[t.l]; b.extend([l.lon, l.lat]); if(t.geo){ linee.push(t.geo); t.geo.forEach(function(c){ b.extend(c); }); } });
    m.fitBounds(b, {padding: {top: 46, bottom: 40, left: 44, right: 44}, maxZoom: 16, duration: 0});
    var chiuso = false, chiudi = function(){ if(chiuso) return; chiuso = true; try{ m.remove(); }catch(x){} box.remove(); fine(); };
    var timer = setTimeout(chiudi, 15000);
    m.on('load', function(){
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addSource('p', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(c){ return {type: 'Feature', properties: {}, geometry: {type: 'LineString', coordinates: c}}; })}});
      m.addLayer({id: 'pb', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': 7}});
      m.addLayer({id: 'pl', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': scuro, 'line-width': 4}});
      m.once('idle', function(){
        try{
          var img = m.getCanvas().toDataURL('image/jpeg', 0.82), pin = [], k = 0, conFoto = [];
          /* foto piccole solo dove c'è spazio (almeno 50 px dalle altre foto): nei vicoli fitti le tappe vicine restano un pallino numerato */
          job.i.tappe.forEach(function(t, n){ var l = LU[t.l], c = casa(l); if(n === job.i.tappe.length - 1 && c) return;
            var q = m.project([l.lon, l.lat]), x = Math.round(q.x / job.w * 1000) / 10, y = Math.round(q.y / H * 1000) / 10;
            if(c){ pin.push({cl: 'punto casa', x: x, y: y, h: 'C'}); return; }
            k++;
            var libero = conFoto.every(function(o){ return Math.hypot(o[0] - q.x, o[1] - q.y) >= 50; });
            if(l.foto && libero){ conFoto.push([q.x, q.y]); pin.push({cl: '', x: x, y: y, h: '<img alt="" src="' + e(l.foto.u) + '"><b>' + k + '</b>'}); }
            else pin.push({cl: 'punto', x: x, y: y, h: String(k)}); });
          pin.sort(function(a, b){ return (a.cl === '' ? 1 : 0) - (b.cl === '' ? 1 : 0); }); /* le foto sopra i pallini */
          COPERTINE[job.k] = {img: img, pin: pin};
          document.querySelectorAll('.copertina-giro[data-giro="' + job.i.s + '"]').forEach(function(el){ if(Math.round(el.clientWidth) === job.w) mettiCopertina(el, COPERTINE[job.k]); });
        }catch(x){}
        clearTimeout(timer); chiudi(); });
    });
    m.on('error', function(){});
  }).catch(fine);
}

/* opz: punti [{t,n,lat,lon,h,casa,spento}], linee [{c:coordinate, s:'fatto'|'ora'|'poi'|''}], geo (controllo «tu sei qui»), dopo(m) */

      g.on('geolocate', function(){ if(msg) msg.hidden = true; });

      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';

      m.addLayer({id: 'percorso', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'},
        paint: {'line-color': ['match', ['get', 's'], 'fatto', '#9a958c', scuro], 'line-width': ['match', ['get', 's'], 'ora', 7, 5], 'line-opacity': ['match', ['get', 's'], 'poi', 0.45, 1]}});

    if(!b.isEmpty() && ((opz.punti || []).length > 1 || linee.length)) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0});
    else if(!b.isEmpty()) m.jumpTo({center: b.getCenter(), zoom: 16});

/* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;
function xy(c){ return [(c[0] - 14.25) * KXm, (c[1] - 40.85) * KYm]; }
function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */
  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;
}
function salvaGiro(){ try{ localStorage.setItem('guida_giro', JSON.stringify({s: G.s, k: G.k, t: Date.now()})); }catch(x){} }
function giroSalvato(){ try{ var g = JSON.parse(localStorage.getItem('guida_giro') || 'null'); return g && Date.now() - g.t < 12 * 3600e3 ? g : null; }catch(x){ return null; } }
var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!G) return;
    G.pos = [p.coords.longitude, p.coords.latitude]; G.acc = p.coords.accuracy; G.negata = false;
    var i = IT[G.s], tp = i.tappe[G.k], l = LU[tp.l];
    if(tp.geo){ var r = suLinea(G.pos, tp.geo); G.lungo = r.lungo; G.fuori = G.acc < 40 && r.off > 60; }
    var dest = xy([l.lon, l.lat]), io = xy(G.pos), dist = Math.hypot(dest[0] - io[0], dest[1] - io[1]);
    G.vicino = (G.acc <= 40 && dist < 35) ? (G.vicino || 0) + 1 : 0;
    if(G.vicino >= 2 && !G.arrivato) G.arrivato = true;   /* due posizioni precise di seguito entro 35 m dalla tappa */
    aggiornaCammino();
  }, function(){ if(G){ G.negata = true; aggiornaCammino(); } }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); }catch(x){}
}

        '<div class="corpo"><div class="tit"><span class="n">' + (n + 1) + '</span><b>' + e(x.t) + '</b></div>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<div class="testo">' + par(x.x) + '</div></div></article>'; }).join('') + '</div>';
  if(l.rac) h += '<details class="apri"' + (l.dett && l.dett.length ? '' : ' open') + '><summary>' + e(T.storia) + '</summary><div class="testo">' + par(l.rac) + '</div></details>';
  if(l.leg) h += '<details class="apri"><summary>' + e(T.leggende) + '</summary><div class="testo">' + par(l.leg) + '</div></details>';
  h += assaggio(l.col, T.da_ceraldi_et) + daLeggere(l.col);
  if(l.con) h += '<details class="apri" open><summary>' + e(T.consiglio) + '</summary><div><p>' + e(l.con) + '</p></div></details>';
  var info = '';
  if(!l.sa && verificati(l, ora) && l.or.length){
    info += '<table class="orari">';
    for(var g = 1; g <= 7; g++){ var fs = fasce(l, ora.data, g), ap = fs.filter(function(o){ return !o.x && o.da; });
      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  } else if(!l.sa) info += '<p>' + etichetta({k: 'verifica'}) + '</p>';
  var pr = [];
  if(l.dv) pr.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) pr.push(e(T.gratuito)); else if(l.gr === false) pr.push(e(T.pagamento));
  if(l.mp) pr.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';
  if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';
  if(l.fc) info += '<p>' + e({si: T.foto_si, no: T.foto_no, senza_flash: T.foto_senza_flash}[l.fc] || '') + '</p>';
  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(r.ap ? T.prima_di_partire : T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.sub ? '<p class="piccolo">' + e(r.sub) + '</p>' : '') + (r.foto ? '<div class="galleria uno">' + figura(r.foto) + '</div>' : '') + '<div class="testo">' + par(r.txt) + '</div>';
  if(r.cap.length){
    h += '<nav class="indice" aria-label="' + e(T.indice) + '"><b style="font-weight:500">' + e(T.indice) + '</b><ol>' + r.cap.map(function(c, n){ return '<li><button onclick="document.getElementById(\'cap-' + n + '\').scrollIntoView({behavior:\'smooth\'})">' + (c.p ? '<span class="per">' + e(c.p) + '</span>' : '') + '<span>' + e(c.t) + '</span></button></li>'; }).join('') + '</ol></nav>';
    h += r.cap.map(function(c, n){ var l = c.l && LU[c.l];
      return '<section class="capitolo" id="cap-' + n + '">' + (c.p ? '<span class="etichetta">' + e(c.p) + '</span>' : '') + '<h2>' + e(c.t) + '</h2>' +
        (c.foto ? '<figure><div class="ft"><img src="' + e(c.foto.u) + '" alt="' + e(c.foto.alt) + '" loading="lazy"></div><figcaption>' + (c.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(c.foto.dida) + '</span>' : '') + '<span class="cr">' + e(c.foto.aut) + ' · ' + e(c.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="testo">' + par(c.x) + '</div>' + (l ? '<a class="btn sec" href="#/l/' + e(l.s) + '">' + e(f(T.lo_vedi, {n: l.n})) + ' →</a>' : '') + '</section>'; }).join('');
  }
  return h + assaggio(r.col, T.da_ceraldi_et) + daLeggere(r.col) + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
