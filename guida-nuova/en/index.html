<script>
var D = {"lingua":"en","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità and Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"The starting point: Piazza Carità, on Via Toledo. From here, the historic center begins just a few minutes' walk away. And here is Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Before leaving, a coffee: the tour is long and Naples is best explored with the right cup.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità today, with its trees and colorful buildings","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità today, on Via Toledo: all the tours start from here. Ceraldi is here."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":null}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Vintage photo of Via Toledo in the 19th century, with carriages and passers-by","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo in the 19th century, when it was called Via Roma, in a photo by Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità e via Toledo: una passeggiata nel cuore di Napoli","x":"La storia della piazza, raccontata da chi ci lavora dal 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, the lower decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"The straight road that cuts the historic center in two: the lower decumanus of the Greek city, about two kilometers of churches, shops and life.","rac":"Spaccanapoli is the lowest of the three decumani, the parallel streets that crossed Greek Neapolis from west to east. It begins in Piazza del Gesù Nuovo as Via Benedetto Croce, then becomes Via San Biagio dei Librai, crosses Via Duomo, and continues beyond the old town: about two kilometers in total. The name says it all: it is so long and straight that, seen from above, it seems to split the city in two.","con":"Walk along it from Piazza del Gesù towards Via Duomo: it's a slight downhill ride of history, not of effort.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Square and Church of Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A facade of pyramid-shaped stones that looks like a fortress and hides a mystery: engraved signs that no one has yet deciphered with certainty.","rac":"Before being a church, it was a palace: that of the Sanseverino princes, built in 1470; a plaque on the façade commemorates the architect, Novello da San Lucano. The Jesuits preserved the structure and the dark piperno ashlar, with the stones cut into pyramidal shapes, adding white marble elements.\n\nSome stones have engraved markings. Legend has it they're a secret message; some scholars believe they're the marks left by different stonecutters; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes from a score called \"Enigma.\" Look closely and decide for yourself.\n\nThe façade was restored and unveiled on March 12, 2023, after some fragments fell in December 2017; the square has been closed to cars since then.","con":"Look for the markings on the stones at eye level, to the right and left of the portal: the hunt is free.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"The facade of the Gesù Nuovo, made of dark stones cut into points","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"The diamond-pointed façade: it was the palace of the Sanseverino princes, from 1470. Come closer and look for the signs engraved on the stones."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"The diamond-pointed facade","x":"Before it was a church, it was the façade of the palace of the Sanseverino princes, dating back to 1470. The Jesuits kept it as it was, with its dark piperno stones cut into pyramidal shapes, and added the large Baroque portal. Come closer: many of the stones have engraved signs, and even today there is no consensus on their meaning.","d":"Outside, in the square","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La facciata del Gesù Nuovo coperta di punte di diamante in pietra grigia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Il bugnato a punte di diamante della facciata del Gesù Nuovo, con il portale e la grande finestra."}},{"t":"The Expulsion of Heliodorus","x":"The large fresco on the counterfaçade is by Francesco Solimena, from 1725. It depicts Heliodorus attempting to sack the Temple of Jerusalem and being repelled by a celestial knight: a scene full of movement, horses, and fleeing figures. Many visitors miss it because they enter facing the altar.","d":"As soon as you enter, turn towards the door: it is above the entrance","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"The large fresco of the Expulsion of Heliodorus by Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimena's fresco above the entrance: turn toward the door to see it. In the center is the celestial knight repelling Heliodorus."}},{"t":"The dome and the four evangelists","x":"The four triangles at the base of the dome depict the evangelists, painted by Giovanni Lanfranco. The dome you see, however, is not the original: it collapsed in the 1688 earthquake and was replaced in 1786 by a lower, bowl-shaped structure.","d":"In the center of the church, look up","foto":null},{"t":"The chapel of Sant'Ignazio","x":"Dedicated to the founder of the Jesuits, it unites two great names of 17th-century Neapolitan art: Cosimo Fanzago, author of the architecture and statues of the prophets David and Jeremiah, and Jusepe de Ribera, who painted the canvases depicting the life of the saint. Colored marble, statues, and paintings come together: Neapolitan Baroque at its finest.","d":"In one of the two large chapels of the church","foto":null},{"t":"Saint Joseph Moscati","x":"Here lies the resting place of Naples' \"holy doctor\": Giuseppe Moscati, a researcher and university professor who cared for the poor free of charge. He died in 1927 and was proclaimed a saint in 1987. His remains are in a bronze urn by sculptor Amedeo Garufi, beneath the altar of the Chapel of the Visitation.","d":"In the chapel of the Visitation, under the altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La stanza di san Giuseppe Moscati ricostruita: camice bianco e strumenti medici in una teca","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Nella stanza ricostruita: il camice bianco, gli strumenti medici e le fotografie di san Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"The Gesù Nuovo square in front of the church","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"The square of Gesù Nuovo, in front of the church."},{"u":"../img/6d1ae4837518.jpg","alt":"The interior of the Gesù Nuovo, with coloured marbles and the main altar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Inside, the contrast with the severe façade: colored marble, frescoes and gold up to the high altar."},{"u":"../img/3dd3789513c8.jpg","alt":"The nave of the Gesù Nuovo seen from the entrance","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"The nave seen from the entrance: at the bottom, above, the dome with Lanfranco's evangelists at the base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastery and Complex of Santa Chiara (majolica cloister)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"The majolica-clad cloister is one of the quietest places in the center: a stone's throw from the chaos of Spaccanapoli, silence.","rac":"Santa Chiara was built in 1310 by order of King Robert of Anjou and Queen Sancha of Majorca. The construction was led first by Gagliardo Primario and then by Lionardo di Vito, and in 1340 the church was opened for worship. The complex consisted of two parts: a convent for the Poor Clares and one for the Friars Minor, adjacent but separate.\n\nFour centuries later, at the suggestion of Queen Maria Amalia of Saxony, wife of Charles of Bourbon, the Poor Clare cloister was renovated. Architect Domenico Antonio Vaccaro retained the 14th-century Gothic arches and transformed the center into a Baroque garden, lined with majolica tiles from the workshop of Donato and Giuseppe Massa. The result is one of the most surprising places in Naples: a ceramic garden just steps from Spaccanapoli.","con":"On Sundays the cloister closes at 2 pm: if it's Sunday afternoon, swap orders and come here first.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"The entrance to the cloister of Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"The entrance to the majolica cloister of Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloister and museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloister and museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"The majolica pillars","x":"Sixty-four pillars covered in majolica tiles with festoons of leaves, flowers, and fruit, under a pergola. The yellow, orange, and blue colors recall the citrus trees and vines growing around them. The majolica tiles are from the workshop of Donato and Giuseppe Massa, in the Baroque garden designed by Domenico Antonio Vaccaro.","d":"In the cloister garden","foto":{"u":"../img/924627d30fda.jpg","alt":"Pillars covered with yellow and green majolica tiles in the cloister","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"The pillars covered in majolica with festoons of leaves, flowers and fruit, under the pergola."}},{"t":"The scenes on the seats","x":"The seats connecting the pillars are all majolica, and the backrests are painted with small scenes: country life, seaside life, folk festivals, myths. They represent eighteenth-century Neapolitan life told through images. Sit down and take a closer look at the one behind you.","d":"On the backs of the seats between the pillars","foto":{"u":"../img/79ec1acbab17.jpg","alt":"A majolica seat with a scene painted on the backrest","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"A majolica seat from the cloister: on the back there is a painted scene."}},{"t":"The Clarissa with the cats","x":"Among the scenes is a Poor Clare nun feeding the cloister cats: a small glimpse of daily life in the monastery, painted on the majolica. Finding it is a perfect treasure hunt, even for children.","d":"On one of the seat backs: look for it","foto":null},{"t":"The arches of the fourteenth century","x":"The garden is Baroque, but the setting is medieval: Vaccaro preserved the 14th-century perimeter with the pointed arches of the Angevin monastery. Notice the contrast between the austere stone of the arches and the bright colors of the majolica tiles: four centuries in a single glance.","d":"Along the four sides of the cloister","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Gli archi del chiostro di Santa Chiara visti in controluce, con la chiesa sullo sfondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Gli archi gotici del chiostro di Santa Chiara, visti in controluce: sullo sfondo la facciata della chiesa."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolica with a wild boar hunting scene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Up close: a wild boar hunt painted on majolica by the Massa workshop, between 1739 and 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"The cloister with majolica pillars, seats and garden","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"The entire cloister: the majolica pillars, the seats and the garden."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Chapel","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"The Veiled Christ, one of the most famous sculptures in the world, and the anatomical machines of the alchemist prince Raimondo di Sangro.","rac":"The di Sangro family chapel is the kingdom of Raimondo, Prince of Sansevero: a man of science and secrets, Grand Master of Freemasonry, around whom the myth was born when he was still alive, and it was he himself who fueled it.\n\nAt the center is Giuseppe Sanmartino's Veiled Christ, commissioned by the prince: a reclining body covered by a shroud so thin it resembles wet cloth, yet carved from the same block of marble as the statue. In the underground cavea are two \"anatomical machines,\" skeletons of a man and a woman with reconstructed blood vessels, the work of the Palermo physician Giuseppe Salerno around 1756-1764. The black legend tells of sacrificed servants and mysterious injections; the museum itself carefully separates myth from documented history.","con":"It is closed on Tuesdays: if today is Tuesday, the statue of the Nile is two minutes away and can always be seen.","acc":"The nave and sacristy are wheelchair accessible. The underground auditorium with its anatomical machines is accessible only by a narrow 19th-century spiral staircase.","foto":{"u":"../img/65421f883be6.jpg","alt":"The exterior of the Sansevero Chapel","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"The Sansevero Chapel seen from outside."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"The Veiled Christ","x":"A body stretched out on a mattress, covered by a shroud so thin that the face, wounds, and veins can be seen beneath. The veil is not added: Giuseppe Sanmartino carved it from the same block of marble as the statue, commissioned by Prince Raimondo di Sangro. Walk around it slowly: the veil seems to change on each side.","d":"In the center of the nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"The face of Christ veiled under the marble veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"The face under the veil: the shroud is carved from the same block of marble as the statue, yet it looks like wet cloth."}},{"t":"Modesty","x":"A woman wrapped in a veil that clings to her skin as if wet, with a garland of roses. It was sculpted by Antonio Corradini in 1752, the year of his death, and the prince dedicated it to his mother, Cecilia Gaetani, who passed away when he was not yet a year old. Look for the broken tombstone at her feet: it is the sign of a life cut short too soon.","d":"Near the main altar","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"The statue of Modesty, a woman covered by a veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Modesty by Antonio Corradini: the veil clings to her body as if it were wet. At her feet, a broken tombstone."}},{"t":"The Disillusionment","x":"A man frees himself from a large net with the help of a small winged genie with a flame on his forehead, a symbol of intellect. Francesco Queirolo sculpted it in 1753-54 to commemorate the prince's father. The net is entirely made of perforated marble: according to tradition, the assistants refused to refine it for fear of breaking it, so the sculptor smoothed it himself.","d":"Near the main altar","foto":{"u":"../img/921cf7f91318.jpg","alt":"The statue of Disillusionment, a man freeing himself from a net","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Francesco Queirolo's Disillusionment: the net is entirely made of marble, perforated by hand."}},{"t":"The labyrinthine floor","x":"The original floor was a labyrinth of colored marbles traversed by a continuous white line, conceived by the prince as a symbol of the arduous path to knowledge. Francesco Celebrano built it until around 1771. A collapse in 1889 destroyed almost all of it: a few slabs remain in the passage in front of Raimondo's tomb, in the cavea, and in the sacristy.","d":"In the passage in front of the prince's tomb","foto":null},{"t":"The anatomical machines","x":"Two skeletons, a man and a woman, with their blood vessels reconstructed with a precision that still amazes. They were created by the Palermo physician Giuseppe Salerno between 1756 and 1764. The dark legend of the prince was born around them: the museum carefully explains where the story ends and the myth begins.","d":"In the underground cavea, going down a narrow spiral staircase","foto":null}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"The interior of the Sansevero Chapel with the statues","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"The entire chapel: in the centre the Veiled Christ, surrounded by the statues of the di Sangro family."}],"leg":"Much was said about Raimondo di Sangro during his lifetime: mysterious experiments, alchemical secrets, even servants transformed into anatomical machines. The museum carefully distinguishes the black legend from the documented facts: it's worth hearing both versions and choosing a side.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli and statue of the Nile","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"The ancient statue of the god Nile, lying down","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"The statue of the god Nile, reclining, in the small square that bears his name."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai and its shops","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"The booksellers' and artisans' section of Spaccanapoli: shops, churches, and the Doll Hospital.","rac":"This is the stretch of Spaccanapoli that runs from Piazzetta Nilo to Via Duomo, on the lower decumanus. Its name comes from the bookshops that have always been located there: an inscription on the nearby Palazzo Marigliano commemorates the art of the master booksellers. Devotion to Saint Blaise dates back to the 8th century, when nuns from Armenia brought a relic of the saint to Naples. Also along the street is the Ospedale delle Bambole, an artisan workshop passed down from generation to generation.","con":"December is the month of nativity scene shops: be prepared for crowds on weekends.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: il vicolo stretto, i negozi e uno stendardo appeso in alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la strada stretta e dritta del decumano inferiore, con i negozi e la gente a passeggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella at the Booksellers' and the skull with ears","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A tiny stonemason's church dedicated to the saint of eyes, and a unique skull: the one with ears.","rac":"Founded shortly before 1327 by Bartolomeo di Capua, a jurist to the Angevin kings, the church was then entrusted to the pipernieri, the stone cutters: they chose Saint Lucia, protector of sight, because the splinters from their trade put their eyes at risk.\n\nAbandoned for over thirty years, it was reopened on April 5, 2019, thanks to the Respiriamo Arte association. In its underground vault, the cult of the \"anime pezzentelle\" (sick souls) left a skull unlike any other: it has ears.","con":"It's small and can be visited in just a few minutes: perfect as a break between Sansevero and Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"The portal of Santa Luciella in the alley","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"The portal of Santa Luciella. Look up: above is the fresco with the coat of arms of the Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"The coat of arms of the Pipernieri","x":"Before entering, look up: above the piperno stone portal, there's still a fresco with the coat of arms of the piperno stone guild, the stonecutters to whom the church belonged. They worked among the chips, and for this reason, they chose Saint Lucy, the protector of sight.","d":"Above the entrance portal","foto":null},{"t":"The skull with ears","x":"Beneath the church, in the hypogeum, there's a skull with preserved ear cartilage: this makes it unique. Popular tradition holds that, precisely because it has ears, it better hears the prayers of those who ask for a favor.","d":"In the hypogeum, with a guided tour","foto":null},{"t":"The poor souls","x":"In the 17th century, after the plague, Neapolitans \"adopted\" the skulls of the nameless dead: they cleaned them, prayed for them, and asked for help in return. It was the cult of the anime pezzentelle, the poor souls. Here remains one of the city's most famous testimonies.","d":"In the hypogeum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Teschi illuminati dalla luce di una candela, con una targa «per grazia ricevuta»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Teschi nelle teche: su una targa si legge il nome di chi ha fatto la grazia, un modo di ringraziare le anime «pezzentelle»."}}],"gal":[],"leg":"It is said that the skull with ears, precisely because it has ears, listens better to prayers: for this reason, for generations, the most difficult requests have been entrusted to it.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Doll Hospital","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"A shop that has been curating dolls and toys for generations: a shop window that children, and adults, will always remember.","rac":"At the end of the 19th century, Luigi Grassi worked as a set designer for theaters and nativity scenes. Neighbors began bringing him broken dolls and toys, and his workshop became, almost by accident, the first toy \"hospital\" in Naples.\n\nToday, it's run by Tiziana, the founder's great-granddaughter, in the courtyard of Palazzo Marigliano on Via San Biagio dei Librai. Inside, it functions like a real hospital: white coats, wards, and a medical record for each patient. For many Neapolitans, it's the place where they took their favorite toy as children.","con":"The window display alone is worth the stop: it's on the way back.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"The Doll Hospital window full of dolls","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"The Doll Hospital window display: dolls and toys waiting to be \"cured.\""},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"A real hospital, for toys","x":"It is not a shop but a laboratory organized like a hospital: the \"doctors\" in white coats, the orthopedics, ophthalmology and tailoring departments, and the patients, dolls, teddy bears and soft toys, each with their own medical records and diagnosis.","d":"In the shop","foto":null},{"t":"The founder set designer","x":"It all began in the late 19th century with Luigi Grassi, a set designer for theaters and nativity scenes. Neighbors began bringing him broken toys, and he transformed the workshop into the first \"hospital.\" Today, his great-granddaughter, Tiziana, treats the patients.","d":"In the history of the shop","foto":null},{"t":"The courtyard of Palazzo Marigliano","x":"The hospital is located in the courtyard of Palazzo Marigliano, along Spaccanapoli. As you enter the main door, the street noise fades: it's one of the many hidden courtyards in the historic center worth discovering.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"Il cortile giallo di Palazzo Marigliano con l'arco d'ingresso","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"Il cortile di Palazzo Marigliano, con l'arco d'ingresso e le facciate color ocra."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, the church of the capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"The Church of the capuzzelle: beneath the floor, the hypogeum where Naples prayed for nameless souls. And Lucia's skull.","rac":"Neapolitans call it \"'e cape 'e morte,\" the church of the death's heads. It's a small 17th-century church on the main decumanus, linked to the devotion to the souls in Purgatory spread by the Counter-Reformation. A steep staircase leads to the hypogeum, the underground church, expanded and decorated with majolica in the 18th century: here, devotees cared for anonymous remains and sought their intercession. At the end of a small corridor, the skull of Lucia, a particularly beloved young soul, is kept.","con":"Behind the altar, look for the marble winged skull by Dionisio Lazzari: it is the symbol of the church.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"The facade of the Purgatorio ad Arco on Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"The facade of the Purgatorio ad Arco, on the main decumanus."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"The paintings of the seventeenth century","x":"Before descending, take a look at the church above: it houses precious marbles and paintings by three 17th-century Neapolitan masters: Massimo Stanzione, Luca Giordano, and Andrea Vaccaro. It's the \"upper\" part of a place that thrives primarily on what lies beneath.","d":"In the upper church","foto":null},{"t":"The Winged Skull","x":"Among the church's decorations is a skull with wings, the work of Dionisio Lazzari: an image that sums up the spirit of the place, where death is not feared but becomes an opportunity for prayer and connection with those who are no longer with us.","d":"In the upper church","foto":null},{"t":"The Hypogeum of Souls","x":"The true church is the underground one: a large space where even today devotees care for nameless human remains and ask for their protection. It was enlarged and decorated with majolica tiles in the 18th century. Descend slowly: it is a place of living devotion, not just curiosity.","d":"Under the church, going down a steep staircase","foto":null},{"t":"Lucia's skull","x":"Among all the skulls in the hypogeum, one is particularly beloved: that of Lucia, believed to be the soul of a young woman. It is kept at the end of a small corridor and is the most touching testimony to the cult of the souls in Purgatory.","d":"In the hypogeum, at the end of a small corridor","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"An image of the souls in Purgatory among the flames inside the church","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Inside the church: the souls of Purgatory in the flames, the theme of the entire place."},{"u":"../img/de63b1b83fa8.jpg","alt":"A bronze skull on a small column","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"A bronze skull: the symbol of the \" capuzzelle \" church."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Forty meters below Via dei Tribunali: the cisterns that for centuries provided water to Naples, war shelters, and a Roman theater hidden under a bed.","rac":"Beneath the historic center lies another city. From Piazza San Gaetano, you descend over one hundred steps to a depth of about 40 meters, along a path that passes through a Greco-Roman aqueduct and tunnels from the medieval, Bourbon, and modern eras.\n\nThe Greek-era caves were used as cisterns for the city's water supply for approximately 23 centuries. During the Second World War, the same spaces became air raid shelters.\n\nThe underground tour is guided and lasts about an hour. Then you return to the surface for the final surprise: the remains of the Greco-Roman theater of Neapolis, incorporated into the neighborhood's houses since the 15th century. You enter a \"basso,\" a ground-floor house, move a bed, and descend through a trapdoor into the theater's walls.","con":"Low shoes and a sweatshirt are recommended, even in summer: it's humid underground. The short, narrow passage with the candle is optional. Reservations are required for groups of 10 or more.","acc":"Not suitable for wheelchairs or walkers: there are stairs, with handrails, and narrow passages.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"A large underground cistern dug into the tuff, dimly lit","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"One of the large cisterns dug into the tuff, about 40 meters below Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Guided tours depart every hour from 10:00 am to 6:00 pm, in Italian and English. Also available on Thursdays at 9:00 pm, by reservation only and for groups of at least 10 people."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"The Greco-Roman cisterns","x":"The Greek-era rooms, dug into the tuff, were Naples' water cisterns for approximately 23 centuries, connected by the Greco-Roman aqueduct.","d":"In the first part of the visit, at about 40 meters depth","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"The tuff walls of an underground cistern","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"The tuff walls of a cistern: for approximately 23 centuries, the city's water was collected here."}},{"t":"The passage with the candle","x":"A very short, narrow section is walked with a candle in hand. This is optional: those who prefer can skip it, and instead use a phone flashlight.","d":"Along the underground path","foto":{"u":"../img/a874f33cc5df.jpg","alt":"A very narrow tunnel illuminated in the tuff","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"One of the very narrow tunnels dug into the tuff."}},{"t":"The shelters of war","x":"During the Second World War these underground rooms were used as air-raid shelters: here the city took shelter from bombings.","d":"Along the underground path","foto":{"u":"../img/0f4490838101.jpg","alt":"World War II artifacts displayed underground","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Memories of the war: objects from when these rooms were air-raid shelters."}},{"t":"The theater under the bed","x":"The remains of the Greco-Roman theater of Neapolis were incorporated into modern-day homes in the 15th century. You enter a basement, move the bed, and through a trapdoor, descend into the theater's walls.","d":"Second part of the visit, on the surface between Via Anticaglia and Vico Cinquesanti","foto":null}],"gal":[],"leg":"According to the story of the visit, Nero had his dressing rooms in the hidden rooms under the lower floor when he came to Naples to perform in the theatre.","fc":"si","col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La cupola ottagonale della chiesa del Pio Monte della Misericordia vista dal basso","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cupola della chiesa ottagonale del Pio Monte della Misericordia, guardando in alto."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Le Sette opere di Misericordia","x":"È una tela enorme, quasi quattro metri d'altezza, e sembra una notte in un vicolo di Napoli: un incrocio pieno di gente, illuminato da una luce che arriva di lato e scolpisce i corpi nel buio. In alto, la Madonna con il Bambino, portata da due angeli, guarda giù su quello che fanno gli uomini.\n\nIl Pio Monte voleva un'opera che mettesse insieme tutte e sette le opere di misericordia: dar da mangiare agli affamati, dar da bere agli assetati, vestire gli ignudi, ospitare i pellegrini, visitare gli infermi, visitare i carcerati, seppellire i morti. Caravaggio le dipinse tutte in una sola scena, senza miracoli: è l'uomo che aiuta l'uomo.\n\nFu la prima opera di Caravaggio a Napoli e cambiò la pittura della città: i pittori napoletani del Seicento ripresero la sua luce, i suoi personaggi presi dalla strada e perfino alcuni dettagli, come l'uomo di spalle in primo piano.","d":"Sull'altare maggiore","foto":{"u":"../img/da8045021e55.jpg","alt":"Le Sette opere di Misericordia di Caravaggio: scene di strada in una notte scura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le Sette opere di Misericordia di Caravaggio (1607): tutta la scena, con le persone in basso e la Madonna con il Bambino in alto."}},{"t":"Come riconoscere le sette opere","x":"Cerca le scene una per una.\n\nA destra, una giovane donna allatta dal seno un vecchio dietro le sbarre: sono Pero e suo padre Cimone, condannato a morire di fame in carcere. Valgono per due opere: dar da mangiare agli affamati e visitare i carcerati. Guarda la goccia di latte sulla barba del vecchio.\n\nDietro di loro, un uomo trasporta un morto (se ne vedono solo i piedi) e un sacerdote con la torcia gli fa luce: seppellire i morti. In primo piano, a sinistra, un giovane cavaliere taglia il mantello per un uomo nudo a terra: è San Martino, vestire gli ignudi; accanto, nell'angolo più buio, uno storpio prega: visitare gli infermi.\n\nAll'estrema sinistra un oste indica la strada a un pellegrino con la conchiglia sul cappello, San Giacomo: ospitare i pellegrini. Sullo sfondo, un uomo beve da una mascella d'asino: è Sansone, dar da bere agli assetati.","d":"Davanti alla tela, da sinistra a destra","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"La tela di Caravaggio sopra l'altare maggiore del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La tela di Caravaggio come la vedi in chiesa: sopra l'altare, nella cappella del Pio Monte."}},{"t":"La Madonna e gli angeli","x":"Guarda in alto: la Madonna con il Bambino si affaccia come da una finestra, davanti a due lenzuoli stesi, e due angeli si abbracciano in volo. Sembrano lontani da quello che succede in basso.\n\nMa osserva l'ombra che proiettano sul muro del carcere: Caravaggio li rende presenti, quasi concreti, dentro la stessa notte degli uomini.\n\nLo storico dell'arte Roberto Longhi scelse proprio questo dettaglio per la locandina della grande mostra del 1951 che riscoprì Caravaggio: belli, scrisse, come un Raffaello, ma presi «dalla verità nuda di Forcella o di Pizzofalcone».","d":"In alto, nella tela","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Dettaglio: la Madonna con il Bambino e i due angeli in volo","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Il dettaglio in alto: la Madonna con il Bambino che si affaccia e i due angeli che si abbracciano in volo."}},{"t":"Gli altri altari","x":"Intorno al Caravaggio la chiesa ottagonale ha altri sei altari, con tele di pittori del Seicento napoletano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino e Forlì.\n\nCerca la «Liberazione di San Pietro» di Battistello Caracciolo, del 1615: è uno dei pittori che più impararono da Caravaggio, e si vede dalla luce e dal buio. Poi «San Pietro che resuscita Tabità» di Fabrizio Santafede, del 1611.\n\nGuardale dopo il Caravaggio: capirai subito quanto la sua tela fosse nuova per Napoli.","d":"Nelle cappelle intorno","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Cathedral and Treasure of San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Naples Cathedral and the Treasury Chapel, where the vial of San Gennaro's blood is kept.","rac":"In the Cathedral, in a niche in the Treasury Chapel, the ampoule containing the blood traditionally attributed to San Gennaro is kept. Three times a year (the Saturday before the first Sunday in May, September 19th, and December 16th) its liquefaction is awaited. Since 1601, the relics have been entrusted to a secular institution, the Deputation of the Treasury Chapel of San Gennaro.","con":"On liquefaction days, the Duomo is packed from morning: if you want to be there, arrive early.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"The facade of the Naples Cathedral","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"The facade of the Duomo, on Via Duomo. The Treasury Chapel is the third on the right."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"The portal of San Gennaro","x":"The façade, about fifty meters high, has three portals. The one on the right remains closed almost all year round: it opens only for the feast of San Gennaro and on special occasions. If you find it open, you've come to a special day.","d":"On the front, on the right","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"Il portale gotico del Duomo di Napoli","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Il portale gotico del Duomo, in facciata."}},{"t":"The Treasure Chapel","x":"More than a chapel, it's a church within a church: baroque, with a Greek cross plan, a double-domed dome, and a large bronze gate by Cosimo Fanzago. It houses the silver bust of Saint Januarius and the vials containing his blood, whose liquefaction the city awaits.","d":"Third chapel on the right","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"The dome of the Treasury Chapel frescoed with Paradise","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Look up: in the dome of the Treasury Chapel there is Paradise painted by Giovanni Lanfranco."}},{"t":"Saint Restituta","x":"When Charles of Anjou had the Cathedral built in 1294, one of the oldest basilicas was preserved as a chapel: Santa Restituta. It houses works by Luca Giordano and 14th-century sculptures, and from here you descend to the archaeological area with Greco-Roman and early Christian remains beneath the cathedral.","d":"In the left aisle","foto":{"u":"../img/5abf53aec271.jpg","alt":"A mosaic with the Madonna enthroned in the Basilica of Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"A mosaic of the Madonna enthroned inside Santa Restituta: the oldest basilica, preserved as a chapel of the Cathedral."}},{"t":"The Baptistery of San Giovanni in Fonte","x":"A small space with an immense history: it's considered the oldest baptistery in the Western world. Stop for a few minutes: you're in one of the oldest Christian sites still standing in Europe.","d":"To the right of the apse","foto":{"u":"../img/994ed22c6902.jpg","alt":"L'interno del Battistero di San Giovanni in Fonte con la vasca battesimale al centro","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Il Battistero di San Giovanni in Fonte: al centro del pavimento, la vasca battesimale."}},{"t":"The Succorpo","x":"Beneath the altar is a three-aisled Renaissance crypt, commissioned by Cardinal Oliviero Carafa to house the relics of San Gennaro and other saints, designed by Giovan Tommaso Malvito. Ancient columns and white marble: a silent Renaissance within the Gothic cathedral.","d":"Under the main altar","foto":{"u":"../img/876cd614ab8d.jpg","alt":"L'interno del Succorpo di San Gennaro con colonne di marmo e pavimento a intarsi","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Il Succorpo, sotto il presbiterio del Duomo: colonne e pavimento di marmo, e in fondo l'altare con le reliquie di San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"Banksy's Madonna with a Gun","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"A Madonna by Banksy with a gun instead of a halo, protected by glass, in the heart of the main decumanus.","rac":"In Piazzetta dei Girolamini, on a façade of the main decumanus, Banksy left a Madonna with a gun in place of her halo. Today, it's protected by glass. The city's official tourist website includes it in its itinerary dedicated to street art in the historic center.","con":"Look up: the work is above street level, behind glass.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Il volto della Madonna di Banksy in stencil bianco su fondo scuro","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Il volto della Madonna di Banksy: lo stencil bianco su fondo scuro, da vicino."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"The Madonna with the gun","x":"White on a black background, stenciled: a Madonna with her arms outstretched toward the sky and, in place of a halo, a gun. Banksy painted it in Naples in 2010. The message is unexplained: everyone interprets it in their own way, somewhere between the sacred and the profane.","d":"On the wall of the little square","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"La Madonna in stencil di Banksy sul muro di piazza Gerolomini, vista da vicino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Madonna di Banksy, in stencil bianco e nero su un angolo del muro di piazza Gerolomini."}},{"t":"The newsstand next door","x":"Next to the mural is a small votive shrine with the Madonna and Child, the kind found in many streets of Naples. The two images, side by side, seem to gaze at each other: it is this dialogue that makes the work so Neapolitan.","d":"Immediately next to the work","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Madonna di Banksy sul muro e, accanto, l'edicola votiva con la Madonna col Bambino","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A sinistra la Madonna di Banksy, a destra, appesa al muro, l'edicola con la Madonna col Bambino: le due immagini sacre una accanto all'altra."}},{"t":"A Banksy under glass","x":"In 2010, Banksy left two works in Naples, likely on the same night: the other, on Via Benedetto Croce, was later covered by another artist. For this reason, the FAI (Italian National Trust) lists this as Banksy's only mural in Italy, now protected by a plexiglass case to prevent vandalism.","d":"In front of the work","foto":null},{"t":"Come arrivarci e cosa fotografare","x":"L'opera è su un muro della piccola piazza Gerolomini, affacciata su via dei Tribunali.\n\nLa teca protegge l'opera ma può riflettere la luce: per una foto senza riflessi prova a metterti leggermente di lato. Il posto è sempre accessibile e gratuito.\n\nDa qui la Madonna di via Benedetto Croce, l'opera perduta, era a nove minuti a piedi, lungo il percorso che passa da Sansevero, Napoli Sotterranea e San Gregorio Armeno.","d":"Piazza Gerolomini, su via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, the last Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"Six minutes from Ceraldi, in Via Toledo, the last canvas painted by Caravaggio: the Martyrdom of Saint Ursula.","rac":"Intesa Sanpaolo's Gallerie d'Italia, at Via Toledo 177, houses the Martyrdom of Saint Ursula, Caravaggio's last canvas. Alongside it, three exhibitions are on display: Neapolitan and Southern Italian painting from the 17th to the early 20th century, the 20th century, and over five hundred Attic and Magna Graecia ceramics from the Caputi collection.","con":"Admission is free for everyone on the first Sunday of the month. It's closed on Mondays.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Una sala delle Gallerie d'Italia con quadri alle pareti gialle","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala delle Gallerie d'Italia a Napoli, con le tele del Seicento."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Il Martirio di sant'Orsola","x":"È una scena stretta e buia, quasi senza sfondo: siamo nella tenda di Attila, re degli Unni. Orsola, una principessa, lo ha rifiutato, e lui le ha appena scoccato una freccia nel petto. Lei piega la testa verso la freccia; tre uomini accorrono a sorreggerla. Il re sembra già pentito del suo gesto.\n\nCerca il volto alle spalle della santa: è lo stesso Caravaggio, che si è dipinto tra i testimoni. E osserva la mano che si allunga tra la santa e il re, come per fermare la freccia: è riapparsa durante il restauro del 2003-2004.\n\nLo commissionò il principe genovese Marcantonio Doria, la cui famiglia aveva sant'Orsola come protettrice. È il quadro più tardo di Caravaggio che conosciamo: fu finito nel maggio 1610, poco più di un mese prima della sua morte.","d":"Nella sala dedicata a Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"Il Martirio di sant'Orsola di Caravaggio: la santa e il re nel momento della freccia","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Il Martirio di sant'Orsola (1610): il re colpisce la santa con la freccia, a distanza ravvicinata."}},{"t":"Il quadro messo al sole","x":"Caravaggio dipinse il quadro in fretta, forse perché stava per partire verso Roma per ottenere il perdono del papa. L'incaricato dei Doria a Napoli, Lanfranco Massa, fece consegnare la tela quando la vernice non era ancora asciutta e, per farla asciugare prima, la mise al sole: la vernice, stesa molto spessa, si rovinò. Lo raccontò lui stesso in una lettera di maggio 1610.\n\nIl quadro arrivò a Genova, poi passò di erede in erede, finì in una villa di Eboli e fu attribuito ad altri pittori. Solo negli anni Ottanta del Novecento il ritrovamento della lettera di Massa ha confermato con certezza che è di Caravaggio.\n\nNel 2025 un nuovo intervento di restauro ha riportato alla luce tre teste che il tempo aveva fatto sparire.","d":"Davanti alla tela","foto":{"u":"../img/6a999eeecae6.jpg","alt":"La tela di Caravaggio esposta in una sala di Palazzo Zevallos, con il soffitto decorato","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Il Martirio di sant'Orsola esposto in una sala di Palazzo Zevallos Stigliano, la sede delle Gallerie d'Italia."}},{"t":"Il palazzo del Banco di Napoli","x":"Prima di salire alle sale, guardati intorno: sei nel palazzo che fu la sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento.\n\nL'architetto Michele De Lucchi lo ha trasformato in museo con un allestimento moderno: le grandi sale della banca oggi ospitano tre percorsi, dall'arte napoletana del Seicento al Novecento, passando per una ricca collezione di vasi greci e della Magna Grecia.\n\nIl museo ha aperto nel 2022 e continua l'attività di Palazzo Zevallos Stigliano, aperto dal 1999 al 2022 a pochi passi da qui.","d":"Entrando, nel salone","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La facciata in pietra del Palazzo del Banco di Napoli su via Toledo, con la bandiera europea","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Il Palazzo del Banco di Napoli su via Toledo, dove hanno sede le Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"Maradona's mural","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"The beloved mural in the Spanish Quarter and the square that since 2020 has become a secular sanctuary for Diego.","rac":"The Maradona mural was painted in 1990 by Mario Filardi. In the 1990s, a window in the wall obliterated his face, and the painting almost completely faded. It was restored by Salvatore Iodice, and in the fall of 2017, Argentine artist Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, formerly known as the Artists' Square, was named after him and filled with shrines, flags, and photographs.","con":"It's very crowded during rush hour: early in the morning it's easier to see it calmly.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"The large mural of Maradona on the facade of a building, with the crowd below","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"The mural was painted in 1990 by Mario Filardi. Today's face was repainted in 2017 by Argentine artist Francisco Bosoletti."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"The plaque in Largo Maradona with a bust and flags","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"The plaque on the square: after Diego's death in 2020, the artists' square was named after him."},{"u":"../img/550f6edc4b91.jpg","alt":"A small altar with photos of Maradona and memories","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"A small shrine dedicated to Maradona: there are many in the city, with photos and mementos left by fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona painted with a halo next to a small shrine","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona with his halo and his votive shrine, painted in the San Lorenzo area."},{"u":"../img/80d74e92279d.jpg","alt":"A votive shrine with a portrait of Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"A votive shrine for Maradona, like those of the saints."}],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"The castle that is the symbol of Naples: a triumphal arch between two towers, a bronze door still struck by a cannonball, and the hall where a king had the barons arrested during a wedding celebration.","rac":"Under the Angevin kings, the castle became a centre of culture: under Robert of Anjou, artists, doctors and men of letters stayed there, including Giotto, Petrarch and Boccaccio.\n\nAlfonso I of Aragon made it his royal residence and rebuilt it. To celebrate his victorious entry into the city, he built the great Triumphal Arch between the Middle Tower and the Watchtower, which still serves as the entrance today.\n\nToday the castle is home to the Civic Museum: the tour includes the art gallery on the first floor, the Barons' Hall, the Palatine Chapel, also known as the Chapel of Santa Barbara, and an archaeological tour in the ancient Armoury.","con":"Full price ticket: €10; €6 for residents of Naples and the metropolitan area; free for children under 18. Closed on Sundays.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"The Maschio Angioino with its two towers and the white arch in the middle","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"The two large towers and, in the middle, the Triumphal Arch of Alfonso of Aragon: this is the entrance to the castle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"The Arc de Triomphe","x":"This is the castle's entrance, nestled between two towers: Alfonso I of Aragon commissioned it to celebrate his victorious entry into Naples. Stop in front of it before entering and admire it from below.","d":"At the entrance, between the Middle Tower and the Watchtower","foto":{"u":"../img/91d08c9a9561.jpg","alt":"The marble Triumphal Arch between the two towers","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"The arch up close: look at it from below, floor by floor."}},{"t":"The door with the cannonball","x":"Ferrante of Aragon commissioned it from Guglielmo Monaco around 1475, to commemorate the 1462 victory over John of Anjou and the rebel barons: six panels recount the war. In the lower left panel, an iron cannonball still embedded in the bronze. The most widely accepted theory is that the door was part of the booty that Charles VIII loaded onto ships bound for France; off the coast of Rapallo, the fleet was attacked by the Genoese and hit. The Genoese sent it back to Naples in 1495.","d":"The original is preserved inside the castle","foto":{"u":"../img/50ee03911e6d.jpg","alt":"The cannonball stuck in the bronze door","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"The iron cannonball embedded in the bronze, in the lower left panel."}},{"t":"The Barons' Hall","x":"It is reached by the external piperno staircase designed by Majorcan architect Guglielmo Sagrera. Look up: the vault rises to about 28 meters, and sixteen piperno ribs extend in a star-shaped pattern from a central opening. The name recalls 1486, when King Ferrante I deceived the barons to celebrate a wedding and had them arrested here. For fifty years, it served as the seat of the City Council.","d":"At the top of the courtyard stairs","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"The star vault of the Barons' Hall","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"The vault of the Barons' Hall: sixteen piperno ribs start in a star shape from the opening in the centre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Seafront and Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"The castle on the islet where the Greek colonists from Cumae landed: you arrive from the seafront, cross the bridge and look out over the gulf from Borgo Marinari.","rac":"The castle stands on the islet of Megaride, made up of two rocks joined by a large arch. Here, in the mid-7th century BC, colonists from Cumae landed, who later founded Partenope on nearby Mount Echia.\n\nIn the 1st century BC, the villa of Lucius Licinius Lucullus stood on the islet and Mount Echia. Remains of this villa remain in the Hall of Columns: in the early Middle Ages, the hall served as the refectory of one of the convents built on the islet.","con":"The castle's interior is closed for renovations until further notice. Today, visitors can visit the castle from the outside, strolling along the seafront and around Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo on the sea, with the blue sky","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo on the islet of Megaride, connected to the seafront by a bridge."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"The islet of Megaride","x":"View the castle from the seafront: it rests on two rocks joined by a large arch. According to the municipality, it was here that the first settlers from Cumae landed.","d":"From the bridge leading to Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo and the Borgo Marinari marina seen from above","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"From above: the castle on the rock and, next to it, the small port of Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"1841 engraving with Castel dell'Ovo and a sailing boat","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in an 1841 engraving."}],"leg":"The name comes from a legend: the poet Virgil is said to have hidden an egg, locked in a cage, in the castle's cellars.","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Your first walk","sub":"Spaccanapoli in half a day, starting from Ceraldi","desc":"The heart of the historic center in a circular walk: the Gesù Nuovo and its mystery, the cloister of Santa Chiara, the Veiled Christ, the Church of the Skull and Ears, the shops of Via San Biagio dei Librai. And then we return to us.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../
