<style>

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit}
.contenitore{max-width:640px;margin:0 auto;padding:0 16px 40px}
header.testa{background:var(--scuro);color:var(--su-scuro);padding:18px 16px 16px}
header.testa .riga{max-width:640px;margin:0 auto;display:flex;align-items:flex-start;gap:12px}
header.testa h1{font:400 1.7rem/1.15 var(--f-display);margin:0}
header.testa p{margin:4px 0 0;opacity:.85;font-size:.95rem}
.lingue{margin-left:auto;position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid color-mix(in srgb,var(--su-scuro) 40%,transparent);border-radius:20px;padding:4px 10px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:110%;z-index:20;list-style:none;margin:0;padding:6px;background:var(--superficie);color:var(--testo);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:150px}
.lingue a{display:block;padding:8px 10px;text-decoration:none;color:inherit;border-radius:6px}
.lingue a[aria-current]{font-weight:600;background:color-mix(in srgb,var(--accento) 12%,transparent)}
.avviso{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:.92rem}
.avviso.prova{background:#FFF4D6;color:#5A4300;border:1px solid #E8D193}
.avviso.ko{background:color-mix(in srgb,var(--ko) 10%,var(--superficie));color:var(--ko);border:1px solid color-mix(in srgb,var(--ko) 30%,transparent)}
.scheda{background:var(--superficie);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
h2{font:400 1.4rem/1.2 var(--f-display);margin:22px 0 8px}
h3{font:600 1rem/1.3 var(--f-testo);margin:0 0 6px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.bottoni{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.bottone{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accento) 35%,transparent);background:var(--superficie);text-decoration:none;color:var(--testo);font-weight:600;text-align:center;cursor:pointer}
.bottone.pieno{background:var(--scuro);color:var(--su-scuro);border-color:var(--scuro)}
.lista{list-style:none;margin:0;padding:0}
.voce{display:block;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:14px 16px;margin:10px 0}
.voce .titolo{font:400 1.2rem/1.25 var(--f-display);color:var(--testo)}
.voce .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600}
.stato::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.stato.ok{color:var(--ok)}.stato.ko{color:var(--ko)}.stato.att{color:var(--attenzione)}.stato.neutro{color:var(--testo-2)}
.indietro{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0;padding:8px 0;background:none;border:0;color:var(--accento);font-weight:600;cursor:pointer}
.mappa{height:340px;border-radius:14px;overflow:hidden;margin:12px 0;background:#e8e4dc}
.num{width:28px;height:28px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:700 .85rem var(--f-testo);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.num.casa{background:var(--accento)}
.tappa{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--superficie);border-radius:14px;padding:14px;margin:10px 0}
.tappa .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.tappa .tra{grid-column:1/-1;font-size:.88rem;color:var(--testo-2);margin:-4px 0 0 46px}
.alt{margin-top:8px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--attenzione) 9%,var(--superficie));font-size:.92rem}
.testo p{margin:0 0 12px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--testo) 10%,transparent);vertical-align:top}
.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:700}
.foto{margin:12px 0 0}.foto img{width:100%;border-radius:14px;display:block}.foto figcaption{font-size:.78rem;color:var(--testo-2);margin-top:4px}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center}
.visuale[hidden]{display:none}
@media (min-width:700px){header.testa h1{font-size:2rem}}
</style>

<script>
var D = {"lingua":"en","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità and Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"The starting point: Piazza Carità, on Via Toledo. From here, the historic center begins just a few minutes' walk away. And here is Ceraldi.","rac":"","con":"Before leaving, a coffee: the tour is long and Naples is best explored with the right cup.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, the lower decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"The straight road that cuts the historic center in two: the lower decumanus of the Greek city, about two kilometers of churches, shops and life.","rac":"Spaccanapoli is the lowest of the three decumani, the parallel streets that crossed Greek Neapolis from west to east. It begins in Piazza del Gesù Nuovo as Via Benedetto Croce, then becomes Via San Biagio dei Librai, crosses Via Duomo, and continues beyond the old town: about two kilometers in total. The name says it all: it is so long and straight that, seen from above, it seems to split the city in two.","con":"Walk along it from Piazza del Gesù towards Via Duomo: it's a slight downhill ride of history, not of effort.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true},{"id":8,"s":"gesu-nuovo","n":"Square and Church of Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A facade of pyramid-shaped stones that looks like a fortress and hides a mystery: engraved signs that no one has yet deciphered with certainty.","rac":"Before being a church, it was a palace: that of the Sanseverino princes, built in 1470; a plaque on the façade commemorates the architect, Novello da San Lucano. The Jesuits preserved the structure and the dark piperno ashlar, with the stones cut into pyramidal shapes, adding white marble elements.\n\nSome stones have engraved markings. Legend has it they're a secret message; some scholars believe they're the marks left by different stonecutters; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes from a score called \"Enigma.\" Look closely and decide for yourself.\n\nThe façade was restored and unveiled on March 12, 2023, after some fragments fell in December 2017; the square has been closed to cars since then.","con":"Look for the markings on the stones at eye level, to the right and left of the portal: the hunt is free.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"}],"ant":true},{"id":9,"s":"santa-chiara","n":"Monastery and Complex of Santa Chiara (majolica cloister)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"The majolica-clad cloister is one of the quietest places in the center: a stone's throw from the chaos of Spaccanapoli, silence.","rac":"","con":"On Sundays the cloister closes at 2 pm: if it's Sunday afternoon, swap orders and come here first.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloister and museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloister and museum"}],"fonti":[],"ant":true},{"id":10,"s":"cappella-sansevero","n":"Sansevero Chapel","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"The Veiled Christ, one of the most famous sculptures in the world, and the anatomical machines of the alchemist prince Raimondo di Sangro.","rac":"The di Sangro family chapel is the kingdom of Raimondo, Prince of Sansevero: a man of science and secrets, Grand Master of Freemasonry, around whom the myth was born when he was still alive, and it was he himself who fueled it.\n\nAt the center is Giuseppe Sanmartino's Veiled Christ, commissioned by the prince: a reclining body covered by a shroud so thin it resembles wet cloth, yet carved from the same block of marble as the statue. In the underground cavea are two \"anatomical machines,\" skeletons of a man and a woman with reconstructed blood vessels, the work of the Palermo physician Giuseppe Salerno around 1756-1764. The black legend tells of sacrificed servants and mysterious injections; the museum itself carefully separates myth from documented history.","con":"It is closed on Tuesdays: if today is Tuesday, the statue of the Nile is two minutes away and can always be seen.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli and statue of the Nile","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai and its shops","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"The booksellers' and artisans' section of Spaccanapoli: shops, churches, and the Doll Hospital.","rac":"This is the stretch of Spaccanapoli that runs from Piazzetta Nilo to Via Duomo, on the lower decumanus. Its name comes from the bookshops that have always been located there: an inscription on the nearby Palazzo Marigliano commemorates the art of the master booksellers. Devotion to Saint Blaise dates back to the 8th century, when nuns from Armenia brought a relic of the saint to Naples. Also along the street is the Ospedale delle Bambole, an artisan workshop passed down from generation to generation.","con":"December is the month of nativity scene shops: be prepared for crowds on weekends.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true},{"id":40,"s":"santa-luciella","n":"Santa Luciella at the Booksellers' and the skull with ears","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A tiny stonemason's church dedicated to the saint of eyes, and a unique skull: the one with ears.","rac":"Founded shortly before 1327 by Bartolomeo di Capua, a jurist to the Angevin kings, the church was then entrusted to the pipernieri, the stone cutters: they chose Saint Lucia, protector of sight, because the splinters from their trade put their eyes at risk.\n\nAbandoned for over thirty years, it was reopened on April 5, 2019, thanks to the Respiriamo Arte association. In its underground vault, the cult of the \"anime pezzentelle\" (sick souls) left a skull unlike any other: it has ears.","con":"It's small and can be visited in just a few minutes: perfect as a break between Sansevero and Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"}],"ant":true},{"id":41,"s":"ospedale-bambole","n":"Doll Hospital","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"A shop that has been curating dolls and toys for generations: a shop window that children, and adults, will always remember.","rac":"","con":"The window display alone is worth the stop: it's on the way back.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, the church of the capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"The Church of the capuzzelle: beneath the floor, the hypogeum where Naples prayed for nameless souls. And Lucia's skull.","rac":"Neapolitans call it \"'e cape 'e morte,\" the church of the death's heads. It's a small 17th-century church on the main decumanus, linked to the devotion to the souls in Purgatory spread by the Counter-Reformation. A steep staircase leads to the hypogeum, the underground church, expanded and decorated with majolica in the 18th century: here, devotees cared for anonymous remains and sought their intercession. At the end of a small corridor, the skull of Lucia, a particularly beloved young soul, is kept.","con":"Behind the altar, look for the marble winged skull by Dionisio Lazzari: it is the symbol of the church.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true},{"id":18,"s":"duomo-san-gennaro","n":"Cathedral and Treasure of San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"Naples Cathedral and the Treasury Chapel, where the vial of San Gennaro's blood is kept.","rac":"In the Cathedral, in a niche in the Treasury Chapel, the ampoule containing the blood traditionally attributed to San Gennaro is kept. Three times a year (the Saturday before the first Sunday in May, September 19th, and December 16th) its liquefaction is awaited. Since 1601, the relics have been entrusted to a secular institution, the Deputation of the Treasury Chapel of San Gennaro.","con":"On liquefaction days, the Duomo is packed from morning: if you want to be there, arrive early.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":43,"s":"banksy-madonna","n":"Banksy's Madonna with a Gun","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"A Madonna by Banksy with a gun instead of a halo, protected by glass, in the heart of the main decumanus.","rac":"In Piazzetta dei Girolamini, on a façade of the main decumanus, Banksy left a Madonna with a gun in place of her halo. Today, it's protected by glass. The city's official tourist website includes it in its itinerary dedicated to street art in the historic center.","con":"Look up: the work is above street level, behind glass.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"Your first walk","sub":"Spaccanapoli in half a day, starting from Ceraldi","desc":"The heart of the historic center in a circular walk: the Gesù Nuovo and its mystery, the cloister of Santa Chiara, the Veiled Christ, the Church of the Skull and Ears, the shops of Via San Biagio dei Librai. And then we return to us.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"A coffee at Ceraldi and off we go.","alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25008,40.84665],[14.25047,40.84678],[14.25086,40.84691],[14.25124,40.84703],[14.25122,40.84707],[14.25144,40.84714],[14.2517,40.84724],[14.252,40.84733]],"sv":[{"k":"parti","n":"Piazza Carità","d":242,"a":0},{"k":"gira","m":"right","n":"Via Maddaloni","d":176,"a":242},{"k":"gira","m":"slight left","n":"Piazza del Gesù Nuovo","d":76,"a":418},{"k":"arrivo","a":494}]},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38,"geo":[[14.252,40.84733],[14.25202,40.84734],[14.25211,40.84737],[14.25214,40.84734],[14.25215,40.84731],[14.25217,40.84729],[14.25221,40.84723],[14.25224,40.84718],[14.25228,40.84712],[14.25232,40.84706],[14.25234,40.84704],[14.25222,40.84698],[14.25206,40.84689],[14.25192,40.84683],[14.25182,40.84678],[14.25176,40.84676],[14.25166,40.84671],[14.25157,40.84668],[14.25155,40.84669],[14.25139,40.84625],[14.25137,40.8462],[14.25139,40.84604],[14.25141,40.84601],[14.25174,40. }]},{"l":7,"m":21,"mt":1597,"so":0,"nota":"Return from Ceraldi.","alt":null,"geo":[[14.26001,40.85253],[14.26008,40.85239],[14.2603,40.85199],[14.26018,40.85194],[14.26014,40.85193],[14.25936,40.85169],[14.2589,40.85153],[14.25885,40.85151],[14.2585,40.85139],[14.25852,40.85137],[14.25856,40.85129],[14.25894,40.85063],[14.25942,40.84977],[14.25893,40.84961],[14.25871,40.84953],[14.25861,40.8495],[14.25822,40.84938],[14.2582,40.84937],[14.2578,40.84924],[14.25759,40.84917],[14.25739,40.84911],[14.25699,40.84897],[14.25658,40.84883],[14.25627,40.84873],[14.25616,40.84869],[14.25607,40.84866],[14.25574,40.84855],[14.25533,40.84841],[14.25531,40.8484],[14.25475,40.84822],[14.25433,40.84807],[14.25388,40.84792],[14.25305,40.84764],[14.25244,40.84744],[14.25214,40.84734],[14.25195,40.84727],[14.25135,40.84707],[14.25124,40.84703],[14.25086,40.84691],[14.25047,40.84678],[14.25008,40.84665],[14.25005,40.84665],[14.25004,40.84666],[14.25,40.84665],[14.24938,40.84644],[14.24934,40.84643],[14.24933,40.84638],[14.24928,40.84638],[14.24927,40.84634],[14.24918,40.84554],[14.24918,40.84553],[14.2491,40.84484],[14.2491,40.84478],[14.24909,40.84468],[14.24908,40.84464],[14.24911,40.84463],[14.24908,40.84433]],"sv":[{"k":"parti","n":"","d":65,"a":0},{"k":"gira","m":"right","n":"Via dei Tribunali","d":165,"a":65},{"k":"gira","m":"left","n":"Vico dei Maiorani","d":196,"a":230},{"k":"gira","m":"right","n":"Via San Biagio dei Librai","d":940,"a":426},{"k":"gira","m":"left","n":"","d":232,"a":1366},{"k":"arrivo","a":1598}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Naples in Five Minutes: From the Siren to the New City","som":"First Partenope, then Neapolis: because the historic center is still designed like a Greek city.","txt":"Naples was founded twice. The first time it was called Partenope, like the mythical siren: it was founded in the 7th century BC by colonists of Greek origin from Cumae, who landed on the islet of Megaride, where Castel dell'Ovo stands today, and settled on nearby Mount Echia.\n\nThe second time, around 470 BC, a new city arose next to the old one: Neapolis, meaning \"new city\" in Greek. This is the one you are now passing through. Its streets form a regular grid that, after twenty-five centuries, is still legible: the historic center of Naples is a UNESCO World Heritage Site precisely because the design of the Greek city has remained its backbone.\n\nThree parallel streets, the decumani, cut the city from west to east. The lowest one is Spaccanapoli: about two kilometers long, so straight that, seen from above, it appears to divide the city in two, hence its name. In the center runs Via dei Tribunali, the main decumanus; higher up are Via dell'Anticaglia and Via della Sapienza, the upper decumanus.\n\nFrom Piazza Carità, where we have been since 2002, Spaccanapoli begins a few minutes' walk away, in Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro and the Melting Blood","som":"Three times a year, Naples holds its breath over a vial. What happens, where, and what the Church and science say about it.","txt":"In Naples Cathedral, in a niche in the Treasury Chapel, a vial containing a dark substance is kept, which tradition holds to be the blood of San Gennaro, the city's patron saint. Three times a year—on the Saturday before the first Sunday in May, on September 19th (the feast day), and on December 16th—the vial is shown to the faithful: if the contents, usually solid, dissolve, it's a celebration; if they remain solid, for many Neapolitans, it's a bad omen.\n\nThe first known record of the liquefaction dates back to 1389. The relics are not guarded by the clergy but by the Deputation of the Chapel of the Treasure of San Gennaro, a secular institution founded in 1601, which also includes the mayor of Naples.\n\nThe Church maintains a cautious stance: it speaks of a \"miraculous event,\" allows popular devotion, but does not impose it as a truth of faith. Among the explanations proposed by skeptics is thixotropy, the property of certain substances that are solid at rest and become liquid when moved or shaken.\n\nThe sacred and the profane have always coexisted here: in Via Duomo, a few steps from the cathedral, the street artist Jorit painted a San Gennaro with the face of a worker.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"The Poor Souls: When Naples Adopted a Skull","som":"Ossuaries, capuzzelle, and prayers exchanged for lottery numbers: the cult of the nameless dead.","txt":"For centuries, in Naples, the nameless dead were not left alone. They were called anime pezzentelle: the poor souls who died without a funeral and without anyone to pray for them. The name is linked to \"pezzente,\" the poor man, but also to the Latin \"petere,\" to ask in order to receive: those who prayed for them hoped to receive protection and grace in return.\n\nThe symbolic site is the Fontanelle Cemetery, in the Sanità district: a sixteenth-century tuff quarry covering approximately four thousand square meters, which welcomed victims of the plague of 1656 and then those of cholera in 1836-1837. In 1872, Canon Gaetano Barbati arranged the bones in three naves. Devotees \"adopted\" a skull, a capuzzella: they cleaned it, placed it in a small shrine, adorned it with rosaries and coins, and prayed to it, waiting for a sign in a dream, sometimes a lottery number. Some skulls became famous: the Captain, with a blackened eye socket, the subject of a legend of marriage and jealousy; Donna Concetta, who is said to \"sweat\" when grace is granted.\n\nIn 1969, a decree from the ecclesiastical court closed the ossuary and banned worship. Closed for renovations since 2020, the cemetery reopened to the public in 2026, managed by the La Paranza cooperative.\n\nThe cult also lives on beneath Via dei Tribunali, in the hypogeum of Santa Maria delle Anime del Purgatorio ad Arco, the church Neapolitans call \"'e cape 'e morte\": there, the skull of Lucia, a particularly beloved young soul, is kept. And on Via San Biagio dei Librai, in the small church of Santa Luciella, there is a unique skull: the one with ears.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Esoteric Naples: An alchemist prince, a coded facade, and a magic egg","som":"Raimondo di Sangro, the rustication of the Gesù Nuovo, Virgil's egg, the munaciello: where history ends and legend begins.","txt":"Naples loves mysteries, and it has some very beautiful ones. The most famous has a name: Raimondo di Sangro, Prince of Sansevero, an eighteenth-century man, Grand Master of Neapolitan Freemasonry, a jealous inventor of his own secrets. The myth surrounded him even in his lifetime, and he himself fueled it. Benedetto Croce called him the Neapolitan incarnation of Doctor Faustus. The black legend attributes everything to him: servants killed to study their bodies, even the blinding of the sculptor of the Veiled Christ so he wouldn't sculpt another. These are legends, and the museum itself distinguishes them from documented history.\n\nThe Veiled Christ is the work of Giuseppe Sanmartino, commissioned by the prince: the transparent veil covering the body is carved from the same block of marble as the statue. In the chapel's underground cavea are the \"anatomical machines,\" two skeletons with reconstructed circulatory systems, created by the Palermo physician Giuseppe Salerno around 1756-1764. Legend has it that they involved mysterious injections and studies of beeswax and dyes.\n\nNot far away, the façade of the Gesù Nuovo, originally the Sanseverino palace in 1470, is covered with a pyramid-shaped ashlar of dark piperno stone. Some stones bear engraved markings: legend has it, a secret message; some scholars say they are the stonecutters' marks; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes, a score lasting about three-quarters of an hour called \"Enigma.\" A tempting hypothesis, not a certainty.\n\nAnd then there's the sea: according to legend, the poet Virgil hid the egg of the siren Partenope in the cellars of Castel dell'Ovo. As long as the egg remains intact, the castle remains standing.\n\nIn the houses, however, live the spirits of popular tradition: the munaciello, a hooded elf who brings good luck or mischief depending on how you treat him, and the bella 'mbriana, a good spirit of the house, who can appear as a butterfly or a gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples today: what's new?","som":"The square dedicated to Maradona, the street art, the last Caravaggio on Via Toledo, reopened churches and ossuaries: the changing city.","txt":"Those who return to Naples after a few years find a city that has learned to tell its story.\n\nIn the Spanish Quarter, nine minutes from us, is Largo Maradona. The mural of Diego was painted in 1990 by Mario Filardi; over the years, it faded to the point of almost disappearing, then was restored thanks to Salvatore Iodice, and in the fall of 2017, the Argentine Francisco Bosoletti repainted the face. After Maradona's death on November 25, 2020, the square, previously called the artists' square, became a secular sanctuary of small altars, Argentine flags, and photographs, so popular that the municipality had to manage pedestrian traffic.\n\nStreet art has entered the historic center: in Piazzetta dei Girolamini, protected by glass, stands Banksy's Madonna with a Gun; on Via Duomo, Jorit's San Gennaro the Worker. The city's official tourist website has dedicated a dedicated itinerary to them.\n\nOn Via Toledo, six minutes from us, the Gallerie d'Italia houses the Martyrdom of Saint Ursula, Caravaggio's last canvas, along with over five hundred Attic and Magna Graecia vases.\n\nAnd places that had been closed for a long time are reopening: the church of Santa Luciella ai Librai, abandoned for over thirty years, was reopened to the public on April 5, 2019; the Fontanelle Cemetery reopened in 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T15:14Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":""},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":"../es/"}],"pre":"../","menu":"../../menu-nuovo/"}, T = {"titolo":"Naples Guide","sottotitolo":"The historic centre on foot from Piazza Carità","anteprima":"Preview version: texts and opening hours under review.","oggi":"Today in Naples","sciopero":"Public transport strike   h += bloccoMappa('m-itin') + '<p class="piccolo">' + e(T.nota_mappa) + '</p>';
  if(i.desc) h += '<div class="testo">' + par(i.desc) + '</div>';
  h += '<p class="piccolo"><b>' + e(T.arrivo) + '</b></p>';
  i.tappe.forEach(function(tp, n){
    var l = LU[tp.l], casa = l.s === 'piazza-carita';
    t += tp.m;
    var arrivo = t, sa = stato(l, ora, arrivo), num = casa ? '★' : String(++k);
    if(!punti.some(function(p){ return p.id === l.id; }) && l.lat != null) punti.push({id: l.id, t: num, n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa});
    h += (tp.m ? '<div class="tra">↓ ' + tp.m + ' ' + e(T.min) + ' ' + e(T.a_piedi) + (tp.mt ? ' · ' + tp.mt + ' m' : '') + '</div>' : '');
    h += '<div class="tappa"><div class="n"' + (casa ? ' style="background:var(--accento)"' : '') + '>' + num + '</div><div><a href="#/l/' + e(l.s) + '" style="color:inherit;text-decoration:none"><h3>' + e(l.n) + '</h3></a>' +
         '<div class="piccolo">' + (arrivo < 1440 ? '≈ ' + fmt(arrivo) : '') + (tp.so ? ' · ' + tp.so + ' ' + e(T.min) : '') + '</div>' +
         '<div class="meta" style="margin-top:4px">' + etichetta(sa) + '</div>' + (tp.nota ? '<p style="margin:6px 0 0">' + e(tp.nota) + '</p>' : '');
    if(tp.sv && tp.sv.length) h += '<details style="margin-top:8px"><summary class="piccolo" style="cursor:pointer;color:var(--accento);font-weight:600">' + e(T.come_arrivarci) + '</summary><ol style="margin:6px 0 0;padding-left:20px">' +
      tp.sv.map(function(x){ return '<li style="margin:4px 0">' + indicazione(x, l.n) + '</li>'; }).join('') + '</ol>' +
      (l.lat != null ? '<a class="piccolo" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>' : '') + '</details>';
    var chiusoArrivo = (sa.k === 'chiuso_oggi' || sa.k === 'chiuso_ora' || (sa.k === 'apre' && hm(sa.da) - arrivo > 30));
    if(chiusoArrivo){
      h += '<div class="alt"><b>' + e(T.chiuso_arrivo) + '.</b>';
      if(tp.alt && LU[tp.alt]) h += ' ' + e(T.alternativa) + ': <a href="#/l/' + e(LU[tp.alt].s) + '">' + e(LU[tp.alt].n) + '</a> ' + etichetta(stato(LU[tp.alt], ora, arrivo));
      h += '</div>';
    }
    h += '</div></div>';
    t += tp.so;
  });
  h += fontiHtml(i.fonti);
  var linee = i.tappe.filter(function(tp){ return tp.geo; }).map(function(tp){ return tp.geo; });
  setTimeout(function(){ mappa('m-itin', punti, true, linee); });
  return h;
};
V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), h = indietro() + '<h2>' + e(l.n) + '</h2>';
  h += fotoHtml(l.foto);
  if(l.som) h += '<p style="font-size:1.05rem">' + e(l.som) + '</p>';
  h += '<section class="scheda"><div class="meta">' + etichetta(stato(l, ora, ora.min)) + '</div>';
  if(!l.sa && verificati(l, ora) && l.or.length){
    h += '<table class="orari" style="margin-top:10px">';
    for(var g = 1; g <= 7; g++){
      var f = fasceDelGiorno(l, ora.data, g), aperte = f.filter(function(o){ return !o.x && o.da; });
      var txt = f.some(function(o){ return o.x; }) || !aperte.length ? T.giorni_chiusura : aperte.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      h += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>';
    }
    h += '</table><p class="piccolo" style="margin:8px 0 0">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  }
  if(l.po || l.sito) h += '<p style="margin:10px 0 0">' + (l.po ? '<a href="' + e(l.po) + '" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  var info = [];
  if(l.dv) info.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) info.push(e(T.gratuito)); else if(l.gr === false) info.push(e(T.pagamento));
  if(l.mp) info.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(info.length) h += '<p class="piccolo" style="margin:10px 0 0">' + info.join(' · ') + '</p>';
  h += '</section>';
  if(l.rac) h += '<div class="testo">' + par(l.rac) + '</div>';
  if(l.con) h += '<section class="scheda"><h3>' + e(T.consiglio) + '</h3><p style="margin:0">' + e(l.con) + '</p></section>';
  if(l.acc) h += '<section class="scheda"><h3>' + e(T.accessibilita) + '</h3><p style="margin:0">' + e(l.acc) + '</p></section>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<p><a class="bottone pieno" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a></p>';
    setTimeout(function(){ mappa('m-luogo', [{id: l.id, t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}], false); });
  }
  h += fontiHtml(l.fonti);
  return h;
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return indietro() + '<h2>' + e(r.t) + '</h2>' + fotoHtml(r.foto) + '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti);
};
V.mappa = function(){
  var ora = adesso(), punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l, n){ return {id: l.id, t: l.s === 'piazza-carita' ? '★' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: l.s === 'piazza-carita'}; });
  setTimeout(function(){ mappa('m-tutti', punti, true); });
  return indietro() + '<h2>' + e(T.mappa) + '</h2>' + bloccoMappa('m-tutti', '60vh');
};
V.piove = function(){
  var ora = adesso(), cop = D.luoghi.filter(function(l){ return D.coperto.indexOf(l.tipo) >= 0 && !l.sa; });
  var h = indietro() + '<h2>☂ ' + e(T.piove) + '</h2><p class="piccolo">' + e(T.piove_testo) + '</p>';
  if(!cop.length) return h + '<p>' + e(T.piove_vuoto) + '</p>';
  var peso = {aperto: 0, apre: 1, verifica: 2, chiuso_ora: 3, chiuso_oggi: 4};
  cop.sort(function(a, b){ return (peso[stato(a, ora, ora.min).k] || 0) - (peso[stato(b, ora, ora.min).k] || 0); });
  return h + '<ul class="lista">' + cop.map(function(l){ return voceLuogo(l, ora); }).join('') + '</ul>';
};
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h;
  if(p[0] === 'i') h = V.itinerario(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'l') h = V.luogo(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'r') h = V.racconto(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'mappa') h = V.mappa();
  else if(p[0] === 'piove') h = V.piove();
  else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<div class="avviso prova">' + e(T.anteprima) + '</div>' : '') + h +
    '<footer><p><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a></p><p>' + e(T.editoriale) + '<br>' + e(T.senza_rete) + '</p></footer>';
  if(p[0]) window.scrollTo(0, 0);
}
document.getElementById('t-titolo').textContent = T.titolo;
document.getElementById('t-sotto').textContent = T.sottotitolo;
if(D.lingue.length){
  document.getElementById('lingue').innerHTML = '<details class="lingue"><summary aria-label="' + e(T.lingua) + '">' + e((D.lingue.filter(function(x){ return x.c === D.lingua; })[0] || {}).b || '') + ' ' + e(D.lingua.toUpperCase()) + ' ▾</summary><ul>' +
    D.lingue.map(function(x){ return '<li><a data-lng="' + e(x.c) + '" href="' + e(x.u || './') + '"' + (x.c === D.lingua ? ' aria-current="true"' : '') + '>' + e(x.b + ' ' + x.n) + '</a></li>'; }).join('') + '</ul></details>';
  document.getElementById('lingue').addEventListener('click', function(ev){ var a = ev.target.closest('a[data-lng]'); if(!a) return; try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; });
  /* stessa scelta di lingua del menu: chi l'ha gia' scelta la ritrova */
  if(D.lingua === 'it'){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
}
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
</body>
