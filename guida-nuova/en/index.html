:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;

<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}

h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}

p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}

.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}

.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}

.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}

.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}

details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}

.guarda .testo{display:grid;gap:8px;font-size:.97rem}

.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}

.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}

.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}

.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}

.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}

.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}

.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}

.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
var D = {"lingua":"en","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità and Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"The starting point: Piazza Carità, on Via Toledo. From here, the historic center begins just a few minutes' walk away. And here is Ceraldi.","rac":"Piazza Carità overlooks Via Toledo, the large street that the Spanish viceroy Don Pedro di Toledo had opened in the sixteenth century, when he doubled the size of the city and built, on the nearby hill, the soldiers' quarters: the Spanish Quarters.\n\nFrom here, the old town is just a few minutes away: walk up towards Piazza del Gesù and you're on Spaccanapoli. Going down Via Toledo, you'll reach piazza del Plebiscito, the Royal Palace, and the sea.","con":"Before leaving, a coffee: the tour is long and Naples is best explored with the right cup.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità today, with its trees and colorful buildings","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità today, on Via Toledo: all the tours start from here. Ceraldi is here."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"The square in front of Ceraldi","x":"Piazza Carità is the starting point of all the tours: you are on Via Toledo, the great road opened in the sixteenth century by the viceroy Don Pedro of Toledo to connect the old centre with the new city and the Spanish Quarters.\n\nFrom here, in just a few minutes, you can reach Spaccanapoli, to the northeast, or the sea and castles, to the south. Before you leave, grab a coffee: it's a long drive, and Naples is best explored on foot.","d":"In front of the cafeteria","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Via Toledo and Largo della Carità in a 19th-century photo","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo and Largo Carità in the 19th century: the great street commissioned by Don Pedro de Toledo, already full of life at the time."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Vintage photo of Via Toledo in the 19th century, with carriages and passers-by","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo in the 19th century, when it was called Via Roma, in a photo by Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità and Via Toledo: a stroll through the heart of Naples","x":"The history of the square, told by those who have worked there since 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, the lower decumanus","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"The straight road that cuts the historic center in two: the lower decumanus of the Greek city, about two kilometers of churches, shops and life.","rac":"Spaccanapoli is the lowest of the three decumani, the parallel streets that crossed Greek Neapolis from west to east. It begins in Piazza del Gesù Nuovo as Via Benedetto Croce, then becomes Via San Biagio dei Librai, crosses Via Duomo, and continues beyond the old town: about two kilometers in total. The name says it all: it is so long and straight that, seen from above, it seems to split the city in two.","con":"Walk along it from Piazza del Gesù towards Via Duomo: it's a slight downhill ride of history, not of effort.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli seen from above, a straight line across the rooftops of the historic center.","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli seen from Sant'Elmo: a straight line cutting across the rooftops of the historic center."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"The road that divides Naples","x":"Spaccanapoli is the popular name for the lower decumanus, one of the three great parallel streets of the Greek city: it was the \"plateia\" of Neapolis. It is so called because, perfectly straight, it divides the ancient center in two between north and south.\n\nIt changes name several times: Via Benedetto Croce, then Via San Biagio dei Librai. From the hill, from the top of Via Pasquale Scura, you can see the entire street in one go.\n\nAlong the street, between the Middle Ages and the nineteenth century, convents and palaces of powerful families arose: look up at the portals and courtyards, and down at the shops.","d":"Along the entire street, from Piazza del Gesù to Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"The straight line of Spaccanapoli seen from above","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli seen from Castel Sant'Elmo: the straight line that divides the old town in two."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Square and Church of Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"A facade of pyramid-shaped stones that looks like a fortress and hides a mystery: engraved signs that no one has yet deciphered with certainty.","rac":"Before being a church, it was a palace: that of the Sanseverino princes, built in 1470; a plaque on the façade commemorates the architect, Novello da San Lucano. The Jesuits preserved the structure and the dark piperno ashlar, with the stones cut into pyramidal shapes, adding white marble elements.\n\nSome stones have engraved markings. Legend has it they're a secret message; some scholars believe they're the marks left by different stonecutters; in 2011, art historian Vincenzo De Pasquale proposed reading them as musical notes from a score called \"Enigma.\" Look closely and decide for yourself.\n\nThe façade was restored and unveiled on March 12, 2023, after some fragments fell in December 2017; the square has been closed to cars since then.","con":"Look for the markings on the stones at eye level, to the right and left of the portal: the hunt is free.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"The facade of the Gesù Nuovo, made of dark stones cut into points","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"The diamond-pointed façade: it was the palace of the Sanseverino princes, from 1470. Come closer and look for the signs engraved on the stones."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"The diamond-pointed facade","x":"Before being the façade of a church, it was that of a palace: the palace of the Sanseverino family, princes of Salerno, built in 1470. When the Jesuits built their church here, starting in 1584, they gutted the palace but saved the façade and portal. This was often done in Naples: space was limited in the old town, and construction outside the walls was impossible.\n\nLook at the stones: they are made of piperno, a very hard, gray volcanic stone, cut with a diamond-pointed finish (the \"rusnato\"). The large Baroque portal, with its columns, angels on the tympanum, and the Jesuit monogram \"IHS,\" still encloses the palace's Renaissance portal.\n\nNow come closer: many of the tips have small engraved markings. Some believe they are the marks of stonecutters' teams; legend has it that the master stonecutters knew how to \"charge\" the stone with energy; in 2010, some scholars interpreted them as musical notes, a view that has since been disputed. There's no definitive answer: find one and choose your own.","d":"Outside, in the square","foto":{"u":"../img/658e8ea49eab.jpg","alt":"The facade of the Gesù Nuovo covered with diamond points in grey stone","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"The diamond-pointed ashlar of the facade of the Gesù Nuovo, with the portal and the large window."}},{"t":"The Expulsion of Heliodorus","x":"It is the large fresco above the entrance door: it was painted by Francesco Solimena, who signed and dated it 1725. Many visitors do not see it, because they enter facing the altar: turn around.\n\nThe story comes from the Bible (Second Book of Maccabees): Heliodorus attempts to plunder the treasury of the Temple of Jerusalem and is repelled by a celestial knight. He searches for the knight, the horses, and the fleeing figures: it's a theatrical scene, full of movement, just as the Baroque period loved.\n\nOn the sides of the large window, above the fresco, there are two smaller scenes by Belisario Corenzio, from 1638: Saint Helena Finding the Cross and the Conversion of Saint Paul.","d":"As soon as you enter, turn towards the door: it is above the entrance","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"The large fresco of the Expulsion of Heliodorus by Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Solimena's fresco above the entrance: turn toward the door to see it. In the center is the celestial knight repelling Heliodorus."}},{"t":"The dome and the four evangelists","x":"Stop in the center of the church, where the nave intersects with the transept, and look up. In the four curved triangles supporting the dome (the \"pendentives\") are the four evangelists painted by Giovanni Lanfranco in the 17th century: they are all that remains of his great cycle, as the rest was lost with the dome.\n\nThe dome, in fact, had a difficult life. The original collapsed in the 1688 earthquake; it was rebuilt, but remained unsafe and was demolished at the end of the 18th century. In 1786, it was replaced by a lower, bowl-shaped covering, which is the one you see today; in 1975, it was reinforced with a reinforced concrete structure.\n\nAll around you is Neapolitan Baroque in its entirety: inlaid marble of many colors («marmi commessi»), gilded stucco, frescoes by Belisario Corenzio and Paolo De Matteis on the vaults, canvases by Luca Giordano and sculptures by Cosimo Fanzago.","d":"In the center of the church, look up","foto":{"u":"../img/3dd3789513c8.jpg","alt":"The nave of the Gesù Nuovo towards the dome","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"The nave of the Gesù Nuovo: where it crosses the transept, look up towards the dome and the four pendentives with the evangelists."}},{"t":"The chapel of Sant'Ignazio","x":"This is the large chapel at the end of the left transept, dedicated to Saint Ignatius of Loyola, founder of the Jesuits. The architecture and marble are by Cosimo Fanzago and his collaborators, between 1637 and 1645; to the sides of the altar, the two statues of the prophets David and Jeremiah are also the work of Fanzago.\n\nThe canvases depicting the life of the saint are by Jusepe de Ribera, the Spanish painter who worked in Naples and became one of its masters. The patron, Carlo Gesualdo da Venosa, is buried at the foot of the altar.\n\nThen cross the church: opposite, in the right wing, is the \"twin\" chapel of Saint Francis Xavier, the first Jesuit missionary in Asia, with sculptures by Fanzago and, above, three canvases by Luca Giordano from 1676-77. Look at them one after the other: they are seventeenth-century Neapolitan art at its finest.","d":"In one of the two large chapels of the church","foto":{"u":"../img/835d153e2859.jpg","alt":"A canvas by Ribera with Saint Ignatius in glory","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Saint Ignatius in Glory, a canvas by Jusepe de Ribera in the chapel dedicated to the founder of the Jesuits."}},{"t":"Saint Joseph Moscati","x":"Here lies the resting place of Naples' \"holy doctor\": Giuseppe Moscati, a physician and university professor who cared for the poorest of the poor free of charge and even helped them financially. He died in 1927 and was proclaimed a saint by Pope John Paul II in 1987.\n\nHis body is in the bronze urn in the center of the Chapel of the Visitation, the second on the right, where he was brought in 1977. The urn is by Amedeo Garufi: look at the three bas-reliefs, which show him lecturing at the university, healing a child in his mother's arms, and caring for the sick in the hospital. On the left is his bronze statue, from 1990.\n\nFrom the chapel of San Francesco Saverio, a door leads to the Rooms of San Giuseppe Moscati: photos, manuscripts, his clothing and medical instruments, and the study and bedroom of his home, reconstructed here. In the same rooms, a World War II bomb that fell on the church ceiling without exploding is on display.","d":"In the chapel of the Visitation, under the altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"The reconstructed room of Saint Giuseppe Moscati: white coat and medical instruments in a display case","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"In the reconstructed room: the white coat, the medical instruments and the photographs of Saint Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"The Gesù Nuovo square in front of the church","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"The square of Gesù Nuovo, in front of the church."},{"u":"../img/6d1ae4837518.jpg","alt":"The interior of the Gesù Nuovo, with coloured marbles and the main altar","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Inside, the contrast with the severe façade: colored marble, frescoes and gold up to the high altar."},{"u":"../img/3dd3789513c8.jpg","alt":"The nave of the Gesù Nuovo seen from the entrance","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"The nave seen from the entrance: at the bottom, above, the dome with Lanfranco's evangelists at the base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastery and Complex of Santa Chiara (majolica cloister)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"The majolica-clad cloister is one of the quietest places in the center: a stone's throw from the chaos of Spaccanapoli, silence.","rac":"Santa Chiara was built in 1310 by order of King Robert of Anjou and Queen Sancha of Majorca. The construction was led first by Gagliardo Primario and then by Lionardo di Vito, and in 1340 the church was opened for worship. The complex consisted of two parts: a convent for the Poor Clares and one for the Friars Minor, adjacent but separate.\n\nFour centuries later, at the suggestion of Queen Maria Amalia of Saxony, wife of Charles of Bourbon, the Poor Clare cloister was renovated. Architect Domenico Antonio Vaccaro retained the 14th-century Gothic arches and transformed the center into a Baroque garden, lined with majolica tiles from the workshop of Donato and Giuseppe Massa. The result is one of the most surprising places in Naples: a ceramic garden just steps from Spaccanapoli.\n\nThe church is Gothic, with a façade featuring a broad spire that frames the ancient rose window, and inside it has a single nave with ten chapels on each side. The bombing of August 4, 1943, hit it hard: it also destroyed part of the frescoes in the cloister, and the reconstruction restored the Gothic forms that the eighteenth-century stucco had hidden.\n\nBeneath the complex lies another surprise: the remains of a Roman bathhouse, discovered during postwar restoration. It had a gymnasium, an indoor pool, and rooms for hot-air baths: they are the most complete testimony to the ancient baths of Neapolis.","con":"On Sundays the cloister closes at 2 pm: if it's Sunday afternoon, swap orders and come here first.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"The entrance to the cloister of Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"The entrance to the majolica cloister of Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloister and museum"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloister and museum"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"The majolica pillars","x":"The garden is divided into four sections by two intersecting paths, and along the paths run 64 eight-sided pillars, all covered in majolica. The decorations are festoons of leaves, flowers, and fruit; the most common colors are yellow, orange, and blue, chosen to evoke the citrus trees and the vines of the pergola that grow above.\n\nThe majolica tiles are from the workshop of Donato and Giuseppe Massa, who followed the design of Neapolitan architect Domenico Antonio Vaccaro: he wanted the glazes, architecture, and plants to be one. The pillars end in piperno capitals and are connected by seats, also entirely made of majolica.\n\nThe cloister was thus transformed in the years around 1742, when the abbess was Sister Ippolita Carmignano: it was Queen Maria Amalia of Saxony, wife of Charles of Bourbon, who repeatedly pushed the nuns to \"modernize\" it.","d":"In the cloister garden","foto":{"u":"../img/924627d30fda.jpg","alt":"Pillars covered with yellow and green majolica tiles in the cloister","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"The pillars covered in majolica with festoons of leaves, flowers and fruit, under the pergola."}},{"t":"The scenes on the seats","x":"Sit down: the seats connecting the pillars are all majolica, and the backrests are painted with small eighteenth-century scenes. There are scenes of the countryside, the sea, folk festivals, and mythological stories: a narrative told through figures of life at the time.\n\nThe scenes continue on the low wall surrounding the flowerbeds: walk slowly along the paths and look down, as well as to the sides.\n\nA tip: It's a great game with kids. Choose a scene each and tell each other what's happening: who's fishing, who's dancing, who's working in the fields.","d":"On the backs of the seats between the pillars","foto":{"u":"../img/79ec1acbab17.jpg","alt":"A majolica seat with a scene painted on the backrest","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"A majolica seat from the cloister: on the back there is a painted scene."}},{"t":"The Clarissa with the cats","x":"Among all the scenes on the backrests, one speaks of the monastery itself: a Poor Clare nun feeding the cats that lived in the cloister. It's a small moment of everyday life, painted in majolica in the 18th century by the Massa workshop.\n\nThe Poor Clares are the nuns of the order of Saint Clare: the complex was in fact born with two nearby but separate convents, one for the Poor Clares and one for the Friars Minor.\n\nFinding it is a perfect treasure hunt, even for children: go through the seats one by one. If you don't find it, ask the cloister staff.","d":"On one of the seat backs: look for it","foto":null},{"t":"The arches of the fourteenth century","x":"The garden is Baroque, but the setting is medieval. The complex was commissioned in 1310 by King Robert of Anjou and Queen Sancha of Majorca; the work was directed by Gagliardo Primario and then by Lionardo di Vito, and the church was opened for worship in 1340.\n\nWhen Vaccaro redid the garden in the 18th century, he preserved the 14th-century perimeter: the pointed arches on piperno pillars. Notice the contrast between the austere stone of the arches and the bright colors of the majolica tiles: four centuries in a single glance.\n\nThe walls on all four sides are adorned with frescoes from the first half of the 17th century, by an unknown artist, perhaps from the school of Belisario Corenzio, depicting scenes from the Old Testament. As you enter, the first section of the wall on the right is empty: those frescoes were destroyed by the bombing of August 4, 1943.","d":"Along the four sides of the cloister","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"The arches of the cloister of Santa Chiara seen against the light, with the church in the background","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"The Gothic arches of the cloister of Santa Chiara, seen against the light: the façade of the church in the background."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolica with a wild boar hunting scene","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Up close: a wild boar hunt painted on majolica by the Massa workshop, between 1739 and 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"The cloister with majolica pillars, seats and garden","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"The entire cloister: the majolica pillars, the seats and the garden."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Sansevero Chapel","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"The Veiled Christ, one of the most famous sculptures in the world, and the anatomical machines of the alchemist prince Raimondo di Sangro.","rac":"The di Sangro family chapel is the kingdom of Raimondo, Prince of Sansevero: a man of science and secrets, Grand Master of Freemasonry, around whom the myth was born when he was still alive, and it was he himself who fueled it.\n\nAt the center is Giuseppe Sanmartino's Veiled Christ, commissioned by the prince: a reclining body covered by a shroud so thin it resembles wet cloth, yet carved from the same block of marble as the statue. In the underground cavea are two \"anatomical machines,\" skeletons of a man and a woman with reconstructed blood vessels, the work of the Palermo physician Giuseppe Salerno around 1756-1764. The black legend tells of sacrificed servants and mysterious injections; the museum itself carefully separates myth from documented history.","con":"It is closed on Tuesdays: if today is Tuesday, the statue of the Nile is two minutes away and can always be seen.","acc":"The nave and sacristy are wheelchair accessible. The underground auditorium with its anatomical machines is accessible only by a narrow 19th-century spiral staircase.","foto":{"u":"../img/65421f883be6.jpg","alt":"The exterior of the Sansevero Chapel","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"The Sansevero Chapel seen from outside."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"The Veiled Christ","x":"At the center of the chapel is a body stretched out on a mattress, its head and torso raised by a pillow, covered by a shroud so thin that the face, wounds, and veins can be seen beneath. The veil is not an afterthought: Giuseppe Sanmartino sculpted it from the same block of marble as the statue in 1753, commissioned by Prince Raimondo di Sangro.\n\nA document signed by the prince to pay the sculptor states: \"a life-size marble statue, representing the dead Lord Jesus Christ, covered by a transparent shroud carved from the same block as the statue.\" For centuries, it was said that the veil was real fabric transformed into marble through an alchemical process by the prince: this is just a legend.\n\nLook for the details: the wound in his side, the nail marks on his hand, and, at his feet, the crown of thorns and the nails of the Passion. Then walk around him slowly: on each side, the veil seems to change.","d":"In the center of the nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"The face of Christ veiled under the marble veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"The face under the veil: the shroud is carved from the same block of marble as the statue, yet it looks like wet cloth."}},{"t":"Modesty","x":"A young woman wrapped in a veil that clings to her skin as if wet, with a garland of roses in her hair. It was sculpted in 1752 by the Venetian Antonio Corradini, a sculptor renowned throughout Europe who had also worked for the emperor in Vienna. He died that same year, while designing the chapel's other decorations, as recorded by a plaque on the pillar.\n\nPrince Raimondo dedicated it to his mother, Cecilia Gaetani dell'Aquila d'Aragona, who died on December 26, 1710, when he was not yet a year old. He seeks the symbols of a life cut short too soon: the lost gaze, the tree growing from the stone, and the broken tombstone at her feet.\n\nOn the base is a bas-relief with the \"Noli me tangere,\" the resurrected Christ appearing to Mary Magdalene. The museum notes that the veiled woman can also be interpreted as an image of Wisdom, and recalls the veiled goddess Isis.","d":"Near the main altar","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"The statue of Modesty, a woman covered by a veil","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Modesty by Antonio Corradini: the veil clings to her body as if it were wet. At her feet, a broken tombstone."}},{"t":"The Disillusionment","x":"A man frees himself from a large net, aided by a small winged genie with a flame on his forehead, a symbol of human intellect. At his feet is a globe, representing the world's passions, with an open Bible above it. It was sculpted by the Genoese Francesco Queirolo between 1753 and 1754.\n\nThe prince dedicated it to his father, Antonio: having become a widower, he had left his son with his grandfather and traveled Europe, living a dissolute life. Then, as an old man, repentant, he returned to Naples and became a priest. The net is the sin from which man frees himself.\n\nLook closely at the net: it's all marble, perforated mesh by mesh. It's said that the craftsmen in charge of finishing it refused to touch it for fear of breaking it, and that Queirolo had to smooth it himself. As early as 1753, a contemporary called it \"the last daring feat that marble sculpture can dare to undertake.\"","d":"Near the main altar","foto":{"u":"../img/921cf7f91318.jpg","alt":"The statue of Disillusionment, a man freeing himself from a net","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Francesco Queirolo's Disillusionment: the net is entirely made of marble, perforated by hand."}},{"t":"The labyrinthine floor","x":"The floor you are walking on is not the original. The prince had designed a labyrinthine one: colored marbles, from blue to white, crossed by a continuous line of seamless white marble, forming swastikas alternating with concentric squares in perspective. Francesco Celebrano executed it starting in the mid-1760s; the prince himself wrote that the work was \"difficult and hindered.\"\n\nIn 1889, a serious collapse affected the palace and the chapel and damaged the floor: instead of restoring it, it was redone in Neapolitan terracotta, with yellow and blue enamel corresponding to the di Sangro coat of arms.\n\nLook for the original slabs in the passageway in front of Raimondo di Sangro's tomb; others are in the underground cavea and in the sacristy. For the prince, the labyrinth represented the arduous path that leads to knowledge.","d":"In the passage in front of the prince's tomb","foto":null},{"t":"The anatomical machines","x":"Descend the narrow staircase to the underground cavea: inside two display cases are the standing skeletons of a man and a woman, with the arterial and venous systems almost intact, down to the thinnest vessels.\n\nThey were made by the Palermo doctor Giuseppe Salerno. The prince purchased the male one in 1756, after seeing it in a public demonstration in Naples. He hired Salerno and had him make the second one. They were located in the palace, in a room called the \"Phoenix Apartment.\" The woman was on a platform that could be rotated so she could be observed from all sides.\n\nA \"black legend\" arose around them: it was said that the prince had two servants killed and injected them with a mysterious substance. In reality, the vases are reconstructions made from various materials, including beeswax and dyes; the anatomical knowledge they demonstrate, for the time, is astonishing.","d":"In the underground cavea, going down a narrow spiral staircase","foto":{"u":"../img/a3a047434411.jpg","alt":"A skeleton with the blood vessel system in the display case of the cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"One of Giuseppe Salerno's two anatomical machines in the underground cavea: skeleton and circulatory system."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"The interior of the Sansevero Chapel with the statues","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"The entire chapel: in the centre the Veiled Christ, surrounded by the statues of the di Sangro family."}],"leg":"Much was said about Raimondo di Sangro during his lifetime: mysterious experiments, alchemical secrets, even servants transformed into anatomical machines. The museum carefully distinguishes the black legend from the documented facts: it's worth hearing both versions and choosing a side.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"The church where St. Thomas Aquinas lived and taught and where, according to tradition, a crucifix spoke to him.","rac":"The Dominican complex overlooks the square of the same name, along Spaccanapoli. The Gothic-Angevin church was built between 1283 and 1324 and later transformed in the Baroque era. Thomas Aquinas lived and taught in the convent between 1272 and 1274; Giordano Bruno and Tommaso Campanella also had ties to the place.\n\nIn the sacristy, with its vault frescoed by Francesco Solimena in 1709, are the tombs of the Aragonese rulers. For centuries, the basilica also housed a masterpiece by Caravaggio, the Flagellation of Christ, now in the Capodimonte Museum.\n\nToday the complex can also be visited as a DOMA museum: sacristy, Aragonese tombs and cell of St. Thomas.","con":"If you have time, also explore the museum's tour: the sacristy, the Aragonese tombs, and the cell of St. Thomas. Hours vary, and some sections may be closed for renovations: check the official website before coming.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"The spire of San Domenico and the apse of the church in the square","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"The spire of San Domenico and, behind, the apse of the church."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Guided tours."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"The Crucifix that spoke to St. Thomas","x":"It is a painted panel, kept in the basilica. Tradition holds that Christ addressed Thomas Aquinas, who was praying after writing about theology: he told him that he had written well of him and asked what reward he desired. The Ministry of Culture remembers the panel as the one that \"spoke\" to the saint and that it was moved to a new chapel in 1437.","d":"Inside the basilica, in the chapel of the Crucifix","foto":{"u":"../img/4b0972ad805f.jpg","alt":"The chapel of the Crucifix in San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"The chapel of the Crucifix in San Domenico Maggiore, where the painting of the miracle is kept."}},{"t":"The sacristy of Solimena and the Aragonese tombs","x":"The vault of the sacristy was frescoed by Francesco Solimena in 1709 with the Triumph of the Dominican Order. Along the walls are the burial vaults of the Aragonese sovereigns and other court dignitaries.","d":"In the sacristy, visit the DOMA museum","foto":{"u":"../img/07519e21f0fa.jpg","alt":"The sacristy of San Domenico Maggiore with its frescoed vault","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"The sacristy of San Domenico Maggiore, with the vault by Francesco Solimena and the Aragonese arches."}},{"t":"The cell of St. Thomas","x":"Thomas Aquinas lived and studied here. The cell has been restored and can be visited along with the DOMA museum.","d":"On the museum's route","foto":{"u":"../img/f68192e11f82.jpg","alt":"The cell of St. Thomas Aquinas with reliquary and furnishings","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"The cell of St. Thomas Aquinas in the convent of San Domenico Maggiore."}}],"gal":[],"leg":"It is said that the Crucifix painted on wood, preserved in the basilica, spoke to Saint Thomas Aquinas while he was praying: it told him that he had written well of him and asked him what reward he desired.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli and statue of the Nile","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"A Roman statue of the god Nile, mistaken for centuries for a breastfeeding woman: the \"Body of Naples\".","rac":"In Piazzetta Nilo, along Via San Biagio dei Librai, also known as Spaccanapoli, there is a marble statue from the 2nd-3rd century AD depicting the god of the Nile River: a bearded man reclining with a cornucopia, surrounded by cherubs symbolizing the branches of the river. It was erected by Alexandrian merchants who lived in this area, called Regio Nilensis.\n\nShe was found headless in 1476. The Neapolitans mistook her for a female figure breastfeeding children, a symbol of the city nurturing its inhabitants: hence the name \"Corpo di Napoli,\" which still gives the square its name. In 1657, she was placed on a new base, and in the same century, a bearded head was sculpted.\n\nToday the statue still stands, a reminder of Naples' multicultural roots.","con":"Take your time: it's a five-minute stop on the Spaccanapoli road. Look for the cherubs on the god's body: they explain why she was mistaken for a woman.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"The ancient statue of the god Nile, lying down","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"The statue of the god Nile, reclining, in the small square that bears his name."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"The god Nile and the cherubs","x":"The river god lies on his side, holding a cornucopia. The cherubs surrounding him symbolize the branches of the Nile. To those who gazed at her headless form for a long time, she resembled a breastfeeding woman.","d":"In the center of the square","foto":{"u":"../img/83dce4234fd4.jpg","alt":"The statue of the god Nile reclining with putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"The god Nile reclining with the cornucopia and cherubs."}},{"t":"Why \"Corpo di Napoli\"","x":"The statue was found headless in 1476. This led to the belief that it was a female figure feeding her children: the city itself. The name stuck, even after the statue received a new head.","d":"On the base and in the name of the square","foto":{"u":"../img/c0e842c87218.jpg","alt":"The statue of the Nile on its pedestal in the square","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"The statue on the base of Largo Corpo in Naples."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai and its shops","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"The booksellers' and artisans' section of Spaccanapoli: shops, churches, and the Doll Hospital.","rac":"This is the stretch of Spaccanapoli that runs from Piazzetta Nilo to Via Duomo, on the lower decumanus. Its name comes from the bookshops that have always been located there: an inscription on the nearby Palazzo Marigliano commemorates the art of the master booksellers. Devotion to Saint Blaise dates back to the 8th century, when nuns from Armenia brought a relic of the saint to Naples. Also along the street is the Ospedale delle Bambole, an artisan workshop passed down from generation to generation.","con":"December is the month of nativity scene shops: be prepared for crowds on weekends.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai seen from the front: a narrow cobbled street lined with tall buildings, with balconies, clothes hanging out to dry, shops, and pedestrians, and the Vomero hill in the distance.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, the liveliest stretch of Spaccanapoli, filled with shops and lively conversations."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"The Street of the Booksellers","x":"San Biagio dei Librai connects Piazzetta Nilo and Via Duomo and is part of the lower decumanus. Its name recalls the many bookshops that have always stood here, and the church of San Biagio Maggiore, dedicated to the patron saint of those with sore throats. The devotion arrived in the 8th century with nuns from Armenia, who brought a relic of the saint.\n\nThe philosopher and historian Giambattista Vico was born on this street.\n\nWalk slowly: it's one of the liveliest streets in Naples, always full of people.","d":"Along the way","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: the narrow alley, the shops, and a banner hanging high above","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: the narrow, straight street of the lower decumanus, with shops and people strolling."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella at the Booksellers' and the skull with ears","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"A tiny stonemason's church dedicated to the saint of eyes, and a unique skull: the one with ears.","rac":"Founded shortly before 1327 by Bartolomeo di Capua, a jurist to the Angevin kings, the church was then entrusted to the pipernieri, the stone cutters: they chose Saint Lucia, protector of sight, because the splinters from their trade put their eyes at risk.\n\nAbandoned for over thirty years, it was reopened on April 5, 2019, thanks to the Respiriamo Arte association. In its underground vault, the cult of the \"anime pezzentelle\" (sick souls) left a skull unlike any other: it has ears.","con":"It's small and can be visited in just a few minutes: perfect as a break between Sansevero and Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"The portal of Santa Luciella in the alley","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"The portal of Santa Luciella. Look up: above is the fresco with the coat of arms of the Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"The coat of arms of the Pipernieri","x":"Before entering, look up: above the piperno portal there is still the fresco with the coat of arms of the pipernieri guild, the stone cutters to whom the church belonged.\n\nThey worked with chisels and hammers on piperno, a very hard stone, and feared that splinters would end up in their eyes: for this reason they chose Saint Lucy, protector of sight. It was a powerful guild; it was even said that they could infuse stones with good or bad energies.\n\nThe church is very ancient: it was founded shortly before 1327 by Bartolomeo di Capua, advisor to the Angevin kings. In Baratta's 1629 view of Naples, it is listed as the millers' chapel; it was rebuilt in the 18th century. It remained closed and abandoned for over thirty years, until the Respiriamo Arte association reopened it on April 5, 2019.","d":"Above the entrance portal","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"The fresco above the portal of Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"The fresco above the portal of Santa Luciella, with the coat of arms of the pipernieri corporation."}},{"t":"The skull with ears","x":"Beneath the church, in the hypogeum, there is a skull with preserved mummified ear cartilage: for this reason, it is considered unique. Popular tradition holds that, precisely because it has ears, it better hears the prayers of those who ask for a favor.\n\nThe hypogeum can only be visited with a guided tour. Thanks to the \"Paths of Light\" project, supported by FAI and Intesa Sanpaolo, the lights are turned on one detail at a time, alternating between illuminated and shadowed areas: let yourself be guided.\n\nRemember that it is a place linked to the deceased and to devotion: it is looked upon with respect, in a low voice.","d":"In the hypogeum, with a guided tour","foto":{"u":"../img/7a5a070c0866.jpg","alt":"The skull with ears in the hypogeum of Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"The skull with the ears: you can see the mummified cartilages on the sides of the skull."}},{"t":"The poor souls","x":"In the 17th century, the plague killed thousands of people in Naples: the dead were buried in mass graves, and their names were lost. Thus was born the cult of the \"anime pezzentelle,\" the poor souls who died without a name, without a funeral, or without prayers.\n\nWhoever asked for a grace (a healing, a pregnancy, help) \"adopted\" one of those skulls, the \" capuzzelle \": they cleaned it, placed it in a niche and prayed for it, so that the soul would reach Heaven and there remember whoever had helped it.\n\nThe cult of Santa Luciella was deeply rooted. You'll find it in Purgatorio ad Arco, on Via dei Tribunali, and its symbolic place is the Fontanelle Cemetery, in the Sanità district.","d":"In the hypogeum","foto":{"u":"../img/8110a7061c73.jpg","alt":"Skulls illuminated by candlelight, with a plaque \"for grace received\"","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Skulls in display cases: a plaque reads the name of the person who granted the favor, a way of thanking the \"beggarly\" souls."}}],"gal":[],"leg":"It is said that the skull with ears, precisely because it has ears, listens better to prayers: for this reason, for generations, the most difficult requests have been entrusted to it.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Doll Hospital","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"A shop that has been curating dolls and toys for generations: a shop window that children, and adults, will always remember.","rac":"At the end of the 19th century, Luigi Grassi worked as a set designer for theaters and nativity scenes. Neighbors began bringing him broken dolls and toys, and his workshop became, almost by accident, the first toy \"hospital\" in Naples.\n\nToday, it's run by Tiziana, the founder's great-granddaughter, in the courtyard of Palazzo Marigliano on Via San Biagio dei Librai. Inside, it functions like a real hospital: white coats, wards, and a medical record for each patient. For many Neapolitans, it's the place where they took their favorite toy as children.","con":"The window display alone is worth the stop: it's on the way back.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"The Doll Hospital window full of dolls","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"The Doll Hospital window display: dolls and toys waiting to be \"cured.\""},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"October and November opening hours: may change at other times."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"October and November opening hours: may change at other times."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"A real hospital, for toys","x":"It's not a shop but a laboratory organized like a hospital: the patients are dolls, teddy bears, and stuffed animals, each with their own story.\n\nThe \"doctors\" work in white coats, divided into departments like in a real hospital: orthopedics, ophthalmology, and tailoring. Each patient has their own medical records and diagnosis.\n\nIt's a place that children love, but also adults who find toys from their childhood there.","d":"In the shop","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Doll heads awaiting repair","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Doll heads, arms, and eyes awaiting care: in the workshop, each piece has its own \"department.\""}},{"t":"The founder set designer","x":"It all began in the late 19th century with Luigi Grassi, who built sets for theaters and nativity scenes. Neighbors began bringing him broken toys, and he transformed his workshop into the first \"hospital\" for dolls.\n\nSince then, the shop has been passed down from generation to generation in the same family: today, patients are treated by Tiziana, his great-granddaughter.\n\nThink about the connection with the city: Naples is the city of nativity scenes, and Via San Gregorio Armeno, the street of shepherds' shops, is a stone's throw from here.","d":"In the history of the shop","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"The door of the Doll Hospital shop with the windows","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"The entrance to the Doll Hospital on Via San Biagio dei Librai: the shop opened by the Grassi family."}},{"t":"The courtyard of Palazzo Marigliano","x":"The hospital is located in the courtyard of Palazzo Marigliano, at number 39 Via San Biagio dei Librai: one of the Neapolitan Renaissance buildings linked to the names of the architects Giovanni Francesco Mormando and Giovanni Francesco di Palma.\n\nAs you enter the main door, the street noise fades: it's one of the many hidden courtyards in the historic center worth discovering. There's also an inscription on the building that recalls how an Augustal basilica once stood nearby.\n\nThe entire street is worth a look: it is the \"lower decumanus\" of the Greek city, the street of the booksellers, and here the philosopher Giambattista Vico was born.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"The yellow courtyard of Palazzo Marigliano with the entrance arch","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"The courtyard of Palazzo Marigliano, with its entrance arch and ochre-colored facades."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, the street of nativity scenes","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"A narrow alley where Christmas lasts all year round: artisan workshops, terracotta shepherds, and nativity scenes.","rac":"Via San Gregorio Armeno connects Via dei Tribunali with Via San Biagio dei Librai, also known as Spaccanapoli. It's the street of nativity scenes: artisan workshops display figurines and nativity scenes year-round, even in summer. According to some sources, the tradition of producing terracotta figurines in this area dates back to Roman times; the Neapolitan nativity scene became internationally renowned in the 18th century.\n\nAmong the historic shops are Gambardella, active since 1800, and the Capuano Brothers, founded in 1840. Along the street there is also the monastery of San Gregorio Armeno, from which the street takes its name, with the church dedicated to Saint Patrizia, co-patron saint of Naples.\n\nThe busiest period is from the end of November to Epiphany, when the street is very crowded.","con":"Come early in the morning and on weekdays: it gets crowded in December. Look for the shepherds who tell current events: every year the artisans create new ones.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"The street of the nativity scenes, narrow and full of shops","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, the street of nativity scenes."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"The nativity scene shops","x":"The workshops produce shepherds and nativity scenes in terracotta and cork, often hand-painted. Alongside the traditional figures, there are contemporary characters: every year the artisans invent new ones. You can also browse without buying: many artisans work in plain sight.","d":"All along the way","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"A bench full of nativity scene shepherds","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"A stall on the shepherds' street, among traditional figures and modern-day characters."}},{"t":"The monastery of San Gregorio Armeno","x":"The monastery gives its name to the street. The church preserves a coffered ceiling by Teodoro d'Errico and frescoes by Luca Giordano, such as the Glory of Saint Gregory. The complex also includes a church dedicated to Saint Patricia, co-patron saint of Naples.","d":"Inside the monastery, along the street","foto":{"u":"../img/30ec6bba5546.jpg","alt":"The nave of the church of San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"The church of San Gregorio Armeno, with its coffered ceiling and frescoes."}},{"t":"When to go","x":"The shops are open year-round. The busiest time is from late November to Epiphany, when the streets are packed with people: weekdays and early mornings are best.","d":"All along the way","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Crowded Via San Gregorio Armeno","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno: best on weekdays and early in the morning."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore and the Neapolis excavations","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"A 13th-century Gothic church that hides, ten meters below the nave, the market of ancient Neapolis: streets, shops and rooms from two thousand years ago.","rac":"Piazza San Gaetano is the heart of ancient Neapolis. The Gothic Basilica of San Lorenzo Maggiore, one of the city's oldest churches, was built in the 13th century over the remains of the Greco-Roman market. The complex also includes the convent, the Opera Museum, and the excavations.\n\nThe excavations, which began in 1976, brought to light the macellum, the market, which once stood along the ancient decumanus major. Descending about ten meters below the church, you walk through streets, shops, and rooms dating back to the Imperial period. The remains of a 6th-century Christian basilica were also discovered beneath the church.\n\nThe Opera Museum, housed in the convent and civic tower, tells the story of Naples from the classical age to the 19th century.","con":"Descend into the excavations: this is the part you don't expect. Allow about 45 minutes, and check the schedule on the official website before coming.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"The façade of San Lorenzo Maggiore on Piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, overlooking Piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"The timetable is listed on the Ministry of Culture website and on tourist sources; the official website was not legible: please check before writing as certain."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"The market under the church","x":"The excavations reveal the macellum of Greco-Roman Neapolis, the market that stood along the ancient decumanus major. They are located about ten meters below the church. Walking among the structures, you can recognize the street and the rooms where goods were sold and traded: it is a piece of the ancient city still in place, upon which Naples continued to build.","d":"Under the nave, in the excavations","foto":{"u":"../img/ab890c42a731.jpg","alt":"A Roman road in the excavations under San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"The excavations under San Lorenzo Maggiore: the street and the shops of the ancient city."}},{"t":"The main altar of Giovanni da Nola","x":"The high altar is a Renaissance work by the Neapolitan sculptor Giovanni da Nola, among the most beautiful in Naples. The apse housing it is the oldest part of the church.","d":"At the back of the church, in the apse","foto":null},{"t":"The Opera Museum","x":"The museum occupies the convent and the civic tower next to the basilica. It displays furnishings, costumes, and collections, presenting the history of Naples from the classical age to the 19th century.","d":"In the convent, next to the basilica","foto":{"u":"../img/591ff764e679.jpg","alt":"A room in the museum in the San Lorenzo Maggiore complex","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"The rooms of the convent of San Lorenzo Maggiore which house the Opera Museum."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, the church of the capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"The Church of the capuzzelle: beneath the floor, the hypogeum where Naples prayed for nameless souls. And Lucia's skull.","rac":"Neapolitans call it \"'e cape 'e morte,\" the church of the death's heads. It's a small 17th-century church on the main decumanus, linked to the devotion to the souls in Purgatory spread by the Counter-Reformation. A steep staircase leads to the hypogeum, the underground church, expanded and decorated with majolica in the 18th century: here, devotees cared for anonymous remains and sought their intercession. At the end of a small corridor, the skull of Lucia, a particularly beloved young soul, is kept.","con":"Behind the altar, look for the marble winged skull by Dionisio Lazzari: it is the symbol of the church.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"The facade of the Purgatorio ad Arco on Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"The facade of the Purgatorio ad Arco, on the main decumanus."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Upper church, hypogeum, and museum. Guided tours included in the ticket price, with reservations required."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"High church, hypogeum and museum."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"The paintings of the seventeenth century","x":"Before descending, take a good look at the church above. It was commissioned in 1616 by the lay congregation \"Opera Pia Purgatorio ad Arco \" from architect Giovan Cola di Franco and consecrated in 1638.\n\nIt was designed on two levels: the upper church, representing the earthly dimension, and the underground cemetery below, which concretely represents Purgatory. The entire decoration reminds those who enter that souls await a prayer to ascend to Heaven.\n\nHere are precious marbles and paintings by three great masters of 17th-century Neapolitan art: Massimo Stanzione, Luca Giordano, and Andrea Vaccaro. The sacristy and oratory also house a small museum with silverware, vestments, manuscripts, and paintings created for the congregation between the 17th and 19th centuries.","d":"In the upper church","foto":{"u":"../img/a8b34654121a.jpg","alt":"A 17th-century marble tomb in the upper church","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"In the upper church: the tomb of Pietro Antonio Mastrilli (1607), among the marbles and paintings of the seventeenth century."}},{"t":"The Winged Skull","x":"Among the marbles of the upper church is Dionisio Lazzari's famous winged skull: a skull with wings that captures the spirit of the place. Here, death is not scary: it becomes an opportunity for prayer and connection with those who are no longer with us.\n\nIt is no coincidence that Neapolitans call this church \"'e cape 'e morte\", the one with skulls.\n\nThe message was intended: in the church born with the Counter-Reformation, everything was meant to remind passers-by and the faithful that the souls in Purgatory were waiting for a prayer to ascend to Heaven.","d":"In the upper church","foto":{"u":"../img/63d1e885c193.jpg","alt":"A marble bas-relief with a winged and crowned skull","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"The winged and crowned skull in marble bas-relief, first half of the 17th century: the symbol of the church."}},{"t":"The Hypogeum of Souls","x":"The real church is the one below. From an opening in the floor of the upper church, high steps lead down to a large, bare space, a true lower church.\n\nIn the center of the floor is a large, unmarked tomb surrounded by black chains and illuminated by a few light bulbs. Along the walls are niches, small altars, and shrines: these are signs of the cult that arose here spontaneously in the 17th century, when the faithful cared for nameless human remains and prayed for their protection. At the back is the ancient 17th-century altar with large black crosses.\n\nDescend slowly: it's a place of living devotion, not just curiosity. A guided tour in Italian is included in the ticket price, upon reservation.","d":"Under the church, going down a steep staircase","foto":{"u":"../img/7fc480d05134.jpg","alt":"The hypogeum of Purgatorio ad Arco altars and candles","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"The hypogeum, the church below: altars, candles, and evidence of the cult of souls."}},{"t":"Lucia's skull","x":"Among all the skulls in the hypogeum, there's one particularly beloved: that of Lucia, believed to be the soul of a young woman. It's kept at the end of a small corridor.\n\nIt is the most touching testimony to the cult of the souls in Purgatory, which arose here spontaneously in the 17th century: the devotees choose a nameless remains, take care of them and ask for their protection.\n\nLook at her with respect: for many Neapolitans, she is still a presence they can turn to.","d":"In the hypogeum, at the end of a small corridor","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"An image of the souls in Purgatory among the flames inside the church","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Inside the church: the souls of Purgatory in the flames, the theme of the entire place."},{"u":"../img/de63b1b83fa8.jpg","alt":"A bronze skull on a small column","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"A bronze skull: the symbol of the \" capuzzelle \" church."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterran
