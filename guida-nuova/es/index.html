<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía de Nápoles · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="../caratteri/caratteri.css">
<link rel="stylesheet" href="../mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

var D = {"lingua":"es","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità y Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"El punto de partida: Piazza Carità, en la vía Toledo. Desde aquí, el centro histórico empieza a pocos minutos a pie. Y aquí está Ceraldi.","rac":"Piazza Carità da a la Via Toledo, la gran calle que el virrey español don Pedro de Toledo mandó abrir en el siglo XVI, cuando duplicó la ciudad y construyó, en la colina contigua, los barrios para los soldados: los Barrios Españoles.\n\nDesde aquí el casco antiguo está a pocos minutos: sube hacia la Piazza del Gesù y estás en Spaccanapoli. Bajando en cambio por la Via Toledo llegas a Piazza del Plebiscito, al Palacio Real y al mar.","con":"Antes de partir, un café: el recorrido es largo y Nápoles se visita mejor con la tacita adecuada.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità hoy, con árboles y edificios de colores","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità hoy, en la Via Toledo: de aquí salen todos los recorridos. Ceraldi está aquí."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La plaza frente a Ceraldi","x":"Piazza Carità es el punto de partida de todos los recorridos: estás en la Via Toledo, la gran calle abierta en el siglo XVI por el virrey don Pedro de Toledo para conectar el centro antiguo con la ciudad nueva y los Barrios Españoles.\n\nDesde aquí, en pocos minutos estás en Spaccanapoli, al noreste, o en el mar y los castillos, al sur. Antes de partir, tómate un café: el recorrido es largo y Nápoles se recorre a pie.","d":"Frente a la cafetería","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Via Toledo y el Largo della Carità en una fotografía del siglo XIX","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo y Largo Carità en el siglo XIX: la gran calle que quiso don Pedro de Toledo, ya entonces llena de vida."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Foto de época de la Via Toledo en el siglo XIX, con carruajes y transeúntes","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La Via Toledo en el siglo XIX, cuando se llamaba Via Roma, en una foto de Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità y vía Toledo: un paseo por el corazón de Nápoles","x":"La historia de la plaza, contada por quienes trabajan aquí desde 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, el decumano inferior","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La calle recta que parte en dos el centro histórico: el decumano inferior de la ciudad griega, unos dos kilómetros de iglesias, tiendas y vida.","rac":"Spaccanapoli es el más bajo de los tres decumanos, las calles paralelas que atravesaban de oeste a este la Neapolis griega. Comienza en la piazza del Gesù Nuovo con el nombre de via Benedetto Croce, luego se convierte en via San Biagio dei Librai, cruza via Duomo y continúa más allá del casco antiguo: unos dos kilómetros en total. El nombre lo dice todo: es tan larga y recta que, vista desde lo alto, parece partir la ciudad en dos.","con":"Recórrela a pie desde la Piazza del Gesù hacia la Via Duomo: es una leve bajada por la historia, no por el esfuerzo.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista desde lo alto, una línea recta a través de los tejados del centro histórico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista desde Sant'Elmo: una línea recta que corta los tejados del centro histórico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La calle que parte Nápoles","x":"Spaccanapoli es el nombre popular del decumano inferior, una de las tres grandes calles paralelas de la ciudad griega: era la «plateia» de Neapolis. Se llama así porque, perfectamente recta, divide en dos el centro antiguo, entre el norte y el sur.\n\nCambia de nombre varias veces: Via Benedetto Croce, luego Via San Biagio dei Librai. Desde la colina, desde lo alto de la Via Pasquale Scura, se ve entera, en línea recta.\n\nA lo largo de la calle, entre la Edad Media y el siglo XIX, surgieron conventos y palacios de familias poderosas: mira hacia arriba los portales y los patios, y hacia abajo las tiendas.","d":"A lo largo de toda la calle, desde la Piazza del Gesù hasta la Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"La línea recta de Spaccanapoli vista desde arriba","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli vista desde el Castel Sant'Elmo: la línea recta que divide en dos el centro antiguo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Plaza e Iglesia del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fachada de piedras en punta de pirámide que parece una fortaleza y esconde un misterio: marcas grabadas que nadie ha descifrado todavía con certeza.","rac":"Antes de ser una iglesia era un palacio: el de los príncipes Sanseverino, construido en 1470; una lápida en la fachada recuerda al arquitecto, Novello da San Lucano. Los jesuitas conservaron su estructura y el almohadillado de piperno oscuro, con las piedras talladas en punta de pirámide, añadiendo elementos de mármol blanco.\n\nEn algunas piedras se ven marcas grabadas. Según la leyenda son un mensaje secreto; para algunos estudiosos son las marcas dejadas por los distintos equipos de canteros; en 2011 el historiador del arte Vincenzo De Pasquale propuso leerlas como las notas musicales de una partitura llamada «Enigma». Míralas de cerca y elige tú tu versión.\n\nLa fachada fue restaurada y presentada el 12 de marzo de 2023, tras la caída de algunos fragmentos en diciembre de 2017; desde entonces la plaza está cerrada a los coches.","con":"Busca las marcas en las piedras a la altura de los ojos, a derecha e izquierda del portal: la búsqueda es gratuita.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La fachada del Gesù Nuovo, de piedras oscuras talladas en punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La fachada de puntas de diamante: era el palacio de los príncipes Sanseverino, de 1470. Acércate y busca las marcas grabadas en las piedras."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La fachada de puntas de diamante","x":"Antes de ser la fachada de una iglesia, fue la de un palacio: el palacio de los Sanseverino, príncipes de Salerno, construido en 1470. Cuando los jesuitas construyeron aquí su iglesia, a partir de 1584, destriparon el palacio pero salvaron su fachada y su portal. En Nápoles esto se hacía a menudo: en el centro antiguo había poco espacio y fuera de las murallas no se podía construir.\n\nMira las piedras: son de piperno, una piedra volcánica gris y durísima, talladas en punta de diamante (el «almohadillado»). El gran portal barroco, con las columnas, los ángeles sobre el tímpano y el monograma de los jesuitas «IHS», encierra todavía el portal renacentista del palacio.\n\nAhora acércate: en muchas puntas hay pequeñas marcas grabadas. Para algunos son las marcas de las cuadrillas de canteros; una leyenda dice que los maestros canteros del piperno sabían «cargar» la piedra de energía; en 2010 algunos estudiosos las leyeron como las notas de una partitura, lectura que después fue cuestionada. No hay una respuesta cierta: busca una y elige la tuya.","d":"Fuera, en la plaza","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La fachada del Gesù Nuovo cubierta de puntas de diamante de piedra gris","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"El almohadillado de puntas de diamante de la fachada del Gesù Nuovo, con el portal y la gran ventana."}},{"t":"La expulsión de Heliodoro","x":"Es el gran fresco situado sobre la puerta de entrada: lo pintó Francesco Solimena, que lo firmó y lo fechó en 1725. Muchos visitantes no lo ven, porque entran mirando hacia el altar: gírese.\n\nLa historia procede de la Biblia (segundo libro de los Macabeos): Heliodoro intenta saquear el tesoro del templo de Jerusalén y es rechazado por un jinete celeste. Busque al jinete, los caballos y las figuras que huyen: es una escena teatral, llena de movimiento, como le gustaba al barroco.\n\nA los lados del gran ventanal, sobre el fresco, hay dos escenas más pequeñas de Belisario Corenzio, de 1638: Santa Elena encuentra la Cruz y la Conversión de San Pablo.","d":"Nada más entrar, gírese hacia la puerta: está encima de la entrada","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"El gran fresco de la Expulsión de Heliodoro de Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"El fresco de Solimena sobre la entrada: gírese hacia la puerta para verlo. En el centro, el jinete celeste que rechaza a Heliodoro."}},{"t":"La cúpula y los cuatro evangelistas","x":"Detente en el centro de la iglesia, donde la nave se cruza con el transepto, y alza la vista. En los cuatro triángulos curvos que sostienen la cúpula (las «pechinas») están los cuatro evangelistas pintados por Giovanni Lanfranco en el siglo XVII: es lo que queda de su gran ciclo, porque el resto se perdió junto con la cúpula.\n\nLa cúpula, en efecto, ha tenido una vida difícil. La original se derrumbó con el terremoto de 1688; fue reconstruida, pero quedó en mal estado y a finales del siglo XVIII fue derribada. En 1786 la sustituyó una cubierta más baja, en forma de cuenco, que es la que ves hoy; en 1975 fue consolidada con una estructura de hormigón armado.\n\nA tu alrededor tienes el barroco napolitano al completo: mármoles incrustados de muchos colores («marmi commessi»), estucos dorados, frescos de Belisario Corenzio y Paolo De Matteis en las bóvedas, lienzos de Luca Giordano y esculturas de Cosimo Fanzago.","d":"En el centro de la iglesia, mira hacia arriba","foto":{"u":"../img/3dd3789513c8.jpg","alt":"La nave del Gesù Nuovo hacia la cúpula","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nave del Gesù Nuovo: donde se cruza con el transepto, alza la vista hacia la cúpula y las cuatro pechinas con los evangelistas."}},{"t":"La capilla de San Ignacio","x":"Es la gran capilla situada al fondo del brazo izquierdo del transepto, dedicada a San Ignacio de Loyola, fundador de los jesuitas. La arquitectura y los mármoles son de Cosimo Fanzago y sus colaboradores, entre los años 1637 y 1645 aproximadamente; a los lados del altar, las dos estatuas de los profetas David y Jeremías son obra del propio Fanzago.\n\nLos lienzos con la vida del santo son de Jusepe de Ribera, el pintor español que trabajó en Nápoles y llegó a ser uno de sus maestros. Al pie del altar está enterrado el comitente, Carlo Gesualdo da Venosa.\n\nDespués atraviesa la iglesia: enfrente, en el brazo derecho, está la capilla «gemela» de San Francisco Javier, el primer misionero jesuita en Asia, con esculturas de Fanzago y, en lo alto, tres lienzos de Luca Giordano de 1676-77. Míralos uno tras otro: es el Seicento napolitano en su máximo esplendor.","d":"En una de las dos grandes capillas de la iglesia","foto":{"u":"../img/835d153e2859.jpg","alt":"Un lienzo de Ribera con San Ignacio en gloria","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"San Ignacio en gloria, lienzo de Jusepe de Ribera en la capilla dedicada al fundador de los jesuitas."}},{"t":"San Giuseppe Moscati","x":"Aquí reposa el «médico santo» de Nápoles: Giuseppe Moscati, médico y profesor universitario, que atendía gratis a los más pobres y los ayudaba también con dinero. Murió en 1927 y fue proclamado santo por el papa Juan Pablo II en 1987.\n\nSu cuerpo está en la urna de bronce en el centro de la capilla de la Visitación, la segunda a la derecha, adonde fue trasladado en 1977. La urna es de Amedeo Garufi: fíjese en los tres bajorrelieves, que lo muestran dando clase en la universidad, curando a un niño en brazos de su madre y atendiendo a los enfermos en el hospital. A la izquierda está su estatua de bronce, de 1990.\n\nDesde la gran capilla de San Francisco Javier, una puerta conduce a las Salas de San Giuseppe Moscati: fotos, manuscritos, su ropa e instrumentos médicos, y el estudio y el dormitorio de su casa, reconstruidos aquí. En las mismas salas se exhibe una bomba de la Segunda Guerra Mundial que cayó sobre el techo de la iglesia sin explotar.","d":"En la capilla de la Visitación, bajo el altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La habitación reconstruida de san Giuseppe Moscati: bata blanca e instrumentos médicos en una vitrina","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"En la habitación reconstruida: la bata blanca, los instrumentos médicos y las fotografías de san Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La plaza del Gesù Nuovo frente a la iglesia","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La plaza del Gesù Nuovo, frente a la iglesia."},{"u":"../img/6d1ae4837518.jpg","alt":"El interior del Gesù Nuovo, con mármoles de colores y el altar mayor","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, el contraste con la fachada severa: mármoles de colores, frescos y oro fino hasta el altar mayor."},{"u":"../img/3dd3789513c8.jpg","alt":"La nave del Gesù Nuovo vista desde la entrada","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nave vista desde la entrada: al fondo, en lo alto, la cúpula con los evangelistas de Lanfranco en la base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monasterio y complejo de Santa Chiara (claustro de mayólica)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"El claustro revestido de mayólicas es uno de los lugares más tranquilos del centro: a dos pasos del caos de Spaccanapoli, el silencio.","rac":"Santa Chiara nace en 1310 por voluntad del rey Roberto de Anjou y de la reina Sancia de Mallorca. Las obras fueron dirigidas primero por Gagliardo Primario y después por Lionardo di Vito, y en 1340 la iglesia se abrió al culto. El complejo era doble: un convento para las monjas clarisas y otro para los frailes menores, cercanos pero separados.\n\nCuatro siglos después, por sugerencia de la reina María Amalia de Sajonia, esposa de Carlos de Borbón, se renovó el claustro de las clarisas. El arquitecto Domenico Antonio Vaccaro conservó los arcos góticos del siglo XIV y transformó el centro en un jardín barroco, revestido con mayólicas del taller de Donato y Giuseppe Massa. El resultado es uno de los lugares más sorprendentes de Nápoles: un jardín de cerámica a dos pasos de Spaccanapoli.\n\nLa iglesia es gótica, con una fachada de amplio gablete que enmarca el antiguo rosetón, y en su interior tiene una única nave con diez capillas a cada lado. El bombardeo del 4 de agosto de 1943 la golpeó con dureza: destruyó también parte de los frescos del claustro, y la reconstrucción le ha devuelto las formas góticas que los estucos del siglo XVIII habían ocultado.\n\nBajo el complejo hay otra sorpresa: los restos de un establecimiento termal romano, descubierto durante las restauraciones de la posguerra. Tenía una palestra, una piscina cubierta y salas para los baños de aire caliente: son el testimonio más completo de las antiguas termas de Neapolis.","con":"Los domingos el claustro cierra a las 14:00: si es domingo por la tarde, cambia el orden y ven aquí primero.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"La entrada del claustro de Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"La entrada del claustro de mayólica de Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Claustro y museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Claustro y museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Los pilares de mayólica","x":"El jardín está dividido en cuatro partes por dos paseos que se cruzan, y a lo largo de los paseos corren 64 pilares de ocho lados, todos revestidos de mayólica. Las decoraciones son guirnaldas de hojas, flores y frutas; los colores más usados son el amarillo, el naranja y el azul, elegidos para evocar los cítricos y la vid de la pérgola que crece sobre ti.\n\nLas mayólicas son del taller de Donato y Giuseppe Massa, que siguieron el proyecto del arquitecto napolitano Domenico Antonio Vaccaro: él quiso que esmaltes, arquitectura y plantas fueran una sola cosa. Los pilares terminan en capiteles de piperno y están unidos por asientos, también estos íntegramente de mayólica.\n\nEl claustro se transformó así en los años en torno a 1742, cuando la abadesa era sor Ippolita Carmignano: fue la reina María Amalia de Sajonia, esposa de Carlos de Borbón, quien empujó varias veces a las monjas a «modernizarlo».","d":"En el jardín del claustro","foto":{"u":"../img/924627d30fda.jpg","alt":"Pilares revestidos de mayólicas amarillas y verdes en el claustro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Los pilares revestidos de mayólicas con guirnaldas de hojas, flores y frutas, bajo la pérgola."}},{"t":"Las escenas de los bancos","x":"Siéntese: los bancos que unen los pilares son todos de mayólica, y en los respaldos hay pintadas pequeñas escenas del siglo XVIII. Hay escenas del campo, del mar, fiestas populares e historias mitológicas: un relato en imágenes de la vida de entonces.\n\nLas escenas continúan también en el muro bajo que rodea los parterres: recorra los paseos con calma y mire hacia abajo, además de a los lados.\n\nUn consejo: es un juego precioso para hacer con los niños. Elijan una escena cada uno y cuéntense qué está pasando: quién va a pescar, quién baila, quién trabaja en el campo.","d":"En los respaldos de los bancos entre los pilares","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un banco de mayólica con una escena pintada en el respaldo","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un banco de mayólica del claustro: en el respaldo hay una escena pintada."}},{"t":"La clarisa con los gatos","x":"Entre todas las escenas de los respaldos hay una que habla del propio monasterio: una monja clarisa dando de comer a los gatos que vivían en el claustro. Es un pequeño momento de vida cotidiana, pintado en mayólica en el siglo XVIII por el taller de los Massa.\n\nLas clarisas son las monjas de la orden de Santa Chiara: el conjunto nació, de hecho, con dos conventos vecinos pero separados, uno para las clarisas y otro para los frailes menores.\n\nEncontrarla es una búsqueda del tesoro perfecta, también para los niños: recorra los bancos uno por uno. Si no la encuentra, pregunte al personal del claustro.","d":"En uno de los respaldos de los bancos: búsquela","foto":null},{"t":"Los arcos del siglo XIV","x":"El jardín es barroco, pero el marco es medieval. El conjunto fue promovido en 1310 por el rey Roberto de Anjou y la reina Sancha de Mallorca; las obras fueron dirigidas por Gagliardo Primario y después por Lionardo di Vito, y la iglesia se abrió al culto en 1340.\n\nCuando en el siglo XVIII Vaccaro rehízo el jardín, conservó el perímetro del siglo XIV: los arcos apuntados sobre pilares de piperno. Fíjese en el contraste entre la piedra severa de los arcos y los colores alegres de las mayólicas: cuatro siglos en una sola mirada.\n\nEn las paredes de los cuatro lados corren frescos de la primera mitad del siglo XVII, de un autor desconocido, quizá de la escuela de Belisario Corenzio, con escenas del Antiguo Testamento. Nada más entrar, el primer tramo de pared a la derecha está vacío: esos frescos fueron destruidos por el bombardeo del 4 de agosto de 1943.","d":"A lo largo de los cuatro lados del claustro","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Los arcos del claustro de Santa Chiara vistos a contraluz, con la iglesia al fondo","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Los arcos góticos del claustro de Santa Chiara, vistos a contraluz: al fondo, la fachada de la iglesia."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Mayólicas con una escena de caza del jabalí","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"De cerca: una caza del jabalí pintada sobre las mayólicas por el taller de los Massa, entre 1739 y 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"El claustro con los pilares de mayólica, los asientos y el jardín","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"El claustro completo: los pilares de mayólica, los asientos y el jardín."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Capilla Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"El Cristo velado, una de las esculturas más famosas del mundo, y las máquinas anatómicas del príncipe alquimista Raimondo di Sangro.","rac":"La capilla de la familia di Sangro es el reino de Raimondo, príncipe de Sansevero: hombre de ciencia y de secretos, Gran Maestre de la Masonería, en torno al cual nació el mito cuando aún estaba vivo, y fue él mismo quien lo alimentó.\n\nEn el centro está el Cristo velado de Giuseppe Sanmartino, encargado por el príncipe: un cuerpo yacente cubierto por un sudario tan fino que parece tela mojada, pero esculpido en el mismo bloque de mármol que la estatua. En la cámara subterránea se encuentran las dos «máquinas anatómicas», esqueletos de un hombre y una mujer con el sistema de vasos sanguíneos reconstruido, obra del médico palermitano Giuseppe Salerno hacia 1756-1764. La leyenda negra habla de sirvientes sacrificados y de inyecciones misteriosas; el propio museo separa con cuidado el mito de la historia documentada.","con":"Los martes está cerrada: si hoy es martes, la estatua del Nilo está a dos minutos y se puede ver siempre.","acc":"La nave y la sacristía se pueden visitar también en silla de ruedas. A la cámara subterránea con las máquinas anatómicas solo se llega por una estrecha escalera de caracol del siglo XIX.","foto":{"u":"../img/65421f883be6.jpg","alt":"El exterior de la Capilla Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Capilla Sansevero vista desde fuera."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"El Cristo velado","x":"En el centro de la capilla hay un cuerpo tendido sobre un colchón, con la cabeza y el busto levantados por una almohada, cubierto por un sudario tan fino que debajo se distinguen el rostro, las heridas y las venas. El velo no es un añadido: Giuseppe Sanmartino lo esculpió del mismo bloque de mármol que la estatua, en 1753, por encargo del príncipe Raimondo di Sangro.\n\nLo dice un documento firmado por el príncipe para pagar al escultor: «una estatua de mármol esculpida a tamaño natural, que representa a Nuestro Señor Jesucristo muerto, cubierto por un sudario transparente realizado del mismo bloque de la estatua». Durante siglos se ha contado que el velo era un tejido verdadero transformado en mármol mediante un procedimiento alquímico del príncipe: es solo una leyenda.\n\nBusca los detalles: la herida del costado, la marca de los clavos en la mano y, a los pies, la corona de espinas y los clavos de la Pasión. Luego rodéalo lentamente: desde cada lado el velo parece cambiar.","d":"En el centro de la nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"El rostro del Cristo velado bajo el velo de mármol","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"El rostro bajo el velo: el sudario está esculpido en el mismo bloque de mármol que la estatua, y sin embargo parece tela mojada."}},{"t":"El Pudor","x":"Una joven envuelta en un velo que se adhiere a la piel como si estuviera mojado, con una guirnalda de rosas en el cabello. La esculpió en 1752 el véneto Antonio Corradini, escultor famoso en toda Europa que había trabajado también para el emperador en Viena: murió el mismo año, mientras proyectaba las demás decoraciones de la capilla, como recuerda una lápida en el pilar.\n\nEl príncipe Raimondo la dedicó a su madre, Cecilia Gaetani dell'Aquila d'Aragona, fallecida el 26 de diciembre de 1710, cuando él aún no había cumplido un año. Busca los símbolos de una vida interrumpida demasiado pronto: la mirada perdida, el árbol que nace de la piedra y la lápida rota a sus pies.\n\nEn el pedestal hay un bajorrelieve con el «Noli me tangere», Cristo resucitado que se aparece a la Magdalena. El museo recuerda que la mujer velada puede interpretarse también como imagen de la Sabiduría, y evoca a la diosa Isis velada.","d":"Cerca del altar mayor","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La estatua del Pudor, una mujer cubierta por un velo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"El Pudor de Antonio Corradini: el velo se adhiere al cuerpo como si estuviera mojado. A sus pies, la lápida rota."}},{"t":"El Desengaño","x":"Un hombre se libera de una gran red, ayudado por un pequeño genio alado con una llamita en la frente, símbolo del intelecto humano. A sus pies está el globo terráqueo, las pasiones del mundo, con una Biblia abierta encima. Lo esculpió el genovés Francesco Queirolo entre 1753 y 1754.\n\nEl príncipe lo dedicó a su padre, Antonio: al quedar viudo, había dejado a su hijo con el abuelo y había viajado por Europa llevando una vida desordenada; después, de anciano y arrepentido, volvió a Nápoles y se hizo sacerdote. La red es el pecado del que el hombre se libera.\n\nMira la red de cerca: es toda de mármol, calada malla por malla. Se cuenta que los artesanos encargados del acabado se negaron a tocarla por miedo a romperla, y que Queirolo tuvo que pulirla él solo. Ya en 1753 un contemporáneo la definió como «la última prueba audaz a la que puede atreverse la escultura en mármol».","d":"Cerca del altar mayor","foto":{"u":"../img/921cf7f91318.jpg","alt":"La estatua del Desengaño, un hombre que se libera de una red","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"El Desengaño de Francesco Queirolo: la red es toda de mármol, calada a mano."}},{"t":"El suelo laberíntico","x":"El suelo que pisas no es el original. El príncipe había ideado uno en forma de laberinto: mármoles de colores, del azul al blanco, atravesados por una línea continua de mármol blanco sin juntas, que dibujaba cruces ganchudas alternadas con cuadrados concéntricos en perspectiva. Lo ejecutó Francesco Celebrano a partir de mediados de la década de 1760; el propio príncipe escribió que el trabajo fue «difícil y entorpecido».\n\nEn 1889 un grave derrumbe afectó al palacio y a la capilla y dañó el suelo: en lugar de restaurarlo, se rehízo en cotto napolitano, con esmalte amarillo y azul en torno al escudo de los di Sangro.\n\nBusca las losas originales en el pasillo frente a la tumba de Raimondo di Sangro; otras están en la cavea subterránea y en la sacristía. Para el príncipe, el laberinto era la imagen del difícil camino que lleva al conocimiento.","d":"En el pasillo frente a la tumba del príncipe","foto":null},{"t":"Las máquinas anatómicas","x":"Baja la estrecha escalera hasta la cavea subterránea: dentro de dos vitrinas están los esqueletos de pie de un hombre y de una mujer, con el sistema de arterias y venas casi intacto, hasta los vasos más finos.\n\nLos realizó el médico palermitano Giuseppe Salerno. El príncipe compró el masculino en 1756, después de haberlo visto en una demostración pública en Nápoles, tomó a Salerno a su servicio y le hizo realizar el segundo. Estaban en el palacio, en una sala llamada «Apartamento del Fénix»; la mujer estaba sobre una plataforma que se hacía girar para observarla por todos los lados.\n\nEn torno a ellos nació la «leyenda negra»: se decía que el príncipe había hecho matar a dos sirvientes e inyectado en sus cuerpos una sustancia misteriosa. En realidad, los vasos son una reconstrucción hecha con diversos materiales, entre ellos cera de abeja y colorantes; sigue siendo sorprendente el conocimiento de la anatomía que demuestran, para la época.","d":"En la cavea subterránea, bajando una estrecha escalera de caracol","foto":{"u":"../img/a3a047434411.jpg","alt":"Un esqueleto con el sistema de vasos sanguíneos en la vitrina de la cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"Una de las dos máquinas anatómicas de Giuseppe Salerno en la cavea subterránea: esqueleto y sistema circulatorio."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"El interior de la capilla Sansevero con las estatuas","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La capilla completa: en el centro el Cristo velado, alrededor las estatuas de la familia di Sangro."}],"leg":"Ya en vida, de Raimondo di Sangro se contaba de todo: experimentos misteriosos, secretos alquímicos, incluso sirvientes transformados en las máquinas anatómicas. El museo distingue con cuidado la leyenda negra de los hechos documentados: merece la pena escuchar ambas versiones y elegir de qué lado ponerse.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"La iglesia donde vivió y enseñó santo Tomás de Aquino y donde, según la tradición, un Crucifijo le habló.","rac":"El complejo dominico se asoma a la plaza del mismo nombre, a lo largo de Spaccanapoli. La iglesia gótico-angevina se construyó entre 1283 y 1324 y más tarde fue transformada en época barroca. En el convento vivió y enseñó Tomás de Aquino, entre 1272 y 1274; también Giordano Bruno y Tommaso Campanella estuvieron vinculados a este lugar.\n\nEn la sacristía, cuya bóveda fue decorada al fresco por Francesco Solimena en 1709, se encuentran las arcas de los soberanos aragoneses. Durante siglos la basílica custodió también una obra maestra de Caravaggio, la Flagelación de Cristo, hoy en el Museo de Capodimonte.\n\nHoy el complejo puede visitarse también como museo DOMA: sacristía, arcas aragonesas y celda de santo Tomás.","con":"Si tienes tiempo, entra también en el recorrido del museo: sacristía, tumbas aragonesas y celda de santo Tomás. Los horarios cambian y algunas secciones pueden estar cerradas por obras: consulta la web oficial antes de venir.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"La aguja de San Domenico y el ábside de la iglesia en la plaza","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"La aguja de San Domenico y, detrás, el ábside de la iglesia."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visitas guiadas."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"El Crucifijo que habló a santo Tomás","x":"Es una tabla pintada, custodiada en la basílica. La tradición dice que Cristo se dirigió a Tomás de Aquino, que rezaba después de haber escrito sobre teología: le habría dicho que había escrito bien de él y le habría preguntado qué recompensa deseaba. El Ministerio de Cultura recuerda la tabla como aquella que «habló» al santo y que fue trasladada en 1437 a una nueva capilla.","d":"Dentro de la basílica, en la capilla del Crucifijo","foto":{"u":"../img/4b0972ad805f.jpg","alt":"La gran capilla del Crucifijo en San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"La gran capilla del Crucifijo en San Domenico Maggiore, donde se custodia la tabla del milagro."}},{"t":"La sacristía de Solimena y las arcas aragonesas","x":"La bóveda de la sacristía fue pintada al fresco por Francesco Solimena en 1709 con el Triunfo de la Orden dominica. A lo largo de las paredes se ven las arcas sepulcrales de los soberanos aragoneses y de otros dignatarios de la corte.","d":"En la sacristía, durante la visita al museo DOMA","foto":{"u":"../img/07519e21f0fa.jpg","alt":"La sacristía de San Domenico Maggiore con la bóveda al fresco","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"La sacristía de San Domenico Maggiore, con la bóveda de Francesco Solimena y las arcas aragonesas."}},{"t":"La celda de santo Tomás","x":"Aquí vivió y estudió Tomás de Aquino. La celda ha sido restaurada y se puede visitar junto con el museo DOMA.","d":"En el recorrido del museo","foto":{"u":"../img/f68192e11f82.jpg","alt":"La celda de santo Tomás de Aquino con relicario y mobiliario","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"La celda de santo Tomás de Aquino en el convento de San Domenico Maggiore."}}],"gal":[],"leg":"Se cuenta que el Crucifijo pintado sobre tabla, conservado en la basílica, habló a santo Tomás de Aquino mientras rezaba: le habría dicho que había escrito bien de él y le habría preguntado qué recompensa deseaba.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli y estatua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una estatua romana del dios Nilo, confundida durante siglos con una mujer que amamanta: el «Corpo di Napoli».","rac":"En la plazoleta del Nilo, a lo largo de la Via San Biagio dei Librai, es decir, Spaccanapoli, hay una estatua de mármol de los siglos II-III d. C. que representa al dios del río Nilo: un hombre barbudo semirreclinado con una cornucopia, rodeado de putti que simbolizan los brazos del río. La erigieron los mercaderes alejandrinos que vivían en esta zona, llamada Regio Nilensis.\n\nFue hallada sin cabeza en 1476. Por eso los napolitanos la confundieron con una figura femenina que amamanta a unos niños, símbolo de la ciudad que alimenta a sus habitantes: de ahí el nombre «Corpo di Napoli», que todavía hoy da nombre a la plazoleta. En 1657 fue colocada sobre un nuevo pedestal y en el mismo siglo se le esculpió una cabeza barbuda.\n\nHoy la estatua sigue en su lugar, en recuerdo de las raíces multiculturales de Nápoles.","con":"Pasa con calma: es una parada de cinco minutos en el camino de Spaccanapoli. Busca los putti sobre el cuerpo del dios: hacen entender por qué se la confundió con una mujer.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"La antigua estatua del dios Nilo, reclinado","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La estatua del dios Nilo, reclinado, en la pequeña plaza que lleva su nombre."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"El dios Nilo y los putti","x":"El dios del río está recostado sobre un costado y sostiene una cornucopia. Los putti que lo rodean simbolizan los brazos del Nilo. Para quienes la miraron durante mucho tiempo sin cabeza, parecía una mujer amamantando.","d":"En el centro de la plazoleta","foto":{"u":"../img/83dce4234fd4.jpg","alt":"La estatua del dios Nilo recostado con los putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"El dios Nilo recostado con la cornucopia y los putti."}},{"t":"Por qué «Corpo di Napoli»","x":"La estatua fue hallada sin cabeza en 1476. Por eso se pensó en una figura femenina que alimenta a sus hijos: la ciudad misma. El nombre ha permanecido en la plazoleta, incluso después de que la estatua recibiera una cabeza nueva.","d":"En el pedestal y en el nombre de la plazoleta","foto":{"u":"../img/c0e842c87218.jpg","alt":"La estatua del Nilo sobre su pedestal en la plazoleta","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"La estatua sobre el pedestal del Largo Corpo di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai y sus talleres","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La parte de Spaccanapoli de los libreros y los artesanos: talleres, iglesias y el Ospedale delle Bambole.","rac":"Es el tramo de Spaccanapoli que va desde la piazzetta Nilo hasta via Duomo, sobre el decumano inferior. El nombre viene de las tiendas de libros que siempre estuvieron aquí: una inscripción en el cercano Palazzo Marigliano recuerda precisamente el arte de los maestros libreros. La devoción a san Blas se remonta al siglo VIII, cuando unas monjas llegadas de Armenia llevaron a Nápoles una reliquia del santo. A lo largo de la calle se encuentra también el Ospedale delle Bambole, taller artesano transmitido de generación en generación.","con":"Diciembre es el mes de los talleres de belenes: prepárate para las multitudes los fines de semana.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"La via San Biagio dei Librai vista a lo largo: una calle estrecha empedrada entre edificios altos, con balcones, ropa tendida, tiendas y transeúntes, y al fondo la colina del Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, el tramo de Spaccanapoli más vivo de talleres y voces."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La calle de los libreros","x":"San Biagio dei Librai une la Piazzetta Nilo y la Via Duomo y forma parte del decumano inferior. El nombre recuerda las muchas librerías que desde siempre se encuentran aquí, y la iglesia de San Biagio Maggiore, dedicada al santo protector de quienes tienen dolor de garganta: la devoción llegó en el siglo VIII con monjas venidas de Armenia, que trajeron una reliquia del santo.\n\nEn esta calle nació el filósofo e historiador Giambattista Vico.\n\nCamina despacio: es una de las calles más vivas de Nápoles, siempre llena de gente.","d":"A lo largo de la calle","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: el callejón estrecho, las tiendas y un estandarte colgado en lo alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la calle estrecha y recta del decumano inferior, con sus tiendas y la gente paseando."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai y la calavera con orejas","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Una pequeñísima iglesia de los canteros dedicada a la santa de los ojos, y una calavera única en el mundo: la que tiene orejas.","rac":"Fundada poco antes de 1327 por Bartolomeo di Capua, jurista de los reyes angevinos, la iglesia fue confiada después a los pipernieri, los canteros: eligieron a santa Lucía, protectora de la vista, porque las astillas de su oficio ponían en riesgo sus ojos.\n\nAbandonada durante más de treinta años, fue reabierta el 5 de abril de 2019 gracias a la asociación Respiriamo Arte. En su hipogeo, el culto de las anime pezzentelle ha dejado una calavera sin igual: tiene orejas.","con":"Es pequeña y se visita en pocos minutos: perfecta como pausa entre Sansevero y via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"El portal de Santa Luciella en el callejón","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"El portal de Santa Luciella. Levanta la vista: encima está el fresco con el escudo de los pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"El escudo de los pipernieri","x":"Antes de entrar, levanta la vista: sobre el portal de piperno todavía se conserva el fresco con el escudo del gremio de los pipernieri, los canteros a quienes pertenecía la iglesia.\n\nTrabajaban con cincel y martillo el piperno, una piedra durísima, y temían que las esquirlas les saltaran a los ojos: por eso eligieron a santa Lucía, protectora de la vista. Era un gremio poderoso; se decía incluso que sabían infundir a las piedras energías buenas o malas.\n\nLa iglesia es antiquísima: fue fundada poco antes de 1327 por Bartolomeo di Capua, consejero de los reyes angevinos. En la vista de Nápoles de Baratta, de 1629, aparece indicada como capilla de los molineros; fue reconstruida en el siglo XVIII. Permaneció cerrada y abandonada durante más de treinta años, hasta que la asociación Respiriamo Arte la reabrió el 5 de abril de 2019.","d":"Sobre el portal de entrada","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"El fresco sobre el portal de Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"El fresco sobre el portal de Santa Luciella, con el escudo del gremio de los canteros de piperno."}},{"t":"El cráneo con orejas","x":"Bajo la iglesia, en el hipogeo, hay un cráneo que ha conservado los cartílagos momificados de las orejas: por eso se considera único. La tradición popular dice que, precisamente porque tiene orejas, escucha mejor las plegarias de quienes le piden un favor.\n\nEl hipogeo solo se visita con la visita guiada. Gracias al proyecto «Percorsi di luce», apoyado por el FAI e Intesa Sanpaolo, las luces se encienden un detalle cada vez, alternando zonas iluminadas y zonas en penumbra: déjate guiar.\n\nRecuerda que es un lugar vinculado a los difuntos y a la devoción: se mira con respeto, en voz baja.","d":"En el hipogeo, con la visita guiada","foto":{"u":"../img/7a5a070c0866.jpg","alt":"El cráneo con orejas en el hipogeo de Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"El cráneo con orejas: se ven los cartílagos momificados a los lados del cráneo."}},{"t":"Las anime pezzentelle","x":"En el siglo XVII la peste mató a miles de personas en Nápoles: los muertos fueron enterrados en fosas comunes y se perdió su nombre. Así nació el culto de las «anime pezzentelle», las almas pobres, muertas sin nombre, sin funeral y sin oraciones.\n\nQuien pedía un favor (una curación, un embarazo, una ayuda) «adoptaba» uno de aquellos cráneos, las capuzzelle: lo limpiaba, lo colocaba en un nicho y rezaba por él, para que el alma llegara al Paraíso y, allá arriba, se acordara de quien la había ayudado.\n\nEl culto estaba muy arraigado en Santa Luciella. Lo volverás a encontrar en el Purgatorio ad Arco, en la Via dei Tribunali, y su lugar emblemático es el Cementerio de Fontanelle, en el barrio de la Sanità.","d":"En el hipogeo","foto":{"u":"../img/8110a7061c73.jpg","alt":"Cráneos iluminados por la luz de una vela, con una placa «por gracia recibida»","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Cráneos en vitrinas: en una placa se lee el nombre de quien recibió la gracia, una forma de dar las gracias a las almas «pezzentelle»."}}],"gal":[],"leg":"Se dice que la calavera con orejas, precisamente porque tiene orejas, escucha mejor las oraciones: por eso, durante generaciones, se le han confiado las peticiones más difíciles.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Hospital de las Muñecas","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Un taller que desde hace generaciones «cura» muñecas y juguetes: un escaparate que los niños, y no solo ellos, recuerdan para siempre.","rac":"A finales del siglo XIX, Luigi Grassi trabajaba como escenógrafo para teatros y belenes. Los vecinos empezaron a llevarle muñecas y juguetes rotos, y su taller se convirtió, casi por casualidad, en el primer «hospital» de juguetes de Nápoles.\n\nHoy lo continúa Tiziana, bisnieta del fundador, en el patio del Palazzo Marigliano, en la Via San Biagio dei Librai. En su interior funciona como un hospital de verdad: batas blancas, departamentos y una historia clínica para cada paciente. Para muchos napolitanos es el lugar al que, de niños, llevaron su juguete favorito.","con":"Incluso solo el escaparate merece una parada: está en el camino de vuelta.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"El escaparate del Ospedale delle Bambole lleno de muñecas","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"El escaparate del Ospedale delle Bambole: muñecas y juguetes a la espera de ser «curados»."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Horarios de octubre y noviembre: en otras épocas pueden cambiar."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Horarios de octubre y noviembre: en otras épocas pueden cambiar."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un hospital de verdad, para juguetes","x":"No es una tienda, sino un taller organizado como un hospital: los pacientes son muñecas, ositos y peluches, cada uno con su propia historia.\n\nLos «médicos» trabajan con bata blanca, divididos en departamentos como en un hospital de verdad: ortopedia, oftalmología, sastrería. Cada paciente tiene su historial clínico y su diagnóstico.\n\nEs un lugar que gusta mucho a los niños, pero también a los adultos, que encuentran aquí los juguetes de su infancia.","d":"En el taller","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Cabezas de muñeca a la espera de reparación","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Cabezas, brazos y ojos de muñeca a la espera de cuidados: en el taller cada pieza tiene su propia «sala»."}},{"t":"El fundador, un escenógrafo","x":"Todo empezó a finales del siglo XIX con Luigi Grassi, que construía escenografías para los teatros y belenes. Los vecinos empezaron a llevarle sus juguetes rotos, y él transformó su taller en el primer «hospital» para muñecas.\n\nDesde entonces el taller ha pasado de generación en generación dentro de la misma familia: hoy quien cuida de los pacientes es Tiziana, su bisnieta.\n\nPiensa en el vínculo con la ciudad: Nápoles es la ciudad de los belenes, y la via San Gregorio Armeno, la calle de los talleres de pastores, está a dos pasos de aquí.","d":"En la historia del taller","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"La puerta del taller del Ospedale delle Bambole con los escaparates","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"La entrada del Ospedale delle Bambole en la via San Biagio dei Librai: el taller abierto por la familia Grassi."}},{"t":"El patio del Palazzo Marigliano","x":"El hospital se encuentra en el patio del Palazzo Marigliano, en el número 39 de la Via San Biagio dei Librai: uno de los palacios del Renacimiento napolitano vinculados a los nombres de los arquitectos Giovanni Francesco Mormando y Giovanni Francesco di Palma.\n\nAl entrar por el portón, el ruido de la calle se apaga: es uno de los muchos patios escondidos del centro histórico que merece la pena descubrir. En el palacio hay también una inscripción que recuerda que cerca de aquí se alzaba en la Antigüedad una basílica augustal.\n\nConviene recorrer toda la calle con calma: es el «decumano inferior» de la ciudad griega, la calle de los libreros, y aquí nació el filósofo Giambattista Vico.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"El patio amarillo del Palazzo Marigliano con el arco de entrada","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"El patio del Palazzo Marigliano, con el arco de entrada y las fachadas color ocre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, la calle de los belenes","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Un callejón estrecho donde la Navidad dura todo el año: talleres de artesanos, pastores de terracota y belenes.","rac":"La vía San Gregorio Armeno une la vía dei Tribunali con la vía San Biagio dei Librai, es decir, Spaccanapoli. Es la calle de los belenes: los talleres artesanos exponen figuritas y belenes durante todo el año, incluso en verano. Según algunas fuentes, la tradición de fabricar figuras de terracota en esta zona se remonta a la época romana; la fama del belén napolitano se hizo internacional a partir del siglo XVIII.\n\nEntre los talleres históricos se encuentran Gambardella, activo desde 1800, y los Fratelli Capuano, fundado en 1840. A lo largo de la calle se encuentra también el monasterio de San Gregorio Armeno, del que la calle toma su nombre, con la iglesia dedicada a santa Patrizia, copatrona de Nápoles.\n\nEl período más animado va de finales de noviembre a la Epifanía, cuando la calle está abarrotada.","con":"Ven a primera hora de la mañana y en días laborables: en diciembre hay mucha aglomeración. Busca las figuras del belén que cuentan la actualidad: cada año los artesanos crean otras nuevas.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"La calle de los belenes, estrecha y llena de talleres","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, la calle de los belenes."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Los talleres de belenes","x":"Los talleres elaboran figuras y belenes de terracota y corcho, a menudo pintados a mano. Junto a las figuras tradicionales hay personajes de la actualidad: cada año los artesanos inventan otros nuevos. Puedes mirar sin comprar: muchos artesanos trabajan a la vista.","d":"A lo largo de toda la calle","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"Un puesto lleno de figuras de belén","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Un puesto de la calle de las figuras de belén, entre figuras tradicionales y personajes de hoy."}},{"t":"El monasterio de San Gregorio Armeno","x":"El monasterio da nombre a la calle. La iglesia conserva un techo artesonado de Teodoro d'Errico y frescos de Luca Giordano, como la Gloria de San Gregorio. En el complejo también se encuentra la iglesia dedicada a santa Patricia, copatrona de Nápoles.","d":"Dentro del monasterio, a lo largo de la calle","foto":{"u":"../img/30ec6bba5546.jpg","alt":"La nave de la iglesia de San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"La iglesia de San Gregorio Armeno, con el techo artesonado y los frescos."}},{"t":"Cuándo ir","x":"Los talleres están abiertos todo el año. La época más animada va de finales de noviembre a la Epifanía, cuando la calle está llena de gente: mejor ir entre semana y a primera hora de la mañana.","d":"A lo largo de toda la calle","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Via San Gregorio Armeno llena de gente","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno: mejor entre semana y a primera hora de la mañana."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore y las excavaciones de Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Una iglesia gótica del siglo XIII que esconde, diez metros bajo la nave, el mercado de la antigua Neapolis: calles, tiendas y estancias de hace dos mil años.","rac":"La plaza San Gaetano es el corazón de la antigua Neapolis. En el siglo XIII, sobre los restos del mercado grecorromano, se levantó la basílica gótica de San Lorenzo Maggiore, una de las iglesias más antiguas de la ciudad. El complejo incluye también el convento, el Museo dell'Opera y las excavaciones.\n\nLas excavaciones, iniciadas en 1976, sacaron a la luz el macellum, el mercado, que se alzaba a lo largo del antiguo decumano máximo. Se desciende a unos diez metros bajo la iglesia y se camina entre calles, tiendas y estancias de época imperial. Bajo la iglesia han aparecido también los restos de una basílica cristiana del siglo VI.\n\nEl Museo dell'Opera, en las dependencias del convento y en la torre cívica, cuenta la historia de Nápoles desde la época clásica hasta el siglo XIX.","con":"Baja a las excavaciones: es la parte que no te esperas. Calcula unos tres cuartos de hora y consulta los horarios en la web oficial antes de venir.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"La fachada de San Lorenzo Maggiore en la plaza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, frente a la plaza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Horario indicado por la ficha del Ministerio de Cultura y por fuentes turísticas; el sitio oficial no se pudo leer: comprobar antes de darlo por seguro."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"El mercado bajo la iglesia","x":"Las excavaciones muestran el macellum de la Neapolis greco-romana, el mercado que se alzaba a lo largo del antiguo decumano máximo. Se encuentran a unos diez metros bajo la iglesia. Caminando entre las estructuras se reconocen la calle y los espacios donde se vendía y se comerciaba: es un trozo de ciudad antigua todavía en su sitio, sobre el que Nápoles ha seguido construyendo.","d":"Bajo la nave, en las excavaciones","foto":{"u":"../img/ab890c42a731.jpg","alt":"Una calle romana en las excavaciones bajo San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Las excavaciones bajo San Lorenzo Maggiore: la calle y las tiendas de la ciudad antigua."}},{"t":"El altar mayor de Giovanni da Nola","x":"El altar mayor es una obra renacentista del escultor napolitano Giovanni da Nola, entre las más bellas de Nápoles. El ábside que lo alberga es la parte más antigua de la iglesia.","d":"Al fondo de la iglesia, en el ábside","foto":null},{"t":"El Museo dell'Opera","x":"El museo ocupa las salas del convento y la torre cívica junto a la basílica. Expone mobiliario, trajes y colecciones, y presenta la historia de Nápoles desde la época clásica hasta el siglo XIX.","d":"En el convento, junto a la basílica","foto":{"u":"../img/591ff764e679.jpg
