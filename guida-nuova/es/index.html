<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía de Nápoles · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="../caratteri/caratteri.css">
<link rel="stylesheet" href="../mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:var(--superficie);border-radius:14px;padding:14px}
.guarda .mini{width:32px;height:32px;position:relative}
.guarda.con-foto{grid-template-columns:minmax(0,1fr);padding:0 0 14px;overflow:hidden}
.guarda.con-foto .mini{width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.guarda.con-foto>div:last-child{padding:0 14px}
.guarda .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.02rem}
.guarda .dove{font-size:.82rem;color:var(--accento);font-weight:500}
.guarda p{font-size:.95rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;position:relative}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<main class="pagina" id="app" aria-live="polite"></main>
<script>
var D = {"lingua":"es","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità y Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"El punto de partida: Piazza Carità, en Via Toledo. Desde aquí, el centro histórico comienza a tan solo unos minutos a pie. Y aquí está Ceraldi.","rac":"","con":"Antes de partir, un café: la excursión es larga y Nápoles se disfruta mejor con la taza adecuada.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, el decumano inferior","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La calle recta que divide el centro histórico en dos: el decumano inferior de la ciudad griega, unos dos kilómetros de iglesias, tiendas y vida.","rac":"Spaccanapoli es la más baja de las tres decumanas, las calles paralelas que cruzaban Neapolis griega de oeste a este. Comienza en la Piazza del Gesù Nuovo como Via Benedetto Croce, luego se convierte en Via San Biagio dei Librai, cruza Via Duomo y continúa más allá del casco antiguo: unos dos kilómetros en total. Su nombre lo dice todo: es tan larga y recta que, vista desde arriba, parece dividir la ciudad en dos.","con":"Recorre esta avenida desde la Piazza del Gesù hacia la Via Duomo: es un ligero descenso lleno de historia, no de esfuerzo.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Plaza e Iglesia del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fachada de piedras en forma de pirámide que parece una fortaleza y esconde un misterio: inscripciones grabadas que nadie ha descifrado aún con certeza.","rac":"Antes de ser iglesia, fue un palacio: el de los príncipes Sanseverino, construido en 1470; una placa en la fachada conmemora al arquitecto, Novello da San Lucano. Los jesuitas conservaron la estructura y la sillería oscura de piperno, con las piedras talladas en forma piramidal, añadiendo elementos de mármol blanco.\n\nAlgunas piedras tienen marcas grabadas. Según la leyenda, son un mensaje secreto; algunos estudiosos creen que son las marcas dejadas por diferentes canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales de una partitura llamada \"Enigma\". Obsérvalas con atención y decide por ti mismo.\n\nLa fachada fue restaurada e inaugurada el 12 de marzo de 2023, después de que algunos fragmentos cayeran en diciembre de 2017; la plaza ha permanecido cerrada al tráfico desde entonces.","con":"Busca las marcas en las piedras a la altura de los ojos, a la derecha y a la izquierda del portal: la búsqueda es gratuita.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La fachada en punta de diamante","x":"Antes de ser iglesia, era la fachada del palacio de los príncipes Sanseverino, que data de 1470. Los jesuitas la conservaron tal cual, con sus oscuras piedras piperno talladas en forma piramidal, y añadieron el gran portal barroco. Acérquense: muchas de las piedras tienen inscripciones grabadas, y aún hoy no hay consenso sobre su significado.","d":"Afuera, en la plaza","foto":null},{"t":"La expulsión de Heliodoro","x":"El gran fresco de la contrafachada es obra de Francesco Solimena, de 1725. Representa a Heliodoro intentando saquear el Templo de Jerusalén y siendo repelido por un caballero celestial: una escena llena de movimiento, caballos y figuras que huyen. Muchos visitantes no lo aprecian porque entran de cara al altar.","d":"En cuanto entres, dirígete hacia la puerta: está encima de la entrada.","foto":null},{"t":"La cúpula y los cuatro evangelistas","x":"Los cuatro triángulos en la base de la cúpula representan a los evangelistas, pintados por Giovanni Lanfranco. Sin embargo, la cúpula que se ve no es la original: se derrumbó en el terremoto de 1688 y fue reemplazada en 1786 por una estructura más baja en forma de cuenco.","d":"En el centro de la iglesia, mira hacia arriba.","foto":null},{"t":"La capilla de Sant'Ignazio","x":"Dedicado al fundador de los jesuitas, este museo reúne a dos grandes figuras del arte napolitano del siglo XVII: Cosimo Fanzago, autor de la arquitectura y las estatuas de los profetas David y Jeremías, y Jusepe de Ribera, quien pintó los lienzos que representan la vida del santo. Mármol policromado, estatuas y pinturas se dan cita: el barroco napolitano en su máxima expresión.","d":"En una de las dos grandes capillas de la iglesia.","foto":null},{"t":"San José Moscati","x":"Aquí reposan los restos del «santo doctor» de Nápoles: Giuseppe Moscati, investigador y profesor universitario que atendió a los pobres de forma gratuita. Falleció en 1927 y fue canonizado en 1987. Sus cenizas se encuentran en una urna de bronce, obra del escultor Amedeo Garufi, bajo el altar de la Capilla de la Visitación.","d":"En la capilla de la Visitación, bajo el altar","foto":null}],"gal":[],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monasterio y complejo de Santa Chiara (claustro de mayólica)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"El claustro revestido de mayólica es uno de los lugares más tranquilos del centro: a un paso del caos de Spaccanapoli, un remanso de paz.","rac":"Santa Chiara fue construida en 1310 por orden del rey Roberto de Anjou y la reina Sancha de Mallorca. La construcción fue dirigida primero por Gagliardo Primario y luego por Lionardo di Vito, y en 1340 la iglesia se inauguró para el culto. El complejo constaba de dos partes: un convento para las clarisas y otro para los frailes menores, contiguos pero separados.\n\nCuatro siglos después, a sugerencia de la reina María Amalia de Sajonia, esposa de Carlos de Borbón, se renovó el claustro de las Clarisas. El arquitecto Domenico Antonio Vaccaro conservó los arcos góticos del siglo XIV y transformó el centro en un jardín barroco, revestido con azulejos de mayólica del taller de Donato y Giuseppe Massa. El resultado es uno de los lugares más sorprendentes de Nápoles: un jardín de cerámica a pocos pasos de Spaccanapoli.","con":"Los domingos, el claustro cierra a las 2 de la tarde: si es domingo por la tarde, cambien de orden y vengan aquí primero.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Claustro y museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Claustro y museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"}],"ant":true,"dett":[{"t":"Los pilares de mayólica","x":"Sesenta y cuatro pilares revestidos de azulejos de mayólica con guirnaldas de hojas, flores y frutas, bajo una pérgola. Los colores amarillo, naranja y azul evocan los cítricos y las vides que crecen a su alrededor. Los azulejos de mayólica proceden del taller de Donato y Giuseppe Massa, en el jardín barroco diseñado por Domenico Antonio Vaccaro.","d":"En el jardín del claustro","foto":null},{"t":"Las escenas en los asientos","x":"Los asientos que conectan las columnas son todos de mayólica, y los respaldos están pintados con pequeñas escenas: la vida rural, la vida en la costa, fiestas populares, mitos. Representan la vida napolitana del siglo XVIII contada a través de imágenes. Siéntese y observe con atención el que está detrás de usted.","d":"En los respaldos de los asientos entre los pilares","foto":null},{"t":"Clarissa con los gatos","x":"Entre las escenas se encuentra una monja clarisa alimentando a los gatos del claustro: un pequeño atisbo de la vida cotidiana en el monasterio, pintado en mayólica. Encontrarlo es una búsqueda del tesoro perfecta, incluso para los niños.","d":"En uno de los respaldos de los asientos: búscalo","foto":null},{"t":"Los arcos del siglo XIV","x":"El jardín es barroco, pero el entorno es medieval: Vaccaro conservó el perímetro del siglo XIV con los arcos apuntados del monasterio angevino. Observe el contraste entre la austera piedra de los arcos y los colores vivos de los azulejos de mayólica: cuatro siglos en una sola mirada.","d":"A lo largo de los cuatro lados del claustro","foto":null}],"gal":[],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Capilla Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"El Cristo Velado, una de las esculturas más famosas del mundo, y las máquinas anatómicas del príncipe alquimista Raimondo di Sangro.","rac":"La capilla de la familia di Sangro es el reino de Raimondo, príncipe de Sansevero: un hombre de ciencia y secretos, Gran Maestro de la Francmasonería, en torno al cual nació el mito cuando aún vivía, y fue él mismo quien lo alimentó.\n\nEn el centro se encuentra el Cristo Velado de Giuseppe Sanmartino, encargado por el príncipe: un cuerpo reclinado cubierto por un sudario tan fino que parece tela mojada, pero tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea se hallan dos «máquinas anatómicas», esqueletos de un hombre y una mujer con vasos sanguíneos reconstruidos, obra del médico palermitano Giuseppe Salerno entre 1756 y 1764. La leyenda negra habla de sirvientes sacrificados e inyecciones misteriosas; el museo, por su parte, distingue cuidadosamente el mito de la historia documentada.","con":"Está cerrado los martes: si hoy es martes, la estatua del Nilo está a dos minutos y siempre se puede ver.","acc":"La nave y la sacristía son accesibles para personas en silla de ruedas. Al auditorio subterráneo, con sus máquinas anatómicas, solo se puede acceder por una estrecha escalera de caracol del siglo XIX.","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"El Cristo velado","x":"Un cuerpo tendido sobre un colchón, cubierto por una mortaja tan fina que se pueden ver el rostro, las heridas y las venas. El velo no es añadido: Giuseppe Sanmartino lo esculpió del mismo bloque de mármol que la estatua, por encargo del príncipe Raimondo di Sangro. Rodéalo lentamente: el velo parece cambiar a cada lado.","d":"En el centro de la nave","foto":null},{"t":"Modestia","x":"Una mujer envuelta en un velo que se adhiere a su piel como si estuviera mojado, con una guirnalda de rosas. Fue esculpida por Antonio Corradini en 1752, año de su muerte, y el príncipe la dedicó a su madre, Cecilia Gaetani, quien falleció cuando él aún no había cumplido un año. Fíjense en la lápida rota a sus pies: es el símbolo de una vida truncada prematuramente.","d":"Cerca del altar mayor","foto":null},{"t":"La desilusión","x":"Un hombre se libera de una gran red con la ayuda de un pequeño genio alado con una llama en la frente, símbolo de la inteligencia. Francesco Queirolo la esculpió entre 1753 y 1754 para conmemorar al padre del príncipe. La red está hecha completamente de mármol perforado: según la tradición, los ayudantes se negaron a pulirla por temor a romperla, por lo que el escultor la alisó personalmente.","d":"Cerca del altar mayor","foto":null},{"t":"El suelo laberíntico","x":"El suelo original era un laberinto de mármoles de colores atravesado por una línea blanca continua, concebido por el príncipe como símbolo del arduo camino hacia el conocimiento. Francesco Celebrano lo construyó hasta alrededor de 1771. Un derrumbe en 1889 destruyó casi por completo: quedan algunas losas en el pasaje frente a la tumba de Raimondo, en la cávea y en la sacristía.","d":"En el pasaje frente a la tumba del príncipe","foto":null},{"t":"Las máquinas anatómicas","x":"Dos esqueletos, uno de hombre y otro de mujer, con sus vasos sanguíneos reconstruidos con una precisión que aún asombra. Fueron creados por el médico palermitano Giuseppe Salerno entre 1756 y 1764. La oscura leyenda del príncipe nació en torno a ellos: el museo explica con detalle dónde termina la historia y dónde comienza el mito.","d":"En la cávea subterránea, bajando por una estrecha escalera de caracol","foto":null}],"gal":[],"leg":"Mucho se habló de Raimondo di Sangro durante su vida: experimentos misteriosos, secretos alquímicos e incluso sirvientes transformados en máquinas anatómicas. El museo distingue cuidadosamente la leyenda negra de los hechos documentados: vale la pena escuchar ambas versiones y tomar partido.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli y estatua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai y sus tiendas","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La zona de libreros y artesanos de Spaccanapoli: tiendas, iglesias y el Hospital de Muñecas.","rac":"Este es el tramo de Spaccanapoli que va desde la Piazzetta Nilo hasta la Via Duomo, en el decumano inferior. Su nombre proviene de las librerías que siempre se han ubicado allí: una inscripción en el cercano Palazzo Marigliano conmemora el arte de los maestros libreros. La devoción a San Blas se remonta al siglo VIII, cuando unas monjas de Armenia trajeron una reliquia del santo a Nápoles. También en esta calle se encuentra el Ospedale delle Bambole, un taller artesanal que se ha transmitido de generación en generación.","con":"Diciembre es el mes de las tiendas de belenes: prepárense para las multitudes los fines de semana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella en la librería y la calavera con orejas","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una pequeña iglesia de cantero dedicada al santo de los ojos, y un cráneo singular: el que tiene orejas.","rac":"Fundada poco antes de 1327 por Bartolomeo di Capua, jurista de los reyes angevinos, la iglesia fue entonces confiada a los pipernieri, los canteros: eligieron a Santa Lucía, protectora de la vista, porque las astillas de su oficio ponían en riesgo sus ojos.\n\nAbandonada durante más de treinta años, fue reabierta el 5 de abril de 2019 gracias a la asociación Respiriamo Arte. En su bóveda subterránea, el culto de las \"anime pezzentelle\" (almas enfermas) dejó un cráneo único: tiene orejas.","con":"Es pequeño y se puede visitar en tan solo unos minutos: perfecto como descanso entre Sansevero y Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"}],"ant":true,"dett":[{"t":"El escudo de armas de los Pipernieri","x":"Antes de entrar, mire hacia arriba: sobre el portal de piedra piperno, aún se conserva un fresco con el escudo de armas del gremio de canteros piperno, a quienes pertenecía la iglesia. Trabajaban entre las piedras, y por ello eligieron a Santa Lucía, protectora de la vista.","d":"Sobre el portal de entrada","foto":null},{"t":"El cráneo con orejas","x":"Debajo de la iglesia, en el hipogeo, se encuentra un cráneo con cartílago de oreja conservado: esto lo hace único. La tradición popular sostiene que, precisamente por tener orejas, escucha mejor las oraciones de quienes le piden un favor.","d":"En el hipogeo, con visita guiada.","foto":null},{"t":"Las pobres almas","x":"En el siglo XVII, tras la peste, los napolitanos \"adoptaron\" los cráneos de los difuntos anónimos: los limpiaban, rezaban por ellos y pedían ayuda a cambio. Era el culto a las almas del desdichado. Aquí se conserva uno de los testimonios más famosos de la ciudad.","d":"En el hipogeo","foto":null}],"gal":[],"leg":"Se dice que el cráneo con orejas, precisamente por tenerlas, escucha mejor las oraciones: por esta razón, durante generaciones se le han confiado las peticiones más difíciles.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Hospital de muñecas","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una tienda que lleva generaciones seleccionando muñecas y juguetes: un escaparate que niños y adultos siempre recordarán.","rac":"A finales del siglo XIX, Luigi Grassi trabajaba como escenógrafo para teatros y belenes. Los vecinos comenzaron a traerle muñecas y juguetes rotos, y su taller se convirtió, casi por casualidad, en el primer \"hospital\" de juguetes de Nápoles.\n\nHoy en día, Tiziana, bisnieta del fundador, lo dirige en el patio del Palazzo Marigliano, en Via San Biagio dei Librai. En su interior, funciona como un hospital de verdad: batas blancas, salas y un historial clínico para cada paciente. Para muchos napolitanos, es el lugar donde llevaban su juguete favorito de niños.","con":"El escaparate por sí solo ya justifica la parada: está de camino de vuelta.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"}],"ant":true,"dett":[{"t":"Un hospital de verdad, para juguetes.","x":"No es una tienda, sino un laboratorio organizado como un hospital: los \"médicos\" con batas blancas, los departamentos de ortopedia, oftalmología y sastrería, y los pacientes, muñecos, ositos de peluche y juguetes de tela, cada uno con su propio historial médico y diagnóstico.","d":"En la tienda","foto":null},{"t":"El diseñador de escenografía fundador","x":"Todo comenzó a finales del siglo XIX con Luigi Grassi, escenógrafo de teatros y belenes. Los vecinos empezaron a llevarle juguetes rotos, y él transformó el taller en el primer \"hospital\". Hoy, su bisnieta, Tiziana, atiende a los pacientes.","d":"En la historia de la tienda","foto":null},{"t":"El patio del Palacio Marigliano","x":"El hospital está ubicado en el patio del Palazzo Marigliano, en la calle Spaccanapoli. Al entrar por la puerta principal, el ruido de la calle se desvanece: es uno de los muchos patios escondidos del centro histórico que merece la pena descubrir.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la iglesia de los capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La Iglesia de los capuzzelle: bajo el suelo, el hipogeo donde Nápoles rezaba por las almas sin nombre. Y el cráneo de Lucía.","rac":"Los napolitanos la llaman \"'e cape 'e morte\", la iglesia de las cabezas de los muertos. Es una pequeña iglesia del siglo XVII situada en el decumano principal, vinculada a la devoción a las almas del Purgatorio difundida por la Contrarreforma. Una empinada escalera conduce al hipogeo, la iglesia subterránea, ampliada y decorada con mayólica en el siglo XVIII: allí, los devotos cuidaban restos anónimos y buscaban su intercesión. Al final de un pequeño pasillo, se conserva el cráneo de Lucía, una joven particularmente querida.","con":"Detrás del altar, busquen la calavera alada de mármol de Dionisio Lazzari: es el símbolo de la iglesia.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":18,"s":"duomo-san-gennaro","n":"Catedral y Tesoro de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La Catedral de Nápoles y la Capilla del Tesoro, donde se guarda el frasco con la sangre de San Genaro.","rac":"En la Catedral, en un nicho de la Capilla del Tesoro, se conserva la ampolla que contiene la sangre tradicionalmente atribuida a San Gennaro. Tres veces al año (el sábado anterior al primer domingo de mayo, el 19 de septiembre y el 16 de diciembre) se espera su licuefacción. Desde 1601, las reliquias están bajo la custodia de una institución secular: la Delegación de la Capilla del Tesoro de San Gennaro.","con":"Los días de licuefacción, el Duomo está abarrotado desde la mañana: si quieres estar allí, llega temprano.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"La Virgen con una pistola de Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Virgen María de Banksy con una pistola en lugar de aureola, protegida por cristal, en el corazón del decumano principal.","rac":"En la Piazzetta dei Girolamini, en una fachada del decumano principal, Banksy dejó una Virgen con una pistola en lugar de su aureola. Hoy, está protegida por un cristal. La página web oficial de turismo de la ciudad la incluye en su itinerario dedicado al arte callejero del centro histórico.","con":"Mira hacia arriba: la obra está por encima del nivel de la calle, detrás de un cristal.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"El primer paseo","sub":"Spaccanapoli en medio día, partiendo desde Ceraldi","desc":"El corazón del centro histórico en un recorrido circular: el Gesù Nuovo y su misterio, el claustro de Santa Chiara, el Cristo Velado, la Iglesia de la Calavera y las Orejas, las tiendas de Via San Biagio dei Librai. Y luego volvemos a nosotros.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café en Ceraldi y nos vamos.","alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25008,40.84665],[14.25047,40.84678],[14.25086,40.84691],[14.25124,40.84703],[14.25122,40.84707],[14.25144,40.84714],[14.2517,40.84724],[14.252,40.84733]],"sv":[{"k":"parti","n":"Piazza Carità","d":242,"a":0},{"k":"gira","m":"right","n":"Via Maddaloni","d":176,"a":242},{"k":"gira","m":"slight left","n":"Piazza del Gesù Nuovo","d":76,"a":418},{"k":"arrivo","a":494}]},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38,"geo":[[14.252,40.84733],[14.25202,40.84734],[14.25211,40.84737],[14.25214,40.84734],[14.25215,40.84731],[14.25217,40.84729],[14.25221,40.84723],[14.25224,40.84718],[14.25228,40.84 Primero Partenope, luego Neapolis: porque el centro histórico todavía está diseñado como una ciudad griega.","txt":"Nápoles fue fundada dos veces. La primera vez se llamó Partenope, como la mítica sirena: fue fundada en el siglo VII a. C. por colonos de origen griego procedentes de Cumas, que desembarcaron en el islote de Megaride, donde hoy se encuentra el Castel dell'Ovo, y se establecieron en el cercano monte Echia.\n\nLa segunda vez, alrededor del año 470 a. C., surgió una nueva ciudad junto a la antigua: Neapolis, que significa \"ciudad nueva\" en griego. Es la que usted está atravesando ahora. Sus calles forman una cuadrícula regular que, después de veinticinco siglos, aún se conserva: el centro histórico de Nápoles es Patrimonio de la Humanidad de la UNESCO precisamente porque el diseño de la ciudad griega se ha mantenido como su eje central.\n\nTres calles paralelas, los decumanos, atraviesan la ciudad de oeste a este. La más baja es Spaccanapoli: de unos dos kilómetros de longitud, tan recta que, vista desde arriba, parece dividir la ciudad en dos, de ahí su nombre. En el centro discurre Via dei Tribunali, el decumano principal; más arriba se encuentran Via dell'Anticaglia y Via della Sapienza, el decumano superior.\n\nDesde Piazza Carità, donde estamos desde 2002, comienza a pocos minutos a pie Spaccanapoli, en Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro y la sangre derretida","som":"Tres veces al año, Nápoles contiene la respiración ante un frasco. ¿Qué sucede, dónde y qué dicen la Iglesia y la ciencia al respecto?","txt":"En la Catedral de Nápoles, en un nicho de la Capilla del Tesoro, se guarda un frasco con una sustancia oscura que, según la tradición, es la sangre de San Genaro, el santo patrón de la ciudad. Tres veces al año —el sábado anterior al primer domingo de mayo, el 19 de septiembre (día de su festividad) y el 16 de diciembre— se muestra el frasco a los fieles: si su contenido, generalmente sólido, se disuelve, es motivo de celebración; si permanece sólido, para muchos napolitanos, es un mal presagio.\n\nEl primer registro conocido de la licuefacción data de 1389. Las reliquias no están custodiadas por el clero, sino por la Diputación de la Capilla del Tesoro de San Gennaro, una institución secular fundada en 1601, de la que también forma parte el alcalde de Nápoles.\n\nLa Iglesia mantiene una postura cautelosa: habla de un «acontecimiento milagroso», permite la devoción popular, pero no la impone como verdad de fe. Entre las explicaciones propuestas por los escépticos se encuentra la tixotropía, la propiedad de ciertas sustancias que son sólidas en reposo y se vuelven líquidas al moverse o agitarse.\n\nLo sagrado y lo profano siempre han coexistido aquí: en Via Duomo, a pocos pasos de la catedral, el artista callejero Jorit pintó un San Gennaro con el rostro de un trabajador.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Las pobres almas: Cuando Nápoles adoptó una calavera","som":"Osarios, capuzzelle y oraciones intercambiadas por números de lotería: el culto a los muertos sin nombre.","txt":"Durante siglos, en Nápoles, los muertos sin nombre no eran abandonados a su suerte. Se les llamaba anime pezzentelle: las pobres almas que morían sin funeral y sin que nadie rezara por ellas. El nombre está relacionado con «pezzente», el pobre, pero también con el latín «petere», pedir para recibir: quienes rezaban por ellas esperaban recibir protección y gracia a cambio.\n\nEl lugar simbólico es el cementerio Fontanelle, en el barrio de Sanità: una cantera de toba del siglo XVI que abarca aproximadamente cuatro mil metros cuadrados, que acogió a las víctimas de la peste de 1656 y luego a las del cólera en 1836-1837. En 1872, el canónigo Gaetano Barbati dispuso los huesos en tres naves. Los devotos \"adoptaban\" un cráneo, una capuzzella: lo limpiaban, lo colocaban en un pequeño santuario, lo adornaban con rosarios y monedas, y le rezaban, esperando una señal en un sueño, a veces un número de lotería. Algunos cráneos se hicieron famosos: el Capitán, con la cuenca del ojo ennegrecida, sujeto de una leyenda de matrimonio y celos; Donna Concetta, de quien se dice que \"suda\" cuando se le concede una gracia.\n\nEn 1969, un decreto del tribunal eclesiástico clausuró el osario y prohibió el culto. Cerrado por reformas desde 2020, el cementerio reabrió al público en 2026, gestionado por la cooperativa La Paranza.\n\nEl culto también pervive bajo Via dei Tribunali, en el hipogeo de Santa Maria delle Anime del Purgatorio ad Arco, la iglesia que los napolitanos llaman \"'e cape 'e morte\": allí se conserva el cráneo de Lucía, una joven muy querida. Y en Via San Biagio dei Librai, en la pequeña iglesia de Santa Luciella, hay un cráneo singular: el que tiene orejas.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Nápoles Esotérica: Un príncipe alquimista, una fachada codificada y un huevo mágico.","som":"Raimondo di Sangro, el rusticado del Gesù Nuovo, el huevo de Virgilio, el munaciello: donde termina la historia y comienza la leyenda.","txt":"Nápoles adora los misterios, y algunos son realmente fascinantes. El más famoso tiene nombre: Raimondo di Sangro, príncipe de Sansevero, un hombre del siglo XVIII, Gran Maestre de la masonería napolitana, un celoso guardián de sus propios secretos. El mito lo rodeó incluso en vida, y él mismo lo alimentó. Benedetto Croce lo llamó la encarnación napolitana del Doctor Fausto. La leyenda negra le atribuye todo: sirvientes asesinados para estudiar sus cuerpos, incluso la ceguera del escultor del Cristo Velado para que no esculpiera otro. Son leyendas, y el propio museo las distingue de la historia documentada.\n\nEl Cristo Velado es obra de Giuseppe Sanmartino, por encargo del príncipe: el velo transparente que cubre el cuerpo está tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea de la capilla se encuentran las \"máquinas anatómicas\", dos esqueletos con sistemas circulatorios reconstruidos, creados por el médico palermitano Giuseppe Salerno entre 1756 y 1764. Según la leyenda, su creación implicó misteriosas inyecciones y estudios con cera de abejas y tintes.\n\nNo muy lejos, la fachada del Gesù Nuovo, originalmente el palacio Sanseverino en 1470, está revestida con sillares piramidales de piedra piperno oscura. Algunas piedras presentan inscripciones: según la leyenda, un mensaje secreto; algunos estudiosos afirman que son las marcas de los canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales, una partitura de aproximadamente tres cuartos de hora titulada \"Enigma\". Una hipótesis tentadora, pero no una certeza.\n\nY luego está el mar: según la leyenda, el poeta Virgilio escondió el huevo de la sirena Partenope en las bodegas del Castel dell'Ovo. Mientras el huevo permanezca intacto, el castillo seguirá en pie.\n\nEn las casas, sin embargo, viven los espíritus de la tradición popular: el munaciello, un duende encapuchado que trae buena suerte o travesuras según cómo se le trate, y la bella 'mbriana, un espíritu bueno de la casa, que puede aparecer como una mariposa o un gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Nápoles hoy: ¿qué hay de nuevo?","som":"La plaza dedicada a Maradona, el arte callejero, el último Caravaggio en Via Toledo, las iglesias y osarios reabiertos: la ciudad está cambiando.","txt":"Quienes regresan a Nápoles después de algunos años encuentran una ciudad que ha aprendido a contar su historia.\n\nEn el Barrio Español, a nueve minutos de aquí, se encuentra Largo Maradona. El mural de Diego fue pintado en 1990 por Mario Filardi; con el paso de los años, se fue deteriorando hasta casi desaparecer, luego fue restaurado gracias a Salvatore Iodice, y en otoño de 2017, el argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona el 25 de noviembre de 2020, la plaza, antes conocida como la plaza de los artistas, se convirtió en un santuario laico de pequeños altares, banderas argentinas y fotografías, tan popular que la municipalidad tuvo que regular el tráfico peatonal.\n\nEl arte callejero ha llegado al centro histórico: en la Piazzetta dei Girolamini, protegida por un cristal, se alza la Virgen con una pistola de Banksy; en la Via Duomo, San Gennaro el Obrero de Jorit. La página web oficial de turismo de la ciudad les ha dedicado un itinerario específico.\n\nEn Via Toledo, a seis minutos de nosotros, la Galería de Italia alberga el Martirio de Santa Úrsula, el último lienzo de Caravaggio, junto con más de quinientos jarrones áticos y de la Magna Grecia.\n\nY lugares que habían permanecido cerrados durante mucho tiempo están reabriendo: la iglesia de Santa Luciella ai Librai, abandonada durante más de treinta años, reabrió sus puertas al público el 5 de abril de 2019; el cementerio Fontanelle reabrió en 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T16:42Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":""}],"pre":"../","menu":"../../menu-nuovo/"}, T = {"titolo":"Guía de Nápoles","sottotitolo":"El centro histórico a pie desde Piazza Carità","anteprima":"Versión de prueba: textos y horarios en revisión.","oggi":"Hoy en Nápoles","sciopero":"Huelga de transporte hoy","chiusi_oggi":"Cerrados hoy","tutti_aperti":"Ningún cierre conocido hoy entre los lugares con horarios verificados.","itinerari":"Itinerarios","luoghi":"Lugares","racconti":"Nápoles contada","mappa":"Mapa","piove":"¿Llueve?","piove_testo":"Lugares a cubierto, con los horarios de hoy.","piove_vuoto":"No hay lugares a cubierto disponibles en esta versión.","min":"min","km":"km","a_piedi":"a pie","da_ceraldi":"desde Ceraldi","tappe":"paradas","durata":"Duración","aperto":"Abierto ahora","chiude_alle":"cierra a las","ultimo_ingresso":"última entrada","apre_alle":"Abre a las","chiuso_ora":"Cerrado ahora","chiuso_oggi":"Cerrado hoy","sempre":"Siempre accesible","in_verifica":"Horarios en verificación: consulta la web oficial","verificato_il":"Horarios verificados el","orari":"Horarios","sito":"Web oficial","pagina_orari":"Horarios en la web oficial","consiglio":"El consejo de Ceraldi","accessibilita":"Accesibilidad","visita":"Tiempo de visita","gratuito":"Entrada libre","pagamento":"Entrada de pago","fonti":"Fuentes","arrivo":"Llegada","chiuso_arrivo":"Estará cerrado cuando llegues", /* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;

  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;
}
function salvaGiro(){ try{ localStorage.setItem('guida_giro', JSON.stringify({s: G.s, k: G.k, t: Date.now()})); }catch(x){} }
function giroSalvato(){ try{ var g = JSON.parse(localStorage.getItem('guida_giro') || 'null'); return g && Date.now() - g.t < 12 * 3600e3 ? g : null; }catch(x){ return null; } }
var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!G) return;
    G.pos = [p.coords.longitude, p.coords.latitude]; G.acc = p.coords.accuracy; G.negata = false;
    var i = IT[G.s], tp = i.tappe[G.k], l = LU[tp.l];
    if(tp.geo){ var r = suLinea(G.pos, tp.geo); G.lungo = r.lungo; G.fuori = G.acc < 40 && r.off > 60; }
    var dest = xy([l.lon, l.lat]), io = xy(G.pos), dist = Math.hypot(dest[0] - io[0], dest[1] - io[1]);
    G.vicino = (G.acc <= 40 && dist < 35) ? (G.vicino || 0) + 1 : 0;
    if(G.vicino >= 2 && !G.arrivato) G.arrivato = true;   /* due posizioni precise di seguito entro 35 m dalla tappa */
    aggiornaCammino();
  }, function(){ if(G){ G.negata = true; aggiornaCammino(); } }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});

V.cammino = function(s){

function lineeCammino(i){ return i.tappe.map(function(tp, n){ return tp.geo ? {c: tp.geo, s: n < G.k ? 'fatto' : n === G.k ? 'ora' : 'poi'} : null; }).filter(Boolean); }

function aggiornaCammino(){
  if(!G || location.hash.indexOf('#/c/') !== 0) return;

    h += '<section class="foglio"><div class="manovra"><div class="freccia">' + freccia(mv) + '</div><div style="min-width:0"><p class="piccolo">' + e(f(T.tra, {d: aMv})) + '</p><p style="font-size:1.15rem;font-weight:500;line-height:1.3" id="c-frase">' + frase(mv, l.n) + '</p></div></div>' +

      '<div class="due"><a class="btn sec" href="#/l/' + e(l.s) + '">' + e(T.apri_scheda) + '</a><button class="btn sec" id="c-qui" onclick="G.arrivato=true;aggiornaCammino()">' + e(T.sono_qui) + '</button></div></section>';

function prosegui(){ var i = IT[G.s]; if(G.k < i.tappe.length - 1){ G.k++; G.arrivato = false; G.vicino = 0; G.lungo = 0; salvaGiro(); marcaIo = null; disegnaCammino(); aggiornaCammino(); window.scrollTo(0, 0); } }
function esciGiro(){ try{ localStorage.removeItem('guida_giro'); }catch(x){} fermaPosizione(); var s = G && G.s; G = null; vai(s ? '#/i/' + s : '#/'); }
V.luogo = function(s){

        '<div style="min-width:0;display:grid;gap:4px"><b>' + e(x.t) + '</b>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<p>' + e(x.x) + '</p>' +

function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
