","alt":"Una sala del museo en el complejo de San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Las salas del convento de San Lorenzo Maggiore que albergan el Museo dell'Opera."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la iglesia de las capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La iglesia de las capuzzelle: bajo el suelo, el hipogeo donde Nápoles rezaba por las almas sin nombre. Y el cráneo de Lucia.","rac":"Los napolitanos la llaman «'e cape 'e morte», la iglesia de las cabezas de muerto. Es una pequeña iglesia del siglo XVII en el Decumano Maggiore, vinculada a la devoción por las almas del Purgatorio difundida por la Contrarreforma. Una escalera empinada conduce al hipogeo, la iglesia subterránea, ampliada y decorada con mayólicas en el siglo XVIII: aquí los devotos cuidaban restos anónimos y les pedían su intercesión. Al fondo de un pequeño pasillo se conserva el cráneo de Lucia, un alma joven especialmente querida.","con":"Detrás del altar, busque la calavera alada de mármol de Dionisio Lazzari: es el símbolo de la iglesia.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La fachada de Purgatorio ad Arco en la Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La fachada de Purgatorio ad Arco, en el Decumano Maggiore."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Iglesia alta, hipogeo y museo. Visitas guiadas incluidas en la entrada, con reserva."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Iglesia alta, hipogeo y museo."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Las pinturas del siglo XVII","x":"Antes de bajar, mira bien la iglesia de arriba. Fue encargada en 1616 por la cofradía laica «Opera Pia Purgatorio ad Arco» al arquitecto Giovan Cola di Franco y consagrada en 1638.\n\nSe concibió en dos niveles: la iglesia superior, que representa la dimensión terrenal, y debajo el hipogeo, el cementerio, que representa de forma concreta el Purgatorio. Toda la decoración recuerda a quien entra que las almas esperan una oración para subir al Paraíso.\n\nAquí hay mármoles preciosos y pinturas de tres grandes maestros del siglo XVII napolitano: Massimo Stanzione, Luca Giordano y Andrea Vaccaro. En la sacristía y en el oratorio hay también un pequeño museo con platería, ornamentos litúrgicos, manuscritos y cuadros realizados para la cofradía entre los siglos XVII y XIX.","d":"En la iglesia superior","foto":{"u":"../img/a8b34654121a.jpg","alt":"Un sepulcro de mármol del siglo XVII en la iglesia superior","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"En la iglesia superior: el sepulcro de Pietro Antonio Mastrilli (1607), entre los mármoles y las pinturas del siglo XVII."}},{"t":"La calavera alada","x":"Entre los mármoles de la iglesia superior está la célebre calavera alada de Dionisio Lazzari: una calavera con alas, que resume el espíritu del lugar. Aquí la muerte no da miedo: se convierte en ocasión de oración y de vínculo con quienes ya no están.\n\nNo es casualidad que los napolitanos llamen a esta iglesia «'e cape 'e morte», la de las calaveras.\n\nEl mensaje era deliberado: en la iglesia nacida con la Contrarreforma, todo debía recordar a los transeúntes y a los fieles que las almas del Purgatorio esperaban una oración para subir al Paraíso.","d":"En la iglesia superior","foto":{"u":"../img/63d1e885c193.jpg","alt":"Un bajorrelieve de mármol con una calavera alada y coronada","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"La calavera alada y coronada en bajorrelieve de mármol, primera mitad del siglo XVII: el símbolo de la iglesia."}},{"t":"El hipogeo de las almas","x":"La verdadera iglesia es la de abajo. Por una abertura en el suelo de la iglesia superior se bajan unos escalones altos y se llega a un gran espacio desnudo, una auténtica iglesia inferior.\n\nEn el centro del suelo hay una gran tumba anónima rodeada de cadenas negras e iluminada por unas pocas bombillas. A lo largo de las paredes hay hornacinas, pequeños altares y vitrinas: son las huellas de un culto nacido aquí de forma espontánea desde el siglo XVII, cuando los fieles cuidaban restos humanos sin nombre y les pedían protección. Al fondo está el antiguo altar del siglo XVII con grandes cruces negras.\n\nBaja despacio: es un lugar de devoción todavía viva, no solo de curiosidad. Visita guiada en italiano incluida en la entrada, previa reserva.","d":"Bajo la iglesia, descendiendo por una escalera empinada","foto":{"u":"../img/7fc480d05134.jpg","alt":"El hipogeo de Purgatorio ad Arco con altares y lamparillas","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"El hipogeo, la iglesia de abajo: altares, lamparillas y los testimonios del culto a las almas."}},{"t":"El cráneo de Lucía","x":"Entre todos los cráneos del hipogeo hay uno especialmente querido: el de Lucía, considerado el alma de una joven. Se conserva al fondo de un pequeño pasillo.\n\nEs el testimonio más conmovedor del culto a las almas del Purgatorio, nacido aquí de forma espontánea desde el siglo XVII: los devotos eligen un resto sin nombre, lo cuidan y le piden protección.\n\nMírala con respeto: para muchos napolitanos sigue siendo hoy una presencia a la que acudir.","d":"En el hipogeo, al fondo de un pequeño pasillo","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Una imagen de las almas del Purgatorio entre las llamas dentro de la iglesia","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro de la iglesia: las almas del Purgatorio entre las llamas, el tema de todo el lugar."},{"u":"../img/de63b1b83fa8.jpg","alt":"Un cráneo de bronce sobre una columnita","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un cráneo de bronce: el símbolo de la iglesia de las «capuzzelle»."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Cuarenta metros bajo la Via dei Tribunali: las cisternas que durante siglos dieron agua a Nápoles, los refugios de la guerra y un teatro romano escondido bajo la cama de una casa.","rac":"Bajo el centro histórico hay otra ciudad. Desde la Piazza San Gaetano se bajan más de cien escalones hasta unos 40 metros de profundidad, a lo largo de un recorrido que atraviesa el acueducto grecorromano y galerías de época medieval, borbónica y moderna.\n\nLas cavidades de época griega se usaron como cisternas para el agua de la ciudad durante unos 23 siglos. Durante la Segunda Guerra Mundial, esos mismos espacios se convirtieron en refugios antiaéreos.\n\nLa visita subterránea es guiada y dura aproximadamente una hora. Después se vuelve a la superficie para la última sorpresa: los restos del teatro grecorromano de Neapolis, incorporados desde el siglo XV a las casas del barrio. Se entra en un «basso», una casa en la planta baja, se aparta una cama y por una trampilla se desciende entre los muros del teatro.","con":"Zapatos planos y una sudadera, incluso en verano: bajo tierra hay humedad. El breve paso estrecho con la vela es opcional. Para grupos de 10 personas o más es necesario reservar.","acc":"No apto para sillas de ruedas ni andadores: hay escaleras, con pasamanos, y pasos estrechos.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una gran cisterna subterránea excavada en la toba, con poca iluminación","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una de las grandes cisternas excavadas en la toba, a unos 40 metros bajo la vía dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Visitas guiadas con salida cada hora de 10:00 a 18:00, en italiano y en inglés. Los jueves también a las 21:00, solo con reserva y con al menos 10 personas."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Las cisternas grecorromanas","x":"Se bajan 136 escalones, bajos y cómodos, hasta unos 40 metros bajo las calles. Ya en el siglo III a. C. los griegos abrieron aquí las primeras canteras subterráneas, para extraer los bloques de toba con los que construían las murallas y los templos de Neapolis.\n\nLas grandes salas excavadas en la toba se convirtieron después en las cisternas de agua de la ciudad, conectadas por el acueducto grecorromano, y lo siguieron siendo durante unos 23 siglos. Bajo el centro histórico hay una red todavía no del todo conocida de cisternas, canteras, galerías y pozos, con huellas griegas, españolas y borbónicas.\n\nA lo largo del recorrido verás también cosas sorprendentes: el laboratorio de la estación sísmica «Arianna» y los huertos hipogeos, pequeños cultivos a 35 metros de profundidad, iluminados con lámparas especiales, estudiados también por investigadores.","d":"En la primera parte de la visita, a unos 40 metros de profundidad","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Las paredes de toba de una cisterna subterránea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Las paredes de toba de una cisterna: durante unos 23 siglos aquí se recogió el agua de la ciudad."}},{"t":"El paso con la vela","x":"Las salas del recorrido son todas amplias e iluminadas, salvo un tramo brevísimo y estrecho: se recorre a la luz de las velas, de uno en uno, manteniendo algo de distancia con quien va delante.\n\nAl final de la galería llegas a la cisterna romana todavía llena de agua: es el momento más sugestivo de la visita.\n\nEl paso es opcional: quien sufra en los espacios estrechos puede esperar al grupo fuera, donde hay bancos. La vela no es obligatoria: también sirve la linterna del teléfono.","d":"A lo largo del recorrido subterráneo","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Una galería estrechísima iluminada en la toba","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Una de las galerías estrechísimas excavadas en la toba."}},{"t":"Los refugios de la guerra","x":"Durante la Segunda Guerra Mundial las antiguas cisternas se usaron como refugios antiaéreos: aquí bajaban los napolitanos para protegerse de los bombardeos.\n\nA lo largo del recorrido se encuentra el Museo de la Guerra, con objetos de aquellos años.\n\nNápoles sufrió más de cien bombardeos aéreos, sobre todo por su puerto: pensar en cuántas personas se refugiaron aquí abajo ayuda a entender lo que ha vivido la ciudad.","d":"A lo largo del recorrido subterráneo","foto":{"u":"../img/0f4490838101.jpg","alt":"Objetos de la Segunda Guerra Mundial expuestos bajo tierra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Recuerdos de la guerra: objetos de cuando estas salas eran refugios antiaéreos."}},{"t":"El teatro bajo la cama","x":"La segunda parte de la visita es en superficie, entre via Anticaglia, vico Cinquesanti y via San Paolo. Aquí se levantaba el teatro greco-romano de Neapolis, llamado también teatro de Nerón, porque el emperador actuó en él.\n\nDesde el siglo XV se construyeron casas sobre y dentro de los muros del teatro, que así han llegado hasta nosotros. Se entra en un «basso», una casa típica a pie de calle, se aparta la cama y por una trampilla se baja a las estancias donde, según la tradición, Nerón se preparaba para sus espectáculos.\n\nHace poco ha reaparecido otro trozo del teatro en una antigua carpintería: hoy alberga una exposición de viejas vitrinas de madera oscura para belenes, y bajo el suelo han vuelto a aparecer desagües de época borbónica hechos con azulejos (riggiole) de dibujos azules.","d":"Segunda parte de la visita, en superficie, entre via Anticaglia y vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"Los arcos de ladrillo que cruzan la via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Los arcos de la via Anticaglia: son restos del teatro romano de Neapolis, integrado en las casas."}}],"gal":[],"leg":"Según el relato de la visita, en las estancias ocultas bajo el basso (vivienda en planta baja) Nerón tenía sus camerinos cuando venía a Nápoles a actuar en el teatro.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Dos columnas romanas de once metros de altura sostienen todavía la fachada: son lo que queda del templo de los Dioscuros.","rac":"En la Piazza San Gaetano, en el corazón del centro antiguo, una escalinata conduce a una fachada sostenida por dos columnas corintias de unos once metros de altura. Son lo que queda del templo de los Dioscuros, construido entre los siglos I y II d. C. y considerado el edificio antiguo más importante de Nápoles.\n\nAquí se construyó una primera iglesia de San Paolo entre los siglos VIII y IX; después los Teatinos la reconstruyeron, a partir de la segunda mitad del siglo XVI. El terremoto de 1688 derribó gran parte del templo antiguo; el arquitecto Arcangelo Guglielmelli incorporó las columnas que quedaban en la nueva fachada. Los bombardeos de 1943 dañaron el interior, pero gran parte de las decoraciones se salvó.\n\nAquí está sepultado san Cayetano de Thiene, fundador de los Teatinos.","con":"Mira las columnas de cerca y luego entra: la sacristía decorada con frescos de Solimena es una de las partes más bellas. Los horarios de apertura cambian: consúltalos antes.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Las columnas corintias del templo romano en la fachada de San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Las columnas corintias del templo de los Dioscuros en la fachada de San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Las columnas del templo de los Dioscuros","x":"Las dos columnas corintias de la fachada, de unos once metros de altura, son lo que queda del templo de los Dioscuros. Tras el terremoto de 1688, el arquitecto Arcangelo Guglielmelli las incorporó a la nueva fachada. Sobre la escalinata, las estatuas de san Pedro y san Pablo fueron esculpidas por Andrea Falcone en 1671.","d":"En la fachada, en lo alto de la escalinata","foto":{"u":"../img/951355b4bf10.jpg","alt":"La fachada de San Paolo Maggiore con las columnas antiguas","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"La fachada de San Paolo Maggiore, con las columnas del templo de los Dioscuros."}},{"t":"La tumba de san Cayetano","x":"En esta basílica está sepultado san Cayetano de Thiene, fundador de los Teatinos, la orden que reconstruyó la iglesia a partir de la segunda mitad del siglo XVI. El santuario dedicado a él forma parte de la planta de la iglesia.","d":"Dentro de la basílica","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"El santuario de san Cayetano de Thiene en la basílica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"El santuario de san Cayetano de Thiene en la basílica de San Paolo Maggiore."}},{"t":"La sacristía de Solimena","x":"La sacristía de la basílica está decorada por Francesco Solimena, uno de los mayores pintores napolitanos del siglo XVIII. Es una de las partes más bellas de la iglesia.","d":"Detrás de la nave, en la sacristía","foto":{"u":"../img/4782e44ae33e.jpg","alt":"La sacristía con frescos de Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"La sacristía de San Paolo Maggiore, con los frescos de Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pío Monte de la Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"La obra maestra que Caravaggio pintó nada más llegar a Nápoles: las Siete obras de misericordia, aún en el altar para el que fueron realizadas, a pocos pasos del Duomo.","rac":"El Pio Monte della Misericordia fue fundado en 1602 por siete jóvenes nobles napolitanos para ayudar a las personas necesitadas. Sigue existiendo hoy, en el mismo palacio del siglo XVII en la Via dei Tribunali, y continúa su labor de caridad.\n\nLa iglesia octogonal se construyó entre 1656 y 1671 según el diseño de Francesco Antonio Picchiatti. En el altar mayor se encuentra el lienzo que la hace famosa en todo el mundo: las Siete obras de misericordia de Caravaggio, pintado entre 1606 y 1607 y pagado con 400 ducados, una cifra enorme. Caravaggio llevaba en Nápoles solo unos meses, huyendo de Roma tras una condena por homicidio.\n\nEl cuadro gustó tanto que en 1613 la congregación estableció que no pudiera venderse «a ningún precio» y que permaneciera para siempre en la iglesia. Alrededor, en los otros seis altares, hay lienzos de otros maestros del Seicento napolitano, cada uno dedicado a una obra de misericordia. En la planta superior está la pinacoteca del Pio Monte.","con":"Entrada general 10 euros, reducida 8 euros. En el palacio también está el pequeño coro alto desde el que los gobernadores del Pio Monte podían contemplar el lienzo desde arriba: pregunta si está incluido en la visita.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La cúpula octogonal de la iglesia del Pio Monte della Misericordia vista desde abajo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cúpula de la iglesia octogonal del Pio Monte della Misericordia, mirando hacia arriba."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Cerrado el 25 de diciembre y en Pascua; el 24 y el 31 de diciembre y el 15 de agosto cierra a las 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Las siete obras de misericordia","x":"Es un lienzo enorme, de casi cuatro metros de altura, y parece una noche en un callejón de Nápoles: una encrucijada llena de gente, iluminada por una luz que llega de lado y esculpe los cuerpos en la oscuridad. Arriba, la Virgen con el Niño, sostenida por dos ángeles, mira hacia abajo lo que hacen los hombres.\n\nEl Pio Monte quería una obra que reuniera las siete obras de misericordia: dar de comer al hambriento, dar de beber al sediento, vestir al desnudo, dar posada al peregrino, visitar a los enfermos, visitar a los presos, enterrar a los muertos. Caravaggio las pintó todas en una sola escena, sin milagros: es el hombre que ayuda al hombre.\n\nFue la primera obra de Caravaggio en Nápoles y cambió la pintura de la ciudad: los pintores napolitanos del siglo XVII retomaron su luz, sus personajes sacados de la calle e incluso algunos detalles, como el hombre de espaldas en primer plano.","d":"En el altar mayor","foto":{"u":"../img/da8045021e55.jpg","alt":"Las siete obras de misericordia de Caravaggio: escenas de calle en una noche oscura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Las siete obras de misericordia de Caravaggio (1607): toda la escena, con las personas abajo y la Virgen con el Niño arriba."}},{"t":"Cómo reconocer las siete obras","x":"Busca las escenas una por una.\n\nA la derecha, una joven amamanta a un anciano tras los barrotes: son Pero y su padre Cimón, condenado a morir de hambre en la cárcel. Valen por dos obras: dar de comer al hambriento y visitar a los presos. Mira la gota de leche en la barba del anciano.\n\nDetrás de ellos, un hombre carga con un muerto (solo se le ven los pies) y un sacerdote con una antorcha le alumbra: enterrar a los muertos. En primer plano, a la izquierda, un joven caballero corta su manto para un hombre desnudo en el suelo: es San Martín, vestir al desnudo; a su lado, en el rincón más oscuro, un lisiado reza: visitar a los enfermos.\n\nEn el extremo izquierdo, un posadero indica el camino a un peregrino con una concha en el sombrero, Santiago: dar posada al peregrino. Al fondo, un hombre bebe de una quijada de burro: es Sansón, dar de beber al sediento.","d":"Frente al lienzo, de izquierda a derecha","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"El lienzo de Caravaggio sobre el altar mayor del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"El lienzo de Caravaggio tal como lo ves en la iglesia: sobre el altar, en la capilla del Pio Monte."}},{"t":"La Virgen y los ángeles","x":"Mira hacia arriba: la Virgen con el Niño se asoma como desde una ventana, delante de dos sábanas tendidas, y dos ángeles se abrazan en vuelo. Parecen lejos de lo que sucede abajo.\n\nPero observa la sombra que proyectan sobre el muro de la cárcel: Caravaggio los hace presentes, casi concretos, dentro de la misma noche de los hombres.\n\nEl historiador del arte Roberto Longhi eligió precisamente este detalle para el cartel de la gran exposición de 1951 que redescubrió a Caravaggio: bellos, escribió, como un Rafael, pero tomados «de la verdad desnuda de Forcella o de Pizzofalcone».","d":"Arriba, en el lienzo","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Detalle: la Virgen con el Niño y los dos ángeles en vuelo","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"El detalle de arriba: la Virgen con el Niño que se asoma y los dos ángeles que se abrazan en vuelo."}},{"t":"Los otros altares","x":"Alrededor del Caravaggio, la iglesia octogonal tiene otros seis altares, con lienzos de pintores del Seiscientos napolitano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino y Forlì.\n\nBusca la «Liberación de san Pedro» de Battistello Caracciolo, de 1615: es uno de los pintores que más aprendieron de Caravaggio, y se nota en la luz y en la oscuridad. Después, «San Pedro resucitando a Tabita» de Fabrizio Santafede, de 1611.\n\nMíralos después del Caravaggio: comprenderás enseguida lo nuevo que era su lienzo para Nápoles.","d":"En las capillas de alrededor","foto":{"u":"../img/b58919c38c63.jpg","alt":"Un lienzo del siglo XVII con el Buen Samaritano","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"El Buen Samaritano de Giovan Vincenzo Forlì, en uno de los altares alrededor de las Siete obras de Caravaggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo y Tesoro de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La catedral de Nápoles y la Capilla del Tesoro, donde se custodia la ampolla de la sangre de San Gennaro.","rac":"La catedral, dedicada a Santa Maria Assunta, fue promovida por Carlos de Anjou en 1294 en el lugar donde se alzaban dos antiguas basílicas: la Stefania, demolida, y Santa Restituta, conservada como capilla. Se descubre de repente a lo largo de la Via Duomo, la calle abierta en las primeras décadas después de la Unidad de Italia.\n\nEs gótica, de cruz latina y tres naves, con un techo de casetones de madera tallada y dorada. En su interior, los siglos se suman: la basílica paleocristiana de Santa Restituta, el baptisterio más antiguo de Occidente, la cripta renacentista del Succorpo, la capilla barroca del Tesoro y, debajo de todo, los restos de la ciudad grecorromana.\n\nEn el Duomo, en una hornacina de la Capilla del Tesoro, se custodia la ampolla con la sangre que la tradición atribuye a San Gennaro. Tres veces al año (el sábado anterior al primer domingo de mayo, el 19 de septiembre y el 16 de diciembre) se espera su licuefacción. Las reliquias están confiadas desde 1601 a una institución laica, la Diputación de la Capilla del Tesoro de San Gennaro.","con":"Los días de la licuefacción el Duomo está lleno desde por la mañana: si quieres estar, llega temprano.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La fachada del Duomo de Nápoles","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La fachada del Duomo, en la Via Duomo. La Capilla del Tesoro es la tercera a la derecha."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Entrada gratuita con reserva obligatoria. Las visitas salen cada hora."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"El portal de San Gennaro","x":"Detente frente a la fachada: mide unos cincuenta metros de altura y tiene tres portales. Fue reconstruida en estilo gótico después de que el terremoto de 1349 destruyera la fachada angevina y el campanario.\n\nEl portal de la derecha permanece cerrado casi todo el año: solo se abre en las fiestas de San Gennaro y en ocasiones extraordinarias. Si lo encuentras abierto, has llegado en un día especial.\n\nLa catedral, dedicada a Santa Maria Assunta, fue encargada por Carlos de Anjou en 1294 en el lugar donde se alzaban dos antiguas basílicas. En el interior tiene planta de cruz latina, con tres naves y un techo de casetones de madera tallada y dorada.","d":"En la fachada, a la derecha","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"El portal gótico de la catedral de Nápoles","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"El portal gótico de la catedral, en la fachada."}},{"t":"La Capilla del Tesoro","x":"Más que una capilla, es una iglesia dentro de la iglesia: la tercera capilla a la derecha, barroca, de la primera mitad del siglo XVII, de cruz griega, con una cúpula de doble casquete. Se entra atravesando la gran reja de bronce de Cosimo Fanzago.\n\nAquí se custodian el busto de plata de San Gennaro y las ampollas con su sangre: cada año la ciudad espera el «milagro» de la licuefacción, y la multitud llena la catedral.\n\nEl tesoro donado al santo a lo largo de los siglos (joyas, platería, obras de arte) se visita en el Museo del Tesoro di San Gennaro, con entrada desde el exterior del Duomo.","d":"Tercera capilla a la derecha","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cúpula de la Capilla del Tesoro, decorada al fresco con el Paraíso","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Levanta la vista: en la cúpula de la Capilla del Tesoro está el Paraíso pintado por Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Cuando Carlos de Anjou mandó construir el Duomo, una de las dos basílicas antiguas que se alzaban aquí fue demolida y la otra se conservó como capilla lateral: es Santa Restituta, en la nave izquierda.\n\nLa tradición dice que fue encargada por el emperador Constantino: es uno de los testimonios más importantes del arte paleocristiano en Nápoles. Tiene tres naves y alberga obras de Luca Giordano y esculturas del siglo XIV.\n\nDesde aquí se baja al área arqueológica situada bajo la catedral, donde se ven capas de historia una encima de otra: restos grecorromanos y paleocristianos.","d":"En la nave izquierda","foto":{"u":"../img/5abf53aec271.jpg","alt":"Un mosaico de la Virgen entronizada en la basílica de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico de la Virgen entronizada, dentro de Santa Restituta: la basílica más antigua, conservada como capilla del Duomo."}},{"t":"El baptisterio de San Giovanni in Fonte","x":"A la derecha del ábside, un pequeño espacio con una historia inmensa: el Baptisterio de San Giovanni in Fonte, considerado el más antiguo de Occidente.\n\nQuédate unos minutos en silencio: estás en uno de los lugares cristianos más antiguos de Europa que siguen en pie, de la época en que la Nápoles romana se hacía cristiana.\n\nEl baptisterio y el área arqueológica bajo el Duomo cuentan juntos los primeros siglos de la ciudad cristiana.","d":"A la derecha del ábside","foto":{"u":"../img/994ed22c6902.jpg","alt":"El interior del Baptisterio de San Giovanni in Fonte con la pila bautismal en el centro","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"El Baptisterio de San Giovanni in Fonte: en el centro del suelo, la pila bautismal."}},{"t":"El Succorpo","x":"Bajo el altar mayor se encuentra la cripta de la catedral, la Capilla del Succorpo, llamada también Capilla Carafa: la mandó construir el cardenal Oliviero Carafa para custodiar en ella las reliquias de San Gennaro junto con las de otros 51 santos.\n\nEl arquitecto Giovan Tommaso Malvito la concibió como una pequeña basílica: tres naves divididas por columnas antiguas con capiteles jónicos, hornacinas a los lados y una capilla al fondo.\n\nMármoles blancos, luz tenue y silencio: es el Renacimiento dentro de la catedral gótica.","d":"Bajo el altar mayor","foto":{"u":"../img/876cd614ab8d.jpg","alt":"El interior del Succorpo di San Gennaro con columnas de mármol y suelo de incrustaciones","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"El Succorpo, bajo el presbiterio de la catedral: columnas y suelo de mármol y, al fondo, el altar con las reliquias de San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Complejo de los Girolamini","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Frente a la catedral, una iglesia barroca llamada «Domus Aurea», dos claustros, una pinacoteca y la biblioteca pública más antigua de Nápoles.","rac":"En la via Duomo, frente a la catedral, el complejo de los Girolamini nació en el siglo XVI para los padres del Oratorio de san Felipe Neri, llamados Girolamini. Es monumento nacional desde 1866 y reúne la iglesia, los claustros, la pinacoteca y la biblioteca.\n\nLa iglesia, dedicada a san Felipe Neri, es conocida como «Domus Aurea» por su decoración barroca en oro. La pinacoteca se considera la primera galería de pintura pública de la ciudad y conserva obras de maestros como Battistello Caracciolo, Jusepe de Ribera y Luca Giordano. La biblioteca, abierta al público en la segunda mitad del siglo XVI, es la biblioteca pública más antigua de Nápoles.\n\nEl complejo ha vivido una larga temporada de restauraciones: la iglesia reabrió el 21 de marzo de 2024 y, según fuentes periodísticas, en 2026 también reabrieron la Sala Camino y la Sala Vico de la biblioteca. Las reaperturas son progresivas: no todos los espacios se pueden visitar al mismo tiempo.","con":"Antes de venir, consulta en el sitio web oficial qué está abierto: la iglesia, los claustros, la pinacoteca y la biblioteca tienen horarios distintos y pueden cambiar.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"La fachada de los Girolamini iluminada por la noche","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"La fachada de la iglesia de los Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Iglesia. Cerrado los lunes."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Iglesia y festivos."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"La iglesia «Domus Aurea»","x":"La iglesia de San Filippo Neri se llama Domus Aurea, la «casa de oro», por su rica decoración barroca. Es uno de los lugares de culto más importantes de la ciudad.","d":"En la iglesia, con entrada por Via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"La nave de la iglesia de los Girolamini con sus decoraciones doradas","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"La iglesia de los Girolamini, la «Domus Aurea» por su rica decoración."}},{"t":"La pinacoteca","x":"Se considera la primera pinacoteca pública de Nápoles. Reúne pinturas de maestros del siglo XVII como Battistello Caracciolo, Jusepe de Ribera y Luca Giordano. Se llega desde el claustro de los Naranjos, en la primera planta del convento.","d":"Primera planta del convento, desde el claustro de los Naranjos","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Cabeza de santa pintada por Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Un lienzo de la Quadreria dei Girolamini: cabeza de santa de Massimo Stanzione (siglo XVII)."}},{"t":"La biblioteca más antigua de Nápoles","x":"La biblioteca es la biblioteca pública más antigua de la ciudad y la segunda de Italia, después de la Malatestiana de Cesena. Especializada en teología, filosofía, historia de la Iglesia y música sacra, custodia unos 159.700 volúmenes antiguos y modernos. Entre las salas históricas está la dedicada a Giambattista Vico, que estudió aquí.","d":"Entrada en Via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"La sala de la Biblioteca de los Girolamini con sus estanterías de madera","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"La sala de la Biblioteca de los Girolamini, la biblioteca pública más antigua de Nápoles."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"La Madonna con pistola de Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Madonna de Banksy con una pistola en lugar de la aureola, protegida por un cristal, en el corazón del Decumano Maggiore.","rac":"Banksy llegó a Nápoles en 2010: era la primera vez que trabajaba en Italia. Con plantillas, probablemente la misma noche, dejó dos obras en puntos muy concurridos del centro, ambas con una imagen religiosa y un mensaje directo. Una, en la Via Benedetto Croce, fue tapada por otro artista; esta sobrevivió, y por eso se la señala como el único mural de Banksy en Italia.\n\nJunto a la obra hay una antigua hornacina votiva con la Virgen con el Niño: las dos imágenes, tan cercanas, parecen hablarse.\n\nEn la Piazzetta dei Girolamini, en una fachada del Decumano Maggiore, Banksy dejó una Madonna con una pistola en lugar de la aureola. Hoy está protegida por un cristal. El portal turístico oficial de la ciudad la incluye en su itinerario dedicado al arte urbano del centro histórico.","con":"Levante la vista: la obra está por encima del nivel de la calle, detrás de un cristal.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"El rostro de la Madonna de Banksy en plantilla blanca sobre fondo oscuro","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"El rostro de la Madonna de Banksy: la plantilla blanca sobre fondo oscuro, de cerca."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Virgen de la pistola","x":"Mira el muro: en blanco sobre fondo negro, hecha con plantilla, una Virgen con los brazos abiertos hacia el cielo. Pero en lugar de la aureola, sobre su cabeza, hay una pistola.\n\nBanksy, el artista callejero inglés de Bristol, la pintó en Nápoles en 2010, probablemente de noche y en pocos segundos, con sus plantillas. Fue la primera obra de Banksy en Italia.\n\nEl mensaje no se explica: a una mirada distraída parece una imagen sagrada, pero no lo es. Lo sagrado y la violencia, la fe y las armas: cada uno la interpreta a su manera.","d":"En el muro de la plazoleta","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"La Virgen de Banksy, hecha con plantilla, en el muro de la plaza Gerolomini, vista de cerca","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Virgen de Banksy, con plantilla en blanco y negro, en una esquina del muro de la plaza Gerolomini."}},{"t":"La hornacina de al lado","x":"Ahora mira junto a la obra: hay una pequeña hornacina votiva con la Virgen con el Niño, de las que se ven en tantas calles de Nápoles, pintada quién sabe cuántos siglos antes.\n\nLas dos Vírgenes, una junto a la otra, parecen mirarse: la antigua parece observar perpleja a la de Banksy. Este diálogo es lo que hace que la obra sea tan napolitana.\n\nDa un paso atrás y míralas juntas: es la foto más bonita para llevarte a casa.","d":"Justo al lado de la obra","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Virgen de Banksy en el muro y, a su lado, la hornacina votiva con la Virgen con el Niño","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A la izquierda la Virgen de Banksy, a la derecha, colgada del muro, la hornacina con la Virgen con el Niño: las dos imágenes sagradas, una junto a la otra."}},{"t":"Un Banksy bajo cristal","x":"En 2010 Banksy dejó en Nápoles dos obras, probablemente la misma noche. La otra, en la via Benedetto Croce, se burlaba del consumismo: reproducía el «Éxtasis de la beata Ludovica Albertoni» de Bernini, pero la santa aparecía en éxtasis después de una comida de fast food.\n\nEsa obra fue tapada por otro artista callejero napolitano, que no sabía lo que estaba borrando. Por eso el FAI señala este mural de la piazza Gerolomini como el único de Banksy en Italia.\n\nHoy está protegida por una urna de plexiglás, que al menos la defiende de los vándalos.","d":"Frente a la obra","foto":null},{"t":"Cómo llegar y qué fotografiar","x":"La obra está en un muro de la pequeña Piazza Gerolomini, que da a la Via dei Tribunali.\n\nLa vitrina protege la obra, pero puede reflejar la luz: para una foto sin reflejos, prueba a colocarte ligeramente de lado. El lugar es siempre accesible y gratuito.\n\nDesde aquí, la Madonna de la Via Benedetto Croce, la obra perdida, estaba a nueve minutos a pie, siguiendo el recorrido que pasa por Sansevero, Napoli Sotterranea y San Gregorio Armeno.","d":"Piazza Gerolomini, en la Via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini y las murallas griegas","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una plaza de cafés y estudiantes con una ventana al pasado: tras una balaustrada se ven las murallas griegas de Neapolis.","rac":"Piazza Bellini se encuentra en el decumano mayor y es una de las plazas más concurridas del centro histórico, por los muchos locales que dan a ella. Basta mirar hacia abajo, más allá de la balaustrada, para ver, en una zona rebajada, un tramo de las murallas de la Neapolis griega, que se remontan al siglo IV a. C. Fueron descubiertas en 1954.\n\nA pocos pasos está el Conservatorio di San Pietro a Majella.","con":"Diez minutos bastan: mira las murallas desde arriba y luego date una pausa en uno de los locales de la plaza.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"Piazza Bellini con sus mesas y su vegetación","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, el punto de encuentro del centro histórico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Las murallas griegas","x":"Bajo el nivel de la plaza se ven los restos de las murallas defensivas de la Neapolis griega, en bloques de toba. Fueron descubiertas en 1954 y forman parte del sistema de fortificaciones de la ciudad antigua. No son una reconstrucción: son piedras originales.","d":"Más allá de la balaustrada, en la zona rebajada","foto":{"u":"../img/4801d5111d9f.jpg","alt":"Los bloques de toba de las murallas griegas bajo el nivel de la plaza","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Las murallas griegas de Neapolis en la Piazza Bellini: bloques de toba originales."}},{"t":"La plaza hoy","x":"Alrededor de las murallas hay cafés, librerías y locales frecuentados por estudiantes y vecinos. Es uno de los lugares del centro histórico donde lo antiguo y la vida cotidiana están más cerca.","d":"Alrededor de la plaza","foto":{"u":"../img/133ed975e61b.jpg","alt":"La Piazza Bellini con árboles, edificios y mesitas","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"La Piazza Bellini hoy, entre cafés y librerías."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port’Alba y la calle de los libreros","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una puerta de 1625 y, más allá del arco, un callejón de libreros y tiendas de música que lleva a Piazza Bellini.","rac":"Port'Alba es una de las antiguas puertas de la ciudad. Se abre en una esquina de Piazza Dante y toma su nombre del virrey español Antonio Álvarez de Toledo, duque de Alba, que la hizo erigir en 1625 en lugar de una abertura provisional, para facilitar el paso de un lado a otro de la ciudad. Su aspecto actual se debe a las obras de finales del siglo XVIII impulsadas por Fernando IV de Borbón.\n\nMás allá de la puerta está la via Port'Alba, un callejón peatonal conocido por sus librerías y tiendas de música, que lleva hasta Piazza Bellini.","con":"Pasa bajo el arco y curiosea entre los puestos de libros: es la forma más sencilla de ir de Piazza Dante a Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"El arco de Port'Alba, entrada histórica al centro antiguo","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, la puerta del siglo XVI al centro antiguo."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"La puerta de 1625","x":"La puerta fue erigida en 1625 por voluntad del duque de Alba, virrey español. En el escudo se reconocen los del rey Felipe III, de la ciudad de Nápoles y del virrey. Hoy la puerta está en parte oculta por la columnata de Piazza Dante.","d":"En una esquina de Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"La puerta de Port'Alba con el escudo","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, la puerta de 1625 mandada construir por el duque de Alba."}},{"t":"La calle de los libreros","x":"El callejón que atraviesa la puerta es famoso por su mercado de libros: librerías, puestos y tiendas de instrumentos musicales, hasta Piazza Bellini.","d":"Pasada la puerta, hacia Piazza Bellini","foto":null}],"gal":[],"leg":"Una leyenda cuenta de una joven llamada María, acusada de brujería en tiempos de la Inquisición española y dejada morir en una jaula colgada de la puerta.","fc":null,"col":null},{"id":22,"s":"mann","n":"Museo Arqueológico Nacional (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"Uno de los mayores museos arqueológicos del mundo: los tesoros de Pompeya y Herculano, la colección Farnesio y el célebre Mosaico de Alejandro.","rac":"El Museo Arqueológico Nacional tiene su sede en el Palazzo degli Studi, construido en 1585. En 1777, el rey Fernando IV de Borbón trasladó allí la colección Farnesio, heredada de su madre Isabel de Farnesio. Con el regreso de los Borbones en 1816 pasó a ser el Real Museo Borbónico; tras la Unidad de Italia se convirtió en Museo Nacional. Los cuadros fueron trasladados a Capodimonte en 1957, y desde entonces es un museo exclusivamente de antigüedades.\n\nExpone unas 18.000 piezas: las colecciones vesubianas (frescos, mosaicos, objetos de la vida cotidiana, la maqueta de Pompeya, la Villa de los Papiros), las esculturas y las gemas Farnesio, el Gabinete Secreto, la numismática y una de las colecciones egipcias más importantes del mundo.\n\nLa pieza más célebre es el Mosaico de Alejandro, hallado en 1831 en la Casa del Fauno de Pompeya: representa la batalla de Issos, entre Alejandro Magno y Darío III, y está compuesto por aproximadamente un millón y medio de teselas.","con":"Si tienes poco tiempo, elige tres cosas: el Mosaico de Alejandro, el Hércules Farnesio y el Gabinete Secreto. Para verlo todo se necesitan al menos dos o tres horas. Comprueba los horarios antes de venir.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Fresco pompeyano expuesto en el Museo Arqueológico Nacional","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Un fresco pompeyano expuesto en el MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Taquilla hasta las 18:30"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"El Mosaico de Alejandro","x":"Encontrado en 1831 en la Casa del Fauno de Pompeya, el gran mosaico mide unos 5,82 por 3,13 metros y tiene alrededor de un millón y medio de teselas. Muestra la batalla de Issos (333 a. C.) entre Alejandro Magno y Darío III de Persia.","d":"En la entreplanta, en la sección de los mosaicos de Pompeya","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"El gran mosaico de la batalla entre Alejandro y Darío","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"El Mosaico de Alejandro, procedente de la Casa del Fauno de Pompeya."}},{"t":"La colección Farnesio","x":"Reunida por la familia Farnesio para su palacio de Roma, la colección incluye estatuas monumentales como el Hércules Farnesio, de unos tres metros de altura y hallado en las Termas de Caracalla, y el Toro Farnesio.","d":"En la planta baja","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"La estatua del Hércules Farnesio apoyado en su maza","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"El Hércules Farnesio, hallado en las Termas de Caracalla."}},{"t":"El Gabinete Secreto","x":"Reúne obras de arte erótico halladas en Pompeya y Herculano. Tiene una entrada independiente y a menudo requiere reserva con hora: consulte en la taquilla.","d":"En la entreplanta","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, museo de arte contemporáneo","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Un palacio reformado por el arquitecto Álvaro Siza que alberga obras de Clemente, Kapoor, Serra, Horn y otros maestros del arte contemporáneo.","rac":"El MADRE, museo de arte contemporáneo Donnaregina, se encuentra en el Palazzo Donnaregina, a pocos pasos del Duomo y del Tesoro de San Genaro. El edificio fue reformado por el arquitecto portugués Álvaro Siza y el museo, gestionado por la Fundación Donnaregina para las artes contemporáneas, se inauguró en 2005.\n\nLa primera planta está dedicada a obras realizadas expresamente para las salas por artistas como Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long y Mimmo Paladino. La colección incluye también a Richard Serra, Sol LeWitt y Jeff Koons, y el museo organiza exposiciones temporales. Es un contraste deliberado con la Nápoles antigua que lo rodea.","con":"Busca «Spirits» de Rebecca Horn: son copias en hierro fundido de los cráneos del Cementerio de las Fontanelle. El museo cierra los martes y, por obras, algunas salas de la segunda planta están temporalmente cerradas: consulta la web antes de venir.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"El patio blanco del museo Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"El museo Madre, arte contemporáneo en Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Cerrado los martes. La última entrada es una hora antes del cierre."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Domingo. La última entrada es una hora antes del cierre."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"«Ave Ovo» de Francesco Clemente","x":"Un suelo de mayólica y un fresco monumental, creados en 2005 para el museo, ocupan dos salas en dos plantas.","d":"En las salas dedicadas a Clemente","foto":null},{"t":"«Spirits» de Rebecca Horn","x":"La artista reprodujo en hierro fundido los cráneos del cementerio de las Fontanelle, las «capuzzelle» napolitanas. Un vínculo entre el arte contemporáneo y la Nápoles popular.","d":"En la sala de Rebecca Horn","foto":null},{"t":"La arquitectura de Siza","x":"Siza reformó las tres plantas del palacio, manteniendo la estructura histórica e incorporando espacios modernos para las grandes instalaciones.","d":"En todo el museo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Estación de metro Toledo","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una parada de la Línea 1 considerada una de las más bellas de Europa: mosaicos, cerámicas azules y el «Cráter de luz» de Robert Wilson.","rac":"La estación Toledo forma parte de las «Estaciones del Arte», el proyecto que encargó a arquitectos y artistas el diseño de las paradas de la Línea 1, con más de 250 obras. Fue proyectada por el arquitecto catalán Oscar Tusquets Blanca e inaugurada el 17 de septiembre de 2012. La entrada, en la Via Diaz, tiene tres estructuras hexagonales revestidas de azulejos azules y ocres, que llevan la luz al vestíbulo.\n\nAl bajar se encuentran las ondas en relieve diseñadas por Tusquets, las obras de Robert Wilson (entre ellas «Crater de luz», un cráter de luz) y los mosaicos de William Kentridge. La estación ha sido señalada varias veces entre las más bellas de Europa.\n\nPara verla basta con tomar el metro: hace falta un billete para bajar a los andenes.","con":"Baja hasta el nivel más profundo y mira hacia arriba: ahí es donde la luz del Cráter hace el mejor efecto. Para entrar se necesita billete; consulta los horarios del servicio en la web de ANM.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"El andén de la estación Toledo, en el subsuelo","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"El andén de la estación Toledo."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Horario de servicio de la Línea 1: del primer al último tren."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Horario de servicio de la Línea 1: del primer al último tren."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"El «Crater de luz» de Robert Wilson","x":"Un cráter de luz, obra de Robert Wilson, define la identidad de la estación. La obra cambia con la luz y da al descenso un efecto casi teatral.","d":"En los niveles subterráneos de la estación","foto":null},{"t":"Los mosaicos de William Kentridge","x":"A lo largo del recorrido se ven mosaicos del artista sudafricano William Kentridge, que forman parte del programa de las Estaciones del Arte.","d":"En el recorrido hacia los andenes","foto":null},{"t":"La entrada azul de la vía Diaz","x":"Tres estructuras hexagonales revestidas de azulejos azules y ocres, que dejan entrar la luz en el atrio. Los dos colores son el hilo conductor de toda la estación.","d":"En la entrada de la vía Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, el último Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"A seis minutos de Ceraldi, en la Via Toledo, el último cuadro pintado por Caravaggio, pocas semanas antes de morir: el Martirio de santa Úrsula.","rac":"Las Gallerie d'Italia de Intesa Sanpaolo están en la Via Toledo 177, en el palacio que fue sede del Banco di Napoli, proyectado por Marcello Piacentini a finales de los años treinta del siglo XX; el nuevo montaje es del arquitecto Michele De Lucchi. El museo abrió aquí en 2022 y ocupó el lugar del cercano Palazzo Zevallos Stigliano.\n\nLa obra maestra de la colección es el Martirio de santa Úrsula de Caravaggio, de 1610, considerado el último cuadro del pintor. En torno a él hay tres recorridos: el arte napolitano del siglo XVII al XX, una colección de cerámicas áticas y de la Magna Grecia y una selección de obras del siglo XX.","con":"Entrada general 8 euros, reducida 4 euros; gratis para menores de 26 años y para todos el primer domingo del mes. Cerrado los lunes; última entrada una hora antes del cierre.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Una sala de las Gallerie d'Italia con cuadros en paredes amarillas","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala de las Gallerie d'Italia en Nápoles, con lienzos del siglo XVII."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"El Martirio de santa Úrsula","x":"Es una escena estrecha y oscura, casi sin fondo: estamos en la tienda de Atila, rey de los hunos. Úrsula, una princesa, lo ha rechazado, y él acaba de dispararle una flecha en el pecho. Ella inclina la cabeza hacia la flecha; tres hombres acuden para sostenerla. El rey parece ya arrepentido de su gesto.\n\nBusca el rostro detrás de la santa: es el propio Caravaggio, que se pintó entre los testigos. Y observa la mano que se alarga entre la santa y el rey, como para detener la flecha: reapareció durante la restauración de 2003-2004.\n\nLo encargó el príncipe genovés Marcantonio Doria, cuya familia tenía a santa Úrsula como protectora. Es el cuadro más tardío de Caravaggio que conocemos: se terminó en mayo de 1610, poco más de un mes antes de su muerte.","d":"En la sala dedicada a Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"El Martirio de santa Úrsula de Caravaggio: la santa y el rey en el momento de la flecha","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"El Martirio de santa Úrsula (1610): el rey hiere a la santa con la flecha, a quemarropa."}},{"t":"El cuadro puesto al sol","x":"Caravaggio pintó el cuadro deprisa, quizá porque estaba a punto de partir hacia Roma para obtener el perdón del papa. El encargado de los Doria en Nápoles, Lanfranco Massa, hizo entregar el lienzo cuando el barniz aún no estaba seco y, para que se secara antes, lo puso al sol: el barniz, extendido en una capa muy gruesa, se estropeó. El propio Massa lo contó en una carta de mayo de 1610.\n\nEl cuadro llegó a Génova, luego pasó de heredero en heredero, acabó en una villa de Eboli y fue atribuido a otros pintores. Solo en los años ochenta del siglo XX el hallazgo de la carta de Massa confirmó con certeza que es de Caravaggio.\n\nEn 2025 una nueva restauración ha devuelto a la luz tres cabezas que el tiempo había hecho desaparecer.","d":"Frente al lienzo","foto":{"u":"../img/6a999eeecae6.jpg","alt":"El lienzo de Caravaggio expuesto en una sala del Palazzo Zevallos, con el techo decorado","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"El Martirio de santa Úrsula expuesto en una sala del Palazzo Zevallos Stigliano, sede de las Gallerie d’Italia."}},{"t":"El palacio del Banco di Napoli","x":"Antes de subir a las salas, mira a tu alrededor: estás en el palacio que fue la sede del Banco di Napoli, proyectado por Marcello Piacentini a finales de los años treinta del siglo XX.\n\nEl arquitecto Michele De Lucchi lo ha transformado en museo con un montaje moderno: las grandes salas del banco acogen hoy tres recorridos, desde el arte napolitano del siglo XVII hasta el siglo XX, pasando por una rica colección de vasos griegos y de la Magna Grecia.\n\nEl museo abrió en 2022 y continúa la actividad del Palazzo Zevallos Stigliano, abierto de 1999 a 2022 a pocos pasos de aquí.","d":"Al entrar, en el salón","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La fachada de piedra del Palazzo del Banco di Napoli en la Via Toledo, con la bandera europea","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"El Palazzo del Banco di Napoli en la Via Toledo, sede de las Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Barrios Españoles","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Una red de callejones estrechos nacida en el siglo XVI para los soldados españoles, hoy uno de los barrios más vivos y fotografiados de Nápoles.","rac":"Los Barrios Españoles nacieron en 1536 por voluntad del virrey español Pedro de Toledo, para alojar a las guarniciones destinadas a mantener el orden. La calle principal, la Via Toledo, lleva su nombre. El barrio es una cuadrícula de callejones estrechos entre la Via Toledo, el Corso Vittorio Emanuele y Monte Echia, y comprende las zonas de Avvocata, Montecalvario y San Ferdinando.\n\nEl origen español sigue vivo en los nombres de las calles, como la Via della Trinità degli Spagnoli, donde se encuentra la iglesia de Santa Maria del Pilar. En los callejones hay tiendas, ropa tendida, altarcitos y muchos murales.\n\nEl más famoso es el mural de Maradona en Largo Maradona, en la Via Emanuele De Deo: lo realizó en 1990 Mario Filardi y a lo largo de los años ha sido restaurado varias veces. Es una parada del recorrido «El mar y los castillos», que tiene su propia ficha.","con":"Sal de Piazza Carità y adéntrate en los callejones de día. Como en cualquier zona concurrida, ten el bolso y el teléfono a mano. Camina despacio: los detalles están en los portones y en los murales.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"Un callejón de los Barrios Españoles con el mural de Maradona y las banderas","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"En los Barrios Españoles, el mural de Maradona entre las banderas."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"La cuadrícula de callejones","x":"El plano urbanístico es una cuadrícula regular de callejones estrechos, creada para alojar a los soldados españoles. Al caminar se ven ropa tendida, pequeños altares callejeros y talleres: la vida del barrio transcurre en la calle.","d":"En los callejones al oeste de la Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"Un callejón estrecho de los Barrios Españoles","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"Uno de los callejones rectos y estrechos de la cuadrícula de los Barrios Españoles."}},{"t":"El mural de Maradona y Largo Maradona","x":"En la Via Emanuele De Deo, un antiguo aparcamiento se ha convertido en Largo Maradona. El mural de 1990 de Mario Filardi fue restaurado después por el artista argentino Bosoletti, que realizó al lado la Isis velada.","d":"En la Via Emanuele De Deo","foto":null},{"t":"La iglesia de Santa Maria del Pilar","x":"En la Via della Trinità degli Spagnoli se encuentra la iglesia que los españoles dedicaron a Santa Maria del Pilar: una huella del origen español del barrio.","d":"En la Via della Trinità degli Spagnoli","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"El mural de Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"El mural queridísimo de los Barrios Españoles y la plaza que desde 2020 se ha convertido en un santuario laico para Diego.","rac":"El mural retrata a Maradona con la camiseta número 10 del Nápoles de los años ochenta, el scudetto en el pecho y el brazalete de capitán en el brazo: fue pintado para celebrar el segundo scudetto, el de 1989-90, al que Maradona contribuyó con 16 goles en 28 partidos. Había llegado del Barcelona en 1984 y permaneció en Nápoles hasta 1991.\n\nEl autor, Mario Filardi, tenía solo 23 años: pintaba por pasión y, de oficio, era camarero, y viajaba por el mundo.\n\nEl mural de Maradona fue pintado en 1990 por Mario Filardi. En los años noventa, la apertura de una ventana en el muro borró su rostro y la pintura se desvaneció casi por completo; fue restaurado gracias a Salvatore Iodice y, en el otoño de 2017, el artista argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona, el 25 de noviembre de 2020, la plaza, antes llamada «de los artistas», ha tomado su nombre y se ha llenado de altarcitos, banderas y fotografías.","con":"En las horas punta está abarrotado: a primera hora de la mañana es más fácil verlo con calma.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"El gran mural de Maradona en la fachada de un edificio, con la multitud debajo","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"El mural pintado en 1990 por Mario Filardi. El rostro de hoy es el que repintó en 2017 el artista argentino Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"El mural y su autor","x":"El mural de 1990 es obra de Mario Filardi, que pintaba por pasión. Fue restaurado varias veces: en 2017 el artista argentino Francisco Bosoletti volvió a pintar el rostro.","d":"En la fachada de la via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"El rostro de Maradona pintado en la fachada de un edificio","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"El mural de Maradona en la via Emanuele De Deo, con el rostro repintado en 2017 por Francisco Bosoletti."}},{"t":"La plaza desde el 25 de noviembre de 2020","x":"Tras la muerte de Maradona, la plazoleta, antes llamada «de los artistas», ha tomado su nombre y se ha convertido en un lugar de pequeños altares, banderas y fotografías.","d":"En el espacio abierto frente al mural","foto":{"u":"../img/76bca69c23a8.jpg","alt":"La plazoleta frente al mural de Maradona, llena de gente","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: banderas, pequeños altares y visitantes frente al mural."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La placa del Largo Maradona con un busto y banderas","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La placa de la plaza: tras la muerte de Diego, en 2020, la plaza de los artistas tomó su nombre."},{"u":"../img/550f6edc4b91.jpg","alt":"Un pequeño altar con fotos de Maradona y recuerdos","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un pequeño altar dedicado a Maradona: en la ciudad hay muchos, con fotos y recuerdos dejados por los hinchas."},{"u":"../img/679687d3070c.jpg","alt":"Maradona pintado con aureola junto a una pequeña hornacina","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con aureola y su hornacina votiva, pintado en la zona de San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Una hornacina votiva con un retrato de Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Una hornacina votiva para Maradona, como las de los santos."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galleria Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una galería en forma de cruz con una cúpula de hierro y cristal de unos 56 metros de altura, frente al Teatro di San Carlo.","rac":"La Galleria Umberto I se construyó entre 1887 y 1890 durante el Risanamento de Nápoles, el gran plan de reconstrucción urbana que siguió a la epidemia de cólera. El arquitecto Emanuele Rocco la proyectó en forma de cruz, inspirándose en la Galleria Vittorio Emanuele II de Milán. Lleva el nombre de Humberto I, rey de Italia en la época de su construcción.\n\nLos cuatro brazos se encuentran bajo una cúpula de hierro y cristal, sostenida por dieciséis nervaduras. Bajo la cúpula, el suelo es un mosaico en forma de estrella. En la galería hay tiendas, cafés y, en las plantas superiores, apartamentos: se concibió para unir actividades comerciales y vida social.\n\nSe encuentra frente al Teatro di San Carlo, cerca de Piazza del Plebiscito.","con":"Detente bajo la cúpula y alza la mirada: es el mejor punto para ver el hierro y el cristal. Es un lugar de paso, con entrada libre.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"Una entrada decorada de la Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Una entrada de la Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"La cúpula de hierro y vidrio","x":"Los cuatro brazos de la galería se encuentran bajo una cúpula de hierro y vidrio, sostenida por dieciséis nervaduras. De día la luz entra por todos los lados; por la noche la iluminación hace resaltar la estructura.","d":"En el centro de la galería","foto":{"u":"../img/5caa008a8527.jpg","alt":"La cúpula de hierro y vidrio de la Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"La cúpula de hierro y vidrio, donde se encuentran los cuatro brazos de la galería."}},{"t":"El mosaico de estrella","x":"Bajo la cúpula, el suelo es un mosaico en forma de estrella de doce puntas, en tonos crema, terracota y gris. Se reconoce mirando hacia abajo, en el punto de encuentro de los brazos.","d":"En el suelo, bajo la cúpula","foto":null},{"t":"El saneamiento de Nápoles","x":"La galería nació como símbolo de una ciudad que quería modernizarse tras la epidemia de cólera. Formaba parte del «risanamento» (el saneamiento), el gran proyecto de demolición y reconstrucción de la ciudad, y quería competir con la Galleria Vittorio Emanuele II de Milán.","d":"Entrando por la Via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Estatuas y la inscripción ANNO MDCCCXC en la galería","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Anno MDCCCXC»: la fecha de finalización, escrita en la galería símbolo del saneamiento."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Teatro di San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"El teatro de ópera más antiguo todavía en activo en Europa: inaugurado en 1737, antes que La Scala y La Fenice.","rac":"El Teatro di San Carlo se construyó por voluntad de Carlos III de Borbón y se inauguró el 4 de noviembre de 1737, día del santo del rey. El rey quería para Nápoles un teatro más grande que el antiguo San Bartolomeo. Se abrió 41 años antes que La Scala de Milán y 55 antes que La Fenice de Venecia: por eso se considera el teatro de ópera más antiguo todavía en activo. El proyecto se encargó a Giovanni Antonio Medrano y Angelo Carasale.\n\nPor su escenario han pasado compositores como Rossini, Donizetti, Bellini y Verdi. El teatro forma parte del Patrimonio Mundial de la UNESCO junto con el centro histórico.\n\nSe visita con tours guiados en italiano y en inglés, de unos treinta minutos; en el mismo complejo se encuentra también el MeMus, el museo que cuenta la historia del teatro y de la ópera.","con":"Las visitas dependen de los ensayos y los espectáculos: consulta la web oficial y, si puedes, reserva. Si te gusta la ópera, la mejor manera de conocer el teatro es asistir a un espectáculo.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"La fachada del Teatro San Carlo con sus columnas","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"La fachada del Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Visitas guiadas de unos 30 minutos a las 10:30, 11:30, 12:30, 14:30, 15:30 y 16:30. Se recomienda reservar."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"La sala y el Real Teatro","x":"La sala en forma de herradura es el corazón del teatro: palcos en filas superpuestas y un palco real. El San Carlo es famoso también por su acústica. En las visitas guiadas por lo general se puede fotografiar la sala y el foyer.","d":"En la sala, con la visita guiada","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"Un grabado del siglo XVIII con una fiesta de baile en el teatro","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Una fiesta de baile en el Real Teatro di San Carlo, en un grabado de 1749."}},{"t":"El MeMus","x":"El MeMus, inaugurado en 2011, es el museo y archivo histórico del teatro. Recorre la historia del edificio y de la ópera italiana con cuadros, fotografías, instrumentos musicales y trajes.","d":"En el mismo complejo del teatro","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Trajes de escena expuestos en el MeMus","aut":"Carlo Raso","lic":"Pubblico d
