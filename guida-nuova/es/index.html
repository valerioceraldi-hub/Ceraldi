ominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Trajes de escena de una ópera de Paisiello expuestos en el MeMus."}},{"t":"El primer teatro de ópera de Europa","x":"Inaugurado en 1737, es más antiguo que la Scala de Milán (1778) y que la Fenice de Venecia (1792). Por eso se considera el teatro de ópera más antiguo todavía en actividad.","d":"Frente a la fachada, en la Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"La inscripción Real Teatro di S. Carlo en la fachada","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"«Real Teatro di S. Carlo», en la fachada del teatro inaugurado en 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"La plaza más grande de Nápoles: por un lado el Palacio Real, por el otro una columnata que abraza la basílica de San Francisco de Paula.","rac":"A los pies de la colina de Pizzofalcone, Piazza del Plebiscito es una de las plazas más amplias y monumentales de la ciudad. Hasta 1817 se llamaba Largo di Palazzo. En 1809 Joachim Murat hizo demoler los conventos de la zona y proyectar un foro con una columnata semicircular. Las obras se interrumpieron con el fin de su reinado y fueron retomadas por Fernando I, que quiso construir una iglesia en cumplimiento de un voto a San Francisco de Paula: la basílica se levantó entre 1817 y 1836, inspirada en el Panteón de Roma.\n\nLa plaza tomó su nombre actual tras el plebiscito del 21 de octubre de 1860, que sancionó la anexión del Reino de las Dos Sicilias al Reino de Cerdeña. Delante de la basílica hay dos estatuas ecuestres: Carlos III de Borbón, obra de Antonio Canova, y Fernando I.\n\nHoy es el lugar de conciertos, ceremonias y fiestas de la ciudad.","con":"Llega temprano por la mañana: la luz rasante ilumina la columnata y la plaza está casi vacía. Después, entra en la basílica y da la vuelta hacia el Palacio Real.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito con un león y la iglesia de San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito y, al fondo, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"La columnata y la basílica de San Francesco di Paola","x":"La columnata semicircular nació con Murat. La basílica es un edificio neoclásico con una cúpula central de 53 metros de altura, inspirada en el Panteón. En el interior, el altar mayor, rico en piedras preciosas y lapislázuli, fue diseñado por Ferdinando Fuga en 1751 y trasladado aquí en 1835 desde la iglesia de los Santi Apostoli.","d":"En el lado oeste de la plaza","foto":{"u":"../img/82ad7240a133.jpg","alt":"El interior circular de la basílica de San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"El interior de la basílica de San Francesco di Paola, inspirada en el Panteón."}},{"t":"Las estatuas ecuestres","x":"Las dos estatuas de bronce representan a Carlos III de Borbón, fundador de la dinastía, y a su hijo Fernando I. Se encuentran frente a la basílica.","d":"Frente a la basílica","foto":{"u":"../img/75d762389b74.jpg","alt":"Una estatua ecuestre de bronce frente a la basílica","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"Una de las dos estatuas ecuestres de los Borbones frente a la basílica."}},{"t":"El nombre de la plaza","x":"El nombre se debe al plebiscito del 21 de octubre de 1860, con el que el Reino de las Dos Sicilias fue anexionado al Reino de Cerdeña. Antes, la plaza se llamaba Largo di Palazzo.","d":"En toda la plaza","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito vista en toda su amplitud","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, antiguamente Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Palacio Real","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"El gran palacio de los virreyes y de los Borbones: Escalera de honor, Teatro de Corte, Salón del Trono y un jardín sobre el golfo.","rac":"El Palacio Real da a Piazza del Plebiscito. Lo mandó construir a principios del siglo XVII el virrey español Fernando Ruiz de Castro, conde de Lemos, y durante siglos fue sede del poder en Nápoles; la construcción se prolongó durante siglos y no se completó hasta 1858 de la mano de Gaetano Genovese. En la fachada, en las hornacinas, hay ocho estatuas de soberanos de Nápoles.\n\nEl museo ocupa el Apartamento histórico, en la planta noble: se llega por la Escalera de honor, obra de Francesco Antonio Picchiatti de 1651, revestida de mármol rosa y blanco y considerada una de las más bellas de Europa. Entre las salas se encuentran el Teatrino de Corte, el Salón del Trono, la Capilla Real y el Salón de Hércules. El Apartamento histórico está abierto al público desde 1919 y sufrió graves daños durante la Segunda Guerra Mundial.\n\nEl Jardín romántico, en el lado que da al golfo, tiene entrada gratuita.","con":"Al subir la Escalera de honor, fíjese en el mármol y en la luz. Normalmente está abierto de 9 a 20 h (última entrada a las 19 h) y cierra los miércoles: compruébelo de todos modos antes de venir.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"La fachada del Palacio Real en la plaza","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"La fachada del Palacio Real."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Apartamento de Etiqueta (Apartamento Histórico). Normalmente cerrado los miércoles. Última confirmación en las páginas oficiales del Ministerio de Cultura (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"La Escalera de honor","x":"Diseñada por Francesco Antonio Picchiatti en 1651, fue revestida más tarde de mármol rosa y blanco. Se considera una de las escaleras monumentales más hermosas de Europa y conduce al museo de la planta noble.","d":"En la entrada, junto al patio de honor","foto":{"u":"../img/7533a4a26b58.jpg","alt":"La Escalera de honor del Palacio Real","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"La Escalera de honor del Palacio Real, revestida de mármoles."}},{"t":"El Teatrino de Corte y el Salón del Trono","x":"El Apartamento histórico alberga el Teatrino de Corte, el Salón del Trono con una gran lámpara de cristal, la Capilla Real y el Salón de Hércules: eran los espacios de vida y de representación de la corte.","d":"En la planta noble, en el Apartamento histórico","foto":{"u":"../img/841e35a47444.jpg","alt":"El trono en el Salón del Trono del Palacio Real","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"El Salón del Trono en el Apartamento histórico."}},{"t":"El Jardín romántico","x":"En el lado que da al golfo está el jardín, de entrada gratuita, donde se pasea entre parterres y árboles. Es un lugar tranquilo con vistas al golfo.","d":"En el lado del palacio que da al mar","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"El castillo símbolo de Nápoles: un arco de triunfo entre dos torres, una puerta de bronce todavía alcanzada por una bala de cañón y la sala donde un rey mandó arrestar a los barones durante una fiesta de bodas.","rac":"Con los reyes angevinos, el castillo se convirtió en un centro de cultura: bajo Roberto de Anjou se alojaron en él artistas, médicos y literatos, entre ellos Giotto, Petrarca y Boccaccio.\n\nAlfonso I de Aragón lo convirtió en su residencia real y lo reconstruyó. Para celebrar su entrada victoriosa en la ciudad, hizo construir, entre la Torre del Medio y la Torre de Guardia, el gran Arco de Triunfo que aún hoy sirve de entrada.\n\nHoy el castillo es la sede del Museo Cívico: el recorrido incluye la pinacoteca en la primera planta, la Sala de los Barones, la Capilla Palatina, llamada también de Santa Bárbara, y un recorrido arqueológico por la antigua Armería.","con":"Entrada completa 10 euros; 6 euros para residentes en Nápoles y en la ciudad metropolitana; gratis para menores de 18 años. Cerrado los domingos.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"El Maschio Angioino con las dos torres y el arco blanco en medio","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Las dos grandes torres y, en medio, el Arco de Triunfo de Alfonso de Aragón: es la entrada del castillo."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"El Arco de Triunfo","x":"Es la entrada del castillo, encajada entre dos torres: Alfonso I de Aragón la quiso para celebrar su entrada victoriosa en Nápoles. Detente delante antes de entrar y mírala desde abajo.","d":"En la entrada, entre la Torre del Medio y la Torre de la Guardia","foto":{"u":"../img/91d08c9a9561.jpg","alt":"El Arco de Triunfo de mármol entre las dos torres","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"El arco de cerca: míralo desde abajo, piso por piso."}},{"t":"La puerta con la bala de cañón","x":"Ferrante d'Aragona la encargó a Guglielmo Monaco hacia 1475, para recordar la victoria de 1462 sobre Juan de Anjou y los barones rebeldes: seis recuadros narran la guerra. En el panel inferior izquierdo todavía hay una bala de cañón de hierro clavada en el bronce. La hipótesis más aceptada: la puerta formaba parte del botín que Carlos VIII cargó en los barcos rumbo a Francia; frente a Rapallo la flota fue atacada por los genoveses y el disparo la alcanzó. Los genoveses la devolvieron a Nápoles en 1495.","d":"El original se conserva en el interior del castillo","foto":{"u":"../img/50ee03911e6d.jpg","alt":"La bala de cañón clavada en la puerta de bronce","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La bala de cañón de hierro clavada en el bronce, en el panel inferior izquierdo."}},{"t":"La Sala de los Barones","x":"Se llega por la escalera exterior de piperno del arquitecto mallorquín Guillermo Sagrera. Levanta la vista: la bóveda se eleva a unos 28 metros y dieciséis nervaduras de piperno parten en forma de estrella desde una abertura central. El nombre recuerda 1486, cuando el rey Ferrante I invitó con engaños a los barones a celebrar una boda y aquí los hizo arrestar. Durante cincuenta años fue la sede del Ayuntamiento.","d":"En lo alto de la escalera del patio","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La bóveda estrellada de la Sala de los Barones","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La bóveda de la Sala de los Barones: dieciséis nervios de piperno parten en forma de estrella desde la abertura central."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Un túnel querido por un rey como vía de escape, convertido en refugio antiaéreo y después en depósito: un viaje bajo la colina de Pizzofalcone.","rac":"La Galleria Borbonica fue ordenada por Fernando II de Borbón mediante decreto del 19 de febrero de 1853 y proyectada por el arquitecto Errico Alvino. Debía conectar el Palacio Real con la Piazza della Vittoria y los cuarteles, pasando bajo la colina de Pizzofalcone: una vía de escape rápida para el rey. Las obras se interrumpieron por falta de fondos y después por los cambios políticos de la Unidad de Italia.\n\nDurante la Segunda Guerra Mundial, algunos espacios se usaron como refugio antiaéreo. En la posguerra, hasta los años setenta, la galería fue el depósito judicial del Ayuntamiento de Nápoles: aún hoy se ven fragmentos de estatuas, coches y motos de época. La Associazione Culturale Borbonica Sotterranea la ha limpiado y ofrece visitas guiadas.\n\nEl Recorrido Estándar dura aproximadamente una hora y puede iniciarse desde dos entradas: via Domenico Morelli 61 y Vico del Grottone 4, a unos 100 metros de Piazza del Plebiscito. También hay recorridos más aventureros.","con":"Reserva: la reserva es obligatoria. El tour estándar sale a las 10, 12, 15 y 17 h los viernes, sábados, domingos y festivos. Se pueden hacer fotos.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"Un túnel excavado en la toba en la Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Un tramo de la Galleria Borbonica, excavada en la toba."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Recorrido Estándar: visitas a las 10:00, 12:00, 15:00 y 17:00 (viernes, sábado, domingo y festivos). Reserva obligatoria, duración aproximada de 1 hora. Entradas: via Domenico Morelli 61 y Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"El túnel borbónico","x":"Es la parte que cuenta la ambición de Fernando II: un largo pasadizo de toba amarilla, proyectado para conectar el Palacio Real con la Piazza della Vittoria. La toba también cuenta el trabajo de los canteros y la ingeniería hidráulica de la época.","d":"A lo largo del recorrido principal","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"Un pasadizo excavado en la toba de la Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"El paso de los poceros, un tramo de la Galleria Borbonica excavado en la toba."}},{"t":"El refugio antiaéreo","x":"Entre 1939 y 1945, miles de personas se refugiaron aquí de los bombardeos. Se conservan camas, grafitis y objetos de la vida cotidiana de la época. Es la parte que más impresiona a quienes visitan el lugar.","d":"En las salas del refugio","foto":{"u":"../img/3200f06943d2.jpg","alt":"El refugio antiaéreo de la Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"El refugio antiaéreo de la Segunda Guerra Mundial."}},{"t":"Coches y motos de época","x":"En la posguerra la galería se usó como depósito judicial de vehículos incautados: todavía hoy se ven coches y motos de época a lo largo del recorrido.","d":"A lo largo del recorrido","foto":{"u":"../img/87eab52966bc.jpg","alt":"Coches de época abandonados en el túnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Coches de época a lo largo del túnel: la posguerra, cuando la galería era un depósito judicial."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Paseo marítimo y Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"El castillo del islote donde desembarcaron los colonos griegos llegados de Cumas: se llega desde el paseo marítimo, se cruza el puente y se contempla el golfo desde el Borgo Marinari.","rac":"El castillo se alza sobre el islote de Megaride, formado por dos peñascos unidos por un gran arco. Aquí, a mediados del siglo VII a. C., desembarcaron los colonos llegados de Cumas, que después fundaron Partenope en el cercano monte Echia.\n\nEn el siglo I a. C., en el islote y en el monte Echia se levantaba la villa de Lucio Licinio Lúculo. En la Sala de las Columnas se conservan algunos restos: en la alta Edad Media la sala fue el refectorio de uno de los conventos construidos en el islote.","con":"El interior del castillo está cerrado por obras hasta nuevo aviso: hoy se visita desde fuera, paseando por el paseo marítimo y alrededor del Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"El Castel dell'Ovo sobre el mar, con el cielo azul","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"El Castel dell'Ovo en el islote de Megaride, unido al paseo marítimo por un puente."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Reserva opcional."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"El islote de Megaride","x":"Desde el paseo marítimo, mira el castillo: se asienta sobre el islote de Megaride, formado por dos peñascos unidos por un gran arco. Aquí, hacia mediados del siglo VII a. C., desembarcaron los cumanos, de origen griego, que más tarde fundaron la ciudad de Partenope en el cercano Monte Echia.\n\nEn el siglo I a. C., en época romana, en el islote y en el Monte Echia se levantó la célebre villa de Lucio Licinio Lúculo; se conservan los tambores de columnas de la llamada «Sala de las Columnas».\n\nEl nombre procede de una leyenda: el poeta Virgilio habría escondido un huevo en una jaula en los subterráneos, y de su integridad dependería el destino del castillo y de toda Nápoles. Cuando, en tiempos de la reina Juana I, se derrumbó el arco entre los dos peñascos, la reina tuvo que declarar que había sustituido el huevo para calmar a la ciudad.","d":"Desde el puente que lleva al Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"El Castel dell'Ovo y el pequeño puerto del Borgo Marinari vistos desde arriba","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Desde arriba: el castillo sobre el peñón y, a su lado, el pequeño puerto del Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Grabado de 1841 con el Castel dell'Ovo y un barco de vela","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"El Castel dell'Ovo en un grabado de 1841."}],"leg":"El nombre procede de una leyenda: el poeta Virgilio habría escondido un huevo, encerrado en una jaula, en los subterráneos del castillo.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Rione Sanità y basílica de Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Un barrio popular renacido desde abajo: la basílica del «Monacone», las catacumbas, Totò y los murales.","rac":"El Rione Sanità es uno de los barrios más antiguos y populares de Nápoles: durante siglos fue lugar de sepulturas y hoy es un modelo de renacimiento surgido desde abajo, con cooperativas de jóvenes que gestionan las catacumbas y las visitas.\n\nEn el centro se encuentra la basílica de Santa Maria della Sanità, construida entre 1602 y 1610 según el proyecto de Fra Nuvolo, uno de los mayores ejemplos del barroco napolitano. Se la conoce como San Vincenzo o «'o Munacone», por la gran estatua de san Vicente Ferrer que alberga. Su planta es de cruz griega y la cúpula está revestida de mayólicas. Bajo la iglesia se encuentran las catacumbas de San Gaudioso, del siglo IV.\n\nEn el barrio nació el actor Totò, en la via Santa Maria Antesaecula, y lo recuerdan murales por todo el barrio. Aquí se ambienta también la comedia «El alcalde del rione Sanità», de Eduardo De Filippo.","con":"Visita el barrio de día y con calma: las catacumbas, la basílica y el Cementerio de las Fontanelle están muy cerca. Puedes combinarlo todo con la Milla Sagrada del domingo.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"La basílica de Santa Maria della Sanità, con su cúpula","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"La basílica de Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basílica. Puede cerrar en algunas fechas: consulta el sitio web."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"La basílica del Monacone","x":"La iglesia de Fra Nuvolo tiene planta de cruz griega y una cúpula revestida de mayólicas. El presbiterio está elevado y el altar barroco tiene una doble escalera. La estatua de san Vicente Ferrer, el «Monacone», da a la basílica su nombre popular.","d":"En la Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"El presbiterio elevado con la doble escalera en la basílica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"El presbiterio elevado de la basílica de Santa Maria della Sanità, con la doble escalera."}},{"t":"Las catacumbas de San Gaudioso","x":"Bajo la basílica se encuentran las catacumbas de San Gaudioso, del siglo IV. Se accede a ellas desde la iglesia.","d":"Bajo la basílica","foto":{"u":"../img/30e6de57bd17.jpg","alt":"Las catacumbas de San Gaudioso bajo la basílica","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Las catacumbas de San Gaudioso, bajo la basílica."}},{"t":"Totò y los murales","x":"En las calles cercanas, y en la vía Santa Maria Antesaecula donde nació Totò, murales y pequeñas imágenes recuerdan al actor y las historias del barrio.","d":"En los callejones alrededor de la plaza","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacumbas de San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Las catacumbas más extensas del sur de Italia: galerías en la toba en dos niveles y la tumba original de San Gennaro, patrón de Nápoles.","rac":"Las Catacumbas de San Gennaro se encuentran en el Rione Sanità, con entrada en la Via Capodimonte 13, junto a la Basilica del Buon Consiglio. Su origen se remonta al siglo II d. C., cuando una rica familia romana donó su sepulcro a la comunidad cristiana. El complejo se desarrolla en dos niveles excavados en la toba: San Gennaro superior y San Gennaro inferior.\n\nAquí fue sepultado San Gennaro, y durante siglos el lugar fue meta de peregrinación. Hasta el siglo IX sus reliquias permanecieron aquí; después fueron trasladadas y el sitio quedó abandonado. Hoy solo se visita con guía, durante aproximadamente una hora. Desde 2009, un sistema de iluminación LED, realizado por Officina dei Talenti, la cooperativa de jóvenes del barrio, ilumina los frescos con una luz tenue.\n\nEl sitio está gestionado por la cooperativa social La Paranza, nacida de jóvenes del Rione Sanità.","con":"Reserva con antelación: las visitas son solo guiadas, salen cada hora y la reserva es obligatoria. La Milla Sagrada, un recorrido guiado por el Rione Sanità, sale a las 9:30 los sábados, domingos y festivos. Las catacumbas cierran los miércoles.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"Un fresco paleocristiano en las catacumbas de San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Un fresco paleocristiano en las catacumbas de San Gennaro."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Visitas guiadas cada hora, reserva siempre obligatoria. Cerrado los miércoles y el 25 de diciembre."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"La tumba de San Gennaro","x":"Es la tumba que da nombre a todo el sistema de catacumbas: aquí fue sepultado el patrón de Nápoles. Sus reliquias permanecieron aquí hasta el siglo IX.","d":"En el recorrido guiado","foto":{"u":"../img/fd273aee226d.jpg","alt":"La tumba de San Gennaro en las catacumbas","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"La tumba de San Gennaro, el lugar que da nombre a las catacumbas."}},{"t":"Los dos niveles","x":"Las galerías están excavadas en la toba en dos niveles, el superior y el inferior, con grandes pasillos y frescos paleocristianos.","d":"Durante la visita guiada","foto":{"u":"../img/537a160d9acb.jpg","alt":"Una galería excavada en la toba con tumbas en las paredes","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Las galerías de las catacumbas, excavadas en la toba."}},{"t":"La Milla Sagrada","x":"Los sábados, domingos y festivos, un recorrido guiado de unas tres horas visita los lugares vinculados a San Gennaro en el Rione Sanità. Sale a las 9:30 y hay que reservarlo en el sitio web oficial.","d":"Desde el punto de encuentro de las catacumbas","foto":{"u":"../img/0becd922c42f.jpg","alt":"La fachada de un edificio del Rione Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"El Rione Sanità, donde la Milla Sagrada recorre los lugares vinculados a San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Cementerio de las Fontanelle","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"Una cantera de toba grande como una catedral, miles de cráneos sin nombre y el culto de las anime pezzentelle. Reabierto en 2026.","rac":"En el siglo XVI era una cantera de toba, en el valle de la Sanità. Durante la peste de 1656 se trasladaron aquí muchas víctimas, y después las del cólera de 1836-1837; en 1872 el canónigo Gaetano Barbati dispuso los restos en tres grandes naves. El espacio ocupa unos cuatro mil metros cuadrados.\n\nAquí nació el culto de las anime pezzentelle: los devotos adoptaban un cráneo, una capuzzella, lo cuidaban y le rezaban, esperando a cambio protección y, a veces, un sueño con los números de la lotería. En 1969 un decreto del tribunal eclesiástico cerró el osario y prohibió el culto. Cerrado por obras desde 2020, reabrió al público en 2026, gestionado por la cooperativa La Paranza.","con":"Cierra los miércoles. Descarga la aplicación del cementerio antes de llegar: en el interior la señal del teléfono es débil.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"Las grandes galerías de toba del Cementerio de las Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Las galerías de toba del Cementerio de las Fontanelle."},"ov":false,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Cerrado en Navidad. Lunes y viernes de 9 a 10 abierto solo para el culto"}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Una cantera grande como una catedral","x":"El cementerio ocupa una antigua cantera de toba de unos cuatro mil metros cuadrados, organizada en tres grandes naves en 1872 por el canónigo Gaetano Barbati. Allí se llevaron los muertos de la peste de 1656 y del cólera de 1836-1837.","d":"En las tres naves","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"Una nave del Cementerio de Fontanelle excavada en la toba","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"Una de las tres naves del Cementerio de Fontanelle, en la antigua cantera de toba."}},{"t":"El culto a las anime pezzentelle","x":"Los devotos adoptaban una calavera, la capuzzella, la cuidaban y le rezaban, esperando a cambio protección, a veces un sueño con los números de la lotería. En 1969 el tribunal eclesiástico prohibió el culto y cerró el osario.","d":"Frente a las filas de calaveras","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Filas de calaveras con una cruz","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Las capuzzelle: calaveras sin nombre, adoptadas y cuidadas por los devotos."}},{"t":"Las Fontanelle en el MADRE","x":"La artista Rebecca Horn reprodujo en hierro fundido algunas capuzzelle de las Fontanelle en la obra «Spirits», que puede verse en el museo MADRE: una forma de entender cómo el cementerio ha entrado también en el arte contemporáneo.","d":"En el museo MADRE (ficha aparte)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Cartuja y Museo de San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Un monasterio cartujo convertido en museo, en la colina del Vomero: un claustro barroco, el belén Cuciniello y uno de los panoramas más bellos sobre el golfo.","rac":"La Certosa di San Martino se alza sobre la colina del Vomero, junto a Castel Sant'Elmo. Fue fundada en 1325 por Carlos de Calabria, hijo del rey Roberto de Anjou, y encomendada a Tino di Camaino. Entre los siglos XVI y XVIII se convirtió en uno de los ejemplos más refinados del arte barroco italiano: de 1623 a 1656 Cosimo Fanzago renovó sus estancias. Desde 1866, tras la supresión de las órdenes religiosas, alberga el Museo nazionale di San Martino, impulsado por Giuseppe Fiorelli.\n\nEl Chiostro Grande, ampliado desde 1581 por Giovanni Antonio Dosio y completado por Fanzago, tiene en el centro el cementerio de los monjes. El museo custodia la principal colección pública italiana dedicada al belén napolitano, con el grandioso Presepe Cuciniello: unas ochocientas figuras, animales y accesorios donados por el coleccionista Michele Cuciniello, inaugurado en 1879. Otras secciones narran la marinería del Reino, el teatro, la ciudad y el Reino en imágenes y, desde diciembre de 2025, el siglo XIX en Nápoles. Aquí se encuentra también la Tavola Strozzi, considerada la primera pintura de Nápoles.","con":"Sal a las terrazas y a la Loggia del Priore: desde aquí se ve todo el golfo. Está abierto todos los días excepto los martes; la última entrada es a las 17:30.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"El claustro grande de la Cartuja de San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"El claustro grande de la Cartuja de San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Cerrado los martes. Algunas secciones (naval, belenista, Nápoles en el siglo XIX) abren a las 9:30; los jardines cierran una hora antes."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"El Claustro Grande","x":"Ampliado desde 1581 por Giovanni Antonio Dosio y completado por Cosimo Fanzago, tiene en el centro el cementerio de los monjes. A lo largo del perímetro se ven todavía las puertas y los pasaplatos de las celdas de los cartujos.","d":"En el corazón de la Cartuja","foto":{"u":"../img/e43efae68626.jpg","alt":"El Claustro Grande de la Cartuja con el cementerio de los monjes","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"El Claustro Grande de la Cartuja de San Martino, con el pequeño cementerio de los monjes en el centro."}},{"t":"El Belén Cuciniello","x":"Con unas ochocientas piezas, es el belén más famoso de Nápoles. Fue donado por Michele Cuciniello e inaugurado en 1879. Un sistema de iluminación simula las horas del día.","d":"En la sección de belenes, donde estaban las cocinas","foto":{"u":"../img/ae5327fcce50.jpg","alt":"El gran belén con cientos de figuras","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"El Belén Cuciniello, con unas ochocientas piezas."}},{"t":"La vista sobre el golfo","x":"Desde las terrazas y los jardines de la Cartuja se ve todo el golfo de Nápoles, con el Vesubio al fondo.","d":"En las terrazas y en los jardines","foto":{"u":"../img/81d0fb825e80.jpg","alt":"El golfo de Nápoles visto desde un balcón de la Cartuja","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"El golfo y el Vesubio desde un balcón de la Cartuja de San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant’Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La fortaleza en forma de estrella en la colina del Vomero: baluartes con vista de 360° sobre Nápoles y el golfo, y en su interior el Museo Novecento.","rac":"Castel Sant'Elmo domina el Vomero a unos 250 metros sobre el nivel del mar y es visible desde casi toda la ciudad. Las primeras noticias lo señalan, hacia 1275, como una residencia fortificada angevina llamada Belforte; en 1329 Roberto de Anjou quiso su ampliación, encomendada a Tino di Camaino. La planta en forma de estrella de seis puntas es, en cambio, el resultado de la reconstrucción del siglo XVI, ordenada entre 1537 y 1547 por el virrey Pedro de Toledo, según el proyecto del arquitecto militar Pedro Luis Escrivà.\n\nA lo largo de los siglos fue a menudo una cárcel: aquí estuvieron encerrados Tommaso Campanella y, más tarde, patriotas de la República napolitana de 1799 como Gennaro Serra, Mario Pagano y Luisa Sanfelice. Tras ser presidio borbónico fue cárcel militar hasta 1952; una gran restauración comenzó en 1976.\n\nEn la plaza de armas, desde 2010, se encuentra el Museo Novecento a Napoli: más de 170 obras de unos 90 artistas napolitanos o activos en la ciudad entre 1910 y 1980. Algunas obras se crearon expresamente para el castillo: en la gran cisterna Gian Maria Tosatti hizo crecer un campo de trigo, y sobre los baluartes se recorta la escultura de aluminio «Sant'Elmo» de Mimmo Paladino.\n\nDesde los bastiones el panorama llega desde las islas hasta el Vesubio, desde los Campos Flegreos hasta los montes del Matese.","con":"Sube hacia el atardecer para disfrutar del panorama. El castillo está junto a la Certosa di San Martino: se pueden visitar en la misma mañana. El castillo cierra los martes y, con mal tiempo, puede permanecer cerrado.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Las altas murallas de toba de Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Las murallas de Castel Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castillo 8:30-19:30; Museo Novecento 9:30-18:30 (última entrada 17:30). Cerrado los martes. Con mal tiempo el sitio puede permanecer cerrado."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"Los baluartes y el panorama","x":"Los baluartes ofrecen un panorama de 360° sobre la ciudad, el golfo, el Vesubio y la costa de Posillipo, de los más completos de Nápoles.","d":"En las murallas","foto":{"u":"../img/81edfbd30506.jpg","alt":"Nápoles y el Vesubio vistos desde lo alto del Castel Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Desde los baluartes del Castel Sant'Elmo: la ciudad, el puerto y el Vesubio."}},{"t":"El Museo Novecento en Nápoles","x":"Inaugurado en 2010 en la plaza de armas, reúne más de 170 obras de unos 90 artistas napolitanos o activos en la ciudad, realizadas a partir de 1910: del Futurismo a la Transvanguardia de los años ochenta.","d":"En la plaza de armas del castillo","foto":{"u":"../img/d585126c2db4.jpg","alt":"Una sala del Museo Novecento con obras de arte","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Una sala del Museo Novecento en Nápoles, dentro del Castel Sant'Elmo."}},{"t":"Un campo de trigo en la cisterna","x":"La obra «My dreams, they'll never surrender» de Gian Maria Tosatti (2014) es un campo de trigo crecido en la cisterna, el lugar más oscuro y profundo del castillo, que fue también cárcel.","d":"En la gran cisterna","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"El primer paseo","sub":"Spaccanapoli en media jornada, partiendo de Ceraldi","desc":"El corazón del centro histórico en un recorrido circular a pie: el Gesù Nuovo y su misterio, el claustro de Santa Chiara, el Cristo velado, la iglesia del cráneo con orejas, los talleres de via San Biagio dei Librai. Y se vuelve con nosotros.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista desde arriba: una calle recta que atraviesa el centro histórico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista desde arriba: la larga calle recta que divide en dos el centro histórico. El primer recorrido la sigue a pie."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café en Ceraldi y nos ponemos en marcha.","q":null,"alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","q":null,"alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25008,40.84665],[14.25047,40.84678],[14.25086,40.84691],[14.25124,40.84703],[14.25122,40.84707],[14.25144,40.84714],[14.2517,40.84724],[14.252,40.84733]],"sv":[{"k":"parti","n":"Piazza Carità","d":242,"a":0},{"k":"gira"," unto de recorrer conserva todavía el trazado de calles diseñado por los griegos. Durante más de medio milenio fue la capital del sur de Italia.\n\nEstos trece capítulos le acompañan desde la leyenda hasta la ciudad de hoy. Cada vez que el relato encuentra un lugar de la guía, encontrará un botón para ir hasta allí.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"El Castel dell'Ovo en una vista de 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"El Castel dell'Ovo en una vista de 1841: el islote donde nació Partenope."},"cap":[{"p":"La leyenda","t":"La sirena Partenope","x":"Todo comienza con una sirena. En el mito griego, las sirenas eran criaturas con cuerpo de pájaro y cabeza de mujer, dueñas de un canto mágico. Una de ellas se llamaba Partenope.\n\nEl relato más famoso dice que, cuando Ulises pasó frente a su roca sin ceder al canto, las sirenas, por el dolor, se arrojaron al mar. Las olas llevaron el cuerpo de Partenope hasta la costa, a la desembocadura de un pequeño río, el Sebeto: justo donde nacería la ciudad.\n\nAllí se le construyó una tumba y los griegos de Nápoles le dedicaban cada año sacrificios y una carrera de antorchas. Aún hoy los napolitanos se llaman a sí mismos «partenopei».","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"La fuente con la sirena Partenope en la plaza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"La fuente de la Sirena en la plaza Sannazaro: Partenope con la lira."}},{"p":"Siglos VIII–VII a. C.","t":"Partenope, la primera ciudad","x":"La leyenda tiene un fondo de verdad. Entre los siglos VIII y VII a. C., los griegos de Cumas, la colonia griega más antigua de la zona, fundaron un pequeño puerto comercial junto al mar y lo llamaron como la sirena: Partenope.\n\nSe alzaba sobre la colina de Pizzofalcone, el Monte Echia, en un espolón rodeado por el mar, y tenía su fondeadero en el islote de Megaride, donde hoy se encuentra el Castel dell'Ovo. El puerto estaba en la actual plaza Municipio. La necrópolis de Partenope fue descubierta en 1949 en la vía Nicotera.\n\nLa pequeña ciudad creció tan deprisa que Cumas, por miedo a perder el mando, redujo su papel.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"El Castel dell'Ovo sobre el mar, con el cielo azul","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"El Castel dell'Ovo en el islote de Megaride, unido al paseo marítimo por un puente."}},{"p":"Siglo V a. C.","t":"Neapolis, la ciudad nueva","x":"Junto a Partenope, un poco más al este, los cumanos fundaron una ciudad nueva: Neapolis, la «ciudad nueva». La UNESCO fecha la fundación hacia el 470 a. C., en el período en que los griegos habían derrotado a los etruscos en el mar.\n\nNeapolis se construyó según un trazado regular: tres calles principales paralelas (las «plateiai», llamadas después decumani), cruzadas en ángulo recto por calles más pequeñas. El ágora, la plaza principal, estaba donde hoy se encuentra la plaza San Gaetano.\n\nEsa retícula sigue ahí: Spaccanapoli, la vía dei Tribunali y la vía Anticaglia son las tres calles griegas. Al caminar por ellas, caminas por el plano de la ciudad de hace 2500 años.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"Los grandes bloques de toba de las murallas griegas, excavados bajo el nivel de la calle","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"Los bloques de toba de las murallas griegas de Neapolis, en la plaza Bellini, visibles en una excavación bajo el nivel de la calle."}},{"p":"326 a. C. – siglo V d. C.","t":"Griega bajo Roma","x":"En el 326 a. C. Neapolis se alió con Roma y durante siglos siguió siendo una ciudad griega dentro del mundo romano: fue una de las pocas que conservó la lengua y la cultura griegas. Se convirtió en un lugar querido por los romanos cultos y ricos, que construían villas en el golfo: en el islote de Megaride se levantó la de Lucio Licinio Luculo.\n\nEn el 79 d. C. la erupción del Vesubio destruyó Pompeya y Herculano, no muy lejos. En el 476, precisamente en la villa de Luculo, fortificada, fue encerrado Rómulo Augústulo, el último emperador romano de Occidente: con él terminaba el Imperio.\n\nBajo la ciudad greco-romana ya corría el agua de las cisternas que hoy se visitan en Napoli Sotterranea, y en el teatro de Neapolis actuó el emperador Nerón.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una gran cisterna subterránea excavada en la toba, poco iluminada","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una de las grandes cisternas excavadas en la toba, a unos 40 metros bajo la vía dei Tribunali."}},{"p":"Siglos VI–XII","t":"El ducado de Nápoles","x":"Tras el fin del Imperio, en el siglo VI, Nápoles pasó a los bizantinos, los romanos de Oriente. Poco a poco se convirtió en un ducado casi independiente: en el siglo VIII el duque Esteban II se hizo, de hecho, su señor.\n\nDurante cinco siglos el ducado resistió a los longobardos y a los sarracenos. En 1030 el duque Sergio IV entregó el condado de Aversa a un grupo de mercenarios normandos: fue el comienzo de su ascenso en el Sur. En 1137 Nápoles se sometió a los normandos y entró en el nuevo Reino de Sicilia.\n\nDe aquellos años lejanos quedan las iglesias más antiguas, como Santa Restituta y el baptisterio de San Giovanni in Fonte, dentro de la catedral, considerado el más antiguo de Occidente.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"El interior de la basílica de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, la basílica paleocristiana integrada en la catedral: la Nápoles anterior al ducado."}},{"p":"1194–1266","t":"Normandos y suabos: nace la Universidad","x":"Después de los normandos llegaron los suabos. En 1194 el emperador Enrique VI ocupó la ciudad y mandó derribar sus murallas.\n\nSu hijo, Federico II, era un soberano apasionado por la cultura y el derecho. En 1224 fundó en Nápoles el «Studio», una de las primeras universidades estatales de Europa: es la actual Universidad Federico II, que todavía lleva su nombre.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La estatua de Federico II de Suabia en la fachada del Palacio Real","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La estatua de Federico II de Suabia, una de las de la fachada del Palacio Real."}},{"p":"1266–1442","t":"Los angevinos: Nápoles capital","x":"En 1266 el papa confió el reino a Carlos I de Anjou, hermano del rey de Francia, que entró en la ciudad en triunfo. Tras la revuelta de las Vísperas sicilianas de 1282, Sicilia se separó y Nápoles se convirtió en la capital del reino: lo seguirá siendo durante siglos.\n\nLos angevinos construyeron el Castel Nuovo, la catedral (desde 1294) y la ciudadela de Santa Chiara (desde 1310), y la ciudad se expandió. En la corte de Roberto de Anjou, en el Castel Nuovo, residieron Giotto, Petrarca y Boccaccio.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"La entrada del claustro de Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"La entrada del claustro de mayólica de Santa Chiara."}},{"p":"1442–1503","t":"Los aragoneses","x":"En 1442 Alfonso de Aragón conquistó Nápoles: según la tradición, sus hombres entraron en la ciudad por un acueducto. Hizo del Castel Nuovo su palacio real, lo reconstruyó y, para celebrar la victoria, añadió el gran Arco de Triunfo entre dos torres.\n\nLos aragoneses transformaron el castillo medieval en una fortaleza moderna y renovaron las defensas y las calles de la ciudad. Su hijo Ferrante derrotó a los barones rebeldes: la puerta de bronce del castillo cuenta aquella guerra, y en la Sala de los Barones se consumó su venganza.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi: la Nápoles aragonesa vista desde el mar, con el Maschio Angioino y el Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (siglo XV): Nápoles vista desde el mar, con el puerto, el Castel Nuovo y, en lo alto, la colina de Sant'Elmo."}},{"p":"1503–1707","t":"El virreinato español","x":"Desde 1503 Nápoles pasó a España y fue gobernada por un virrey. Sin un rey presente, era de todos modos una capital imperial, con una de las cortes más grandiosas de los dominios españoles. El virrey don Pedro de Toledo duplicó la ciudad, abrió la vía Toledo y construyó los barrios para los soldados, los Quartieri Spagnoli. En estos años se construyó también el Palacio Real.\n\nEn 1606 llegó a Nápoles, huyendo de Roma, Caravaggio: su pintura cambió el arte de la ciudad, que en el siglo XVII se convirtió en una de las capitales del barroco europeo.\n\nFueron también años durísimos: impuestos altísimos, la erupción del Vesubio de 1631 y, en 1656, una peste que mató a más de la mitad de los habitantes.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste de 1656: cuerpos amontonados en la plaza y figuras celestes en el cielo","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste de 1656, pintado por Micco Spadaro: la plaza está llena de muertos y moribundos."}},{"p":"1647","t":"Masaniello","x":"El 7 de julio de 1647, tras un nuevo impuesto, esta vez sobre la fruta, el alimento de los más pobres, un pescador de 27 años, Masaniello, guio al pueblo a la revuelta al grito de «Viva el rey de España, muera el mal gobierno».\n\nEn diez días los españoles tuvieron que aceptar las peticiones del pueblo. Pero Masaniello, acusado de locura y traicionado por una parte de los propios rebeldes, fue asesinado. La revuelta contra España continuó durante meses, antes de ser sofocada en 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"Un cuadro del siglo XVII con la multitud sublevada en la plaza del Mercado","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"La plaza del Mercado durante la revuelta de Masaniello, cuadro de Domenico Gargiulo, llamado Micco Spadaro."}},{"p":"1734–1799","t":"Los Borbones y la República","x":"En 1734 Carlos de Borbón devolvió a Nápoles un rey propio y quiso hacer de ella una gran capital europea. En 1737 hizo construir en solo siete meses el Teatro di San Carlo; después, los palacios reales de Portici y de Capodimonte. En esos años comenzaron también las excavaciones de Herculano y de Pompeya.\n\nNápoles era una de las capitales de la Ilustración. En enero de 1799, con la llegada del ejército francés, los patriotas proclamaron la República Napolitana: duró solo hasta junio. Con el regreso de los Borbones, muchos de sus protagonistas fueron ajusticiados.\n\nTras los años de los franceses (José Bonaparte y Joaquín Murat), en 1815 volvieron los Borbones, y en 1816 nació el Reino de las Dos Sicilias.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Retrato de Carlos de Borbón con armadura","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Carlos de Borbón retratado por Anton Raphael Mengs."}},{"p":"1860–1945","t":"La Italia unida y la guerra","x":"El 7 de septiembre de 1860 Giuseppe Garibaldi entró en Nápoles aclamado por la multitud; un plebiscito selló la unión con el Reino de Italia. Nápoles dejó de ser una capital, y la pérdida fue dura.\n\nEn la Segunda Guerra Mundial la ciudad sufrió más de 120 bombardeos aéreos, sobre todo por su puerto; la gente se refugiaba en las cisternas subterráneas. Tras el armisticio, los alemanes ocuparon la ciudad. A finales de septiembre de 1943 los napolitanos se sublevaron: en las «Cuatro jornadas de Nápoles» el pueblo obligó a rendirse a la guarnición alemana. El 1 de octubre llegaron los Aliados.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Un grabado de época: Garibaldi aclamado por la multitud en Nápoles","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Grabado de época de la entrada de Garibaldi en Nápoles, en 1860: la multitud lo aclama en la via Toledo."}},{"p":"De 1945 a hoy","t":"El Nápoles de hoy","x":"Tras la guerra, la ciudad se reconstruyó entre grandes dificultades. En 1995 la UNESCO inscribió el centro histórico en la lista del Patrimonio de la Humanidad: es el más grande de Italia y uno de los más extensos de Europa.\n\nDesde 2001 el metro ha abierto sus «estaciones del arte», con obras de artistas contemporáneos. La ciudad cuenta con unos 950.000 habitantes, más de tres millones con el área metropolitana.\n\nY luego está el Nápoles que verás caminando: los murales, como el de Maradona en los Barrios Españoles, y la Madonna de Banksy, la vida de los callejones, el café. Tres mil años de historia, uno encima de otro, en pocos kilómetros.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"El centro histórico de Nápoles visto desde arriba","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"El centro histórico visto desde arriba: Patrimonio de la Humanidad de la UNESCO desde 1995."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio en Nápoles","sub":"Un pintor en fuga y tres obras maestras que ver","som":"En fuga de Roma, Caravaggio encontró refugio en Nápoles dos veces. Aquí pintó las Siete Obras de Misericordia, la Flagelación y su último cuadro.","txt":"Michelangelo Merisi, llamado Caravaggio, era en Roma un pintor famoso y controvertido. En los últimos días de mayo de 1606 hirió de muerte a Ranuccio Tomassoni en una riña surgida durante una partida de pelota con raqueta; condenado, tuvo que huir.\n\nNápoles, entonces una de las ciudades más grandes de Europa, fue su refugio dos veces: desde el otoño de 1606 hasta el verano de 1607, y después desde el otoño de 1609 hasta el verano de 1610. Aquí encontró la protección de la familia Colonna y de clientes ricos, y aquí su pintura cambió para siempre el arte de la ciudad.\n\nTres de sus obras pueden verse hoy en Nápoles, dos de ellas en nuestro recorrido.","foto":{"u":"../img/da8045021e55.jpg","alt":"Las Siete Obras de Misericordia de Caravaggio","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Las Siete Obras de Misericordia, pintadas por Caravaggio en Nápoles."},"cap":[{"p":"1606–1607","t":"La primera estancia y las Siete obras","x":"El primer encargo napolitano documentado es de octubre de 1606. Pocos meses después, antes del 9 de enero de 1607, Caravaggio entregó al Pio Monte della Misericordia el gran lienzo de las Siete obras de misericordia, pagado con 400 ducados.\n\nSigue allí, en el altar para el que fue pintado, en la via dei Tribunali: una noche en un callejón de Nápoles, donde los hombres se ayudan entre sí bajo la mirada de la Virgen.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Las Siete obras de misericordia de Caravaggio: escenas callejeras en una noche oscura","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Las Siete obras de misericordia de Caravaggio (1607): toda la escena, con las personas abajo y la Virgen con el Niño arriba."}},{"p":"1607","t":"La Flagelación","x":"Para la familia de Franchis, juristas y magistrados, Caravaggio pintó en 1607 la Flagelación de Cristo, destinada a su capilla en la iglesia de San Domenico Maggiore: un lienzo de casi tres metros de alto, una de las obras maestras del barroco napolitano.\n\nHoy el original está en el Museo de Capodimonte, adonde fue trasladado por motivos de seguridad; en San Domenico Maggiore quedó una copia. Capodimonte queda fuera de nuestros recorridos a pie.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La Flagelación de Cristo de Caravaggio: Jesús atado a la columna entre los verdugos","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagelación de Cristo (1607), hoy en el Museo de Capodimonte: la luz cae sobre el cuerpo de Jesús, atado a la columna."}},{"p":"1607–1609","t":"Malta y Sicilia","x":"El 12-13 de julio de 1607 Caravaggio llegó a Malta, probablemente a bordo de una galera de los Caballeros procedente de Nápoles. Pero también allí se metió en problemas: tras una pelea fue arrestado en agosto de 1608, huyó del fuerte en el que estaba encerrado y se refugió en Sicilia, en Siracusa.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"La Decapitación de san Juan Bautista de Caravaggio","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"La Decapitación de san Juan Bautista, pintada por Caravaggio en Malta y conservada en La Valeta."}},{"p":"Octubre de 1609","t":"La emboscada del Cerriglio","x":"En el otoño de 1609 regresó a Nápoles, todavía bajo la protección de los Colonna, con la esperanza de obtener el perdón del papa para poder volver a Roma.\n\nEn octubre fue agredido por cuatro hombres delante de la Osteria del Cerriglio, una famosa posada de la época, y le desfiguraron el rostro: la herida fue tan grave que en Roma se difundió el rumor de su muerte.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Retrato a tiza de Caravaggio","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio en el retrato de Ottavio Leoni, el rostro del hombre agredido en el Cerriglio."}},{"p":"1610","t":"El último cuadro","x":"En la primavera de 1610 pintó para el príncipe genovés Marcantonio Doria el Martirio de santa Úrsula: el lienzo se terminó en mayo, se entregó todavía fresco de barniz y se envió a Génova. Es el último cuadro de Caravaggio que conocemos y hoy puede verse en las Gallerie d'Italia, en la vía Toledo, a seis minutos de Ceraldi. Entre los rostros, detrás de la santa, está el suyo.\n\nEn verano partió en barco hacia Roma con algunos cuadros, con la esperanza de obtener el perdón. Fue arrestado por error en Palo, y el barco zarpó de nuevo con las pinturas. Murió en Porto Ercole el 18 de julio de 1610 (o quizá al día siguiente), a los 38 años.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"El Martirio de santa Úrsula de Caravaggio: la santa y el rey en el momento de la flecha","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"El Martirio de santa Úrsula (1610): el rey hiere a la santa con la flecha, a corta distancia."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Nápoles en cinco minutos: de la sirena a la ciudad nueva","sub":"","som":"Primero Partenope, luego Neapolis: por qué el centro histórico sigue trazado como una ciudad griega.","txt":"Nápoles nace dos veces. La primera se llama Partenope, como la sirena del mito: la fundan en el siglo VII a. C. colonos de origen griego venidos de Cumas, que arriban al islote de Megaride, donde hoy se alza el Castel dell'Ovo, y se establecen en el cercano Monte Echia.\n\nLa segunda vez, hacia el 470 a. C., junto a la ciudad vieja surge una nueva: Neapolis, «ciudad nueva» en griego. Es esta la que están recorriendo. Sus calles forman una cuadrícula regular que, después de veinticinco siglos, todavía se lee: el centro histórico de Nápoles es Patrimonio Mundial de la UNESCO precisamente porque el trazado de la ciudad griega ha seguido siendo su esqueleto.\n\nTres calles paralelas, los decumanos, cortan la ciudad de oeste a este. La más baja es Spaccanapoli: de unos dos kilómetros de largo, tan recta que vista desde arriba parece dividir la ciudad en dos, de ahí su nombre. En el centro discurre la via dei Tribunali, el decumano mayor; más arriba, la via dell'Anticaglia y la via della Sapienza, el decumano superior.\n\nDesde Piazza Carità, donde estamos desde 2002, Spaccanapoli comienza a pocos minutos a pie, en la piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"El centro histórico de Nápoles visto desde arriba","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"El centro histórico desde arriba: las calles rectas siguen siendo las de la ciudad griega."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro y la sangre que se licúa","sub":"","som":"Tres veces al año Nápoles contiene el aliento ante una ampolla. Qué ocurre, dónde, y qué dicen de ello la Iglesia y la ciencia.","txt":"En la catedral de Nápoles, en una hornacina de la Capilla del Tesoro, se custodia una ampolla con una sustancia oscura que la tradición identifica como la sangre de San Gennaro, patrón de la ciudad. Tres veces al año, el sábado anterior al primer domingo de mayo, el 19 de septiembre (día de la fiesta) y el 16 de diciembre, la ampolla se muestra a los fieles: si el contenido, normalmente sólido, se licúa, es fiesta; si permanece sólido, para muchos napolitanos es un mal presagio.\n\nLa primera noticia conocida de la licuefacción se remonta a 1389. Las reliquias no las custodia el clero, sino la Diputación de la Capilla del Tesoro de San Gennaro, una institución laica nacida en 1601, de la que forma parte también el alcalde de Nápoles.\n\nLa Iglesia mantiene una actitud prudente: habla de «hecho prodigioso», permite la devoción popular pero no lo impone como verdad de fe. Entre las explicaciones propuestas por los escépticos está la tixotropía, la propiedad de algunas sustancias que son sólidas en reposo y se vuelven líquidas si se mueven o se agitan.\n\nLo sagrado y lo profano conviven aquí desde siempre: en via Duomo, a pocos pasos de la catedral, el artista urbano Jorit pintó un San Gennaro con el rostro de un obrero.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cúpula de la Capilla del Tesoro de San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"La Capilla del Tesoro de San Gennaro en el Duomo, donde se custodia la ampolla."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Nápoles en siete tradiciones: del panaro al milagro de San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Las anime pezzentelle: cuando Nápoles adoptaba una calavera","sub":"","som":"Osarios, capuzzelle y oraciones intercambiadas por números de lotería: el culto a los muertos sin nombre.","txt":"Durante siglos, en Nápoles, los muertos sin nombre no estuvieron solos. Los llamaban anime pezzentelle: las almas pobres, muertas sin funeral y sin nadie que rezara por ellas. El nombre se vincula a «pezzente», el pobre, pero también al latín «petere», pedir para recibir: quien rezaba por ellas esperaba recibir a cambio protección y favores.\n\nEl lugar emblemático es el Cementerio de las Fontanelle, en el Rione Sanità: una cantera de toba del siglo XVI, de unos cuatro mil metros cuadrados, que acogió a las víctimas de la peste de 1656 y después a las del cólera de 1836-1837. En 1872 el canónigo Gaetano Barbati dispuso los huesos en tres naves. Los devotos «adoptaban» un cráneo, una capuzzella: lo limpiaban, lo colocaban en una pequeña urna, lo adornaban con rosarios y monedas y rezaban ante él, esperando una señal en sueños, a veces un número para jugar a la lotería. Algunos cráneos se hicieron famosos: el Capitán, con una órbita ennegrecida, protagonista de una leyenda de boda y celos; donna Concetta, de quien se dice que «suda» cuando se concede la gracia.\n\nEn 1969 un decreto del tribunal eclesiástico cerró el osario y prohibió el culto. Cerrado por obras desde 2020, el cementerio reabrió al público en 2026, gestionado por la cooperativa La Paranza.\n\nEl culto sigue vivo también bajo via dei Tribunali, en el hipogeo de Santa Maria delle Anime del Purgatorio ad Arco, la iglesia que los napolitanos llaman «'e cape 'e morte»: allí se custodia el cráneo de Lucia, un alma joven especialmente querida. Y en via San Biagio dei Librai, en la pequeña iglesia de Santa Luciella, hay un cráneo único: el que tiene orejas.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Cráneos de las anime pezzentelle","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Las capuzzelle de las anime pezzentelle."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Nápoles esotérica: un príncipe alquimista, una fachada en clave y un huevo mágico","sub":"","som":"Raimondo di Sangro, el almohadillado del Gesù Nuovo, el huevo de Virgilio, el munaciello: dónde termina la historia y empieza la leyenda.","txt":"Nápoles ama los misterios, y tiene algunos hermosísimos. El más célebre tiene un nombre: Raimondo di Sangro, príncipe de Sansevero, hombre del siglo XVIII, Gran Maestre de la masonería napolitana, inventor celoso de sus propios secretos. El mito lo acompañaba ya en vida, y fue él mismo quien lo alimentó. Benedetto Croce lo definió como la encarnación napolitana del doctor Fausto. La leyenda negra le atribuye de todo: sirvientes asesinados para estudiar sus cuerpos, incluso la ceguera infligida al escultor del Cristo velado para que no esculpiera otro. Son leyendas, y el propio museo las distingue de la historia documentada.\n\nEl Cristo velado es obra de Giuseppe Sanmartino, por encargo del príncipe: el velo transparente que cubre el cuerpo está esculpido en el mismo bloque de mármol que la estatua. En la cavidad subterránea de la capilla se encuentran las «máquinas anatómicas», dos esqueletos con el sistema circulatorio reconstruido, realizadas por el médico palermitano Giuseppe Salerno hacia 1756-1764: la leyenda habla de inyecciones misteriosas, los estudios, de cera de abeja y colorantes.\n\nNo lejos de allí, la fachada del Gesù Nuovo, nacida como palacio de los Sanseverino en 1470, está cubierta por un almohadillado en punta de pirámide de piperno oscuro. En algunas piedras se ven signos grabados: para la leyenda, un mensaje secreto; para algunos estudiosos, las marcas de los canteros; en 2011 el historiador del arte Vincenzo De Pasquale propuso leerlos como notas musicales, una partitura de unos tres cuartos de hora llamada «Enigma». Una hipótesis sugerente, no una certeza.\n\nY luego está el mar: según la leyenda, el poeta Virgilio escondió en los subterráneos de Castel dell'Ovo el huevo de la sirena Partenope. Mientras el huevo permanezca intacto, el castillo seguirá en pie.\n\nEn las casas, en cambio, habitan los espíritus de la tradición popular: el munaciello, duende encapuchado que trae suerte o travesuras según cómo se le trate, y la bella 'mbriana, espíritu bueno de la casa, que puede aparecer como una mariposa o una salamanquesa.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La fachada de puntas de diamante del Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"El almohadillado de puntas de diamante del Gesù Nuovo, la «fachada en clave»."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Nápoles hoy: las novedades","sub":"","som":"La plaza dedicada a Maradona, el arte urbano, el último Caravaggio de la vía Toledo, iglesias y osarios reabiertos: la ciudad que cambia.","txt":"Quien vuelve a Nápoles después de algunos años encuentra una ciudad que ha aprendido a contarse a sí misma.\n\nEn los Quartieri Spagnoli, a nueve minutos de nosotros, se encuentra Largo Maradona. El mural de Diego fue pintado en 1990 por Mario Filardi; con los años se fue desvaneciendo hasta casi desaparecer, luego fue restaurado gracias a Salvatore Iodice y, en el otoño de 2017, el argentino Francisco Bosoletti volvió a pintar su rostro. Tras la muerte de Maradona, el 25 de noviembre de 2020, la plaza, antes llamada de los artistas, se ha convertido en un santuario laico de altares improvisados, banderas argentinas y fotografías, tan visitado que el Ayuntamiento ha tenido que organizar el flujo de peatones.\n\nEl arte urbano ha entrado en el centro histórico: en la piazzetta dei Girolamini, protegida por un cristal, está la Madonna con la pistola de Banksy; en la Via Duomo, el San Gennaro obrero de Jorit. El portal turístico oficial de la ciudad les dedica un itinerario.\n\nEn la Via Toledo, a seis minutos de nosotros, las Gallerie d'Italia custodian el Martirio de santa Úrsula, el último lienzo pintado por Caravaggio, junto con más de quinientos vasos áticos y de la Magna Grecia.\n\nY reabren lugares que llevaban mucho tiempo cerrados: la iglesia de Santa Luciella ai Librai, abandonada durante más de treinta años, volvió a ser visitable el 5 de abril de 2019; el Cimitero delle Fontanelle reabrió en 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"El mural de Maradona en los Barrios Españoles","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, uno de los rostros de la Nápoles de hoy."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-10T13:29Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":""}],"pre":"../","menu":"https://www.ceraldicaffe.it/menu/es/"}, T = {"titolo":"Guía de Nápoles","sottotitolo":"El centro histórico a pie desde Piazza Carità","anteprima":"Versión de prueba: textos y horarios en revisión.","oggi":"Hoy en Nápoles","sciopero":"Huelga de transporte hoy","chiusi_oggi":"Cerrados hoy","tutti_aperti":"Ningún cierre conocido hoy entre los lugares con horarios verificados.","itinerari":"Itinerarios","luoghi":"Lugares","racconti":"Nápoles contada","mappa":"Mapa","piove":"¿Llueve?","piove_testo":"Lugares a cubierto, con los horarios de hoy.","piove_vuoto":"No hay lugares a cubierto disponibles en esta versión.","min":"min","km":"km","a_piedi":"a pie","da_ceraldi":"desde Ceraldi","tappe":"paradas","durata":"D
