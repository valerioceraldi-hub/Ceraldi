<script>
var D = {"lingua":"es","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità y Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"El punto de partida: Piazza Carità, en Via Toledo. Desde aquí, el centro histórico comienza a tan solo unos minutos a pie. Y aquí está Ceraldi.","rac":"Piazza Carità si affaccia su via Toledo, la grande strada che il viceré spagnolo don Pedro di Toledo fece aprire nel Cinquecento, quando raddoppiò la città e costruì, sulla collina accanto, i quartieri per i soldati: i Quartieri Spagnoli.\n\nDa qui il centro antico è a pochi minuti: sali verso piazza del Gesù e sei su Spaccanapoli. Scendendo lungo via Toledo arrivi invece a piazza del Plebiscito, al Palazzo Reale e al mare.","con":"Antes de partir, un café: la excursión es larga y Nápoles se disfruta mejor con la taza adecuada.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità oggi, con gli alberi e i palazzi colorati","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità oggi, sulla via Toledo: da qui partono tutti i giri. Ceraldi è qui."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La piazza davanti a Ceraldi","x":"Piazza Carità è il punto di partenza di tutti i giri: sei sulla via Toledo, la grande strada aperta nel Cinquecento dal viceré don Pedro di Toledo per collegare il centro antico con la nuova città e i Quartieri Spagnoli.\n\nDa qui in pochi minuti sei a Spaccanapoli, a nord-est, oppure al mare e ai castelli, a sud. Prima di partire, prenditi un caffè: il giro è lungo e Napoli si gira a piedi.","d":"Davanti alla caffetteria","foto":null}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Foto d'epoca di via Toledo nell'Ottocento, con carrozze e passanti","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Via Toledo nell'Ottocento, quando si chiamava via Roma, in una foto di Giacomo Brogi."}],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, el decumano inferior","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La calle recta que divide el centro histórico en dos: el decumano inferior de la ciudad griega, unos dos kilómetros de iglesias, tiendas y vida.","rac":"Spaccanapoli es la más baja de las tres decumanas, las calles paralelas que cruzaban Neapolis griega de oeste a este. Comienza en la Piazza del Gesù Nuovo como Via Benedetto Croce, luego se convierte en Via San Biagio dei Librai, cruza Via Duomo y continúa más allá del casco antiguo: unos dos kilómetros en total. Su nombre lo dice todo: es tan larga y recta que, vista desde arriba, parece dividir la ciudad en dos.","con":"Recorre esta avenida desde la Piazza del Gesù hacia la Via Duomo: es un ligero descenso lleno de historia, no de esfuerzo.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La strada che spacca Napoli","x":"Spaccanapoli è il nome popolare del decumano inferiore, una delle tre grandi strade parallele della città greca: era la «plateia» di Neapolis. È chiamata così perché, perfettamente dritta, divide in due il centro antico tra nord e sud.\n\nCambia nome più volte: via Benedetto Croce, poi via San Biagio dei Librai. Dalla collina, dall'alto di via Pasquale Scura, si vede tutta d'infilata.\n\nLungo la via, tra il Medioevo e l'Ottocento, sorsero conventi e palazzi di famiglie potenti: guarda in alto i portali e i cortili, e in basso le botteghe.","d":"Lungo tutta la via, da piazza del Gesù a via Duomo","foto":null}],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Plaza e Iglesia del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fachada de piedras en forma de pirámide que parece una fortaleza y esconde un misterio: inscripciones grabadas que nadie ha descifrado aún con certeza.","rac":"Antes de ser iglesia, fue un palacio: el de los príncipes Sanseverino, construido en 1470; una placa en la fachada conmemora al arquitecto, Novello da San Lucano. Los jesuitas conservaron la estructura y la sillería oscura de piperno, con las piedras talladas en forma piramidal, añadiendo elementos de mármol blanco.\n\nAlgunas piedras tienen marcas grabadas. Según la leyenda, son un mensaje secreto; algunos estudiosos creen que son las marcas dejadas por diferentes canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales de una partitura llamada \"Enigma\". Obsérvalas con atención y decide por ti mismo.\n\nLa fachada fue restaurada e inaugurada el 12 de marzo de 2023, después de que algunos fragmentos cayeran en diciembre de 2017; la plaza ha permanecido cerrada al tráfico desde entonces.","con":"Busca las marcas en las piedras a la altura de los ojos, a la derecha y a la izquierda del portal: la búsqueda es gratuita.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La facciata del Gesù Nuovo, di pietre scure tagliate a punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La facciata a punte di diamante: era il palazzo dei principi Sanseverino, del 1470. Avvicinati e cerca i segni incisi sulle pietre."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La fachada en punta de diamante","x":"Antes de ser iglesia, era la fachada del palacio de los príncipes Sanseverino, que data de 1470. Los jesuitas la conservaron tal cual, con sus oscuras piedras piperno talladas en forma piramidal, y añadieron el gran portal barroco. Acérquense: muchas de las piedras tienen inscripciones grabadas, y aún hoy no hay consenso sobre su significado.","d":"Afuera, en la plaza","foto":null},{"t":"La expulsión de Heliodoro","x":"El gran fresco de la contrafachada es obra de Francesco Solimena, de 1725. Representa a Heliodoro intentando saquear el Templo de Jerusalén y siendo repelido por un caballero celestial: una escena llena de movimiento, caballos y figuras que huyen. Muchos visitantes no lo aprecian porque entran de cara al altar.","d":"En cuanto entres, dirígete hacia la puerta: está encima de la entrada.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"Il grande affresco della Cacciata di Eliodoro di Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"L'affresco di Solimena sopra l'ingresso: girati verso la porta per vederlo. Al centro il cavaliere celeste che respinge Eliodoro."}},{"t":"La cúpula y los cuatro evangelistas","x":"Los cuatro triángulos en la base de la cúpula representan a los evangelistas, pintados por Giovanni Lanfranco. Sin embargo, la cúpula que se ve no es la original: se derrumbó en el terremoto de 1688 y fue reemplazada en 1786 por una estructura más baja en forma de cuenco.","d":"En el centro de la iglesia, mira hacia arriba.","foto":null},{"t":"La capilla de Sant'Ignazio","x":"Dedicado al fundador de los jesuitas, este museo reúne a dos grandes figuras del arte napolitano del siglo XVII: Cosimo Fanzago, autor de la arquitectura y las estatuas de los profetas David y Jeremías, y Jusepe de Ribera, quien pintó los lienzos que representan la vida del santo. Mármol policromado, estatuas y pinturas se dan cita: el barroco napolitano en su máxima expresión.","d":"En una de las dos grandes capillas de la iglesia.","foto":null},{"t":"San José Moscati","x":"Aquí reposan los restos del «santo doctor» de Nápoles: Giuseppe Moscati, investigador y profesor universitario que atendió a los pobres de forma gratuita. Falleció en 1927 y fue canonizado en 1987. Sus cenizas se encuentran en una urna de bronce, obra del escultor Amedeo Garufi, bajo el altar de la Capilla de la Visitación.","d":"En la capilla de la Visitación, bajo el altar","foto":null}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La piazza del Gesù Nuovo davanti alla chiesa","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La piazza del Gesù Nuovo, davanti alla chiesa."},{"u":"../img/6d1ae4837518.jpg","alt":"L'interno del Gesù Nuovo, con marmi colorati e l'altare maggiore","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, il contrasto con la facciata severa: marmi colorati, affreschi e oro fino all'altare maggiore."},{"u":"../img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo vista dall'ingresso","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata vista dall'ingresso: in fondo, in alto, la cupola con gli evangelisti di Lanfranco alla base."}],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monasterio y complejo de Santa Chiara (claustro de mayólica)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"El claustro revestido de mayólica es uno de los lugares más tranquilos del centro: a un paso del caos de Spaccanapoli, un remanso de paz.","rac":"Santa Chiara fue construida en 1310 por orden del rey Roberto de Anjou y la reina Sancha de Mallorca. La construcción fue dirigida primero por Gagliardo Primario y luego por Lionardo di Vito, y en 1340 la iglesia se inauguró para el culto. El complejo constaba de dos partes: un convento para las clarisas y otro para los frailes menores, contiguos pero separados.\n\nCuatro siglos después, a sugerencia de la reina María Amalia de Sajonia, esposa de Carlos de Borbón, se renovó el claustro de las Clarisas. El arquitecto Domenico Antonio Vaccaro conservó los arcos góticos del siglo XIV y transformó el centro en un jardín barroco, revestido con azulejos de mayólica del taller de Donato y Giuseppe Massa. El resultado es uno de los lugares más sorprendentes de Nápoles: un jardín de cerámica a pocos pasos de Spaccanapoli.","con":"Los domingos, el claustro cierra a las 2 de la tarde: si es domingo por la tarde, cambien de orden y vengan aquí primero.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Claustro y museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Claustro y museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Los pilares de mayólica","x":"Sesenta y cuatro pilares revestidos de azulejos de mayólica con guirnaldas de hojas, flores y frutas, bajo una pérgola. Los colores amarillo, naranja y azul evocan los cítricos y las vides que crecen a su alrededor. Los azulejos de mayólica proceden del taller de Donato y Giuseppe Massa, en el jardín barroco diseñado por Domenico Antonio Vaccaro.","d":"En el jardín del claustro","foto":{"u":"../img/924627d30fda.jpg","alt":"Pilastri rivestiti di maioliche gialle e verdi nel chiostro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"I pilastri rivestiti di maioliche con festoni di foglie, fiori e frutti, sotto il pergolato."}},{"t":"Las escenas en los asientos","x":"Los asientos que conectan las columnas son todos de mayólica, y los respaldos están pintados con pequeñas escenas: la vida rural, la vida en la costa, fiestas populares, mitos. Representan la vida napolitana del siglo XVIII contada a través de imágenes. Siéntese y observe con atención el que está detrás de usted.","d":"En los respaldos de los asientos entre los pilares","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un sedile di maiolica con una scena dipinta sullo schienale","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un sedile di maiolica del chiostro: sullo schienale c'è una scena dipinta."}},{"t":"Clarissa con los gatos","x":"Entre las escenas se encuentra una monja clarisa alimentando a los gatos del claustro: un pequeño atisbo de la vida cotidiana en el monasterio, pintado en mayólica. Encontrarlo es una búsqueda del tesoro perfecta, incluso para los niños.","d":"En uno de los respaldos de los asientos: búscalo","foto":null},{"t":"Los arcos del siglo XIV","x":"El jardín es barroco, pero el entorno es medieval: Vaccaro conservó el perímetro del siglo XIV con los arcos apuntados del monasterio angevino. Observe el contraste entre la austera piedra de los arcos y los colores vivos de los azulejos de mayólica: cuatro siglos en una sola mirada.","d":"A lo largo de los cuatro lados del claustro","foto":null}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Maioliche con una scena di caccia al cinghiale","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Da vicino: una caccia al cinghiale dipinta sulle maioliche dalla bottega dei Massa, tra il 1739 e il 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"El claustro con columnas de mayólica, bancos y jardín.","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Il chiostro intero: i pilastri di maiolica, i sedili e il giardino."}],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Capilla Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"El Cristo Velado, una de las esculturas más famosas del mundo, y las máquinas anatómicas del príncipe alquimista Raimondo di Sangro.","rac":"La capilla de la familia di Sangro es el reino de Raimondo, príncipe de Sansevero: un hombre de ciencia y secretos, Gran Maestro de la Francmasonería, en torno al cual nació el mito cuando aún vivía, y fue él mismo quien lo alimentó.\n\nEn el centro se encuentra el Cristo Velado de Giuseppe Sanmartino, encargado por el príncipe: un cuerpo reclinado cubierto por un sudario tan fino que parece tela mojada, pero tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea se hallan dos «máquinas anatómicas», esqueletos de un hombre y una mujer con vasos sanguíneos reconstruidos, obra del médico palermitano Giuseppe Salerno entre 1756 y 1764. La leyenda negra habla de sirvientes sacrificados e inyecciones misteriosas; el museo, por su parte, distingue cuidadosamente el mito de la historia documentada.","con":"Está cerrado los martes: si hoy es martes, la estatua del Nilo está a dos minutos y siempre se puede ver.","acc":"La nave y la sacristía son accesibles para personas en silla de ruedas. Al auditorio subterráneo, con sus máquinas anatómicas, solo se puede acceder por una estrecha escalera de caracol del siglo XIX.","foto":{"u":"../img/65421f883be6.jpg","alt":"L'esterno della Cappella Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Cappella Sansevero vista da fuori."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"El Cristo velado","x":"Un cuerpo tendido sobre un colchón, cubierto por una mortaja tan fina que se pueden ver el rostro, las heridas y las venas. El velo no es añadido: Giuseppe Sanmartino lo esculpió del mismo bloque de mármol que la estatua, por encargo del príncipe Raimondo di Sangro. Rodéalo lentamente: el velo parece cambiar a cada lado.","d":"En el centro de la nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Il volto del Cristo velato sotto il velo di marmo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Il volto sotto il velo: il sudario è scolpito nello stesso blocco di marmo della statua, eppure sembra stoffa bagnata."}},{"t":"Modestia","x":"Una mujer envuelta en un velo que se adhiere a su piel como si estuviera mojado, con una guirnalda de rosas. Fue esculpida por Antonio Corradini en 1752, año de su muerte, y el príncipe la dedicó a su madre, Cecilia Gaetani, quien falleció cuando él aún no había cumplido un año. Fíjense en la lápida rota a sus pies: es el símbolo de una vida truncada prematuramente.","d":"Cerca del altar mayor","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La statua della Pudicizia, una donna coperta da un velo","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La Pudicizia di Antonio Corradini: il velo aderisce al corpo come se fosse bagnato. Ai suoi piedi la lapide spezzata."}},{"t":"La desilusión","x":"Un hombre se libera de una gran red con la ayuda de un pequeño genio alado con una llama en la frente, símbolo de la inteligencia. Francesco Queirolo la esculpió entre 1753 y 1754 para conmemorar al padre del príncipe. La red está hecha completamente de mármol perforado: según la tradición, los ayudantes se negaron a pulirla por temor a romperla, por lo que el escultor la alisó personalmente.","d":"Cerca del altar mayor","foto":{"u":"../img/921cf7f91318.jpg","alt":"La statua del Disinganno, un uomo che si libera da una rete","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Il Disinganno di Francesco Queirolo: la rete è tutta di marmo, traforata a mano."}},{"t":"El suelo laberíntico","x":"El suelo original era un laberinto de mármoles de colores atravesado por una línea blanca continua, concebido por el príncipe como símbolo del arduo camino hacia el conocimiento. Francesco Celebrano lo construyó hasta alrededor de 1771. Un derrumbe en 1889 destruyó casi por completo: quedan algunas losas en el pasaje frente a la tumba de Raimondo, en la cávea y en la sacristía.","d":"En el pasaje frente a la tumba del príncipe","foto":null},{"t":"Las máquinas anatómicas","x":"Dos esqueletos, uno de hombre y otro de mujer, con sus vasos sanguíneos reconstruidos con una precisión que aún asombra. Fueron creados por el médico palermitano Giuseppe Salerno entre 1756 y 1764. La oscura leyenda del príncipe nació en torno a ellos: el museo explica con detalle dónde termina la historia y dónde comienza el mito.","d":"En la cávea subterránea, bajando por una estrecha escalera de caracol","foto":null}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"L'interno della Cappella Sansevero con le statue","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La cappella intera: al centro il Cristo velato, intorno le statue della famiglia di Sangro."}],"leg":"Mucho se habló de Raimondo di Sangro durante su vida: experimentos misteriosos, secretos alquímicos e incluso sirvientes transformados en máquinas anatómicas. El museo distingue cuidadosamente la leyenda negra de los hechos documentados: vale la pena escuchar ambas versiones y tomar partido.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli y estatua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"La statua antica del dio Nilo, sdraiato","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statua del dio Nilo, sdraiato, nella piccola piazza che porta il suo nome."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai y sus tiendas","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La zona de libreros y artesanos de Spaccanapoli: tiendas, iglesias y el Hospital de Muñecas.","rac":"Este es el tramo de Spaccanapoli que va desde la Piazzetta Nilo hasta la Via Duomo, en el decumano inferior. Su nombre proviene de las librerías que siempre se han ubicado allí: una inscripción en el cercano Palazzo Marigliano conmemora el arte de los maestros libreros. La devoción a San Blas se remonta al siglo VIII, cuando unas monjas de Armenia trajeron una reliquia del santo a Nápoles. También en esta calle se encuentra el Ospedale delle Bambole, un taller artesanal que se ha transmitido de generación en generación.","con":"Diciembre es el mes de las tiendas de belenes: prepárense para las multitudes los fines de semana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La via dei librai","x":"San Biagio dei Librai unisce piazzetta Nilo e via Duomo ed è parte del decumano inferiore. Il nome ricorda le tante botteghe di libri che da sempre si trovano qui, e la chiesa di San Biagio Maggiore, dedicata al santo protettore di chi ha mal di gola: la devozione arrivò nell'VIII secolo con monache venute dall'Armenia, che portarono una reliquia del santo.\n\nIn questa strada nacque il filosofo e storico Giambattista Vico.\n\nCammina piano: è una delle strade più vive di Napoli, sempre piena di gente.","d":"Lungo la via","foto":null}],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella en la librería y la calavera con orejas","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una pequeña iglesia de cantero dedicada al santo de los ojos, y un cráneo singular: el que tiene orejas.","rac":"Fundada poco antes de 1327 por Bartolomeo di Capua, jurista de los reyes angevinos, la iglesia fue entonces confiada a los pipernieri, los canteros: eligieron a Santa Lucía, protectora de la vista, porque las astillas de su oficio ponían en riesgo sus ojos.\n\nAbandonada durante más de treinta años, fue reabierta el 5 de abril de 2019 gracias a la asociación Respiriamo Arte. En su bóveda subterránea, el culto de las \"anime pezzentelle\" (almas enfermas) dejó un cráneo único: tiene orejas.","con":"Es pequeño y se puede visitar en tan solo unos minutos: perfecto como descanso entre Sansevero y Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Il portale di Santa Luciella nel vicolo","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Il portale di Santa Luciella. Alza gli occhi: sopra c'è l'affresco con lo stemma dei pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"El escudo de armas de los Pipernieri","x":"Antes de entrar, mire hacia arriba: sobre el portal de piedra piperno, aún se conserva un fresco con el escudo de armas del gremio de canteros piperno, a quienes pertenecía la iglesia. Trabajaban entre las piedras, y por ello eligieron a Santa Lucía, protectora de la vista.","d":"Sobre el portal de entrada","foto":null},{"t":"El cráneo con orejas","x":"Debajo de la iglesia, en el hipogeo, se encuentra un cráneo con cartílago de oreja conservado: esto lo hace único. La tradición popular sostiene que, precisamente por tener orejas, escucha mejor las oraciones de quienes le piden un favor.","d":"En el hipogeo, con visita guiada.","foto":null},{"t":"Las pobres almas","x":"En el siglo XVII, tras la peste, los napolitanos \"adoptaron\" los cráneos de los difuntos anónimos: los limpiaban, rezaban por ellos y pedían ayuda a cambio. Era el culto a las almas del desdichado. Aquí se conserva uno de los testimonios más famosos de la ciudad.","d":"En el hipogeo","foto":null}],"gal":[],"leg":"Se dice que el cráneo con orejas, precisamente por tenerlas, escucha mejor las oraciones: por esta razón, durante generaciones se le han confiado las peticiones más difíciles.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Hospital de muñecas","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una tienda que lleva generaciones seleccionando muñecas y juguetes: un escaparate que niños y adultos siempre recordarán.","rac":"A finales del siglo XIX, Luigi Grassi trabajaba como escenógrafo para teatros y belenes. Los vecinos comenzaron a traerle muñecas y juguetes rotos, y su taller se convirtió, casi por casualidad, en el primer \"hospital\" de juguetes de Nápoles.\n\nHoy en día, Tiziana, bisnieta del fundador, lo dirige en el patio del Palazzo Marigliano, en Via San Biagio dei Librai. En su interior, funciona como un hospital de verdad: batas blancas, salas y un historial clínico para cada paciente. Para muchos napolitanos, es el lugar donde llevaban su juguete favorito de niños.","con":"El escaparate por sí solo ya justifica la parada: está de camino de vuelta.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"La vetrina dell'Ospedale delle Bambole piena di bambole","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vetrina dell'Ospedale delle Bambole: bambole e giocattoli in attesa di essere «curati»."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un hospital de verdad, para juguetes.","x":"No es una tienda, sino un laboratorio organizado como un hospital: los \"médicos\" con batas blancas, los departamentos de ortopedia, oftalmología y sastrería, y los pacientes, muñecos, ositos de peluche y juguetes de tela, cada uno con su propio historial médico y diagnóstico.","d":"En la tienda","foto":null},{"t":"El diseñador de escenografía fundador","x":"Todo comenzó a finales del siglo XIX con Luigi Grassi, escenógrafo de teatros y belenes. Los vecinos empezaron a llevarle juguetes rotos, y él transformó el taller en el primer \"hospital\". Hoy, su bisnieta, Tiziana, atiende a los pacientes.","d":"En la historia de la tienda","foto":null},{"t":"El patio del Palacio Marigliano","x":"El hospital está ubicado en el patio del Palazzo Marigliano, en la calle Spaccanapoli. Al entrar por la puerta principal, el ruido de la calle se desvanece: es uno de los muchos patios escondidos del centro histórico que merece la pena descubrir.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la iglesia de los capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La Iglesia de los capuzzelle: bajo el suelo, el hipogeo donde Nápoles rezaba por las almas sin nombre. Y el cráneo de Lucía.","rac":"Los napolitanos la llaman \"'e cape 'e morte\", la iglesia de las cabezas de los muertos. Es una pequeña iglesia del siglo XVII situada en el decumano principal, vinculada a la devoción a las almas del Purgatorio difundida por la Contrarreforma. Una empinada escalera conduce al hipogeo, la iglesia subterránea, ampliada y decorada con mayólica en el siglo XVIII: allí, los devotos cuidaban restos anónimos y buscaban su intercesión. Al final de un pequeño pasillo, se conserva el cráneo de Lucía, una joven particularmente querida.","con":"Detrás del altar, busquen la calavera alada de mármol de Dionisio Lazzari: es el símbolo de la iglesia.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La facciata del Purgatorio ad Arco su via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La facciata del Purgatorio ad Arco, sul decumano maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Las pinturas del siglo XVII","x":"Antes de descender, eche un vistazo a la iglesia que se encuentra arriba: alberga valiosos mármoles y pinturas de tres maestros napolitanos del siglo XVII: Massimo Stanzione, Luca Giordano y Andrea Vaccaro. Es la parte superior de un lugar que prospera principalmente gracias a lo que yace debajo.","d":"En la iglesia superior","foto":null},{"t":"El cráneo alado","x":"Entre la decoración de la iglesia destaca una calavera alada, obra de Dionisio Lazzari: una imagen que resume el espíritu del lugar, donde no se teme a la muerte, sino que se convierte en una oportunidad para la oración y la conexión con aquellos que ya no están con nosotros.","d":"En la iglesia superior","foto":null},{"t":"El Hipogeo de las Almas","x":"La verdadera iglesia es la subterránea: un amplio espacio donde aún hoy los devotos cuidan restos humanos anónimos y piden su protección. Fue ampliada y decorada con azulejos de mayólica en el siglo XVIII. Descienda despacio: es un lugar de devoción viva, no solo de curiosidad.","d":"Debajo de la iglesia, bajando por una escalera empinada.","foto":null},{"t":"El cráneo de Lucía","x":"Entre todos los cráneos del hipogeo, uno es particularmente venerado: el de Lucía, que se cree que es el alma de una joven. Se conserva al final de un pequeño pasillo y es el testimonio más conmovedor del culto a las almas del Purgatorio.","d":"En el hipogeo, al final de un pequeño corredor.","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Un'immagine delle anime del Purgatorio tra le fiamme dentro la chiesa","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro la chiesa: le anime del Purgatorio tra le fiamme, il tema di tutto il luogo."},{"u":"../img/de63b1b83fa8.jpg","alt":"Un teschio di bronzo su una colonnina","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un teschio di bronzo: il simbolo della chiesa delle «capuzzelle»."}],"leg":"","fc":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Cuarenta metros más abajo de la Via dei Tribunali: las cisternas que durante siglos abastecieron de agua a Nápoles, refugios de guerra y un teatro romano escondido bajo una cama.","rac":"Bajo el centro histórico se esconde otra ciudad. Desde la Piazza San Gaetano, se desciende por más de cien escalones hasta una profundidad de unos 40 metros, a lo largo de un sendero que atraviesa un acueducto grecorromano y túneles de las épocas medieval, borbónica y moderna.\n\nLas cuevas de la época griega se utilizaron como cisternas para el suministro de agua de la ciudad durante aproximadamente 23 siglos. Durante la Segunda Guerra Mundial, esos mismos espacios se convirtieron en refugios antiaéreos.\n\nLa visita subterránea es guiada y dura aproximadamente una hora. Después, se regresa a la superficie para la sorpresa final: los restos del teatro grecorromano de Neapolis, integrados en las casas del barrio desde el siglo XV. Se entra en un «basso», una vivienda en la planta baja, se mueve una cama y se desciende por una trampilla hasta las paredes del teatro.","con":"Calzado bajo y sudadera, incluso en verano: el ambiente subterráneo es húmedo. El pasaje corto y estrecho con la vela es opcional. Se requiere reserva para grupos de 10 personas o más.","acc":"No apto para sillas de ruedas ni andadores: hay escaleras con pasamanos y pasillos estrechos.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Las visitas guiadas salen cada hora de 10:00 a 18:00, en italiano e inglés. También disponibles los jueves a las 21:00, solo con reserva previa y para grupos de al menos 10 personas."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Las cisternas grecorromanas","x":"Las habitaciones de la época griega, excavadas en la toba volcánica, fueron las cisternas de agua de Nápoles durante aproximadamente 23 siglos, conectadas por el acueducto grecorromano.","d":"En la primera parte de la visita, a unos 40 metros de profundidad.","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Le pareti di tufo di una cisterna sotterranea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Le pareti di tufo di una cisterna: per circa 23 secoli qui si raccoglieva l'acqua della città."}},{"t":"El pasaje con la vela","x":"Un tramo muy corto y estrecho se recorre con una vela en la mano. Esto es opcional: quienes lo prefieran pueden omitirlo y usar la linterna del teléfono.","d":"A lo largo del camino subterráneo","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Un cunicolo strettissimo illuminato nel tufo","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Uno dei cunicoli strettissimi scavati nel tufo."}},{"t":"Los refugios de guerra","x":"Durante la Segunda Guerra Mundial, estas habitaciones subterráneas se utilizaron como refugios antiaéreos: aquí la ciudad se protegía de los bombardeos.","d":"A lo largo del camino subterráneo","foto":{"u":"../img/0f4490838101.jpg","alt":"Oggetti della Seconda guerra mondiale esposti sottoterra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"I ricordi della guerra: oggetti di quando queste stanze erano rifugi antiaerei."}},{"t":"El teatro debajo de la cama","x":"Los restos del teatro grecorromano de Neapolis se incorporaron a viviendas modernas en el siglo XV. Se accede a un sótano, se mueve la cama y, a través de una trampilla, se desciende al interior de las paredes del teatro.","d":"Segunda parte de la visita, en la superficie entre Via Anticaglia y Vico Cinquesanti.","foto":null}],"gal":[],"leg":"Según el relato de la visita, Nerón tenía sus camerinos en las habitaciones ocultas bajo la planta baja cuando venía a Nápoles a actuar en el teatro.","fc":"si"},{"id":17,"s":"pio-monte-misericordia","n":"Pío Monte de la Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Il capolavoro che Caravaggio dipinse appena arrivato a Napoli: le Sette opere di Misericordia, ancora sull'altare per cui furono fatte, a pochi passi dal Duomo.","rac":"Il Pio Monte della Misericordia fu fondato nel 1602 da sette giovani nobili napoletani per aiutare la gente in difficoltà. Esiste ancora oggi, nello stesso palazzo del Seicento in via dei Tribunali, e continua la sua attività di carità.\n\nLa chiesa ottagonale fu costruita tra il 1656 e il 1671 su disegno di Francesco Antonio Picchiatti. Sull'altare maggiore c'è la tela che la rende famosa nel mondo: le Sette opere di Misericordia di Caravaggio, dipinta tra il 1606 e il 1607 e pagata 400 ducati, una cifra enorme. Caravaggio era a Napoli da pochi mesi, in fuga da Roma dopo una condanna per omicidio.\n\nIl quadro piacque tanto che nel 1613 la congregazione stabilì che non potesse essere venduto «ad alcun prezzo» e restasse per sempre nella chiesa. Intorno, negli altri sei altari, ci sono le tele di altri maestri del Seicento napoletano, ciascuna dedicata a un'opera di misericordia. Al piano di sopra c'è la quadreria del Pio Monte.","con":"Biglietto intero 10 euro, ridotto 8 euro. Nel palazzo c'è anche il coretto da cui i governatori del Pio Monte potevano guardare la tela dall'alto: chiedi se è compreso nella visita.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Chiuso il 25 dicembre e a Pasqua; il 24 e 31 dicembre e il 15 agosto chiude alle 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Le Sette opere di Misericordia","x":"È una tela enorme, quasi quattro metri d'altezza, e sembra una notte in un vicolo di Napoli: un incrocio pieno di gente, illuminato da una luce che arriva di lato e scolpisce i corpi nel buio. In alto, la Madonna con il Bambino, portata da due angeli, guarda giù su quello che fanno gli uomini.\n\nIl Pio Monte voleva un'opera che mettesse insieme tutte e sette le opere di misericordia: dar da mangiare agli affamati, dar da bere agli assetati, vestire gli ignudi, ospitare i pellegrini, visitare gli infermi, visitare i carcerati, seppellire i morti. Caravaggio le dipinse tutte in una sola scena, senza miracoli: è l'uomo che aiuta l'uomo.\n\nFu la prima opera di Caravaggio a Napoli e cambiò la pittura della città: i pittori napoletani del Seicento ripresero la sua luce, i suoi personaggi presi dalla strada e perfino alcuni dettagli, come l'uomo di spalle in primo piano.","d":"Sull'altare maggiore","foto":null},{"t":"Come riconoscere le sette opere","x":"Cerca le scene una per una.\n\nA destra, una giovane donna allatta dal seno un vecchio dietro le sbarre: sono Pero e suo padre Cimone, condannato a morire di fame in carcere. Valgono per due opere: dar da mangiare agli affamati e visitare i carcerati. Guarda la goccia di latte sulla barba del vecchio.\n\nDietro di loro, un uomo trasporta un morto (se ne vedono solo i piedi) e un sacerdote con la torcia gli fa luce: seppellire i morti. In primo piano, a sinistra, un giovane cavaliere taglia il mantello per un uomo nudo a terra: è San Martino, vestire gli ignudi; accanto, nell'angolo più buio, uno storpio prega: visitare gli infermi.\n\nAll'estrema sinistra un oste indica la strada a un pellegrino con la conchiglia sul cappello, San Giacomo: ospitare i pellegrini. Sullo sfondo, un uomo beve da una mascella d'asino: è Sansone, dar da bere agli assetati.","d":"Davanti alla tela, da sinistra a destra","foto":null},{"t":"La Madonna e gli angeli","x":"Guarda in alto: la Madonna con il Bambino si affaccia come da una finestra, davanti a due lenzuoli stesi, e due angeli si abbracciano in volo. Sembrano lontani da quello che succede in basso.\n\nMa osserva l'ombra che proiettano sul muro del carcere: Caravaggio li rende presenti, quasi concreti, dentro la stessa notte degli uomini.\n\nLo storico dell'arte Roberto Longhi scelse proprio questo dettaglio per la locandina della grande mostra del 1951 che riscoprì Caravaggio: belli, scrisse, come un Raffaello, ma presi «dalla verità nuda di Forcella o di Pizzofalcone».","d":"In alto, nella tela","foto":null},{"t":"Gli altri altari","x":"Intorno al Caravaggio la chiesa ottagonale ha altri sei altari, con tele di pittori del Seicento napoletano: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino e Forlì.\n\nCerca la «Liberazione di San Pietro» di Battistello Caracciolo, del 1615: è uno dei pittori che più impararono da Caravaggio, e si vede dalla luce e dal buio. Poi «San Pietro che resuscita Tabità» di Fabrizio Santafede, del 1611.\n\nGuardale dopo il Caravaggio: capirai subito quanto la sua tela fosse nuova per Napoli.","d":"Nelle cappelle intorno","foto":null}],"gal":[],"leg":"","fc":null},{"id":18,"s":"duomo-san-gennaro","n":"Catedral y Tesoro de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La Catedral de Nápoles y la Capilla del Tesoro, donde se guarda el frasco con la sangre de San Genaro.","rac":"En la Catedral, en un nicho de la Capilla del Tesoro, se conserva la ampolla que contiene la sangre tradicionalmente atribuida a San Gennaro. Tres veces al año (el sábado anterior al primer domingo de mayo, el 19 de septiembre y el 16 de diciembre) se espera su licuefacción. Desde 1601, las reliquias están bajo la custodia de una institución secular: la Delegación de la Capilla del Tesoro de San Gennaro.","con":"Los días de licuefacción, el Duomo está abarrotado desde la mañana: si quieres estar allí, llega temprano.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La facciata del Duomo di Napoli","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La facciata del Duomo, su via Duomo. La Cappella del Tesoro è la terza a destra."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"El portal de San Gennaro","x":"La fachada, de unos cincuenta metros de altura, tiene tres portales. El de la derecha permanece cerrado casi todo el año: solo se abre para la festividad de San Gennaro y en ocasiones especiales. Si lo encuentras abierto, significa que has llegado a un día especial.","d":"En la parte delantera, a la derecha","foto":null},{"t":"La Capilla del Tesoro","x":"Más que una capilla, es una iglesia dentro de otra iglesia: barroca, con planta de cruz griega, cúpula de doble arco y una gran puerta de bronce de Cosimo Fanzago. Alberga el busto de plata de San Genaro y las ampollas que contienen su sangre, cuya licuefacción espera la ciudad.","d":"Tercera capilla a la derecha","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cupola della Cappella del Tesoro affrescata con il Paradiso","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Alza gli occhi: nella cupola della Cappella del Tesoro c'è il Paradiso dipinto da Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Cuando Carlos de Anjou mandó construir la catedral en 1294, una de las basílicas más antiguas se conservó como capilla: Santa Restituta. Alberga obras de Luca Giordano y esculturas del siglo XIV, y desde allí se desciende a la zona arqueológica con restos grecorromanos y paleocristianos bajo la catedral.","d":"En el pasillo izquierdo","foto":{"u":"../img/5abf53aec271.jpg","alt":"Un mosaico con la Madonna in trono nella basilica di Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico con la Madonna in trono, dentro Santa Restituta: la basilica più antica, conservata come cappella del Duomo."}},{"t":"El Baptisterio de San Giovanni in Fonte","x":"Un pequeño espacio con una historia inmensa: se considera el baptisterio más antiguo del mundo occidental. Deténgase unos minutos: se encuentra en uno de los lugares cristianos más antiguos que aún se conservan en Europa.","d":"A la derecha del ábside","foto":null},{"t":"El Succorpo","x":"Bajo el altar se encuentra una cripta renacentista de tres naves, encargada por el cardenal Oliviero Carafa para albergar las reliquias de San Gennaro y otros santos, diseñada por Giovan Tommaso Malvito. Columnas antiguas y mármol blanco: un silencioso renacimiento en el interior de la catedral gótica.","d":"Debajo del altar mayor","foto":null}],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"La Virgen con una pistola de Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Virgen María de Banksy con una pistola en lugar de aureola, protegida por cristal, en el corazón del decumano principal.","rac":"En la Piazzetta dei Girolamini, en una fachada del decumano principal, Banksy dejó una Virgen con una pistola en lugar de su aureola. Hoy, está protegida por un cristal. La página web oficial de turismo de la ciudad la incluye en su itinerario dedicado al arte callejero del centro histórico.","con":"Mira hacia arriba: la obra está por encima del nivel de la calle, detrás de un cristal.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Virgen con la pistola","x":"Blanco sobre fondo negro, pintado con plantilla: una Virgen María con los brazos extendidos hacia el cielo y, en lugar de aureola, una pistola. Banksy lo pintó en Nápoles en 2010. El mensaje es ambiguo: cada uno lo interpreta a su manera, en algún punto entre lo sagrado y lo profano.","d":"En la pared de la pequeña plaza","foto":null},{"t":"El quiosco de periódicos de al lado","x":"Junto al mural hay un pequeño altar votivo con la Virgen y el Niño, del tipo que se encuentra en muchas calles de Nápoles. Las dos imágenes, una al lado de la otra, parecen mirarse: es este diálogo lo que hace que la obra sea tan napolitana.","d":"Justo al lado del trabajo","foto":null},{"t":"Un Banksy bajo cristal","x":"En 2010, Banksy dejó dos obras en Nápoles, probablemente la misma noche: la otra, en Via Benedetto Croce, fue posteriormente cubierta por otro artista. Por este motivo, el FAI (Fondo Nacional Italiano para el Arte) la cataloga como el único mural de Banksy en Italia, actualmente protegido por una vitrina de plexiglás para evitar el vandalismo.","d":"Delante del trabajo","foto":null},{"t":"Come arrivarci e cosa fotografare","x":"L'opera è su un muro della piccola piazza Gerolomini, affacciata su via dei Tribunali.\n\nLa teca protegge l'opera ma può riflettere la luce: per una foto senza riflessi prova a metterti leggermente di lato. Il posto è sempre accessibile e gratuito.\n\nDa qui la Madonna di via Benedetto Croce, l'opera perduta, era a nove minuti a piedi, lungo il percorso che passa da Sansevero, Napoli Sotterranea e San Gregorio Armeno.","d":"Piazza Gerolomini, su via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null},{"id":45,"s":"gallerie-italia","n":"Galería de Italia, el último Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"A seis minutos de Ceraldi, en Via Toledo, se encuentra el último lienzo pintado por Caravaggio: el martirio de Santa Úrsula.","rac":"La Galería de Italia de Intesa Sanpaolo, en Via Toledo 177, alberga El martirio de Santa Úrsula, el último lienzo de Caravaggio. Junto a él, se exhiben tres exposiciones: pintura napolitana y del sur de Italia desde el siglo XVII hasta principios del siglo XX, pintura del siglo XX y más de quinientas piezas de cerámica ática y de la Magna Grecia de la colección Caputi.","con":"La entrada es gratuita para todos el primer domingo de cada mes. Los lunes permanece cerrado.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Il Martirio di sant'Orsola","x":"È una scena stretta e buia, quasi senza sfondo: siamo nella tenda di Attila, re degli Unni. Orsola, una principessa, lo ha rifiutato, e lui le ha appena scoccato una freccia nel petto. Lei piega la testa verso la freccia; tre uomini accorrono a sorreggerla. Il re sembra già pentito del suo gesto.\n\nCerca il volto alle spalle della santa: è lo stesso Caravaggio, che si è dipinto tra i testimoni. E osserva la mano che si allunga tra la santa e il re, come per fermare la freccia: è riapparsa durante il restauro del 2003-2004.\n\nLo commissionò il principe genovese Marcantonio Doria, la cui famiglia aveva sant'Orsola come protettrice. È il quadro più tardo di Caravaggio che conosciamo: fu finito nel maggio 1610, poco più di un mese prima della sua morte.","d":"Nella sala dedicata a Caravaggio","foto":null},{"t":"Il quadro messo al sole","x":"Caravaggio dipinse il quadro in fretta, forse perché stava per partire verso Roma per ottenere il perdono del papa. L'incaricato dei Doria a Napoli, Lanfranco Massa, fece consegnare la tela quando la vernice non era ancora asciutta e, per farla asciugare prima, la mise al sole: la vernice, stesa molto spessa, si rovinò. Lo raccontò lui stesso in una lettera di maggio 1610.\n\nIl quadro arrivò a Genova, poi passò di erede in erede, finì in una villa di Eboli e fu attribuito ad altri pittori. Solo negli anni Ottanta del Novecento il ritrovamento della lettera di Massa ha confermato con certezza che è di Caravaggio.\n\nNel 2025 un nuovo intervento di restauro ha riportato alla luce tre teste che il tempo aveva fatto sparire.","d":"Davanti alla tela","foto":null},{"t":"Il palazzo del Banco di Napoli","x":"Prima di salire alle sale, guardati intorno: sei nel palazzo che fu la sede del Banco di Napoli, progettato da Marcello Piacentini alla fine degli anni Trenta del Novecento.\n\nL'architetto Michele De Lucchi lo ha trasformato in museo con un allestimento moderno: le grandi sale della banca oggi ospitano tre percorsi, dall'arte napoletana del Seicento al Novecento, passando per una ricca collezione di vasi greci e della Magna Grecia.\n\nIl museo ha aperto nel 2022 e continua l'attività di Palazzo Zevallos Stigliano, aperto dal 1999 al 2022 a pochi passi da qui.","d":"Entrando, nel salone","foto":null}],"gal":[],"leg":"","fc":null},{"id":44,"s":"murale-maradona","n":"El mural de Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"El querido mural del Barrio Español y la plaza que desde 2020 se ha convertido en un santuario laico para Diego.","rac":"El mural de Maradona fue pintado en 1990 por Mario Filardi. En la década de 1990, una ventana en la pared obstruyó su rostro y la pintura se desvaneció casi por completo. Fue restaurado por Salvatore Iodice, y en el otoño de 2017, el artista argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona el 25 de noviembre de 2020, la plaza, antes conocida como la Plaza de los Artistas, fue rebautizada en su honor y se llenó de altares, banderas y fotografías.","con":"Está muy concurrido durante la hora punta: a primera hora de la mañana es más fácil verlo con tranquilidad.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Il grande murale di Maradona sulla facciata di un palazzo, con la folla sotto","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Il murale dipinto nel 1990 da Mario Filardi. Il volto di oggi è quello ridipinto nel 2017 dall'artista argentino Francisco Bosoletti."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La targa di Largo Maradona con un busto e le bandiere","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La targa del largo: dopo la morte di Diego, nel 2020, il largo degli artisti ha preso il suo nome."},{"u":"../img/550f6edc4b91.jpg","alt":"Un altarino con foto di Maradona e ricordi","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un altarino dedicato a Maradona: in città ce ne sono tanti, con foto e ricordi lasciati dai tifosi."},{"u":"../img/679687d3070c.jpg","alt":"Maradona dipinto con l'aureola accanto a una piccola edicola","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con l'aureola e la sua edicola votiva, dipinto in zona San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Un'edicola votiva con il ritratto di Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un'edicola votiva per Maradona, come quelle dei santi."}],"leg":"","fc":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"El castillo que es el símbolo de Nápoles: un arco triunfal entre dos torres, una puerta de bronce que aún conserva el impacto de una bala de cañón y el salón donde un rey mandó arrestar a los barones durante una celebración nupcial.","rac":"Bajo el reinado de los reyes angevinos, el castillo se convirtió en un centro cultural: durante el reinado de Roberto de Anjou, artistas, médicos y hombres de letras se alojaron allí, entre ellos Giotto, Petrarca y Boccaccio.\n\nAlfonso I de Aragón la convirtió en su residencia real y la reconstruyó. Para celebrar su entrada victoriosa en la ciudad, mandó construir el gran Arco Triunfal entre la Torre Media y la Atalaya, que aún hoy sirve de entrada.\n\nEn la actualidad, el castillo alberga el Museo Cívico: la visita incluye la galería de arte en el primer piso, el Salón de los Barones, la Capilla Palatina, también conocida como la Capilla de Santa Bárbara, y una visita arqueológica a la antigua Armería.","con":"Entrada general: 10 €; 6 € para residentes de Nápoles y su área metropolitana; entrada gratuita para menores de 18 años. Cerrado los domingos.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Il Maschio Angioino con le due torri e l'arco bianco in mezzo","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Le due grandi torri e, in mezzo, l'Arco di Trionfo di Alfonso d'Aragona: è l'ingresso del castello."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"El Arco del Triunfo","x":"Esta es la entrada al castillo, situada entre dos torres: Alfonso I de Aragón la mandó construir para celebrar su entrada victoriosa en Nápoles. Deténgase frente a ella antes de entrar y admírela desde abajo.","d":"En la entrada, entre la Torre Media y la Atalaya.","foto":{"u":"../img/91d08c9a9561.jpg","alt":"L'Arco di Trionfo di marmo tra le due torri","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arco da vicino: guardalo dal basso, piano per piano."}},{"t":"La puerta con la bala de cañón","x":"Ferrante de Aragón encargó la puerta a Guglielmo Monaco alrededor de 1475 para conmemorar la victoria de 1462 sobre Juan de Anjou y los barones rebeldes: seis paneles narran la guerra. En el panel inferior izquierdo, se conserva una bala de cañón incrustada en el bronce. La teoría más aceptada es que la puerta formaba parte del botín que Carlos VIII cargó en barcos con destino a Francia; frente a la costa de Rapallo, la flota fue atacada por los genoveses y resultó dañada. Los genoveses la devolvieron a Nápoles en 1495.","d":"El original se conserva dentro del castillo.","foto":{"u":"../img/50ee03911e6d.jpg","alt":"La palla di cannone conficcata nella porta di bronzo","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La palla di cannone di ferro conficcata nel bronzo, nel pannello in basso a sinistra."}},{"t":"El Salón de los Barones","x":"Se accede a ella por la escalinata exterior de madera de piperno, diseñada por el arquitecto mallorquín Guglielmo Sagrera. Alza la vista: la bóveda se eleva hasta unos 28 metros, y dieciséis nervaduras de piperno se extienden en forma de estrella desde una abertura central. Su nombre evoca el año 1486, cuando el rey Ferrante I engañó a los barones para celebrar una boda y los hizo arrestar aquí. Durante cincuenta años, fue sede del Ayuntamiento.","d":"En lo alto de las escaleras del patio","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La volta a stella della Sala dei Baroni","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La volta della Sala dei Baroni: sedici costoloni di piperno partono a stella dall'apertura al centro."}}],"gal":[],"leg":"","fc":null},{"id":32,"s":"castel-dell-ovo","n":"Paseo marítimo y Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"El castillo en el islote donde desembarcaron los colonos griegos de Cumas: se llega desde el paseo marítimo, se cruza el puente y se puede contemplar el golfo desde Borgo Marinari.","rac":"El castillo se alza sobre el islote de Megaride, formado por dos rocas unidas por un gran arco. Aquí, a mediados del siglo VII a. C., desembarcaron colonos de Cumas, quienes más tarde fundaron Partenope en el cercano monte Echia.\n\nEn el siglo I a. C., la villa de Lucio Licinio Lúculo se alzaba sobre el islote y el monte Equia. Restos de esta villa se conservan en la Sala de las Columnas: a principios de la Edad Media, la sala servía como refectorio de uno de los conventos construidos en el islote.","con":"El interior del castillo permanecerá cerrado por reformas hasta nuevo aviso. Actualmente, los visitantes pueden contemplar el castillo desde el exterior, paseando por el paseo marítimo y los alrededores de Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"El islote de Megaride","x":"Contemple el castillo desde el paseo marítimo: se alza sobre dos rocas unidas por un gran arco. Según el ayuntamiento, fue aquí donde desembarcaron los primeros pobladores de Cumas.","d":"Desde el puente que lleva a Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo e il porticciolo del Borgo Marinari visti dall'alto","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Dall'alto: il castello sullo scoglio e, accanto, il porticciolo del Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Incisione del 1841 con Castel dell'Ovo e una barca a vela","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo in un'incisione del 1841."}],"leg":"El nombre proviene de una leyenda: se dice que el poeta Virgilio escondió un huevo, encerrado en una jaula, en las bodegas del castillo.","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"El primer paseo","sub":"Spaccanapoli en medio día, partiendo desde Ceraldi","desc":"El corazón del centro histórico en un recorrido circular: el Gesù Nuovo y su misterio, el claustro de Santa Chiara, el Cristo Velado, la Iglesia de la Calavera y las Orejas, las tiendas de Via San Biagio dei Librai. Y luego volvemos a nosotros.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista dall'alto: una strada dritta che taglia il centro storico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista dall'alto: la lunga strada dritta che taglia in due il centro storico. Il primo giro la percorre a piedi."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café en Ceraldi y nos vamos.","alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25008,40.84665],[14.25047,40.84678],[14.25086,40.84691],[14.25124,40.84703],[14.25122,40.84707],[14.25144,40.84714],[14.2517,40.84724],[14.252,40.84733]],"sv":[{"k":"parti","n":"Piazza Carità","d":242,"a":0},{"k":"gira","m":"right","n":"Via Maddaloni","d":176,"a":242},{"k":"gira","m":"slight left","n":"Piazza del Gesù Nuovo","d":76,"a":418},{"k":"arrivo","a":494}]},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38,"geo":[[14.252,40.84733],[14.25202,40.84734],[14.25211,40.84737],[14.25214,40.84734],[14.25215,40.84731],[14.25217,40.84729],[14.25221,40.84723],[14.25224,40.84718],[14.25228,40.84712],[14.25232,40.84706],[14.25234,40.84704],[14.25222,40.84698],[14.25206,40.84689],[14.25192,40.84683],[14.25182,40.84678],[14.25176,40.84676],[14.25166,40.84671],[14.25157,40.84668],[14.25155,40.84669],[14.25139,40.84625],[14.25137,40.8462],[14.25139,40.84604],[14.25141,40.84601],[14.25174,40.84557]],"sv":[{"k":"parti","n":"Piazza del Gesù Nuovo","d":14,"a":0},{"k":"gira","m":"ri
