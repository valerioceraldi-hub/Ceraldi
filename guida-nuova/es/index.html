<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía de Nápoles · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="../caratteri/caratteri.css">

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"es","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità y Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"El punto de partida: Piazza Carità, en Via Toledo. Desde aquí, el centro histórico comienza a tan solo unos minutos a pie. Y aquí está Ceraldi.","rac":"Piazza Carità domina la Via Toledo, la gran avenida que el virrey español Don Pedro di Toledo mandó abrir en el siglo XVI, cuando duplicó el tamaño de la ciudad y construyó, en la colina cercana, los cuarteles de los soldados: el Barrio Español.\n\nDesde aquí, el casco antiguo está a solo unos minutos: suba hacia la Piazza del Gesù y estará en Spaccanapoli. Bajando por Via Toledo, llegará a piazza del Plebiscito, el Palacio Real y el mar.","con":"Antes de partir, un café: la excursión es larga y Nápoles se disfruta mejor con la taza adecuada.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità hoy, con sus árboles y coloridos edificios.","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Hoy en día, Piazza Carità, en la Via Toledo: todos los tours parten de aquí. Ceraldi está aquí."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La plaza frente a Ceraldi","x":"Piazza Carità es el punto de partida de todos los recorridos: se encuentra en la Via Toledo, la gran avenida inaugurada en el siglo XVI por el virrey Don Pedro de Toledo para conectar el casco antiguo con la ciudad nueva y los barrios españoles.\n\nDesde aquí, en pocos minutos, puedes llegar a Spaccanapoli, al noreste, o al mar y los castillos, al sur. Antes de irte, tómate un café: el viaje es largo y Nápoles se disfruta mejor a pie.","d":"Frente a la cafetería","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Via Toledo y Largo della Carità en una fotografía del siglo XIX","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"Vía Toledo y Largo Carità en el siglo XIX: la gran calle encargada por Don Pedro de Toledo, que ya rebosaba de vida por aquel entonces."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Fotografía antigua de la Vía Toledo en el siglo XIX, con carruajes y transeúntes.","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La Via Toledo en el siglo XIX, cuando se llamaba Via Roma, en una fotografía de Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità y Via Toledo: un paseo por el corazón de Nápoles","x":"La historia de la plaza, contada por quienes han trabajado allí desde 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, el decumano inferior","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La calle recta que divide el centro histórico en dos: el decumano inferior de la ciudad griega, unos dos kilómetros de iglesias, tiendas y vida.","rac":"Spaccanapoli es la más baja de las tres decumanas, las calles paralelas que cruzaban Neapolis griega de oeste a este. Comienza en la Piazza del Gesù Nuovo como Via Benedetto Croce, luego se convierte en Via San Biagio dei Librai, cruza Via Duomo y continúa más allá del casco antiguo: unos dos kilómetros en total. Su nombre lo dice todo: es tan larga y recta que, vista desde arriba, parece dividir la ciudad en dos.","con":"Recorre esta avenida desde la Piazza del Gesù hacia la Via Duomo: es un ligero descenso lleno de historia, no de esfuerzo.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista desde arriba, una línea recta que atraviesa los tejados del centro histórico.","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista desde Sant'Elmo: una línea recta que atraviesa los tejados del centro histórico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La carretera que divide Nápoles","x":"Spaccanapoli es el nombre popular del decumano inferior, una de las tres grandes calles paralelas de la ciudad griega: era la \"plateia\" de Neapolis. Se llama así porque, siendo perfectamente recta, divide el centro antiguo en dos, entre el norte y el sur.\n\nCambia de nombre varias veces: Via Benedetto Croce, luego Via San Biagio dei Librai. Desde la colina, desde lo alto de Via Pasquale Scura, se puede ver toda la calle de un vistazo.\n\nA lo largo de la calle, entre la Edad Media y el siglo XIX, surgieron conventos y palacios de familias poderosas: fíjense en los portales y patios, y en las tiendas.","d":"A lo largo de toda la calle, desde Piazza del Gesù hasta Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"La línea recta de Spaccanapoli vista desde arriba","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli vista desde Castel Sant'Elmo: la línea recta que divide el casco antiguo en dos."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Plaza e Iglesia del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fachada de piedras en forma de pirámide que parece una fortaleza y esconde un misterio: inscripciones grabadas que nadie ha descifrado aún con certeza.","rac":"Antes de ser iglesia, fue un palacio: el de los príncipes Sanseverino, construido en 1470; una placa en la fachada conmemora al arquitecto, Novello da San Lucano. Los jesuitas conservaron la estructura y la sillería oscura de piperno, con las piedras talladas en forma piramidal, añadiendo elementos de mármol blanco.\n\nAlgunas piedras tienen marcas grabadas. Según la leyenda, son un mensaje secreto; algunos estudiosos creen que son las marcas dejadas por diferentes canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales de una partitura llamada \"Enigma\". Obsérvalas con atención y decide por ti mismo.\n\nLa fachada fue restaurada e inaugurada el 12 de marzo de 2023, después de que algunos fragmentos cayeran en diciembre de 2017; la plaza ha permanecido cerrada al tráfico desde entonces.","con":"Busca las marcas en las piedras a la altura de los ojos, a la derecha y a la izquierda del portal: la búsqueda es gratuita.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La fachada del Gesù Nuovo, hecha de piedras oscuras talladas en puntas","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La fachada puntiaguda en forma de diamante: fue el palacio de los príncipes Sanseverino, desde 1470. Acércate y busca las inscripciones grabadas en las piedras."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La fachada en punta de diamante","x":"Antes de ser la fachada de una iglesia, perteneció a un palacio: el palacio de la familia Sanseverino, príncipes de Salerno, construido en 1470. Cuando los jesuitas edificaron su iglesia aquí, a partir de 1584, demolieron el palacio, pero conservaron la fachada y el portal. Esto era frecuente en Nápoles: el espacio era limitado en el casco antiguo y la construcción fuera de las murallas era imposible.\n\nFíjense en las piedras: están hechas de piperno, una piedra volcánica gris muy dura, tallada con un acabado de punta de diamante (el \"rusnato\"). El gran portal barroco, con sus columnas, ángeles en el tímpano y el monograma jesuita \"IHS\", aún encierra el portal renacentista del palacio.\n\nAcércate ahora: muchas de las puntas tienen pequeñas marcas grabadas. Algunos creen que son las marcas de los equipos de canteros; la leyenda cuenta que los maestros canteros sabían cómo \"cargar\" la piedra con energía; en 2010, algunos estudiosos las interpretaron como notas musicales, una opinión que desde entonces ha sido cuestionada. No hay una respuesta definitiva: encuentra una y elige la tuya.","d":"Afuera, en la plaza","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La fachada del Gesù Nuovo está cubierta de puntos de diamante en piedra gris.","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"La sillería con punta de diamante de la fachada del Gesù Nuovo, con el portal y el gran ventanal."}},{"t":"La expulsión de Heliodoro","x":"Se trata del gran fresco que se encuentra sobre la puerta de entrada: fue pintado por Francesco Solimena, quien lo firmó y fechó en 1725. Muchos visitantes no lo ven porque entran de cara al altar: dense la vuelta.\n\nLa historia proviene de la Biblia (Segundo Libro de los Macabeos): Heliodoro intenta saquear el tesoro del Templo de Jerusalén y es repelido por un caballero celestial. Busca al caballero, a los caballos y a las figuras que huyen: es una escena teatral, llena de movimiento, tal como le gustaba al Barroco.\n\nA los lados del gran ventanal, encima del fresco, hay dos escenas más pequeñas de Belisario Corenzio, de 1638: Santa Elena encontrando la cruz y la conversión de San Pablo.","d":"En cuanto entres, dirígete hacia la puerta: está encima de la entrada.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"El gran fresco de la expulsión de Heliodoro, obra de Francesco Solimena.","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"Fresco de Solimena sobre la entrada: gire hacia la puerta para verlo. En el centro se encuentra el caballero celestial repeliendo a Heliodoro."}},{"t":"La cúpula y los cuatro evangelistas","x":"Deténgase en el centro de la iglesia, donde la nave se une al transepto, y mire hacia arriba. En los cuatro triángulos curvos que sostienen la cúpula (las pechinas) se encuentran los cuatro evangelistas pintados por Giovanni Lanfranco en el siglo XVII: son todo lo que queda de su gran ciclo, ya que el resto se perdió con la construcción de la cúpula.\n\nLa cúpula, de hecho, tuvo una historia complicada. La original se derrumbó en el terremoto de 1688; fue reconstruida, pero seguía siendo insegura y fue demolida a finales del siglo XVIII. En 1786, fue reemplazada por una cubierta más baja en forma de cuenco, que es la que se ve hoy en día; en 1975, fue reforzada con una estructura de hormigón armado.\n\nA tu alrededor se encuentra el barroco napolitano en su máxima expresión: mármol incrustado de muchos colores («marmi commessi»), estuco dorado, frescos de Belisario Corenzio y Paolo De Matteis en las bóvedas, lienzos de Luca Giordano y esculturas de Cosimo Fanzago.","d":"En el centro de la iglesia, mira hacia arriba.","foto":{"u":"../img/3dd3789513c8.jpg","alt":"La nave del Gesù Nuovo hacia la cúpula.","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nave del Gesù Nuovo: donde cruza el transepto, mire hacia la cúpula y las cuatro pechinas con los evangelistas."}},{"t":"La capilla de Sant'Ignazio","x":"Esta es la gran capilla situada al final del transepto izquierdo, dedicada a San Ignacio de Loyola, fundador de los jesuitas. La arquitectura y el mármol son obra de Cosimo Fanzago y sus colaboradores, realizados entre 1637 y 1645; a los lados del altar, las dos estatuas de los profetas David y Jeremías también son obra de Fanzago.\n\nLos lienzos que representan la vida del santo son obra de Jusepe de Ribera, el pintor español que trabajó en Nápoles y se convirtió en uno de sus maestros. El patrón, Carlo Gesualdo da Venosa, está enterrado al pie del altar.\n\nLuego, cruce la iglesia: enfrente, en el ala derecha, se encuentra la capilla \"gemela\" de San Francisco Javier, el primer misionero jesuita en Asia, con esculturas de Fanzago y, arriba, tres lienzos de Luca Giordano de 1676-77. Obsérvelos uno tras otro: son el arte napolitano del siglo XVII en su máxima expresión.","d":"En una de las dos grandes capillas de la iglesia.","foto":{"u":"../img/835d153e2859.jpg","alt":"Un lienzo de Ribera con San Ignacio en gloria.","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"San Ignacio en la Gloria, un lienzo de Jusepe de Ribera en la capilla dedicada al fundador de los jesuitas."}},{"t":"San José Moscati","x":"Aquí reposan los restos del \"santo doctor\" de Nápoles: Giuseppe Moscati, médico y profesor universitario que atendió gratuitamente a los más pobres e incluso les brindó ayuda económica. Falleció en 1927 y fue canonizado por el papa Juan Pablo II en 1987.\n\nSu cuerpo reposa en la urna de bronce situada en el centro de la Capilla de la Visitación, la segunda a la derecha, donde fue trasladado en 1977. La urna es obra de Amedeo Garufi: observe los tres bajorrelieves, que lo representan dando clases en la universidad, curando a un niño en brazos de su madre y cuidando a los enfermos en el hospital. A la izquierda se encuentra su estatua de bronce, de 1990.\n\nDesde la capilla de San Francesco Saverio, una puerta conduce a las habitaciones de San Giuseppe Moscati: fotografías, manuscritos, su ropa e instrumental médico, así como el estudio y el dormitorio de su casa, reconstruidos aquí. En estas mismas habitaciones se exhibe una bomba de la Segunda Guerra Mundial que cayó sobre el techo de la iglesia sin explotar.","d":"En la capilla de la Visitación, bajo el altar","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La habitación reconstruida de San Giuseppe Moscati: bata blanca e instrumental médico en una vitrina.","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"En la habitación reconstruida: la bata blanca, los instrumentos médicos y las fotografías de San Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La plaza Gesù Nuovo frente a la iglesia.","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La plaza de Gesù Nuovo, frente a la iglesia."},{"u":"../img/6d1ae4837518.jpg","alt":"El interior del Gesù Nuovo, con mármoles de colores y el altar mayor.","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"En el interior, el contraste con la austera fachada: mármol de colores, frescos y oro hasta el altar mayor."},{"u":"../img/3dd3789513c8.jpg","alt":"La nave del Gesù Nuovo vista desde la entrada.","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nave vista desde la entrada: abajo, arriba, la cúpula con los evangelistas de Lanfranco en la base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monasterio y complejo de Santa Chiara (claustro de mayólica)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"El claustro revestido de mayólica es uno de los lugares más tranquilos del centro: a un paso del caos de Spaccanapoli, un remanso de paz.","rac":"Santa Chiara fue construida en 1310 por orden del rey Roberto de Anjou y la reina Sancha de Mallorca. La construcción fue dirigida primero por Gagliardo Primario y luego por Lionardo di Vito, y en 1340 la iglesia se inauguró para el culto. El complejo constaba de dos partes: un convento para las clarisas y otro para los frailes menores, contiguos pero separados.\n\nCuatro siglos después, a sugerencia de la reina María Amalia de Sajonia, esposa de Carlos de Borbón, se renovó el claustro de las Clarisas. El arquitecto Domenico Antonio Vaccaro conservó los arcos góticos del siglo XIV y transformó el centro en un jardín barroco, revestido con azulejos de mayólica del taller de Donato y Giuseppe Massa. El resultado es uno de los lugares más sorprendentes de Nápoles: un jardín de cerámica a pocos pasos de Spaccanapoli.\n\nLa iglesia es de estilo gótico, con una fachada que presenta una amplia aguja que enmarca el antiguo rosetón, y en su interior cuenta con una sola nave con diez capillas a cada lado. El bombardeo del 4 de agosto de 1943 la afectó gravemente: también destruyó parte de los frescos del claustro, y la reconstrucción restauró las formas góticas que el estuco del siglo XVIII había ocultado.\n\nBajo el complejo se esconde otra sorpresa: los restos de unas termas romanas, descubiertas durante la restauración de la posguerra. Contaba con un gimnasio, una piscina cubierta y salas para baños de aire caliente: son el testimonio más completo de las antiguas termas de Neapolis.","con":"Los domingos, el claustro cierra a las 2 de la tarde: si es domingo por la tarde, cambien de orden y vengan aquí primero.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"La entrada al claustro de Santa Clara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"La entrada al claustro de mayólica de Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Claustro y museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Claustro y museo"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Los pilares de mayólica","x":"El jardín está dividido en cuatro secciones por dos senderos que se cruzan, y a lo largo de estos senderos discurren 64 pilares octogonales, todos revestidos de mayólica. La decoración consiste en guirnaldas de hojas, flores y frutas; los colores más comunes son el amarillo, el naranja y el azul, elegidos para evocar los cítricos y las vides de la pérgola que crece en la parte superior.\n\nLos azulejos de mayólica proceden del taller de Donato y Giuseppe Massa, quienes siguieron el diseño del arquitecto napolitano Domenico Antonio Vaccaro: buscaba que los esmaltes, la arquitectura y la vegetación se fusionaran. Los pilares rematan en capiteles de piperno y están conectados por asientos, también completamente de mayólica.\n\nEl claustro se transformó así en los años cercanos a 1742, cuando la abadesa era Sor Ippolita Carmignano: fue la reina María Amalia de Sajonia, esposa de Carlos de Borbón, quien presionó repetidamente a las monjas para que lo \"modernizaran\".","d":"En el jardín del claustro","foto":{"u":"../img/924627d30fda.jpg","alt":"Pilares revestidos de azulejos de mayólica amarillos y verdes en el claustro.","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Las columnas, revestidas de mayólica con guirnaldas de hojas, flores y frutas, se encuentran bajo la pérgola."}},{"t":"Las escenas en los asientos","x":"Siéntese: los asientos que conectan las columnas son todos de mayólica, y los respaldos están pintados con pequeñas escenas del siglo XVIII. Hay escenas del campo, del mar, de fiestas populares e historias mitológicas: una narración contada a través de figuras de la vida de la época.\n\nLas escenas continúan en el muro bajo que rodea los macizos de flores: camine despacio por los senderos y mire hacia abajo, así como hacia los lados.\n\nUn consejo: es un juego genial para jugar con niños. Elijan una escena cada uno y cuéntense qué está pasando: quién está pescando, quién está bailando, quién está trabajando en el campo.","d":"En los respaldos de los asientos entre los pilares","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un asiento de mayólica con una escena pintada en el respaldo.","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un asiento de mayólica procedente del claustro: en el respaldo hay una escena pintada."}},{"t":"Clarissa con los gatos","x":"Entre todas las escenas de los respaldos, una evoca el propio monasterio: una monja clarisa alimentando a los gatos que vivían en el claustro. Es un pequeño instante de la vida cotidiana, pintado en mayólica en el siglo XVIII por el taller de Massa.\n\nLas Clarisas son las monjas de la orden de Santa Clara: el complejo, de hecho, nació con dos conventos cercanos pero separados, uno para las Clarisas y otro para los Frailes Menores.\n\nEncontrarlo es una búsqueda del tesoro perfecta, incluso para niños: revisen los asientos uno por uno. Si no lo encuentran, pregunten al personal del claustro.","d":"En uno de los respaldos de los asientos: búscalo","foto":null},{"t":"Los arcos del siglo XIV","x":"El jardín es barroco, pero el entorno es medieval. El complejo fue encargado en 1310 por el rey Roberto de Anjou y la reina Sancha de Mallorca; la obra fue dirigida por Gagliardo Primario y luego por Lionardo di Vito, y la iglesia se abrió al culto en 1340.\n\nCuando Vaccaro remodeló el jardín en el siglo XVIII, conservó el perímetro del siglo XIV: los arcos apuntados sobre pilares de piperno. Nótese el contraste entre la austera piedra de los arcos y los colores vivos de los azulejos de mayólica: cuatro siglos en una sola mirada.\n\nLas paredes, en sus cuatro lados, están adornadas con frescos de la primera mitad del siglo XVII, obra de un artista desconocido, posiblemente de la escuela de Belisario Corenzio, que representan escenas del Antiguo Testamento. Al entrar, la primera sección de la pared a la derecha está vacía: esos frescos fueron destruidos por el bombardeo del 4 de agosto de 1943.","d":"A lo largo de los cuatro lados del claustro","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Los arcos del claustro de Santa Clara vistos a contraluz, con la iglesia al fondo.","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Los arcos góticos del claustro de Santa Chiara, vistos a contraluz: la fachada de la iglesia al fondo."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Mayólica con una escena de caza de jabalíes.","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"En detalle: una escena de caza de jabalíes pintada sobre mayólica por el taller de Massa, entre 1739 y 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"El claustro con columnas de mayólica, bancos y jardín.","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Todo el claustro: las columnas de mayólica, los bancos y el jardín."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Capilla Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"El Cristo Velado, una de las esculturas más famosas del mundo, y las máquinas anatómicas del príncipe alquimista Raimondo di Sangro.","rac":"La capilla de la familia di Sangro es el reino de Raimondo, príncipe de Sansevero: un hombre de ciencia y secretos, Gran Maestro de la Francmasonería, en torno al cual nació el mito cuando aún vivía, y fue él mismo quien lo alimentó.\n\nEn el centro se encuentra el Cristo Velado de Giuseppe Sanmartino, encargado por el príncipe: un cuerpo reclinado cubierto por un sudario tan fino que parece tela mojada, pero tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea se hallan dos «máquinas anatómicas», esqueletos de un hombre y una mujer con vasos sanguíneos reconstruidos, obra del médico palermitano Giuseppe Salerno entre 1756 y 1764. La leyenda negra habla de sirvientes sacrificados e inyecciones misteriosas; el museo, por su parte, distingue cuidadosamente el mito de la historia documentada.","con":"Está cerrado los martes: si hoy es martes, la estatua del Nilo está a dos minutos y siempre se puede ver.","acc":"La nave y la sacristía son accesibles para personas en silla de ruedas. Al auditorio subterráneo, con sus máquinas anatómicas, solo se puede acceder por una estrecha escalera de caracol del siglo XIX.","foto":{"u":"../img/65421f883be6.jpg","alt":"El exterior de la Capilla Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La capilla Sansevero vista desde el exterior."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"El Cristo velado","x":"En el centro de la capilla yace un cuerpo tendido sobre un colchón, con la cabeza y el torso elevados por una almohada, cubierto por una mortaja tan fina que se pueden ver el rostro, las heridas y las venas. El velo no es un añadido posterior: Giuseppe Sanmartino lo esculpió en 1753 a partir del mismo bloque de mármol que la estatua, por encargo del príncipe Raimondo di Sangro.\n\nUn documento firmado por el príncipe para pagar al escultor dice: \"una estatua de mármol de tamaño natural, que representa al Señor Jesucristo muerto, cubierta por un sudario transparente tallado en el mismo bloque que la estatua\". Durante siglos, se dijo que el velo era tela real transformada en mármol mediante un proceso alquímico por el príncipe: esto es solo una leyenda.\n\nFíjate en los detalles: la herida en su costado, las marcas de los clavos en su mano y, a sus pies, la corona de espinas y los clavos de la Pasión. Luego, camina lentamente a su alrededor: a cada lado, el velo parece cambiar.","d":"En el centro de la nave","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"El rostro de Cristo velado bajo el velo de mármol.","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"El rostro bajo el velo: la mortaja está tallada en el mismo bloque de mármol que la estatua, pero parece un paño mojado."}},{"t":"Modestia","x":"Una joven envuelta en un velo que se adhiere a su piel como si estuviera mojado, con una guirnalda de rosas en el cabello. Fue esculpida en 1752 por el veneciano Antonio Corradini, un escultor de renombre en toda Europa que también había trabajado para el emperador en Viena. Falleció ese mismo año, mientras diseñaba otras decoraciones de la capilla, como consta en una placa en el pilar.\n\nEl príncipe Raimondo se la dedicó a su madre, Cecilia Gaetani dell'Aquila d'Aragona, fallecida el 26 de diciembre de 1710, cuando él aún no había cumplido un año. Busca los símbolos de una vida truncada prematuramente: la mirada perdida, el árbol que brota de la piedra y la lápida rota a sus pies.\n\nEn la base hay un bajorrelieve con la inscripción \"Noli me tangere\", que representa a Cristo resucitado apareciéndose a María Magdalena. El museo señala que la mujer velada también puede interpretarse como una imagen de la Sabiduría y evoca a la diosa velada Isis.","d":"Cerca del altar mayor","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La estatua de la Modestia, una mujer cubierta por un velo.","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La modestia, de Antonio Corradini: el velo se adhiere a su cuerpo como si estuviera mojado. A sus pies, una lápida rota."}},{"t":"La desilusión","x":"Un hombre se libera de una gran red, ayudado por un pequeño genio alado con una llama en la frente, símbolo del intelecto humano. A sus pies yace un globo terráqueo, que representa las pasiones del mundo, con una Biblia abierta sobre él. Fue esculpida por el genovés Francesco Queirolo entre 1753 y 1754.\n\nEl príncipe se la dedicó a su padre, Antonio: tras enviudar, había dejado a su hijo con su abuelo y viajado por Europa, llevando una vida disoluta. Luego, ya anciano y arrepentido, regresó a Nápoles y se ordenó sacerdote. La red es el pecado del que el hombre se libera.\n\nObserven atentamente la red: es toda de mármol, perforada malla a malla. Se dice que los artesanos encargados de su acabado se negaron a tocarla por temor a romperla, y que Queirolo tuvo que alisarla él mismo. Ya en 1753, un contemporáneo la describió como «la última hazaña audaz que la escultura en mármol puede atreverse a emprender».","d":"Cerca del altar mayor","foto":{"u":"../img/921cf7f91318.jpg","alt":"La estatua de la Desilusión, un hombre liberándose de una red.","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"La desilusión de Francesco Queirolo: la red está hecha íntegramente de mármol, perforada a mano."}},{"t":"El suelo laberíntico","x":"El suelo que pisas no es el original. El príncipe había diseñado uno laberíntico: mármoles de colores, desde el azul hasta el blanco, cruzados por una línea continua de mármol blanco sin juntas, formando esvásticas que se alternan con cuadrados concéntricos en perspectiva. Francesco Celebrano lo ejecutó a partir de mediados de la década de 1760; el propio príncipe escribió que la obra fue «difícil y estuvo plagada de obstáculos».\n\nEn 1889, un grave derrumbe afectó al palacio y a la capilla, dañando el suelo: en lugar de restaurarlo, se rehízo en terracota napolitana, con esmalte amarillo y azul que correspondía al escudo de armas de los di Sangro.\n\nBusque las losas originales en el pasadizo frente a la tumba de Raimondo di Sangro; otras se encuentran en la cávea subterránea y en la sacristía. Para el príncipe, el laberinto representaba el arduo camino que conduce al conocimiento.","d":"En el pasaje frente a la tumba del príncipe","foto":null},{"t":"Las máquinas anatómicas","x":"Desciende por la estrecha escalera hasta la cávea subterránea: dentro de dos vitrinas se encuentran los esqueletos de un hombre y una mujer, con los sistemas arteriales y venosos casi intactos, hasta los vasos más finos.\n\nFueron creadas por el doctor Giuseppe Salerno, de Palermo. El príncipe adquirió la estatua masculina en 1756, tras verla en una demostración pública en Nápoles. Contrató a Salerno para que hiciera la segunda. Ambas se encontraban en el palacio, en una sala llamada el \"Apartamento Fénix\". La estatua femenina estaba sobre una plataforma giratoria que permitía observarla desde todos los ángulos.\n\nEn torno a ellas surgió una «leyenda negra»: se decía que el príncipe había mandado matar a dos sirvientes y les había inyectado una sustancia misteriosa. En realidad, los jarrones son reconstrucciones hechas con diversos materiales, como cera de abeja y tintes; el conocimiento anatómico que demuestran, para la época, es asombroso.","d":"En la cávea subterránea, bajando por una estrecha escalera de caracol","foto":{"u":"../img/a3a047434411.jpg","alt":"Un esqueleto con el sistema vascular en la vitrina de la cávea.","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"Una de las dos máquinas anatómicas de Giuseppe Salerno en la cávea subterránea: esqueleto y sistema circulatorio."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"El interior de la Capilla Sansevero con las estatuas","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La capilla en su totalidad: en el centro, el Cristo Velado, rodeado por las estatuas de la familia di Sangro."}],"leg":"Mucho se habló de Raimondo di Sangro durante su vida: experimentos misteriosos, secretos alquímicos e incluso sirvientes transformados en máquinas anatómicas. El museo distingue cuidadosamente la leyenda negra de los hechos documentados: vale la pena escuchar ambas versiones y tomar partido.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"La iglesia donde vivió y enseñó Santo Tomás de Aquino y donde, según la tradición, un crucifijo le habló.","rac":"El complejo dominico domina la plaza homónima, en la avenida Spaccanapoli. La iglesia, de estilo gótico-angélico, fue construida entre 1283 y 1324 y posteriormente transformada en la época barroca. Tomás de Aquino vivió y enseñó en el convento entre 1272 y 1274; Giordano Bruno y Tommaso Campanella también tuvieron vínculos con el lugar.\n\nEn la sacristía, cuya bóveda fue decorada con frescos por Francesco Solimena en 1709, se encuentran las tumbas de los gobernantes aragoneses. Durante siglos, la basílica también albergó una obra maestra de Caravaggio, la Flagelación de Cristo, que actualmente se conserva en el Museo de Capodimonte.\n\nActualmente, el complejo también puede visitarse como museo DOMA: la sacristía, las tumbas aragonesas y la celda de Santo Tomás.","con":"Si tienes tiempo, no dejes de explorar el museo: la sacristía, las tumbas aragonesas y la celda de Santo Tomás. El horario varía y algunas secciones pueden estar cerradas por reformas; consulta la página web oficial antes de venir.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"La aguja de San Domenico y el ábside de la iglesia en la plaza.","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"La aguja de San Domenico y, detrás, el ábside de la iglesia."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visitas guiadas."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"El crucifijo que le habló a Santo Tomás","x":"Se trata de un panel pintado, conservado en la basílica. La tradición cuenta que Cristo se dirigió a Tomás de Aquino, quien rezaba tras escribir sobre teología: le dijo que había escrito bien sobre él y le preguntó qué recompensa deseaba. El Ministerio de Cultura recuerda este panel como aquel que «habló» con el santo y que fue trasladado a una nueva capilla en 1437.","d":"Dentro de la basílica, en la capilla del Crucifijo.","foto":{"u":"../img/4b0972ad805f.jpg","alt":"La capilla del Crucifijo en San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"La capilla del Crucifijo en San Domenico Maggiore, donde se conserva la pintura del milagro."}},{"t":"La sacristía de Solimena y las tumbas aragonesas","x":"La bóveda de la sacristía fue decorada con frescos por Francesco Solimena en 1709, que representan el Triunfo de la Orden Dominicana. A lo largo de las paredes se encuentran las criptas de los soberanos aragoneses y otros dignatarios de la corte.","d":"En la sacristía, visite el museo DOMA.","foto":{"u":"../img/07519e21f0fa.jpg","alt":"La sacristía de San Domenico Maggiore con su bóveda decorada con frescos.","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"La sacristía de San Domenico Maggiore, con la bóveda de Francesco Solimena y los arcos aragoneses."}},{"t":"La celda de Santo Tomás","x":"Santo Tomás de Aquino vivió y estudió aquí. La celda ha sido restaurada y se puede visitar junto con el museo DOMA.","d":"En la ruta del museo","foto":{"u":"../img/f68192e11f82.jpg","alt":"La celda de Santo Tomás de Aquino con relicario y mobiliario.","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"La celda de Santo Tomás de Aquino en el convento de San Domenico Maggiore."}}],"gal":[],"leg":"Se dice que el crucifijo pintado sobre madera, conservado en la basílica, habló con Santo Tomás de Aquino mientras rezaba: le dijo que había escrito bien de él y le preguntó qué recompensa deseaba.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli y estatua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una estatua romana del dios Nilo, confundida durante siglos con una mujer amamantando: el \"Cuerpo de Nápoles\".","rac":"En la Piazzetta Nilo, a lo largo de la Via San Biagio dei Librai, también conocida como Spaccanapoli, se encuentra una estatua de mármol de los siglos II-III d. C. que representa al dios del río Nilo: un hombre barbudo recostado con una cornucopia, rodeado de querubines que simbolizan las ramas del río. Fue erigida por mercaderes alejandrinos que vivían en esta zona, llamada Regio Nilensis.\n\nFue hallada sin cabeza en 1476. Los napolitanos la confundieron con una figura femenina amamantando niños, símbolo de la ciudad que nutre a sus habitantes; de ahí el nombre de \"Corpo di Napoli\", que aún hoy da nombre a la plaza. En 1657, fue colocada sobre una nueva base, y en el mismo siglo se esculpió una cabeza barbuda.\n\nHoy en día, la estatua sigue en pie, como recordatorio de las raíces multiculturales de Nápoles.","con":"Tómate tu tiempo: es una parada de cinco minutos en la carretera Spaccanapoli. Busca los querubines en el cuerpo de la diosa: explican por qué la confundieron con una mujer.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"La antigua estatua del dios Nilo, tumbado.","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La estatua del dios Nilo, reclinado, en la pequeña plaza que lleva su nombre."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"El dios Nilo y los querubines","x":"El dios del río yace de costado, sosteniendo una cornucopia. Los querubines que lo rodean simbolizan las ramas del Nilo. Para quienes contemplaron su figura sin cabeza durante un buen rato, se asemejaba a una mujer amamantando.","d":"En el centro de la plaza","foto":{"u":"../img/83dce4234fd4.jpg","alt":"La estatua del dios Nilo reclinado con putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"El dios Nilo recostado con la cornucopia y querubines."}},{"t":"¿Por qué \"Corpo di Napoli\"?","x":"La estatua fue hallada sin cabeza en 1476. Esto dio lugar a la creencia de que se trataba de una figura femenina alimentando a sus hijos: la propia ciudad. El nombre perduró, incluso después de que la estatua recibiera una nueva cabeza.","d":"En la base y en el nombre de la plaza","foto":{"u":"../img/c0e842c87218.jpg","alt":"La estatua del Nilo sobre su pedestal en la plaza","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"La estatua en la base del Largo Corpo en Nápoles."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai y sus tiendas","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La zona de libreros y artesanos de Spaccanapoli: tiendas, iglesias y el Hospital de Muñecas.","rac":"Este es el tramo de Spaccanapoli que va desde la Piazzetta Nilo hasta la Via Duomo, en el decumano inferior. Su nombre proviene de las librerías que siempre se han ubicado allí: una inscripción en el cercano Palazzo Marigliano conmemora el arte de los maestros libreros. La devoción a San Blas se remonta al siglo VIII, cuando unas monjas de Armenia trajeron una reliquia del santo a Nápoles. También en esta calle se encuentra el Ospedale delle Bambole, un taller artesanal que se ha transmitido de generación en generación.","con":"Diciembre es el mes de las tiendas de belenes: prepárense para las multitudes los fines de semana.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Vista de frente de la Via San Biagio dei Librai: una calle estrecha y empedrada, flanqueada por edificios altos con balcones, ropa tendida para secar, tiendas y peatones, y al fondo, la colina de Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"Via San Biagio dei Librai, el tramo más animado de Spaccanapoli, repleto de tiendas y conversaciones animadas."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La calle de los libreros","x":"San Biagio dei Librai conecta la Piazzetta Nilo con la Via Duomo y forma parte del decumano inferior. Su nombre evoca las numerosas librerías que siempre han existido en este lugar, así como la iglesia de San Biagio Maggiore, dedicada al santo patrón de los enfermos de garganta. Esta devoción llegó en el siglo VIII con unas monjas armenias que trajeron una reliquia del santo.\n\nEl filósofo e historiador Giambattista Vico nació en esta calle.\n\nCamine despacio: es una de las calles más animadas de Nápoles, siempre llena de gente.","d":"En el camino","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai: el callejón estrecho, las tiendas y una pancarta que cuelga en lo alto","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai: la calle estrecha y recta del decumano inferior, con tiendas y gente paseando."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella en la librería y la calavera con orejas","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Una pequeña iglesia de cantero dedicada al santo de los ojos, y un cráneo singular: el que tiene orejas.","rac":"Fundada poco antes de 1327 por Bartolomeo di Capua, jurista de los reyes angevinos, la iglesia fue entonces confiada a los pipernieri, los canteros: eligieron a Santa Lucía, protectora de la vista, porque las astillas de su oficio ponían en riesgo sus ojos.\n\nAbandonada durante más de treinta años, fue reabierta el 5 de abril de 2019 gracias a la asociación Respiriamo Arte. En su bóveda subterránea, el culto de las \"anime pezzentelle\" (almas enfermas) dejó un cráneo único: tiene orejas.","con":"Es pequeño y se puede visitar en tan solo unos minutos: perfecto como descanso entre Sansevero y Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"El portal de Santa Luciella en el callejón","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"El portal de Santa Luciella. Mira hacia arriba: arriba se encuentra el fresco con el escudo de armas de los Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"El escudo de armas de los Pipernieri","x":"Antes de entrar, mire hacia arriba: sobre el portal del piperno todavía se conserva el fresco con el escudo de armas del gremio de los pipernieri, los canteros a quienes pertenecía la iglesia.\n\nTrabajaban con cinceles y martillos sobre piperno, una piedra muy dura, y temían que las astillas se les clavaran en los ojos; por eso eligieron a Santa Lucía, protectora de la vista. Era un gremio poderoso; incluso se decía que podían infundir a las piedras energías buenas o malas.\n\nLa iglesia es muy antigua: fue fundada poco antes de 1327 por Bartolomeo di Capua, consejero de los reyes angevinos. En la vista de Nápoles de Baratta de 1629, aparece como la capilla de los molineros; fue reconstruida en el siglo XVIII. Permaneció cerrada y abandonada durante más de treinta años, hasta que la asociación Respiriamo Arte la reabrió el 5 de abril de 2019.","d":"Sobre el portal de entrada","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"El fresco sobre el portal de Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"El fresco sobre el portal de Santa Luciella, con el escudo de armas de la corporación de pipernieri."}},{"t":"El cráneo con orejas","x":"Debajo de la iglesia, en el hipogeo, se encuentra un cráneo con cartílago de oreja momificado conservado; por ello, se considera único. La tradición popular sostiene que, precisamente por tener orejas, escucha mejor las plegarias de quienes le piden un favor.\n\nEl hipogeo solo se puede visitar con una visita guiada. Gracias al proyecto \"Senderos de Luz\", apoyado por FAI e Intesa Sanpaolo, las luces se encienden poco a poco, alternando entre zonas iluminadas y en sombra: déjese guiar.\n\nRecuerda que es un lugar vinculado a los difuntos y a la devoción: se le mira con respeto, en voz baja.","d":"En el hipogeo, con visita guiada.","foto":{"u":"../img/7a5a070c0866.jpg","alt":"El cráneo con orejas en el hipogeo de Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"El cráneo con las orejas: se pueden ver los cartílagos momificados en los laterales del cráneo."}},{"t":"Las pobres almas","x":"En el siglo XVII, la peste mató a miles de personas en Nápoles: los muertos fueron enterrados en fosas comunes y sus nombres se perdieron. Así nació el culto a las \"anime pezzentelle\", las pobres almas que murieron sin nombre, sin funeral y sin oraciones.\n\nQuien pedía una gracia (una curación, un embarazo, ayuda) \"adoptaba\" uno de esos cráneos, la \" capuzzelle \": lo limpiaban, lo colocaban en un nicho y rezaban por él, para que el alma llegara al Cielo y allí recordara a quien lo había ayudado.\n\nEl culto a Santa Luciella estaba profundamente arraigado. Se le puede encontrar en Purgatorio ad Arco, en Via dei Tribunali, y su lugar simbólico es el cementerio Fontanelle, en el barrio de Sanità.","d":"En el hipogeo","foto":{"u":"../img/8110a7061c73.jpg","alt":"Calaveras iluminadas por la luz de las velas, con una placa \"por la gracia recibida\".","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Cráneos en vitrinas: una placa reza el nombre de la persona que concedió el favor, una forma de agradecer a las almas \"mendignas\"."}}],"gal":[],"leg":"Se dice que el cráneo con orejas, precisamente por tenerlas, escucha mejor las oraciones: por esta razón, durante generaciones se le han confiado las peticiones más difíciles.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Hospital de muñecas","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una tienda que lleva generaciones seleccionando muñecas y juguetes: un escaparate que niños y adultos siempre recordarán.","rac":"A finales del siglo XIX, Luigi Grassi trabajaba como escenógrafo para teatros y belenes. Los vecinos comenzaron a traerle muñecas y juguetes rotos, y su taller se convirtió, casi por casualidad, en el primer \"hospital\" de juguetes de Nápoles.\n\nHoy en día, Tiziana, bisnieta del fundador, lo dirige en el patio del Palazzo Marigliano, en Via San Biagio dei Librai. En su interior, funciona como un hospital de verdad: batas blancas, salas y un historial clínico para cada paciente. Para muchos napolitanos, es el lugar donde llevaban su juguete favorito de niños.","con":"El escaparate por sí solo ya justifica la parada: está de camino de vuelta.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"El escaparate del hospital de muñecas lleno de muñecas.","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"El escaparate del Hospital de Muñecas: muñecas y juguetes esperando a ser \"curados\"."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Horario de apertura en octubre y noviembre: puede variar en otras épocas del año."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Horario de apertura en octubre y noviembre: puede variar en otras épocas del año."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un hospital de verdad, para juguetes.","x":"No es una tienda, sino un laboratorio organizado como un hospital: los pacientes son muñecas, ositos de peluche y animales de peluche, cada uno con su propia historia.\n\nLos \"médicos\" trabajan con batas blancas, divididos en departamentos como en un hospital real: ortopedia, oftalmología y sastrería. Cada paciente tiene su propio historial clínico y diagnóstico.\n\nEs un lugar que encanta a los niños, pero también a los adultos que encuentran allí juguetes de su infancia.","d":"En la tienda","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Cabezas de muñeca en espera de reparación","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Cabezas, brazos y ojos de muñecas a la espera de ser cuidados: en el taller, cada pieza tiene su propio \"departamento\"."}},{"t":"El diseñador de escenografía fundador","x":"Todo comenzó a finales del siglo XIX con Luigi Grassi, quien construía decorados para teatros y belenes. Los vecinos comenzaron a traerle juguetes rotos, y él transformó su taller en el primer \"hospital\" para muñecas.\n\nDesde entonces, la tienda ha pasado de generación en generación dentro de la misma familia: hoy en día, los pacientes son atendidos por Tiziana, su bisnieta.\n\nPiensa en la conexión con la ciudad: Nápoles es la ciudad de los belenes, y la Via San Gregorio Armeno, la calle de las tiendas de los pastores, está a tiro de piedra de aquí.","d":"En la historia de la tienda","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"La puerta de la tienda del Hospital de Muñecas con las ventanas","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"La entrada al Hospital de Muñecas en Via San Biagio dei Librai: la tienda inaugurada por la familia Grassi."}},{"t":"El patio del Palacio Marigliano","x":"El hospital está situado en el patio del Palazzo Marigliano, en el número 39 de Via San Biagio dei Librai: uno de los edificios renacentistas napolitanos vinculados a los nombres de los arquitectos Giovanni Francesco Mormando y Giovanni Francesco di Palma.\n\nAl entrar por la puerta principal, el bullicio de la calle se desvanece: es uno de los muchos patios escondidos del centro histórico que merece la pena descubrir. Además, en el edificio hay una inscripción que recuerda que antiguamente se alzaba cerca una basílica augustea.\n\nMerece la pena visitar toda la calle: es el \"decumano inferior\" de la ciudad griega, la calle de los libreros, y aquí nació el filósofo Giambattista Vico.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"El patio amarillo del Palazzo Marigliano con el arco de entrada.","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"El patio del Palazzo Marigliano, con su arco de entrada y sus fachadas de color ocre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Vía San Gregorio Armeno, la calle de los belenes","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Un callejón estrecho donde la Navidad dura todo el año: talleres de artesanos, pastores de terracota y belenes.","rac":"La Via San Gregorio Armeno conecta la Via dei Tribunali con la Via San Biagio dei Librai, también conocida como Spaccanapoli. Es la calle de los belenes: los talleres artesanales exhiben figuritas y belenes durante todo el año, incluso en verano. Según algunas fuentes, la tradición de producir figuritas de terracota en esta zona se remonta a la época romana; el belén napolitano alcanzó fama internacional en el siglo XVIII.\n\nEntre las tiendas históricas se encuentran Gambardella, en funcionamiento desde 1800, y los Hermanos Capuano, fundados en 1840. A lo largo de la calle también se encuentra el monasterio de San Gregorio Armeno, del que la calle toma su nombre, con la iglesia dedicada a Santa Patrizia, copatrona de Nápoles.\n\nEl periodo de mayor afluencia es desde finales de noviembre hasta la Epifanía, cuando la calle está muy concurrida.","con":"Ven temprano por la mañana y entre semana: en diciembre se llena de gente. Busca a los pastores que cuentan la actualidad: cada año los artesanos crean nuevas historias.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"La calle de los belenes, estrecha y llena de tiendas.","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Vía San Gregorio Armeno, la calle de los belenes."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Las tiendas de belenes","x":"En los talleres se elaboran pastores y belenes en terracota y corcho, a menudo pintados a mano. Junto a las figuras tradicionales, se encuentran personajes contemporáneos: cada año, los artesanos crean nuevos. También se puede curiosear sin comprar nada: muchos artesanos trabajan a la vista del público.","d":"A lo largo de todo el camino","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"Un puesto lleno de pastores de belén","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Un puesto en la calle de los pastores, entre figuras tradicionales y personajes modernos."}},{"t":"El monasterio de San Gregorio Armeno","x":"El monasterio da nombre a la calle. La iglesia conserva un artesonado de Teodoro d'Errico y frescos de Luca Giordano, como la Gloria de San Gregorio. El complejo también incluye una iglesia dedicada a Santa Patricia, copatrona de Nápoles.","d":"Dentro del monasterio, a lo largo de la calle","foto":{"u":"../img/30ec6bba5546.jpg","alt":"La nave de la iglesia de San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"La iglesia de San Gregorio Armeno, con su techo artesonado y frescos."}},{"t":"Cuándo ir","x":"Las tiendas están abiertas todo el año. La época de mayor afluencia es desde finales de noviembre hasta la Epifanía, cuando las calles se llenan de gente: los días laborables y las primeras horas de la mañana son los mejores.","d":"A lo largo de todo el camino","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Concurrida vía San Gregorio Armeno","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Vía San Gregorio Armeno: mejor entre semana y a primera hora de la mañana."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore y las excavaciones Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Una iglesia gótica del siglo XIII que esconde, diez metros bajo la nave, el mercado de la antigua Neapolis: calles, tiendas y habitaciones de hace dos mil años.","rac":"La Piazza San Gaetano es el corazón de la antigua Neapolis. La basílica gótica de San Lorenzo Maggiore, una de las iglesias más antiguas de la ciudad, fue construida en el siglo XIII sobre los restos del mercado grecorromano. El complejo también incluye el convento, el Museo de la Ópera y las excavaciones arqueológicas.\n\nLas excavaciones, que comenzaron en 1976, sacaron a la luz el macellum, el mercado, que antiguamente se ubicaba a lo largo del decumano mayor. Descendiendo unos diez metros por debajo de la iglesia, se puede recorrer un recorrido por calles, tiendas y habitaciones que datan del período imperial. También se descubrieron bajo la iglesia los restos de una basílica cristiana del siglo VI.\n\nEl Museo de la Ópera, ubicado en el convento y la torre cívica, narra la historia de Nápoles desde la época clásica hasta el siglo XIX.","con":"Desciende a las excavaciones: esta es la parte que no te esperas. Calcula unos 45 minutos y consulta el horario en la página web oficial antes de venir.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"La fachada de San Lorenzo Maggiore en la Piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, con vistas a la Piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"El horario está publicado en la página web del Ministerio de Cultura y en fuentes turísticas; la página web oficial no era legible: por favor, compruébelo antes de darlo por seguro."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"El mercado debajo de la iglesia","x":"Las excavaciones revelan el macellum de la Neapolis grecorromana, el mercado que se ubicaba a lo largo del antiguo decumano mayor. Se encuentran a unos diez metros por debajo de la iglesia. Al caminar entre las estructuras, se puede
