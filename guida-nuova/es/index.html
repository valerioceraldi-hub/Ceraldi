4853,40.83695],[14.24855,40.83698],[14.24856,40.83703],[14.24835,40.83738],[14.24834,40.83739],[14.24834,40.8374],[14.24834,40.83741],[14.24833,40.83772],[14.24833,40.83774],[14.24833,40.83775],[14.24834,40.83807],[14.24837,40.83807],[14.24837,40.83813],[14.24837,40.83837],[14.24838,40.83849],[14.24838,40.8388],[14.24839,40.83896],[14.24839,40.83921],[14.24839,40.83925],[14.24841,40.83939],[14.24847,40.83974],[14.24853,40.84009],[14.24853,40.8401],[14.24857,40.84036],[14.24857,40.84039],[14.2486,40.8406],[14.24863,40.84084],[14.24867,40.84112],[14.24868,40.84115],[14.24871,40.84139],[14.24873,40.8415],[14.24873,40.84152],[14.24874,40.84155],[14.24874,40.84161],[14.24877,40.8418],[14.2488,40.84199],[14.24882,40.84216],[14.24883,40.8422],[14.24883,40.84224],[14.24884,40.84232],[14.24885,40.84235],[14.24886,40.84243],[14.24887,40.8425],[14.24887,40.84253],[14.24889,40.8427],[14.2489,40.84277],[14.24891,40.84281],[14.24894,40.84307],[14.24894,40.8431],[14.24899,40.84349],[14.249,40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"La storia di Napoli","sub":"Dalla sirena Partenope a oggi, in tredici capitoli","som":"Prima di partire, ventotto secoli in dieci minuti: la leggenda della sirena, i Greci, Roma, i re, la rivolta, la guerra e la città di oggi.","txt":"Napoli è una delle città più antiche d'Europa: la sua storia si estende per circa tremila anni, e il centro storico che stai per attraversare conserva ancora la pianta delle strade disegnata dai Greci. Per oltre mezzo millennio è stata la capitale dell'Italia del Sud.\n\nQuesti tredici capitoli ti accompagnano dalla leggenda alla città di oggi. Ogni volta che il racconto incontra un luogo della guida, trovi un pulsante per andarci.","foto":null,"cap":[{"p":"La leggenda","t":"La sirena Partenope","x":"Tutto comincia con una sirena. Nel mito greco le sirene erano creature con il corpo di uccello e la testa di donna, padrone di un canto magico. Una di loro si chiamava Partenope.\n\nIl racconto più famoso dice che, quando Ulisse passò davanti al loro scoglio senza cedere al canto, le sirene per il dolore si gettarono in mare. Le onde portarono il corpo di Partenope sulla costa, alla foce di un piccolo fiume, il Sebeto: proprio dove sarebbe nata la città.\n\nLì le fu costruita una tomba e i Greci di Napoli le dedicavano ogni anno sacrifici e una corsa con le fiaccole. Ancora oggi i napoletani si chiamano «partenopei».","l":null,"foto":null},{"p":"VIII–VII secolo a.C.","t":"Partenope, la prima città","x":"La leggenda ha un fondo di verità. Tra l'VIII e il VII secolo a.C. i Greci di Cuma, la più antica colonia greca della zona, fondarono un piccolo scalo sul mare e lo chiamarono come la sirena: Partenope.\n\nSorgeva sulla collina di Pizzofalcone, il Monte Echia, su uno sperone circondato dal mare, e aveva il suo approdo sull'isolotto di Megaride, dove oggi c'è Castel dell'Ovo. Il porto era nell'attuale piazza Municipio. La necropoli di Partenope è stata scoperta nel 1949 in via Nicotera.\n\nLa piccola città crebbe così in fretta che Cuma, per paura di perdere il comando, ne ridusse il ruolo.","l":32,"foto":null},{"p":"V secolo a.C.","t":"Neapolis, la città nuova","x":"Accanto a Partenope, poco più a est, i Cumani fondarono una città nuova: Neapolis, la «città nuova». L'UNESCO data la fondazione al 470 a.C. circa, nel periodo in cui i Greci avevano sconfitto gli Etruschi sul mare.\n\nNeapolis fu costruita secondo un disegno regolare: tre strade principali parallele (le «plateiai», poi chiamate decumani), incrociate ad angolo retto da strade più piccole. L'agorà, la piazza principale, era dov'è oggi piazza San Gaetano.\n\nQuel reticolo è ancora lì: Spaccanapoli, via dei Tribunali e via Anticaglia sono le tre strade greche. Camminandoci, cammini nella pianta della città di 2.500 anni fa.","l":38,"foto":null},{"p":"326 a.C. – V secolo d.C.","t":"Greca sotto Roma","x":"Nel 326 a.C. Neapolis si alleò con Roma e restò per secoli una città greca dentro il mondo romano: fu tra le poche a conservare la lingua e la cultura greca. Diventò un luogo amato dai Romani colti e ricchi, che costruivano ville sul golfo: sull'isolotto di Megaride sorse quella di Lucio Licinio Lucullo.\n\nNel 79 d.C. l'eruzione del Vesuvio distrusse Pompei ed Ercolano, poco lontano. Nel 476, proprio nella villa di Lucullo, fortificata, fu rinchiuso Romolo Augusto, l'ultimo imperatore romano d'Occidente: con lui finiva l'Impero.\n\nSotto la città greco-romana scorreva già l'acqua delle cisterne che oggi visiti a Napoli Sotterranea, e nel teatro di Neapolis si esibì l'imperatore Nerone.","l":15,"foto":null},{"p":"VI–XII secolo","t":"Il ducato di Napoli","x":"Dopo la fine dell'Impero, nel VI secolo, Napoli passò ai Bizantini, i Romani d'Oriente. Poco a poco diventò un ducato quasi indipendente: nell'VIII secolo il duca Stefano II se ne fece signore di fatto.\n\nPer cinque secoli il ducato resistette a Longobardi e Saraceni. Nel 1030 il duca Sergio IV diede la contea di Aversa a un gruppo di mercenari normanni: fu l'inizio della loro ascesa nel Sud. Nel 1137 Napoli si sottomise ai Normanni ed entrò nel nuovo Regno di Sicilia.\n\nDi quegli anni lontani restano le chiese più antiche, come Santa Restituta e il battistero di San Giovanni in Fonte dentro il Duomo, considerato il più antico d'Occidente.","l":18,"foto":null},{"p":"1194–1266","t":"Normanni e Svevi: nasce l'Università","x":"Dopo i Normanni arrivarono gli Svevi. Nel 1194 l'imperatore Enrico VI occupò la città e ne fece abbattere le mura.\n\nSuo figlio, Federico II, era un sovrano appassionato di cultura e di diritto. Nel 1224 fondò a Napoli lo «Studio», una delle prime università statali d'Europa: è l'attuale Università Federico II, che porta ancora il suo nome.","l":null,"foto":null},{"p":"1266–1442","t":"Gli Angioini: Napoli capitale","x":"Nel 1266 il papa affidò il regno a Carlo I d'Angiò, fratello del re di Francia, che entrò in città in trionfo. Dopo la rivolta dei Vespri siciliani del 1282, la Sicilia si staccò e Napoli diventò la capitale del regno: lo resterà per secoli.\n\nGli Angioini costruirono il Castel Nuovo, il Duomo (dal 1294) e la cittadella di Santa Chiara (dal 1310), e la città si allargò. Alla corte di Roberto d'Angiò, nel Castel Nuovo, soggiornarono Giotto, Petrarca e Boccaccio.","l":9,"foto":null},{"p":"1442–1503","t":"Gli Aragonesi","x":"Nel 1442 Alfonso d'Aragona conquistò Napoli: secondo la tradizione i suoi uomini entrarono in città passando per un acquedotto. Fece del Castel Nuovo la sua reggia, lo ricostruì e per celebrare la vittoria vi aggiunse il grande Arco di Trionfo tra due torri.\n\nGli Aragonesi trasformarono il castello medievale in una fortezza moderna e rinnovarono le difese e le strade della città. Il figlio Ferrante sconfisse i baroni ribelli: la porta di bronzo del castello racconta quella guerra, e nella Sala dei Baroni si consumò la sua vendetta.","l":30,"foto":null},{"p":"1503–1707","t":"Il viceregno spagnolo","x":"Dal 1503 Napoli passò alla Spagna e fu governata da un viceré. Senza un re presente, era comunque una capitale imperiale, con una delle corti più grandiose dei domini spagnoli. Il viceré don Pedro di Toledo raddoppiò la città, aprì via Toledo e costruì i quartieri per i soldati, i Quartieri Spagnoli. In questi anni fu costruito anche il Palazzo Reale.\n\nNel 1606 arrivò a Napoli, in fuga da Roma, Caravaggio: la sua pittura cambiò l'arte della città, che nel Seicento diventò una delle capitali del barocco europeo.\n\nFurono anche anni durissimi: tasse altissime, l'eruzione del Vesuvio del 1631 e, nel 1656, una peste che uccise più della metà degli abitanti.","l":45,"foto":null},{"p":"1647","t":"Masaniello","x":"Il 7 luglio 1647, dopo l'ennesima tassa, questa volta sulla frutta, il cibo dei più poveri, un pescatore di 27 anni, Masaniello, guidò il popolo in rivolta al grido di «Viva il re di Spagna, mora il malgoverno».\n\nIn dieci giorni gli spagnoli dovettero accettare le richieste del popolo. Ma Masaniello, accusato di pazzia e tradito da una parte degli stessi rivoltosi, fu assassinato. La rivolta continuò per mesi contro la Spagna, prima di essere domata nel 1648.","l":null,"foto":null},{"p":"1734–1799","t":"I Borbone e la Repubblica","x":"Nel 1734 Carlo di Borbone riportò a Napoli un re tutto suo e volle farne una grande capitale europea. Nel 1737 fece costruire in soli sette mesi il Teatro di San Carlo; poi le regge di Portici e di Capodimonte. In quegli anni cominciarono anche gli scavi di Ercolano e di Pompei.\n\nNapoli era una delle capitali dell'Illuminismo. Nel gennaio 1799, con l'arrivo dell'esercito francese, i patrioti proclamarono la Repubblica Napoletana: durò solo fino a giugno. Al ritorno dei Borbone molti dei suoi protagonisti furono giustiziati.\n\nDopo gli anni dei Francesi (Giuseppe Bonaparte e Gioacchino Murat), nel 1815 tornarono i Borbone, e nel 1816 nacque il Regno delle Due Sicilie.","l":null,"foto":null},{"p":"1860–1945","t":"L'Italia unita e la guerra","x":"Il 7 settembre 1860 Giuseppe Garibaldi entrò a Napoli acclamato dalla folla; un plebiscito sancì l'unione al Regno d'Italia. Napoli smise di essere una capitale, e la perdita fu pesante.\n\nNella Seconda guerra mondiale la città subì più di 120 bombardamenti aerei, soprattutto per il suo porto; la gente si rifugiava nelle cisterne sotterranee. Dopo l'armistizio, i tedeschi occuparono la città. Alla fine di settembre 1943 i napoletani insorsero: nelle «Quattro giornate di Napoli» il popolo costrinse alla resa il presidio tedesco. Il 1° ottobre arrivarono gli Alleati.","l":15,"foto":null},{"p":"Dal 1945 a oggi","t":"La Napoli di oggi","x":"Dopo la guerra la città si ricostruì tra grandi difficoltà. Nel 1995 il centro storico è stato iscritto dall'UNESCO tra i Patrimoni dell'Umanità: è il più grande d'Italia e uno dei più vasti d'Europa.\n\nDal 2001 la metropolitana ha aperto le sue «stazioni dell'arte», con opere di artisti contemporanei. La città conta circa 950.000 abitanti, più di tre milioni con l'area metropolitana.\n\nE poi c'è la Napoli che vedrai camminando: i murales, come quello di Maradona nei Quartieri Spagnoli, e la Madonna di Banksy, la vita dei vicoli, il caffè. Tremila anni di storia, uno sopra l'altro, in pochi chilometri.","l":44,"foto":null}],"ap":true,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio a Napoli","sub":"Un pittore in fuga e tre capolavori da vedere","som":"In fuga da Roma, Caravaggio trovò rifugio a Napoli due volte. Qui dipinse le Sette opere di Misericordia, la Flagellazione e il suo ultimo quadro.","txt":"Michelangelo Merisi, detto Caravaggio, era a Roma un pittore famoso e discusso. Negli ultimi giorni di maggio del 1606 ferì a morte Ranuccio Tomassoni in una rissa nata durante una partita a racchetta: condannato, dovette fuggire.\n\nNapoli, allora una delle città più grandi d'Europa, fu il suo rifugio due volte: dall'autunno 1606 all'estate 1607, e poi dall'autunno 1609 all'estate 1610. Qui trovò la protezione della famiglia Colonna e committenti ricchi, e qui la sua pittura cambiò per sempre l'arte della città.\n\nTre delle sue opere si possono vedere oggi a Napoli, due delle quali sul nostro percorso.","foto":null,"cap":[{"p":"1606–1607","t":"Il primo soggiorno e le Sette opere","x":"Il primo incarico napoletano documentato è dell'ottobre 1606. Pochi mesi dopo, entro il 9 gennaio 1607, Caravaggio consegnò al Pio Monte della Misericordia la grande tela delle Sette opere di Misericordia, pagata 400 ducati.\n\nÈ ancora lì, sull'altare per cui fu dipinta, in via dei Tribunali: una notte in un vicolo di Napoli, dove gli uomini si aiutano tra loro sotto lo sguardo della Madonna.","l":17,"foto":null},{"p":"1607","t":"La Flagellazione","x":"Per la famiglia de Franchis, giuristi e magistrati, Caravaggio dipinse nel 1607 la Flagellazione di Cristo, per la loro cappella nella chiesa di San Domenico Maggiore: una tela alta quasi tre metri, uno dei capolavori del barocco napoletano.\n\nOggi l'originale è al Museo di Capodimonte, dove fu trasferito per motivi di sicurezza; in San Domenico Maggiore è rimasta una copia. Capodimonte è fuori dai nostri giri a piedi.","l":null,"foto":null},{"p":"1607–1609","t":"Malta e la Sicilia","x":"Il 12-13 luglio 1607 Caravaggio arrivò a Malta, probabilmente su una galea dei Cavalieri partita da Napoli. Ma anche lì finì nei guai: dopo una rissa fu arrestato nell'agosto 1608, fuggì dal forte in cui era rinchiuso e riparò in Sicilia, a Siracusa.","l":null,"foto":null},{"p":"Ottobre 1609","t":"L'agguato del Cerriglio","x":"Nell'autunno 1609 tornò a Napoli, ancora sotto la protezione dei Colonna, sperando nel perdono del papa per poter rientrare a Roma.\n\nIn ottobre fu aggredito da quattro uomini davanti all'osteria del Cerriglio, una locanda famosa del tempo, e sfregiato al volto: la ferita fu così grave che a Roma si sparse la voce della sua morte.","l":null,"foto":null},{"p":"1610","t":"L'ultimo quadro","x":"Nella primavera del 1610 dipinse per il principe genovese Marcantonio Doria il Martirio di sant'Orsola: la tela fu finita in maggio, consegnata ancora fresca di vernice e spedita a Genova. È il quadro più tardo di Caravaggio che conosciamo, e si vede oggi alle Gallerie d'Italia in via Toledo, a sei minuti da Ceraldi. Tra i volti, alle spalle della santa, c'è il suo.\n\nNell'estate partì in barca verso Roma con alcuni quadri, sperando nel perdono. Fu arrestato per errore a Palo, e la barca ripartì con i dipinti. Morì a Porto Ercole il 18 luglio 1610 (o forse il giorno dopo), a 38 anni.","l":45,"foto":null}],"ap":false,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Nápoles en cinco minutos: De la Sirena a la Ciudad Nueva","sub":"","som":"Primero Partenope, luego Neapolis: porque el centro histórico todavía está diseñado como una ciudad griega.","txt":"Nápoles fue fundada dos veces. La primera vez se llamó Partenope, como la mítica sirena: fue fundada en el siglo VII a. C. por colonos de origen griego procedentes de Cumas, que desembarcaron en el islote de Megaride, donde hoy se encuentra el Castel dell'Ovo, y se establecieron en el cercano monte Echia.\n\nLa segunda vez, alrededor del año 470 a. C., surgió una nueva ciudad junto a la antigua: Neapolis, que significa \"ciudad nueva\" en griego. Es la que usted está atravesando ahora. Sus calles forman una cuadrícula regular que, después de veinticinco siglos, aún se conserva: el centro histórico de Nápoles es Patrimonio de la Humanidad de la UNESCO precisamente porque el diseño de la ciudad griega se ha mantenido como su eje central.\n\nTres calles paralelas, los decumanos, atraviesan la ciudad de oeste a este. La más baja es Spaccanapoli: de unos dos kilómetros de longitud, tan recta que, vista desde arriba, parece dividir la ciudad en dos, de ahí su nombre. En el centro discurre Via dei Tribunali, el decumano principal; más arriba se encuentran Via dell'Anticaglia y Via della Sapienza, el decumano superior.\n\nDesde Piazza Carità, donde estamos desde 2002, comienza a pocos minutos a pie Spaccanapoli, en Piazza del Gesù Nuovo.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro y la sangre derretida","sub":"","som":"Tres veces al año, Nápoles contiene la respiración ante un frasco. ¿Qué sucede, dónde y qué dicen la Iglesia y la ciencia al respecto?","txt":"En la Catedral de Nápoles, en un nicho de la Capilla del Tesoro, se guarda un frasco con una sustancia oscura que, según la tradición, es la sangre de San Genaro, el santo patrón de la ciudad. Tres veces al año —el sábado anterior al primer domingo de mayo, el 19 de septiembre (día de su festividad) y el 16 de diciembre— se muestra el frasco a los fieles: si su contenido, generalmente sólido, se disuelve, es motivo de celebración; si permanece sólido, para muchos napolitanos, es un mal presagio.\n\nEl primer registro conocido de la licuefacción data de 1389. Las reliquias no están custodiadas por el clero, sino por la Diputación de la Capilla del Tesoro de San Gennaro, una institución secular fundada en 1601, de la que también forma parte el alcalde de Nápoles.\n\nLa Iglesia mantiene una postura cautelosa: habla de un «acontecimiento milagroso», permite la devoción popular, pero no la impone como verdad de fe. Entre las explicaciones propuestas por los escépticos se encuentra la tixotropía, la propiedad de ciertas sustancias que son sólidas en reposo y se vuelven líquidas al moverse o agitarse.\n\nLo sagrado y lo profano siempre han coexistido aquí: en Via Duomo, a pocos pasos de la catedral, el artista callejero Jorit pintó un San Gennaro con el rostro de un trabajador.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Las pobres almas: Cuando Nápoles adoptó una calavera","sub":"","som":"Osarios, capuzzelle y oraciones intercambiadas por números de lotería: el culto a los muertos sin nombre.","txt":"Durante siglos, en Nápoles, los muertos sin nombre no eran abandonados a su suerte. Se les llamaba anime pezzentelle: las pobres almas que morían sin funeral y sin que nadie rezara por ellas. El nombre está relacionado con «pezzente», el pobre, pero también con el latín «petere», pedir para recibir: quienes rezaban por ellas esperaban recibir protección y gracia a cambio.\n\nEl lugar simbólico es el cementerio Fontanelle, en el barrio de Sanità: una cantera de toba del siglo XVI que abarca aproximadamente cuatro mil metros cuadrados, que acogió a las víctimas de la peste de 1656 y luego a las del cólera en 1836-1837. En 1872, el canónigo Gaetano Barbati dispuso los huesos en tres naves. Los devotos \"adoptaban\" un cráneo, una capuzzella: lo limpiaban, lo colocaban en un pequeño santuario, lo adornaban con rosarios y monedas, y le rezaban, esperando una señal en un sueño, a veces un número de lotería. Algunos cráneos se hicieron famosos: el Capitán, con la cuenca del ojo ennegrecida, sujeto de una leyenda de matrimonio y celos; Donna Concetta, de quien se dice que \"suda\" cuando se le concede una gracia.\n\nEn 1969, un decreto del tribunal eclesiástico clausuró el osario y prohibió el culto. Cerrado por reformas desde 2020, el cementerio reabrió al público en 2026, gestionado por la cooperativa La Paranza.\n\nEl culto también pervive bajo Via dei Tribunali, en el hipogeo de Santa Maria delle Anime del Purgatorio ad Arco, la iglesia que los napolitanos llaman \"'e cape 'e morte\": allí se conserva el cráneo de Lucía, una joven muy querida. Y en Via San Biagio dei Librai, en la pequeña iglesia de Santa Luciella, hay un cráneo singular: el que tiene orejas.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Nápoles Esotérica: Un príncipe alquimista, una fachada codificada y un huevo mágico.","sub":"","som":"Raimondo di Sangro, el rusticado del Gesù Nuovo, el huevo de Virgilio, el munaciello: donde termina la historia y comienza la leyenda.","txt":"Nápoles adora los misterios, y algunos son realmente fascinantes. El más famoso tiene nombre: Raimondo di Sangro, príncipe de Sansevero, un hombre del siglo XVIII, Gran Maestre de la masonería napolitana, un celoso guardián de sus propios secretos. El mito lo rodeó incluso en vida, y él mismo lo alimentó. Benedetto Croce lo llamó la encarnación napolitana del Doctor Fausto. La leyenda negra le atribuye todo: sirvientes asesinados para estudiar sus cuerpos, incluso la ceguera del escultor del Cristo Velado para que no esculpiera otro. Son leyendas, y el propio museo las distingue de la historia documentada.\n\nEl Cristo Velado es obra de Giuseppe Sanmartino, por encargo del príncipe: el velo transparente que cubre el cuerpo está tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea de la capilla se encuentran las \"máquinas anatómicas\", dos esqueletos con sistemas circulatorios reconstruidos, creados por el médico palermitano Giuseppe Salerno entre 1756 y 1764. Según la leyenda, su creación implicó misteriosas inyecciones y estudios con cera de abejas y tintes.\n\nNo muy lejos, la fachada del Gesù Nuovo, originalmente el palacio Sanseverino en 1470, está revestida con sillares piramidales de piedra piperno oscura. Algunas piedras presentan inscripciones: según la leyenda, un mensaje secreto; algunos estudiosos afirman que son las marcas de los canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales, una partitura de aproximadamente tres cuartos de hora titulada \"Enigma\". Una hipótesis tentadora, pero no una certeza.\n\nY luego está el mar: según la leyenda, el poeta Virgilio escondió el huevo de la sirena Partenope en las bodegas del Castel dell'Ovo. Mientras el huevo permanezca intacto, el castillo seguirá en pie.\n\nEn las casas, sin embargo, viven los espíritus de la tradición popular: el munaciello, un duende encapuchado que trae buena suerte o travesuras según cómo se le trate, y la bella 'mbriana, un espíritu bueno de la casa, que puede aparecer como una mariposa o un gecko.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Nápoles hoy: ¿qué hay de nuevo?","sub":"","som":"La plaza dedicada a Maradona, el arte callejero, el último Caravaggio en Via Toledo, las iglesias y osarios reabiertos: la ciudad está cambiando.","txt":"Quienes regresan a Nápoles después de algunos años encuentran una ciudad que ha aprendido a contar su historia.\n\nEn el Barrio Español, a nueve minutos de aquí, se encuentra Largo Maradona. El mural de Diego fue pintado en 1990 por Mario Filardi; con el paso de los años, se fue deteriorando hasta casi desaparecer, luego fue restaurado gracias a Salvatore Iodice, y en otoño de 2017, el argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona el 25 de noviembre de 2020, la plaza, antes conocida como la plaza de los artistas, se convirtió en un santuario laico de pequeños altares, banderas argentinas y fotografías, tan popular que la municipalidad tuvo que regular el tráfico peatonal.\n\nEl arte callejero ha llegado al centro histórico: en la Piazzetta dei Girolamini, protegida por un cristal, se alza la Virgen con una pistola de Banksy; en la Via Duomo, San Gennaro el Obrero de Jorit. La página web oficial de turismo de la ciudad les ha dedicado un itinerario específico.\n\nEn Via Toledo, a seis minutos de nosotros, la Galería de Italia alberga el Martirio de Santa Úrsula, el último lienzo de Caravaggio, junto con más de quinientos jarrones áticos y de la Magna Grecia.\n\nY lugares que habían permanecido cerrados durante mucho tiempo están reabriendo: la iglesia de Santa Luciella ai Librai, abandonada durante más de treinta años, reabrió sus puertas al público el 5 de abril de 2019; el cementerio Fontanelle reabrió en 2026.","foto":null,"cap":[],"ap":false,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-04T01:24Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":""}],"pre":"../","menu":"../../menu-nuovo/"}, T = {"titolo":"Guía de Nápoles","sottotito   if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';

  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(r.ap ? T.prima_di_partire : T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.sub ? '<p class="piccolo">' + e(r.sub) + '</p>' : '') + (r.foto ? '<div class="galleria uno">' + figura(r.foto) + '</div>' : '') + '<div class="testo">' + par(r.txt) + '</div>';
  if(r.cap.length){
    h += '<nav class="indice" aria-label="' + e(T.indice) + '"><b style="font-weight:500">' + e(T.indice) + '</b><ol>' + r.cap.map(function(c, n){ return '<li><button onclick="document.getElementById(\'cap-' + n + '\').scrollIntoView({behavior:\'smooth\'})">' + (c.p ? '<span class="per">' + e(c.p) + '</span>' : '') + '<span>' + e(c.t) + '</span></button></li>'; }).join('') + '</ol></nav>';
    h += r.cap.map(function(c, n){ var l = c.l && LU[c.l];
      return '<section class="capitolo" id="cap-' + n + '">' + (c.p ? '<span class="etichetta">' + e(c.p) + '</span>' : '') + '<h2>' + e(c.t) + '</h2>' +
        (c.foto ? '<figure><div class="ft"><img src="' + e(c.foto.u) + '" alt="' + e(c.foto.alt) + '" loading="lazy"></div><figcaption>' + (c.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(c.foto.dida) + '</span>' : '') + '<span class="cr">' + e(c.foto.aut) + ' · ' + e(c.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="testo">' + par(c.x) + '</div>' + (l ? '<a class="btn sec" href="#/l/' + e(l.s) + '">' + e(f(T.lo_vedi, {n: l.n})) + ' →</a>' : '') + '</section>'; }).join('');
  }
  return h + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
  preparaCopertine();
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
