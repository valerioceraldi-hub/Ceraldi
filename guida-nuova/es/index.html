<style>

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit}
.contenitore{max-width:640px;margin:0 auto;padding:0 16px 40px}
header.testa{background:var(--scuro);color:var(--su-scuro);padding:18px 16px 16px}
header.testa .riga{max-width:640px;margin:0 auto;display:flex;align-items:flex-start;gap:12px}
header.testa h1{font:400 1.7rem/1.15 var(--f-display);margin:0}
header.testa p{margin:4px 0 0;opacity:.85;font-size:.95rem}
.lingue{margin-left:auto;position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid color-mix(in srgb,var(--su-scuro) 40%,transparent);border-radius:20px;padding:4px 10px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:110%;z-index:20;list-style:none;margin:0;padding:6px;background:var(--superficie);color:var(--testo);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:150px}
.lingue a{display:block;padding:8px 10px;text-decoration:none;color:inherit;border-radius:6px}
.lingue a[aria-current]{font-weight:600;background:color-mix(in srgb,var(--accento) 12%,transparent)}
.avviso{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:.92rem}
.avviso.prova{background:#FFF4D6;color:#5A4300;border:1px solid #E8D193}
.avviso.ko{background:color-mix(in srgb,var(--ko) 10%,var(--superficie));color:var(--ko);border:1px solid color-mix(in srgb,var(--ko) 30%,transparent)}
.scheda{background:var(--superficie);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
h2{font:400 1.4rem/1.2 var(--f-display);margin:22px 0 8px}
h3{font:600 1rem/1.3 var(--f-testo);margin:0 0 6px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.bottoni{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.bottone{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accento) 35%,transparent);background:var(--superficie);text-decoration:none;color:var(--testo);font-weight:600;text-align:center;cursor:pointer}
.bottone.pieno{background:var(--scuro);color:var(--su-scuro);border-color:var(--scuro)}
.lista{list-style:none;margin:0;padding:0}
.voce{display:block;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:14px 16px;margin:10px 0}
.voce .titolo{font:400 1.2rem/1.25 var(--f-display);color:var(--testo)}
.voce .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600}
.stato::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.stato.ok{color:var(--ok)}.stato.ko{color:var(--ko)}.stato.att{color:var(--attenzione)}.stato.neutro{color:var(--testo-2)}
.indietro{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0;padding:8px 0;background:none;border:0;color:var(--accento);font-weight:600;cursor:pointer}
.mappa{height:340px;border-radius:14px;overflow:hidden;margin:12px 0;background:#e8e4dc}
.num{width:28px;height:28px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:700 .85rem var(--f-testo);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.num.casa{background:var(--accento)}
.tappa{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--superficie);border-radius:14px;padding:14px;margin:10px 0}
.tappa .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.tappa .tra{grid-column:1/-1;font-size:.88rem;color:var(--testo-2);margin:-4px 0 0 46px}
.alt{margin-top:8px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--attenzione) 9%,var(--superficie));font-size:.92rem}
.testo p{margin:0 0 12px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--testo) 10%,transparent);vertical-align:top}
.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:700}
.foto{margin:12px 0 0}.foto img{width:100%;border-radius:14px;display:block}.foto figcaption{font-size:.78rem;color:var(--testo-2);margin-top:4px}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center}
.visuale[hidden]{display:none}
@media (min-width:700px){header.testa h1{font-size:2rem}}
</style>

<script>
var D = {"lingua":"es","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità y Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"El punto de partida: Piazza Carità, en Via Toledo. Desde aquí, el centro histórico comienza a tan solo unos minutos a pie. Y aquí está Ceraldi.","rac":"","con":"Antes de partir, un café: la excursión es larga y Nápoles se disfruta mejor con la taza adecuada.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, el decumano inferior","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La calle recta que divide el centro histórico en dos: el decumano inferior de la ciudad griega, unos dos kilómetros de iglesias, tiendas y vida.","rac":"Spaccanapoli es la más baja de las tres decumanas, las calles paralelas que cruzaban Neapolis griega de oeste a este. Comienza en la Piazza del Gesù Nuovo como Via Benedetto Croce, luego se convierte en Via San Biagio dei Librai, cruza Via Duomo y continúa más allá del casco antiguo: unos dos kilómetros en total. Su nombre lo dice todo: es tan larga y recta que, vista desde arriba, parece dividir la ciudad en dos.","con":"Recorre esta avenida desde la Piazza del Gesù hacia la Via Duomo: es un ligero descenso lleno de historia, no de esfuerzo.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true},{"id":8,"s":"gesu-nuovo","n":"Plaza e Iglesia del Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una fachada de piedras en forma de pirámide que parece una fortaleza y esconde un misterio: inscripciones grabadas que nadie ha descifrado aún con certeza.","rac":"Antes de ser iglesia, fue un palacio: el de los príncipes Sanseverino, construido en 1470; una placa en la fachada conmemora al arquitecto, Novello da San Lucano. Los jesuitas conservaron la estructura y la sillería oscura de piperno, con las piedras talladas en forma piramidal, añadiendo elementos de mármol blanco.\n\nAlgunas piedras tienen marcas grabadas. Según la leyenda, son un mensaje secreto; algunos estudiosos creen que son las marcas dejadas por diferentes canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales de una partitura llamada \"Enigma\". Obsérvalas con atención y decide por ti mismo.\n\nLa fachada fue restaurada e inaugurada el 12 de marzo de 2023, después de que algunos fragmentos cayeran en diciembre de 2017; la plaza ha permanecido cerrada al tráfico desde entonces.","con":"Busca las marcas en las piedras a la altura de los ojos, a la derecha y a la izquierda del portal: la búsqueda es gratuita.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"}],"ant":true},{"id":9,"s":"santa-chiara","n":"Monasterio y complejo de Santa Chiara (claustro de mayólica)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"El claustro revestido de mayólica es uno de los lugares más tranquilos del centro: a un paso del caos de Spaccanapoli, un remanso de paz.","rac":"","con":"Los domingos, el claustro cierra a las 2 de la tarde: si es domingo por la tarde, cambien de orden y vengan aquí primero.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Claustro y museo"},{"g":[7],"da":"10:00","a":"14:00","n":"Claustro y museo"}],"fonti":[],"ant":true},{"id":10,"s":"cappella-sansevero","n":"Capilla Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"El Cristo Velado, una de las esculturas más famosas del mundo, y las máquinas anatómicas del príncipe alquimista Raimondo di Sangro.","rac":"La capilla de la familia di Sangro es el reino de Raimondo, príncipe de Sansevero: un hombre de ciencia y secretos, Gran Maestro de la Francmasonería, en torno al cual nació el mito cuando aún vivía, y fue él mismo quien lo alimentó.\n\nEn el centro se encuentra el Cristo Velado de Giuseppe Sanmartino, encargado por el príncipe: un cuerpo reclinado cubierto por un sudario tan fino que parece tela mojada, pero tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea se hallan dos «máquinas anatómicas», esqueletos de un hombre y una mujer con vasos sanguíneos reconstruidos, obra del médico palermitano Giuseppe Salerno entre 1756 y 1764. La leyenda negra habla de sirvientes sacrificados e inyecciones misteriosas; el museo, por su parte, distingue cuidadosamente el mito de la historia documentada.","con":"Está cerrado los martes: si hoy es martes, la estatua del Nilo está a dos minutos y siempre se puede ver.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli y estatua del Nilo","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai y sus tiendas","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La zona de libreros y artesanos de Spaccanapoli: tiendas, iglesias y el Hospital de Muñecas.","rac":"Este es el tramo de Spaccanapoli que va desde la Piazzetta Nilo hasta la Via Duomo, en el decumano inferior. Su nombre proviene de las librerías que siempre se han ubicado allí: una inscripción en el cercano Palazzo Marigliano conmemora el arte de los maestros libreros. La devoción a San Blas se remonta al siglo VIII, cuando unas monjas de Armenia trajeron una reliquia del santo a Nápoles. También en esta calle se encuentra el Ospedale delle Bambole, un taller artesanal que se ha transmitido de generación en generación.","con":"Diciembre es el mes de las tiendas de belenes: prepárense para las multitudes los fines de semana.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true},{"id":40,"s":"santa-luciella","n":"Santa Luciella en la librería y la calavera con orejas","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una pequeña iglesia de cantero dedicada al santo de los ojos, y un cráneo singular: el que tiene orejas.","rac":"Fundada poco antes de 1327 por Bartolomeo di Capua, jurista de los reyes angevinos, la iglesia fue entonces confiada a los pipernieri, los canteros: eligieron a Santa Lucía, protectora de la vista, porque las astillas de su oficio ponían en riesgo sus ojos.\n\nAbandonada durante más de treinta años, fue reabierta el 5 de abril de 2019 gracias a la asociación Respiriamo Arte. En su bóveda subterránea, el culto de las \"anime pezzentelle\" (almas enfermas) dejó un cráneo único: tiene orejas.","con":"Es pequeño y se puede visitar en tan solo unos minutos: perfecto como descanso entre Sansevero y Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"}],"ant":true},{"id":41,"s":"ospedale-bambole","n":"Hospital de muñecas","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Una tienda que lleva generaciones seleccionando muñecas y juguetes: un escaparate que niños y adultos siempre recordarán.","rac":"","con":"El escaparate por sí solo ya justifica la parada: está de camino de vuelta.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la iglesia de los capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La Iglesia de los capuzzelle: bajo el suelo, el hipogeo donde Nápoles rezaba por las almas sin nombre. Y el cráneo de Lucía.","rac":"Los napolitanos la llaman \"'e cape 'e morte\", la iglesia de las cabezas de los muertos. Es una pequeña iglesia del siglo XVII situada en el decumano principal, vinculada a la devoción a las almas del Purgatorio difundida por la Contrarreforma. Una empinada escalera conduce al hipogeo, la iglesia subterránea, ampliada y decorada con mayólica en el siglo XVIII: allí, los devotos cuidaban restos anónimos y buscaban su intercesión. Al final de un pequeño pasillo, se conserva el cráneo de Lucía, una joven particularmente querida.","con":"Detrás del altar, busquen la calavera alada de mármol de Dionisio Lazzari: es el símbolo de la iglesia.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true},{"id":18,"s":"duomo-san-gennaro","n":"Catedral y Tesoro de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La Catedral de Nápoles y la Capilla del Tesoro, donde se guarda el frasco con la sangre de San Genaro.","rac":"En la Catedral, en un nicho de la Capilla del Tesoro, se conserva la ampolla que contiene la sangre tradicionalmente atribuida a San Gennaro. Tres veces al año (el sábado anterior al primer domingo de mayo, el 19 de septiembre y el 16 de diciembre) se espera su licuefacción. Desde 1601, las reliquias están bajo la custodia de una institución secular: la Delegación de la Capilla del Tesoro de San Gennaro.","con":"Los días de licuefacción, el Duomo está abarrotado desde la mañana: si quieres estar allí, llega temprano.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":43,"s":"banksy-madonna","n":"La Virgen con una pistola de Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Virgen María de Banksy con una pistola en lugar de aureola, protegida por cristal, en el corazón del decumano principal.","rac":"En la Piazzetta dei Girolamini, en una fachada del decumano principal, Banksy dejó una Virgen con una pistola en lugar de su aureola. Hoy, está protegida por un cristal. La página web oficial de turismo de la ciudad la incluye en su itinerario dedicado al arte callejero del centro histórico.","con":"Mira hacia arriba: la obra está por encima del nivel de la calle, detrás de un cristal.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"La primera vuelta","sub":"Spaccanapoli en medio día, partiendo desde Ceraldi","desc":"El corazón del centro histórico en un recorrido circular: el Gesù Nuovo y su misterio, el claustro de Santa Chiara, el Cristo Velado, la Iglesia de la Calavera y las Orejas, las tiendas de Via San Biagio dei Librai. Y luego volvemos a nosotros.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café en Ceraldi y nos vamos.","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38},{"l":10,"m":9,"mt":682,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":39},{"l":41,"m":2,"mt":161,"so":10,"nota":"","alt":null},{"l":7,"m":15,"mt":1128,"so":0,"nota":"Regresamos de Ceraldi por Spaccanapoli.","alt":null}],"fonti":[],"ant":true},{"id":2,"s":"napoli-sacra-e-profana","n":"Nápoles sagrada y profana","sub":"Santos, calaveras, alquimistas y una Virgen María de Banksy","desc":"El lado misterioso de Nápoles a lo largo de los decumanos: la fachada enigmática del Gesù Nuovo, el Príncipe de Sansevero, los cráneos de Santa Luciella y Purgatorio ad Arco, el arte callejero de Banksy y la sangre de San Gennaro. Para quienes aún tengan tiempo, el cementerio Fontanelle se encuentra más allá de las murallas.","dur":210,"dist":3837,"et":["mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":10,"m":6,"mt":448,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":null},{"l":42,"m":4,"mt":328,"so":40,"nota":"","alt":null},{"l":43,"m":4,"mt":333,"so":5,"nota":"","alt":null},{"l":18,"m":4,"mt":303,"so":45,"nota":"","alt":null},{"l":7,"m":21,"mt":1597,"so":0,"nota":"Regreso de Ceraldi.","alt":null}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Nápoles en cinco minutos: De la Sirena a la Ciudad Nueva","som":"Primero Partenope, luego Neapolis: porque el centro histórico todavía está diseñado como una ciudad griega.","txt":"Nápoles fue fundada dos veces. La primera vez se llamó Partenope, como la mítica sirena: fue fundada en el siglo VII a. C. por colonos de origen griego procedentes de Cumas, que desembarcaron en el islote de Megaride, donde hoy se encuentra el Castel dell'Ovo, y se establecieron en el cercano monte Echia.\n\nLa segunda vez, alrededor del año 470 a. C., surgió una nueva ciudad junto a la antigua: Neapolis, que significa \"ciudad nueva\" en griego. Es la que usted está atravesando ahora. Sus calles forman una cuadrícula regular que, después de veinticinco siglos, aún se conserva: el centro histórico de Nápoles es Patrimonio de la Humanidad de la UNESCO precisamente porque el diseño de la ciudad griega se ha mantenido como su eje central.\n\nTres calles paralelas, los decumanos, atraviesan la ciudad de oeste a este. La más baja es Spaccanapoli: de unos dos kilómetros de longitud, tan recta que, vista desde arriba, parece dividir la ciudad en dos, de ahí su nombre. En el centro discurre Via dei Tribunali, el decumano principal; más arriba se encuentran Via dell'Anticaglia y Via della Sapienza, el decumano superior.\n\nDesde Piazza Carità, donde estamos desde 2002, comienza a pocos minutos a pie Spaccanapoli, en Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro y la sangre derretida","som":"Tres veces al año, Nápoles contiene la respiración ante un frasco. ¿Qué sucede, dónde y qué dicen la Iglesia y la ciencia al respecto?","txt":"En la Catedral de Nápoles, en un nicho de la Capilla del Tesoro, se guarda un frasco con una sustancia oscura que, según la tradición, es la sangre de San Genaro, el santo patrón de la ciudad. Tres veces al año —el sábado anterior al primer domingo de mayo, el 19 de septiembre (día de su festividad) y el 16 de diciembre— se muestra el frasco a los fieles: si su contenido, generalmente sólido, se disuelve, es motivo de celebración; si permanece sólido, para muchos napolitanos, es un mal presagio.\n\nEl primer registro conocido de la licuefacción data de 1389. Las reliquias no están custodiadas por el clero, sino por la Diputación de la Capilla del Tesoro de San Gennaro, una institución secular fundada en 1601, de la que también forma parte el alcalde de Nápoles.\n\nLa Iglesia mantiene una postura cautelosa: habla de un «acontecimiento milagroso», permite la devoción popular, pero no la impone como verdad de fe. Entre las explicaciones propuestas por los escépticos se encuentra la tixotropía, la propiedad de ciertas sustancias que son sólidas en reposo y se vuelven líquidas al moverse o agitarse.\n\nLo sagrado y lo profano siempre han coexistido aquí: en Via Duomo, a pocos pasos de la catedral, el artista callejero Jorit pintó un San Gennaro con el rostro de un trabajador.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Las pobres almas: Cuando Nápoles adoptó una calavera","som":"Osarios, capuzzelle y oraciones intercambiadas por números de lotería: el culto a los muertos sin nombre.","txt":"Durante siglos, en Nápoles, los muertos sin nombre no eran abandonados a su suerte. Se les llamaba anime pezzentelle: las pobres almas que morían sin funeral y sin que nadie rezara por ellas. El nombre está relacionado con «pezzente», el pobre, pero también con el latín «petere», pedir para recibir: quienes rezaban por ellas esperaban recibir protección y gracia a cambio.\n\nEl lugar simbólico es el cementerio Fontanelle, en el barrio de Sanità: una cantera de toba del siglo XVI que abarca aproximadamente cuatro mil metros cuadrados, que acogió a las víctimas de la peste de 1656 y luego a las del cólera en 1836-1837. En 1872, el canónigo Gaetano Barbati dispuso los huesos en tres naves. Los devotos \"adoptaban\" un cráneo, una capuzzella: lo limpiaban, lo colocaban en un pequeño santuario, lo adornaban con rosarios y monedas, y le rezaban, esperando una señal en un sueño, a veces un número de lotería. Algunos cráneos se hicieron famosos: el Capitán, con la cuenca del ojo ennegrecida, sujeto de una leyenda de matrimonio y celos; Donna Concetta, de quien se dice que \"suda\" cuando se le concede una gracia.\n\nEn 1969, un decreto del tribunal eclesiástico clausuró el osario y prohibió el culto. Cerrado por reformas desde 2020, el cementerio reabrió al público en 2026, gestionado por la cooperativa La Paranza.\n\nEl culto también pervive bajo Via dei Tribunali, en el hipogeo de Santa Maria delle Anime del Purgatorio ad Arco, la iglesia que los napolitanos llaman \"'e cape 'e morte\": allí se conserva el cráneo de Lucía, una joven muy querida. Y en Via San Biagio dei Librai, en la pequeña iglesia de Santa Luciella, hay un cráneo singular: el que tiene orejas.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Nápoles Esotérica: Un príncipe alquimista, una fachada codificada y un huevo mágico.","som":"Raimondo di Sangro, el rusticado del Gesù Nuovo, el huevo de Virgilio, el munaciello: donde termina la historia y comienza la leyenda.","txt":"Nápoles adora los misterios, y algunos son realmente fascinantes. El más famoso tiene nombre: Raimondo di Sangro, príncipe de Sansevero, un hombre del siglo XVIII, Gran Maestre de la masonería napolitana, un celoso guardián de sus propios secretos. El mito lo rodeó incluso en vida, y él mismo lo alimentó. Benedetto Croce lo llamó la encarnación napolitana del Doctor Fausto. La leyenda negra le atribuye todo: sirvientes asesinados para estudiar sus cuerpos, incluso la ceguera del escultor del Cristo Velado para que no esculpiera otro. Son leyendas, y el propio museo las distingue de la historia documentada.\n\nEl Cristo Velado es obra de Giuseppe Sanmartino, por encargo del príncipe: el velo transparente que cubre el cuerpo está tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea de la capilla se encuentran las \"máquinas anatómicas\", dos esqueletos con sistemas circulatorios reconstruidos, creados por el médico palermitano Giuseppe Salerno entre 1756 y 1764. Según la leyenda, su creación implicó misteriosas inyecciones y estudios con cera de abejas y tintes.\n\nNo muy lejos, la fachada del Gesù Nuovo, originalmente el palacio Sanseverino en 1470, está revestida con sillares piramidales de piedra piperno oscura. Algunas piedras presentan inscripciones: según la leyenda, un mensaje secreto; algunos estudiosos afirman que son las marcas de los canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales, una partitura de aproximadamente tres cuartos de hora titulada \"Enigma\". Una hipótesis tentadora, pero no una certeza.\n\nY luego está el mar: según la leyenda, el poeta Virgilio escondió el huevo de la sirena Partenope en las bodegas del Castel dell'Ovo. Mientras el huevo permanezca intacto, el castillo seguirá en pie.\n\nEn las casas, sin embargo, viven los espíritus de la tradición popular: el munaciello, un duende encapuchado que trae buena suerte o travesuras según cómo se le trate, y la bella 'mbriana, un espíritu bueno de la casa, que puede aparecer como una mariposa o un gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Nápoles hoy: ¿qué hay de nuevo?","som":"La plaza dedicada a Maradona, el arte callejero, el último Caravaggio en Via Toledo, las iglesias y osarios reabiertos: la ciudad está cambiando.","txt":"Quienes regresan a Nápoles después de algunos años encuentran una ciudad que ha aprendido a contar su historia.\n\nEn el Barrio Español, a nueve minutos de aquí, se encuentra Largo Maradona. El mural de Diego fue pintado en 1990 por Mario Filardi; con el paso de los años, se fue deteriorando hasta casi desaparecer, luego fue restaurado gracias a Salvatore Iodice, y en otoño de 2017, el argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona el 25 de noviembre de 2020, la plaza, antes conocida como la plaza de los artistas, se convirtió en un santuario laico de pequeños altares, banderas argentinas y fotografías, tan popular que la municipalidad tuvo que regular el tráfico peatonal.\n\nEl arte callejero ha llegado al centro histórico: en la Piazzetta dei Girolamini, protegida por un cristal, se alza la Virgen con una pistola de Banksy; en la Via Duomo, San Gennaro el Obrero de Jorit. La página web oficial de turismo de la ciudad les ha dedicado un itinerario específico.\n\nEn Via Toledo, a seis minutos de nosotros, la Galería de Italia alberga el Martirio de Santa Úrsula, el último lienzo de Caravaggio, junto con más de quinientos jarrones áticos y de la Magna Grecia.\n\nY lugares que habían permanecido cerrados durante mucho tiempo están reabriendo: la iglesia de Santa Luciella ai Librai, abandonada durante más de treinta años, reabrió sus puertas al público el 5 de abril de 2019; el cementerio Fontanelle reabrió en 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T14:15Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":"../fr/"},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":""}],"pre":"../","menu":"../../menu-nuovo/"}, T = {"titolo":"Guía de Nápoles","sottotitolo":"El centro histórico a pie desde Piazza Carità","anteprima":"Versión de prueba: textos y horarios en revisión.","oggi":"Hoy en Nápoles","sciopero":"Huelga de transporte hoy","chiusi_oggi":"Cerrados hoy","tutti_aperti":"Ningún cierre conocido hoy entre los lugares con horarios verificados.","itinerari":"Itinerarios","luoghi":"Lugares","racconti":"Nápoles contada","mappa":"Mapa","piove":"¿Llueve?","piove_testo":"Lugares a cubierto, con los horarios de hoy.","piove_vuoto":"No hay lugares a cubierto disponibles en esta versión.","min":"min","km":"km","a_piedi":"a pie","da_ceraldi":"desde Ceraldi","tappe":"paradas /* stato di un luogo a un certo minuto di oggi: sempre | verifica | aperto | apre | chiuso_ora | chiuso_oggi */
function stato(l, ora, minuto){
  if(l.sa) return {k: 'sempre'};
  if(!verificati(l, ora)) return {k: 'verifica'};
  var f = fasceDelGiorno(l, ora.data, ora.gs);
  if(f.some(function(o){ return o.x; })) return {k: 'chiuso_oggi'};
  f = f.filter(function(o){ return o.da && o.a; }).sort(function(a, b){ return hm(a.da) - hm(b.da); });
  if(!f.length) return {k: 'chiuso_oggi'};
  for(var i = 0; i < f.length; i++){
    var da = hm(f[i].da), a = hm(f[i].a), ui = f[i].ui ? hm(f[i].ui) : a;
    if(minuto < da) return {k: 'apre', da: f[i].da};
    if(minuto < a) return minuto <= ui ? {k: 'aperto', a: f[i].a, ui: f[i].ui} : {k: 'chiuso_ora', motivo: 'ui', ui: f[i].ui};
  }
  return {k: 'chiuso_ora'};
}
function etichetta(s){
  switch(s.k){
    case 'sempre': return '<span class="stato ok">' + e(T.sempre) + '</span>';
    case 'verifica': return '<span class="stato att">' + e(T.in_verifica) + '</span>';
    case 'aperto': return '<span class="stato ok">' + e(T.aperto) + '</span> <span class="piccolo">· ' + e(T.chiude_alle) + ' ' + e(s.a) + (s.ui ? ' · ' + e(T.ultimo_ingresso) + ' ' + e(s.ui) : '') + '</span>';
    case 'apre': return '<span class="stato att">' + e(T.apre_alle) + ' ' + e(s.da) + '</span>';
    case 'chiuso_ora': return '<span class="stato ko">' + e(T.chiuso_ora) + '</span>';
    default: return '<span class="stato ko">' + e(T.chiuso_oggi) + '</span>';
  }
}
function fotoHtml(f){ if(!f) return ''; return '<figure class="foto"><img src="' + e(f.u) + '" alt="' + e(f.alt) + '" loading="lazy"><figcaption>' + e(f.aut) + ' · ' + e(f.lic) + (f.src ? ' · <a href="' + e(f.src) + '" rel="noopener">fonte</a>' : '') + '</figcaption></figure>'; }
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="scheda fonti"><summary><b>' + e(T.fonti) + '</b> (' + fs.length + ')</summary><ul>' + fs.map(function(f){ return '<li><a href="' + e(f.u) + '" rel="noopener">' + e(f.t) + '</a></li>'; }).join('') + '</ul></details>'; }
function indietro(){ return '<button class="indietro" onclick="history.length > 1 ? history.back() : (location.hash = \'#/\')">← ' + e(T.indietro) + '</button>'; }
function durata(m){ if(!m) return ''; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : m + ' ' + T.min; }
function km(m){ return m ? (m / 1000).toLocaleString(D.lingua, {maximumFractionDigits: 1}) + ' ' + T.km : ''; }

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null;
function caricaMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return mlPromessa || (mlPromessa = new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = PRE + 'mappa/maplibre-gl.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }));
}
function stile(){
  var base = new URL(PRE + 'mappa/', location.href).href;
  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"'));
  });
}
function mappa(id, punti, inQuadro){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18,
      maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}, cooperativeGestures: false});
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    var b = new maplibregl.LngLatBounds();
    punti.forEach(function(p){
      var d = document.createElement('a'); d.className = 'num' + (p.casa ? ' casa' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(inQuadro && punti.length > 1) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0}); /* a destra c'e' lo zoom */
  }).catch(function(){ el.innerHTML = '<p class="piccolo" style="padding:16px">—</p>'; });
}

/* ---------- schermate ---------- */
var V = {};
V.home = function(){
  var ora = adesso(), h = '';
  var sc = D.scioperi.filter(function(s){ return s.d === ora.data; });
  if(sc.length) h += '<div class="avviso ko"><b>' + e(T.sciopero) + '</b>' + sc.map(function(s){ return '<br>' + e([s.l, s.x].filter(Boolean).join(' — ')); }).join('') + '</div>';
  var chiusi = D.luoghi.filter(function(l){ return !l.sa && verificati(l, ora) && stato(l, ora, ora.min).k === 'chiuso_oggi'; });
  h += '<section class="scheda"><h3>' + e(T.oggi) + ' · ' + e(nomeGiorno(ora.gs, true)) + ' ' + e(dataLunga(ora.data)) + '</h3>';
  h += chiusi.length ? '<p class="piccolo" style="margin:0"><b>' + e(T.chiusi_oggi) + ':</b> ' + chiusi.map(function(l){ return '<a href="#/l/' + e(l.s) + '">' + e(l.n) + '</a>'; }).join(', ') + '</p>'
                     : '<p class="piccolo" style="margin:0">' + e(T.tutti_aperti) + '</p>';
  h += '</section>';
  h += '<div class="bottoni"><a class="bottone pieno" href="#/mappa">' + e(T.mappa) + '</a><a class="bottone" href="#/piove">☂ ' + e(T.piove) + '</a></div>';
  if(D.itinerari.length){
    h += '<h2>' + e(T.itinerari) + '</h2><p class="piccolo" style="margin:0">' + e(T.partenza) + '</p><ul class="lista">';
    D.itinerari.forEach(function(i){
      h += '<li><a class="voce" href="#/i/' + e(i.s) + '"><div class="titolo">' + e(i.n) + '</div>' + (i.sub ? '<div class="piccolo">' + e(i.sub) + '</div>' : '') +
           '<div class="meta piccolo"><span>' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span><span>' + i.tappe.filter(function(t){ return !LU[t.l] || LU[t.l].s !== 'piazza-carita'; }).length + ' ' + e(T.tappe) + '</span></div></a></li>';
    });
    h += '</ul>';
  }
  if(D.racconti.length){
    h += '<h2>' + e(T.racconti) + '</h2><ul class="lista">';
    D.racconti.forEach(function(r){ h += '<li><a class="voce" href="#/r/' + e(r.s) + '"><div class="titolo">' + e(r.t) + '</div>' + (r.som ? '<div class="piccolo">' + e(r.som) + '</div>' : '') + '</a></li>'; });
    h += '</ul>';
  }
  var altri = D.luoghi.filter(function(l){ return l.s !== 'piazza-carita'; });
  if(altri.length){
    h += '<h2>' + e(T.luoghi) + '</h2><ul class="lista">';
    altri.forEach(function(l){ h += voceLuogo(l, ora); });
    h += '</ul>';
  }
  return h;
};
function voceLuogo(l, ora){
  return '<li><a class="voce" href="#/l/' + e(l.s) + '"><div class="titolo">' + e(l.n) + '</div><div class="meta">' + etichetta(stato(l, ora, ora.min)) +
         (l.mp ? '<span class="piccolo">' + l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi) + '</span>' : '') + '</div></a></li>';
}
V.itinerario = function(s){
  var i = IT[s]; if(!i) return V.home();
  var ora = adesso(), h = indietro(), t = ora.min, punti = [], k = 0;
  h += '<h2>' + e(i.n) + '</h2>' + (i.sub ? '<p class="piccolo" style="margin:0">' + e(i.sub) + '</p>' : '');
  h += '<div class="meta piccolo" style="display:flex;gap:12px;margin-top:6px"><span>' + e(T.durata) + ' ' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span></div>';
  h += fotoHtml(i.foto);
  h += '<div class="mappa" id="m-itin"></div><p class="piccolo">' + e(T.nota_mappa) + '</p>';
  if(i.desc) h += '<div class="testo">' + par(i.desc) + '</div>';
  h += '<p class="piccolo"><b>' + e(T.arrivo) + '</b></p>';
  i.tappe.forEach(function(tp, n){
    var l = LU[tp.l], casa = l.s === 'piazza-carita';
    t += tp.m;
    var arrivo = t, sa = stato(l, ora, arrivo), num = casa ? '★' : String(++k);
    if(!punti.some(function(p){ return p.id === l.id; }) && l.lat != null) punti.push({id: l.id, t: num, n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa});
    h += (tp.m ? '<div class="tra">↓ ' + tp.m + ' ' + e(T.min) + ' ' + e(T.a_piedi) + (tp.mt ? ' · ' + tp.mt + ' m' : '') + '</div>' : '');
    h += '<div class="tappa"><div class="n"' + (casa ? ' style="background:var(--accento)"' : '') + '>' + num + '</div><div><a href="#/l/' + e(l.s) + '" style="color:inherit;text-decoration:none"><h3>' + e(l.n) + '</h3></a>' +
         '<div class="piccolo">' + (arrivo < 1440 ? '≈ ' + fmt(arrivo) : '') + (tp.so ? ' · ' + tp.so + ' ' + e(T.min) : '') + '</div>' +
         '<div class="meta" style="margin-top:4px">' + etichetta(sa) + '</div>' + (tp.nota ? '<p style="margin:6px 0 0">' + e(tp.nota) + '</p>' : '');
    var chiusoArrivo = (sa.k === 'chiuso_oggi' || sa.k === 'chiuso_ora' || (sa.k === 'apre' && hm(sa.da) - arrivo > 30));
    if(chiusoArrivo){
      h += '<div class="alt"><b>' + e(T.chiuso_arrivo) + '.</b>';
      if(tp.alt && LU[tp.alt]) h += ' ' + e(T.alternativa) + ': <a href="#/l/' + e(LU[tp.alt].s) + '">' + e(LU[tp.alt].n) + '</a> ' + etichetta(stato(LU[tp.alt], ora, arrivo));
      h += '</div>';
    }
    h += '</div></div>';
    t += tp.so;
  });
  h += fontiHtml(i.fonti);
  setTimeout(function(){ mappa('m-itin', punti, true); });
  return h;
};
V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), h = indietro() + '<h2>' + e(l.n) + '</h2>';
  h += fotoHtml(l.foto);
  if(l.som) h += '<p style="font-size:1.05rem">' + e(l.som) + '</p>';
  h += '<section class="scheda"><div class="meta">' + etichetta(stato(l, ora, ora.min)) + '</div>';
  if(!l.sa && verificati(l, ora) && l.or.length){
    h += '<table class="orari" style="margin-top:10px">';
    for(var g = 1; g <= 7; g++){
      var f = fasceDelGiorno(l, ora.data, g), aperte = f.filter(function(o){ return !o.x && o.da; });
      var txt = f.some(function(o){ return o.x; }) || !aperte.length ? T.giorni_chiusura : aperte.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      h += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>';
    }
    h += '</table><p class="piccolo" style="margin:8px 0 0">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  }
  if(l.po || l.sito) h += '<p style="margin:10px 0 0">' + (l.po ? '<a href="' + e(l.po) + '" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  var info = [];
  if(l.dv) info.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) info.push(e(T.gratuito)); else if(l.gr === false) info.push(e(T.pagamento));
  if(l.mp) info.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(info.length) h += '<p class="piccolo" style="margin:10px 0 0">' + info.join(' · ') + '</p>';
  h += '</section>';
  if(l.rac) h += '<div class="testo">' + par(l.rac) + '</div>';
  if(l.con) h += '<section class="scheda"><h3>' + e(T.consiglio) + '</h3><p style="margin:0">' + e(l.con) + '</p></section>';
  if(l.acc) h += '<section class="scheda"><h3>' + e(T.accessibilita) + '</h3><p style="margin:0">' + e(l.acc) + '</p></section>';
  if(l.lat != null){
    h += '<div class="mappa" id="m-luogo" style="height:240px"></div>';
    h += '<p><a class="bottone" href="https://www.openstreetmap.org/?mlat=' + l.lat + '&amp;mlon=' + l.lon + '#map=18/' + l.lat + '/' + l.lon + '" rel="noopener">' + e(T.apri_mappa) + '</a></p>';
    setTimeout(function(){ mappa('m-luogo', [{id: l.id, t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}], false); });
  }
  h += fontiHtml(l.fonti);
  return h;
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return indietro() + '<h2>' + e(r.t) + '</h2>' + fotoHtml(r.foto) + '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti);
};
V.mappa = function(){
  var ora = adesso(), punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l, n){ return {id: l.id, t: l.s === 'piazza-carita' ? '★' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: l.s === 'piazza-carita'}; });
  setTimeout(function(){ mappa('m-tutti', punti, true); });
  return indietro() + '<h2>' + e(T.mappa) + '</h2><div class="mappa" id="m-tutti" style="height:60vh"></div>';
};
V.piove = function(){
  var ora = adesso(), cop = D.luoghi.filter(function(l){ return D.coperto.indexOf(l.tipo) >= 0 && !l.sa; });
  var h = indietro() + '<h2>☂ ' + e(T.piove) + '</h2><p class="piccolo">' + e(T.piove_testo) + '</p>';
  if(!cop.length) return h + '<p>' + e(T.piove_vuoto) + '</p>';
  var peso = {aperto: 0, apre: 1, verifica: 2, chiuso_ora: 3, chiuso_oggi: 4};
  cop.sort(function(a, b){ return (peso[stato(a, ora, ora.min).k] || 0) - (peso[stato(b, ora, ora.min).k] || 0); });
  return h + '<ul class="lista">' + cop.map(function(l){ return voceLuogo(l, ora); }).join('') + '</ul>';
};
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h;
  if(p[0] === 'i') h = V.itinerario(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'l') h = V.luogo(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'r') h = V.racconto(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'mappa') h = V.mappa();
  else if(p[0] === 'piove') h = V.piove();
  else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<div class="avviso prova">' + e(T.anteprima) + '</div>' : '') + h +
    '<footer><p><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a></p><p>' + e(T.editoriale) + '<br>' + e(T.senza_rete) + '</p></footer>';
  if(p[0]) window.scrollTo(0, 0);
}
document.getElementById('t-titolo').textContent = T.titolo;
document.getElementById('t-sotto').textContent = T.sottotitolo;
if(D.lingue.length){
  document.getElementById('lingue').innerHTML = '<details class="lingue"><summary aria-label="' + e(T.lingua) + '">' + e((D.lingue.filter(function(x){ return x.c === D.lingua; })[0] || {}).b || '') + ' ' + e(D.lingua.toUpperCase()) + ' ▾</summary><ul>' +
    D.lingue.map(function(x){ return '<li><a data-lng="' + e(x.c) + '" href="' + e(x.u || './') + '"' + (x.c === D.lingua ? ' aria-current="true"' : '') + '>' + e(x.b + ' ' + x.n) + '</a></li>'; }).join('') + '</ul></details>';
  document.getElementById('lingue').addEventListener('click', function(ev){ var a = ev.target.closest('a[data-lng]'); if(!a) return; try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; });
  /* stessa scelta di lingua del menu: chi l'ha gia' scelta la ritrova */
  if(D.lingua === 'it'){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
}
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
