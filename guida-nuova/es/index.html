n reconocer la calle y las habitaciones donde se vendían y comerciaban mercancías: es un fragmento de la antigua ciudad que aún se conserva, sobre el cual Nápoles continuó construyendo.","d":"Debajo de la nave, en las excavaciones","foto":{"u":"../img/ab890c42a731.jpg","alt":"Una calzada romana en las excavaciones bajo San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Las excavaciones bajo San Lorenzo Maggiore: la calle y las tiendas de la antigua ciudad."}},{"t":"El altar mayor de Giovanni da Nola","x":"El altar mayor es una obra renacentista del escultor napolitano Giovanni da Nola, considerada una de las más bellas de Nápoles. El ábside que lo alberga es la parte más antigua de la iglesia.","d":"En la parte trasera de la iglesia, en el ábside","foto":null},{"t":"El Museo de la Ópera","x":"El museo ocupa el convento y la torre cívica contigua a la basílica. Exhibe mobiliario, trajes y colecciones que presentan la historia de Nápoles desde la época clásica hasta el siglo XIX.","d":"En el convento, junto a la basílica","foto":{"u":"../img/591ff764e679.jpg","alt":"Una sala del museo en el complejo San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Las estancias del convento de San Lorenzo Maggiore que albergan el Museo de la Ópera."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, la iglesia de los capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"La Iglesia de los capuzzelle: bajo el suelo, el hipogeo donde Nápoles rezaba por las almas sin nombre. Y el cráneo de Lucía.","rac":"Los napolitanos la llaman \"'e cape 'e morte\", la iglesia de las cabezas de los muertos. Es una pequeña iglesia del siglo XVII situada en el decumano principal, vinculada a la devoción a las almas del Purgatorio difundida por la Contrarreforma. Una empinada escalera conduce al hipogeo, la iglesia subterránea, ampliada y decorada con mayólica en el siglo XVIII: allí, los devotos cuidaban restos anónimos y buscaban su intercesión. Al final de un pequeño pasillo, se conserva el cráneo de Lucía, una joven particularmente querida.","con":"Detrás del altar, busquen la calavera alada de mármol de Dionisio Lazzari: es el símbolo de la iglesia.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La fachada del Purgatorio ad Arco en Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La fachada del Purgatorio ad Arco, en el decumano principal."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Iglesia superior, hipogeo y museo. Las visitas guiadas están incluidas en el precio de la entrada; se requiere reserva previa."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Iglesia mayor, hipogeo y museo."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Las pinturas del siglo XVII","x":"Antes de descender, observe con atención la iglesia que se encuentra arriba. Fue encargada en 1616 por la congregación laica \"Opera Pia Purgatorio ad Arco \" al arquitecto Giovan Cola di Franco y consagrada en 1638.\n\nFue diseñada en dos niveles: la iglesia superior, que representa la dimensión terrenal, y el cementerio subterráneo, que representa concretamente el Purgatorio. Toda la decoración recuerda a quienes entran que las almas esperan una oración para ascender al Cielo.\n\nAquí se conservan valiosos mármoles y pinturas de tres grandes maestros del arte napolitano del siglo XVII: Massimo Stanzione, Luca Giordano y Andrea Vaccaro. La sacristía y el oratorio albergan también un pequeño museo con platería, vestimentas litúrgicas, manuscritos y pinturas creadas para la congregación entre los siglos XVII y XIX.","d":"En la iglesia superior","foto":{"u":"../img/a8b34654121a.jpg","alt":"Una tumba de mármol del siglo XVII en la iglesia superior.","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"En la iglesia superior: la tumba de Pietro Antonio Mastrilli (1607), entre los mármoles y pinturas del siglo XVII."}},{"t":"El cráneo alado","x":"Entre los mármoles de la iglesia superior se encuentra la famosa calavera alada de Dionisio Lazzari: una calavera con alas que captura el espíritu del lugar. Aquí, la muerte no asusta: se convierte en una oportunidad para la oración y la conexión con quienes ya no están con nosotros.\n\nNo es casualidad que los napolitanos llamen a esta iglesia \"'e cape 'e morte\", la de las calaveras.\n\nEl mensaje era intencionado: en la iglesia nacida con la Contrarreforma, todo tenía como objetivo recordar a los transeúntes y a los fieles que las almas del Purgatorio esperaban una oración para ascender al Cielo.","d":"En la iglesia superior","foto":{"u":"../img/63d1e885c193.jpg","alt":"Un bajorrelieve de mármol con una calavera alada y coronada.","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"La calavera alada y coronada en bajorrelieve de mármol, primera mitad del siglo XVII: símbolo de la iglesia."}},{"t":"El Hipogeo de las Almas","x":"La verdadera iglesia es la de abajo. Desde una abertura en el suelo de la iglesia superior, unas altas escaleras conducen a un espacio amplio y diáfano, una auténtica iglesia inferior.\n\nEn el centro de la sala se encuentra una gran tumba sin marcar, rodeada de cadenas negras e iluminada por algunas bombillas. A lo largo de las paredes hay nichos, pequeños altares y santuarios: estos son vestigios del culto que surgió espontáneamente aquí en el siglo XVII, cuando los fieles cuidaban restos humanos anónimos y rezaban por su protección. Al fondo se halla el antiguo altar del siglo XVII con grandes cruces negras.\n\nDescienda despacio: es un lugar de devoción viva, no solo de curiosidad. La visita guiada en italiano está incluida en el precio de la entrada, previa reserva.","d":"Debajo de la iglesia, bajando por una escalera empinada.","foto":{"u":"../img/7fc480d05134.jpg","alt":"El hipogeo del Purgatorio ad Arco y velas.","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"El hipogeo, la iglesia subterránea: altares, velas y vestigios del culto a las almas."}},{"t":"El cráneo de Lucía","x":"Entre todos los cráneos del hipogeo, hay uno especialmente apreciado: el de Lucía, que se cree que es el alma de una joven. Se conserva al final de un pequeño pasillo.\n\nEs el testimonio más conmovedor del culto a las almas del Purgatorio, que surgió aquí espontáneamente en el siglo XVII: los devotos eligen unos restos anónimos, los cuidan y piden su protección.\n\nMírenla con respeto: para muchos napolitanos, sigue siendo una figura a la que pueden recurrir.","d":"En el hipogeo, al final de un pequeño corredor.","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Una imagen de las almas del Purgatorio entre las llamas dentro de la iglesia.","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro de la iglesia: las almas del Purgatorio en las llamas, tema central de todo el lugar."},{"u":"../img/de63b1b83fa8.jpg","alt":"Una calavera de bronce sobre una pequeña columna.","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Una calavera de bronce: el símbolo de la iglesia de las \" capuzzelle \"."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Cuarenta metros más abajo de la Via dei Tribunali: las cisternas que durante siglos abastecieron de agua a Nápoles, refugios de guerra y un teatro romano escondido bajo una cama.","rac":"Bajo el centro histórico se esconde otra ciudad. Desde la Piazza San Gaetano, se desciende por más de cien escalones hasta una profundidad de unos 40 metros, a lo largo de un sendero que atraviesa un acueducto grecorromano y túneles de las épocas medieval, borbónica y moderna.\n\nLas cuevas de la época griega se utilizaron como cisternas para el suministro de agua de la ciudad durante aproximadamente 23 siglos. Durante la Segunda Guerra Mundial, esos mismos espacios se convirtieron en refugios antiaéreos.\n\nLa visita subterránea es guiada y dura aproximadamente una hora. Después, se regresa a la superficie para la sorpresa final: los restos del teatro grecorromano de Neapolis, integrados en las casas del barrio desde el siglo XV. Se entra en un «basso», una vivienda en la planta baja, se mueve una cama y se desciende por una trampilla hasta las paredes del teatro.","con":"Calzado bajo y sudadera, incluso en verano: el ambiente subterráneo es húmedo. El pasaje corto y estrecho con la vela es opcional. Se requiere reserva para grupos de 10 personas o más.","acc":"No apto para sillas de ruedas ni andadores: hay escaleras con pasamanos y pasillos estrechos.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una gran cisterna subterránea excavada en la toba, tenuemente iluminada.","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una de las grandes cisternas excavadas en la toba volcánica se encuentra a unos 40 metros por debajo de la Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Las visitas guiadas salen cada hora de 10:00 a 18:00, en italiano e inglés. También disponibles los jueves a las 21:00, solo con reserva previa y para grupos de al menos 10 personas."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Las cisternas grecorromanas","x":"Se desciende por 136 escalones bajos y cómodos hasta unos 40 metros por debajo del nivel de la calle. Ya en el siglo III a. C., los griegos abrieron aquí las primeras canteras subterráneas para extraer los bloques de toba con los que construyeron las murallas y los templos de Neapolis.\n\nLas grandes cámaras excavadas en la toba volcánica se convirtieron posteriormente en las cisternas de agua de la ciudad, conectadas por el acueducto grecorromano, y permanecieron así durante aproximadamente 23 siglos. Bajo el centro histórico se extiende una red aún inexplorada de cisternas, canteras, túneles y pozos, con vestigios griegos, españoles y borbones.\n\nEn el camino, también verás cosas sorprendentes: el laboratorio de la estación sísmica Arianna y los jardines subterráneos, pequeños cultivos a 35 metros bajo tierra, iluminados por lámparas especiales, que también son estudiados por investigadores.","d":"En la primera parte de la visita, a unos 40 metros de profundidad.","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Las paredes de toba de una cisterna subterránea","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Las paredes de toba de una cisterna: durante aproximadamente 23 siglos, el agua de la ciudad se recogía aquí."}},{"t":"El pasaje con la vela","x":"Las habitaciones a lo largo del recorrido son todas grandes y están bien iluminadas, excepto en un tramo muy corto y estrecho: se camina a la luz de las velas, de uno en uno, manteniendo una pequeña distancia con la persona que va delante.\n\nAl final del túnel se llega a la cisterna romana, todavía llena de agua: este es el momento más evocador de la visita.\n\nPasar el relevo es opcional: quienes tengan dificultades en espacios reducidos pueden esperar al grupo afuera, donde hay bancos. No es necesario llevar una vela; la linterna del teléfono es suficiente.","d":"A lo largo del camino subterráneo","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Un túnel muy estrecho iluminado en la toba","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"Uno de los túneles muy estrechos excavados en la toba volcánica."}},{"t":"Los refugios de guerra","x":"Durante la Segunda Guerra Mundial, las antiguas cisternas se utilizaron como refugios antiaéreos: los habitantes de Nápoles bajaban allí para resguardarse de los bombardeos.\n\nA lo largo de la ruta se encuentra el Museo de la Guerra, con objetos de aquellos años.\n\nNápoles sufrió más de cien bombardeos aéreos, especialmente en su puerto: pensar en cuántas personas se refugiaron allí nos ayuda a comprender por lo que pasó la ciudad.","d":"A lo largo del camino subterráneo","foto":{"u":"../img/0f4490838101.jpg","alt":"Objetos de la Segunda Guerra Mundial expuestos bajo tierra","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Recuerdos de la guerra: objetos de la época en que estas habitaciones servían de refugio antiaéreo."}},{"t":"El teatro debajo de la cama","x":"La segunda parte del recorrido transcurre por la superficie, entre Via Anticaglia, Vico Cinquesanti y Via San Paolo. Aquí se encontraba el teatro grecorromano de Neapolis, también conocido como el teatro de Nerón, ya que el emperador actuaba allí.\n\nDesde el siglo XV, se han construido casas sobre y dentro de los muros del teatro, que han sobrevivido hasta nuestros días. Se entra en un «basso», una típica casa de planta baja, se mueve la cama y, a través de una trampilla, se desciende a las habitaciones donde, según la tradición, Nerón se preparaba para sus representaciones.\n\nOtra pieza del teatro ha reaparecido recientemente en un antiguo taller de carpintería: hoy alberga una exposición de antiguas vitrinas de madera oscura para belenes, y bajo el suelo han reaparecido desagües de la época borbónica hechos con azulejos de dibujos azules.","d":"Segunda parte de la visita, en la superficie entre Via Anticaglia y Vico Cinquesanti.","foto":{"u":"../img/33425512f471.jpg","alt":"Los arcos de ladrillo que cruzan la Via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Los arcos de Via Anticaglia: son restos del teatro romano de Neapolis, incorporados a las casas."}}],"gal":[],"leg":"Según el relato de la visita, Nerón tenía sus camerinos en las habitaciones ocultas bajo la planta baja cuando venía a Nápoles a actuar en el teatro.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Dos columnas romanas de once metros de altura aún sostienen la fachada: son todo lo que queda del Templo de los Dioscuros.","rac":"En la Piazza San Gaetano, en pleno centro histórico, una escalinata conduce a una fachada sostenida por dos columnas corintias de aproximadamente once metros de altura. Se trata de los restos del Templo de los Dioscuros, construido entre los siglos I y II d. C. y considerado el edificio antiguo más importante de Nápoles.\n\nAquí se construyó una primera iglesia de San Pablo entre los siglos VIII y IX; los teatinos la reconstruyeron a finales del siglo XVI. El terremoto de 1688 destruyó gran parte del antiguo templo; el arquitecto Arcangelo Guglielmelli incorporó las columnas restantes a la nueva fachada. Los bombardeos de 1943 dañaron el interior, pero gran parte de la decoración sobrevivió.\n\nSan Cayetano de Thiene, fundador de los teatinos, está enterrado aquí.","con":"Observa de cerca las columnas y luego entra: la sacristía, decorada con frescos de Solimena, es una de las partes más bellas. El horario de apertura varía; consúltalo antes.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Las columnas corintias del templo romano en la fachada de San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Las columnas corintias del Templo de los Dioscuros en la fachada de San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Las columnas del Templo de los Dioscuros","x":"Las dos columnas corintias de la fachada, de aproximadamente once metros de altura, son todo lo que queda del Templo de los Dioscuros. Tras el terremoto de 1688, el arquitecto Arcangelo Guglielmelli las integró en la nueva fachada. Sobre la escalinata, Andrea Falcone esculpió en 1671 las estatuas de San Pedro y San Pablo.","d":"En la fachada, en lo alto de las escaleras.","foto":{"u":"../img/951355b4bf10.jpg","alt":"La fachada de San Paolo Maggiore con sus antiguas columnas.","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"La fachada de San Paolo Maggiore, con las columnas del Templo de los Dioscuros."}},{"t":"La tumba de San Cayetano","x":"San Cayetano de Thiene, fundador de los Teatinos, la orden que reconstruyó la iglesia a finales del siglo XVI, está enterrado en esta basílica. El santuario dedicado a él forma parte del diseño de la iglesia.","d":"Dentro de la basílica","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"El santuario de San Gaetano Thiene en la basílica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"El santuario de San Gaetano Thiene en la basílica de San Paolo Maggiore."}},{"t":"La sacristía de Solimena","x":"La sacristía de la basílica está decorada por Francesco Solimena, uno de los más grandes pintores napolitanos del siglo XVIII. Es una de las partes más bellas de la iglesia.","d":"Detrás de la nave, en la sacristía","foto":{"u":"../img/4782e44ae33e.jpg","alt":"La sacristía pintada al fresco por Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"La sacristía de San Paolo Maggiore, con frescos de Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pío Monte de la Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"La obra maestra que Caravaggio pintó nada más llegar a Nápoles: Las Siete Obras de Misericordia, que aún se conservan en el altar para el que fueron creadas, a pocos pasos del Duomo.","rac":"El Pio Monte della Misericordia fue fundado en 1602 por siete jóvenes nobles napolitanos para ayudar a los necesitados. Todavía existe hoy en día, en el mismo edificio del siglo XVII en Via dei Tribunali, y continúa su labor caritativa.\n\nLa iglesia octogonal fue construida entre 1656 y 1671 según un diseño de Francesco Antonio Picchiatti. En el altar mayor se encuentra el lienzo que la hizo mundialmente famosa: Las siete obras de misericordia de Caravaggio, pintada entre 1606 y 1607 y cuyo coste ascendió a 400 ducados, una suma exorbitante. Caravaggio llevaba unos meses en Nápoles, huyendo de Roma tras ser condenado por asesinato.\n\nLa pintura tuvo tan buena acogida que en 1613 la congregación decretó que no podía venderse «a ningún precio» y que debía permanecer en la iglesia para siempre. A su alrededor, en los otros seis altares, se encuentran pinturas de otros maestros napolitanos del siglo XVII, cada una dedicada a una obra de misericordia. En la planta superior se encuentra la galería de arte Pio Monte.","con":"El precio de la entrada general es de 10 €, y el precio reducido de 8 €. El palacio también alberga las sillerías del coro, desde donde los gobernadores de Pío Monte podían contemplar el lienzo desde arriba: pregunte si esto está incluido en la visita guiada.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La cúpula octogonal de la iglesia de Pio Monte della Misericordia vista desde abajo.","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La cúpula de la iglesia octogonal de Pio Monte della Misericordia, vista desde arriba."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Cerrado el 25 de diciembre y el Domingo de Pascua; el 24 y el 31 de diciembre y el 15 de agosto cierra a las 14:30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Las siete obras de misericordia","x":"Es un lienzo enorme, de casi cuatro metros de altura, que evoca un callejón nocturno de Nápoles: una intersección concurrida, iluminada por una luz lateral que esculpe los cuerpos en la oscuridad. Arriba, la Virgen con el Niño, llevada por dos ángeles, contempla a la multitud.\n\nEl Pío Monte deseaba una obra que combinara las siete obras de misericordia: dar de comer al hambriento, dar de beber al sediento, vestir al desnudo, dar cobijo a los peregrinos, visitar a los enfermos, visitar a los presos y enterrar a los muertos. Caravaggio las plasmó todas en una sola escena, sin milagros: es el hombre quien ayuda al hombre.\n\nFue la primera obra de Caravaggio en Nápoles y cambió la pintura de la ciudad: los pintores napolitanos del siglo XVII adoptaron su luz, sus personajes tomados de la calle e incluso algunos detalles, como el hombre visto de espaldas en primer plano.","d":"En el altar mayor","foto":{"u":"../img/da8045021e55.jpg","alt":"Las siete obras de misericordia de Caravaggio: Escenas callejeras en una noche oscura.","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Las Siete Obras de Misericordia de Caravaggio (1607): la escena completa, con las personas en la parte inferior y la Virgen con el Niño en la parte superior."}},{"t":"Cómo reconocer las siete obras","x":"Busca las escenas una por una.\n\nA la derecha, una joven amamanta a un anciano tras las rejas: Pero y su padre Cimone, condenados a morir de hambre en prisión. Cumplen una doble función: alimentar a los hambrientos y visitar a los presos. Ella observa la gota de leche en la barba del anciano.\n\nDetrás de ellos, un hombre carga a un muerto (solo se ven sus pies), y un sacerdote con una antorcha le ilumina el camino: enterrar a los muertos. En primer plano, a la izquierda, un joven caballero corta la capa para un hombre desnudo en el suelo: es San Martín vistiendo a los desnudos; cerca, en el rincón más oscuro, un lisiado reza: visitar a los enfermos.\n\nEn el extremo izquierdo, un posadero le indica el camino a un peregrino con una concha de vieira en el sombrero, que representa a Santiago Apóstol: dando la bienvenida a los peregrinos. Al fondo, un hombre bebe de la quijada de un asno: Sansón, dando de beber al sediento.","d":"Delante del lienzo, de izquierda a derecha.","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"Lienzo de Caravaggio sobre el altar mayor del Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"El lienzo de Caravaggio tal como se ve en la iglesia: sobre el altar, en la capilla de Pío Monte."}},{"t":"La Virgen y los ángeles","x":"Alza la vista: la Virgen y el Niño aparecen como desde una ventana, frente a dos sábanas drapeadas, y dos ángeles se abrazan en pleno vuelo. Parecen distantes de lo que sucede abajo.\n\nPero observemos la sombra que proyectan en el muro de la prisión: Caravaggio las hace presentes, casi concretas, dentro de la misma noche que los hombres.\n\nEl historiador de arte Roberto Longhi eligió precisamente este detalle para el cartel de la importante exposición de 1951 que redescubrió a Caravaggio: bello, escribió, como un Rafael, pero cautivado \"por la cruda verdad de Forcella o Pizzofalcone\".","d":"Arriba en el lienzo","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Detalle: la Virgen con el Niño y dos ángeles en vuelo.","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"El detalle de arriba: la Virgen con el Niño mirando hacia afuera y los dos ángeles abrazándose en pleno vuelo."}},{"t":"Los otros altares","x":"Alrededor del altar de Caravaggio, la iglesia octogonal cuenta con otros seis altares, con pinturas de pintores napolitanos del siglo XVII: Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino y Forlì.\n\nBusque \"La liberación de San Pedro\" de Battistello Caracciolo, de 1615: es uno de los pintores que más aprendió de Caravaggio, y esto se evidencia en el juego de luces y sombras. También está \"San Pedro resucitando a Tabita\" de Fabrizio Santafede, de 1611.\n\nObsérvenlas después de Caravaggio: comprenderán de inmediato lo novedoso que era su lienzo para Nápoles.","d":"En las capillas de los alrededores","foto":{"u":"../img/b58919c38c63.jpg","alt":"Un lienzo del siglo XVII que representa al Buen Samaritano.","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"El Buen Samaritano, de Giovan Vincenzo Forlì, se encuentra en uno de los altares que rodean las Siete Obras de Caravaggio."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Catedral y Tesoro de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La Catedral de Nápoles y la Capilla del Tesoro, donde se guarda el frasco con la sangre de San Genaro.","rac":"La catedral, dedicada a Santa María Asunta, fue encargada por Carlos de Anjou en 1294 sobre el emplazamiento de dos antiguas basílicas: la demolida Basílica de Santa Esteban y la Basílica de Santa Restituta, conservada como capilla. Aparece repentinamente en la Via Duomo, la calle que se inauguró en las primeras décadas tras la unificación de Italia.\n\nEs de estilo gótico, con planta de cruz latina y tres naves, y un techo artesonado de madera tallada y dorada. En su interior, se despliegan los siglos: la basílica paleocristiana de Santa Restituta, el baptisterio más antiguo de Occidente, la cripta renacentista del Succorpo, la capilla barroca del Tesoro y, debajo de todo, los restos de la ciudad grecorromana.\n\nEn la Catedral, en un nicho de la Capilla del Tesoro, se conserva la ampolla que contiene la sangre tradicionalmente atribuida a San Gennaro. Tres veces al año (el sábado anterior al primer domingo de mayo, el 19 de septiembre y el 16 de diciembre) se espera su licuefacción. Desde 1601, las reliquias están bajo la custodia de una institución secular: la Delegación de la Capilla del Tesoro de San Gennaro.","con":"Los días de licuefacción, el Duomo está abarrotado desde la mañana: si quieres estar allí, llega temprano.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La fachada de la Catedral de Nápoles","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La fachada del Duomo, en Via Duomo. La Capilla del Tesoro es la tercera a la derecha."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Entrada gratuita con reserva previa. Los tours salen cada hora."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"El portal de San Gennaro","x":"Deténgase frente a la fachada: mide unos cincuenta metros de altura y tiene tres portales. Fue reconstruida en estilo gótico después de que el terremoto de 1349 destruyera la fachada angevina y el campanario.\n\nLa puerta de la derecha permanece cerrada casi todo el año: solo se abre para la fiesta de San Gennaro y en ocasiones especiales. Si está abierta, significa que has venido a un día especial.\n\nLa catedral, dedicada a Santa María Asunta, fue encargada por Carlos de Anjou en 1294 sobre el emplazamiento de dos antiguas basílicas. En su interior, presenta planta de cruz latina, tres naves y un techo artesonado de madera tallada y dorada.","d":"En la parte delantera, a la derecha","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"El portal gótico de la catedral de Nápoles","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"El portal gótico de la catedral, en la fachada."}},{"t":"La Capilla del Tesoro","x":"Más que una capilla, es una iglesia dentro de otra: la tercera capilla a la derecha, una capilla barroca de la primera mitad del siglo XVII, tiene planta de cruz griega y una cúpula de doble arco. Se accede a ella a través de la gran puerta de bronce obra de Cosimo Fanzago.\n\nAquí se guardan el busto de plata de San Gennaro y los frascos que contienen su sangre: cada año la ciudad espera el \"milagro\" de la licuefacción, y la catedral se llena de gente.\n\nEl tesoro donado al santo a lo largo de los siglos (joyas, plata, obras de arte) puede visitarse en el Museo del Tesoro de San Gennaro, con entrada desde el exterior de la Catedral.","d":"Tercera capilla a la derecha","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cúpula de la Capilla del Tesoro está decorada con frescos del Paraíso.","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Alza la vista: en la cúpula de la Capilla del Tesoro se encuentra el Paraíso, pintado por Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Cuando Carlos de Anjou mandó construir la catedral, una de las dos antiguas basílicas que antaño se alzaban en este lugar fue demolida, mientras que la otra se conservó como capilla lateral: se trata de Santa Restituta, en la nave izquierda.\n\nSegún la tradición, fue encargada por el emperador Constantino: es uno de los testimonios más importantes del arte paleocristiano en Nápoles. Tiene tres naves y alberga obras de Luca Giordano y esculturas del siglo XIV.\n\nDesde aquí se desciende a la zona arqueológica que hay bajo la catedral, donde se pueden ver capas de historia apiladas unas sobre otras: restos grecorromanos y paleocristianos.","d":"En el pasillo izquierdo","foto":{"u":"../img/5abf53aec271.jpg","alt":"Un mosaico con la Virgen entronizada en la Basílica de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Un mosaico de la Virgen entronizada en el interior de Santa Restituta: la basílica más antigua, conservada como capilla de la Catedral."}},{"t":"El Baptisterio de San Giovanni in Fonte","x":"A la derecha del ábside, una pequeña sala con una historia inmensa: el Baptisterio de San Giovanni in Fonte, considerado el más antiguo de Occidente.\n\nDeténgase unos minutos en silencio: se encuentra en uno de los lugares cristianos más antiguos de Europa que aún se conservan, desde la época en que la Nápoles romana se convirtió al cristianismo.\n\nEl baptisterio y la zona arqueológica bajo la catedral narran juntos la historia de los primeros siglos de la ciudad cristiana.","d":"A la derecha del ábside","foto":{"u":"../img/994ed22c6902.jpg","alt":"El interior del Baptisterio de San Giovanni in Fonte con la pila bautismal en el centro.","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"El Baptisterio de San Giovanni in Fonte: en el centro del suelo, la pila bautismal."}},{"t":"El Succorpo","x":"Debajo del altar mayor se encuentra la cripta de la Catedral, la Capilla del Succorpo, también conocida como la Capilla Carafa: el cardenal Oliviero Carafa la mandó construir para albergar las reliquias de San Gennaro junto con las de otros 51 santos.\n\nEl arquitecto Giovan Tommaso Malvito la concibió como una pequeña basílica: tres naves divididas por columnas antiguas con capiteles jónicos, nichos en los laterales y una capilla al final.\n\nMármol blanco, luz tenue y silencio: el Renacimiento en el interior de la catedral gótica.","d":"Debajo del altar mayor","foto":{"u":"../img/876cd614ab8d.jpg","alt":"El interior del Succorpo di San Gennaro con columnas de mármol y suelo incrustado.","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"El Succorpo, bajo el presbiterio de la Catedral: columnas y suelo de mármol, y al fondo el altar con las reliquias de San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Complejo Girolamini","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Frente a la catedral se encuentran una iglesia barroca llamada \"Domus Aurea\", dos claustros, una galería de arte y la biblioteca pública más antigua de Nápoles.","rac":"En Via Duomo, frente a la catedral, se encuentra el complejo Girolamini, construido en el siglo XVI por los padres del Oratorio de San Filippo Neri, conocido como Girolamini. Es monumento nacional desde 1866 y comprende la iglesia, los claustros, la galería de arte y la biblioteca.\n\nLa iglesia, dedicada a San Felipe Neri, es conocida como la \"Domus Aurea\" por su decoración barroca dorada. La galería de arte es considerada la primera galería de arte pública de la ciudad y alberga obras de maestros como Battistello Caracciolo, Jusepe de Ribera y Luca Giordano. La biblioteca, abierta al público en la segunda mitad del siglo XVI, es la biblioteca pública más antigua de Nápoles.\n\nEl complejo ha sido objeto de un extenso proyecto de restauración: la iglesia reabrió sus puertas el 21 de marzo de 2024 y, según fuentes de prensa, las salas Sala Camino y Sala Vico de la biblioteca también reabrieron en 2026. Las reaperturas son progresivas; no todas las salas pueden visitarse simultáneamente.","con":"Antes de venir, consulta la página web oficial para ver qué está abierto: la iglesia, los claustros, la galería de arte y la biblioteca tienen horarios de apertura diferentes y están sujetos a cambios.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"La fachada de Girolamini iluminada por la noche.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"La fachada de la iglesia de Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Iglesia. Cerrada los lunes."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Iglesia y días festivos."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"La iglesia \"Domus Aurea\"","x":"La iglesia de San Filippo Neri es conocida como la Domus Aurea, la \"Casa Dorada\", por su rica decoración barroca. Es uno de los lugares de culto más importantes de la ciudad.","d":"En la iglesia, con entrada desde Via Duomo.","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"La nave de la iglesia de Girolamini con sus decoraciones doradas.","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"La iglesia de los Girolamini, conocida como la \"Domus Aurea\" por su rica decoración."}},{"t":"La galería de imágenes","x":"Se considera la primera galería de arte pública de Nápoles. Alberga pinturas de maestros del siglo XVII como Battistello Caracciolo, Jusepe de Ribera y Luca Giordano. Se accede a ella desde el Claustro de los Naranjos, en la primera planta del convento.","d":"Primer plano del convento, desde el claustro de Orange.","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Cabeza de santo pintada por Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Un lienzo de la Quadreria dei Girolamini: cabeza de santo de Massimo Stanzione (siglo XVII)."}},{"t":"La biblioteca más antigua de Nápoles","x":"La biblioteca es la más antigua de la ciudad y la segunda de Italia, después de la Malatestiana de Cesena. Especializada en teología, filosofía, historia de la Iglesia y música sacra, alberga aproximadamente 159.700 volúmenes antiguos y modernos. Entre sus salas históricas destaca una dedicada a Giambattista Vico, quien estudió aquí.","d":"Entrada por Via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"El vestíbulo de la Biblioteca Girolamini con sus estanterías de madera.","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"La sala de la Biblioteca dei Girolamini, la biblioteca pública más antigua de Nápoles."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"La Virgen con una pistola de Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Una Virgen María de Banksy con una pistola en lugar de aureola, protegida por cristal, en el corazón del decumano principal.","rac":"Banksy llegó a Nápoles en 2010: era su primera vez trabajando en Italia. Utilizando plantillas, probablemente la misma noche, dejó dos obras en lugares concurridos del centro de la ciudad, ambas con una imagen religiosa y un mensaje directo. Una de ellas, en Via Benedetto Croce, fue cubierta por otro artista; esta sobrevivió y, por lo tanto, se considera el único mural de Banksy en Italia.\n\nJunto a la obra hay un antiguo santuario votivo con la Virgen y el Niño: las dos imágenes, muy cerca una de la otra, parecen estar hablando entre sí.\n\nEn la Piazzetta dei Girolamini, en una fachada del decumano principal, Banksy dejó una Virgen con una pistola en lugar de su aureola. Hoy, está protegida por un cristal. La página web oficial de turismo de la ciudad la incluye en su itinerario dedicado al arte callejero del centro histórico.","con":"Mira hacia arriba: la obra está por encima del nivel de la calle, detrás de un cristal.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"El rostro de Madonna de Banksy en plantilla blanca sobre un fondo oscuro.","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"El rostro de la Virgen de Banksy: la plantilla blanca sobre un fondo oscuro, en primer plano."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Virgen con la pistola","x":"Mira la pared: blanca sobre fondo negro, con la imagen de una Virgen María con los brazos extendidos hacia el cielo. Pero en lugar de una aureola, sobre su cabeza hay una pistola.\n\nBanksy, el artista callejero inglés afincado en Bristol, lo pintó en Nápoles en 2010, probablemente de noche y en cuestión de segundos, utilizando plantillas. Fue la primera obra de Banksy en Italia.\n\nEl mensaje no se explica: a simple vista, parece una imagen sagrada, pero no lo es. Lo sagrado y la violencia, la fe y las armas: cada uno la interpreta a su manera.","d":"En la pared de la pequeña plaza","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"La obra de Banksy, una especie de esténcil de la Virgen María, en la pared de la Piazza Gerolomini, vista de cerca.","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Virgen María de Banksy, un esténcil en blanco y negro en una esquina del muro de la Piazza Gerolomini."}},{"t":"El quiosco de periódicos de al lado","x":"Ahora fíjense junto a la obra: hay un pequeño altar votivo con la Virgen y el Niño, uno de esos que se encuentran en muchas calles de Nápoles, pintado quién sabe hace cuántos siglos.\n\nLas dos Madonas, una al lado de la otra, parecen mirarse fijamente: la mayor parece mirar con perplejidad a la de Banksy. Es este diálogo lo que confiere a la obra ese aire tan napolitano.\n\nRetrocede un paso y míralos juntos: es la foto más bonita que te puedes llevar a casa.","d":"Justo al lado del trabajo","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Virgen de Banksy en la pared y, junto a ella, el altar votivo con la Virgen y el Niño.","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"A la izquierda, la Virgen de Banksy; a la derecha, colgada en la pared, el santuario con la Virgen y el Niño: las dos imágenes sagradas una junto a la otra."}},{"t":"Un Banksy bajo cristal","x":"En 2010, Banksy dejó dos obras en Nápoles, probablemente la misma noche. La otra, en Via Benedetto Croce, se burlaba del consumismo: era una recreación del \"Éxtasis de la Beata Ludovica Albertoni\" de Bernini, pero la santa aparecía en éxtasis tras una comida rápida.\n\nEsa obra fue cubierta por otro artista callejero napolitano, que no sabía lo que estaba borrando. Por esta razón, el FAI (Fondo Nacional Italiano para el Patrimonio) cataloga este mural en Piazza Gerolomini como el único mural de Banksy en Italia.\n\nActualmente está protegida por una vitrina de plexiglás, que al menos la protege de los vándalos.","d":"Delante del trabajo","foto":null},{"t":"Cómo llegar y qué fotografiar","x":"La obra se encuentra en una pared de la pequeña Piazza Gerolomini, con vistas a la Via dei Tribunali.\n\nLa vitrina protege la obra de arte, pero puede reflejar la luz: para obtener una foto sin reflejos, intente colocarse ligeramente a un lado. El espacio es siempre accesible y gratuito.\n\nDesde aquí, la Virgen de Via Benedetto Croce, la obra perdida, se encontraba a nueve minutos a pie, siguiendo la ruta que pasa por Sansevero, Napoli Sotterranea y San Gregorio Armeno.","d":"Plaza Gerolomini, en Via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"La plaza Bellini y las murallas griegas","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Una plaza llena de cafés y estudiantes con vistas al pasado: tras una balaustrada se pueden ver las murallas griegas de Neapolis.","rac":"La Piazza Bellini se ubica en el decumano principal y es una de las plazas más concurridas del centro histórico, debido a la gran cantidad de bares y restaurantes que la bordean. Basta con mirar hacia abajo, más allá de la balaustrada, para ver, en una zona hundida, un tramo de las murallas de la Neapolis griega, que datan del siglo IV a. C. Fueron descubiertas en 1954.\n\nEl Conservatorio de San Pietro a Majella está a solo unos pasos.","con":"Diez minutos son suficientes: observa las paredes desde arriba y luego tómate un descanso en uno de los bares de la plaza.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"La plaza Bellini con sus mesas y vegetación.","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"La Piazza Bellini, punto de encuentro del centro histórico."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Las murallas griegas","x":"Debajo del nivel de la plaza se encuentran los restos de las murallas defensivas de la Neapolis griega, construidas con bloques de toba. Fueron descubiertas en 1954 y forman parte del sistema de fortificación de la antigua ciudad. No se trata de una reconstrucción: son piedras originales.","d":"Más allá de la balaustrada, en la zona rebajada","foto":{"u":"../img/4801d5111d9f.jpg","alt":"Los bloques de toba de las murallas griegas por debajo del nivel de la plaza.","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Las murallas griegas de Neapolis en la Piazza Bellini: bloques de toba originales."}},{"t":"La plaza hoy","x":"Alrededor de las murallas hay cafés, librerías y bares frecuentados por estudiantes y residentes. Es uno de los lugares del centro histórico donde la vida antigua y la cotidiana se encuentran más presentes.","d":"Alrededor de la plaza","foto":{"u":"../img/133ed975e61b.jpg","alt":"Plaza Bellini con árboles, edificios y mesas","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"Hoy en día, la Piazza Bellini está repleta de cafés y librerías."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port Alba y la calle de los libreros","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una puerta de 1625 y, más allá del arco, un callejón con librerías y tiendas de música que conduce a la Piazza Bellini.","rac":"Port'Alba es una de las puertas más antiguas de la ciudad. Se abre a una esquina de la Piazza Dante y debe su nombre al virrey español Antonio Álvarez de Toledo, duque de Alba, quien la mandó construir en 1625 para reemplazar una abertura provisional y facilitar el paso de un extremo a otro de la ciudad. Su aspecto actual es el resultado de las obras de finales del siglo XVIII encargadas por Fernando IV de Borbón.\n\nMás allá de la puerta se encuentra Via Port'Alba, una calle peatonal conocida por sus librerías y tiendas de música, que conduce a la Piazza Bellini.","con":"Pasa bajo el arco y curiosea por los puestos de libros: es la forma más fácil de ir de la Piazza Dante a la Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"El Arco de Port'Alba, una entrada histórica al casco antiguo.","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, la puerta de entrada al casco antiguo que data del siglo XVI."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"La puerta de 1625","x":"La puerta fue erigida en 1625 por orden del duque de Alba, virrey de España. El escudo de armas incluye los del rey Felipe III, la ciudad de Nápoles y el virrey. Actualmente, la puerta queda parcialmente oculta por la columnata de la Piazza Dante.","d":"En un rincón de la Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"La puerta de Port'Alba con el escudo de armas.","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, la puerta de entrada encargada por el duque de Alba en 1625."}},{"t":"La calle de los libreros","x":"El callejón que atraviesa la puerta es famoso por su mercado de libros: librerías, puestos y tiendas de instrumentos musicales, que se extiende hasta la Piazza Bellini.","d":"Más allá de la puerta, hacia la Piazza Bellini.","foto":null}],"gal":[],"leg":"Cuenta la leyenda que una joven llamada María fue acusada de brujería durante la Inquisición española y abandonada a su suerte en una jaula colgada de una puerta.","fc":null,"col":null},{"id":22,"s":"mann","n":"Museo Arqueológico Nacional (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"Uno de los museos arqueológicos más grandes del mundo: los tesoros de Pompeya y Herculano, la Colección Farnese y el famoso Mosaico de Alejandro.","rac":"El Museo Arqueológico Nacional se encuentra en el Palazzo degli Studi, construido en 1585. En 1777, el rey Fernando IV de Borbón trasladó allí la colección Farnese, heredada de su madre, Isabel Farnese. Con el regreso de los Borbones en 1816, se convirtió en el Museo Real Borbónico; tras la reunificación de Italia, pasó a ser el Museo Nacional. Las pinturas fueron trasladadas a Capodimonte en 1957, y desde entonces es un museo dedicado exclusivamente a las antigüedades.\n\nAlberga aproximadamente 18.000 objetos: las colecciones vesubianas (frescos, mosaicos, objetos cotidianos, la maqueta de Pompeya, la Villa de los Papiros), las esculturas y gemas Farnesio, el Gabinete Secreto, numismática y una de las colecciones egipcias más importantes del mundo.\n\nLa pieza más famosa es el Mosaico de Alejandro, hallado en 1831 en la Casa del Fauno en Pompeya: representa la Batalla de Issos, entre Alejandro Magno y Darío III, y está compuesto por alrededor de un millón y medio de teselas.","con":"Si no dispones de mucho tiempo, elige tres: el Mosaico de Alejandro, el Hércules Farnesio y el Gabinete Secreto. Se necesitan al menos dos o tres horas para verlo todo. Consulta el horario de apertura antes de ir.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Fresco pompeyano expuesto en el Museo Arqueológico Nacional.","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Un fresco pompeyano expuesto en el MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Taquilla abierta hasta las 18:30."}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"El mosaico de Alejandro","x":"Descubierto en 1831 en la Casa del Fauno en Pompeya, este gran mosaico mide aproximadamente 5,82 por 3,13 metros y contiene alrededor de 1,5 millones de teselas. Representa la batalla de Issos (333 a. C.) entre Alejandro Magno y Darío III de Persia.","d":"En la entreplanta, en la sección de mosaicos de Pompeya.","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"El gran mosaico de la batalla entre Alejandro y Darío","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"El mosaico de Alejandro, procedente de la Casa del Fauno en Pompeya."}},{"t":"La Colección Farnese","x":"Coleccionada por la familia Farnesio para su palacio en Roma, incluye estatuas monumentales como el Hércules Farnesio, de aproximadamente tres metros de altura y encontrado en las Termas de Caracalla, y el Toro Farnesio.","d":"En la planta baja","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"La estatua del Hércules Farnesio apoyado en su maza.","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"El Hércules Farnesio, hallado en las Termas de Caracalla."}},{"t":"El gabinete secreto","x":"Alberga arte erótico procedente de Pompeya y Herculano. Tiene una entrada independiente y suele requerir reserva previa: pregunte en la taquilla.","d":"En el entresuelo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, museo de arte contemporáneo","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Un edificio renovado por el arquitecto Álvaro Siza que alberga obras de Clemente, Kapoor, Serra, Horn y otros maestros del arte contemporáneo.","rac":"El MADRE, Museo de Arte Contemporáneo Donnaregina, está ubicado en el Palazzo Donnaregina, a pocos pasos del Duomo y del Tesoro de San Gennaro. El edificio fue renovado por el arquitecto portugués Álvaro Siza, y el museo, gestionado por la Fundación Donnaregina para las Artes Contemporáneas, abrió sus puertas en 2005.\n\nLa primera planta está dedicada a obras creadas específicamente para las salas por artistas como Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long y Mimmo Paladino. La colección también incluye obras de Richard Serra, Sol LeWitt y Jeff Koons, y el museo organiza exposiciones temporales. Se trata de un contraste deliberado con la antigua Nápoles que lo rodea.","con":"Busque la obra \"Espíritus\" de Rebecca Horn: son réplicas de hierro fundido de los cráneos del cementerio Fontanelle. El museo cierra los martes y algunas salas del segundo piso están temporalmente cerradas por reformas; consulte la página web antes de su visita.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"El patio blanco del museo Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"El Museo Madre, arte contemporáneo en Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Cerrado los martes. La última entrada es una hora antes del cierre."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Domingo. La última entrada es una hora antes del cierre."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"\"Ave Ovo\" de Francesco Clemente","x":"Un suelo de mayólica y un fresco monumental, creado en 2005 para el museo, ocupan dos salas en dos plantas.","d":"En las salas dedicadas a Clemente","foto":null},{"t":"«Espíritus» de Rebecca Horn","x":"El artista reprodujo en hierro fundido los cráneos del cementerio Fontanelle, las \" capuzzelle \" napolitanas. Un vínculo entre el arte contemporáneo y la cultura popular napolitana.","d":"En la habitación de Rebecca Horn","foto":null},{"t":"La arquitectura de Siza","x":"Siza renovó las tres plantas del edificio, manteniendo la distribución histórica y añadiendo espacios modernos para grandes instalaciones.","d":"En todo el museo","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Estación de metro de Toledo","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Una parada de la Línea 1 considerada una de las más bellas de Europa: mosaicos, cerámica azul y el \"Cráter de Luz\" de Robert Wilson.","rac":"La estación de Toledo forma parte del proyecto \"Estaciones de Arte\", que encargó a arquitectos y artistas el diseño de las estaciones de la Línea 1, con más de 250 obras. Fue diseñada por el arquitecto catalán Óscar Tusquets Blanca e inaugurada el 17 de septiembre de 2012. La entrada, en Via Diaz, presenta tres estructuras hexagonales revestidas de azulejos azules y ocres, que iluminan el atrio.\n\nAl descender, se aprecian olas en relieve diseñadas por Tusquets, obras de Robert Wilson (entre ellas, \"Crater de luz\") y mosaicos de William Kentridge. La estación ha sido nombrada repetidamente entre las más bellas de Europa.\n\nPara verlo, solo tienes que coger el metro: necesitas un billete para bajarte en los andenes.","con":"Desciende hasta el nivel más profundo y mira hacia arriba: allí es donde la luz del cráter es más intensa. Se requiere entrada; consulta el horario en el sitio web del ANM.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"El andén de la estación de Toledo, subterráneo","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"El andén de la estación de Toledo."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Horario de funcionamiento de la línea 1: desde el primer tren hasta el último."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Horario de funcionamiento de la línea 1: desde el primer tren hasta el último."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"\"Cráter de luz\" de Robert Wilson","x":"Un cráter de luz, diseñado por Robert Wilson, define la identidad de la estación. La obra de arte cambia con la luz, lo que confiere al descenso un efecto casi teatral.","d":"En los pisos subterráneos de la estación","foto":null},{"t":"Los mosaicos de William Kentridge","x":"Durante el recorrido se pueden ver mosaicos del artista sudafricano William Kentridge, que forman parte del programa Art Stations.","d":"De camino a las pistas","foto":null},{"t":"La entrada azul en Via Diaz","x":"Tres estructuras hexagonales revestidas de azulejos azules y ocres, que dejan pasar la luz al atrio, constituyen el tema subyacente en toda la estación.","d":"En la entrada de Via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Galería de Italia, el último Caravaggio","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"A seis minutos de Ceraldi, en Via Toledo, se encuentra el último cuadro de Caravaggio, pintado pocas semanas antes de su muerte: El martirio de Santa Úrsula.","rac":"Las Gallerie d'Italia de Intesa Sanpaolo se ubican en Via Toledo 177, en el edificio que antiguamente albergaba la sede del Banco di Napoli, diseñado por Marcello Piacentini a finales de la década de 1930. El nuevo diseño es obra del arquitecto Michele De Lucchi. El museo abrió sus puertas en 2022, sustituyendo al cercano Palazzo Zevallos Stigliano.\n\nLa obra maestra de la colección es El martirio de Santa Úrsula de Caravaggio, de 1610, considerada la última pintura del artista. Está rodeada por tres secciones: arte napolitano de los siglos XVII al XX, una colección de cerámica ática y de la Magna Grecia, y una selección de obras del siglo XX.","con":"Entrada general: 8 €, reducida: 4 €; entrada gratuita para menores de 26 años y para todos el primer domingo de cada mes. Cerrado los lunes; última entrada una hora antes del cierre.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Una sala en las Gallerie d'Italia con cuadros en las paredes amarillas.","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Una sala de la Galería de Italia en Nápoles, con pinturas del siglo XVII."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"El martirio de Santa Úrsula","x":"Es una escena oscura y claustrofóbica, casi sin fondo: estamos en la tienda de Atila, rey de los hunos. Úrsula, una princesa, lo ha rechazado, y él acaba de clavarle una flecha en el pecho. Ella inclina la cabeza hacia la flecha; tres hombres corren a sostenerla. El rey ya parece arrepentirse de su acción.\n\nFíjate en el rostro que se esconde tras el santo: es el propio Caravaggio, que se pintó a sí mismo entre los testigos. Y observa la mano que se extiende entre el santo y el rey, como para detener la flecha: reapareció durante la restauración de 2003-2004.\n\nFue un encargo del príncipe genovés Marcantonio Doria, cuya familia tenía a Santa Úrsula como patrona. Es la última pintura conocida de Caravaggio: la terminó en mayo de 1610, poco más de un mes antes de su muerte.","d":"En la sala dedicada a Caravaggio","foto":{"u":"../img/62ba7427c200.jpg","alt":"El martirio de Santa Úrsula de Caravaggio: la santa y el rey en el momento de la flecha.","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"El martirio de Santa Úrsula (1610): el rey hiere a la santa con una flecha a corta distancia."}},{"t":"El cuadro colocado al sol","x":"Caravaggio pintó el cuadro con prisa, quizás porque estaba a punto de partir hacia Roma para pedir el perdón del Papa. El representante de los Doria en Nápoles, Lanfranco Massa, recibió el lienzo antes de que el barniz estuviera seco y, para acelerar el secado, lo expuso al sol. El barniz, aplicado en una capa muy gruesa, se arruinó. Él mismo lo relató en una carta fechada en mayo de 1610.\n\nEl cuadro llegó a Génova, pasó de heredero en heredero y acabó en una villa de Éboli, donde fue atribuido a otros pintores. No fue hasta la década de 1980 que el descubrimiento de la carta de Massa confirmó con certeza que era obra de Caravaggio.\n\nEn 2025, un nuevo proyecto de restauración sacó a la luz tres cabezas que habían desaparecido con el tiempo.","d":"Delante del lienzo","foto":{"u":"../img/6a999eeecae6.jpg","alt":"El lienzo de Caravaggio expuesto en una sala del Palazzo Zevallos, con el techo decorado.","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"El martirio de Santa Úrsula se exhibe en una sala del Palazzo Zevallos Stigliano, sede de las Gallerie d'Italia."}},{"t":"El edificio del Banco de Nápoles","x":"Antes de subir a las habitaciones, eche un vistazo a su alrededor: se encuentra en el edificio que fue la sede del Banco di Napoli, diseñado por Marcello Piacentini a finales de la década de 1930.\n\nEl arquitecto Michele De Lucchi lo transformó en un museo con una distribución moderna: las amplias salas del banco albergan ahora tres exposiciones, desde arte napolitano de los siglos XVII al XX, incluyendo una rica colección de jarrones griegos y de la Magna Grecia.\n\nEl museo abrió sus puertas en 2022 y da continuidad a las actividades del Palazzo Zevallos Stigliano, que estuvo abierto desde 1999 hasta 2022, a tan solo unos pasos de distancia.","d":"Al entrar, en el vestíbulo","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La fachada de piedra del Palazzo del Banco di Napoli en Via Toledo, con la bandera europea.","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"El Palazzo del Banco di Napoli en Via Toledo, sede de la Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Barrio Español","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Una red de callejones estrechos construida en el siglo XVI para los soldados españoles, hoy en día uno de los barrios más animados y fotografiados de Nápoles.","rac":"El Barrio Español fue fundado en 1536 por orden del virrey español Pedro de Toledo para albergar las guarniciones encargadas de mantener el orden. La calle principal, Via Toledo, lleva su nombre. El barrio es una cuadrícula de callejuelas estrechas entre Via Toledo, Corso Vittorio Emanuele y Monte Echia, e incluye las zonas de Avvocata, Montecalvario y San Ferdinando.\n\nLa influencia española perdura en los nombres de las calles, como Via della Trinita degli Spagnoli, donde se encuentra la iglesia de Santa María del Pilar. Las callejuelas están repletas de tiendas, tendederos, pequeños altares y numerosos murales.\n\nEl mural más famoso es el de Maradona en Largo Maradona, en Via Emanuele De Deo: fue creado en 1990 por Mario Filardi y ha sido restaurado varias veces a lo largo de los años. Es una parada del recorrido \"El Mar y los Castillos\", y cuenta con su propia página.","con":"Empiece en Piazza Carità y recorra las callejuelas durante el día. Como en cualquier lugar concurrido, tenga a mano su bolso y su teléfono. Camine despacio: los detalles se encuentran en los portales y los murales.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"Un callejón en el Barrio Español con un mural de Maradona y banderas.","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"En el Barrio Español, el mural de Maradona entre las banderas."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"La cuadrícula de callejones","x":"El trazado urbano consiste en una cuadrícula regular de callejones estrechos, construidos para albergar a los soldados españoles. Al pasear por ellos, se pueden ver prendas tendidas al sol, pequeños altares y tiendas: la vida del barrio transcurre en sus calles.","d":"En los callejones al oeste de Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"Un callejón estrecho en el Barrio Español","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"Uno de los callejones rectos y estrechos que forman parte del entramado del Barrio Español."}},{"t":"El mural de Maradona y Largo Maradona","x":"En la Via Emanuele De Deo, un antiguo aparcamiento se ha convertido en Largo Maradona. El mural de 1990 de Mario Filardi fue restaurado posteriormente por el artista argentino Bosoletti, quien creó la Isis Velada junto a él.","d":"En la calle Emanuele De Deo","foto":null},{"t":"La Iglesia de Santa María del Pilar","x":"En Via della Trinità degli Spagnoli se encuentra la iglesia dedicada por los españoles a Santa María del Pilar: una huella de los orígenes españoles del barrio.","d":"En la calle Trinity española","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"El mural de Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"El querido mural del Barrio Español y la plaza que desde 2020 se ha convertido en un santuario laico para Diego.","rac":"El mural representa a Maradona vistiendo la camiseta número 10 del Napoli de la década de 1980, con el Scudetto en el pecho y el brazalete de capitán. Fue pintado para celebrar el segundo Scudetto del club, en la temporada 1989-90, en la que Maradona contribuyó con 16 goles en 28 partidos. Llegó procedente del Barcelona en 1984 y permaneció en Nápoles hasta 1991.\n\nEl autor, Mario Filardi, tenía solo 23 años: pintaba por pasión y trabajaba como camarero, viajando por el mundo.\n\nEl mural de Maradona fue pintado en 1990 por Mario Filardi. En la década de 1990, una ventana en la pared obstruyó su rostro y la pintura se desvaneció casi por completo. Fue restaurado por Salvatore Iodice, y en el otoño de 2017, el artista argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona el 25 de noviembre de 2020, la plaza, antes conocida como la Plaza de los Artistas, fue rebautizada en su honor y se llenó de altares, banderas y fotografías.","con":"Está muy concurrido durante la hora punta: a primera hora de la mañana es más fácil verlo con tranquilidad.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"El gran mural de Maradona en la fachada de un edificio, con la multitud debajo.","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"El mural fue pintado en 1990 por Mario Filardi. El rostro actual fue repintado en 2017 por el artista argentino Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"El mural y su autor","x":"El mural de 1990 es obra de Mario Filardi, quien pintaba por placer. Ha sido restaurado varias veces: en 2017, el artista argentino Francisco Bosoletti repintó el rostro.","d":"En la fachada de Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"El rostro de Maradona pintado en la fachada de un edificio.","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"El mural de Maradona en Via Emanuele De Deo, cuyo rostro fue repintado en 2017 por Francisco Bosoletti."}},{"t":"El mar abierto desde el 25 de noviembre de 2020","x":"Tras la muerte de Maradona, la plaza, antes conocida como la \"plaza de los artistas\", adoptó su nombre y se convirtió en un lugar de altares, banderas y fotografías.","d":"En el claro frente al mural","foto":{"u":"../img/76bca69c23a8.jpg","alt":"La plaza frente al mural de Maradona está llena de gente.","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona: banderas, pequeños altares y visitantes frente al mural."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La placa en Largo Maradona con un busto y banderas","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La placa en la plaza: tras la muerte de Diego en 2020, la plaza de los artistas recibió su nombre."},{"u":"../img/550f6edc4b91.jpg","alt":"Un pequeño altar con fotos de Maradona y recuerdos.","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un pequeño santuario dedicado a Maradona: hay muchos en la ciudad, con fotos y recuerdos dejados por los fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona pintado con un halo junto a un pequeño santuario","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona con su aureola y su altar votivo, pintados en la zona de San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Un santuario votivo con un retrato de Maradona.","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un santuario votivo dedicado a Maradona, como los de los santos."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galería Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Una galería en forma de cruz con una cúpula de hierro y cristal de aproximadamente 56 metros de altura, frente al Teatro di San Carlo.","rac":"La Galería Umberto I se construyó entre 1887 y 1890 durante el proyecto de reconstrucción de Nápoles, la principal iniciativa urbanística tras la epidemia de cólera. El arquitecto Emanuele Rocco la diseñó en forma de cruz, inspirándose en la Galería Vittorio Emanuele II de Milán. Recibe su nombre de Umberto I, rey de Italia en el momento de su construcción.\n\nLos cuatro brazos confluyen bajo una cúpula de hierro y cristal, sostenida por dieciséis nervaduras. Bajo la cúpula, el suelo está cubierto de un mosaico en forma de estrella. La galería alberga tiendas, cafeterías y, en las plantas superiores, apartamentos: fue diseñada para integrar la actividad comercial con la vida social.\n\nSe encuentra frente al Teatro di San Carlo, cerca de Piazza del Plebiscito.","con":"Detente bajo la cúpula y mira hacia arriba: es el mejor lugar para apreciar el hierro y el vidrio. Es un pasadizo con entrada gratuita.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"Una entrada decorada a la Galería Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Una entrada a la Galería Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"La cúpula de hierro y cristal","x":"Los cuatro brazos de la galería confluyen bajo una cúpula de hierro y cristal, sostenida por dieciséis nervaduras. Durante el día, la luz entra por todos los lados; por la noche, la iluminación realza la estructura.","d":"En el centro de la galería","foto":{"u":"../img/5caa008a8527.jpg","alt":"La cúpula de hierro y cristal de la Galería Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"La cúpula de hierro y cristal, donde se unen los cuatro brazos de la galería."}},{"t":"El mosaico de estrellas","x":"Bajo la cúpula, el suelo es un mosaico en forma de estrella de doce puntas en tonos crema, terracota y gris. Se puede reconocer mirando hacia abajo, donde se unen los brazos.","d":"En el suelo, bajo la cúpula","foto":null},{"t":"La reurbanización de Nápoles","x":"La galería nació como símbolo de una ciudad que se esforzaba por modernizarse tras la epidemia de cólera. Formaba parte del proyecto de reurbanización, el principal proyecto de demolición y reconstrucción de la ciudad, y estaba destinada a competir con la Galería Vittorio Emanuele II de Milán.","d":"Entrando desde Via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Estatuas y la inscripción ANNO MDCCCXC en la galería.","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Año MDCCCXC»: la fecha de finalización, escrita en el túnel que simboliza la renovación."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Teatro San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":f
