alse,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"El teatro de ópera más antiguo de Europa que aún sigue en funcionamiento: inaugurado en 1737, antes que La Scala y La Fenice.","rac":"El Teatro di San Carlo fue construido por orden de Carlos III de Borbón e inaugurado el 4 de noviembre de 1737, día del santo del rey. El monarca deseaba un teatro para Nápoles más grande que el antiguo San Bartolomeo. Se inauguró 41 años antes que La Scala de Milán y 55 antes que La Fenice de Venecia, lo que lo convierte en el teatro de ópera más antiguo aún en funcionamiento. El proyecto fue encomendado a Giovanni Antonio Medrano y Angelo Carasale.\n\nCompositores de la talla de Rossini, Donizetti, Bellini y Verdi han pisado su escenario. El teatro, junto con el centro histórico, es Patrimonio de la Humanidad de la UNESCO.\n\nLas visitas guiadas en italiano e inglés duran aproximadamente media hora. El mismo complejo alberga también el MeMus, un museo que narra la historia del teatro y la ópera.","con":"Las visitas dependen de los ensayos y las funciones: consulta la página web oficial y, si es posible, reserva. Si te apasiona la ópera, la mejor manera de disfrutarla es asistiendo a una función.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"La fachada del Teatro San Carlo con sus columnas.","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"La fachada del Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Se ofrecen visitas guiadas de aproximadamente 30 minutos de duración a las 10:30, 11:30, 12:30, 14:30, 15:30 y 16:30. Se recomienda reservar."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"El salón y el Teatro Real","x":"El auditorio en forma de herradura es el corazón del teatro: palcos escalonados y un palco real. El San Carlo también es famoso por su acústica. Las visitas guiadas suelen permitir tomar fotografías del auditorio y el vestíbulo.","d":"En el vestíbulo, con la visita guiada.","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"Un grabado del siglo XVIII que representa un baile en el teatro.","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Un baile en el Teatro Real de San Carlo, en un grabado de 1749."}},{"t":"El MeMus","x":"El MeMus, inaugurado en 2011, es el museo y archivo histórico del teatro. Recorre la historia del edificio y de la ópera italiana a través de pinturas, fotografías, instrumentos musicales y vestuario.","d":"En el mismo complejo que el teatro.","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Vestuario escénico en exhibición en MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"En MeMus se exhiben los trajes de una ópera de Paisiello."}},{"t":"El primer teatro de ópera de Europa","x":"Inaugurado en 1737, es más antiguo que La Scala de Milán (1778) y La Fenice de Venecia (1792). Por este motivo, se considera el teatro de ópera más antiguo que aún sigue en funcionamiento.","d":"Frente a la fachada, en Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"La inscripción Real Teatro di S. Carlo en la fachada.","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"«Teatro Real de San Carlos», en la fachada del teatro inaugurado en 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"La plaza más grande de Nápoles: a un lado el Palacio Real, al otro una columnata que abraza la Basílica de San Francesco di Paola.","rac":"Al pie de la colina Pizzofalcone, Piazza del Plebiscito es una de las plazas más grandes y monumentales de la ciudad. Hasta 1817, se llamaba Largo di Palazzo. En 1809, Joaquín Murat demolió los conventos de la zona y diseñó un foro con una columnata semicircular. Las obras se detuvieron al final de su reinado y fueron reanudadas por Fernando I, quien deseaba construir una iglesia en cumplimiento de una promesa hecha a San Francisco de Paula. La basílica se erigió entre 1817 y 1836, inspirada en el Panteón de Roma.\n\nLa plaza recibió su nombre actual tras el plebiscito del 21 de octubre de 1860, que sancionó la anexión del Reino de las Dos Sicilias al Reino de Cerdeña. Frente a la basílica se encuentran dos estatuas ecuestres: la de Carlos III de Borbón, obra de Antonio Canova, y la de Fernando I.\n\nHoy en día es sede de conciertos, ceremonias y festivales de la ciudad.","con":"Llegue temprano por la mañana: la luz del sol ilumina la columnata y la plaza está casi vacía. Después, entre en la basílica y diríjase al Palacio Real.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito con un león y la iglesia de San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito y, al fondo, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"La columnata y la basílica de San Francesco di Paola","x":"La columnata semicircular fue obra de Murat. La basílica es un edificio neoclásico con una cúpula central de 53 metros de altura, inspirada en el Panteón. En su interior, el altar mayor, adornado con piedras preciosas y lapislázuli, fue diseñado por Ferdinando Fuga en 1751 y trasladado aquí en 1835 desde la Iglesia de los Santos Apóstoles.","d":"En el lado oeste de la plaza","foto":{"u":"../img/82ad7240a133.jpg","alt":"El interior circular de la Basílica de San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"El interior de la Basílica de San Francesco di Paola, inspirado en el Panteón."}},{"t":"Las estatuas ecuestres","x":"Las dos estatuas de bronce representan a Carlos III de Borbón, fundador de la casa, y a su hijo Fernando I. Están ubicadas frente a la basílica.","d":"Frente a la basílica","foto":{"u":"../img/75d762389b74.jpg","alt":"Una estatua ecuestre de bronce frente a la basílica.","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"Una de las dos estatuas ecuestres de los Borbones que se encuentran frente a la basílica."}},{"t":"El nombre de la plaza","x":"El nombre deriva del plebiscito del 21 de octubre de 1860, que anexó el Reino de las Dos Sicilias al Reino de Cerdeña. Anteriormente, la plaza se llamaba Largo di Palazzo.","d":"A lo largo de la plaza","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito vista en toda su grandeza","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, antiguamente Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Palacio Real","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"El gran palacio de los virreyes y los Borbones: gran escalinata, teatro de la corte, sala del trono y un jardín con vistas al golfo.","rac":"El Palacio Real domina Piazza del Plebiscito. Fue construido a principios del siglo XVII por el virrey español Fernando Ruiz de Castro, conde de Lemos, y durante siglos fue sede del poder en Nápoles. Su construcción se prolongó durante siglos y no se completó hasta 1858 por Gaetano Genovese. En la fachada, en los nichos, se encuentran ocho estatuas de gobernantes napolitanos.\n\nEl museo ocupa el Apartamento Histórico en la planta principal: se accede a él a través de la Gran Escalera, diseñada por Francesco Antonio Picchiatti en 1651, revestida de mármol rosa y blanco y considerada una de las más bellas de Europa. Entre sus estancias se encuentran el Teatro de la Corte, el Salón del Trono, la Capilla Real y la Sala de Hércules. El Apartamento Histórico está abierto al público desde 1919 y sufrió graves daños durante la Segunda Guerra Mundial.\n\nEl Jardín Romántico, situado en el lado del golfo, tiene entrada gratuita.","con":"Al subir la Gran Escalera, fíjese en el mármol y la luz. Suele estar abierta de 9:00 a 20:00 (última entrada a las 19:00) y cierra los miércoles: consulte el horario antes de venir.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"La fachada del Palacio Real en la plaza","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"La fachada del Palacio Real."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Apartamento con etiqueta (Apartamento histórico). Generalmente cerrado los miércoles. Última confirmación en las páginas oficiales del Ministerio de Cultura (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"La Gran Escalera","x":"Diseñada por Francesco Antonio Picchiatti en 1651, posteriormente fue revestida de mármol rosa y blanco. Se considera una de las escaleras monumentales más bellas de Europa y conduce al museo en la planta principal.","d":"En la entrada, en el patio de honor","foto":{"u":"../img/7533a4a26b58.jpg","alt":"La Gran Escalera de Honor del Palacio Real","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"La gran escalera revestida de mármol del Palacio Real."}},{"t":"El Teatro de la Corte y la Sala del Trono","x":"El Apartamento Histórico alberga el Teatro de la Corte, el Salón del Trono con una gran lámpara de araña de cristal, la Capilla Real y el Salón de Hércules: estas eran las salas de estar y de recepción de la corte.","d":"En la planta principal, en el apartamento histórico","foto":{"u":"../img/841e35a47444.jpg","alt":"El trono en la Sala del Trono del Palacio Real.","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"La sala del trono en el apartamento histórico."}},{"t":"El jardín romántico","x":"En el lado del golfo, hay un jardín con entrada gratuita donde se puede pasear entre parterres y árboles. Es un lugar tranquilo con vistas al golfo.","d":"En el lado del edificio que da al mar.","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (New Castle)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"El castillo que es el símbolo de Nápoles: un arco triunfal entre dos torres, una puerta de bronce que aún conserva el impacto de una bala de cañón y el salón donde un rey mandó arrestar a los barones durante una celebración nupcial.","rac":"Bajo el reinado de los reyes angevinos, el castillo se convirtió en un centro cultural: durante el reinado de Roberto de Anjou, artistas, médicos y hombres de letras se alojaron allí, entre ellos Giotto, Petrarca y Boccaccio.\n\nAlfonso I de Aragón la convirtió en su residencia real y la reconstruyó. Para celebrar su entrada victoriosa en la ciudad, mandó construir el gran Arco Triunfal entre la Torre Media y la Atalaya, que aún hoy sirve de entrada.\n\nEn la actualidad, el castillo alberga el Museo Cívico: la visita incluye la galería de arte en el primer piso, el Salón de los Barones, la Capilla Palatina, también conocida como la Capilla de Santa Bárbara, y una visita arqueológica a la antigua Armería.","con":"Entrada general: 10 €; 6 € para residentes de Nápoles y su área metropolitana; entrada gratuita para menores de 18 años. Cerrado los domingos.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"El Maschio Angioino con sus dos torres y el arco blanco en el centro.","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Las dos grandes torres y, en el centro, el Arco Triunfal de Alfonso de Aragón: esta es la entrada al castillo."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"El Arco del Triunfo","x":"Esta es la entrada al castillo, situada entre dos torres: Alfonso I de Aragón la mandó construir para celebrar su entrada victoriosa en Nápoles. Deténgase frente a ella antes de entrar y admírela desde abajo.","d":"En la entrada, entre la Torre Media y la Atalaya.","foto":{"u":"../img/91d08c9a9561.jpg","alt":"El arco triunfal de mármol entre las dos torres.","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"El arco de cerca: obsérvelo desde abajo, piso por piso."}},{"t":"La puerta con la bala de cañón","x":"Ferrante de Aragón encargó la puerta a Guglielmo Monaco alrededor de 1475 para conmemorar la victoria de 1462 sobre Juan de Anjou y los barones rebeldes: seis paneles narran la guerra. En el panel inferior izquierdo, se conserva una bala de cañón incrustada en el bronce. La teoría más aceptada es que la puerta formaba parte del botín que Carlos VIII cargó en barcos con destino a Francia; frente a la costa de Rapallo, la flota fue atacada por los genoveses y resultó dañada. Los genoveses la devolvieron a Nápoles en 1495.","d":"El original se conserva dentro del castillo.","foto":{"u":"../img/50ee03911e6d.jpg","alt":"La bala de cañón se atascó en la puerta de bronce.","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"La bala de cañón de hierro incrustada en el bronce, en el panel inferior izquierdo."}},{"t":"El Salón de los Barones","x":"Se accede a ella por la escalinata exterior de madera de piperno, diseñada por el arquitecto mallorquín Guglielmo Sagrera. Alza la vista: la bóveda se eleva hasta unos 28 metros, y dieciséis nervaduras de piperno se extienden en forma de estrella desde una abertura central. Su nombre evoca el año 1486, cuando el rey Ferrante I engañó a los barones para celebrar una boda y los hizo arrestar aquí. Durante cincuenta años, fue sede del Ayuntamiento.","d":"En lo alto de las escaleras del patio","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La bóveda estrellada del Salón de los Barones","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La bóveda del Salón de los Barones: dieciséis nervaduras de piperno parten en forma de estrella desde la abertura central."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Un túnel encargado por un rey como vía de escape, que más tarde se convirtió en refugio antiaéreo y después en almacén: un viaje bajo la colina de Pizzofalcone.","rac":"El Galleria Borbonica fue encargado por Fernando II de Borbón mediante decreto del 19 de febrero de 1853 y diseñado por el arquitecto Errico Alvino. Su propósito era conectar el Palacio Real con la Piazza della Vittoria y los cuarteles, pasando bajo la colina Pizzofalcone: una ruta de escape rápida para el rey. La construcción se detuvo por falta de financiación y, posteriormente, por los cambios políticos derivados de la unificación italiana.\n\nDurante la Segunda Guerra Mundial, algunas salas se utilizaron como refugios antiaéreos. Tras la guerra, hasta la década de 1970, el túnel sirvió como depósito judicial para la ciudad de Nápoles: aún hoy se pueden ver fragmentos de estatuas, coches antiguos y motocicletas. La Asociación Cultural Borbonica Sotterranea lo ha restaurado y ofrece visitas guiadas.\n\nLa ruta estándar dura aproximadamente una hora y se puede iniciar desde dos entradas: Via Domenico Morelli 61 y Vico del Grottone 4, a unos 100 metros de Piazza del Plebiscito. También hay disponibles rutas más aventureras.","con":"Reservas: Es necesario reservar. El tour estándar sale a las 10:00, 12:00, 15:00 y 17:00 los viernes, sábados, domingos y festivos. Se permite tomar fotografías.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"Un túnel excavado en la toba volcánica en la Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Un tramo del Galleria Borbonica, excavado en la toba volcánica."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Visita guiada estándar: Salidas a las 10:00, 12:00, 15:00 y 17:00 (viernes, sábado, domingo y festivos). Se requiere reserva; la visita dura aproximadamente 1 hora. Entradas: Via Domenico Morelli 61 y Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"El túnel del Bourbon","x":"Esta es la parte que narra la ambición de Fernando II: un largo pasadizo de toba amarilla, diseñado para conectar el Palacio Real con la Piazza della Vittoria. La toba también cuenta la historia del trabajo de los canteros y de la ingeniería hidráulica de la época.","d":"A lo largo de la ruta principal","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"Un pasaje excavado en la toba volcánica del Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"El paso de los desagües del pozo, una sección del Galleria Borbonica excavada en la toba volcánica."}},{"t":"El refugio antiaéreo","x":"Entre 1939 y 1945, miles de personas se refugiaron aquí de los bombardeos. Aún se conservan camas, grafitis y objetos cotidianos de aquella época. Esta es la parte que más impacta a los visitantes.","d":"En las habitaciones del refugio","foto":{"u":"../img/3200f06943d2.jpg","alt":"El refugio antiaéreo en el Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"El refugio antiaéreo de la Segunda Guerra Mundial."}},{"t":"coches y motocicletas clásicas","x":"Tras la guerra, el túnel se utilizó como depósito judicial de vehículos incautados: incluso hoy en día, se pueden ver coches y motocicletas antiguos a lo largo del recorrido.","d":"En el camino","foto":{"u":"../img/87eab52966bc.jpg","alt":"Coches antiguos abandonados en el túnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Coches antiguos a lo largo del túnel: la época de la posguerra, cuando el túnel era un depósito judicial."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Paseo marítimo y Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"El castillo en el islote donde desembarcaron los colonos griegos de Cumas: se llega desde el paseo marítimo, se cruza el puente y se puede contemplar el golfo desde Borgo Marinari.","rac":"El castillo se alza sobre el islote de Megaride, formado por dos rocas unidas por un gran arco. Aquí, a mediados del siglo VII a. C., desembarcaron colonos de Cumas, quienes más tarde fundaron Partenope en el cercano monte Echia.\n\nEn el siglo I a. C., la villa de Lucio Licinio Lúculo se alzaba sobre el islote y el monte Equia. Restos de esta villa se conservan en la Sala de las Columnas: a principios de la Edad Media, la sala servía como refectorio de uno de los conventos construidos en el islote.","con":"El interior del castillo permanecerá cerrado por reformas hasta nuevo aviso. Actualmente, los visitantes pueden contemplar el castillo desde el exterior, paseando por el paseo marítimo y los alrededores de Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo junto al mar, con el cielo azul.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"El Castel dell'Ovo, situado en el islote de Megaride, está conectado al paseo marítimo por un puente."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Reserva opcional."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"El islote de Megaride","x":"Desde el paseo marítimo, se divisa el castillo: se alza sobre el islote de Megaride, formado por dos rocas unidas por un gran arco. Aquí, hacia mediados del siglo VII a. C., desembarcaron los cumanos, de origen griego, quienes fundaron la ciudad de Partenope en el cercano monte Echia.\n\nEn el siglo I a. C., durante la época romana, se construyó la famosa villa de Lucio Licinio Lúculo en el islote y en el monte Equia; aún se conservan los tambores de las columnas de la llamada \"Sala de las Columnas\".\n\nEl nombre proviene de una leyenda: el poeta Virgilio escondió un huevo en una jaula en las bodegas, y el destino del castillo y de toda Nápoles dependía de su integridad. Cuando, durante el reinado de la reina Juana I, el arco se derrumbó entre las dos rocas, la reina tuvo que declarar que había vuelto a colocar el huevo para tranquilizar a la ciudad.","d":"Desde el puente que lleva a Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo y el puerto deportivo Borgo Marinari vistos desde arriba","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Desde arriba: el castillo sobre la roca y, junto a él, el pequeño puerto de Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Grabado de 1841 con el Castillo dell'Ovo y un velero.","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"El Castillo dell'Ovo en un grabado de 1841."}],"leg":"El nombre proviene de una leyenda: se dice que el poeta Virgilio escondió un huevo, encerrado en una jaula, en las bodegas del castillo.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Barrio Sanità y la Basílica de Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Un barrio popular renacido desde abajo: la basílica \"Monacone\", las catacumbas, Totò y los murales.","rac":"El Rione Sanità es uno de los barrios más antiguos y populares de Nápoles: durante siglos fue un cementerio, y hoy es un modelo de renacimiento comunitario, con cooperativas juveniles que gestionan las catacumbas y las visitan.\n\nEn el centro se encuentra la Basílica de Santa Maria della Sanità, construida entre 1602 y 1610 según un diseño de Fra Nuvolo, uno de los mejores ejemplos del barroco napolitano. Se la conoce como San Vincenzo o \"'o Munacone\", por la gran estatua de San Vicente Ferrer que alberga. La iglesia tiene planta de cruz griega y su cúpula está cubierta de mayólica. Debajo de la iglesia se encuentran las Catacumbas de San Gaudioso, del siglo IV.\n\nEl actor Totò nació en este barrio, en la Via Santa Maria Antesaecula, y su memoria se refleja en los murales que adornan toda la zona. La comedia de Eduardo De Filippo, \"El alcalde del barrio de Sanità\", también está ambientada aquí.","con":"Visite el barrio durante el día y a su ritmo: las catacumbas, la basílica y el cementerio Fontanelle están muy cerca. Puede combinarlo todo con el Miglio Sacro el domingo.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"La Basílica abovedada de Santa Maria della Sanità","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"La Basílica de Santa María della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basílica. Puede estar cerrada en ciertas fechas: consulte la página web."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"La Basílica de Monacone","x":"La iglesia de Fra Nuvolo tiene planta de cruz griega y una cúpula cubierta de mayólica. El presbiterio es elevado y el altar barroco cuenta con una doble escalinata. La estatua de San Vicente Ferrer, el «Monacone», da nombre popular a la basílica.","d":"En Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"El presbiterio elevado con la doble escalera en la basílica","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"La casa parroquial elevada de la Basílica de Santa Maria della Sanità, con la doble escalera."}},{"t":"Las catacumbas de San Gaudioso","x":"Debajo de la basílica se encuentran las catacumbas de San Gaudioso, del siglo IV. Se accede a ellas desde la iglesia.","d":"Bajo la basílica","foto":{"u":"../img/30e6de57bd17.jpg","alt":"Las catacumbas de San Gaudioso bajo la basílica","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Las catacumbas de San Gaudioso, bajo la basílica."}},{"t":"Totò y los murales","x":"En las calles aledañas, y en Via Santa Maria Antesaecula, donde nació Totò, murales y pequeñas imágenes conmemoran al actor y las historias del barrio.","d":"En los callejones que rodean la plaza","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacumbas de San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Las catacumbas más grandes del sur de Italia: túneles de dos niveles excavados en la roca de toba y la tumba original de San Gennaro, patrón de Nápoles.","rac":"Las Catacumbas de San Gennaro se ubican en el barrio de Sanità, con entrada por Via Capodimonte 13, junto a la Basílica del Buen Consejo. Su origen se remonta al siglo II d. C., cuando una acaudalada familia romana donó su tumba a la comunidad cristiana. El complejo se extiende a lo largo de dos niveles, excavados en la toba volcánica: San Gennaro Superiore y San Gennaro Inferiore.\n\nSan Genaro fue enterrado aquí, y durante siglos el lugar fue un sitio de peregrinación. Sus reliquias permanecieron aquí hasta el siglo IX; luego fueron retiradas y el sitio quedó abandonado. Hoy en día, las visitas solo son posibles con un guía y duran aproximadamente una hora. Desde 2009, un sistema LED, instalado por la cooperativa juvenil del barrio Officina dei Talenti, ilumina los frescos con una luz tenue.\n\nEl sitio está gestionado por la cooperativa social La Paranza, fundada por jóvenes del barrio de Sanità.","con":"Reserve con antelación: las visitas son solo con guía, salen cada hora y es necesario reservar. La visita guiada al Miglio Sacro, que recorre el barrio de Sanità, sale a las 9:30 h los sábados, domingos y festivos. Las catacumbas permanecen cerradas los miércoles.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"Un fresco paleocristiano en las catacumbas de San Gennaro.","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Un fresco paleocristiano en las catacumbas de San Gennaro."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Se ofrecen visitas guiadas cada hora; es imprescindible reservar. Cerrado los miércoles y el 25 de diciembre."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"La tumba de San Gennaro","x":"Es la tumba que da nombre a todo el sistema de catacumbas: aquí fue enterrado el santo patrón de Nápoles. Sus reliquias permanecieron allí hasta el siglo IX.","d":"En la visita guiada","foto":{"u":"../img/fd273aee226d.jpg","alt":"La tumba de San Gennaro en las catacumbas","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"La tumba de San Gennaro, el lugar que da nombre a las catacumbas."}},{"t":"Los dos niveles","x":"Las galerías están excavadas en la toba volcánica en dos niveles, el superior y el inferior, con amplios pasillos y frescos paleocristianos.","d":"Durante la visita guiada","foto":{"u":"../img/537a160d9acb.jpg","alt":"Un túnel excavado en la toba con tumbas en sus paredes.","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Las galerías de las catacumbas, excavadas en la toba volcánica."}},{"t":"La Milla Sagrada","x":"Los sábados, domingos y festivos, se ofrece una visita guiada de tres horas por los lugares relacionados con San Gennaro en el barrio de Rione Sanità. La visita comienza a las 9:30 h y es necesario reservar en la página web oficial.","d":"Desde el punto de encuentro en las catacumbas","foto":{"u":"../img/0becd922c42f.jpg","alt":"La fachada de un edificio en el barrio de Sanità.","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"El barrio de Sanità, donde el Miglio Sacro sigue los trazados de los lugares vinculados a San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Cementerio Fontanelle","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"Una cantera de toba volcánica del tamaño de una catedral, miles de cráneos sin nombre y el culto a las \"almas pezzentelle\". Reabrió sus puertas en 2026.","rac":"En el siglo XVI, era una cantera de toba volcánica en el valle de Sanità. Muchas víctimas de la peste de 1656 fueron trasladadas allí, seguidas por las de la epidemia de cólera de 1836-1837. En 1872, el canónigo Gaetano Barbati dispuso los restos en tres grandes naves. El espacio abarca aproximadamente cuatro mil metros cuadrados.\n\nAquí nació el culto a las \"anime pezzentelle\" (almas pacíficas): los devotos adoptaban una calavera, una capuzzella, la cuidaban y le rezaban, esperando protección a cambio, a veces con un sueño relacionado con números de lotería. En 1969, un decreto del tribunal eclesiástico clausuró el osario y prohibió el culto. Cerrado por reformas desde 2020, reabrió al público en 2026, gestionado por la cooperativa La Paranza.","con":"Está cerrado los miércoles. Descarga la aplicación del cementerio antes de llegar: la señal del móvil en el interior es débil.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"Las grandes galerías de toba del cementerio Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Las galerías de toba del cementerio Fontanelle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Cerrado el día de Navidad. Lunes y viernes de 9 a 10 de la mañana abierto solo para el culto."}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Una cantera tan grande como una catedral.","x":"El cementerio ocupa una antigua cantera de toba volcánica de aproximadamente cuatro mil metros cuadrados, que fue acondicionada en tres grandes naves en 1872 por el canónigo Gaetano Barbati. Allí fueron trasladados los fallecidos por la peste de 1656 y el cólera de 1836-1837.","d":"En las tres naves","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"Una nave del cementerio Fontanelle excavada en la toba","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"Una de las tres naves del cementerio Fontanelle, en la antigua cantera de toba."}},{"t":"El culto a las almas pobres","x":"Los devotos adoptaban un cráneo, la capuzzella, lo cuidaban y le rezaban, esperando protección a cambio, a veces con sueños relacionados con números de lotería. En 1969, el tribunal eclesiástico prohibió el culto y clausuró el osario.","d":"Frente a las filas de cráneos","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Filas de calaveras con una cruz","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Las capuzzelle: cráneos sin nombre, adoptados y cuidados por devotos."}},{"t":"Las Fontanelle del MADRE","x":"La artista Rebecca Horn ha reproducido algunas de las capuzzelle de la Fontanelle en hierro fundido en su obra \"Spirits\", que puede verse en el museo MADRE: una forma de comprender cómo el cementerio también se ha incorporado al arte contemporáneo.","d":"En el museo MADRE (página aparte)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Cartuja y Museo de San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Un monasterio cartujo convertido en museo en la colina de Vomero: un claustro barroco, un belén de Cuciniello y una de las vistas más hermosas del golfo.","rac":"La Certosa di San Martino se alza sobre la colina de Vomero, junto al Castillo de Sant'Elmo. Fue fundada en 1325 por Carlos de Calabria, hijo del rey Roberto de Anjou, y confiada a Tino di Camaino. Entre los siglos XVI y XVIII, se convirtió en uno de los mejores ejemplos del arte barroco italiano: de 1623 a 1656, Cosimo Fanzago restauró su interior. Desde 1866, tras la supresión de las órdenes religiosas, alberga el Museo Nacional de San Martino, encargado por Giuseppe Fiorelli.\n\nEl Gran Claustro, ampliado en 1581 por Giovanni Antonio Dosio y completado por Fanzago, tiene en su centro el cementerio de los monjes. El museo alberga la principal colección pública italiana dedicada al belén napolitano, incluyendo el grandioso Belén de Cuciniello: aproximadamente ochocientos pastores, animales y accesorios donados por el coleccionista Michele Cuciniello, inaugurado en 1879. Otras secciones narran la historia de la armada, el teatro, la ciudad y el Reino a través de imágenes, y, desde diciembre de 2025, la Nápoles del siglo XIX. La Mesa Strozzi, considerada la primera pintura de Nápoles, también se encuentra aquí.","con":"Salga a las terrazas y a la Logia del Prior: desde aquí podrá contemplar todo el golfo. Está abierta todos los días excepto los martes; la última entrada es a las 17:30.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"El gran claustro de la Certosa di San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"El gran claustro de la Certosa di San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Cerrado los martes. Algunas secciones (naval, belén, Nápoles del siglo XIX) abren a las 9:30; los jardines cierran una hora antes."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"El Gran Claustro","x":"Ampliada en 1581 por Giovanni Antonio Dosio y completada por Cosimo Fanzago, tiene en su centro el cementerio de los monjes. A lo largo del perímetro, aún se pueden ver las puertas y trampillas de las celdas de los cartujos.","d":"En el corazón de la Certosa","foto":{"u":"../img/e43efae68626.jpg","alt":"El Gran Claustro de la Certosa con el cementerio de los monjes.","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"El Gran Claustro de la Certosa di San Martino, con el pequeño cementerio de los monjes en el centro."}},{"t":"El belén de Cuciniello","x":"Con aproximadamente ochocientas piezas, es el belén más famoso de Nápoles. Fue donado por Michele Cuciniello e inaugurado en 1879. Un sistema de iluminación simula las horas del día.","d":"En la sección del belén, donde estaban las cocinas","foto":{"u":"../img/ae5327fcce50.jpg","alt":"El gran belén con cientos de figuras","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"El Belén de Cuciniello, con aproximadamente ochocientas piezas."}},{"t":"La vista del golfo","x":"Desde las terrazas y jardines de la Certosa se puede contemplar todo el Golfo de Nápoles, con el Vesubio al fondo.","d":"En las terrazas y en los jardines","foto":{"u":"../img/81d0fb825e80.jpg","alt":"El Golfo de Nápoles visto desde un balcón del Hotel Certosa.","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"El golfo y el Vesubio desde un balcón de la Certosa di San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castillo de Sant'Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La fortaleza en forma de estrella en la colina de Vomero: bastiones con vistas de 360° a Nápoles y al golfo, y en su interior el Museo Novecento.","rac":"El Castillo de Sant'Elmo domina el barrio de Vomero, a unos 250 metros sobre el nivel del mar, y es visible desde casi toda la ciudad. Los primeros registros datan de alrededor de 1275, cuando se trataba de una residencia fortificada angevina llamada Belforte. En 1329, Roberto de Anjou encargó su ampliación, obra que fue confiada a Tino di Camaino. Su planta en forma de estrella de seis puntas es el resultado de la reconstrucción del siglo XVI, encargada entre 1537 y 1547 por el virrey Pedro de Toledo, según un diseño del arquitecto militar Pedro Luis Escrivà.\n\nA lo largo de los siglos, se utilizó con frecuencia como prisión: allí estuvo encarcelado Tommaso Campanella, así como patriotas de la República Napolitana de 1799, como Gennaro Serra, Mario Pagano y Luisa Sanfelice. Tras servir como guarnición borbónica, funcionó como prisión militar hasta 1952; en 1976 comenzaron importantes obras de restauración.\n\nDesde 2010, el Museo Novecento a Napoli se ubica en la plaza de armas: alberga más de 170 obras de aproximadamente 90 artistas napolitanos o que estuvieron activos en la ciudad entre 1910 y 1980. Algunas obras fueron creadas específicamente para el castillo: Gian Maria Tosatti creó un campo de trigo en la gran cisterna, y la escultura de aluminio \"Sant'Elmo\" de Mimmo Paladino destaca en las almenas.\n\nDesde las murallas, la vista abarca desde las islas hasta el Vesubio, desde los Campos Flégreos hasta las montañas Matese.","con":"Sube al atardecer para disfrutar de las vistas. El castillo está junto a la Certosa di San Martino; ambos se pueden visitar la misma mañana. El castillo cierra los martes y, en caso de mal tiempo, puede permanecer cerrado.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Las altas paredes de toba del Castillo de Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Las murallas del Castillo de Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Castillo: 8:30 - 19:30; Museo Novecento: 9:30 - 18:30 (última entrada a las 17:30). Cerrado los martes. En caso de mal tiempo, el recinto podría permanecer cerrado."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"Los bastiones y el panorama","x":"Los bastiones ofrecen una panorámica de 360° de la ciudad, el golfo, el Vesubio y la costa de Posillipo, una de las más completas de Nápoles.","d":"En las gradas","foto":{"u":"../img/81edfbd30506.jpg","alt":"Nápoles y el Vesubio vistos desde lo alto del Castillo de Sant'Elmo.","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Desde las murallas del Castillo de Sant'Elmo: la ciudad, el puerto y el Vesubio."}},{"t":"El Museo Novecento en Nápoles","x":"Inaugurado en 2010 en la plaza de armas, alberga más de 170 obras de unos 90 artistas napolitanos o que desarrollaron su actividad en la ciudad, creadas a partir de 1910: desde el futurismo hasta la transvanguardia de los años 80.","d":"En la explanada del castillo","foto":{"u":"../img/d585126c2db4.jpg","alt":"Una sala del Museo Novecento con obras de arte.","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Una sala del Museo Novecento de Nápoles, dentro del Castel Sant'Elmo."}},{"t":"Un campo de trigo en la cisterna","x":"La obra «Mis sueños jamás se rendirán», de Gian Maria Tosatti (2014), representa un campo de trigo cultivado en la cisterna, el lugar más oscuro y profundo del castillo, que también era una prisión.","d":"En la gran cisterna","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"El primer paseo","sub":"Spaccanapoli en medio día, partiendo desde Ceraldi","desc":"El corazón del centro histórico en un recorrido circular: el Gesù Nuovo y su misterio, el claustro de Santa Chiara, el Cristo Velado, la Iglesia de la Calavera y las Orejas, las tiendas de Via San Biagio dei Librai. Y luego volvemos a nosotros.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista desde arriba: una calle recta que atraviesa el centro histórico.","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista desde arriba: la larga calle recta que atraviesa el centro histórico. El primer recorrido es a pie."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café en Ceraldi y nos vamos.","q":null,"alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","q":null,"alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,
