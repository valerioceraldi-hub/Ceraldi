n trece capítulos.","som":"Antes de marcharnos, veintiocho siglos en diez minutos: la leyenda de la sirena, los griegos, Roma, los reyes, la revuelta, la guerra y la ciudad de hoy.","txt":"Nápoles es una de las ciudades más antiguas de Europa: su historia abarca casi tres mil años, y el centro histórico que está a punto de recorrer aún conserva el trazado de calles diseñado por los griegos. Durante más de medio milenio, fue la capital del sur de Italia.\n\nEstos trece capítulos te llevan desde la leyenda hasta la ciudad actual. Cada vez que la historia llegue a una ubicación en la guía, encontrarás un botón para ir allí.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"El Castillo dell'Ovo visto desde 1841.","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"El Castel dell'Ovo visto desde 1841: el islote donde nació Partenope."},"cap":[{"p":"La leyenda","t":"La sirena Partenope","x":"Todo comienza con una sirena. En la mitología griega, las sirenas eran criaturas con cuerpo de pájaro y cabeza de mujer, maestras de un canto mágico. Una de ellas se llamaba Partenope.\n\nSegún la leyenda más famosa, cuando Ulises pasó junto a su roca sin ceder a su canto, las sirenas se arrojaron al mar, afligidas. Las olas llevaron el cuerpo de Partenope hasta la costa, en la desembocadura de un pequeño río, el Sebeto: precisamente donde se fundaría la ciudad.\n\nAllí se construyó una tumba, y los griegos de Nápoles le dedicaban sacrificios anuales y una carrera de antorchas. Aún hoy, los napolitanos se llaman a sí mismos \"partenopeicos\".","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"La fuente con la sirena Partenope en la Piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"La fuente de la Sirena en la Piazza Sannazaro: Partenope con la lira."}},{"p":"Siglos VIII-VII a. C.","t":"Partenope, la primera ciudad","x":"La leyenda tiene algo de verdad. Entre los siglos VIII y VII a. C., los griegos de Cumas, la colonia griega más antigua de la zona, fundaron un pequeño puerto en el mar y lo bautizaron con el nombre de la sirena: Partenope.\n\nSe ubicaba en la colina Pizzofalcone, en el monte Echia, sobre un promontorio rodeado por el mar, y su embarcadero se encontraba en el islote de Megaride, donde hoy se alza el Castel dell'Ovo. El puerto estaba situado donde hoy se encuentra la Piazza Municipio. La necrópolis de Partenope fue descubierta en 1949 en la Via Nicotera.\n\nLa pequeña ciudad creció tan rápidamente que Cumas, temiendo perder el mando, redujo su papel.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo junto al mar, con el cielo azul.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"El Castel dell'Ovo, situado en el islote de Megaride, está conectado al paseo marítimo por un puente."}},{"p":"Siglo V a. C.","t":"Neapolis, la nueva ciudad","x":"Junto a Partenope, un poco más al este, los cumanos fundaron una nueva ciudad: Neapolis, la \"ciudad nueva\". La UNESCO fecha su fundación alrededor del año 470 a. C., aproximadamente en la época en que los griegos derrotaron a los etruscos en el mar.\n\nNeapolis se construyó siguiendo un plano regular: tres calles principales paralelas (las \"plateiai\", posteriormente llamadas decumani), intersectadas en ángulo recto por calles más pequeñas. El ágora, la plaza principal, estaba ubicada donde hoy se encuentra la Piazza San Gaetano.\n\nEsa cuadrícula aún se conserva: Spaccanapoli, Via dei Tribunali y Via Anticaglia son las tres calles griegas. Al recorrerlas, uno camina a través del plano de la ciudad de hace 2500 años.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"Los grandes bloques de toba de las murallas griegas, excavados bajo el nivel de la calle.","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"Los bloques de toba de las murallas griegas de Neapolis, en la Piazza Bellini, son visibles en una excavación bajo el nivel de la calle."}},{"p":"326 a. C. – siglo V d. C.","t":"Griego bajo Roma","x":"En el año 326 a. C., Neapolis se alió con Roma y permaneció como ciudad griega dentro del mundo romano durante siglos: fue una de las pocas que conservó la lengua y la cultura griegas. Se convirtió en un destino predilecto para los romanos cultos y adinerados, quienes construyeron villas en el golfo; la de Lucio Licinio Lúculo se edificó en el islote de Megaride.\n\nEn el año 79 d. C., la erupción del Vesubio destruyó Pompeya y la cercana Herculano. En el año 476, Rómulo Augústulo, el último emperador romano de Occidente, fue encarcelado en la villa fortificada de Lúculo: con él, el Imperio llegó a su fin.\n\nEl agua ya fluía bajo la ciudad grecorromana desde las cisternas que hoy se pueden visitar en el Napoli Sotterranea, y el emperador Nerón actuaba en el teatro de Neapolis.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una gran cisterna subterránea excavada en la toba, tenuemente iluminada.","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una de las grandes cisternas excavadas en la toba volcánica se encuentra a unos 40 metros por debajo de la Via dei Tribunali."}},{"p":"Siglos VI-XII","t":"El Ducado de Nápoles","x":"Tras la caída del Imperio en el siglo VI, Nápoles pasó a manos de los bizantinos, los romanos de Oriente. Gradualmente se convirtió en un ducado casi independiente: en el siglo VIII, el duque Esteban II se convirtió en su señor de facto.\n\nDurante cinco siglos, el ducado resistió a los lombardos y sarracenos. En 1030, el duque Sergio IV cedió el condado de Aversa a un grupo de mercenarios normandos: esto marcó el inicio de su auge en el sur. En 1137, Nápoles se sometió a los normandos y pasó a formar parte del nuevo Reino de Sicilia.\n\nDe aquellos años lejanos se conservan las iglesias más antiguas, como Santa Restituta y el baptisterio de San Giovanni in Fonte, situado dentro de la catedral, considerado el más antiguo de Occidente.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"El interior de la Basílica de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, la basílica paleocristiana incorporada a la Catedral: Nápoles antes del Ducado."}},{"p":"1194–1266","t":"Normandos y suabos: nace la Universidad","x":"Tras los normandos llegaron los suabos. En 1194, el emperador Enrique VI ocupó la ciudad y derribó sus murallas.\n\nSu hijo, Federico II, fue un gobernante apasionado por la cultura y el derecho. En 1224, fundó el \"Estudio\" de Nápoles, una de las primeras universidades estatales de Europa: la actual Universidad Federico II, que aún lleva su nombre.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La estatua de Federico II de Suabia en la fachada del Palacio Real.","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La estatua de Federico II de Suabia, entre las que adornan la fachada del Palacio Real."}},{"p":"1266–1442","t":"Los angevinos: Nápoles como capital","x":"En 1266, el Papa confió el reino a Carlos I de Anjou, hermano del rey de Francia, quien entró triunfalmente en la ciudad. Tras la revuelta de las Vísperas Sicilianas de 1282, Sicilia se separó y Nápoles se convirtió en la capital del reino, posición que mantendría durante siglos.\n\nLos angevinos construyeron el Castel Nuovo, la catedral (desde 1294) y la ciudadela de Santa Chiara (desde 1310), y la ciudad se expandió. Giotto, Petrarca y Boccaccio se alojaron en la corte de Roberto de Anjou, en el Castel Nuovo.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"La entrada al claustro de Santa Clara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"La entrada al claustro de mayólica de Santa Chiara."}},{"p":"1442–1503","t":"Los aragoneses","x":"En 1442, Alfonso de Aragón conquistó Nápoles: según la tradición, sus hombres entraron en la ciudad a través de un acueducto. Hizo del Castel Nuovo su palacio, lo reconstruyó y, para celebrar la victoria, añadió el gran Arco del Triunfo entre dos torres.\n\nLos aragoneses transformaron el castillo medieval en una fortaleza moderna y renovaron las defensas y las calles de la ciudad. Su hijo Ferrante derrotó a los barones rebeldes: la puerta de bronce del castillo narra aquella guerra, y su venganza se consumó en el Salón de los Barones.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Mesa de los Strozzi: Nápoles aragonesa vista desde el mar, con el Maschio Angioino y el Castel Sant'Elmo.","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Mesa Strozzi (siglo XV): Nápoles vista desde el mar, con el puerto, el Castel Nuovo y, arriba, la colina de Sant'Elmo."}},{"p":"1503–1707","t":"El virreinato español","x":"En 1503, Nápoles pasó a formar parte de España y fue gobernada por un virrey. Aunque no había rey, seguía siendo una capital imperial, con una de las cortes más grandiosas de los dominios españoles. El virrey Don Pedro de Toledo duplicó el tamaño de la ciudad, inauguró la Vía Toledo y construyó los cuarteles de los soldados, el Barrio Español. El Palacio Real también se construyó durante estos años.\n\nEn 1606, Caravaggio llegó a Nápoles huyendo de Roma: su pintura transformó el arte de la ciudad, que en el siglo XVII se convirtió en una de las capitales del Barroco europeo.\n\nFueron también años muy duros: impuestos muy elevados, la erupción del Vesubio en 1631 y, en 1656, una plaga que mató a más de la mitad de los habitantes.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello durante la peste de 1656: cuerpos apilados en la plaza y figuras celestiales en el cielo.","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello durante la peste de 1656, pintado por Micco Spadaro: la plaza está llena de muertos y moribundos."}},{"p":"1647","t":"Masaniello","x":"El 7 de julio de 1647, tras otro impuesto, esta vez sobre la fruta, alimento de los más pobres, un pescador de 27 años, Masaniello, lideró al pueblo en una revuelta gritando \"¡Viva el Rey de España, abajo el mal gobierno!\".\n\nEn diez días, los españoles tuvieron que ceder ante las demandas del pueblo. Pero Masaniello, acusado de locura y traicionado por un sector de los propios rebeldes, fue asesinado. La revuelta contra España se prolongó durante meses antes de ser sofocada en 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"Un cuadro del siglo XVII que representa a una multitud amotinada en la Piazza Mercato.","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Plaza del Mercado durante la revuelta de Masaniello, cuadro de Domenico Gargiulo conocido como Micco Spadaro."}},{"p":"1734–1799","t":"Los Borbones y la República","x":"En 1734, Carlos de Borbón trajo a Nápoles un rey de su propia estirpe y se propuso convertirla en una gran capital europea. En 1737, construyó el Teatro de San Carlos en tan solo siete meses, seguido de los palacios reales de Portici y Capodimonte. Las excavaciones de Herculano y Pompeya también comenzaron en esos años.\n\nNápoles fue una de las capitales de la Ilustración. En enero de 1799, con la llegada del ejército francés, los patriotas proclamaron la República Napolitana, que duró tan solo hasta junio. Tras el regreso de los Borbones, muchos de sus protagonistas fueron ejecutados.\n\nTras los años de dominio francés (José Bonaparte y Joaquín Murat), los Borbones regresaron en 1815, y en 1816 nació el Reino de las Dos Sicilias.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Retrato de Carlos de Borbón con armadura","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Carlos de Borbón, retratado por Anton Raphael Mengs."}},{"p":"1860–1945","t":"Italia unificada y la guerra","x":"El 7 de septiembre de 1860, Giuseppe Garibaldi entró en Nápoles entre vítores; un plebiscito ratificó la unión con el Reino de Italia. Nápoles dejó de ser capital, y la pérdida fue considerable.\n\nDurante la Segunda Guerra Mundial, la ciudad sufrió más de 120 bombardeos aéreos, principalmente debido a su puerto; la población se refugió en cisternas subterráneas. Tras el armisticio, los alemanes ocuparon la ciudad. A finales de septiembre de 1943, los napolitanos se sublevaron: en los \"Cuatro Días de Nápoles\", el pueblo obligó a la guarnición alemana a rendirse. El 1 de octubre llegaron los Aliados.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Un grabado antiguo: Garibaldi aclamado por la multitud en Nápoles.","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Grabado antiguo de la entrada de Garibaldi en Nápoles en 1860: la multitud lo aclama en la Via Toledo."}},{"p":"Desde 1945 hasta hoy","t":"Nápoles hoy","x":"Tras la guerra, la ciudad fue reconstruida a pesar de las grandes dificultades. En 1995, el centro histórico fue declarado Patrimonio de la Humanidad por la UNESCO: es el más grande de Italia y uno de los más grandes de Europa.\n\nDesde 2001, el metro ha inaugurado sus \"estaciones de arte\", que exhiben obras de artistas contemporáneos. La ciudad tiene aproximadamente 950.000 habitantes, más de tres millones si se incluye el área metropolitana.\n\nY luego está la Nápoles que descubrirás al pasear: los murales, como el de Maradona en el Barrio Español, y la Virgen de Banksy, la vida en las callejuelas, los cafés. Tres mil años de historia, uno tras otro, en apenas unos kilómetros.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"El centro histórico de Nápoles visto desde arriba","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"El centro histórico visto desde arriba: Patrimonio de la Humanidad de la UNESCO desde 1995."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravaggio en Nápoles","sub":"Un pintor a la fuga y tres obras maestras para ver.","som":"Huyendo de Roma, Caravaggio encontró refugio en Nápoles en dos ocasiones. Allí pintó Las siete obras de misericordia, La flagelación y su último cuadro.","txt":"Michelangelo Merisi, conocido como Caravaggio, fue un pintor famoso y controvertido en Roma. A finales de mayo de 1606, hirió mortalmente a Ranuccio Tomassoni en una pelea que estalló durante un partido de raqueta. Fue condenado y obligado a huir.\n\nNápoles, por entonces una de las ciudades más grandes de Europa, fue su refugio en dos ocasiones: desde el otoño de 1606 hasta el verano de 1607, y luego desde el otoño de 1609 hasta el verano de 1610. Allí encontró la protección de la familia Colonna y de ricos mecenas, y allí su pintura cambió para siempre el arte de la ciudad.\n\nTres de sus obras pueden verse hoy en Nápoles, dos de las cuales están en nuestra ruta.","foto":{"u":"../img/da8045021e55.jpg","alt":"Las siete obras de misericordia de Caravaggio","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Las siete obras de misericordia, pintadas por Caravaggio en Nápoles."},"cap":[{"p":"1606–1607","t":"La primera estancia y las Siete Obras","x":"El primer encargo napolitano documentado data de octubre de 1606. Unos meses más tarde, el 9 de enero de 1607, Caravaggio entregó el gran lienzo de Las siete obras de misericordia al Pio Monte della Misericordia, por el que recibió 400 ducados.\n\nTodavía se encuentra allí, en el altar para el que fue pintada, en Via dei Tribunali: una noche en un callejón de Nápoles, donde los hombres se ayudan mutuamente bajo la mirada de la Virgen.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Las siete obras de misericordia de Caravaggio: Escenas callejeras en una noche oscura.","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Las Siete Obras de Misericordia de Caravaggio (1607): la escena completa, con las personas en la parte inferior y la Virgen con el Niño en la parte superior."}},{"p":"1607","t":"La flagelación","x":"Para la familia de Franchis, juristas y magistrados, Caravaggio pintó La Flagelación de Cristo en 1607, para su capilla en la iglesia de San Domenico Maggiore: un lienzo de casi tres metros de altura, una de las obras maestras del barroco napolitano.\n\nActualmente, el original se encuentra en el Museo de Capodimonte, adonde fue trasladado por motivos de seguridad; una copia permanece en San Domenico Maggiore. Capodimonte queda fuera de nuestros recorridos a pie.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La flagelación de Cristo de Caravaggio: Jesús atado a la columna entre los verdugos.","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagelación de Cristo (1607), que se encuentra actualmente en el Museo de Capodimonte: la luz incide sobre el cuerpo de Jesús, atado a la columna."}},{"p":"1607–1609","t":"Malta y Sicilia","x":"Entre el 12 y el 13 de julio de 1607, Caravaggio llegó a Malta, probablemente a bordo de una galera de la Orden de los Caballeros que zarpaba de Nápoles. Pero allí también tuvo problemas: tras una pelea, fue arrestado en agosto de 1608, escapó del fuerte donde estaba retenido y se refugió en Siracusa, Sicilia.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"La decapitación de San Juan Bautista, de Caravaggio.","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"La decapitación de San Juan Bautista, pintada por Caravaggio en Malta y conservada en La Valeta."}},{"p":"Octubre de 1609","t":"La emboscada de Cerriglio","x":"En el otoño de 1609 regresó a Nápoles, todavía bajo la protección de la familia Colonna, con la esperanza de obtener el perdón del Papa para poder regresar a Roma.\n\nEn octubre fue atacado por cuatro hombres frente a la taberna Cerriglio, una famosa posada de la época, y resultó desfigurado de la cara: la herida fue tan grave que la noticia de su muerte se extendió por Roma.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Retrato de Caravaggio dibujado con tiza.","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravaggio en el retrato de Ottavio Leoni, el rostro del hombre atacado en Cerriglio."}},{"p":"1610","t":"El último cuadro","x":"En la primavera de 1610, pintó el Martirio de Santa Úrsula para el príncipe genovés Marcantonio Doria: el lienzo se terminó en mayo, se entregó aún fresco con el barniz y se envió a Génova. Es la última pintura de Caravaggio que conocemos y actualmente se exhibe en las Galerías de Italia en Via Toledo, a seis minutos de Ceraldi. Entre los rostros que aparecen detrás de la santa se encuentra el suyo propio.\n\nEse verano, zarpó hacia Roma con algunos cuadros, con la esperanza de obtener el perdón. Fue arrestado por error en Palo, y el barco partió con las pinturas. Murió en Porto Ercole el 18 de julio de 1610 (o quizás al día siguiente), a la edad de 38 años.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"El martirio de Santa Úrsula de Caravaggio: la santa y el rey en el momento de la flecha.","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"El martirio de Santa Úrsula (1610): el rey hiere a la santa con una flecha a corta distancia."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Nápoles en cinco minutos: De la Sirena a la Ciudad Nueva","sub":"","som":"Primero Partenope, luego Neapolis: porque el centro histórico todavía está diseñado como una ciudad griega.","txt":"Nápoles fue fundada dos veces. La primera vez se llamó Partenope, como la mítica sirena: fue fundada en el siglo VII a. C. por colonos de origen griego procedentes de Cumas, que desembarcaron en el islote de Megaride, donde hoy se encuentra el Castel dell'Ovo, y se establecieron en el cercano monte Echia.\n\nLa segunda vez, alrededor del año 470 a. C., surgió una nueva ciudad junto a la antigua: Neapolis, que significa \"ciudad nueva\" en griego. Es la que usted está atravesando ahora. Sus calles forman una cuadrícula regular que, después de veinticinco siglos, aún se conserva: el centro histórico de Nápoles es Patrimonio de la Humanidad de la UNESCO precisamente porque el diseño de la ciudad griega se ha mantenido como su eje central.\n\nTres calles paralelas, los decumanos, atraviesan la ciudad de oeste a este. La más baja es Spaccanapoli: de unos dos kilómetros de longitud, tan recta que, vista desde arriba, parece dividir la ciudad en dos, de ahí su nombre. En el centro discurre Via dei Tribunali, el decumano principal; más arriba se encuentran Via dell'Anticaglia y Via della Sapienza, el decumano superior.\n\nDesde Piazza Carità, donde estamos desde 2002, comienza a pocos minutos a pie Spaccanapoli, en Piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"El centro histórico de Nápoles visto desde arriba","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"El centro histórico visto desde arriba: las calles rectas siguen siendo las de la ciudad griega."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro y la sangre derretida","sub":"","som":"Tres veces al año, Nápoles contiene la respiración ante un frasco. ¿Qué sucede, dónde y qué dicen la Iglesia y la ciencia al respecto?","txt":"En la Catedral de Nápoles, en un nicho de la Capilla del Tesoro, se guarda un frasco con una sustancia oscura que, según la tradición, es la sangre de San Genaro, el santo patrón de la ciudad. Tres veces al año —el sábado anterior al primer domingo de mayo, el 19 de septiembre (día de su festividad) y el 16 de diciembre— se muestra el frasco a los fieles: si su contenido, generalmente sólido, se disuelve, es motivo de celebración; si permanece sólido, para muchos napolitanos, es un mal presagio.\n\nEl primer registro conocido de la licuefacción data de 1389. Las reliquias no están custodiadas por el clero, sino por la Diputación de la Capilla del Tesoro de San Gennaro, una institución secular fundada en 1601, de la que también forma parte el alcalde de Nápoles.\n\nLa Iglesia mantiene una postura cautelosa: habla de un «acontecimiento milagroso», permite la devoción popular, pero no la impone como verdad de fe. Entre las explicaciones propuestas por los escépticos se encuentra la tixotropía, la propiedad de ciertas sustancias que son sólidas en reposo y se vuelven líquidas al moverse o agitarse.\n\nLo sagrado y lo profano siempre han coexistido aquí: en Via Duomo, a pocos pasos de la catedral, el artista callejero Jorit pintó un San Gennaro con el rostro de un trabajador.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La cúpula de la Capilla del Tesoro de San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"La Capilla del Tesoro de San Gennaro en la Catedral, donde se guarda la ampolla."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Nápoles en siete tradiciones: Del Panaro al milagro de San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Las pobres almas: Cuando Nápoles adoptó una calavera","sub":"","som":"Osarios, capuzzelle y oraciones intercambiadas por números de lotería: el culto a los muertos sin nombre.","txt":"Durante siglos, en Nápoles, los muertos sin nombre no eran abandonados a su suerte. Se les llamaba anime pezzentelle: las pobres almas que morían sin funeral y sin que nadie rezara por ellas. El nombre está relacionado con «pezzente», el pobre, pero también con el latín «petere», pedir para recibir: quienes rezaban por ellas esperaban recibir protección y gracia a cambio.\n\nEl lugar simbólico es el cementerio Fontanelle, en el barrio de Sanità: una cantera de toba del siglo XVI que abarca aproximadamente cuatro mil metros cuadrados, que acogió a las víctimas de la peste de 1656 y luego a las del cólera en 1836-1837. En 1872, el canónigo Gaetano Barbati dispuso los huesos en tres naves. Los devotos \"adoptaban\" un cráneo, una capuzzella: lo limpiaban, lo colocaban en un pequeño santuario, lo adornaban con rosarios y monedas, y le rezaban, esperando una señal en un sueño, a veces un número de lotería. Algunos cráneos se hicieron famosos: el Capitán, con la cuenca del ojo ennegrecida, sujeto de una leyenda de matrimonio y celos; Donna Concetta, de quien se dice que \"suda\" cuando se le concede una gracia.\n\nEn 1969, un decreto del tribunal eclesiástico clausuró el osario y prohibió el culto. Cerrado por reformas desde 2020, el cementerio reabrió al público en 2026, gestionado por la cooperativa La Paranza.\n\nEl culto también pervive bajo Via dei Tribunali, en el hipogeo de Santa Maria delle Anime del Purgatorio ad Arco, la iglesia que los napolitanos llaman \"'e cape 'e morte\": allí se conserva el cráneo de Lucía, una joven muy querida. Y en Via San Biagio dei Librai, en la pequeña iglesia de Santa Luciella, hay un cráneo singular: el que tiene orejas.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Cráneos de las pobres almas","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Las capuzzelle de pobres almas."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Nápoles Esotérica: Un príncipe alquimista, una fachada codificada y un huevo mágico.","sub":"","som":"Raimondo di Sangro, el rusticado del Gesù Nuovo, el huevo de Virgilio, el munaciello: donde termina la historia y comienza la leyenda.","txt":"Nápoles adora los misterios, y algunos son realmente fascinantes. El más famoso tiene nombre: Raimondo di Sangro, príncipe de Sansevero, un hombre del siglo XVIII, Gran Maestre de la masonería napolitana, un celoso guardián de sus propios secretos. El mito lo rodeó incluso en vida, y él mismo lo alimentó. Benedetto Croce lo llamó la encarnación napolitana del Doctor Fausto. La leyenda negra le atribuye todo: sirvientes asesinados para estudiar sus cuerpos, incluso la ceguera del escultor del Cristo Velado para que no esculpiera otro. Son leyendas, y el propio museo las distingue de la historia documentada.\n\nEl Cristo Velado es obra de Giuseppe Sanmartino, por encargo del príncipe: el velo transparente que cubre el cuerpo está tallado en el mismo bloque de mármol que la estatua. En la cávea subterránea de la capilla se encuentran las \"máquinas anatómicas\", dos esqueletos con sistemas circulatorios reconstruidos, creados por el médico palermitano Giuseppe Salerno entre 1756 y 1764. Según la leyenda, su creación implicó misteriosas inyecciones y estudios con cera de abejas y tintes.\n\nNo muy lejos, la fachada del Gesù Nuovo, originalmente el palacio Sanseverino en 1470, está revestida con sillares piramidales de piedra piperno oscura. Algunas piedras presentan inscripciones: según la leyenda, un mensaje secreto; algunos estudiosos afirman que son las marcas de los canteros; en 2011, el historiador de arte Vincenzo De Pasquale propuso interpretarlas como notas musicales, una partitura de aproximadamente tres cuartos de hora titulada \"Enigma\". Una hipótesis tentadora, pero no una certeza.\n\nY luego está el mar: según la leyenda, el poeta Virgilio escondió el huevo de la sirena Partenope en las bodegas del Castel dell'Ovo. Mientras el huevo permanezca intacto, el castillo seguirá en pie.\n\nEn las casas, sin embargo, viven los espíritus de la tradición popular: el munaciello, un duende encapuchado que trae buena suerte o travesuras según cómo se le trate, y la bella 'mbriana, un espíritu bueno de la casa, que puede aparecer como una mariposa o un gecko.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La fachada puntiaguda en forma de diamante del Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"La sillería con punta de diamante del Gesù Nuovo, la \"fachada codificada\"."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Nápoles hoy: ¿qué hay de nuevo?","sub":"","som":"La plaza dedicada a Maradona, el arte callejero, el último Caravaggio en Via Toledo, las iglesias y osarios reabiertos: la ciudad está cambiando.","txt":"Quienes regresan a Nápoles después de algunos años encuentran una ciudad que ha aprendido a contar su historia.\n\nEn el Barrio Español, a nueve minutos de aquí, se encuentra Largo Maradona. El mural de Diego fue pintado en 1990 por Mario Filardi; con el paso de los años, se fue deteriorando hasta casi desaparecer, luego fue restaurado gracias a Salvatore Iodice, y en otoño de 2017, el argentino Francisco Bosoletti repintó el rostro. Tras la muerte de Maradona el 25 de noviembre de 2020, la plaza, antes conocida como la plaza de los artistas, se convirtió en un santuario laico de pequeños altares, banderas argentinas y fotografías, tan popular que la municipalidad tuvo que regular el tráfico peatonal.\n\nEl arte callejero ha llegado al centro histórico: en la Piazzetta dei Girolamini, protegida por un cristal, se alza la Virgen con una pistola de Banksy; en la Via Duomo, San Gennaro el Obrero de Jorit. La página web oficial de turismo de la ciudad les ha dedicado un itinerario específico.\n\nEn Via Toledo, a seis minutos de nosotros, la Galería de Italia alberga el Martirio de Santa Úrsula, el último lienzo de Caravaggio, junto con más de quinientos jarrones áticos y de la Magna Grecia.\n\nY lugares que habían permanecido cerrados durante mucho tiempo están reabriendo: la iglesia de Santa Luciella ai Librai, abandonada durante más de treinta años, reabrió sus puertas al público el 5 de abril de 2019; el cementerio Fontanelle reabrió en 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"El mural de Maradona en el Barrio Español","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, uno de los rostros de la Nápoles actual."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 1 /* ---------- copertina dell'itinerario: una mappa vera (stessi tasselli della guida, senza rete esterna) fotografata una volta,

var COPERTINE = {}, codaCopertine = [], copertinaInCorso = false, inCoda = {};

function preparaCopertine(){ document.querySelectorAll('.copertina-giro[data-giro]').forEach(function(el){ var i = IT[el.getAttribute('data-giro')]; if(!i) return;
  var w = Math.round(el.clientWidth); if(!w) return; var k = i.s + '@' + w;
  if(COPERTINE[k]) return mettiCopertina(el, COPERTINE[k], true);

  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var H = 220, box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-12000px;top:0;width:' + job.w + 'px;height:' + H + 'px';
    document.body.appendChild(box);
    var m = new maplibregl.Map({container: box, style: r[1], interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: {preserveDrawingBuffer: true}, preserveDrawingBuffer: true, center: [14.2532, 40.8475], zoom: 14});

    job.i.tappe.forEach(function(t){ var l = LU[t.l]; b.extend([l.lon, l.lat]); if(t.geo){ linee.push(t.geo); t.geo.forEach(function(c){ b.extend(c); }); } });

            k++;

            if(l.foto && libero){ conFoto.push([q.x, q.y]); pin.push({cl: '', x: x, y: y, h: '<img alt="" src="' + e(l.foto.u) + '"><b>' + k + '</b>'}); }

        }catch(x){}

var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */

  var ult = 0; Object.keys(tt).forEach(function(k){ if(tt[k] > 1 && tt[k] > ult) ult = tt[k]; });
  if(P && P.gap && ult && ora - ult < P.gap * 60000){ m.textContent = f(T.pass_attendi, {n: Math.ceil((P.gap * 60000 - (ora - ult)) / 60000)}); return; }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(pasNorm(inp.value))).then(function(b){
    var hex = Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    if(pasNorm(inp.value) && d.h.indexOf(hex) >= 0){ var t = pasTimbri(); t[id] = Date.now(); try{ localStorage.setItem('guida_passaporto', JSON.stringify(t)); }catch(x){} if(G) aggiornaCammino(); else mostra(); }
    else m.textContent = T.pass_no_risp;
  });
}
V.passaporto = function(){
  var p = D.passaporto; if(!p) return V.home();
  var t = pasTimbri(), n = pasConta(), h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div>' +

  var ts = Object.keys(t).map(function(k){ return t[k]; }).filter(function(v){ return v > 1; }), prima = ts.length ? Math.min.apply(null, ts) : 0, ancora = (p.dur && prima) ? Math.ceil((p.dur * 60000 - (Date.now() - prima)) / 60000) : 0;
  if(n >= p.min && ancora > 0) h += '<p class="piccolo">' + e(f(T.pass_durata, {n: ancora})) + '</p>';
  else if(n >= p.min && (p.pt || p.px)) h += '<section class="arrivo"><span class="etichetta" style="color:var(--su-scuro)">' + e(T.pass_premio) + '</span>' + (p.pt ? '<h2>' + e(p.pt) + '</h2>' : '') + (p.px ? '<p>' + e(p.px) + '</p>' : '') + '<p class="piccolo">' + e(T.pass_staff) + '</p></section>';
  else if(n < p.min) h += '<p class="piccolo">' + e(f(T.pass_mancano, {n: p.min - n})) + '</p>';
  h += '<ul style="list-style:none;padding:0;margin:0;display:grid;gap:8px">' + p.d.map(function(d){ var l = LU[d.l]; if(!l) return ''; return '<li><a class="btn sec" style="justify-content:flex-start" href="#/l/' + e(l.s) + '">' + (t[d.l] ? '✓ ' : '○ ') + e(l.n) + (t[d.l] > 1 ? ' · ' + new Date(t[d.l]).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '') + '</a></li>'; }).join('') + '</ul></div>';
  return h;
};
V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), inGiro = G && IT[G.s] && LU[IT[G.s].tappe[G.k].l] === l;
  var h = '<div class="stack vista"><div class="testa"><button class="indietro" onclick="' + (inGiro ? 'vai(\'#/c/' + G.s + '\')' : 'history.length > 1 ? history.back() : vai(\'#/\')') + '">← ' + e(T.indietro) + '</button>' + lingue() + '</div>';

  if(l.som || l.rac) h += '<button class="btn sec" onclick="ascolta(LU[' + l.id + '], this)">▶ ' + e(T.ascolta) + '</button>';
  if(l.dett && l.dett.length) h += '<div class="stack-s"><h3>' + e(T.cosa_guardare) + '</h3><p class="piccolo">' + e(f(T.cosa_guardare_sotto, {n: l.dett.length})) + '</p>' + l.dett.map(function(x, n){
      return '<article class="guarda' + (x.foto ? ' con-foto' : '') + '">' +
        (x.foto ? '<figure class="gf"><div class="ft"><img src="' + e(x.foto.u) + '" alt="' + e(x.foto.alt) + '" loading="lazy"></div>' +
          '<figcaption>' + (x.foto.dida ? '<span class="dida"><b>' + e(T.nella_foto) + '</b> ' + e(x.foto.dida) + '</span>' : '') + '<span class="cr">' + e(x.foto.aut) + ' · ' + e(x.foto.lic) + '</span></figcaption></figure>' : '') +
        '<div class="corpo"><div class="tit"><span class="n">' + (n + 1) + '</span><b>' + e(x.t) + '</b></div>' + (x.d ? '<span class="dove">◉ ' + e(x.d) + '</span>' : '') + '<div class="testo">' + par(x.x) + '</div></div></article>'; }).join('') + '</div>';
  if(l.rac) h += '<details class="apri"' + (l.dett && l.dett.length ? '' : ' open') + '><summary>' + e(T.storia) + '</summary><div class="testo">' + par(l.rac) + '</div></details>';
  if(l.leg) h += '<details class="apri"><summary>' + e(T.leggende) + '</summary><div class="testo">' + par(l.leg) + '</div></details>';
  h += assaggio(l.col, T.da_ceraldi_et) + daLeggere(l.col);
  if(l.con) h += '<details class="apri" open><summary>' + e(T.consiglio) + '</summary><div><p>' + e(l.con) + '</p></div></details>';
  var info = '';
  if(!l.sa && verificati(l, ora) && l.or.length){
    info += '<table class="orari">';
    for(var g = 1; g <= 7; g++){ var fs = fasce(l, ora.data, g), ap = fs.filter(function(o){ return !o.x && o.da; });
      var txt = fs.some(function(o){ return o.x; }) || !ap.length ? T.giorni_chiusura : ap.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      info += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>'; }
    info += '</table><p class="piccolo">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';

  var pr = [];

  if(l.gr === true) pr.push(e(T.gratuito)); else if(l.gr === false) pr.push(e(T.pagamento));
  if(l.mp) pr.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';

  if(l.fc) info += '<p>' + e({si: T.foto_si, no: T.foto_no, senza_flash: T.foto_senza_flash}[l.fc] || '') + '</p>';

  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
function lettura(r){ var n = (r.txt || '').length + r.cap.reduce(function(a, c){ return a + (c.x || '').length; }, 0); return Math.max(1, Math.round(n / 1100)); }

function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();

  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else if(p[0] === 'p') h = V.passaporto(); else h = V.home();
