,40.83396],[14.25062,40.83398],[14.25071,40.83405],[14.25073,40.83407],[14.25083,40.83415],[14.25083,40.83416],[14.25082,40.83418],[14.25047,40.83459],[14.25037,40.83469],[14.24976,40.83535],[14.24977,40.83536],[14.24979,40.83537],[14.24971,40.83546],[14.24967,40.83551],[14.24922,40.83608],[14.24876,40.83665],[14.24866,40.8366],[14.24865,40.83662],[14.24863,40.83665],[14.2486,40.83668],[14.24862,40.83671],[14.24864,40.83677],[14.24863,40.83681],[14.24859,40.83688],[14.24856,40.83689],[14.24855,40.83691],[14.24853,40.83695],[14.24855,40.83698],[14.24856,40.83703],[14.24835,40.83738],[14.24834,40.83739],[14.24834,40.8374],[14.24834,40.83741],[14.24833,40.83772],[14.24833,40.83774],[14.24833,40.83775],[14.24834,40.83807],[14.24837,40.83807],[14.24837,40.83813],[14.24837,40.83837],[14.24838,40.83849],[14.24838,40.8388],[14.24839,40.83896],[14.24839,40.83921],[14.24839,40.83925],[14.24841,40.83939],[14.24847,40.83974],[14.24853,40.84009],[14.24853,40.8401],[14.24857,40.84036],[14.24857,40.84039],[14.2486,40.8406],[14.24863,40.84084],[14.24867,40.84112],[14.24868,40.84115],[14.24871,40.84139],[14.24873,40.8415],[14.24873,40.84152],[14.24874,40.84155],[14.24874,40.84161],[14.24877,40.8418],[14.2488,40.84199],[14.24882,40.84216],[14.24883,40.8422],[14.24883,40.84224],[14.24884,40.84232],[14.24885,40.84235],[14.24886,40.84243],[14.24887,40.8425],[14.24887,40.84253],[14.24889,40.8427],[14.2489,40.84277],[14.24891,40.84281],[14.24894,40.84307],[14.24894,40.8431],[14.24899,40.84349],[14.249,40.84356],[14.24904,40.84393],[14.24904,40.84397],[14.24906,40.84407],[14.24908,40.84433]],"sv":[{"k":"parti","n":"Via Eldorado","d":120,"a":0},{"k":"gira","m":"slight right","n":"Pontile di Castel dell'Ovo","d":126,"a":120},{"k":"gira","m":"right","n":"Via Partenope","d":137,"a":246},{"k":"gira","m":"left","n":"","d":385,"a":383},{"k":"gira","m":"right","n":"","d":270,"a":768},{"k":"gira","m":"straight","n":"Piazza del Plebiscito","d":175,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Naples en cinq minutes : de la sirène à la ville nouvelle","som":"D'abord Partenope, puis Neapolis : car le centre historique est encore conçu comme une ville grecque.","txt":"Naples a été fondée deux fois. La première fois, elle s'appelait Partenope, comme la sirène mythique : elle fut fondée au VIIe siècle avant J.-C. par des colons d'origine grecque venus de Cumes, qui débarquèrent sur l'îlot de Megaride, où se dresse aujourd'hui le Castel dell'Ovo, et s'installèrent sur le mont Echia, tout proche.\n\nLa seconde fois, vers 470 av. J.-C., une nouvelle ville surgit à côté de l'ancienne : Neapolis, qui signifie « ville nouvelle » en grec. C'est celle que vous traversez actuellement. Ses rues forment un quadrillage régulier qui, après vingt-cinq siècles, reste parfaitement lisible : le centre historique de Naples est inscrit au patrimoine mondial de l'UNESCO précisément parce que l'organisation de la ville grecque en est restée l'élément central.\n\nTrois rues parallèles, les decumani, traversent la ville d'ouest en est. La plus basse est Spaccanapoli : longue d'environ deux kilomètres, elle est si rectiligne que, vue d'en haut, elle semble la couper en deux, d'où son nom. Au centre se trouve la Via dei Tribunali, le decumanus principal ; plus haut se trouvent la Via dell'Anticaglia et la Via della Sapienza, le decumanus supérieur.\n\nDe Piazza Carità, où nous sommes présents depuis 2002, commence Spaccanapoli à quelques minutes à pied, sur la Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro et le sang fondant","som":"Trois fois par an, Naples retient son souffle devant une fiole. Que se passe-t-il ? Où ? Et que disent l’Église et la science à ce sujet ?","txt":"Dans la cathédrale de Naples, dans une niche de la chapelle du Trésor, est conservée une fiole contenant une substance sombre, que la tradition considère comme le sang de saint Gennaro, saint patron de la ville. Trois fois par an – le samedi précédant le premier dimanche de mai, le 19 septembre (jour de sa fête) et le 16 décembre – la fiole est montrée aux fidèles : si son contenu, généralement solide, se dissout, c’est un signe de réjouissance ; s’il reste solide, pour de nombreux Napolitains, c’est un mauvais présage.\n\nLa première trace connue de la liquéfaction remonte à 1389. Les reliques ne sont pas gardées par le clergé mais par la Députation de la Chapelle du Trésor de San Gennaro, une institution laïque fondée en 1601, qui comprend également le maire de Naples.\n\nL'Église adopte une position prudente : elle parle d'un « événement miraculeux », autorise la dévotion populaire, mais ne l'impose pas comme vérité de foi. Parmi les explications avancées par les sceptiques figure la thixotropie, propriété de certaines substances solides au repos qui deviennent liquides lorsqu'elles sont agitées.\n\nLe sacré et le profane ont toujours coexisté ici : Via Duomo, à quelques pas de la cathédrale, l'artiste de rue Jorit a peint un San Gennaro avec le visage d'un ouvrier.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Les Pauvres Âmes : Quand Naples a adopté un crâne","som":"Ossuaires, capuzzelle et prières échangées contre des numéros de loterie : le culte des morts sans nom.","txt":"Pendant des siècles, à Naples, les morts anonymes n'ont pas été laissés à l'abandon. On les appelait « anime pezzentelle » : les pauvres âmes décédées sans funérailles et sans que personne ne prie pour elles. Ce nom est lié à « pezzente », le pauvre, mais aussi au latin « petere », demander pour recevoir : ceux qui priaient pour eux espéraient recevoir en retour protection et grâce.\n\nLe lieu symbolique est le cimetière Fontanelle, dans le quartier de Sanità : une ancienne carrière de tuf du XVIe siècle d’environ quatre mille mètres carrés, qui accueillit les victimes de la peste de 1656 puis celles du choléra en 1836-1837. En 1872, le chanoine Gaetano Barbati disposa les ossements dans trois nefs. Les fidèles « adoptaient » un crâne, une capuzzella : ils le nettoyaient, le plaçaient dans un petit reliquaire, l’ornaient de chapelets et de pièces de monnaie, et priaient devant lui, attendant un signe en rêve, parfois un numéro de loterie. Certains crânes devinrent célèbres : le Capitaine, à l’orbite noircie, sujet d’une légende de mariage et de jalousie ; Donna Concetta, qui, dit-on, « transpire » lorsqu’une grâce est accordée.\n\nEn 1969, un décret du tribunal ecclésiastique a fermé l'ossuaire et interdit le culte. Fermé pour rénovation depuis 2020, le cimetière a rouvert ses portes au public en 2026, géré par la coopérative La Paranza.\n\nLe culte perdure également sous la Via dei Tribunali, dans l'hypogée de Santa Maria delle Anime del Purgatorio ad Arco, l'église que les Napolitains appellent « e cape 'e morte » : on y conserve le crâne de Lucia, une jeune âme particulièrement vénérée. Et sur la Via San Biagio dei Librai, dans la petite église de Santa Luciella, se trouve un crâne unique : celui qui possède des oreilles.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Naples ésotérique : un prince alchimiste, une façade codée et un œuf magique","som":"Raimondo di Sangro, le vestige du Gesù Nuovo, l'œuf de Virgile, le munaciello : là où l'histoire s'arrête et où la légende commence.","txt":"Naples adore les mystères, et certains sont particulièrement fascinants. Le plus célèbre porte un nom : Raimondo di Sangro, prince de Sansevero, homme du XVIIIe siècle, grand maître de la franc-maçonnerie napolitaine, était un inventeur jaloux de ses propres secrets. Le mythe l’entourait déjà de son vivant, et il l’alimentait lui-même. Benedetto Croce le qualifiait d’incarnation napolitaine du Docteur Faust. La légende noire lui attribue tous les crimes : des serviteurs assassinés pour étudier leurs corps, et même l’aveuglement du sculpteur du Christ voilé pour l’empêcher d’en sculpter un autre. Ce ne sont que des légendes, et le musée lui-même les distingue de l’histoire officielle.\n\nLe Christ voilé est l'œuvre de Giuseppe Sanmartino, commandée par le prince : le voile transparent qui recouvre le corps est taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine de la chapelle se trouvent les « machines anatomiques », deux squelettes aux systèmes circulatoires reconstitués, créés par le médecin palermitain Giuseppe Salerno entre 1756 et 1764 environ. La légende raconte qu'ils impliquèrent de mystérieuses injections et des études sur la cire d'abeille et les colorants.\n\nNon loin de là, la façade du Gesù Nuovo, ancien palais Sanseverino datant de 1470, est revêtue d'un parement pyramidal de pierre de Piperno sombre. Certaines pierres portent des inscriptions gravées : la légende veut qu'il s'agisse d'un message secret ; certains érudits y voient les marques des tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique, une partition d'environ trois quarts d'heure intitulée « Énigme ». Une hypothèse séduisante, mais non une certitude.\n\nEt puis il y a la mer : selon la légende, le poète Virgile aurait caché l’œuf de la sirène Partenope dans les caves du Castel dell’Ovo. Tant que l’œuf restera intact, le château restera debout.\n\nDans les maisons, cependant, vivent les esprits de la tradition populaire : le munaciello, un elfe à capuche qui porte chance ou malice selon la façon dont on le traite, et la bella 'mbriana, un bon esprit de la maison, qui peut apparaître sous la forme d'un papillon ou d'un gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples aujourd'hui : quoi de neuf ?","som":"La place dédiée à Maradona, le street art, le dernier Caravage sur la Via Toledo, les églises et les ossuaires rouverts : une ville en pleine mutation.","txt":"Ceux qui retournent à Naples après quelques années découvrent une ville qui a appris à raconter son histoire.\n\nDans le Quartier espagnol, à neuf minutes d'ici, se trouve Largo Maradona. La fresque de Diego Maradona, peinte en 1990 par Mario Filardi, s'est estompée au fil des ans, jusqu'à presque disparaître. Elle a ensuite été restaurée grâce à Salvatore Iodice, puis, à l'automne 2017, l'Argentin Francisco Bosoletti a repeint son visage. Après la mort de Maradona, le 25 novembre 2020, la place, autrefois appelée place des artistes, est devenue un lieu de recueillement laïque, orné de petits autels, de drapeaux argentins et de photographies, si populaire que la municipalité a dû réguler la circulation des piétons.\n\nLe street art a investi le centre historique : sur la Piazzetta dei Girolamini, protégée par une vitre, se dresse la Madone au pistolet de Banksy ; sur la Via Duomo, le San Gennaro le Travailleur de Jorit. Le site web officiel du tourisme de la ville leur consacre un itinéraire.\n\nSur la Via Toledo, à six minutes d'ici, les Gallerie d'Italia abritent le Martyre de sainte Ursule, la dernière toile du Caravage, ainsi que plus de cinq cents vases attiques et de Grande-Grèce.\n\nEt des lieux fermés depuis longtemps rouvrent leurs portes : l’église Santa Luciella ai Librai, abandonnée depuis plus de trente ans, a rouvert au public le 5 avril 2019 ; le cimetière Fontanelle a rouvert en 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni function lineeCammino(i){ return i.tappe.map(function(tp, n){ return tp.geo ? {c: tp.geo, s: n < G.k ? 'fatto' : n === G.k ? 'ora' : 'poi'} : null; }).filter(Boolean); }

function aggiornaCammino(){
  if(!G || location.hash.indexOf('#/c/') !== 0) return;

      '<div class="due"><a class="btn sec" href="#/l/' + e(l.s) + '">' + e(T.apri_scheda) + '</a><button class="btn sec" id="c-qui" onclick="G.arrivato=true;aggiornaCammino()">' + e(T.sono_qui) + '</button></div></section>';

function prosegui(){ var i = IT[G.s]; if(G.k < i.tappe.length - 1){ G.k++; G.arrivato = false; G.vicino = 0; G.lungo = 0; salvaGiro(); marcaIo = null; disegnaCammino(); aggiornaCammino(); window.scrollTo(0, 0); } }
function esciGiro(){ try{ localStorage.removeItem('guida_giro'); }catch(x){} fermaPosizione(); var s = G && G.s; G = null; vai(s ? '#/i/' + s : '#/'); }

V.racconto = function(s){

function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
