media.org/wiki/File:Napoli_San_Lorenzo_Maggiore_BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, surplombant la Piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"L'horaire est indiqué sur le site web du ministère de la Culture et dans les sources touristiques ; le site web officiel était illisible : veuillez vérifier avant d'affirmer quoi que ce soit avec certitude."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"Le marché sous l'église","x":"Les fouilles révèlent le macellum de la Neapolis gréco-romaine, le marché qui s'étendait le long de l'ancien decumanus major. Il se situe à une dizaine de mètres sous l'église. En déambulant parmi les vestiges, on peut reconnaître la rue et les salles où se vendaient et s'échangeaient les marchandises : c'est un fragment de la cité antique encore intact, sur lequel Naples a continué de se développer.","d":"Sous la nef, dans les fouilles","foto":{"u":"../img/ab890c42a731.jpg","alt":"Une voie romaine dans les fouilles sous San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Les fouilles sous San Lorenzo Maggiore : la rue et les boutiques de la ville antique."}},{"t":"Le maître-autel de Giovanni da Nola","x":"Le maître-autel est une œuvre de la Renaissance du sculpteur napolitain Giovanni da Nola, et compte parmi les plus belles de Naples. L'abside qui l'abrite est la partie la plus ancienne de l'église.","d":"Au fond de l'église, dans l'abside","foto":null},{"t":"Le musée de l'Opéra","x":"Le musée occupe l'ancien couvent et la tour civique jouxtant la basilique. Il présente du mobilier, des costumes et des collections, retraçant l'histoire de Naples de l'Antiquité au XIXe siècle.","d":"Dans le couvent, à côté de la basilique","foto":{"u":"../img/591ff764e679.jpg","alt":"Une salle du musée du complexe San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Les salles du couvent de San Lorenzo Maggiore qui abritent le musée de l'Opéra."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, l'église de la capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"L'église de la capuzzelle : sous le sol, l'hypogée où Naples priait pour les âmes anonymes. Et le crâne de Lucie.","rac":"Les Napolitains l'appellent « 'e cape 'e morte », l'église des têtes de mort. C'est une petite église du XVIIe siècle, située sur le decumanus principal, liée à la dévotion aux âmes du Purgatoire, répandue par la Contre-Réforme. Un escalier raide mène à l'hypogée, l'église souterraine, agrandie et ornée de majolique au XVIIIe siècle : c'est là que les fidèles prenaient soin des dépouilles anonymes et imploraient leur intercession. Au bout d'un petit couloir, on conserve le crâne de Lucia, une jeune âme particulièrement vénérée.","con":"Derrière l'autel, cherchez le crâne ailé en marbre de Dionisio Lazzari : c'est le symbole de l'église.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La façade du Purgatorio ad Arco sur la Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La façade du Purgatorio ad Arco, sur le decumanus principal."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Église haute, hypogée et musée. Visites guidées incluses dans le prix du billet, réservation obligatoire."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Haute église, hypogée et musée."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Les peintures du XVIIe siècle","x":"Avant de descendre, prenez le temps d'admirer l'église qui se dresse au-dessus de vous. Elle fut commandée en 1616 par la congrégation laïque « Opera Pia Purgatorio ad Arco » à l'architecte Giovan Cola di Franco et consacrée en 1638.\n\nElle fut conçue sur deux niveaux : l’église supérieure, représentant le monde terrestre, et le cimetière souterrain, symbolisant concrètement le Purgatoire. L’ensemble du décor rappelle aux visiteurs que les âmes attendent une prière pour accéder au Ciel.\n\nOn y trouve de précieux marbres et des tableaux de trois grands maîtres de l'art napolitain du XVIIe siècle : Massimo Stanzione, Luca Giordano et Andrea Vaccaro. La sacristie et l'oratoire abritent également un petit musée présentant de l'argenterie, des vêtements liturgiques, des manuscrits et des peintures réalisés pour la congrégation entre le XVIIe et le XIXe siècle.","d":"Dans l'église haute","foto":{"u":"../img/a8b34654121a.jpg","alt":"Un tombeau en marbre du XVIIe siècle dans l'église haute","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"Dans l'église haute : le tombeau de Pietro Antonio Mastrilli (1607), parmi les marbres et les peintures du XVIIe siècle."}},{"t":"Le crâne ailé","x":"Parmi les marbres de l'église haute se trouve le célèbre crâne ailé de Dionisio Lazzari : un crâne orné d'ailes qui capture l'esprit du lieu. Ici, la mort n'est pas effrayante : elle devient une occasion de prière et de communion avec ceux qui nous ont quittés.\n\nCe n'est pas un hasard si les Napolitains appellent cette église « 'e cape 'e morte », celle aux crânes.\n\nLe message était clair : dans l'Église née de la Contre-Réforme, tout était destiné à rappeler aux passants et aux fidèles que les âmes du Purgatoire attendaient une prière pour monter au Ciel.","d":"Dans l'église haute","foto":{"u":"../img/63d1e885c193.jpg","alt":"Un bas-relief en marbre représentant un crâne ailé et couronné","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"Le crâne ailé et couronné en bas-relief de marbre, première moitié du XVIIe siècle : symbole de l'Église."}},{"t":"L'Hypogée des Âmes","x":"La véritable église se trouve en contrebas. Depuis une ouverture dans le sol de l'église supérieure, de hauts escaliers descendent vers un grand espace nu, une véritable église basse.\n\nAu centre de la pièce se trouve un grand tombeau anonyme, entouré de chaînes noires et éclairé par quelques ampoules. Le long des murs, des niches, de petits autels et des reliquaires témoignent du culte qui s'est développé spontanément ici au XVIIe siècle, lorsque des fidèles prenaient soin de dépouilles humaines anonymes et priaient pour leur protection. Au fond se dresse l'ancien autel du XVIIe siècle, orné de grandes croix noires.\n\nDescendez lentement : c’est un lieu de recueillement vivant, et non de simple curiosité. Une visite guidée en italien est incluse dans le prix du billet, sur réservation.","d":"Sous l'église, en descendant un escalier raide","foto":{"u":"../img/7fc480d05134.jpg","alt":"L'hypogée du Purgatorio ad Arco autels et ses bougies","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"L'hypogée, l'église en contrebas : autels, bougies et témoignages du culte des âmes."}},{"t":"Le crâne de Lucia","x":"Parmi tous les crânes de l'hypogée, il en est un particulièrement vénéré : celui de Lucia, que l'on croit être l'âme d'une jeune femme. Il est conservé au bout d'un petit couloir.\n\nC'est le témoignage le plus touchant du culte des âmes du Purgatoire, apparu ici spontanément au XVIIe siècle : les fidèles choisissent une dépouille anonyme, en prennent soin et demandent sa protection.\n\nConsidérez-la avec respect : pour de nombreux Napolitains, elle reste une figure vers laquelle ils peuvent se tourner.","d":"Dans l'hypogée, au bout d'un petit couloir","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Une image des âmes du Purgatoire parmi les flammes à l'intérieur de l'église","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"À l'intérieur de l'église : les âmes du Purgatoire dans les flammes, thème central du lieu."},{"u":"../img/de63b1b83fa8.jpg","alt":"Un crâne en bronze sur une petite colonne","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un crâne en bronze : le symbole de l'église « capuzzelle »."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Quarante mètres sous la Via dei Tribunali : les citernes qui, pendant des siècles, ont fourni de l'eau à Naples, des abris de guerre et un théâtre romain caché sous un lit.","rac":"Sous le centre historique se cache une autre ville. Depuis la Piazza San Gaetano, on descend une centaine de marches jusqu'à une profondeur d'environ 40 mètres, en empruntant un chemin qui traverse un aqueduc gréco-romain et des tunnels datant des époques médiévale, bourbonienne et moderne.\n\nCes grottes datant de l'époque grecque ont servi de citernes pour l'approvisionnement en eau de la ville pendant environ 23 siècles. Durant la Seconde Guerre mondiale, ces mêmes espaces ont été transformés en abris anti-aériens.\n\nLa visite souterraine est guidée et dure environ une heure. Vous remontez ensuite à la surface pour la surprise finale : les vestiges du théâtre gréco-romain de Neapolis, intégrés aux maisons du quartier depuis le XVe siècle. Vous pénétrez dans un « basso », une maison de plain-pied, déplacez un lit et descendez par une trappe à l’intérieur des murs du théâtre.","con":"Des chaussures basses et un sweat-shirt sont recommandés, même en été : l’air est humide sous terre. Le court passage étroit éclairé à la bougie est facultatif. Réservation obligatoire pour les groupes de 10 personnes ou plus.","acc":"Ne convient pas aux fauteuils roulants ni aux déambulateurs : présence d’escaliers avec rampes et de passages étroits.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Une grande citerne souterraine creusée dans le tuf, faiblement éclairée","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"L'une des grandes citernes creusées dans le tuf, à environ 40 mètres sous la Via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Des visites guidées sont proposées toutes les heures de 10h à 18h, en italien et en anglais. Elles sont également disponibles le jeudi à 21h, sur réservation uniquement et pour les groupes d'au moins 10 personnes."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Les citernes gréco-romaines","x":"Vous descendez 136 marches basses et confortables jusqu'à environ 40 mètres sous le niveau de la rue. Dès le IIIe siècle avant J.-C., les Grecs y ouvrirent les premières carrières souterraines pour extraire les blocs de tuf avec lesquels ils construisirent les murs et les temples de Neapolis.\n\nLes vastes chambres creusées dans le tuf devinrent par la suite les citernes de la ville, reliées par l'aqueduc gréco-romain, et le restèrent pendant environ 23 siècles. Sous le centre historique se trouve un réseau encore inexploré de citernes, de carrières, de tunnels et de puits, portant des traces grecques, espagnoles et bourboniennes.\n\nEn chemin, vous découvrirez aussi des choses surprenantes : le laboratoire de la station sismique Arianna et les jardins souterrains, de petites cultures à 35 mètres sous terre, éclairées par des lampes spéciales et également étudiées par des chercheurs.","d":"Dans la première partie de la visite, à environ 40 mètres de profondeur","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Les parois en tuf d'une citerne souterraine","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Les parois en tuf d'une citerne : pendant environ 23 siècles, l'eau de la ville a été collectée ici."}},{"t":"Le passage avec la bougie","x":"Les pièces le long du parcours sont toutes grandes et lumineuses, à l'exception d'un passage très court et étroit : on y avance à la lueur des bougies, une à la fois, en gardant une petite distance avec la personne qui nous précède.\n\nAu bout du tunnel, on atteint la citerne romaine encore pleine d'eau : c'est le moment le plus émouvant de la visite.\n\nLe passage est facultatif : les personnes ayant des difficultés à se déplacer dans des espaces restreints peuvent attendre le groupe à l’extérieur, où des bancs sont à disposition. Une bougie n’est pas nécessaire ; la lampe torche de votre téléphone suffira.","d":"Le long du chemin souterrain","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Un tunnel très étroit éclairé dans le tuf","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"L'un des tunnels très étroits creusés dans le tuf."}},{"t":"Les abris de guerre","x":"Durant la Seconde Guerre mondiale, les anciennes citernes servirent d'abris anti-aériens : les Napolitains venaient s'y réfugier pour échapper aux bombardements.\n\nLe long du parcours se trouve le Musée de la Guerre, qui abrite des objets datant de ces années-là.\n\nNaples a subi plus d'une centaine de bombardements aériens, notamment sur son port : penser au nombre de personnes qui s'y sont réfugiées nous aide à comprendre ce que la ville a vécu.","d":"Le long du chemin souterrain","foto":{"u":"../img/0f4490838101.jpg","alt":"Des artefacts de la Seconde Guerre mondiale sont exposés sous terre.","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Souvenirs de la guerre : objets datant de l'époque où ces pièces servaient d'abris anti-aériens."}},{"t":"Le théâtre sous le lit","x":"La deuxième partie de la visite se déroule en surface, entre la Via Anticaglia, le Vico Cinquesanti et la Via San Paolo. C'est là que se dressait le théâtre gréco-romain de Neapolis, également connu sous le nom de théâtre de Néron, car l'empereur y donnait des représentations.\n\nDepuis le XVe siècle, des maisons ont été construites au-dessus et à l'intérieur des murs du théâtre, qui ont ainsi subsisté jusqu'à nos jours. On entre dans un « basso », une maison typique de plain-pied, on déplace le lit et, par une trappe, on descend dans les pièces où, selon la tradition, Néron se préparait pour ses représentations.\n\nUn autre élément du théâtre a récemment refait surface dans un ancien atelier de menuiserie : il abrite aujourd’hui une exposition d’anciennes vitrines en bois sombre pour des crèches, et sous le plancher, des canalisations datant de l’époque des Bourbons, faites de carreaux à motifs bleus, ont refait leur apparition.","d":"Deuxième partie de la visite, en surface entre la Via Anticaglia et le Vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"Les arches de briques qui enjambent la Via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Les arcades de la Via Anticaglia : ce sont des vestiges du théâtre romain de Neapolis, intégrés aux maisons."}}],"gal":[],"leg":"D'après le récit de cette visite, Néron disposait de ses loges dans des pièces secrètes situées sous l'étage inférieur lorsqu'il venait à Naples pour jouer au théâtre.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Deux colonnes romaines de onze mètres de haut soutiennent encore la façade : ce sont tout ce qui reste du temple des Dioscures.","rac":"Sur la Piazza San Gaetano, au cœur de la vieille ville, un escalier mène à une façade soutenue par deux colonnes corinthiennes d'environ onze mètres de haut. Ce sont les vestiges du temple des Dioscures, construit entre le Ier et le IIe siècle après J.-C. et considéré comme le plus important édifice antique de Naples.\n\nUne première église San Paolo fut construite à cet emplacement entre le VIIIe et le IXe siècle ; les Théatins la reconstruisirent ensuite à la fin du XVIe siècle. Le tremblement de terre de 1688 détruisit une grande partie de l’ancien temple ; l’architecte Arcangelo Guglielmelli intégra les colonnes restantes à la nouvelle façade. Les bombardements de 1943 endommagèrent l’intérieur, mais une grande partie du décor fut préservée.\n\nSaint Cajetan de Thiène, fondateur des Théatins, est enterré ici.","con":"Admirez les colonnes de près, puis entrez : la sacristie, ornée de fresques de Solimena, compte parmi les plus beaux endroits. Les horaires d’ouverture varient : renseignez-vous au préalable.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Les colonnes corinthiennes du temple romain sur la façade de San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Les colonnes corinthiennes du temple des Dioscures sur la façade de San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Les colonnes du temple des Dioscures","x":"Les deux colonnes corinthiennes de la façade, d'une hauteur d'environ onze mètres, sont les seuls vestiges du temple des Dioscures. Après le tremblement de terre de 1688, l'architecte Arcangelo Guglielmelli les intégra à la nouvelle façade. Au-dessus des marches, les statues de saint Pierre et saint Paul furent sculptées par Andrea Falcone en 1671.","d":"Sur la façade, en haut des escaliers","foto":{"u":"../img/951355b4bf10.jpg","alt":"La façade de San Paolo Maggiore avec ses colonnes antiques","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"La façade de San Paolo Maggiore, avec les colonnes du temple des Dioscures."}},{"t":"Le tombeau de saint Cajetan","x":"Saint Cajetan de Thiène, fondateur des Théatins, l'ordre qui a reconstruit l'église à la fin du XVIe siècle, est enterré dans cette basilique. Le sanctuaire qui lui est dédié fait partie intégrante de l'édifice.","d":"À l'intérieur de la basilique","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"Le sanctuaire de San Gaetano Thiene dans la basilique","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"Le sanctuaire de San Gaetano Thiene dans la basilique de San Paolo Maggiore."}},{"t":"La sacristie de Solimena","x":"La sacristie de la basilique est décorée par Francesco Solimena, l'un des plus grands peintres napolitains du XVIIIe siècle. C'est l'une des plus belles parties de l'édifice.","d":"Derrière la nef, dans la sacristie","foto":{"u":"../img/4782e44ae33e.jpg","alt":"La sacristie décorée de fresques par Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"La sacristie de San Paolo Maggiore, avec des fresques de Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Le chef-d'œuvre que Caravage a peint dès son arrivée à Naples : les Sept Œuvres de Miséricorde, toujours sur l'autel pour lequel elles ont été réalisées, à quelques pas du Duomo.","rac":"Le Pio Monte della Misericordia fut fondé en 1602 par sept jeunes nobles napolitains pour venir en aide aux plus démunis. Il existe toujours aujourd'hui, dans le même bâtiment du XVIIe siècle, Via dei Tribunali, et poursuit son œuvre caritative.\n\nL'église octogonale fut construite entre 1656 et 1671 d'après les plans de Francesco Antonio Picchiatti. Le maître-autel abrite la toile qui l'a rendue célèbre dans le monde entier : les Sept Œuvres de Miséricorde du Caravage, peintes entre 1606 et 1607 et dont le coût s'élevait à 400 ducats, une somme astronomique. Le Caravage avait séjourné à Naples pendant quelques mois, fuyant Rome après avoir été condamné pour meurtre.\n\nLe tableau fut si bien accueilli qu'en 1613, la congrégation décréta qu'il ne pourrait être vendu « à aucun prix » et qu'il resterait à jamais dans l'église. Autour de lui, sur les six autres autels, se trouvent des tableaux d'autres maîtres napolitains du XVIIe siècle, chacun dédié à une œuvre de miséricorde. À l'étage se trouve la galerie d'art Pio Monte.","con":"Le prix d'entrée plein tarif est de 10 €, le tarif réduit de 8 €. Le palais abrite également les stalles du chœur, d'où les gouverneurs de Pio Monte pouvaient admirer la toile : renseignez-vous pour savoir si cela est inclus dans la visite.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"Le dôme octogonal de l'église Pio Monte della Misericordia vu d'en bas","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"Le dôme de l'église octogonale de Pio Monte della Misericordia, vu vers le haut."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Fermé le 25 décembre et à Pâques ; les 24 et 31 décembre et le 15 août, fermeture à 14h30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Les sept œuvres de miséricorde","x":"C'est une immense toile, de près de quatre mètres de haut, qui évoque une ruelle napolitaine nocturne : un carrefour animé, éclairé par une lumière latérale qui sculpte les silhouettes dans l'obscurité. Au-dessus, la Vierge à l'Enfant, portée par deux anges, contemple la foule.\n\nLe Pio Monte souhaitait une œuvre réunissant les sept œuvres de miséricorde : nourrir les affamés, donner à boire aux assoiffés, vêtir les nus, accueillir les pèlerins, visiter les malades, visiter les prisonniers et enterrer les morts. Caravage les a toutes peintes en une seule scène, sans miracles : c’est l’homme qui aide l’homme.\n\nIl s'agissait de la première œuvre de Caravage à Naples, et elle a changé la peinture de la ville : les peintres napolitains du XVIIe siècle ont repris sa lumière, ses personnages tirés de la rue et même certains détails, comme l'homme vu de dos au premier plan.","d":"Sur l'autel principal","foto":{"u":"../img/da8045021e55.jpg","alt":"Les Sept Œuvres de Miséricorde du Caravage : Scènes de rue par une nuit sombre","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Les Sept Œuvres de Miséricorde du Caravage (1607) : la scène entière, avec les gens en bas et la Vierge à l'Enfant en haut."}},{"t":"Comment reconnaître les sept œuvres","x":"Recherchez les scènes une par une.\n\nÀ droite, une jeune femme allaite un vieil homme derrière les barreaux : Pero et son père Cimone, condamnés à mourir de faim en prison. Ils rendent un double service : nourrir les affamés et rendre visite aux prisonniers. Elle observe la goutte de lait sur la barbe du vieil homme.\n\nDerrière eux, un homme porte un mort (dont on ne voit que les pieds), et un prêtre, une torche à la main, éclaire son chemin : enterrer les morts. Au premier plan, à gauche, un jeune chevalier coupe un manteau pour un homme nu à terre : c’est saint Martin qui vêt le nu ; tout près, dans le coin le plus sombre, un infirme prie : visiter les malades.\n\nÀ l'extrême gauche, un aubergiste indique le chemin à un pèlerin coiffé d'une coquille Saint-Jacques, représentant saint Jacques accueillant les pèlerins. À l'arrière-plan, un homme boit dans une mâchoire d'âne : Samson, donnant à boire aux assoiffés.","d":"Devant la toile, de gauche à droite","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"Toile du Caravage au-dessus du maître-autel du Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La toile du Caravage telle que vous la voyez dans une église : au-dessus de l'autel, dans la chapelle de Pio Monte."}},{"t":"La Vierge et les anges","x":"Levez les yeux : la Vierge à l’Enfant apparaît comme à travers une fenêtre, devant deux draps, et deux anges s’enlacent en plein vol. Ils semblent distants de ce qui se passe en contrebas.\n\nMais observez l’ombre qu’ils projettent sur le mur de la prison : Caravage les rend présents, presque concrets, au sein même de cette nuit, comme des hommes.\n\nL'historien d'art Roberto Longhi a choisi ce détail précis pour l'affiche de la grande exposition de 1951 qui a redécouvert Caravage : magnifique, écrivait-il, comme un Raphaël, mais saisi « par la vérité nue de Forcella ou de Pizzofalcone ».","d":"En haut de la toile","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Détail : la Vierge à l'Enfant et deux anges en vol","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Détail ci-dessus : la Vierge à l’Enfant regardant au loin et les deux anges enlacés en plein vol."}},{"t":"Les autres autels","x":"Autour du Caravage, l'église octogonale possède six autres autels, avec des peintures de peintres napolitains du XVIIe siècle : Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino et Forlì.\n\nObservez « La Libération de saint Pierre » de Battistello Caracciolo (1615) : il est l’un des peintres qui ont le plus appris de Caravage, ce qui transparaît dans le jeu d’ombre et de lumière. Citez également « Saint Pierre ressuscitant Tabitha » de Fabrizio Santafede (1611).\n\nRegardez-les d'après Caravage : vous comprendrez immédiatement à quel point sa toile était novatrice pour Naples.","d":"Dans les chapelles autour","foto":{"u":"../img/b58919c38c63.jpg","alt":"Une toile du XVIIe siècle représentant le Bon Samaritain","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"Le Bon Samaritain de Giovan Vincenzo Forlì, sur l'un des autels entourant les Sept Œuvres du Caravage."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Cathédrale et Trésor de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cathédrale de Naples et la chapelle du Trésor, où est conservée la fiole du sang de saint Gennaro.","rac":"La cathédrale, dédiée à Santa Maria Assunta, fut commandée par Charles d'Anjou en 1294 à l'emplacement de deux anciennes basiliques : la basilique Sainte-Étienne, aujourd'hui détruite, et la basilique Santa Restituta, conservée comme chapelle. Elle surgit soudainement le long de la Via Duomo, rue ouverte dans les premières décennies qui suivirent l'unification de l'Italie.\n\nDe style gothique, avec un plan en croix latine et trois nefs, son plafond à caissons est orné de boiseries sculptées et dorées. À l'intérieur, les siècles se succèdent : la basilique paléochrétienne Santa Restituta, le plus ancien baptistère d'Occident, la crypte Renaissance du Succorpo, la chapelle baroque du Trésor et, en dessous, les vestiges de la ville gréco-romaine.\n\nDans la cathédrale, dans une niche de la chapelle du Trésor, est conservée l'ampoule contenant le sang traditionnellement attribué à saint Gennaro. Trois fois par an (le samedi précédant le premier dimanche de mai, le 19 septembre et le 16 décembre), on attend sa liquéfaction. Depuis 1601, les reliques sont confiées à une institution séculière, la Députation de la chapelle du Trésor de saint Gennaro.","con":"Les jours de liquéfaction de l'eau, le Duomo est bondé dès le matin : si vous voulez y être, arrivez tôt.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La façade de la cathédrale de Naples","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La façade du Duomo, sur la Via Duomo. La chapelle du Trésor est la troisième à droite."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Entrée gratuite sur réservation obligatoire. Départs des visites guidées toutes les heures."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Le portail de San Gennaro","x":"Arrêtez-vous devant la façade : elle mesure environ cinquante mètres de haut et possède trois portails. Elle fut reconstruite en style gothique après que le tremblement de terre de 1349 eut détruit la façade angevine et le clocher.\n\nLa porte de droite reste fermée presque toute l'année : elle n'ouvre que pour la fête de San Gennaro et lors d'occasions spéciales. Si elle est ouverte, c'est que vous êtes arrivés un jour exceptionnel.\n\nLa cathédrale, dédiée à Santa Maria Assunta, fut commandée par Charles d'Anjou en 1294 sur l'emplacement de deux anciennes basiliques. À l'intérieur, elle présente un plan en croix latine, trois nefs et un plafond à caissons en bois sculpté et doré.","d":"À l'avant, à droite","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"Le portail gothique de la cathédrale de Naples","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Le portail gothique de la cathédrale, sur la façade."}},{"t":"La chapelle du trésor","x":"Plus qu'une chapelle, c'est une église au sein de l'église : la troisième chapelle à droite, une chapelle baroque de la première moitié du XVIIe siècle, présente un plan en croix grecque et une coupole à double dôme. On y accède par la grande porte en bronze de Cosimo Fanzago.\n\nLe buste en argent de San Gennaro et les fioles contenant son sang sont conservés ici : chaque année, la ville attend le « miracle » de la liquéfaction, et les foules remplissent la cathédrale.\n\nLe trésor offert au saint au fil des siècles (bijoux, argenterie, œuvres d'art) peut être visité au Musée du Trésor de San Gennaro, dont l'entrée se situe à l'extérieur de la cathédrale.","d":"Troisième chapelle à droite","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"Le dôme de la chapelle du Trésor est orné de fresques représentant le Paradis.","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Levez les yeux : dans le dôme de la chapelle du Trésor se trouve le Paradis peint par Giovanni Lanfranco."}},{"t":"Saint Restituta","x":"Lorsque Charles d'Anjou fit construire la cathédrale, l'une des deux anciennes basiliques qui se dressaient autrefois à cet emplacement fut démolie, l'autre fut préservée comme chapelle latérale : il s'agit de Santa Restituta, dans la nef gauche.\n\nLa tradition veut qu'elle ait été commandée par l'empereur Constantin : elle constitue l'un des plus importants témoignages de l'art paléochrétien à Naples. Elle possède trois nefs et abrite des œuvres de Luca Giordano ainsi que des sculptures du XIVe siècle.\n\nDe là, vous descendez vers la zone archéologique située sous la cathédrale, où vous pouvez voir des strates d'histoire superposées les unes aux autres : des vestiges gréco-romains et paléochrétiens.","d":"Dans l'allée de gauche","foto":{"u":"../img/5abf53aec271.jpg","alt":"Une mosaïque avec la Madone trônant dans la Basilique de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Une mosaïque de la Vierge en majesté à l'intérieur de Santa Restituta : la plus ancienne basilique, conservée comme chapelle de la cathédrale."}},{"t":"Le baptistère de San Giovanni in Fonte","x":"À droite de l'abside, une petite pièce chargée d'histoire : le baptistère San Giovanni in Fonte, considéré comme le plus ancien d'Occident.\n\nArrêtez-vous quelques minutes en silence : vous vous trouvez sur l'un des plus anciens sites chrétiens d'Europe encore debout, datant de l'époque où Naples romaine s'est convertie au christianisme.\n\nLe baptistère et la zone archéologique située sous la cathédrale racontent ensemble l'histoire des premiers siècles de la ville chrétienne.","d":"À droite de l'abside","foto":{"u":"../img/994ed22c6902.jpg","alt":"L'intérieur du baptistère de San Giovanni in Fonte, avec les fonts baptismaux au centre.","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Le baptistère de San Giovanni in Fonte : au centre du sol, les fonts baptismaux."}},{"t":"Le Succorpo","x":"Sous le maître-autel se trouve la crypte de la cathédrale, la Cappella del Succorpo, également connue sous le nom de chapelle Carafa : le cardinal Oliviero Carafa l’a commandée pour abriter les reliques de San Gennaro ainsi que celles de 51 autres saints.\n\nL'architecte Giovan Tommaso Malvito l'a conçue comme une petite basilique : trois nefs séparées par d'anciennes colonnes à chapiteaux ioniques, des niches sur les côtés et une chapelle au fond.\n\nMarbre blanc, lumière tamisée et silence : la Renaissance au cœur de la cathédrale gothique.","d":"Sous le maître-autel","foto":{"u":"../img/876cd614ab8d.jpg","alt":"L'intérieur du Succorpo di San Gennaro avec ses colonnes de marbre et son sol incrusté","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Le Succorpo, sous le presbytère de la cathédrale : colonnes et sol en marbre, et au fond l'autel avec les reliques de San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Complexe Girolamini","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"En face de la cathédrale se trouvent une église baroque appelée la « Domus Aurea », deux cloîtres, une galerie de tableaux et la plus ancienne bibliothèque publique de Naples.","rac":"Sur la Via Duomo, face à la cathédrale, se trouve le complexe Girolamini, construit au XVIe siècle par les pères de l'Oratoire San Filippo Neri, dit Girolamini. Classé monument national depuis 1866, il comprend l'église, le cloître, la galerie d'art et la bibliothèque.\n\nL'église, dédiée à saint Philippe Néri, est surnommée la « Domus Aurea » en raison de sa décoration baroque dorée. La galerie d'art est considérée comme la première galerie publique de la ville et abrite des œuvres de maîtres tels que Battistello Caracciolo, Jusepe de Ribera et Luca Giordano. La bibliothèque, ouverte au public dans la seconde moitié du XVIe siècle, est la plus ancienne bibliothèque publique de Naples.\n\nLe complexe a fait l'objet d'un long projet de restauration : l'église a rouvert ses portes le 21 mars 2024 et, selon la presse, les salles Sala Camino et Sala Vico de la bibliothèque ont également rouvert en 2026. Les réouvertures sont progressives ; toutes les salles ne peuvent pas être visitées en même temps.","con":"Avant de venir, consultez le site web officiel pour connaître les horaires d'ouverture : l'église, le cloître, la galerie d'art et la bibliothèque ont des horaires d'ouverture différents et susceptibles d'être modifiés.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"La façade Girolamini illuminée en soirée","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"La façade de l'église Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Église. Fermée le lundi."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"L'église et les fêtes."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"L'église « Domus Aurea »","x":"L'église San Filippo Neri, surnommée la Domus Aurea (la Maison Dorée) en raison de sa riche décoration baroque, est l'un des lieux de culte les plus importants de la ville.","d":"Dans l'église, avec une entrée depuis la Via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"La nef de l'église Girolamini avec ses décorations dorées","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"L'église des Girolamini, la « Domus Aurea » en raison de sa riche décoration."}},{"t":"La galerie de photos","x":"Considérée comme la première galerie d'art publique de Naples, elle abrite des peintures de maîtres du XVIIe siècle tels que Battistello Caracciolo, Jusepe de Ribera et Luca Giordano. On y accède depuis le cloître des Orangers, au premier étage du couvent.","d":"Gros plan du couvent, depuis le cloître des Oranges","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Tête de saint peinte par Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Une toile de la Quadreria dei Girolamini : tête de saint de Massimo Stanzione (XVIIe siècle)."}},{"t":"La plus ancienne bibliothèque de Naples","x":"La bibliothèque est la plus ancienne bibliothèque publique de la ville et la deuxième d'Italie après la Malatestiana de Cesena. Spécialisée en théologie, philosophie, histoire de l'Église et musique sacrée, elle abrite environ 159 700 ouvrages anciens et modernes. Parmi les salles historiques, l'une est dédiée à Giambattista Vico, qui y a étudié.","d":"Entrée par la Via Duomo 114","foto":{"u":"../img/33028b7b5461.jpg","alt":"Le hall de la bibliothèque Girolamini avec ses étagères en bois","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"La salle de la Biblioteca dei Girolamini, la plus ancienne bibliothèque publique de Naples."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"La Madone armée d'un pistolet, selon Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Une Madone par Banksy avec un pistolet à la place d'une auréole, protégée par une vitre, au cœur du decumanus principal.","rac":"Banksy est arrivé à Naples en 2010 : c’était sa première expérience artistique en Italie. Utilisant des pochoirs, probablement la même nuit, il a réalisé deux œuvres dans des lieux très fréquentés du centre-ville, chacune présentant une image religieuse et un message direct. L’une d’elles, située Via Benedetto Croce, a été recouverte par un autre artiste ; celle-ci a subsisté et est donc considérée comme la seule fresque de Banksy en Italie.\n\nÀ côté de l'œuvre se trouve un ancien reliquaire votif représentant la Vierge à l'Enfant : les deux images, proches l'une de l'autre, semblent dialoguer.\n\nSur la Piazzetta dei Girolamini, sur la façade du decumanus principal, Banksy a réalisé une Madone armée d'un pistolet en guise d'auréole. Aujourd'hui, elle est protégée par une vitre. Le site web officiel du tourisme de la ville l'intègre à son itinéraire consacré au street art dans le centre historique.","con":"Levez les yeux : l'œuvre se trouve au-dessus du niveau de la rue, derrière une vitre.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Le visage de Madonna par Banksy, au pochoir blanc sur fond sombre.","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Le visage de la Madonna de Banksy : le pochoir blanc sur fond sombre, en gros plan."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Madone au pistolet","x":"Regardez le mur : blanc sur fond noir, une Vierge à l’Enfant, les bras tendus vers le ciel, est peinte au pochoir. Mais au lieu d’une auréole, au-dessus de sa tête se trouve un pistolet.\n\nBanksy, l'artiste de rue anglais installé à Bristol, l'a peinte à Naples en 2010, probablement de nuit et en quelques secondes, à l'aide de ses pochoirs. C'était sa première œuvre en Italie.\n\nLe message n'est pas explicite : au premier abord, il ressemble à une image sacrée, mais il n'en est rien. Sacré et violence, foi et armes : chacun l'interprète à sa manière.","d":"Sur le mur de la petite place","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"Gros plan sur le pochoir de Madonna réalisé par Banksy sur le mur de la Piazza Gerolomini.","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Madone de Banksy, un pochoir en noir et blanc sur un coin de mur de la Piazza Gerolomini."}},{"t":"Le kiosque à journaux d'à côté","x":"Regardez maintenant à côté de l'œuvre : il y a un petit reliquaire votif représentant la Vierge à l'Enfant, un de ceux qu'on trouve dans de nombreuses rues de Naples, peint il y a on ne sait combien de siècles.\n\nLes deux Madones, côte à côte, semblent se dévisager : la plus âgée paraît observer avec perplexité celle de Banksy. C’est ce dialogue qui confère à l’œuvre son caractère napolitain.\n\nPrenez du recul et regardez-les ensemble : c'est la plus belle photo à ramener à la maison.","d":"Juste à côté de l'œuvre","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Vierge de Banksy accrochée au mur et, à côté, un reliquaire votif représentant la Vierge à l'Enfant.","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"À gauche, la Madone de Banksy ; à droite, accrochée au mur, la statuette de la Vierge à l'Enfant : les deux images sacrées côte à côte."}},{"t":"Un Banksy sous verre","x":"En 2010, Banksy a laissé deux œuvres à Naples, probablement la même nuit. L'autre, située Via Benedetto Croce, se moquait de la société de consommation : il s'agissait d'une réinterprétation de « L'Extase de la bienheureuse Ludovica Albertoni » du Bernin, mais la sainte y était représentée en extase après un repas de fast-food.\n\nCette œuvre a été recouverte par un autre artiste de rue napolitain, qui ignorait ce qu'il effaçait. C'est pourquoi le FAI (Fonds italien pour le patrimoine culturel immatériel) considère cette fresque de la Piazza Gerolomini comme la seule œuvre murale de Banksy en Italie.\n\nAujourd'hui, il est protégé par une vitrine en plexiglas, ce qui le protège au moins des vandales.","d":"Devant le travail","foto":null},{"t":"Comment s'y rendre et que photographier","x":"L'œuvre se trouve sur un mur de la petite Piazza Gerolomini, donnant sur la Via dei Tribunali.\n\nLa vitrine protège l'œuvre mais peut refléter la lumière : pour une photo sans reflets, essayez de vous placer légèrement sur le côté. L'espace est toujours accessible et gratuit.\n\nDe là, la Madone de la Via Benedetto Croce, l'œuvre perdue, se trouvait à neuf minutes de marche, en suivant la route qui passe par Sansevero, Napoli Sotterranea et San Gregorio Armeno.","d":"Place Gerolomini, sur la Via dei Tribunali","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"La place Bellini et les remparts grecs","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Une place bordée de cafés et d'étudiants offrant une vue sur le passé : derrière une balustrade, on aperçoit les remparts grecs de Neapolis.","rac":"La Piazza Bellini, située sur le decumanus principal, est l'une des places les plus animées du centre historique, grâce à ses nombreux bars et restaurants. En regardant en contrebas de la balustrade, on aperçoit, dans une zone légèrement en contrebas, une section des remparts de la Neapolis grecque, datant du IVe siècle avant J.-C. Ils ont été découverts en 1954.\n\nLe Conservatoire de San Pietro a Majella est à deux pas.","con":"Dix minutes suffisent : admirez les murs d'en haut, puis faites une pause dans l'un des bars de la place.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"La Piazza Bellini avec ses tables et sa verdure","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"La Piazza Bellini, lieu de rencontre du centre historique."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Les murs grecs","x":"Sous le niveau de la place se trouvent les vestiges des remparts de Neapolis grecque, construits en blocs de tuf. Découverts en 1954, ils font partie du système de fortifications de l'ancienne cité. Il ne s'agit pas d'une reconstruction : ce sont des pierres d'origine.","d":"Au-delà de la balustrade, dans la zone abaissée","foto":{"u":"../img/4801d5111d9f.jpg","alt":"Les blocs de tuf des remparts grecs se trouvent sous le niveau de la place.","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Les remparts grecs de Neapolis, place Bellini : blocs de tuf d’origine."}},{"t":"La place aujourd'hui","x":"Autour des remparts se trouvent des cafés, des librairies et des bars fréquentés par les étudiants et les habitants. C'est l'un des endroits du centre historique où le passé et le présent se côtoient le plus intimement.","d":"Autour de la place","foto":{"u":"../img/133ed975e61b.jpg","alt":"La Piazza Bellini avec ses arbres, ses bâtiments et ses tables","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"La Piazza Bellini aujourd'hui, parmi les cafés et les librairies."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port'Alba et la rue des libraires","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Une porte datant de 1625 et, au-delà de l'arche, une ruelle de libraires et de magasins de musique menant à la Piazza Bellini.","rac":"Port'Alba est l'une des portes les plus anciennes de la ville. Elle donne sur un angle de la Piazza Dante et doit son nom au vice-roi espagnol Antonio Álvarez de Toledo, duc d'Albe, qui la fit construire en 1625 pour remplacer une ouverture provisoire et faciliter le passage d'une partie à l'autre de la ville. Son aspect actuel est le fruit de travaux commandés par Ferdinand IV de Bourbon à la fin du XVIIIe siècle.\n\nAu-delà de la porte se trouve la Via Port'Alba, une ruelle piétonne réputée pour ses librairies et ses magasins de musique, qui mène à la Piazza Bellini.","con":"Passez sous l'arche et flânez entre les étals de livres : c'est le moyen le plus simple de se rendre de la Piazza Dante à la Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"L'arche de Port'Alba, une entrée historique de la vieille ville","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, la porte du XVIe siècle donnant accès à la vieille ville."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"La porte de 1625","x":"La porte fut érigée en 1625 à la demande du duc d'Albe, vice-roi d'Espagne. Les armoiries qui la composent représentent celles du roi Philippe III, de la ville de Naples et du vice-roi. Aujourd'hui, elle est partiellement masquée par la colonnade de la Piazza Dante.","d":"Dans un coin de la Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"La porte de Port'Alba ornée des armoiries","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, la porte de 1625 commandée par le duc d'Alba."}},{"t":"La rue des libraires","x":"La ruelle qui passe par la porte est célèbre pour son marché du livre : librairies, étals et magasins d’instruments de musique, jusqu’à la Piazza Bellini.","d":"Au-delà de la porte, en direction de la Piazza Bellini","foto":null}],"gal":[],"leg":"La légende raconte qu'une jeune femme nommée Maria fut accusée de sorcellerie durant l'Inquisition espagnole et laissée pour morte dans une cage suspendue à une porte.","fc":null,"col":null},{"id":22,"s":"mann","n":"Musée archéologique national (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"L'un des plus grands musées archéologiques au monde : les trésors de Pompéi et d'Herculanum, la collection Farnèse et la célèbre mosaïque d'Alexandre.","rac":"Le Musée archéologique national est installé dans le Palazzo degli Studi, construit en 1585. En 1777, le roi Ferdinand IV de Bourbon y fit transférer la collection Farnèse, héritée de sa mère Élisabeth Farnèse. Au retour des Bourbons en 1816, il devint le Musée royal des Bourbons ; après l’unification de l’Italie, il devint le Musée national. Les peintures furent transférées à Capodimonte en 1957, et depuis lors, ce musée est exclusivement consacré aux antiquités.\n\nIl expose environ 18 000 artefacts : les collections vésuviennes (fresques, mosaïques, objets du quotidien, la maquette de Pompéi, la Villa des Papyrus), les sculptures et les pierres précieuses des Farnèse, le Cabinet secret, des collections numismatiques et l'une des plus importantes collections égyptiennes au monde.\n\nLa pièce la plus célèbre est la mosaïque d'Alexandre, découverte en 1831 dans la Maison du Faune à Pompéi : elle représente la bataille d'Issos, entre Alexandre le Grand et Darius III, et est composée d'environ un million et demi de carreaux.","con":"Si vous êtes pressé par le temps, choisissez-en trois : la mosaïque d’Alexandre, l’Hercule Farnèse et le Cabinet secret. Comptez au moins deux à trois heures pour tout voir. Vérifiez les horaires d’ouverture avant de venir.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Fresque pompéienne exposée au Musée archéologique national","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Une fresque pompéienne exposée au MANN."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Billetterie ouverte jusqu'à 18h30"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"La mosaïque d'Alexandre","x":"Découverte en 1831 dans la Maison du Faune à Pompéi, cette grande mosaïque mesure environ 5,82 mètres sur 3,13 et compte environ 1,5 million de carreaux. Elle représente la bataille d'Issos (333 av. J.-C.) entre Alexandre le Grand et Darius III de Perse.","d":"À l'étage de la mezzanine, dans la section des mosaïques de Pompéi","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"La grande mosaïque de la bataille entre Alexandre et Darius","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"La mosaïque d'Alexandre, provenant de la Maison du Faune à Pompéi."}},{"t":"La collection Farnèse","x":"Collectionnée par la famille Farnèse pour leur palais de Rome, elle comprend des statues monumentales telles que l'Hercule Farnèse, d'environ trois mètres de haut et conservé aux thermes de Caracalla, et le Taureau Farnèse.","d":"Au rez-de-chaussée","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"La statue d'Hercule Farnèse appuyé sur sa massue","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"L'Hercule Farnèse, découvert dans les thermes de Caracalla."}},{"t":"Le Cabinet Secret","x":"Il abrite des œuvres d'art érotiques provenant de Pompéi et d'Herculanum. Il possède une entrée séparée et nécessite souvent une réservation : renseignez-vous à la billetterie.","d":"Sur la mezzanine","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, musée d'art contemporain","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Un bâtiment rénové par l'architecte Álvaro Siza qui abrite des œuvres de Clemente, Kapoor, Serra, Horn et d'autres maîtres de l'art contemporain.","rac":"Le MADRE, Musée d'art contemporain Donnaregina, est situé dans le Palazzo Donnaregina, à quelques pas du Duomo et du Trésor de San Gennaro. Le bâtiment a été rénové par l'architecte portugais Álvaro Siza, et le musée, géré par la Fondation Donnaregina pour l'art contemporain, a ouvert ses portes en 2005.\n\nLe premier étage est consacré à des œuvres créées spécialement pour les salles par des artistes tels que Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long et Mimmo Paladino. La collection comprend également des œuvres de Richard Serra, Sol LeWitt et Jeff Koons, et le musée organise des expositions temporaires. Ce contraste avec la Naples antique qui l'entoure est délibéré.","con":"Ne manquez pas les « Esprits » de Rebecca Horn : des répliques en fonte des crânes du cimetière Fontanelle. Le musée est fermé le mardi et certaines salles du deuxième étage sont temporairement fermées pour rénovation ; consultez le site web avant votre visite.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"La cour blanche du musée Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"Le musée Madre, art contemporain à Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Fermé le mardi. Dernière admission une heure avant la fermeture."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Dimanche. Dernière admission une heure avant la fermeture."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"\"Ave Ovo\" de Francesco Clemente","x":"Un sol en majolique et une fresque monumentale, créée en 2005 pour le musée, occupent deux salles sur deux étages.","d":"Dans les salles dédiées à Clément","foto":null},{"t":"« Esprits » par Rebecca Horn","x":"L'artiste a reproduit en fonte les crânes du cimetière Fontanelle, les « capuzzelle » napolitaines. Un lien entre l'art contemporain et le Naples populaire.","d":"Dans la chambre de Rebecca Horn","foto":null},{"t":"L'architecture de Siza","x":"Siza a rénové les trois étages du bâtiment, en conservant la disposition historique et en ajoutant des espaces modernes pour les grandes installations.","d":"Dans tout le musée","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Station de métro de Tolède","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Un arrêt de la ligne 1 considéré comme l'un des plus beaux d'Europe : mosaïques, céramiques bleues et le « Cratère de lumière » de Robert Wilson.","rac":"La station Toledo fait partie du projet « Art Stations », qui a commandé aux architectes et aux artistes la conception des stations de la ligne 1, présentant plus de 250 œuvres. Elle a été conçue par l'architecte catalan Oscar Tusquets Blanca et inaugurée le 17 septembre 2012. L'entrée, située Via Diaz, est composée de trois structures hexagonales recouvertes de carreaux bleus et ocre, qui laissent entrer la lumière dans l'atrium.\n\nEn descendant, on découvre des vagues en relief conçues par Tusquets, des œuvres de Robert Wilson (dont « Crater de luz », un cratère de lumière) et des mosaïques de William Kentridge. La station a été maintes fois classée parmi les plus belles d'Europe.\n\nPour le voir, il suffit de prendre le métro : il vous faut un ticket pour descendre aux quais.","con":"Descendez jusqu'au niveau le plus profond et levez les yeux : c'est là que la lumière du cratère est la plus intense. L'entrée est payante ; consultez les horaires sur le site web de l'ANM.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"Le quai de la gare de Toledo, souterrain","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"Le quai de la gare de Tolède."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Horaires de la ligne 1 : du premier au dernier train."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Horaires de la ligne 1 : du premier au dernier train."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Le \"Cratère de lumière\" de Robert Wilson","x":"Un cratère de lumière, conçu par Robert Wilson, définit l'identité de la station. L'œuvre change au gré de la lumière, conférant à la descente un aspect presque théâtral.","d":"Dans les étages souterrains de la gare","foto":null},{"t":"Les mosaïques de William Kentridge","x":"En chemin, vous pourrez admirer des mosaïques de l'artiste sud-africain William Kentridge, qui font partie du programme Art Stations.","d":"En route vers les voies ferrées","foto":null},{"t":"L'entrée bleue sur la Via Diaz","x":"Trois structures hexagonales revêtues de carreaux bleus et ocre, qui laissent entrer la lumière dans l'atrium, constituent le thème sous-jacent de toute la station.","d":"À l'entrée de la Via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Galeries d'Italia, le dernier Caravage","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"À six minutes de Ceraldi, sur la Via Toledo, se trouve le dernier tableau du Caravage, réalisé quelques semaines avant sa mort : le Martyre de sainte Ursule.","rac":"Les Gallerie d'Italia d'Intesa Sanpaolo sont situées au 177, Via Toledo, dans l'ancien siège de la Banco di Napoli, conçu par Marcello Piacentini à la fin des années 1930. La nouvelle configuration est l'œuvre de l'architecte Michele De Lucchi. Le musée a ouvert ses portes en 2022, remplaçant le Palazzo Zevallos Stigliano voisin.\n\nLe chef-d'œuvre de la collection est le Martyre de sainte Ursule du Caravage, datant de 1610 et considéré comme la dernière œuvre de l'artiste. Il est entouré de trois sections : l'art napolitain du XVIIe au XXe siècle, une collection de céramiques attiques et de Grande-Grèce, et une sélection d'œuvres du XXe siècle.","con":"Tarif plein : 8 €, tarif réduit : 4 € ; gratuit pour les moins de 26 ans et pour tous le premier dimanche du mois. Fermé le lundi ; dernière entrée une heure avant la fermeture.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Une salle des Gallerie d'Italia avec des peintures sur les murs jaunes","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Une salle des Gallerie d'Italia à Naples, avec des peintures du XVIIe siècle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Le martyre de sainte Ursule","x":"La scène est sombre et exiguë, avec un arrière-plan quasi inexistant : nous sommes dans la tente d’Attila, roi des Huns. Ursula, une princesse, l’a repoussé, et il vient de lui décocher une flèche en plein cœur. Elle baisse la tête vers la flèche ; trois hommes accourent à son secours. Le roi semble déjà regretter son geste.\n\nCherchez le visage derrière le saint : c’est celui du Caravage lui-même, qui s’est peint parmi les témoins. Remarquez aussi la main qui se tend entre le saint et le roi, comme pour arrêter la flèche : elle a été réapparue lors de la restauration de 2003-2004.\n\nElle fut commandée par le prince génois Marcantonio Doria, dont la famille avait sainte Ursule pour patronne. C'est la dernière œuvre connue du Caravage : elle fut achevée en mai 1610, un peu plus d'un mois avant sa mort.","d":"Dans la salle dédiée au Caravage","foto":{"u":"../img/62ba7427c200.jpg","alt":"Le Martyre de sainte Ursule par Caravage : la sainte et le roi au moment de la flèche","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Le martyre de sainte Ursule (1610) : le roi frappe la sainte avec une flèche, à bout portant."}},{"t":"Le tableau placé au soleil","x":"Caravage peignit ce tableau à la hâte, peut-être parce qu'il s'apprêtait à partir pour Rome afin d'y solliciter le pardon du pape. Le représentant des Doria à Naples, Lanfranco Massa, fit livrer la toile avant que le vernis ne soit sec et, pour accélérer le séchage, l'exposa au soleil. Le vernis, appliqué en couche très épaisse, fut irrémédiablement abîmé. Caravage relata lui-même cet incident dans une lettre datée de mai 1610.\n\nLe tableau arriva à Gênes, puis passa de génération en génération, pour finalement se retrouver dans une villa à Eboli et être attribué à d'autres peintres. Ce n'est que dans les années 1980 que la découverte de la lettre de Massa confirma avec certitude qu'il était de Caravage.\n\nEn 2025, un nouveau projet de restauration a permis de retrouver trois têtes qui avaient disparu au fil du temps.","d":"Devant la toile","foto":{"u":"../img/6a999eeecae6.jpg","alt":"La toile du Caravage exposée dans une salle du Palazzo Zevallos, avec le plafond décoré","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Le Martyre de sainte Ursule est exposé dans une salle du Palazzo Zevallos Stigliano, qui abrite les Gallerie d'Italia."}},{"t":"Le bâtiment de la Banque de Naples","x":"Avant de monter dans les chambres, regardez autour de vous : vous vous trouvez dans le bâtiment qui abritait le siège de la Banco di Napoli, conçu par Marcello Piacentini à la fin des années 1930.\n\nL'architecte Michele De Lucchi l'a transformée en un musée à l'agencement moderne : les grandes salles de la banque accueillent désormais trois expositions, de l'art napolitain du XVIIe au XXe siècle, dont une riche collection de vases grecs et de la Grande-Grèce.\n\nLe musée a ouvert ses portes en 2022 et poursuit les activités du Palazzo Zevallos Stigliano, qui était ouvert de 1999 à 2022, à quelques pas de là.","d":"En entrant, dans le hall","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La façade en pierre du Palazzo del Banco di Napoli sur la Via Toledo, avec le drapeau européen","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Le Palazzo del Banco di Napoli sur la Via Toledo, qui abrite la Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Quartier espagnol","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Un réseau de ruelles étroites construit au XVIe siècle pour les soldats espagnols, aujourd'hui l'un des quartiers les plus animés et les plus photographiés de Naples.","rac":"Le quartier espagnol fut créé en 1536 sur ordre du vice-roi espagnol Pedro de Toledo, afin d'y loger les garnisons chargées du maintien de l'ordre. La rue principale, la Via Toledo, porte son nom. Ce quartier est un réseau de ruelles étroites délimité par la Via Toledo, le Corso Vittorio Emanuele et Monte Echia, et comprend les quartiers d'Avvocata, de Montecalvario et de San Ferdinando.\n\nLes origines espagnoles se retrouvent encore dans les noms de rues, comme la Via della Trinita degli Spagnoli, où se situe l'église Santa María del Pilar. Les ruelles sont bordées de boutiques, de linge étendu, de petits autels et de nombreuses fresques.\n\nLa plus célèbre est la fresque de Maradona, située sur Largo Maradona, Via Emanuele De Deo : créée en 1990 par Mario Filardi, elle a été restaurée à plusieurs reprises au fil des ans. Elle fait partie du circuit « La Mer et les Châteaux » et possède sa propre page.","con":"Partez de Piazza Carità et flânez dans les ruelles en journée. Comme dans tout lieu fréquenté, gardez votre sac et votre téléphone à portée de main. Marchez lentement : les détails se cachent dans les encadrements de portes et les fresques.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"Une ruelle du quartier espagnol ornée d'une fresque murale représentant Maradona et des drapeaux.","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"Dans le quartier espagnol, la fresque de Maradona parmi les drapeaux."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"Le quadrillage des ruelles","x":"Le plan urbain est un quadrillage régulier de ruelles étroites, conçu pour loger les soldats espagnols. En s'y promenant, on aperçoit du linge qui sèche, de petits oratoires et des boutiques : la vie de quartier se déroule dans les rues.","d":"Dans les ruelles à l'ouest de la Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"Une ruelle étroite du quartier espagnol","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"Une des ruelles droites et étroites du quartier espagnol."}},{"t":"La fresque de Maradona et Largo Maradona","x":"Sur la Via Emanuele De Deo, un ancien parking est devenu Largo Maradona. La fresque de 1990 réalisée par Mario Filardi a ensuite été restaurée par l'artiste argentin Bosoletti, qui a créé l'Isis voilée à côté.","d":"Rue Emanuele De Deo","foto":null},{"t":"L'église Santa Maria del Pilar","x":"Sur la Via della Trinità degli Spagnoli se trouve l'église dédiée par les Espagnols à Santa Maria del Pilar : une trace des origines espagnoles du quartier.","d":"Sur Spanish Trinity Street","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"La fresque de Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"La fresque tant appréciée du Quartier espagnol et la place qui, depuis 2020, est devenue un sanctuaire laïque dédié à Diego.","rac":"La fresque représente Maradona portant le maillot numéro 10 de Naples des années 1980, avec le Scudetto floqué sur la poitrine et le brassard de capitaine. Elle a été réalisée pour célébrer le deuxième Scudetto du club, lors de la saison 1989-1990, à laquelle Maradona a contribué en inscrivant 16 buts en 28 matchs. Arrivé de Barcelone en 1984, il est resté à Naples jusqu'en 1991.\n\nL’auteur, Mario Filardi, n’avait que 23 ans : il peignait par passion et travaillait comme serveur, voyageant à travers le monde.\n\nLa fresque de Maradona a été peinte en 1990 par Mario Filardi. Dans les années 1990, une fenêtre dans le mur a effacé son visage, et la peinture s'est presque entièrement effacée. Elle a été restaurée par Salvatore Iodice, et à l'automne 2017, l'artiste argentin Francisco Bosoletti a repeint le visage. Après la mort de Maradona le 25 novembre 2020, la place, anciennement connue sous le nom de Place des Artistes, a été rebaptisée en son honneur et s'est ornée d'hommages, de drapeaux et de photographies.","con":"Il y a énormément de monde aux heures de pointe : tôt le matin, il est plus facile de le voir tranquillement.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"La grande fresque de Maradona sur la façade d'un immeuble, avec la foule en contrebas.","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"La fresque originale a été peinte en 1990 par Mario Filardi. Le visage actuel a été repeint en 2017 par l'artiste argentin Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"La fresque et son auteur","x":"La fresque de 1990 est l'œuvre de Mario Filardi, qui peignait par plaisir. Elle a été restaurée à plusieurs reprises : en 2017, l'artiste argentin Francisco Bosoletti a repeint le visage.","d":"Sur la façade de la Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Le visage de Maradona peint sur la façade d'un bâtiment","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"La fresque de Maradona sur la Via Emanuele De Deo, dont le visage a été repeint en 2017 par Francisco Bosoletti."}},{"t":"La haute mer à partir du 25 novembre 2020","x":"Après la mort de Maradona, la place, auparavant connue sous le nom de « place des artistes », prit son nom et devint un lieu d'hommages, de drapeaux et de photographies.","d":"Dans la clairière devant la fresque","foto":{"u":"../img/76bca69c23a8.jpg","alt":"La place devant la fresque de Maradona est pleine de monde.","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona : drapeaux, petits autels et visiteurs devant la fresque."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La plaque commémorative de Largo Maradona ornée d'un buste et de drapeaux,","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La plaque sur la place : après la mort de Diego en 2020, la place des artistes a été rebaptisée en son honneur."},{"u":"../img/550f6edc4b91.jpg","alt":"Un petit autel orné de photos de Maradona et de souvenirs","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un petit sanctuaire dédié à Maradona : il en existe beaucoup dans la ville, avec des photos et des souvenirs laissés par les fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona peint avec une auréole à côté d'un petit sanctuaire","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona avec son auréole et son reliquaire votif, peint dans le quartier de San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Un reliquaire votif avec un portrait de Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un reliquaire votif pour Maradona, semblable à ceux des saints."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galerie Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Une galerie en forme de croix avec un dôme en fer et en verre d'environ 56 mètres de haut, faisant face au Teatro di San Carlo.","rac":"La Galleria Umberto I fut construite entre 1887 et 1890 dans le cadre du projet de réaménagement de Naples, grand chantier de reconstruction urbaine entrepris suite à l'épidémie de choléra. L'architecte Emanuele Rocco la conçut en forme de croix, s'inspirant de la Galleria Vittorio Emanuele II de Milan. Elle porte le nom d'Umberto Ier, roi d'Italie au moment de sa construction.\n\nLes quatre ailes se rejoignent sous un dôme de fer et de verre, soutenu par seize nervures. Sous le dôme, le sol est orné d'une mosaïque en forme d'étoile. La galerie abrite des boutiques, des cafés et, aux étages supérieurs, des appartements : elle a été conçue pour allier activités commerciales et vie sociale.\n\nIl est situé en face du Teatro di San Carlo, près de Piazza del Plebiscito.","con":"Arrêtez-vous sous le dôme et levez les yeux : c’est le meilleur endroit pour admirer la structure en fer et en verre. Il s’agit d’un passage, dont l’entrée est gratuite.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"Une entrée décorée de la Galleria Umberto I","aut":"Effems","lic":"CC B
