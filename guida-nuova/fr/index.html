 activités commerciales et vie sociale.\n\nElle se trouve en face du Teatro di San Carlo, près de Piazza del Plebiscito.","con":"Arrêtez-vous sous la coupole et levez les yeux : c'est le meilleur endroit pour voir le fer et le verre. C'est un lieu de passage, à l'entrée libre.","acc":"","foto":{"u":"../img/aa17d08c5d1f.jpg","alt":"Une entrée décorée de la Galleria Umberto I","aut":"Effems","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Une entrée de la Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"La coupole de fer et de verre","x":"Les quatre bras de la galerie se rejoignent sous une coupole de fer et de verre, soutenue par seize nervures. Le jour, la lumière entre de tous côtés ; le soir, l'éclairage met en valeur la structure.","d":"Au centre de la galerie","foto":{"u":"../img/5caa008a8527.jpg","alt":"La coupole de fer et de verre de la Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"La coupole de fer et de verre, où se rejoignent les quatre bras de la galerie."}},{"t":"La mosaïque en étoile","x":"Sous la coupole, le sol est une mosaïque en forme d'étoile à douze branches, dans des tons crème, terre cuite et gris. On la reconnaît en regardant vers le bas, au point de rencontre des bras.","d":"Au sol, sous la coupole","foto":{"u":"../img/1c072c5bce38.jpg","alt":"Un panneau de la mosaïque du sol avec un lion, une gerbe de blé et un tonneau","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:NaplesGalleryUmbertoILeone.jpg","dida":"L'un des panneaux de mosaïque du sol de la Galleria Umberto I (le signe du Lion)."}},{"t":"L'assainissement de Naples","x":"La galerie est née comme le symbole d'une ville qui voulait se moderniser après l'épidémie de choléra. Elle faisait partie du «risanamento» (l'assainissement), le grand projet de démolition et de reconstruction de la ville, et voulait rivaliser avec la Galleria Vittorio Emanuele II de Milan.","d":"En entrant par la Via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Statues et inscription ANNO MDCCCXC sur la galerie","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Anno MDCCCXC» : la date d'achèvement, inscrite sur la galerie symbole de l'assainissement."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Teatro di San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"Le plus ancien théâtre d'opéra encore en activité en Europe : inauguré en 1737, avant la Scala et la Fenice.","rac":"Le Teatro di San Carlo fut construit à la demande de Charles III de Bourbon et inauguré le 4 novembre 1737, jour de la fête du roi. Le roi voulait pour Naples un théâtre plus grand que l'ancien San Bartolomeo. Il ouvrit 41 ans avant la Scala de Milan et 55 ans avant la Fenice de Venise : c'est pourquoi il est considéré comme le plus ancien théâtre d'opéra encore en activité. Le projet fut confié à Giovanni Antonio Medrano et Angelo Carasale.\n\nDes compositeurs comme Rossini, Donizetti, Bellini et Verdi sont passés sur sa scène. Le théâtre est inscrit au patrimoine mondial de l'UNESCO avec le centre historique.\n\nIl se visite lors de visites guidées en italien et en anglais, d'environ une demi-heure ; dans le même complexe se trouve aussi le MeMus, le musée qui raconte l'histoire du théâtre et de l'opéra.","con":"Les visites dépendent des répétitions et des spectacles : consultez le site officiel et, si possible, réservez. Si vous aimez l'opéra, la meilleure façon de découvrir le théâtre est d'assister à un spectacle.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"La façade du Teatro San Carlo avec ses colonnes","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"La façade du Teatro San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Visites guidées d'environ 30 minutes à 10 h 30, 11 h 30, 12 h 30, 14 h 30, 15 h 30 et 16 h 30. Réservation conseillée."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"La salle et le Real Teatro","x":"La salle en fer à cheval est le cœur du théâtre : des loges disposées en rangées superposées et une loge royale. Le San Carlo est aussi célèbre pour son acoustique. Lors des visites guidées, on peut généralement photographier la salle et le foyer.","d":"Dans la salle, lors de la visite guidée","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"Une gravure du XVIIIe siècle représentant un bal dans le théâtre","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Un bal dans le Real Teatro di San Carlo, sur une gravure de 1749."}},{"t":"Le MeMus","x":"Le MeMus, inauguré en 2011, est le musée et les archives historiques du théâtre. Il retrace l'histoire du bâtiment et de l'opéra italien à travers des tableaux, des photographies, des instruments de musique et des costumes.","d":"Dans le même complexe que le théâtre","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Costumes de scène exposés au MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Costumes de scène d'un opéra de Paisiello exposés au MeMus."}},{"t":"Le plus ancien opéra d'Europe encore en activité","x":"Inauguré en 1737, il est plus ancien que la Scala de Milan (1778) et la Fenice de Venise (1792). C'est pourquoi il est considéré comme le plus ancien théâtre d'opéra encore en activité.","d":"Devant la façade, sur la Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"L'inscription Real Teatro di S. Carlo sur la façade","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"«Real Teatro di S. Carlo», sur la façade du théâtre inauguré en 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"La plus grande place de Naples : d'un côté le Palais royal, de l'autre une colonnade qui embrasse la basilique Saint-François-de-Paule.","rac":"Au pied de la colline de Pizzofalcone, Piazza del Plebiscito est l'une des places les plus vastes et les plus monumentales de la ville. Jusqu'en 1817, elle s'appelait Largo di Palazzo. En 1809, Joachim Murat fit démolir les couvents du quartier et concevoir un forum bordé d'une colonnade semi-circulaire. Les travaux s'interrompirent avec la fin de son règne et furent repris par Ferdinand Ier, qui voulut construire une église en accomplissement d'un vœu fait à saint François de Paule : la basilique fut édifiée entre 1817 et 1836, d'après le modèle du Panthéon de Rome.\n\nLa place prit son nom actuel après le plébiscite du 21 octobre 1860, qui sanctionna l'annexion du Royaume des Deux-Siciles au Royaume de Sardaigne. Devant la basilique se dressent deux statues équestres : Charles III de Bourbon, œuvre d'Antonio Canova, et Ferdinand Ier.\n\nAujourd'hui, c'est le lieu des concerts, des cérémonies et des fêtes de la ville.","con":"Arrivez tôt le matin : la lumière rasante illumine la colonnade et la place est presque vide. Ensuite, entrez dans la basilique et faites le tour en direction du Palais Royal.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito avec un lion et l'église San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito et, en arrière-plan, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"La colonnade et la basilique San Francesco di Paola","x":"La colonnade semi-circulaire a vu le jour sous Murat. La basilique est un édifice néoclassique surmonté d'une coupole centrale haute de 53 mètres, inspirée du Panthéon. À l'intérieur, le maître-autel, riche en pierres précieuses et en lapis-lazuli, fut dessiné par Ferdinando Fuga en 1751 et apporté ici en 1835 depuis l'église des Santi Apostoli.","d":"Du côté ouest de la place","foto":{"u":"../img/82ad7240a133.jpg","alt":"L'intérieur circulaire de la basilique San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"L'intérieur de la basilique San Francesco di Paola, inspirée du Panthéon."}},{"t":"Les statues équestres","x":"Les deux statues en bronze représentent Charles III de Bourbon, fondateur de la dynastie, et son fils Ferdinand Ier. Elles se trouvent face à la basilique.","d":"Devant la basilique","foto":{"u":"../img/75d762389b74.jpg","alt":"Une statue équestre en bronze devant la basilique","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"L'une des deux statues équestres des Bourbons devant la basilique."}},{"t":"Le nom de la place","x":"Le nom vient du plébiscite du 21 octobre 1860, par lequel le Royaume des Deux-Siciles fut annexé au Royaume de Sardaigne. Auparavant, la place s'appelait Largo di Palazzo.","d":"Sur toute la place","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito vue dans toute son ampleur","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, autrefois Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Palais royal","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"La grande résidence royale des vice-rois et des Bourbons : Escalier d'honneur, Théâtre de Cour, Salle du Trône et un jardin sur le golfe.","rac":"Le Palais royal donne sur Piazza del Plebiscito. Il fut commandé au début du XVIIe siècle par le vice-roi espagnol Fernando Ruiz de Castro, comte de Lemos, et fut pendant des siècles le siège du pouvoir à Naples ; la construction se prolongea pendant des siècles et ne fut achevée qu'en 1858 par Gaetano Genovese. Sur la façade, dans les niches, se trouvent huit statues de souverains de Naples.\n\nLe musée occupe l'Appartement historique, à l'étage noble : on y accède par l'Escalier d'honneur, œuvre de Francesco Antonio Picchiatti datant de 1651, revêtu de marbre rose et blanc et considéré comme l'un des plus beaux d'Europe. Parmi les salles figurent le Teatrino di Corte, la Salle du Trône, la Chapelle royale et le Salon d'Hercule. L'Appartement historique est ouvert au public depuis 1919 et fut gravement endommagé pendant la Seconde Guerre mondiale.\n\nLe Jardin romantique, du côté du golfe, est d'accès gratuit.","con":"En montant l'Escalier d'honneur, prêtez attention au marbre et à la lumière. Le palais est généralement ouvert de 9 h à 20 h (dernière entrée à 19 h) et fermé le mercredi : vérifiez tout de même avant de venir.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"La façade du Palais royal donnant sur la place","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"La façade du Palais royal."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Appartement d'Étiquette (Appartement historique). Généralement fermé le mercredi. Dernière confirmation sur les pages officielles du ministère de la Culture (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"L'escalier d'honneur","x":"Dessiné par Francesco Antonio Picchiatti en 1651, il fut revêtu plus tard de marbre rose et blanc. Il est considéré comme l'un des plus beaux escaliers monumentaux d'Europe et mène au musée de l'étage noble.","d":"À l'entrée, sur la cour d'honneur","foto":{"u":"../img/7533a4a26b58.jpg","alt":"L'escalier d'honneur du Palais royal","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"L'escalier d'honneur du Palais royal, revêtu de marbres."}},{"t":"Le Petit théâtre de la Cour et la salle du Trône","x":"L'Appartement historique abrite le Petit théâtre de la Cour, la salle du Trône avec un grand lustre de cristal, la Chapelle royale et le Salon d'Hercule : c'étaient les espaces de vie et de représentation de la cour.","d":"À l'étage noble, dans l'Appartement historique","foto":{"u":"../img/841e35a47444.jpg","alt":"Le trône dans la salle du Trône du Palais royal","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"La salle du Trône dans l'Appartement historique."}},{"t":"Le Jardin romantique","x":"Du côté qui donne sur le golfe se trouve le jardin, d'accès gratuit, où l'on se promène entre massifs de fleurs et arbres. C'est un lieu tranquille avec vue sur le golfe.","d":"Du côté du palais qui donne sur la mer","foto":{"u":"../img/982684065526.jpg","alt":"Le jardin du Palais Royal avec ses parterres, ses palmiers et ses lampadaires, et le palais à l'arrière-plan","aut":"Yair Haklai","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Royal_Palace_(Naples)_-_Garden.jpg","dida":"Le jardin du Palais Royal, avec ses parterres et ses arbres."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Nouveau Château)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Le château symbole de Naples : un arc de triomphe entre deux tours, une porte de bronze encore touchée par un boulet de canon et la salle où un roi fit arrêter les barons pendant une fête de mariage.","rac":"Sous les rois angevins, le château devint un centre de culture : sous Robert d'Anjou, des artistes, des médecins et des lettrés y séjournèrent, parmi lesquels Giotto, Pétrarque et Boccace.\n\nAlphonse Ier d'Aragon en fit sa résidence royale et le reconstruisit. Pour célébrer son entrée victorieuse dans la ville, il fit édifier, entre la Tour du Milieu et la Tour de Garde, le grand Arc de Triomphe qui sert encore aujourd'hui d'entrée.\n\nAujourd'hui, le château abrite le Musée Civique : le parcours comprend la pinacothèque au premier étage, la Salle des Barons, la Chapelle Palatine, appelée aussi chapelle Sainte-Barbe, et un parcours archéologique dans l'ancienne Armurerie.","con":"Billet plein tarif 10 euros ; 6 euros pour les résidents de Naples et de la ville métropolitaine ; gratuit pour les moins de 18 ans. Fermé le dimanche.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Le Maschio Angioino avec ses deux tours et l'arc blanc au milieu","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Les deux grandes tours et, au milieu, l'Arc de Triomphe d'Alphonse d'Aragon : c'est l'entrée du château."},"ov":false,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"L'Arc de Triomphe","x":"C'est l'entrée du château, resserrée entre deux tours : Alphonse Ier d'Aragon la voulut pour célébrer son entrée victorieuse à Naples. Arrêtez-vous devant avant d'entrer et regardez-la d'en bas.","d":"À l'entrée, entre la Tour du Milieu et la Tour de Garde","foto":{"u":"../img/91d08c9a9561.jpg","alt":"L'Arc de Triomphe en marbre entre les deux tours","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arc de près : regardez-le d'en bas, étage par étage."}},{"t":"La porte au boulet de canon","x":"Ferrante d'Aragona la commanda à Guglielmo Monaco vers 1475, pour commémorer la victoire de 1462 sur Jean d'Anjou et les barons rebelles : six panneaux racontent la guerre. Dans le panneau en bas à gauche, un boulet de canon en fer est encore planté dans le bronze. L'hypothèse la plus accréditée : la porte faisait partie du butin que Charles VIII embarqua sur ses navires pour la France ; au large de Rapallo, la flotte fut attaquée par les Génois et le coup l'atteignit. Les Génois la renvoyèrent à Naples en 1495.","d":"L'original est conservé à l'intérieur du château","foto":{"u":"../img/50ee03911e6d.jpg","alt":"Le boulet de canon planté dans la porte de bronze","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"Le boulet de canon en fer planté dans le bronze, dans le panneau en bas à gauche."}},{"t":"La Salle des Barons","x":"On y accède par l'escalier extérieur en piperno de l'architecte majorquin Guillermo Sagrera. Levez les yeux : la voûte s'élève à environ 28 mètres et seize nervures en piperno partent en étoile d'une ouverture centrale. Le nom rappelle 1486, lorsque le roi Ferrante Ier invita les barons par ruse à célébrer un mariage et les fit arrêter ici. Pendant cinquante ans, elle a été le siège du Conseil municipal.","d":"En haut de l'escalier de la cour","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La voûte en étoile de la Salle des Barons","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La voûte de la Salle des Barons : seize nervures en piperno partent en étoile de l'ouverture centrale."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Un tunnel voulu par un roi comme voie de fuite, devenu abri antiaérien puis dépôt : un voyage sous la colline de Pizzofalcone.","rac":"La Galleria Borbonica fut commandée par Ferdinand II de Bourbon par décret du 19 février 1853 et conçue par l'architecte Errico Alvino. Elle devait relier le Palais Royal à la Piazza della Vittoria et aux casernes, en passant sous la colline de Pizzofalcone : une voie de fuite rapide pour le roi. Les travaux s'interrompirent faute de fonds, puis à cause des changements politiques de l'Unité italienne.\n\nPendant la Seconde Guerre mondiale, certains espaces servirent d'abri antiaérien. Après la guerre, jusqu'aux années 1970, la galerie fut le dépôt judiciaire de la Ville de Naples : aujourd'hui encore, on y voit des fragments de statues, des voitures et des motos d'époque. L'Associazione Culturale Borbonica Sotterranea l'a nettoyée et la fait visiter avec un guide.\n\nLe Parcours Standard dure environ une heure et peut commencer à deux entrées : via Domenico Morelli 61 et Vico del Grottone 4, à environ 100 mètres de Piazza del Plebiscito. Il existe aussi des parcours plus aventureux.","con":"Réservez : la réservation est obligatoire. La visite standard part à 10 h, 12 h, 15 h et 17 h le vendredi, le samedi, le dimanche et les jours fériés. Il est permis de prendre des photos.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"Un tunnel creusé dans le tuf dans la Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Un tronçon de la Galleria Borbonica, creusée dans le tuf."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Parcours Standard : visites à 10 h, 12 h, 15 h et 17 h (vendredi, samedi, dimanche et jours fériés). Réservation obligatoire, durée d'environ 1 heure. Entrées : via Domenico Morelli 61 et Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"Le tunnel bourbonien","x":"C'est la partie qui raconte l'ambition de Ferdinand II : un long passage en tuf jaune, conçu pour relier le Palais Royal à la Piazza della Vittoria. Le tuf raconte aussi le travail des carriers et l'ingénierie hydraulique de l'époque.","d":"Le long du parcours principal","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"Un passage creusé dans le tuf de la Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"Le passage des puisatiers, un tronçon de la Galleria Borbonica creusé dans le tuf."}},{"t":"L'abri antiaérien","x":"Entre 1939 et 1945, des milliers de personnes s'y sont réfugiées pour échapper aux bombardements. Il reste des lits, des graffitis et des objets de la vie quotidienne de l'époque. C'est la partie qui marque le plus les visiteurs.","d":"Dans les salles de l'abri","foto":{"u":"../img/3200f06943d2.jpg","alt":"L'abri antiaérien de la Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"L'abri antiaérien de la Seconde Guerre mondiale."}},{"t":"Voitures et motos anciennes","x":"Après la guerre, la galerie fut utilisée comme fourrière judiciaire pour les véhicules saisis : aujourd'hui encore, on peut voir des voitures et des motos anciennes le long du parcours.","d":"Le long du parcours","foto":{"u":"../img/87eab52966bc.jpg","alt":"Voitures anciennes abandonnées dans le tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Voitures anciennes le long du tunnel : l'après-guerre, quand la galerie servait de fourrière judiciaire."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Front de mer et Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Le château sur l'îlot où débarquèrent les colons grecs venus de Cumes : on y arrive depuis le front de mer, on traverse le pont et l'on contemple le golfe depuis le Borgo Marinari.","rac":"Le château s'élève sur l'îlot de Megaride, formé de deux rochers réunis par une grande arche. C'est ici que, au milieu du VIIe siècle av. J.-C., débarquèrent les colons venus de Cumes, qui fondèrent ensuite Partenope sur le Monte Echia voisin.\n\nAu Ier siècle av. J.-C., la villa de Lucius Licinius Lucullus se dressait sur l'îlot et sur le Monte Echia. Il en reste quelques vestiges dans la salle des Colonnes : au haut Moyen Âge, cette salle fut le réfectoire de l'un des couvents construits sur l'îlot.","con":"L'intérieur du château est fermé pour travaux jusqu'à nouvel ordre : aujourd'hui, on le visite de l'extérieur, en se promenant sur le front de mer et autour du Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Le Castel dell'Ovo sur la mer, sous un ciel bleu","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Le Castel dell'Ovo sur l'îlot de Megaride, relié au front de mer par un pont."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Réservation facultative."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"L'îlot de Megaride","x":"Depuis le front de mer, regardez le château : il repose sur l'îlot de Megaride, formé de deux rochers reliés par une grande arche. C'est ici, vers le milieu du VIIe siècle av. J.-C., que débarquèrent les Cumains, d'origine grecque, qui fondèrent ensuite la ville de Partenope sur le Monte Echia tout proche.\n\nAu Ier siècle av. J.-C., à l'époque romaine, la célèbre villa de Lucius Licinius Lucullus s'éleva sur l'îlot et sur le Monte Echia ; il en reste les tambours de colonnes de la prétendue « Salle des Colonnes ».\n\nLe nom vient d'une légende : le poète Virgile aurait caché un œuf dans une cage dans les souterrains, et le destin du château et de toute Naples dépendrait de son intégrité. Lorsque, au temps de la reine Jeanne Ire, l'arche entre les deux rochers s'effondra, la reine dut déclarer qu'elle avait remplacé l'œuf pour calmer la ville.","d":"Depuis le pont qui mène au Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Le Castel dell'Ovo et le petit port du Borgo Marinari vus d'en haut","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Vue d'en haut : le château sur son rocher et, à côté, le petit port du Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Gravure de 1841 avec le Castel dell'Ovo et un voilier","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Le Castel dell'Ovo sur une gravure de 1841."}],"leg":"Le nom vient d'une légende : le poète Virgile aurait caché un œuf, enfermé dans une cage, dans les souterrains du château.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Rione Sanità et basilique Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Un quartier populaire renaît de la base : la basilique du « Monacone », les catacombes, Totò et les fresques murales.","rac":"Le Rione Sanità est l'un des quartiers les plus anciens et les plus populaires de Naples : pendant des siècles, il a été un lieu de sépultures et il est aujourd'hui un modèle de renaissance venue de la base, avec des coopératives de jeunes qui gèrent les catacombes et les visites.\n\nAu centre se trouve la basilique Santa Maria della Sanità, construite entre 1602 et 1610 sur un projet de Fra Nuvolo, l'un des plus beaux exemples du baroque napolitain. On l'appelle San Vincenzo ou « 'o Munacone », d'après la grande statue de saint Vincent Ferrier qu'elle abrite. Son plan est en croix grecque et sa coupole est recouverte de majoliques. Sous l'église se trouvent les catacombes de San Gaudioso, qui datent du IVe siècle.\n\nL'acteur Totò est né dans le quartier, via Santa Maria Antesaecula, et des fresques murales le célèbrent dans tout le quartier. C'est aussi ici que se déroule la comédie « Le Maire du rione Sanità » d'Eduardo De Filippo.","con":"Visitez le quartier de jour et sans vous presser : les catacombes, la basilique et le cimetière des Fontanelle sont tout proches. Vous pouvez tout combiner avec le Miglio Sacro (Mille sacré) du dimanche.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"La basilique Santa Maria della Sanità, avec sa coupole","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"La basilique Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilique. Elle peut fermer à certaines dates : consultez le site."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"La basilique du Monacone","x":"L'église de Fra Nuvolo a un plan en croix grecque et une coupole recouverte de majoliques. Le presbytère est surélevé et l'autel baroque possède un double escalier. La statue de saint Vincent Ferrier, le « Monacone », donne à la basilique son nom populaire.","d":"Sur la Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"Le presbytère surélevé avec le double escalier dans la basilique","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"Le presbytère surélevé de la basilique Santa Maria della Sanità, avec le double escalier."}},{"t":"Les catacombes de San Gaudioso","x":"Sous la basilique se trouvent les catacombes de San Gaudioso, datant du IVe siècle. On y accède par l'église.","d":"Sous la basilique","foto":{"u":"../img/30e6de57bd17.jpg","alt":"Les catacombes de San Gaudioso sous la basilique","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Les catacombes de San Gaudioso, sous la basilique."}},{"t":"Totò et les fresques murales","x":"Dans les rues voisines, et dans la via Santa Maria Antesaecula où naquit Totò, des fresques murales et de petites images rappellent l'acteur et les histoires du quartier.","d":"Dans les ruelles autour de la place","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacombes de San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Les plus vastes catacombes du sud de l'Italie : des galeries creusées dans le tuf sur deux niveaux et la tombe d'origine de San Gennaro, saint patron de Naples.","rac":"Les Catacombes de San Gennaro se trouvent dans le Rione Sanità, avec l'entrée au 13 Via Capodimonte, à côté de la Basilica del Buon Consiglio. Leurs origines remontent au IIe siècle apr. J.-C., lorsqu'une riche famille romaine fit don de son sépulcre à la communauté chrétienne. L'ensemble s'étend sur deux niveaux creusés dans le tuf : San Gennaro supérieur et San Gennaro inférieur.\n\nSan Gennaro y fut enseveli, et pendant des siècles le lieu fut un but de pèlerinage. Jusqu'au IXe siècle, ses reliques y sont restées ; puis elles furent emportées et le site fut abandonné. Aujourd'hui, on ne le visite qu'avec un guide, pendant environ une heure. Depuis 2009, un système d'éclairage LED, réalisé par Officina dei Talenti, la coopérative de jeunes du quartier, éclaire les fresques d'une lumière tamisée.\n\nLe site est géré par la coopérative sociale La Paranza, née de jeunes du Rione Sanità.","con":"Réservez à l'avance : les visites sont uniquement guidées, elles partent toutes les heures et la réservation est obligatoire. Le Miglio Sacro (Mille sacré), un parcours guidé dans le Rione Sanità, part à 9 h 30 le samedi, le dimanche et les jours fériés. Les catacombes sont fermées le mercredi.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"Une fresque paléochrétienne dans les catacombes de San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Une fresque paléochrétienne dans les catacombes de San Gennaro."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Visites guidées toutes les heures, réservation toujours obligatoire. Fermé le mercredi et le 25 décembre."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"Le tombeau de San Gennaro","x":"C'est le tombeau qui donne son nom à tout le réseau de catacombes : c'est ici que fut enseveli le saint patron de Naples. Ses reliques y restèrent jusqu'au IXe siècle.","d":"Pendant la visite guidée","foto":{"u":"../img/fd273aee226d.jpg","alt":"Le tombeau de San Gennaro dans les catacombes","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"Le tombeau de San Gennaro, le lieu qui donne son nom aux catacombes."}},{"t":"Les deux niveaux","x":"Les galeries sont creusées dans le tuf sur deux niveaux, le supérieur et l'inférieur, avec de grands passages et des fresques paléochrétiennes.","d":"Pendant la visite guidée","foto":{"u":"../img/537a160d9acb.jpg","alt":"Une galerie creusée dans le tuf avec des tombes dans les parois","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Les galeries des catacombes, creusées dans le tuf."}},{"t":"Le Mille sacré","x":"Le samedi, le dimanche et les jours fériés, un parcours guidé d'environ trois heures passe par les lieux liés à San Gennaro dans le Rione Sanità. Il part à 9h30 et doit être réservé sur le site officiel.","d":"Depuis le point de rendez-vous des catacombes","foto":{"u":"../img/0becd922c42f.jpg","alt":"La façade d'un immeuble du Rione Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"Le Rione Sanità, où le Mille sacré suit les lieux liés à San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Cimetière des Fontanelle","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"Une carrière de tuf grande comme une cathédrale, des milliers de crânes sans nom et le culte des anime pezzentelle. Rouvert en 2026.","rac":"Au XVIe siècle, c'était une carrière de tuf, dans la vallée de la Sanità. Pendant la peste de 1656, de nombreuses victimes y furent transportées, puis celles du choléra de 1836-1837 ; en 1872, le chanoine Gaetano Barbati disposa les restes dans trois grandes nefs. L'espace couvre environ quatre mille mètres carrés.\n\nC'est ici que naquit le culte des anime pezzentelle : les fidèles adoptaient un crâne, une capuzzella, en prenaient soin et le priaient, attendant en échange une protection, parfois un rêve avec les numéros du loto. En 1969, un décret du tribunal ecclésiastique ferma l'ossuaire et interdit le culte. Fermé pour travaux depuis 2020, il a rouvert au public en 2026, géré par la coopérative La Paranza.","con":"Il est fermé le mercredi. Téléchargez l'application du cimetière avant d'arriver : à l'intérieur, le signal du téléphone est faible.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"Les grandes galeries de tuf du cimetière des Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Les galeries de tuf du cimetière des Fontanelle."},"ov":false,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Fermé à Noël. Lundi et vendredi de 9 h à 10 h, ouvert uniquement pour le culte"}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Une carrière grande comme une cathédrale","x":"Le cimetière occupe une ancienne carrière de tuf d'environ quatre mille mètres carrés, aménagée en trois grandes nefs en 1872 par le chanoine Gaetano Barbati. On y transporta les morts de la peste de 1656 et du choléra de 1836-1837.","d":"Dans les trois nefs","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"Une nef du cimetière des Fontanelle creusée dans le tuf","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"L'une des trois nefs du cimetière des Fontanelle, dans l'ancienne carrière de tuf."}},{"t":"Le culte des anime pezzentelle","x":"Les fidèles adoptaient un crâne, la capuzzella, en prenaient soin et le priaient, attendant en échange une protection, parfois un rêve avec les numéros du loto. En 1969, le tribunal ecclésiastique interdit le culte et ferma l'ossuaire.","d":"Devant les rangées de crânes","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Rangées de crânes avec une croix","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Les capuzzelle : des crânes sans nom, adoptés et soignés par les fidèles."}},{"t":"Les Fontanelle au MADRE","x":"L'artiste Rebecca Horn a reproduit en fonte quelques capuzzelle des Fontanelle dans l'œuvre « Spirits », visible au musée MADRE : une façon de comprendre comment le cimetière est entré aussi dans l'art contemporain.","d":"Au musée MADRE (fiche séparée)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Chartreuse et Musée de San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Un monastère chartreux devenu musée, sur la colline du Vomero : un cloître baroque, la crèche Cuciniello et l'un des plus beaux panoramas sur le golfe.","rac":"La Certosa di San Martino se dresse sur la colline du Vomero, à côté du Castel Sant'Elmo. Elle fut fondée en 1325 par Charles de Calabre, fils du roi Robert d'Anjou, et confiée à Tino di Camaino. Entre le XVIe et le XVIIIe siècle, elle devint l'un des exemples les plus raffinés de l'art baroque italien : de 1623 à 1656, Cosimo Fanzago en rénova les espaces. Depuis 1866, après la suppression des ordres religieux, elle abrite le Museo nazionale di San Martino, voulu par Giuseppe Fiorelli.\n\nLe Chiostro Grande, agrandi à partir de 1581 par Giovanni Antonio Dosio et achevé par Fanzago, abrite en son centre le cimetière des moines. Le musée conserve la principale collection publique italienne consacrée à la crèche napolitaine, avec la grandiose Presepe Cuciniello : environ huit cents santons, animaux et accessoires offerts par le collectionneur Michele Cuciniello, inaugurée en 1879. D'autres sections racontent la marine du Royaume, le théâtre, la ville et le Royaume en images et, depuis décembre 2025, le XIXe siècle à Naples. On y trouve aussi la Tavola Strozzi, considérée comme le premier tableau de Naples.","con":"Sortez sur les terrasses et sur la Loggia del Priore : d'ici, on voit tout le golfe. Le site est ouvert tous les jours sauf le mardi ; la dernière entrée a lieu à 17h30.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"Le grand cloître de la Chartreuse de San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"Le grand cloître de la Chartreuse de San Martino."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Fermé le mardi. Certaines sections (navale, crèches, Naples au XIXe siècle) ouvrent à 9 h 30 ; les jardins ferment une heure plus tôt."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"Le Grand Cloître","x":"Agrandi à partir de 1581 par Giovanni Antonio Dosio et achevé par Cosimo Fanzago, il abrite en son centre le cimetière des moines. Le long du périmètre, on voit encore les portes et les passe-plats des cellules des chartreux.","d":"Au cœur de la Chartreuse","foto":{"u":"../img/e43efae68626.jpg","alt":"Le Grand Cloître de la Chartreuse avec le cimetière des moines","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"Le Grand Cloître de la Chartreuse de San Martino, avec au centre le petit cimetière des moines."}},{"t":"La crèche Cuciniello","x":"Avec environ huit cents pièces, c'est la crèche la plus célèbre de Naples. Elle fut offerte par Michele Cuciniello et inaugurée en 1879. Un système d'éclairage simule les heures de la journée.","d":"Dans la section des crèches, là où se trouvaient les cuisines","foto":{"u":"../img/ae5327fcce50.jpg","alt":"La grande crèche avec des centaines de figurines","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"La crèche Cuciniello, avec environ huit cents pièces."}},{"t":"La vue sur le golfe","x":"Depuis les terrasses et les jardins de la Chartreuse, on voit tout le golfe de Naples, avec le Vésuve en toile de fond.","d":"Sur les terrasses et dans les jardins","foto":{"u":"../img/81d0fb825e80.jpg","alt":"Le golfe de Naples vu depuis un balcon de la Chartreuse","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"Le golfe et le Vésuve depuis un balcon de la Chartreuse de San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Castel Sant’Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La forteresse en étoile sur la colline du Vomero : des bastions avec vue à 360° sur Naples et le golfe, et le Museo Novecento à l'intérieur.","rac":"Le Castel Sant'Elmo domine le Vomero à environ 250 mètres d'altitude et il est visible depuis presque toute la ville. Les premières mentions, vers 1275, le décrivent comme une résidence fortifiée angevine appelée Belforte ; en 1329, Robert d'Anjou en voulut l'agrandissement, confié à Tino di Camaino. Le plan en étoile à six branches est en revanche le résultat de la reconstruction du XVIe siècle voulue entre 1537 et 1547 par le vice-roi Pedro de Toledo, sur un projet de l'architecte militaire Pedro Luis Escrivà.\n\nAu fil des siècles, il fut souvent une prison : y furent enfermés Tommaso Campanella et, plus tard, des patriotes de la République napolitaine de 1799 comme Gennaro Serra, Mario Pagano et Luisa Sanfelice. Après avoir été une garnison bourbonienne, il fut prison militaire jusqu'en 1952 ; une grande restauration a commencé en 1976.\n\nSur la place d'armes, depuis 2010, se trouve le Museo Novecento a Napoli : plus de 170 œuvres d'environ 90 artistes napolitains ou actifs dans la ville entre 1910 et 1980. Certaines œuvres ont été créées spécialement pour le château : dans la grande citerne, Gian Maria Tosatti a fait pousser un champ de blé, et sur les remparts se découpe la sculpture en aluminium « Sant'Elmo » de Mimmo Paladino.\n\nDepuis les bastions, le panorama s'étend des îles au Vésuve, des Champs Phlégréens aux monts du Matese.","con":"Montez vers le coucher du soleil pour profiter du panorama. Le château est à côté de la Certosa di San Martino : on peut les visiter la même matinée. Le château est fermé le mardi et, par mauvais temps, il peut rester fermé.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Les hautes murailles de tuf du Castel Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Les murailles du Castel Sant'Elmo."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Château 8 h 30-19 h 30 ; Museo Novecento 9 h 30-18 h 30 (dernière entrée 17 h 30). Fermé le mardi. En cas de mauvais temps, le site peut rester fermé."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"Les bastions et le panorama","x":"Les bastions offrent un panorama à 360° sur la ville, le golfe, le Vésuve et la côte de Posillipe, parmi les plus complets de Naples.","d":"Sur les remparts","foto":{"u":"../img/81edfbd30506.jpg","alt":"Naples et le Vésuve vus du haut du Castel Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Depuis les bastions du Castel Sant'Elmo : la ville, le port et le Vésuve."}},{"t":"Le Museo Novecento à Naples","x":"Ouvert en 2010 sur la place d'armes, il rassemble plus de 170 œuvres d'environ 90 artistes napolitains ou actifs dans la ville, réalisées à partir de 1910 : du futurisme à la Transavanguardia des années 1980.","d":"Sur la place d'armes du château","foto":{"u":"../img/d585126c2db4.jpg","alt":"Une salle du Museo Novecento avec des œuvres d'art","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Une salle du Museo Novecento à Naples, dans le Castel Sant'Elmo."}},{"t":"Un champ de blé dans la citerne","x":"L'œuvre « My dreams, they'll never surrender » de Gian Maria Tosatti (2014) est un champ de blé poussé dans la citerne, le lieu le plus sombre et le plus profond du château, qui fut aussi une prison.","d":"Dans la grande citerne","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"La première balade","sub":"Spaccanapoli en une demi-journée, au départ de Ceraldi","desc":"Le cœur du centre historique en une boucle à pied : le Gesù Nuovo et son mystère, le cloître de Santa Chiara, le Christ voilé, l'église du crâne aux oreilles, les ateliers de la v
