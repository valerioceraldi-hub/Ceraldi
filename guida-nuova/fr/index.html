p","alt":"Caffè Ceraldi"}},{"v":356,"n":"Aspritz","p":800,"foto":{"u":"../img/a3e1bd8ea3d9.webp","alt":"Aspritz"}}],"l":[]}}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"L'histoire de Naples","sub":"De la sirène Partenope à nos jours, en treize chapitres","som":"Avant de partir, vingt-huit siècles en dix minutes : la légende de la sirène, les Grecs, Rome, les rois, la révolte, la guerre et la ville d’aujourd’hui.","txt":"Naples est l'une des plus anciennes villes d'Europe : son histoire s'étend sur près de trois mille ans, et le centre historique que vous allez parcourir conserve encore le plan de rues dessiné par les Grecs. Pendant plus d'un demi-millénaire, elle fut la capitale de l'Italie du Sud.\n\nCes treize chapitres vous mènent de la légende à la ville d'aujourd'hui. À chaque fois que l'histoire atteint un lieu indiqué dans le guide, vous trouverez un bouton pour vous y rendre.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"Le château dell'Ovo vu en 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Castel dell'Ovo vu en 1841 : l'îlot où est née Partenope."},"cap":[{"p":"La légende","t":"La sirène Partenope","x":"Tout commence avec une sirène. Dans la mythologie grecque, les sirènes étaient des créatures à corps d'oiseau et à tête de femme, virtuoses d'un chant magique. L'une d'elles s'appelait Partenope.\n\nLa légende la plus célèbre raconte que, lorsqu'Ulysse passa devant leur rocher sans céder à leur chant, les sirènes, accablées de chagrin, se jetèrent à la mer. Les vagues emportèrent le corps de Partenope jusqu'au rivage, à l'embouchure d'un petit fleuve, le Sébéto : là même où serait fondée la ville.\n\nUn tombeau y fut construit, et les Grecs de Naples lui offraient chaque année des sacrifices et une course aux flambeaux. Aujourd'hui encore, les Napolitains se surnomment « Parthénopéens ».","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"La fontaine avec la sirène Partenope sur la Piazza Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"La fontaine des Sirènes sur la Piazza Sannazaro : Partenope avec la lyre."}},{"p":"VIIIe-VIIe siècle av. J.-C.","t":"Partenope, la première ville","x":"La légende contient une part de vérité. Entre le VIIIe et le VIIe siècle avant J.-C., les Grecs de Cumes, la plus ancienne colonie grecque de la région, fondèrent un petit port maritime et le nommèrent d'après la sirène : Partenope.\n\nElle se dressait sur la colline de Pizzofalcone, dans le mont Echia, sur un éperon rocheux entouré par la mer, et son point d'accostage se situait sur l'îlot de Megaride, là où se trouve aujourd'hui le Castel dell'Ovo. Le port était situé à l'emplacement de l'actuelle Piazza Municipio. La nécropole de Partenope fut découverte en 1949 sur la Via Nicotera.\n\nLa petite ville grandit si vite que Cumes, craignant de perdre son influence, réduisit son rôle.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sur la mer, sous un ciel bleu","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Le Castel dell'Ovo se trouve sur l'îlot de Megaride, relié au front de mer par un pont."}},{"p":"Ve siècle avant J.-C.","t":"Neapolis, la nouvelle ville","x":"À proximité de Partenope, un peu plus à l'est, les Cumiens fondèrent une nouvelle ville : Neapolis, la « ville nouvelle ». L'UNESCO date sa fondation d'environ 470 av. J.-C., à peu près au moment où les Grecs avaient vaincu les Étrusques en mer.\n\nNeapolis fut construite selon un plan régulier : trois rues principales parallèles (les « plateiai », plus tard appelées decumani), coupées à angle droit par des rues plus petites. L’agora, la place principale, se situait à l’emplacement actuel de la Piazza San Gaetano.\n\nCe plan en damier est toujours visible : Spaccanapoli, Via dei Tribunali et Via Anticaglia sont les trois rues grecques. En les empruntant, on parcourt le plan de la ville tel qu’il était il y a 2 500 ans.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"Les gros blocs de tuf des remparts grecs, creusés sous le niveau de la rue","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"Les blocs de tuf des remparts grecs de Neapolis, sur la Piazza Bellini, sont visibles lors de fouilles en contrebas du niveau de la rue."}},{"p":"326 av. J.-C. – Ve siècle apr. J.-C.","t":"Grec sous Rome","x":"En 326 av. J.-C., Neapolis s'allia à Rome et demeura une cité grecque au sein du monde romain pendant des siècles : elle fut parmi les rares à préserver la langue et la culture grecques. Elle devint une destination prisée des Romains cultivés et fortunés, qui y firent construire des villas sur le golfe ; celle de Lucius Licinius Lucullus fut édifiée sur l'îlot de Megaride.\n\nEn 79 apr. J.-C., l'éruption du Vésuve détruisit Pompéi et la ville voisine d'Herculanum. En 476, Romulus Augustule, le dernier empereur romain d'Occident, fut emprisonné dans la villa fortifiée de Lucullus : avec lui s'acheva l'Empire.\n\nL'eau coulait déjà sous la ville gréco-romaine depuis les citernes que l'on peut visiter aujourd'hui dans Napoli Sotterranea, et l'empereur Néron se produisait au théâtre de Neapolis.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Une grande citerne souterraine creusée dans le tuf, faiblement éclairée","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"L'une des grandes citernes creusées dans le tuf, à environ 40 mètres sous la Via dei Tribunali."}},{"p":"VIe-XIIe siècle","t":"Le duché de Naples","x":"Après la chute de l'Empire au VIe siècle, Naples passa aux mains des Byzantins, les Romains d'Orient. Elle devint progressivement un duché quasi indépendant : au VIIIe siècle, le duc Étienne II en devint le seigneur de facto.\n\nPendant cinq siècles, le duché résista aux Lombards et aux Sarrasins. En 1030, le duc Serge IV octroya le comté d'Aversa à un groupe de mercenaires normands : ce fut le début de leur ascension dans le Sud. En 1137, Naples se soumit aux Normands et devint une partie du nouveau royaume de Sicile.\n\nDe ces temps reculés subsistent les plus anciennes églises, telles que Santa Restituta et le baptistère de San Giovanni in Fonte à l'intérieur de la cathédrale, considéré comme le plus ancien d'Occident.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"L'intérieur de la basilique Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, la basilique paléochrétienne intégrée à la cathédrale : Naples avant le duché."}},{"p":"1194–1266","t":"Normands et Souabes : la naissance de l'Université","x":"Après les Normands, ce furent les Souabes. En 1194, l'empereur Henri VI occupa la ville et fit démolir ses remparts.\n\nSon fils, Frédéric II, était un souverain passionné de culture et de droit. En 1224, il fonda le « Studio » à Naples, l’une des premières universités d’État d’Europe : il s’agit de l’actuelle université Federico II, qui porte encore son nom.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La statue de Frédéric II de Souabe sur la façade du Palais Royal","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statue de Frédéric II de Souabe, parmi celles qui ornent la façade du Palais royal."}},{"p":"1266–1442","t":"Les Angevins : Naples comme capitale","x":"En 1266, le pape confia le royaume à Charles Ier d'Anjou, frère du roi de France, qui fit son entrée triomphale dans la ville. Après la révolte des Vêpres siciliennes de 1282, la Sicile fit sécession et Naples devint la capitale du royaume, position qu'elle conserverait pendant des siècles.\n\nLes Angevins construisirent le Castel Nuovo, la cathédrale (à partir de 1294) et la citadelle de Santa Chiara (à partir de 1310), et la ville s'agrandit. Giotto, Pétrarque et Boccace séjournèrent à la cour de Robert d'Anjou au Castel Nuovo.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'entrée du cloître de Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'entrée du cloître en majolique de Santa Chiara."}},{"p":"1442–1503","t":"Les Aragonais","x":"En 1442, Alphonse d'Aragon conquit Naples : selon la tradition, ses hommes entrèrent dans la ville par un aqueduc. Il fit du Castel Nuovo son palais, le reconstruisit et, pour célébrer sa victoire, y ajouta le grand arc de triomphe entre deux tours.\n\nLes Aragonais transformèrent le château médiéval en une forteresse moderne et rénovèrent les fortifications et les rues de la ville. Leur fils Ferrante vainquit les barons rebelles : la porte en bronze du château commémore cette guerre, et sa vengeance fut accomplie dans la salle des barons.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Table Strozzi : Naples aragonaise vue de la mer, avec le Maschio Angioino et le Castel Sant'Elmo.","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Table Strozzi (XVe siècle) : Naples vue de la mer, avec le port, le Castel Nuovo et, au-dessus, la colline Sant'Elmo."}},{"p":"1503–1707","t":"La vice-royauté espagnole","x":"En 1503, Naples passa sous domination espagnole et fut gouvernée par un vice-roi. En l'absence de roi, elle demeurait une capitale impériale, abritant l'une des cours les plus fastueuses des possessions espagnoles. Le vice-roi Don Pedro de Tolède doubla la superficie de la ville, fit ouvrir la Via Toledo et construire le quartier espagnol, destiné aux soldats. Le Palais royal fut également édifié durant ces années.\n\nEn 1606, Caravage arrive à Naples, fuyant Rome : sa peinture change l’art de la ville, qui devient au XVIIe siècle l’une des capitales du baroque européen.\n\nCe furent également des années très difficiles : des impôts très élevés, l’éruption du Vésuve en 1631 et, en 1656, une peste qui tua plus de la moitié des habitants.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello pendant la peste de 1656 : des corps s’entassent sur la place et des figures célestes apparaissent dans le ciel.","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello pendant la peste de 1656, peint par Micco Spadaro : la place est pleine de morts et de mourants."}},{"p":"1647","t":"Masaniello","x":"Le 7 juillet 1647, après une nouvelle taxe, cette fois sur les fruits, nourriture des plus pauvres, un pêcheur de 27 ans, Masaniello, mena le peuple à la révolte en criant « Vive le roi d'Espagne, à bas le mauvais gouvernement ! »\n\nDans les dix jours qui suivirent, les Espagnols durent se soumettre aux revendications du peuple. Mais Masaniello, accusé de folie et trahi par une partie des rebelles eux-mêmes, fut assassiné. La révolte se poursuivit pendant des mois contre l'Espagne avant d'être écrasée en 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"Un tableau du XVIIe siècle représentant une foule en émeute sur la Piazza Mercato","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"Place du marché pendant la révolte de Masaniello, tableau de Domenico Gargiulo dit Micco Spadaro."}},{"p":"1734–1799","t":"Les Bourbons et la République","x":"En 1734, Charles de Bourbon ramena un roi à Naples et entreprit d'en faire une grande capitale européenne. En 1737, il fit construire le Teatro di San Carlo en seulement sept mois, suivi des palais royaux de Portici et de Capodimonte. Les fouilles d'Herculanum et de Pompéi commencèrent également durant ces années.\n\nNaples fut l'une des capitales des Lumières. En janvier 1799, avec l'arrivée de l'armée française, les patriotes proclamèrent la République napolitaine : elle ne dura que jusqu'en juin. Au retour des Bourbons, nombre de ses partisans furent exécutés.\n\nAprès les années françaises (Joseph Bonaparte et Joachim Murat), les Bourbons revinrent en 1815 et, en 1816, naquit le Royaume des Deux-Siciles.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Portrait de Charles de Bourbon en armure","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Charles de Bourbon, interprété par Anton Raphael Mengs."}},{"p":"1860–1945","t":"L'Italie unie et la guerre","x":"Le 7 septembre 1860, Giuseppe Garibaldi entra dans Naples sous les acclamations de la foule ; un plébiscite entérina l’union avec le royaume d’Italie. Naples cessa d’être une capitale, et la perte fut immense.\n\nDurant la Seconde Guerre mondiale, la ville subit plus de 120 bombardements aériens, principalement en raison de son port ; les habitants se réfugièrent dans des citernes souterraines. Après l’armistice, les Allemands occupèrent la ville. Fin septembre 1943, les Napolitains se soulevèrent : lors des « Quatre Jours de Naples », la population contraignit la garnison allemande à capituler. Le 1er octobre, les Alliés arrivèrent.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Gravure ancienne : Garibaldi acclamé par la foule à Naples","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Gravure d'époque représentant l'entrée de Garibaldi à Naples en 1860 : la foule l'acclame sur la Via Toledo."}},{"p":"De 1945 à aujourd'hui","t":"Naples aujourd'hui","x":"Après la guerre, la ville fut reconstruite malgré d'immenses difficultés. En 1995, son centre historique fut inscrit au patrimoine mondial de l'UNESCO : il est le plus vaste d'Italie et l'un des plus grands d'Europe.\n\nDepuis 2001, le métro a inauguré ses « stations d'art », présentant des œuvres d'artistes contemporains. La ville compte environ 950 000 habitants, et plus de trois millions en incluant l'agglomération.\n\nEt puis, il y a Naples, celle que vous découvrirez au fil de vos promenades : les fresques murales, comme celle de Maradona dans le Quartier espagnol, et la Madone de Banksy, la vie dans les ruelles, les cafés. Trois mille ans d’histoire, superposés les uns aux autres, en quelques kilomètres seulement.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Le centre historique de Naples vu du ciel","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Le centre historique vu du ciel : un site inscrit au patrimoine mondial de l'UNESCO depuis 1995."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Caravage à Naples","sub":"Un peintre en fuite et trois chefs-d'œuvre à découvrir","som":"Fuyant Rome, Caravage trouva refuge à deux reprises à Naples. C'est là qu'il peignit les Sept Œuvres de Miséricorde, la Flagellation et son dernier tableau.","txt":"Michelangelo Merisi, dit Caravage, était un peintre romain célèbre et controversé. Fin mai 1606, il blessa mortellement Ranuccio Tomassoni lors d'une rixe qui éclata pendant une partie de raquettes. Condamné, il fut contraint à l'exil.\n\nNaples, alors l'une des plus grandes villes d'Europe, fut son refuge à deux reprises : de l'automne 1606 à l'été 1607, puis de l'automne 1609 à l'été 1610. Il y trouva la protection de la famille Colonna et de riches mécènes, et c'est là que sa peinture changea à jamais l'art de la ville.\n\nTrois de ses œuvres sont aujourd'hui visibles à Naples, dont deux se trouvent sur notre itinéraire.","foto":{"u":"../img/da8045021e55.jpg","alt":"Les Sept Œuvres de Miséricorde du Caravage","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Les Sept Œuvres de Miséricorde, peintes par Caravage à Naples."},"cap":[{"p":"1606–1607","t":"Le premier séjour et les Sept Œuvres","x":"La première commande napolitaine documentée remonte à octobre 1606. Quelques mois plus tard, le 9 janvier 1607, Caravage livra la grande toile des Sept Œuvres de Miséricorde au Pio Monte della Misericordia, payée 400 ducats.\n\nElle est toujours là, sur l'autel pour lequel elle a été peinte, Via dei Tribunali : une nuit dans une ruelle de Naples, où des hommes s'entraident sous le regard de la Vierge.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Les Sept Œuvres de Miséricorde du Caravage : Scènes de rue par une nuit sombre","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Les Sept Œuvres de Miséricorde du Caravage (1607) : la scène entière, avec les gens en bas et la Vierge à l'Enfant en haut."}},{"p":"1607","t":"La flagellation","x":"Pour la famille de Franchis, juristes et magistrats, Caravage peignit la Flagellation du Christ en 1607, pour leur chapelle dans l'église San Domenico Maggiore : une toile de près de trois mètres de haut, l'un des chefs-d'œuvre du baroque napolitain.\n\nAujourd'hui, l'original se trouve au musée de Capodimonte, où il a été déplacé pour des raisons de sécurité ; une copie est conservée à San Domenico Maggiore. Capodimonte ne fait pas partie de nos circuits pédestres.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La Flagellation du Christ du Caravage : Jésus attaché à la colonne parmi les bourreaux","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellation du Christ (1607), aujourd'hui au musée de Capodimonte : la lumière se pose sur le corps de Jésus, attaché à la colonne."}},{"p":"1607–1609","t":"Malte et la Sicile","x":"Les 12 et 13 juillet 1607, Caravage arriva à Malte, probablement à bord d'une galère de chevaliers partie de Naples. Mais là aussi, il rencontra des difficultés : après une rixe, il fut arrêté en août 1608, s'évada du fort où il était détenu et se réfugia à Syracuse, en Sicile.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"La Décollation de saint Jean-Baptiste par Caravage","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"La Décollation de saint Jean-Baptiste, peinte par Caravage à Malte et conservée à La Valette."}},{"p":"Octobre 1609","t":"L'embuscade de Cerriglio","x":"À l'automne 1609, il retourna à Naples, toujours sous la protection de la famille Colonna, espérant le pardon du pape pour pouvoir retourner à Rome.\n\nEn octobre, il fut attaqué par quatre hommes devant la taverne Cerriglio, une auberge célèbre de l'époque, et défiguré au visage : la blessure était si grave que la nouvelle de sa mort se répandit à Rome.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Portrait à la craie du Caravage","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Caravage dans le portrait d'Ottavio Leoni, le visage de l'homme attaqué à Cerriglio."}},{"p":"1610","t":"Le dernier tableau","x":"Au printemps 1610, il peignit le Martyre de sainte Ursule pour le prince génois Marcantonio Doria : la toile, achevée en mai, fut livrée encore vernie et expédiée à Gênes. Il s’agit du dernier tableau du Caravage connu à ce jour, et il est aujourd’hui exposé aux Gallerie d’Italia, Via Toledo, à six minutes de Ceraldi. Parmi les visages figurant derrière la sainte se trouve le sien.\n\nCet été-là, il embarqua pour Rome avec des tableaux, espérant obtenir le pardon. Arrêté par erreur à Palo, il repartit avec les œuvres. Il mourut à Porto Ercole le 18 juillet 1610 (ou peut-être le lendemain), à l'âge de 38 ans.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Le Martyre de sainte Ursule par Caravage : la sainte et le roi au moment de la flèche","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Le martyre de sainte Ursule (1610) : le roi frappe la sainte avec une flèche, à bout portant."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Naples en cinq minutes : de la sirène à la ville nouvelle","sub":"","som":"D'abord Partenope, puis Neapolis : car le centre historique est encore conçu comme une ville grecque.","txt":"Naples a été fondée deux fois. La première fois, elle s'appelait Partenope, comme la sirène mythique : elle fut fondée au VIIe siècle avant J.-C. par des colons d'origine grecque venus de Cumes, qui débarquèrent sur l'îlot de Megaride, où se dresse aujourd'hui le Castel dell'Ovo, et s'installèrent sur le mont Echia, tout proche.\n\nLa seconde fois, vers 470 av. J.-C., une nouvelle ville surgit à côté de l'ancienne : Neapolis, qui signifie « ville nouvelle » en grec. C'est celle que vous traversez actuellement. Ses rues forment un quadrillage régulier qui, après vingt-cinq siècles, reste parfaitement lisible : le centre historique de Naples est inscrit au patrimoine mondial de l'UNESCO précisément parce que l'organisation de la ville grecque en est restée l'élément central.\n\nTrois rues parallèles, les decumani, traversent la ville d'ouest en est. La plus basse est Spaccanapoli : longue d'environ deux kilomètres, elle est si rectiligne que, vue d'en haut, elle semble la couper en deux, d'où son nom. Au centre se trouve la Via dei Tribunali, le decumanus principal ; plus haut se trouvent la Via dell'Anticaglia et la Via della Sapienza, le decumanus supérieur.\n\nDe Piazza Carità, où nous sommes présents depuis 2002, commence Spaccanapoli à quelques minutes à pied, sur la Piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Le centre historique de Naples vu du ciel","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Le centre historique vu du ciel : les rues rectilignes sont encore celles de la ville grecque."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro et le sang fondant","sub":"","som":"Trois fois par an, Naples retient son souffle devant une fiole. Que se passe-t-il ? Où ? Et que disent l’Église et la science à ce sujet ?","txt":"Dans la cathédrale de Naples, dans une niche de la chapelle du Trésor, est conservée une fiole contenant une substance sombre, que la tradition considère comme le sang de saint Gennaro, saint patron de la ville. Trois fois par an – le samedi précédant le premier dimanche de mai, le 19 septembre (jour de sa fête) et le 16 décembre – la fiole est montrée aux fidèles : si son contenu, généralement solide, se dissout, c’est un signe de réjouissance ; s’il reste solide, pour de nombreux Napolitains, c’est un mauvais présage.\n\nLa première trace connue de la liquéfaction remonte à 1389. Les reliques ne sont pas gardées par le clergé mais par la Députation de la Chapelle du Trésor de San Gennaro, une institution laïque fondée en 1601, qui comprend également le maire de Naples.\n\nL'Église adopte une position prudente : elle parle d'un « événement miraculeux », autorise la dévotion populaire, mais ne l'impose pas comme vérité de foi. Parmi les explications avancées par les sceptiques figure la thixotropie, propriété de certaines substances solides au repos qui deviennent liquides lorsqu'elles sont agitées.\n\nLe sacré et le profane ont toujours coexisté ici : Via Duomo, à quelques pas de la cathédrale, l'artiste de rue Jorit a peint un San Gennaro avec le visage d'un ouvrier.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"Le dôme de la chapelle du Trésor de San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"La chapelle du Trésor de San Gennaro, dans la cathédrale, où est conservée l'ampoule."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Naples en sept traditions : du Panaro au miracle de San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Les Pauvres Âmes : Quand Naples a adopté un crâne","sub":"","som":"Ossuaires, capuzzelle et prières échangées contre des numéros de loterie : le culte des morts sans nom.","txt":"Pendant des siècles, à Naples, les morts anonymes n'ont pas été laissés à l'abandon. On les appelait « anime pezzentelle » : les pauvres âmes décédées sans funérailles et sans que personne ne prie pour elles. Ce nom est lié à « pezzente », le pauvre, mais aussi au latin « petere », demander pour recevoir : ceux qui priaient pour eux espéraient recevoir en retour protection et grâce.\n\nLe lieu symbolique est le cimetière Fontanelle, dans le quartier de Sanità : une ancienne carrière de tuf du XVIe siècle d’environ quatre mille mètres carrés, qui accueillit les victimes de la peste de 1656 puis celles du choléra en 1836-1837. En 1872, le chanoine Gaetano Barbati disposa les ossements dans trois nefs. Les fidèles « adoptaient » un crâne, une capuzzella : ils le nettoyaient, le plaçaient dans un petit reliquaire, l’ornaient de chapelets et de pièces de monnaie, et priaient devant lui, attendant un signe en rêve, parfois un numéro de loterie. Certains crânes devinrent célèbres : le Capitaine, à l’orbite noircie, sujet d’une légende de mariage et de jalousie ; Donna Concetta, qui, dit-on, « transpire » lorsqu’une grâce est accordée.\n\nEn 1969, un décret du tribunal ecclésiastique a fermé l'ossuaire et interdit le culte. Fermé pour rénovation depuis 2020, le cimetière a rouvert ses portes au public en 2026, géré par la coopérative La Paranza.\n\nLe culte perdure également sous la Via dei Tribunali, dans l'hypogée de Santa Maria delle Anime del Purgatorio ad Arco, l'église que les Napolitains appellent « e cape 'e morte » : on y conserve le crâne de Lucia, une jeune âme particulièrement vénérée. Et sur la Via San Biagio dei Librai, dans la petite église de Santa Luciella, se trouve un crâne unique : celui qui possède des oreilles.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Crânes des pauvres âmes","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Les capuzzelle de pauvres âmes."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Naples ésotérique : un prince alchimiste, une façade codée et un œuf magique","sub":"","som":"Raimondo di Sangro, le vestige du Gesù Nuovo, l'œuf de Virgile, le munaciello : là où l'histoire s'arrête et où la légende commence.","txt":"Naples adore les mystères, et certains sont particulièrement fascinants. Le plus célèbre porte un nom : Raimondo di Sangro, prince de Sansevero, homme du XVIIIe siècle, grand maître de la franc-maçonnerie napolitaine, était un inventeur jaloux de ses propres secrets. Le mythe l’entourait déjà de son vivant, et il l’alimentait lui-même. Benedetto Croce le qualifiait d’incarnation napolitaine du Docteur Faust. La légende noire lui attribue tous les crimes : des serviteurs assassinés pour étudier leurs corps, et même l’aveuglement du sculpteur du Christ voilé pour l’empêcher d’en sculpter un autre. Ce ne sont que des légendes, et le musée lui-même les distingue de l’histoire officielle.\n\nLe Christ voilé est l'œuvre de Giuseppe Sanmartino, commandée par le prince : le voile transparent qui recouvre le corps est taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine de la chapelle se trouvent les « machines anatomiques », deux squelettes aux systèmes circulatoires reconstitués, créés par le médecin palermitain Giuseppe Salerno entre 1756 et 1764 environ. La légende raconte qu'ils impliquèrent de mystérieuses injections et des études sur la cire d'abeille et les colorants.\n\nNon loin de là, la façade du Gesù Nuovo, ancien palais Sanseverino datant de 1470, est revêtue d'un parement pyramidal de pierre de Piperno sombre. Certaines pierres portent des inscriptions gravées : la légende veut qu'il s'agisse d'un message secret ; certains érudits y voient les marques des tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique, une partition d'environ trois quarts d'heure intitulée « Énigme ». Une hypothèse séduisante, mais non une certitude.\n\nEt puis il y a la mer : selon la légende, le poète Virgile aurait caché l’œuf de la sirène Partenope dans les caves du Castel dell’Ovo. Tant que l’œuf restera intact, le château restera debout.\n\nDans les maisons, cependant, vivent les esprits de la tradition populaire : le munaciello, un elfe à capuche qui porte chance ou malice selon la façon dont on le traite, et la bella 'mbriana, un bon esprit de la maison, qui peut apparaître sous la forme d'un papillon ou d'un gecko.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La façade en forme de losange du Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"La pierre de taille à pointe de diamant du Gesù Nuovo, la « façade codée »."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples aujourd'hui : quoi de neuf ?","sub":"","som":"La place dédiée à Maradona, le street art, le dernier Caravage sur la Via Toledo, les églises et les ossuaires rouverts : une ville en pleine mutation.","txt":"Ceux qui retournent à Naples après quelques années découvrent une ville qui a appris à raconter son histoire.\n\nDans le Quartier espagnol, à neuf minutes d'ici, se trouve Largo Maradona. La fresque de Diego Maradona, peinte en 1990 par Mario Filardi, s'est estompée au fil des ans, jusqu'à presque disparaître. Elle a ensuite été restaurée grâce à Salvatore Iodice, puis, à l'automne 2017, l'Argentin Francisco Bosoletti a repeint son visage. Après la mort de Maradona, le 25 novembre 2020, la place, autrefois appelée place des artistes, est devenue un lieu de recueillement laïque, orné de petits autels, de drapeaux argentins et de photographies, si populaire que la municipalité a dû réguler la circulation des piétons.\n\nLe street art a investi le centre historique : sur la Piazzetta dei Girolamini, protégée par une vitre, se dresse la Madone au pistolet de Banksy ; sur la Via Duomo, le San Gennaro le Travailleur de Jorit. Le site web officiel du tourisme de la ville leur consacre un itinéraire.\n\nSur la Via Toledo, à six minutes d'ici, les Gallerie d'Italia abritent le Martyre de sainte Ursule, la dernière toile du Caravage, ainsi que plus de cinq cents vases attiques et de Grande-Grèce.\n\nEt des lieux fermés depuis longtemps rouvrent leurs portes : l’église Santa Luciella ai Librai, abandonnée depuis plus de trente ans, a rouvert au public le 5 avril 2019 ; le cimetière Fontanelle a rouvert en 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"La fresque de Maradona dans le quartier espagnol","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, l'un des visages du Naples d'aujourd'hui."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famou     .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
  return {data: p.year + '-' + p.month + '-' + p.day, gs: {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7}[p.weekday], min: (+p.hour) * 60 + (+p.minute)};
}
function hm(s){ var x = s.split(':'); return (+x[0]) * 60 + (+x[1]); }
function fmt(m){ m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function nomeGiorno(g, lungo){ return new Intl.DateTimeFormat(D.lingua, {weekday: lungo ? 'long' : 'short', timeZone: 'UTC'}).format(new Date(Date.UTC(2024, 0, g))); }
function dataLunga(s){ return new Intl.DateTimeFormat(D.lingua, {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'}).format(new Date(s + 'T12:00:00Z')); }
function verificati(l, ora){ return !!(l.ov && l.ovi) && (Date.parse(ora.data) - Date.parse(l.ovi)) / 864e5 <= SCADENZA_GIORNI; }
function fasce(l, data, gs){ return l.or.filter(function(o){ return o.g && o.g.indexOf(gs) >= 0 && (!o.dal || o.dal <= data) && (!o.al || o.al >= data); }); }
function stato(l, ora, minuto){
  if(l.sa) return {k: 'sempre'};
  if(!verificati(l, ora)) return {k: 'verifica'};
  var fs = fasce(l, ora.data, ora.gs);
  if(fs.some(function(o){ return o.x; })) return {k: 'chiuso_oggi'};
  fs = fs.filter(function(o){ return o.da && o.a; }).sort(function(a, b){ return hm(a.da) - hm(b.da); });
  if(!fs.length) return {k: 'chiuso_oggi'};
  for(var i = 0; i < fs.length; i++){
    var da = hm(fs[i].da), a = hm(fs[i].a), ui = fs[i].ui ? hm(fs[i].ui) : a;
    if(minuto < da) return {k: 'apre', da: fs[i].da};
    if(minuto < a) return minuto <= ui ? {k: 'aperto', a: fs[i].a, ui: fs[i].ui} : {k: 'chiuso_ora'};
  }
  return {k: 'chiuso_ora'};
}
function chiusoA(s, minuto){ return s.k === 'chiuso_oggi' || s.k === 'chiuso_ora' || (s.k === 'apre' && hm(s.da) - minuto > 30); }
function etichetta(s){
  switch(s.k){
    case 'sempre': return '<span class="stato ok">' + e(T.sempre) + '</span>';
    case 'verifica': return '<span class="stato att">' + e(T.in_verifica) + '</span>';
    case 'aperto': return '<span class="stato ok">' + e(T.aperto) + ' · ' + e(T.chiude_alle) + ' ' + e(s.a) + '</span>' + (s.ui ? ' <span class="piccolo">' + e(T.ultimo_ingresso) + ' ' + e(s.ui) + '</span>' : '');
    case 'apre': return '<span class="stato att">' + e(T.apre_alle) + ' ' + e(s.da) + '</span>';
    case 'chiuso_ora': return '<span class="stato ko">' + e(T.chiuso_ora) + '</span>';
    default: return '<span class="stato ko">' + e(T.chiuso_oggi) + '</span>';
  }
}
function durata(m){ if(!m) return ''; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : m + ' ' + T.min; }
function km(m){ return m ? (m / 1000).toLocaleString(D.lingua, {maximumFractionDigits: 1}) + ' ' + T.km : ''; }

function schizzo(i){ /* disegno del percorso reale per la scheda dell'itinerario (leggero, senza mappa) */
  var pts = [], KX = 84300, KY = 111000;
  i.tappe.forEach(function(t){ (t.geo || []).forEach(function(c){ pts.push([(c[0] - 14.24) * KX, (40.86 - c[1]) * KY]); }); });
  if(pts.length < 2) return '';
  var x0 = Math.min.apply(0, pts.map(function(p){ return p[0]; })), x1 = Math.max.apply(0, pts.map(function(p){ return p[0]; }));
  var y0 = Math.min.apply(0, pts.map(function(p){ return p[1]; })), y1 = Math.max.apply(0, pts.map(function(p){ return p[1]; }));
  var pad = 60, w = x1 - x0 + 2 * pad, h = Math.max(y1 - y0 + 2 * pad, w * 0.45);
  var h2 = '<svg viewBox="' + [x0 - pad, y0 - pad - (h - (y1 - y0 + 2 * pad)) / 2, w, h].map(Math.round).join(' ') + '" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:220px;background:var(--accento-chiaro)" aria-hidden="true">';
  i.tappe.forEach(function(t){ if(t.geo) h2 += '<polyline points="' + t.geo.map(function(c){ return ((c[0] - 14.24) * KX).toFixed(0) + ',' + ((40.86 - c[1]) * KY).toFixed(0); }).join(' ') + '" fill="none" stroke="var(--scuro)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'; });
  var k = 0; i.tappe.forEach(function(t, n){ var l = LU[t.l]; if(n === i.tappe.length - 1 && casa(l)) return; var x = (l.lon - 14.24) * KX, y = (40.86 - l.lat) * KY, c = casa(l);
    h2 += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="30" fill="' + (c ? 'var(--accento)' : 'var(--scuro)') + '" stroke="var(--superficie)" stroke-width="8"/><text x="' + x.toFixed(0) + '" y="' + (y + 11).toFixed(0) + '" text-anchor="middle" font-size="32" font-family="Jost,system-ui,sans-serif" font-weight="500" fill="var(--su-scuro)">' + (c ? 'C' : ++k) + '</text>'; });
  return h2 + '</svg>';
}

/* ---------- copertina dell'itinerario: una mappa vera (stessi tasselli della guida, senza rete esterna) fotografata una volta,
   con il percorso e le foto piccole dei luoghi sopra. Il disegno leggero resta sotto finché la mappa non è pronta (e se la mappa non si carica). */
var COPERTINE = {}, codaCopertine = [], copertinaInCorso = false, inCoda = {};
function copertina(i){ return '<span class="copertina-giro" data-giro="' + e(i.s) + '">' + schizzo(i) + '</span>'; }
function preparaCopertine(){ document.querySelectorAll('.copertina-giro[data-giro]').forEach(function(el){ var i = IT[el.getAttribute('data-giro')]; if(!i) return;
  var w = Math.round(el.clientWidth); if(!w) return; var k = i.s + '@' + w;
  if(COPERTINE[k]) return mettiCopertina(el, COPERTINE[k], true);
  if(!inCoda[k]){ inCoda[k] = 1; codaCopertine.push({i: i, w: w, k: k}); } }); prossimaCopertina(); }
function mettiCopertina(el, c, subito){ if(el.querySelector('img.fondo')) return; if(subito) el.classList.add('pronta');
  var h = '<img class="fondo" alt="" src="' + c.img + '">' + c.pin.map(function(p){ return '<span class="pin ' + p.cl + '" style="left:' + p.x + '%;top:' + p.y + '%">' + p.h + '</span>'; }).join('') + '<span class="osm">© OpenStreetMap</span>';
  el.insertAdjacentHTML('beforeend', h); requestAnimationFrame(function(){ el.classList.add('pronta'); }); }
function prossimaCopertina(){ if(copertinaInCorso || !codaCopertine.length) return; var job = codaCopertine.shift(); copertinaInCorso = true;
  var fine = function(){ delete inCoda[job.k]; copertinaInCorso = false; prossimaCopertina(); };
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var H = 220, box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-12000px;top:0;width:' + job.w + 'px;height:' + H + 'px';
    document.body.appendChild(box);
    var m = new maplibregl.Map({container: box, style: r[1], interactive: false, attributionControl: false, fadeDuration: 0, canvasContextAttributes: {preserveDrawingBuffer: true}, preserveDrawingBuffer: true, center: [14.2532, 40.8475], zoom: 14});
    var b = new maplibregl.LngLatBounds(), linee = [];
    job.i.tappe.forEach(function(t){ var l = LU[t.l]; b.extend([l.lon, l.lat]); if(t.geo){ linee.push(t.geo); t.geo.forEach(function(c){ b.extend(c); }); } });
    m.fitBounds(b, {padding: {top: 46, bottom: 40, left: 44, right: 44}, maxZoom: 16, duration: 0});
    var chiuso = false, chiudi = function(){ if(chiuso) return; chiuso = true; try{ m.remove(); }catch(x){} box.remove(); fine(); };
    var timer = setTimeout(chiudi, 15000);
    m.on('load', function(){
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addSource('p', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(c){ return {type: 'Feature', properties: {}, geometry: {type: 'LineString', coordinates: c}}; })}});
      m.addLayer({id: 'pb', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': 7}});
      m.addLayer({id: 'pl', type: 'line', source: 'p', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': scuro, 'line-width': 4}});
      m.once('idle', function(){
        try{
          var img = m.getCanvas().toDataURL('image/jpeg', 0.82), pin = [], k = 0, conFoto = [];
          /* foto piccole solo dove c'è spazio (almeno 50 px dalle altre foto): nei vicoli fitti le tappe vicine restano un pallino numerato */
          job.i.tappe.forEach(function(t, n){ var l = LU[t.l], c = casa(l); if(n === job.i.tappe.length - 1 && c) return;
            var q = m.project([l.lon, l.lat]), x = Math.round(q.x / job.w * 1000) / 10, y = Math.round(q.y / H * 1000) / 10;
            if(c){ pin.push({cl: 'punto casa', x: x, y: y, h: 'C'}); return; }
            k++;
            var libero = conFoto.every(function(o){ return Math.hypot(o[0] - q.x, o[1] - q.y) >= 50; });
            if(l.foto && libero){ conFoto.push([q.x, q.y]); pin.push({cl: '', x: x, y: y, h: '<img alt="" src="' + e(l.foto.u) + '"><b>' + k + '</b>'}); }
            else pin.push({cl: 'punto', x: x, y: y, h: String(k)}); });
          pin.sort(function(a, b){ return (a.cl === '' ? 1 : 0) - (b.cl === '' ? 1 : 0); }); /* le foto sopra i pallini */
          COPERTINE[job.k] = {img: img, pin: pin};
          document.querySelectorAll('.copertina-giro[data-giro="' + job.i.s + '"]').forEach(function(el){ if(Math.round(el.clientWidth) === job.w) mettiCopertina(el, COPERTINE[job.k]); });
        }catch(x){}
        clearTimeout(timer); chiudi(); });
    });
    m.on('error', function(){});
  }).catch(fine);
}

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null, GEO = {}; window.MAPPE = {};
function caricaMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return mlPromessa || (mlPromessa = new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = PRE + 'mappa/maplibre-gl.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }));
}
function stile(){ var base = new URL(PRE + 'mappa/', location.href).href;
  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"')); }); }
/* opz: punti [{t,n,lat,lon,h,casa,spento}], linee [{c:coordinate, s:'fatto'|'ora'|'poi'|''}], geo (controllo «tu sei qui»), dopo(m) */
function mappa(id, opz){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18, maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}});
    MAPPE[id] = m;
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    if(opz.geo){
      var g = new maplibregl.GeolocateControl({positionOptions: {enableHighAccuracy: true, timeout: 15000}, trackUserLocation: true, fitBoundsOptions: {maxZoom: 17}});
      m.addControl(g, 'top-right'); GEO[id] = g;
      var msg = document.getElementById(id + '-msg');
      g.on('error', function(){ if(msg){ msg.textContent = T.pos_negata; msg.hidden = false; } });
      g.on('outofmaxbounds', function(){ if(msg){ msg.textContent = T.fuori_zona; msg.hidden = false; } });
      g.on('geolocate', function(){ if(msg) msg.hidden = true; });
    }
    var b = new maplibregl.LngLatBounds(), linee = opz.linee || [];
    if(linee.length) m.on('load', function(){
      m.addSource('percorso', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(x){ return {type: 'Feature', properties: {s: x.s || ''}, geometry: {type: 'LineString', coordinates: x.c}}; })}});
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addLayer({id: 'percorso-bordo', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': ['match', ['get', 's'], 'ora', 12, 9]}});
      m.addLayer({id: 'percorso', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'},
        paint: {'line-color': ['match', ['get', 's'], 'fatto', '#9a958c', scuro], 'line-width': ['match', ['get', 's'], 'ora', 7, 5], 'line-opacity': ['match', ['get', 's'], 'poi', 0.45, 1]}});
    });
    linee.forEach(function(x){ x.c.forEach(function(p){ b.extend(p); }); });
    (opz.punti || []).forEach(function(p){
      var d = document.createElement('a'); d.className = 'pin' + (p.casa ? ' casa' : '') + (p.spento ? ' spento' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(!b.isEmpty() && ((opz.punti || []).length > 1 || linee.length)) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0});
    else if(!b.isEmpty()) m.jumpTo({center: b.getCenter(), zoom: 16});
    if(opz.dopo) opz.dopo(m);
  }).catch(function(){ el.innerHTML = ''; });
}

    '<p class="avviso prova" id="' + id + '-msg" hidden></p><p class="piccolo">' + e(T.privacy_pos) + '</p>');

function portami(l){ return /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'https://maps.apple.com/?daddr=' + l.lat + ',' + l.lon + '&dirflg=w' : 'https://www.google.com/maps/dir/?api=1&destination=' + l.lat + ',' + l.lon + '&travelmode=walking'; }
function frase(x, arrivo){
  if(x.k === 'arrivo') return e(T.arrivo) + ' · ' + e(arrivo);
  return e(x.k === 'parti' ? T.parti : (T[x.m] || T.straight)) + (x.n ? ' · ' + e(x.n) : '');
}
function indicazione(x, arrivo){ return frase(x, arrivo) + (x.d && x.k !== 'arrivo' ? ' <span class="piccolo">— ' + x.d + ' m</span>' : ''); }

  if(x.k === 'arrivo') return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>';
  var r = {left: -90, 'slight left': -40, 'sharp left': -130, right: 90, 'slight right': 40, 'sharp right': 130, uturn: 180}[x.m] || 0;
  return '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(' + r + 'deg)"><path d="M12 20 L12 5 M6 11 L12 5 L18 11"/></svg>';

function puntiItinerario(i, k){ var n = 0, visti = {}, out = [];
  i.tappe.forEach(function(t, j){ var l = LU[t.l]; if(visti[l.id] || l.lat == null) return; visti[l.id] = 1;
    out.push({t: casa(l) ? 'C' : String(++n), n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l), spento: k != null && j < k && !casa(l)}); });
  return out; }

/* ---------- audio: voce del telefono (gratuita, senza rete) ---------- */
function ascolta(l, btn){
  try{
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn) btn.textContent = '▶ ' + T.ascolta; return; }
    var parti = [l.n, l.som].concat((l.dett || []).map(function(x){ return x.t + '. ' + (x.d ? x.d + '. ' : '') + x.x; }), [l.rac, l.leg]);
    var u = new SpeechSynthesisUtterance(parti.filter(Boolean).join('. '));
    u.lang = VOCE[D.lingua] || D.lingua; u.onend = function(){ if(btn) btn.textContent = '▶ ' + T.ascolta; };
    speechSynthesis.speak(u); if(btn) btn.textContent = '■ ' + T.ferma;
  }catch(x){}
}

/* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;
function xy(c){ return [(c[0] - 14.25) * KXm, (c[1] - 40.85) * KYm]; }
function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */
  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;

  }
  var ult = 0; Object.keys(tt).forEach(function(k){ if(tt[k] > 1 && tt[k] > ult) ult = tt[k]; });

    else m.textContent = T.pass_no_risp;

V.passaporto = function(){

V.luogo = function(s){
