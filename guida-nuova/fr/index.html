BW_2013-05-16_11-47-11.jpg","dida":"San Lorenzo Maggiore, donnant sur la piazza San Gaetano."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:30","ui":"17:30","n":"Horaires indicatifs, à confirmer sur le site officiel avant la visite."}],"fonti":[{"t":"Scabec – Complesso di San Lorenzo Maggiore","u":"https://www.scabec.it/en/luoghi/complesso-di-san-lorenzo-maggiore"},{"t":"museionline – Scavi di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/scavi-archeologici-di-san-lorenzo-maggiore"},{"t":"museionline – Basilica di San Lorenzo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-lorenzo-maggiore-napoli"},{"t":"History Hit – San Lorenzo Maggiore","u":"https://www.historyhit.com/locations/san-lorenzo-maggiore/"}],"ant":true,"dett":[{"t":"Le marché sous l'église","x":"Les fouilles révèlent le macellum de la Neapolis gréco-romaine, le marché qui s'élevait le long de l'ancien decumanus maximus. Elles se trouvent à environ dix mètres sous l'église. En marchant parmi les structures, on reconnaît la rue et les pièces où l'on vendait et où l'on faisait commerce : c'est un morceau de ville antique encore à sa place, au-dessus duquel Naples a continué à construire.","d":"Sous la nef, dans les fouilles","foto":{"u":"../img/ab890c42a731.jpg","alt":"Une rue romaine dans les fouilles sous San Lorenzo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ScavidiSanLorenzo2.jpg","dida":"Les fouilles sous San Lorenzo Maggiore : la rue et les boutiques de la ville antique."}},{"t":"Le maître-autel de Giovanni da Nola","x":"Le maître-autel est une œuvre de la Renaissance du sculpteur napolitain Giovanni da Nola, parmi les plus belles de Naples. L'abside qui l'abrite est la partie la plus ancienne de l'église.","d":"Au fond de l'église, dans l'abside","foto":{"u":"../img/3692771c5f21.jpg","alt":"L'abside gothique de San Lorenzo Maggiore avec le maître-autel","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Lorenzo_Maggiore._(6146).jpg","dida":"L'abside de San Lorenzo Maggiore avec le maître-autel."}},{"t":"Le Museo dell'Opera","x":"Le musée occupe les salles du couvent et la tour civique à côté de la basilique. Il expose du mobilier, des costumes et des collections, et présente l'histoire de Naples de l'époque classique au XIXe siècle.","d":"Dans le couvent, à côté de la basilique","foto":{"u":"../img/591ff764e679.jpg","alt":"Une salle du musée dans le complexe de San Lorenzo Maggiore","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Complesso_di_San_Lorenzo_Maggiore4.jpg","dida":"Les salles du couvent de San Lorenzo Maggiore qui abritent le Museo dell'Opera."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, l'église des capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"L'église des capuzzelle : sous le pavement, l'hypogée où Naples priait pour les âmes sans nom. Et le crâne de Lucia.","rac":"Les Napolitains l'appellent « 'e cape 'e morte », l'église des têtes de mort. C'est une petite église du XVIIe siècle sur le Decumano Maggiore, liée à la dévotion aux âmes du Purgatoire diffusée par la Contre-Réforme. Un escalier raide mène à l'hypogée, l'église souterraine, agrandie et décorée de majoliques au XVIIIe siècle : ici, les fidèles prenaient soin de restes anonymes et leur demandaient leur intercession. Au fond d'un petit couloir est conservé le crâne de Lucia, une jeune âme particulièrement aimée.","con":"Derrière l'autel, cherchez le crâne ailé en marbre de Dionisio Lazzari : c'est le symbole de l'église.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La façade de Purgatorio ad Arco sur la Via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La façade de Purgatorio ad Arco, sur le Decumano Maggiore."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"17:00","ui":"16:15","n":"Église haute, hypogée et musée. Visites guidées incluses dans le billet, sur réservation."},{"g":[7],"da":"10:00","a":"14:00","ui":"13:15","n":"Église haute, hypogée et musée."}],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Complesso monumentale Purgatorio ad Arco","u":"https://purgatorioadarco.it/"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"}],"ant":true,"dett":[{"t":"Les peintures du XVIIe siècle","x":"Avant de descendre, regardez bien l'église du dessus. Elle fut commandée en 1616 par la confrérie laïque « Opera Pia Purgatorio ad Arco » à l'architecte Giovan Cola di Franco et consacrée en 1638.\n\nElle fut conçue sur deux niveaux : l'église supérieure, qui représente la dimension terrestre, et en dessous l'hypogée, le cimetière, qui représente concrètement le Purgatoire. Toute la décoration rappelle à ceux qui entrent que les âmes attendent une prière pour monter au Paradis.\n\nOn y trouve des marbres précieux et des peintures de trois grands maîtres du XVIIe siècle napolitain : Massimo Stanzione, Luca Giordano et Andrea Vaccaro. Dans la sacristie et l'oratoire, il y a aussi un petit musée avec des pièces d'argenterie, des ornements liturgiques, des manuscrits et des tableaux réalisés pour la confrérie entre le XVIIe et le XIXe siècle.","d":"Dans l'église supérieure","foto":{"u":"../img/a8b34654121a.jpg","alt":"Un tombeau en marbre du XVIIe siècle dans l'église supérieure","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_purgatorio_ad_arco%2C_interno%2C_sepolcro_di_pietro_antonio_mastrilli%2C_1607%2C_01.jpg","dida":"Dans l'église supérieure : le tombeau de Pietro Antonio Mastrilli (1607), parmi les marbres et les peintures du XVIIe siècle."}},{"t":"Le crâne ailé","x":"Parmi les marbres de l'église supérieure se trouve le célèbre crâne ailé de Dionisio Lazzari : un crâne muni d'ailes, qui résume l'esprit du lieu. Ici, la mort ne fait pas peur : elle devient une occasion de prière et de lien avec ceux qui ne sont plus là.\n\nCe n'est pas un hasard si les Napolitains appellent cette église « 'e cape 'e morte », celle des crânes.\n\nLe message était voulu : dans l'église née de la Contre-Réforme, tout devait rappeler aux passants et aux fidèles que les âmes du Purgatoire attendaient une prière pour monter au Paradis.","d":"Dans l'église supérieure","foto":{"u":"../img/63d1e885c193.jpg","alt":"Un bas-relief en marbre représentant un crâne ailé et couronné","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/32009670444","dida":"Le crâne ailé et couronné en bas-relief de marbre, première moitié du XVIIe siècle : le symbole de l'église."}},{"t":"L'hypogée des âmes","x":"La vraie église est celle du dessous. Par une ouverture dans le sol de l'église supérieure, on descend de hautes marches et l'on arrive dans une grande salle nue : une véritable église inférieure.\n\nAu centre du sol se trouve une grande tombe anonyme, entourée de chaînes noires et éclairée par quelques ampoules. Le long des murs, il y a des niches, de petits autels et des vitrines : ce sont les signes d'un culte né ici spontanément dès le XVIIe siècle, lorsque les fidèles prenaient soin de restes humains sans nom et leur demandaient protection. Au fond se trouve l'ancien autel du XVIIe siècle avec de grandes croix noires.\n\nDescends doucement : c'est un lieu de dévotion encore vivante, pas seulement de curiosité. Visite guidée en italien incluse dans le billet, sur réservation.","d":"Sous l'église, en descendant un escalier raide","foto":{"u":"../img/7fc480d05134.jpg","alt":"L'hypogée de Purgatorio ad Arco avec ses autels et ses lumignons","aut":"Inviaggiocommons","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ipogeo_Purgatorio_ad_Arco.jpg","dida":"L'hypogée, l'église du dessous : autels, lumignons et témoignages du culte des âmes."}},{"t":"Le crâne de Lucia","x":"Parmi tous les crânes de l'hypogée, il y en a un particulièrement aimé : celui de Lucia, considéré comme l'âme d'une jeune fille. Il est conservé au fond d'un petit couloir.\n\nC'est le témoignage le plus touchant du culte des âmes du Purgatoire, né ici spontanément dès le XVIIe siècle : les dévots choisissent un reste sans nom, en prennent soin et lui demandent protection.\n\nRegarde-la avec respect : pour beaucoup de Napolitains, elle est encore aujourd'hui une présence vers laquelle se tourner.","d":"Dans l'hypogée, au fond d'un petit couloir","foto":{"u":"../img/d51d785835b3.jpg","alt":"Un crâne de bronze entre les barreaux de la grille en fer de l'église","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_01.jpg","dida":"Un crâne de bronze sur la grille en fer de l'église de Purgatorio ad Arco."}}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Une image des âmes du Purgatoire au milieu des flammes à l'intérieur de l'église","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"À l'intérieur de l'église : les âmes du Purgatoire au milieu des flammes, le thème de tout le lieu."},{"u":"../img/de63b1b83fa8.jpg","alt":"Un crâne en bronze sur une petite colonne","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un crâne en bronze : le symbole de l'église des « capuzzelle »."}],"leg":"","fc":null,"col":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Quarante mètres sous la Via dei Tribunali : les citernes qui ont fourni l'eau à Naples pendant des siècles, les abris de la guerre et un théâtre romain caché sous le lit d'une maison.","rac":"Sous le centre historique se cache une autre ville. Depuis la Piazza San Gaetano, on descend plus de cent marches jusqu'à environ 40 mètres de profondeur, le long d'un parcours qui traverse l'aqueduc gréco-romain et des galeries d'époque médiévale, bourbonienne et moderne.\n\nLes cavités d'époque grecque ont servi de citernes pour l'eau de la ville pendant environ 23 siècles. Pendant la Seconde Guerre mondiale, ces mêmes espaces sont devenus des abris antiaériens.\n\nLa visite souterraine est guidée et dure environ une heure. Puis on remonte à la surface pour la dernière surprise : les vestiges du théâtre gréco-romain de Neapolis, englobés depuis le XVe siècle dans les maisons du quartier. On entre dans un « basso », une maison au rez-de-chaussée, on déplace un lit et, par une trappe, on descend entre les murs du théâtre.","con":"Chaussures plates et sweat-shirt, même en été : sous terre, il fait humide. Le court passage étroit à la bougie est facultatif. Pour les groupes de 10 personnes et plus, la réservation est obligatoire.","acc":"Non adapté aux fauteuils roulants et aux déambulateurs : il y a des escaliers, avec rampe, et des passages étroits.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Une grande citerne souterraine creusée dans le tuf, faiblement éclairée","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"L'une des grandes citernes creusées dans le tuf, à environ 40 mètres sous la via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Visites guidées au départ toutes les heures de 10 h à 18 h, en italien et en anglais. Le jeudi également à 21 h, uniquement sur réservation et avec au moins 10 personnes."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Les citernes gréco-romaines","x":"On descend 136 marches, basses et confortables, jusqu'à environ 40 mètres sous les rues. Dès le IIIe siècle av. J.-C., les Grecs ouvrirent ici les premières carrières souterraines, pour extraire les blocs de tuf avec lesquels ils construisaient les remparts et les temples de Neapolis.\n\nLes grandes salles creusées dans le tuf devinrent ensuite les citernes d'eau de la ville, reliées par l'aqueduc gréco-romain, et le restèrent pendant environ 23 siècles. Sous le centre historique s'étend un réseau encore mal connu de citernes, de carrières, de galeries et de puits, avec des traces grecques, espagnoles et bourboniennes.\n\nLe long du parcours, vous verrez aussi des choses surprenantes : le laboratoire de la station sismique « Arianna » et les jardins hypogées, de petites cultures à 35 mètres de profondeur, éclairées par des lampes spéciales, étudiées elles aussi par des chercheurs.","d":"Dans la première partie de la visite, à environ 40 mètres de profondeur","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Les parois en tuf d'une citerne souterraine","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Les parois en tuf d'une citerne : pendant environ 23 siècles, l'eau de la ville y a été recueillie."}},{"t":"Le passage à la bougie","x":"Les salles du parcours sont toutes grandes et éclairées, sauf un tronçon très court et étroit : on le parcourt à la lueur des bougies, un par un, en gardant un peu de distance avec la personne qui vous précède.\n\nÀ la fin de la galerie, vous arrivez à la citerne romaine encore pleine d'eau : c'est le moment le plus envoûtant de la visite.\n\nLe passage est facultatif : si vous souffrez de claustrophobie, vous pouvez attendre le groupe à l'extérieur, où il y a des bancs. La bougie n'est pas obligatoire : la lampe torche du téléphone convient aussi.","d":"Le long du parcours souterrain","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Une galerie très étroite éclairée dans le tuf","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"L'une des galeries très étroites creusées dans le tuf."}},{"t":"Les abris de la guerre","x":"Pendant la Seconde Guerre mondiale, les anciennes citernes furent utilisées comme abris antiaériens : c'est ici que les Napolitains descendaient se mettre à l'abri des bombardements.\n\nLe long du parcours se trouve le Musée de la Guerre, avec des objets de ces années-là.\n\nNaples subit plus de cent bombardements aériens, surtout à cause de son port : penser à tous ceux qui se sont réfugiés ici, sous terre, aide à comprendre ce que la ville a traversé.","d":"Le long du parcours souterrain","foto":{"u":"../img/0f4490838101.jpg","alt":"Objets de la Seconde Guerre mondiale exposés sous terre","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Souvenirs de la guerre : des objets de l'époque où ces salles servaient d'abris antiaériens."}},{"t":"Le théâtre sous le lit","x":"La deuxième partie de la visite se déroule en surface, entre la via Anticaglia, le vico Cinquesanti et la via San Paolo. Ici s'élevait le théâtre gréco-romain de Neapolis, appelé aussi théâtre de Néron, car l'empereur s'y produisit.\n\nÀ partir du XVe siècle, des maisons ont été construites sur et dans les murs du théâtre, qui sont ainsi parvenus jusqu'à nous. On entre dans un «basso», une maison typique de plain-pied avec la rue, on déplace le lit et, par une trappe, on descend dans les pièces où, selon la tradition, Néron se préparait pour ses spectacles.\n\nRécemment, une autre partie du théâtre est réapparue dans une ancienne menuiserie : elle accueille aujourd'hui une exposition de vieilles vitrines en bois sombre pour les crèches, et sous le sol sont réapparus des égouts de l'époque des Bourbons réalisés avec des carreaux (riggiole) aux motifs bleus.","d":"Deuxième partie de la visite, en surface, entre via Anticaglia et vico Cinquesanti","foto":{"u":"../img/33425512f471.jpg","alt":"Les arcs en briques qui enjambent la via Anticaglia","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Strada_Anticaglia.jpg","dida":"Les arcs de la via Anticaglia : ce sont les vestiges du théâtre romain de Neapolis, aujourd'hui englobé dans les maisons."}}],"gal":[],"leg":"Selon le récit de la visite, dans les pièces cachées sous le basso (logement de plain-pied), Néron avait ses loges lorsqu'il venait à Naples se produire au théâtre.","fc":"si","col":null},{"id":16,"s":"san-paolo-maggiore","n":"San Paolo Maggiore","tipo":"chiesa","zona":"decumano_maggiore","ind":"Piazza San Gaetano 76, Napoli","lat":40.851398,"lon":14.256924,"mp":18,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Deux colonnes romaines hautes de onze mètres soutiennent encore la façade : ce sont les vestiges du temple des Dioscures.","rac":"Sur la Piazza San Gaetano, au cœur du centre ancien, un escalier mène à une façade soutenue par deux colonnes corinthiennes hautes d'environ onze mètres. Ce sont les vestiges du temple des Dioscures, construit entre le Ier et le IIe siècle apr. J.-C. et considéré comme l'édifice antique le plus important de Naples.\n\nUne première église San Paolo fut construite ici entre le VIIIe et le IXe siècle ; les Théatins la reconstruisirent ensuite, à partir de la seconde moitié du XVIe siècle. Le tremblement de terre de 1688 détruisit une grande partie du temple antique ; l'architecte Arcangelo Guglielmelli intégra les colonnes restantes dans la nouvelle façade. Les bombardements de 1943 endommagèrent l'intérieur, mais la plupart des décorations furent sauvées.\n\nSaint Gaétan de Thiene, fondateur des Théatins, y est enterré.","con":"Observez les colonnes de près, puis entrez : la sacristie ornée de fresques de Solimena est l'un des plus beaux endroits. Les horaires d'ouverture changent : vérifiez avant de venir.","acc":"","foto":{"u":"../img/42ca45a7f6f8.jpg","alt":"Les colonnes corinthiennes du temple romain sur la façade de San Paolo Maggiore","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ColonneDioscuriNapoli.jpg","dida":"Les colonnes corinthiennes du temple des Dioscures sur la façade de San Paolo Maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Touring Club Italiano – Basilica di San Paolo Maggiore","u":"https://www.touringclub.it/destinazioni/napoli/vedere/170535-basilica-di-s-paolo-maggiore"},{"t":"museionline – Basilica di San Paolo Maggiore","u":"https://www.museionline.info/napoli-musei-e-monumenti/basilica-di-san-paolo-maggiore"},{"t":"Touring Club Italiano – scheda visita","u":"https://admin-istituzionale.touringclub.it/uploads/Locandina-Basilica-di-San-Paolo-Maggiore-.pdf"}],"ant":true,"dett":[{"t":"Les colonnes du temple des Dioscures","x":"Les deux colonnes corinthiennes de la façade, hautes d'environ onze mètres, sont tout ce qui reste du temple des Dioscures. Après le tremblement de terre de 1688, l'architecte Arcangelo Guglielmelli les a intégrées à la nouvelle façade. Au-dessus de l'escalier, les statues de saint Pierre et de saint Paul ont été sculptées par Andrea Falcone en 1671.","d":"Sur la façade, en haut de l'escalier","foto":{"u":"../img/951355b4bf10.jpg","alt":"La façade de San Paolo Maggiore avec ses colonnes antiques","aut":"Mongolo1984","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Paolo_Maggiore_%28Napoli%29%2C_facciata_01.jpg","dida":"La façade de San Paolo Maggiore, avec les colonnes du temple des Dioscures."}},{"t":"Le tombeau de saint Gaétan","x":"Saint Gaétan de Thiene est enterré dans cette basilique. Il fut le fondateur des Théatins, l'ordre qui reconstruisit l'église à partir de la seconde moitié du XVIᵉ siècle. Le sanctuaire qui lui est consacré fait partie du plan de l'église.","d":"À l'intérieur de la basilique","foto":{"u":"../img/bf17baf7ec59.jpg","alt":"Le sanctuaire de saint Gaétan de Thiene dans la basilique","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6981308402","dida":"Le sanctuaire de saint Gaétan de Thiene dans la basilique San Paolo Maggiore."}},{"t":"La sacristie de Solimena","x":"La sacristie de la basilique est décorée par Francesco Solimena, l'un des plus grands peintres napolitains du XVIIIᵉ siècle. C'est l'une des plus belles parties de l'église.","d":"Derrière la nef, dans la sacristie","foto":{"u":"../img/4782e44ae33e.jpg","alt":"La sacristie ornée de fresques de Francesco Solimena","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:San_paolo_maggiore%2C_sagrestia_con_affreschi_di_francesco_solimena_%281689-90%29%2C_06.JPG","dida":"La sacristie de San Paolo Maggiore, avec les fresques de Francesco Solimena (1689-90)."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":17,"s":"pio-monte-misericordia","n":"Pio Monte della Misericordia","tipo":"museo","zona":"decumano_maggiore","ind":"Via dei Tribunali 253","lat":40.85196,"lon":14.2602,"mp":20,"dv":40,"gr":false,"sa":false,"sito":"https://www.piomontedellamisericordia.it/","po":"https://piomontedellamisericordia.it/info-e-orari/","som":"Le chef-d'œuvre que le Caravage peignit dès son arrivée à Naples : les Sept Œuvres de miséricorde, toujours sur l'autel pour lequel elles furent réalisées, à quelques pas du Duomo.","rac":"Le Pio Monte della Misericordia fut fondé en 1602 par sept jeunes nobles napolitains pour venir en aide aux personnes en difficulté. Il existe encore aujourd'hui, dans le même palais du XVIIe siècle, sur la Via dei Tribunali, et poursuit son œuvre de charité.\n\nL'église octogonale fut construite entre 1656 et 1671 sur les plans de Francesco Antonio Picchiatti. Sur le maître-autel se trouve la toile qui fait sa renommée dans le monde entier : les Sept Œuvres de miséricorde du Caravage, peinte entre 1606 et 1607 et payée 400 ducats, une somme énorme. Le Caravage était à Naples depuis quelques mois seulement, en fuite de Rome après une condamnation pour meurtre.\n\nLe tableau plut tellement qu'en 1613 la congrégation décida qu'il ne pourrait être vendu « à aucun prix » et resterait pour toujours dans l'église. Tout autour, sur les six autres autels, se trouvent les toiles d'autres maîtres du Seicento napolitain, chacune consacrée à une œuvre de miséricorde. À l'étage se trouve la pinacothèque du Pio Monte.","con":"Billet plein tarif 10 euros, tarif réduit 8 euros. Le palais abrite aussi la petite tribune d'où les gouverneurs du Pio Monte pouvaient regarder la toile d'en haut : demandez si elle est comprise dans la visite.","acc":"","foto":{"u":"../img/9f5b0456685f.jpg","alt":"La coupole octogonale de l'église du Pio Monte della Misericordia vue d'en bas","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_Pio_Monte_della_Misericordia_volta_cupola.jpg","dida":"La coupole de l'église octogonale du Pio Monte della Misericordia, en levant les yeux."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"10:00","a":"18:00","ui":"17:30"},{"g":[7],"da":"09:00","a":"14:30","ui":"14:00","n":"Fermé le 25 décembre et à Pâques ; les 24 et 31 décembre et le 15 août, fermeture à 14 h 30."}],"fonti":[{"t":"Wikipedia – Sette opere di Misericordia (Caravaggio)","u":"https://it.wikipedia.org/wiki/Sette_opere_di_Misericordia_(Caravaggio)"},{"t":"Pio Monte della Misericordia – La chiesa","u":"https://piomontedellamisericordia.it/chiesa-2/"},{"t":"Pio Monte della Misericordia","u":"https://www.piomontedellamisericordia.it/"},{"t":"Pio Monte della Misericordia – Caravaggio","u":"https://piomontedellamisericordia.it/caravaggio/"}],"ant":true,"dett":[{"t":"Les Sept Œuvres de miséricorde","x":"C'est une immense toile, haute de près de quatre mètres, qui ressemble à une nuit dans une ruelle de Naples : un carrefour plein de monde, éclairé par une lumière venue de côté qui sculpte les corps dans l'obscurité. En haut, la Vierge à l'Enfant, portée par deux anges, regarde ce que font les hommes.\n\nLe Pio Monte voulait une œuvre qui réunisse les sept œuvres de miséricorde : nourrir les affamés, donner à boire à ceux qui ont soif, vêtir ceux qui sont nus, accueillir les pèlerins, visiter les malades, visiter les prisonniers, ensevelir les morts. Caravage les a toutes peintes dans une seule scène, sans miracles : c'est l'homme qui aide l'homme.\n\nCe fut la première œuvre de Caravage à Naples et elle changea la peinture de la ville : les peintres napolitains du XVIIe siècle reprirent sa lumière, ses personnages pris dans la rue et même certains détails, comme l'homme de dos au premier plan.","d":"Sur le maître-autel","foto":{"u":"../img/da8045021e55.jpg","alt":"Les Sept Œuvres de miséricorde du Caravage : scènes de rue par une nuit sombre","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Les Sept Œuvres de miséricorde du Caravage (1607) : la scène entière, avec les personnages en bas et la Vierge à l'Enfant en haut."}},{"t":"Comment reconnaître les sept œuvres","x":"Cherchez les scènes une par une.\n\nÀ droite, une jeune femme allaite un vieil homme derrière les barreaux : ce sont Péro et son père Cimon, condamné à mourir de faim en prison. Ils valent pour deux œuvres : nourrir les affamés et visiter les prisonniers. Regardez la goutte de lait sur la barbe du vieillard.\n\nDerrière eux, un homme porte un mort (on n'en voit que les pieds) et un prêtre avec une torche l'éclaire : ensevelir les morts. Au premier plan, à gauche, un jeune cavalier coupe son manteau pour un homme nu à terre : c'est saint Martin, vêtir ceux qui sont nus ; à côté, dans le coin le plus sombre, un infirme prie : visiter les malades.\n\nÀ l'extrême gauche, un aubergiste indique le chemin à un pèlerin avec une coquille sur son chapeau, saint Jacques : accueillir les pèlerins. À l'arrière-plan, un homme boit dans une mâchoire d'âne : c'est Samson, donner à boire à ceux qui ont soif.","d":"Devant la toile, de gauche à droite","foto":{"u":"../img/61f82ae7d5c6.jpg","alt":"La toile du Caravage au-dessus du maître-autel du Pio Monte della Misericordia","aut":"Husky","lic":"CC0 1.0 (dominio pubblico)","src":"https://commons.wikimedia.org/wiki/File:Seven_Works_of_Mercy_(Caravaggio)_-_with_altar.jpg","dida":"La toile du Caravage telle que vous la voyez dans l'église : au-dessus de l'autel, dans la chapelle du Pio Monte."}},{"t":"La Vierge et les anges","x":"Regardez en haut : la Vierge à l'Enfant se penche comme à une fenêtre, devant deux draps étendus, et deux anges s'étreignent en vol. Ils semblent loin de ce qui se passe en bas.\n\nMais observez l'ombre qu'ils projettent sur le mur de la prison : Caravage les rend présents, presque concrets, dans la même nuit que les hommes.\n\nL'historien de l'art Roberto Longhi choisit justement ce détail pour l'affiche de la grande exposition de 1951 qui redécouvrit Caravage : beaux, écrivit-il, comme un Raphaël, mais pris «dans la vérité nue de Forcella ou de Pizzofalcone».","d":"En haut de la toile","foto":{"u":"../img/e426fcddaa4a.jpg","alt":"Détail : la Vierge à l'Enfant et les deux anges en vol","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Le détail en haut : la Vierge à l'Enfant qui se penche et les deux anges qui s'étreignent en vol."}},{"t":"Les autres autels","x":"Autour du Caravage, l’église octogonale compte six autres autels, ornés de toiles de peintres napolitains du XVIIe siècle : Battistello Caracciolo, Luca Giordano, Fabrizio Santafede, Giovan Bernardo Azzolino et Forlì.\n\nCherchez la « Libération de saint Pierre » de Battistello Caracciolo, de 1615 : c’est l’un des peintres qui ont le plus appris du Caravage, et cela se voit dans la lumière et dans l’obscurité. Puis « Saint Pierre ressuscitant Tabithe » de Fabrizio Santafede, de 1611.\n\nRegardez-les après le Caravage : vous comprendrez tout de suite à quel point sa toile était nouvelle pour Naples.","d":"Dans les chapelles alentour","foto":{"u":"../img/b58919c38c63.jpg","alt":"Une toile du XVIIe siècle représentant le Bon Samaritain","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pio_Monte_della_Misericordia._Il_Buon_Samaritano._%281943%29.jpg","dida":"Le Bon Samaritain de Giovan Vincenzo Forlì, sur l'un des autels autour des Sept Œuvres du Caravage."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":18,"s":"duomo-san-gennaro","n":"Duomo et Trésor de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cathédrale de Naples et la chapelle du Trésor, où est conservée l'ampoule du sang de San Gennaro.","rac":"La cathédrale, dédiée à Santa Maria Assunta, fut voulue par Charles d'Anjou en 1294 à l'endroit où s'élevaient deux basiliques anciennes : la Stefania, démolie, et Santa Restituta, conservée comme chapelle. On la découvre à l'improviste le long de la Via Duomo, la rue percée dans les premières décennies après l'Unité italienne.\n\nElle est gothique, en croix latine et à trois nefs, avec un plafond à caissons en bois sculpté et doré. À l'intérieur, les siècles s'additionnent : la basilique paléochrétienne de Santa Restituta, le plus ancien baptistère d'Occident, la crypte Renaissance du Succorpo, la chapelle baroque du Trésor et, sous le tout, les vestiges de la ville gréco-romaine.\n\nDans le Duomo, dans une niche de la chapelle du Trésor, est conservée l'ampoule contenant le sang que la tradition attribue à San Gennaro. Trois fois par an (le samedi précédant le premier dimanche de mai, le 19 septembre et le 16 décembre), on en attend la liquéfaction. Depuis 1601, les reliques sont confiées à une institution laïque, la Députation de la Chapelle du Trésor de San Gennaro.","con":"Les jours de la liquéfaction, le Duomo est plein dès le matin : si vous voulez y être, arrivez tôt.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La façade du Duomo de Naples","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La façade du Duomo, sur la Via Duomo. La chapelle du Trésor est la troisième à droite."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:30","a":"17:00","n":"Entrée libre, réservation obligatoire. Les visites partent toutes les heures."}],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Napoli","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Le portail de San Gennaro","x":"Arrêtez-vous devant la façade : elle mesure environ cinquante mètres de haut et compte trois portails. Elle a été reconstruite en style gothique après que le tremblement de terre de 1349 eut détruit la façade angevine et le campanile.\n\nLe portail de droite reste fermé presque toute l'année : il ne s'ouvre que pour les fêtes de San Gennaro et lors d'occasions exceptionnelles. Si vous le trouvez ouvert, vous êtes tombé un jour spécial.\n\nLa cathédrale, dédiée à Santa Maria Assunta, fut voulue par Charles d'Anjou en 1294 à l'endroit où s'élevaient deux anciennes basiliques. À l'intérieur, elle est en croix latine, à trois nefs, avec un plafond à caissons en bois sculpté et doré.","d":"Sur la façade, à droite","foto":{"u":"../img/9e227b1ac73b.jpg","alt":"Le portail gothique de la cathédrale de Naples","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Duomo,_portale.jpg","dida":"Le portail gothique de la cathédrale, sur la façade."}},{"t":"La Chapelle du Trésor","x":"Plus qu'une chapelle, c'est une église dans l'église : la troisième chapelle à droite, baroque, de la première moitié du XVIIe siècle, en croix grecque, avec une coupole à double calotte. On y entre en franchissant la grande grille de bronze de Cosimo Fanzago.\n\nIci sont conservés le buste d'argent de San Gennaro et les ampoules contenant son sang : chaque année, la ville attend le « miracle » de la liquéfaction, et la foule remplit la cathédrale.\n\nLe trésor offert au saint au fil des siècles (bijoux, argenterie, œuvres d'art) se visite au Museo del Tesoro di San Gennaro, dont l'entrée se trouve à l'extérieur du Duomo.","d":"Troisième chapelle à droite","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La coupole de la Chapelle du Trésor, ornée d'une fresque du Paradis","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Levez les yeux : dans la coupole de la Chapelle du Trésor se trouve le Paradis peint par Giovanni Lanfranco."}},{"t":"Santa Restituta","x":"Lorsque Charles d'Anjou fit construire le Duomo, l'une des deux basiliques antiques qui se dressaient ici fut démolie, l'autre fut conservée comme chapelle latérale : c'est Santa Restituta, dans la nef de gauche.\n\nLa tradition veut qu'elle ait été voulue par l'empereur Constantin : c'est l'un des témoignages les plus importants de l'art paléochrétien à Naples. Elle compte trois nefs et abrite des œuvres de Luca Giordano et des sculptures du XIVe siècle.\n\nDe là, on descend vers le site archéologique situé sous la cathédrale, où l'on voit des couches d'histoire superposées : des vestiges gréco-romains et paléochrétiens.","d":"Dans la nef de gauche","foto":{"u":"../img/5abf53aec271.jpg","alt":"Une mosaïque de la Madone en majesté dans la basilique de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Une mosaïque de la Madone en majesté, à l'intérieur de Santa Restituta : la plus ancienne basilique, conservée comme chapelle du Duomo."}},{"t":"Le baptistère de San Giovanni in Fonte","x":"À droite de l'abside, une petite salle à l'histoire immense : le Baptistère de San Giovanni in Fonte, considéré comme le plus ancien d'Occident.\n\nArrêtez-vous quelques minutes en silence : vous êtes dans l'un des plus anciens lieux chrétiens d'Europe encore debout, depuis l'époque où la Naples romaine devenait chrétienne.\n\nLe baptistère et le site archéologique sous le Duomo racontent ensemble les premiers siècles de la ville chrétienne.","d":"À droite de l'abside","foto":{"u":"../img/994ed22c6902.jpg","alt":"L'intérieur du Baptistère de San Giovanni in Fonte avec la cuve baptismale au centre","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Battistero_di_San_Giovanni_in_Fonte_(Napoli)_WLM24_(16).jpg","dida":"Le Baptistère de San Giovanni in Fonte : au centre du sol, la cuve baptismale."}},{"t":"Le Succorpo","x":"Sous le maître-autel se trouve la crypte de la cathédrale, la chapelle du Succorpo, aussi appelée chapelle Carafa : le cardinal Oliviero Carafa la fit construire pour y conserver les reliques de San Gennaro ainsi que celles de 51 autres saints.\n\nL'architecte Giovan Tommaso Malvito l'a conçue comme une petite basilique : trois nefs séparées par des colonnes antiques à chapiteaux ioniques, des niches sur les côtés et une chapelle au fond.\n\nMarbres blancs, lumière tamisée et silence : c'est la Renaissance au cœur de la cathédrale gothique.","d":"Sous le maître-autel","foto":{"u":"../img/876cd614ab8d.jpg","alt":"L'intérieur du Succorpo di San Gennaro avec ses colonnes de marbre et son sol incrusté","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Duomo_di_Napoli._Cappella_del_Succorpo_o_Cripta_di_san_Gennaro.jpg","dida":"Le Succorpo, sous le chœur de la cathédrale : colonnes et sol en marbre, et au fond l'autel avec les reliques de San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":19,"s":"girolamini","n":"Complexe des Girolamini","tipo":"chiesa","zona":"decumano_maggiore","ind":"Via Duomo 142, Napoli","lat":40.85205,"lon":14.258368,"mp":19,"dv":45,"gr":null,"sa":false,"sito":"https://girolamini.cultura.gov.it/","po":"","som":"Face à la cathédrale, une église baroque appelée «Domus Aurea», deux cloîtres, une pinacothèque et la plus ancienne bibliothèque publique de Naples.","rac":"Sur la via Duomo, face à la cathédrale, l'ensemble des Girolamini est né au XVIe siècle pour les pères de l'Oratoire de saint Philippe Néri, appelés Girolamini. Monument national depuis 1866, il réunit l'église, les cloîtres, la pinacothèque et la bibliothèque.\n\nL'église, dédiée à saint Philippe Néri, est connue sous le nom de «Domus Aurea» pour son décor baroque doré. La pinacothèque est considérée comme la première galerie de peinture publique de la ville et conserve des œuvres de maîtres tels que Battistello Caracciolo, Jusepe de Ribera et Luca Giordano. La bibliothèque, ouverte au public dans la seconde moitié du XVIe siècle, est la plus ancienne bibliothèque publique de Naples.\n\nL'ensemble a connu une longue période de restaurations : l'église a rouvert le 21 mars 2024 et, selon la presse, la Sala Camino et la Sala Vico de la bibliothèque ont également rouvert en 2026. Les réouvertures sont progressives : toutes les salles ne sont pas visitables en même temps.","con":"Avant de venir, consultez le site officiel pour savoir ce qui est ouvert : l'église, les cloîtres, la pinacothèque et la bibliothèque ont des horaires différents, susceptibles de changer.","acc":"","foto":{"u":"../img/196f89f190a5.jpg","alt":"La façade des Girolamini illuminée le soir","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Chiesa_dei_Girolamini_1.JPG","dida":"La façade de l'église des Girolamini."},"ov":false,"ovi":null,"or":[{"g":[2,3,4,5],"da":"09:00","a":"17:30","ui":"16:45","n":"Église. Fermé le lundi."},{"g":[6,7],"da":"08:30","a":"13:30","ui":"12:45","n":"Église. Samedi, dimanche et jours fériés."}],"fonti":[{"t":"DMO Napoli – Complesso monumentale e Biblioteca dei Girolamini","u":"https://dmo-napoli.inera.it/en/attraction/monumental-complex-and-library-of-the-girolamini/"},{"t":"cultura.gov.it – Girolamini","u":"https://cultura.gov.it/luogo/complesso-monumentale-e-biblioteca-dei-girolamini-di-napoli-1"},{"t":"museionline – Quadreria dei Girolamini","u":"https://www.museionline.info/napoli-musei-e-monumenti/quadreria-dei-girolamini"},{"t":"Artribune – Riapertura dei Girolamini","u":"https://www.artribune.com/?p=1063352"}],"ant":true,"dett":[{"t":"L'église « Domus Aurea »","x":"L'église de San Filippo Neri est appelée Domus Aurea, la « maison d'or », pour sa riche décoration baroque. C'est l'un des lieux de culte les plus importants de la ville.","d":"Dans l'église, avec entrée par la Via Duomo","foto":{"u":"../img/82e6e36bce0c.jpg","alt":"La nef de l'église des Girolamini avec ses décorations dorées","aut":"E. della Morte","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGirolamininavatadestra.jpg","dida":"L'église des Girolamini, la « Domus Aurea » pour sa riche décoration."}},{"t":"La galerie de peintures","x":"Elle est considérée comme la première pinacothèque publique de Naples. Elle rassemble des peintures de maîtres du XVIIe siècle comme Battistello Caracciolo, Jusepe de Ribera et Luca Giordano. On y accède depuis le cloître des Orangers, au premier étage du couvent.","d":"Premier étage du couvent, depuis le cloître des Orangers","foto":{"u":"../img/ca542321bfc6.jpg","alt":"Tête de sainte peinte par Massimo Stanzione","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/44102677180","dida":"Une toile de la Quadreria dei Girolamini : tête de sainte de Massimo Stanzione (XVIIe siècle)."}},{"t":"La plus ancienne bibliothèque de Naples","x":"La bibliothèque est la plus ancienne bibliothèque publique de la ville et la deuxième d'Italie après la Malatestiana de Cesena. Spécialisée en théologie, philosophie, histoire de l'Église et musique sacrée, elle conserve environ 159 700 volumes anciens et modernes. Parmi les salles historiques figure celle dédiée à Giambattista Vico, qui y a étudié.","d":"Entrée au 114, Via Duomo","foto":{"u":"../img/33028b7b5461.jpg","alt":"La salle de la Bibliothèque des Girolamini avec ses rayonnages en bois","aut":"Giuseppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_dei_Girolamini._1283.jpg","dida":"La salle de la Bibliothèque des Girolamini, la plus ancienne bibliothèque publique de Naples."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":43,"s":"banksy-madonna","n":"La Madone au pistolet de Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Une Madone de Banksy avec un pistolet à la place de l'auréole, protégée par une vitre, au cœur du Decumano Maggiore.","rac":"Banksy est arrivé à Naples en 2010 : c'était la première fois qu'il travaillait en Italie. Au pochoir, probablement la même nuit, il a laissé deux œuvres dans des lieux très fréquentés du centre, toutes deux avec une image religieuse et un message direct. L'une, Via Benedetto Croce, a été recouverte par un autre artiste ; celle-ci a survécu, et c'est pourquoi elle est présentée comme l'unique fresque murale de Banksy en Italie.\n\nÀ côté de l'œuvre se trouve une ancienne niche votive avec la Vierge à l'Enfant : les deux images, côte à côte, semblent se parler.\n\nPiazzetta dei Girolamini, sur une façade du Decumano Maggiore, Banksy a laissé une Madone avec un pistolet à la place de l'auréole. Aujourd'hui, elle est protégée par une vitre. Le portail touristique officiel de la ville l'inclut dans son itinéraire consacré au street art du centre historique.","con":"Levez les yeux : l'œuvre se trouve au-dessus du niveau de la rue, derrière une vitre.","acc":"","foto":{"u":"../img/f88e2da6bb84.jpg","alt":"Le visage de la Madone de Banksy au pochoir blanc sur fond sombre","aut":"Carlo Raso (foto); opera di Banksy","lic":"Pubblico dominio (PDM 1.0)","src":"https://www.flickr.com/photos/70125105@N06/22996723949","dida":"Le visage de la Madone de Banksy : le pochoir blanc sur fond sombre, de près."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – Madonna con la pistola di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Vierge au pistolet","x":"Regarde le mur : en blanc sur fond noir, réalisée au pochoir, une Vierge aux bras ouverts vers le ciel. Mais à la place de l'auréole, au-dessus de sa tête, il y a un pistolet.\n\nBanksy, l'artiste de rue anglais de Bristol, l'a peinte à Naples en 2010, probablement de nuit et en quelques secondes, avec ses pochoirs. Ce fut la première œuvre de Banksy en Italie.\n\nLe message n'est pas expliqué : d'un regard distrait, on dirait une image sacrée, mais ce n'en est pas une. Sacré et violence, foi et armes : chacun la lit à sa manière.","d":"Sur le mur de la petite place","foto":{"u":"../img/07dcd96f1c5b.jpg","alt":"La Vierge au pochoir de Banksy sur le mur de la piazza Gerolomini, vue de près","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8108814100","dida":"La Vierge de Banksy, au pochoir noir et blanc, sur un angle du mur de la piazza Gerolomini."}},{"t":"L'édicule voisin","x":"Regardez maintenant à côté de l'œuvre : il y a un petit édicule votif avec la Vierge à l'Enfant, comme on en trouve dans tant de rues de Naples, peint on ne sait combien de siècles plus tôt.\n\nLes deux Madones, l'une près de l'autre, semblent se regarder : l'ancienne semble observer, perplexe, celle de Banksy. C'est ce dialogue qui rend l'œuvre si napolitaine.\n\nFaites un pas en arrière et regardez-les ensemble : c'est la plus belle photo à rapporter chez vous.","d":"Juste à côté de l'œuvre","foto":{"u":"../img/3a7788eec560.jpg","alt":"La Vierge de Banksy sur le mur et, à côté, l'édicule votif avec la Vierge à l'Enfant","aut":"ho visto nina volare (foto); opera di Banksy","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"À gauche la Vierge de Banksy, à droite, accrochée au mur, l'édicule avec la Vierge à l'Enfant : les deux images sacrées côte à côte."}},{"t":"Un Banksy sous verre","x":"En 2010, Banksy a laissé à Naples deux œuvres, probablement la même nuit. L'autre, via Benedetto Croce, se moquait de la société de consommation : elle reprenait l'« Extase de la bienheureuse Ludovica Albertoni » du Bernin, mais la sainte y apparaissait en extase après un repas de fast-food.\n\nCette œuvre a été recouverte par un autre artiste de rue napolitain, qui ne savait pas ce qu'il effaçait. C'est pourquoi le FAI désigne celle de la piazza Gerolomini comme la seule fresque de Banksy en Italie.\n\nAujourd'hui, elle est protégée par une vitrine en plexiglas, qui la met au moins à l'abri des vandales.","d":"Devant l'œuvre","foto":{"u":"../img/98a6548f2f8d.jpg","alt":"La Madone de Banksy peinte au pochoir sur le mur d'une ruelle","aut":"ho visto nina volare","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/41099823@N00/8109248839","dida":"La Madone de Banksy sur le mur de la ruelle, sur une photo de 2012 (avant la vitrine)."}},{"t":"Comment y arriver et que photographier","x":"L'œuvre se trouve sur un mur de la petite Piazza Gerolomini, qui donne sur la Via dei Tribunali.\n\nLa vitrine protège l'œuvre mais peut refléter la lumière : pour une photo sans reflets, essayez de vous placer légèrement de côté. L'endroit est toujours accessible et gratuit.\n\nD'ici, la Madonna de la Via Benedetto Croce, l'œuvre perdue, est à neuf minutes à pied, le long du parcours qui passe par Sansevero, Napoli Sotterranea et San Gregorio Armeno.","d":"Piazza Gerolomini, sur la Via dei Tribunali","foto":{"u":"../img/f2e6151db7a7.jpg","alt":"La Piazza Girolamini en noir et blanc, avec la façade de l'église","aut":"Rodrigo Silva","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Girolamini_-_Naples_-_Italy_(15036436065).jpg","dida":"Piazza Girolamini, avec la façade de l'église des Girolamini."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":20,"s":"piazza-bellini","n":"Piazza Bellini et les remparts grecs","tipo":"piazza","zona":"decumano_superiore","ind":"Piazza Vincenzo Bellini, Napoli","lat":40.84994,"lon":14.252176,"mp":11,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Une place de cafés et d'étudiants avec une fenêtre sur le passé : derrière une balustrade, on aperçoit les remparts grecs de Neapolis.","rac":"Piazza Bellini se trouve sur le decumanus majeur et c'est l'une des places les plus fréquentées du centre historique, grâce aux nombreux établissements qui la bordent. Il suffit de regarder en bas, au-delà de la balustrade, pour voir, dans une zone en contrebas, un tronçon des remparts de la Neapolis grecque, datant du IVe siècle av. J.-C. Ils ont été découverts en 1954.\n\nÀ quelques pas se trouve le Conservatorio di San Pietro a Majella.","con":"Dix minutes suffisent : regardez les remparts d'en haut, puis offrez-vous une pause dans l'un des établissements de la place.","acc":"","foto":{"u":"../img/f745cf0fb0f8.jpg","alt":"Piazza Bellini avec ses tables et sa verdure","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_(Napoli).jpg","dida":"Piazza Bellini, le lieu de rendez-vous du centre historique."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"DMO Napoli – Mura greche di Piazza Bellini","u":"https://dmo-napoli-ese.inera.it/en/attraction/greek-walls-of-piazza-bellini/"},{"t":"Wikipedia – Archaeological sites in Naples","u":"https://en.wikipedia.org/wiki/Archaeological_sites_in_Naples"},{"t":"FAI – Piazza Bellini","u":"https://fondoambiente.it/luoghi/piazza-bellini?ldc"}],"ant":true,"dett":[{"t":"Les murs grecs","x":"Sous le niveau de la place, on voit les vestiges des murs défensifs de la Neapolis grecque, en blocs de tuf. Ils furent découverts en 1954 et font partie du système de fortifications de la ville antique. Ce n'est pas une reconstitution : ce sont des pierres d'origine.","d":"Au-delà de la balustrade, dans la zone en contrebas","foto":{"u":"../img/4801d5111d9f.jpg","alt":"Les blocs de tuf des murs grecs sous le niveau de la place","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_piazza_bellini%2C_mura_greche.JPG","dida":"Les murs grecs de Neapolis sur la Piazza Bellini : des blocs de tuf d'origine."}},{"t":"La place aujourd'hui","x":"Autour des remparts, on trouve des cafés, des librairies et des lieux fréquentés par les étudiants et les habitants. C'est l'un des endroits du centre historique où l'ancien et la vie de tous les jours sont le plus proches.","d":"Autour de la place","foto":{"u":"../img/133ed975e61b.jpg","alt":"La Piazza Bellini avec ses arbres, ses immeubles et ses petites tables","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Bellini_%28Napoli%29.jpg","dida":"La Piazza Bellini aujourd'hui, entre cafés et librairies."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":21,"s":"port-alba","n":"Port’Alba et la rue des libraires","tipo":"strada","zona":"decumano_superiore","ind":"Via Port'Alba, Napoli","lat":40.849438,"lon":14.250761,"mp":9,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Une porte de 1625 et, au-delà de l'arche, une ruelle de libraires et de magasins de musique qui mène à Piazza Bellini.","rac":"Port'Alba est l'une des anciennes portes de la ville. Elle s'ouvre dans un angle de Piazza Dante et tire son nom du vice-roi espagnol Antonio Álvarez de Toledo, duc d'Albe, qui la fit ériger en 1625 à la place d'une ouverture provisoire, pour faciliter le passage d'un côté à l'autre de la ville. Son aspect actuel est dû aux travaux de la fin du XVIIIe siècle voulus par Ferdinand IV de Bourbon.\n\nAu-delà de la porte se trouve la via Port'Alba, une ruelle piétonne connue pour ses librairies et ses magasins de musique, qui mène jusqu'à Piazza Bellini.","con":"Passez sous l'arche et flânez parmi les étals de livres : c'est le moyen le plus simple d'aller de Piazza Dante à Piazza Bellini.","acc":"","foto":{"u":"../img/a93f8fe0f583.jpg","alt":"L'arche de Port'Alba, entrée historique du centre ancien","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:PortAlbaNaples.jpg","dida":"Port'Alba, la porte du XVIe siècle sur le centre ancien."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Port'Alba","u":"https://fondoambiente.it/luoghi/port-alba"},{"t":"Napolike – Port'Alba","u":"https://www.napolike.it/point/port-alba-napoli"},{"t":"Atlas Obscura – Via Port'Alba","u":"https://www.atlasobscura.com/places/via-port-alba-naples-italy"}],"ant":true,"dett":[{"t":"La porte de 1625","x":"La porte fut érigée en 1625 à la demande du duc d'Albe, vice-roi espagnol. Sur le blason, on reconnaît les armes du roi Philippe III, de la ville de Naples et du vice-roi. Aujourd'hui, la porte est en partie cachée par la colonnade de la Piazza Dante.","d":"Dans un coin de la Piazza Dante","foto":{"u":"../img/1da787571261.jpg","alt":"La porte Port'Alba avec les armoiries","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Port%27Alba.jpg","dida":"Port'Alba, la porte de 1625 voulue par le duc d'Albe."}},{"t":"La rue des libraires","x":"La ruelle qui traverse la porte est célèbre pour son marché aux livres : librairies, étals et magasins d'instruments de musique, jusqu'à la Piazza Bellini.","d":"Au-delà de la porte, vers la Piazza Bellini","foto":{"u":"../img/60d6526dd441.jpg","alt":"La porte de Port'Alba avec les boutiques et les étals à ses pieds","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Port%27Alba,_Naples_01.jpg","dida":"Port'Alba, la porte d'où part la Via dei Librai (la rue des libraires)."}}],"gal":[],"leg":"Une légende raconte l'histoire d'une jeune femme prénommée Maria, accusée de sorcellerie à l'époque de l'Inquisition espagnole et laissée mourir dans une cage suspendue à la porte.","fc":null,"col":null},{"id":22,"s":"mann","n":"Musée archéologique national (MANN)","tipo":"museo","zona":"decumano_superiore","ind":"Piazza Museo 19, Napoli","lat":40.853606,"lon":14.25115,"mp":15,"dv":150,"gr":false,"sa":false,"sito":"https://www.museoarcheologiconapoli.it/","po":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1","som":"L'un des plus grands musées archéologiques du monde : les trésors de Pompéi et d'Herculanum, la collection Farnèse et la célèbre Mosaïque d'Alexandre.","rac":"Le Musée archéologique national est installé dans le Palazzo degli Studi, construit en 1585. En 1777, le roi Ferdinand IV de Bourbon y transféra la collection Farnèse, héritée de sa mère Élisabeth Farnèse. Avec le retour des Bourbons en 1816, il devint le Real Museo Borbonico (Musée royal bourbonien) ; après l'Unité italienne, il devint Musée national. Les tableaux furent transférés à Capodimonte en 1957, et depuis lors c'est un musée exclusivement consacré aux antiquités.\n\nIl expose environ 18 000 pièces : les collections vésuviennes (fresques, mosaïques, objets de la vie quotidienne, la maquette de Pompéi, la Villa des Papyrus), les sculptures et les gemmes Farnèse, le Cabinet secret, la numismatique et l'une des plus importantes collections égyptiennes au monde.\n\nLa pièce la plus célèbre est la Mosaïque d'Alexandre, découverte en 1831 dans la Maison du Faune à Pompéi : elle représente la bataille d'Issos, entre Alexandre le Grand et Darius III, et se compose d'environ un million et demi de tesselles.","con":"Si vous avez peu de temps, choisissez trois choses : la Mosaïque d'Alexandre, l'Hercule Farnèse et le Cabinet secret. Pour tout voir, il faut compter au moins deux ou trois heures. Vérifiez les horaires avant de venir.","acc":"","foto":{"u":"../img/fee0195f3cee.jpg","alt":"Fresque pompéienne exposée au Musée archéologique national","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Museo_archeologico_nazionale_3901.jpg","dida":"Une fresque pompéienne exposée au MANN."},"ov":false,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:30","ui":"18:30","n":"Billetterie ouverte jusqu'à 18h30"}],"fonti":[{"t":"cultura.gov.it – Museo archeologico nazionale di Napoli","u":"https://cultura.gov.it/luogo/museo-archeologico-nazionale-di-napoli-1"},{"t":"Napolike – MANN: i capolavori","u":"https://www.napolike.it/museo-archeologico-nazionale-mann-capolavori"},{"t":"ISPRA – Museo Archeologico Nazionale di Napoli","u":"https://www.isprambiente.gov.it/it/attivita/museo/regioni/musei/museo-archeologico-nazionale-di-napoli-mann"}],"ant":true,"dett":[{"t":"La Mosaïque d'Alexandre","x":"Découverte en 1831 dans la Maison du Faune à Pompéi, la grande mosaïque mesure environ 5,82 sur 3,13 mètres et compte environ un million et demi de tesselles. Elle représente la bataille d'Issos (333 av. J.-C.) entre Alexandre le Grand et Darius III de Perse.","d":"À l'entresol, dans la section des mosaïques de Pompéi","foto":{"u":"../img/3f4dd11ad219.jpg","alt":"La grande mosaïque de la bataille entre Alexandre et Darius","aut":"Lucas","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Alexander_Mosaic_%286000_x_3730%29.jpg","dida":"La Mosaïque d'Alexandre, provenant de la Maison du Faune à Pompéi."}},{"t":"La collection Farnèse","x":"Réunie par la famille Farnèse pour son palais de Rome, la collection comprend des statues monumentales comme l'Hercule Farnèse, haut d'environ trois mètres et découvert aux Thermes de Caracalla, et le Taureau Farnèse.","d":"Au rez-de-chaussée","foto":{"u":"../img/714ee8ec5fd4.jpg","alt":"La statue de l'Hercule Farnèse appuyé sur sa massue","aut":"virtusincertus","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/79346113@N00/4094528939","dida":"L'Hercule Farnèse, découvert aux Thermes de Caracalla."}},{"t":"Le Cabinet secret","x":"Il rassemble des œuvres d'art érotique découvertes à Pompéi et à Herculanum. Il a une entrée séparée et exige souvent une réservation à heure fixe : renseignez-vous à la billetterie.","d":"À l'entresol","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":23,"s":"madre","n":"MADRE, musée d'art contemporain","tipo":"museo","zona":"decumano_superiore","ind":"Via Luigi Settembrini 79, Napoli","lat":40.855123,"lon":14.258586,"mp":24,"dv":90,"gr":null,"sa":false,"sito":"https://www.madrenapoli.it/","po":"https://www.madrenapoli.it/en/visit/","som":"Un palais rénové par l'architecte Álvaro Siza, qui abrite des œuvres de Clemente, Kapoor, Serra, Horn et d'autres maîtres de l'art contemporain.","rac":"Le MADRE, musée d'art contemporain Donnaregina, se trouve dans le Palazzo Donnaregina, à deux pas du Duomo et du Trésor de San Gennaro. L'édifice a été rénové par l'architecte portugais Álvaro Siza et le musée, géré par la Fondation Donnaregina pour les arts contemporains, a été inauguré en 2005.\n\nLe premier étage est consacré à des œuvres réalisées spécialement pour les salles par des artistes comme Francesco Clemente, Anish Kapoor, Rebecca Horn, Jannis Kounellis, Richard Long et Mimmo Paladino. La collection comprend aussi Richard Serra, Sol LeWitt et Jeff Koons, et le musée organise des expositions temporaires. C'est un contraste voulu avec la Naples antique qui l'entoure.","con":"Cherchez «Spirits» de Rebecca Horn : ce sont des copies en fonte des crânes du cimetière des Fontanelle. Le musée est fermé le mardi et, en raison de travaux, certaines salles du deuxième étage sont temporairement fermées : consultez le site avant de venir.","acc":"","foto":{"u":"../img/58482274a167.jpg","alt":"La cour blanche du musée Madre","aut":"Amedeo Benestante","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Madre,.jpg","dida":"Le musée Madre, l'art contemporain à Donnaregina."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6],"da":"10:00","a":"19:30","ui":"18:30","n":"Fermé le mardi. La dernière entrée a lieu une heure avant la fermeture."},{"g":[7],"da":"10:00","a":"20:00","ui":"19:00","n":"Dimanche. La dernière entrée a lieu une heure avant la fermeture."}],"fonti":[{"t":"Domus – The Madre Museum","u":"https://www.domusweb.it/en/art/2006/03/22/napoli-the-madre-museum.html"},{"t":"AMACI – Madre","u":"https://www.amaci.org/en/partners/616e8d2d12a71a00112ef019"},{"t":"Google Arts & Culture – Madre","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"« Ave Ovo » de Francesco Clemente","x":"Un sol en majolique et une fresque monumentale, créés en 2005 pour le musée, occupent deux salles sur deux étages.","d":"Dans les salles consacrées à Clemente","foto":null},{"t":"« Spirits » de Rebecca Horn","x":"L'artiste a reproduit en fonte les crânes du cimetière des Fontanelle, les « capuzzelle » napolitaines. Un lien entre l'art contemporain et le Naples populaire.","d":"Dans la salle de Rebecca Horn","foto":null},{"t":"L'architecture de Siza","x":"Siza a rénové les trois étages du palais, en conservant la structure historique et en y insérant des espaces modernes pour les grandes installations.","d":"Dans tout le musée","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":24,"s":"stazione-toledo","n":"Station de métro Toledo","tipo":"altro","zona":"toledo_mare","ind":"Via Toledo, Napoli","lat":40.84244,"lon":14.24887,"mp":4,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Un arrêt de la Ligne 1 considéré comme l'un des plus beaux d'Europe : mosaïques, céramiques bleues et le « Cratère de lumière » de Robert Wilson.","rac":"La station Toledo fait partie des « Stations de l'Art », le projet qui a confié à des architectes et à des artistes la conception des arrêts de la Ligne 1, avec plus de 250 œuvres. Elle a été conçue par l'architecte catalan Oscar Tusquets Blanca et inaugurée le 17 septembre 2012. L'entrée, sur la via Diaz, présente trois structures hexagonales revêtues de carreaux bleus et ocre, qui apportent la lumière dans le hall.\n\nEn descendant, on découvre des vagues en relief dessinées par Tusquets, des œuvres de Robert Wilson (dont « Crater de luz », un cratère de lumière) et les mosaïques de William Kentridge. La station a été plusieurs fois citée parmi les plus belles d'Europe.\n\nPour la voir, il suffit de prendre le métro : il faut un billet pour descendre jusqu'aux quais.","con":"Descendez jusqu'au niveau le plus profond et regardez vers le haut : c'est là que la lumière du Cratère produit le meilleur effet. Il faut un billet pour entrer ; consultez les horaires du service sur le site de l'ANM.","acc":"","foto":{"u":"../img/818cc292e648.jpg","alt":"Le quai de la station Toledo, en sous-sol","aut":"Arbalete","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_stazione_metropolitana_Toledo_-_banchina_-_01.jpg","dida":"Le quai de la station Toledo."},"ov":false,"ovi":null,"or":[{"g":[7,1,2,3,4],"da":"06:00","a":"23:00","n":"Horaires de service de la ligne 1 : du premier au dernier train."},{"g":[5,6],"da":"06:00","a":"01:30","n":"Horaires de service de la ligne 1 : du premier au dernier train."}],"fonti":[{"t":"Domus – Stazioni dell'Arte","u":"https://www.domusweb.it/it/arte/gallery/2024/07/31/la-guida-alle-stazioni-dellarte-della-metropolitana-di-napoli.amp.html"},{"t":"Ferrovie.it – Apre Toledo","u":"https://www.ferrovie.it/portale/articoli/2930/pdf"},{"t":"Arte.it – Mosaici delle Stazioni dell'Arte","u":"https://www.arte.it/calendario-arte/ravenna/mostra-tessere-per-l-arte-pubblica-i-mosaici-delle-stazioni-dell-arte-di-napoli-94217"}],"ant":true,"dett":[{"t":"Le « Crater de luz » de Robert Wilson","x":"Un cratère de lumière, œuvre de Robert Wilson, signe l'identité de la station. L'œuvre change avec la lumière et donne à la descente un effet presque théâtral.","d":"Dans les niveaux souterrains de la gare","foto":null},{"t":"Les mosaïques de William Kentridge","x":"Le long du parcours, on peut voir des mosaïques de l'artiste sud-africain William Kentridge, qui font partie du programme des Stations de l'Art.","d":"Sur le chemin vers les quais","foto":null},{"t":"L'entrée bleue de la via Diaz","x":"Trois structures hexagonales recouvertes de carreaux bleus et ocre, qui laissent entrer la lumière dans l'atrium. Les deux couleurs sont le fil conducteur de toute la station.","d":"À l'entrée de la via Diaz","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":45,"s":"gallerie-italia","n":"Gallerie d'Italia, le dernier Caravage","tipo":"museo","zona":"toledo_mare","ind":"Via Toledo 177","lat":40.840423,"lon":14.248812,"mp":6,"dv":60,"gr":false,"sa":false,"sito":"https://www.gallerieditalia.com/","po":"https://www.gallerieditalia.com/en/naples/plan-your-visit/","som":"À six minutes de Ceraldi, sur la Via Toledo, le dernier tableau peint par le Caravage, quelques semaines avant sa mort : le Martyre de sainte Ursule.","rac":"Les Gallerie d'Italia d'Intesa Sanpaolo se trouvent au 177 de la Via Toledo, dans le bâtiment qui fut le siège du Banco di Napoli, conçu par Marcello Piacentini à la fin des années 1930 ; la nouvelle muséographie est de l'architecte Michele De Lucchi. Le musée y a ouvert en 2022 et a pris la place du Palazzo Zevallos Stigliano voisin.\n\nLe chef-d'œuvre de la collection est le Martyre de sainte Ursule du Caravage, de 1610, considéré comme le dernier tableau du peintre. Autour, trois parcours : l'art napolitain du XVIIe au XXe siècle, une collection de céramiques attiques et de Grande-Grèce, et une sélection d'œuvres du XXe siècle.","con":"Billet plein tarif 8 euros, tarif réduit 4 euros ; gratuit pour les moins de 26 ans et pour tous le premier dimanche du mois. Fermé le lundi ; dernière entrée une heure avant la fermeture.","acc":"","foto":{"u":"../img/830ac6c4ce8e.jpg","alt":"Une salle des Gallerie d'Italia avec des tableaux sur des murs jaunes","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Gallerie_d'Italia_al_Palazzo_del_Banco_di_Napoli_09.jpg","dida":"Une salle des Gallerie d'Italia à Naples, avec des toiles du XVIIe siècle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[2,3,4,5],"da":"10:00","a":"19:00","ui":"18:00"},{"g":[6,7],"da":"10:00","a":"20:00","ui":"19:00"}],"fonti":[{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Gallerie d'Italia – Plan your visit","u":"https://www.gallerieditalia.com/en/naples/plan-your-visit/"},{"t":"Gallerie d'Italia – Pianifica la visita","u":"https://www.gallerieditalia.com/it/napoli/pianifica-la-tua-visita/"},{"t":"Intesa Sanpaolo – Martirio di sant'Orsola","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/mostre/2025/martirio-di-sant-orsola-caravaggio-2025"},{"t":"Wikipedia – Martirio di sant'Orsola","u":"https://it.wikipedia.org/wiki/Martirio_di_sant'Orsola_(Caravaggio)"},{"t":"Gallerie d'Italia – Napoli","u":"https://gallerieditalia.com/it/napoli/"}],"ant":true,"dett":[{"t":"Le Martyre de sainte Ursule","x":"C’est une scène étroite et sombre, presque sans arrière-plan : nous sommes dans la tente d’Attila, roi des Huns. Ursule, une princesse, l’a repoussé, et il vient de lui décocher une flèche en pleine poitrine. Elle penche la tête vers la flèche ; trois hommes accourent pour la soutenir. Le roi semble déjà regretter son geste.\n\nCherchez le visage derrière la sainte : c’est le Caravage lui-même, qui s’est peint parmi les témoins. Et observez la main qui s’allonge entre la sainte et le roi, comme pour arrêter la flèche : elle est réapparue lors de la restauration de 2003-2004.\n\nLe tableau fut commandé par le prince génois Marcantonio Doria, dont la famille avait sainte Ursule pour protectrice. C’est le dernier tableau du Caravage que nous connaissions : il fut achevé en mai 1610, un peu plus d’un mois avant sa mort.","d":"Dans la salle consacrée au Caravage","foto":{"u":"../img/62ba7427c200.jpg","alt":"Le Martyre de sainte Ursule du Caravage : la sainte et le roi au moment de la flèche","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Le Martyre de sainte Ursule (1610) : le roi frappe la sainte d’une flèche, à bout portant."}},{"t":"Le tableau mis au soleil","x":"Le Caravage peignit ce tableau à la hâte, peut-être parce qu'il était sur le point de partir pour Rome afin d'obtenir le pardon du pape. Le représentant des Doria à Naples, Lanfranco Massa, fit livrer la toile alors que le vernis n'était pas encore sec et, pour le faire sécher plus vite, la plaça au soleil : le vernis, étalé en couche très épaisse, s'abîma. Massa le raconta lui-même dans une lettre de mai 1610.\n\nLe tableau arriva à Gênes, puis passa d'héritier en héritier, finit dans une villa d'Eboli et fut attribué à d'autres peintres. Ce n'est que dans les années 1980 que la découverte de la lettre de Massa a confirmé avec certitude qu'il est bien du Caravage.\n\nEn 2025, une nouvelle restauration a fait reparaître trois têtes que le temps avait fait disparaître.","d":"Devant la toile","foto":{"u":"../img/6a999eeecae6.jpg","alt":"La toile du Caravage exposée dans une salle du Palazzo Zevallos, avec son plafond décoré","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:PalazzoZevallosCaravaggio.jpg","dida":"Le Martyre de sainte Ursule exposé dans une salle du Palazzo Zevallos Stigliano, siège des Gallerie d’Italia."}},{"t":"Le palais du Banco di Napoli","x":"Avant de monter vers les salles, regardez autour de vous : vous êtes dans le palais qui fut le siège du Banco di Napoli, conçu par Marcello Piacentini à la fin des années 1930.\n\nL'architecte Michele De Lucchi l'a transformé en musée avec une muséographie moderne : les grandes salles de la banque accueillent aujourd'hui trois parcours, de l'art napolitain du XVIIe siècle au XXe siècle, en passant par une riche collection de vases grecs et de Grande-Grèce.\n\nLe musée a ouvert en 2022 et poursuit l'activité du Palazzo Zevallos Stigliano, ouvert de 1999 à 2022 à quelques pas d'ici.","d":"En entrant, dans le grand hall","foto":{"u":"../img/caeaa6cb359b.jpg","alt":"La façade en pierre du Palazzo del Banco di Napoli sur la Via Toledo, avec le drapeau européen","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7616781546","dida":"Le Palazzo del Banco di Napoli sur la Via Toledo, siège des Gallerie d'Italia."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":25,"s":"quartieri-spagnoli","n":"Quartiers espagnols","tipo":"quartiere","zona":"toledo_mare","ind":"Via Toledo / Largo Maradona, Napoli","lat":40.841483,"lon":14.246423,"mp":7,"dv":60,"gr":true,"sa":true,"sito":"","po":"","som":"Un réseau de ruelles étroites né au XVIe siècle pour les soldats espagnols, aujourd'hui l'un des quartiers les plus vivants et les plus photographiés de Naples.","rac":"Les Quartiers espagnols sont nés en 1536 sur la volonté du vice-roi espagnol Pedro de Toledo, pour loger les garnisons chargées de maintenir l'ordre. La rue principale, la via Toledo, porte son nom. Le quartier est une grille de ruelles étroites entre la via Toledo, le corso Vittorio Emanuele et Monte Echia, et comprend les zones d'Avvocata, Montecalvario et San Ferdinando.\n\nL'origine espagnole survit encore dans les noms des rues, comme la via della Trinità degli Spagnoli, où se trouve l'église Santa Maria del Pilar. Dans les ruelles, on trouve des boutiques, du linge qui sèche, des petits autels et de nombreuses fresques murales.\n\nLa plus célèbre est la fresque de Maradona à Largo Maradona, via Emanuele De Deo : elle a été réalisée en 1990 par Mario Filardi et a été restaurée plusieurs fois au fil des années. C'est une étape du parcours « La mer et les châteaux », qui a sa propre fiche.","con":"Partez de Piazza Carità et enfoncez-vous dans les ruelles en journée. Comme dans toute zone très fréquentée, gardez votre sac et votre téléphone près de vous. Marchez doucement : les détails se cachent dans les portails et les fresques murales.","acc":"","foto":{"u":"../img/61b008cbd17c.jpg","alt":"Une ruelle des Quartiers espagnols avec la fresque de Maradona et des drapeaux","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Quartieri_Spagnoli_(Napoli)_04.jpg","dida":"Dans les Quartiers espagnols, la fresque de Maradona parmi les drapeaux."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Quartieri Spagnoli","u":"https://fondoambiente.it/luoghi/quartieri-spagnoli"},{"t":"Napolike – Guida ai Quartieri Spagnoli","u":"https://www.napolike.it/quartieri-spagnoli-napoli-guida"},{"t":"Artribune – Murale di Maradona","u":"https://www.artribune.com/?p=1033081"}],"ant":true,"dett":[{"t":"Le quadrillage des ruelles","x":"Le plan urbain est un quadrillage régulier de ruelles étroites, conçu pour loger les soldats espagnols. En marchant, on voit du linge qui sèche aux fenêtres, de petits autels de rue et des échoppes : la vie de quartier se déroule dans la rue.","d":"Dans les ruelles à l'ouest de la Via Toledo","foto":{"u":"../img/488b6354ea64.jpg","alt":"Une ruelle étroite des Quartiers espagnols","aut":"Tanzen80","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/11376246@N03/19206834374","dida":"L'une des ruelles droites et étroites du quadrillage des Quartiers espagnols."}},{"t":"La fresque de Maradona et Largo Maradona","x":"Via Emanuele De Deo, un ancien parking est devenu Largo Maradona. La fresque de 1990 de Mario Filardi a ensuite été restaurée par l'artiste argentin Bosoletti, qui a réalisé à côté l'Isis voilée.","d":"Via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Le visage de Maradona peint sur la façade d'un immeuble","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"La fresque de Maradona Via Emanuele De Deo, avec le visage repeint en 2017 par Francisco Bosoletti."}},{"t":"L'église Santa Maria del Pilar","x":"Via della Trinità degli Spagnoli se trouve l'église que les Espagnols ont dédiée à Santa Maria del Pilar : une trace de l'origine espagnole du quartier.","d":"Via della Trinità degli Spagnoli","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":44,"s":"murale-maradona","n":"La fresque de Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"La fresque bien-aimée des Quartiers espagnols et la place qui, depuis 2020, est devenue un sanctuaire laïque pour Diego.","rac":"La fresque représente Maradona avec le maillot numéro 10 du Napoli des années 1980, le scudetto sur la poitrine et le brassard de capitaine au bras : elle fut peinte pour fêter le deuxième scudetto, celui de 1989-90, auquel Maradona contribua avec 16 buts en 28 matchs. Il était arrivé de Barcelone en 1984 et resta à Naples jusqu'en 1991.\n\nL'auteur, Mario Filardi, n'avait que 23 ans : il peignait par passion et, de métier, il était serveur, et voyageait à travers le monde.\n\nLa fresque de Maradona fut peinte en 1990 par Mario Filardi. Dans les années 1990, l'ouverture d'une fenêtre dans le mur en effaça le visage et la peinture s'estompa presque entièrement ; elle fut restaurée grâce à Salvatore Iodice et, à l'automne 2017, l'artiste argentin Francisco Bosoletti en repeignit le visage. Après la mort de Maradona, le 25 novembre 2020, la place, auparavant appelée « place des artistes », a pris son nom et s'est couverte de petits autels, de drapeaux et de photographies.","con":"Aux heures de pointe, il y a énormément de monde : tôt le matin, il est plus facile de le voir tranquillement.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"La grande fresque de Maradona sur la façade d'un immeuble, avec la foule en dessous","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"La fresque peinte en 1990 par Mario Filardi. Le visage actuel est celui repeint en 2017 par l'artiste argentin Francisco Bosoletti."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[{"t":"La fresque et son auteur","x":"La fresque de 1990 est l'œuvre de Mario Filardi, qui peignait par passion. Elle a été restaurée plusieurs fois : en 2017, l'artiste argentin Francisco Bosoletti en a repeint le visage.","d":"Sur la façade, via Emanuele De Deo","foto":{"u":"../img/3a0eadc61dcc.jpg","alt":"Le visage de Maradona peint sur la façade d'un immeuble","aut":"Alessio Maffeis","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/68052816@N00/52216176783","dida":"La fresque de Maradona, via Emanuele De Deo, dont le visage a été repeint en 2017 par Francisco Bosoletti."}},{"t":"Largo Maradona depuis le 25 novembre 2020","x":"Après la mort de Maradona, la place, auparavant appelée « des artistes », a pris son nom et est devenue un lieu de petits autels, de drapeaux et de photographies.","d":"Sur l'esplanade devant la fresque","foto":{"u":"../img/76bca69c23a8.jpg","alt":"La place devant la fresque de Maradona, pleine de monde","aut":"Nadia Alessandra Sassi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Murales_Maradona_a_Montecalvario.jpeg","dida":"Largo Maradona : drapeaux, petits autels et visiteurs devant la fresque."}}],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La plaque du Largo Maradona avec un buste et des drapeaux","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La plaque de la place : après la mort de Diego, en 2020, la place des artistes a pris son nom."},{"u":"../img/550f6edc4b91.jpg","alt":"Un petit autel avec des photos de Maradona et des souvenirs","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un petit autel dédié à Maradona : il y en a beaucoup dans la ville, avec des photos et des souvenirs laissés par les supporters."},{"u":"../img/679687d3070c.jpg","alt":"Maradona peint avec une auréole à côté d'une petite niche votive","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona avec une auréole et sa niche votive, peint dans le quartier de San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Une niche votive avec un portrait de Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Une niche votive pour Maradona, comme celles des saints."}],"leg":"","fc":null,"col":null},{"id":26,"s":"galleria-umberto","n":"Galleria Umberto I","tipo":"palazzo","zona":"toledo_mare","ind":"Via San Carlo 15, Napoli","lat":40.838514,"lon":14.24924,"mp":10,"dv":15,"gr":true,"sa":true,"sito":"","po":"","som":"Une galerie en forme de croix, surmontée d'une coupole de fer et de verre d'environ 56 mètres de haut, en face du Teatro di San Carlo.","rac":"La Galleria Umberto I fut construite entre 1887 et 1890 pendant le Risanamento de Naples, le grand plan de reconstruction urbaine qui suivit l'épidémie de choléra. L'architecte Emanuele Rocco la conçut en forme de croix, en s'inspirant de la Galleria Vittorio Emanuele II de Milan. Elle porte le nom d'Humbert Ier, roi d'Italie à l'époque de sa construction.\n\nLes quatre bras se rejoignent sous une coupole de fer et de verre, soutenue par seize nervures. Sous la coupole, le sol est une mosaïque en forme d'étoile. La galerie abrite des boutiques, des cafés et, aux étages supérieurs, des appartements : elle était conçue pour réunir
