<!doctype html>
<html lang="fr">

<title>Guide de Naples · Ceraldi</title>

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"fr","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità et Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Point de départ : Piazza Carità, sur la Via Toledo. De là, le centre historique commence à quelques minutes à pied. Et voici Ceraldi.","rac":"Piazza Carità surplombe la Via Toledo, la grande rue que le vice-roi espagnol Don Pedro di Toledo avait ouverte au XVIe siècle, lorsqu'il doubla la taille de la ville et fit construire, sur la colline voisine, les quartiers des soldats : le quartier espagnol.\n\nD'ici, la vieille ville est à quelques minutes : remontez la Piazza del Gesù et vous arriverez sur Spaccanapoli. En descendant la Via Toledo, vous atteindrez piazza del Plebiscito, le Palais Royal et la mer.","con":"Avant de partir, un café : la visite est longue et Naples se découvre mieux avec une bonne tasse de café.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità aujourd'hui, avec ses arbres et ses bâtiments colorés","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Aujourd'hui, Piazza Carità se trouve sur la Via Toledo : tous les circuits touristiques partent d'ici. Ceraldi est ici."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La place devant Ceraldi","x":"Piazza Carità est le point de départ de toutes les visites : vous vous trouvez sur la Via Toledo, la grande route ouverte au XVIe siècle par le vice-roi Don Pedro de Tolède pour relier le vieux centre à la ville nouvelle et aux quartiers espagnols.\n\nD'ici, en quelques minutes seulement, vous pouvez rejoindre Spaccanapoli, au nord-est, ou la mer et les châteaux, au sud. Avant de partir, prenez un café : le trajet est long et Naples se découvre idéalement à pied.","d":"Devant la cafétéria","foto":{"u":"../img/6f4c11148f21.jpg","alt":"Via Toledo et Largo della Carità sur une photo du XIXe siècle","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La Via Toledo et le Largo Carità au XIXe siècle : la grande rue commandée par Don Pedro de Toledo, déjà pleine de vie à l'époque."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Photo d'époque de la Via Toledo au XIXe siècle, avec des calèches et des passants.","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La Via Toledo au XIXe siècle, alors appelée Via Roma, sur une photo de Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità et Via Toledo : une promenade au cœur de Naples","x":"L'histoire de la place, racontée par ceux qui y travaillent depuis 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, le decumanus inférieur","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La route rectiligne qui coupe le centre historique en deux : le decumanus inférieur de la ville grecque, environ deux kilomètres d’églises, de boutiques et de vie.","rac":"Spaccanapoli est la plus basse des trois decumani, ces rues parallèles qui traversaient Neapolis grecque d'ouest en est. Elle débute sur la Piazza del Gesù Nuovo sous le nom de Via Benedetto Croce, devient ensuite Via San Biagio dei Librai, croise la Via Duomo et se prolonge au-delà de la vieille ville : environ deux kilomètres au total. Son nom est éloquent : elle est si longue et rectiligne que, vue d'en haut, elle semble couper la ville en deux.","con":"Suivez-la à pied depuis la Piazza del Gesù en direction de la Via Duomo : c'est une légère descente chargée d'histoire, sans effort.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vue du ciel, une ligne droite traversant les toits du centre historique.","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vue de Sant'Elmo : une ligne droite traversant les toits du centre historique."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La route qui divise Naples","x":"Spaccanapoli est le nom populaire du decumanus inférieur, l'une des trois grandes rues parallèles de la cité grecque : c'était la « plateia » de Neapolis. Elle est ainsi nommée car, parfaitement rectiligne, elle divise le centre antique en deux, entre le nord et le sud.\n\nElle change de nom plusieurs fois : Via Benedetto Croce, puis Via San Biagio dei Librai. Du haut de la colline, en haut de la Via Pasquale Scura, on peut embrasser toute la rue d'un seul regard.\n\nLe long de cette rue, entre le Moyen Âge et le XIXe siècle, se sont dressés des couvents et des palais appartenant à de puissantes familles : levez les yeux vers les portails et les cours intérieures, et baissez-les vers les boutiques.","d":"Tout au long de la rue, de la Piazza del Gesù à la Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"La ligne droite de Spaccanapoli vue du ciel","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli vue depuis le Castel Sant'Elmo : la ligne droite qui divise la vieille ville en deux."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Place et église du Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une façade de pierres pyramidales qui ressemble à une forteresse et dissimule un mystère : des inscriptions gravées que personne n’a encore déchiffrées avec certitude.","rac":"Avant d'être une église, c'était un palais : celui des princes Sanseverino, construit en 1470 ; une plaque sur la façade commémore l'architecte, Novello da San Lucano. Les Jésuites ont préservé la structure et la pierre de taille sombre, le piperno, taillée en pyramides, en y ajoutant des éléments en marbre blanc.\n\nCertaines pierres portent des inscriptions gravées. La légende veut qu'il s'agisse d'un message secret ; certains érudits pensent qu'il s'agit des marques laissées par différents tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique d'une partition intitulée « Énigme ». Observez attentivement et faites-vous votre propre opinion.\n\nLa façade a été restaurée et dévoilée le 12 mars 2023, après la chute de quelques fragments en décembre 2017 ; la place est fermée à la circulation automobile depuis lors.","con":"Cherchez les marques sur les pierres à hauteur des yeux, à droite et à gauche du portail : la chasse est gratuite.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La façade du Gesù Nuovo est faite de pierres sombres taillées en pointes.","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La façade en forme de losange : c'était le palais des princes Sanseverino, à partir de 1470. Approchez-vous et cherchez les signes gravés sur les pierres."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La façade en forme de losange","x":"Avant d'être la façade d'une église, c'était celle d'un palais : celui de la famille Sanseverino, princes de Salerne, construit en 1470. Lorsque les Jésuites y bâtirent leur église, à partir de 1584, ils vidèrent le palais de toute substance, mais conservèrent la façade et le portail. Cette pratique était courante à Naples : l'espace était limité dans la vieille ville et toute construction hors remparts était impossible.\n\nObservez les pierres : elles sont en piperno, une pierre volcanique grise très dure, taillée en biseau (le « rusnato »). Le grand portail baroque, avec ses colonnes, ses anges sur le tympan et le monogramme jésuite « IHS », renferme encore le portail Renaissance du palais.\n\nApprochez-vous : nombre de ces pierres présentent de petites gravures. Certains pensent qu'il s'agit des marques laissées par les équipes de tailleurs de pierre ; la légende raconte que les maîtres tailleurs savaient « charger » la pierre d'énergie. En 2010, des chercheurs les ont interprétées comme des notes de musique, une hypothèse depuis lors contestée. Il n'y a pas de réponse définitive : trouvez-en une et choisissez la vôtre.","d":"Dehors, sur la place","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La façade du Gesù Nuovo est recouverte de pointes de diamant en pierre grise","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"La façade du Gesù Nuovo, avec son portail et sa grande fenêtre, est ornée de pierres de taille à pointes en losange."}},{"t":"L'expulsion d'Héliodore","x":"Il s'agit de la grande fresque au-dessus de la porte d'entrée : elle a été peinte par Francesco Solimena, qui l'a signée et datée de 1725. De nombreux visiteurs ne la voient pas, car ils entrent face à l'autel : il faut se retourner.\n\nL'histoire est tirée de la Bible (Deuxième Livre des Maccabées) : Héliodore tente de piller le trésor du Temple de Jérusalem et est repoussé par un chevalier céleste. Il se lance alors à la recherche du chevalier, des chevaux et des fuyards : une scène théâtrale, pleine de mouvement, typique de l'époque baroque.\n\nDe part et d'autre de la grande fenêtre, au-dessus de la fresque, se trouvent deux scènes plus petites de Belisario Corenzio, datant de 1638 : Sainte Hélène trouvant la Croix et la Conversion de saint Paul.","d":"Dès que vous entrez, tournez-vous vers la porte : elle se trouve au-dessus de l’entrée.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"La grande fresque de l'Expulsion d'Héliodore par Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"La fresque de Solimena au-dessus de l'entrée : tournez-vous vers la porte pour la voir. Au centre, le chevalier céleste repousse Héliodore."}},{"t":"Le dôme et les quatre évangélistes","x":"Arrêtez-vous au centre de l'église, à la jonction de la nef et du transept, et levez les yeux. Dans les quatre triangles courbes soutenant la coupole (les pendentifs) figurent les quatre évangélistes peints par Giovanni Lanfranco au XVIIe siècle : ils sont les seuls vestiges de son grand cycle, le reste ayant disparu avec la coupole.\n\nLa coupole, en réalité, a connu une histoire mouvementée. La coupole d'origine s'est effondrée lors du tremblement de terre de 1688 ; elle fut reconstruite, mais demeurait instable et fut démolie à la fin du XVIIIe siècle. En 1786, elle fut remplacée par une couverture plus basse en forme de bol, celle que l'on voit aujourd'hui ; en 1975, elle fut renforcée par une structure en béton armé.\n\nTout autour de vous se trouve le baroque napolitain dans son intégralité : marbre incrusté de plusieurs couleurs (« marmi commessi »), stuc doré, fresques de Belisario Corenzio et Paolo De Matteis sur les voûtes, toiles de Luca Giordano et sculptures de Cosimo Fanzago.","d":"Au centre de l'église, levez les yeux.","foto":{"u":"../img/3dd3789513c8.jpg","alt":"La nef du Gesù Nuovo, vue depuis le dôme","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nef du Gesù Nuovo : à l'endroit où elle croise le transept, levez les yeux vers le dôme et les quatre pendentifs représentant les évangélistes."}},{"t":"La chapelle Sant'Ignazio","x":"Voici la grande chapelle située au fond du transept gauche, dédiée à saint Ignace de Loyola, fondateur des Jésuites. L'architecture et les marbres sont l'œuvre de Cosimo Fanzago et de ses collaborateurs, entre 1637 et 1645 ; de part et d'autre de l'autel, les deux statues des prophètes David et Jérémie sont également de Fanzago.\n\nLes toiles illustrant la vie du saint sont l'œuvre de Jusepe de Ribera, peintre espagnol ayant travaillé à Naples et devenu l'un de ses maîtres. Le mécène, Carlo Gesualdo da Venosa, est enterré au pied de l'autel.\n\nTraversez ensuite l'église : en face, dans l'aile droite, se trouve la chapelle « jumelle » de Saint François-Xavier, le premier missionnaire jésuite en Asie, avec des sculptures de Fanzago et, au-dessus, trois toiles de Luca Giordano datant de 1676-1677. Admirez-les une à une : elles représentent le summum de l'art napolitain du XVIIe siècle.","d":"Dans l'une des deux grandes chapelles de l'église","foto":{"u":"../img/835d153e2859.jpg","alt":"Une toile de Ribera représentant saint Ignace en gloire","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Saint Ignace en gloire, une toile de Jusepe de Ribera dans la chapelle dédiée au fondateur des Jésuites."}},{"t":"Saint Joseph Moscati","x":"Ici repose le « saint médecin » de Naples : Giuseppe Moscati, médecin et professeur d’université qui soignait gratuitement les plus démunis et leur apportait même une aide financière. Il mourut en 1927 et fut canonisé par le pape Jean-Paul II en 1987.\n\nSa dépouille repose dans l'urne en bronze située au centre de la chapelle de la Visitation, la deuxième à droite, où elle fut inhumée en 1977. Cette urne est l'œuvre d'Amedeo Garufi : admirez les trois bas-reliefs qui le représentent donnant des cours à l'université, guérissant un enfant dans les bras de sa mère et soignant les malades à l'hôpital. À gauche se trouve sa statue en bronze, datant de 1990.\n\nDepuis la chapelle San Francesco Saverio, une porte donne accès aux appartements de San Giuseppe Moscati : photos, manuscrits, vêtements et instruments médicaux, ainsi que le bureau et la chambre de sa maison, reconstitués ici. Dans ces mêmes appartements est exposée une bombe de la Seconde Guerre mondiale qui est tombée sur le plafond de l’église sans exploser.","d":"Dans la chapelle de la Visitation, sous l'autel","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La chambre reconstituée de saint Giuseppe Moscati : blouse blanche et instruments médicaux dans une vitrine","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Dans la pièce reconstituée : la blouse blanche, les instruments médicaux et les photographies de saint Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La place Gesù Nuovo devant l'église","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La place Gesù Nuovo, devant l'église."},{"u":"../img/6d1ae4837518.jpg","alt":"L'intérieur du Gesù Nuovo, avec ses marbres colorés et son maître-autel","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"À l'intérieur, le contraste avec la façade austère : marbre coloré, fresques et or jusqu'au maître-autel."},{"u":"../img/3dd3789513c8.jpg","alt":"La nef du Gesù Nuovo vue depuis l'entrée","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nef vue de l'entrée : en bas, au-dessus, la coupole avec les évangélistes de Lanfranco à sa base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastère et complexe de Santa Chiara (cloître en majolique)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Le cloître revêtu de majolique est l'un des endroits les plus calmes du centre : à deux pas du chaos de Spaccanapoli, le silence règne.","rac":"Santa Chiara fut construite en 1310 sur ordre du roi Robert d'Anjou et de la reine Sancha de Majorque. La construction fut d'abord dirigée par Gagliardo Primario, puis par Lionardo di Vito, et l'église fut ouverte au culte en 1340. Le complexe comprenait deux parties : un couvent pour les Clarisses et un autre pour les Frères Mineurs, adjacents mais séparés.\n\nQuatre siècles plus tard, à la suggestion de la reine Marie-Amélie de Saxe, épouse de Charles de Bourbon, le cloître des Clarisses fut rénové. L'architecte Domenico Antonio Vaccaro conserva les arcades gothiques du XIVe siècle et transforma le centre en un jardin baroque, orné de carreaux de faïence provenant de l'atelier de Donato et Giuseppe Massa. Le résultat est l'un des lieux les plus surprenants de Naples : un jardin de céramique à deux pas de Spaccanapoli.\n\nL'église est de style gothique, avec une façade ornée d'une large flèche qui encadre l'ancienne rosace. À l'intérieur, elle se compose d'une nef unique flanquée de dix chapelles de chaque côté. Le bombardement du 4 août 1943 l'a durement touchée : il a également détruit une partie des fresques du cloître, et la reconstruction a permis de restaurer les formes gothiques que le stuc du XVIIIe siècle masquait.\n\nSous le complexe se cache une autre surprise : les vestiges d’un établissement thermal romain, découverts lors de travaux de restauration après la guerre. Ils comprenaient un gymnase, une piscine intérieure et des salles de bains à air chaud : ce sont les témoignages les plus complets des thermes antiques de Neapolis.","con":"Le dimanche, le cloître ferme à 14h : si c’est dimanche après-midi, inversez votre commande et venez d’abord ici.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'entrée du cloître de Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'entrée du cloître en majolique de Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloître et musée"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloître et musée"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Les piliers en majolique","x":"Le jardin est divisé en quatre sections par deux allées qui se croisent, et le long de ces allées s'étendent 64 piliers octogonaux, tous recouverts de faïence. Les décorations sont des guirlandes de feuilles, de fleurs et de fruits ; les couleurs les plus courantes sont le jaune, l'orange et le bleu, choisies pour évoquer les agrumes et les vignes de la pergola qui s'y élèvent.\n\nLes carreaux de faïence proviennent de l'atelier de Donato et Giuseppe Massa, qui ont suivi les plans de l'architecte napolitain Domenico Antonio Vaccaro : ce dernier souhaitait une harmonie entre les glaçures, l'architecture et les végétaux. Les piliers sont coiffés de chapiteaux en piperno et reliés par des bancs, eux aussi entièrement réalisés en faïence.\n\nLe cloître fut ainsi transformé aux alentours de 1742, lorsque l'abbesse était sœur Ippolita Carmignano : c'est la reine Marie-Amélie de Saxe, épouse de Charles de Bourbon, qui a poussé à plusieurs reprises les religieuses à le « moderniser ».","d":"Dans le jardin du cloître","foto":{"u":"../img/924627d30fda.jpg","alt":"Piliers recouverts de carreaux de faïence jaunes et verts dans le cloître","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Les piliers recouverts de faïence ornée de guirlandes de feuilles, de fleurs et de fruits, sous la pergola."}},{"t":"Les scènes sur les sièges","x":"Installez-vous : les sièges reliant les piliers sont tous en faïence, et leurs dossiers sont ornés de petites scènes du XVIIIe siècle. On y découvre des paysages champêtres, la mer, des fêtes populaires et des récits mythologiques : une narration à travers des figures emblématiques de l’époque.\n\nLes scènes se poursuivent sur le muret qui entoure les parterres de fleurs : promenez-vous lentement le long des allées et regardez en bas, ainsi que sur les côtés.\n\nUn conseil : c’est un excellent jeu avec les enfants. Choisissez chacun une scène et racontez-vous ce qui se passe : qui pêche, qui danse, qui travaille aux champs.","d":"Au dos des sièges, entre les piliers","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un siège en faïence avec une scène peinte sur le dossier","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un siège en majolique provenant du cloître : au dos se trouve une scène peinte."}},{"t":"Clarissa avec les chats","x":"Parmi toutes les scènes ornant les dossiers des fauteuils, l'une d'elles évoque le monastère lui-même : une clarisse nourrissant les chats du cloître. Un petit moment de la vie quotidienne, peint en majolique au XVIIIe siècle par l'atelier Massa.\n\nLes Clarisses sont les religieuses de l'ordre de Sainte Claire : le complexe a en fait débuté avec deux couvents voisins mais distincts, l'un pour les Clarisses et l'autre pour les Frères Mineurs.\n\nLe trouver est une véritable chasse au trésor, même pour les enfants : parcourez les sièges un par un. Si vous ne le trouvez pas, demandez au personnel du cloître.","d":"Sur l'un des dossiers des sièges : cherchez-le","foto":null},{"t":"Les arches du XIVe siècle","x":"Le jardin est baroque, mais le cadre est médiéval. Le complexe fut commandé en 1310 par le roi Robert d'Anjou et la reine Sancha de Majorque ; les travaux furent dirigés par Gagliardo Primario puis par Lionardo di Vito, et l'église fut ouverte au culte en 1340.\n\nLorsque Vaccaro réaménagea le jardin au XVIIIe siècle, il conserva le périmètre du XIVe siècle : les arcs brisés sur piliers en piperno. Remarquez le contraste entre la pierre austère des arcs et les couleurs vives des carreaux de faïence : quatre siècles en un seul regard.\n\nLes murs, sur leurs quatre côtés, sont ornés de fresques de la première moitié du XVIIe siècle, réalisées par un artiste inconnu, peut-être de l'école de Belisario Corenzio, et représentant des scènes de l'Ancien Testament. En entrant, la première partie du mur de droite est vide : ces fresques ont été détruites lors du bombardement du 4 août 1943.","d":"Le long des quatre côtés du cloître","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Les arcades du cloître de Santa Chiara se détachent sur la lumière, avec l'église en arrière-plan.","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Les arcades gothiques du cloître de Santa Chiara, vues à contre-jour : la façade de l’église en arrière-plan."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Majolique avec une scène de chasse au sanglier","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Gros plan : une chasse au sanglier peinte sur faïence par l'atelier Massa, entre 1739 et 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"Le cloître avec ses colonnes en majolique, ses bancs et son jardin","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Le cloître dans son ensemble : les colonnes en majolique, les sièges et le jardin."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Chapelle Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Le Christ voilé, l'une des sculptures les plus célèbres au monde, et les machines anatomiques du prince alchimiste Raimondo di Sangro.","rac":"La chapelle de la famille di Sangro est le royaume de Raimondo, prince de Sansevero : un homme de science et de secrets, grand maître de la franc-maçonnerie, autour duquel le mythe est né de son vivant, et c'est lui-même qui l'a alimenté.\n\nAu centre se dresse le Christ voilé de Giuseppe Sanmartino, commandé par le prince : un corps allongé recouvert d’un linceul si fin qu’il ressemble à un chiffon mouillé, pourtant taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine se trouvent deux « machines anatomiques », les squelettes d’un homme et d’une femme aux vaisseaux sanguins reconstitués, œuvres du médecin palermitain Giuseppe Salerno, réalisées entre 1756 et 1764 environ. La légende noire évoque des serviteurs sacrifiés et des injections mystérieuses ; le musée lui-même prend soin de distinguer le mythe de l’histoire documentée.","con":"Elle est fermée le mardi : si aujourd’hui est mardi, la statue du Nil se trouve à deux minutes et est toujours visible.","acc":"La nef et la sacristie sont accessibles aux personnes en fauteuil roulant. L'auditorium souterrain, qui abrite des machines d'anatomie, n'est accessible que par un étroit escalier en colimaçon du XIXe siècle.","foto":{"u":"../img/65421f883be6.jpg","alt":"L'extérieur de la chapelle Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La chapelle Sansevero vue de l'extérieur."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Le Christ voilé","x":"Au centre de la chapelle gît un corps étendu sur un matelas, la tête et le torse surélevés par un oreiller, recouvert d'un linceul si fin qu'on aperçoit le visage, les plaies et les veines. Ce voile n'est pas un ajout tardif : Giuseppe Sanmartino l'a sculpté dans le même bloc de marbre que la statue en 1753, à la demande du prince Raimondo di Sangro.\n\nUn document signé par le prince pour payer le sculpteur stipule : « une statue en marbre grandeur nature, représentant le Seigneur Jésus-Christ mort, recouverte d’un linceul transparent taillé dans le même bloc que la statue. » Pendant des siècles, on a cru que le voile était un véritable tissu transformé en marbre par un procédé alchimique opéré par le prince : ce n’est qu’une légende.\n\nObservez les détails : la plaie à son flanc, les marques des clous sur sa main et, à ses pieds, la couronne d’épines et les clous de la Passion. Puis, tournez lentement autour de lui : de chaque côté, le voile semble changer.","d":"Au centre de la nef","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Le visage du Christ voilé sous le voile de marbre","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Le visage sous le voile : le linceul est sculpté dans le même bloc de marbre que la statue, et pourtant il ressemble à un chiffon mouillé."}},{"t":"Modestie","x":"Une jeune femme enveloppée d'un voile qui colle à sa peau comme s'il était mouillé, une guirlande de roses dans les cheveux. Ce tableau a été sculpté en 1752 par le Vénitien Antonio Corradini, sculpteur de renommée européenne qui avait également travaillé pour l'empereur à Vienne. Il mourut la même année, alors qu'il concevait les autres décorations de la chapelle, comme l'indique une plaque sur le pilier.\n\nLe prince Raimondo l'a dédié à sa mère, Cecilia Gaetani dell'Aquila d'Aragona, décédée le 26 décembre 1710, alors qu'il n'avait pas encore un an. Il y recherche les symboles d'une vie fauchée trop tôt : le regard perdu, l'arbre qui pousse sur la pierre et la pierre tombale brisée à ses pieds.\n\nSur le socle se trouve un bas-relief représentant le « Noli me tangere », le Christ ressuscité apparaissant à Marie-Madeleine. Le musée précise que la femme voilée peut également être interprétée comme une image de la Sagesse et évoque la déesse voilée Isis.","d":"Près du maître-autel","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La statue de la Modestie, une femme couverte d'un voile","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Modestie, d'Antonio Corradini : le voile colle à son corps comme s'il était mouillé. À ses pieds, une pierre tombale brisée."}},{"t":"La désillusion","x":"Un homme se libère d'un grand filet, aidé par un petit génie ailé dont le front est orné d'une flamme, symbole de l'intellect humain. À ses pieds se trouve un globe terrestre, représentant les passions du monde, surmonté d'une Bible ouverte. Cette œuvre a été sculptée par le Génois Francesco Queirolo entre 1753 et 1754.\n\nLe prince la dédia à son père, Antonio : devenu veuf, celui-ci avait confié son fils à son grand-père et parcouru l’Europe, menant une vie dissolue. Puis, vieil homme repentant, il était revenu à Naples et était devenu prêtre. Le filet symbolise le péché dont l’homme se libère.\n\nObservez attentivement le filet : il est entièrement en marbre, perforé maille par maille. On raconte que les artisans chargés de sa finition refusèrent d'y toucher de peur de le briser, et que Queirolo dut le polir lui-même. Dès 1753, un contemporain le qualifiait de « dernier exploit audacieux que la sculpture sur marbre puisse oser entreprendre ».","d":"Près du maître-autel","foto":{"u":"../img/921cf7f91318.jpg","alt":"La statue de la Désillusion, un homme se libérant d'un filet","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Désillusion de Francesco Queirolo : le filet est entièrement fait de marbre, perforé à la main."}},{"t":"Le sol labyrinthique","x":"Le sol sur lequel vous marchez n'est pas l'original. Le prince en avait conçu un labyrinthique : des marbres colorés, du bleu au blanc, traversés par une ligne continue de marbre blanc sans jointure, formant des svastikas alternant avec des carrés concentriques en perspective. Francesco Celebrano l'exécuta à partir du milieu des années 1760 ; le prince lui-même écrivit que l'ouvrage fut « difficile et semé d'embûches ».\n\nEn 1889, un grave effondrement toucha le palais et la chapelle et endommagea le sol : au lieu de le restaurer, il fut refait en terre cuite napolitaine, avec un émail jaune et bleu correspondant aux armoiries de la famille di Sangro.\n\nCherchez les dalles originales dans le passage situé devant le tombeau de Raimondo di Sangro ; d’autres se trouvent dans la cavea souterraine et dans la sacristie. Pour le prince, le labyrinthe symbolisait le chemin ardu menant à la connaissance.","d":"Dans le passage devant le tombeau du prince","foto":null},{"t":"Les machines anatomiques","x":"Descendez l'étroit escalier menant à la cavea souterraine : à l'intérieur de deux vitrines se trouvent les squelettes debout d'un homme et d'une femme, avec les systèmes artériel et veineux presque intacts, jusqu'aux vaisseaux les plus fins.\n\nElles furent réalisées par le médecin palermitain Giuseppe Salerno. Le prince acquit la statuette masculine en 1756, après l'avoir vue lors d'une exposition publique à Naples. Il engagea Salerno pour la réalisation de la seconde. Elles étaient installées au palais, dans une pièce appelée « Appartement du Phénix ». La statuette féminine reposait sur une plateforme pivotante permettant de l'observer sous tous les angles.\n\nUne légende noire s'est forgée autour de ces vases : on racontait que le prince avait fait assassiner deux serviteurs et leur avait injecté une substance mystérieuse. En réalité, ces vases sont des reconstitutions réalisées à partir de divers matériaux, dont de la cire d'abeille et des colorants ; les connaissances anatomiques qu'ils témoignent sont, pour l'époque, stupéfiantes.","d":"Dans la cavea souterraine, en descendant un étroit escalier en colimaçon","foto":{"u":"../img/a3a047434411.jpg","alt":"Un squelette avec le système vasculaire sanguin dans la vitrine de la cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"L'une des deux machines anatomiques de Giuseppe Salerno dans la cavea souterraine : squelette et système circulatoire."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"L'intérieur de la chapelle Sansevero avec les statues","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"L'ensemble de la chapelle : au centre, le Christ voilé, entouré des statues de la famille di Sangro."}],"leg":"De son vivant, Raimondo di Sangro a fait couler beaucoup d'encre : expériences mystérieuses, secrets alchimiques, et même des serviteurs transformés en machines anatomiques. Le musée distingue soigneusement la légende noire des faits avérés : il est judicieux d'écouter les deux versions et de se faire sa propre opinion.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"L'église où saint Thomas d'Aquin a vécu et enseigné et où, selon la tradition, un crucifix lui a parlé.","rac":"Le complexe dominicain surplombe la place du même nom, le long de la rue Spaccanapoli. L'église gothique-angevine fut construite entre 1283 et 1324, puis transformée à l'époque baroque. Thomas d'Aquin vécut et enseigna au couvent entre 1272 et 1274 ; Giordano Bruno et Tommaso Campanella y furent également liés.\n\nDans la sacristie, dont la voûte est ornée de fresques réalisées par Francesco Solimena en 1709, reposent les souverains aragonais. Pendant des siècles, la basilique a également abrité un chef-d'œuvre du Caravage, la Flagellation du Christ, aujourd'hui conservée au musée de Capodimonte.\n\nAujourd'hui, le complexe peut également être visité en tant que musée DOMA : sacristie, tombeaux aragonais et cellule de saint Thomas.","con":"Si vous avez le temps, profitez-en pour découvrir le musée : la sacristie, les tombeaux aragonais et la cellule de saint Thomas. Les horaires varient et certaines sections peuvent être fermées pour rénovation ; consultez le site web officiel avant votre visite.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"La flèche de San Domenico et l'abside de l'église sur la place","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"La flèche de San Domenico et, derrière, l'abside de l'église."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visites guidées."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"Le crucifix qui a parlé à saint Thomas","x":"Il s'agit d'un panneau peint, conservé dans la basilique. La tradition rapporte que le Christ s'adressa à Thomas d'Aquin, qui priait après avoir écrit sur la théologie : il lui dit qu'il avait écrit en bien à son sujet et lui demanda quelle récompense il désirait. Le ministère de la Culture se souvient de ce panneau comme étant celui qui « parla » au saint et précise qu'il fut transféré dans une nouvelle chapelle en 1437.","d":"À l'intérieur de la basilique, dans la chapelle du Crucifix","foto":{"u":"../img/4b0972ad805f.jpg","alt":"La chapelle du Crucifix à San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"La chapelle du Crucifix à San Domenico Maggiore, où est conservée la peinture du miracle."}},{"t":"La sacristie de Solimena et les tombeaux aragonais","x":"La voûte de la sacristie fut ornée d'une fresque réalisée par Francesco Solimena en 1709, représentant le Triomphe de l'Ordre dominicain. Le long des murs se trouvent les caveaux funéraires des souverains aragonais et d'autres dignitaires de la cour.","d":"Dans la sacristie, visitez le musée DOMA","foto":{"u":"../img/07519e21f0fa.jpg","alt":"La sacristie de San Domenico Maggiore avec sa voûte ornée de fresques","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"La sacristie de San Domenico Maggiore, avec la voûte de Francesco Solimena et les arcs aragonais."}},{"t":"La cellule de saint Thomas","x":"Thomas d'Aquin a vécu et étudié ici. Sa cellule a été restaurée et se visite, tout comme le musée DOMA.","d":"Sur le parcours du musée","foto":{"u":"../img/f68192e11f82.jpg","alt":"La cellule de saint Thomas d'Aquin avec son reliquaire et son mobilier","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"La cellule de saint Thomas d'Aquin au couvent de San Domenico Maggiore."}}],"gal":[],"leg":"On raconte que le crucifix peint sur bois, conservé dans la basilique, a parlé à saint Thomas d'Aquin pendant qu'il priait : il lui a dit qu'il avait écrit du bien de lui et lui a demandé quelle récompense il désirait.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli et statue du Nil","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Une statue romaine du dieu Nil, prise pendant des siècles pour une femme allaitant : le « Corps de Naples ».","rac":"Sur la Piazzetta Nilo, le long de la Via San Biagio dei Librai, également connue sous le nom de Spaccanapoli, se dresse une statue en marbre du IIe-IIIe siècle après J.-C. représentant le dieu du Nil : un homme barbu, allongé, tenant une corne d’abondance et entouré de chérubins symbolisant les bras du fleuve. Elle fut érigée par des marchands alexandrins qui résidaient dans ce quartier, appelé Regio Nilensis.\n\nOn la découvrit décapitée en 1476. Les Napolitains la prirent pour une figure féminine allaitant des enfants, symbole de la ville nourrissant ses habitants : d’où le nom de « Corpo di Napoli », qui donne encore aujourd’hui son nom à la place. En 1657, elle fut placée sur un nouveau socle, et au cours du même siècle, une tête barbue fut sculptée.\n\nAujourd'hui, la statue est toujours là, témoignant des racines multiculturelles de Naples.","con":"Prenez votre temps : c’est un arrêt de cinq minutes sur la route Spaccanapoli. Cherchez les chérubins sur le corps de la déesse : ils expliquent pourquoi on l’a prise pour une femme.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"L'ancienne statue du dieu Nil, couché","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statue du dieu Nil, couché, se trouve sur la petite place qui porte son nom."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"Le dieu Nil et les chérubins","x":"Le dieu du fleuve gît sur le côté, tenant une corne d'abondance. Les chérubins qui l'entourent symbolisent les bras du Nil. À ceux qui contemplaient longuement sa forme sans tête, elle ressemblait à une femme allaitant.","d":"Au centre de la place","foto":{"u":"../img/83dce4234fd4.jpg","alt":"La statue du dieu Nil allongé avec des putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"Le dieu Nil allongé avec la corne d'abondance et des chérubins."}},{"t":"Pourquoi « Corpo di Napoli »","x":"La statue fut découverte décapitée en 1476. On en conclut qu'il s'agissait d'une figure féminine allaitant ses enfants : la ville elle-même. Cette interprétation perdura, même après que la statue eut reçu une nouvelle tête.","d":"Sur la base et dans le nom de la place","foto":{"u":"../img/c0e842c87218.jpg","alt":"La statue du Nil sur son piédestal sur la place","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"La statue sur le socle du Largo Corpo à Naples."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai et ses boutiques","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Le quartier des libraires et des artisans de Spaccanapoli : boutiques, églises et l'hôpital des poupées.","rac":"Il s'agit du tronçon de la rue Spaccanapoli qui s'étend de la Piazzetta Nilo à la Via Duomo, sur le decumanus inférieur. Son nom provient des librairies qui s'y sont toujours installées : une inscription sur le Palazzo Marigliano, tout proche, commémore l'art des maîtres libraires. La dévotion à saint Blaise remonte au VIIIe siècle, lorsque des religieuses arméniennes apportèrent une relique du saint à Naples. On trouve également sur cette rue l'Ospedale delle Bambole, un atelier artisanal transmis de génération en génération.","con":"Décembre est le mois des magasins de crèches : préparez-vous à une forte affluence le week-end.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"La Via San Biagio dei Librai vue de face : une rue pavée étroite bordée de hauts immeubles, avec des balcons, du linge qui sèche, des boutiques et des piétons, et la colline du Vomero au loin.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"La Via San Biagio dei Librai, la partie la plus animée de Spaccanapoli, regorge de boutiques et de conversations animées."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La rue des libraires","x":"L'église San Biagio dei Librai relie la Piazzetta Nilo et la Via Duomo et fait partie du decumanus inférieur. Son nom évoque les nombreuses librairies qui s'y sont toujours dressées, ainsi que l'église San Biagio Maggiore, dédiée au saint patron des personnes souffrant de maux de gorge. Cette dévotion s'est implantée au VIIIe siècle avec des religieuses arméniennes qui apportèrent une relique du saint.\n\nLe philosophe et historien Giambattista Vico est né dans cette rue.\n\nMarchez lentement : c'est l'une des rues les plus animées de Naples, toujours pleine de monde.","d":"En chemin","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai : la ruelle étroite, les boutiques et une bannière suspendue en hauteur.","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai : la rue étroite et droite du bas decumanus, avec ses boutiques et ses passants."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella chez les libraires et le crâne avec des oreilles","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Une minuscule église de tailleur de pierre dédiée à la sainte des yeux, et un crâne unique : celui avec des oreilles.","rac":"Fondée peu avant 1327 par Bartolomeo di Capua, juriste des rois angevins, l'église fut ensuite confiée aux pipernieri, les tailleurs de pierre : ils choisirent Sainte Lucie, protectrice de la vue, car les éclats de bois de leur métier mettaient leurs yeux en danger.\n\nAbandonné pendant plus de trente ans, il a rouvert ses portes le 5 avril 2019 grâce à l'association Respiriamo Arte. Dans sa crypte souterraine, le culte des « âmes malades » a laissé un crâne pas comme les autres : il possède des oreilles.","con":"Il est petit et se visite en quelques minutes seulement : parfait pour une pause entre Sansevero et Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Le portail de Santa Luciella dans la ruelle","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Le portail de Santa Luciella. Levez les yeux : au-dessus se trouve la fresque représentant les armoiries des Pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Les armoiries des Pipernieri","x":"Avant d'entrer, levez les yeux : au-dessus du portail du piperno se trouve encore la fresque avec les armoiries de la guilde des pipernieri, les tailleurs de pierre auxquels appartenait l'église.\n\nIls travaillaient le piperno, une pierre très dure, au burin et au marteau, et craignaient que des éclats ne leur blessent les yeux : c’est pourquoi ils choisirent sainte Lucie, protectrice de la vue. C’était une puissante guilde ; on disait même qu’elle pouvait imprégner les pierres d’énergies positives ou négatives.\n\nL'église est très ancienne : elle fut fondée peu avant 1327 par Bartolomeo di Capua, conseiller des rois angevins. Sur la vue de Naples de Baratta (1629), elle est mentionnée comme la chapelle des meuniers ; elle fut reconstruite au XVIIIe siècle. Elle resta fermée et abandonnée pendant plus de trente ans, jusqu'à sa réouverture par l'association Respiriamo Arte le 5 avril 2019.","d":"Au-dessus du portail d'entrée","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"La fresque au-dessus du portail de Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"La fresque au-dessus du portail de Santa Luciella, avec les armoiries de la corporation des pipernieri."}},{"t":"Le crâne avec des oreilles","x":"Sous l'église, dans l'hypogée, repose un crâne dont le cartilage auriculaire momifié est conservé : c'est pourquoi il est considéré comme unique. La tradition populaire veut que, précisément parce qu'il possède des oreilles, il entende mieux les prières de ceux qui implorent une faveur.\n\nL’hypogée ne se visite qu’avec un guide. Grâce au projet « Chemins de lumière », soutenu par le FAI et Intesa Sanpaolo, les lumières s’allument progressivement, révélant des zones tantôt éclairées, tantôt plongées dans l’ombre : laissez-vous guider.\n\nN'oubliez pas que c'est un lieu lié au défunt et à la dévotion : on le contemple avec respect, à voix basse.","d":"Dans l'hypogée, avec une visite guidée","foto":{"u":"../img/7a5a070c0866.jpg","alt":"Le crâne avec oreilles dans l'hypogée de Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"Le crâne avec les oreilles : on peut voir les cartilages momifiés sur les côtés du crâne."}},{"t":"Les pauvres âmes","x":"Au XVIIe siècle, la peste emporta des milliers de personnes à Naples : les morts furent enterrés dans des fosses communes et leurs noms tombèrent dans l’oubli. C’est ainsi que naquit le culte des « anime pezzentelle », ces pauvres âmes mortes sans nom, sans funérailles, sans prières.\n\nQuiconque demandait une grâce (une guérison, une grossesse, de l'aide) « adoptait » l'un de ces crânes, la « capuzzelle » : il le nettoyait, le plaçait dans une niche et priait pour lui, afin que l'âme atteigne le Ciel et se souvienne là de celui qui l'avait aidée.\n\nLe culte de Santa Luciella était profondément enraciné. On le trouve au Purgatorio ad Arco, sur la Via dei Tribunali, et son lieu symbolique est le cimetière Fontanelle, dans le quartier de Sanità.","d":"Dans l'hypogée","foto":{"u":"../img/8110a7061c73.jpg","alt":"Crânes illuminés à la lueur des bougies, avec une plaque « pour la grâce reçue »","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Crânes exposés dans des vitrines : une plaque porte le nom de la personne qui a accordé cette faveur, une façon de remercier les âmes « démunies »."}}],"gal":[],"leg":"On dit que le crâne avec des oreilles, précisément parce qu'il a des oreilles, écoute mieux les prières : c'est pourquoi, de génération en génération, on lui confie les requêtes les plus difficiles.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Hôpital des poupées","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Une boutique qui sélectionne des poupées et des jouets depuis des générations : une vitrine dont les enfants, et les adultes, se souviendront toujours.","rac":"À la fin du XIXe siècle, Luigi Grassi travaillait comme décorateur de théâtre et de crèches. Ses voisins commencèrent à lui apporter des poupées et des jouets cassés, et son atelier devint, presque par hasard, le premier « hôpital » de jouets de Naples.\n\nAujourd'hui, c'est Tiziana, l'arrière-petite-fille du fondateur, qui dirige l'établissement, dans la cour du Palazzo Marigliano, Via San Biagio dei Librai. À l'intérieur, il fonctionne comme un véritable hôpital : blouses blanches, salles et dossier médical pour chaque patient. Pour de nombreux Napolitains, c'est l'endroit où ils emmenaient leur jouet préféré lorsqu'ils étaient enfants.","con":"La vitrine à elle seule vaut le détour : elle se trouve sur le chemin du retour.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"La vitrine de l'hôpital des poupées remplie de poupées","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"Vitrine de l'hôpital des poupées : des poupées et des jouets en attente d'être « guéris »."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Horaires d'ouverture en octobre et novembre : susceptibles de changer à d'autres moments."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Horaires d'ouverture en octobre et novembre : susceptibles de changer à d'autres moments."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un véritable hôpital, pour les jouets","x":"Ce n'est pas une boutique, mais un laboratoire organisé comme un hôpital : les patients sont des poupées, des ours en peluche et des animaux en peluche, chacun avec sa propre histoire.\n\nLes « médecins » travaillent en blouse blanche, répartis en services comme dans un véritable hôpital : orthopédie, ophtalmologie et couture. Chaque patient possède son propre dossier médical et son propre diagnostic.\n\nC'est un endroit que les enfants adorent, mais aussi les adultes qui y retrouvent des jouets de leur enfance.","d":"Dans le magasin","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Têtes de poupées en attente de réparation","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Têtes, bras et yeux de poupées en attente de réparation : dans l'atelier, chaque pièce a son propre « département »."}},{"t":"Le fondateur décorateur","x":"Tout a commencé à la fin du XIXe siècle avec Luigi Grassi, qui construisait des décors de théâtre et des crèches. Ses voisins ont commencé à lui apporter des jouets cassés, et il a transformé son atelier en le premier « hôpital » pour poupées.\n\nDepuis, le cabinet médical s'est transmis de génération en génération au sein de la même famille : aujourd'hui, les patients sont soignés par Tiziana, son arrière-petite-fille.\n\nPensez au lien avec la ville : Naples est la ville des crèches de Noël, et la Via San Gregorio Armeno, la rue des boutiques de bergers, est à deux pas d’ici.","d":"Dans l'histoire du magasin","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"La porte de la boutique de l'hôpital des poupées avec les fenêtres","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"L'entrée de l'hôpital des poupées sur la Via San Biagio dei Librai : la boutique ouverte par la famille Grassi."}},{"t":"La cour du Palais Marigliano","x":"L'hôpital est situé dans la cour du Palais Marigliano, au numéro 39 de la Via San Biagio dei Librai : l'un des bâtiments de la Renaissance napolitaine lié aux noms des architectes Giovanni Francesco Mormando et Giovanni Francesco di Palma.\n\nDès que l'on franchit la porte principale, le bruit de la rue s'estompe : c'est l'une des nombreuses cours cachées du centre historique qui méritent d'être découvertes. Une inscription sur le bâtiment rappelle également qu'une basilique augustéenne se dressait autrefois à proximité.\n\nToute la rue mérite le détour : c'est le « decumanus inférieur » de la ville grecque, la rue des libraires, et c'est ici que naquit le philosophe Giambattista Vico.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"La cour jaune du Palazzo Marigliano avec son arche d'entrée","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"La cour du Palazzo Marigliano, avec son arche d'entrée et ses façades couleur ocre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, la rue des crèches","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Une ruelle étroite où Noël dure toute l'année : ateliers d'artisans, bergers en terre cuite et crèches.","rac":"La Via San Gregorio Armeno relie la Via dei Tribunali à la Via San Biagio dei Librai, également connue sous le nom de Spaccanapoli. C'est la rue des crèches : des ateliers d'artisans y exposent figurines et crèches toute l'année, même en été. Selon certaines sources, la tradition de fabrication de figurines en terre cuite dans ce quartier remonte à l'époque romaine ; la crèche napolitaine a acquis une renommée internationale au XVIIIe siècle.\n\nParmi les boutiques historiques, on trouve Gambardella, en activité depuis 1800, et les Frères Capuano, fondée en 1840. Le long de cette rue se dresse également le monastère de San Gregorio Armeno, qui lui a donné son nom, avec son église dédiée à Sainte Patrizia, co-patronne de Naples.\n\nLa période la plus chargée s'étend de fin novembre à l'Épiphanie, lorsque la rue est très fréquentée.","con":"Venez tôt le matin et en semaine : il y a beaucoup de monde en décembre. Cherchez les bergers qui racontent l’actualité : chaque année, les artisans en créent de nouvelles.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"La rue des crèches, étroite et pleine de boutiques","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, la rue des crèches."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Les magasins de crèches","x":"Les ateliers fabriquent des bergers et des crèches en terre cuite et en liège, souvent peints à la main. À côté des personnages traditionnels, on trouve des figures contemporaines : chaque année, les artisans en inventent de nouvelles. On peut aussi flâner sans rien acheter : beaucoup d’artisans travaillent à la vue de tous.","d":"Tout au long du chemin","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"Un banc rempli de bergers de la crèche","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Un étal dans la rue des bergers, parmi des figures traditionnelles et des personnages modernes."}},{"t":"Le monastère de San Gregorio Armeno","x":"Le monastère a donné son nom à la rue. L'église conserve un plafond à caissons de Teodoro d'Errico et des fresques de Luca Giordano, dont la Gloire de saint Grégoire. Le complexe comprend également une église dédiée à sainte Patricia, co-patronne de Naples.","d":"À l'intérieur du monastère, le long de la rue","foto":{"u":"../img/30ec6bba5546.jpg","alt":"La nef de l'église San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"L'église San Gregorio Armeno, avec son plafond à caissons et ses fresques."}},{"t":"Quand partir","x":"Les magasins sont ouverts toute l'année. La période la plus fréquentée s'étend de fin novembre à l'Épiphanie, lorsque les rues sont bondées : les jours de semaine et tôt le matin sont les meilleurs moments.","d":"Tout au long du chemin","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"Rue bondée de San Gregorio Armeno","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno : à privilégier en semaine et tôt le matin."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore et les fouilles Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Une église gothique du XIIIe siècle qui dissimule, dix mètres sous la nef, le marché de l'ancienne Neapolis : rues, boutiques et pièces datant d'il y a deux mille ans.","rac":"La Piazza San Gaetano est le cœur de la vieille ville Neapolis. La basilique gothique San Lorenzo Maggiore, l'une des plus anciennes églises de la ville, fut construite au XIIIe siècle sur les vestiges du marché gréco-romain. Le complexe comprend également le couvent, le musée de l'Opéra et les fouilles archéologiques.\n\nLes fouilles, commencées en 1976, ont mis au jour le macellum, le marché, qui s'étendait autrefois le long de l'ancien decumanus major. En descendant une dizaine de mètres sous l'église, on traverse des rues, des boutiques et des pièces datant de l'époque impériale. Les vestiges d'une basilique chrétienne du VIe siècle ont également été découverts sous l'église.\n\nLe musée de l'Opéra, installé dans le couvent et la tour civique, retrace l'histoire de Naples de l'Antiquité au XIXe siècle.","con":"Descendez dans les fouilles : c’est la partie la plus surprenante. Prévoyez environ 45 minutes et consultez les horaires sur le site web officiel avant de venir.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"La façade de San Lorenzo Maggiore sur la Piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wiki
