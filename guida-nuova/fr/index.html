<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guide de Naples · Ceraldi</title>
<meta name="theme-color" content="#2E3A2F">
<link rel="stylesheet" href="../caratteri/caratteri.css">
<link rel="stylesheet" href="../mappa/maplibre-gl.css">
<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:var(--superficie);border-radius:14px;padding:14px}
.guarda .mini{width:32px;height:32px;position:relative}
.guarda.con-foto{grid-template-columns:minmax(0,1fr);padding:0 0 14px;overflow:hidden}
.guarda.con-foto .mini{width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.guarda.con-foto>div:last-child{padding:0 14px}
.guarda .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.02rem}
.guarda .dove{font-size:.82rem;color:var(--accento);font-weight:500}
.guarda p{font-size:.95rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<main class="pagina" id="app" aria-live="polite"></main>
<script>
var D = {"lingua":"fr","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità et Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Point de départ : Piazza Carità, sur la Via Toledo. De là, le centre historique commence à quelques minutes à pied. Et voici Ceraldi.","rac":"","con":"Avant de partir, un café : la visite est longue et Naples se découvre mieux avec une bonne tasse de café.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità oggi, con gli alberi e i palazzi colorati","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità oggi, sulla via Toledo: da qui partono tutti i giri. Ceraldi è qui."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Photo d'époque de la Via Toledo au XIXe siècle, avec des calèches et des passants.","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La Via Toledo au XIXe siècle, alors appelée Via Roma, sur une photo de Giacomo Brogi."}],"leg":"","fc":null},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, le decumanus inférieur","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La route rectiligne qui coupe le centre historique en deux : le decumanus inférieur de la ville grecque, environ deux kilomètres d’églises, de boutiques et de vie.","rac":"Spaccanapoli est la plus basse des trois decumani, ces rues parallèles qui traversaient Neapolis grecque d'ouest en est. Elle débute sur la Piazza del Gesù Nuovo sous le nom de Via Benedetto Croce, devient ensuite Via San Biagio dei Librai, croise la Via Duomo et se prolonge au-delà de la vieille ville : environ deux kilomètres au total. Son nom est éloquent : elle est si longue et rectiligne que, vue d'en haut, elle semble couper la ville en deux.","con":"Suivez-la à pied depuis la Piazza del Gesù en direction de la Via Duomo : c'est une légère descente chargée d'histoire, sans effort.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":8,"s":"gesu-nuovo","n":"Place et église du Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une façade de pierres pyramidales qui ressemble à une forteresse et dissimule un mystère : des inscriptions gravées que personne n’a encore déchiffrées avec certitude.","rac":"Avant d'être une église, c'était un palais : celui des princes Sanseverino, construit en 1470 ; une plaque sur la façade commémore l'architecte, Novello da San Lucano. Les Jésuites ont préservé la structure et la pierre de taille sombre, le piperno, taillée en pyramides, en y ajoutant des éléments en marbre blanc.\n\nCertaines pierres portent des inscriptions gravées. La légende veut qu'il s'agisse d'un message secret ; certains érudits pensent qu'il s'agit des marques laissées par différents tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique d'une partition intitulée « Énigme ». Observez attentivement et faites-vous votre propre opinion.\n\nLa façade a été restaurée et dévoilée le 12 mars 2023, après la chute de quelques fragments en décembre 2017 ; la place est fermée à la circulation automobile depuis lors.","con":"Cherchez les marques sur les pierres à hauteur des yeux, à droite et à gauche du portail : la chasse est gratuite.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La facciata del Gesù Nuovo, di pietre scure tagliate a punta","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La facciata a punte di diamante: era il palazzo dei principi Sanseverino, del 1470. Avvicinati e cerca i segni incisi sulle pietre."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La façade en forme de losange","x":"Avant d'être une église, c'était la façade du palais des princes Sanseverino, datant de 1470. Les Jésuites l'ont conservée en l'état, avec ses pierres de piperno sombres taillées en pyramides, et y ont ajouté le grand portail baroque. Approchez : nombre de ces pierres portent des inscriptions gravées, dont la signification reste encore aujourd'hui sujette à interprétation.","d":"Dehors, sur la place","foto":null},{"t":"L'expulsion d'Héliodore","x":"La grande fresque de la contrefaçon est l'œuvre de Francesco Solimena, datant de 1725. Elle représente Héliodore tentant de piller le Temple de Jérusalem et repoussé par un chevalier céleste : une scène pleine de mouvement, de chevaux et de personnages en fuite. Nombre de visiteurs la manquent car ils entrent face à l'autel.","d":"Dès que vous entrez, tournez-vous vers la porte : elle se trouve au-dessus de l’entrée.","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"La grande fresque de l'Expulsion d'Héliodore par Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"La fresque de Solimena au-dessus de l'entrée : tournez-vous vers la porte pour la voir. Au centre, le chevalier céleste repousse Héliodore."}},{"t":"Le dôme et les quatre évangélistes","x":"Les quatre triangles à la base du dôme représentent les évangélistes, peints par Giovanni Lanfranco. Le dôme que vous voyez aujourd'hui n'est cependant pas l'original : il s'est effondré lors du tremblement de terre de 1688 et a été remplacé en 1786 par une structure plus basse, en forme de bol.","d":"Au centre de l'église, levez les yeux.","foto":null},{"t":"La chapelle Sant'Ignazio","x":"Dédié au fondateur des Jésuites, ce lieu réunit deux grands noms de l'art napolitain du XVIIe siècle : Cosimo Fanzago, auteur des monuments et statues des prophètes David et Jérémie, et Jusepe de Ribera, qui a peint les toiles illustrant la vie du saint. Marbres colorés, statues et peintures s'y côtoient : le baroque napolitain à son apogée.","d":"Dans l'une des deux grandes chapelles de l'église","foto":null},{"t":"Saint Joseph Moscati","x":"Ici repose le « saint docteur » de Naples : Giuseppe Moscati, chercheur et professeur d’université qui soignait les pauvres gratuitement. Décédé en 1927, il fut canonisé en 1987. Ses restes reposent dans une urne en bronze du sculpteur Amedeo Garufi, sous l’autel de la chapelle de la Visitation.","d":"Dans la chapelle de la Visitation, sous l'autel","foto":null}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La place Gesù Nuovo devant l'église","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La place Gesù Nuovo, devant l'église."},{"u":"../img/6d1ae4837518.jpg","alt":"L'intérieur du Gesù Nuovo, avec ses marbres colorés et son maître-autel","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"Dentro, il contrasto con la facciata severa: marmi colorati, affreschi e oro fino all'altare maggiore."},{"u":"../img/3dd3789513c8.jpg","alt":"La navata del Gesù Nuovo vista dall'ingresso","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La navata vista dall'ingresso: in fondo, in alto, la cupola con gli evangelisti di Lanfranco alla base."}],"leg":"","fc":null},{"id":9,"s":"santa-chiara","n":"Monastère et complexe de Santa Chiara (cloître en majolique)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Le cloître revêtu de majolique est l'un des endroits les plus calmes du centre : à deux pas du chaos de Spaccanapoli, le silence règne.","rac":"Santa Chiara fut construite en 1310 sur ordre du roi Robert d'Anjou et de la reine Sancha de Majorque. La construction fut d'abord dirigée par Gagliardo Primario, puis par Lionardo di Vito, et l'église fut ouverte au culte en 1340. Le complexe comprenait deux parties : un couvent pour les Clarisses et un autre pour les Frères Mineurs, adjacents mais séparés.\n\nQuatre siècles plus tard, à la suggestion de la reine Marie-Amélie de Saxe, épouse de Charles de Bourbon, le cloître des Clarisses fut rénové. L'architecte Domenico Antonio Vaccaro conserva les arcades gothiques du XIVe siècle et transforma le centre en un jardin baroque, orné de carreaux de faïence provenant de l'atelier de Donato et Giuseppe Massa. Le résultat est l'un des lieux les plus surprenants de Naples : un jardin de céramique à deux pas de Spaccanapoli.","con":"Le dimanche, le cloître ferme à 14h : si c’est dimanche après-midi, inversez votre commande et venez d’abord ici.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'ingresso del chiostro di Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'ingresso del chiostro maiolicato di Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloître et musée"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloître et musée"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"}],"ant":true,"dett":[{"t":"Les piliers en majolique","x":"Soixante-quatre piliers recouverts de carreaux de majolique ornés de guirlandes de feuilles, de fleurs et de fruits se dressent sous une pergola. Les teintes jaunes, orangées et bleues évoquent les agrumes et les vignes environnantes. Ces carreaux proviennent de l'atelier de Donato et Giuseppe Massa, dans le jardin baroque conçu par Domenico Antonio Vaccaro.","d":"Dans le jardin du cloître","foto":{"u":"../img/924627d30fda.jpg","alt":"Piliers recouverts de carreaux de faïence jaunes et verts dans le cloître","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Les piliers recouverts de faïence ornée de guirlandes de feuilles, de fleurs et de fruits, sous la pergola."}},{"t":"Les scènes sur les sièges","x":"Les sièges reliant les piliers sont tous en faïence, et leurs dossiers sont ornés de petites scènes peintes : la vie à la campagne, la vie au bord de la mer, les fêtes populaires, les légendes. Ils représentent la vie napolitaine du XVIIIe siècle, racontée en images. Asseyez-vous et observez attentivement celui qui est derrière vous.","d":"Au dos des sièges, entre les piliers","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un siège en faïence avec une scène peinte sur le dossier","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un siège en majolique provenant du cloître : au dos se trouve une scène peinte."}},{"t":"Clarissa avec les chats","x":"Parmi les scènes représentées, une clarisse nourrit les chats du cloître : un petit aperçu de la vie quotidienne au monastère, peint sur la faïence. La trouver est une véritable chasse au trésor, même pour les enfants.","d":"Sur l'un des dossiers des sièges : cherchez-le","foto":null},{"t":"Les arches du XIVe siècle","x":"Le jardin est baroque, mais le cadre est médiéval : Vaccaro a conservé le périmètre du XIVe siècle avec ses arcs brisés, vestige du monastère angevin. Remarquez le contraste entre la pierre austère des arcades et les couleurs vives des carreaux de faïence : quatre siècles en un seul regard.","d":"Le long des quatre côtés du cloître","foto":null}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Maioliche con una scena di caccia al cinghiale","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"Da vicino: una caccia al cinghiale dipinta sulle maioliche dalla bottega dei Massa, tra il 1739 e il 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"Il chiostro con i pilastri di maiolica, i sedili e il giardino","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Il chiostro intero: i pilastri di maiolica, i sedili e il giardino."}],"leg":"","fc":null},{"id":10,"s":"cappella-sansevero","n":"Chapelle Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Le Christ voilé, l'une des sculptures les plus célèbres au monde, et les machines anatomiques du prince alchimiste Raimondo di Sangro.","rac":"La chapelle de la famille di Sangro est le royaume de Raimondo, prince de Sansevero : un homme de science et de secrets, grand maître de la franc-maçonnerie, autour duquel le mythe est né de son vivant, et c'est lui-même qui l'a alimenté.\n\nAu centre se dresse le Christ voilé de Giuseppe Sanmartino, commandé par le prince : un corps allongé recouvert d’un linceul si fin qu’il ressemble à un chiffon mouillé, pourtant taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine se trouvent deux « machines anatomiques », les squelettes d’un homme et d’une femme aux vaisseaux sanguins reconstitués, œuvres du médecin palermitain Giuseppe Salerno, réalisées entre 1756 et 1764 environ. La légende noire évoque des serviteurs sacrifiés et des injections mystérieuses ; le musée lui-même prend soin de distinguer le mythe de l’histoire documentée.","con":"Elle est fermée le mardi : si aujourd’hui est mardi, la statue du Nil se trouve à deux minutes et est toujours visible.","acc":"La nef et la sacristie sont accessibles aux personnes en fauteuil roulant. L'auditorium souterrain, qui abrite des machines d'anatomie, n'est accessible que par un étroit escalier en colimaçon du XIXe siècle.","foto":{"u":"../img/65421f883be6.jpg","alt":"L'esterno della Cappella Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La Cappella Sansevero vista da fuori."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Le Christ voilé","x":"Un corps étendu sur un matelas, recouvert d'un linceul si fin qu'on aperçoit le visage, les blessures et les veines. Ce voile n'est pas un ajout : Giuseppe Sanmartino l'a sculpté dans le même bloc de marbre que la statue, commandée par le prince Raimondo di Sangro. Tournez-en lentement autour : le voile semble changer d'un côté à l'autre.","d":"Au centre de la nef","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Le visage du Christ voilé sous le voile de marbre","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Le visage sous le voile : le linceul est sculpté dans le même bloc de marbre que la statue, et pourtant il ressemble à un chiffon mouillé."}},{"t":"Modestie","x":"Une femme enveloppée d'un voile qui colle à sa peau comme s'il était mouillé, ornée d'une guirlande de roses. Sculptée par Antonio Corradini en 1752, année de sa mort, cette statue fut dédiée par le prince à sa mère, Cecilia Gaetani, décédée alors qu'il n'avait pas encore un an. À ses pieds, la pierre tombale brisée symbolise une vie fauchée trop tôt.","d":"Près du maître-autel","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La statue de la Modestie, une femme couverte d'un voile","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"Modestie, d'Antonio Corradini : le voile colle à son corps comme s'il était mouillé. À ses pieds, une pierre tombale brisée."}},{"t":"La désillusion","x":"Un homme se libère d'un grand filet grâce à un petit génie ailé dont le front est orné d'une flamme, symbole d'intelligence. Francesco Queirolo sculpta cette œuvre en 1753-1754 en mémoire du père du prince. Le filet est entièrement réalisé en marbre perforé : selon la tradition, les assistants refusèrent de le polir par crainte de le briser, si bien que le sculpteur le fit lui-même.","d":"Près du maître-autel","foto":{"u":"../img/921cf7f91318.jpg","alt":"La statue de la Désillusion, un homme se libérant d'un filet","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Désillusion de Francesco Queirolo : le filet est entièrement fait de marbre, perforé à la main."}},{"t":"Le sol labyrinthique","x":"Le sol d'origine était un labyrinthe de marbres colorés traversé par une ligne blanche continue, conçu par le prince comme un symbole du chemin ardu vers la connaissance. Francesco Celebrano le fit construire jusqu'aux alentours de 1771. Un effondrement en 1889 en détruisit la quasi-totalité : il n'en reste que quelques dalles dans le passage devant le tombeau de Raimondo, dans la cavea et dans la sacristie.","d":"Dans le passage devant le tombeau du prince","foto":null},{"t":"Les machines anatomiques","x":"Deux squelettes, celui d'un homme et celui d'une femme, dont les vaisseaux sanguins ont été reconstitués avec une précision qui continue d'émerveiller. Ils furent créés par le médecin palermitain Giuseppe Salerno entre 1756 et 1764. La sombre légende du prince naquit autour d'eux : le musée explique avec soin où s'arrête l'histoire et où commence le mythe.","d":"Dans la cavea souterraine, en descendant un étroit escalier en colimaçon","foto":null}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"L'interno della Cappella Sansevero con le statue","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La cappella intera: al centro il Cristo velato, intorno le statue della famiglia di Sangro."}],"leg":"De son vivant, Raimondo di Sangro a fait couler beaucoup d'encre : expériences mystérieuses, secrets alchimiques, et même des serviteurs transformés en machines anatomiques. Le musée distingue soigneusement la légende noire des faits avérés : il est judicieux d'écouter les deux versions et de se faire sa propre opinion.","fc":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli et statue du Nil","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"La statua antica del dio Nilo, sdraiato","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statua del dio Nilo, sdraiato, nella piccola piazza che porta il suo nome."},"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai et ses boutiques","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Le quartier des libraires et des artisans de Spaccanapoli : boutiques, églises et l'hôpital des poupées.","rac":"Il s'agit du tronçon de la rue Spaccanapoli qui s'étend de la Piazzetta Nilo à la Via Duomo, sur le decumanus inférieur. Son nom provient des librairies qui s'y sont toujours installées : une inscription sur le Palazzo Marigliano, tout proche, commémore l'art des maîtres libraires. La dévotion à saint Blaise remonte au VIIIe siècle, lorsque des religieuses arméniennes apportèrent une relique du saint à Naples. On trouve également sur cette rue l'Ospedale delle Bambole, un atelier artisanal transmis de génération en génération.","con":"Décembre est le mois des magasins de crèches : préparez-vous à une forte affluence le week-end.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[],"gal":[],"leg":"","fc":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella chez les libraires et le crâne avec des oreilles","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une minuscule église de tailleur de pierre dédiée à la sainte des yeux, et un crâne unique : celui avec des oreilles.","rac":"Fondée peu avant 1327 par Bartolomeo di Capua, juriste des rois angevins, l'église fut ensuite confiée aux pipernieri, les tailleurs de pierre : ils choisirent Sainte Lucie, protectrice de la vue, car les éclats de bois de leur métier mettaient leurs yeux en danger.\n\nAbandonné pendant plus de trente ans, il a rouvert ses portes le 5 avril 2019 grâce à l'association Respiriamo Arte. Dans sa crypte souterraine, le culte des « âmes malades » a laissé un crâne pas comme les autres : il possède des oreilles.","con":"Il est petit et se visite en quelques minutes seulement : parfait pour une pause entre Sansevero et Via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Il portale di Santa Luciella nel vicolo","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Il portale di Santa Luciella. Alza gli occhi: sopra c'è l'affresco con lo stemma dei pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"}],"ant":true,"dett":[{"t":"Les armoiries des Pipernieri","x":"Avant d'entrer, levez les yeux : au-dessus du portail en pierre de Piperno, on peut encore voir une fresque représentant les armoiries de la guilde des tailleurs de pierre de Piperno, à qui appartenait l'église. Ils travaillaient parmi les éclats de pierre et, pour cette raison, ils choisirent sainte Lucie, protectrice de la vue.","d":"Au-dessus du portail d'entrée","foto":null},{"t":"Le crâne avec des oreilles","x":"Sous l'église, dans l'hypogée, se trouve un crâne dont le cartilage auriculaire est préservé : ce qui le rend unique. La tradition populaire veut que, précisément grâce à ses oreilles, il entende mieux les prières de ceux qui implorent une faveur.","d":"Dans l'hypogée, avec une visite guidée","foto":null},{"t":"Les pauvres âmes","x":"Au XVIIe siècle, après la peste, les Napolitains « adoptèrent » les crânes des morts anonymes : ils les nettoyaient, priaient pour eux et demandaient de l’aide en retour. C’était le culte des âmes des pauvres (anime pezzentelle). Il en subsiste aujourd’hui l’un des témoignages les plus célèbres de la ville.","d":"Dans l'hypogée","foto":null}],"gal":[],"leg":"On dit que le crâne avec des oreilles, précisément parce qu'il a des oreilles, écoute mieux les prières : c'est pourquoi, de génération en génération, on lui confie les requêtes les plus difficiles.","fc":null},{"id":41,"s":"ospedale-bambole","n":"Hôpital des poupées","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Une boutique qui sélectionne des poupées et des jouets depuis des générations : une vitrine dont les enfants, et les adultes, se souviendront toujours.","rac":"À la fin du XIXe siècle, Luigi Grassi travaillait comme décorateur de théâtre et de crèches. Ses voisins commencèrent à lui apporter des poupées et des jouets cassés, et son atelier devint, presque par hasard, le premier « hôpital » de jouets de Naples.\n\nAujourd'hui, c'est Tiziana, l'arrière-petite-fille du fondateur, qui dirige l'établissement, dans la cour du Palazzo Marigliano, Via San Biagio dei Librai. À l'intérieur, il fonctionne comme un véritable hôpital : blouses blanches, salles et dossier médical pour chaque patient. Pour de nombreux Napolitains, c'est l'endroit où ils emmenaient leur jouet préféré lorsqu'ils étaient enfants.","con":"La vitrine à elle seule vaut le détour : elle se trouve sur le chemin du retour.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"La vetrina dell'Ospedale delle Bambole piena di bambole","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vetrina dell'Ospedale delle Bambole: bambole e giocattoli in attesa di essere «curati»."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"}],"ant":true,"dett":[{"t":"Un véritable hôpital, pour les jouets","x":"Ce n'est pas un magasin, mais un laboratoire organisé comme un hôpital : les « docteurs » en blouse blanche, les services d'orthopédie, d'ophtalmologie et de couture, et les patients, poupées, ours en peluche et jouets en peluche, chacun avec son propre dossier médical et son diagnostic.","d":"Dans le magasin","foto":null},{"t":"Le fondateur décorateur","x":"Tout a commencé à la fin du XIXe siècle avec Luigi Grassi, décorateur de théâtre et de crèches. Ses voisins lui apportaient des jouets cassés, et il transforma son atelier en premier « hôpital ». Aujourd'hui, son arrière-petite-fille, Tiziana, soigne les patients.","d":"Dans l'histoire du magasin","foto":null},{"t":"La cour du Palais Marigliano","x":"L'hôpital se trouve dans la cour du Palazzo Marigliano, le long Spaccanapoli. Dès que l'on franchit la porte principale, le bruit de la rue s'estompe : c'est l'une des nombreuses cours cachées du centre historique qui méritent d'être découvertes.","d":"Via San Biagio dei Librai 39","foto":null}],"gal":[],"leg":"","fc":null},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, l'église de la capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"L'église de la capuzzelle : sous le sol, l'hypogée où Naples priait pour les âmes anonymes. Et le crâne de Lucie.","rac":"Les Napolitains l'appellent « 'e cape 'e morte », l'église des têtes de mort. C'est une petite église du XVIIe siècle, située sur le decumanus principal, liée à la dévotion aux âmes du Purgatoire, répandue par la Contre-Réforme. Un escalier raide mène à l'hypogée, l'église souterraine, agrandie et ornée de majolique au XVIIIe siècle : c'est là que les fidèles prenaient soin des dépouilles anonymes et imploraient leur intercession. Au bout d'un petit couloir, on conserve le crâne de Lucia, une jeune âme particulièrement vénérée.","con":"Derrière l'autel, cherchez le crâne ailé en marbre de Dionisio Lazzari : c'est le symbole de l'église.","acc":"","foto":{"u":"../img/66f88d49a737.jpg","alt":"La facciata del Purgatorio ad Arco su via dei Tribunali","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Purgatorio_ad_Arco_1030822-3.JPG","dida":"La facciata del Purgatorio ad Arco, sul decumano maggiore."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"FAI – Santa Maria delle Anime del Purgatorio ad Arco","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-maria-delle-anime-del-purgatorio-ad-arco"},{"t":"Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true,"dett":[{"t":"Les peintures du XVIIe siècle","x":"Avant de descendre, admirez l'église qui la surplombe : elle abrite de précieux marbres et des tableaux de trois maîtres napolitains du XVIIe siècle : Massimo Stanzione, Luca Giordano et Andrea Vaccaro. C'est la partie supérieure d'un lieu dont la richesse repose avant tout sur ce qui se trouve en contrebas.","d":"Dans l'église haute","foto":null},{"t":"Le crâne ailé","x":"Parmi les ornements de l'église figure un crâne ailé, œuvre de Dionisio Lazzari : une image qui résume l'esprit du lieu, où la mort n'est pas crainte mais devient une occasion de prière et de connexion avec ceux qui ne sont plus parmi nous.","d":"Dans l'église haute","foto":null},{"t":"L'Hypogée des Âmes","x":"La véritable église est souterraine : un vaste espace où, encore aujourd’hui, des fidèles veillent sur des restes humains anonymes et implorent leur protection. Elle fut agrandie et ornée de faïences au XVIIIe siècle. Descendez lentement : c’est un lieu de dévotion vivante, et non un simple lieu de curiosité.","d":"Sous l'église, en descendant un escalier raide","foto":null},{"t":"Le crâne de Lucia","x":"Parmi tous les crânes de l'hypogée, l'un est particulièrement vénéré : celui de Lucie, que l'on croit être l'âme d'une jeune femme. Conservé au fond d'un petit couloir, il constitue le témoignage le plus émouvant du culte des âmes du Purgatoire.","d":"Dans l'hypogée, au bout d'un petit couloir","foto":null}],"gal":[{"u":"../img/36b3b8212bd1.jpg","alt":"Un'immagine delle anime del Purgatorio tra le fiamme dentro la chiesa","aut":"Adam Harangozó","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Santa_Maria_delle_Anime_del_Purgatorio_ad_Arco_03.jpg","dida":"Dentro la chiesa: le anime del Purgatorio tra le fiamme, il tema di tutto il luogo."},{"u":"../img/de63b1b83fa8.jpg","alt":"Un teschio di bronzo su una colonnina","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:TeschiopurgatorioadarcoNapoli.jpg","dida":"Un teschio di bronzo: il simbolo della chiesa delle «capuzzelle»."}],"leg":"","fc":null},{"id":15,"s":"napoli-sotterranea","n":"Napoli Sotterranea","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 69, su via dei Tribunali, accanto alla basilica di San Paolo Maggiore","lat":40.85085,"lon":14.25705,"mp":17,"dv":80,"gr":false,"sa":false,"sito":"https://www.napolisotterranea.org/","po":"https://www.napolisotterranea.org/en/visiting-hours/","som":"Quarante mètres sous la Via dei Tribunali : les citernes qui, pendant des siècles, ont fourni de l'eau à Naples, des abris de guerre et un théâtre romain caché sous un lit.","rac":"Sous le centre historique se cache une autre ville. Depuis la Piazza San Gaetano, on descend une centaine de marches jusqu'à une profondeur d'environ 40 mètres, en empruntant un chemin qui traverse un aqueduc gréco-romain et des tunnels datant des époques médiévale, bourbonienne et moderne.\n\nCes grottes datant de l'époque grecque ont servi de citernes pour l'approvisionnement en eau de la ville pendant environ 23 siècles. Durant la Seconde Guerre mondiale, ces mêmes espaces ont été transformés en abris anti-aériens.\n\nLa visite souterraine est guidée et dure environ une heure. Vous remontez ensuite à la surface pour la surprise finale : les vestiges du théâtre gréco-romain de Neapolis, intégrés aux maisons du quartier depuis le XVe siècle. Vous pénétrez dans un « basso », une maison de plain-pied, déplacez un lit et descendez par une trappe à l’intérieur des murs du théâtre.","con":"Des chaussures basses et un sweat-shirt sont recommandés, même en été : l’air est humide sous terre. Le court passage étroit éclairé à la bougie est facultatif. Réservation obligatoire pour les groupes de 10 personnes ou plus.","acc":"Ne convient pas aux fauteuils roulants ni aux déambulateurs : présence d’escaliers avec rampes et de passages étroits.","foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Una grande cisterna sotterranea scavata nel tufo, poco illuminata","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"Una delle grandi cisterne scavate nel tufo, circa 40 metri sotto via dei Tribunali."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"19:00","ui":"18:00","n":"Des visites guidées sont proposées toutes les heures de 10h à 18h, en italien et en anglais. Elles sont également disponibles le jeudi à 21h, sur réservation uniquement et pour les groupes d'au moins 10 personnes."}],"fonti":[{"t":"Napoli Sotterranea – Orari di visita","u":"https://www.napolisotterranea.org/en/visiting-hours/"},{"t":"Napoli Sotterranea – Domande frequenti","u":"https://www.napolisotterranea.org/en/faq/"},{"t":"Napoli Sotterranea – Il percorso del Teatro greco-romano","u":"https://www.napolisotterranea.org/en/the-path/the-path-greek-roman-theater/"}],"ant":true,"dett":[{"t":"Les citernes gréco-romaines","x":"Les salles de l'époque grecque, creusées dans le tuf, ont servi de citernes à eau à Naples pendant environ 23 siècles, reliées par l'aqueduc gréco-romain.","d":"Dans la première partie de la visite, à environ 40 mètres de profondeur","foto":{"u":"../img/bd8239fed0ef.jpg","alt":"Les parois en tuf d'une citerne souterraine","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030796.JPG","dida":"Les parois en tuf d'une citerne : pendant environ 23 siècles, l'eau de la ville a été collectée ici."}},{"t":"Le passage avec la bougie","x":"Un très court passage étroit se parcourt avec une bougie à la main. C'est facultatif : ceux qui préfèrent ne pas le faire peuvent utiliser la lampe torche de leur téléphone.","d":"Le long du chemin souterrain","foto":{"u":"../img/a874f33cc5df.jpg","alt":"Un tunnel très étroit éclairé dans le tuf","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cunicolo_1030806.JPG","dida":"L'un des tunnels très étroits creusés dans le tuf."}},{"t":"Les abris de guerre","x":"Durant la Seconde Guerre mondiale, ces pièces souterraines servaient d'abris anti-aériens : la ville s'y réfugiait pour se protéger des bombardements.","d":"Le long du chemin souterrain","foto":{"u":"../img/0f4490838101.jpg","alt":"Des artefacts de la Seconde Guerre mondiale sont exposés sous terre.","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_memorie_di_guerra_1030801.JPG","dida":"Souvenirs de la guerre : objets datant de l'époque où ces pièces servaient d'abris anti-aériens."}},{"t":"Le théâtre sous le lit","x":"Les vestiges du théâtre gréco-romain de Neapolis ont été intégrés à des maisons modernes au XVe siècle. On entre dans un sous-sol, on déplace le lit et, par une trappe, on descend dans les murs du théâtre.","d":"Deuxième partie de la visite, en surface entre la Via Anticaglia et le Vico Cinquesanti","foto":null}],"gal":[],"leg":"D'après le récit de cette visite, Néron disposait de ses loges dans des pièces secrètes situées sous l'étage inférieur lorsqu'il venait à Naples pour jouer au théâtre.","fc":"si"},{"id":18,"s":"duomo-san-gennaro","n":"Cathédrale et Trésor de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cathédrale de Naples et la chapelle du Trésor, où est conservée la fiole du sang de saint Gennaro.","rac":"Dans la cathédrale, dans une niche de la chapelle du Trésor, est conservée l'ampoule contenant le sang traditionnellement attribué à saint Gennaro. Trois fois par an (le samedi précédant le premier dimanche de mai, le 19 septembre et le 16 décembre), on attend sa liquéfaction. Depuis 1601, les reliques sont confiées à une institution séculière, la Députation de la chapelle du Trésor de saint Gennaro.","con":"Les jours de liquéfaction de l'eau, le Duomo est bondé dès le matin : si vous voulez y être, arrivez tôt.","acc":"","foto":{"u":"../img/bbfb14ecb434.jpg","alt":"La facciata del Duomo di Napoli","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_Cathedral_-_Duomo_di_Napoli%2C_Fa%C3%A7ade_%285315-Pan%29.jpg","dida":"La facciata del Duomo, su via Duomo. La Cappella del Tesoro è la terza a destra."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"},{"t":"FAI – Duomo di Santa Maria Assunta","u":"https://fondoambiente.it/luoghi/duomo-di-santa-maria-assunta-napoli"}],"ant":true,"dett":[{"t":"Le portail de San Gennaro","x":"La façade, d'une cinquantaine de mètres de haut, possède trois portails. Celui de droite reste fermé presque toute l'année : il n'ouvre que pour la fête de San Gennaro et lors d'occasions spéciales. Si vous le trouvez ouvert, c'est que vous êtes arrivé un jour exceptionnel.","d":"À l'avant, à droite","foto":null},{"t":"La chapelle du trésor","x":"Plus qu'une chapelle, c'est une église dans l'église : de style baroque, avec un plan en croix grecque, une coupole à double dôme et une grande porte en bronze de Cosimo Fanzago. Elle abrite le buste en argent de saint Janvier et les fioles contenant son sang, dont la ville attend la liquéfaction.","d":"Troisième chapelle à droite","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"Le dôme de la chapelle du Trésor est orné de fresques représentant le Paradis.","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"Levez les yeux : dans le dôme de la chapelle du Trésor se trouve le Paradis peint par Giovanni Lanfranco."}},{"t":"Saint Restituta","x":"Lorsque Charles d'Anjou fit construire la cathédrale en 1294, l'une des plus anciennes basiliques fut préservée et transformée en chapelle : Santa Restituta. Elle abrite des œuvres de Luca Giordano et des sculptures du XIVe siècle. De là, on descend vers la zone archéologique située sous la cathédrale, qui recèle des vestiges gréco-romains et paléochrétiens.","d":"Dans l'allée de gauche","foto":{"u":"../img/5abf53aec271.jpg","alt":"Une mosaïque avec la Madone trônant dans la Basilique de Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Une mosaïque de la Vierge en majesté à l'intérieur de Santa Restituta : la plus ancienne basilique, conservée comme chapelle de la cathédrale."}},{"t":"Le baptistère de San Giovanni in Fonte","x":"Un petit espace chargé d'histoire : il est considéré comme le plus ancien baptistère du monde occidental. Prenez quelques instants pour vous y arrêter : vous vous trouvez dans l'un des plus anciens sites chrétiens encore debout en Europe.","d":"À droite de l'abside","foto":null},{"t":"Le Succorpo","x":"Sous l'autel se trouve une crypte Renaissance à trois nefs, commandée par le cardinal Oliviero Carafa pour abriter les reliques de saint Gennaro et d'autres saints, conçue par Giovan Tommaso Malvito. Colonnes antiques et marbre blanc : une Renaissance silencieuse au sein de la cathédrale gothique.","d":"Sous le maître-autel","foto":null}],"gal":[],"leg":"","fc":null},{"id":43,"s":"banksy-madonna","n":"La Madone armée d'un pistolet, selon Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Une Madone par Banksy avec un pistolet à la place d'une auréole, protégée par une vitre, au cœur du decumanus principal.","rac":"Sur la Piazzetta dei Girolamini, sur la façade du decumanus principal, Banksy a réalisé une Madone armée d'un pistolet en guise d'auréole. Aujourd'hui, elle est protégée par une vitre. Le site web officiel du tourisme de la ville l'intègre à son itinéraire consacré au street art dans le centre historique.","con":"Levez les yeux : l'œuvre se trouve au-dessus du niveau de la rue, derrière une vitre.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"FAI – «Madonna con la pistola» di Banksy","u":"https://fondoambiente.it/luoghi/madonna-con-la-pistola-di-banksy"}],"ant":true,"dett":[{"t":"La Madone au pistolet","x":"Blanche sur fond noir, au pochoir : une Vierge à l’Enfant, les bras levés vers le ciel, et, à la place d’une auréole, un pistolet. Banksy l’a peinte à Naples en 2010. Le message reste inexpliqué : chacun l’interprète à sa manière, entre sacré et profane.","d":"Sur le mur de la petite place","foto":null},{"t":"Le kiosque à journaux d'à côté","x":"À côté de la fresque se trouve un petit reliquaire votif représentant la Vierge à l'Enfant, comme on en trouve dans de nombreuses rues de Naples. Les deux images, côte à côte, semblent se regarder : c'est ce dialogue qui confère à l'œuvre son caractère si napolitain.","d":"Juste à côté de l'œuvre","foto":null},{"t":"Un Banksy sous verre","x":"En 2010, Banksy a réalisé deux œuvres à Naples, probablement la même nuit : l’autre, située Via Benedetto Croce, a ensuite été recouverte par un autre artiste. C’est pourquoi le FAI (Fonds italien pour le patrimoine culturel immatériel de l’Italie) la considère comme la seule fresque de Banksy en Italie, désormais protégée par une vitrine en plexiglas pour prévenir le vandalisme.","d":"Devant le travail","foto":null}],"gal":[],"leg":"","fc":null},{"id":44,"s":"murale-maradona","n":"La fresque de Maradona","tipo":"altro","zona":"toledo_mare","ind":"Largo Maradona, Quartieri Spagnoli","lat":40.841376,"lon":14.245107,"mp":9,"dv":20,"gr":null,"sa":true,"sito":"","po":"","som":"La fresque tant appréciée du Quartier espagnol et la place qui, depuis 2020, est devenue un sanctuaire laïque dédié à Diego.","rac":"La fresque de Maradona a été peinte en 1990 par Mario Filardi. Dans les années 1990, une fenêtre dans le mur a effacé son visage, et la peinture s'est presque entièrement effacée. Elle a été restaurée par Salvatore Iodice, et à l'automne 2017, l'artiste argentin Francisco Bosoletti a repeint le visage. Après la mort de Maradona le 25 novembre 2020, la place, anciennement connue sous le nom de Place des Artistes, a été rebaptisée en son honneur et s'est ornée d'hommages, de drapeaux et de photographies.","con":"Il y a énormément de monde aux heures de pointe : tôt le matin, il est plus facile de le voir tranquillement.","acc":"","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"Il grande murale di Maradona sulla facciata di un palazzo, con la folla sotto","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Il murale dipinto nel 1990 da Mario Filardi. Il volto di oggi è quello ridipinto nel 2017 dall'artista argentino Francisco Bosoletti."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true,"dett":[],"gal":[{"u":"../img/0094144dd2dd.jpg","alt":"La plaque commémorative de Largo Maradona ornée d'un buste et de drapeaux,","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Placca_del_Largo_Diego_Armando_Maradona%2C_Napoli.jpg","dida":"La plaque sur la place : après la mort de Diego en 2020, la place des artistes a été rebaptisée en son honneur."},{"u":"../img/550f6edc4b91.jpg","alt":"Un petit autel orné de photos de Maradona et de souvenirs","aut":"Cymbella","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_Napoli.JPG","dida":"Un petit sanctuaire dédié à Maradona : il en existe beaucoup dans la ville, avec des photos et des souvenirs laissés par les fans."},{"u":"../img/679687d3070c.jpg","alt":"Maradona peint avec une auréole à côté d'un petit sanctuaire","aut":"Superchilum","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Diego_Maradona_art_in_San_Lorenzo_%28Naples%29_01.jpg","dida":"Maradona avec son auréole et son reliquaire votif, peint dans le quartier de San Lorenzo."},{"u":"../img/80d74e92279d.jpg","alt":"Un reliquaire votif avec un portrait de Maradona","aut":"Argo Navis","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Naples_20230624_071.jpg","dida":"Un reliquaire votif pour Maradona, semblable à ceux des saints."}],"leg":"","fc":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Nouveau Château)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Le château qui est le symbole de Naples : un arc de triomphe entre deux tours, une porte en bronze encore marquée par un boulet de canon, et la salle où un roi fit arrêter les barons lors d'une fête de mariage.","rac":"Sous les rois angevins, le château devint un centre culturel : sous Robert d'Anjou, des artistes, des médecins et des hommes de lettres y séjournèrent, parmi lesquels Giotto, Pétrarque et Boccace.\n\nAlphonse Ier d'Aragon en fit sa résidence royale et la fit reconstruire. Pour célébrer son entrée victorieuse dans la ville, il fit ériger le grand arc de triomphe entre la Tour du Milieu et la Tour de Guet, qui sert encore aujourd'hui d'entrée.\n\nAujourd'hui, le château abrite le Musée Civique : la visite comprend la galerie d'art au premier étage, la Salle des Barons, la chapelle palatine, également connue sous le nom de chapelle de Santa Barbara, et une visite archéologique de l'ancienne armurerie.","con":"Tarif plein : 10 € ; 6 € pour les habitants de Naples et de sa région métropolitaine ; gratuit pour les moins de 18 ans. Fermé le dimanche.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Il Maschio Angioino con le due torri e l'arco bianco in mezzo","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Le due grandi torri e, in mezzo, l'Arco di Trionfo di Alfonso d'Aragona: è l'ingresso del castello."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"L'Arc de Triomphe","x":"Voici l'entrée du château, nichée entre deux tours : Alphonse Ier d'Aragon la fit construire pour célébrer son entrée victorieuse à Naples. Arrêtez-vous devant avant d'entrer et admirez-la d'en bas.","d":"À l'entrée, entre la Tour du Milieu et la Tour de Guet","foto":{"u":"../img/91d08c9a9561.jpg","alt":"L'arc de triomphe en marbre entre les deux tours","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arche en gros plan : regardez-la d'en bas, étage par étage."}},{"t":"La porte avec le boulet de canon","x":"Ferrante d'Aragon la commanda à Guglielmo Monaco vers 1475, pour commémorer la victoire de 1462 sur Jean d'Anjou et les barons rebelles : six panneaux relatent la guerre. Dans le panneau inférieur gauche, un boulet de canon en fer est encore incrusté dans le bronze. Selon l'hypothèse la plus répandue, la porte faisait partie du butin que Charles VIII chargea sur des navires à destination de la France ; au large de Rapallo, la flotte fut attaquée par les Génois et touchée. Ces derniers la renvoyèrent à Naples en 1495.","d":"L'original est conservé à l'intérieur du château","foto":{"u":"../img/50ee03911e6d.jpg","alt":"Le boulet de canon est coincé dans la porte en bronze.","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"Le boulet de canon en fer incrusté dans le bronze, dans le panneau inférieur gauche."}},{"t":"La salle des barons","x":"On y accède par l'escalier extérieur en tuyaux, conçu par l'architecte majorquin Guglielmo Sagrera. Levez les yeux : la voûte s'élève à environ 28 mètres, et seize nervures en tuyaux s'étendent en étoile depuis une ouverture centrale. Son nom rappelle l'année 1486, lorsque le roi Ferrante Ier, par ruse, fit croire aux barons qu'il y célébrait un mariage et les fit arrêter. Pendant cinquante ans, il servit de siège au conseil municipal.","d":"En haut des escaliers de la cour","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La salle des étoiles","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La voûte de la salle des barons : seize nervures en forme d'étoile partent de l'ouverture centrale."}}],"gal":[],"leg":"","fc":null},{"id":32,"s":"castel-dell-ovo","n":"Front de mer et Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Le château sur l'îlot où débarquèrent les colons grecs de Cumes : on y arrive par le front de mer, on traverse le pont et on admire la vue sur le golfe depuis Borgo Marinari.","rac":"Le château se dresse sur l'îlot de Megaride, formé de deux rochers reliés par une grande arche. C'est là, au milieu du VIIe siècle avant J.-C., que débarquèrent des colons venus de Cumes, qui fondèrent plus tard Partenope sur le mont Echia voisin.\n\nAu Ier siècle avant J.-C., la villa de Lucius Licinius Lucullus se dressait sur l'îlot et le mont Echia. Des vestiges de cette villa subsistent dans la salle des Colonnes : au début du Moyen Âge, cette salle servait de réfectoire à l'un des couvents construits sur l'îlot.","con":"L'intérieur du château est fermé pour rénovation jusqu'à nouvel ordre. Aujourd'hui, les visiteurs peuvent admirer le château de l'extérieur, en flânant le long du front de mer et dans le quartier de Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sul mare, con il cielo azzurro","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Castel dell'Ovo sull'isolotto di Megaride, collegato al lungomare da un ponte."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"}],"ant":true,"dett":[{"t":"L'îlot de Megaride","x":"Admirez le château depuis le front de mer : il repose sur deux rochers reliés par une grande arche. Selon la municipalité, c’est ici que débarquèrent les premiers colons venus de Cumes.","d":"Depuis le pont menant à Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo et le port de plaisance de Borgo Marinari vus d'en haut","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Vue d'en haut : le château sur le rocher et, à côté, le petit port de Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Gravure de 1841 représentant le Castel dell'Ovo et un voilier","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Le château dell'Ovo dans une gravure de 1841."}],"leg":"Le nom provient d'une légende : le poète Virgile aurait caché un œuf, enfermé dans une cage, dans les caves du château.","fc":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"La première balade","sub":"Spaccanapoli en une demi-journée, au départ de Ceraldi","desc":"Au cœur du centre historique, en suivant un parcours circulaire : l’église du Gesù Nuovo et son mystère, le cloître de Santa Chiara, le Christ voilé, l’église du Crâne et des Oreilles, les boutiques de la Via San Biagio dei Librai. Et puis, retour à nous.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vista dall'alto: una strada dritta che taglia il centro storico","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vista dall'alto: la lunga strada dritta che taglia in due il centro storico. Il primo giro la percorre a piedi."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café chez Ceraldi et c'est parti !","alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25
