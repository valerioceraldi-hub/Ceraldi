<style>

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}

.contenitore{max-width:640px;margin:0 auto;padding:0 16px 40px}
header.testa{background:var(--scuro);color:var(--su-scuro);padding:18px 16px 16px}
header.testa .riga{max-width:640px;margin:0 auto;display:flex;align-items:flex-start;gap:12px}
header.testa h1{font:400 1.7rem/1.15 var(--f-display);margin:0}
header.testa p{margin:4px 0 0;opacity:.85;font-size:.95rem}
.lingue{margin-left:auto;position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid color-mix(in srgb,var(--su-scuro) 40%,transparent);border-radius:20px;padding:4px 10px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:110%;z-index:20;list-style:none;margin:0;padding:6px;background:var(--superficie);color:var(--testo);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:150px}
.lingue a{display:block;padding:8px 10px;text-decoration:none;color:inherit;border-radius:6px}
.lingue a[aria-current]{font-weight:600;background:color-mix(in srgb,var(--accento) 12%,transparent)}
.avviso{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:.92rem}
.avviso.prova{background:#FFF4D6;color:#5A4300;border:1px solid #E8D193}

.scheda{background:var(--superficie);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
h2{font:400 1.4rem/1.2 var(--f-display);margin:22px 0 8px}
h3{font:600 1rem/1.3 var(--f-testo);margin:0 0 6px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.bottoni{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.bottone{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accento) 35%,transparent);background:var(--superficie);text-decoration:none;color:var(--testo);font-weight:600;text-align:center;cursor:pointer}
.bottone.pieno{background:var(--scuro);color:var(--su-scuro);border-color:var(--scuro)}
.lista{list-style:none;margin:0;padding:0}
.voce{display:block;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:14px 16px;margin:10px 0}
.voce .titolo{font:400 1.2rem/1.25 var(--f-display);color:var(--testo)}
.voce .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600}
.stato::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.stato.ok{color:var(--ok)}.stato.ko{color:var(--ko)}.stato.att{color:var(--attenzione)}.stato.neutro{color:var(--testo-2)}
.indietro{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0;padding:8px 0;background:none;border:0;color:var(--accento);font-weight:600;cursor:pointer}
.mappa{height:340px;border-radius:14px;overflow:hidden;margin:12px 0;background:#e8e4dc}
.num{width:28px;height:28px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:700 .85rem var(--f-testo);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.num.casa{background:var(--accento)}
.tappa{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--superficie);border-radius:14px;padding:14px;margin:10px 0}
.tappa .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.tappa .tra{grid-column:1/-1;font-size:.88rem;color:var(--testo-2);margin:-4px 0 0 46px}
.alt{margin-top:8px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--attenzione) 9%,var(--superficie));font-size:.92rem}
.testo p{margin:0 0 12px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--testo) 10%,transparent);vertical-align:top}
.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:700}
.foto{margin:12px 0 0}.foto img{width:100%;border-radius:14px;display:block}.foto figcaption{font-size:.78rem;color:var(--testo-2);margin-top:4px}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center}
.visuale[hidden]{display:none}
@media (min-width:700px){header.testa h1{font-size:2rem}}
</style>

<script>
var D = {"lingua":"fr","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità et Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Point de départ : Piazza Carità, sur la Via Toledo. De là, le centre historique commence à quelques minutes à pied. Et voici Ceraldi.","rac":"","con":"Avant de partir, un café : la visite est longue et Naples se découvre mieux avec une bonne tasse de café.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, le decumanus inférieur","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La route rectiligne qui coupe le centre historique en deux : le decumanus inférieur de la ville grecque, environ deux kilomètres d’églises, de boutiques et de vie.","rac":"Spaccanapoli est la plus basse des trois decumani, ces rues parallèles qui traversaient Neapolis grecque d'ouest en est. Elle débute sur la Piazza del Gesù Nuovo sous le nom de Via Benedetto Croce, devient ensuite Via San Biagio dei Librai, croise la Via Duomo et se prolonge au-delà de la vieille ville : environ deux kilomètres au total. Son nom est éloquent : elle est si longue et rectiligne que, vue d'en haut, elle semble couper la ville en deux.","con":"Suivez-la à pied depuis la Piazza del Gesù en direction de la Via Duomo : c'est une légère descente chargée d'histoire, sans effort.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true},{"id":8,"s":"gesu-nuovo","n":"Place et église du Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une façade de pierres pyramidales qui ressemble à une forteresse et dissimule un mystère : des inscriptions gravées que personne n’a encore déchiffrées avec certitude.","rac":"Avant d'être une église, c'était un palais : celui des princes Sanseverino, construit en 1470 ; une plaque sur la façade commémore l'architecte, Novello da San Lucano. Les Jésuites ont préservé la structure et la pierre de taille sombre, le piperno, taillée en pyramides, en y ajoutant des éléments en marbre blanc.\n\nCertaines pierres portent des inscriptions gravées. La légende veut qu'il s'agisse d'un message secret ; certains érudits pensent qu'il s'agit des marques laissées par différents tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique d'une partition intitulée « Énigme ». Observez attentivement et faites-vous votre propre opinion.\n\nLa façade a été restaurée et dévoilée le 12 mars 2023, après la chute de quelques fragments en décembre 2017 ; la place est fermée à la circulation automobile depuis lors.","con":"Cherchez les marques sur les pierres à hauteur des yeux, à droite et à gauche du portail : la chasse est gratuite.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"}],"ant":true},{"id":9,"s":"santa-chiara","n":"Monastère et complexe de Santa Chiara (cloître en majolique)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Le cloître revêtu de majolique est l'un des endroits les plus calmes du centre : à deux pas du chaos de Spaccanapoli, le silence règne.","rac":"","con":"Le dimanche, le cloître ferme à 14h : si c’est dimanche après-midi, inversez votre commande et venez d’abord ici.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloître et musée"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloître et musée"}],"fonti":[],"ant":true},{"id":10,"s":"cappella-sansevero","n":"Chapelle Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Le Christ voilé, l'une des sculptures les plus célèbres au monde, et les machines anatomiques du prince alchimiste Raimondo di Sangro.","rac":"La chapelle de la famille di Sangro est le royaume de Raimondo, prince de Sansevero : un homme de science et de secrets, grand maître de la franc-maçonnerie, autour duquel le mythe est né de son vivant, et c'est lui-même qui l'a alimenté.\n\nAu centre se dresse le Christ voilé de Giuseppe Sanmartino, commandé par le prince : un corps allongé recouvert d’un linceul si fin qu’il ressemble à un chiffon mouillé, pourtant taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine se trouvent deux « machines anatomiques », les squelettes d’un homme et d’une femme aux vaisseaux sanguins reconstitués, œuvres du médecin palermitain Giuseppe Salerno, réalisées entre 1756 et 1764 environ. La légende noire évoque des serviteurs sacrifiés et des injections mystérieuses ; le musée lui-même prend soin de distinguer le mythe de l’histoire documentée.","con":"Elle est fermée le mardi : si aujourd’hui est mardi, la statue du Nil se trouve à deux minutes et est toujours visible.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli et statue du Nil","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai et ses boutiques","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Le quartier des libraires et des artisans de Spaccanapoli : boutiques, églises et l'hôpital des poupées.","rac":"Il s'agit du tronçon de la rue Spaccanapoli qui s'étend de la Piazzetta Nilo à la Via Duomo, sur le decumanus inférieur. Son nom provient des librairies qui s'y sont toujours installées : une inscription sur le Palazzo Marigliano, tout proche, commémore l'art des maîtres libraires. La dévotion à saint Blaise remonte au VIIIe siècle, lorsque des religieuses arméniennes apportèrent une relique du saint à Naples. On trouve également sur cette rue l'Ospedale delle Bambole, un atelier artisanal transmis de génération en génération.","con":"Décembre est le mois des magasins de crèches : préparez-vous à une forte affluence le week-end.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true},{"id":40,"s":"santa-luciella","n":"Santa Luciella chez les libraires et le crâne avec des oreilles","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une minuscule église de tailleur de pierre dédiée à la sainte des yeux, et un crâne unique : celui avec des oreilles.","rac":"Fondée peu avant 1327 par Bartolomeo di Capua, juriste des rois angevins, l'église fut ensuite confiée aux pipernieri, les tailleurs de pierre : ils choisirent Sainte Lucie, protectrice de la vue, car les éclats de bois de leur métier mettaient leurs yeux en danger.\n\nAbandonné pendant plus de trente ans, il a rouvert ses portes le 5 avril 2019 grâce à l'association Respiriamo Arte. Dans sa crypte souterraine, le culte des « âmes malades » a laissé un crâne pas comme les autres : il possède des oreilles.","con":"Il est petit et se visite en quelques minutes seulement : parfait pour une pause entre Sansevero et Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"}],"ant":true},{"id":41,"s":"ospedale-bambole","n":"Hôpital des poupées","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Une boutique qui sélectionne des poupées et des jouets depuis des générations : une vitrine dont les enfants, et les adultes, se souviendront toujours.","rac":"","con":"La vitrine à elle seule vaut le détour : elle se trouve sur le chemin du retour.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, l'église de la capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"L'église de la capuzzelle : sous le sol, l'hypogée où Naples priait pour les âmes anonymes. Et le crâne de Lucie.","rac":"Les Napolitains l'appellent « 'e cape 'e morte », l'église des têtes de mort. C'est une petite église du XVIIe siècle, située sur le decumanus principal, liée à la dévotion aux âmes du Purgatoire, répandue par la Contre-Réforme. Un escalier raide mène à l'hypogée, l'église souterraine, agrandie et ornée de majolique au XVIIIe siècle : c'est là que les fidèles prenaient soin des dépouilles anonymes et imploraient leur intercession. Au bout d'un petit couloir, on conserve le crâne de Lucia, une jeune âme particulièrement vénérée.","con":"Derrière l'autel, cherchez le crâne ailé en marbre de Dionisio Lazzari : c'est le symbole de l'église.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true},{"id":18,"s":"duomo-san-gennaro","n":"Cathédrale et Trésor de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cathédrale de Naples et la chapelle du Trésor, où est conservée la fiole du sang de saint Gennaro.","rac":"Dans la cathédrale, dans une niche de la chapelle du Trésor, est conservée l'ampoule contenant le sang traditionnellement attribué à saint Gennaro. Trois fois par an (le samedi précédant le premier dimanche de mai, le 19 septembre et le 16 décembre), on attend sa liquéfaction. Depuis 1601, les reliques sont confiées à une institution séculière, la Députation de la chapelle du Trésor de saint Gennaro.","con":"Les jours de liquéfaction de l'eau, le Duomo est bondé dès le matin : si vous voulez y être, arrivez tôt.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":43,"s":"banksy-madonna","n":"La Madone armée d'un pistolet, selon Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Une Madone par Banksy avec un pistolet à la place d'une auréole, protégée par une vitre, au cœur du decumanus principal.","rac":"Sur la Piazzetta dei Girolamini, sur la façade du decumanus principal, Banksy a réalisé une Madone armée d'un pistolet en guise d'auréole. Aujourd'hui, elle est protégée par une vitre. Le site web officiel du tourisme de la ville l'intègre à son itinéraire consacré au street art dans le centre historique.","con":"Levez les yeux : l'œuvre se trouve au-dessus du niveau de la rue, derrière une vitre.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"La première balade","sub":"Spaccanapoli en une demi-journée, au départ de Ceraldi","desc":"Au cœur du centre historique, en suivant un parcours circulaire : l’église du Gesù Nuovo et son mystère, le cloître de Santa Chiara, le Christ voilé, l’église du Crâne et des Oreilles, les boutiques de la Via San Biagio dei Librai. Et puis, retour à nous.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café chez Ceraldi et c'est parti !","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":9,"m":4,"mt":263,"so":45,"nota":"","alt":38},{"l":10,"m":9,"mt":682,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":39},{"l":41,"m":2,"mt":161,"so":10,"nota":"","alt":null},{"l":7,"m":15,"mt":1128,"so":0,"nota":"Nous revenons de Ceraldi par Spaccanapoli.","alt":null}],"fonti":[],"ant":true},{"id":2,"s":"napoli-sacra-e-profana","n":"Naples sacrée et profane","sub":"Saints, crânes, alchimistes et une Vierge Marie par Banksy","desc":"Le côté mystérieux de Naples le long des remparts : la façade codée du Gesù Nuovo, le Prince de Sansevero, les crânes de Santa Luciella et Purgatorio ad Arco, le street art de Banksy et le sang de Saint Gennaro. Pour ceux qui ont encore le temps, le cimetière Fontanelle se trouve hors des murs.","dur":210,"dist":3837,"et":["mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"","alt":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null},{"l":10,"m":6,"mt":448,"so":45,"nota":"","alt":12},{"l":40,"m":4,"mt":335,"so":20,"nota":"","alt":null},{"l":42,"m":4,"mt":328,"so":40,"nota":"","alt":null},{"l":43,"m":4,"mt":333,"so":5,"nota":"","alt":null},{"l":18,"m":4,"mt":303,"so":45,"nota":"","alt":null},{"l":7,"m":21,"mt":1597,"so":0,"nota":"Retour de Ceraldi.","alt":null}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Naples en cinq minutes : de la sirène à la ville nouvelle","som":"D'abord Partenope, puis Neapolis : car le centre historique est encore conçu comme une ville grecque.","txt":"Naples a été fondée deux fois. La première fois, elle s'appelait Partenope, comme la sirène mythique : elle fut fondée au VIIe siècle avant J.-C. par des colons d'origine grecque venus de Cumes, qui débarquèrent sur l'îlot de Megaride, où se dresse aujourd'hui le Castel dell'Ovo, et s'installèrent sur le mont Echia, tout proche.\n\nLa seconde fois, vers 470 av. J.-C., une nouvelle ville surgit à côté de l'ancienne : Neapolis, qui signifie « ville nouvelle » en grec. C'est celle que vous traversez actuellement. Ses rues forment un quadrillage régulier qui, après vingt-cinq siècles, reste parfaitement lisible : le centre historique de Naples est inscrit au patrimoine mondial de l'UNESCO précisément parce que l'organisation de la ville grecque en est restée l'élément central.\n\nTrois rues parallèles, les decumani, traversent la ville d'ouest en est. La plus basse est Spaccanapoli : longue d'environ deux kilomètres, elle est si rectiligne que, vue d'en haut, elle semble la couper en deux, d'où son nom. Au centre se trouve la Via dei Tribunali, le decumanus principal ; plus haut se trouvent la Via dell'Anticaglia et la Via della Sapienza, le decumanus supérieur.\n\nDe Piazza Carità, où nous sommes présents depuis 2002, commence Spaccanapoli à quelques minutes à pied, sur la Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro et le sang fondant","som":"Trois fois par an, Naples retient son souffle devant une fiole. Que se passe-t-il ? Où ? Et que disent l’Église et la science à ce sujet ?","txt":"Dans la cathédrale de Naples, dans une niche de la chapelle du Trésor, est conservée une fiole contenant une substance sombre, que la tradition considère comme le sang de saint Gennaro, saint patron de la ville. Trois fois par an – le samedi précédant le premier dimanche de mai, le 19 septembre (jour de sa fête) et le 16 décembre – la fiole est montrée aux fidèles : si son contenu, généralement solide, se dissout, c’est un signe de réjouissance ; s’il reste solide, pour de nombreux Napolitains, c’est un mauvais présage.\n\nLa première trace connue de la liquéfaction remonte à 1389. Les reliques ne sont pas gardées par le clergé mais par la Députation de la Chapelle du Trésor de San Gennaro, une institution laïque fondée en 1601, qui comprend également le maire de Naples.\n\nL'Église adopte une position prudente : elle parle d'un « événement miraculeux », autorise la dévotion populaire, mais ne l'impose pas comme vérité de foi. Parmi les explications avancées par les sceptiques figure la thixotropie, propriété de certaines substances solides au repos qui deviennent liquides lorsqu'elles sont agitées.\n\nLe sacré et le profane ont toujours coexisté ici : Via Duomo, à quelques pas de la cathédrale, l'artiste de rue Jorit a peint un San Gennaro avec le visage d'un ouvrier.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Les Pauvres Âmes : Quand Naples a adopté un crâne","som":"Ossuaires, capuzzelle et prières échangées contre des numéros de loterie : le culte des morts sans nom.","txt":"Pendant des siècles, à Naples, les morts anonymes n'ont pas été laissés à l'abandon. On les appelait « anime pezzentelle » : les pauvres âmes décédées sans funérailles et sans que personne ne prie pour elles. Ce nom est lié à « pezzente », le pauvre, mais aussi au latin « petere », demander pour recevoir : ceux qui priaient pour eux espéraient recevoir en retour protection et grâce.\n\nLe lieu symbolique est le cimetière Fontanelle, dans le quartier de Sanità : une ancienne carrière de tuf du XVIe siècle d’environ quatre mille mètres carrés, qui accueillit les victimes de la peste de 1656 puis celles du choléra en 1836-1837. En 1872, le chanoine Gaetano Barbati disposa les ossements dans trois nefs. Les fidèles « adoptaient » un crâne, une capuzzella : ils le nettoyaient, le plaçaient dans un petit reliquaire, l’ornaient de chapelets et de pièces de monnaie, et priaient devant lui, attendant un signe en rêve, parfois un numéro de loterie. Certains crânes devinrent célèbres : le Capitaine, à l’orbite noircie, sujet d’une légende de mariage et de jalousie ; Donna Concetta, qui, dit-on, « transpire » lorsqu’une grâce est accordée.\n\nEn 1969, un décret du tribunal ecclésiastique a fermé l'ossuaire et interdit le culte. Fermé pour rénovation depuis 2020, le cimetière a rouvert ses portes au public en 2026, géré par la coopérative La Paranza.\n\nLe culte perdure également sous la Via dei Tribunali, dans l'hypogée de Santa Maria delle Anime del Purgatorio ad Arco, l'église que les Napolitains appellent « e cape 'e morte » : on y conserve le crâne de Lucia, une jeune âme particulièrement vénérée. Et sur la Via San Biagio dei Librai, dans la petite église de Santa Luciella, se trouve un crâne unique : celui qui possède des oreilles.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Naples ésotérique : un prince alchimiste, une façade codée et un œuf magique","som":"Raimondo di Sangro, le vestige du Gesù Nuovo, l'œuf de Virgile, le munaciello : là où l'histoire s'arrête et où la légende commence.","txt":"Naples adore les mystères, et certains sont particulièrement fascinants. Le plus célèbre porte un nom : Raimondo di Sangro, prince de Sansevero, homme du XVIIIe siècle, grand maître de la franc-maçonnerie napolitaine, était un inventeur jaloux de ses propres secrets. Le mythe l’entourait déjà de son vivant, et il l’alimentait lui-même. Benedetto Croce le qualifiait d’incarnation napolitaine du Docteur Faust. La légende noire lui attribue tous les crimes : des serviteurs assassinés pour étudier leurs corps, et même l’aveuglement du sculpteur du Christ voilé pour l’empêcher d’en sculpter un autre. Ce ne sont que des légendes, et le musée lui-même les distingue de l’histoire officielle.\n\nLe Christ voilé est l'œuvre de Giuseppe Sanmartino, commandée par le prince : le voile transparent qui recouvre le corps est taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine de la chapelle se trouvent les « machines anatomiques », deux squelettes aux systèmes circulatoires reconstitués, créés par le médecin palermitain Giuseppe Salerno entre 1756 et 1764 environ. La légende raconte qu'ils impliquèrent de mystérieuses injections et des études sur la cire d'abeille et les colorants.\n\nNon loin de là, la façade du Gesù Nuovo, ancien palais Sanseverino datant de 1470, est revêtue d'un parement pyramidal de pierre de Piperno sombre. Certaines pierres portent des inscriptions gravées : la légende veut qu'il s'agisse d'un message secret ; certains érudits y voient les marques des tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique, une partition d'environ trois quarts d'heure intitulée « Énigme ». Une hypothèse séduisante, mais non une certitude.\n\nEt puis il y a la mer : selon la légende, le poète Virgile aurait caché l’œuf de la sirène Partenope dans les caves du Castel dell’Ovo. Tant que l’œuf restera intact, le château restera debout.\n\nDans les maisons, cependant, vivent les esprits de la tradition populaire : le munaciello, un elfe à capuche qui porte chance ou malice selon la façon dont on le traite, et la bella 'mbriana, un bon esprit de la maison, qui peut apparaître sous la forme d'un papillon ou d'un gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples aujourd'hui : quoi de neuf ?","som":"La place dédiée à Maradona, le street art, le dernier Caravage sur la Via Toledo, les églises et les ossuaires rouverts : une ville en pleine mutation.","txt":"Ceux qui retournent à Naples après quelques années découvrent une ville qui a appris à raconter son histoire.\n\nDans le Quartier espagnol, à neuf minutes d'ici, se trouve Largo Maradona. La fresque de Diego Maradona, peinte en 1990 par Mario Filardi, s'est estompée au fil des ans, jusqu'à presque disparaître. Elle a ensuite été restaurée grâce à Salvatore Iodice, puis, à l'automne 2017, l'Argentin Francisco Bosoletti a repeint son visage. Après la mort de Maradona, le 25 novembre 2020, la place, autrefois appelée place des artistes, est devenue un lieu de recueillement laïque, orné de petits autels, de drapeaux argentins et de photographies, si populaire que la municipalité a dû réguler la circulation des piétons.\n\nLe street art a investi le centre historique : sur la Piazzetta dei Girolamini, protégée par une vitre, se dresse la Madone au pistolet de Banksy ; sur la Via Duomo, le San Gennaro le Travailleur de Jorit. Le site web officiel du tourisme de la ville leur consacre un itinéraire.\n\nSur la Via Toledo, à six minutes d'ici, les Gallerie d'Italia abritent le Martyre de sainte Ursule, la dernière toile du Caravage, ainsi que plus de cinq cents vases attiques et de Grande-Grèce.\n\nEt des lieux fermés depuis longtemps rouvrent leurs portes : l’église Santa Luciella ai Librai, abandonnée depuis plus de trente ans, a rouvert au public le 5 avril 2019 ; le cimetière Fontanelle a rouvert en 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true}],"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-03T14:41Z","lingue":[{"c":"it","n":"Italiano","b":"🇮🇹","u":"../"},{"c":"en","n":"English","b":"🇬🇧","u":"../en/"},{"c":"fr","n":"Français","b":"🇫🇷","u":""},{"c":"de","n":"Deutsch","b":"🇩🇪","u":"../de/"},{"c":"es","n":"Español","b":"🇪🇸","u":"../es/"}],"pre":"../","menu":"../../menu-nuovo/"}, T = {"titolo":"Guide de Naples","sottotitolo":"Le centre historique à pied depuis Piazza Carità","anteprima":"Version d'essai : textes et horaires en cours de révision.","oggi":"Aujourd'hu   if(!f.length) return {k: 'chiuso_oggi'};
  for(var i = 0; i < f.length; i++){
    var da = hm(f[i].da), a = hm(f[i].a), ui = f[i].ui ? hm(f[i].ui) : a;
    if(minuto < da) return {k: 'apre', da: f[i].da};
    if(minuto < a) return minuto <= ui ? {k: 'aperto', a: f[i].a, ui: f[i].ui} : {k: 'chiuso_ora', motivo: 'ui', ui: f[i].ui};
  }
  return {k: 'chiuso_ora'};
}
function etichetta(s){
  switch(s.k){
    case 'sempre': return '<span class="stato ok">' + e(T.sempre) + '</span>';
    case 'verifica': return '<span class="stato att">' + e(T.in_verifica) + '</span>';
    case 'aperto': return '<span class="stato ok">' + e(T.aperto) + '</span> <span class="piccolo">· ' + e(T.chiude_alle) + ' ' + e(s.a) + (s.ui ? ' · ' + e(T.ultimo_ingresso) + ' ' + e(s.ui) : '') + '</span>';
    case 'apre': return '<span class="stato att">' + e(T.apre_alle) + ' ' + e(s.da) + '</span>';
    case 'chiuso_ora': return '<span class="stato ko">' + e(T.chiuso_ora) + '</span>';
    default: return '<span class="stato ko">' + e(T.chiuso_oggi) + '</span>';
  }
}
function fotoHtml(f){ if(!f) return ''; return '<figure class="foto"><img src="' + e(f.u) + '" alt="' + e(f.alt) + '" loading="lazy"><figcaption>' + e(f.aut) + ' · ' + e(f.lic) + (f.src ? ' · <a href="' + e(f.src) + '" rel="noopener">fonte</a>' : '') + '</figcaption></figure>'; }
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="scheda fonti"><summary><b>' + e(T.fonti) + '</b> (' + fs.length + ')</summary><ul>' + fs.map(function(f){ return '<li><a href="' + e(f.u) + '" rel="noopener">' + e(f.t) + '</a></li>'; }).join('') + '</ul></details>'; }
function indietro(){ return '<button class="indietro" onclick="history.length > 1 ? history.back() : (location.hash = \'#/\')">← ' + e(T.indietro) + '</button>'; }
function durata(m){ if(!m) return ''; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : m + ' ' + T.min; }
function km(m){ return m ? (m / 1000).toLocaleString(D.lingua, {maximumFractionDigits: 1}) + ' ' + T.km : ''; }

/* ---------- mappa ospitata (MapLibre + tasselli nella cartella mappa/) ---------- */
var mlPromessa = null;
function caricaMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return mlPromessa || (mlPromessa = new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = PRE + 'mappa/maplibre-gl.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }));
}
function stile(){
  var base = new URL(PRE + 'mappa/', location.href).href;
  return fetch(PRE + 'mappa/stile.json').then(function(r){ return r.text(); }).then(function(t){
    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"'));
  });
}
function mappa(id, punti, inQuadro){
  var el = document.getElementById(id); if(!el) return;
  Promise.all([caricaMapLibre(), stile()]).then(function(r){
    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18,
      maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}, cooperativeGestures: false});
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    var b = new maplibregl.LngLatBounds();
    punti.forEach(function(p){
      var d = document.createElement('a'); d.className = 'num' + (p.casa ? ' casa' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(inQuadro && punti.length > 1) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0}); /* a destra c'e' lo zoom */
  }).catch(function(){ el.innerHTML = '<p class="piccolo" style="padding:16px">—</p>'; });
}

/* ---------- schermate ---------- */
var V = {};
V.home = function(){
  var ora = adesso(), h = '';
  var sc = D.scioperi.filter(function(s){ return s.d === ora.data; });
  if(sc.length) h += '<div class="avviso ko"><b>' + e(T.sciopero) + '</b>' + sc.map(function(s){ return '<br>' + e([s.l, s.x].filter(Boolean).join(' — ')); }).join('') + '</div>';
  var chiusi = D.luoghi.filter(function(l){ return !l.sa && verificati(l, ora) && stato(l, ora, ora.min).k === 'chiuso_oggi'; });
  h += '<section class="scheda"><h3>' + e(T.oggi) + ' · ' + e(nomeGiorno(ora.gs, true)) + ' ' + e(dataLunga(ora.data)) + '</h3>';
  h += chiusi.length ? '<p class="piccolo" style="margin:0"><b>' + e(T.chiusi_oggi) + ':</b> ' + chiusi.map(function(l){ return '<a href="#/l/' + e(l.s) + '">' + e(l.n) + '</a>'; }).join(', ') + '</p>'
                     : '<p class="piccolo" style="margin:0">' + e(T.tutti_aperti) + '</p>';
  h += '</section>';
  h += '<div class="bottoni"><a class="bottone pieno" href="#/mappa">' + e(T.mappa) + '</a><a class="bottone" href="#/piove">☂ ' + e(T.piove) + '</a></div>';
  if(D.itinerari.length){
    h += '<h2>' + e(T.itinerari) + '</h2><p class="piccolo" style="margin:0">' + e(T.partenza) + '</p><ul class="lista">';
    D.itinerari.forEach(function(i){
      h += '<li><a class="voce" href="#/i/' + e(i.s) + '"><div class="titolo">' + e(i.n) + '</div>' + (i.sub ? '<div class="piccolo">' + e(i.sub) + '</div>' : '') +
           '<div class="meta piccolo"><span>' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span><span>' + i.tappe.filter(function(t){ return !LU[t.l] || LU[t.l].s !== 'piazza-carita'; }).length + ' ' + e(T.tappe) + '</span></div></a></li>';
    });
    h += '</ul>';
  }
  if(D.racconti.length){
    h += '<h2>' + e(T.racconti) + '</h2><ul class="lista">';
    D.racconti.forEach(function(r){ h += '<li><a class="voce" href="#/r/' + e(r.s) + '"><div class="titolo">' + e(r.t) + '</div>' + (r.som ? '<div class="piccolo">' + e(r.som) + '</div>' : '') + '</a></li>'; });
    h += '</ul>';
  }
  var altri = D.luoghi.filter(function(l){ return l.s !== 'piazza-carita'; });
  if(altri.length){
    h += '<h2>' + e(T.luoghi) + '</h2><ul class="lista">';
    altri.forEach(function(l){ h += voceLuogo(l, ora); });
    h += '</ul>';
  }
  return h;
};
function voceLuogo(l, ora){
  return '<li><a class="voce" href="#/l/' + e(l.s) + '"><div class="titolo">' + e(l.n) + '</div><div class="meta">' + etichetta(stato(l, ora, ora.min)) +
         (l.mp ? '<span class="piccolo">' + l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi) + '</span>' : '') + '</div></a></li>';
}
V.itinerario = function(s){
  var i = IT[s]; if(!i) return V.home();
  var ora = adesso(), h = indietro(), t = ora.min, punti = [], k = 0;
  h += '<h2>' + e(i.n) + '</h2>' + (i.sub ? '<p class="piccolo" style="margin:0">' + e(i.sub) + '</p>' : '');
  h += '<div class="meta piccolo" style="display:flex;gap:12px;margin-top:6px"><span>' + e(T.durata) + ' ' + e(durata(i.dur)) + '</span><span>' + e(km(i.dist)) + '</span></div>';
  h += fotoHtml(i.foto);
  h += '<div class="mappa" id="m-itin"></div><p class="piccolo">' + e(T.nota_mappa) + '</p>';
  if(i.desc) h += '<div class="testo">' + par(i.desc) + '</div>';
  h += '<p class="piccolo"><b>' + e(T.arrivo) + '</b></p>';
  i.tappe.forEach(function(tp, n){
    var l = LU[tp.l], casa = l.s === 'piazza-carita';
    t += tp.m;
    var arrivo = t, sa = stato(l, ora, arrivo), num = casa ? '★' : String(++k);
    if(!punti.some(function(p){ return p.id === l.id; }) && l.lat != null) punti.push({id: l.id, t: num, n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa});
    h += (tp.m ? '<div class="tra">↓ ' + tp.m + ' ' + e(T.min) + ' ' + e(T.a_piedi) + (tp.mt ? ' · ' + tp.mt + ' m' : '') + '</div>' : '');
    h += '<div class="tappa"><div class="n"' + (casa ? ' style="background:var(--accento)"' : '') + '>' + num + '</div><div><a href="#/l/' + e(l.s) + '" style="color:inherit;text-decoration:none"><h3>' + e(l.n) + '</h3></a>' +
         '<div class="piccolo">' + (arrivo < 1440 ? '≈ ' + fmt(arrivo) : '') + (tp.so ? ' · ' + tp.so + ' ' + e(T.min) : '') + '</div>' +
         '<div class="meta" style="margin-top:4px">' + etichetta(sa) + '</div>' + (tp.nota ? '<p style="margin:6px 0 0">' + e(tp.nota) + '</p>' : '');
    var chiusoArrivo = (sa.k === 'chiuso_oggi' || sa.k === 'chiuso_ora' || (sa.k === 'apre' && hm(sa.da) - arrivo > 30));
    if(chiusoArrivo){
      h += '<div class="alt"><b>' + e(T.chiuso_arrivo) + '.</b>';
      if(tp.alt && LU[tp.alt]) h += ' ' + e(T.alternativa) + ': <a href="#/l/' + e(LU[tp.alt].s) + '">' + e(LU[tp.alt].n) + '</a> ' + etichetta(stato(LU[tp.alt], ora, arrivo));
      h += '</div>';
    }
    h += '</div></div>';
    t += tp.so;
  });
  h += fontiHtml(i.fonti);
  setTimeout(function(){ mappa('m-itin', punti, true); });
  return h;
};
V.luogo = function(s){
  var l = LU['s:' + s]; if(!l) return V.home();
  var ora = adesso(), h = indietro() + '<h2>' + e(l.n) + '</h2>';
  h += fotoHtml(l.foto);
  if(l.som) h += '<p style="font-size:1.05rem">' + e(l.som) + '</p>';
  h += '<section class="scheda"><div class="meta">' + etichetta(stato(l, ora, ora.min)) + '</div>';
  if(!l.sa && verificati(l, ora) && l.or.length){
    h += '<table class="orari" style="margin-top:10px">';
    for(var g = 1; g <= 7; g++){
      var f = fasceDelGiorno(l, ora.data, g), aperte = f.filter(function(o){ return !o.x && o.da; });
      var txt = f.some(function(o){ return o.x; }) || !aperte.length ? T.giorni_chiusura : aperte.map(function(o){ return o.da + '–' + o.a + (o.n ? ' (' + o.n + ')' : ''); }).join(', ');
      h += '<tr' + (g === ora.gs ? ' class="oggi"' : '') + '><td>' + e(nomeGiorno(g, true)) + '</td><td>' + e(txt) + '</td></tr>';
    }
    h += '</table><p class="piccolo" style="margin:8px 0 0">' + e(T.verificato_il) + ' ' + e(dataLunga(l.ovi)) + '</p>';
  }
  if(l.po || l.sito) h += '<p style="margin:10px 0 0">' + (l.po ? '<a href="' + e(l.po) + '" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  var info = [];
  if(l.dv) info.push(e(T.visita) + ': ' + e(durata(l.dv)));
  if(l.gr === true) info.push(e(T.gratuito)); else if(l.gr === false) info.push(e(T.pagamento));
  if(l.mp) info.push(l.mp + ' ' + e(T.min) + ' ' + e(T.a_piedi) + ' ' + e(T.da_ceraldi));
  if(info.length) h += '<p class="piccolo" style="margin:10px 0 0">' + info.join(' · ') + '</p>';
  h += '</section>';
  if(l.rac) h += '<div class="testo">' + par(l.rac) + '</div>';
  if(l.con) h += '<section class="scheda"><h3>' + e(T.consiglio) + '</h3><p style="margin:0">' + e(l.con) + '</p></section>';
  if(l.acc) h += '<section class="scheda"><h3>' + e(T.accessibilita) + '</h3><p style="margin:0">' + e(l.acc) + '</p></section>';
  if(l.lat != null){
    h += '<div class="mappa" id="m-luogo" style="height:240px"></div>';
    h += '<p><a class="bottone" href="https://www.openstreetmap.org/?mlat=' + l.lat + '&amp;mlon=' + l.lon + '#map=18/' + l.lat + '/' + l.lon + '" rel="noopener">' + e(T.apri_mappa) + '</a></p>';
    setTimeout(function(){ mappa('m-luogo', [{id: l.id, t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}], false); });
  }
  h += fontiHtml(l.fonti);
  return h;
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return indietro() + '<h2>' + e(r.t) + '</h2>' + fotoHtml(r.foto) + '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti);
};
V.mappa = function(){
  var ora = adesso(), punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l, n){ return {id: l.id, t: l.s === 'piazza-carita' ? '★' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: l.s === 'piazza-carita'}; });
  setTimeout(function(){ mappa('m-tutti', punti, true); });
  return indietro() + '<h2>' + e(T.mappa) + '</h2><div class="mappa" id="m-tutti" style="height:60vh"></div>';
};
V.piove = function(){
  var ora = adesso(), cop = D.luoghi.filter(function(l){ return D.coperto.indexOf(l.tipo) >= 0 && !l.sa; });
  var h = indietro() + '<h2>☂ ' + e(T.piove) + '</h2><p class="piccolo">' + e(T.piove_testo) + '</p>';
  if(!cop.length) return h + '<p>' + e(T.piove_vuoto) + '</p>';
  var peso = {aperto: 0, apre: 1, verifica: 2, chiuso_ora: 3, chiuso_oggi: 4};
  cop.sort(function(a, b){ return (peso[stato(a, ora, ora.min).k] || 0) - (peso[stato(b, ora, ora.min).k] || 0); });
  return h + '<ul class="lista">' + cop.map(function(l){ return voceLuogo(l, ora); }).join('') + '</ul>';
};
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h;
  if(p[0] === 'i') h = V.itinerario(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'l') h = V.luogo(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'r') h = V.racconto(decodeURIComponent(p[1] || ''));
  else if(p[0] === 'mappa') h = V.mappa();
  else if(p[0] === 'piove') h = V.piove();
  else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<div class="avviso prova">' + e(T.anteprima) + '</div>' : '') + h +
    '<footer><p><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a></p><p>' + e(T.editoriale) + '<br>' + e(T.senza_rete) + '</p></footer>';
  if(p[0]) window.scrollTo(0, 0);
}
document.getElementById('t-titolo').textContent = T.titolo;
document.getElementById('t-sotto').textContent = T.sottotitolo;
if(D.lingue.length){
  document.getElementById('lingue').innerHTML = '<details class="lingue"><summary aria-label="' + e(T.lingua) + '">' + e((D.lingue.filter(function(x){ return x.c === D.lingua; })[0] || {}).b || '') + ' ' + e(D.lingua.toUpperCase()) + ' ▾</summary><ul>' +
    D.lingue.map(function(x){ return '<li><a data-lng="' + e(x.c) + '" href="' + e(x.u || './') + '"' + (x.c === D.lingua ? ' aria-current="true"' : '') + '>' + e(x.b + ' ' + x.n) + '</a></li>'; }).join('') + '</ul></details>';
  document.getElementById('lingue').addEventListener('click', function(ev){ var a = ev.target.closest('a[data-lng]'); if(!a) return; try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; });
  /* stessa scelta di lingua del menu: chi l'ha gia' scelta la ritrova */
  if(D.lingua === 'it'){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
}
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
