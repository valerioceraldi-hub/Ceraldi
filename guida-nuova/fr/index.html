Y-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_Umberto_I_(Napoli)_02_08_2023_03.jpg","dida":"Une entrée de la Galleria Umberto I."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Galleria Umberto I","u":"https://en.wikipedia.org/wiki/Galleria_Umberto_I"},{"t":"Nomado – Galleria Umberto I","u":"https://www.nomadotravel.app/it/attractions/galleria-umberto-i"},{"t":"ERIH – Galleria Umberto I","u":"https://www.erih.net/i-want-to-go-there/site/galleria-umberto-i"}],"ant":true,"dett":[{"t":"Le dôme de fer et de verre","x":"Les quatre ailes de la galerie se rejoignent sous un dôme de fer et de verre, soutenu par seize nervures. Le jour, la lumière pénètre de toutes parts ; la nuit, l’éclairage met en valeur la structure.","d":"Au centre de la galerie","foto":{"u":"../img/5caa008a8527.jpg","alt":"La coupole en fer et en verre de la Galleria Umberto I","aut":"ARCHIsavio","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Cupola_Galleria_Umberto_I_-_Napoli.jpg","dida":"La coupole de fer et de verre, où se rejoignent les quatre ailes de la galerie."}},{"t":"La mosaïque d'étoiles","x":"Sous le dôme, le sol est orné d'une mosaïque en forme d'étoile à douze branches, dans des tons crème, terre cuite et gris. On la repère en regardant vers le bas, à l'endroit où les bras du dôme se rejoignent.","d":"Au sol, sous le dôme","foto":null},{"t":"Le réaménagement de Naples","x":"La galerie est née comme un symbole d'une ville qui s'efforçait de se moderniser après l'épidémie de choléra. Elle faisait partie du projet de réaménagement, le vaste programme de démolition et de reconstruction de la ville, et visait à rivaliser avec la Galleria Vittorio Emanuele II de Milan.","d":"En entrant par la Via San Carlo","foto":{"u":"../img/df75ec70de03.jpg","alt":"Statues et inscription ANNO MDCCCXC sur la galerie","aut":"ell brown","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/39415781@N06/7611414816","dida":"«Année MDCCCXC» : la date d'achèvement, inscrite sur le tunnel symbolisant la rénovation."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":27,"s":"teatro-san-carlo","n":"Théâtre San Carlo","tipo":"teatro","zona":"toledo_mare","ind":"Via San Carlo 98, Napoli","lat":40.837374,"lon":14.249813,"mp":12,"dv":40,"gr":null,"sa":false,"sito":"https://www.teatrosancarlo.it/","po":"https://www.teatrosancarlo.it/en/visite-guidate/","som":"Le plus ancien opéra encore en activité en Europe : inauguré en 1737, avant La Scala et La Fenice.","rac":"Le Teatro di San Carlo fut construit sur ordre de Charles III de Bourbon et inauguré le 4 novembre 1737, jour de la fête du roi. Ce dernier souhaitait un théâtre pour Naples plus vaste que l'ancien San Bartolomeo. Il ouvrit ses portes 41 ans avant La Scala de Milan et 55 ans avant La Fenice de Venise, ce qui en fait le plus ancien opéra encore en activité. Le projet fut confié à Giovanni Antonio Medrano et Angelo Carasale.\n\nDes compositeurs tels que Rossini, Donizetti, Bellini et Verdi ont foulé ses planches. Le théâtre, ainsi que le centre historique, sont inscrits au patrimoine mondial de l'UNESCO.\n\nLes visites guidées en italien et en anglais durent environ une demi-heure. Le même complexe abrite également le MeMus, un musée qui retrace l'histoire du théâtre et de l'opéra.","con":"Les visites dépendent des répétitions et des représentations : consultez le site web officiel et, si possible, réservez. Si vous aimez l’opéra, la meilleure façon d’en faire l’expérience est d’assister à une représentation.","acc":"","foto":{"u":"../img/abc91c247fbf.jpg","alt":"La façade du théâtre San Carlo avec ses colonnes","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Teatro_San_CarloFacciata.jpg","dida":"La façade du théâtre San Carlo."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"10:30","a":"17:00","ui":"16:30","n":"Des visites guidées d'une durée d'environ 30 minutes sont proposées à 10h30, 11h30, 12h30, 14h30, 15h30 et 16h30. Réservation recommandée."}],"fonti":[{"t":"Wikipedia – Teatro di San Carlo","u":"https://en.wikipedia.org/wiki/Teatro_di_San_Carlo"},{"t":"Napolike – Teatro San Carlo","u":"https://www.napolike.it/teatro-san-carlo-napoli"},{"t":"Fanpage – Visita al Teatro San Carlo","u":"https://www.fanpage.it/napoli/visita-al-teatro-san-carlo-di-napoli-orari-mappa-e-prezzi/"},{"t":"italia.it – Teatro San Carlo","u":"https://www.italia.it/it/campania/napoli/teatro-san-carlo-di-napoli"}],"ant":true,"dett":[{"t":"La salle et le Théâtre Royal","x":"La salle en forme de fer à cheval est le cœur du théâtre : elle comprend des loges en gradins et une loge royale. Le San Carlo est également réputé pour son acoustique. Les visites guidées permettent généralement de prendre des photos de la salle et du foyer.","d":"Dans le hall, avec la visite guidée","foto":{"u":"../img/61fb4f2a6ee4.jpg","alt":"Gravure du XVIIIe siècle représentant une soirée dansante au théâtre","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/27224230366","dida":"Un bal au Théâtre Royal de San Carlo, d'après une gravure de 1749."}},{"t":"Le MeMus","x":"Le MeMus, inauguré en 2011, est le musée et les archives historiques du théâtre. Il retrace l'histoire du bâtiment et de l'opéra italien à travers des peintures, des photographies, des instruments de musique et des costumes.","d":"Dans le même complexe que le théâtre","foto":{"u":"../img/44d70b37ca4d.jpg","alt":"Costumes de scène exposés au MeMus","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26698524214","dida":"Costumes de scène d'un opéra de Paisiello exposés au MeMus."}},{"t":"Le premier opéra d'Europe","x":"Inauguré en 1737, il est plus ancien que La Scala de Milan (1778) et La Fenice de Venise (1792). C'est pourquoi il est considéré comme le plus ancien opéra encore en activité.","d":"Devant la façade, sur la Via San Carlo","foto":{"u":"../img/5458a9109987.jpg","alt":"L'inscription « Real Teatro di S. Carlo » sur la façade","aut":"Heiko Fischer","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Teatro_San_Carlo_Napoli.JPG","dida":"« Théâtre Royal de S. Carlo », sur la façade du théâtre inauguré en 1737."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":28,"s":"piazza-plebiscito","n":"Piazza del Plebiscito","tipo":"piazza","zona":"toledo_mare","ind":"Piazza del Plebiscito, Napoli","lat":40.835856,"lon":14.248565,"mp":13,"dv":20,"gr":true,"sa":true,"sito":"","po":"","som":"La plus grande place de Naples : d'un côté le Palais Royal, de l'autre une colonnade enlaçant la basilique San Francesco di Paola.","rac":"Au pied de la colline de Pizzofalcone, Piazza del Plebiscito est l'une des places les plus vastes et les plus monumentales de la ville. Jusqu'en 1817, elle s'appelait Largo di Palazzo. En 1809, Joachim Murat fit démolir les couvents du quartier et conçut un forum orné d'une colonnade semi-circulaire. Les travaux furent interrompus à la fin de son règne et repris par Ferdinand Ier, qui souhaitait y construire une église en accomplissement d'un vœu fait à saint François de Paule. La basilique fut érigée entre 1817 et 1836, inspirée du Panthéon de Rome.\n\nLa place doit son nom actuel au plébiscite du 21 octobre 1860, qui approuva l'annexion du royaume des Deux-Siciles au royaume de Sardaigne. Devant la basilique se dressent deux statues équestres : celle de Charles III de Bourbon, œuvre d'Antonio Canova, et celle de Ferdinand Ier.\n\nAujourd'hui, il accueille des concerts, des cérémonies et des festivals municipaux.","con":"Arrivez tôt le matin : la lumière rasante illumine la colonnade et la place est presque déserte. Ensuite, entrez dans la basilique et promenez-vous jusqu’au Palais royal.","acc":"","foto":{"u":"../img/a8cff56ff6f0.jpg","alt":"Piazza del Plebiscito avec un lion et l'église de San Francesco di Paola","aut":"Lucia Montanaro","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:7K5A3060Piazza_del_Plebiscito_Naples_lateral_view_2025.jpg","dida":"Piazza del Plebiscito et, au fond, San Francesco di Paola."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Comune di Napoli – San Francesco di Paola","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1408"},{"t":"FAI – Piazza Plebiscito","u":"https://fondoambiente.it/luoghi/piazza-plebiscito-napoli"},{"t":"Agenzia del Demanio – Basilica di San Francesco di Paola","u":"https://www.agenziademanio.it/export/sites/demanio/download/varie/Napoli_08_-Piazza-Del-Plebiscito-Basilica-Reale-e-Pontificia-Di-San-Francesco-Di-Paola.pdf"},{"t":"Divisare – Piazza del Plebiscito","u":"https://divisare.com/projects/383895-mario-de-martino-piazza-del-pebliscito"}],"ant":true,"dett":[{"t":"La colonnade et la basilique de San Francesco di Paola","x":"La colonnade semi-circulaire est l'œuvre de Murat. La basilique, de style néoclassique, est surmontée d'un dôme central de 53 mètres de haut, inspiré du Panthéon. À l'intérieur, le maître-autel, orné de pierres précieuses et de lapis-lazuli, a été conçu par Ferdinando Fuga en 1751 et transféré ici en 1835 depuis l'église des Saints-Apôtres.","d":"Du côté ouest de la place","foto":{"u":"../img/82ad7240a133.jpg","alt":"L'intérieur circulaire de la basilique de San Francesco di Paola","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_reale_pontificia_di_San_Francesco_di_Paola_%28Napoli%29_004.JPG","dida":"L'intérieur de la basilique San Francesco di Paola, inspiré du Panthéon."}},{"t":"Les statues équestres","x":"Les deux statues en bronze représentent Charles III de Bourbon, fondateur de la maison, et son fils Ferdinand Ier. Elles sont situées devant la basilique.","d":"Devant la basilique","foto":{"u":"../img/75d762389b74.jpg","alt":"Une statue équestre en bronze devant la basilique","aut":"Benjamin Vander Steen","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Naples%2C_Italy_-_Piazza_del_PlebiscitoCarlo_II.jpg","dida":"L'une des deux statues équestres des Bourbons devant la basilique."}},{"t":"Le nom de la place","x":"Son nom provient du plébiscite du 21 octobre 1860, qui a annexé le royaume des Deux-Siciles au royaume de Sardaigne. Auparavant, la place s'appelait Largo di Palazzo.","d":"Tout autour de la place","foto":{"u":"../img/86b3b80763bf.jpg","alt":"Piazza del Plebiscito vue dans toute sa grandeur","aut":"Nicola since 1972","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/15216811@N06/11591733293","dida":"Piazza del Plebiscito, autrefois Largo di Palazzo."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":29,"s":"palazzo-reale","n":"Palais royal","tipo":"palazzo","zona":"toledo_mare","ind":"Piazza del Plebiscito 1, Napoli","lat":40.83648,"lon":14.25032,"mp":13,"dv":90,"gr":null,"sa":false,"sito":"https://palazzorealedinapoli.org/","po":"","som":"Le grand palais des vice-rois et des Bourbons : grand escalier, théâtre de la cour, salle du trône et un jardin donnant sur le golfe.","rac":"Le Palais Royal surplombe Piazza del Plebiscito. Construit au début du XVIIe siècle par le vice-roi espagnol Fernando Ruiz de Castro, comte de Lemos, il fut pendant des siècles le siège du pouvoir à Naples. Sa construction s'éternisa et ne fut achevée qu'en 1858 par Gaetano Genovese. Sur sa façade, dans des niches, se dressent huit statues de souverains napolitains.\n\nLe musée occupe l'appartement historique au rez-de-chaussée : on y accède par le Grand Escalier, conçu par Francesco Antonio Picchiatti en 1651, revêtu de marbre rose et blanc et considéré comme l'un des plus beaux d'Europe. Les salles comprennent le Théâtre de la Cour, la Salle du Trône, la Chapelle Royale et la Salle d'Hercule. L'appartement historique est ouvert au public depuis 1919 et a été gravement endommagé pendant la Seconde Guerre mondiale.\n\nL'entrée au Jardin romantique, côté golfe, est gratuite.","con":"En montant le Grand Escalier, admirez le marbre et la lumière. Le musée est généralement ouvert de 9h à 20h (dernière entrée à 19h) et fermé le mercredi : renseignez-vous avant de venir.","acc":"","foto":{"u":"../img/1baab5d71869.jpg","alt":"La façade du Palais Royal sur la place","aut":"Evvemoscia","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_del_Palazzo_Reale,_Napoli.jpg","dida":"La façade du Palais Royal."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"09:00","a":"20:00","ui":"19:00","n":"Appartement classé (Appartement historique). Fermé généralement le mercredi. Dernière confirmation sur le site officiel du ministère de la Culture (2025)."}],"fonti":[{"t":"italia.it – Palazzo Reale di Napoli","u":"https://www.italia.it/it/campania/napoli/palazzo-reale-napoli"},{"t":"Napolike – Palazzo Reale","u":"https://www.napolike.it/il-palazzo-reale-napoli"},{"t":"Photos and the City – Palazzo Reale","u":"https://photosandthecity.com/palazzo-reale-di-napoli/"},{"t":"Senzalinea – Piazza del Plebiscito","u":"https://www.senzalinea.it/giornale/piazza-del-plebiscito-e-il-gioco-famoso-dei-due-cavalli"}],"ant":true,"dett":[{"t":"Le Grand Escalier","x":"Conçu par Francesco Antonio Picchiatti en 1651, il fut par la suite revêtu de marbre rose et blanc. Considéré comme l'un des plus beaux escaliers monumentaux d'Europe, il mène au musée situé au rez-de-chaussée.","d":"À l'entrée, dans la cour d'honneur","foto":{"u":"../img/7533a4a26b58.jpg","alt":"Le Grand Escalier d'Honneur du Palais Royal","aut":"Mentnafunangann","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Scalone_d%27onore_%28Palazzo_Reale_di_Napoli%29_001.jpg","dida":"Le grand escalier en marbre du Palais Royal."}},{"t":"Le théâtre de la cour et la salle du trône","x":"L'appartement historique abrite le théâtre de la cour, la salle du trône ornée d'un grand lustre en cristal, la chapelle royale et la salle d'Hercule : il s'agissait des salles de séjour et de réception de la cour.","d":"Au rez-de-chaussée, dans l'appartement historique","foto":{"u":"../img/841e35a47444.jpg","alt":"Le trône dans la salle du trône du palais royal","aut":"Adam91","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_Napoli_-_Trono.JPG","dida":"La salle du trône dans l'appartement historique."}},{"t":"Le jardin romantique","x":"Côté golfe, un jardin à entrée gratuite invite à la flânerie parmi les parterres de fleurs et les arbres. C'est un endroit paisible avec vue sur le golfe.","d":"Du côté du bâtiment donnant sur la mer","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":30,"s":"castel-nuovo","n":"Maschio Angioino (Nouveau Château)","tipo":"castello","zona":"toledo_mare","ind":"Piazza Municipio","lat":40.838317,"lon":14.253731,"mp":13,"dv":60,"gr":false,"sa":false,"sito":"https://www.comune.napoli.it/maschioangioino","po":"https://www.comune.napoli.it/maschioangioino","som":"Le château qui est le symbole de Naples : un arc de triomphe entre deux tours, une porte en bronze encore marquée par un boulet de canon, et la salle où un roi fit arrêter les barons lors d'une fête de mariage.","rac":"Sous les rois angevins, le château devint un centre culturel : sous Robert d'Anjou, des artistes, des médecins et des hommes de lettres y séjournèrent, parmi lesquels Giotto, Pétrarque et Boccace.\n\nAlphonse Ier d'Aragon en fit sa résidence royale et la fit reconstruire. Pour célébrer son entrée victorieuse dans la ville, il fit ériger le grand arc de triomphe entre la Tour du Milieu et la Tour de Guet, qui sert encore aujourd'hui d'entrée.\n\nAujourd'hui, le château abrite le Musée Civique : la visite comprend la galerie d'art au premier étage, la Salle des Barons, la chapelle palatine, également connue sous le nom de chapelle de Santa Barbara, et une visite archéologique de l'ancienne armurerie.","con":"Tarif plein : 10 € ; 6 € pour les habitants de Naples et de sa région métropolitaine ; gratuit pour les moins de 18 ans. Fermé le dimanche.","acc":"","foto":{"u":"../img/01914a520eb7.jpg","alt":"Le Maschio Angioino avec ses deux tours et son arche blanche au centre,","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Nuovo_%28Maschio_Angioino%29%2C_Entrance%2C_Naples_%285257%29.jpg","dida":"Les deux grandes tours et, au milieu, l'arc de triomphe d'Alphonse d'Aragon : c'est l'entrée du château."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:00","a":"18:00","ui":"17:30"}],"fonti":[{"t":"Comune di Napoli – Castel Nuovo","u":"https://www.comune.napoli.it/maschioangioino"},{"t":"Comune di Napoli – Porta bronzea","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/porta-bronzea/"},{"t":"Comune di Napoli – Sala dei Baroni","u":"https://www.comune.napoli.it/articolo_tematico/vivere-la-citta/cultura/sale-espositive-e-spazi-per-meeting/castel-nuovo-maschio-angioino/sala-dei-baroni/"}],"ant":true,"dett":[{"t":"L'Arc de Triomphe","x":"Voici l'entrée du château, nichée entre deux tours : Alphonse Ier d'Aragon la fit construire pour célébrer son entrée victorieuse à Naples. Arrêtez-vous devant avant d'entrer et admirez-la d'en bas.","d":"À l'entrée, entre la Tour du Milieu et la Tour de Guet","foto":{"u":"../img/91d08c9a9561.jpg","alt":"L'arc de triomphe en marbre entre les deux tours","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_Nuovo_Arco_trionfale_1030697.JPG","dida":"L'arche en gros plan : regardez-la d'en bas, étage par étage."}},{"t":"La porte avec le boulet de canon","x":"Ferrante d'Aragon la commanda à Guglielmo Monaco vers 1475, pour commémorer la victoire de 1462 sur Jean d'Anjou et les barons rebelles : six panneaux relatent la guerre. Dans le panneau inférieur gauche, un boulet de canon en fer est encore incrusté dans le bronze. Selon l'hypothèse la plus répandue, la porte faisait partie du butin que Charles VIII chargea sur des navires à destination de la France ; au large de Rapallo, la flotte fut attaquée par les Génois et touchée. Ces derniers la renvoyèrent à Naples en 1495.","d":"L'original est conservé à l'intérieur du château","foto":{"u":"../img/50ee03911e6d.jpg","alt":"Le boulet de canon est coincé dans la porte en bronze.","aut":"Marie-Lan Nguyen","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Bronze_door_cannonball_Castel_Nuovo.jpg","dida":"Le boulet de canon en fer incrusté dans le bronze, dans le panneau inférieur gauche."}},{"t":"La salle des barons","x":"On y accède par l'escalier extérieur en tuyaux, conçu par l'architecte majorquin Guglielmo Sagrera. Levez les yeux : la voûte s'élève à environ 28 mètres, et seize nervures en tuyaux s'étendent en étoile depuis une ouverture centrale. Son nom rappelle l'année 1486, lorsque le roi Ferrante Ier, par ruse, fit croire aux barons qu'il y célébrait un mariage et les fit arrêter. Pendant cinquante ans, il servit de siège au conseil municipal.","d":"En haut des escaliers de la cour","foto":{"u":"../img/2761d90bc4e9.jpg","alt":"La salle des étoiles","aut":"Sergioizzo","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Volta_della_Sala_dei_Baroni_%28met%C3%A0_sec._XV%29%2C_veduta_dal_cammino_di_ronda%2C_Castel_Nuovo%2C_Napoli.JPG","dida":"La voûte de la salle des barons : seize nervures en forme d'étoile partent de l'ouverture centrale."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":31,"s":"galleria-borbonica","n":"Galleria Borbonica","tipo":"sotterraneo","zona":"toledo_mare","ind":"Via Domenico Morelli 61, Napoli","lat":40.835576,"lon":14.246247,"mp":15,"dv":90,"gr":null,"sa":false,"sito":"https://www.galleriaborbonica.com/","po":"https://www.galleriaborbonica.com/it/percorsi/standard","som":"Un tunnel commandé par un roi comme voie d'évasion, devenu plus tard abri anti-aérien puis entrepôt : un voyage sous la colline de Pizzofalcone.","rac":"Le Galleria Borbonica fut commandé par Ferdinand II de Bourbon par un décret du 19 février 1853 et conçu par l'architecte Errico Alvino. Il devait relier le Palais royal à la Piazza della Vittoria et aux casernes, en passant sous la colline de Pizzofalcone : une voie d'évacuation rapide pour le roi. Sa construction fut interrompue faute de financement, puis par les bouleversements politiques liés à l'unification italienne.\n\nDurant la Seconde Guerre mondiale, certaines pièces servirent d'abris anti-aériens. Après la guerre, et jusqu'aux années 1970, le tunnel fit office d'entrepôt judiciaire pour la ville de Naples : on peut encore y voir aujourd'hui des fragments de statues, des voitures et des motos anciennes. L'association culturelle Borbonica Sotterranea l'a restauré et propose des visites guidées.\n\nLe parcours classique dure environ une heure et peut être emprunté depuis deux entrées : Via Domenico Morelli 61 et Vico del Grottone 4, à environ 100 mètres de Piazza del Plebiscito. Des parcours plus aventureux sont également proposés.","con":"Réservation : La réservation est obligatoire. Les départs standard ont lieu à 10h00, 12h00, 15h00 et 17h00 les vendredis, samedis, dimanches et jours fériés. Les photos sont autorisées.","acc":"","foto":{"u":"../img/7d1481f1dbd9.jpg","alt":"Un tunnel creusé dans le tuf de la Galleria Borbonica","aut":"Nemo bis","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica,_Naples_03.jpg","dida":"Une section du Galleria Borbonica, creusée dans le tuf."},"ov":true,"ovi":"2026-11-04","or":[{"g":[5,6,7],"da":"10:00","a":"18:00","n":"Visite standard : Départs à 10h, 12h, 15h et 17h (vendredi, samedi, dimanche et jours fériés). Réservation obligatoire ; durée : environ 1 heure. Entrées : Via Domenico Morelli 61 et Vico del Grottone 4."}],"fonti":[{"t":"SiViaggia – Galleria Borbonica","u":"https://siviaggia.it/posti-incredibili/galleria-borbonica-napoli/575186/"},{"t":"Napolike – Rifugi antiaerei a Napoli","u":"https://www.napolike.it/rifugi-antiaerei-a-napoli-e-in-altre-citta-ditalia-ecco-dove-si-trovano"},{"t":"Travel365 – Visita alla Galleria Borbonica","u":"https://www.travel365.it/visita-galleria-borbonica-napoli.htm"}],"ant":true,"dett":[{"t":"Le tunnel Bourbon","x":"C’est cette partie qui témoigne de l’ambition de Ferdinand II : un long passage de tuf jaune, destiné à relier le Palais royal à la Piazza della Vittoria. Le tuf raconte aussi l’histoire du travail des carriers et des prouesses d’ingénierie hydraulique de l’époque.","d":"Le long de la route principale","foto":{"u":"../img/1dec7e77dfa5.jpg","alt":"Un passage creusé dans le tuf du Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Passaggio_dei_pozzari_%28Naples%29.jpg","dida":"Le passage des drains de puits, une section du Galleria Borbonica creusée dans le tuf."}},{"t":"L'abri anti-aérien","x":"Entre 1939 et 1945, des milliers de personnes trouvèrent refuge ici pour échapper aux bombardements. Lits, graffitis et objets du quotidien de l'époque subsistent. C'est ce qui frappe le plus les visiteurs.","d":"Dans les chambres du refuge","foto":{"u":"../img/3200f06943d2.jpg","alt":"L'abri anti-aérien du Galleria Borbonica","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_War_refuge_%28Naples%29.jpg","dida":"L'abri anti-aérien de la Seconde Guerre mondiale."}},{"t":"Voitures et motos anciennes","x":"Après la guerre, le tunnel a servi de dépôt judiciaire pour les véhicules saisis : aujourd’hui encore, on peut y voir des voitures et des motos anciennes.","d":"En chemin","foto":{"u":"../img/87eab52966bc.jpg","alt":"Voitures anciennes abandonnées dans le tunnel","aut":"Associazione Culturale Borbonica Sotterranea","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Galleria_borbonica_-_Cars_and_tunnel_%28Naples%29.jpg","dida":"Voitures anciennes le long du tunnel : période d'après-guerre, lorsque le tunnel servait d'entrepôt judiciaire."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":32,"s":"castel-dell-ovo","n":"Front de mer et Castel dell'Ovo","tipo":"castello","zona":"toledo_mare","ind":"Via Eldorado 3, Borgo Marinari, da via Partenope","lat":40.827742,"lon":14.248029,"mp":28,"dv":30,"gr":true,"sa":true,"sito":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/","po":"","som":"Le château sur l'îlot où débarquèrent les colons grecs de Cumes : on y arrive par le front de mer, on traverse le pont et on admire la vue sur le golfe depuis Borgo Marinari.","rac":"Le château se dresse sur l'îlot de Megaride, formé de deux rochers reliés par une grande arche. C'est là, au milieu du VIIe siècle avant J.-C., que débarquèrent des colons venus de Cumes, qui fondèrent plus tard Partenope sur le mont Echia voisin.\n\nAu Ier siècle avant J.-C., la villa de Lucius Licinius Lucullus se dressait sur l'îlot et le mont Echia. Des vestiges de cette villa subsistent dans la salle des Colonnes : au début du Moyen Âge, cette salle servait de réfectoire à l'un des couvents construits sur l'îlot.","con":"L'intérieur du château est fermé pour rénovation jusqu'à nouvel ordre. Aujourd'hui, les visiteurs peuvent admirer le château de l'extérieur, en flânant le long du front de mer et dans le quartier de Borgo Marinari.","acc":"","foto":{"u":"../img/f214daace22c.jpg","alt":"Castel dell'Ovo sur la mer, sous un ciel bleu","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Le Castel dell'Ovo se trouve sur l'îlot de Megaride, relié au front de mer par un pont."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"09:00","a":"16:30","n":"Réservation facultative."}],"fonti":[{"t":"Comune di Napoli – Castel dell'Ovo","u":"https://www.comune.napoli.it/vivere-il-comune/luoghi/castel-dellovo/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true,"dett":[{"t":"L'îlot de Megaride","x":"Depuis le front de mer, contemplez le château : il se dresse sur l’îlot de Megaride, formé de deux rochers reliés par une grande arche. C’est ici, vers le milieu du VIIe siècle avant J.-C., que débarquèrent les Cumiens, d’origine grecque, qui fondèrent ensuite la ville de Partenope sur le mont Echia, tout proche.\n\nAu Ier siècle avant J.-C., à l'époque romaine, la célèbre villa de Lucius Licinius Lucullus fut construite sur l'îlot et sur le mont Echia ; les tambours de colonnes de la soi-disant « Salle des Colonnes » subsistent.\n\nLe nom provient d'une légende : le poète Virgile aurait caché un œuf dans une cage, dans les caves, et le sort du château et de toute Naples dépendait de son intégrité. Lorsque, sous le règne de la reine Jeanne Ire, l'arche s'effondra entre les deux rochers, la reine dut déclarer avoir replacé l'œuf pour rassurer la ville.","d":"Depuis le pont menant à Borgo Marinari","foto":{"u":"../img/2fa4aa093660.jpg","alt":"Castel dell'Ovo et le port de plaisance de Borgo Marinari vus d'en haut","aut":"Claudio Mazzocchi","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Castel_dell%27Ovo%2C_Napoli.jpg","dida":"Vue d'en haut : le château sur le rocher et, à côté, le petit port de Borgo Marinari."}}],"gal":[{"u":"../img/5fa7bf9a4065.jpg","alt":"Gravure de 1841 représentant le Castel dell'Ovo et un voilier","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Le château dell'Ovo dans une gravure de 1841."}],"leg":"Le nom provient d'une légende : le poète Virgile aurait caché un œuf, enfermé dans une cage, dans les caves du château.","fc":null,"col":null},{"id":33,"s":"santa-maria-sanita","n":"Quartier de la Sanità et la Basilique de Santa Maria della Sanità","tipo":"chiesa","zona":"oltre_mura","ind":"Piazza Sanità 33, Napoli","lat":40.859727,"lon":14.24903,"mp":25,"dv":60,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/luoghi/basilica-di-santa-maria-sanita-napoli/","som":"Un quartier populaire renaissant de ses entrailles : la basilique « Monacone », les catacombes, Totò et les fresques.","rac":"Le Rione Sanità est l'un des quartiers les plus anciens et les plus populaires de Naples : pendant des siècles, il a servi de lieu de sépulture, et aujourd'hui, il est un modèle de renaissance citoyenne, avec des coopératives de jeunes qui gèrent et visitent les catacombes.\n\nAu centre se dresse la basilique Santa Maria della Sanità, construite entre 1602 et 1610 d'après les plans de Fra Nuvolo, un des plus beaux exemples du baroque napolitain. Elle est connue sous le nom de San Vincenzo ou « 'o Munacone », en référence à la grande statue de saint Vincent Ferrier qu'elle abrite. L'église présente un plan en croix grecque et sa coupole est recouverte de majolique. Sous l'église se trouvent les catacombes de San Gaudioso, datant du IVe siècle.\n\nL'acteur Totò est né dans ce quartier, Via Santa Maria Antesaecula, et des fresques murales ornent les rues à son sujet. La comédie d'Eduardo De Filippo, « Le Maire du quartier de Sanità », s'y déroule également.","con":"Visitez le quartier en journée, à votre rythme : les catacombes, la basilique et le cimetière Fontanelle sont à proximité. Vous pouvez combiner cette visite avec la messe du Miglio Sacro le dimanche.","acc":"","foto":{"u":"../img/1a0ac18fd711.jpg","alt":"La basilique en forme de dôme de Santa Maria della Sanità","aut":"Aisav72","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Santa_Maria_alla_Sanità-Napoli.jpg","dida":"La Basilique de Santa Maria della Sanità."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"13:00","ui":"13:00","n":"Basilique. Peut être fermée à certaines dates : consultez le site web."}],"fonti":[{"t":"Wikipedia – Santa Maria della Sanità","u":"https://en.wikipedia.org/wiki/Santa_Maria_della_Sanit%C3%A0,_Naples"},{"t":"FAI – Basilica di Santa Maria della Sanità","u":"https://fondoambiente.it/luoghi/basilica-di-santa-maria-della-sanita-na"},{"t":"Visit Italy – Rione Sanità","u":"https://visititaly.eu/places-and-tours/rione-sanita-naples"}],"ant":true,"dett":[{"t":"La basilique de Monaco","x":"L'église Fra Nuvolo présente un plan en croix grecque et une coupole recouverte de majolique. Le chœur est surélevé et l'autel baroque est orné d'un double escalier. La statue de saint Vincent Ferrier, dit le « Monacone », donne à la basilique son nom populaire.","d":"Sur la Piazza Sanità","foto":{"u":"../img/d7599dd94bbc.jpg","alt":"Le chœur surélevé avec le double escalier dans la basilique","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/5450935991","dida":"Le chœur surélevé de la basilique Santa Maria della Sanità, avec son double escalier."}},{"t":"Les catacombes de San Gaudioso","x":"Sous la basilique se trouvent les catacombes de San Gaudioso, datant du IVe siècle. On y accède par l'église.","d":"Sous la basilique","foto":{"u":"../img/30e6de57bd17.jpg","alt":"Les catacombes de San Gaudioso sous la basilique","aut":"Peppe Guida","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gaudioso._002.jpg","dida":"Les catacombes de San Gaudioso, sous la basilique."}},{"t":"Totò et les peintures murales","x":"Dans les rues avoisinantes, et dans la Via Santa Maria Antesaecula où est né Totò, des fresques et de petites images commémorent l'acteur et les histoires du quartier.","d":"Dans les ruelles autour de la place","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":34,"s":"catacombe-san-gennaro","n":"Catacombes de San Gennaro","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Capodimonte 13, Napoli","lat":40.863784,"lon":14.247058,"mp":39,"dv":90,"gr":null,"sa":false,"sito":"https://catacombedinapoli.it/","po":"https://catacombedinapoli.it/it/pianifica-visita-guidata-napoli/","som":"Les plus grandes catacombes du sud de l'Italie : des tunnels à deux niveaux creusés dans la roche de tuf et le tombeau originel de San Gennaro, saint patron de Naples.","rac":"Les catacombes de San Gennaro se situent dans le quartier de Sanità, leur entrée se trouvant au 13, Via Capodimonte, à proximité de la basilique du Buon Consiglio. Leur origine remonte au IIe siècle après J.-C., lorsqu'une riche famille romaine fit don de son tombeau à la communauté chrétienne. Le complexe s'étend sur deux niveaux creusés dans le tuf : San Gennaro Superiore et San Gennaro Inferiore.\n\nSaint Janvier fut enterré ici, et pendant des siècles, le site fut un lieu de pèlerinage. Ses reliques y restèrent jusqu'au IXe siècle ; elles furent ensuite déplacées et le site abandonné. Aujourd'hui, les visites ne sont possibles qu'avec un guide et durent environ une heure. Depuis 2009, un système de LED, installé par la coopérative de jeunes du quartier Officina dei Talenti, illumine les fresques d'une douce lumière.\n\nLe site est géré par la coopérative sociale La Paranza, fondée par des jeunes du Rione Sanità.","con":"Réservez à l'avance : les visites sont guidées uniquement, avec un départ toutes les heures, et la réservation est obligatoire. La visite guidée du Rione Sanità, appelée Miglio Sacro, a lieu à 9h30 les samedis, dimanches et jours fériés. Les catacombes sont fermées le mercredi.","acc":"","foto":{"u":"../img/0e69b61ea42f.jpg","alt":"Une fresque paléochrétienne dans les catacombes de San Gennaro","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_021.jpg","dida":"Une fresque paléochrétienne dans les catacombes de San Gennaro."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"17:00","ui":"17:00","n":"Des visites guidées sont proposées toutes les heures ; la réservation est obligatoire. Fermé le mercredi et le 25 décembre."}],"fonti":[{"t":"Napolike – Catacombe di San Gennaro","u":"https://www.napolike.it/catacombe-san-gennaro-guida-napoli-sotterranea"},{"t":"Travel365 – Visita alle Catacombe di San Gennaro","u":"https://www.travel365.it/visita-catacombe-di-san-gennaro-napoli.htm"},{"t":"italia.it – Catacombe di Napoli","u":"https://www.italia.it/it/campania/napoli/cosa-fare/catacombe-di-napoli"}],"ant":true,"dett":[{"t":"Le tombeau de San Gennaro","x":"C'est le tombeau qui donne son nom à l'ensemble du réseau de catacombes : le saint patron de Naples y fut enterré. Ses reliques y restèrent jusqu'au IXe siècle.","d":"Lors de la visite guidée","foto":{"u":"../img/fd273aee226d.jpg","alt":"Le tombeau de San Gennaro dans les catacombes","aut":"Catacombe di Napoli","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_san_Gennaro%2C_tomba_del_Santo.jpg","dida":"Le tombeau de San Gennaro, lieu qui donne son nom aux catacombes."}},{"t":"Les deux niveaux","x":"Les galeries sont creusées dans le tuf sur deux niveaux, supérieur et inférieur, avec de larges passages et des fresques paléochrétiennes.","d":"Au cours de la visite guidée","foto":{"u":"../img/537a160d9acb.jpg","alt":"Un tunnel creusé dans le tuf, avec des tombes dans les parois.","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Catacombe_di_San_Gennaro_003.jpg","dida":"Les galeries des catacombes, creusées dans le tuf."}},{"t":"Le kilomètre sacré","x":"Les samedis, dimanches et jours fériés, une visite guidée de trois heures permet de découvrir les sites liés à San Gennaro dans le quartier de Rione Sanità. Le départ est à 9h30 et la réservation est obligatoire sur le site officiel.","d":"Depuis le point de rencontre dans les catacombes","foto":{"u":"../img/0becd922c42f.jpg","alt":"La façade d'un bâtiment du quartier de Sanità","aut":"Francis Cook","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stella_%28Rione_Sanit%C3%A0%29%2C_Napoli%2C_Italy_-_panoramio.jpg","dida":"Le quartier de Sanità, où le Miglio Sacro suit les lieux liés à San Gennaro."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":35,"s":"cimitero-fontanelle","n":"Cimetière Fontanelle","tipo":"sotterraneo","zona":"oltre_mura","ind":"Via Fontanelle 80, Napoli","lat":40.858026,"lon":14.23901,"mp":28,"dv":60,"gr":null,"sa":false,"sito":"https://cimiterodellefontanelle.it/","po":"https://cimiterodellefontanelle.it/en/the-cemetery/","som":"Une carrière de tuf aussi vaste qu'une cathédrale, des milliers de crânes anonymes et le culte des « âmes pezzentelle ». Réouverture en 2026.","rac":"Au XVIe siècle, c'était une carrière de tuf dans la vallée de Sanità. De nombreuses victimes de la peste de 1656 y furent amenées, suivies de celles de l'épidémie de choléra de 1836-1837. En 1872, le chanoine Gaetano Barbati disposa les dépouilles dans trois grandes nefs. L'espace est d'environ quatre mille mètres carrés.\n\nLe culte des « âmes paisibles » est né ici : les fidèles adoptaient un crâne, une capuzzella, en prenaient soin et le priaient, espérant en retour une protection, parfois un rêve contenant des numéros de loterie. En 1969, un décret du tribunal ecclésiastique a fermé l’ossuaire et interdit le culte. Fermé pour rénovation depuis 2020, il a rouvert ses portes au public en 2026, géré par la coopérative La Paranza.","con":"Le cimetière est fermé le mercredi. Téléchargez l'application du cimetière avant votre arrivée : le réseau téléphonique y est faible.","acc":"","foto":{"u":"../img/196eeb77c16a.jpg","alt":"Les grandes galeries de tuf du cimetière Fontanelle","aut":"Dominik Matus","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cimitero_delle_Fontanelle_-_DM_-_001.jpg","dida":"Les galeries de tuf du cimetière Fontanelle."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,4,5,6,7],"da":"10:00","a":"18:00","ui":"17:15","n":"Fermé le jour de Noël. Ouvert uniquement pour le culte les lundis et vendredis de 9h à 10h."}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"Google Arts & Culture – MADRE, Spirits di Rebecca Horn","u":"https://artsandculture.google.com/story/kAXBWFSBXTC5JA"}],"ant":true,"dett":[{"t":"Une carrière aussi grande qu'une cathédrale","x":"Le cimetière occupe une ancienne carrière de tuf d'environ quatre mille mètres carrés, aménagée en trois grandes nefs en 1872 par le chanoine Gaetano Barbati. Les victimes de la peste de 1656 et du choléra de 1836-1837 y furent inhumées.","d":"Dans les trois nefs","foto":{"u":"../img/1d00e1d52ca0.jpg","alt":"Une nef du cimetière Fontanelle creusée dans le tuf","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12483713094","dida":"L'une des trois nefs du cimetière Fontanelle, dans l'ancienne carrière de tuf."}},{"t":"Le culte des pauvres âmes","x":"Les fidèles adoptaient un crâne, la capuzzella, en prenaient soin et le priaient, espérant en retour une protection, parfois un rêve contenant des numéros de loterie. En 1969, le tribunal ecclésiastique interdit le culte et ferma l'ossuaire.","d":"Devant les rangées de crânes","foto":{"u":"../img/c27db73ea8b7.jpg","alt":"Rangées de crânes avec une croix","aut":"Antonio Manfredonio","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/16441028@N00/12484000013","dida":"Les capuzzelle : crânes anonymes, adoptés et soignés par des dévots."}},{"t":"Les Fontanelle de la MADRE","x":"L'artiste Rebecca Horn a reproduit en fonte certaines des capuzzelle de la Fontanelle dans son œuvre « Spirits », visible au musée MADRE : une manière de comprendre comment le cimetière est également entré dans l'art contemporain.","d":"Au musée MADRE (page séparée)","foto":null}],"gal":[],"leg":"","fc":null,"col":null},{"id":36,"s":"certosa-san-martino","n":"Charterhouse et musée de San Martino","tipo":"museo","zona":"vomero","ind":"Largo San Martino 5, Napoli","lat":40.843164,"lon":14.241059,"mp":26,"dv":120,"gr":null,"sa":false,"sito":"https://museinazionalivomero.cultura.gov.it/","po":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino","som":"Un monastère chartreux transformé en musée sur la colline du Vomero : un cloître baroque, une crèche de Cuciniello et l’une des plus belles vues sur le golfe.","rac":"La Chartreuse de San Martino se dresse sur la colline du Vomero, près du château Sant'Elmo. Fondée en 1325 par Charles de Calabre, fils du roi Robert d'Anjou, elle fut confiée à Tino di Camaino. Entre le XVIe et le XVIIIe siècle, elle devint l'un des plus beaux exemples de l'art baroque italien : de 1623 à 1656, Cosimo Fanzago en rénova l'intérieur. Depuis 1866, après la suppression des ordres religieux, elle abrite le Musée national de San Martino, commandé par Giuseppe Fiorelli.\n\nLe Grand Cloître, agrandi en 1581 par Giovanni Antonio Dosio et achevé par Fanzago, abrite en son centre le cimetière des moines. Le musée renferme la principale collection publique italienne consacrée à la crèche napolitaine, notamment la grandiose crèche Cuciniello : environ huit cents bergers, animaux et accessoires offerts par le collectionneur Michele Cuciniello, inaugurée en 1879. D'autres sections retracent l'histoire du royaume, de la marine, du théâtre, de la ville et du royaume à travers des images, et, à partir de décembre 2025, celle du Naples du XIXe siècle. La Table Strozzi, considérée comme le premier tableau de Naples, y est également conservée.","con":"Accédez aux terrasses et à la loggia du Prieur : de là, vous pourrez admirer tout le golfe. Le site est ouvert tous les jours sauf le mardi ; dernière entrée à 17h30.","acc":"","foto":{"u":"../img/c86a6db6ab67.jpg","alt":"Le grand cloître de la Certosa di San Martino","aut":"Tremej","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Il_chiostro_grande_del_Dosio_a_dicembre_Certosa_di_San_Martino_Napoli.jpg","dida":"Le grand cloître de la Certosa di San Martino."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"18:30","ui":"17:30","n":"Fermé le mardi. Certaines sections (Naval, Crèche de Noël, Naples du XIXe siècle) ouvrent à 9h30 ; les jardins ferment une heure plus tôt."}],"fonti":[{"t":"cultura.gov.it – Certosa e Museo di San Martino","u":"https://cultura.gov.it/luogo/certosa-e-museo-di-san-martino"},{"t":"Napolike – Certosa e Museo di San Martino","u":"https://www.napolike.it/certosa-museo-san-martino-barocco"},{"t":"Musei Nazionali del Vomero – comunicato 22/12/2025","u":"https://musei.cultura.gov.it/wp-content/uploads/2025/12/CS_800-a-Napoli.pdf"}],"ant":true,"dett":[{"t":"Le Grand Cloître","x":"Agrandie en 1581 par Giovanni Antonio Dosio et achevée par Cosimo Fanzago, la chartreuse abrite en son centre le cimetière des moines. On peut encore y voir, le long de son périmètre, les portes et les trappes des cellules des chartreux.","d":"Au cœur de la Chartreuse","foto":{"u":"../img/e43efae68626.jpg","alt":"Le grand cloître de la Chartreuse avec le cimetière des moines","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_chiostro_grande_cimitero_dei_monaci_1050065-6.JPG","dida":"Le Grand Cloître de la Chartreuse de San Martino, avec le petit cimetière des moines en son centre."}},{"t":"La crèche de Cuciniello","x":"Composée d'environ huit cents pièces, c'est la crèche la plus célèbre de Naples. Offerte par Michele Cuciniello, elle fut inaugurée en 1879. Un système d'éclairage simule les heures de la journée.","d":"Dans la section de la crèche, où se trouvaient les cuisines","foto":{"u":"../img/ae5327fcce50.jpg","alt":"La grande crèche avec des centaines de figurines","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Martino_Presepe_Cuciniello_1050047.JPG","dida":"La crèche de Cuciniello, composée d'environ huit cents pièces."}},{"t":"La vue sur le golfe","x":"Depuis les terrasses et les jardins de la Chartreuse, on peut admirer tout le golfe de Naples, avec le Vésuve en arrière-plan.","d":"Sur les terrasses et dans les jardins","foto":{"u":"../img/81d0fb825e80.jpg","alt":"Le golfe de Naples vu depuis un balcon de la Chartreuse","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/26315987418","dida":"Le golfe et le Vésuve vus d'un balcon de la Chartreuse de San Martino."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":37,"s":"castel-sant-elmo","n":"Château Sant'Elmo","tipo":"castello","zona":"vomero","ind":"Via Tito Angelini 20/A, Napoli","lat":40.843707,"lon":14.239252,"mp":23,"dv":75,"gr":null,"sa":false,"sito":"","po":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli","som":"La forteresse en forme d'étoile sur la colline de Vomero : des bastions offrant une vue à 360° sur Naples et le golfe, et à l'intérieur le musée Novecento.","rac":"Le château Sant'Elmo domine le quartier du Vomero, à environ 250 mètres d'altitude, et est visible de presque toute la ville. Les premières traces écrites remontent à 1275 environ, date à laquelle il s'agissait d'une résidence fortifiée angevine appelée Belforte. En 1329, Robert d'Anjou commanda son agrandissement, confié à Tino di Camaino. Son plan en étoile à six branches est le fruit de la reconstruction du XVIe siècle, commandée entre 1537 et 1547 par le vice-roi Pedro de Toledo, d'après les plans de l'architecte militaire Pedro Luis Escrivà.\n\nAu fil des siècles, le bâtiment servit fréquemment de prison : Tommaso Campanella y fut incarcéré, ainsi que des patriotes de la République napolitaine de 1799, tels que Gennaro Serra, Mario Pagano et Luisa Sanfelice. Après avoir abrité une garnison bourbonienne, il fit office de prison militaire jusqu’en 1952 ; d’importants travaux de restauration y furent entrepris en 1976.\n\nDepuis 2010, le Museo Novecento a Napoli est installé sur la place d'armes : il abrite plus de 170 œuvres d'environ 90 artistes napolitains ou ayant été actifs dans la ville entre 1910 et 1980. Certaines œuvres ont été créées spécifiquement pour le château : Gian Maria Tosatti a créé un champ de blé dans la grande citerne, et la sculpture en aluminium « Sant'Elmo » de Mimmo Paladino se distingue sur les remparts.\n\nDu haut des remparts, la vue s'étend des îles au Vésuve, des Champs Phlégréens aux monts Matese.","con":"Montez au coucher du soleil pour admirer la vue. Le château jouxte la Chartreuse de San Martino : les deux peuvent être visités le même matin. Le château est fermé le mardi et, en cas de mauvais temps, il peut rester fermé.","acc":"","foto":{"u":"../img/602a2b4c5ba8.jpg","alt":"Les hautes parois de tuf du château Sant'Elmo","aut":"Wolfgang Moroder","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_Sant_Elmo_Napoli_lato_ingresso.jpg","dida":"Les murs du château Sant'Elmo."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,3,4,5,6,7],"da":"08:30","a":"19:30","ui":"17:30","n":"Château : 8h30 - 19h30 ; Musée Novecento : 9h30 - 18h30 (dernière entrée à 17h30). Fermé le mardi. En cas de mauvais temps, le site peut être fermé."}],"fonti":[{"t":"cultura.gov.it – Castel Sant'Elmo","u":"https://cultura.gov.it/luogo/castel-sant-elmo-e-museo-del-novecento-a-napoli"},{"t":"Napolike – Castel Sant'Elmo","u":"https://www.napolike.it/castel-sant-elmo-stella-sei-punte-storia"},{"t":"Lonely Planet – Castel Sant'Elmo","u":"https://www.lonelyplanet.com/points-of-interest/castel-santelmo/422527"}],"ant":true,"dett":[{"t":"Les bastions et le panorama","x":"Les bastions offrent un panorama à 360° sur la ville, le golfe, le Vésuve et la côte de Posillipo, parmi les plus complets de Naples.","d":"Dans les tribunes","foto":{"u":"../img/81edfbd30506.jpg","alt":"Naples et le Vésuve vus du sommet du château Sant'Elmo","aut":"enzo.abramo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/155292000@N05/43655079851","dida":"Depuis les remparts du château Sant'Elmo : la ville, le port et le Vésuve."}},{"t":"Le musée Novecento à Naples","x":"Ouvert en 2010 sur la place d'armes, il abrite plus de 170 œuvres d'environ 90 artistes napolitains ou actifs dans la ville, créées à partir de 1910 : du futurisme à la Transavanguardia des années 1980.","d":"Sur la place d'armes du château","foto":{"u":"../img/d585126c2db4.jpg","alt":"Une salle du musée Novecento abritant des œuvres d'art","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Castel_sant%27elmo%2C_Museo_Napoli_Novecento_01.jpg","dida":"Une salle du Musée Novecento de Naples, à l'intérieur du Château Sant'Elmo."}},{"t":"Un champ de blé dans la citerne","x":"L'œuvre «Mes rêves, ils ne se rendront jamais» de Gian Maria Tosatti (2014) est un champ de blé cultivé dans la citerne, l'endroit le plus sombre et le plus profond du château, qui était aussi une prison.","d":"Dans la grande citerne","foto":null}],"gal":[],"leg":"","fc":null,"col":null}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"La première balade","sub":"Spaccanapoli en une demi-journée, au départ de Ceraldi","desc":"Au cœur du centre historique, en suivant un parcours circulaire : l’église du Gesù Nuovo et son mystère, le cloître de Santa Chiara, le Christ voilé, l’église du Crâne et des Oreilles, les boutiques de la Via San Biagio dei Librai. Et puis, retour à nous.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vue du ciel : une rue droite qui traverse le centre historique","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Vue aérienne Spaccanapoli : la longue rue rectiligne qui traverse le centre historique. La première visite se fait à pied."},"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café chez Ceraldi et c'est parti !","q":null,"alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"
