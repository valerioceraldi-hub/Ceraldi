<title>Guide de Naples · Ceraldi</title>

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;position:relative}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
var D = {"lingua":"fr","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità et Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Point de départ : Piazza Carità, sur la Via Toledo. De là, le centre historique commence à quelques minutes à pied. Et voici Ceraldi.","rac":"","con":"Avant de partir, un café : la visite est longue et Naples se découvre mieux avec une bonne tasse de café.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, le decumanus inférieur","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La route rectiligne qui coupe le centre historique en deux : le decumanus inférieur de la ville grecque, environ deux kilomètres d’églises, de boutiques et de vie.","rac":"Spaccanapoli est la plus basse des trois decumani, ces rues parallèles qui traversaient Neapolis grecque d'ouest en est. Elle débute sur la Piazza del Gesù Nuovo sous le nom de Via Benedetto Croce, devient ensuite Via San Biagio dei Librai, croise la Via Duomo et se prolonge au-delà de la vieille ville : environ deux kilomètres au total. Son nom est éloquent : elle est si longue et rectiligne que, vue d'en haut, elle semble couper la ville en deux.","con":"Suivez-la à pied depuis la Piazza del Gesù en direction de la Via Duomo : c'est une légère descente chargée d'histoire, sans effort.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"}],"ant":true},{"id":8,"s":"gesu-nuovo","n":"Place et église du Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une façade de pierres pyramidales qui ressemble à une forteresse et dissimule un mystère : des inscriptions gravées que personne n’a encore déchiffrées avec certitude.","rac":"Avant d'être une église, c'était un palais : celui des princes Sanseverino, construit en 1470 ; une plaque sur la façade commémore l'architecte, Novello da San Lucano. Les Jésuites ont préservé la structure et la pierre de taille sombre, le piperno, taillée en pyramides, en y ajoutant des éléments en marbre blanc.\n\nCertaines pierres portent des inscriptions gravées. La légende veut qu'il s'agisse d'un message secret ; certains érudits pensent qu'il s'agit des marques laissées par différents tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique d'une partition intitulée « Énigme ». Observez attentivement et faites-vous votre propre opinion.\n\nLa façade a été restaurée et dévoilée le 12 mars 2023, après la chute de quelques fragments en décembre 2017 ; la place est fermée à la circulation automobile depuis lors.","con":"Cherchez les marques sur les pierres à hauteur des yeux, à droite et à gauche du portail : la chasse est gratuite.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"}],"ant":true},{"id":9,"s":"santa-chiara","n":"Monastère et complexe de Santa Chiara (cloître en majolique)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Le cloître revêtu de majolique est l'un des endroits les plus calmes du centre : à deux pas du chaos de Spaccanapoli, le silence règne.","rac":"","con":"Le dimanche, le cloître ferme à 14h : si c’est dimanche après-midi, inversez votre commande et venez d’abord ici.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloître et musée"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloître et musée"}],"fonti":[],"ant":true},{"id":10,"s":"cappella-sansevero","n":"Chapelle Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Le Christ voilé, l'une des sculptures les plus célèbres au monde, et les machines anatomiques du prince alchimiste Raimondo di Sangro.","rac":"La chapelle de la famille di Sangro est le royaume de Raimondo, prince de Sansevero : un homme de science et de secrets, grand maître de la franc-maçonnerie, autour duquel le mythe est né de son vivant, et c'est lui-même qui l'a alimenté.\n\nAu centre se dresse le Christ voilé de Giuseppe Sanmartino, commandé par le prince : un corps allongé recouvert d’un linceul si fin qu’il ressemble à un chiffon mouillé, pourtant taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine se trouvent deux « machines anatomiques », les squelettes d’un homme et d’une femme aux vaisseaux sanguins reconstitués, œuvres du médecin palermitain Giuseppe Salerno, réalisées entre 1756 et 1764 environ. La légende noire évoque des serviteurs sacrifiés et des injections mystérieuses ; le musée lui-même prend soin de distinguer le mythe de l’histoire documentée.","con":"Elle est fermée le mardi : si aujourd’hui est mardi, la statue du Nil se trouve à deux minutes et est toujours visible.","acc":"","foto":null,"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli et statue du Nil","tipo":"piazza","zona":"decumano_inferiore","ind":"","lat":40.848745,"lon":14.256214,"mp":12,"dv":null,"gr":null,"sa":true,"sito":"","po":"","som":"","rac":"","con":"","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":39,"s":"san-biagio-dei-librai","n":"Via San Biagio dei Librai et ses boutiques","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"Le quartier des libraires et des artisans de Spaccanapoli : boutiques, églises et l'hôpital des poupées.","rac":"Il s'agit du tronçon de la rue Spaccanapoli qui s'étend de la Piazzetta Nilo à la Via Duomo, sur le decumanus inférieur. Son nom provient des librairies qui s'y sont toujours installées : une inscription sur le Palazzo Marigliano, tout proche, commémore l'art des maîtres libraires. La dévotion à saint Blaise remonte au VIIIe siècle, lorsque des religieuses arméniennes apportèrent une relique du saint à Naples. On trouve également sur cette rue l'Ospedale delle Bambole, un atelier artisanal transmis de génération en génération.","con":"Décembre est le mois des magasins de crèches : préparez-vous à une forte affluence le week-end.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true},{"id":40,"s":"santa-luciella","n":"Santa Luciella chez les libraires et le crâne avec des oreilles","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une minuscule église de tailleur de pierre dédiée à la sainte des yeux, et un crâne unique : celui avec des oreilles.","rac":"Fondée peu avant 1327 par Bartolomeo di Capua, juriste des rois angevins, l'église fut ensuite confiée aux pipernieri, les tailleurs de pierre : ils choisirent Sainte Lucie, protectrice de la vue, car les éclats de bois de leur métier mettaient leurs yeux en danger.\n\nAbandonné pendant plus de trente ans, il a rouvert ses portes le 5 avril 2019 grâce à l'association Respiriamo Arte. Dans sa crypte souterraine, le culte des « âmes malades » a laissé un crâne pas comme les autres : il possède des oreilles.","con":"Il est petit et se visite en quelques minutes seulement : parfait pour une pause entre Sansevero et Via dei Tribunali.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"}],"ant":true},{"id":41,"s":"ospedale-bambole","n":"Hôpital des poupées","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Une boutique qui sélectionne des poupées et des jouets depuis des générations : une vitrine dont les enfants, et les adultes, se souviendront toujours.","rac":"","con":"La vitrine à elle seule vaut le détour : elle se trouve sur le chemin du retour.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[],"ant":true},{"id":42,"s":"purgatorio-ad-arco","n":"Purgatorio ad Arco, l'église de la capuzzelle","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.85064,"lon":14.255685,"mp":15,"dv":40,"gr":null,"sa":false,"sito":"https://purgatorioadarco.it/","po":"","som":"L'église de la capuzzelle : sous le sol, l'hypogée où Naples priait pour les âmes anonymes. Et le crâne de Lucie.","rac":"Les Napolitains l'appellent « 'e cape 'e morte », l'église des têtes de mort. C'est une petite église du XVIIe siècle, située sur le decumanus principal, liée à la dévotion aux âmes du Purgatoire, répandue par la Contre-Réforme. Un escalier raide mène à l'hypogée, l'église souterraine, agrandie et ornée de majolique au XVIIIe siècle : c'est là que les fidèles prenaient soin des dépouilles anonymes et imploraient leur intercession. Au bout d'un petit couloir, on conserve le crâne de Lucia, une jeune âme particulièrement vénérée.","con":"Derrière l'autel, cherchez le crâne ailé en marbre de Dionisio Lazzari : c'est le symbole de l'église.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"}],"ant":true},{"id":18,"s":"duomo-san-gennaro","n":"Cathédrale et Trésor de San Gennaro","tipo":"chiesa","zona":"decumano_maggiore","ind":"","lat":40.852653,"lon":14.25987,"mp":21,"dv":45,"gr":null,"sa":false,"sito":"","po":"","som":"La cathédrale de Naples et la chapelle du Trésor, où est conservée la fiole du sang de saint Gennaro.","rac":"Dans la cathédrale, dans une niche de la chapelle du Trésor, est conservée l'ampoule contenant le sang traditionnellement attribué à saint Gennaro. Trois fois par an (le samedi précédant le premier dimanche de mai, le 19 septembre et le 16 décembre), on attend sa liquéfaction. Depuis 1601, les reliques sont confiées à une institution séculière, la Députation de la chapelle du Trésor de saint Gennaro.","con":"Les jours de liquéfaction de l'eau, le Duomo est bondé dès le matin : si vous voulez y être, arrivez tôt.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":43,"s":"banksy-madonna","n":"La Madone armée d'un pistolet, selon Banksy","tipo":"altro","zona":"decumano_maggiore","ind":"","lat":40.85205,"lon":14.258368,"mp":19,"dv":5,"gr":null,"sa":true,"sito":"","po":"","som":"Une Madone par Banksy avec un pistolet à la place d'une auréole, protégée par une vitre, au cœur du decumanus principal.","rac":"Sur la Piazzetta dei Girolamini, sur la façade du decumanus principal, Banksy a réalisé une Madone armée d'un pistolet en guise d'auréole. Aujourd'hui, elle est protégée par une vitre. Le site web officiel du tourisme de la ville l'intègre à son itinéraire consacré au street art dans le centre historique.","con":"Levez les yeux : l'œuvre se trouve au-dessus du niveau de la rue, derrière une vitre.","acc":"","foto":null,"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"}],"ant":true}],"itinerari":[{"id":1,"s":"il-primo-giro","n":"La première balade","sub":"Spaccanapoli en une demi-journée, au départ de Ceraldi","desc":"Au cœur du centre historique, en suivant un parcours circulaire : l’église du Gesù Nuovo et son mystère, le cloître de Santa Chiara, le Christ voilé, l’église du Crâne et des Oreilles, les boutiques de la Via San Biagio dei Librai. Et puis, retour à nous.","dur":180,"dist":3062,"et":["primo_giro","mezza_giornata","arte"],"foto":null,"tappe":[{"l":7,"m":0,"mt":0,"so":10,"nota":"Un café chez Ceraldi et c'est parti !","alt":null,"geo":null,"sv":null},{"l":8,"m":7,"mt":493,"so":15,"nota":"","alt":null,"geo":[[14.24908,40.84433],[14.24911,40.84463],[14.24908,40.84464],[14.24909,40.84468],[14.2491,40.84478],[14.2491,40.84484],[14.24918,40.84553],[14.24918,40.84554],[14.24927,40.84634],[14.24928,40.84638],[14.24933,40.84638],[14.24934,40.84643],[14.24938,40.84644],[14.25,40.84665],[14.25004,40.84666],[14.25005,40.84665],[14.25008,40.84665],[14.25047,40.84678],[14.25086,40.84691],[14.25124,40.84703],[14.25122,40.84707],[14.25144,40.84714],[14.2517,40.84724],[14.252,40.84733]],"sv":[{"k":" "m":"right","n":"Via dei Tribunali","d":165,"a":65},{"k":"gira","m":"left","n":"Vico dei Maiorani","d":196,"a":230},{"k":"gira","m":"right","n":"Via San Biagio dei Librai","d":940,"a":426},{"k":"gira","m":"left","n":"","d":232,"a":1366},{"k":"arrivo","a":1598}]}],"fonti":[],"ant":true}],"racconti":[{"id":1,"s":"napoli-in-breve","t":"Naples en cinq minutes : de la sirène à la ville nouvelle","som":"D'abord Partenope, puis Neapolis : car le centre historique est encore conçu comme une ville grecque.","txt":"Naples a été fondée deux fois. La première fois, elle s'appelait Partenope, comme la sirène mythique : elle fut fondée au VIIe siècle avant J.-C. par des colons d'origine grecque venus de Cumes, qui débarquèrent sur l'îlot de Megaride, où se dresse aujourd'hui le Castel dell'Ovo, et s'installèrent sur le mont Echia, tout proche.\n\nLa seconde fois, vers 470 av. J.-C., une nouvelle ville surgit à côté de l'ancienne : Neapolis, qui signifie « ville nouvelle » en grec. C'est celle que vous traversez actuellement. Ses rues forment un quadrillage régulier qui, après vingt-cinq siècles, reste parfaitement lisible : le centre historique de Naples est inscrit au patrimoine mondial de l'UNESCO précisément parce que l'organisation de la ville grecque en est restée l'élément central.\n\nTrois rues parallèles, les decumani, traversent la ville d'ouest en est. La plus basse est Spaccanapoli : longue d'environ deux kilomètres, elle est si rectiligne que, vue d'en haut, elle semble la couper en deux, d'où son nom. Au centre se trouve la Via dei Tribunali, le decumanus principal ; plus haut se trouvent la Via dell'Anticaglia et la Via della Sapienza, le decumanus supérieur.\n\nDe Piazza Carità, où nous sommes présents depuis 2002, commence Spaccanapoli à quelques minutes à pied, sur la Piazza del Gesù Nuovo.","foto":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro et le sang fondant","som":"Trois fois par an, Naples retient son souffle devant une fiole. Que se passe-t-il ? Où ? Et que disent l’Église et la science à ce sujet ?","txt":"Dans la cathédrale de Naples, dans une niche de la chapelle du Trésor, est conservée une fiole contenant une substance sombre, que la tradition considère comme le sang de saint Gennaro, saint patron de la ville. Trois fois par an – le samedi précédant le premier dimanche de mai, le 19 septembre (jour de sa fête) et le 16 décembre – la fiole est montrée aux fidèles : si son contenu, généralement solide, se dissout, c’est un signe de réjouissance ; s’il reste solide, pour de nombreux Napolitains, c’est un mauvais présage.\n\nLa première trace connue de la liquéfaction remonte à 1389. Les reliques ne sont pas gardées par le clergé mais par la Députation de la Chapelle du Trésor de San Gennaro, une institution laïque fondée en 1601, qui comprend également le maire de Naples.\n\nL'Église adopte une position prudente : elle parle d'un « événement miraculeux », autorise la dévotion populaire, mais ne l'impose pas comme vérité de foi. Parmi les explications avancées par les sceptiques figure la thixotropie, propriété de certaines substances solides au repos qui deviennent liquides lorsqu'elles sont agitées.\n\nLe sacré et le profane ont toujours coexisté ici : Via Duomo, à quelques pas de la cathédrale, l'artiste de rue Jorit a peint un San Gennaro avec le visage d'un ouvrier.","foto":null,"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Les Pauvres Âmes : Quand Naples a adopté un crâne","som":"Ossuaires, capuzzelle et prières échangées contre des numéros de loterie : le culte des morts sans nom.","txt":"Pendant des siècles, à Naples, les morts anonymes n'ont pas été laissés à l'abandon. On les appelait « anime pezzentelle » : les pauvres âmes décédées sans funérailles et sans que personne ne prie pour elles. Ce nom est lié à « pezzente », le pauvre, mais aussi au latin « petere », demander pour recevoir : ceux qui priaient pour eux espéraient recevoir en retour protection et grâce.\n\nLe lieu symbolique est le cimetière Fontanelle, dans le quartier de Sanità : une ancienne carrière de tuf du XVIe siècle d’environ quatre mille mètres carrés, qui accueillit les victimes de la peste de 1656 puis celles du choléra en 1836-1837. En 1872, le chanoine Gaetano Barbati disposa les ossements dans trois nefs. Les fidèles « adoptaient » un crâne, une capuzzella : ils le nettoyaient, le plaçaient dans un petit reliquaire, l’ornaient de chapelets et de pièces de monnaie, et priaient devant lui, attendant un signe en rêve, parfois un numéro de loterie. Certains crânes devinrent célèbres : le Capitaine, à l’orbite noircie, sujet d’une légende de mariage et de jalousie ; Donna Concetta, qui, dit-on, « transpire » lorsqu’une grâce est accordée.\n\nEn 1969, un décret du tribunal ecclésiastique a fermé l'ossuaire et interdit le culte. Fermé pour rénovation depuis 2020, le cimetière a rouvert ses portes au public en 2026, géré par la coopérative La Paranza.\n\nLe culte perdure également sous la Via dei Tribunali, dans l'hypogée de Santa Maria delle Anime del Purgatorio ad Arco, l'église que les Napolitains appellent « e cape 'e morte » : on y conserve le crâne de Lucia, une jeune âme particulièrement vénérée. Et sur la Via San Biagio dei Librai, dans la petite église de Santa Luciella, se trouve un crâne unique : celui qui possède des oreilles.","foto":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Naples ésotérique : un prince alchimiste, une façade codée et un œuf magique","som":"Raimondo di Sangro, le vestige du Gesù Nuovo, l'œuf de Virgile, le munaciello : là où l'histoire s'arrête et où la légende commence.","txt":"Naples adore les mystères, et certains sont particulièrement fascinants. Le plus célèbre porte un nom : Raimondo di Sangro, prince de Sansevero, homme du XVIIIe siècle, grand maître de la franc-maçonnerie napolitaine, était un inventeur jaloux de ses propres secrets. Le mythe l’entourait déjà de son vivant, et il l’alimentait lui-même. Benedetto Croce le qualifiait d’incarnation napolitaine du Docteur Faust. La légende noire lui attribue tous les crimes : des serviteurs assassinés pour étudier leurs corps, et même l’aveuglement du sculpteur du Christ voilé pour l’empêcher d’en sculpter un autre. Ce ne sont que des légendes, et le musée lui-même les distingue de l’histoire officielle.\n\nLe Christ voilé est l'œuvre de Giuseppe Sanmartino, commandée par le prince : le voile transparent qui recouvre le corps est taillé dans le même bloc de marbre que la statue. Dans la cavea souterraine de la chapelle se trouvent les « machines anatomiques », deux squelettes aux systèmes circulatoires reconstitués, créés par le médecin palermitain Giuseppe Salerno entre 1756 et 1764 environ. La légende raconte qu'ils impliquèrent de mystérieuses injections et des études sur la cire d'abeille et les colorants.\n\nNon loin de là, la façade du Gesù Nuovo, ancien palais Sanseverino datant de 1470, est revêtue d'un parement pyramidal de pierre de Piperno sombre. Certaines pierres portent des inscriptions gravées : la légende veut qu'il s'agisse d'un message secret ; certains érudits y voient les marques des tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les interpréter comme des notes de musique, une partition d'environ trois quarts d'heure intitulée « Énigme ». Une hypothèse séduisante, mais non une certitude.\n\nEt puis il y a la mer : selon la légende, le poète Virgile aurait caché l’œuf de la sirène Partenope dans les caves du Castel dell’Ovo. Tant que l’œuf restera intact, le château restera debout.\n\nDans les maisons, cependant, vivent les esprits de la tradition populaire : le munaciello, un elfe à capuche qui porte chance ou malice selon la façon dont on le traite, et la bella 'mbriana, un bon esprit de la maison, qui peut apparaître sous la forme d'un papillon ou d'un gecko.","foto":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples aujourd'hui : quoi de neuf ?","som":"La place dédiée à Maradona, le street art, le dernier Caravage sur la Via Toledo, les églises et les ossuaires rouverts : une ville en pleine mutation.","txt":"Ceux qui retournent à Naples après quelques années découvrent une ville qui a appris à raconter son histoire.\n\nDans le Quartier espagnol, à neuf minutes d'ici, se trouve Largo Maradona. La fresque de Diego Maradona, peinte en 1990 par Mario Filardi, s'est estompée au fil des ans, jusqu'à presque disparaître. Elle a ensuite été restaurée grâce à Salvatore Iodice, puis, à l'automne 2017, l'Argentin Francisco Bosoletti a repeint son visage. Après la mort de Maradona, le 25 novembre 2020, la place, autrefois appelée place des artistes, est devenue un lieu de recueillement laïque, orné de petits autels, de drapeaux argentins et de photographies, si populaire que la municipalité a dû réguler la circulation des piétons.\n\nLe street art a investi le centre historique : sur la Piazzetta dei Girolamini, protégée par une vitre, se dresse la Madone au pistolet de Banksy ; sur la Via Duomo, le San Gennaro le Travailleur de Jorit. Le site web officiel du tourisme de la ville leur consacre un itinéraire.\n\nSur la Via Toledo, à six minutes d'ici, les Gallerie d'Italia abritent le Martyre de sainte Ursule, la dernière toile du Caravage, ainsi que plus de cinq cents vases attiques et de Grande-Grèce.\n\nEt des lieux fermés depuis longtemps rouvrent leurs portes : l’église Santa Luciella ai Librai, abandonnée depuis plus de trente ans, a rouvert au public le 5 avril 2019 ; le cimetière Fontanelle a rouvert en 2026.","foto":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Sa   if(pr.length) info += '<p class="piccolo">' + pr.join(' · ') + '</p>';
  if(l.acc) info += '<p><b style="font-weight:500">' + e(T.accessibilita) + ':</b> ' + e(l.acc) + '</p>';
  if(l.po || l.sito) info += '<p>' + (l.po ? '<a href="' + e(l.po) + '" target="_blank" rel="noopener">' + e(T.pagina_orari) + '</a>' : '') + (l.po && l.sito ? ' · ' : '') + (l.sito ? '<a href="' + e(l.sito) + '" target="_blank" rel="noopener">' + e(T.sito) + '</a>' : '') + '</p>';
  h += '<details class="apri"' + (verificati(l, ora) ? ' open' : '') + '><summary>' + e(T.info_pratiche) + '</summary><div>' + info + '</div></details>';
  if(l.lat != null){
    h += bloccoMappa('m-luogo', '240px');
    h += '<a class="btn sec" href="' + e(portami(l)) + '" target="_blank" rel="noopener">' + e(T.portami) + ' ↗</a>';
    setTimeout(function(){ mappa('m-luogo', {geo: true, punti: [{t: '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s}]}); });
  }
  h += fontiHtml(l.fonti);
  if(inGiro) h += '<div class="fisso"><a class="btn" href="#/c/' + e(G.s) + '">← ' + e(T.riprendi) + '</a></div>';
  return h + '</div>';
};
V.racconto = function(s){
  var r = RA[s]; if(!r) return V.home();
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="history.length > 1 ? history.back() : vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><span class="etichetta">' + e(T.racconti) + '</span><h1>' + e(r.t) + '</h1>' +
    (r.foto ? '<div class="galleria"><figure><img src="' + e(r.foto.u) + '" alt="' + e(r.foto.alt) + '"><figcaption>' + e(r.foto.aut) + ' · ' + e(r.foto.lic) + '</figcaption></figure></div>' : '') +
    '<div class="testo">' + par(r.txt) + '</div>' + fontiHtml(r.fonti) + '</div>';
};
V.mappa = function(){
  var punti = D.luoghi.filter(function(l){ return l.lat != null; }).map(function(l){ return {t: casa(l) ? 'C' : '•', n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l)}; });
  setTimeout(function(){ mappa('m-tutti', {geo: true, punti: punti}); });
  return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>' + e(T.mappa) + '</h1>' + bloccoMappa('m-tutti', '60vh') + '</div>';
};
V.piove = function(){ var ora = adesso(); return '<div class="stack vista"><div class="testa"><button class="indietro" onclick="vai(\'#/\')">← ' + e(T.indietro) + '</button>' + lingue() + '</div><h1>☂ ' + e(T.piove) + '</h1>' + V.coperti(ora) + '</div>'; };
function fontiHtml(fs){ if(!fs || !fs.length) return ''; return '<details class="apri fonti"><summary>' + e(T.fonti) + ' (' + fs.length + ')</summary><div><ul style="margin:0;padding-left:18px">' + fs.map(function(x){ return '<li><a href="' + e(x.u) + '" target="_blank" rel="noopener">' + e(x.t) + '</a></li>'; }).join('') + '</ul></div></details>'; }
function vai(h){ if(location.hash === h) mostra(); else location.hash = h; }
var ultima = null;
function mostra(){
  var p = location.hash.replace(/^#\/?/, '').split('/'), app = document.getElementById('app'), h, a = decodeURIComponent(p[1] || '');
  if(p[0] !== 'c' && watchId != null && !(p[0] === 'l')) fermaPosizione();
  try{ speechSynthesis.cancel(); }catch(x){}
  if(p[0] === 'i') h = V.itinerario(a); else if(p[0] === 'c') h = V.cammino(a); else if(p[0] === 'l') h = V.luogo(a); else if(p[0] === 'r') h = V.racconto(a);
  else if(p[0] === 'mappa') h = V.mappa(); else if(p[0] === 'piove') h = V.piove(); else h = V.home();
  var ant = D.luoghi.concat(D.itinerari, D.racconti).some(function(x){ return x.ant; });
  app.innerHTML = (ant ? '<p class="avviso prova" style="margin-top:12px">' + e(T.anteprima) + '</p>' : '') + h +
    '<footer><a href="' + e(D.menu) + '">' + e(T.torna_menu) + '</a><span>' + e(T.editoriale) + '</span><span>' + e(T.senza_rete) + '</span></footer>';
  if(ultima !== location.hash) window.scrollTo(0, 0); ultima = location.hash;
}
document.addEventListener('click', function(ev){
  var c = ev.target.closest('[data-filtro]'); if(c){ filtro = c.dataset.filtro; return mostra(); }
  var a = ev.target.closest('a[data-lng]'); if(a){ try{ localStorage.setItem('menu_lingua', a.dataset.lng); }catch(x){} ev.preventDefault(); location.href = (a.getAttribute('href') || './') + location.hash; }
});
if(D.lingua === 'it' && D.lingue.length){ try{ var sl = localStorage.getItem('menu_lingua'), tl = sl && sl !== 'it' && D.lingue.filter(function(x){ return x.c === sl; })[0]; if(tl) location.replace(tl.u + location.hash); }catch(x){} }
window.addEventListener('hashchange', mostra);
mostra();
setInterval(function(){ if(!document.hidden && !/#\/(mappa|i\/|l\/|c\/)/.test(location.hash)) mostra(); }, 60000); /* «aperto ora» resta giusto senza ricaricare */
if('serviceWorker' in navigator) navigator.serviceWorker.register(PRE + 'sw.js').catch(function(){});
</script>
