<!doctype html>

<title>Guide de Naples · Ceraldi</title>

<style>
/* Guida di Napoli (E2): una colonna da telefono, quattro momenti: scegli · capisci · cammina · guarda.
   Colori del menu Ceraldi (sovrascritti dal database), caratteri del menu copiati in caratteri/ (OFL), nessuna richiesta esterna. */
:root{--sfondo:#F3EFE8;--superficie:#FBF8F3;--testo:#23170F;--testo-2:#5F5045;--accento:#7A5C2C;--accento-chiaro:#EADBC0;--scuro:#2E3A2F;--su-scuro:#F1EDE3;
--linea:#E3DBCD;--io:#2F7BD9;--ok:#2F6B3A;--ok-bg:#E4EFE2;--att:#8A5A00;--att-bg:#F8ECD3;--ko:#9B2C1F;--ko-bg:#F6E1DD;
--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>:root{--c-scuro:#2E3A2F;--testo:#23170F;--prezzo:#2E3A2F;--sfondo:#F3EFE8;--accento:#7A5C2C;--testo-2:#5F5045;--c-su-scuro:#F1EDE3;--superficie:#FBF8F3;--c-accento-chiaro:#D4B57E;}</style>
<style>
:root{--f-display:"Bodoni Moda",Georgia,"Times New Roman",serif;--f-testo:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.55 var(--f-testo)}
a{color:var(--accento)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--io);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem;line-height:1.15}h3{font-size:1.2rem;line-height:1.2}
p{margin:0}
.pagina{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:18px}.stack-s{display:grid;gap:8px}
.piccolo{font-size:.88rem;color:var(--testo-2)}
.etichetta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accento);font-weight:500}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.indietro{border:0;background:none;padding:8px 0;color:var(--accento);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:14px;border:0;background:var(--scuro);color:var(--su-scuro);font-weight:500;font-size:1.02rem;text-decoration:none;text-align:center;padding:10px 14px}
.btn.sec{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro{background:var(--su-scuro);color:var(--scuro)}
.due{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avviso{padding:10px 12px;border-radius:12px;font-size:.9rem}
.avviso.prova{background:var(--att-bg);color:var(--att)}
.avviso.ko{background:var(--ko-bg);color:var(--ko)}
.avviso.info{background:var(--superficie);color:var(--testo-2);border:1px solid var(--linea)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--superficie);border-radius:999px;padding:10px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--scuro);border-color:var(--scuro);color:var(--su-scuro)}
.scheda{background:var(--superficie);border-radius:18px;overflow:hidden}
.scheda .dentro{padding:14px 16px 16px;display:grid;gap:10px}
.oggi{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.copertina-giro{position:relative;display:block;height:220px;overflow:hidden;background:var(--accento-chiaro)}
.copertina-giro>svg{position:absolute;inset:0}
.copertina-giro>img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.copertina-giro.pronta>img.fondo{opacity:1}
.copertina-giro.pronta>svg{display:none}
.copertina-giro .pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;background:var(--scuro);opacity:0;transition:opacity .4s}
.copertina-giro.pronta .pin{opacity:1}
.copertina-giro .pin img{width:100%;height:100%;object-fit:cover;display:block}
.copertina-giro .pin.punto{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--su-scuro);font-size:.75rem;font-weight:500}
.copertina-giro .pin.casa{background:var(--accento)}
.copertina-giro .pin b{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--scuro);color:var(--su-scuro);font-size:.62rem;font-weight:500;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.copertina-giro .osm{position:absolute;right:6px;bottom:4px;font-size:.6rem;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;opacity:0}
.copertina-giro.pronta .osm{opacity:1}
.miniature{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.miniature>*{aspect-ratio:1;border-radius:9px;overflow:hidden;max-width:100%}
.dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dato{background:var(--superficie);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-weight:500;font-size:1.05rem}
.stato{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:999px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.att{background:var(--att-bg);color:var(--att)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.ill{display:block;width:100%;height:100%}
.mappa{height:340px;border-radius:18px;overflow:hidden;background:#e8e4dc}
.pin{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font:500 .85rem var(--f-testo);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;text-decoration:none}
.pin.casa{background:var(--accento)}
.pin.spento{background:#9a958c}
.io{width:20px;height:20px;border-radius:50%;background:var(--io);border:4px solid #fff;box-shadow:0 0 0 9px color-mix(in srgb,var(--io) 22%,transparent)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;position:relative;padding-bottom:6px}
.tl>li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--linea)}
.num{width:40px;height:40px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center;font-weight:500;position:relative;z-index:1}
.num.casa{background:var(--accento);color:var(--superficie)}
.tappa{background:var(--superficie);border-radius:14px;padding:12px;display:grid;gap:8px}
.tappa .riga{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit}
.tappa .mini{width:64px;height:64px;border-radius:10px;overflow:hidden}
.tappa h3{font-family:var(--f-testo);font-size:1.02rem;font-weight:500}
.tra{font-size:.84rem;color:var(--testo-2);padding:2px 0 10px 52px}
.alt{padding:8px 10px;border-radius:10px;background:var(--att-bg);color:var(--att);font-size:.88rem}
details.apri{background:var(--superficie);border-radius:14px;padding:0 14px}
details.apri>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.apri>summary::-webkit-details-marker{display:none}
details.apri>summary::after{content:"+";font-size:1.3rem;color:var(--accento)}
details.apri[open]>summary::after{content:"–"}
details.apri>div{padding-bottom:14px;display:grid;gap:10px}
details.come summary{cursor:pointer;color:var(--accento);font-weight:500;font-size:.9rem}
details.come ol{margin:6px 0 0;padding-left:20px}
details.come li{margin:4px 0}
.guarda{display:grid;gap:0;background:var(--superficie);border-radius:16px;overflow:hidden}
.guarda .gf{margin:0;display:grid}
.guarda .gf .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.guarda .gf img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.guarda .gf figcaption{padding:10px 14px 0;display:grid;gap:3px;font-size:.9rem;line-height:1.4}
.guarda .gf .dida{color:var(--testo-2)}.guarda .gf .dida b{color:var(--accento);font-weight:500}
.guarda .corpo{padding:12px 14px 16px;display:grid;gap:6px;min-width:0}
.guarda .tit{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center}
.guarda .n{width:30px;height:30px;border-radius:50%;background:var(--scuro);color:var(--su-scuro);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center}
.guarda b{font-weight:500;font-size:1.05rem}
.guarda .dove{font-size:.85rem;color:var(--accento);font-weight:500}
.guarda .testo{display:grid;gap:8px;font-size:.97rem}
.voce{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border-radius:14px;padding:10px}
.voce .mini{width:56px;height:56px;border-radius:10px;overflow:hidden}
.voce b{font-weight:500;display:block}
.galleria{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.galleria>figure{margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;max-width:100%;background:var(--superficie);display:grid;align-content:start}
.galleria .ft{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.galleria img{width:100%;height:100%;object-fit:cover;display:block}
.galleria figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.92rem;line-height:1.4}
.galleria figcaption .cr,.guarda .cr,.capitolo .cr{font-size:.72rem;color:var(--testo-2,inherit);opacity:.75}
.dida{font-size:.9rem;font-style:italic}
.scorri{font-size:.82rem;opacity:.75;margin-top:-4px}
.orari{width:100%;border-collapse:collapse;font-size:.93rem}
.orari td{padding:6px 0;border-bottom:1px solid var(--linea)}.orari td:last-child{text-align:right}
.orari tr.oggi td{font-weight:600}
.apertura .cop{display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--accento-chiaro)}
.apertura .cop img{width:100%;height:100%;object-fit:cover;display:block}
.galleria.uno{grid-auto-columns:100%}
.indice{background:var(--superficie);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.indice ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.indice button{border:0;background:none;padding:7px 0;text-align:left;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;width:100%;color:var(--testo);border-top:1px solid var(--linea)}
.indice .per{color:var(--accento);font-size:.82rem;font-weight:500}
.assaggio{display:grid;gap:10px;border:1px solid var(--linea);border-radius:20px;padding:14px;background:var(--carta,transparent)}
.assaggio p{margin:0}
.prodotti{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.prod{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--linea);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;background:var(--sfondo,transparent)}
.prod .ft{aspect-ratio:4/3;background:var(--linea)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod span{display:grid;gap:2px;padding:8px 10px}
.prod b{font-weight:500;line-height:1.25}
.arrivo .prod{border-color:color-mix(in srgb,var(--su-scuro) 30%,transparent);color:var(--su-scuro)}
.leggi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--linea);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.leggi span{display:grid;gap:3px;min-width:0}
.leggi b{font-weight:500;line-height:1.3}
.capitolo{display:grid;gap:10px;scroll-margin-top:12px;padding-top:6px;border-top:1px solid var(--linea)}
.capitolo figure{margin:0;border-radius:16px;overflow:hidden;background:var(--superficie);display:grid}
.capitolo .ft{max-width:100%;overflow:hidden;background:#1d1a17;display:flex;justify-content:center}
.capitolo .ft img{width:100%;height:auto;max-height:min(70vh,560px);object-fit:contain;display:block}
.capitolo figcaption{padding:10px 12px 12px;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.capitolo .dida b{color:var(--accento);font-weight:500}
.testo{display:grid;gap:12px}
.manovra{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.freccia{width:58px;height:58px;border-radius:14px;background:var(--scuro);color:var(--su-scuro);display:flex;align-items:center;justify-content:center}
.foglio{background:var(--superficie);border-radius:20px;padding:16px;display:grid;gap:12px}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.barra i{display:block;height:100%;background:var(--scuro)}
.arrivo{background:var(--scuro);color:var(--su-scuro);border-radius:20px;padding:16px;display:grid;gap:12px}
.arrivo .btn.sec{background:transparent;color:var(--su-scuro);border-color:color-mix(in srgb,var(--su-scuro) 40%,transparent)}
.fisso{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sfondo) 30%)}
.fonti{font-size:.85rem}.fonti li{margin:4px 0}
.lingue{position:relative}
.lingue summary{list-style:none;cursor:pointer;border:1px solid var(--linea);background:var(--superficie);border-radius:20px;padding:5px 11px;font-size:.9rem;white-space:nowrap}
.lingue summary::-webkit-details-marker{display:none}
.lingue ul{position:absolute;right:0;top:115%;z-index:30;list-style:none;margin:0;padding:6px;background:var(--superficie);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:160px}
.lingue a{display:block;padding:9px 10px;text-decoration:none;color:inherit;border-radius:8px}
.lingue a[aria-current]{font-weight:600;background:var(--accento-chiaro)}
footer{margin-top:28px;font-size:.85rem;color:var(--testo-2);text-align:center;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.vista{animation:entra .22s ease-out}@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
var D = {"lingua":"fr","luoghi":[{"id":7,"s":"piazza-carita","n":"Piazza Carità et Via Toledo","tipo":"piazza","zona":"toledo_mare","ind":"","lat":40.844326,"lon":14.249114,"mp":0,"dv":10,"gr":null,"sa":true,"sito":"","po":"","som":"Le point de départ : Piazza Carità, sur la via Toledo. D'ici, le centre historique n'est qu'à quelques minutes à pied. Et c'est ici que se trouve Ceraldi.","rac":"Piazza Carità donne sur la Via Toledo, la grande rue que le vice-roi espagnol don Pedro de Tolède fit ouvrir au XVIe siècle, quand il doubla la superficie de la ville et construisit, sur la colline voisine, les quartiers pour les soldats : les Quartiers espagnols.\n\nD'ici, le centre ancien est à quelques minutes : montez vers la Piazza del Gesù et vous êtes sur Spaccanapoli. En descendant la Via Toledo, vous arrivez en revanche à Piazza del Plebiscito, au Palais royal et à la mer.","con":"Avant de partir, un café : le parcours est long et Naples se visite mieux avec la bonne petite tasse.","acc":"","foto":{"u":"../img/15021c80962d.jpg","alt":"Piazza Carità aujourd'hui, avec ses arbres et ses immeubles colorés","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Piazzacarit%C3%A0Naples.jpg","dida":"Piazza Carità aujourd'hui, sur la Via Toledo : c'est d'ici que partent tous les parcours. Ceraldi est ici."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true,"dett":[{"t":"La place devant Ceraldi","x":"Piazza Carità est le point de départ de tous les parcours : vous êtes sur la via Toledo, la grande rue ouverte au XVIe siècle par le vice-roi don Pedro de Tolède pour relier le centre ancien à la ville nouvelle et aux Quartiers espagnols.\n\nD'ici, en quelques minutes, vous êtes à Spaccanapoli, au nord-est, ou à la mer et aux châteaux, au sud. Avant de partir, prenez un café : le parcours est long et Naples se visite à pied.","d":"Devant le café","foto":{"u":"../img/6f4c11148f21.jpg","alt":"La via Toledo et le Largo della Carità sur une photographie du XIXe siècle","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La via Toledo et le Largo Carità au XIXe siècle : la grande rue voulue par don Pedro de Tolède, déjà pleine de vie à l'époque."}}],"gal":[{"u":"../img/6f4c11148f21.jpg","alt":"Photo d'époque de la Via Toledo au XIXe siècle, avec des calèches et des passants","aut":"Giacomo Brogi","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Brogi%2C_Giacomo_%281822-1881%29_-_n._5472a_-_Napoli_-_Strada_Roma_gi%C3%A0_Toledo_%28veduta_animata%29.jpg","dida":"La Via Toledo au XIXe siècle, quand elle s'appelait Via Roma, sur une photo de Giacomo Brogi."}],"leg":"","fc":null,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/piazza-carita-via-toledo/","t":"Piazza Carità et via Toledo : une promenade au cœur de Naples","x":"L'histoire de la place, racontée par ceux qui y travaillent depuis 2002.","it":true}]}},{"id":38,"s":"spaccanapoli","n":"Spaccanapoli, le décumanus inférieur","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.847456,"lon":14.2525,"mp":7,"dv":40,"gr":null,"sa":true,"sito":"","po":"","som":"La rue droite qui coupe le centre historique en deux : le décumanus inférieur de la ville grecque, environ deux kilomètres d'églises, de boutiques et de vie.","rac":"Spaccanapoli est le plus bas des trois décumani, les rues parallèles qui traversaient d'ouest en est la Neapolis grecque. Elle commence piazza del Gesù Nuovo sous le nom de via Benedetto Croce, puis devient via San Biagio dei Librai, traverse la via Duomo et se poursuit au-delà du centre ancien : environ deux kilomètres en tout. Son nom dit tout : elle est si longue et si droite que, vue d'en haut, elle semble couper la ville en deux.","con":"Parcourez-la à pied de la Piazza del Gesù vers la Via Duomo : c'est une légère descente dans l'histoire, pas dans l'effort.","acc":"","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Spaccanapoli vue d'en haut, une ligne droite à travers les toits du centre historique","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Spaccanapoli vue depuis Sant'Elmo : une ligne droite qui coupe les toits du centre historique."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"La rue qui fend Naples","x":"Spaccanapoli est le nom populaire du decumanus inférieur, l'une des trois grandes rues parallèles de la cité grecque : c'était la « plateia » de Neapolis. On l'appelle ainsi parce que, parfaitement droite, elle divise en deux le centre ancien, entre le nord et le sud.\n\nElle change plusieurs fois de nom : Via Benedetto Croce, puis Via San Biagio dei Librai. Depuis la colline, du haut de la Via Pasquale Scura, on la voit se dérouler tout entière d'un seul regard.\n\nLe long de la rue, entre le Moyen Âge et le XIXe siècle, se sont élevés des couvents et des palais de familles puissantes : regardez en haut les portails et les cours, et en bas les boutiques.","d":"Sur toute la longueur de la rue, de la Piazza del Gesù à la Via Duomo","foto":{"u":"../img/f0498399a45a.jpg","alt":"La ligne droite de Spaccanapoli vue d'en haut","aut":"Carlo Raso","lic":"Pubblico dominio","src":"https://www.flickr.com/photos/70125105@N06/39389716434","dida":"Spaccanapoli vue depuis le Castel Sant'Elmo : la ligne droite qui divise en deux le centre ancien."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":8,"s":"gesu-nuovo","n":"Place et église du Gesù Nuovo","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.847558,"lon":14.251874,"mp":7,"dv":20,"gr":null,"sa":false,"sito":"","po":"","som":"Une façade de pierres en pointe de pyramide qui ressemble à une forteresse et cache un mystère : des signes gravés que personne n'a encore déchiffrés avec certitude.","rac":"Avant d'être une église, c'était un palais : celui des princes Sanseverino, construit en 1470 ; une plaque sur la façade rappelle le nom de l'architecte, Novello da San Lucano. Les jésuites en ont conservé la structure et le bossage en piperno sombre, aux pierres taillées en pointe de pyramide, en y ajoutant des éléments en marbre blanc.\n\nSur certaines pierres, on distingue des signes gravés. Selon la légende, il s'agit d'un message secret ; pour certains spécialistes, ce sont les marques laissées par les différentes équipes de tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les lire comme les notes d'une partition intitulée « Enigma ». Observez-les de près et choisissez votre version.\n\nLa façade a été restaurée et présentée le 12 mars 2023, après la chute de quelques fragments en décembre 2017 ; depuis, la place est fermée aux voitures.","con":"Cherchez les signes sur les pierres à hauteur des yeux, à droite et à gauche du portail : la chasse est gratuite.","acc":"","foto":{"u":"../img/96d5545e33d7.jpg","alt":"La façade du Gesù Nuovo, en pierres sombres taillées en pointe","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Facciata_della_chiesa_del_Ges%C3%B9_Nuovo_%28Napoli%29_-_BW_2013-05-16.jpg","dida":"La façade en pointes de diamant : c'était le palais des princes Sanseverino, datant de 1470. Approchez-vous et cherchez les signes gravés sur les pierres."},"ov":false,"ovi":null,"or":[{"g":[1,2,3,4,5,6,7],"da":"07:30","a":"13:00"},{"g":[1,2,3,4,5,6,7],"da":"16:00","a":"19:30"}],"fonti":[{"t":"Fanpage – note musicali sulla facciata","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"FAI – Chiesa del Gesù Nuovo","u":"https://fondoambiente.it/luoghi/chiesa-del-gesu-nuovo"},{"t":"Wikipedia – Chiesa del Gesù Nuovo","u":"https://it.wikipedia.org/wiki/Chiesa_del_Gesù_Nuovo"},{"t":"Wikipedia – Giuseppe Moscati","u":"https://en.wikipedia.org/wiki/Giuseppe_Moscati"}],"ant":true,"dett":[{"t":"La façade en pointes de diamant","x":"Avant d'être la façade d'une église, c'était celle d'un palais : le palais des Sanseverino, princes de Salerne, construit en 1470. Quand les jésuites y construisirent leur église, à partir de 1584, ils éventrèrent le palais mais en sauvèrent la façade et le portail. À Naples, cela se faisait souvent : dans le centre ancien, la place manquait et il n'était pas possible de construire hors des murs.\n\nRegarde les pierres : ce sont des pierres de piperno, une pierre volcanique grise et très dure, taillées en pointes de diamant (le « bossage »). Le grand portail baroque, avec ses colonnes, les anges sur le fronton et le monogramme des jésuites « IHS », renferme encore le portail Renaissance du palais.\n\nMaintenant, approche-toi : sur de nombreuses pointes, il y a de petits signes gravés. Pour certains, ce sont les marques des équipes de tailleurs de pierre ; une légende dit que les maîtres tailleurs de piperno savaient « charger » la pierre d'énergie ; en 2010, des chercheurs les ont lus comme les notes d'une partition, lecture contestée par la suite. Il n'y a pas de réponse certaine : cherches-en un et choisis la tienne.","d":"À l'extérieur, sur la place","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La façade du Gesù Nuovo couverte de pointes de diamant en pierre grise","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Le bossage en pointes de diamant de la façade du Gesù Nuovo, avec le portail et la grande fenêtre."}},{"t":"L'Expulsion d'Héliodore","x":"C'est la grande fresque au-dessus de la porte d'entrée : elle a été peinte par Francesco Solimena, qui l'a signée et datée de 1725. Beaucoup de visiteurs ne la voient pas, car ils entrent en regardant l'autel : retournez-vous.\n\nL'histoire vient de la Bible (deuxième livre des Maccabées) : Héliodore tente de piller le trésor du temple de Jérusalem et est repoussé par un cavalier céleste. Cherchez le cavalier, les chevaux et les figures en fuite : c'est une scène théâtrale, pleine de mouvement, comme l'aimait le baroque.\n\nDe part et d'autre de la grande fenêtre, au-dessus de la fresque, se trouvent deux scènes plus petites de Belisario Corenzio, datant de 1638 : Sainte Hélène retrouvant la Croix et la Conversion de saint Paul.","d":"Dès que vous entrez, tournez-vous vers la porte : elle se trouve au-dessus de l'entrée","foto":{"u":"../img/7a0dd25a648c.jpg","alt":"La grande fresque de l'Expulsion d'Héliodore de Francesco Solimena","aut":"Nbatteur (foto); affresco di Francesco Solimena","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Francesco_Solimena_-_Cacciata_di_Eliodoro_dal_Tempio.JPG","dida":"La fresque de Solimena au-dessus de l'entrée : tournez-vous vers la porte pour la voir. Au centre, le cavalier céleste qui repousse Héliodore."}},{"t":"La coupole et les quatre évangélistes","x":"Arrêtez-vous au centre de l'église, là où la nef croise le transept, et levez les yeux. Dans les quatre triangles courbes qui soutiennent la coupole (les «pendentifs») se trouvent les quatre évangélistes peints par Giovanni Lanfranco au XVIIe siècle : ils sont ce qui reste de son grand cycle, car le reste a été perdu avec la coupole.\n\nLa coupole a en effet connu une vie difficile. L'originale s'est effondrée lors du tremblement de terre de 1688 ; elle fut reconstruite, mais resta menaçante et fut abattue à la fin du XVIIIe siècle. En 1786, elle fut remplacée par une couverture plus basse, en forme de bol, qui est celle que vous voyez aujourd'hui ; en 1975, elle a été consolidée par une structure en béton armé.\n\nAutour de vous, c'est le baroque napolitain dans toute sa splendeur : marbres incrustés de nombreuses couleurs («marmi commessi»), stucs dorés, fresques de Belisario Corenzio et Paolo De Matteis sur les voûtes, toiles de Luca Giordano et sculptures de Cosimo Fanzago.","d":"Au centre de l'église, levez les yeux","foto":{"u":"../img/3dd3789513c8.jpg","alt":"La nef du Gesù Nuovo en direction de la coupole","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nef du Gesù Nuovo : à l'endroit où elle croise le transept, levez les yeux vers la coupole et les quatre pendentifs ornés des évangélistes."}},{"t":"La chapelle de saint Ignace","x":"C'est la grande chapelle au fond du bras gauche du transept, dédiée à saint Ignace de Loyola, fondateur des jésuites. L'architecture et les marbres sont de Cosimo Fanzago et de ses collaborateurs, entre 1637 et 1645 environ ; de part et d'autre de l'autel, les deux statues des prophètes David et Jérémie sont de Fanzago lui-même.\n\nLes toiles illustrant la vie du saint sont de Jusepe de Ribera, le peintre espagnol qui travailla à Naples et en devint l'un des maîtres. Au pied de l'autel est enterré le commanditaire, Carlo Gesualdo da Venosa.\n\nTraversez ensuite l'église : en face, dans le bras droit, se trouve la chapelle « jumelle » de saint François Xavier, le premier missionnaire jésuite en Asie, avec des sculptures de Fanzago et, en hauteur, trois toiles de Luca Giordano de 1676-77. Regardez-les l'une après l'autre : c'est le Seicento napolitain à son apogée.","d":"Dans l'une des deux grandes chapelles de l'église","foto":{"u":"../img/835d153e2859.jpg","alt":"Une toile de Ribera représentant saint Ignace en gloire","aut":"IlSistemone","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sant%27Ignazio_in_gloria%2C_Jusepe_de_Ribera_%28Napoli%29.jpg","dida":"Saint Ignace en gloire, toile de Jusepe de Ribera dans la chapelle dédiée au fondateur des jésuites."}},{"t":"Saint Giuseppe Moscati","x":"Ici repose le « médecin saint » de Naples : Giuseppe Moscati, médecin et professeur d'université, qui soignait gratuitement les plus pauvres et les aidait aussi avec de l'argent. Il mourut en 1927 et fut proclamé saint par le pape Jean-Paul II en 1987.\n\nSon corps repose dans l'urne de bronze au centre de la chapelle de la Visitation, la deuxième à droite, où il fut transporté en 1977. L'urne est l'œuvre d'Amedeo Garufi : regardez les trois bas-reliefs, qui le montrent en train de faire cours à l'université, de guérir un enfant dans les bras de sa mère et de soigner les malades à l'hôpital. À gauche se trouve sa statue en bronze, de 1990.\n\nDepuis la grande chapelle de Saint-François-Xavier, une porte mène aux Salles de Saint Giuseppe Moscati : photos, manuscrits, ses vêtements et ses instruments médicaux, ainsi que le cabinet de travail et la chambre à coucher de sa maison, reconstitués ici. Dans ces mêmes salles est exposée une bombe de la Seconde Guerre mondiale qui tomba sur le plafond de l'église sans exploser.","d":"Dans la chapelle de la Visitation, sous l'autel","foto":{"u":"../img/c9deda186fa3.jpg","alt":"La chambre reconstituée de saint Giuseppe Moscati : blouse blanche et instruments médicaux dans une vitrine","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Ges%C3%B9_Nuovo,_stanza_di_Giuseppe_Moscati_(3).jpg","dida":"Dans la chambre reconstituée : la blouse blanche, les instruments médicaux et les photographies de saint Giuseppe Moscati."}}],"gal":[{"u":"../img/4a574d8f9faf.jpg","alt":"La place du Gesù Nuovo devant l'église","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Piazza_del_Ges%C3%B9_Nuovo.jpg","dida":"La place du Gesù Nuovo, devant l'église."},{"u":"../img/6d1ae4837518.jpg","alt":"L'intérieur du Gesù Nuovo, avec ses marbres colorés et le maître-autel","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_chiesa_del_Ges%C3%B9_Nuovo%2C_interno_%281%29.jpg","dida":"À l'intérieur, le contraste avec la façade austère : marbres colorés, fresques et or fin jusqu'au maître-autel."},{"u":"../img/3dd3789513c8.jpg","alt":"La nef du Gesù Nuovo vue depuis l'entrée","aut":"Erik den yngre","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:ChiesaGesu_interior.JPG","dida":"La nef vue depuis l'entrée : au fond, en haut, la coupole avec les évangélistes de Lanfranco à sa base."}],"leg":"","fc":null,"col":null},{"id":9,"s":"santa-chiara","n":"Monastère et complexe de Santa Chiara (cloître en majolique)","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84591,"lon":14.252607,"mp":7,"dv":45,"gr":false,"sa":false,"sito":"https://www.monasterodisantachiara.it/","po":"https://www.monasterodisantachiara.it/en/orari/","som":"Le cloître recouvert de majoliques est l'un des lieux les plus paisibles du centre : à deux pas du chaos de Spaccanapoli, le silence.","rac":"Santa Chiara voit le jour en 1310 à la volonté du roi Robert d'Anjou et de la reine Sancia de Majorque. Les travaux furent dirigés d'abord par Gagliardo Primario, puis par Lionardo di Vito, et en 1340 l'église fut ouverte au culte. Le complexe était double : un couvent pour les moniales clarisses et un autre pour les frères mineurs, proches mais séparés.\n\nQuatre siècles plus tard, sur la suggestion de la reine Marie-Amélie de Saxe, épouse de Charles de Bourbon, le cloître des clarisses fut rénové. L'architecte Domenico Antonio Vaccaro conserva les arcs gothiques du XIVe siècle et transforma le centre en jardin baroque, recouvert de majoliques de l'atelier de Donato et Giuseppe Massa. Le résultat est l'un des lieux les plus surprenants de Naples : un jardin de céramique à deux pas de Spaccanapoli.\n\nL'église est gothique, avec une façade à large pignon qui encadre l'ancienne rosace, et à l'intérieur elle a une nef unique avec dix chapelles de chaque côté. Le bombardement du 4 août 1943 l'a durement touchée : il a aussi détruit une partie des fresques du cloître, et la reconstruction lui a rendu les formes gothiques que les stucs du XVIIIe siècle avaient cachées.\n\nSous le complexe se cache une autre surprise : les vestiges d'un établissement thermal romain, découvert lors des restaurations de l'après-guerre. Il comprenait une palestre, une piscine couverte et des salles pour les bains d'air chaud : c'est le témoignage le plus complet des anciens thermes de Neapolis.","con":"Le dimanche, le cloître ferme à 14 h : si c'est un dimanche après-midi, inversez l'ordre et venez ici en premier.","acc":"","foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'entrée du cloître de Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'entrée du cloître en majolique de Santa Chiara."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,2,3,4,5,6],"da":"09:30","a":"17:00","n":"Cloître et musée"},{"g":[7],"da":"10:00","a":"14:00","n":"Cloître et musée"}],"fonti":[{"t":"Chiostro di Santa Chiara – La storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"},{"t":"Chiostro di Santa Chiara – Chiostro maiolicato","u":"https://www.monasterodisantachiara.it/en/chiostro-maiolicato/"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"},{"t":"Monastero di Santa Chiara – Gli affreschi","u":"https://www.monasterodisantachiara.it/gli-affreschi/"},{"t":"Monastero di Santa Chiara","u":"https://www.monasterodisantachiara.it/"},{"t":"Monastero di Santa Chiara – Area archeologica","u":"https://www.monasterodisantachiara.it/area-archeologica/"},{"t":"Monastero di Santa Chiara – Storia del chiostro","u":"https://www.monasterodisantachiara.it/en/storia-del-chiostro/"}],"ant":true,"dett":[{"t":"Les piliers de majolique","x":"Le jardin est divisé en quatre parties par deux allées qui se croisent, et le long de ces allées se dressent 64 piliers à huit côtés, tous revêtus de majolique. Les décorations sont des guirlandes de feuilles, de fleurs et de fruits ; les couleurs les plus utilisées sont le jaune, l'orange et le bleu, choisies pour évoquer les agrumes et la vigne de la pergola qui pousse au-dessus de vous.\n\nLes majoliques sortent de l'atelier de Donato et Giuseppe Massa, qui suivirent le projet de l'architecte napolitain Domenico Antonio Vaccaro : il voulait que émaux, architecture et plantes ne fassent qu'un. Les piliers se terminent par des chapiteaux en piperno et sont reliés par des bancs, eux aussi entièrement en majolique.\n\nLe cloître fut ainsi transformé dans les années autour de 1742, lorsque l'abbesse était sœur Ippolita Carmignano : c'est la reine Marie-Amélie de Saxe, épouse de Charles de Bourbon, qui poussa à plusieurs reprises les religieuses à le « moderniser ».","d":"Dans le jardin du cloître","foto":{"u":"../img/924627d30fda.jpg","alt":"Piliers recouverts de majoliques jaunes et vertes dans le cloître","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Tile_decorated_columns_-_Cloister_of_Santa_Chiara_-_Naples_-Italy_2015_%283%29.JPG","dida":"Les piliers revêtus de majoliques ornées de guirlandes de feuilles, de fleurs et de fruits, sous la pergola."}},{"t":"Les scènes sur les bancs","x":"Asseyez-vous : les bancs qui relient les piliers sont tous en majolique, et sur les dossiers sont peintes de petites scènes du XVIIIe siècle. On y voit des scènes de campagne, de mer, des fêtes populaires et des histoires mythologiques : un récit en images de la vie d'alors.\n\nLes scènes continuent aussi sur le muret qui entoure les parterres : parcourez les allées sans vous presser et regardez en bas, et pas seulement sur les côtés.\n\nUn conseil : c'est un très beau jeu à faire avec les enfants. Choisissez chacun une scène et racontez-vous ce qui se passe : qui part à la pêche, qui danse, qui travaille aux champs.","d":"Sur les dossiers des bancs entre les piliers","foto":{"u":"../img/79ec1acbab17.jpg","alt":"Un banc en majolique avec une scène peinte sur le dossier","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Chiostri_di_Santa_Chiara_Majolica_benches_in_Santa_Chiara_%28Naples%29_BW_2013-05-16_12-41-42.jpg","dida":"Un banc en majolique du cloître : sur le dossier se trouve une scène peinte."}},{"t":"La clarisse et les chats","x":"Parmi toutes les scènes des dossiers, il y en a une qui parle du monastère lui-même : une clarisse qui donne à manger aux chats qui vivaient dans le cloître. C'est un petit moment de vie quotidienne, peint en majolique au XVIIIe siècle par l'atelier des Massa.\n\nLes clarisses sont les religieuses de l'ordre de Santa Chiara : l'ensemble est en effet né de deux couvents voisins mais séparés, l'un pour les clarisses et l'autre pour les frères mineurs.\n\nLa trouver est une chasse au trésor parfaite, y compris pour les enfants : parcourez les bancs un par un. Si vous ne la trouvez pas, demandez au personnel du cloître.","d":"Sur l'un des dossiers des bancs : à vous de la trouver","foto":{"u":"../img/009a5af8811f.jpg","alt":"Une scène de vie à la campagne peinte en majolique sur un dossier de banc du cloître","aut":"MentNFG","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Chiostro_di_Santa_Chiara_WLM24_(34).jpg","dida":"L'une des scènes en majolique sur les dossiers des bancs du cloître des clarisses."}},{"t":"Les arcs du XIVe siècle","x":"Le jardin est baroque, mais le cadre est médiéval. L'ensemble fut voulu en 1310 par le roi Robert d'Anjou et la reine Sancie de Majorque ; les travaux furent dirigés par Gagliardo Primario puis par Lionardo di Vito, et l'église fut ouverte au culte en 1340.\n\nQuand, au XVIIIe siècle, Vaccaro refit le jardin, il conserva le périmètre du XIVe siècle : les arcs brisés sur des piliers de piperno. Observez le contraste entre la pierre austère des arcs et les couleurs joyeuses des majoliques : quatre siècles en un seul regard.\n\nSur les murs des quatre côtés courent des fresques de la première moitié du XVIIe siècle, d'un auteur inconnu, peut-être de l'école de Belisario Corenzio, avec des scènes de l'Ancien Testament. Dès l'entrée, le premier pan de mur à droite est vide : ces fresques furent détruites par le bombardement du 4 août 1943.","d":"Le long des quatre côtés du cloître","foto":{"u":"../img/fc6ac3ae6c14.jpg","alt":"Les arcs du cloître de Santa Chiara vus à contre-jour, avec l'église à l'arrière-plan","aut":"Lalupa","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_s_Chiara_chiostro_1040894.JPG","dida":"Les arcs gothiques du cloître de Santa Chiara, vus à contre-jour : à l'arrière-plan, la façade de l'église."}}],"gal":[{"u":"../img/f5b30f6df9dc.jpg","alt":"Faïences avec une scène de chasse au sanglier","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Giuseppe_e_donato_massa%2C_riggiole_%28mattonelle%29_del_chiostro_maiolicato_delle_clarisse_di_s._chiara%2C_1739-42%2C_schienali_01_caccia_al_cinghiale.jpg","dida":"De près : une chasse au sanglier peinte sur les faïences par l'atelier des Massa, entre 1739 et 1742."},{"u":"../img/f13f406e9a70.jpg","alt":"Le cloître avec ses piliers en faïence, ses bancs et son jardin","aut":"Sailko","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Santa_chiara%2C_chiostro_maiolicato_01.JPG","dida":"Le cloître en entier : les piliers en faïence, les bancs et le jardin."}],"leg":"","fc":null,"col":null},{"id":10,"s":"cappella-sansevero","n":"Chapelle Sansevero","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.849299,"lon":14.254933,"mp":12,"dv":45,"gr":false,"sa":false,"sito":"https://www.museosansevero.it/","po":"https://www.museosansevero.it/organizza-la-tua-visita/orari-e-tariffe","som":"Le Christ voilé, l'une des sculptures les plus célèbres au monde, et les machines anatomiques du prince alchimiste Raimondo di Sangro.","rac":"La chapelle de la famille di Sangro est le royaume de Raimondo, prince de Sansevero : homme de science et de secrets, Grand Maître de la franc-maçonnerie, autour duquel le mythe est né de son vivant, et il l'a lui-même entretenu.\n\nAu centre se trouve le Christ voilé de Giuseppe Sanmartino, commandé par le prince : un corps étendu recouvert d'un linceul si fin qu'il semble de l'étoffe mouillée, mais sculpté dans le même bloc de marbre que la statue. Dans la salle souterraine se trouvent les deux « machines anatomiques », squelettes d'un homme et d'une femme dont le système des vaisseaux sanguins a été reconstitué, œuvre du médecin palermitain Giuseppe Salerno vers 1756-1764. La légende noire raconte des serviteurs sacrifiés et des injections mystérieuses ; le musée lui-même sépare avec soin le mythe de l'histoire documentée.","con":"Elle est fermée le mardi : si nous sommes mardi, la statue du Nil est à deux minutes et se voit toujours.","acc":"La nef et la sacristie sont accessibles en fauteuil roulant. La salle souterraine abritant les machines anatomiques ne s'atteint que par un étroit escalier en colimaçon du XIXe siècle.","foto":{"u":"../img/65421f883be6.jpg","alt":"L'extérieur de la chapelle Sansevero","aut":"Velvet","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Naples_san_severo.jpg","dida":"La chapelle Sansevero vue de l'extérieur."},"ov":true,"ovi":"2026-11-03","or":[{"g":[1,3,4,5,6,7],"da":"09:00","a":"19:00","ui":"18:30"}],"fonti":[{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"},{"t":"Museo Cappella Sansevero – Accessibilità","u":"https://www.museosansevero.it/organizza-la-tua-visita/accessibilita"},{"t":"Museo Cappella Sansevero – Pudicizia","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/pudicizia"},{"t":"Museo Cappella Sansevero – Disinganno","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-statue/disinganno"},{"t":"Museo Cappella Sansevero – Il pavimento labirintico","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/la-cappella/pavimento-labirintico"}],"ant":true,"dett":[{"t":"Le Christ voilé","x":"Au centre de la chapelle se trouve un corps allongé sur un matelas, la tête et le buste soulevés par un coussin, recouvert d'un suaire si fin qu'on y devine le visage, les blessures et les veines. Le voile n'est pas un ajout : Giuseppe Sanmartino l'a sculpté dans le même bloc de marbre que la statue, en 1753, sur commande du prince Raimondo di Sangro.\n\nUn document signé par le prince pour payer le sculpteur l'atteste : « une statue de marbre sculptée grandeur nature, représentant Notre-Seigneur Jésus-Christ mort, recouvert d'un suaire transparent réalisé dans le même bloc que la statue ». Pendant des siècles, on a raconté que le voile était un véritable tissu transformé en marbre par un procédé alchimique du prince : ce n'est qu'une légende.\n\nCherchez les détails : la plaie du côté, la marque des clous sur la main et, aux pieds, la couronne d'épines et les clous de la Passion. Puis faites-en lentement le tour : de chaque côté, le voile semble changer.","d":"Au centre de la nef","foto":{"u":"../img/625d7cbbb2af.jpg","alt":"Le visage du Christ voilé sous le voile de marbre","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cristo_Velato_Volto.jpg","dida":"Le visage sous le voile : le suaire est sculpté dans le même bloc de marbre que la statue, et pourtant il ressemble à un tissu mouillé."}},{"t":"La Pudeur","x":"Une jeune femme enveloppée dans un voile qui épouse sa peau comme s'il était mouillé, avec une guirlande de roses dans les cheveux. Elle fut sculptée en 1752 par le Vénitien Antonio Corradini, sculpteur célèbre dans toute l'Europe qui avait travaillé aussi pour l'empereur à Vienne : il mourut la même année, alors qu'il concevait les autres décorations de la chapelle, comme le rappelle une plaque sur le pilier.\n\nLe prince Raimondo la dédia à sa mère, Cecilia Gaetani dell'Aquila d'Aragona, morte le 26 décembre 1710, alors qu'il n'avait pas encore un an. Cherchez les symboles d'une vie interrompue trop tôt : le regard perdu, l'arbre qui naît de la pierre et la pierre tombale brisée à ses pieds.\n\nSur le socle se trouve un bas-relief représentant le « Noli me tangere », le Christ ressuscité apparaissant à Marie-Madeleine. Le musée rappelle que la femme voilée peut aussi être lue comme une image de la Sagesse, et évoque la déesse Isis voilée.","d":"Près du maître-autel","foto":{"u":"../img/caa3cd3d9215.jpg","alt":"La statue de la Pudeur, une femme couverte d'un voile","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Pudicizia%2C_Cappella_Sansevero.jpg","dida":"La Pudeur d'Antonio Corradini : le voile épouse le corps comme s'il était mouillé. À ses pieds, la pierre tombale brisée."}},{"t":"Le Désabusement","x":"Un homme se libère d'un grand filet, aidé par un petit génie ailé portant une petite flamme sur le front, symbole de l'intellect humain. À ses pieds se trouve le globe terrestre, les passions du monde, surmonté d'une Bible ouverte. Il fut sculpté par le Génois Francesco Queirolo entre 1753 et 1754.\n\nLe prince le dédia à son père, Antonio : devenu veuf, celui-ci avait laissé son fils à son grand-père et voyagé à travers l'Europe en menant une vie désordonnée ; puis, âgé et repentant, il était revenu à Naples et était devenu prêtre. Le filet est le péché dont l'homme se libère.\n\nRegarde le filet de près : il est entièrement en marbre, ajouré maille par maille. On raconte que les artisans chargés de la finition refusèrent d'y toucher de peur de le briser, et que Queirolo dut le polir seul. Dès 1753, un contemporain le qualifiait de « dernière preuve audacieuse que la sculpture sur marbre puisse oser ».","d":"Près du maître-autel","foto":{"u":"../img/921cf7f91318.jpg","alt":"La statue du Désabusement, un homme qui se libère d'un filet","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Disinganno%2C_Cappella_Sansevero.jpg","dida":"Le Désabusement de Francesco Queirolo : le filet est entièrement en marbre, ajouré à la main."}},{"t":"Le sol en labyrinthe","x":"Le sol que vous foulez n'est pas le sol d'origine. Le prince en avait conçu un en forme de labyrinthe : des marbres colorés, du bleu au blanc, traversés par une ligne continue de marbre blanc sans aucune jointure, dessinant des croix à branches recourbées en alternance avec des carrés concentriques en perspective. Il fut réalisé par Francesco Celebrano à partir du milieu des années 1760 ; le prince lui-même écrivit que le travail fut « difficile et entravé ».\n\nEn 1889, un grave effondrement toucha le palais et la chapelle et endommagea le sol : au lieu de le restaurer, on le refit en terre cuite napolitaine, avec un émail jaune et bleu autour des armoiries des di Sangro.\n\nCherchez les dalles d'origine dans le passage devant le tombeau de Raimondo di Sangro ; d'autres se trouvent dans la cavea souterraine et dans la sacristie. Pour le prince, le labyrinthe était l'image du chemin difficile qui mène à la connaissance.","d":"Dans le passage devant le tombeau du prince","foto":{"u":"../img/e29e7dc7e976.jpg","alt":"La nef de la Chapelle Sansevero avec les statues et, en bas, les lignes du sol","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2,_Cappella_Sansevero.jpg","dida":"La Chapelle Sansevero : en bas, on voit les lignes colorées du sol en labyrinthe."}},{"t":"Les machines anatomiques","x":"Descendez l’étroit escalier jusqu’à la cavea souterraine : dans deux vitrines se tiennent debout les squelettes d’un homme et d’une femme, avec le système des artères et des veines presque intact, jusqu’aux vaisseaux les plus fins.\n\nIls furent réalisés par le médecin palermitain Giuseppe Salerno. Le prince acheta le squelette masculin en 1756, après l’avoir vu lors d’une démonstration publique à Naples, prit Salerno à son service et lui fit réaliser le second. Ils se trouvaient dans le palais, dans une pièce appelée « Appartement du Phénix » ; la femme était sur une estrade que l’on faisait tourner pour l’observer de tous les côtés.\n\nAutour d’eux est née la « légende noire » : on disait que le prince avait fait tuer deux serviteurs et injecté dans leurs corps une substance mystérieuse. En réalité, les vaisseaux sont une reconstitution faite de différents matériaux, dont de la cire d’abeille et des colorants ; les connaissances en anatomie qu’ils démontrent restent surprenantes pour l’époque.","d":"Dans la cavea souterraine, en descendant un étroit escalier en colimaçon","foto":{"u":"../img/a3a047434411.jpg","alt":"Un squelette avec le système des vaisseaux sanguins dans la vitrine de la cavea","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Macchine_Anatomiche_CS_2.jpg","dida":"L’une des deux machines anatomiques de Giuseppe Salerno dans la cavea souterraine : squelette et système circulatoire."}}],"gal":[{"u":"../img/13d7137edcd0.jpg","alt":"L'intérieur de la chapelle Sansevero avec ses statues","aut":"David Sivyer","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Immagine_d%27insieme_2%2C_Cappella_Sansevero.jpg","dida":"La chapelle en entier : au centre le Christ voilé, autour de lui les statues de la famille di Sangro."}],"leg":"De son vivant déjà, on racontait tout sur Raimondo di Sangro : expériences mystérieuses, secrets alchimiques, et même des serviteurs transformés en machines anatomiques. Le musée distingue avec soin la légende noire des faits documentés : cela vaut la peine d'écouter les deux versions et de choisir son camp.","fc":null,"col":null},{"id":11,"s":"san-domenico-maggiore","n":"San Domenico Maggiore","tipo":"chiesa","zona":"decumano_inferiore","ind":"Piazza San Domenico Maggiore 8A, Napoli","lat":40.848975,"lon":14.25427,"mp":12,"dv":30,"gr":null,"sa":false,"sito":"https://domasandomenicomaggiore.it/","po":"","som":"L'église où vécut et enseigna saint Thomas d'Aquin et où, selon la tradition, un Crucifix lui adressa la parole.","rac":"Le complexe dominicain donne sur la place du même nom, le long de Spaccanapoli. L'église gothique-angevine fut construite entre 1283 et 1324, puis transformée à l'époque baroque. Thomas d'Aquin vécut et enseigna dans le couvent entre 1272 et 1274 ; Giordano Bruno et Tommaso Campanella furent eux aussi liés à ce lieu.\n\nDans la sacristie, dont la voûte fut ornée de fresques par Francesco Solimena en 1709, se trouvent les cercueils des souverains aragonais. Pendant des siècles, la basilique a également abrité un chef-d'œuvre du Caravage, la Flagellation du Christ, aujourd'hui au Musée de Capodimonte.\n\nAujourd'hui, le complexe se visite aussi comme musée DOMA : sacristie, cercueils aragonais et cellule de saint Thomas.","con":"Si tu as le temps, entre aussi dans le parcours du musée : sacristie, tombeaux aragonais et cellule de saint Thomas. Les horaires changent et certaines sections peuvent être fermées pour travaux : consulte le site officiel avant de venir.","acc":"","foto":{"u":"../img/dfba11028a9c.jpg","alt":"L'obélisque de San Domenico et l'abside de l'église sur la place","aut":"Lalupa","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_piazza_San_Domenico_Maggiore_e_guglia_1030736.JPG","dida":"L'obélisque de San Domenico et, derrière, l'abside de l'église."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,3,4,5,6,7],"da":"10:00","a":"18:00","n":"Visites guidées."}],"fonti":[{"t":"Comune di Napoli – Basilica di San Domenico Maggiore","u":"https://www.comune.napoli.it/flex/cm/pages/ServeBLOB.php/L/EN/IDPagina/1399"},{"t":"italia.it – Chiesa di San Domenico Maggiore","u":"https://www.italia.it/it/campania/napoli/musei/chiesa-di-san-domenico-maggiore"},{"t":"Senzalinea – La basilica di San Domenico Maggiore","u":"https://www.senzalinea.it/giornale/la-basilica-di-san-domenico-maggiore"},{"t":"ICCD – Cappellone del Crocifisso (SIGEC)","u":"https://sigecweb.beniculturali.it/sigec/item/print/ICCD3617503"},{"t":"Finestre sull'Arte – restauro della cella di san Tommaso","u":"https://www.finestresullarte.info/en/news/naples-restoration-of-the-cell-of-st-thomas-aquinas-in-san-domenico-maggiore-ends"}],"ant":true,"dett":[{"t":"Le Crucifix qui parla à saint Thomas","x":"C'est un panneau peint, conservé dans la basilique. Selon la tradition, le Christ s'adressa à Thomas d'Aquin, qui priait après avoir écrit sur la théologie : il lui aurait dit qu'il avait bien écrit de lui et lui aurait demandé quelle récompense il désirait. Le ministère de la Culture rappelle ce panneau comme celui qui « parla » au saint et qui fut déplacé en 1437 dans une nouvelle chapelle.","d":"À l'intérieur de la basilique, dans la chapelle du Crucifix","foto":{"u":"../img/4b0972ad805f.jpg","alt":"La grande chapelle du Crucifix à San Domenico Maggiore","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Fronte_del_Cappellone_Crocifisso.jpg","dida":"La grande chapelle du Crucifix à San Domenico Maggiore, où est conservé le panneau du miracle."}},{"t":"La sacristie de Solimena et les arches aragonaises","x":"La voûte de la sacristie fut ornée de fresques par Francesco Solimena en 1709 avec le Triomphe de l'Ordre dominicain. Le long des murs, on voit les arches funéraires des souverains aragonais et d'autres dignitaires de la cour.","d":"Dans la sacristie, lors de la visite du musée DOMA","foto":{"u":"../img/07519e21f0fa.jpg","alt":"La sacristie de San Domenico Maggiore avec sa voûte ornée de fresques","aut":"BjoernEisbaer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sacrestia_di_San_Domenico_Maggiore_%28Napoli%29-2ver.jpg","dida":"La sacristie de San Domenico Maggiore, avec la voûte de Francesco Solimena et les arches funéraires aragonaises."}},{"t":"La cellule de saint Thomas","x":"C'est ici que Thomas d'Aquin vécut et étudia. La cellule a été restaurée et se visite avec le musée DOMA.","d":"Dans le parcours du musée","foto":{"u":"../img/f68192e11f82.jpg","alt":"La cellule de saint Thomas d'Aquin avec reliquaire et mobilier","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/7227219808","dida":"La cellule de saint Thomas d'Aquin dans le couvent de San Domenico Maggiore."}}],"gal":[],"leg":"On raconte que le Crucifix peint sur bois, conservé dans la basilique, aurait parlé à saint Thomas d'Aquin pendant qu'il priait : il lui aurait dit qu'il avait bien écrit de lui et lui aurait demandé quelle récompense il désirait.","fc":null,"col":null},{"id":12,"s":"statua-del-nilo","n":"Largo Corpo di Napoli et statue du Nil","tipo":"piazza","zona":"decumano_inferiore","ind":"Largo Corpo di Napoli, via San Biagio dei Librai, Napoli","lat":40.848745,"lon":14.256214,"mp":12,"dv":10,"gr":true,"sa":true,"sito":"","po":"","som":"Une statue romaine du dieu Nil, prise pendant des siècles pour une femme allaitant : le «Corpo di Napoli».","rac":"Sur la Piazzetta Nilo, le long de la Via San Biagio dei Librai, c'est-à-dire Spaccanapoli, se dresse une statue de marbre des IIe-IIIe siècles apr. J.-C. représentant le dieu du fleuve Nil : un homme barbu à demi allongé avec une corne d'abondance, entouré de putti qui symbolisent les bras du fleuve. Elle fut érigée par les marchands alexandrins qui vivaient dans ce quartier, appelé Regio Nilensis.\n\nElle fut retrouvée sans tête en 1476. Les Napolitains la prirent alors pour une figure féminine allaitant des enfants, symbole de la ville qui nourrit ses habitants : de là le nom «Corpo di Napoli», qui donne encore aujourd'hui son nom à la place. En 1657, elle fut placée sur un nouveau socle et, au cours du même siècle, une tête barbue lui fut sculptée.\n\nAujourd'hui, la statue est toujours à sa place, en souvenir des racines multiculturelles de Naples.","con":"Passez-y sans vous presser : c'est une halte de cinq minutes sur le chemin de Spaccanapoli. Cherchez les putti sur le corps du dieu : ils font comprendre pourquoi on l'a prise pour une femme.","acc":"","foto":{"u":"../img/223832909fbe.jpg","alt":"L'ancienne statue du dieu Nil, allongé","aut":"Marco Ober","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Nile_God_Statue_-_Statua_del_dio_Nilo%2C_Naples_%285302%29.jpg","dida":"La statue du dieu Nil, allongé, sur la petite place qui porte son nom."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"Wikipedia – Nile God Statue, Naples","u":"https://en.wikipedia.org/wiki/Nile_God_Statue,_Naples"},{"t":"Meer – Un po' di Egitto a Napoli","u":"https://www.meer.com/it/67502-un-po-di-egitto-a-napoli"},{"t":"DMO Napoli – Chiesa di San Nicola a Nilo","u":"https://dmo-napoli-ese.inera.it/en/attraction/church-of-san-nicola-a-nilo/"}],"ant":true,"dett":[{"t":"Le dieu Nil et les putti","x":"Le dieu du fleuve est allongé sur le côté et tient une corne d'abondance. Les putti qui l'entourent symbolisent les bras du Nil. Pour ceux qui l'ont longtemps regardée sans sa tête, elle ressemblait à une femme qui allaite.","d":"Au centre de la petite place","foto":{"u":"../img/83dce4234fd4.jpg","alt":"La statue du dieu Nil allongé avec les putti","aut":"Ferdinando Scala","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Piazza_Nilo.jpg","dida":"Le dieu Nil allongé avec la corne d'abondance et les putti."}},{"t":"Pourquoi « Corpo di Napoli »","x":"La statue fut retrouvée sans tête en 1476. On pensa donc à une figure féminine nourrissant ses enfants : la ville elle-même. Le nom est resté à la place, même après que la statue a reçu une nouvelle tête.","d":"Sur le socle et dans le nom de la place","foto":{"u":"../img/c0e842c87218.jpg","alt":"La statue du Nil sur son socle sur la place","aut":"IlSistemone","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:DioNiloNapoli.JPG","dida":"La statue sur le socle du Largo Corpo di Napoli."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":39,"s":"san-biagio-dei-librai","n":"La via San Biagio dei Librai et ses boutiques","tipo":"strada","zona":"decumano_inferiore","ind":"","lat":40.84912,"lon":14.257437,"mp":13,"dv":30,"gr":null,"sa":true,"sito":"","po":"","som":"La partie de Spaccanapoli des libraires et des artisans : boutiques, églises et l'Ospedale delle Bambole.","rac":"C'est le tronçon de Spaccanapoli qui va de la piazzetta Nilo à la via Duomo, sur le décumanus inférieur. Son nom vient des boutiques de livres qui s'y trouvaient depuis toujours : une inscription sur le Palazzo Marigliano voisin rappelle justement l'art des maîtres libraires. La dévotion à saint Blaise remonte au VIIIe siècle, lorsque des religieuses venues d'Arménie apportèrent à Naples une relique du saint. Le long de la rue se trouve aussi l'Ospedale delle Bambole, atelier artisanal transmis de génération en génération.","con":"Décembre est le mois des ateliers de crèches : préparez-vous à la foule le week-end.","acc":"","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"La via San Biagio dei Librai vue dans sa longueur : une étroite rue pavée entre de hauts immeubles, avec balcons, linge qui sèche, boutiques et passants, et au fond la colline du Vomero.","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Via_San_Biagio_dei_librai_(Spaccanapoli).JPG","dida":"La via San Biagio dei Librai, le tronçon de Spaccanapoli le plus animé de boutiques et de voix."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"}],"ant":true,"dett":[{"t":"La rue des libraires","x":"San Biagio dei Librai relie la Piazzetta Nilo et la Via Duomo et fait partie du decumanus inférieur. Son nom rappelle les nombreuses boutiques de livres qui s'y trouvent depuis toujours, ainsi que l'église San Biagio Maggiore, dédiée au saint protecteur de ceux qui ont mal à la gorge : la dévotion est arrivée au VIIIe siècle avec des religieuses venues d'Arménie, qui apportèrent une relique du saint.\n\nC'est dans cette rue que naquit le philosophe et historien Giambattista Vico.\n\nMarchez lentement : c'est l'une des rues les plus vivantes de Naples, toujours pleine de monde.","d":"Le long de la rue","foto":{"u":"../img/6bd641f30c2f.jpg","alt":"Via San Biagio dei Librai : la ruelle étroite, les boutiques et une bannière suspendue en hauteur","aut":"Panek","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Via_San_Biagio_Dei_Librai_Maradona.jpg","dida":"Via San Biagio dei Librai : la rue étroite et droite du decumanus inférieur, avec ses boutiques et ses promeneurs."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":40,"s":"santa-luciella","n":"Santa Luciella ai Librai et le crâne aux oreilles","tipo":"chiesa","zona":"decumano_inferiore","ind":"","lat":40.84948,"lon":14.257519,"mp":14,"dv":20,"gr":null,"sa":false,"sito":"https://www.respiriamoarte.it","po":"","som":"Une toute petite église des tailleurs de pierre dédiée à la sainte des yeux, et un crâne unique au monde : celui qui a des oreilles.","rac":"Fondée peu avant 1327 par Bartolomeo di Capua, juriste des rois angevins, l'église fut ensuite confiée aux pipernieri, les tailleurs de pierre : ils choisirent sainte Lucie, protectrice de la vue, car les éclats de leur métier mettaient leurs yeux en danger.\n\nAbandonnée pendant plus de trente ans, elle a été rouverte le 5 avril 2019 grâce à l'association Respiriamo Arte. Dans son hypogée, le culte des anime pezzentelle a laissé un crâne sans égal : il a des oreilles.","con":"Elle est petite et se visite en quelques minutes : parfaite comme pause entre Sansevero et la via dei Tribunali.","acc":"","foto":{"u":"../img/fff63e79f1d9.jpg","alt":"Le portail de Santa Luciella dans la ruelle","aut":"Massimo Faella","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Esterno_Chiesa_Santa_Luciella_%28cropped%29.jpg","dida":"Le portail de Santa Luciella. Levez les yeux : au-dessus se trouve la fresque avec le blason des pipernieri."},"ov":false,"ovi":null,"or":[],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"FAI – Percorsi di luce nella Chiesa di Santa Luciella ai Librai","u":"https://fondoambiente.it/news/percorsi-di-luce-nella-chiesa-di-santa-luciella-ai-librai-a-napoli"},{"t":"Visit Naples (DMO) – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"}],"ant":true,"dett":[{"t":"Les armoiries des pipernieri","x":"Avant d'entrer, levez les yeux : au-dessus du portail en piperno, on voit encore la fresque avec les armoiries de la corporation des pipernieri, les tailleurs de pierre à qui l'église appartenait.\n\nIls travaillaient au ciseau et au marteau le piperno, une pierre extrêmement dure, et craignaient que des éclats ne leur sautent aux yeux : c'est pourquoi ils choisirent sainte Lucie, protectrice de la vue. C'était une corporation puissante ; on disait même qu'ils savaient insuffler aux pierres des énergies bonnes ou mauvaises.\n\nL'église est très ancienne : elle fut fondée peu avant 1327 par Bartolomeo di Capua, conseiller des rois angevins. Sur la vue de Naples de Baratta, datée de 1629, elle est indiquée comme la chapelle des meuniers ; elle fut reconstruite au XVIIIe siècle. Elle resta fermée et à l'abandon pendant plus de trente ans, jusqu'à ce que l'association Respiriamo Arte la rouvre le 5 avril 2019.","d":"Au-dessus du portail d'entrée","foto":{"u":"../img/3e0b66b49ec6.jpg","alt":"La fresque au-dessus du portail de Santa Luciella","aut":"Baku","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Affresco_luciella.jpg","dida":"La fresque au-dessus du portail de Santa Luciella, avec les armoiries de la corporation des tailleurs de piperno."}},{"t":"Le crâne aux oreilles","x":"Sous l'église, dans l'hypogée, se trouve un crâne qui a conservé les cartilages momifiés de ses oreilles : c'est pourquoi il est considéré comme unique. Selon la tradition populaire, justement parce qu'il a des oreilles, il écoute mieux les prières de ceux qui lui demandent une grâce.\n\nL'hypogée ne se visite qu'avec la visite guidée. Grâce au projet « Percorsi di luce », soutenu par le FAI et Intesa Sanpaolo, les lumières s'allument un détail à la fois, alternant zones éclairées et zones d'ombre : laissez-vous guider.\n\nN'oubliez pas qu'il s'agit d'un lieu lié aux défunts et à la dévotion : on le regarde avec respect, à voix basse.","d":"Dans l'hypogée, lors de la visite guidée","foto":{"u":"../img/7a5a070c0866.jpg","alt":"Le crâne aux oreilles dans l'hypogée de Santa Luciella","aut":"Phyrexian","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Santa_Luciella_a_San_Biagio_dei_Librai_1727.jpg","dida":"Le crâne aux oreilles : on voit les cartilages momifiés de chaque côté du crâne."}},{"t":"Les anime pezzentelle","x":"Au XVIIe siècle, la peste tua des milliers de personnes à Naples : les morts furent enterrés dans des fosses communes et leur nom fut oublié. Ainsi naquit le culte des « anime pezzentelle », les âmes pauvres, mortes sans nom, sans funérailles et sans prières.\n\nCelui qui demandait une grâce (une guérison, une grossesse, une aide) « adoptait » l'un de ces crânes, les capuzzelle : il le nettoyait, l'installait dans une niche et priait pour lui, afin que l'âme parvienne au Paradis et, là-haut, se souvienne de celui qui l'avait aidée.\n\nLe culte était très enraciné à Santa Luciella. Vous le retrouverez au Purgatorio ad Arco, dans la via dei Tribunali, et son lieu emblématique est le cimetière des Fontanelle, dans le quartier de la Sanità.","d":"Dans l'hypogée","foto":{"u":"../img/8110a7061c73.jpg","alt":"Crânes éclairés par la lumière d'une bougie, avec une plaque « pour grâce reçue »","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Crânes dans des vitrines : une plaque porte le nom de la personne qui a reçu la grâce, une façon de remercier les âmes « pezzentelle »."}}],"gal":[],"leg":"On dit que le crâne aux oreilles, justement parce qu'il a des oreilles, entend mieux les prières : c'est pourquoi, de génération en génération, on lui a confié les demandes les plus difficiles.","fc":null,"col":null},{"id":41,"s":"ospedale-bambole","n":"Hôpital des poupées","tipo":"museo","zona":"decumano_inferiore","ind":"","lat":40.84974,"lon":14.258685,"mp":15,"dv":10,"gr":null,"sa":false,"sito":"","po":"","som":"Un atelier qui « soigne » depuis des générations poupées et jouets : une vitrine dont les enfants, et pas seulement eux, gardent à jamais le souvenir.","rac":"À la fin du XIXe siècle, Luigi Grassi travaillait comme scénographe pour les théâtres et les crèches. Les voisins se mirent à lui apporter des poupées et des jouets cassés, et son atelier devint, presque par hasard, le premier « hôpital » de jouets de Naples.\n\nAujourd'hui, il est tenu par Tiziana, arrière-petite-fille du fondateur, dans la cour du Palazzo Marigliano, Via San Biagio dei Librai. À l'intérieur, il fonctionne comme un vrai hôpital : blouses blanches, services et un dossier médical pour chaque patient. Pour beaucoup de Napolitains, c'est l'endroit où, enfants, ils ont apporté leur jouet préféré.","con":"Rien que la vitrine vaut l'arrêt : elle est sur le chemin du retour.","acc":"","foto":{"u":"../img/fb7ec54d1f19.jpg","alt":"La vitrine de l'Ospedale delle Bambole pleine de poupées","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845725868844%29.jpg","dida":"La vitrine de l'Ospedale delle Bambole : poupées et jouets en attente d'être « soignés »."},"ov":true,"ovi":"2026-11-04","or":[{"g":[1,2,4,5,6,7],"da":"10:30","a":"13:30","n":"Horaires d'octobre et de novembre : ils peuvent changer à d'autres périodes."},{"g":[1,2,4,5,6,7],"da":"14:30","a":"17:30","n":"Horaires d'octobre et de novembre : ils peuvent changer à d'autres périodes."},{"g":[3],"x":true}],"fonti":[{"t":"Portale turistico ufficiale di Napoli – Doll Hospital","u":"https://dmo-napoli-ese.inera.it/en/attraction/doll-hospital/"},{"t":"FAI – Via San Biagio dei Librai","u":"https://fondoambiente.it/luoghi/via-san-biagio-dei-librai"},{"t":"Wikipedia – Spaccanapoli","u":"https://it.wikipedia.org/wiki/Spaccanapoli"}],"ant":true,"dett":[{"t":"Un vrai hôpital, pour les jouets","x":"Ce n'est pas une boutique mais un atelier organisé comme un hôpital : les patients sont des poupées, des oursons et des peluches, chacun avec sa propre histoire.\n\nLes « médecins » travaillent en blouse blanche, répartis en services comme dans un véritable hôpital : orthopédie, ophtalmologie, couture. Chaque patient a son dossier médical et son diagnostic.\n\nC'est un endroit que les enfants adorent, mais aussi les adultes, qui y retrouvent les jouets de leur enfance.","d":"Dans l'atelier","foto":{"u":"../img/d3916758e5c0.jpg","alt":"Têtes de poupées en attente de réparation","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2845536161635%29.jpg","dida":"Têtes, bras et yeux de poupées en attente de soins : dans l'atelier, chaque pièce a son « service »."}},{"t":"Le fondateur, un scénographe","x":"Tout a commencé à la fin du XIXe siècle avec Luigi Grassi, qui construisait des décors pour les théâtres et des crèches. Les voisins se mirent à lui apporter leurs jouets cassés, et il transforma son atelier en premier « hôpital » pour poupées.\n\nDepuis, la boutique se transmet de génération en génération au sein de la même famille : aujourd'hui, c'est Tiziana, son arrière-petite-fille, qui soigne les patients.\n\nPensez au lien avec la ville : Naples est la ville des crèches, et la via San Gregorio Armeno, la rue des ateliers de santons, est à deux pas d'ici.","d":"Dans l'histoire de la boutique","foto":{"u":"../img/b8f43c4866ee.jpg","alt":"La porte de la boutique de l'Ospedale delle Bambole avec ses vitrines","aut":"Sonse","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Ospedale_delle_Bambole_%2846448918531%29.jpg","dida":"L'entrée de l'Ospedale delle Bambole sur la via San Biagio dei Librai : la boutique ouverte par la famille Grassi."}},{"t":"La cour du Palazzo Marigliano","x":"L'Hôpital des poupées (Ospedale delle Bambole) se trouve dans la cour du Palazzo Marigliano, au numéro 39 de la Via San Biagio dei Librai : l'un des palais de la Renaissance napolitaine liés aux noms des architectes Giovanni Francesco Mormando et Giovanni Francesco di Palma.\n\nEn franchissant le portail, le bruit de la rue s'éteint : c'est l'une des nombreuses cours cachées du centre historique qui valent la peine d'être découvertes. Sur le palais, une inscription rappelle aussi qu'une basilique augustale s'élevait autrefois tout près d'ici.\n\nToute la rue mérite d'être parcourue sans se presser : c'est le « decumanus inférieur » de la ville grecque, la rue des libraires, et c'est ici que naquit le philosophe Giambattista Vico.","d":"Via San Biagio dei Librai 39","foto":{"u":"../img/89c281423b4c.jpg","alt":"La cour jaune du Palazzo Marigliano avec l'arche d'entrée","aut":"Fiore S. Barbato","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/81227945@N00/6950172118","dida":"La cour du Palazzo Marigliano, avec l'arche d'entrée et les façades de couleur ocre."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":13,"s":"san-gregorio-armeno","n":"Via San Gregorio Armeno, la rue des crèches","tipo":"strada","zona":"decumano_maggiore","ind":"Via San Gregorio Armeno, Napoli","lat":40.849777,"lon":14.257981,"mp":15,"dv":30,"gr":true,"sa":true,"sito":"","po":"","som":"Une ruelle étroite où Noël dure toute l'année : ateliers d'artisans, santons en terre cuite et crèches.","rac":"La via San Gregorio Armeno relie la via dei Tribunali à la via San Biagio dei Librai, c'est-à-dire Spaccanapoli. C'est la rue des crèches : les ateliers d'artisans exposent des santons et des crèches toute l'année, même en été. Selon certaines sources, la tradition de fabriquer des figurines en terre cuite dans ce quartier remonte à l'époque romaine ; la renommée de la crèche napolitaine est devenue internationale à partir du XVIIIe siècle.\n\nParmi les ateliers historiques figurent Gambardella, en activité depuis 1800, et les Fratelli Capuano, fondé en 1840. Le long de la rue se trouve également le monastère de San Gregorio Armeno, qui donne son nom à la rue, avec l'église dédiée à sainte Patrizia, co-patronne de Naples.\n\nLa période la plus animée va de la fin novembre à l'Épiphanie, lorsque la rue est noire de monde.","con":"Venez tôt le matin et en semaine : en décembre, la foule est dense. Cherchez les santons qui racontent l'actualité : chaque année, les artisans en créent de nouveaux.","acc":"","foto":{"u":"../img/e9db2e257e2c.jpg","alt":"La rue des crèches, étroite et pleine d'ateliers","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_Via_San_Gregorio_Armeno.jpg","dida":"Via San Gregorio Armeno, la rue des crèches."},"ov":true,"ovi":"2026-11-04","or":[],"fonti":[{"t":"italia.it – San Gregorio Armeno","u":"https://www.italia.it/it/campania/napoli/san-gregorio-armeno"},{"t":"SiViaggia – La via dei presepi","u":"https://siviaggia.it/idee-di-viaggio/la-via-dei-presepi-napoli-san-gregorio-armeno/506541/"},{"t":"FAI – Via San Gregorio Armeno","u":"https://fondoambiente.it/luoghi/via-san-gregorio-armeno"},{"t":"Immobiliare.it – San Gregorio Armeno","u":"https://www.immobiliare.it/news/vivere-a/napoli/napoli-a-natale-via-san-gregorio-armeno-e-i-suoi-presepi-116621/"}],"ant":true,"dett":[{"t":"Les ateliers de crèches","x":"Les ateliers fabriquent des figurines et des crèches en terre cuite et en liège, souvent peintes à la main. À côté des personnages traditionnels, il y a des personnalités de l'actualité : chaque année, les artisans en inventent de nouveaux. Vous pouvez regarder sans acheter : de nombreux artisans travaillent à la vue de tous.","d":"Tout le long de la rue","foto":{"u":"../img/03e3b2aafd76.jpg","alt":"Un étal rempli de figurines de crèche","aut":"Raffaella from Napoli","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:La_via_dei_pastori_-_particolare_di_un_banco-_Napoli.jpg","dida":"Un étal de la rue des figurines de crèche, entre personnages traditionnels et personnalités d'aujourd'hui."}},{"t":"Le monastère de San Gregorio Armeno","x":"Le monastère donne son nom à la rue. L'église conserve un plafond à caissons de Teodoro d'Errico et des fresques de Luca Giordano, comme la Gloire de saint Grégoire. Le complexe abrite aussi l'église dédiée à sainte Patrice, co-patronne de Naples.","d":"À l'intérieur du monastère, le long de la rue","foto":{"u":"../img/30ec6bba5546.jpg","alt":"La nef de l'église San Gregorio Armeno","aut":"Giuseppe Guida","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Chiesa_di_San_Gregorio_Armeno_-_Interno_navata.jpg","dida":"L'église San Gregorio Armeno, avec son plafond à caissons et ses fresques."}},{"t":"Quand y aller","x":"Les boutiques sont ouvertes toute l'année. La période la plus animée va de fin novembre à l'Épiphanie, lorsque la rue est pleine de monde : mieux vaut y aller en semaine et tôt le matin.","d":"Tout au long de la rue","foto":{"u":"../img/2aae9d17a8cd.jpg","alt":"La Via San Gregorio Armeno bondée","aut":"Viditu","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/40553543@N00/6294477154","dida":"Via San Gregorio Armeno : mieux vaut y aller en semaine et tôt le matin."}}],"gal":[],"leg":"","fc":null,"col":null},{"id":14,"s":"san-lorenzo-maggiore","n":"San Lorenzo Maggiore et les fouilles de Neapolis","tipo":"sotterraneo","zona":"decumano_maggiore","ind":"Piazza San Gaetano 316, Napoli","lat":40.85092,"lon":14.25804,"mp":17,"dv":45,"gr":null,"sa":false,"sito":"https://www.laneapolissotterrata.it/","po":"https://www.laneapolissotterrata.it/Home/InfoVisite","som":"Une église gothique du XIIIe siècle qui cache, dix mètres sous la nef, le marché de l'antique Neapolis : rues, boutiques et pièces d'il y a deux mille ans.","rac":"La piazza San Gaetano est le cœur de l'antique Neapolis. Au XIIIe siècle, sur les vestiges du marché gréco-romain, s'éleva la basilique gothique de San Lorenzo Maggiore, l'une des plus anciennes églises de la ville. L'ensemble comprend aussi le couvent, le Museo dell'Opera et les fouilles.\n\nLes fouilles, commencées en 1976, ont mis au jour le macellum, le marché, qui se dressait le long de l'ancien decumanus maximus. On descend à environ dix mètres sous l'église et l'on marche parmi des rues, des boutiques et des pièces d'époque impériale. Sous l'église sont également apparus les vestiges d'une basilique chrétienne du VIe siècle.\n\nLe Museo dell'Opera, installé dans les salles du couvent et dans la tour civique, raconte l'histoire de Naples de l'époque classique au XIXe siècle.","con":"Descendez dans les fouilles : c'est la partie à laquelle on ne s'attend pas. Comptez environ trois quarts d'heure et vérifiez les horaires sur le site officiel avant de venir.","acc":"","foto":{"u":"../img/c44587f32365.jpg","alt":"La façade de San Lorenzo Maggiore sur la piazza San Gaetano","aut":"Berthold Werner","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_San_Lorenzo_Maggiore_
