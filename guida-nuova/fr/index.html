5,"a":1038},{"k":"gira","m":"right","n":"","d":29,"a":1213},{"k":"gira","m":"slight right","n":"","d":480,"a":1242},{"k":"gira","m":"straight","n":"Via Toledo","d":354,"a":1722},{"k":"arrivo","a":2076}]}],"fonti":[],"ant":true,"pr":{"x":"Avant de partir, prenez votre petit-déjeuner chez nous : un café et une Sfogliatella.","v":[{"v":177,"n":"Espresso (Kimbo, mélange Extreme)","p":250,"foto":{"u":"../img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}},{"v":110,"n":"Sfogliatella Riccia","p":300,"foto":{"u":"../img/bd4714cc3e5b.webp","alt":"Sfogliatella Riccia"}}],"l":[]},"fi":{"x":"","v":[{"v":83,"n":"Caffè Ceraldi","p":500,"foto":{"u":"../img/7bef03b87815.webp","alt":"Caffè Ceraldi"}},{"v":356,"n":"Aspritz","p":800,"foto":{"u":"../img/a3e1bd8ea3d9.webp","alt":"Aspritz"}}],"l":[]}}],"racconti":[{"id":6,"s":"storia-di-napoli","t":"L'histoire de Naples","sub":"De la sirène Partenope à nos jours, en treize chapitres","som":"Avant de partir, vingt-huit siècles en dix minutes : la légende de la sirène, les Grecs, Rome, les rois, la révolte, la guerre et la ville d'aujourd'hui.","txt":"Naples est l'une des plus anciennes villes d'Europe : son histoire s'étend sur environ trois mille ans, et le centre historique que vous allez traverser conserve encore le plan des rues dessiné par les Grecs. Pendant plus d'un demi-millénaire, elle a été la capitale de l'Italie du Sud.\n\nCes treize chapitres vous accompagnent de la légende à la ville d'aujourd'hui. Chaque fois que le récit rencontre un lieu du guide, vous trouvez un bouton pour vous y rendre.","foto":{"u":"../img/5fa7bf9a4065.jpg","alt":"Le Castel dell'Ovo dans une vue de 1841","aut":"Autore sconosciuto","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Napoli%2C_Castel_dell%27Ovo%2C_1841.jpg","dida":"Le Castel dell'Ovo dans une vue de 1841 : l'îlot où naquit Partenope."},"cap":[{"p":"La légende","t":"La sirène Partenope","x":"Tout commence avec une sirène. Dans le mythe grec, les sirènes étaient des créatures au corps d'oiseau et à la tête de femme, maîtresses d'un chant magique. L'une d'elles s'appelait Partenope.\n\nLe récit le plus célèbre raconte que, lorsque Ulysse passa devant leur rocher sans céder à leur chant, les sirènes, de douleur, se jetèrent à la mer. Les vagues portèrent le corps de Partenope jusqu'à la côte, à l'embouchure d'un petit fleuve, le Sebeto : précisément là où allait naître la ville.\n\nOn lui y construisit un tombeau, et les Grecs de Naples lui consacraient chaque année des sacrifices et une course aux flambeaux. Aujourd'hui encore, les Napolitains se disent «partenopei».","l":null,"foto":{"u":"../img/2785ce7243de.jpg","alt":"La fontaine avec la sirène Partenope sur la place Sannazaro","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Sirena_Napoli2.JPG","dida":"La fontaine de la Sirène sur la place Sannazaro : Partenope avec sa lyre."}},{"p":"VIIIe–VIIe siècle av. J.-C.","t":"Partenope, la première cité","x":"La légende contient une part de vérité. Entre le VIIIe et le VIIe siècle av. J.-C., les Grecs de Cumes, la plus ancienne colonie grecque de la région, fondèrent un petit comptoir maritime et lui donnèrent le nom de la sirène : Partenope.\n\nIl s'élevait sur la colline de Pizzofalcone, le Monte Echia, sur un éperon entouré par la mer, et son mouillage se trouvait sur l'îlot de Megaride, où se dresse aujourd'hui le Castel dell'Ovo. Le port se trouvait dans l'actuelle place Municipio. La nécropole de Partenope a été découverte en 1949, via Nicotera.\n\nLa petite cité grandit si vite que Cumes, craignant de perdre le pouvoir, réduisit son rôle.","l":32,"foto":{"u":"../img/f214daace22c.jpg","alt":"Le Castel dell'Ovo sur la mer, sous un ciel bleu","aut":"Luca Aless","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Castel_dell%27Ovo_1.JPG","dida":"Le Castel dell'Ovo sur l'îlot de Megaride, relié au front de mer par un pont."}},{"p":"Ve siècle av. J.-C.","t":"Neapolis, la ville nouvelle","x":"À côté de Partenope, un peu plus à l'est, les Cumains fondèrent une ville nouvelle : Neapolis, la « ville nouvelle ». L'UNESCO date la fondation d'environ 470 av. J.-C., à l'époque où les Grecs avaient vaincu les Étrusques sur mer.\n\nNeapolis fut construite selon un plan régulier : trois grandes rues parallèles (les « plateiai », appelées ensuite decumani), croisées à angle droit par des rues plus petites. L'agora, la place principale, se trouvait là où est aujourd'hui la place San Gaetano.\n\nCe quadrillage est toujours là : Spaccanapoli, la via dei Tribunali et la via Anticaglia sont les trois rues grecques. En les parcourant, vous marchez dans le plan de la ville d'il y a 2 500 ans.","l":38,"foto":{"u":"../img/8bcba9e208ec.jpg","alt":"Les grands blocs de tuf des murailles grecques, mis au jour sous le niveau de la rue","aut":"Sailko","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_piazza_bellini,_mura_greche.JPG","dida":"Les blocs de tuf des murailles grecques de Neapolis, place Bellini, visibles dans une fouille sous le niveau de la rue."}},{"p":"326 av. J.-C. – Ve siècle apr. J.-C.","t":"Grecque sous Rome","x":"En 326 av. J.-C., Neapolis s'allia à Rome et resta pendant des siècles une cité grecque au sein du monde romain : elle fut l'une des rares à conserver la langue et la culture grecques. Elle devint un lieu apprécié des Romains cultivés et fortunés, qui construisaient des villas sur le golfe : sur l'îlot de Megaride s'éleva celle de Lucius Licinius Lucullus.\n\nEn 79 apr. J.-C., l'éruption du Vésuve détruisit Pompéi et Herculanum, non loin de là. En 476, dans la villa de Lucullus elle-même, fortifiée, fut enfermé Romulus Augustule, le dernier empereur romain d'Occident : avec lui, l'Empire prenait fin.\n\nSous la ville gréco-romaine coulait déjà l'eau des citernes que vous visitez aujourd'hui à Napoli Sotterranea, et c'est dans le théâtre de Neapolis que se produisit l'empereur Néron.","l":15,"foto":{"u":"../img/d7fd5e60f616.jpg","alt":"Une grande citerne souterraine creusée dans le tuf, faiblement éclairée","aut":"Lalupa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_sotterranea_s_Gaetano_cisterna_1030795.JPG","dida":"L'une des grandes citernes creusées dans le tuf, à environ 40 mètres sous la via dei Tribunali."}},{"p":"VIe–XIIe siècle","t":"Le duché de Naples","x":"Après la fin de l'Empire, au VIe siècle, Naples passa aux Byzantins, les Romains d'Orient. Peu à peu, elle devint un duché quasi indépendant : au VIIIe siècle, le duc Étienne II en devint de fait le seigneur.\n\nPendant cinq siècles, le duché résista aux Lombards et aux Sarrasins. En 1030, le duc Serge IV donna le comté d'Aversa à un groupe de mercenaires normands : ce fut le début de leur ascension dans le Sud. En 1137, Naples se soumit aux Normands et entra dans le nouveau royaume de Sicile.\n\nDe ces temps lointains subsistent les églises les plus anciennes, comme Santa Restituta et le baptistère de San Giovanni in Fonte, à l'intérieur de la cathédrale, considéré comme le plus ancien d'Occident.","l":18,"foto":{"u":"../img/5abf53aec271.jpg","alt":"L'intérieur de la basilique Santa Restituta","aut":"Baku","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_Restituta.JPG","dida":"Santa Restituta, la basilique paléochrétienne intégrée à la cathédrale : la Naples d'avant le duché."}},{"p":"1194–1266","t":"Normands et Souabes : naissance de l'Université","x":"Après les Normands vinrent les Souabes. En 1194, l'empereur Henri VI occupa la ville et en fit abattre les murailles.\n\nSon fils, Frédéric II, était un souverain passionné de culture et de droit. En 1224, il fonda à Naples le «Studio», l'une des premières universités d'État d'Europe : c'est l'actuelle Université Federico II, qui porte encore son nom.","l":null,"foto":{"u":"../img/ee9a50cab016.jpg","alt":"La statue de Frédéric II de Souabe sur la façade du Palais Royal","aut":"Raffaele Esposito","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Palazzo_Reale_di_Napoli_-_Federico_II.jpg","dida":"La statue de Frédéric II de Souabe, parmi celles de la façade du Palais Royal."}},{"p":"1266–1442","t":"Les Angevins : Naples capitale","x":"En 1266, le pape confia le royaume à Charles Ier d'Anjou, frère du roi de France, qui entra dans la ville en triomphe. Après la révolte des Vêpres siciliennes de 1282, la Sicile se détacha et Naples devint la capitale du royaume : elle le restera pendant des siècles.\n\nLes Angevins construisirent le Castel Nuovo, la cathédrale (à partir de 1294) et la citadelle de Santa Chiara (à partir de 1310), et la ville s'agrandit. À la cour de Robert d'Anjou, au Castel Nuovo, séjournèrent Giotto, Pétrarque et Boccace.","l":9,"foto":{"u":"../img/e3fbd992c691.jpg","alt":"L'entrée du cloître de Santa Chiara","aut":"Armando Mancini","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Napoli_-_Ingresso_Chiostro_di_Santa_Chiara.jpg","dida":"L'entrée du cloître de Santa Chiara, orné de majoliques."}},{"p":"1442–1503","t":"Les Aragonais","x":"En 1442, Alphonse d'Aragon conquit Naples : selon la tradition, ses hommes entrèrent dans la ville en passant par un aqueduc. Il fit du Castel Nuovo sa résidence royale, le reconstruisit et, pour célébrer sa victoire, y ajouta le grand Arc de Triomphe entre deux tours.\n\nLes Aragonais transformèrent le château médiéval en forteresse moderne et rénovèrent les défenses et les rues de la ville. Son fils Ferrante vainquit les barons rebelles : la porte de bronze du château raconte cette guerre, et c'est dans la Salle des Barons que sa vengeance s'accomplit.","l":30,"foto":{"u":"../img/6bf836cf8a62.jpg","alt":"La Tavola Strozzi : Naples aragonaise vue de la mer, avec le Maschio Angioino et le Castel Sant'Elmo","aut":"Attribuito a Francesco Rosselli (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Tavola_Strozzi_-_Napoli.jpg","dida":"La Tavola Strozzi (XVe siècle) : Naples vue de la mer, avec le port, le Castel Nuovo et, en haut, la colline de Sant'Elmo."}},{"p":"1503–1707","t":"La vice-royauté espagnole","x":"À partir de 1503, Naples passa à l'Espagne et fut gouvernée par un vice-roi. Sans roi présent, elle n'en était pas moins une capitale impériale, avec l'une des cours les plus grandioses des domaines espagnols. Le vice-roi don Pedro de Tolède doubla la taille de la ville, ouvrit la via Toledo et construisit les quartiers destinés aux soldats, les Quartieri Spagnoli. Le Palais Royal fut lui aussi construit à cette époque.\n\nEn 1606, Caravage arriva à Naples, en fuite de Rome : sa peinture changea l'art de la ville, qui devint au XVIIe siècle l'une des capitales du baroque européen.\n\nCe furent aussi des années très dures : des impôts très élevés, l'éruption du Vésuve en 1631 et, en 1656, une peste qui tua plus de la moitié des habitants.","l":45,"foto":{"u":"../img/09f19c7ada9a.jpg","alt":"Largo Mercatello pendant la peste de 1656 : des corps entassés sur la place et des figures célestes dans le ciel","aut":"Domenico Gargiulo, detto Micco Spadaro (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Piazza_Mercatello_durante_la_peste_del_1656_-_Spadaro.jpg","dida":"Largo Mercatello pendant la peste de 1656, peint par Micco Spadaro : la place est pleine de morts et de mourants."}},{"p":"1647","t":"Masaniello","x":"Le 7 juillet 1647, après un énième impôt, cette fois sur les fruits, la nourriture des plus pauvres, un pêcheur de 27 ans, Masaniello, mena le peuple à la révolte en criant «Vive le roi d'Espagne, à bas le mauvais gouvernement».\n\nEn dix jours, les Espagnols durent accepter les revendications du peuple. Mais Masaniello, accusé de folie et trahi par une partie des insurgés eux-mêmes, fut assassiné. La révolte contre l'Espagne se poursuivit pendant des mois, avant d'être matée en 1648.","l":null,"foto":{"u":"../img/dd3b68152a7d.jpg","alt":"Un tableau du XVIIe siècle représentant la foule en révolte sur la place du Marché","aut":"Domenico Gargiulo (Micco Spadaro)","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Domenico_Gargiulo_-_Piazza_del_Mercato_during_the_Revolt_of_Masaniello.jpg","dida":"La place du Marché pendant la révolte de Masaniello, tableau de Domenico Gargiulo, dit Micco Spadaro."}},{"p":"1734–1799","t":"Les Bourbons et la République","x":"En 1734, Charles de Bourbon rendit à Naples un roi bien à elle et voulut en faire une grande capitale européenne. En 1737, il fit construire en seulement sept mois le Teatro di San Carlo, puis les palais royaux de Portici et de Capodimonte. À cette époque commencèrent aussi les fouilles d'Herculanum et de Pompéi.\n\nNaples était l'une des capitales des Lumières. En janvier 1799, avec l'arrivée de l'armée française, les patriotes proclamèrent la République napolitaine : elle ne dura que jusqu'en juin. Au retour des Bourbons, nombre de ses protagonistes furent exécutés.\n\nAprès les années françaises (Joseph Bonaparte et Joachim Murat), les Bourbons revinrent en 1815, et en 1816 naquit le Royaume des Deux-Siciles.","l":null,"foto":{"u":"../img/7650d4034f8f.jpg","alt":"Portrait de Charles de Bourbon en armure","aut":"Laci3","lic":"CC0 1.0","src":"https://commons.wikimedia.org/wiki/File:Anton_Raphael_Mengs_-_Carlos_III.jpg","dida":"Charles de Bourbon portraituré par Anton Raphael Mengs."}},{"p":"1860–1945","t":"L'Italie unifiée et la guerre","x":"Le 7 septembre 1860, Giuseppe Garibaldi entra à Naples acclamé par la foule ; un plébiscite scella l'union avec le Royaume d'Italie. Naples cessa d'être une capitale, et la perte fut lourde.\n\nPendant la Seconde Guerre mondiale, la ville subit plus de 120 bombardements aériens, surtout à cause de son port ; les habitants se réfugiaient dans les citernes souterraines. Après l'armistice, les Allemands occupèrent la ville. À la fin de septembre 1943, les Napolitains se soulevèrent : lors des « Quatre journées de Naples », le peuple contraignit la garnison allemande à se rendre. Le 1er octobre, les Alliés arrivèrent.","l":15,"foto":{"u":"../img/5ded47a7684b.jpg","alt":"Une gravure d'époque : Garibaldi acclamé par la foule à Naples","aut":"Stampa d'epoca; riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Garibaldi_entra_a_Napoli.JPG","dida":"Gravure d'époque de l'entrée de Garibaldi à Naples, en 1860 : la foule l'acclame sur la via Toledo."}},{"p":"De 1945 à aujourd'hui","t":"La Naples d'aujourd'hui","x":"Après la guerre, la ville s'est reconstruite dans de grandes difficultés. En 1995, l'UNESCO a inscrit le centre historique au patrimoine mondial : c'est le plus grand d'Italie et l'un des plus vastes d'Europe.\n\nDepuis 2001, le métro a ouvert ses « stations de l'art », avec des œuvres d'artistes contemporains. La ville compte environ 950 000 habitants, plus de trois millions avec l'aire métropolitaine.\n\nEt puis il y a la Naples que vous verrez en vous promenant : les fresques murales, comme celle de Maradona dans les Quartiers espagnols, et la Madone de Banksy, la vie des ruelles, le café. Trois mille ans d'histoire, les uns sur les autres, en quelques kilomètres.","l":44,"foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Le centre historique de Naples vu d'en haut","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Le centre historique vu d'en haut : patrimoine mondial de l'UNESCO depuis 1995."}}],"ap":true,"col":null,"fonti":[{"t":"UNESCO – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"},{"t":"Treccani – Napoli","u":"https://www.treccani.it/enciclopedia/napoli/"}],"ant":true},{"id":7,"s":"caravaggio-a-napoli","t":"Le Caravage à Naples","sub":"Un peintre en fuite et trois chefs-d'œuvre à voir","som":"Fuyant Rome, le Caravage trouva refuge à Naples à deux reprises. Il y peignit les Sept Œuvres de miséricorde, la Flagellation et son dernier tableau.","txt":"Michelangelo Merisi, dit le Caravage, était à Rome un peintre célèbre et controversé. Dans les derniers jours de mai 1606, il blessa mortellement Ranuccio Tomassoni lors d'une rixe née pendant une partie de jeu de paume ; condamné, il dut s'enfuir.\n\nNaples, alors l'une des plus grandes villes d'Europe, fut son refuge à deux reprises : de l'automne 1606 à l'été 1607, puis de l'automne 1609 à l'été 1610. Il y trouva la protection de la famille Colonna et des commanditaires fortunés, et c'est ici que sa peinture changea à jamais l'art de la ville.\n\nTrois de ses œuvres sont visibles aujourd'hui à Naples, dont deux sur notre parcours.","foto":{"u":"../img/da8045021e55.jpg","alt":"Les Sept Œuvres de miséricorde du Caravage","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Les Sept Œuvres de miséricorde, peintes par le Caravage à Naples."},"cap":[{"p":"1606–1607","t":"Le premier séjour et les Sept Œuvres","x":"La première commande napolitaine documentée date d'octobre 1606. Quelques mois plus tard, avant le 9 janvier 1607, le Caravage livra au Pio Monte della Misericordia la grande toile des Sept Œuvres de miséricorde, payée 400 ducats.\n\nElle s'y trouve encore, sur l'autel pour lequel elle fut peinte, via dei Tribunali : une nuit dans une ruelle de Naples, où les hommes s'entraident sous le regard de la Vierge.","l":17,"foto":{"u":"../img/da8045021e55.jpg","alt":"Les Sept Œuvres de miséricorde du Caravage : scènes de rue par une nuit sombre","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_The_Seven_Works_of_Mercy_-_Pio_Monte_della_Misericordia,_Naples.jpg","dida":"Les Sept Œuvres de miséricorde du Caravage (1607) : la scène entière, avec les personnages en bas et la Vierge à l'Enfant en haut."}},{"p":"1607","t":"La Flagellation","x":"Pour la famille de Franchis, juristes et magistrats, le Caravage peignit en 1607 la Flagellation du Christ, destinée à leur chapelle dans l'église de San Domenico Maggiore : une toile de presque trois mètres de haut, l'un des chefs-d'œuvre du baroque napolitain.\n\nAujourd'hui, l'original se trouve au Musée de Capodimonte, où il a été transféré pour des raisons de sécurité ; une copie est restée à San Domenico Maggiore. Capodimonte est en dehors de nos parcours à pied.","l":null,"foto":{"u":"../img/286a53bb4961.jpg","alt":"La Flagellation du Christ du Caravage : Jésus attaché à la colonne entre les bourreaux","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Flagellation_of_Christ-Caravaggio_(1607).jpg","dida":"La Flagellation du Christ (1607), aujourd'hui au Musée de Capodimonte : la lumière tombe sur le corps de Jésus, attaché à la colonne."}},{"p":"1607–1609","t":"Malte et la Sicile","x":"Les 12-13 juillet 1607, le Caravage arriva à Malte, probablement sur une galère des Chevaliers partie de Naples. Mais là aussi, il s'attira des ennuis : après une rixe, il fut arrêté en août 1608, s'évada du fort où il était enfermé et se réfugia en Sicile, à Syracuse.","l":null,"foto":{"u":"../img/ce578eb1c957.jpg","alt":"La Décollation de saint Jean-Baptiste du Caravage","aut":"Andrew Milligan sumo","lic":"CC BY 2.0","src":"https://www.flickr.com/photos/24470821@N04/48256421071","dida":"La Décollation de saint Jean-Baptiste, peinte par le Caravage à Malte et conservée à La Valette."}},{"p":"Octobre 1609","t":"Le guet-apens du Cerriglio","x":"À l'automne 1609, il revint à Naples, toujours sous la protection des Colonna, dans l'espoir d'obtenir le pardon du pape pour pouvoir rentrer à Rome.\n\nEn octobre, il fut agressé par quatre hommes devant l'Osteria del Cerriglio, une auberge célèbre à l'époque, et balafré au visage : la blessure fut si grave que le bruit de sa mort se répandit à Rome.","l":null,"foto":{"u":"../img/6aebce1517e8.jpg","alt":"Portrait du Caravage à la craie","aut":"Ottavio Leoni","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:Ritratto_di_Caravaggio_%28Ottavio_Leoni%29.jpg","dida":"Le Caravage dans le portrait d'Ottavio Leoni, le visage de l'homme agressé au Cerriglio."}},{"p":"1610","t":"Le dernier tableau","x":"Au printemps 1610, il peignit pour le prince génois Marcantonio Doria le Martyre de sainte Ursule : la toile fut achevée en mai, livrée encore fraîche de vernis et expédiée à Gênes. C'est le dernier tableau du Caravage que nous connaissions, et on peut le voir aujourd'hui aux Gallerie d'Italia, via Toledo, à six minutes de Ceraldi. Parmi les visages, derrière la sainte, se trouve le sien.\n\nEn été, il partit en barque vers Rome avec quelques tableaux, dans l'espoir d'être gracié. Il fut arrêté par erreur à Palo, et la barque repartit avec les tableaux. Il mourut à Porto Ercole le 18 juillet 1610 (ou peut-être le lendemain), à 38 ans.","l":45,"foto":{"u":"../img/62ba7427c200.jpg","alt":"Le Martyre de sainte Ursule du Caravage : la sainte et le roi au moment de la flèche","aut":"Caravaggio (dipinto); riproduzione di dominio pubblico","lic":"Pubblico dominio","src":"https://commons.wikimedia.org/wiki/File:The_Martyrdom_of_Saint_Ursula-Caravaggio_(1610).jpg","dida":"Le Martyre de sainte Ursule (1610) : le roi frappe la sainte d'une flèche, à bout portant."}}],"ap":false,"col":null,"fonti":[{"t":"Britannica – Caravaggio: Naples, Malta, Sicily, Naples, Porto Ercole","u":"https://www.britannica.com/biography/Caravaggio/Naples-Malta-Sicily-Naples-Porto-Ercole-1606-10"},{"t":"Treccani, Dizionario Biografico – Merisi, Michelangelo","u":"https://www.treccani.it/enciclopedia/michelangelo-merisi_(Dizionario-Biografico)/"},{"t":"The Met – Caravaggio's Final Days","u":"https://www.metmuseum.org/perspectives/caravaggio-final-days"},{"t":"Wikipedia – Storia di Napoli","u":"https://it.wikipedia.org/wiki/Storia_di_Napoli"}],"ant":true},{"id":1,"s":"napoli-in-breve","t":"Naples en cinq minutes : de la sirène à la ville nouvelle","sub":"","som":"D'abord Partenope, puis Neapolis : pourquoi le centre historique est encore dessiné comme une ville grecque.","txt":"Naples est née deux fois. La première fois, elle s'appelle Partenope, comme la sirène du mythe : elle est fondée au VIIe siècle avant J.-C. par des colons d'origine grecque venus de Cumes, qui abordent sur l'îlot de Megaride, où se dresse aujourd'hui le Castel dell'Ovo, et s'installent sur le Monte Echia voisin.\n\nLa seconde fois, vers 470 avant J.-C., une ville nouvelle surgit à côté de l'ancienne : Neapolis, « ville nouvelle » en grec. C'est celle que vous êtes en train de traverser. Ses rues forment une grille régulière qui, après vingt-cinq siècles, se lit encore : le centre historique de Naples est inscrit au patrimoine mondial de l'UNESCO précisément parce que le plan de la ville grecque est resté son ossature.\n\nTrois rues parallèles, les decumani, coupent la ville d'ouest en est. La plus basse est Spaccanapoli : longue d'environ deux kilomètres, si droite que, vue d'en haut, elle semble diviser la ville en deux, d'où son nom. Au centre court la via dei Tribunali, le decumanus majeur ; plus haut, la via dell'Anticaglia et la via della Sapienza, le decumanus supérieur.\n\nDepuis Piazza Carità, où nous sommes installés depuis 2002, Spaccanapoli commence à quelques minutes à pied, sur la piazza del Gesù Nuovo.","foto":{"u":"../img/c9bd165a6d1a.jpg","alt":"Le centre historique de Naples vu d'en haut","aut":"Lalupa","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Spaccanapoli_da_s_Elmo_1050131.JPG","dida":"Le centre historique vu d'en haut : les rues droites sont encore celles de la ville grecque."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Wikipedia – Spaccanapoli","u":"https://en.wikipedia.org/wiki/Spaccanapoli_(street)"},{"t":"UNESCO World Heritage Centre – Historic Centre of Naples","u":"https://whc.unesco.org/en/list/726/"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"}],"ant":true},{"id":2,"s":"san-gennaro","t":"San Gennaro et le sang qui se liquéfie","sub":"","som":"Trois fois par an, Naples retient son souffle devant une ampoule. Ce qui se passe, où, et ce qu'en disent l'Église et la science.","txt":"Dans la cathédrale de Naples, dans une niche de la Chapelle du Trésor, est conservée une ampoule contenant une substance sombre que la tradition désigne comme le sang de San Gennaro, saint patron de la ville. Trois fois par an, le samedi qui précède le premier dimanche de mai, le 19 septembre (jour de la fête) et le 16 décembre, l'ampoule est présentée aux fidèles : si le contenu, habituellement solide, se liquéfie, c'est la fête ; s'il reste solide, pour beaucoup de Napolitains c'est un mauvais présage.\n\nLa première mention connue de la liquéfaction remonte à 1389. Les reliques ne sont pas gardées par le clergé mais par la Députation de la Chapelle du Trésor de San Gennaro, une institution laïque née en 1601, dont fait également partie le maire de Naples.\n\nL'Église adopte une attitude prudente : elle parle de « fait prodigieux », en admet la dévotion populaire mais ne l'impose pas comme une vérité de foi. Parmi les explications avancées par les sceptiques figure la thixotropie, la propriété de certaines substances qui sont solides au repos et deviennent liquides lorsqu'on les remue ou les secoue.\n\nLe sacré et le profane cohabitent ici depuis toujours : via Duomo, à quelques pas de la cathédrale, le street artist Jorit a peint un San Gennaro avec le visage d'un ouvrier.","foto":{"u":"../img/c4f6928b41c8.jpg","alt":"La coupole de la Chapelle du Trésor de San Gennaro","aut":"José Luiz","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Paradiso%2C_by_Giovanni_Lanfranco_-_Cappella_di_San_Gennaro_-_Duomo_-_Naples_-_Italy_2015.JPG","dida":"La Chapelle du Trésor de San Gennaro dans le Duomo, où est conservée l'ampoule."},"cap":[],"ap":false,"col":{"x":"","v":[],"l":[{"u":"https://www.ceraldicaffe.it/storie/tradizioni-napoletane/","t":"Naples en sept traditions : du panaro au miracle de San Gennaro","x":"","it":true}]},"fonti":[{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Il Post – San Gennaro, il sangue e il miracolo","u":"https://www.ilpost.it/2018/09/19/san-gennaro-sangue-miracolo/"}],"ant":true},{"id":3,"s":"anime-pezzentelle","t":"Les anime pezzentelle : quand Naples adoptait un crâne","sub":"","som":"Ossuaires, capuzzelle et prières échangées contre des numéros de loterie : le culte des morts sans nom.","txt":"Pendant des siècles, à Naples, les morts sans nom ne sont pas restés seuls. On les appelait anime pezzentelle : les âmes pauvres, mortes sans funérailles et sans personne pour prier pour elles. Le nom est lié à « pezzente », le pauvre, mais aussi au latin « petere », demander pour recevoir : celui qui priait pour elles espérait recevoir en échange protection et faveurs.\n\nLe lieu emblématique est le cimetière des Fontanelle, dans le Rione Sanità : une carrière de tuf du XVIe siècle, d'environ quatre mille mètres carrés, qui accueillit les victimes de la peste de 1656, puis celles du choléra de 1836-1837. En 1872, le chanoine Gaetano Barbati disposa les ossements en trois nefs. Les dévots « adoptaient » un crâne, une capuzzella : ils le nettoyaient, le mettaient dans une petite vitrine, l'ornaient de chapelets et de pièces de monnaie et le priaient, en attendant un signe en rêve, parfois un numéro à jouer à la loterie. Certains crânes sont devenus célèbres : le Capitaine, avec une orbite noircie, protagoniste d'une légende de noces et de jalousie ; donna Concetta, dont on dit qu'elle « transpire » lorsque la faveur est accordée.\n\nEn 1969, un décret du tribunal ecclésiastique ferma l'ossuaire et interdit le culte. Fermé pour travaux depuis 2020, le cimetière a rouvert au public en 2026, géré par la coopérative La Paranza.\n\nLe culte survit aussi sous la via dei Tribunali, dans l'hypogée de Santa Maria delle Anime del Purgatorio ad Arco, l'église que les Napolitains appellent « 'e cape 'e morte » : on y conserve le crâne de Lucia, une jeune âme particulièrement aimée. Et via San Biagio dei Librai, dans la petite église de Santa Luciella, se trouve un crâne unique : celui qui a des oreilles.","foto":{"u":"../img/8110a7061c73.jpg","alt":"Crânes des anime pezzentelle","aut":"claudiaromano82","lic":"CC BY-SA 2.0","src":"https://www.flickr.com/photos/8660712@N02/39057953084","dida":"Les capuzzelle des anime pezzentelle."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Santa Maria delle Anime del Purgatorio ad Arco – sito ufficiale","u":"https://purgatorioadarco.it/en"},{"t":"Geopop – Il Cimitero delle Fontanelle","u":"https://www.geopop.it/il-cimitero-delle-fontanelle-di-napoli-il-culto-delle-anime-pezzentelle-e-la-storia-dellossario/"},{"t":"Portale turistico ufficiale di Napoli – Anime pezzentelle","u":"https://dmo-napoli.inera.it/en/article/anime-pezzentelle-naples-purgatory/"},{"t":"Portale turistico ufficiale di Napoli – Fontanelle","u":"https://dmo-napoli.inera.it/en/attraction/fontanelle-cemetery/"},{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"}],"ant":true},{"id":4,"s":"napoli-esoterica","t":"Naples ésotérique : un prince alchimiste, une façade en code et un œuf magique","sub":"","som":"Raimondo di Sangro, le bossage du Gesù Nuovo, l'œuf de Virgile, le munaciello : où l'histoire s'arrête et où la légende commence.","txt":"Naples aime les mystères, et elle en possède de magnifiques. Le plus célèbre porte un nom : Raimondo di Sangro, prince de Sansevero, homme du XVIIIe siècle, Grand Maître de la franc-maçonnerie napolitaine, inventeur jaloux de ses propres secrets. Le mythe l'accompagnait déjà de son vivant, et c'est lui-même qui l'a entretenu. Benedetto Croce le définit comme l'incarnation napolitaine du docteur Faust. La légende noire lui attribue toutes sortes de méfaits : des serviteurs tués pour en étudier les corps, jusqu'à l'aveuglement du sculpteur du Christ voilé afin qu'il n'en sculpte pas un autre. Ce sont des légendes, et le musée lui-même les distingue de l'histoire documentée.\n\nLe Christ voilé est l'œuvre de Giuseppe Sanmartino, commandée par le prince : le voile transparent qui recouvre le corps est sculpté dans le même bloc de marbre que la statue. Dans la salle souterraine de la chapelle se trouvent les « machines anatomiques », deux squelettes dont le système circulatoire a été reconstitué, réalisées par le médecin palermitain Giuseppe Salerno vers 1756-1764 : la légende parle d'injections mystérieuses, les études, de cire d'abeille et de colorants.\n\nNon loin de là, la façade du Gesù Nuovo, qui était à l'origine le palais des Sanseverino en 1470, est recouverte d'un bossage en pointes de pyramide en piperno sombre. Sur certaines pierres, on voit des signes gravés : pour la légende, un message secret ; pour certains spécialistes, les marques des tailleurs de pierre ; en 2011, l'historien de l'art Vincenzo De Pasquale a proposé de les lire comme des notes de musique, une partition d'environ trois quarts d'heure appelée « Enigma ». Une hypothèse séduisante, pas une certitude.\n\nEt puis il y a la mer : selon la légende, le poète Virgile cacha dans les souterrains de Castel dell'Ovo l'œuf de la sirène Partenope. Tant que l'œuf reste intact, le château reste debout.\n\nDans les maisons, en revanche, habitent les esprits de la tradition populaire : le munaciello, lutin encapuchonné qui porte chance ou espièglerie selon la façon dont on le traite, et la bella 'mbriana, bon esprit de la maison, qui peut apparaître sous la forme d'un papillon ou d'un gecko.","foto":{"u":"../img/658e8ea49eab.jpg","alt":"La façade en pointes de diamant du Gesù Nuovo","aut":"Palickap","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Napoli,_chiesa_del_Ges%C3%B9_Nuovo,_facciata_(3).jpg","dida":"Le bossage en pointes de diamant du Gesù Nuovo, la « façade en code »."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Visit Naples – 5 creature fantastiche napoletane","u":"https://visitnaples.eu/en/neapolitanity/tales-of-naples/5-fantastic-neapolitan-beasts-and-where-to-find-them"},{"t":"Italia.it – Castel dell'Ovo","u":"https://www.italia.it/it/campania/napoli/castel-dell-ovo"},{"t":"Fanpage – note musicali sulla facciata del Gesù Nuovo","u":"https://www.fanpage.it/chiesa-del-gesu-nuovo-di-napoli-note-musicali-incise-sulla-facciata/"},{"t":"Avvenire – restauro della facciata del Gesù Nuovo","u":"https://www.avvenire.it/agora/cultura/napoli-restaurata-la-facciata-del-gesu-nuovo-e-il-suo-misterioso-bugnato-a-piramide_65918"},{"t":"Museo Cappella Sansevero – Le Macchine anatomiche","u":"https://www.museosansevero.it/la-cappella-e-il-cristo-velato/le-macchine-anatomiche"},{"t":"Museo Cappella Sansevero – Cristo velato","u":"https://www.museosansevero.it/la-statua/"},{"t":"Museo Cappella Sansevero – Il mito del principe","u":"https://www.museosansevero.it/il-principe-di-sansevero/mito"}],"ant":true},{"id":5,"s":"napoli-oggi","t":"Naples aujourd'hui : les nouveautés","sub":"","som":"La place dédiée à Maradona, le street art, le dernier Caravage de la via Toledo, des églises et des ossuaires rouverts : la ville qui change.","txt":"Celui qui revient à Naples après quelques années découvre une ville qui a appris à se raconter.\n\nDans les Quartieri Spagnoli, à neuf minutes de chez nous, se trouve Largo Maradona. La fresque de Diego fut peinte en 1990 par Mario Filardi ; au fil des ans, elle s'est estompée jusqu'à presque disparaître, puis elle a été restaurée grâce à Salvatore Iodice et, à l'automne 2017, l'Argentin Francisco Bosoletti en a repeint le visage. Après la mort de Maradona, le 25 novembre 2020, la place, auparavant appelée place des artistes, est devenue un sanctuaire laïc d'autels improvisés, de drapeaux argentins et de photographies, si visité que la municipalité a dû organiser le flux des piétons.\n\nLe street art est entré dans le centre historique : sur la piazzetta dei Girolamini, protégée par une vitre, se trouve la Madone au pistolet de Banksy ; dans la Via Duomo, le San Gennaro ouvrier de Jorit. Le portail touristique officiel de la ville leur consacre un itinéraire.\n\nDans la Via Toledo, à six minutes de chez nous, les Gallerie d'Italia abritent Le Martyre de sainte Ursule, la dernière toile peinte par le Caravage, ainsi que plus de cinq cents vases attiques et de Grande-Grèce.\n\nEt des lieux restés longtemps fermés rouvrent : l'église de Santa Luciella ai Librai, abandonnée pendant plus de trente ans, est de nouveau visitable depuis le 5 avril 2019 ; le Cimitero delle Fontanelle a rouvert en 2026.","foto":{"u":"../img/a2c6b2a82ec4.jpg","alt":"La fresque de Maradona dans les Quartiers espagnols","aut":"Photo2023","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Murales_Napoli.jpg","dida":"Largo Maradona, l'un des visages de la Naples d'aujourd'hui."},"cap":[],"ap":false,"col":null,"fonti":[{"t":"Cimitero delle Fontanelle – sito ufficiale","u":"https://cimiterodellefontanelle.it/en/the-cemetery/"},{"t":"FAI – Chiesa di Santa Luciella","u":"https://fondoambiente.it/luoghi/chiesa-di-santa-luciella"},{"t":"Intesa Sanpaolo – collezioni permanenti in via Toledo","u":"https://group.intesasanpaolo.com/it/newsroom/tutte-le-news/news/2022/collezioni-permanenti-napoli-via-toledo"},{"t":"Portale turistico ufficiale di Napoli – Banksy was here","u":"https://dmo-napoli-ese.inera.it/en/itinerary/banksy-was-here-a-journey-through-murals-and-history-in-naples/"},{"t":"Artribune – tutelare il murale di Maradona","u":"https://www.artribune.com/?p=1033081"},{"t":"Finestre sull'Arte – Il Maradona dei Quartieri Spagnoli","u":"https://www.finestresullarte.info/en/works-and-artists/the-maradona-of-the-spanish-quarters-history-of-one-of-italy-s-most-famous-murals"}],"ant":true},{"id":8,"s":"caffe-sospeso","t":"Le café suspendu : un café payé pour un inconnu","sub":"","som":"On paie un café de plus pour celui qui viendra après : le geste napolitain qui a fait le tour du monde, et la cafetière qui le garde sur notre comptoir.","txt":"À Naples, il existe un café que l'on paie mais que l'on ne boit pas. Celui qui entre au bar en paie deux, en boit un et laisse l'autre « en suspens » pour quelqu'un qui viendra plus tard et n'aurait pas les moyens de se l'offrir. Celui qui l'offre reste anonyme, celui qui le reçoit n'a à remercier personne.\n\nLes origines précises ne sont pas documentées. L'écrivain Riccardo Pazzaglia racontait que des amis, au comptoir, dans la confusion de l'addition, payaient un café de plus et, au lieu de le réclamer, le laissaient à un inconnu. Luciano De Crescenzo, en 2008, a consacré un livre à ce thème, « Il caffè sospeso » : pour lui, c'était le geste de celui qui est heureux et offre un café au reste du monde.\n\nEn 2010, plusieurs festivals culturels italiens ont fondé le Réseau du café suspendu (Rete del caffè sospeso), qui a choisi le 10 décembre, Journée internationale des droits de l'homme, comme journée du café suspendu. Depuis, l'idée a voyagé dans de nombreux pays : en anglais, on dit suspended coffee, dans les pays hispanophones café pendiente.\n\nChez nous, à Piazza Carità 14, le café suspendu a une maison : une grande cafetière en cuivre portant l'inscription « Caffè sospeso », sur le comptoir. Celui qui veut offrir un café le paie et dépose le ticket dans la cafetière ; celui qui en a besoin prend un ticket et reçoit un café déjà payé. Vous aussi, vous pouvez en laisser un, avant de repartir à la découverte de la ville.","foto":{"u":"../img/d45e6800235d.webp","alt":"La cafetière en cuivre portant l'inscription « Caffè sospeso » sur le comptoir de Ceraldi Caffè","aut":"Ceraldi Caffè","lic":"Tutti i diritti riservati","src":"https://www.ceraldicaffe.it/storie/caffe-sospeso/","dida":"La cafetière du café suspendu sur le comptoir de Ceraldi Caffè, à Piazza Carità 14."},"cap":[],"ap":false,"col":{"x":"Au comptoir, un espresso. Et si vous le souhaitez, un de plus à laisser dans la cafetière pour celui qui viendra après.","v":[{"v":177,"n":"Espresso (Kimbo, mélange Extreme)","p":250,"foto":{"u":"../img/d716ed7381a1.webp","alt":"Espresso (Kimbo, Miscela Extreme)"}}],"l":[{"u":"https://www.ceraldicaffe.it/storie/caffe-sospeso/","t":"Le café suspendu à Naples : ce que c'est, comment ça marche et d'où il vient","x":"","it":true}]},"fonti":[{"t":"Wikipedia – Caffè sospeso","u":"https://it.wikipedia.org/wiki/Caff%C3%A8_sospeso"},{"t":"L'Espresso – Solidarietà in tazzina (21/11/2011)","u":"https://lespresso.it/c/attualita/2011/11/21/solidarieta-in-tazzina/5118"},{"t":"Meer – Il ritorno della Rete del caffè sospeso (27/4/2021)","u":"https://www.meer.com/it/65610-il-ritorno-della-rete-del-caffe-sospeso"},{"t":"Avvenire – Lasciamo un «caffè sospeso» (9/12/2011)","u":"https://www.avvenire.it/idee-e-commenti/lasciamo-un-caffe-sospeso-la-solidarieta-parte-dalle-piccole-cose_8571"}],"ant":true}],"passaporto":null,"scioperi":[{"d":"2026-12-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"},{"d":"2026-11-16","l":"ANM (metro/funicolare)","x":"4 ORE: DALLE 11.00 ALLE 15.00"}],"coperto":["castello","chiesa","museo","palazzo","sotterraneo","teatro"],"generata":"2026-11-14T12:13Z","lingue":[{"c":"it"," }

    return JSON.parse(t.split('"TILES/').join('"' + base + 'tiles/').split('"GLYPHS/').join('"' + base + 'glyphs/').split('"SPRITE"').join('"' + base + 'sprite/light"')); }); }
/* opz: punti [{t,n,lat,lon,h,casa,spento}], linee [{c:coordinate, s:'fatto'|'ora'|'poi'|''}], geo (controllo «tu sei qui»), dopo(m) */
function mappa(id, opz){

    var m = new maplibregl.Map({container: el, style: r[1], center: [14.2532, 40.8475], zoom: 14, minZoom: 12, maxZoom: 18, maxBounds: [[14.15, 40.80], [14.33, 40.90]], attributionControl: {compact: false}});
    MAPPE[id] = m;
    m.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    if(opz.geo){
      var g = new maplibregl.GeolocateControl({positionOptions: {enableHighAccuracy: true, timeout: 15000}, trackUserLocation: true, fitBoundsOptions: {maxZoom: 17}});
      m.addControl(g, 'top-right'); GEO[id] = g;
      var msg = document.getElementById(id + '-msg');
      g.on('error', function(){ if(msg){ msg.textContent = T.pos_negata; msg.hidden = false; } });
      g.on('outofmaxbounds', function(){ if(msg){ msg.textContent = T.fuori_zona; msg.hidden = false; } });
      g.on('geolocate', function(){ if(msg) msg.hidden = true; });
    }
    var b = new maplibregl.LngLatBounds(), linee = opz.linee || [];
    if(linee.length) m.on('load', function(){
      m.addSource('percorso', {type: 'geojson', data: {type: 'FeatureCollection', features: linee.map(function(x){ return {type: 'Feature', properties: {s: x.s || ''}, geometry: {type: 'LineString', coordinates: x.c}}; })}});
      var scuro = getComputedStyle(document.documentElement).getPropertyValue('--scuro').trim() || '#2E3A2F';
      m.addLayer({id: 'percorso-bordo', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'}, paint: {'line-color': '#ffffff', 'line-width': ['match', ['get', 's'], 'ora', 12, 9]}});
      m.addLayer({id: 'percorso', type: 'line', source: 'percorso', layout: {'line-join': 'round', 'line-cap': 'round'},
        paint: {'line-color': ['match', ['get', 's'], 'fatto', '#9a958c', scuro], 'line-width': ['match', ['get', 's'], 'ora', 7, 5], 'line-opacity': ['match', ['get', 's'], 'poi', 0.45, 1]}});
    });

    (opz.punti || []).forEach(function(p){
      var d = document.createElement('a'); d.className = 'pin' + (p.casa ? ' casa' : '') + (p.spento ? ' spento' : ''); d.textContent = p.t; d.href = p.h; d.setAttribute('aria-label', p.n);
      new maplibregl.Marker({element: d}).setLngLat([p.lon, p.lat]).addTo(m); b.extend([p.lon, p.lat]);
    });
    if(!b.isEmpty() && ((opz.punti || []).length > 1 || linee.length)) m.fitBounds(b, {padding: {top: 40, bottom: 40, left: 40, right: 64}, maxZoom: 16, duration: 0});
    else if(!b.isEmpty()) m.jumpTo({center: b.getCenter(), zoom: 16});
    if(opz.dopo) opz.dopo(m);
  }).catch(function(){ el.innerHTML = ''; });
}

function frase(x, arrivo){

  return e(x.k === 'parti' ? T.parti : (T[x.m] || T.straight)) + (x.n ? ' · ' + e(x.n) : '');
}
function indicazione(x, arrivo){ return frase(x, arrivo) + (x.d && x.k !== 'arrivo' ? ' <span class="piccolo">— ' + x.d + ' m</span>' : ''); }
function freccia(x){

function puntiItinerario(i, k){ var n = 0, visti = {}, out = [];

    out.push({t: casa(l) ? 'C' : String(++n), n: l.n, lat: l.lat, lon: l.lon, h: '#/l/' + l.s, casa: casa(l), spento: k != null && j < k && !casa(l)}); });

/* ---------- audio: voce del telefono (gratuita, senza rete) ---------- */
function ascolta(l, btn){
  try{
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn) btn.textContent = '▶ ' + T.ascolta; return; }
    var parti = [l.n, l.som].concat((l.dett || []).map(function(x){ return x.t + '. ' + (x.d ? x.d + '. ' : '') + x.x; }), [l.rac, l.leg]);
    var u = new SpeechSynthesisUtterance(parti.filter(Boolean).join('. '));
    u.lang = VOCE[D.lingua] || D.lingua; u.onend = function(){ if(btn) btn.textContent = '▶ ' + T.ascolta; };
    speechSynthesis.speak(u); if(btn) btn.textContent = '■ ' + T.ferma;
  }catch(x){}
}

/* ---------- giro in corso: posizione sul telefono, avanzamento, arrivo ---------- */
var G = null; /* {s, k (tappa di arrivo del tratto in corso), arrivato, pos, acc, lungo, fuori, vicino} */
var KXm = 84300, KYm = 111000;
function xy(c){ return [(c[0] - 14.25) * KXm, (c[1] - 40.85) * KYm]; }
function suLinea(c, geo){ /* distanza dalla linea e metri percorsi lungo il tratto */
  var p = xy(c), best = {off: 1e9, lungo: 0}, tot = 0;
  for(var j = 1; j < geo.length; j++){
    var a = xy(geo[j - 1]), b = xy(geo[j]), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)), qx = a[0] + t * dx, qy = a[1] + t * dy, off = Math.hypot(p[0] - qx, p[1] - qy);
    if(off < best.off) best = {off: off, lungo: tot + t * len};
    tot += len;
  }
  best.tot = tot; return best;
}
function salvaGiro(){ try{ localStorage.setItem('guida_giro', JSON.stringify({s: G.s, k: G.k, t: Date.now()})); }catch(x){} }
function giroSalvato(){ try{ var g = JSON.parse(localStorage.getItem('guida_giro') || 'null'); return g && Date.now() - g.t < 12 * 3600e3 ? g : null; }catch(x){ return null; } }
var watchId = null, wake = null, marcaIo = null;
function avviaPosizione(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!G) return;
    G.pos = [p.coords.longitude, p.coords.latitude]; G.acc = p.coords.accuracy; G.negata = false;
    var i = IT[G.s], tp = i.tappe[G.k], l = LU[tp.l];
    if(tp.geo){ var r = suLinea(G.pos, tp.geo); G.lungo = r.lungo; G.fuori = G.acc < 40 && r.off > 60; }
    var dest = xy([l.lon, l.lat]), io = xy(G.pos), dist = Math.hypot(dest[0] - io[0], dest[1] - io[1]);
    G.vicino = (G.acc <= 40 && dist < 35) ? (G.vicino || 0) + 1 : 0;
    if(G.vicino >= 2 && !G.arrivato) G.arrivato = true;   /* due posizioni precise di seguito entro 35 m dalla tappa */
    aggiornaCammino();
  }, function(){ if(G){ G.negata = true; aggiornaCammino(); } }, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); }catch(x){}
}
function fermaPosizione(){ if(watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(watchId); watchId = null; try{ if(wake) wake.release(); }catch(x){} wake = null; marcaIo = null; }
