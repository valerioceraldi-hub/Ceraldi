<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ceraldi Caffè</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Jost:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fuori);color:var(--testo);font:400 16px/1.5 var(--f-testo);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accento-chiaro);outline-offset:2px}
.app{max-width:480px;margin:0 auto;background:var(--sfondo);min-height:100vh;position:relative;box-shadow:0 0 60px -20px rgba(30,20,16,.45);overflow-x:hidden}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ey{font:500 .7rem/1.3 var(--f-testo);letter-spacing:.18em;text-transform:uppercase}
.prz{font:500 1.0625rem/1 var(--f-testo);font-variant-numeric:tabular-nums;color:var(--prezzo)}

/* Copertina */
.cop{position:relative;background:var(--scuro);color:var(--su-scuro);overflow:hidden;padding-block:26px 26px}
.cop .sf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.26}
.cop .in{position:relative;display:grid;gap:14px}
.cop .logo{width:150px;height:auto}
.cop h1{font:italic 400 2.6rem/1 var(--f-display);color:var(--su-scuro)}
.cop .sal{font-size:1rem;color:var(--su-scuro);max-width:30ch}
.fid{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 .68rem/1.3 var(--f-testo);letter-spacing:.14em;text-transform:uppercase;color:var(--accento-chiaro)}
.fid span{display:inline-flex;gap:6px;align-items:center}
.fid span+span::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6;margin-right:10px}

/* Momento */
.mom{position:relative;margin:18px 16px 0;border-radius:4px;overflow:hidden;background:var(--scuro);color:var(--su-scuro);box-shadow:0 18px 40px -26px rgba(30,20,16,.8)}
.mom img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mom .ft{position:relative}
.mom .ft::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--scuro) 98%)}
.mom .tx{position:relative;margin-top:-34px;padding:0 20px 20px;display:grid;gap:8px}
.mom .ey{color:var(--accento-chiaro)}
.mom h2{font:400 2.2rem/1.02 var(--f-display);color:var(--su-scuro)}
.mom p{color:var(--su-scuro);font-size:.98rem}
.coppia{display:grid;gap:0;margin-top:6px;border-top:1px solid color-mix(in srgb,var(--accento-chiaro) 35%,transparent)}
.coppia button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--accento-chiaro) 20%,transparent);padding:10px 0;text-align:left;color:var(--su-scuro)}
.coppia .prz{color:var(--accento-chiaro)}
.cta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:13px 18px;font:500 .78rem/1 var(--f-testo);letter-spacing:.13em;text-transform:uppercase;min-height:44px}
.btn.oro{background:var(--accento-chiaro);color:var(--scuro)}
.btn.vuoto{background:transparent;border:1px solid currentColor}
.btn.scuro{background:var(--scuro);color:var(--su-scuro)}

/* Titoli di sezione in Home */
.tit{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}
.tit h3{font:400 1.7rem/1.05 var(--f-display)}
.tit .ey{color:var(--accento)}

/* Proposte del giorno */
.pista{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px 4px;scroll-padding:0 16px}
.pista::-webkit-scrollbar{display:none}
.pc{flex:0 0 82%;scroll-snap-align:start;background:var(--superficie);border:0;padding:0;text-align:left;border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(35,23,15,.08),0 12px 26px -20px rgba(35,23,15,.5);display:grid}
.pc img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pc .c{padding:12px 14px 14px;display:grid;gap:4px}
.pc .ey{color:var(--prezzo)}
.pc h4{font:400 1.35rem/1.12 var(--f-display)}
.pc .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc .d{font-size:.84rem;color:var(--testo-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.punti{display:flex;justify-content:center;gap:7px;margin-top:12px}
.punti i{width:6px;height:6px;border-radius:50%;background:var(--linea);transition:transform .2s,background .2s}
.punti i.on{background:var(--accento);transform:scale(1.3)}

/* Sezioni del menu (tavole) */
.tavole{display:grid;gap:10px}
.tav{position:relative;border:0;padding:0;border-radius:4px;overflow:hidden;min-height:118px;text-align:left;background:var(--scuro-2);color:var(--su-scuro);display:block;width:100%}
.tav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
.tav::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,13,10,.88) 15%,rgba(20,13,10,.15))}
.tav .t{position:relative;z-index:1;display:grid;gap:4px;padding:20px 18px}
.tav h3{font:400 1.75rem/1.05 var(--f-display)}
.tav small{font:500 .68rem/1.2 var(--f-testo);letter-spacing:.14em;text-transform:uppercase;color:var(--accento-chiaro)}
.tav .q{font-size:.82rem;color:var(--su-scuro)}
.tav.senza{background:var(--superficie);color:var(--testo);border:1px solid var(--linea)}
.tav.senza::after{display:none}
.tav.senza small{color:var(--accento)}.tav.senza .q{color:var(--testo-2)}

/* Storia */
.storia{margin-top:34px;background:var(--superficie);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.storia img{width:100%;aspect-ratio:3/2;object-fit:cover}
.storia .tx{padding-block:20px 24px;display:grid;gap:10px}
.storia h3{font:400 1.9rem/1.05 var(--f-display)}
.storia p{color:var(--testo-2);font-size:.98rem}
.storia .firma{font:italic 400 1.15rem/1.3 var(--f-display);color:var(--prezzo)}
.piede{padding-block:24px 120px;color:var(--testo-2);font-size:.82rem;display:grid;gap:8px}
.piede b{color:var(--testo);font-weight:500}

/* Pagina sezione */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--rev-h,0px));z-index:30;background:var(--scuro);color:var(--su-scuro)}
.bar .r{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.ind{background:none;border:0;color:var(--accento-chiaro);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:8px 0;min-height:40px}
.bar h2{font:400 1.3rem/1.1 var(--f-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid color-mix(in srgb,var(--su-scuro) 30%,var(--scuro));background:transparent;color:var(--su-scuro);border-radius:99px;padding:7px 12px;font-size:.8rem;white-space:nowrap}
.chips button.on{background:var(--accento-chiaro);border-color:var(--accento-chiaro);color:var(--scuro)}
.cat{padding-top:26px;scroll-margin-top:130px}
.cat h3{font:400 2rem/1.05 var(--f-display)}
.cat .nota{font-size:.8rem;color:var(--testo-2);margin-top:4px}
.consiglio{display:block;width:100%;margin-top:14px;border:0;padding:0;text-align:left;background:var(--superficie);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(35,23,15,.08),0 14px 28px -22px rgba(35,23,15,.6)}
.consiglio img{width:100%;aspect-ratio:16/10;object-fit:cover}
.consiglio .c{padding:14px 16px 16px;display:grid;gap:6px}
.consiglio .ey{color:var(--prezzo);display:flex;align-items:center;gap:8px}
.consiglio .ey::before{content:"";width:18px;height:1px;background:currentColor}
.consiglio .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.consiglio h4{font:400 1.55rem/1.1 var(--f-display)}
.consiglio .d{color:var(--testo-2);font-size:.92rem}
.righe{list-style:none;margin:8px 0 0;padding:0}
.righe li+li{border-top:1px solid var(--linea)}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;width:100%;background:none;border:0;padding:14px 0;text-align:left;align-items:start}
.voce h4{font:500 1.02rem/1.25 var(--f-testo);color:var(--testo)}
.voce .d{font-size:.86rem;color:var(--testo-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.voce .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:7px}
.voce img,.voce .vu{width:76px;height:76px;border-radius:3px;object-fit:cover;background:var(--velo)}
.tag{font:500 .62rem/1 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento);border:1px solid color-mix(in srgb,var(--accento) 45%,transparent);border-radius:2px;padding:4px 6px}
.tag.np{color:var(--prezzo);border-color:color-mix(in srgb,var(--prezzo) 40%,transparent)}
.altre{margin:6px 0 0;background:none;border:1px dashed var(--linea);border-radius:99px;padding:9px 14px;font-size:.82rem;color:var(--testo-2);width:100%}

/* Scheda prodotto */
.velo{position:fixed;inset:0;background:rgba(15,10,8,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:velo .2s ease}
@keyframes velo{from{opacity:0}}
.foglio{background:var(--superficie);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;animation:sale .28s cubic-bezier(.2,.8,.2,1);padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
@keyframes sale{from{transform:translateY(40px);opacity:.4}}
.foglio .ft{position:relative}
.foglio .ft img{width:100%;aspect-ratio:4/3;object-fit:cover}
.chiudi{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--superficie) 92%,transparent);font-size:1.3rem;line-height:1;color:var(--testo)}
.foglio .c{padding:18px 20px 6px;display:grid;gap:10px}
.foglio h3{font:400 2rem/1.05 var(--f-display)}
.foglio .d{color:var(--testo-2);font-size:1rem;white-space:pre-line}
.foglio .r{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--linea);padding-top:14px;margin-top:4px}
.foglio .r .prz{font-size:1.6rem}
.all{font-size:.8rem;color:var(--testo-2);background:var(--sfondo);padding:10px 12px;border-radius:4px}
.all b{font-weight:500;color:var(--testo)}
.abb{padding:8px 20px 6px}
.abb h5{margin:10px 0 8px;font:500 .7rem/1 var(--f-testo);letter-spacing:.16em;text-transform:uppercase;color:var(--accento)}
.abb .l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;background:var(--sfondo);border:0;border-radius:4px;padding:6px;text-align:left}
.mini img,.mini .vu{width:52px;height:52px;border-radius:3px;object-fit:cover;background:var(--velo)}
.mini b{font-weight:500;font-size:.84rem;line-height:1.2;display:block}
.mini span{font-size:.78rem;color:var(--prezzo)}

/* Ordinazione */
.ord{position:fixed;z-index:50;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--scuro);color:var(--su-scuro);border:0;border-radius:99px;padding:8px 8px 8px 20px;box-shadow:0 14px 30px -12px rgba(15,10,8,.7)}
.ord .n{font-size:.88rem}
.ord .n b{color:var(--accento-chiaro);font-weight:500}
.ord .go{background:var(--accento-chiaro);color:var(--scuro);border-radius:99px;padding:10px 14px;font:500 .72rem/1 var(--f-testo);letter-spacing:.12em;text-transform:uppercase}
.lista{padding:22px 20px 8px;display:grid;gap:4px}
.lista h3{font:400 1.9rem/1.05 var(--f-display)}
.lista p.s{font-size:.86rem;color:var(--testo-2);margin-bottom:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--linea);padding:10px 0}
.qta{display:flex;align-items:center;gap:4px}
.qta button{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:var(--sfondo);font-size:1.05rem}
.qta span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.mostra{position:fixed;inset:0;z-index:70;background:var(--scuro);color:var(--su-scuro);display:flex;flex-direction:column;padding:max(28px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto}
.mostra .ey{color:var(--accento-chiaro)}
.mostra h3{font:italic 400 2.3rem/1.1 var(--f-display);margin:10px 0 20px;color:var(--su-scuro)}
.mostra ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.mostra li{font:400 1.9rem/1.15 var(--f-display);display:flex;gap:14px}
.mostra li b{font:500 1.5rem/1.3 var(--f-testo);color:var(--accento-chiaro);min-width:2.2ch}
.mostra .g{margin-top:auto;padding-top:24px;font-size:.86rem;color:color-mix(in srgb,var(--su-scuro) 70%,var(--scuro))}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}/* ── Menu per i clienti: modello senza contenuti. Colori, caratteri, testi e contenuti arrivano dal database (vedi menu_genera.py). ── */
:root{--sfondo:#F4F4F2;--superficie:#FFFFFF;--testo:#1F1F1F;--testo-2:#5C5C5C;--accento:#8A6D3B;--prezzo:#1F1F1F;--f-display:Georgia,"Times New Roman",serif;--f-testo:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
:root,[data-s],.cat,[data-p],.vh{--scuro:var(--c-scuro,var(--testo));--scuro-2:color-mix(in srgb,var(--scuro) 88%,#fff);--su-scuro:var(--c-su-scuro,var(--sfondo));--accento-chiaro:var(--c-accento-chiaro,color-mix(in srgb,var(--accento) 55%,#fff));--linea:color-mix(in srgb,var(--testo) 16%,var(--sfondo));--velo:color-mix(in srgb,var(--testo) 8%,var(--sfondo));--fuori:color-mix(in srgb,var(--sfondo) 85%,#000)}
.sezv,.pag,.vh{background:var(--sfondo);color:var(--testo)}
.cat{background:var(--sfondo);color:var(--testo)}
.cop .nome{font:500 .72rem/1.3 var(--f-testo);letter-spacing:.18em;text-transform:uppercase;color:var(--accento-chiaro)}
.cop .blk{margin:0}
.cop .blk.gut{padding-left:0;padding-right:0}
.cop .blk.t h3{font:500 .68rem/1.3 var(--f-testo);letter-spacing:.14em;text-transform:uppercase;color:var(--accento-chiaro)}
.cop .blk.t p,.cop .blk.t .ey{font-size:.8rem;color:var(--su-scuro)}
.cop .blk.f img{width:150px;height:auto}
.blk{margin-top:26px}
.blk .ey{color:var(--accento)}
.blk h3{font:400 1.8rem/1.08 var(--f-display)}
.blk p{color:var(--testo-2);font-size:.98rem;margin-top:8px;white-space:pre-line}
.blk.t{display:grid;gap:4px}
.blk.t .btn,.blk.tf .btn{margin-top:12px;justify-self:start;text-decoration:none;display:inline-block}
.blk.tf{background:var(--superficie);border-block:1px solid var(--linea);margin-top:34px}
.blk.tf img{width:100%;aspect-ratio:3/2;object-fit:cover}
.blk.tf .tx{padding-block:20px 24px;display:grid;gap:4px}
.blk.f{margin-inline:0}.blk.f img{width:100%;height:auto}
.blk.b{margin:22px 16px 0;background:var(--scuro);color:var(--su-scuro);border-radius:4px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px;text-align:left;border:0;width:calc(100% - 32px);text-decoration:none;font:inherit}
.blk.b.sf{grid-template-columns:1fr}
.blk.b img{width:96px;height:96px;object-fit:cover;border-radius:2px}
.blk.b .ey{color:var(--accento-chiaro);display:block}
.blk.b h3{font:400 1.5rem/1.05 var(--f-display);color:var(--su-scuro);margin:2px 0 4px}
.blk.b p{color:var(--su-scuro);opacity:.85;font-size:.84rem;line-height:1.35;margin:0}
.blk.b .go{display:block;margin-top:6px;font:500 .72rem/1 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento-chiaro)}
.pag{min-height:100vh;padding-bottom:130px}
/* testata delle pagine extra: foto «in alto» con ruolo logo / sfondo / motivo */
.tp{position:relative;overflow:hidden;background:var(--sfondo);padding:34px 16px 30px;display:grid;place-items:center}
.tp .mo{position:absolute;inset:0;background-repeat:repeat;background-size:150px auto;opacity:.9}
.tp .sf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tp .lg{position:relative;background:var(--superficie);padding:18px 22px;border-radius:6px;box-shadow:0 18px 40px -22px rgba(0,0,0,.55);width:min(320px,86%)}
.tp .lg img{width:100%;height:auto}
.blk.b .mo{grid-column:1/-1;height:26px;margin:-12px -12px 2px;background-color:var(--su-scuro);background-repeat:repeat-x;background-size:auto 42px;background-position:center;border-radius:4px 4px 0 0}
/* testo a righe: «Voce — spiegazione» e confronti «Voce — loro | noi» */
.dl{display:grid;gap:0;margin-top:10px;border-top:1px solid var(--linea)}
.dl div{display:grid;grid-template-columns:minmax(92px,34%) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:.95rem}
.dl dt{font:400 1.15rem/1.15 var(--f-display);color:var(--prezzo)}
.dl dd{margin:0;color:var(--testo-2)}
.cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem;table-layout:fixed}
.cmp th,.cmp td{padding:9px 6px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
.cmp th{font:500 .66rem/1.25 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento)}
.cmp td:first-child{font:400 1.05rem/1.2 var(--f-display);width:26%}
.cmp td:nth-child(2){color:var(--testo-2)}
.cmp td:last-child{color:var(--prezzo);font-weight:500;background:color-mix(in srgb,var(--prezzo) 7%,transparent)}
.cmp th:last-child{color:var(--prezzo)}
/* prodotti collegati a un blocco */
.pvs{display:grid;gap:10px;margin-top:14px}
.pv{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--superficie);border:1px solid var(--linea);border-radius:6px;padding:8px;text-align:left}
.pv.senza{grid-template-columns:1fr}
.pv img{width:76px;height:76px;object-fit:cover;border-radius:4px;background:#fff}
.pv .x{display:grid;gap:2px;min-width:0}
.pv b{font:400 1.2rem/1.15 var(--f-display);font-weight:400}
.pv small{color:var(--testo-2);font-size:.8rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.pv .prz{color:var(--prezzo);font:500 1.1rem/1 var(--f-testo)}
.pv .btn{min-height:38px;padding:10px 14px;font-size:.7rem}
.blk.b .pvs,.mom .pvs{color:var(--testo)}
.pag .bar h2{text-align:right}
.vars{margin:4px 0 0;padding:0;list-style:none;font-size:.92rem}
.vars li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--linea);padding:8px 0}
.vars b{font-weight:500}.vars .g{font:500 .66rem/1.2 var(--f-testo);letter-spacing:.12em;text-transform:uppercase;color:var(--accento);padding-top:8px}
.tag.fin{color:var(--testo-2);border-color:var(--linea)}
.tag.sto{color:var(--testo-2);border-color:var(--linea)}
.lks{display:grid;gap:8px;margin-top:4px}

ypical grape varieties, the temperature range, the resulting aromas, and the experience of centuries past. Obtained from a careful bain-marie distillation in a pot still using steam from Teroldego, Marzemino, and Merlot pomace, it is characterized by its crisp, elegant dryness.","p":600,"f":"../img/54c2678eb0d9.webp","fg":null,"fa":"Trentina bianca Marzadro","ft":"","b":[],"es":false,"al":null,"var":[],"dp":[]},{"id":226,"n":"Trentino barrique ","d":"A grappa created to express the utmost smoothness of a distillate, born from a careful bain-marie distillation in a pot still of Moscato, Chardonnay, and Gewürztraminer pomace. The region's typical grape varieties, the temperature range of the area, and the resulting aromas, lend it unique and distinct organoleptic qualities. Trentina Morbida Barrique is then aged for several months in barrels previously used for the aging of Grappa Stravecchia Diciotto Lune, becoming even more \"gentle\" and velvety. A tribute from the Marzadro family to the land where they live.","p":600,"f":"../img/e67431c30b15.webp","fg":null,"fa":"Trentina barrique","ft":"","b":[],"es":false,"al":null,"var":[],"dp":[]},{"id":229,"n":"903 barrique","d":"Grappa aged in barriques.","p":600,"f":null,"fg":null,"fa":"","ft":"","b":[],"es":false,"al":null,"var":[],"dp":[]},{"id":228,"n":"First Grape Brandy","d":"Soft and fruity Venetian grape brandy.","p":600,"f":null,"fg":null,"fa":"","ft":"","b":[],"es":false,"al":null,"var":[],"dp":[]},{"id":227,"n":"Alexander triple distillation","d":"Venetian grappa from Bottega, triple distilled in copper stills.","p":700,"f":null,"fg":null,"fa":"","ft":"","b":[],"es":false,"al":null,"var":[],"dp":[]}]}]}],"pagine":{"home":{"titolo":"Home page","blocchi":[{"tipo":"foto","pos":"alto","ruolo":"logo","sopra":"","titolo":"","testo":"","f":"../img/7f3e99a992a4.svg","fa":"Ceraldi Caffè, artisans by passion since 1973","lt":"","lu":null,"lp":null,"voci":[]},{"tipo":"foto","pos":"alto","ruolo":"sfondo","sopra":"","titolo":"
