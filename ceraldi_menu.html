      '<div class="sec-title">Foto di copertina</div>' + gFotoHtml('rcF', r, 0) +
      '<div class="sec-title">Capitoli</div>' + (id ? (C.length ? '<div class="grp">' + C.map(function(c, i){ return '<div class="row" role="button" tabindex="0" onclick="apriCapitolo(' + id + ',' + c.id + ')"><div class="row-main"><div class="row-t">' + esc((c.periodo ? c.periodo + ' · ' : '') + c.titolo) + ' ' + gBdg(c.stato) + (gSenzaFoto(c) ? G_NOFOTO : '') + '</div><div class="row-s">' + (c.luogo_id ? esc(gNomeL(c.luogo_id)) : 'nessun luogo collegato') + (c.foto_path ? ' · 📷' : '') + '</div></div>' +
        gFrecce('gSposta(\'guida_capitoli\',gCapitoli(' + id + '),' + i + ',-1,function(){apriRacconto(' + id + ')})', 'gSposta(\'guida_capitoli\',gCapitoli(' + id + '),' + i + ',1,function(){apriRacconto(' + id + ')})', i, C.length) + '</div>'; }).join('') + '</div>' : '<div class="hint">Nessun capitolo.</div>') +
        '<button class="btn btn-s" style="margin-top:8px" onclick="apriCapitolo(' + id + ',null)">＋ Capitolo</button>' : '<div class="hint">Salva il racconto per aggiungere i capitoli.</div>'),
    piede: '<div class="btn-row">' + (id ? '<button class="btn btn-s" style="color:var(--bad,#b3261e)" onclick="eliminaRacconto(' + id + ')">Elimina</button>' : '') + '<button class="btn btn-p" id="rcSalva" onclick="salvaRacconto(' + (id || 'null') + ')">Salva</button></div>' });
  gContaTutti(['rcM', 'rcX']); gInizializzaFoto('rcF');
}
async function salvaRacconto(id){
  var t = document.getElementById('rcT').value.trim(); if(t.length < 2){ toast('Scrivi il titolo'); return; }
  var ft = gFotoLeggi('rcF', 0); if(ft.err){ toast(ft.err); return; }
  var btn = document.getElementById('rcSalva'); btn.disabled = true; btn.textContent = 'Salvo…';
  try{
    var corpo = Object.assign({ titolo: t, sottotitolo: document.getElementById('rcS').value.trim() || null, sommario: document.getElementById('rcM').value.trim() || null, testo: document.getElementById('rcX').value.trim() || null,
      stato: segValore('rcStato') || 'bozza', in_apertura: document.getElementById('rcAp').checked }, ft.v);
    if(!ft.vuota) corpo.foto_path = await gFotoCarica('rcF', 'racconti');
    if(id) await api('guida_racconti?id=eq.' + id, { method: 'PATCH', prefer: 'return=minimal', body: corpo });
    else { corpo.slug = gSlug(t); corpo.ordine = G.rac.reduce(function(m, x){ return Math.max(m, x.ordine || 0); }, 0) + 10; var r = await api('guida_racconti', { method: 'POST', prefer: 'return=representation', body: corpo }); id = r[0].id; }
    await caricaGuida(); chiudiSheet('shRc'); toast('✓ Salvato'); renderGuida();
  }catch(e){ btn.disabled = false; btn.textContent = 'Riprova'; gErr('racconto', e); }
}
async function eliminaRacconto(id){
  if(!(await conferma('Eliminare il racconto?', 'Elimino il racconto con i suoi capitoli. Se vuoi solo nasconderlo, mettilo in «Archiviato».', 'Elimina', true))) return;
  try{ await api('guida_capitoli?racconto_id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' }); await api('guida_racconti?id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' }); await caricaGuida(); chiudiSheet('shRc'); toast('✓ Eliminato'); renderGuida(); }catch(e){ gErr('elimina racconto', e); }
}
function apriCapitolo(rid, id){
  var c = id ? G.cap.find(function(x){ return x.id === id; }) : { stato: 'bozza' }; if(!c) return;
  var opL = { '': 'Nessun luogo' }; G.luoghi.filter(function(l){ return l.stato !== 'archiviato'; }).forEach(function(l){ opL[l.id] = l.nome; });
  apriSheet('shCp', { titolo: id ? c.titolo : 'Nuovo capitolo', alto: true,
    corpo: gStatoSeg('cpStato', c.stato) + gInp('cpP', 'Periodo', c.periodo, 60, 'Es. 1606–1607') + gInp('cpT', 'Titolo *', c.titolo, 140, '') + gArea('cpX', 'Testo *', c.testo, 3000, 7, '') +
      '<div class="field"><label for="cpL">Luogo collegato</label><select class="inp" id="cpL">' + gOpz(opL, c.luogo_id || '') + '</select></div><div class="sec-title">Foto</div>' + gFotoHtml('cpF', c, 1),
    piede: '<div class="btn-row">' + (id ? '<button class="btn btn-s" style="color:var(--bad,#b3261e)" onclick="eliminaCapitolo(' + rid + ',' + id + ')">Elimina</button>' : '') + '<button class="btn btn-p" id="cpSalva" onclick="salvaCapitolo(' + rid + ',' + (id || 'null') + ')">Salva</button></div>' });
  gContaTutti(['cpX']); gInizializzaFoto('cpF');
}
async function salvaCapitolo(rid, id){
  var t = document.getElementById('cpT').value.trim(), x = document.getElementById('cpX').value.trim();
  if(t.length < 2 || x.length < 5){ toast('Scrivi titolo e testo'); return; }
  var ft = gFotoLeggi('cpF', 1); if(ft.err){ toast(ft.err); return; }
  var btn = document.getElementById('cpSalva'); btn.disabled = true; btn.textContent = 'Salvo…';
  try{
    var lv = document.getElementById('cpL').value, corpo = Object.assign({ periodo: document.getElementById('cpP').value.trim() || null, titolo: t, testo: x, luogo_id: lv ? +lv : null, stato: segValore('cpStato') || 'bozza' }, ft.v);
    if(!ft.vuota) corpo.foto_path = await gFotoCarica('cpF', 'racconti');
    if(id) await api('guida_capitoli?id=eq.' + id, { method: 'PATCH', prefer: 'return=minimal', body: corpo });
    else { corpo.racconto_id = rid; corpo.ordine = gCapitoli(rid).reduce(function(m, d){ return Math.max(m, d.ordine || 0); }, 0) + 10; await api('guida_capitoli', { method: 'POST', prefer: 'return=minimal', body: corpo }); }
    await caricaGuida(); chiudiSheet('shCp'); chiudiSheet('shRc'); toast('✓ Salvato'); apriRacconto(rid);
  }catch(e){ btn.disabled = false; btn.textContent = 'Riprova'; gErr('capitolo', e); }
}
async function eliminaCapitolo(rid, id){
  if(!(await conferma('Eliminare il capitolo?', 'Lo tolgo dal racconto.', 'Elimina', true))) return;
  try{ await api('guida_capitoli?id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' }); await caricaGuida(); chiudiSheet('shCp'); chiudiSheet('shRc'); toast('✓ Eliminato'); apriRacconto(rid); }catch(e){ gErr('elimina capitolo', e); }
}

/* storico */
var NOMI_TAB = { menu_voci: 'Voce', menu_categorie: 'Categoria', menu_sezioni: 'Sezione', menu_varianti: 'Variante', menu_disponibilita: 'Fascia oraria', menu_voci_allergeni: 'Allergene', menu_pagine: 'Pagina', menu_blocchi: 'Blocco', menu_raccomandazioni: 'Abbinamento o consiglio', menu_momenti: 'Momento', menu_momenti_voci: 'Prodotto del momento', contenuti_collegamenti: 'Collegamento', moduli: 'Impostazioni', locale: 'Locale' };
var CAMPI_IT = { nome: 'nome', descrizione: 'descrizione', prezzo_cent: 'prezzo', stato: 'stato', proposta_giorno: 'proposta del giorno', proposta_posizione: 'dove la proposta', foto_path: 'foto', foto_alt: 'descrizione foto', badge: 'etichette', esaurito_fino: 'finito per oggi', allergeni_verificati_il: 'verifica allergeni', in_evidenza: 'in evidenza', ordine: 'ordine', categoria_id: 'categoria', sezione_id: 'sezione', nome_en: 'nome inglese', descrizione_en: 'descrizione inglese', traduzione: 'traduzione', note: 'note', configurazione: 'aspetto/etichette', delta_cent: 'supplemento', giorni: 'giorni', orari: 'orari' };
var SISTEMA = ['aggiornato_il', 'aggiornato_da', 'creato_il', 'verificato_da', 'allergeni_verificati_da'];
var _stor = [];
async function apriStorico(){
  apriSheet('shSto', { titolo: 'Storico delle modifiche', alto: true, corpo: '<div class="loading"><div class="spinner"></div>Carico…</div>' });
  try{ _stor = await api('menu_storico?select=*&order=quando.desc&limit=150'); }
  catch(e){ corpoSheet('shSto').innerHTML = '<div class="banner r"><span>⚠️</span><span>' + esc(e.message) + '</span></div>'; return; }
  var b = corpoSheet('shSto'); if(!b) return;
  b.innerHTML = _stor.length ? '<div class="hint" style="margin:0 4px 10px">Ultime 150 modifiche. «Ripristina» rimette la riga com\'era prima di quella modifica.</div><div class="grp">' + _stor.map(function(r, i){
    var dati = r.dopo || r.prima || {}, nome = dati.nome || (r.tabella === 'menu_voci_allergeni' ? (D.allergeni.find(function(a){ return a.id === dati.allergene_id; }) || {}).nome + ' su ' + ((voceDi(dati.voce_id) || {}).nome || 'voce ' + dati.voce_id) : '#' + r.riga_id);
    var cosa = r.azione === 'inserimento' ? 'creata' : r.azione === 'eliminazione' ? 'eliminata' : 'modificati: ' + campiCambiati(r.prima, r.dopo).map(function(k){ return CAMPI_IT[k] || k; }).join(', ');
    var puo = (r.azione !== 'inserimento') && ['menu_voci', 'menu_categorie', 'menu_sezioni', 'menu_varianti', 'menu_disponibilita', 'menu_voci_allergeni', 'menu_pagine', 'menu_blocchi', 'menu_raccomandazioni', 'menu_momenti', 'menu_momenti_voci', 'locale'].indexOf(r.tabella) >= 0;
    return '<div class="row"><div class="row-main"><div class="row-t">' + esc((NOMI_TAB[r.tabella] || r.tabella) + ' · ' + nome) + '</div><div class="row-s">' + esc(cosa) + ' · ' + quando(r.quando) + '</div></div>' +
      (puo ? '<button class="btn-sm" onclick="ripristina(' + i + ')">Ripristina</button>' : '') + '</div>';
  }).join('') + '</div>' : '<div class="empty"><div class="ei">🕘</div><b>Ancora nessuna modifica</b></div>';
}
function campiCambiati(a, b){ a = a || {}; b = b || {}; return Object.keys(b).filter(function(k){ return SISTEMA.indexOf(k) < 0 && JSON.stringify(a[k]) !== JSON.stringify(b[k]); }); }
async function ripristina(i){
  var r = _stor[i]; if(!r || !r.prima) return;
  var tab = r.tabella, prima = Object.assign({}, r.prima);
  SISTEMA.forEach(function(k){ if(k !== 'verificato_da' && k !== 'allergeni_verificati_da') delete prima[k]; });
  var campi = r.azione === 'modifica' ? campiCambiati(r.prima, r.dopo) : null;
  var testo = r.azione === 'eliminazione' ? 'La riga eliminata viene ricreata com\'era.' : 'Rimetto com\'erano: <b>' + esc(campi.map(function(k){ return CAMPI_IT[k] || k; }).join(', ')) + '</b>. Le altre modifiche successive restano.';
  if(!(await conferma('Ripristinare?', testo, 'Ripristina'))) return;
  try{
    if(r.azione === 'eliminazione'){
      if(tab === 'menu_voci' && !catDi(prima.categoria_id)) throw new Error('la sua categoria non esiste più: ripristina prima quella');
      if(tab === 'menu_categorie' && !sezDi(prima.sezione_id)) throw new Error('la sua sezione non esiste più: ripristina prima quella');
      await api('rpc/menu_ripristina', { method: 'POST', body: { p_storico: r.id } }); // ricrea anche allergeni, varianti e fasce della voce
    }else{
      var corpo = {}; campi.forEach(function(k){ corpo[k] = prima[k] === undefined ? null : prima[k]; });
      var filtro = tab === 'menu_voci_allergeni' ? 'voce_id=eq.' + prima.voce_id + '&allergene_id=eq.' + prima.allergene_id : 'id=eq.' + prima.id;
      await api(tab + '?' + filtro, { method: 'PATCH', prefer: 'return=minimal', body: corpo });
    }
    toast('✓ Ripristinato'); await carica(); apriStorico();
  }catch(e){ toast('⚠️ Non ripristinato: ' + e.message, { durata: 6000 }); }
}

/* esportazione */
function esportaCSV(){
  var nomiAll = {}; D.allergeni.forEach(function(a){ nomiAll[a.id] = a; });
  function q(x){ x = x == null ? '' : String(x); return /[";\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
  var righe = [['Sezione', 'Categoria', 'Voce', 'Descrizione', 'Prezzo €', 'Varianti', 'Allergeni', 'Caratteristiche', 'Allergeni verificati', 'Etichette', 'Stato', 'Foto', 'Nome EN', 'Disponibilità']];
  D.sezioni.slice().sort(function(a, b){ return a.ordine - b.ordine; }).forEach(function(s){ catDiSez(s.id).forEach(function(c){ vociDiCat(c.id).forEach(function(v){
    var al = allergeniDi(v.id).map(function(l){ return nomiAll[l.allergene_id]; }).filter(Boolean);
    righe.push([s.nome, c.nome, v.nome, v.descrizione, ((v.prezzo_cent || 0) / 100).toFixed(2).replace('.', ','),
      variantiDi(v.id).map(function(x){ return x.nome + ' +' + (x.delta_cent / 100).toFixed(2).replace('.', ','); }).join(' | '),
      al.filter(function(a){ return a.tipo === 'allergene'; }).map(function(a){ return a.nome; }).join(', '), al.filter(function(a){ return a.tipo !== 'allergene'; }).map(function(a){ return a.nome; }).join(', '),
      v.allergeni_verificati_il ? dataIt(v.allergeni_verificati_il) : 'no', (v.badge || []).join(', '), STATI[v.stato][0], v.foto_path ? 'sì' : 'no', v.nome_en, dispDi('voce_id', v.id).map(descDisp).join(' | ')]);
  }); }); });
  var csv = '﻿' + righe.map(function(r){ return r.map(q).join(';'); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'menu_ceraldi_' + oggiISO() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('✓ ' + (righe.length - 1) + ' voci esportate');
}

document.getElementById('appVer').textContent = 'v' + APP_VERSION;
misuraHeader();
_authAvvio();
</script>
