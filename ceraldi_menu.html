<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ceraldi Menu</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu">
<style>
/* ══════════════════════════════════════════════════════════════════
   DESIGN SYSTEM CERALDI — identico a Ceraldi Fatture (Primanota.html):
   stessi colori di sistema iOS, stesso font Inter, stessi raggi, stessa
   intestazione con marchio disegnato e stessa barra in basso.
   ══════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#F2F2F7;--surface:#FFF;--surface2:#F2F2F7;--surface3:#E5E5EA;
  --ink:#000;--ink2:#3C3C43;--ink3:#8E8E93;--sep:#C6C6C8;--sep2:rgba(60,60,67,.12);
  --blue:#007AFF;--blue-light:#E8F0FE;
  --green:#34C759;--green-ink:#1a7a3a;--green-light:#E8F8ED;
  --red:#FF3B30;--red-light:#FFF0EF;
  --orange:#FF9500;--orange-ink:#b36a00;--orange-light:#FFF4E0;
  --purple:#5E5CE6;--purple-light:#EEEDFC;
  --radius:13px;--radius-sm:10px;
  --shadow:0 2px 8px rgba(0,0,0,.07);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-ios:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--surface3:#3A3A3C;
  --ink:#FFF;--ink2:#EBEBF5;--ink3:#8E8E93;--sep:#38383A;--sep2:rgba(255,255,255,.1);
  --blue:#0A84FF;--blue-light:#0A2540;
  --green:#30D158;--green-ink:#30D158;--green-light:#0E2E18;
  --red:#FF453A;--red-light:#3A0E0C;
  --orange:#FF9F0A;--orange-ink:#FF9F0A;--orange-light:#3A2A0A;
  --purple:#7D7AFF;--purple-light:#211F45;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + var(--safe-b));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
.hidden{display:none!important}

/* ── Intestazione ── */
.ios-header{background:linear-gradient(180deg,rgba(230,238,255,.85) 0%,rgba(242,242,247,.94) 65%);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(60,60,67,.18);padding:calc(14px + var(--safe-t)) 16px 12px;position:sticky;top:0;z-index:100;overflow:hidden}
html[data-theme="dark"] .ios-header{background:rgba(28,28,30,.92);border-bottom-color:rgba(255,255,255,.1)}
.ios-header::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,122,255,.16) 0%,transparent 70%);pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:11px;position:relative;z-index:1;padding-right:132px}
.app-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(70,90,230,.3),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.15);animation:markIn .7s var(--ease-spring) both}
@keyframes markIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
.ios-header h1{font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.05}
.ios-header .hdr-row p{font-size:12.5px;color:var(--ink3);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ver{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:99px;background:rgba(120,120,128,.14);font-size:10px;font-weight:600;letter-spacing:.2px;vertical-align:1px;font-variant-numeric:tabular-nums}
.hdr-actions{position:absolute;top:50%;right:14px;transform:translateY(-50%);display:flex;align-items:center;gap:8px;z-index:2;margin-top:calc(var(--safe-t)/2)}
.hdr-btn{width:36px;height:36px;border-radius:50%;border:.5px solid rgba(60,60,67,.12);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .2s var(--ease-spring);position:relative}
.hdr-btn:active{transform:scale(.88)}
html[data-theme="dark"] .hdr-btn{background:rgba(58,58,60,.6);border-color:rgba(255,255,255,.08)}
.hdr-btn svg.spin{animation:hdrSpin .9s var(--ease-out)}
@keyframes hdrSpin{to{transform:rotate(360deg)}}
.dot-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

/* ── Barra in basso ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(200%) blur(24px);-webkit-backdrop-filter:saturate(200%) blur(24px);border-top:1px solid rgba(0,0,0,.08);display:flex;padding:8px 4px calc(10px + var(--safe-b));z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.06)}
html[data-theme="dark"] .tab-bar{background:rgba(18,18,18,.96);border-top-color:rgba(255,255,255,.1)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border:none;background:none;position:relative;min-width:0}
.tab-ico{width:24px;height:24px;color:var(--ink3);transition:transform .18s;display:block}
.tab-ico svg{width:24px;height:24px}
.tab-lbl{font-size:10px;font-weight:500;color:var(--ink3);white-space:nowrap}
.tab-item.active .tab-ico{color:var(--blue);animation:tabPop .45s var(--ease-spring);transform:scale(1.08)}
.tab-item.active .tab-lbl{color:var(--blue);font-weight:700}
.tab-item.active::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--blue);border-radius:0 0 3px 3px}
@keyframes tabPop{0%{transform:scale(.8)}100%{transform:scale(1.08)}}
.tab-badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ── Schermate ── */
.view{display:none;padding:14px 16px 24px}
.view.active{display:block;animation:viewIn .38s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title:first-child{margin-top:4px}
.sec-title .lnk{text-transform:none;letter-spacing:0;font-size:13px;color:var(--blue);background:none;border:none;font-weight:600}
.home-sec{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.home-sec-t{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.home-sec-t::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,#0A84FF,#5E5CE6)}

/* ── Ricerca ── */
.sw{position:relative;margin-bottom:10px}
.sw input{width:100%;padding:11px 38px 11px 40px;border:none;border-radius:99px;font-size:16px;background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);-webkit-appearance:none;appearance:none}
.sw input:focus{outline:none;box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.sw .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;display:flex}
.sw .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--surface3);color:var(--ink3);font-size:13px;display:none;align-items:center;justify-content:center}
.sw.has .sx{display:flex}
.sticky-tools{position:sticky;top:var(--hdr-h,64px);z-index:50;background:var(--bg);margin:-14px -16px 0;padding:10px 16px 2px}

/* ── Selettore segmentato e chip ── */
.seg{display:flex;background:var(--surface3);border-radius:11px;padding:3px;gap:3px;margin-bottom:10px}
html[data-theme="dark"] .seg{background:var(--surface2)}
.seg-b{flex:1;min-width:0;padding:8px 4px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg-b.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
html[data-theme="dark"] .seg-b.active{background:var(--surface3)}
.seg-b .n{font-variant-numeric:tabular-nums;color:var(--blue);margin-left:4px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:6px 12px;border:1px solid var(--sep2);border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.sez{margin:10px 0}.sez-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border-radius:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.sez.aperta .sez-hd{border-radius:14px 14px 0 0;box-shadow:inset 0 -1px 0 var(--sep)}.sez-chev{width:14px;color:var(--ink3);font-size:13px}.sez-t{flex:1;font-weight:700;font-size:14.5px;color:var(--ink)}
.sez-n{min-width:22px;padding:2px 8px;border-radius:99px;background:var(--blue-light);color:var(--blue);font-size:12.5px;font-weight:700;text-align:center}.sez-x .lnk{font-size:12.5px}
.sez-bd{padding:8px 0 2px}.massa{background:var(--surface);border:1px dashed var(--sep2);border-radius:12px;padding:10px 12px;margin:0 0 10px}.massa-t{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.chip .n{font-size:11.5px;font-weight:700;color:var(--ink3)}
.chip.active .n{color:rgba(255,255,255,.85)}

/* ── Gruppi in stile Impostazioni iOS ── */
.grp{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--sep2);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;font-size:15px;color:var(--ink)}
.row:last-child{border-bottom:none}
button.row:active{background:var(--surface2)}
.row-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:15px;line-height:1.25}
.row-s{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.35}
.row-r{flex-shrink:0;text-align:right;font-size:14px;color:var(--ink3)}
.chev{color:var(--ink3);font-size:18px;flex-shrink:0;margin-left:2px}
.ic-b{background:var(--blue-light);color:var(--blue)}.ic-g{background:var(--green-light);color:var(--green-ink)}.ic-o{background:var(--orange-light);color:var(--orange-ink)}.ic-r{background:var(--red-light);color:var(--red)}.ic-p{background:var(--purple-light);color:var(--purple)}

/* ── Righe prodotto ── */
.pr{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;display:flex;align-items:stretch;overflow:hidden;transition:box-shadow .15s}
.pr.on{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.pr-stripe{width:4px;flex-shrink:0;background:transparent}
.pr.on .pr-stripe{background:var(--blue)}
.pr-main{flex:1;min-width:0;padding:11px 10px 11px 10px}
.pr-name{font-size:14.5px;font-weight:700;line-height:1.28;word-break:break-word}
.pr-name mark{background:rgba(0,122,255,.14);color:inherit;border-radius:3px;padding:0 1px}
.pr-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.pr-orig{font-size:11.5px;color:var(--ink2);margin-top:2px;word-break:break-word;line-height:1.3}.pr-orig i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase;margin-right:4px}
.pr-res{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:0}
.pr-side{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 8px 4px;gap:3px}
.pr-side label{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.num-in{width:66px;text-align:center;padding:9px 4px;border:1.5px solid var(--sep);border-radius:10px;background:var(--surface2);font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.num-in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.14);background:var(--surface)}
.num-in.filled{border-color:var(--blue);background:var(--blue-light)}
.num-in.err{border-color:var(--red);background:var(--red-light)}

/* ── Badge ── */
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bdg.r{background:var(--red-light);color:var(--red)}
.bdg.g{background:var(--green-light);color:var(--green-ink)}
.bdg.o{background:var(--orange-light);color:var(--orange-ink)}
.bdg.b{background:var(--blue-light);color:var(--blue)}
.bdg.p{background:var(--purple-light);color:var(--purple)}
.bdg.n{background:var(--surface2);color:var(--ink3)}

/* ── Contatore +/- ── */
.stp{display:inline-flex;align-items:center;background:var(--surface2);border-radius:99px;padding:2px;gap:2px}
.stp button{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface);color:var(--blue);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .stp button{background:var(--surface3)}
.stp button:active{transform:scale(.9)}
.stp b{min-width:30px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.stp b.tq{cursor:pointer;border-radius:6px;padding:2px 4px;text-decoration:underline dotted;text-underline-offset:3px}

/* ── Pulsanti ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;text-align:center;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-s{background:var(--surface2);color:var(--blue)}
html[data-theme="dark"] .btn-s{background:var(--surface3)}
.btn-d{background:var(--red-light);color:var(--red)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.btn-sm{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:8px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap}
html[data-theme="dark"] .btn-sm{background:var(--surface3)}
.btn-sm.p{background:var(--blue-light);color:var(--blue)}
.btn-sm.g{background:var(--green-light);color:var(--green-ink)}
.btn-sm.o{background:var(--orange-light);color:var(--orange-ink)}
.btn-sm.r{background:var(--red-light);color:var(--red)}
.btn-sm:active{opacity:.7}
html[data-theme="dark"] .btn-sm.p{background:var(--blue-light)}html[data-theme="dark"] .btn-sm.g{background:var(--green-light)}html[data-theme="dark"] .btn-sm.o{background:var(--orange-light)}html[data-theme="dark"] .btn-sm.r{background:var(--red-light)}
.lnk-btn{background:none;border:none;color:var(--blue);font-size:14px;font-weight:600;padding:6px}

/* ── Campi ── */
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px}
.inp{width:100%;padding:12px 13px;border:1.5px solid var(--sep);border-radius:var(--radius-sm);font-size:16px;color:var(--ink);background:var(--surface);-webkit-appearance:none;appearance:none}
textarea.inp{resize:none;line-height:1.4}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.hint{font-size:12px;color:var(--ink3);line-height:1.4;margin-top:5px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0}
.tgl{position:relative;width:51px;height:31px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl span{position:absolute;inset:0;background:var(--surface3);border-radius:99px;transition:background .2s}
.tgl span::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease-spring)}
.tgl input:checked+span{background:var(--green)}
.tgl input:checked+span::after{transform:translateX(20px)}

/* ── Fogli a comparsa (bottom sheet) ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeBg .25s ease}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:sheetUp .42s var(--ease-ios);overflow:hidden}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:.5px solid var(--sep2);flex-shrink:0;background:var(--bg)}
.sheet-hd h3{font-size:18px;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet-hd .sub{font-size:12.5px;color:var(--ink3);font-weight:500;margin-top:2px}
.sheet-x{background:var(--surface3);border:none;border-radius:99px;width:30px;height:30px;font-size:16px;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="dark"] .sheet-x{background:var(--surface2)}
.sheet-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 18px;overscroll-behavior:contain}
.sheet-ft{flex-shrink:0;padding:12px 16px calc(12px + var(--safe-b));border-top:.5px solid var(--sep2);background:var(--bg)}
.sheet-back{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--blue);font-size:16px;font-weight:500;padding:0}

/* ── Notifica breve ── */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(16px);background:rgba(0,0,0,.85);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:all .25s var(--ease-out);z-index:30000;pointer-events:none;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:none;color:#5AC8FA;font-weight:700;font-size:14px;padding:0 2px;white-space:nowrap}

/* ── Stato vuoto, avvisi, varie ── */
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty .ei{font-size:44px;margin-bottom:10px;opacity:.45}

.fbar{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:190;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:16px;background:var(--blue);color:#fff;border:none;box-shadow:0 10px 30px -6px rgba(0,122,255,.55);animation:fbarIn .45s var(--ease-spring);max-width:560px;margin:0 auto;text-align:left}

/* ── Registro errori ─────────────────────────────────────────────── */
(function(){
  var KEY = APP.key + '_errori_log', MAX = 60, inviati = {}, nInviati = 0;
  function leggi(){ try{ var a = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function scrivi(a){ try{ localStorage.setItem(KEY, JSON.stringify(a.slice(-MAX))); }catch(e){} }
  window._registraErrore = function(tipo, msg, det){
    try{
      msg = String(msg || '').slice(0, 500); det = String(det || '').slice(0, 1500);
      var a = leggi(), ult = a[a.length - 1];

      if(ult && ult.msg === msg){ ult.n = (ult.n || 1) + 1; ult.t = v.t; } else a.push(v);

    }catch(e){}
  };

  window._svuotaErrori = function(){ scrivi([]); };
  window.addEventListener('error', function(e){
    if(e && e.target && e.target !== window && e.target.nodeType === 1){
      var src = e.target.src || e.target.href || '';
      if(src && src !== location.href) _registraErrore('risorsa', 'Risorsa non caricata: ' + String(src).slice(0, 180));

  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; _registraErrore('promessa', r && r.message ? r.message : String(r), r && r.stack ? r.stack.split('\n').slice(0, 5).join(' | ') : '');

})();

/* ── Utilità ─────────────────────────────────────────────────────── */
function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function eur(n){ n = Number(n) || 0; return '€ ' + n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function eur0(n){ n = Number(n) || 0; return '€ ' + n.toLocaleString('it-IT', { maximumFractionDigits: 0 }); }
function num(v){ if(v == null || v === '') return null; var n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : n; }
function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function oggiISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataIt(iso, conOra){
  if(!iso) return '';
  var d = new Date(iso); if(isNaN(d)) return String(iso);
  var s = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  if(conOra) s += ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return s;
}
function quando(iso){
  if(!iso) return '';
  var d = new Date(iso), ora = new Date(), diff = (ora - d) / 1000, hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if(diff < 60) return 'adesso';
  if(diff < 3600) return Math.floor(diff / 60) + ' min fa';
  if(d.toDateString() === ora.toDateString()) return 'oggi ' + hm;
  var ieri = new Date(ora); ieri.setDate(ora.getDate() - 1);
  if(d.toDateString() === ieri.toDateString()) return 'ieri ' + hm;
  if(diff < 6 * 86400) return d.toLocaleDateString('it-IT', { weekday: 'long' }) + ' ' + hm;
  return dataIt(iso);
}
function debounce(fn, ms){ var t; return function(){ var a = arguments, s = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(s, a); }, ms); }; }
function evidenzia(testo, q){
  var t = String(testo || ''); if(!q) return esc(t);
  var parole = norm(q).split(' ').filter(function(p){ return p.length > 0; });
  var up = t.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  // l'indice si calcola sul testo senza accenti ma con la stessa lunghezza
  var segni = new Array(t.length).fill(false);
  parole.forEach(function(p){ var i = up.indexOf(p); while(i >= 0){ for(var k = i; k < i + p.length && k < t.length; k++) segni[k] = true; i = up.indexOf(p, i + p.length); } });
  var out = '', aperto = false;
  for(var i = 0; i < t.length; i++){
    if(segni[i] && !aperto){ out += '<mark>'; aperto = true; }
    if(!segni[i] && aperto){ out += '</mark>'; aperto = false; }
    out += esc(t[i]);
  }
  if(aperto) out += '</mark>';
  return out;
}
function cercaTutte(nome, q){ if(!q) return true; var n = norm(nome); return norm(q).split(' ').every(function(p){ return n.indexOf(p) >= 0; }); }

/* ── Notifica breve (con eventuale "Annulla") ────────────────────── */

  opz = opz || {};

}

/* ── Fogli a comparsa ────────────────────────────────────────────── */
var _sheetStack = [];
function apriSheet(id, opz){
  chiudiSheet(id, true);
  var mo = document.createElement('div');
  mo.className = 'mo'; mo.id = id; mo.setAttribute('role', 'dialog'); mo.setAttribute('aria-modal', 'true');
  mo.innerHTML = '<div class="sheet"' + (opz.alto ? ' style="height:92dvh"' : '') + '>' +
    '<div class="sheet-hd"><div style="min-width:0">' + (opz.indietro ? '<button class="sheet-back" data-back>‹ ' + esc(opz.indietro) + '</button>' : '') +
    '<h3>' + esc(opz.titolo || '') + '</h3>' + (opz.sotto ? '<div class="sub">' + opz.sotto + '</div>' : '') + '</div>' +
    '<button class="sheet-x" data-x aria-label="Chiudi">✕</button></div>' +
    '<div class="sheet-bd">' + (opz.corpo || '') + '</div>' +
    (opz.piede ? '<div class="sheet-ft">' + opz.piede + '</div>' : '') + '</div>';
  mo.addEventListener('click', function(e){ if(e.target === mo && !opz.bloccato) chiudiSheet(id); });
  mo.querySelector('[data-x]').onclick = function(){ chiudiSheet(id); };
  var b = mo.querySelector('[data-back]'); if(b) b.onclick = function(){ chiudiSheet(id); if(opz.onIndietro) opz.onIndietro(); };
  mo._onChiudi = opz.onChiudi || null;
  document.body.appendChild(mo);
  document.body.style.overflow = 'hidden';
  _sheetStack.push(id);
  return mo;
}
function chiudiSheet(id, silenzioso){
  var el = document.getElementById(id); if(!el) return;
  var cb = el._onChiudi; el.remove();
  _sheetStack = _sheetStack.filter(function(x){ return x !== id; });
  if(!document.querySelector('.mo')) document.body.style.overflow = '';
  if(cb && !silenzioso) try{ cb(); }catch(e){}
}
function corpoSheet(id){ var el = document.getElementById(id); return el ? el.querySelector('.sheet-bd') : null; }
function piedeSheet(id){ var el = document.getElementById(id); return el ? el.querySelector('.sheet-ft') : null; }
// Conferma in stile iOS (niente confirm() nativo, bloccato in alcune PWA)
function conferma(titolo, testo, etichetta, pericolo){
  return new Promise(function(ok){
    var id = 'cfm' + uid();
    apriSheet(id, { titolo: titolo, corpo: '<p style="font-size:15px;line-height:1.5;color:var(--ink2)">' + testo + '</p>',
      piede: '<div class="btn-row"><button class="btn btn-s" data-no>Annulla</button><button class="btn ' + (pericolo ? 'btn-d' : 'btn-p') + '" data-si>' + esc(etichetta || 'Conferma') + '</button></div>',
      onChiudi: function(){ ok(false); } });
    var el = document.getElementById(id);
    el.querySelector('[data-no]').onclick = function(){ chiudiSheet(id); };
    el.querySelector('[data-si]').onclick = function(){ el._onChiudi = null; chiudiSheet(id); ok(true); };
  });
}
function chiediTesto(titolo, etichetta, valore, segnaposto){
  return new Promise(function(ok){
    var id = 'ask' + uid();
    apriSheet(id, { titolo: titolo, corpo: '<div class="field"><label>' + esc(etichetta) + '</label><input class="inp" id="' + id + 'v" value="' + esc(valore || '') + '" placeholder="' + esc(segnaposto || '') + '"></div>',
      piede: '<div class="btn-row"><button class="btn btn-s" data-no>Annulla</button><button class="btn btn-p" data-si>OK</button></div>',
      onChiudi: function(){ ok(null); } });
    var el = document.getElementById(id), inp = document.getElementById(id + 'v');
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 80);
    function fatto(){ var v = inp.value.trim(); el._onChiudi = null; chiudiSheet(id); ok(v); }
    inp.onkeydown = function(e){ if(e.key === 'Enter') fatto(); };
    el.querySelector('[data-no]').onclick = function(){ chiudiSheet(id); };
    el.querySelector('[data-si]').onclick = fatto;
  });
}

/* ── Tema chiaro / scuro / automatico ────────────────────────────── */
function temaScelto(){ return lsGet(APP.key + '_tema', 'auto'); }
function applicaTema(){

/* ══════════════════════════════════════════════════════════════════
   ACCESSO — stesso account di Fatture e Presenze. I permessi arrivano
   da ceraldi_mio_accesso: senza il permesso di questa app non si entra.
   ══════════════════════════════════════════════════════════════════ */
var _authSess = null, _authRefreshInCorso = null, _authCfg = null, _authAppAvviata = false;
var ACC = null; // { stato, ruolo, nome, permessi, livello, admin, lettura }
function _authLeggi(){
  var s = lsGet(APP.authKey, null);
  if(!s && APP.oldAuthKey){
    // Sessione della versione precedente dell'app: la riprendo per non far rifare il login
    var o = lsGet(APP.oldAuthKey, null);
    if(o && o.access_token) s = { access_token: o.access_token, refresh_token: o.refresh_token, expires_at: o.expires_at, user: o.user ? { id: o.user.id, email: o.user.email } : null, metodo: 'password' };
  }
  return s;
}
function _authApplica(s){ _authSess = s; if(s) lsSet(APP.authKey, s); else lsDel(APP.authKey); }
function _authToken(){ return _authSess && _authSess.access_token ? _authSess.access_token : SB_KEY; }
function _authDaRisposta(j, prec){
  var ora = Math.floor(Date.now() / 1000);
  return { access_token: j.access_token, refresh_token: j.refresh_token || (prec && prec.refresh_token),
    expires_at: j.expires_at || (ora + (parseInt(j.expires_in, 10) || 3600)),
    user: j.user ? { id: j.user.id, email: j.user.email } : (prec && prec.user) || null,
    metodo: (prec && prec.metodo) || null };
}
async function _authPost(percorso, corpo){
  var r = await fetch(SB_URL + '/auth/v1/' + percorso, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify(corpo || {}) });
  var t = await r.text(), j = {}; try{ j = t ? JSON.parse(t) : {}; }catch(e){}
  if(!r.ok){ var e = new Error(j.error_description || j.msg || j.message || ('Errore ' + r.status)); e.status = r.status; e.codice = j.error_code || j.error || ''; throw e; }
  return j;
}
function _authErrore(e){
  var m = (e && e.message) || '', c = (e && e.codice) || '';
  if(/invalid login credentials|invalid_credentials/i.test(m + c)) return 'Email o password non corretti.';
  if(/otp_expired|expired/i.test(c) || /token has expired|is invalid/i.test(m)) return 'Codice scaduto o sbagliato. Richiedine uno nuovo.';
  if(/signups not allowed|user not found|otp_disabled/i.test(m + c)) return 'Questa email non è registrata. Chiedi a un amministratore di aggiungerti.';
  if(/rate limit|over_email_send_rate_limit/i.test(m + c)) return 'Troppe email inviate di recente. Riprova tra qualche minuto o usa la password.';
  if(/failed to fetch|network|load failed/i.test(m)) return 'Nessuna connessione. Controlla la rete e riprova.';
  return m || 'Qualcosa non è andato. Riprova.';
}
async function _authRefresh(){
  if(!_authSess || !_authSess.refresh_token) return false;
  if(_authRefreshInCorso) return _authRefreshInCorso;
  _authRefreshInCorso = (async function(){
    try{ var j = await _authPost('token?grant_type=refresh_token', { refresh_token: _authSess.refresh_token }); _authApplica(_authDaRisposta(j, _authSess)); return true; }
    catch(e){ if(e && e.status >= 400 && e.status < 500){ _authApplica(null); _authMostra('login', 'Sessione scaduta: accedi di nuovo.'); } return false; }
    finally{ _authRefreshInCorso = null; }
  })();
  return _authRefreshInCorso;
}
async function _authPronto(){ if(_authSess && (_authSess.expires_at || 0) - Math.floor(Date.now() / 1000) < 120) await _authRefresh(); }

/* api(percorso, opzioni) — percorso dopo /rest/v1/ (o 'rpc/...').
   Lancia SEMPRE un errore leggibile se il database rifiuta la richiesta. */
async function api(percorso, o){
  o = o || {};
  await _authPronto();
  var tentativo = 0;
  while(true){
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, o.timeout || 25000) : null;
    var h = { apikey: SB_KEY, Authorization: 'Bearer ' + _authToken() };
    if(o.body !== undefined) h['Content-Type'] = 'application/json';
    if(o.prefer) h.Prefer = o.prefer;
    var r;
    try{
      r = await fetch(SB_URL + '/rest/v1/' + percorso, { method: o.method || 'GET', headers: h,
        body: o.body === undefined ? undefined : (typeof o.body === 'string' ? o.body : JSON.stringify(o.body)), signal: ctrl ? ctrl.signal : undefined });
    }catch(err){
      if(timer) clearTimeout(timer);
      var e0 = new Error(err && err.name === 'AbortError' ? 'Il server non risponde (rete lenta?)' : 'Nessuna connessione'); e0.rete = true; throw e0;
    }
    if(timer) clearTimeout(timer);
    if((r.status === 401 || (r.status === 403 && tentativo === 0)) && _authSess && tentativo === 0){
      var txt401 = ''; try{ txt401 = await r.clone().text(); }catch(e){}
      if(r.status === 401 || /jwt|PGRST30/i.test(txt401)){ tentativo++; await _authRefresh(); continue; }
    }
    var t = await r.text(), j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = t; }
    if(!r.ok){
      var msg = (j && (j.message || j.hint || j.details)) || ('Errore ' + r.status);
      var e1 = new Error(msg); e1.status = r.status; e1.codice = j && j.code; e1.corpo = j; throw e1;
    }
    return j;
  }
}
// Tutte le righe di una tabella, a pagine (il server ne dà al massimo 1000 per volta)
async function apiTutte(percorso, pagina){
  pagina = pagina || 1000;
  var out = [], da = 0;
  while(true){
    var sep = percorso.indexOf('?') >= 0 ? '&' : '?';
    var righe = await api(percorso + sep + 'limit=' + pagina + '&offset=' + da);
    out = out.concat(righe || []);
    if(!righe || righe.length < pagina) break;
    da += pagina;
    if(da > 200000) break;
  }
  return out;
}
function erroreColonna(e){ return e && (e.codice === 'PGRST204' || e.codice === '42703' || /column|colonna/i.test(e.message || '')); }

async function inviaNotifica(titolo, testo, opz){
  opz = opz || {};
  try{
    await _authPronto();

var ANTEPRIMA_TPL = "<title>Menu Ceraldi Caffè<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link id=\"fontLink\" rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Jost:wght@400;500;600&display=swap\">\n<style>\n/* Layout «carta del salotto», v2 (26/10): copertina → sezioni come tavole fotografiche →\n   indice delle categorie (elenco verticale, tutto visibile) → pagina della categoria con\n   miniature accanto ai prodotti; foto grande solo per i prodotti «in evidenza».\n   Ogni colore è una variabile: il tema (globale → pagina principale/sezione → categoria) le ridefinisce a cascata. */\n:root{\n  --sfondo:#F3EFE8; --superficie:#FBF8F3; --testo:#23170F; --testo-2:#5F5045; --accento:#7A5C2C; --prezzo:#6E1A22;\n  --testata:#1E1410; --testata-testo:#F1E6D6;\n  --f-titoli:\"Bodoni Moda\", \"Didot\", \"Bodoni 72\", Georgia, serif;\n  --f-testo:\"Jost\", \"Futura\", \"Century Gothic\", \"Helvetica Neue\", Arial, sans-serif;\n  --scala:1;\n  color-scheme:light;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--sfondo);color:var(--testo);font:400 calc(1.0625rem*var(--scala))/1.55 var(--f-testo);-webkit-font-smoothing:antialiased}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--testata)}\nbutton{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--accento);outline-offset:3px}\n.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n.wrap{max-width:760px;margin:0 auto}\nh1,h2,h3,h4{font-family:var(--f-titoli);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}\n.occhiello{font:500 .75rem/1.3 var(--f-testo);letter-spacing:.18em;text-transform:uppercase;color:var(--accento)}\n.pagina{background:var(--sfondo);color:var(--testo);min-height:100dvh}\n.filetto{border-top:1px solid color-mix(in srgb,var(--testo) 12%,transparent)}\n\n/* ── Copertina e sezioni ── */\n.cop{position:relative;color:var(--testata-testo);background:var(--testata);overflow:hidden}\n.cop img.sfondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}\n.cop::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--testata) 30%,transparent) 0%,var(--testata) 96%)}\n.cop .in{position:relative;z-index:1;padding-block:44px 30px;display:grid;gap:14px;justify-items:start}\n.cop .logo{width:min(220px,58vw);height:auto;color:var(--testata-testo)}\n.cop .logo svg{width:100%;height:auto;display:block}\n.cop h1{font-size:calc(clamp(2.25rem,9vw,3.4rem)*var(--scala));line-height:1.02;font-style:italic;font-weight:400}\n.cop p{max-width:34ch;color:color-mix(in srgb,var(--testata-testo) 82%,transparent);font-size:calc(1rem*var(--scala));margin:0}\n.cop .info{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--testata-testo) 70%,transparent)}\n.home{padding-block:26px 40px;display:grid;gap:14px}\n.tavola{position:relative;display:grid;align-items:end;min-height:178px;border:0;padding:0;border-radius:4px;overflow:hidden;text-align:left;cursor:pointer;\n  background:var(--testata);color:var(--testata-testo);box-shadow:0 1px 0 color-mix(in srgb,var(--testo) 10%,transparent)}\n.tavola img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}\n.tavola::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,color-mix(in srgb,var(--testata) 88%,transparent) 100%)}\n.tavola .t{position:relative;z-index:1;padding:18px 18px 16px;display:grid;gap:2px}\n.tavola h2{font-size:calc(1.75rem*var(--scala));line-height:1.1}\n.tavola small{font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--testata-testo) 75%,transparent)}\n.tavola.senza-foto{background:var(--accento);min-height:120px}\n@media (hover:hover){.tavola:hover img{transform:scale(1.03)}}\n.nota{font-size:.875rem;color:var(--testo-2);line-height:1.5;padding:14px 0 0;margin:0}\n\n/* ── Barra in alto (sezione e categoria) ── */\n.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sfondo);color:var(--testo);border-bottom:1px solid color-mix(in srgb,var(--testo) 12%,transparent)}\n.barra .riga{display:flex;align-items:center;gap:6px;padding-block:8px}\n.indietro{border:0;background:transparent;display:inline-flex;align-items:center;gap:2px;padding:8px 10px 8px 0;color:var(--accento);cursor:pointer;font-size:.9375rem;white-space:nowrap}\n.indietro span{font-size:1.6rem;line-height:.6;margin-top:-2px}\n.barra .titolo{flex:1;min-width:0;display:grid}\n.barra .titolo small{font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accento);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.barra h2{font-size:calc(1.3rem*var(--scala));line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.btn-cat{flex:0 0 auto;border:1px solid color-mix(in srgb,var(--testo) 22%,transparent);background:var(--superficie);border-radius:99px;padding:8px 12px;font-size:.8125rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n.btn-cat svg{width:14px;height:14px}\n\n/* ── Indice delle categorie ── */\n.intesta{padding-block:20px 6px;display:grid;gap:4px}\n.intesta h2{font-size:calc(2.1rem*var(--scala));line-height:1.08}\n.cerca{position:relative;margin-block:14px 8px}\n.cerca input{width:100%;border:1px solid color-mix(in srgb,var(--testo) 18%,transparent);background:var(--superficie);color:var(--testo);border-radius:99px;padding:11px 16px 11px 40px;font:inherit;font-size:1rem}\n.cerca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--testo-2)}\n.filtri{display:flex;flex-wrap:wrap;gap:6px;padding-block:0 6px}\n.filtri button{border:1px dashed color-mix(in srgb,var(--testo) 28%,transparent);background:transparent;border-radius:99px;padding:5px 12px;font-size:.8125rem;color:var(--testo-2);cursor:pointer}\n.filtri button[aria-pressed=\"true\"]{border-style:solid;background:var(--accento);border-color:var(--accento);color:var(--superficie)}\n.indice{list-style:none;margin:8px 0 0;padding:0}\n.indice li+li{border-top:1px solid color-mix(in srgb,var(--testo) 12%,transparent)}\n.indice button{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;border:0;background:transparent;text-align:left;padding:12px 0;cursor:pointer}\n.indice .mini{width:56px;height:56px}\n.indice b{display:block;font:500 calc(1.25rem*var(--scala))/1.2 var(--f-titoli);color:var(--testo)}\n.indice small{color:var(--testo-2);font-size:.8125rem}\n.indice .freccia{color:var(--accento);font-size:1.5rem;line-height:1}\n.mini{width:84px;height:84px;border-radius:8px;object-fit:cover;background:color-mix(in srgb,var(--testo) 7%,transparent);flex:0 0 auto;display:block}\n.mini.vuota{display:grid;place-items:center;color:var(--accento);font:italic 500 1.4rem/1 var(--f-titoli)}\n.titoletto{font:500 .75rem/1.3 var(--f-testo);letter-spacing:.18em;text-transform:uppercase;color:var(--accento);margin:26px 0 10px}\n\n/* ── Prodotti ── */\n.prop{margin:22px 0 4px}\n.prop-pista{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}\n.prop-pista::-webkit-scrollbar{display:none}\n.prop-pista .scheda{flex:0 0 100%;scroll-snap-align:center}\n.prop.piu .prop-pista .scheda{flex-basis:88%}\n.prop-punti{display:flex;justify-content:center;gap:7px;margin-top:10px}\n.prop-punti i{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--testo) 22%,transparent);transition:background .2s,transform .2s}\n.prop-punti i.on{background:var(--accento);transform:scale(1.25)}\n.evidenza{display:grid;gap:14px;margin-top:6px}\n.scheda{display:grid;background:var(--superficie);border:0;padding:0;text-align:left;border-radius:6px;overflow:hidden;cursor:pointer;\n  box-shadow:0 1px 2px color-mix(in srgb,var(--testo) 8%,transparent),0 10px 26px -18px color-mix(in srgb,var(--testo) 45%,transparent)}\n.scheda img{width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;display:block}\n.scheda .c{padding:14px 16px 16px;display:grid;gap:6px}\n.scheda .stella{font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accento)}\n.scheda .testa{display:flex;align-items:baseline;gap:12px}\n.evidenza.due{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}\n.evidenza.due>.scheda:last-child:nth-child(odd){grid-column:1/-1}\n.evidenza.due .c{padding:10px 12px 12px;gap:4px}\n.evidenza.due .testa{flex-direction:column;align-items:flex-start;gap:4px}\n.evidenza.due h4{font-size:calc(1.1rem*var(--scala))}\n.evidenza.due .desc,.evidenza.due .etichette{display:none}\n.scheda h4{font-size:calc(1.4rem*var(--scala));line-height:1.15;flex:1;min-width:0;color:var(--testo)}\n.prezzo{font:600 calc(1.0625rem*var(--scala))/1 var(--f-testo);color:var(--prezzo);font-variant-numeric:tabular-nums;white-space:nowrap}\n.desc{color:var(--testo-2);font-size:calc(.96rem*var(--scala));line-height:1.5}\n.righe{list-style:none;margin:6px 0 0;padding:0}\n.righe li+li{border-top:1px solid color-mix(in srgb,var(--testo) 12%,transparent)}\n.voce{width:100%;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;border:0;background:transparent;text-align:left;padding:14px 0;cursor:pointer}\n.voce .t{display:grid;gap:4px;min-width:0}\n.voce h4{font-size:calc(1.15rem*var(--scala));line-height:1.25;color:var(--testo)}\n.voce .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.voce .prezzo{margin-top:2px}\n.etichette{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;letter-spacing:.03em;color:var(--accento)}\n.etichette span::before{content:\"· \";color:color-mix(in srgb,var(--testo) 30%,transparent)}\n.etichette span:first-child::before{content:\"\"}\n.finito{opacity:.5}\n.vuoto{padding:30px 0;color:var(--testo-2)}\n.prossima{width:100%;margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid color-mix(in srgb,var(--testo) 18%,transparent);background:var(--superficie);border-radius:6px;padding:14px 16px;text-align:left;cursor:pointer}\n.prossima small{display:block;font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accento)}\n.prossima b{font:500 calc(1.2rem*var(--scala))/1.2 var(--f-titoli)}\n.avviso{font-size:.875rem;line-height:1.5;color:var(--testo-2);border-top:1px solid color-mix(in srgb,var(--testo) 14%,transparent);padding-block:18px 40px;margin:24px 0 0}\n\n/* ── Fogli: dettaglio prodotto ed elenco categorie ── */\n.velo{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 55%,transparent);display:grid;align-items:end}\n.foglio{background:var(--superficie);color:var(--testo);max-height:92dvh;overflow:auto;border-radius:14px 14px 0 0;width:100%;max-width:760px;margin:0 auto;\n  padding-bottom:max(18px,env(safe-area-inset-bottom,0px));animation:sale .28s cubic-bezier(.22,1,.36,1)}\n@keyframes sale{from{transform:translateY(24px);opacity:.6}}\n.foglio .grande{width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;display:block}\n.foglio .c{padding:18px 20px;display:grid;gap:12px}\n.foglio .capo{display:flex;gap:16px;align-items:center}\n.foglio .capo .mini{width:120px;height:120px}\n.foglio h3{font-size:calc(1.9rem*var(--scala));line-height:1.08}\n.foglio .desc{font-size:calc(1.0625rem*var(--scala))}\n.chiudi{position:sticky;top:0;float:right;margin:10px 10px -46px 0;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--superficie) 85%,transpare /* ══════════════════════════════════════════════════════════════════
   CERALDI MENU — back office del menu digitale (0.2, 26/10/2026)
   Il cuore del menu: qui si creano e si curano sezioni, categorie e
   prodotti (foto, prezzi, allergeni, varianti, disponibilità, etichette),
   l'aspetto del menu per i clienti e le informazioni del locale.
   Entra solo l'amministratore; il database rifiuta comunque le modifiche
   di chiunque altro (RLS ceraldi_is_admin). Ogni modifica finisce nello
   storico (menu_storico) e si può recuperare.

// Solo admin, anche se in ceraldi_accessi non esiste ancora il permesso «menu»
async function _authControllaAccesso(){
  var a = await api('rpc/ceraldi_mio_accesso', { method: 'POST', body: {} });
  ACC = { stato: a.stato, ruolo: a.ruolo, nome: a.nome || '', permessi: a.permessi || {}, livello: 'completo',
    admin: a.ruolo === 'admin' && a.stato === 'attivo', lettura: false, id: a.id || null };
  // Chi ha il permesso «guida» (e non è amministratore) entra solo nella Guida di Napoli: il database lo limita comunque alle tabelle della guida
  ACC.soloGuida = !ACC.admin && a.stato === 'attivo' && !!(a.permessi || {}).guida;
  ACC.ok = ACC.admin || ACC.soloGuida;
  lsSet(APP.key + '_acc', ACC);
  return ACC;
}

function catAttiva(c){ var s = c && sezDi(c.sezione_id); return !!c && c.stato !== 'archiviato' && !!s && s.stato !== 'archiviato'; }
function attiva(v){ return v.stato !== 'archiviato' && catAttiva(catDi(v.categoria_id)); }
function visibileAlCliente(v){ var c = catDi(v.categoria_id), s = c && sezDi(c.sezione_id); return v.stato === 'pubblicato' && c && c.stato === 'pubblicato' && s && s.stato === 'pubblicato'; }
function esaurita(v){ return v.esaurito_fino && new Date(v.esaurito_fino) > new Date(); }
function inEvidenza(v){ if(!v.in_evidenza) return false; var o = oggiISO(); return (!v.evidenza_dal || v.evidenza_dal <= o) && (!v.evidenza_al || v.evidenza_al >= o); }
/* Foto: nel database si salva il percorso della MINIATURA («…-320.webp»). Se il nome contiene «-g-320»
   esiste anche la versione GRANDE («…-g-1200.webp»), che serve solo ai prodotti in evidenza e alle copertine delle sezioni. */
function haGrande(path){ return /-g-320\.(webp|jpg)$/.test(path || ''); }
function fotoUrl(path, tipo){
  if(!path) return '';
  if(/^https:\/\//.test(path)) return tipo === 'grande' ? '' : path;  // foto con indirizzo completo (es. file del sito)
  if(tipo === 'grande') return haGrande(path) ? FOTO_URL + path.replace(/-320\.(webp|jpg)$/, '-1200.$1') : '';
  return FOTO_URL + path;
}
function verificata(v){ return !!v.allergeni_verificati_il; }
function nomeTecnico(n){ return /⏳|\d+\s*\/\s*\d+\s*mi[nm]\b|\d+\s*min\b/i.test(n || ''); }
function config(){ return (D.modulo && D.modulo.configurazione) || {}; }
function tema(){ var a = config().aspetto; a = a && a.globale ? a : JSON.parse(JSON.stringify(TEMA_BASE)); ['home', 'sezioni', 'categorie', 'pagine'].forEach(function(k){ if(!a[k]) a[k] = {}; }); return a; }
function badgeDisponibili(){ return config().badge || ['Novità', 'Consigliato', 'Specialità della casa', 'Di stagione', 'Produzione propria']; }
function uidUtente(){ return (_authSess && _authSess.user && _authSess.user.id) || null; }
function fineGiornata(){ var d = new Date(); d.setDate(d.getDate() + 1); d.setHours(5, 0, 0, 0); return d.toISOString(); } // «finito per oggi» = fino alle 5 di domattina
function descDisp(r){
  var g = (r.giorni || []).length === 7 ? 'tutti i giorni' : (r.giorni || []).map(function(x){ return GIORNI_LUNGHI[x - 1]; }).join(', ');
  var o = r.dalle || r.alle ? ' dalle ' + String(r.dalle || '00:00').slice(0, 5) + ' alle ' + String(r.alle || '24:00').slice(0, 5) : '';
  var p = r.dal || r.al ? ' (' + (r.dal ? 'dal ' + dataIt(r.dal) : '') + (r.al ? ' al ' + dataIt(r.al) : '') + ')' : '';
  return g + o + p;
}

function vaiTab(t){

  document.querySelectorAll('.tab-item').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === t); });

}
function renderTab(t){

/* ── Controlli di qualità (usati da Home e dai filtri) ─────────────── */
function daFare(){
  var att = D.voci.filter(attiva), pub = att.filter(visibileAlCliente);
  var r = {
    allergeni: att.filter(function(v){ return !verificata(v); }),
    foto: pub.filter(function(v){ return !v.foto_path; }),
    nomi: att.filter(function(v){ return nomeTecnico(v.nome); }),
    prezzi: att.filter(function(v){ return !v.prezzo_cent && !variantiDi(v.id).length; }),
    alt: att.filter(function(v){ return v.foto_path && !(v.foto_alt || '').trim(); }),
    finite: att.filter(esaurita),
    grande: att.filter(function(v){ return v.in_evidenza && !haGrande(v.foto_path); })
  };
  r.totale = r.nomi.length + r.prezzi.length + r.alt.length + r.grande.length + (pub.length ? r.foto.length : 0);
  return r;
}

async function propSpegni(id){
  var v = voceDi(id); if(!v) return;
  try{ await api('menu_voci?id=eq.' + id, { method: 'PATCH', prefer: 'return=minimal', body: { proposta_giorno: false } }); v.proposta_giorno = false; renderHome(); toast('«' + v.nome + '» non è più proposta del giorno'); }
  catch(e){ toast('⚠️ Non salvato: ' + e.message); }
}
async function propSposta(id, dir){
  var l = D.voci.filter(function(x){ return x.proposta_giorno && x.stato !== 'archiviato'; }).sort(function(a, b){ return (a.proposta_ordine || 0) - (b.proposta_ordine || 0) || a.id - b.id; });
  var i = l.findIndex(function(x){ return x.id === id; }), j = i + dir; if(i < 0 || j < 0 || j >= l.length) return;
  var n = l.slice(); var tmp = n[i]; n[i] = n[j]; n[j] = tmp; var cambi = [];
  n.forEach(function(x, k){ var o = (k + 1) * 10; if(x.proposta_ordine !== o) cambi.push([x, o]); });
  cambi.forEach(function(c){ c[0].proposta_ordine = c[1]; }); renderHome();
  try{ for(var k = 0; k < cambi.length; k++) await api('menu_voci?id=eq.' + cambi[k][0].id, { method: 'PATCH', prefer: 'return=minimal', body: { proposta_ordine: cambi[k][1] } }); }
  catch(e){ toast('⚠️ Ordine non salvato: ' + e.message); await carica(); }
}

function aggiornaInfo(t){ var info = document.getElementById('vociInfo'); if(info) info.textContent = t; var sw = document.getElementById('swBox'); if(sw) sw.classList.toggle('has', !!V.q); }
function rigaVoce(v, conPosto, ord){
  var c = catDi(v.categoria_id), al = allergeniDi(v.id), vr = variantiDi(v.id), sotto = [], segni = '';
  if(conPosto && c) sotto.push(esc(c.nome));
  if(v.descrizione) sotto.push(esc(v.descrizione.length > 60 ? v.descrizione.slice(0, 60) + '…' : v.descrizione));
  if(vr.length) sotto.push(vr.length + (vr.length === 1 ? ' variante' : ' varianti'));
  sotto.push((verificata(v) ? '✅ ' : '⚠️ ') + (al.length ? al.length + (al.length === 1 ? ' allergene' : ' allergeni') : 'nessun allergene') + (verificata(v) ? '' : ' da verificare'));
  if(esaurita(v)) segni += '<span class="bdg n">Finito</span>';
  if(inEvidenza(v)) segni += '<span class="bdg p">★</span>';
  if(dispDi('voce_id', v.id).length) segni += '<span class="bdg p">🕘</span>';
  (v.badge || []).slice(0, 1).forEach(function(b){ segni += '<span class="bdg b">' + esc(b) + '</span>'; });
  var p = v.prezzo_cent ? prezzo(v.prezzo_cent) : (vr.length ? 'da ' + prezzo(Math.min.apply(null, vr.map(function(x){ return x.delta_cent; }))) : '<span style="color:var(--red)">—</span>');
  var frecce = ord ? '<span class="ord-b"><button aria-label="Sposta su" onclick="event.stopPropagation();spostaVoce(' + v.id + ',-1)"' + (ord.su ? '' : ' disabled') + '>↑</button><button aria-label="Sposta giù" onclick="event.stopPropagation();spostaVoce(' + v.id + ',1)"' + (ord.giu ? '' : ' disabled') + '>↓</button></span>' : '';
  return '<div class="row voce' + (v.stato === 'archiviato' ? ' arch' : '') + '" role="button" tabindex="0" onclick="apriVoce(' + v.id + ')" onkeydown="if(event.key===\'Enter\')apriVoce(' + v.id + ')">' + miniFoto(v.foto_path) +
    '<div class="row-main"><div class="row-t">' + evidenzia(v.nome, V.q.trim()) + '</div><div class="row-s">' + sotto.join(' · ') + '</div>' + (segni ? '<div class="segni">' + segni + '</div>' : '') + '</div>' +
    '<div class="row-r"><div class="tnum" style="font-weight:600">' + p + '</div>' + bdgStato(v.stato) + '</div>' + frecce + '</div>';
}

/* ── Ordinamento (scambia la posizione con la vicina) ──────────────── */
async function riordina(tabella, lista, id, dir){
  var i = lista.findIndex(function(x){ return x.id === id; }), j = i + dir;
  if(i < 0 || j < 0 || j >= lista.length) return;
  var nuova = lista.slice(); var t = nuova[i]; nuova[i] = nuova[j]; nuova[j] = t;
  var cambi = [];
  nuova.forEach(function(x, k){ var o = (k + 1) * 10; if(x.ordine !== o){ cambi.push([x, o]); } });
  cambi.forEach(function(c){ c[0].ordine = c[1]; }); renderTab(V.tab);
  try{ for(var k = 0; k < cambi.length; k++) await api(tabella + '?id=eq.' + cambi[k][0].id, { method: 'PATCH', prefer: 'return=minimal', body: { ordine: cambi[k][1] } }); }
  catch(e){ toast('⚠️ Ordine non salvato: ' + e.message); await carica(); }
}

function spostaCat(id, dir){ var c = catDi(id); riordina('menu_categorie', catDiSez(c.sezione_id).filter(function(x){ return V.archiviati || x.stato !== 'archiviato'; }), id, dir); }
function spostaSez(id, dir){ riordina('menu_sezioni', D.sezioni.filter(function(x){ return x.stato !== 'archiviato'; }).sort(function(a, b){ return a.ordine - b.ordine || a.id - b.id; }), id, dir).then(function(){ apriStruttura(); }); }

/* ── Pubblicazione in blocco di una categoria (con Annulla) ────────── */
async function pubblicaCategoria(cid){
  var c = catDi(cid), s = c && sezDi(c.sezione_id); if(!c) return;
  var bozze = vociDiCat(cid).filter(function(v){ return v.stato === 'bozza'; });
  var senzaVer = bozze.filter(function(v){ return !verificata(v); }).length, senzaPrezzo = bozze.filter(function(v){ return !v.prezzo_cent && !variantiDi(v.id).length; });
  var tecnici = bozze.filter(function(v){ return nomeTecnico(v.nome); });
  var ok = await conferma('Pubblicare «' + esc(c.nome) + '»?', 'Pubblico <b>' + bozze.length + ' voci</b> in bozza' + (s && s.stato !== 'pubblicato' ? ', la categoria e la sezione «' + esc(s.nome) + '»' : c.stato !== 'pubblicato' ? ' e la categoria' : '') + '.' +
    (senzaVer ? '<br><br>⚠️ ' + senzaVer + ' voci hanno allergeni non ancora verificati da te.' : '') +
    (senzaPrezzo.length ? '<br>⚠️ ' + senzaPrezzo.length + ' voci senza prezzo.' : '') + (tecnici.length ? '<br>⚠️ ' + tecnici.length + ' nomi con indicazioni interne (es. «⏳ min»).' : '') +
    '<br><br>Le voci archiviate restano archiviate.', 'Pubblica');
  if(!ok) return;
  try{
    var ids = bozze.map(function(v){ return v.id; });
    if(ids.length) await api('menu_voci?id=in.(' + ids.join(',') + ')', { method: 'PATCH', prefer: 'return=minimal', body: { stato: 'pubblicato' } });
    var catPrima = c.stato, sezPrima = s && s.stato;
    if(c.stato !== 'pubblicato') await api('menu_categorie?id=eq.' + cid, { method: 'PATCH', prefer: 'return=minimal', body: { stato: 'pubblicato' } });
    if(s && s.stato !== 'pubblicato') await api('menu_sezioni?id=eq.' + s.id, { method: 'PATCH', prefer: 'return=minimal', body: { stato: 'pubblicato' } });
    toast('✓ «' + c.nome + '» pubblicata', { azione: 'Annulla', onAzione: function(){ annullaPubblicazione(cid, ids, catPrima, s && s.id, sezPrima); } });
    await carica();
  }catch(e){ toast('⚠️ ' + e.message); _registraErrore('pubblicaCategoria', e.message); await carica(); }
}
async function annullaPubblicazione(cid, ids, catPrima, sid, sezPrima){
  try{
    if(ids.length) await api('menu_voci?id=in.(' + ids.join(',') + ')', { method: 'PATCH', prefer: 'return=minimal', body: { stato: 'bozza' } });
    if(catPrima !== 'pubblicato') await api('menu_categorie?id=eq.' + cid, { method: 'PATCH', prefer: 'return=minimal', body: { stato: catPrima } });
    if(sid && sezPrima !== 'pubblicato') await api('menu_sezioni?id=eq.' + sid, { method: 'PATCH', prefer: 'return=minimal', body: { stato: sezPrima } });
    toast('Pubblicazione annullata'); await carica();
  }catch(e){ toast('⚠️ ' + e.message); }
}

// Allinea le righe figlie (varianti, fasce) al contenuto della scheda
async function sincronizza(tabella, prima, dopo, campi){
  var tenuti = dopo.filter(function(x){ return x.id; }).map(function(x){ return x.id; });
  var via = prima.filter(function(x){ return tenuti.indexOf(x.id) < 0; }).map(function(x){ return x.id; });
  if(via.length) await api(tabella + '?id=in.(' + via.join(',') + ')', { method: 'DELETE', prefer: 'return=minimal' });
  for(var i = 0; i < dopo.length; i++){
    var x = dopo[i];
    if(x.id){
      var p = prima.find(function(y){ return y.id === x.id; }), diff = {};
      campi.forEach(function(k){ if(JSON.stringify(p && p[k] != null ? (k === 'dalle' || k === 'alle' ? String(p[k]).slice(0, 5) : p[k]) : null) !== JSON.stringify(x[k] != null ? x[k] : null)) diff[k] = x[k]; });
      if(Object.keys(diff).length) await api(tabella + '?id=eq.' + x.id, { method: 'PATCH', prefer: 'return=minimal', body: diff });
    }
  }
  var nuovi = dopo.filter(function(x){ return !x.id; }).map(function(x){ var o = Object.assign({}, x); delete o.id; return o; });
  if(nuovi.length) await api(tabella, { method: 'POST', prefer: 'return=minimal', body: nuovi });
}

/* ── FOTO: ridimensionate nel telefono, caricate nel bucket menu-foto ─
   Miniatura (lato corto 320 px, ~15 KB) sempre; versione grande (larghezza 1200 px, ~120 KB) solo
   quando serve: prodotti in evidenza e copertine delle sezioni. Così il menu resta leggero. */
var FOTO_MIN_GRANDE = 900; // larghezza minima dell'originale per avere una foto grande nitida
function _leggiImmagine(file){
  if(window.createImageBitmap) return createImageBitmap(file).catch(function(){ return _leggiConImg(file); });
  return _leggiConImg(file);
}
function _leggiConImg(file){
  return new Promise(function(ok, ko){ var u = URL.createObjectURL(file), i = new Image(); i.onload = function(){ ok(i); }; i.onerror = function(){ ko(new Error('Formato della foto non leggibile: usa JPG, PNG o WebP')); }; i.src = u; });
}
function _comprimi(img, l, q){
  return new Promise(function(ok){
    var W = img.width, H = img.height; l = Math.min(Math.round(l), W); var h = Math.round(H * l / W);
    var cv = document.createElement('canvas'); cv.width = l; cv.height = h;
    var cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, l, h);
    cv.toBlob(function(b){
      if(b && b.type === 'image/webp') return ok(b);
      cv.toBlob(function(j){ ok(j); }, 'image/jpeg', q + 0.04); // Safari: niente WebP → JPEG
    }, 'image/webp', q);
  });
}
async function preparaFoto(file){
  if(!/^image\//.test(file.type || 'image/')) throw new Error('Il file scelto non è una foto');
  if(file.size > 40 * 1024 * 1024) throw new Error('Foto troppo pesante (oltre 40 MB)');
  var img = await _leggiImmagine(file);
  if(img.width < 160 || img.height < 160) throw new Error('Foto troppo piccola (' + img.width + '×' + img.height + ' px)');
  var mini = await _comprimi(img, img.width * 320 / Math.min(img.width, img.height), 0.78); // lato corto 320 px
  if(!mini) throw new Error('Non riesco a preparare la foto');
  return { img: img, mini: mini, grande: null, ext: mini.type === 'image/webp' ? 'webp' : 'jpg', anteprima: URL.createObjectURL(file), w: img.width, h: img.height,
    adattaGrande: img.width >= FOTO_MIN_GRANDE,
    avviso: img.width < FOTO_MIN_GRANDE ? 'Foto di ' + img.width + ' px: va bene come miniatura, ma è troppo piccola per un prodotto in evidenza.' : '' };
}
async function _prendiGrande(f){
  if(!f.grande){ f.grande = await _comprimi(f.img, 1200, 0.8); if(!f.grande) throw new Error('Non riesco a preparare la foto grande'); }
  if(f.grande.size > 3 * 1024 * 1024) throw new Error('La foto grande supera 3 MB');
  return f.grande;
}
async function _carica(percorso, blob){
  var r = await fetch(SB_URL + '/storage/v1/object/menu-foto/' + percorso, { method: 'POST', body: blob,
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + _authToken(), 'Content-Type': blob.type, 'cache-control': 'max-age=31536000' } });
  if(!r.ok){ var t = ''; try{ t = (await r.json()).message; }catch(e){} throw new Error('caricamento foto non riuscito' + (t ? ': ' + t : ' (' + r.status + ')')); }
}
// Carica la miniatura e, se richiesto, la versione grande. Restituisce il percorso della miniatura da salvare.
async function caricaFoto(f, cartella, conGrande){
  await _authPronto();
  var base = cartella + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + (conGrande ? '-g' : '');
  if(conGrande) await _carica(base + '-1200.' + f.ext, await _prendiGrande(f));
  await _carica(base + '-320.' + f.ext, f.mini);
  return base + '-320.' + f.ext;
}

async function gVerificaOggi(){

}

    if(o.dal && o.al && o.dal > o.al){ toast('Nel periodo, «dal» deve venire prima di «al»'); return; } }

    accessibilita: document.getElementById('gAcc').value.trim() || null, note_interne: document.getElementById('gNote').value.trim() || null };
  /* se cambiano gli orari, tornano «da verificare» finché qualcuno non conferma sul sito ufficiale */
  var prima = l.id ? JSON.stringify(gOrari(l.id).map(gChiaveOrario)) : '[]', dopo = JSON.stringify(orari.map(gChiaveOrario));
  if(l.id && prima !== dopo && l.orari_stato === 'verificati') corpo.orari_stato = 'da_verificare';
  var ftL = gFotoLeggi('gF', 0); if(ftL.err){ toast(ftL.err); return; }
  Object.assign(corpo, ftL.v);

  if(vuolePubblicare) corpo.stato = l.stato === 'pubblicato' ? 'pubblicato' : 'bozza';   // si pubblica per ultimo, dopo fonti e orari
  var btn = document.getElementById('gSalva'); btn.disabled = true; btn.textContent = 'Salvo…';
  var id = l.id, passo = 'luogo';
  try{
    if(!ftL.vuota) corpo.foto_path = await gFotoCarica('gF', 'luoghi/' + (l.slug || gSlug(nome)));
    if(!id){ corpo.slug = gSlug(nome); corpo.ordine = (G.luoghi.reduce(function(m, x){ return Math.max(m, x.ordine || 0); }, 0)) + 10;
      var r = await api('guida_luoghi', { method: 'POST', prefer: 'return=representation', body: corpo }); id = r[0].id; GE.l = r[0]; }
    else await api('guida_luoghi?id=eq.' + id, { method: 'PATCH', prefer: 'return=minimal', body: corpo });
    passo = 'orari'; await gSincronizza('guida_orari', l.id ? gOrari(l.id) : [], orari.map(function(o, i){ return { id: o.id, luogo_id: id, giorni: o.giorni, dalle: o.chiuso ? null : o.dalle, alle: o.chiuso ? null : o.alle,
      ultimo_ingresso: o.chiuso ? null : (o.ultimo_ingresso || null), dal: o.dal || null, al: o.al || null, chiuso: !!o.chiuso, nota: (o.nota || '').trim() || null, ordine: (i + 1) * 10 }; }));
    passo = 'pagine da controllare'; await gSincronizza('guida_fonti_controllo', l.id ? gFonti(l.id) : [], GE.fonti.map(function(f){ return { id: f.id, luogo_id: id, url: f.url, tipo: f.tipo, ultimo_esito: f.ultimo_esito || 'nuova' }; }), ['url']);
    passo = 'fonti del racconto'; await gSincronizza('guida_affermazioni_fonti', l.id ? gAff(l.id) : [], GE.aff.map(function(a){ return { id: a.id, tabella: 'guida_luoghi', riga_id: id, affermazione: a.affermazione, fonte_titolo: a.fonte_titolo, fonte_url: a.fonte_url, verificata_il: a.verificata_il }; }), []);
    if(vuolePubblicare && corpo.stato !== 'pubblicato'){ passo = 'pubblicazione'; await api('guida_luoghi?id=eq.' + id, { method: 'PATCH', prefer: 'return=minimal', body: { stato: 'pubblicato' } }); }
    await caricaGuida(); chiudiSheet('shLg'); toast(vuolePubblicare ? '✓ Pubblicato' : '✓ Salvato'); renderGuida();
  }catch(e){
    _registraErrore('salvaLuogo/' + passo, e.message);
    btn.disabled = false; btn.textContent = 'Riprova';
    var m = /fonti delle affermazioni/.test(e.message) ? 'Per pubblicare aggiungi le fonti del racconto' : /pubblicabile/.test(e.message) ? 'Per pubblicare servono posizione, testo breve e sito ufficiale (se ha orari)' : e.message;
    toast('⚠️ ' + (passo === 'luogo' ? '' : 'Salvato in parte («' + passo + '» no): ') + m, { durata: 7000 });
    if(passo !== 'luogo'){ await caricaGuida(); renderGuida(); }
  }
}
function gChiaveOrario(o){ return [(o.giorni || []).slice().sort().join(','), tmp5(o.dalle), tmp5(o.alle), tmp5(o.ultimo_ingresso), o.dal || '', o.al || '', !!o.chiuso]; }
/* allinea le righe figlie: elimina le tolte, aggiunge le nuove, modifica le cambiate (campi = quelli confrontati; [] = mai modificate) */
async function gSincronizza(tab, prima, dopo, campi){
  var tenuti = dopo.filter(function(x){ return x.id; }).map(function(x){ return x.id; }), via = prima.filter(function(x){ return tenuti.indexOf(x.id) < 0; }).map(function(x){ return x.id; });
  if(via.length) await api(tab + '?id=in.(' + via.join(',') + ')', { method: 'DELETE', prefer: 'return=minimal' });
  var nuovi = dopo.filter(function(x){ return !x.id; }).map(function(x){ var c = Object.assign({}, x); delete c.id; return c; });
  if(nuovi.length) await api(tab, { method: 'POST', prefer: 'return=minimal', body: nuovi });
  for(var i = 0; i < dopo.length; i++){ var x = dopo[i]; if(!x.id) continue;
    var p = prima.find(function(y){ return y.id === x.id; }), ks = campi || Object.keys(x).filter(function(k){ return k !== 'id'; }), diff = {};
    ks.forEach(function(k){ var a = p ? p[k] : null, b = x[k]; if(/^(dalle|alle|ultimo_ingresso)$/.test(k)){ a = tmp5(a); b = tmp5(b); } if(JSON.stringify(a == null ? null : a) !== JSON.stringify(b == null ? null : b)) diff[k] = x[k]; });
    if(Object.keys(diff).length) await api(tab + '?id=eq.' + x.id, { method: 'PATCH', prefer: 'return=minimal', body: diff }); }
}

async function gFotoScelta(p, inp){

/* legge e controlla i campi della foto: restituisce { v: campi da salvare } oppure { err: messaggio } */
function gFotoLeggi(p, modo){
  var s = GFOTO[p] || {}, g = function(k){ var e = document.getElementById(p + k); return e ? e.value.trim() : ''; };
  if(!s.path && !s.blob){ var v0 = { foto_path: null, foto_alt: null, foto_didascalia: null, foto_autore: null, foto_licenza: null, foto_fonte_url: null }; if(modo){ v0.foto_permesso = null; } if(modo === 2){ v0.permesso_note = null; } return { v: v0, vuota: true }; }
  if(!g('Alt')) return { err: 'Scrivi cosa si vede nella foto' };
  if(!g('Aut')) return { err: 'Scrivi l’autore della foto' };
  if(!g('Lic')) return { err: 'Scrivi la licenza della foto' };
  var fonte = g('Fonte'); if(fonte && !/^https:\/\/[^\s]+\.[^\s]+/.test(fonte)) return { err: 'L’indirizzo della foto deve iniziare con https://' };

}

      else if(!uguale){ r.percorso = null; r.svolte = null; r.percorso_calcolato_il = null; r.minuti_dal_precedente = null; r.metri_dal_precedente = null; }
      prec = t.luogo_id; return r; });

      etichette: document.getElementById('giE').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean), stato: segValore('giStato') || 'bozza', distanza_m: metri || null, durata_min: minuti || null }, ft.v);

    var tenuti = righe.filter(function(r){ return r.id; }).map(function(r){ return r.id; }), via = prima.filter(function(x){ return tenuti.indexOf(x.id) < 0; }).map(function(x){ return x.id; });
