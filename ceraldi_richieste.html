<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Richieste — Caffetteria Ceraldi</title>
<link rel="manifest" href="manifest-richieste.webmanifest">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Richieste">
<link rel="apple-touch-icon" href="icon-richieste-192.png">
<style>
/* ══════════════════════════════════════════════════════════════════
   DESIGN SYSTEM CERALDI — identico a Ceraldi Fatture (Primanota.html):
   stessi colori di sistema iOS, stesso font Inter, stessi raggi, stessa
   intestazione con marchio disegnato e stessa barra in basso.
   ══════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#F2F2F7;--surface:#FFF;--surface2:#F2F2F7;--surface3:#E5E5EA;
  --ink:#000;--ink2:#3C3C43;--ink3:#8E8E93;--sep:#C6C6C8;--sep2:rgba(60,60,67,.12);
  --blue:#007AFF;--blue-light:#E8F0FE;
  --green:#34C759;--green-ink:#1a7a3a;--green-light:#E8F8ED;
  --red:#FF3B30;--red-light:#FFF0EF;
  --orange:#FF9500;--orange-ink:#b36a00;--orange-light:#FFF4E0;
  --purple:#5E5CE6;--purple-light:#EEEDFC;
  --radius:13px;--radius-sm:10px;
  --shadow:0 2px 8px rgba(0,0,0,.07);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-ios:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--surface3:#3A3A3C;
  --ink:#FFF;--ink2:#EBEBF5;--ink3:#8E8E93;--sep:#38383A;--sep2:rgba(255,255,255,.1);
  --blue:#0A84FF;--blue-light:#0A2540;
  --green:#30D158;--green-ink:#30D158;--green-light:#0E2E18;
  --red:#FF453A;--red-light:#3A0E0C;
  --orange:#FF9F0A;--orange-ink:#FF9F0A;--orange-light:#3A2A0A;
  --purple:#7D7AFF;--purple-light:#211F45;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + var(--safe-b));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
.hidden{display:none!important}

/* ── Intestazione ── */
.ios-header{background:linear-gradient(180deg,rgba(230,238,255,.85) 0%,rgba(242,242,247,.94) 65%);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(60,60,67,.18);padding:calc(14px + var(--safe-t)) 16px 12px;position:sticky;top:0;z-index:100;overflow:hidden}
html[data-theme="dark"] .ios-header{background:rgba(28,28,30,.92);border-bottom-color:rgba(255,255,255,.1)}
.ios-header::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,122,255,.16) 0%,transparent 70%);pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:11px;position:relative;z-index:1;padding-right:132px}
.app-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(70,90,230,.3),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.15);animation:markIn .7s var(--ease-spring) both}
@keyframes markIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
.ios-header h1{font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.05}
.ios-header .hdr-row p{font-size:12.5px;color:var(--ink3);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ver{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:99px;background:rgba(120,120,128,.14);font-size:10px;font-weight:600;letter-spacing:.2px;vertical-align:1px;font-variant-numeric:tabular-nums}
.hdr-actions{position:absolute;top:50%;right:14px;transform:translateY(-50%);display:flex;align-items:center;gap:8px;z-index:2;margin-top:calc(var(--safe-t)/2)}
.hdr-btn{width:36px;height:36px;border-radius:50%;border:.5px solid rgba(60,60,67,.12);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .2s var(--ease-spring);position:relative}
.hdr-btn:active{transform:scale(.88)}
html[data-theme="dark"] .hdr-btn{background:rgba(58,58,60,.6);border-color:rgba(255,255,255,.08)}
.hdr-btn svg.spin{animation:hdrSpin .9s var(--ease-out)}
@keyframes hdrSpin{to{transform:rotate(360deg)}}
.dot-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

/* ── Barra in basso ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(200%) blur(24px);-webkit-backdrop-filter:saturate(200%) blur(24px);border-top:1px solid rgba(0,0,0,.08);display:flex;padding:8px 4px calc(10px + var(--safe-b));z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.06)}
html[data-theme="dark"] .tab-bar{background:rgba(18,18,18,.96);border-top-color:rgba(255,255,255,.1)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border:none;background:none;position:relative;min-width:0}
.tab-ico{width:24px;height:24px;color:var(--ink3);transition:transform .18s;display:block}
.tab-ico svg{width:24px;height:24px}
.tab-lbl{font-size:10px;font-weight:500;color:var(--ink3);white-space:nowrap}
.tab-item.active .tab-ico{color:var(--blue);animation:tabPop .45s var(--ease-spring);transform:scale(1.08)}
.tab-item.active .tab-lbl{color:var(--blue);font-weight:700}
.tab-item.active::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--blue);border-radius:0 0 3px 3px}
@keyframes tabPop{0%{transform:scale(.8)}100%{transform:scale(1.08)}}
.tab-badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ── Schermate ── */
.view{display:none;padding:14px 16px 24px}
.view.active{display:block;animation:viewIn .38s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title:first-child{margin-top:4px}
.sec-title .lnk{text-transform:none;letter-spacing:0;font-size:13px;color:var(--blue);background:none;border:none;font-weight:600}
.home-sec{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.home-sec-t{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.home-sec-t::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,#0A84FF,#5E5CE6)}

/* ── Ricerca ── */
.sw{position:relative;margin-bottom:10px}
.sw input{width:100%;padding:11px 38px 11px 40px;border:none;border-radius:99px;font-size:16px;background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);-webkit-appearance:none;appearance:none}
.sw input:focus{outline:none;box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.sw .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;display:flex}
.sw .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--surface3);color:var(--ink3);font-size:13px;display:none;align-items:center;justify-content:center}
.sw.has .sx{display:flex}
.sticky-tools{position:sticky;top:var(--hdr-h,64px);z-index:50;background:var(--bg);margin:-14px -16px 0;padding:10px 16px 2px}

/* ── Selettore segmentato e chip ── */
.seg{display:flex;background:var(--surface3);border-radius:11px;padding:3px;gap:3px;margin-bottom:10px}
html[data-theme="dark"] .seg{background:var(--surface2)}
.seg-b{flex:1;min-width:0;padding:8px 4px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg-b.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
html[data-theme="dark"] .seg-b.active{background:var(--surface3)}
.seg-b .n{font-variant-numeric:tabular-nums;color:var(--blue);margin-left:4px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:6px 12px;border:1px solid var(--sep2);border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{font-size:11.5px;font-weight:700;color:var(--ink3)}
.chip.active .n{color:rgba(255,255,255,.85)}

/* ── Gruppi in stile Impostazioni iOS ── */
.grp{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--sep2);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;font-size:15px;color:var(--ink)}
.row:last-child{border-bottom:none}
button.row:active{background:var(--surface2)}
.row-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:15px;line-height:1.25}
.row-s{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.35}
.row-r{flex-shrink:0;text-align:right;font-size:14px;color:var(--ink3)}
.chev{color:var(--ink3);font-size:18px;flex-shrink:0;margin-left:2px}
.ic-b{background:var(--blue-light);color:var(--blue)}.ic-g{background:var(--green-light);color:var(--green-ink)}.ic-o{background:var(--orange-light);color:var(--orange-ink)}.ic-r{background:var(--red-light);color:var(--red)}.ic-p{background:var(--purple-light);color:var(--purple)}

/* ── Righe prodotto ── */
.pr{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;display:flex;align-items:stretch;overflow:hidden;transition:box-shadow .15s}
.pr.on{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.pr-stripe{width:4px;flex-shrink:0;background:transparent}
.pr.on .pr-stripe{background:var(--blue)}
.pr-main{flex:1;min-width:0;padding:11px 10px 11px 10px}
.pr-name{font-size:14.5px;font-weight:700;line-height:1.28;word-break:break-word}
.pr-name mark{background:rgba(0,122,255,.14);color:inherit;border-radius:3px;padding:0 1px}
.pr-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.pr-res{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:0}
.pr-side{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 8px 4px;gap:3px}
.pr-side label{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.num-in{width:66px;text-align:center;padding:9px 4px;border:1.5px solid var(--sep);border-radius:10px;background:var(--surface2);font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.num-in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.14);background:var(--surface)}
.num-in.filled{border-color:var(--blue);background:var(--blue-light)}
.num-in.err{border-color:var(--red);background:var(--red-light)}

/* ── Badge ── */
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bdg.r{background:var(--red-light);color:var(--red)}
.bdg.g{background:var(--green-light);color:var(--green-ink)}
.bdg.o{background:var(--orange-light);color:var(--orange-ink)}
.bdg.b{background:var(--blue-light);color:var(--blue)}
.bdg.p{background:var(--purple-light);color:var(--purple)}
.bdg.n{background:var(--surface2);color:var(--ink3)}

/* ── Contatore +/- ── */
.stp{display:inline-flex;align-items:center;background:var(--surface2);border-radius:99px;padding:2px;gap:2px}
.stp button{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface);color:var(--blue);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .stp button{background:var(--surface3)}
.stp button:active{transform:scale(.9)}
.stp b{min-width:30px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}

/* ── Pulsanti ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;text-align:center;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-s{background:var(--surface2);color:var(--blue)}
html[data-theme="dark"] .btn-s{background:var(--surface3)}
.btn-d{background:var(--red-light);color:var(--red)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.btn-sm{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:8px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap}
html[data-theme="dark"] .btn-sm{background:var(--surface3)}
.btn-sm.p{background:var(--blue-light);color:var(--blue)}
.btn-sm.g{background:var(--green-light);color:var(--green-ink)}
.btn-sm.o{background:var(--orange-light);color:var(--orange-ink)}
.btn-sm.r{background:var(--red-light);color:var(--red)}
.btn-sm:active{opacity:.7}
html[data-theme="dark"] .btn-sm.p{background:var(--blue-light)}html[data-theme="dark"] .btn-sm.g{background:var(--green-light)}html[data-theme="dark"] .btn-sm.o{background:var(--orange-light)}html[data-theme="dark"] .btn-sm.r{background:var(--red-light)}
.lnk-btn{background:none;border:none;color:var(--blue);font-size:14px;font-weight:600;padding:6px}

/* ── Campi ── */
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px}
.inp{width:100%;padding:12px 13px;border:1.5px solid var(--sep);border-radius:var(--radius-sm);font-size:16px;color:var(--ink);background:var(--surface);-webkit-appearance:none;appearance:none}
textarea.inp{resize:none;line-height:1.4}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.hint{font-size:12px;color:var(--ink3);line-height:1.4;margin-top:5px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0}
.tgl{position:relative;width:51px;height:31px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl span{position:absolute;inset:0;background:var(--surface3);border-radius:99px;transition:background .2s}
.tgl span::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease-spring)}
.tgl input:checked+span{background:var(--green)}
.tgl input:checked+span::after{transform:translateX(20px)}

/* ── Fogli a comparsa (bottom sheet) ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeBg .25s ease}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:sheetUp .42s var(--ease-ios);overflow:hidden}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:.5px solid var(--sep2);flex-shrink:0;background:var(--bg)}
.sheet-hd h3{font-size:18px;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet-hd .sub{font-size:12.5px;color:var(--ink3);font-weight:500;margin-top:2px}
.sheet-x{background:var(--surface3);border:none;border-radius:99px;width:30px;height:30px;font-size:16px;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="dark"] .sheet-x{background:var(--surface2)}
.sheet-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 18px;overscroll-behavior:contain}
.sheet-ft{flex-shrink:0;padding:12px 16px calc(12px + var(--safe-b));border-top:.5px solid var(--sep2);background:var(--bg)}
.sheet-back{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--blue);font-size:16px;font-weight:500;padding:0}

/* ── Notifica breve ── */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(16px);background:rgba(0,0,0,.85);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:all .25s var(--ease-out);z-index:30000;pointer-events:none;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:none;color:#5AC8FA;font-weight:700;font-size:14px;padding:0 2px;white-space:nowrap}

/* ── Stato vuoto, avvisi, varie ── */
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty .ei{font-size:44px;margin-bottom:10px;opacity:.45}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:4px}
.empty p{font-size:14px;line-height:1.45}
.banner{border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.banner.o{background:var(--orange-light);color:var(--orange-ink)}
.banner.b{background:var(--blue-light);color:var(--blue)}
.banner.r{background:var(--red-light);color:var(--red)}
.banner.g{background:var(--green-light);color:var(--green-ink)}
.banner b{font-weight:700}
.muted{color:var(--ink3)}
.tnum{font-variant-numeric:tabular-nums}
.spinner{width:22px;height:22px;border:2.5px solid var(--surface3);border-top-color:var(--blue);border-radius:50%;animation:hdrSpin .8s linear infinite;display:inline-block}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 0;color:var(--ink3);font-size:14px}

/* ── Barra flottante (lista/carrello) ── */
.fbar{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:190;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:16px;background:var(--blue);color:#fff;border:none;box-shadow:0 10px 30px -6px rgba(0,122,255,.55);animation:fbarIn .45s var(--ease-spring);max-width:560px;margin:0 auto;text-align:left}
@keyframes fbarIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.fbar:active{transform:scale(.98)}
.fbar .fb-n{min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.fbar .fb-t{flex:1;min-width:0}
.fbar .fb-t b{display:block;font-size:15px;font-weight:700}
.fbar .fb-t span{font-size:12px;opacity:.85}
.fbar .fb-go{font-size:22px;font-weight:300}
body.has-fbar{padding-bottom:calc(150px + var(--safe-b))}

/* ── Hero (riepiloghi) ── */
.hero{background:linear-gradient(160deg,#0B0B22 0%,#0E1240 48%,#13163A 100%);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px -14px rgba(14,18,64,.55)}
.hero::before{content:'';position:absolute;top:-70px;right:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.4) 0%,transparent 68%)}
.hero::after{content:'';position:absolute;bottom:-70px;left:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(94,92,230,.32) 0%,transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hero-big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-1.4px;line-height:1.05;margin-top:5px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:5px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.hero-stat{border-radius:13px;padding:9px 6px;text-align:center;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.08)}
.hero-stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.6px}

/* ── Schermata di accesso (identica a Fatture) ── */
#authGate{position:fixed;inset:0;z-index:20000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
#authGate .ag-box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:28px 22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
#authGate .ag-logo{width:56px;height:56px;border-radius:16px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center}
#authGate .ag-tit{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.5px}
#authGate .ag-sub{font-size:14px;color:var(--ink3);text-align:center;margin:-6px 0 8px}
#authGate .ag-btn{min-height:48px;border-radius:12px;border:none;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
#authGate .ag-btn:disabled{opacity:.55}
#authGate .ag-google{background:var(--surface);color:var(--ink);border:1px solid var(--sep)}
#authGate .ag-pri{background:var(--blue);color:#fff;margin-top:4px}
#authGate .ag-sec{background:var(--surface2);color:var(--ink)}
#authGate .ag-link{background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;padding:8px}
#authGate .ag-sep{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;margin:6px 0}
#authGate .ag-sep::before,#authGate .ag-sep::after{content:"";flex:1;height:1px;background:var(--sep)}
#authGate .ag-lbl{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:-4px}
#authGate .ag-in{min-height:46px;border-radius:12px;border:1px solid var(--sep);background:var(--surface2);color:var(--ink);padding:0 14px;font-size:16px;width:100%}
#authGate .ag-in:focus{outline:2px solid var(--blue);outline-offset:1px}
#authGate .ag-otp{letter-spacing:6px;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
#authGate .ag-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-top:4px}
#authGate .ag-tabs button{flex:1;min-height:36px;border:none;border-radius:8px;background:none;color:var(--ink2);font-size:14px;font-weight:600}
#authGate .ag-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#authGate .ag-nota{font-size:13px;color:var(--ink3);line-height:1.4}
#authGate .ag-msg{font-size:14px;color:var(--ink2);text-align:center;min-height:18px;line-height:1.4}
#authGate .ag-msg:empty{display:none}
#authGate .ag-neg{display:flex;flex-direction:column;gap:6px;text-align:center;font-size:14px;color:var(--ink2);line-height:1.45;margin:6px 0 8px}
#authGate .ag-neg b{color:var(--ink);font-size:16px}
#authGate .ag-attesa{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink3);font-size:14px;padding:16px 0}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

(function(){

/* ── Utilità ─────────────────────────────────────────────────────── */
function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function eur0(n){ n = Number(n) || 0; return '€ ' + n.toLocaleString('it-IT', { maximumFractionDigits: 0 }); }

function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function oggiISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataIt(iso, conOra){
  if(!iso) return '';
  var d = new Date(iso); if(isNaN(d)) return String(iso);
  var s = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();

  if(!iso) return '';

  if(diff < 60) return 'adesso';
  if(diff < 3600) return Math.floor(diff / 60) + ' min fa';
  if(d.toDateString() === ora.toDateString()) return 'oggi ' + hm;
  var ieri = new Date(ora); ieri.setDate(ora.getDate() - 1);
  if(d.toDateString() === ieri.toDateString()) return 'ieri ' + hm;

function evidenzia(testo, q){
  var t = String(testo || ''); if(!q) return esc(t);

  var up = t.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  // l'indice si calcola sul testo senza accenti ma con la stessa lunghezza
  var segni = new Array(t.length).fill(false);
  parole.forEach(function(p){ var i = up.indexOf(p); while(i >= 0){ for(var k = i; k < i + p.length && k < t.length; k++) segni[k] = true; i = up.indexOf(p, i + p.length); } });
  var out = '', aperto = false;
  for(var i = 0; i < t.length; i++){
    if(segni[i] && !aperto){ out += '<mark>'; aperto = true; }
    if(!segni[i] && aperto){ out += '</mark>'; aperto = false; }
    out += esc(t[i]);
  }
  if(aperto) out += '</mark>';
  return out;
}

   Lancia SEMPRE un errore leggibile se il database rifiuta la richiesta. */
async function api(percorso, o){
  o = o || {};

  var tentativo = 0;
  while(true){
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, o.timeout || 25000) : null;
    var h = { apikey: SB_KEY, Authorization: 'Bearer ' + _authToken() };
    if(o.body !== undefined) h['Content-Type'] = 'application/json';
    if(o.prefer) h.Prefer = o.prefer;
    var r;
    try{
      r = await fetch(SB_URL + '/rest/v1/' + percorso, { method: o.method || 'GET', headers: h,
        body: o.body === undefined ? undefined : (typeof o.body === 'string' ? o.body : JSON.stringify(o.body)), signal: ctrl ? ctrl.signal : undefined });
    }catch(err){

    }

    if((r.status === 401 || (r.status === 403 && tentativo === 0)) && _authSess && tentativo === 0){
      var txt401 = ''; try{ txt401 = await r.clone().text(); }catch(e){}
      if(r.status === 401 || /jwt|PGRST30/i.test(txt401)){ tentativo++; await _authRefresh(); continue; }
    }
    var t = await r.text(), j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = t; }
    if(!r.ok){
      var msg = (j && (j.message || j.hint || j.details)) || ('Errore ' + r.status);

    }

    // parole: abbino le liste complete (così "FUZE TEA" = "FUZETEA"), poi tolgo categoria e parole che non contano
    var m = abbina(A.tok, B.tok, A.abbr, B.abbr);
    function conta(t){ return !inLista(RUMORE, t) && !inLista(CATEGORIA, t); }
    var soloA = m.soloA.filter(conta), soloB = m.soloB.filter(conta);
    var comuni = m.comuniLista.filter(conta), forti = comuni.filter(function(t){ return !inLista(VARIANTE, t); });
    if(!forti.length) return { livello: null, motivo: 'nessuna parola importante in comune' };
    var extraA = soloA.length + na.length + (A.eta != null && B.eta == null ? 1 : 0), extraB = soloB.length + nb.length + (B.eta != null && A.eta == null ? 1 : 0);
    if(extraA && extraB) return { livello: null, motivo: 'parole diverse: ' + soloA.concat(na).join(' ') + ' / ' + soloB.concat(nb).join(' ') };
    var extra = soloA.concat(soloB), nExtra = extraA + extraB;
    var pr = prezziSimili(o.prezziA, o.prezziB), formatoCerto = A.vol != null && B.vol != null;
    var prezzoUguale = pr.uguali > 0 && pr.diversi === 0, prezzoDiverso = pr.diversi > 0 && pr.uguali === 0;
    var variante = extra.some(function(t){ return inLista(VARIANTE, t); }), oggetto = extra.some(function(t){ return inLista(OGGETTO, t); });
    var debole = forti.length < 2 && forti[0].length < 5;   // es. solo "CAPO" in comune
    if(!nExtra){
      if(prezzoDiverso && !formatoCerto) return { livello: 'probabile', motivo: 'stesso nome ma prezzi molto diversi: forse formato diverso' };
      if(formatoCerto || prezzoUguale || (A.vol == null && B.vol == null)) return { livello: 'sicuro', motivo: 'stesso prodotto scritto in modo diverso' };
      return { livello: 'probabile', motivo: 'stesso nome, formato indicato solo da una parte' };
    }
    if(oggetto) return { livello: null, motivo: 'oggetto diverso: ' + extra.join(' ') };
    if(variante) return { livello: comuni.length >= 2 && !prezzoDiverso ? 'probabile' : null, motivo: 'una variante in più: ' + extra.join(' ') };
    if(prezzoUguale && extra.length <= 3 && !na.length && !nb.length && (!debole || (formatoCerto && nExtra === 1)))
      return { livello: 'sicuro', motivo: 'stesso prodotto (in più: ' + extra.join(' ') + '), stesso prezzo dallo stesso fornitore' };
    if(prezzoDiverso) return { livello: nExtra <= 1 && forti.length >= 2 ? 'probabile' : null, motivo: 'parole in più e prezzo diverso' };
    if(debole) return { livello: null, motivo: 'nome troppo corto per decidere' };
    if(nExtra <= 2 || (nExtra <= 3 && forti.length >= 2)) return { livello: 'probabile', motivo: 'in più: ' + extra.concat(na.length || nb.length ? ['numeri'] : []).concat(extraA + extraB > extra.length + na.length + nb.length ? ['invecchiamento'] : []).join(' ') };
    return { livello: null, motivo: 'troppe differenze' };
  }
  return { analizza: analizza, confronta: confronta, abbina: abbina, prezziSimili: prezziSimili };
})();

/* ── Codici a barre: un prodotto può averne più d'uno (pezzo, cartone, confezione nuova).
   Nel catalogo stanno nello stesso campo, separati da virgola: "8001234567890,8009876543210". ── */
function barcodeLista(p){ return String((p && p.barcode) || '').split(/[,;\s]+/).map(function(c){ return c.trim(); }).filter(Boolean); }
function barcodeHa(p, c){ c = String(c || '').trim(); return !!c && barcodeLista(p).indexOf(c) >= 0; }
function barcodeConAggiunto(p, c){ var l = barcodeLista(p); c = String(c || '').trim(); if(c && l.indexOf(c) < 0) l.push(c); return l.join(','); }
function barcodeSenza(p, c){ return barcodeLista(p).filter(function(x){ return x !== String(c).trim(); }).join(','); }
function prodottoDaBarcode(lista, c){ return (lista || []).find(function(p){ return barcodeHa(p, c); }) || null; }

/* ══════════════════════════════════════════════════════════════════
   CERALDI RICHIESTE 8 — riscritta da zero (05/10/2026)
   Il dipendente conta cosa c'è (giacenza), l'app calcola cosa ordinare
   dalla scorta minima impostata in Ordini e manda la richiesta.
   Principi della riscrittura:
   1. Una richiesta non si perde MAI: prima viene messa in una coda sul
      telefono, poi spedita; se manca la rete riparte da sola appena torna.
      (prima la lista si svuotava dopo 0,6 s anche se il salvataggio era
      fallito: senza rete la richiesta spariva)
   2. Il nome di chi invia è quello dell'account (prima era un campo
      modificabile: nello storico c'erano "Luigi", "Luigi Taiano",
      "Collaboratore" per la stessa persona)
   3. Il dipendente vede che fine fa la sua richiesta: in attesa → presa
      in carico → ordinata, e può annullarla finché nessuno l'ha presa
   4. I reparti si leggono dal campo "settore" del prodotto: prima i
      prodotti Bar con categorie fuori da una lista fissa (GIN, VODKA,
      COCKTAIL, ALTRO, DETERGENZA…) erano invisibili ai dipendenti
   ══════════════════════════════════════════════════════════════════ */

async function caricaCatalogo(){

async function caricaSezioni(){
  if(U.admin){ U.sezioni = null; return; }
  try{
    var r = await api('ceraldi_dipendenti?select=sezioni,email&attivo=eq.true&email=ilike.' + encodeURIComponent(U.email));

}
function settoriPresenti(){
  var visti = {}; CAT.forEach(function(p){ visti[settoreDi(p)] = 1; });
  var out = SETTORI_BASE.filter(function(s){ return visti[s]; });
  Object.keys(visti).forEach(function(s){ if(out.indexOf(s) < 0) out.push(s); });
  return out;
}
function settoriConsentiti(){
  var tutti = settoriPresenti();
  if(U.admin || !U.sezioni || !U.sezioni.length) return tutti;
  var ok = tutti.filter(function(s){ return U.sezioni.indexOf(s) >= 0; });
  return ok.length ? ok : tutti;
}
function prodottiVisibili(){ var ok = settoriConsentiti(); return CAT.filter(function(p){ return ok.indexOf(settoreDi(p)) >= 0; }); }

}
async function salvaScorciatoie(){

var salvaBozzaServer = debounce(async function(){
  if(U.lettura) return;
  var chiave = 'u:' + (U.email || U.uid);
  try{
    if(!Object.keys(LISTA).length && !(META.nota || '').trim()) await api('ceraldi_richieste_draft?dipendente=eq.' + encodeURIComponent(chiave), { method: 'DELETE' });
    else await api('ceraldi_richieste_draft', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: { dipendente: chiave, lista: { items: LISTA, meta: META }, updated_at: META.agg || new Date().toISOString() } });
  }catch(e){}
}, 1800);
function salvaLista(){ META.agg = new Date().toISOString(); lsSet(lk('lista'), LISTA); lsSet(lk('meta'), META); salvaBozzaServer(); }
async function caricaBozzaServer(){
  try{
    var r = await api('ceraldi_richieste_draft?select=lista,updated_at&dipendente=eq.' + encodeURIComponent('u:' + (U.email || U.uid)));
    var b = r && r[0];
    if(b && b.lista && b.lista.items && (Date.parse(b.updated_at) || 0) > (Date.parse(META.agg || 0) || 0) + 2000){
      LISTA = b.lista.items || {}; META = Object.assign({ nota: '', urgente: false }, b.lista.meta || {}); META.agg = b.updated_at;
      lsSet(lk('lista'), LISTA); lsSet(lk('meta'), META);
      renderSicuro();
      if(Object.keys(LISTA).length) toast('Ho ripreso la lista iniziata su un altro dispositivo');
    }
  }catch(e){}
}
function calcola(){
  var out = { items: [], giacenze: [], incompleti: [], scortaOk: [] };
  Object.keys(LISTA).forEach(function(k){
    var it = LISTA[k];
    if(it.custom){ out.items.push({ name: it.name, conf: it.conf || '', qty: it.qty || 1, custom: true, barcode: it.barcode || null, note: it.note || undefined }); return; }
    var p = CATMAP[it.id], sm = p && p.scorta_min != null ? p.scorta_min : null;
    if(it.giacenza == null){ out.incompleti.push(k); return; }
    out.giacenze.push({ id: it.id, g: it.giacenza });
    if(sm != null){
      var d = sm - it.giacenza;
      if(d > 0) out.items.push({ id: it.id, name: it.name, conf: it.conf || '', qty: d, custom: false, giacenza: it.giacenza, scortaMin: sm });
      else out.scortaOk.push(k);
    } else out.items.push({ id: it.id, name: it.name, conf: it.conf || '', qty: it.qty || 1, custom: false, giacenza: it.giacenza, needsScortaMin: true });
  });
  return out;
}
function aggiornaBarra(){

  if(!n) return;
  var c = calcola();
  document.getElementById('fbN').textContent = n;
  document.getElementById('fbSub').textContent = c.incompleti.length ? ('Mancano ' + c.incompleti.length + ' quantità da contare') : (c.items.length ? (c.items.length + ' da ordinare · rivedi e invia') : 'Scorte ok · salva le giacenze');
}

function prodottiDelSettore(){ var base = prodottiVisibili(); return VIEW.settore === 'Tutti' ? base : base.filter(function(p){ return settoreDi(p) === VIEW.settore; }); }

function pulisciRicerca(){ var q = document.getElementById('q'); q.value = ''; VIEW.q = ''; document.getElementById('swBox').classList.remove('has'); renderProdotti(); q.focus(); }
function renderScorciatoie(){

  el.innerHTML = '<div class="sec-title" style="margin-top:6px">Scorciatoie<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500;font-size:12px">un tocco e invii</span></div>' +
    '<div class="chips" style="margin-bottom:12px;padding:2px 2px 10px">' + SCORC.map(function(s, i){ return '<button class="sc-chip" onclick="apriScorciatoia(' + i + ')">⚡ ' + esc(s.nome) + '</button>'; }).join('') + '</div>';
}
function renderProdotti(){
  var el = document.getElementById('prodotti');
  if(!CAT.length){ el.innerHTML = '<div class="loading"><span class="spinner"></span>Carico il catalogo…</div>'; return; }
  var lista = prodottiDelSettore();
  if(VIEW.cat === '__lista') lista = lista.filter(function(p){ return LISTA['p' + p.id]; });
  else if(VIEW.cat !== 'Tutte') lista = lista.filter(function(p){ return catDi(p) === VIEW.cat; });
  if(VIEW.q) lista = lista.filter(function(p){ return cercaTutte(p.name + ' ' + (p.conf || '') + ' ' + catDi(p), VIEW.q); });
  var qn = norm(VIEW.q);
  lista.sort(function(a, b){
    if(qn){ var sa = norm(a.name).indexOf(qn) === 0, sb = norm(b.name).indexOf(qn) === 0; if(sa !== sb) return sa ? -1 : 1; }
    var fa = FREQ[a.id] || 0, fb = FREQ[b.id] || 0; if(fa !== fb) return fb - fa;
    return a.name.localeCompare(b.name, 'it');
  });
  var custom = Object.keys(LISTA).filter(function(k){ return LISTA[k].custom; });
  var h = '';
  if(VIEW.cat === '__lista' && custom.length){
    h += custom.map(function(k){ var it = LISTA[k]; return '<div class="pr on"><span class="pr-stripe"></span><div class="pr-main"><div class="pr-name">' + esc(it.name) + ' <span class="bdg p">non in elenco</span></div><div class="pr-meta">' + esc(it.conf || '') + (it.barcode ? ' · codice ' + esc(it.barcode) : '') + '</div><div class="pr-res"><span class="muted" style="font-size:12px">Ne servono</span>' + stepper(k, it.qty) + '</div></div><div class="pr-side"><button class="sheet-x" onclick="togli(\'' + k + '\')" aria-label="Togli">✕</button></div></div>'; }).join('');
  }
  if(!lista.length && !h){
    h = '<div class="empty"><div class="ei">🔎</div><b>Nessun prodotto trovato</b><p>' + (VIEW.q ? 'Non c\'è "' + esc(VIEW.q) + '" nel catalogo.' : 'Nessun prodotto in questa sezione.') + '</p>' +
      (VIEW.q ? '<button class="btn btn-s" style="margin-top:16px" onclick="nuovoPersonalizzato(VIEW.q)">+ Richiedi "' + esc(VIEW.q.toUpperCase()) + '" come prodotto non in elenco</button>' : '') + '</div>';
    el.innerHTML = h; return;
  }
  var mostrati = lista.slice(0, VIEW.limite);
  h += mostrati.map(rigaProdotto).join('');
  if(lista.length > mostrati.length) h += '<button class="btn btn-s" style="margin-top:6px" onclick="VIEW.limite+=80;renderProdotti()">Mostra altri ' + (lista.length - mostrati.length) + '</button>';
  if(VIEW.q && lista.length) h += '<button class="lnk-btn" style="display:block;margin:14px auto 0" onclick="nuovoPersonalizzato(VIEW.q)">Non è nessuno di questi? Richiedi un prodotto non in elenco</button>';
  el.innerHTML = h;
}
function rigaProdotto(p){
  var k = 'p' + p.id, it = LISTA[k], g = it && it.giacenza != null ? it.giacenza : '';
  var meta = [p.conf, catDi(p)].filter(Boolean).join(' · ') + (p.scorta_min != null ? ' · scorta minima ' + p.scorta_min : '');
  return '<div class="pr' + (it ? ' on' : '') + '" id="pr-' + p.id + '"><span class="pr-stripe"></span>' +
    '<div class="pr-main" onclick="fuocoG(' + p.id + ')"><div class="pr-name">' + evidenzia(p.name, VIEW.q) + ((FREQ[p.id] || 0) >= 3 ? ' <span class="bdg n" title="Lo richiedi spesso">★</span>' : '') + '</div>' +
    '<div class="pr-meta">' + esc(meta) + '</div><div class="pr-res" id="res-' + p.id + '">' + esitoHtml(p, it) + '</div></div>' +
    '<div class="pr-side"><label for="g-' + p.id + '">Ne hai</label><input class="num-in' + (g !== '' ? ' filled' : '') + '" id="g-' + p.id + '" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" value="' + g + '" placeholder="–" oninput="setG(' + p.id + ',this)" enterkeyhint="done"></div></div>';
}
function esitoHtml(p, it){
  if(!it) return '';
  if(it.giacenza == null) return '<span class="bdg o">Scrivi quanti ne hai</span>';
  var sm = p && p.scorta_min != null ? p.scorta_min : null;

/* ── Invio: coda sul telefono → database (non si perde nulla) ────── */
var _outboxInCorso = false;
async function invia(){
  if(U.lettura){ toast('Accesso in sola lettura'); return; }
  var c = calcola();
  if(c.incompleti.length){ toast('Scrivi quanti ne hai per tutti i prodotti'); renderLista(); return; }
  if(!c.items.length && !c.giacenze.length){ toast('La lista è vuota'); return; }
  var nota = (META.nota || '').trim();
  if(META.urgente) nota = '⚠️ URGENTE' + (nota ? ' — ' + nota : '');
  accoda({ items: c.items, nota: nota, urgente: !!META.urgente, giacenze: c.giacenze });
  LISTA = {}; META = { nota: '', urgente: false, agg: null }; salvaLista();
  chiudiSheet('shLista'); renderTutto();
  await svuotaOutbox(true);
}
function accoda(dati){
  OUTBOX.push(Object.assign({ cid: uid(), at: new Date().toISOString(), tent: 0, inserita: null }, dati));
  lsSet(lk('outbox'), OUTBOX); renderOutbox();
}
async function svuotaOutbox(mostra){
  if(_outboxInCorso || !OUTBOX.length){ renderOutbox(); return; }
  if(!_authSess){ renderOutbox(); return; }
  _outboxInCorso = true; renderOutbox();
  try{
    for(var i = 0; i < OUTBOX.length;){
      var e = OUTBOX[i];
      try{
        var esito = await spedisci(e);
        OUTBOX.splice(i, 1); lsSet(lk('outbox'), OUTBOX);
        dopoInvio(e, esito, mostra);
      }catch(err){
        e.tent = (e.tent || 0) + 1; e.errore = err.message; e.errRete = !!(err.rete || err.status >= 500 || err.status === 401);
        lsSet(lk('outbox'), OUTBOX);
        if(e.errRete) break; else i++;
      }
    }
  }finally{ _outboxInCorso = false; renderOutbox(); }
}
async function spedisci(e){
  var esito = { id: e.inserita, gia: false };
  if(e.items && e.items.length && !e.inserita){
    if(e.tent > 0){
      // Al tentativo precedente la risposta potrebbe essersi persa per strada:
      // controllo che la richiesta non sia già arrivata prima di rimandarla
      var da = new Date((Date.parse(e.at) || Date.now()) - 180000).toISOString();
      var gia = await api('ceraldi_richieste_storico?select=id,items&dipendente=eq.' + encodeURIComponent(U.nome) + '&created_at=gte.' + encodeURIComponent(da) + '&order=created_at.desc&limit=15');
      var j = JSON.stringify(e.items), f = (gia || []).find(function(r){ return JSON.stringify(r.items) === j; });
      if(f){ e.inserita = f.id; esito = { id: f.id, gia: true }; }
    }
    if(!e.inserita){
      var riga = { dipendente: U.nome, nota: e.nota || '', items: e.items, stato: 'pending' };
      var ins = null, extra = lsGet('rq_colonne_extra', true);
      if(extra){
        try{ ins = await api('ceraldi_richieste_storico', { method: 'POST', prefer: 'return=representation', body: Object.assign({}, riga, { utente: U.uid || null, email: U.email || null, urgente: !!e.urgente }) }); }
        catch(er){ if(erroreColonna(er)){ lsSet('rq_colonne_extra', false); extra = false; } else throw er; }
      }
      if(!extra) ins = await api('ceraldi_richieste_storico', { method: 'POST', prefer: 'return=representation', body: riga });
      e.inserita = ins && ins[0] ? ins[0].id : -1; esito = { id: e.inserita, gia: false };
      lsSet(lk('outbox'), OUTBOX);
    }
  }
  // Giacenze contate: campo per campo, mai riscrivendo l'intero prodotto
  var rimaste = [];
  for(var g = 0; g < (e.giacenze || []).length; g++){
    var x = e.giacenze[g];
    try{ await api('catalogo_ceraldi?id=eq.' + encodeURIComponent(x.id), { method: 'PATCH', prefer: 'return=minimal', body: { giacenza: x.g } }); if(CATMAP[x.id]) CATMAP[x.id].giacenza = x.g; }
    catch(er){ if(er.rete || er.status >= 500) rimaste.push(x); }
  }
  e.giacenze = rimaste;
  if(rimaste.length){ lsSet(lk('outbox'), OUTBOX); var err = new Error('Giacenze non ancora salvate'); err.rete = true; throw err; }
  lsSet('rq_catalogo', CAT);
  return esito;
}
function dopoInvio(e, esito, mostra){
  (e.items || []).forEach(function(i){ if(!i.custom && i.id != null) FREQ[i.id] = (FREQ[i.id] || 0) + 1; });
  lsSet(lk('freq'), FREQ);
  if(e.items && e.items.length){
    if(!esito.gia){
      var righe = e.items.slice(0, 18).map(function(i){ return '• ' + i.name + (i.conf ? ' (' + i.conf + ')' : '') + ' × ' + i.qty + (i.needsScortaMin ? ' ⚠️' : ''); });
      if(e.items.length > 18) righe.push('… e altri ' + (e.items.length - 18));
      inviaNotifica((e.urgente ? '🚨 URGENTE — ' : '🛒 ') + 'Richiesta da ' + U.nome, (e.nota ? '📝 ' + e.nota + '\n' : '') + righe.join('\n'),
        { tipo: 'nuova_richiesta', link: SITE + 'ceraldi_ordini.html#da-fare', a: 'admin', telegram: 'richieste', dati: { richiesta: esito.id } });
    }
    if(mostra) toast('Richiesta inviata ✓');
  } else if(mostra) toast('Giacenze salvate ✓ — niente da ordinare');
  if(VIEW.tab === 'storico' || mostra) caricaStorico(true);
}
function renderOutbox(){

    h += '<div class="banner r"><span>⚠️</span><div style="flex:1"><b>Richiesta non accettata dal server</b><br>' + esc(e.errore || '') + '</div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn-sm r" data-c="' + esc(e.cid) + '" onclick="riprovaBloccata(this.dataset.c)">Riprova</button><button class="btn-sm" data-c="' + esc(e.cid) + '" onclick="eliminaBloccata(this.dataset.c)">Elimina</button></div></div>';

async function salvaComeScorciatoia(){

/* Codice a barre letto e collegato a un prodotto:
   - il responsabile (admin) lo salva subito nel catalogo (si aggiunge agli altri codici del prodotto);
   - un dipendente lo PROPONE: il responsabile lo conferma in Ordini → Da fare. Fino ad allora vale solo per la sua richiesta. */
function collegaBarcode(p, codice){
  if(!p || !codice || barcodeHa(p, codice)) return;
  if(U.admin){
    var altro = prodottoDaBarcode(CAT, codice);
    var lavori = [api('catalogo_ceraldi?id=eq.' + p.id, { method: 'PATCH', prefer: 'return=minimal', body: { barcode: barcodeConAggiunto(p, codice) } })];
    if(altro && altro.id !== p.id) lavori.push(api('catalogo_ceraldi?id=eq.' + altro.id, { method: 'PATCH', prefer: 'return=minimal', body: { barcode: barcodeSenza(altro, codice) || null } }));
    Promise.all(lavori).then(function(){ p.barcode = barcodeConAggiunto(p, codice); if(altro && altro.id !== p.id) altro.barcode = barcodeSenza(altro, codice); lsSet('rq_catalogo', CAT); toast('🔗 Codice collegato a ' + p.name); })
      .catch(function(e){ toast('⚠️ Codice non collegato: ' + e.message); });
    return;
  }
  api('ceraldi_barcode_sconosciuti', { method: 'POST', prefer: 'return=minimal', body: { barcode: String(codice), nome_suggerito: p.name, dipendente: U.nome || '', stato: 'proposto:' + p.id } })
    .then(function(){ toast('📷 Codice proposto per ' + p.name + ': lo conferma il responsabile'); }).catch(function(){});
}
function segnalaCodiceNuovo(codice, nome){
  if(!codice || U.admin) return;
  api('ceraldi_barcode_sconosciuti', { method: 'POST', prefer: 'return=minimal', body: { barcode: String(codice), nome_suggerito: nome || '', dipendente: U.nome || '', stato: 'nuovo' } }).catch(function(){});
}

  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  SC.n = 0; SC.aperto = false; SC.ultimo = null;
  try{ SC.audio = SC.audio || new (window.AudioContext || window.webkitAudioContext)(); if(SC.audio.state === 'suspended') SC.audio.resume(); }catch(e){}
  var hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39]);
  SC.reader = new ZXing.BrowserMultiFormatReader(hints);
  SC.canvas = document.createElement('canvas');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
    .then(function(s){ SC.stream = s; var v = document.getElementById('scVideo'); v.srcObject = s; return v.play(); })
    .then(function(){ SC.timer = setInterval(scTick, 110); })
    .catch(function(){ var st = document.getElementById('scStato'); if(st) st.textContent = 'Fotocamera non disponibile: dai il permesso dalle impostazioni del telefono'; });
  adattaScanner();
}
function adattaScanner(){ var ov = document.getElementById('scanOv'), vv = window.visualViewport; if(ov && vv){ ov.style.height = vv.height + 'px'; ov.style.top = vv.offsetTop + 'px'; } }
if(window.visualViewport){ window.visualViewport.addEventListener('resize', adattaScanner); window.visualViewport.addEventListener('scroll', adattaScanner); }
function chiudiScanner(){
  if(SC.timer){ clearInterval(SC.timer); SC.timer = null; }
  if(SC.stream){ try{ SC.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} SC.stream = null; }
  SC.reader = null; var ov = document.getElementById('scanOv'); if(ov) ov.remove();
  if(!document.querySelector('.mo')) document.body.style.overflow = '';
  renderTutto();
}
function scBeep(){ try{ var c = SC.audio; if(!c) return; var o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 1600; g.gain.setValueAtTime(.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.35, c.currentTime + .01); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .14); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .15); }catch(e){} }
function scRuota(src, deg){ var c = document.createElement('canvas'); if(deg === 90 || deg === 270){ c.width = src.height; c.height = src.width; } else { c.width = src.width; c.height = src.height; } var x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(deg * Math.PI / 180); x.drawImage(src, -src.width / 2, -src.height / 2); return c; }
function scTick(){
  if(SC.aperto) return;
  var v = document.getElementById('scVideo'); if(!v || !v.videoWidth) return;
  var sc = Math.min(1, 720 / v.videoWidth), w = Math.round(v.videoWidth * sc), hh = Math.round(v.videoHeight * sc);
  SC.canvas.width = w; SC.canvas.height = hh; SC.canvas.getContext('2d').drawImage(v, 0, 0, w, hh);
  var angoli = [0, 180, 90, 270];
  for(var i = 0; i < angoli.length; i++){
    var c = angoli[i] === 0 ? SC.canvas : scRuota(SC.canvas, angoli[i]);
    try{ var res = SC.reader.decodeBitmap(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))); if(res){ scLetto(res.getText()); return; } }catch(e){}
  }
}
async function scLetto(codice){
  if(codice === SC.ultimo && Date.now() - SC.ultimoT < 2500) return;
  SC.ultimo = codice; SC.ultimoT = Date.now(); SC.aperto = true; scBeep();
  var p = prodottoDaBarcode(CAT, codice);
  if(!p){
    try{ var r = await api('catalogo_ceraldi?select=id,name,conf,cat,subcat,settore,giacenza,scorta_min,barcode&barcode=ilike.*' + encodeURIComponent(codice) + '*'); r = (r || []).filter(function(x){ return barcodeHa(x, codice); }); if(r && r[0]){ p = r[0]; if(!CATMAP[p.id]){ CAT.push(p); } else Object.assign(CATMAP[p.id], p); indicizza(); } }catch(e){}
  }
  if(p){ scPannelloCatalogo(p, null); return; }
  var st = document.getElementById('scStato'); if(st) st.textContent = 'Cerco il prodotto…';
  // un collega l'ha già collegato, in attesa di conferma: lo propongo (non lo do per certo)
  SC.proposta = null;
  try{ var pr = await api('ceraldi_barcode_sconosciuti?select=stato,nome_suggerito,dipendente&barcode=eq.' + encodeURIComponent(codice) + '&stato=like.proposto*&order=created_at.desc&limit=1'); var m = pr && pr[0] && /^proposto:(\d+)/.exec(pr[0].stato); if(m && CATMAP[m[1]]) SC.proposta = { p: CATMAP[m[1]], da: pr[0].dipendente }; }catch(e){}
  var nome = '';
  try{
    var rr = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(codice) + '.json?product_type=all');
    var d = await rr.json();
    if(d && d.status === 1 && d.product){ var n = (d.product.product_name || d.product.product_name_it || d.product.generic_name || '').trim(), m = (d.product.brands || '').split(',')[0].trim(); nome = (m && n && n.toLowerCase().indexOf(m.toLowerCase()) < 0) ? m + ' ' + n : (n || m); }
  }catch(e){}
  scPannelloNuovo(nome, codice);
}
function scPannelloCatalogo(p, codiceDaCollegare){
  SC.prod = p; SC.codice = codiceDaCollegare; SC.qty = (LISTA['p' + p.id] && LISTA['p' + p.id].qty) || 1;
  var pan = document.getElementById('scPanel'); if(!pan) return;
  var g = LISTA['p' + p.id] && LISTA['p' + p.id].giacenza != null ? LISTA['p' + p.id].giacenza : '';
  pan.innerHTML = '<div class="qa-lbl">Prodotto in catalogo ✓</div><div style="font-size:16px;font-weight:700;line-height:1.3">' + esc(p.name) + '</div><div style="font-size:12px;color:rgba(255,255,255,.55);margin-top:2px">' + esc(p.conf || '') + (p.scorta_min != null ? ' · scorta minima ' + p.scorta_min : ' · scorta minima non impostata') + '</div>' +
    '<div style="display:flex;gap:12px;align-items:flex-end;margin-top:12px"><div><div class="qa-lbl">Quanti ne hai</div><input class="num-in" id="scG" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="' + g + '" placeholder="–" onkeydown="if(event.key===\'Enter\')scConferma()"></div>' +
    (p.scorta_min == null ? '<div><div class="qa-lbl">Ne servono</div><span class="stp" style="background:rgba(255,255,255,.12)"><button type="button" onclick="scQ(-1)">−</button><b id="scQv" style="color:#fff">' + SC.qty + '</b><button type="button" onclick="scQ(1)">+</button></span></div>' : '') + '</div>' +
    '<button class="btn btn-g" style="margin-top:12px" onclick="scConferma()">✓ Aggiungi e continua</button><button class="btn" style="background:none;color:rgba(255,255,255,.6);font-size:14px;padding:10px" onclick="scSalta()">Salta questo codice</button>';
  pan.classList.remove('hidden');
  var st = document.getElementById('scStato'); if(st) st.textContent = '';
  setTimeout(function(){ var i = document.getElementById('scG'); if(i){ i.focus(); try{ i.select(); }catch(e){} } }, 120);
}
function scPannelloNuovo(nome, codice){
  SC.prod = null; SC.codice = codice; SC.tipo = 'Pezzo'; SC.qty = 1;
  var pan = document.getElementById('scPanel'); if(!pan) return;
  pan.innerHTML = '<div class="qa-lbl">Non è nel catalogo — codice ' + esc(codice) + '</div><input class="inp" id="scNome" autocapitalize="characters" value="' + esc((nome || '').toUpperCase()) + '" placeholder="Scrivi il nome del prodotto" oninput="scSuggerisci()"><div id="scSug"></div>' +
    '<div class="qa-lbl" style="margin-top:12px">Come si conta</div><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">' + TIPI.map(function(t){ return '<button class="qa-chip' + (t[0] === 'Pezzo' ? ' on' : '') + '" data-t="' + t[0] + '" onclick="scTipo(this)">' + t[2] + ' ' + t[0] + '</button>'; }).join('') + '</div>' +
    '<div style="display:flex;align-items:center;gap:12px;margin-top:12px"><div class="qa-lbl" style="margin:0">Ne servono</div><span class="stp" style="background:rgba(255,255,255,.12)"><button type="button" onclick="scQ(-1)">−</button><b id="scQv" style="color:#fff">1</b><button type="button" onclick="scQ(1)">+</button></span></div>' +
    '<button class="btn btn-g" style="margin-top:12px" onclick="scConferma()">✓ Aggiungi e continua</button><button class="btn" style="background:none;color:rgba(255,255,255,.6);font-size:14px;padding:10px" onclick="scSalta()">Salta questo codice</button>';
  pan.classList.remove('hidden');
  var st = document.getElementById('scStato'); if(st) st.textContent = '';
  setTimeout(function(){ var i = document.getElementById('scNome'); if(i && !i.value) i.focus(); scSuggerisci(); }, 120);
}
function scTipo(b){ document.querySelectorAll('#scPanel .qa-chip').forEach(function(x){ x.classList.toggle('on', x === b); }); SC.tipo = b.dataset.t; }
function scQ(d){ SC.qty = Math.max(1, Math.min(999, SC.qty + d)); var e = document.getElementById('scQv'); if(e) e.textContent = SC.qty; }
function scSuggerisci(){
  var v = (document.getElementById('scNome') || {}).value || '', box = document.getElementById('scSug'); if(!box) return;
  if(v.trim().length < 2 && !SC.proposta){ box.innerHTML = ''; return; }
  var vis = v.trim().length < 2 ? [] : prodottiVisibili(), uguali = vis.filter(function(p){ var r = DUP.confronta(v, p.name, {}); return r.livello === 'sicuro' || r.livello === 'probabile'; });
  var t = uguali.concat(vis.filter(function(p){ return uguali.indexOf(p) < 0 && cercaTutte(p.name, v); })).slice(0, 6);
  if(SC.proposta && t.indexOf(SC.proposta.p) < 0) t.unshift(SC.proposta.p);
  box.innerHTML = t.length ? '<div class="qa-lbl" style="margin-top:10px">È uno di questi? Tocca quello giusto</div><div class="qa-sug">' + t.map(function(p){ var pr = SC.proposta && SC.proposta.p === p; return '<button onclick="scScegli(' + p.id + ')">' + esc(p.name) + '<small>' + esc(p.conf || '') + (pr ? ' · già indicato da ' + esc(String(SC.proposta.da || 'un collega').split(' ')[0]) : uguali.indexOf(p) >= 0 ? ' · sembra lui' : '') + '</small></button>'; }).join('') + '</div>' : '';
}
function scScegli(id){ var p = CATMAP[id]; if(!p) return; collegaBarcode(p, SC.codice); scPannelloCatalogo(p, null); }
function scConferma(){
  if(SC.prod){
    var g = ((document.getElementById('scG') || {}).value || '').replace(/\D/g, '');
    if(g === ''){ toast('Scrivi quanti ne hai'); return; }
    var p = SC.prod, k = 'p' + p.id;
    LISTA[k] = { id: p.id, name: p.name, conf: p.conf || '', custom: false, giacenza: parseInt(g, 10), qty: SC.qty || 1 };
    toast(p.name + ' — ne hai ' + g + ' ✓', { durata: 1400 });
  } else {
    var nome = ((document.getElementById('scNome') || {}).value || '').trim().toUpperCase();
    if(!nome){ toast('Scrivi il nome del prodotto'); return; }
    LISTA['c' + uid()] = { name: nome, conf: tipoLabel(SC.tipo, SC.qty), qty: SC.qty, custom: true, barcode: SC.codice || null };
    segnalaCodiceNuovo(SC.codice, nome);
    toast(nome + ' × ' + SC.qty + ' ✓', { durata: 1400 });
  }
  salvaLista(); SC.n++; var n = document.getElementById('scN'); if(n) n.textContent = SC.n;
  scSalta();
}
function scSalta(){
  var pan = document.getElementById('scPanel'); if(pan){ pan.classList.add('hidden'); pan.innerHTML = ''; }
  try{ document.activeElement.blur(); }catch(e){}
  var st = document.getElementById('scStato'); if(st) st.textContent = 'Inquadra il prossimo codice';
  SC.aperto = false; SC.prod = null; SC.codice = null;
  setTimeout(adattaScanner, 350);
}

document.getElementById('appVer').textContent = 'v' + APP_VERSION;
_authAvvio();

</script>
